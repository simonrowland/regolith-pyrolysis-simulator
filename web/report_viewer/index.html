<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Regolith Refinery Run Report</title>
  <link rel="stylesheet" href="./report-viewer.css">
</head>
<body>
  <main id="report" class="report-shell">
    <div class="loading" role="status" aria-live="polite">
      <div class="eyebrow">DIRECT LEAP TECHNOLOGIES · RUN REPORT</div>
      <h1>Loading frozen run artifact…</h1>
      <p>Reading the run artifact from the API when <code>?run=</code> is present, otherwise the local sample file. Engine-free; artifact-only rendering.</p>
    </div>
  </main>
  <noscript><p class="fatal">This report viewer requires JavaScript to read the local run artifact.</p></noscript>
  <script src="./labels.js" defer></script>
  <script src="./report-viewer.js" defer></script>
</body>
</html>
