# Pinned residual baselines for the extract-store reproduction battery (t-512).
# Doctrine: the residual IS the result. Mismatches remain FINDINGs; a residual
# moving outside band_dex is RED. Existing bands are preserved verbatim.
# New expanded-harness pins use ±0.01 dex as a regression/noise band, not an
# accuracy tolerance. Never widen a band to hide a changed mechanism.
#
# 2026-08-08 si-comparability: pure-element / molten-metal / solid-film α
# rows are class-incomparable to the silicate-melt rail carrier and no longer
# pin residuals (typed-refusal:not_comparable_system_class:*). B1 class-tagged
# silicate/solid-solution rows remain and are pinned when comparable.
#
# 2026-08-09 condensed-form gate (t-589): residual pins require class-comparable
# AND form-matched liquid_melt (or a catalog form-correction, which is
# status-bearing non-authoritative and never pin-bearing). Excluded forms:
# crystalline / partially_molten / glass_amorphous / unresolved →
# typed-refusal:not_comparable_condensed_form:<state> or form_unresolved.
# Pin payoff: Fe/K numeric unchanged (grounding → Hashimoto/Sossi liquid);
# Mg 0.699→0.520; SiO 1.297→0.410; Na mass_spec withdrawn (Yu unresolved).
