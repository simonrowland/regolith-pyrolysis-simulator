# Pinned residual baselines for the extract-store single-species reproduction
# battery (t-512). Doctrine: the residual IS the result — mismatches stay
# FINDINGs; this file makes a residual that *moves* go RED.
#
# residual_dex = |log10(actual / expected)| when both values are positive.
# band_dex is a regression gate around the pinned residual (FP / minor path
# noise), NOT an accuracy pass band and NOT widened to absorb engine drift.
# Do not retune band_dex to make a changed residual "pass" — update the
# residual_dex pin only after a reviewed mechanism change, with a comment.
#
# Mechanism (why these numbers exist):
#   Fe α: engine grounded_alpha returns a flat ~0.02 while Fedkin/Hashimoto
#     literature α is ~0.23–0.25 → ~1.06–1.10 dex under-prediction (FINDING).
#   Mg α: engine ~0.2 vs literature 0.24–0.28 → ~0.08–0.15 dex (FINDING).
#   SiO α: engine grounded_alpha is alpha_s_extrapolated at 1973–2273 K;
#     residual still scored and FINDING-tagged with "extrapolated: true".
#
# Provenance: measured against the live extract store + grounded_alpha path
# at the t-512 fix landing (review-t512-km.md P1). Values record what IS.

