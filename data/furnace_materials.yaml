      validation_sidecar_anchor: cao_reducing_cell_kems.recession_screen
      # Density copied from the held-out sidecar recession_screen (still uncited).
      density_kg_m3: 3340.0
      density_citation_status: uncited
      density_provenance: >
        data/literature/refractory_vaporization_validation.yaml
        ::cao_reducing_cell_kems.recession_screen.density_kg_m3 (3340);
        uncited common-handbook projection (~3.34 g/cm3 crystalline CaO);
