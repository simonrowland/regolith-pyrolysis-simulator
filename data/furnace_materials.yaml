  pure_SiO2:
    id: pure_SiO2
    display_name: "Pure SiO2 (congruent-vaporization diagnostic)"
    max_service_T_C: 1200
    enabled: false
    not_selectable_reason: "pure-oxide diagnostic row for liner-life recession; not a furnace wall product"
    source_note: "Diagnostic identity for refractory_vapor_species.yaml materials.SiO2."
    liner_life_diagnostic:
      refractory_material: SiO2
      validation_sidecar_path: data/literature/refractory_vaporization_validation.yaml
      validation_sidecar_anchor: nist_janaf_named_nodes.log10_kf.SiO
      density_kg_m3: 2200.0
      density_citation_status: uncited
      density_provenance: >
