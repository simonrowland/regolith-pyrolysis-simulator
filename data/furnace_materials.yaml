furnace_materials:
  # Source: data/wall_materials.yaml:602-615, dense_alumina service_temp.continuous_C.
  dense_alumina_continuous:
    id: dense_alumina_continuous
    display_name: "Dense high-purity alumina, continuous service"
    max_service_T_C: 1700
    enabled: true
    source_note: "dense_alumina continuous_C is 1700 C; direct evidence for no-load continuous use."
    # Liner-life diagnostic only (instrument-before-gate). Refractory mapping
    # anchors to the held-out t-477 validation sidecar (static citation only —
    # runtime must never load that file). Density stays uncited handbook.
    liner_life_diagnostic:
      refractory_material: Al2O3
      validation_sidecar_path: data/literature/refractory_vaporization_validation.yaml
      validation_sidecar_anchor: alumina_vacuum_screen
      density_kg_m3: 3970.0
      density_citation_status: uncited
      density_provenance: >
        uncited common-handbook projection (~3.97 g/cm3 alpha-Al2O3);
        density is NOT in the held-out validation sidecar
        (data/literature/refractory_vaporization_validation.yaml::alumina_vacuum_screen
        anchors vapor-pressure physics, not density) — do not invent a primary.
        Congruent recession uses this density linearly.
      liner_thickness_mm: 100.0
      wear_budget_fraction: 0.1
      lowest_useful_temperature_C: 1200.0
      analytic_screen_threshold_fraction: 0.1
      bisection_tolerance_C: 0.1
      bisection_max_iterations: 80
      monotonicity_samples: 11

  # Source: data/wall_materials.yaml:602-615, dense_alumina service_temp.max_operating_C.
  dense_alumina_max:
    id: dense_alumina_max
    display_name: "Dense high-purity alumina, formulation-dependent max"
    max_service_T_C: 1843
    enabled: true
    source_note: "dense_alumina max_operating_C is 1843 C; wall source notes this limit is formulation dependent."
    liner_life_diagnostic:
      refractory_material: Al2O3
      validation_sidecar_path: data/literature/refractory_vaporization_validation.yaml
      validation_sidecar_anchor: alumina_vacuum_screen
      density_kg_m3: 3970.0
      density_citation_status: uncited
      density_provenance: >
        uncited common-handbook projection (~3.97 g/cm3 alpha-Al2O3);
        density is NOT in the held-out validation sidecar
        (data/literature/refractory_vaporization_validation.yaml::alumina_vacuum_screen
        anchors vapor-pressure physics, not density) — do not invent a primary.
        Congruent recession uses this density linearly.
      liner_thickness_mm: 100.0
      wear_budget_fraction: 0.1
      lowest_useful_temperature_C: 1200.0
      analytic_screen_threshold_fraction: 0.1
      bisection_tolerance_C: 0.1
      bisection_max_iterations: 80
      monotonicity_samples: 11

  # Source: data/wall_materials.yaml:1038-1050, bulk_zirconia_ysz service_temp.max_operating_C.
  zirconia_ysz:
    id: zirconia_ysz
    display_name: "Zirconia / YSZ"
    max_service_T_C: 2200
    enabled: true
    source_note: "bulk_zirconia_ysz continuous_C and max_operating_C are 2200 C; unstabilized ZrO2 phase-change behavior remains a caveat."
    # No pure-ZrO2 congruent model in refractory_vapor_species.yaml - leave
    # liner_life_diagnostic absent so the evaluator refuses rather than invents.

  # Source: data/wall_materials.yaml:1180-1193, plasma_sprayed_alumina service_temp.max_operating_C.
  plasma_sprayed_alumina:
    id: plasma_sprayed_alumina
    display_name: "Plasma-sprayed alumina"
    max_service_T_C: 1650
    enabled: true
    source_note: "plasma_sprayed_alumina continuous_C and max_operating_C are 1650 C for the cited high-purity alumina coating."
    liner_life_diagnostic:
      refractory_material: Al2O3
      validation_sidecar_path: data/literature/refractory_vaporization_validation.yaml
      validation_sidecar_anchor: alumina_vacuum_screen
      # Plasma-sprayed coatings are typically less dense than bulk sintered alumina;
      # keep the same uncited bulk projection until a coating density is cited.
      density_kg_m3: 3970.0
      density_citation_status: uncited
      density_provenance: >
        uncited bulk alpha-Al2O3 handbook projection (~3.97 g/cm3) applied as a
        provisional coating density; coating-specific density not cited and not
        present in data/literature/refractory_vaporization_validation.yaml
        ::alumina_vacuum_screen — do not invent. Congruent recession uses this
        density linearly.
      liner_thickness_mm: 5.0
      wear_budget_fraction: 0.5
      lowest_useful_temperature_C: 1200.0
      analytic_screen_threshold_fraction: 0.1
      bisection_tolerance_C: 0.1
      bisection_max_iterations: 80
      monotonicity_samples: 11

  # Source: data/wall_materials.yaml:454-468, fused_silica service_temp.max_operating_C;
  # W:S1 = AdValue Technology "Fused Quartz Technical Information"
  # (https://www.advaluetech.com/technical-clear-quartz-products), audited in wall-AUDIT.md.
  fused_silica:
    id: fused_silica
    display_name: "Fused silica / fused quartz"
    max_service_T_C: 1200
    enabled: true
    source_note: "AdValue W:S1 reports fused quartz normal continuous use at 1050 C, recommended max operating temperature at 1200 C, and non-continuous use at 1250 C; wall_materials.yaml stores 1200 C as fused_silica max_operating_C."
    liner_life_diagnostic:
      refractory_material: SiO2
      validation_sidecar_path: data/literature/refractory_vaporization_validation.yaml
      validation_sidecar_anchor: nist_janaf_named_nodes.log10_kf.SiO
      density_kg_m3: 2200.0
      density_citation_status: uncited
      density_provenance: >
        uncited common-handbook projection (~2.20 g/cm3 fused silica/quartz glass);
        density is NOT in the held-out validation sidecar
        (data/literature/refractory_vaporization_validation.yaml
        ::nist_janaf_named_nodes.log10_kf.SiO anchors SiO(g) thermochemistry,
        not density) — do not invent a primary. Congruent recession uses this
        density linearly.
      liner_thickness_mm: 100.0
      wear_budget_fraction: 0.1
      lowest_useful_temperature_C: 900.0
      analytic_screen_threshold_fraction: 0.1
      bisection_tolerance_C: 0.1
      bisection_max_iterations: 80
      monotonicity_samples: 11

  # Source: Warren et al. 2022, arXiv:2205.06855, LMS-1/MGS-1 regolith
  # simulants sintered at 1000/1100/1200 C; 1200 C samples were sturdy enough
  # for compression data while 1000/1100 C samples remained too brittle.
  sintered_regolith:
    id: sintered_regolith
    display_name: "Sintered regolith bootstrap furnace"
    max_service_T_C: 1200
    provisional_range_C: "1100-1200 literature-grounded bootstrap proxy"
    enabled: true
    grounding:
      tier: "proxy-sintering"
      source: "Warren et al. 2022 (arXiv:2205.06855)"
      caveat: "1200 C is grounded in sintering/fabrication and post-sinter compression samples; it is not a certified refractory hot-face or furnace service rating."
    source_note: "WARN-tier grounded proxy: Warren et al. 2022 (arXiv:2205.06855) tested molded lunar/martian regolith simulants at 1000/1100/1200 C and reports 1200 C samples were sturdy enough for compression data while lower-temperature samples were brittle; use 1200 C as conservative bootstrap service cap, not a certified refractory hot-face rating."
    # Multiphase bulk - no pure-oxide congruent model applies.

  # Provisional only; not grounded in data/wall_materials.yaml.
  graphite_inert:
    id: graphite_inert
    display_name: "Graphite, inert atmosphere only"
    max_service_T_C: null
    provisional_range_C: "about 2500 ungrounded; inert-atmosphere only"
    enabled: false
    not_selectable_reason: "graphite cap is ungrounded and atmosphere-limited; needs literature and atmosphere guard before selection"
    source_note: "Provisional owner prompt only; no precise cap is certified in wall_materials.yaml."

  # ---------------------------------------------------------------------------
  # Pure-oxide diagnostic rows for every pure_oxide execution_model material in
  # data/refractory_vapor_species.yaml (t-477). enabled:false - not selectable
  # furnace walls; they exist so liner_life_diagnostic can be exercised against
  # the congruent-vaporization materials the refractory module covers.
  # Each row carries a static validation-sidecar path/anchor (never loaded at
  # runtime). Density for CaO is taken from the sidecar recession_screen;
  # other densities remain uncited handbook projections.
  # ---------------------------------------------------------------------------
  pure_Al2O3:
    id: pure_Al2O3
    display_name: "Pure Al2O3 (congruent-vaporization diagnostic)"
    max_service_T_C: 1700
    enabled: false
    not_selectable_reason: "pure-oxide diagnostic row for liner-life recession; not a furnace wall product"
    source_note: "Diagnostic identity for refractory_vapor_species.yaml materials.Al2O3."
    liner_life_diagnostic:
      refractory_material: Al2O3
      validation_sidecar_path: data/literature/refractory_vaporization_validation.yaml
      validation_sidecar_anchor: alumina_vacuum_screen
      density_kg_m3: 3970.0
      density_citation_status: uncited
      density_provenance: >
        uncited common-handbook projection (~3.97 g/cm3 alpha-Al2O3);
        density is NOT in data/literature/refractory_vaporization_validation.yaml
        ::alumina_vacuum_screen (physics anchor only) — do not invent.
      liner_thickness_mm: 100.0
      wear_budget_fraction: 0.1
      lowest_useful_temperature_C: 1200.0
      analytic_screen_threshold_fraction: 0.1
      bisection_tolerance_C: 0.1
      bisection_max_iterations: 80
      monotonicity_samples: 11

  pure_CaO:
    id: pure_CaO
    display_name: "Pure CaO (congruent-vaporization diagnostic)"
    max_service_T_C: 1700
    enabled: false
