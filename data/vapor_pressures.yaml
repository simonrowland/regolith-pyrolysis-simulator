              - lunar_mare_high_ti
              - lunar_highland
              - lunar_pkt_kreep_average
              - lunar_spa_kreep_influenced
              - mars_basalt
              - mars_sulfate_rich
              n_samples: 217
              composition_basis: VapoRock-supported silicate oxides; unsupported Stage 0 foulants removed,
                remaining oxides renormalized to 100 wt%
              fit_objective: bounded minimax absolute log10 residual; |C| <= 1000 K
              status: inactive_provenance_only
              note: Does not drive runtime high-T Na rail; active path is Ellingham gas_standard_fugacity
