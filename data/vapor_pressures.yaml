            (active high-T rail) paired with fixed gamma_NaO0.5=1e-3 (Sossi 2019 magnitude) is NOT an
            intentional DeMaria fit and is NOT a coherent pure-system standard-plus-activity pair. The
            two coherent shadow candidates at the investigation 1429 K input bracket ~1.86 dex (L&H+gamma
            0.1459 Pa vs full-VapoRock 0.002032 Pa). Pending t-383 paired re-ground; DeMaria 12022/12065
            held-out validation only.

            '
