            B: 1873.728
            C: -416.372
            valid_range_K:
            - 924
            - 1118
          boiling_point_C: 883
          notes: 'INTERIM uncertified (Alternative B, 2026-07-20): active high-T rail is Chase/JANAF gas_standard_fugacity
            + fixed gamma_NaO0.5=1e-3 with declared compensating-errors bracket (L&H+gamma 0.1459 Pa vs
            full VapoRock 0.002032 Pa at 1429 K, ~1.86 dex). Stale YAML pseudo Antoine is inactive/provenance-only.
