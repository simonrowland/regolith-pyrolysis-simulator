# Physical class envelopes in log10(fO2/IW), NOT measured lot intervals.
# Sources constrain the class context; reasoning identifies rounded bounds
# and assumed transfers. No metal inventory or precipitation is inferred.
terrestrial_basalt:
  # Sossi2018 p10921 places terrestrial magmatic liquids near FMQ. Existing
  # Frost1991 Table1 FMQ at 1 bar is 8.735-25096.3/T; Sato1973 IW is
  # 6.824-27470/T+log10(1.01325). At 1673.15 K their difference is
  # +3.323985 dex, rounded to +3 for this broad class proxy. Both fits are
  # extrapolated here. Subtracting log10 pressures in bar gives a unitless
  # log ratio; identical buffers would give delta=0. This is not a lot assay.
  delta_iw: 3.0
  interval: [1.5, 5.5]
  buffer: solid_iron_wustite_sato1973
  source: kems-045-sossi-2018-pnas-cr
  locator: {published_page: 10921}
  reasoning: 'class range: physical reasoning, no corpus citation; approximate FMQ-2 to FMQ+2 magmatic envelope, rounded on the IW scale using the conversion above; Sossi supports the center, not the endpoints.'
