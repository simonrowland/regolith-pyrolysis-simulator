  buffer: solid_iron_wustite_sato1973
  source: kems-045-sossi-2018-pnas-cr
  locator: {published_page: 10921}
  reasoning: Assumed transfer of the terrestrial magmatic near-FMQ proxy above to anorthosite aggregate; no class-specific or batch valence assay.
