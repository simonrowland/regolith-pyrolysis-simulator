s_type_ordinary_chondrite:
  # At 1200 K, Sato Eq5 gives IW=6.824-27470/1200+log10(1.01325)
  # ~= -16.062 (bar). The quoted -17.1 and -17.3 log10(fO2/bar)
  # imply -1.04 and -1.24 dex relative to IW; -1 is a rounded class proxy.
  # Subtracting equal pressure-reference logarithms cancels the units;
  # an observation exactly at IW would give delta=0.
  delta_iw: -1.0
  interval: [-13.0, 11.0]
  buffer: solid_iron_wustite_sato1973
  source: schaefer-and-fegley-2007-icarus-outgassing-of-oc
  locator: {published_page: 472, section: '3.1'}
  reasoning: Quoted Brett-Sato ordinary-chondrite measurements at 1200 K imply about IW-1; broad envelope allows solid-to-liquid transfer.
