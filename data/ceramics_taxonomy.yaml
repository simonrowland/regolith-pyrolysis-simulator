version: '2026-07-27'
taxonomy_name: terminal_product_taxonomy
description: 'Fail-closed classifier for simulator terminal products. Oxide ceramics are the common case,
  but metallic, mixed, and unclassified concentrates are first-class.

  '
product_classes:
  oxide_ceramic:
    label: Oxide ceramic
  metallic:
    label: Metallic terminal product
  mixed:
    label: Mixed terminal product
  unclassified_concentrate:
    label: Unclassified concentrate
match_policy:
  policy_id: terminal_product_taxonomy.v1.fail_closed
  basis: oxide_wt_pct_normalized_volatiles_free
  input_bases:
  - oxide_wt_pct
  - oxide_mol
  classifier_basis: 'CIPW-like normative composition projection over curated oxide terminal-product leaves.
    This is not thermodynamic equilibrium authority.

    '
  ignored_oxide_residuals:
  - FeO
  - Fe2O3
  - MnO
  - Na2O
  - K2O
  - NiO
  - Cr2O3
  max_nonignored_unmodeled_oxide_wt_pct: 7.5
  min_modeled_basis_wt_pct: 50.0
  single_leaf:
    max_total_l1_residual_wt_pct: 5.0
    max_major_oxide_abs_residual_wt_pct: 3.0
    forbidden_nonleaf_major_oxide_wt_pct: 7.5
  mixture:
    max_phases: 4
    max_total_l1_residual_wt_pct: 7.5
    max_major_oxide_abs_residual_wt_pct: 4.0
    min_nontrace_phase_fraction_wt_pct: 10.0
    trace_phase_fraction_range_wt_pct:
    - 0.5
    - 10.0
  ambiguity:
    min_score_delta_wt_pct: 2.0
    fallback: unclassified_concentrate
  display:
    fallback_mode: composition_only
    user_label_term: terminal product
    internal_pool_term: rump
value_grade_policy:
  policy_id: terminal_product_taxonomy.grade.v1
  basis: oxide_wt_pct_normalized_volatiles_free
  buckets:
    rare_earth_oxides:
      label: Rare-earth oxides
      species:
      - REE_oxides
      coverage_note: 'Current ledger data carries rare-earth oxides as the lumped REE_oxides species when
        present; individual rare-earth elements are omitted unless the input composition carries explicit
        species.

        '
    titania:
      label: Titania
      species:
      - TiO2
      coverage_note: TiO2 grade is reported only when TiO2 is present in the input residue composition.
    chromia:
      label: Chromia
      species:
      - Cr2O3
      coverage_note: Cr2O3 grade is reported only when Cr2O3 is present in the input residue composition.
    zirconia:
      label: Zirconia
      species:
      - ZrO2
      coverage_note: ZrO2 grade is reported only when ZrO2 is present in the input residue composition.
    metallic_pgm:
      label: Metallic / PGM
      species: []
      status: future_out_of_domain_today
      coverage_note: 'Current terminal-product classifier receives oxide residue composition, not a metal/PGM
        product ledger; metallic and PGM grades are future scope and omitted rather than zero-filled.

        '
provenance_required:
- taxonomy_version
- run_id
- feedstock_id
- terminal_product_account_or_artifact
- basis
- furnace_ceiling_c
- temperature_profile_id
- classifier_policy_id
- ignored_oxides
- residual_wt_pct
ceramic_hierarchy:
  schema_version: 2
  policy_id: terminal_ceramic_hierarchy.v1.most_specific_else_parent
  source_ids:
  - ceramic_deepened_table
  - ceramic_audit
  - ceramic_references
  - ceramic_taxonomy
  - ceramic_datasheets
  ignored_identity_oxides:
  - FeO
  - Fe2O3
  analytical_tolerance_wt_pct: 0.5
  entries:
    calcium_aluminate_refractory:
      canonical_node_id: null
      parent: null
      level: parent
      label: Calcium-aluminate refractory / CAC family
      composition:
        kind: window
        defining_oxides:
        - CaO
        - Al2O3
        allow_other_oxides: true
        note: CaO-Al2O3 family; SiO2+MgO must remain below 15 wt%.
        wt_pct_window:
          CaO:
          - 5
          - 65
          Al2O3:
          - 35
          - 95
        constraints:
          sum_max:
          - oxides:
            - SiO2
            - MgO
            value: 15
        citations: []
      service_temp:
        value_C: null
        kind: uncharacterized
        citations: []
        note: No single sourced service temperature.
      liner_suitability:
        verdict: limited-scope
        citations: []
        note: Taxonomy family classification.
      strength:
        status: sourced_qualitative_text
        text: 'Brittle oxide ceramics; strength is product-body dependent (castable vs dense aggregate).
          Parent: **uncharacterized single-number set**.'
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: Calcium aluminate cement (CAC) binders and refractory castables; specialty
          mortars for high-temperature and chemically aggressive service; not a single pure-phase product
          at parent level.
        density_g_cm3: 'Family span ~2.9–3.8 (phase-dependent: CA ~2.94; CA6 theoretical ~3.79). Bulk
          castables much lower (porous).'
        colour: Pure phases white–off-white; Fe/Ti impurities → grey, beige, or pinkish; fired CAC products
          often grey–buff.
        melting_point_C: 'Phase-dependent (see subtypes): CA incongruent ~1390 °C; CA2 ~1750–1765 °C class;
          CA6 ~1830–1875 °C; C3A decomposes ~1540 °C class. Parent has no single T.'
        softening_working_temp_C: 'CAC castable systems **formulation-dependent** ~700–1900 °C product
          range (tax: CAC literature). Parent alone: **uncharacterized**.'
        creep_limit_C: '**Uncharacterized at parent** — gated by binder/aggregate system and porosity;
          do not use family melting points as RUL.'
        water_stability: '**Hydraulic phases hydrate** (CA, C3A, C12A7): designed to set with water as
          cements. High-alumina refractories (CA6-rich) are comparatively water-stable once fired. Free
          lime if present slakes.'
        materials_compatibility: Good resistance to many weak acids and sulfates vs Portland in CAC use;
          basic slag service depends on Al₂O₃ grade. Attacked by strong alkali in some systems; CA6 subtype
          preferred for alkali. Reducing atmospheres generally acceptable for aluminates.
        appearance_texture: 'Fired bodies: matte to slightly vitreous ceramic; castables granular/porous;
          dense aggregates dull white–grey.'
        everyday_analog: High-temperature refractory cement / furnace castable lining (not ordinary Portland
          concrete).
    monocalcium_aluminate_CA:
      canonical_node_id: calcium_aluminate_ca
      label: Monocalcium aluminate, CA, CaO.Al2O3
      composition:
        kind: point-anchor
        defining_oxides:
        - CaO
        - Al2O3
        wt_pct:
          CaO: 35.0
          Al2O3: 65.0
        allow_other_oxides: false
        note: ''
        citations:
        - C:S3
        - C:S8
      service_temp:
        value_C: null
        kind: uncharacterized
        citations:
        - C:S3
        - C:S8
        scoped_values_C:
          CAC_castable_systems:
          - 700
          - 1900
        note: 'Standalone CA terminal-ceramic service is uncharacterized. CAC-bonded castable limits are
          formulation ratings, not pure CA service.

          '
      liner_suitability:
        verdict: limited-scope
        citations:
        - C:S3
        - C:S8
        note: 'Binder/castable-system phase only. Do not classify as a standalone terminal liner ceramic.

          '
      parent: calcium_aluminate_refractory
      level: subtype
      strength:
        status: sourced_qualitative_text
        text: Hardness **uncharacterized single pure-crystal value** commonly published; CAC pastes gain
          early compressive strength (hydraulic, not refractory ceramic numbers). Brittle ceramic when
          densified.
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: Principal hydraulic phase in calcium aluminate cements; rapid-hardening
          specialty cements; refractory castable binders. **Not** a standalone hot-face liner phase.
        density_g_cm3: ~2.94–2.98 theoretical (2945 kg·m⁻³). [web:12][web:8]
        colour: Colourless–white pure phase; commercial CAC clinker grey from Fe/impurities.
        melting_point_C: '**Incongruent** melt ~**1390 °C** (peritectic-style decomposition to liquid
          + CA2/corundum path — Wikipedia MCA). [web:12] Alternate literature quotes ~1600 °C for related
          CA systems — prefer incongruent **1390 °C** for pure CA. [web:12][web:9]'
        softening_working_temp_C: 'Standalone liner: **uncharacterized**. As CAC binder in formulated
          castables: service often **~1480–1650 °C** class depending on aggregate (tax).'
        creep_limit_C: '**Uncharacterized as pure CA body.** Castable RUL is aggregate+matrix limited,
          not pure-CA melting.'
        water_stability: '**Hydrates and sets** (designed hydraulic behaviour): rapid reaction with water
          → CAH₁₀ metastable hydrate and/or C₂AH₈ + C₃AH₆ + Al(OH)₃ gel. [web:12] Wet storage of unfired
          powder fails by hydration. Fired dense ceramic is more stable but residual free Ca-aluminates
          can still hydrate if porous.'
        materials_compatibility: 'Good chemical resistance in many CAC applications (sewage, sulfate soils).
          High-T: intermediate between lime-rich and alumina-rich aluminates. Attacked if free lime present;
          basic slag service limited vs magnesia.'
        appearance_texture: 'Clinker: grey granular; pure synthetic: white powder/ceramic, dull–matte.'
        everyday_analog: Rapid-set specialty cement (Fondu/CAC) — not Portland grey cement exactly, but
          the same “hydraulic cement powder” feel.
    calcium_dialuminate_CA2:
      canonical_node_id: calcium_aluminate_ca2_grossite
      label: Calcium dialuminate, CA2, CaO.2Al2O3
      composition:
        kind: point-anchor
        defining_oxides:
        - CaO
        - Al2O3
        wt_pct:
          CaO: 22.0
          Al2O3: 78.0
        allow_other_oxides: false
        note: ''
        citations:
        - C:S3
        - C:S8
      service_temp:
        value_C: null
        kind: uncharacterized
        citations:
        - C:S3
        - C:S8
        scoped_values_C:
          CAC_castable_systems:
          - 700
          - 1900
        note: 'Standalone CA2 terminal-ceramic service is uncharacterized. CAC/castable values are product-system
          evidence only.

          '
      liner_suitability:
        verdict: limited-scope
        citations:
        - C:S3
        - C:S8
        note: 'Binder/high-alumina CAC phase. Do not classify a rump as furnace-liner CA2 unless a CA2
          body/product window is added.

          '
      parent: calcium_aluminate_refractory
      level: subtype
      strength:
        status: sourced_qualitative_text
        text: '**Uncharacterized** robust pure-phase mechanical dataset in open product literature; brittle
          oxide.'
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: High-alumina CAC phase; intermediate in CaO–Al₂O₃ phase diagram; refractory
          CAC formulations; rare terrestrial/meteoritic mineral (grossite). Not standalone commercial
          liner.
        density_g_cm3: ~**2.88** g/cm³ (grossite calculated/measured class). [web:64][web:69]
        colour: Colourless–white pure; V impurities can give light violet (specialty). [web:66] Fe → grey/buff.
        melting_point_C: ~**1750–1765 °C** class (literature with CA pair). [web:9] Congruency details
          phase-diagram dependent; treat as high-T aluminate solid before CA6 field.
        softening_working_temp_C: 'Standalone: **uncharacterized**. High-alumina CAC product service uses
          aggregate, not pure CA2.'
        creep_limit_C: '**Uncharacterized** pure phase.'
        water_stability: Hydraulically **much less reactive** than CA at ambient T; elevated-T hydration
          possible in CAC systems. [web:11] Not free-lime slaking. Generally more water-tolerant than
          C₃S/CaO once fired, but unfired powder can still hydrate slowly.
        materials_compatibility: High-alumina character (leans acid/high-Al refractory family); better
          alkali/slag options than lime-rich aluminates but inferior to CA6 for many alkali environments.
        appearance_texture: White–grey crystalline ceramic; matte to weakly vitreous.
        everyday_analog: 'High-alumina refractory grain / white cement clinker phase — closest everyday:
          pale high-alumina furnace cement aggregate.'
    calcium_hexaluminate_CA6:
      canonical_node_id: hibonite_ca6
      label: Calcium hexaluminate / hibonite, CA6, CaO.6Al2O3
      composition:
        kind: point-anchor
        defining_oxides:
        - CaO
        - Al2O3
        wt_pct:
          CaO: 8.0
          Al2O3: 92.0
        allow_other_oxides: false
        note: ''
        citations:
        - C:S4
        - C:S5
        - C:S8
      service_temp:
        value_C: 1500
        kind: service
        citations:
        - C:S4
        - C:S5
        melting_note_C: 1830
        note: 'Porous CA6 is described as long-term stable up to 1500 degC for thermal-insulating/refractory
          applications.

          '
      liner_suitability:
        verdict: strong-candidate
        citations:
        - C:S4
        - C:S5
        note: 'Strong terminal refractory/insulating-liner candidate with sourced alkaline resistance,
          reducing-atmosphere stability, and low wettability by molten metals/slags.

          '
      parent: calcium_aluminate_refractory
      level: subtype
      strength:
        status: sourced_qualitative_text
        text: Intrinsically difficult to densify (plate-like grains) → porous bodies lower strength; dense
          CA6 aggregate used for hot strength. Hardness **uncharacterized** as a single standard Mohs
          in product sheets consulted; brittle refractory ceramic.
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: High-alumina **hot-face / insulating refractory** (porous CA6); cement-kiln
          linings; alkali- and reducing-atmosphere service; synthetic dense aggregate (e.g. Bonite-class
          CA6). [web:0][web:3][web:5]
        density_g_cm3: 'Theoretical ~**3.79** g/cm³; mineral hibonite measured ~3.83–3.85. [web:2][web:71]
          Porous insulating products: bulk density much lower (product-specific).'
        colour: 'Pure: white–colourless; hibonite mineral often brown/black from Fe/Ti/REE; V can purple.
          Fe/Cr/Ti impurities tint grey–brown–pink.'
        melting_point_C: ~**1830–1875 °C** (product literature 1830 °C; formation papers 1875 °C). [web:3][web:2]
          Incongruent melting of CaAl₁₂O₁₉ reported near ~**1852 °C** in experimental work. [web:70]
        softening_working_temp_C: '**Long-term service ~1500 °C** (porous CA6 insulating); melting far
          higher. [tax: CA6 service 1500 °C]'
        creep_limit_C: Structural use gated well below melting; porous CA6 insulation ~**1500 °C** continuous
          class is the practical furnace ceiling cited for product grades. Dense CA6 aggregate can run
          higher in formulated bricks — **product-row only**; no single RUL universal.
        water_stability: '**Water-stable** as fired ceramic (non-hydraulic hexaluminate). Unlike free
          CaO/C₃S, does not slake. Residual unreacted CaO in imperfect synthesis can hydrate — purity
          gate.'
        materials_compatibility: '**Strong alkali resistance** and good behaviour in reducing atmospheres
          relative to many aluminosilicates; resists CO attack in dense forms. [web:5][web:0] High-alumina
          / near-neutral-to-acid family; attacked by strongly basic FeO-rich slags less favorably than
          magnesia; CMAS infiltration still a risk at very high T.'
        appearance_texture: 'Porous grades: chalky–matte white insulating brick feel; dense aggregate:
          hard dull-white ceramic grain.'
        everyday_analog: Lightweight insulating firebrick / kiln hot-face block — pale, matte, refractory.
    tricalcium_aluminate_C3A:
      canonical_node_id: tricalcium_aluminate_c3a
      parent: calcium_aluminate_refractory
      level: subtype
      label: Tricalcium aluminate, C3A, Ca3Al2O6
      composition:
        kind: point-anchor
        defining_oxides:
        - CaO
        - Al2O3
        wt_pct:
          CaO: 62.3
          Al2O3: 37.7
        allow_other_oxides: false
        note: ''
        citations: []
      service_temp:
        value_C: null
        kind: uncharacterized
        citations: []
        note: No single sourced service temperature.
      liner_suitability:
        verdict: not-recommended
        citations: []
        note: Taxonomy family classification.
      strength:
        status: sourced_qualitative_text
        text: '**Uncharacterized** as engineering ceramic; brittle.'
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: Portland cement **clinker interstitial** phase; controls early set with
          gypsum; **not** a refractory liner product.
        density_g_cm3: ~**3.04** g/cm³ class (cement mineral data; confirm product row if coding).
        colour: Pure colourless–white; clinker grey from Fe/ferrite association.
        melting_point_C: Decomposes / incongruent path ~**1540–1542 °C** class (tax note ~1542 °C). Not
          a congruent liner solid.
        softening_working_temp_C: '**Not applicable as liner** — cement phase.'
        creep_limit_C: '**not-recommended** as structural hot-face; no RUL product class as pure C3A.'
        water_stability: '**Hydrates vigorously** (flash set without gypsum); forms calcium aluminate
          hydrates. **Hydrates-and-fails** as a dry ceramic residue if water contacts free C3A.'
        materials_compatibility: 'Cement chemistry: sulfate attack pathway (ettringite) is a durability
          issue in concrete, not a refractory virtue. Unsuitable vs molten slag as a pure phase.'
        appearance_texture: 'Clinker: dark grey nodular; pure: white powder.'
        everyday_analog: Portland cement clinker nodule (the fast-setting interstitial chemistry).
    mayenite_C12A7:
      canonical_node_id: mayenite_c12a7
      parent: calcium_aluminate_refractory
      level: subtype
      label: Mayenite, C12A7
      composition:
        kind: point-anchor
        defining_oxides:
        - CaO
        - Al2O3
        wt_pct:
          CaO: 48.5
          Al2O3: 51.5
        allow_other_oxides: false
        note: ''
        citations: []
      service_temp:
        value_C: null
        kind: uncharacterized
        citations: []
        note: No single sourced service temperature.
      liner_suitability:
        verdict: marker-only
        citations: []
        note: Taxonomy family classification.
      strength:
        status: sourced_qualitative_text
        text: '**Uncharacterized** engineering ceramic numbers.'
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: Cement/clinker cage phase; specialty electride/oxide research material;
          **not** terminal liner.
        density_g_cm3: '~**2.68–2.85** class (literature scatter; **prefer blank if coding strict** —
          mineral mayenite ~2.85). Mark: **approximate / source-dependent**.'
        colour: Colourless–white pure; may tint with transition metals.
        melting_point_C: ~**1400–1450 °C** class in CaO–Al₂O₃ diagrams (phase-diagram context); treat
          as **uncharacterized product T** without a cited pure-phase RUL.
        softening_working_temp_C: '**Uncharacterized** as liner.'
        creep_limit_C: '**Uncharacterized / not-recommended** liner.'
        water_stability: '**Hydrates** (cement-related calcium aluminate); water contact degrades free
          phase.'
        materials_compatibility: Cement curiosity; not slag-resistant refractory design phase.
        appearance_texture: White crystalline / chalky powder when pure.
        everyday_analog: 'Specialty cement phase powder — closest: white calcium-aluminate cement flour.'
    aluminosilicate_ceramic:
      canonical_node_id: null
      parent: null
      level: parent
      label: Aluminosilicate ceramic (acid / high-alumina family)
      composition:
        kind: window
        defining_oxides:
        - Al2O3
        - SiO2
        allow_other_oxides: true
        note: Al2O3+SiO2 must comprise at least 70 wt% of nonvolatile oxides.
        wt_pct_window:
          Al2O3:
          - 25
          - 95
          SiO2:
          - 5
          - 75
        constraints:
          sum_min:
          - oxides:
            - Al2O3
            - SiO2
            value: 70
        citations: []
      service_temp:
        value_C: null
        kind: uncharacterized
        citations: []
        note: No single sourced service temperature.
      liner_suitability:
        verdict: candidate
        citations: []
        note: Taxonomy family classification.
      strength:
        status: sourced_qualitative_text
        text: Brittle ceramics; flexural strengths product-dependent (see mullite).
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: Fireclay and high-alumina bricks, kiln furniture, crucibles, furnace
          linings (acid/high-Al service), porcelain/stoneware bodies at lower Al end.
        density_g_cm3: Family ~2.5–3.2+ (fireclay lower bulk; mullite ~3.0–3.2 theoretical).
        colour: White–buff–grey pure; Fe → cream, tan, brown; Ti → cream/blue-grey under redox.
        melting_point_C: 'Wide: fireclay eutectics lower; mullite ~1830–1850 °C; pure alumina end higher.
          **No single parent T.**'
        softening_working_temp_C: Fireclay lower (often <1400 °C class products); high-alumina/mullite
          higher — **subtype-gated**.
        creep_limit_C: Product RUL/PCE gated; parent **uncharacterized single number**.
        water_stability: '**Water-stable** fired aluminosilicates (no free-lime hydration). Green clay
          bodies soften with water; fired ceramics do not.'
        materials_compatibility: '**Acid / high-alumina family** (ASTM language): resists acidic slags
          better than basic; **attacked by basic FeO–CaO-rich slag**. Alkali vapour can form low-melting
          alkali-aluminosilicates (glazing/corrosion). CMAS attack at turbine/hot-section analogs.'
        appearance_texture: Matte to semi-vitreous ceramic; porcelain-like when dense and fine-grained.
        everyday_analog: Fired brick / bathroom-tile ceramic / kiln shelf — dense, hard, earthy-to-porcelain.
    mullite:
      canonical_node_id: mullite
      label: Mullite, aluminosilicate solid solution
      composition:
        kind: window
        defining_oxides:
