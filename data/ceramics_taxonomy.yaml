            CAS Mul liquidus field
          temperature_C: 1600
          phase_field: mullite solid-solution classifier window inside the CaO-Al2O3-SiO2 Mul field
          digitized_by: codex-R2-2026-06-09; text-bounded window, no polygon expansion
          tolerance_wt_pct: 0.5
        citations:
        - C:S2
      service_temp:
        value_C: 1600
        kind: service
        citations:
        - C:S2
        qualified_values_C:
          vacuum_limit: 1600
          typical_air_max: 1725
          air_limit: 1800
        note: 'Use 1600 degC as conservative default where atmosphere/load is unknown. Air-service product
          rows can be higher.

          '
      liner_suitability:
        verdict: strong-candidate
        citations:
        - C:S2
        note: 'Strong liner/kiln-furniture candidate with cited hot-blast, reheat, steel-ladle, glass,
          and kiln-furniture uses.

          '
      parent: aluminosilicate_ceramic
      level: subtype
      strength:
        status: sourced_qualitative_text
        text: Flexural/MOR ~**160–190 MPa** dense; compressive ~550–1320 MPa; fracture toughness ~**2–4
          MPa·m⁰·⁵**; Knoop ~1450 class; brittle. [web:0][web:5]
        source_ids:
        - ceramic_datasheets
      datasheet:
        terrestrial_applications: Kiln furniture, high-alumina refractories, glass-furnace regenerators,
          advanced structural ceramics, spark-plug bodies historically, aerospace thermal protection composites.
        density_g_cm3: Theoretical ~**3.16–3.22**; dense ceramics often ~**3.0–3.2** g/cm³. [web:0][web:5]
        colour: Off-white to cream pure; Fe → grey/buff; natural mullite rare (Isle of Mull history).
        melting_point_C: ~**1830–1850+ °C** (incongruent/ss complexity on Al₂O₃–SiO₂ join; industrial
          cite ~1850 °C). [web:1]
        softening_working_temp_C: '**Continuous service ~1600 °C** default product; air product rows sometimes
          ~1725–1800 °C. [tax]'
        creep_limit_C: Excellent **creep resistance** among oxides — structural use commonly limited ~**1600
          °C** under load for mullite refractories; above that pyroplastic risk rises despite higher melting.
          [web:5][web:0]
        water_stability: '**Water-stable** (fired). No hydraulic phases.'
        materials_compatibility: 'High-alumina acid/neutral character: good vs acidic slags and many metals
          in oxidizing atmospheres; **basic slag attack**; alkali vapour corrosion risk; good thermal-shock
          vs dense alumina in many grades.'
        appearance_texture: 'Dense: porcelain-like, matte to slightly glassy fracture; porous: chalky
          refractory.'
        everyday_analog: High-quality porcelain / dense kiln shelf — harder, whiter “super-ceramic.”
