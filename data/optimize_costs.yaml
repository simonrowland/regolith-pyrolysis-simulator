schema_version: optimize-costs-v1

# Future distiller for shuttle replacement rates:
# run a representative C3/C6 recipe, record additive input kg minus
# unspent_*_reagent and consumed_*_reagent ledger outputs by species, divide
# observed inventory-loss replacement spend by kg lost, then update the static
# Na/K/Mg/Ca values below. Do not substitute spot-market metal prices; the
# shuttle regenerates inventory and the marginal cost is replacement loss.
parameters:
  electricity_cost_per_kWh:
    value: 0.15
    units: USD/kWh
    rationale: "Bootstrap microgrid planning rate; rounded above recent EIA industrial retail electricity to cover off-Earth generation/storage margin."
    source_tag: "U.S. EIA, Electric Power Monthly, Table 5.6.A, Average Price of Electricity to Ultimate Customers by End-Use Sector, accessed 2026-07-12, https://www.eia.gov/electricity/monthly/epm_table_grapher.php?t=epmt_5_06_a; owner bootstrap margin"

  import_delivery_cost_per_kg:
    value: 10000.0
    units: USD/kg
    rationale: "Owner-ratified import delivery cost, before Earth purchase price."
    source_tag: "owner ratified 2026-11-11 (d-389): imports at $10k/kg plus Earth cost"

  condenser_stage_wall_thickness_m:
    value: 0.01
    units: m
    rationale: "Shared provisional collector wall/baffle thickness for the d-283 area-mass estimate."
    source_tag: "FLAGGED provisional d-283 (d-452): 10 mm pending hardware definition"

  condenser_stage_bulk_density_kg_m3:
    units: kg/m3
    rationale: "Handbook-level bulk density assumptions for the named collector materials; all are provisional."
    source_tag: "FLAGGED provisional d-283 (d-452): handbook values uncited pending material/vendor definition"
    values:
      fe_stage1:
        value: 4500.0
        material: "MZO coating used as proxy; structural material unspecified"
        source_tag: "FLAGGED provisional d-283: handbook-level MgO-ZrO2 proxy"
      cr_stage2:
        value: 4500.0
        material: "MZO liner for removable chromia cartridge"
        source_tag: "FLAGGED provisional d-283: handbook-level MgO-ZrO2 proxy"
      sio_stage3:
        value: 2200.0
        material: "fused silica baffles"
        source_tag: "FLAGGED provisional d-283: handbook-level fused silica density"
      alkali_stage4:
        value: 3210.0
        material: "SiC proxy; stage material unspecified in setpoints"
        source_tag: "FLAGGED provisional d-283: handbook-level SiC density"
      k_stage4b:
        value: 3210.0
        material: "SiC proxy shared with Stage 4; stage material unspecified"
        source_tag: "FLAGGED provisional d-283: handbook-level SiC density"

  carrier_gas_earth_price_per_kg:
    units: USD/kg
    rationale: "Kr uses the approximate European small-quantity price from Ullmann's (1999); N2 and Ar use flagged zero Earth prices because no in-repo price is available and the $10,000/kg delivery term dominates."
    source_tag: "FLAGGED dated estimate 2026-11-11: Ullmann's (1999) via Wikipedia 'Prices of chemical elements'; USGS MCS 2026 reports rare-gas prices unavailable"
    values:
      Ar:
        value: 0.0
        source_tag: "earth_price_pending_immaterial_vs_delivery"
      Kr:
        value: 290.0
      N2:
        value: 0.0
        source_tag: "earth_price_pending_immaterial_vs_delivery"

  carrier_makeup_loss_fraction_per_run:
    value: 0.01
    units: fraction/run
    rationale: "Assumed fraction of recirculated carrier lost per run; visible design input pending an owner value."
    source_tag: "FLAGGED: controller assumption pending owner number (d-389)"

  furnace_resinter_cost_usd:
    value: 5000.0
    units: USD/resinter
    rationale: "Bootstrap refractory relining/resinter campaign allowance until furnace material vendor quotes exist."
    source_tag: "owner ratified 2026-07-12: cost metrics as YAML parameters; marginal-cost accounting; 5000 USD/resinter bootstrap pending refractory campaign cost quote"

  depreciation_expense_per_run:
    value: 50.0
    units: USD/run
    rationale: "Fallback only: furnace_resinter_cost_usd divided by a 100-campaign placeholder when campaigns_to_resinter is unavailable."
    source_tag: "owner ratified 2026-07-12: marginal-cost accounting bootstrap derived as 5000 USD / 100 campaigns pending measured campaigns-to-resinter"

  furnace_lifetime_cost_multiplier:
    value: 500.0
    units: batch-cost multiples
    rationale: "Advanced edge-case exploration control: furnace lifetime value as a multiple of one typical batch process cost; lower only to surface qualified fouling recipes when extraction is otherwise intractable."
    source_tag: "owner final ratification 2026-07-19: furnace capital value equals 500 typical batch process costs by default; advanced users may relax for edge-case exploration"

  hot_duct_cost_per_m2_usd:
    value: 25000.0
    units: USD/m2
    rationale: "Retained so saved v1 recipes still normalize. Not applied: the hot duct is priced as a layered cylindrical shell (t-1911). No vendor quote exists for this leftover placeholder."
    source_tag: "FLAGGED provisional (d-452): controller placeholder pending owner/vendor ratification; not the t-1911 duct price"

  # Operator setting, not an optimizer knob (t-472).
  # In-situ USD/kg is derived when status is derived_sensible_enthalpy and
  # value is null. The owner of the arithmetic is
  # simulator.layered_wall.in_situ_processing_cost_per_kg. An owner number
  # in value replaces the derivation. status owner_unset with value null
  # stays null and is not refilled. Explicit 0 is a real price.
  #
  # Premise: the in-situ oxide is heated from the JANAF 298.15 K reference
  # to a process temperature, and the electricity price buys that sensible
  # enthalpy. Kiln losses are not cited, so the thermal efficiency is 1 and
  # the result is a lower bound on processing energy.
  # Algebra: specific energy [MJ/kg] = H(T) [kJ/mol] / M [g/mol], because
  # kJ/g = MJ/kg. H(T) is the printed JANAF enthalpy increment, interpolated
  # between the bracketing printed rows. Doloma is the mass-weighted
  # CaO + MgO mix (Ca-027 and Mg-008) at 1400 C, the Díaz-Tato example
  # "higher sintering temperatures, such as 1400 C", flagged
  # cited_example_not_a_kiln_schedule. Silica uses JANAF O-037 quartz, not
  # fused silica, at the fused-silica catalog max_operating temperature,
  # flagged janaf_quartz_not_fused_silica and
  # process_temperature_is_catalog_max_operating_not_a_cited_sinter.
  # Heat of fusion is absent from those tables and is not added.
  # USD/kg = specific energy / efficiency / (kJ per kWh) * electricity,
  # with kJ per kWh owned by simulator.thermal_budget.KJ_PER_KWH (3600).
  # Sanity: oxide sensible enthalpy to about 1600 C is about 1-2 MJ/kg.
  # Doloma and silica are not one blended rate.
  in_situ_bootstrap_cost_per_kg:
    value: null
    units: USD/kg
    status: derived_sensible_enthalpy
    rationale: "Derived doloma processing cost at the electricity price on this payload. Owner value replaces it. owner_unset null stays null."
    source_tag: "FLAGGED t-1911: derived_sensible_enthalpy; efficiency 1 because kiln losses are not cited; not an owner-ratified USD/kg."

  # Thicknesses are engineering defaults, owner-settable here. They are not
  # copied into setpoints. Liner 5 mm is a dense 10YSZ tile, not a
  # plasma-sprayed coat. Felt 25 mm is one blanket course. Structure 75 mm
  # is the doloma pipe shell. Felt source imported is an engineering default:
  # Kaowool is a shipped Earth blanket, not in-situ doloma. Enclosure 25 C
  # is the JANAF reference temperature, used only when the owner outer
  # temperature is null. Stage 3 keeps the 10 mm product-baffle slot above.
  layered_wall:
    source_tag: "FLAGGED t-1911 operator setting; not an optimizer knob (t-472)"
    outer_temperature_C: null
    outer_temperature_status: owner_unset
    enclosure_temperature_C: 25
    enclosure_temperature_status: engineering_default
    layers:
      liner:
        role: liner
        material_id: bulk_zirconia_ysz
        source: imported
        thickness_m: 0.005
        thickness_status: engineering_default
      felt:
        role: insulation
        material_id: kaowool_rcf_blanket
        source: imported
        source_status: engineering_default
        thickness_m: 0.025
        thickness_status: engineering_default
      structure:
        role: structure
        material_id: doloma
        source: in_situ
        thickness_m: 0.075
        thickness_status: engineering_default
    stage_bulk:
      sio_stage3:
        kind: in_situ_product_bulk
        material_id: fused_silica
        source: in_situ
        cost_per_kg_usd: null
        cost_status: derived_sensible_enthalpy

  shared_condenser_train_cost_per_kg_hr_usd:
    value: 2000.0
    units: "USD/(kg/hr)"
    rationale: "FLAGGED design-study placeholder for condenser-train installed capacity; no vendor quote is available."
    source_tag: "FLAGGED provisional (d-452): controller placeholder pending owner/vendor ratification"

  furnaces_per_shared_train:
    value: 10
    units: furnaces/train
    rationale: "FLAGGED sharing assumption; total train capacity is max(n times average flow, one-furnace peak flow)."
    source_tag: "FLAGGED provisional (d-452): ten furnaces share a train pending owner ratification"

  min_fouling_penalty:
    value: 1.0
    units: batch-cost multiples
    rationale: "Advanced optimizer control: any positive qualified deposition pays at least one typical batch process cost; exactly zero deposition remains free."
    source_tag: "owner ratified 2026-07-19: zero-fouling bright-line; positive qualified fouling floor defaults to one typical batch process cost"

  generic_reagent_cost_per_kg:
    value: 10.0
    units: USD/kg
    rationale: "Bootstrap non-shuttle reagent replacement rate for consumables without species-specific costing."
    source_tag: "owner bootstrap estimate pending reagent-specific procurement basis"

  shuttle_reagent_replacement_cost_per_kg:
    units: USD/kg
    rationale: "Static amortized inventory-loss replacement estimates for regenerated shuttle inventory; not market purchase prices."
    source_tag: "owner ratified 2026-07-12: cost metrics as YAML parameters; marginal-cost accounting; shuttle Na/K/Mg/Ca static bootstrap values pending distillation from a sample run"
    values:
      Na:
        value: 0.50
        rationale: "Bootstrap Na shuttle inventory-loss replacement estimate."
      K:
        value: 1.00
        rationale: "Bootstrap K shuttle inventory-loss replacement estimate."
      Mg:
        value: 0.75
        rationale: "Bootstrap Mg shuttle inventory-loss replacement estimate."
      Ca:
        value: 0.50
        rationale: "Bootstrap Ca shuttle inventory-loss replacement estimate."
