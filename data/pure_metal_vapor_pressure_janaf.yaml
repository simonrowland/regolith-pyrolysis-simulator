schema_version: janaf_pure_metal_vapor_pressure.v1
source_id: nist-janaf-4th
citation: Chase, M. W. Jr., NIST-JANAF Thermochemical Tables, 4th Edition, J. Phys. Chem. Ref. Data Monograph 9 (1998)
standard_state: p° = 0.1 MPa = 1 bar
standard_pressure_Pa: 100000.0
temperature_unit: K
pressure_unit: Pa
tabulation_max_temperature_K: 3500.0
derivation: For M(condensed) ⇌ M(g), below the JANAF FUGACITY=1 bar marker log10(P_sat/bar) = log10 Kf[M(g)]. At and above
  that marker the gas is the standard elemental phase, so log10(P_sat/bar) = -[G(g)-G(cr or l)]/(R T ln 10). JANAF supplies
  p°=0.1 MPa=1 bar; P_sat(Pa)=100000×10^log10(P_sat/bar). G(T)=ΔfH°(298.15 K) - T×(-[G°-H°(298.15 K)]/T)/1000, using kJ/mol
  for enthalpy and J/(mol K) for the Gibbs-enthalpy function. The FUGACITY=1 bar transition marker must recover 1 bar within
  0.002 dex after interpolating the JANAF Gibbs functions.
