cost_parameters:
  schema_version: optimize-costs-v1
  parameters:
    electricity_cost_per_kWh:
      units: USD/kWh
      rationale: Bootstrap microgrid planning rate; rounded above recent EIA industrial
        retail electricity to cover off-Earth generation/storage margin.
      source_tag: U.S. EIA, Electric Power Monthly, Table 5.6.A, Average Price of
        Electricity to Ultimate Customers by End-Use Sector, accessed 2026-07-12,
        https://www.eia.gov/electricity/monthly/epm_table_grapher.php?t=epmt_5_06_a;
        owner bootstrap margin
      value: 0.15
    solar_heat_cost_per_kWh:
      units: USD/kWh
      source_tag: owner-t7-two-price-energy-v1
      value: 0.05
    furnace_resinter_cost_usd:
      units: USD/resinter
      rationale: Bootstrap refractory relining/resinter campaign allowance until furnace
        material vendor quotes exist.
      source_tag: 'owner ratified 2026-07-12: cost metrics as YAML parameters; marginal-cost
        accounting; 5000 USD/resinter bootstrap pending refractory campaign cost quote'
      value: 5000.0
    depreciation_expense_per_run:
      units: USD/run
      rationale: 'Fallback only: furnace_resinter_cost_usd divided by a 100-campaign
        placeholder when campaigns_to_resinter is unavailable.'
      source_tag: 'owner ratified 2026-07-12: marginal-cost accounting bootstrap derived
        as 5000 USD / 100 campaigns pending measured campaigns-to-resinter'
      value: 50.0
    generic_reagent_cost_per_kg:
      units: USD/kg
      rationale: Bootstrap non-shuttle reagent replacement rate for consumables without
        species-specific costing.
      source_tag: owner bootstrap estimate pending reagent-specific procurement basis
      value: 10.0
    furnace_lifetime_cost_multiplier:
      units: batch-cost multiples
      rationale: 'Advanced edge-case exploration control: furnace lifetime value as
        a multiple of one typical batch process cost; lower only to surface qualified
        fouling recipes when extraction is otherwise intractable.'
      source_tag: 'owner final ratification 2026-07-19: furnace capital value equals
        500 typical batch process costs by default; advanced users may relax for edge-case
        exploration'
      value: 500.0
    min_fouling_penalty:
      units: batch-cost multiples
      rationale: 'Advanced optimizer control: any positive qualified deposition pays
        at least one typical batch process cost; exactly zero deposition remains free.'
      source_tag: 'owner ratified 2026-07-19: zero-fouling bright-line; positive qualified
        fouling floor defaults to one typical batch process cost'
      value: 1.0
    shuttle_reagent_replacement_cost_per_kg:
      units: USD/kg
      rationale: Static amortized inventory-loss replacement estimates for regenerated
        shuttle inventory; not market purchase prices.
      source_tag: 'owner ratified 2026-07-12: cost metrics as YAML parameters; marginal-cost
        accounting; shuttle Na/K/Mg/Ca static bootstrap values pending distillation
        from a sample run'
      values:
        Ca:
          rationale: Bootstrap Ca shuttle inventory-loss replacement estimate.
          value: 0.5
        K:
          rationale: Bootstrap K shuttle inventory-loss replacement estimate.
          value: 1.0
        Mg:
          rationale: Bootstrap Mg shuttle inventory-loss replacement estimate.
          value: 0.75
        Na:
          rationale: Bootstrap Na shuttle inventory-loss replacement estimate.
          value: 0.5
  provenance:
    source: default:owner-t7-two-price-energy-v1; base_config:/Users/simonrowland/Repos/regolith-pyrolysis-simulator/worktrees/s-72/data/optimize_costs.yaml
    defaults_applied: true
    recipe_source: data/recipes/c2a_staged_temperature_ladder.yaml
campaigns:
  C2A_staged:
    stages:
    - name: alkali_early_fe
      target_C: 1250
      ramp_rate_C_per_hr: 600
      duration_h: 4
      target_species:
      - Na
      - K
      endpoint:
        type: flux_decay_or_duration
        threshold_kg_hr: 0.02
        species_monitored:
        - Na
        - K
        flux_decay_species:
        - Na
        - K
      verification:
        lunar_mare_low_ti_kg_per_1000kg:
          Na: 3.05
          K: 0.11
          Fe: 0.0
          SiO: 0.0
    - name: sio_window
      target_C: 1600
      ramp_rate_C_per_hr: 175
      duration_h: 3
      target_species:
      - SiO
      - minor_Fe
      endpoint:
        type: SiO_pulse_then_flux_decay_or_duration
        threshold_kg_hr: 0.05
        species_monitored:
        - SiO
        - Fe
        - Mg
        flux_decay_species:
        - SiO
      verification:
        note: 'Engine ladder shows Fe/SiO/Mg overlap above ~1600 C; this stage isolates
          the first SiO pulse but cannot make a pure SiO window.

          '
    - name: fe_hot_hold
      ramp_rate_C_per_hr: 150
      duration_h: 1
      target_species:
      - Fe
      endpoint:
        type: FeO_residual_or_duration
        FeO_residual_kg_target:
        - 20
        - 24
        thermal_Fe_depletion_pct:
        - 86
        - 88
        yield_target:
          mode: enabled
          species:
          - Fe
          denominator: initial_feed_element_inventory
          quantity: captured
          capture_stage: 1
          threshold_pct_ref: thermal_Fe_depletion_pct
        flux_decay_species:
        - Fe
      verification:
        lunar_mare_low_ti_kg_per_1000kg:
          Fe_thermal_total: 116.2
          FeO_residual: 20.3
          thermal_Fe_pct: 88.0
    - name: cool_for_na_shuttle
      target_C: 1150
      ramp_rate_C_per_hr: 600
      duration_h: 1
      target_species:
      - residual_FeO
      endpoint:
        type: temperature_gate_for_Na_FeO_cleanup
        max_temperature_C: 1150
    max_hold_hr: 9
