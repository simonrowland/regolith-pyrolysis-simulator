schema_version: 2
policy_id: terminal_ceramic_hierarchy.v1.most_specific_else_parent
source_documents:
  deepened_table: docs-private/research/2026-06-08-wall-chemistry/ceramic-types-deepened.md
  audit: docs-private/research/2026-06-08-wall-chemistry/ceramic-AUDIT.md
  references: docs-private/references/ceramic-types-references.md
  taxonomy: docs-private/research/2026-07-19-ceramics-glass-taxonomy/taxonomy.md
  datasheets: docs-private/research/2026-07-19-ceramics-glass-taxonomy/datasheets.md
ignored_identity_oxides:
- FeO
- Fe2O3
analytical_tolerance_wt_pct: 0.5
ceramics:
  calcium_aluminate_refractory:
    parent: null
    level: parent
    label: Calcium-aluminate refractory / CAC family
    composition:
      kind: window
      defining_oxides:
      - CaO
      - Al2O3
      allow_other_oxides: true
      note: CaO-Al2O3 family; SiO2+MgO must remain below 15 wt%.
      wt_pct_window:
        CaO:
        - 5
        - 65
        Al2O3:
        - 35
        - 95
      constraints:
        sum_max:
        - oxides:
          - SiO2
          - MgO
          value: 15
      citations: []
    service_temp:
      value_C: null
      kind: uncharacterized
      citations: []
      note: No single sourced service temperature.
    liner_suitability:
      verdict: limited-scope
      citations: []
      note: Taxonomy family classification.
    datasheet:
      terrestrial_applications: Calcium aluminate cement (CAC) binders and refractory castables; specialty
        mortars for high-temperature and chemically aggressive service; not a single pure-phase product
        at parent level.
      density_g_cm3: "Family span ~2.9\u20133.8 (phase-dependent: CA ~2.94; CA6 theoretical ~3.79). Bulk\
        \ castables much lower (porous)."
      colour: "Pure phases white\u2013off-white; Fe/Ti impurities \u2192 grey, beige, or pinkish; fired\
        \ CAC products often grey\u2013buff."
      melting_point_C: "Phase-dependent (see subtypes): CA incongruent ~1390 \xB0C; CA2 ~1750\u20131765\
        \ \xB0C class; CA6 ~1830\u20131875 \xB0C; C3A decomposes ~1540 \xB0C class. Parent has no single\
        \ T."
      softening_working_temp_C: "CAC castable systems **formulation-dependent** ~700\u20131900 \xB0C product\
        \ range (tax: CAC literature). Parent alone: **uncharacterized**."
      creep_limit_C: "**Uncharacterized at parent** \u2014 gated by binder/aggregate system and porosity;\
        \ do not use family melting points as RUL."
      water_stability: '**Hydraulic phases hydrate** (CA, C3A, C12A7): designed to set with water as cements.
        High-alumina refractories (CA6-rich) are comparatively water-stable once fired. Free lime if present
        slakes.'
      materials_compatibility: "Good resistance to many weak acids and sulfates vs Portland in CAC use;\
        \ basic slag service depends on Al\u2082O\u2083 grade. Attacked by strong alkali in some systems;\
        \ CA6 subtype preferred for alkali. Reducing atmospheres generally acceptable for aluminates."
      mechanical_properties: 'Brittle oxide ceramics; strength is product-body dependent (castable vs
        dense aggregate). Parent: **uncharacterized single-number set**.'
      appearance_texture: "Fired bodies: matte to slightly vitreous ceramic; castables granular/porous;\
        \ dense aggregates dull white\u2013grey."
      everyday_analog: High-temperature refractory cement / furnace castable lining (not ordinary Portland
        concrete).
  monocalcium_aluminate_CA:
    label: Monocalcium aluminate, CA, CaO.Al2O3
    composition:
      kind: point-anchor
      defining_oxides:
      - CaO
      - Al2O3
      wt_pct:
        CaO: 35.0
        Al2O3: 65.0
      allow_other_oxides: false
      note: ''
      citations:
      - C:S3
      - C:S8
    service_temp:
      value_C: null
      kind: uncharacterized
      citations:
      - C:S3
      - C:S8
      scoped_values_C:
        CAC_castable_systems:
        - 700
        - 1900
      note: 'Standalone CA terminal-ceramic service is uncharacterized. CAC-bonded castable limits are
        formulation ratings, not pure CA service.

        '
    liner_suitability:
      verdict: limited-scope
      citations:
      - C:S3
      - C:S8
      note: 'Binder/castable-system phase only. Do not classify as a standalone terminal liner ceramic.

        '
    parent: calcium_aluminate_refractory
    level: subtype
    datasheet:
      terrestrial_applications: Principal hydraulic phase in calcium aluminate cements; rapid-hardening
        specialty cements; refractory castable binders. **Not** a standalone hot-face liner phase.
      density_g_cm3: "~2.94\u20132.98 theoretical (2945 kg\xB7m\u207B\xB3). [web:12][web:8]"
      colour: "Colourless\u2013white pure phase; commercial CAC clinker grey from Fe/impurities."
      melting_point_C: "**Incongruent** melt ~**1390 \xB0C** (peritectic-style decomposition to liquid\
        \ + CA2/corundum path \u2014 Wikipedia MCA). [web:12] Alternate literature quotes ~1600 \xB0C\
        \ for related CA systems \u2014 prefer incongruent **1390 \xB0C** for pure CA. [web:12][web:9]"
      softening_working_temp_C: "Standalone liner: **uncharacterized**. As CAC binder in formulated castables:\
        \ service often **~1480\u20131650 \xB0C** class depending on aggregate (tax)."
      creep_limit_C: '**Uncharacterized as pure CA body.** Castable RUL is aggregate+matrix limited, not
        pure-CA melting.'
      water_stability: "**Hydrates and sets** (designed hydraulic behaviour): rapid reaction with water\
        \ \u2192 CAH\u2081\u2080 metastable hydrate and/or C\u2082AH\u2088 + C\u2083AH\u2086 + Al(OH)\u2083\
        \ gel. [web:12] Wet storage of unfired powder fails by hydration. Fired dense ceramic is more\
        \ stable but residual free Ca-aluminates can still hydrate if porous."
      materials_compatibility: 'Good chemical resistance in many CAC applications (sewage, sulfate soils).
        High-T: intermediate between lime-rich and alumina-rich aluminates. Attacked if free lime present;
        basic slag service limited vs magnesia.'
      mechanical_properties: Hardness **uncharacterized single pure-crystal value** commonly published;
        CAC pastes gain early compressive strength (hydraulic, not refractory ceramic numbers). Brittle
        ceramic when densified.
      appearance_texture: "Clinker: grey granular; pure synthetic: white powder/ceramic, dull\u2013matte."
      everyday_analog: "Rapid-set specialty cement (Fondu/CAC) \u2014 not Portland grey cement exactly,\
        \ but the same \u201Chydraulic cement powder\u201D feel."
  calcium_dialuminate_CA2:
    label: Calcium dialuminate, CA2, CaO.2Al2O3
    composition:
      kind: point-anchor
      defining_oxides:
      - CaO
      - Al2O3
      wt_pct:
        CaO: 22.0
        Al2O3: 78.0
      allow_other_oxides: false
      note: ''
      citations:
      - C:S3
      - C:S8
    service_temp:
      value_C: null
      kind: uncharacterized
      citations:
      - C:S3
      - C:S8
      scoped_values_C:
        CAC_castable_systems:
        - 700
        - 1900
      note: 'Standalone CA2 terminal-ceramic service is uncharacterized. CAC/castable values are product-system
        evidence only.

        '
    liner_suitability:
      verdict: limited-scope
      citations:
      - C:S3
      - C:S8
      note: 'Binder/high-alumina CAC phase. Do not classify a rump as furnace-liner CA2 unless a CA2 body/product
        window is added.

        '
    parent: calcium_aluminate_refractory
    level: subtype
    datasheet:
      terrestrial_applications: "High-alumina CAC phase; intermediate in CaO\u2013Al\u2082O\u2083 phase\
        \ diagram; refractory CAC formulations; rare terrestrial/meteoritic mineral (grossite). Not standalone\
        \ commercial liner."
      density_g_cm3: "~**2.88** g/cm\xB3 (grossite calculated/measured class). [web:64][web:69]"
      colour: "Colourless\u2013white pure; V impurities can give light violet (specialty). [web:66] Fe\
        \ \u2192 grey/buff."
      melting_point_C: "~**1750\u20131765 \xB0C** class (literature with CA pair). [web:9] Congruency\
        \ details phase-diagram dependent; treat as high-T aluminate solid before CA6 field."
      softening_working_temp_C: 'Standalone: **uncharacterized**. High-alumina CAC product service uses
        aggregate, not pure CA2.'
      creep_limit_C: '**Uncharacterized** pure phase.'
      water_stability: "Hydraulically **much less reactive** than CA at ambient T; elevated-T hydration\
        \ possible in CAC systems. [web:11] Not free-lime slaking. Generally more water-tolerant than\
        \ C\u2083S/CaO once fired, but unfired powder can still hydrate slowly."
      materials_compatibility: High-alumina character (leans acid/high-Al refractory family); better alkali/slag
        options than lime-rich aluminates but inferior to CA6 for many alkali environments.
      mechanical_properties: '**Uncharacterized** robust pure-phase mechanical dataset in open product
        literature; brittle oxide.'
      appearance_texture: "White\u2013grey crystalline ceramic; matte to weakly vitreous."
      everyday_analog: "High-alumina refractory grain / white cement clinker phase \u2014 closest everyday:\
        \ pale high-alumina furnace cement aggregate."
  calcium_hexaluminate_CA6:
    label: Calcium hexaluminate / hibonite, CA6, CaO.6Al2O3
    composition:
      kind: point-anchor
      defining_oxides:
      - CaO
      - Al2O3
      wt_pct:
        CaO: 8.0
        Al2O3: 92.0
      allow_other_oxides: false
      note: ''
      citations:
      - C:S4
      - C:S5
      - C:S8
    service_temp:
      value_C: 1500
      kind: service
      citations:
      - C:S4
      - C:S5
      melting_note_C: 1830
      note: 'Porous CA6 is described as long-term stable up to 1500 degC for thermal-insulating/refractory
        applications.

        '
    liner_suitability:
      verdict: strong-candidate
      citations:
      - C:S4
      - C:S5
      note: 'Strong terminal refractory/insulating-liner candidate with sourced alkaline resistance, reducing-atmosphere
        stability, and low wettability by molten metals/slags.

        '
    parent: calcium_aluminate_refractory
    level: subtype
    datasheet:
      terrestrial_applications: High-alumina **hot-face / insulating refractory** (porous CA6); cement-kiln
        linings; alkali- and reducing-atmosphere service; synthetic dense aggregate (e.g. Bonite-class
        CA6). [web:0][web:3][web:5]
      density_g_cm3: "Theoretical ~**3.79** g/cm\xB3; mineral hibonite measured ~3.83\u20133.85. [web:2][web:71]\
        \ Porous insulating products: bulk density much lower (product-specific)."
      colour: "Pure: white\u2013colourless; hibonite mineral often brown/black from Fe/Ti/REE; V can purple.\
        \ Fe/Cr/Ti impurities tint grey\u2013brown\u2013pink."
      melting_point_C: "~**1830\u20131875 \xB0C** (product literature 1830 \xB0C; formation papers 1875\
        \ \xB0C). [web:3][web:2] Incongruent melting of CaAl\u2081\u2082O\u2081\u2089 reported near ~**1852\
        \ \xB0C** in experimental work. [web:70]"
      softening_working_temp_C: "**Long-term service ~1500 \xB0C** (porous CA6 insulating); melting far\
        \ higher. [tax: CA6 service 1500 \xB0C]"
      creep_limit_C: "Structural use gated well below melting; porous CA6 insulation ~**1500 \xB0C** continuous\
        \ class is the practical furnace ceiling cited for product grades. Dense CA6 aggregate can run\
        \ higher in formulated bricks \u2014 **product-row only**; no single RUL universal."
      water_stability: "**Water-stable** as fired ceramic (non-hydraulic hexaluminate). Unlike free CaO/C\u2083\
        S, does not slake. Residual unreacted CaO in imperfect synthesis can hydrate \u2014 purity gate."
      materials_compatibility: '**Strong alkali resistance** and good behaviour in reducing atmospheres
        relative to many aluminosilicates; resists CO attack in dense forms. [web:5][web:0] High-alumina
        / near-neutral-to-acid family; attacked by strongly basic FeO-rich slags less favorably than magnesia;
        CMAS infiltration still a risk at very high T.'
      mechanical_properties: "Intrinsically difficult to densify (plate-like grains) \u2192 porous bodies\
        \ lower strength; dense CA6 aggregate used for hot strength. Hardness **uncharacterized** as a\
        \ single standard Mohs in product sheets consulted; brittle refractory ceramic."
      appearance_texture: "Porous grades: chalky\u2013matte white insulating brick feel; dense aggregate:\
        \ hard dull-white ceramic grain."
      everyday_analog: "Lightweight insulating firebrick / kiln hot-face block \u2014 pale, matte, refractory."
  tricalcium_aluminate_C3A:
    parent: calcium_aluminate_refractory
    level: subtype
    label: Tricalcium aluminate, C3A, Ca3Al2O6
    composition:
      kind: point-anchor
      defining_oxides:
      - CaO
      - Al2O3
      wt_pct:
        CaO: 62.3
        Al2O3: 37.7
      allow_other_oxides: false
      note: ''
      citations: []
    service_temp:
      value_C: null
      kind: uncharacterized
      citations: []
      note: No single sourced service temperature.
    liner_suitability:
      verdict: not-recommended
      citations: []
      note: Taxonomy family classification.
    datasheet:
      terrestrial_applications: Portland cement **clinker interstitial** phase; controls early set with
        gypsum; **not** a refractory liner product.
      density_g_cm3: "~**3.04** g/cm\xB3 class (cement mineral data; confirm product row if coding)."
      colour: "Pure colourless\u2013white; clinker grey from Fe/ferrite association."
      melting_point_C: "Decomposes / incongruent path ~**1540\u20131542 \xB0C** class (tax note ~1542\
        \ \xB0C). Not a congruent liner solid."
      softening_working_temp_C: "**Not applicable as liner** \u2014 cement phase."
      creep_limit_C: '**not-recommended** as structural hot-face; no RUL product class as pure C3A.'
      water_stability: '**Hydrates vigorously** (flash set without gypsum); forms calcium aluminate hydrates.
        **Hydrates-and-fails** as a dry ceramic residue if water contacts free C3A.'
      materials_compatibility: 'Cement chemistry: sulfate attack pathway (ettringite) is a durability
        issue in concrete, not a refractory virtue. Unsuitable vs molten slag as a pure phase.'
      mechanical_properties: '**Uncharacterized** as engineering ceramic; brittle.'
      appearance_texture: 'Clinker: dark grey nodular; pure: white powder.'
      everyday_analog: Portland cement clinker nodule (the fast-setting interstitial chemistry).
  mayenite_C12A7:
    parent: calcium_aluminate_refractory
    level: subtype
    label: Mayenite, C12A7
    composition:
      kind: point-anchor
      defining_oxides:
      - CaO
      - Al2O3
      wt_pct:
        CaO: 48.5
        Al2O3: 51.5
      allow_other_oxides: false
      note: ''
      citations: []
    service_temp:
      value_C: null
      kind: uncharacterized
      citations: []
      note: No single sourced service temperature.
    liner_suitability:
      verdict: marker-only
      citations: []
      note: Taxonomy family classification.
    datasheet:
      terrestrial_applications: Cement/clinker cage phase; specialty electride/oxide research material;
        **not** terminal liner.
      density_g_cm3: "~**2.68\u20132.85** class (literature scatter; **prefer blank if coding strict**\
        \ \u2014 mineral mayenite ~2.85). Mark: **approximate / source-dependent**."
      colour: "Colourless\u2013white pure; may tint with transition metals."
      melting_point_C: "~**1400\u20131450 \xB0C** class in CaO\u2013Al\u2082O\u2083 diagrams (phase-diagram\
        \ context); treat as **uncharacterized product T** without a cited pure-phase RUL."
      softening_working_temp_C: '**Uncharacterized** as liner.'
      creep_limit_C: '**Uncharacterized / not-recommended** liner.'
      water_stability: '**Hydrates** (cement-related calcium aluminate); water contact degrades free phase.'
      materials_compatibility: Cement curiosity; not slag-resistant refractory design phase.
      mechanical_properties: '**Uncharacterized** engineering ceramic numbers.'
      appearance_texture: White crystalline / chalky powder when pure.
      everyday_analog: "Specialty cement phase powder \u2014 closest: white calcium-aluminate cement flour."
  aluminosilicate_ceramic:
    parent: null
    level: parent
    label: Aluminosilicate ceramic (acid / high-alumina family)
    composition:
      kind: window
      defining_oxides:
      - Al2O3
      - SiO2
      allow_other_oxides: true
      note: Al2O3+SiO2 must comprise at least 70 wt% of nonvolatile oxides.
      wt_pct_window:
        Al2O3:
        - 25
        - 95
        SiO2:
        - 5
        - 75
      constraints:
        sum_min:
        - oxides:
          - Al2O3
          - SiO2
          value: 70
      citations: []
    service_temp:
      value_C: null
      kind: uncharacterized
      citations: []
      note: No single sourced service temperature.
    liner_suitability:
      verdict: candidate
      citations: []
      note: Taxonomy family classification.
    datasheet:
      terrestrial_applications: Fireclay and high-alumina bricks, kiln furniture, crucibles, furnace linings
        (acid/high-Al service), porcelain/stoneware bodies at lower Al end.
      density_g_cm3: "Family ~2.5\u20133.2+ (fireclay lower bulk; mullite ~3.0\u20133.2 theoretical)."
      colour: "White\u2013buff\u2013grey pure; Fe \u2192 cream, tan, brown; Ti \u2192 cream/blue-grey\
        \ under redox."
      melting_point_C: "Wide: fireclay eutectics lower; mullite ~1830\u20131850 \xB0C; pure alumina end\
        \ higher. **No single parent T.**"
      softening_working_temp_C: "Fireclay lower (often <1400 \xB0C class products); high-alumina/mullite\
        \ higher \u2014 **subtype-gated**."
      creep_limit_C: Product RUL/PCE gated; parent **uncharacterized single number**.
      water_stability: '**Water-stable** fired aluminosilicates (no free-lime hydration). Green clay bodies
        soften with water; fired ceramics do not.'
      materials_compatibility: "**Acid / high-alumina family** (ASTM language): resists acidic slags better\
        \ than basic; **attacked by basic FeO\u2013CaO-rich slag**. Alkali vapour can form low-melting\
        \ alkali-aluminosilicates (glazing/corrosion). CMAS attack at turbine/hot-section analogs."
      mechanical_properties: Brittle ceramics; flexural strengths product-dependent (see mullite).
      appearance_texture: Matte to semi-vitreous ceramic; porcelain-like when dense and fine-grained.
      everyday_analog: "Fired brick / bathroom-tile ceramic / kiln shelf \u2014 dense, hard, earthy-to-porcelain."
  mullite:
    label: Mullite, aluminosilicate solid solution
    composition:
      kind: window
      defining_oxides:
      - Al2O3
      - SiO2
      allow_other_oxides: false
      note: ''
      wt_pct_window:
        Al2O3:
        - 71.8
        - 74.3
        SiO2:
        - 25.7
        - 28.2
      window:
        diagram_ref: Mao et al. 2006, J. Am. Ceram. Soc. 89(1):298-308, Fig. 1, DOI:10.1111/j.1551-2916.2005.00698.x;
          CAS Mul liquidus field
        temperature_C: 1600
        phase_field: mullite solid-solution classifier window inside the CaO-Al2O3-SiO2 Mul field
        digitized_by: codex-R2-2026-06-09; text-bounded window, no polygon expansion
        tolerance_wt_pct: 0.5
      citations:
      - C:S2
    service_temp:
      value_C: 1600
      kind: service
      citations:
      - C:S2
      qualified_values_C:
        vacuum_limit: 1600
        typical_air_max: 1725
        air_limit: 1800
      note: 'Use 1600 degC as conservative default where atmosphere/load is unknown. Air-service product
        rows can be higher.

        '
    liner_suitability:
      verdict: strong-candidate
      citations:
      - C:S2
      note: 'Strong liner/kiln-furniture candidate with cited hot-blast, reheat, steel-ladle, glass, and
        kiln-furniture uses.

        '
    parent: aluminosilicate_ceramic
    level: subtype
    datasheet:
      terrestrial_applications: Kiln furniture, high-alumina refractories, glass-furnace regenerators,
        advanced structural ceramics, spark-plug bodies historically, aerospace thermal protection composites.
      density_g_cm3: "Theoretical ~**3.16\u20133.22**; dense ceramics often ~**3.0\u20133.2** g/cm\xB3\
        . [web:0][web:5]"
      colour: "Off-white to cream pure; Fe \u2192 grey/buff; natural mullite rare (Isle of Mull history)."
      melting_point_C: "~**1830\u20131850+ \xB0C** (incongruent/ss complexity on Al\u2082O\u2083\u2013\
        SiO\u2082 join; industrial cite ~1850 \xB0C). [web:1]"
      softening_working_temp_C: "**Continuous service ~1600 \xB0C** default product; air product rows\
        \ sometimes ~1725\u20131800 \xB0C. [tax]"
      creep_limit_C: "Excellent **creep resistance** among oxides \u2014 structural use commonly limited\
        \ ~**1600 \xB0C** under load for mullite refractories; above that pyroplastic risk rises despite\
        \ higher melting. [web:5][web:0]"
      water_stability: '**Water-stable** (fired). No hydraulic phases.'
      materials_compatibility: 'High-alumina acid/neutral character: good vs acidic slags and many metals
        in oxidizing atmospheres; **basic slag attack**; alkali vapour corrosion risk; good thermal-shock
        vs dense alumina in many grades.'
      mechanical_properties: "Flexural/MOR ~**160\u2013190 MPa** dense; compressive ~550\u20131320 MPa;\
        \ fracture toughness ~**2\u20134 MPa\xB7m\u2070\xB7\u2075**; Knoop ~1450 class; brittle. [web:0][web:5]"
      appearance_texture: 'Dense: porcelain-like, matte to slightly glassy fracture; porous: chalky refractory.'
      everyday_analog: "High-quality porcelain / dense kiln shelf \u2014 harder, whiter \u201Csuper-ceramic.\u201D"
  anorthite:
    label: Anorthite / Ca-rich plagioclase ceramic, CaAl2Si2O8
    composition:
      kind: point-anchor
      defining_oxides:
      - CaO
      - Al2O3
      - SiO2
      wt_pct:
        CaO: 20.0
        Al2O3: 37.0
        SiO2: 43.0
      allow_other_oxides: false
      note: ''
      citations:
      - C:S8
      - C:S13
    service_temp:
      value_C: null
      kind: uncharacterized
      citations: []
      note: Standalone anorthite refractory service is uncharacterized.
    liner_suitability:
      verdict: not-recommended
      citations:
      - C:S8
      - C:S13
      note: 'Use as a CAS/LTCC/CMAS glass-ceramic phase marker only; blank to no-match outside sourced
        anorthite or CMAS windows.

        '
    parent: aluminosilicate_ceramic
    level: subtype
    datasheet:
      terrestrial_applications: "Glass-ceramic seals (SOFC/CMAS paths), petrologic plagioclase endmember,\
        \ filler/marker phase \u2014 **not** hot-face liner alone."
      density_g_cm3: "~**2.74\u20132.76** g/cm\xB3. [web:18][web:20]"
      colour: "Colourless, white, grey; Fe/impurities \u2192 reddish/grey tints. [web:18]"
      melting_point_C: "Congruent melt ~**1550\u20131553 \xB0C** class (standard mineral data ~1550 \xB0\
        C)."
      softening_working_temp_C: "Liner service: **uncharacterized / not-recommended**. Glass-ceramic seals\
        \ operate far lower (e.g. 750\u2013950 \xB0C SOFC scope in tax)."
      creep_limit_C: '**Uncharacterized as structural hot-face.** Soft relative to mullite/spinel at high
        T.'
      water_stability: '**Water-stable** silicate (does not slake). Weathering over geologic time, not
        hydraulic failure.'
      materials_compatibility: Intermediate CAS phase; CMAS glass-ceramic corrosion contexts; not basic-slag
        brick chemistry.
      mechanical_properties: "Mohs **6\u20136.5**; brittle feldspar. [web:18] Engineering flexural set:\
        \ **uncharacterized** as bulk product ceramic."
      appearance_texture: "Vitreous\u2013pearly mineral luster; ceramic bodies matte white\u2013grey."
      everyday_analog: "White feldspar / porcelain body component \u2014 closest: unglazed porcelain shard."
  cordierite_mullite:
    label: Cordierite / cordierite-mullite kiln furniture
    composition:
      kind: window
      defining_oxides:
      - MgO
      - Al2O3
      - SiO2
      allow_other_oxides: false
      note: ''
      wt_pct_window:
        MgO:
        - 4
        - 7
        Al2O3:
        - 35
        - 48
        SiO2:
        - 45
        - 58
      window:
        diagram_ref: Smart and Glasser 1981, Ceram. Int. 7(3):90-97, DOI:10.1016/0272-8842(81)90003-1;
