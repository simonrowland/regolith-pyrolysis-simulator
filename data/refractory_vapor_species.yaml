schema_version: 1
standard_pressure_pa: 100000.0
interpolation: linear_in_log10_kf
out_of_range_policy: frozen_dlog10_kf_d_inverse_temperature_with_t406_input_diagnostics
extension_policy:
  maximum_delta_temperature_K: 300.0
  governing_maximum_delta_log10_pressure: 1.5
  coefficient_projection_diagnostic_maximum_delta_log10_kf: 1.5
  maximum_delta_inverse_temperature_K_inv: 0.0002
  outside_policy: return_raw_model_limited_result_without_claiming_an_upper_loss_envelope
  note: resultant carrier-pressure extrapolation and its upper-loss envelope are not inferred from coefficient distances
kinetic_model:
  evaporation_coefficient: 1.0
  classification: included_carrier_equilibrium_effusion_sum
  note: 'alpha=1 is a kinetic ceiling only for carriers listed in each material''s gas_species. It is NOT an absolute
    upper bound on total recession: omitted carriers in unmodeled_species can both increase mass loss and shift
    the self-buffered surface pO2 of the included set. Downstream lifespan/liner ceilings must not treat this classification
    as a proven total bound.

    '
provenance:
  database: NIST-JANAF Thermochemical Tables, Fourth Edition, SRD 13; NASA Glenn / CEA thermo.inp
  doi: 10.18434/T42S31
  note: JANAF rows copy compiled as_published log10(Kf) cells; Al2O3(g) is derived from NASA Glenn NASA-9 G/RT values
    against Al(l) and O2(g) elemental reference states. All rows use the 100 K grid from 1500 through 3500 K. The
    crystalline-only MgAl2O4 row stops below its 2408 K transition; its typed out-of-band notice records the missing
    liquid table.
overlay_provenance:
  type: project_curated_nonthermochemical_metadata
  citation: Material applicability, carrier selection, and species-gap notes are project-curated; each literature-backed
    claim is cited inline below. The silica phase warning cites NBS Special Publication 302 alongside the NIST-JANAF
    O-039 transition.
  evidence_file: data/literature/refractory_vaporization_validation.yaml
