elements:
  Li:
    atomic_number: 3
    family: alkali
    reductant_class: Mg-C6
    reductant_note: Na/K cannot reduce Li2O at 1150 C; Mg can reduce residual Li2O at C6, after which
      Li-bearing vapor requires late capture.
    reductant_confidence: reviewed
    host_phases:
    - silicate-oxide
    - surface-film
    - free-alkali
    phosphate_affinity: unknown
    volatility_anchor:
      Tc_50_K: 1142
      Tc_source: Lodders 2003 ApJ 591:1220 T8
      metal_bp_C: 1342
      metal_bp_source: CRC Handbook of Chemistry and Physics
      P_sat: null
    volatile_as_oxide:
      value: false
      species: null
      onset_C: null
    routes:
    - plant_bin: alkali-cyclone
      fraction: null
      condition: native/free or already-volatile Li before C6
      status: conditional
    - plant_bin: volatile-metal-trap
      fraction: null
      condition: Li liberated from residual Li2O at Mg-C6
      status: conditional
    - plant_bin: Mg-crown
      fraction: null
      condition: incomplete alkali cut or late-Mg co-evolution
      status: conditional
    - plant_bin: rump
      fraction: null
      condition: unreduced silicate-hosted Li
      status: conditional
    flowsheet_membership:
      chip: Li
      plant_bin: alkali-cyclone
      status: placed
      reason: null
    c0_mode_outcomes:
      lance: retain Li2O unless already free/volatile
      reduce: no Na/K reduction of Li2O; free Li may enter alkali train
      post_C6: Mg-reduced Li routes to late volatile capture or Mg-crown contamination
    abundance_by_feedstock_class:
      lunar:
        distribution: triangular
        min_ppm_mass: 5
        typical_ppm_mass: 12
        max_ppm_mass: 40
        evidence_status: PARTIAL_SOURCE_TABLE
        population_scope: lunar_samples_and_regolith_research_envelope
        source_ids:
        - LSB_A8_2
      mars:
        distribution: triangular
        min_ppm_mass: 2
        typical_ppm_mass: 10
        max_ppm_mass: 40
        evidence_status: PARTIAL_LOCAL_CHEMCAM_RANGE
        population_scope: APXS/ChemCam rows are surface/local measurements; Taylor 2013 rows are bulk-Mars
          proxies and do not certify a regolith range.
        source_ids:
        - OLLILA2014
      ci_carbonaceous_chondrite:
        distribution: triangular
        min_ppm_mass: 1
        typical_ppm_mass: 1.47
        max_ppm_mass: 2
        evidence_status: TYPICAL_SUPPORTED_RANGE_IS_RESEARCH_ENVELOPE
        population_scope: Lodders 2010 Table 2 supports each typical. Except updated halogens, the source
          does not publish the proposed min/max triples; they remain explicit research envelopes. Wasson
          & Kallemeyn 1988 is a group-composition cross-check.
        source_ids:
        - LODDERS2010
        - LODDERS2021
        - PALMEONEILL2014
        - WASSONKALLEMEYN1988
      s_type_ordinary_chondrite:
        distribution: triangular
        min_ppm_mass: 1
        typical_ppm_mass: 1.8
        max_ppm_mass: 3
        evidence_status: BODY_SWEEP_LITERATURE
        population_scope: ordinary_chondrite_body_sweep
        source_ids:
        - WASSONKALLEMEYN1988
        - LODDERSFEGLEY2023
      m_type_metal:
        distribution: unresolved
        min_ppm_mass: null
        typical_ppm_mass: null
        max_ppm_mass: null
        evidence_status: NO_REPORTED_VALUE
        population_scope: iron_meteorite_metal_body_sweep
        source_ids:
        - WASSONKALLEMEYN1988
        - LODDERSFEGLEY2023
      e_type_enstatite_chondrite:
        distribution: unresolved
        min_ppm_mass: null
        typical_ppm_mass: null
        max_ppm_mass: null
        evidence_status: NO_REPORTED_VALUE
        population_scope: enstatite_chondrite_body_sweep
        source_ids:
        - WASSONKALLEMEYN1988
        - LODDERSFEGLEY2023
      comet_dry_refractory_dust:
        distribution: triangular
        min_ppm_mass: 0.49
        typical_ppm_mass: 1.47
        max_ppm_mass: 4.41
        evidence_status: UNCERTAIN_CI_PROXY_NOT_DIRECTLY_MEASURED
        population_scope: dry_refractory_dust_only; not whole-nucleus abundance
        source_ids:
        - LODDERS2010
        - HORNUNG2020
    salience_by_feedstock_class: {}
    flags:
      radiological: false
      toxic: false
      phosphine_former: false
      cryo_choke_risk: true
      salience_unit: g_per_t
      salience_note: ~10 g per 1-t at 10 ppm
    source_ids:
    - LODDERS2003
    - LSB1991_CH8
    - WASSONKALLEMEYN1988
    - LSB_A8_2
    - OLLILA2014
    - LODDERS2010
    - LODDERS2021
    - PALMEONEILL2014
    - LODDERSFEGLEY2023
    - HORNUNG2020
    review:
      status: reviewed
      conflict: null
      finding_ids:
      - REVIEW thermo T5/T34 (2026-07-20)
      - REVIEW speciation F8 (2026-07-20)
      - REVIEW consistency F17 (2026-07-20)
