schema_version: 1
authority: estimated
basis: passenger_sidecar
units:
  abundance: ppm_mass
  condensation_temperature: K
  boiling_point: C
plant_bins:
  C0-cleanup:
    flowsheet_node_kind: block
    flowsheet_node_id: early_bake_cleanup
    terminal: false
    status: Reviewed cleanup-stage route; target is a process block, not a static product chip.
  cryo-train:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: cryo_train
    terminal: true
    status: Reviewed cryogenic volatile collection bin; capture remains species- and host-conditioned.
  volatile-metal-trap:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: volatile_metal_trap
    terminal: true
    status: Reviewed volatile-metal trap; routes remain host- and mode-conditioned.
  alkali-cyclone:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: alkali_cyclone
    terminal: true
    status: Reviewed alkali cyclone product bin.
  ferroalloy-tap:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: ferroalloy_tap
    terminal: true
    status: Reviewed ferroalloy product bin; conditional trace capture requires a metal-bearing host.
  SiO-glass:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: sio_glass
    terminal: true
    status: Reviewed SiO glass product bin.
  Mg-crown:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: mg_crown
    terminal: true
    status: Reviewed Mg crown product bin; trace amounts remain uncertain.
  C6-tap:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: c6_magnesiothermic
    terminal: true
    status: Reviewed magnesiothermic C6 product bin; recovery remains conditional.
  Ca-crown:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: ca_crown
    terminal: true
    status: Reviewed Ca crown product bin; fractions and speciation remain uncertain.
  calciothermic:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: calciothermic
    terminal: true
    status: Reviewed calciothermic product bin; station-gated alternatives remain conditional.
  rump:
    flowsheet_node_kind: sub_box
    flowsheet_node_id: rump_product
    terminal: true
    status: Reviewed refractory rump product bin; queued Ca-route conflicts remain explicit.
