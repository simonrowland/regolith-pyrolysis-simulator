  comet_dry_refractory_dust:
    basis: dry_refractory_dust
    applicability:
    - Numbers are ppm by mass of dry dust, not whole-nucleus ppm.
    - COSIMA directly constrains major/minor elemental ratios and refractory C/N; it does not measure
      the full trace suite.
    - The factor-three CI envelope is a labeled model proxy from Hornung et al. 2020, not an element-by-element
      67P measurement.
    - Stardust Wild 2 collection can lose or redistribute volatiles; its trace results are cross-comet
      support, not a 67P substitute.
    volatile_ice_species_pointer_only:
      ownership: sibling_worker
      species:
      - H2O
      - CO
      - CO2
      - O2
      - NH3
      - HCN
      - CH3OH
      - CH4
      - H2S
      - SO2
      - OCS
      - HF
      - HCl
      - HBr
      - N2
      - Ar
      - Kr
      - Xe
      citation_pointer: RUBIN2019
      note: Do not merge these species or their abundances from this dust fragment.
