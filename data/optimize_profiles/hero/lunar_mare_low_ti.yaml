profile_id: lunar-mare-low-ti-hero-v1
profile_schema_version: profile-schema-v1
feedstock: lunar_mare_low_ti
description: Canonical continuous C2A optimizer hero at the 2200 C zirconia wall ceiling.
north_star_rationale: Optimize the completed C2A campaign sequence, trading cycle time against yield and extraction under the owner-set 300 h duration ceiling.
objective_emphasis: Pyrolysis-only Fe, SiO, alkali, and Mg yield under the zirconia furnace ceiling.
objectives:
  - metric: oxygen_kg
    sense: maximize
    units: kg
    weight: 0.168
    rationale: main stored oxidizer product
  - metric: metals_total_kg
    sense: maximize
    units: kg
    weight: 0.168
    rationale: Fe/Mg ingot proxy
  - metric: pure_silica_glass_kg
    sense: maximize
    units: kg
    weight: 0.168
    rationale: Stage 3 glass product
  - metric: industrial_mixed_glass_kg
    sense: maximize
    units: kg
    weight: 0.168
    rationale: early-tap bulk silicate product mass
  - metric: sso2_pn2_fe_drain_silica
    sense: maximize
    units: score_0_1
    weight: 0.168
    rationale: owner SSO-2 Fe-drain and Stage 3 silica certification score
  - metric: energy_electrical_plus_evaporation_kWh
    sense: minimize
    units: kWh
    weight: 0.08
    rationale: throughput cost
  - metric: throughput_cost_owner_ratify_usd
    sense: minimize
    units: USD
    weight: 0.03
    rationale: provisional hot-duct and shared-train hardware with carrier, reagent, and run-local costs
  - metric: duration_h
    sense: minimize
    units: h
    weight: 0.05
    rationale: furnace occupancy
constraints:
  gates:
    - delivered_stream_purity
    - stage4_sio_impurity
    - coating
    - extraction_completeness
    - knudsen_viscous
    - furnace_temperature
    - cycle_time
  stream_purity_min: 0.95
  enforce_delivered_stream_purity: true
  # Owner-set hard cap: green's 12 cm C6 static-hold case takes ~321 h
  # and is infeasible; the 0.5 m candidate took ~238 h.
  cycle_time_max_h: 300
  cycle_time_max_h_source: "owner 2026-11-19 (d-452)"
early_tap_mode: false
pinned_paths:
  - furnace_max_T_C
run:
  campaign: C2A
  hours: 360
  until_campaign_complete: true
  mass_kg: 1.0
  backend_name: internal-analytical
fidelities:
  internal-analytical:
    backend_name: internal-analytical
    hours: 360
    until_campaign_complete: true
  fast:
    backend_name: internal-analytical
    hours: 360
    until_campaign_complete: true
  high:
    backend_name: internal-analytical
    hours: 360
    until_campaign_complete: true
  auto:
    backend_name: internal-analytical
    hours: 360
    until_campaign_complete: true
seed_recipes:
  - id: canonical-lunar-full-yield
    source_campaign: C2A_continuous
    rationale: Canonical continuous Path A seed with the 2200 C zirconia ceiling; the runner follows the campaign sequence to its endpoint.
    patch:
      furnace_max_T_C: 2200
      condenser_geometry:
        stage_areas_m2:
          fe_stage1: 0.236
          cr_stage2: 0.050893800988154644
          alkali_stage4: 0.05099999999999999
          k_stage4b: 0.064
      campaigns:
        C2A_continuous:
          dT_dt_C_per_hr:
            early_ramp_1050_1320C: [10, 20]
          p_total_mbar: [5, 15]
          p_total_mbar_default: 10.0
