profile_id: lunar-mare-low-ti-objectives-v1
profile_schema_version: profile-schema-v1
feedstock: lunar_mare_low_ti
description: Canonical lunar happy path; full-yield continuous pyrolysis ramp with alkali shuttle, Mg recovery, and no MRE.
north_star_rationale: Clean mare basalt is the baseline pot-of-dirt case, so demonstrate pressure plus a catalog-limited thermal ramp extracting multiple products before any MRE electrolysis load.
objective_emphasis: Pyrolysis-only Fe/SiO/alkali/Mg yield under the alumina furnace ceiling.
objectives:
  - {metric: oxygen_kg, sense: maximize, units: kg, weight: 0.34, rationale: main stored oxidizer product}
  - {metric: metals_total_kg, sense: maximize, units: kg, weight: 0.28, rationale: Fe/Mg ingot proxy}
  - {metric: pure_silica_glass_kg, sense: maximize, units: kg, weight: 0.22, rationale: Stage 3 glass product}
  - {metric: energy_electrical_plus_evaporation_kWh, sense: minimize, units: kWh, weight: 0.10, rationale: throughput cost}
  - {metric: duration_h, sense: minimize, units: h, weight: 0.06, rationale: furnace occupancy}
constraints:
  gates: [delivered_stream_purity, coating, extraction_completeness, knudsen_viscous, furnace_temperature]
run: {campaign: C0, hours: 1, mass_kg: 1000.0, backend_name: internal-analytical}
fidelities:
  internal-analytical: {backend_name: internal-analytical, hours: 1}
  fast: {backend_name: internal-analytical, hours: 1}
  high: {backend_name: internal-analytical, hours: 1}
  auto: {backend_name: internal-analytical, hours: 1}
seed_recipes:
  - id: canonical-lunar-full-yield
    source_campaign: C2A_continuous
    rationale: Owner-specified canonical Path A ramp; 1843 C is dense-alumina max service, C3 inventory uses catalog bounds, and a zero C5 cap forbids MRE.
    patch:
      furnace_max_T_C: 1843
      campaigns:
        C2A_continuous:
          temp_range_C: [1050, 1843]
          dT_dt_C_per_hr:
            early_ramp_1050_1320C: [10, 20]
          p_total_mbar: [5, 15]
          p_total_mbar_default: 10.0
          duration_h: [132, 160]
          max_hold_hr: 160
        C3:
          alkali_dosing:
            Na_kg: 140.0
            K_kg: 56.0
        C4:
          temp_range_C: [1580, 1670]
        C5:
          allow_mre_voltage_cap_V: 0.0
