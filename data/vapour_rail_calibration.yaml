  may_certify: false
error_budget:
  epsilon_J: 0.3
  log10_pressure_threshold_dex: 0.11394335230683678
  algebra: "HKL at fixed alpha,T: J ∝ P ⇒ |Δlog10 J| = |Δlog10 P|; pointwise threshold = log10(1 + ε_J)"
  units: "ε_J dimensionless relative flux; threshold in log10 dex"
  limiting_check: "ε_J→0 ⇒ threshold→0; ε_J=1 ⇒ threshold=log10(2)≈0.3010 dex"
boundary_statistics_summary:
  n_faces: 0
  note: >
