# VR-10 reviewed vapour-rail calibration sidecar (runtime-safe).
#
# DESIGN-REV5 §5.3 / DECOMPOSITION VR-10:
#   - Only this reviewed YAML may enter runtime data under data/.
#   - The SQLite research store is offline-only and must never be opened
#     by runtime code (raw_store.runtime_readable: false).
#   - Warm pool only; no VapoRock result/calibration cache.
#   - Diagnostic authority: may never certify (O1 ceiling).
#   - This scaffold records frozen families, parameter caps, validation
#     splits, independent anchors, and the progressive-validation ladder.
#     No catalog row is flipped to validated here (golden-neutral).
schema_version: 1
kind: vapour_rail_calibration
calibration_id: vr10-scaffold-2026-07-31
authority: diagnostic_only
certifies: false
approval: scaffold_unpromoted
