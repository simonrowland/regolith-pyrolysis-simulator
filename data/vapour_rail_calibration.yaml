    pO2_exponent: -0.5
    max_parameters: 3
    coefficient_names: [A, B, C]
    parent_oxide: MgO
    activity_exponent: 1.0
    notes: "MgO(l) -> Mg(g) + 1/2 O2(g); d log10 P / d log10 fO2 = -1/2"
  Na:
    family_id: alkali_quarter_o2
    pO2_exponent: -0.25
    max_parameters: 3
    coefficient_names: [A, B, C]
    parent_oxide: Na2O
    activity_exponent: 0.5
    notes: "1/2 Na2O -> Na(g) + 1/4 O2; d log10 P / d log10 fO2 = -1/4"
  K:
    family_id: alkali_quarter_o2
    pO2_exponent: -0.25
    max_parameters: 3
    coefficient_names: [A, B, C]
    parent_oxide: K2O
    activity_exponent: 0.5
    notes: "1/2 K2O -> K(g) + 1/4 O2; d log10 P / d log10 fO2 = -1/4"
  O:
    family_id: monatomic_oxygen_half
    pO2_exponent: 0.5
    max_parameters: 3
    coefficient_names: [A, B, C]
    parent_oxide: null
    activity_exponent: 0.0
    notes: "1/2 O2(g) ⇌ O(g); d log10 P / d log10 fO2 = +1/2"
  O2:
    family_id: molecular_oxygen_unit
    pO2_exponent: 1.0
    max_parameters: 3
    coefficient_names: [A, B, C]
    parent_oxide: null
    activity_exponent: 0.0
    notes: "O2(g) partial tracks fO2; d log10 P / d log10 fO2 = +1"
