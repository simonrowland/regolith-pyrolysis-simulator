systematic_sio_oracle:
  status: evaluator_gap
  reason: acquisition-pending
  missing: >-
    Absolute bottom-up SiO pressure path: checked-in gas Si/SiO/O2 polynomials
    do not include the shared condensed SiO2 reservoir term needed for an
    independent absolute comparison.
  oracle_family_id: oxide_vapors_sio_family
  oracle_species_id: SiO
  systematic_species_id: null
  uncertainty_dex: 0.05
  comparison_grid:
    - {temperature_K: 1600.0, pO2_bar: 1.0e-9, activity: 0.37}
    - {temperature_K: 1800.0, pO2_bar: 1.0e-9, activity: 0.37}
    - {temperature_K: 2000.0, pO2_bar: 1.0e-9, activity: 0.37}
  required_failure_message: "investigate \u2014 do NOT tune the systematic path to match the incumbent."
  evidence_refs:
    - data/vapor_pressures.yaml#oxide_vapors_sio_family
    - docs-private/research/2026-08-03-vapour-rail-engine-crosscheck/engine_crosscheck_report.json
