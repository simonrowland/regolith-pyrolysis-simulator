        # Observed max|Δ| on enghar-matched grid after rail flip: 1.536140186984556
        # (prior Chase pin 1.4368670475601244; Δ ≈ +0.099 dex from table-assembly
        # L&H−Chase level shift, not the second-hand linear-form +0.735).
        pinned_residual_dex: 1.536140186984556
        evidence_refs:
          - docs-private/research/2026-08-03-vapour-rail-engine-crosscheck/engine_crosscheck_report.json
          - validation-data/pin-evidence/na_vaporock_lh_liquid_2026-08-08.yaml
        internal_notes_refs:
          - docs-private/research/2026-08-08-t383-build/report.md
      mass_spec:
        # DeMaria 1971 KEMS Na(g) partial-pressure series over Apollo 12
        # lunar basalt 12022/12065. pO2 recovered from the companion Table 1
        # O2 series on the same extract (unit conversion atm→bar only).
        #
        # ★ INTERPRETATION (t-743). The APPARATUS reading recorded here on
        # 2026-08-26 (commit bd01eaae) is WITHDRAWN the same day: an
        # adversarial pass whose null was "12065 is sound and the engine is
        # genuinely ~2 dex wrong" returned NULL-SUSTAINED. Evidence:
        # docs-private/reviews/2026-08-26-t743-adversarial/grok-findings.md
        # (supersedes docs-private/research/2026-08-26-na-sample-split/).
        #
        # What survives. The measured-vs-measured split is real and its
        # arithmetic reproduces exactly. At matched T = 1428.57 K, both
        # samples, same instrument:
        #   log10 p_Na(12022) - log10 p_Na(12065)
        #     = -6.05 - (-7.55)              = 1.500 dex   (31.62x)
        #   Na2O mole-fraction (Henry) term  = 0.125 dex   (0.36/0.27 wt%)
        #   Table-1 pO2 term, p^(-1/4):
        #     -(1/4) * log10(5.54e-9/3.78e-9) = -0.042 dex (WRONG sign)
        #   residual after both               = 1.417 dex   (26.1x)
        # Digitisation is not a decade slip: an independent readout of the
        # printed Fig. 1 and the MinerU scatter OCR both place the 7.00
        # abscissa pair at ~-6.05 / ~-7.55.
        #
        # ★ What was WRONG. That 1.417 dex was called "unexplained by
        # composition", but the 0.125 dex Henry term is the ONLY composition
        # term this engine can express: the runtime vapour path is constant
        # gamma (a = gamma * X, gamma_NaO0.5 = 1e-3), so by construction its
        # answer is Henry x pO2^(-1/4) and nothing else. "The engine differs
        # by exactly 1.21x" is that tautology restated, not a finding that
        # melt chemistry is dead. Given a composition-dependent activity
        # model and the REAL bulk analyses, IMCC-SF04 gives an a(Na2O) ratio
        # of 1.21 dex at 1429 K (extrapolated, sub-liquidus) and 1.06 dex at
        # 1800 K (in domain) — cutting the residual from 1.417 dex to
        # ~0.3-0.4 dex, inside the authors' own factor-of-2 plus digitisation
        # sigma.
        #
        # ★ The two samples are not resolved the same way, so the comparison
        # was never composition-vs-composition (b-249, verified in-repo):
        #   - 12065 carries a real cited suite on the extract
        #     (sample_oxide_composition_wt_pct, Wolf/VapoRock Table 2 =
        #     Maxwell & Wiik 1971): Al2O3 10.05, TiO2 3.34, MgO 7.82.
        #   - 12022 carries NO suite. Its own composition_source says the
        #     full oxide suite is "reported elsewhere (Smales 1971)" and
        #     was not extracted, so _melt_recipe_mol() in
        #     simulator/diagnostic_helpers/extract_reproduction.py falls back
        #     to data/feedstocks.yaml::lunar_mare_low_ti (Al2O3 13.5,
        #     TiO2 1.5, MgO 9.0) with a Na2O/K2O overlay.
        # So the battery compares a REAL 12065 analysis against a GENERIC
        # low-Ti mare proxy, and reports the difference as chemistry. Worse,
        # the proxy reverses the sign of both majors that drive the alkali
        # activity lever: real 12022 is LOWER Al2O3 and HIGHER TiO2 than
        # 12065 (ilmenite / olivine-ilmenite basalt vs pigeonite basalt),
        # while the proxy is higher Al2O3 and lower TiO2. No external source
        # is needed to see the second half: our own 12065 extract says
        # TiO2 = 3.34 wt%, and the proxy we hand its Apollo 12 twin says
        # 1.5 — a 2.2x disagreement inside one comparison. The resolver does
        # emit its provenance string, so the asymmetry is discoverable in the
        # artifact; it simply was not read before a physics conclusion was
        # drawn across it.
        #
        # ★ Smales et al. 1971 (Proc. Lunar Sci. Conf. 2, Table 2 p. 1254,
        # filed at docs/references/pdfs/99-kems-langmuir/smales-1971-lpsc-12022.pdf)
        # supplies the real 12022 suite and settles it. Signed differences
        # (12022 minus 12065, wt%), real pair vs what the proxy asserts:
        #   oxide   real      proxy     verdict
        #   SiO2    -4.57     -2.37     sign ok, magnitude halved
        #   TiO2    +1.56     -1.84     SIGN REVERSED
        #   Al2O3   -1.85     +3.45     SIGN REVERSED
        #   FeO     +1.84     -3.26     SIGN REVERSED
        #   CaO     -1.73     +0.27     SIGN REVERSED
        #   MnO     +0.05     -0.06     SIGN REVERSED
        #   MgO     +4.08     +1.18     sign ok, understated 3.5x
        # Five of seven majors point the WRONG WAY, including both levers
        # (Al2O3, TiO2) that set melt polymerisation and hence alkali
        # activity. The proxy did not blur the composition difference; it
        # inverted it.
        #
        # ★★ And the Henry term itself is source-dependent at a magnitude
        # that exceeds the term. DeMaria's own text gives Na2O = 0.36 wt%
        # for their split 12022,57; Smales Table 2 gives 0.23 wt% for 12022:
        #   log10(0.36/0.27) = +0.124939 dex   <- the number pinned here
        #   log10(0.23/0.27) = -0.069636 dex   <- opposite sign
        #   |log10(0.36/0.23)| = 0.195 dex     <- inter-source spread
        # So the term used to rule composition OUT (0.125 dex) is smaller
        # than the disagreement between two primary analyses of the same
        # rock (0.195 dex), and its sign is not even determined. Whether
        # that is split-to-split heterogeneity or an analytical difference
        # is open; either way it is not a basis for a conclusion. Same
        # pattern on K2O: Henry is -0.031 dex on DeMaria's 0.068 and
        # -0.078 dex on Smales' 0.061.
        #
        # ★ K is NOT an independent witness. Na and K draw on the same free
        # oxide / NBO pool, so any real melt-side effect must appear on both;
        # a shared-mechanism observation cannot corroborate the mechanism.
        # IMCC in fact UNDER-predicts the K split (0.47-0.59 dex vs ~1.5 dex
        # visual). That is an open hole in the melt-chemistry account, not
        # evidence for apparatus.
        #
        # ★ The authors did not licence discarding the y-axis. They excepted
        # Na and K from the factor-of-2 calibration bound because the split
        # was TOO LARGE to be absorbed by calibration — i.e. they treated it
        # as real.
        #
        # ★ b-247 (non-additivity) fired here too: an Al2O3-only swap moves
        # a(Na2O) by 0.05-0.16 dex, while the JOINT Si+Mg+Fe+Ti+Al difference
        # supplies 1.06-1.21 dex. Summing one-at-a-time sensitivities is what
        # made composition look dead.
        #
        # RULING: 12065 KEEPS CONSTRAINING the Na rail. The 2.044 dex pin is
        # a real model error on a real measurement, dominated by the
        # constant-gamma activity treatment rather than by Pref. Do not
        # de-weight 12065, do not re-baseline, do not retune: a filter that
        # removes exactly the sample making the model look worst is
        # residual-driven, unlike the a priori form/class/assumed-input
        # guards, every one of which has so far tightened or held the
        # residual.
        # Class = silicate_melt. Form is untyped on the extract (paper does
        # not tabulate solidus/liquidus); the psat path does not apply the
        # α form gate. Residual IS the result: max 2.043550129219774 dex at
        # 12065 T=1324.5 K. Not tuned. Sossi 2019 Na withdrawal 2026-08-11
        # (gamma-derived inference + alpha_e=1 analytical ceiling) is a
        # different measurement and remains withdrawn.
        pinned_residual_dex: 2.043550129219774
        evidence_refs:
          - tests/chemistry/extract_store_reproduction_residual_baselines.yaml
          - docs/model-limitations.md#extract-store-reproduction-battery
        internal_notes_refs:
          - docs-private/research/2026-08-26-demaria-po2/findings.md
          - docs-private/reviews/2026-08-26-t743-adversarial/grok-findings.md
      # Sossi mass_spec remains withdrawn 2026-08-11 (evidence recovery): the
      # surviving Sossi Na records are a disagreeing gamma-derived 0.3-1.7
      # inference and a separately adopted physical/analytical ceiling
      # alpha_e <= 1. Neither is a measured coefficient. They remain visible
      # as typed non-comparable/status-bearing evidence. See
      # validation-data/pin-evidence/na_mass_spec_analytical_ceiling_withdrawal_2026-08-11.yaml
  Na2:
    tier: T1
    target_tier: T4
    validations:
      structural:
        # b-151 (2026-08-08): base_reference retargeted from retired
        # pseudo_psat (A=5.18586/B=11127.434869/C=1000) to monatomic L&H
        # liquid-NaO0.5 Pref (A=11.342243/B=12140.316409/C=-163.701). Numeric
        # unit-activity probes pin the post-fix catalog so a silent base
        # regression cannot hide. Values are honest current-state (not tuned).
        # Probe: source_activity=1.0, pO2_bar=1.0, CompiledPressureEvaluator.
        # SIGN: P_after/P_before ≈ +1.95…+6.26 dex over 1400–1950 K (base^2).
        # Domain: composite valid_domain [1400,1900]; 1950 K pin is status-bearing
        # OOR continuation (not in-domain). L&H base fit certified [1405,1600];
        # beyond that is MARKED EXTRAPOLATION (≤0.055 dex base incoherence @2073 K).
        unit_activity_probe:
          activity: 1.0
          pO2_bar: 1.0
          points:
            - T_K: 1400.0
              pinned_pressure_Pa: 3.969350e-04
            - T_K: 1673.0
              pinned_pressure_Pa: 4.847203e-01
            - T_K: 1900.0
              pinned_pressure_Pa: 3.143731e+01
            - T_K: 1950.0
              pinned_pressure_Pa: 6.807954e+01
          base_reference_coefficients:
            A: 11.342243
            B: 12140.316409
            C: -163.701
