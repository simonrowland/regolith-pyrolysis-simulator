    # 2026-08-11: demoted T3 -> T2 when the non-measurement Sossi
    # mass_spec residual pin was withdrawn. VapoRock external evidence remains.
    # 2026-08-26: re-promoted T2 -> T3 on DeMaria 1971 KEMS lunar-basalt Na
    # psat with Table 1 co-measured p(O2). The Sossi gamma / alpha_e=1
    # withdrawal is a different measurement and STAYS withdrawn.
    tier: T3
    target_tier: T4
    validations:
      vaporock:
        # t-383: L&H liquid-NaO0.5 Pref replaces Chase gas_standard_fugacity.
        # Residual vs VapoRock peer WORSENS (REPORT-ONLY, framework §6.3 / ADR-001);
