schema_version: 1
kind: vapour_rail_validation_pins
description: >-
  Residual ceilings seeded from the current mass-spec reproduction and VapoRock
  engine-crosscheck harnesses. A residual above its pin is a regression; a
  residual more than margin_dex below its pin is a stale pin that must tighten.
policy:
  metric: max_absolute_residual_dex
  margin_dex: 0.01
  target_tier: T4
  loosening: >-
    A larger pin is an owner-reviewable data-file diff; tests never widen a pin
    automatically.
demand_manifest_ratchet:
  minimum_elements: 19
  minimum_carriers: 102
  minimum_pairs: 128
  minimum_catalog_linked_pairs: 76
  note: >-
    Reviewable lower bounds prevent catalog or source-census deletion from
    becoming green merely by regenerating the manifest.
conformance:
  live_pair_floor: 10
  note: Pinned non-gap-gated (element, carrier) cases; prevents a vacuous green suite.
internal_sensibility:
  tier: T1
  delta_h_vap_kJ_mol: [50.0, 1000.0]
  pure_component_species: [Fe, KCl, Na, NaCl]
  temperature_monotone: increasing
  y_zero_ratio: 1.0
  note: >-
    T1 is a necessary internal-consistency floor and NEVER validates a species;
    applying a vapourization-enthalpy bound to a standard-reaction pressure is
    dimensionally the wrong branch (b-134 self-agreement trap).
species:
