      basis: "CM bulk carbon is organic-dominated; Murchison bulk C is 2.25 +/- 0.09 wt%; 2.8393 wt% generic organic template plus 1.2 wt% carbonate_salts gives the declared pre-normalized central value, then runtime ledger-normalizes the 92.7893 wt% source sum to batch mass."
