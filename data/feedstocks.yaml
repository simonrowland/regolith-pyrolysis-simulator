      template_formula: generic_carbonaceous_organic
      decomposition_temp_range_C: [200, 800]
      final_temp_C: 1050
      cap_kg_per_tonne: [15, 30]
      offgas_mode: complete_oxidation
      oxygen_source: controlled_stage0_O2
      source: "REF-025 Pearson et al. 2006 + Smith & Kaplan 1970 constrain CM organic matter to 2.0 wt% [1.5, 3.5]; generic C/H/O/N inventory is a process surrogate for oxidative cleanup."
  anhydrous_silicate_after_degassing:
    note: "Similar to CI but slightly higher SiO2, lower FeO"
    composition_wt_pct:
      SiO2:  38.0
      FeO:   28.0
      MgO:   24.0
      Al2O3:  2.5
      CaO:    2.5
      NiO:    2.0
    composition_ranges:
      SiO2:  [34, 42]   # estimated; slightly higher than CI
      FeO:   [23, 33]    # estimated; slightly lower than CI
      MgO:   [22, 26]
      Al2O3: [2, 3]
      CaO:   [1.5, 3.5]
      NiO:   [1.5, 2.5]
    sum_check: 97.0  # estimated
  key_feature: "Less hydrated CI analog; 6-12% structural H2O vs 10-20% for CI"
  preferred_for: "Moderate water + metals; post-C0 processing identical to CI"
  process_notes: "C1-C6 identical to CI baseline. Less volatile recovery than CI but easier thermal management."

ceres_regolith:
  label: "Ceres Regolith"
  source: "FAMILY-REPRESENTATIVE MODELED COMPOSITION (not a cited table); context basis: Dawn VIR/GRaND global mapping + 2025 brine/habitability reanalyses"
  confidence: "Very High"
  note: >
    Evolved icy carbonaceous dwarf-planet regolith (NH4-clays + brine salts).
    Extends CI carbonaceous chondrite model. Post-C0 silicate processing
    (C1-C6) identical to CI baseline but slightly Mg-richer.
    Bulk oxide values estimated from CI baseline + Dawn observational
    constraints (enhanced carbonates, NH4-clays).
  composition_wt_pct:
    SiO2:  24.0
    FeO:   24.0
    MgO:   20.0    # slightly Mg-richer than CI
    Al2O3:  2.0
    CaO:    2.0
    Na2O:   0.75
    NiO:    1.5
    H2O:   20.0    # ice + structural; poles/bright spots much higher
    carbonaceous_organic: 1.0  # true organics only; Ernutet enrichments are not global average
    carbonate_salts: 3.0  # Mg/Ca carbonate mineral mass; local Na-carbonate faculae are separate
    NH3:    1.2     # ammoniated phyllosilicate degas proxy; mineral phase mass declared below
    S:      3.5
  composition_ranges:
    H2O_ice_structural_kg_per_tonne: [120, 280]
    carbonaceous_organic_wt_pct: [0.5, 1.5]
    carbonate_salts: [2.0, 4.5]
    NH3: [0.8, 2.0]
    brine_salts_wt_pct: [0.5, 2.0]
    nh4_phyllosilicate_wt_pct: [5, 12]
  sum_check: 102.95  # corrected organic/carbonate/NH3 raw keys; NH4 phase + brine are declaration-only carriers pending exact formulas
  carbon_speciation_provenance:
    carbonaceous_organic:
      value_wt_pct: 1.0
      interval_wt_pct: [0.5, 1.5]
      source: "REF-008 De Sanctis M.C. et al. 2017, Science 355:719-722, DOI 10.1126/science.aaj2305."
      basis: "Global organics are <=1 wt%; Ernutet 4-9 wt% organics are localized and not a global reservoir."
    carbonate_salts:
      value_wt_pct: 3.0
      interval_wt_pct: [2.0, 4.5]
      source: "REF-009 De Sanctis M.C. et al. 2018, M&PS 53:1844-1858, DOI 10.1111/maps.13104; McSween H.Y. et al. 2018, M&PS 53:1793-1804, DOI 10.1111/maps.12947."
      basis: "Dawn spectral fits center about 2-3.6 wt% dolomite with advanced alteration supporting the upper half of 2-5 wt%."
    NH3:
      value_wt_pct: 1.2
      interval_wt_pct: [0.8, 2.0]
      source: "REF-006 De Sanctis M.C. et al. 2015, Nature 526:108, DOI 10.1038/nature16172; Ammannito E. et al. 2016, Science 353:aaf4279, DOI 10.1126/science.aaf4279."
      basis: "NH3 key is a degas proxy, not full NH4-phyllosilicate mineral mass."
    brine_salts:
      allocated_wt_pct: 1.0
      interval_wt_pct: [0.5, 2.0]
      source: "REF-009 Castillo-Rogez J.C. et al. 2020, Astrobiology 20:269; De Sanctis M.C. et al. 2018, M&PS 53:1844-1858."
      basis: "Weakly grounded Ceres brine/hydrated salts; kept declaration-only until NaCl/MgSO4/Na-carbonate split is exact."
    nh4_phyllosilicate:
      phase_wt_pct: 8.0
      interval_wt_pct: [5, 12]
      source: "REF-006 REF-009 De Sanctis M.C. et al. 2015, Nature 526:108; Ammannito E. et al. 2016, Science 353:aaf4279; De Sanctis M.C. et al. 2018, M&PS 53:1844-1858."
      basis: "N-bearing ammoniated phyllosilicate phase, explicitly not a carbon carrier."
  stage0_carrier_keys:
    carbonate:
      composition_key: carbonate_salts
      reaction_family: carbonate_decomposition
      stage0_components_set: STAGE0_CARBONATE_COMPONENTS
      not_speciated: true
      carbonate_c_share: interval
      level_range_wt_pct: [2.0, 4.5]
      sources:
        - "De Sanctis et al. 2018"
        - "McSween et al. 2018"
    nh4_clay:
      composition_key: NH3
      reaction_family: complete_oxidation
      stage0_components_set: STAGE0_GAS_COMPONENTS
      partly_grounded: true
      level_range_wt_pct: [0.8, 2.0]
      sources:
        - "De Sanctis et al. 2015"
        - "Ammannito et al. 2016"
    nh4_phyllosilicate:
      composition_key: NH3
      reaction_family: declaration_only
      stage0_components_set: STAGE0_GAS_COMPONENTS
      partly_grounded: true
      allocated_wt_pct: 8.0
      runtime_feedstock_mass_included: false
      level_range_wt_pct: [5.0, 12.0]
      note: >
        Full NH4-phyllosilicate mineral mass is declaration-only carrier
        metadata and is excluded from ledger-normalized raw feedstock until the
        ammoniated-clay formula/occupancy is grounded. The raw composition key
        remains NH3 degas-equivalent.
      sources:
        - "De Sanctis et al. 2015"
        - "Ammannito et al. 2016"
        - "De Sanctis et al. 2018"
    brine_salts:
      composition_keys: [NaCl, MgSO4]
      reaction_family: volatilization
      stage0_components_set: STAGE0_CHLORIDE_SALT_COMPONENTS
      partly_grounded: true
      not_speciated: true
      interval_required: true
      allocated_wt_pct: 1.0
      runtime_feedstock_mass_included: false
      level_range_wt_pct: [0.5, 2.0]
      note: >
        Carrier key for OD-6 binding; brine mass no longer sits in
        carbonaceous_organic, but raw NaCl/MgSO4/Na-carbonate composition remains
        declaration-only until the split is grounded.
      sources:
        - "Castillo-Rogez et al. 2020"
        - "De Sanctis et al. 2018"
  stage0_profile: "carbonaceous_degas_cleanup"
  stage0_temp_range_C: [20, 1050]
  stage0_formula_inventory:
    carbonaceous_organic:
      template_formula: generic_carbonaceous_organic
      decomposition_temp_range_C: [200, 800]
      final_temp_C: 1050
      cap_kg_per_tonne: [5, 15]
      offgas_mode: complete_oxidation
      oxygen_source: controlled_stage0_O2
      source: "REF-008 De Sanctis et al. 2017 constrains Ceres global organics to <=1 wt%; generic C/H/O/N inventory is a process surrogate for oxidative cleanup."
  anhydrous_silicate_after_degassing:
    note: "Identical to CI (SiO2 32-40, FeO 25-35, MgO 22-26) but slightly Mg-richer"
    composition_wt_pct:
      SiO2:  36.0
      FeO:   30.0
      MgO:   25.0    # slightly Mg-richer than CI
      Al2O3:  2.5
      CaO:    2.25
      NiO:    2.0
    composition_ranges:
      SiO2:  [32, 40]
      FeO:   [25, 35]
      MgO:   [23, 27]   # slightly Mg-richer
      Al2O3: [2, 3]
      CaO:   [1.5, 3]
      NiO:   [1.5, 2.5]
    sum_check: 97.75
  key_minerals: "Mg-phyllosilicates, global ammoniated phyllosilicates (NH4-clays), Mg/Ca/Na carbonates, brine salts"
  potential_products:
    H2O_kg_per_tonne: [120, 250]
    NH3_kg_per_tonne: [8, 25]
    carbonate_salts_kg_per_tonne: [20, 45]   # Mg/Ca carbonates; local Na-carbonate faculae excluded
  key_feature: "Ammonia-rich + brine-derived salts; highest-accessibility water factory in main belt"
  preferred_for: "Water + NH3 propellant/life-support + fertiliser salts + Mg shuttle bootstrapping"
  process_notes: >
    Extended staged C0 (6-15 h): organics/NH3 release 200-500C, phyllosilicate
    dehydroxylation 400-700C, carbonate decomposition 600-850C, sulfide +
    conditioning O2 blow 1000-1050C. Add NH3 trap (200-400C) + enhanced
    carbonate/CO2 handling. Immediate Mg surplus (batch-1 bootstrapping).
    Centigravity environment (0.029 g) simplifies mining vs micro-g bodies.

comet_nucleus:
  label: "Comet Nucleus (Jupiter-Family)"
  source: "FAMILY-REPRESENTATIVE MODELED COMPOSITION (not a cited table); context basis: Rosetta/67P + other Jupiter-family comets; primitive outer-solar-system analogs"
  confidence: "High"
  note: >
    Volatile-extreme CI with massive supervolatiles. Dust-to-ice ratio
    4-10:1 (porous nucleus ~75% void). Post-C0 silicate identical to CI.
    Bulk composition is dominated by volatiles.
  composition_wt_pct:
    SiO2:  12.60    # scaled refractory mineral dust; see carbon_speciation_provenance
    FeO:   12.60
    MgO:   10.08
    Al2O3:  0.95
    CaO:    0.95
    Na2O:   0.32
    NiO:    0.75
    H2O:   12.50    # Fulle 2016 refractory:H2O central ratio after volatile-C sidecars
    CO_CO2: 10.0    # 50-150 kg/t
    organics: 33.75 # 45% of refractory dust; nucleus-bulk value after CO/CO2 sidecars
    CH4_NH3_HCN: 2.5
    S:      3.0
  composition_ranges:
    H2O_kg_per_tonne: [100, 180]
    CO_CO2_kg_per_tonne: [50, 150]
    organics_hydrocarbons_kg_per_tonne: [320, 400]
    refractory_dust_organic_wt_pct: [40, 50]
    nucleus_bulk_refractory_organic_wt_pct: [32, 40]
    refractory_to_water_mass_ratio: [4, 8]
    CH4_NH3_HCN_kg_per_tonne: [10, 40]
    S_kg_per_tonne: [20, 40]
  sum_check: 100.00  # central 67P dust+ice+volatile-C composition closes by construction
  carbon_speciation_provenance:
    organics:
      value_wt_pct: 33.75
      refractory_dust_interval_wt_pct: [40, 50]
      nucleus_bulk_interval_wt_pct: [32, 40]
      source: "REF-030 REF-011 Bardyn A. et al. 2017, MNRAS 469:S712-S722; Bardyn A. et al. 2016, Nature 533:73, DOI 10.1038/nature19320; Fulle M. et al. 2016, ApJ 821:19, DOI 10.3847/0004-637X/821/1/19."
      basis: "COSIMA dust is about 45 wt% organic matter; Fulle refractory:H2O ratio near 6 gives a nucleus-bulk organic interval, here normalized with existing 10 wt% CO/CO2 and 2.5 wt% CH4/NH3/HCN sidecars."
    mineral_rebalance:
      refractory_mineral_plus_s_wt_pct: 41.25
      source: "REF-030 Bardyn A. et al. 2017, MNRAS 469:S712-S722."
      basis: "Remaining 55 wt% refractory dust is non-organic mineral/sulfur; oxide split preserves prior surrogate relative proportions."
  stage0_profile: "carbonaceous_degas_cleanup"
  stage0_temp_range_C: [20, 1050]
  stage0_formula_inventory:
    CO_CO2:
      atoms:
        C: 2
        O: 3
      decomposition_temp_range_C: [100, 300]
      final_temp_C: 1050
      cap_kg_per_tonne: [50, 150]
      offgas_mode: native_mixture
      source: "MODELED BUCKET (not a cited table); equal-molar CO/CO2 volatile bucket from comet nucleus source range."
    organics:
      template_formula: generic_carbonaceous_organic
      decomposition_temp_range_C: [200, 500]
      final_temp_C: 1050
      cap_kg_per_tonne: [320, 400]
      offgas_mode: complete_oxidation
      oxygen_source: controlled_stage0_O2
      source: "REF-030 Bardyn et al. 2017 COSIMA dust organic matter (40-50 wt% refractory dust) + Fulle et al. 2016 refractory:H2O ratio; generic C/H/O/N mass fractions remain a process surrogate."
    CH4_NH3_HCN:
      atoms:
        C: 2
        H: 8
        N: 2
      decomposition_temp_range_C: [100, 300]
      final_temp_C: 1050
      cap_kg_per_tonne: [10, 40]
      offgas_mode: native_mixture
      source: "MODELED BUCKET (not a cited table); equal-molar CH4/NH3/HCN supervolatile bucket from comet nucleus source range."
    CO_CH4_propellant:
      atoms:
        C: 2
        H: 4
        O: 1
      decomposition_temp_range_C: [100, 300]
      final_temp_C: 1050
      cap_kg_per_tonne: [60, 180]
      offgas_mode: native_mixture
      source: "MODELED BUCKET (not a cited table); equal-molar CO/CH4 propellant bucket from comet nucleus product range."
    NH3_HCN:
      atoms:
        C: 1
        H: 4
        N: 2
      decomposition_temp_range_C: [150, 300]
      final_temp_C: 1050
      cap_kg_per_tonne: [10, 30]
      offgas_mode: native_mixture
      source: "MODELED BUCKET (not a cited table); equal-molar NH3/HCN scrubber bucket from comet nucleus product range."
  anhydrous_silicate_after_degassing:
    note: "Identical to CI (SiO2 32-40, FeO 25-35, MgO 22-26)"
    composition_wt_pct:
      SiO2:  36.0
      FeO:   30.0
      MgO:   24.0
      Al2O3:  2.5
      CaO:    2.25
      NiO:    2.0
    composition_ranges:
      SiO2:  [32, 40]
      FeO:   [25, 35]
      MgO:   [22, 26]
      Al2O3: [2, 3]
      CaO:   [1.5, 3]
      NiO:   [1.5, 2.5]
    sum_check: 96.75
  potential_products:
    H2O_kg_per_tonne: [200, 350]
    CO_CH4_propellant_kg_per_tonne: [60, 180]
    NH3_HCN_kg_per_tonne: [10, 30]
  key_feature: "Massive propellant factory (CO, CH4, H2O, NH3) + same metals as CI"
  preferred_for: "Outer-belt/icy-body ISRU: propellant + life-support + Mg shuttle"
  process_notes: >
    Extreme staged degassing C0 (10-20+ h): 100-300C (supervolatiles + organics),
    400-700C (H2O), 500-900C (sulfides), 600-800C (carbonates), 1000-1050C
    (conditioning O2 blow). Add CO/CH4 cold-traps (100-200C), NH3/HCN scrubber
    (150-300C), enhanced SO2 sorbent. Micro-g wicking/centrifugal condensers
    mandatory. Safety: staged ramp critical to avoid pressure spikes in porous
    nucleus material.

# ---------------------------------------------------------------------------
# MARS FEEDSTOCKS
# ---------------------------------------------------------------------------
# Mars feedstocks include SO3, Cl, ClO4 as additional components (sulfates,
# halides, perchlorates) not present in lunar/asteroid compositions.
# All Mars feedstocks operate under ~6 mbar CO2 atmosphere (no deep vacuum).

# buy: https://spaceresourcetech.com/collections/regolith-simulants
# source: Long-Fox et al. 2023 Frontiers in Space Technologies Table 2 XRF for MGS-1 base; Costa et al. 2024 TiO2 cross-check.
mars_global_mgs1:
  name: "MGS-1 Mars global simulant"
  label: "MGS-1 Mars Global Simulant (SRT/Exolith)"
  class: mars_simulant
  stage0_profile: "bulk_preservation"
  source: "Space Resource Technologies (Exolith Lab spin-off) MGS-1; targets average Mars global surface regolith"
  confidence: "High for captured major oxides; Mars volatile salts must be lot/variant-specific"
  note: >
    Source-captured MGS-1 base simulant composition. Mars sulfate, chloride,
    and perchlorate inventories are variant/lot-specific and explicitly
    not_reported here rather than inferred. Use MGS-1S/MGS-1C/JEZ-1 variants
    only after their full source tables are captured. Simulant, not real Mars
    soil: nanophase iron oxides, perchlorates, and hydrated phases are not
    automatically represented by this base XRF subset.
  # Long-Fox et al. 2023 Table 2 MGS-1 oxide subset sums to 89.59 wt%.
  # Composition below is declared on a 100 wt% anhydrous/volatile-free basis;
  # sulfur, halides, perchlorates, salts, and sulfides remain not_reported per lot.
  # TODO(vpr-p4): capture lot-variant volatile sidecar before enabling Mars volatile chemistry.
  composition_wt_pct:
    SiO2:  49.00
    TiO2:   0.51
    Al2O3: 11.63
    FeO:   11.83
    MgO:   16.53
    CaO:    8.83
    Na2O:   1.67
  sum_check: 100.00
  composition_basis:
    mode: "declared_anhydrous_volatile_free_normalized"
    source_oxide_subset_wt_pct: 89.59
    normalized_sum_check_wt_pct: 100.0
    excluded_classes: [sulfur, halides, perchlorates, salts, sulfides]
    citation: "Long-Fox J.M. et al. 2023, Frontiers in Space Technologies, Table 2 XRF for MGS-1."
  glass_fraction:
    value: "not_reported"
    note: "MGS-1 captured sources do not report glass fraction."
  stage0_buckets:
    h2o_wt_pct: "not_reported"
    organics_wt_pct: 0.0
    carbon_wt_pct: 0.0
    sulfur_wt_pct: "not_reported"
    halides_wt_pct: "not_reported"
    perchlorates_wt_pct: "not_reported"
    salts_wt_pct: "not_reported"
    native_metals_wt_pct: 0.0
    sulfides_wt_pct: "not_reported"
    refractory_trace_wt_pct: "not_reported"
  provenance:
    composition_citation: "Long-Fox J.M. et al. 2023, Frontiers in Space Technologies, Table 2 XRF for MGS-1; Costa et al. 2024 analytical cross-check for TiO2 0.46."
    composition_digest: "sha256:d58159a7b69bcc9c"
    lot_or_batch: "not_reported; request current-lot XRF from SRT"
    buy_url: "https://spaceresourcetech.com/collections/regolith-simulants"
    buy_url_checked: "2026-06-11"
  simulant_vs_real_caveat:
    report_placement: "measurement_sidecar"
    text: "MGS-1 is a Mars simulant, not real Mars regolith; nanophase Fe oxides, hydrated phases, perchlorates, and sulfate/halide salts require explicit sidecar data."
  environment:
    surface_pressure_mbar: 6
    atmosphere: "96% CO2"
    constraint: "Mars material is not processed as hard-vacuum regolith"
  key_feature: "Mars global average simulant with elevated Mg and explicit missing volatile-salt metadata"
  preferred_for: "Mars ISRU baseline after variant/lot volatile salts are supplied"
  process_notes: "Loadable for oxide-only comparisons; not experiment-grade for Mars volatile chemistry without sidecar salts/perchlorates."

mars_basalt:
  label: "Mars Basalt (General)"
  stage0_profile: "mars_carbon_cleanup"
  stage0_carrier_keys:
    carbonate:
      composition_key: carbonate_salts
      reaction_family: carbonate_decomposition
      stage0_components_set: STAGE0_CARBONATE_COMPONENTS
      interval_required: true
      not_speciated: true
      level_range_wt_pct: [2.0, 5.0]
      sources:
        - "Bandfield et al. 2003"
    sulfate_decomp:
      composition_key: SO3
      reaction_family: sulfate_decomp
      onset_C: 1200
      mixed_cation_onset: true
      regime_caveat: >
        Models mixed Mars sulfate via bulk SO3 with CaSO4-like ~1200 C onset;
        real Meridiani Fe-sulfate is jarosite KFe3(SO4)2(OH)6 (carries structural
        OH + K) - H2O/K2O release not modeled; FeSO4 early-clear physics deferred.
      sources:
        - "Squyres 2004"
        - "Yen 2005"
        - "Kanari 2018"
  stage0_carbon_cleanup:
    carbon_reductant_kg_per_tonne: [20, 40]
    reactions:
      - sulfate_so3_to_so2_co
      - co2_boudouard_to_co
  stage0_perchlorate_cleanup:
    reactions:
      - perchlorate_to_chloride_o2
  source: "FAMILY-REPRESENTATIVE MODELED COMPOSITION (not a cited table); context basis: Curiosity/Spirit/Opportunity APXS; Phoenix lander"
  confidence: "High"
  note: >
    Thousands of APXS analyses across 4 sites; +-1-2 wt% major oxides.
    Includes SO3 and Cl as components (sulfate-bearing soil). FeO_total
    includes both FeO and Fe2O3. Sum ~102.1 wt%  --  slight overshoot from
    independent range midpoints; within analytical uncertainty.
  composition_wt_pct:
    SiO2:  45.5
    TiO2:   1.0
    Al2O3: 10.5
    FeO:   18.0     # FeO + Fe2O3 total
    MgO:    8.5
    CaO:    7.0
    Na2O:   3.0
    K2O:    0.50
    SO3:    6.0
    carbonate_salts: 3.0
    Cl:     0.70
    P2O5:   0.85
    ClO4:   0.50    # perchlorates (polar soil)
  composition_ranges:
    SiO2:  [43, 48]
    TiO2:  [0.8, 1.2]
    Al2O3: [9, 12]
    FeO:   [16, 20]
    MgO:   [7, 10]
    CaO:   [6, 8]
    Na2O:  [2.5, 3.5]
    K2O:   [0.4, 0.6]
    SO3:   [5, 7]
    carbonate_salts: [2, 5]
    Cl:    [0.6, 0.8]
    P2O5:  [0.7, 1.0]
    ClO4:  [0.4, 0.6]
  sum_check: 105.05
  native_carbonate_provenance:
    carbonate_salts:
      value_wt_pct: 3.0
      interval_wt_pct: [2.0, 5.0]
      source: "REF-029 Bandfield J.L., Glotch T.D. & Christensen P.R. 2003, Science 301:1084-1087, DOI 10.1126/science.1088054."
      basis: "Mars high-albedo dust carries 2-5 wt% magnesite-dominated carbonate; process reductant carbon remains separate."
  bound_water_provenance:
    H2O_bound:
      value_wt_pct: 2.0
      interval_wt_pct: [1.5, 3.0]
      source: "Leshin L.A. et al. 2013, Science 341, DOI 10.1126/science.1238937 (Rocknest fines, MSL SAM EGA)."
      basis: "Adsorbed/bound H2O in global-dust-derived fines. INVENTORY-ONLY (FB-33, adopted 2026-07-07, t-052): NOT in composition_wt_pct -- adding it changes mass balance and is the golden-affecting kernel-wiring step."
  environment:
    surface_pressure_mbar: 6    # range 0.7 (Olympus Mons) to 11 (Hellas)
    atmosphere: "96% CO2"
    constraint: "no deep vacuum possible"
    advantage: "free CO2 carrier gas; CO2 dissociation -> natural pO2 source"
  potential_products:
    NaCl_KCl_salts_kg_per_tonne: [6, 10]
    sulfuric_acid_feedstock_kg_per_tonne: [25, 35]
    CO_propellant: "from CO2 dissociation + Boudouard"
  key_feature: "Na2O 5-10x lunar; K2O 5-10x lunar; SO3 ~6%; Cl-bearing"
  preferred_for: "General Mars ISRU baseline; Fe/O2/Na/K production"
  process_notes: >
    C1/C2 merged: single continuous ramp under flowing CO2. Carbon pre-reduction:
    C rod injection at 600-1050C for sulfate decomposition (20-40 kg C/t).
    Condensation train additions: halide trap (650-900C), SO2 sorbent (400-500C),
    HCl/HF scrubber (200-350C), CO2/CO separator.

