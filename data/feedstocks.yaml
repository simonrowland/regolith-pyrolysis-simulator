      source: "REF-026 REF-025 Bland P.A. et al. 2004, M&PS 39:3-16; Pearson V.K. et al. 2006, M&PS 41:1899-1918; Zolensky M.E. et al. 2002, M&PS 37:737-761."
      basis: "Murchison modal calcite is about 1.1 wt%; carbonate-rich Tagish-like lithologies are excluded from default CM."
    implied_bulk_c_wt_pct: 2.25
  stage0_carrier_keys:
    carbonate:
      composition_key: carbonate_salts
      reaction_family: carbonate_decomposition
      stage0_components_set: STAGE0_CARBONATE_COMPONENTS
      interval_required: true
      not_speciated: true
      level_range_wt_pct: [0.8, 2.5]
      sources:
        - "Bland et al. 2004"
        - "Pearson et al. 2006"
  stage0_profile: "carbonaceous_degas_cleanup"
  stage0_temp_range_C: [20, 1050]
  stage0_formula_inventory:
