      - co2_boudouard_to_co
  source: "FAMILY-REPRESENTATIVE MODELED COMPOSITION (not a cited table); context basis: Meridiani Planum soils, Vera Rubin Ridge margins, polar/sedimentary deposits"
  confidence: "High"
  note: >
    Elevated Ca/Mg/Fe sulfates (SO3 8-15 wt% vs 5-7% baseline).
    Midpoint sum ~105.5 wt%  --  wide SO3 range causes overshoot.
    Normalise for simulation.
  composition_wt_pct:
    SiO2:  45.0
    TiO2:   1.0
    Al2O3: 10.0
    FeO:   17.5     # FeO + Fe2O3 total
    MgO:    8.5
    CaO:    7.0
    Na2O:   2.75
    K2O:    0.50
    SO3:   11.5     # key delta vs baseline
    carbonate_salts: 2.0
    Cl:     0.85
    P2O5:   0.85
  composition_ranges:
    SiO2:  [42, 48]
    TiO2:  [0.7, 1.3]
    Al2O3: [8, 12]
    FeO:   [15, 20]
    MgO:   [6, 11]
    CaO:   [5, 9]
    Na2O:  [2.0, 3.5]
    K2O:   [0.3, 0.7]
    SO3:   [8, 15]
    carbonate_salts: [0, 3]
    Cl:    [0.5, 1.2]
    P2O5:  [0.6, 1.1]
  sum_check: 107.45  # see note; normalise for simulation
  native_carbonate_provenance:
    carbonate_salts:
      value_wt_pct: 2.0
      interval_wt_pct: [0.0, 3.0]
      source: "REF-029 Bandfield J.L. et al. 2003, Science 301:1084-1087; Niles P.B. et al. 2017, JGR Planets 122, DOI 10.1002/2016JE005225."
      basis: "Sulfate-rich Mars sediments inherit low global-dust carbonate; carbonates are not the major sulfate-rich cement."
  bound_water_provenance:
    H2O_bound:
      value_wt_pct: 2.0
      interval_wt_pct: [1.5, 3.0]
      source: "Leshin L.A. et al. 2013, Science 341, DOI 10.1126/science.1238937 (Rocknest fines, MSL SAM EGA)."
      basis: "Adsorbed/bound H2O; sulfate hydration water may add above the fines baseline. INVENTORY-ONLY (FB-33, adopted 2026-07-07, t-052): NOT in composition_wt_pct pending kernel wiring."
  environment:
    surface_pressure_mbar: 6
    atmosphere: "96% CO2"
  potential_products:
    sulfuric_acid_feedstock_kg_per_tonne: [30, 50]
    O2_extra_kg_per_tonne: [20, 40]
  key_feature: "Elevated Ca/Mg/Fe sulfates; highest bonus O2 and acid potential"
  preferred_for: "Maximum O2 + sulfuric acid / REE processing"
  process_notes: >
    Extended carbon pre-reduction (30-60 kg C/t); Boudouard self-cleaning.
    Double SO2 sorbent load; higher net O2 from sulfate reduction.
    C1-C6 identical to baseline. Ideal early chemical production site.

