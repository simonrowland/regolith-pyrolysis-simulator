s_type_asteroid_silicate:
  label: "S-Type Asteroid Silicate Fraction"
  source: "FAMILY-REPRESENTATIVE MODELED COMPOSITION (not a cited table); context basis: H/L/LL ordinary chondrite meteorites; Hayabusa Itokawa sample return"
  confidence: "High"
  note: >
    Silicate fraction AFTER magnetic separation of Fe-Ni metal phase.
    Wide FeO range (8-18%) spans H-chondrite (low FeO) to LL-chondrite
    (high FeO). Midpoint sum ~105.5% because the wide MgO and FeO ranges
    reflect different subtypes that don't co-occur at their midpoints.
    Use H-type (FeO~9, MgO~36) or LL-type (FeO~16, MgO~32) for
    specific simulations. Normalise for generic runs.
  composition_wt_pct:
    SiO2:  51.5
    TiO2:   0.15
    Al2O3:  3.0
    FeO:   13.0
    MgO:   34.0
    CaO:    2.0
    Na2O:   1.0
    K2O:    0.10
    Cr2O3:  0.45
    MnO:    0.30
  composition_ranges:
    SiO2:  [48, 55]
    TiO2:  [0.1, 0.2]
    Al2O3: [2, 4]
    FeO:   [8, 18]
    MgO:   [30, 38]
    CaO:   [1, 3]
    Na2O:  [0.8, 1.2]
    K2O:   [0.05, 0.15]
    Cr2O3: [0.3, 0.6]
    MnO:   [0.2, 0.4]
  sum_check: 105.50  # see note; midpoints span H-to-LL subtypes
  bulk_additions:
    metallic_FeNi_wt_pct: [10, 20]   # already reduced; magnetic separation -> 100-200 kg/t at zero energy
    FeS_troilite_wt_pct: [5, 6]      # 25-30 kg S/t from decomposition at 600-900C
    C_wt_pct: [0.1, 0.5]             # 1-5 kg C/t
  key_feature: "Extreme MgO (30-38%); olivine-pyroxene mineralogy; 3-4x lunar Mg"
  preferred_for: "Mg shuttle bootstrap; Mg-dominant metal production; Na2O 2-3x lunar"
  process_notes: >
    Liquidus 1350-1450C (vs 1150-1250C for CMAS); 15-25% more melting energy.
    Micro-g to milli-g environment requires redesign for tapping, injection, condensation.
    10-20 wt% free Fe-Ni metal recoverable magnetically before pyrolysis.
  solar_wind_note: >
    Do NOT copy lunar solar-wind volatile tables here (FB-33, 2026-07-07): Itokawa grains carry
    solar-wind He/Ne/Ar but the thin regolith and short surface-residence give no bulk lunar-like
    ppm inventory (Nagao K. et al. 2011, Science 333:1128-1131, DOI 10.1126/science.1207785).
    Trace SW noble-gas flag only; bulk H2O/organics at ordinary-chondrite levels (<< CI/CM).

m_type_metallic_phase:
  label: "M-Type Asteroid  --  Metallic Phase"
  source: "PROCESS ASSUMPTION (50/50 bulk phase split chosen for modeling); context-not-source: Iron meteorite analogy; Psyche radar/density; pallasitic inclusions"
  confidence: "Low"
  note: >
    No sample return; Psyche mission arrives Aug 2029. The 0.50
    mass_fraction_of_bulk is a process split assumption, not a sourced
    asteroid bulk fraction. This entry is phase-normalized: a 1000 kg
    simulation means 1000 kg of separated metal phase, not one tonne of
    unsorted bulk M-type regolith. Elemental composition (not oxides).
  composition_wt_pct:
    Fe:  90.0
    Ni:   7.5
    Co:   0.40
    S:    1.25
    P:    0.20
  composition_ranges:
    Fe: [88, 92]
    Ni: [5, 10]
    Co: [0.3, 0.5]
    S:  [0.5, 2]
    P:  [0.1, 0.3]
  mass_fraction_of_bulk: 0.50   # process assumption; entry is phase-normalized
  sum_check: 99.35
  key_feature: "Natural Invar/Kovar analog; melting + tapping only"
  preferred_for: "Direct metal production; no reduction needed"
  process_notes: "Melt at 1550-1600C; immiscible separation (7.9 vs 2.8 g/cm3); tap Fe-Ni-Co-P metal; process silicate separately"

m_type_silicate_phase:
  label: "M-Type Asteroid  --  Silicate Phase"
  source: "PROCESS ASSUMPTION (50/50 bulk phase split chosen for modeling); context-not-source: Iron meteorite analogy; Psyche radar/density; pallasitic inclusions"
  confidence: "Low"
  note: >
    The 0.50 mass_fraction_of_bulk is a process split assumption, not a
    sourced asteroid bulk fraction. This entry is phase-normalized: a
    1000 kg simulation means 1000 kg of separated silicate phase, not one
    tonne of unsorted bulk M-type regolith. Very high uncertainty
    (+-30-50%) on Na2O. Sum ~99.8 wt%.
  composition_wt_pct:
    SiO2:  57.5
    MgO:   35.0
    FeO:    3.5
    Al2O3:  2.0
    CaO:    1.5
    Na2O:   0.30
  composition_ranges:
    SiO2:  [55, 60]
    MgO:   [30, 40]
    FeO:   [2, 5]
    Al2O3: [1, 3]
    CaO:   [1, 2]
    Na2O:  [0.1, 0.5]
  mass_fraction_of_bulk: 0.50   # process assumption; entry is phase-normalized
  sum_check: 99.80
  key_feature: "Ultra-magnesian forsterite/enstatite silicate; very low FeO"
  preferred_for: "Mg shuttle stock after metallic phase removed; S-type flowchart"
  process_notes: >
    Process per S-type flowchart after metal tapping. pO2 self-buffering:
    Fe/FeO equilibrium at 1500C gives pO2 ~1e-9 bar (suppresses SiO without
    external control).

v_type_vesta_hed:
  label: "V-Type Asteroid (Vesta HED Meteorites)"
  source: "FAMILY-REPRESENTATIVE MODELED COMPOSITION (not a cited table); context basis: HED meteorites (howardite regolith analogs) + Dawn/Vesta surface"
  confidence: "Very High"
  note: >
    Source data omits Cr2O3, MnO, P2O5; not added (insufficient constraint).
    Sum ~99.7 wt%.
  composition_wt_pct:
    SiO2:  49.5
    TiO2:   0.65
    Al2O3: 14.0
    FeO:   15.5
    MgO:    9.0
    CaO:   10.5
    Na2O:   0.45
    K2O:    0.10
  composition_ranges:
    SiO2:  [47, 52]
    TiO2:  [0.3, 1.0]
    Al2O3: [10, 18]
    FeO:   [12, 19]
    MgO:   [6, 12]
    CaO:   [8, 13]
    Na2O:  [0.3, 0.6]
