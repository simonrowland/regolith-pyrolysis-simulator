# Pinned residual ledger for the Gibbs / DfG thermochemical battery.
# Separate from tests/chemistry/extract_store_reproduction_residual_baselines.yaml
# (that file is the mass-spec ledger and stays one).
# Doctrine: the residual IS the result. Never widen band_kJ_mol to hide a
# changed mechanism. engine_own_input fail → data-integrity; independent
# fail → physics/compilation finding. Do not blur the two.
schema_version: 1
battery: gibbs_thermochemistry
metric: residual_kJ_mol
metric_units: kJ/mol
companion_metric: residual_log10K
companion_metric_units: dimensionless
band_kind: absolute_kJ_mol
comparison_quantity: delta_fG_kJ_mol
never_widen: true
pin_edit_policy: mechanism-comment-required
doctrine: The residual IS the result. Never widen band_kJ_mol to hide a changed mechanism. Never edit
  a pin without a mechanism comment. provenance_class=engine_own_input is a transcription check (fail
  → data-integrity finding). provenance_class=independent_tabulation is a physics/compilation check (fail
  → physics finding). Do not blur the two. This file is not tests/chemistry/extract_store_reproduction_residual_baselines.yaml.
agreement_bands_kJ_mol:
  engine_own_input: 0.05
  independent_tabulation: 1.0
  pin_regression: 0.05
  note: Agreement bands label match vs mismatch against residual=0. The pin band is a regression envelope
    around the recorded residual, identical in role to the mass-spec ±0.01 dex pin. Neither band is an
    accuracy tolerance to be widened.
pilot_species_id_map:
  PO:
    cea_key: PO
    nu_P: 1.0
    nu_O2: 0.5
    note: P(std) + 1/2 O2(g) → PO(g); CEA key PO (exact)
  PO2:
    cea_key: PO2
    nu_P: 1.0
    nu_O2: 1.0
    note: P(std) + O2(g) → PO2(g); CEA key PO2 (exact)
  P2:
    cea_key: P2
    nu_P: 2.0
    nu_O2: 0.0
    note: 2 P(std) → P2(g); CEA key P2 (exact)
  P4:
    cea_key: P4
    nu_P: 4.0
    nu_O2: 0.0
    note: 4 P(std) → P4(g); CEA key P4 (exact)
  P4O6:
    cea_key: P4O6
    nu_P: 4.0
    nu_O2: 3.0
    note: 4 P(std) + 3 O2(g) → P4O6(g); CEA key P4O6 (exact). JANAF table is flagged UNCERTAIN.
  O2:
    cea_key: O2
    nu_P: 0.0
    nu_O2: 1.0
    note: 'Elemental identity: ΔfG°(O2, T) ≡ 0 from O2 − O2. Transcription/convention check of the formation
      algebra.'
id_map_note: Hand-map of the pilot slice only. Matching is exact; never case-fold (CEA CO carbon monoxide
  ≠ Co cobalt; AL ≠ Al). The full canonical namespace arrives from the std1-standardize work.
elemental_cea_keys:
  O2: O2
  P_cr: P_cr
  P_L: P_L
  P_std_rule: P_cr for T < P_cr.T_max_K; P_L otherwise (CEA shared melt endpoint)
pilot_summary:
  species:
  - PO
  - PO2
  - P2
  - P4
  - P4O6
  - O2
  points_scored: 43
  points_refused: 15
  matches: 10
  mismatches: 33
  by_provenance:
    engine_own_input: 3
    independent_tabulation: 40
  by_finding_class:
    compilation_disagreement: 28
    compilation_agreement: 7
    elemental_reference_state_mismatch: 5
    transcription_ok: 3
