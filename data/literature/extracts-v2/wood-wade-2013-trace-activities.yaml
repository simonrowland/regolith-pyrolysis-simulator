    - wood-wade-2013-trace-activities::context::wood_wade_2013_bw1102_table1_partitioning_inputs
    - wood-wade-2013-trace-activities::context::wood_wade_2013_metal_silicate_method_and_constants
    parameters: []
    output_unit: as_published
    method:
      state:
        tag: value
        value: The authors assume highly dilute liquid Fe-In alloys behave as regular solutions, adopt W_In = 52 kJ mol-1,
          calculate an infinite-dilution In activity coefficient in liquid Fe of 25.8 at 1,923 K, and apply it to the In partitioning
          data.
      locator:
        page: 9
        published_page: 919
        pdf_page_index: 8
        note: 'Proof string: ‘52 kJ mol-1 and calculated an activity coefficient infinitely dilute in Fe metal of 25.8 at
          1,923 K’.'
    references:
    - Barin et al. (1989)
    - Okamoto (1990)
