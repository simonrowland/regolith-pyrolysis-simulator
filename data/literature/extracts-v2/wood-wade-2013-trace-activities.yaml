  derivation:
    relation: Author model-derived reduction of the measured BW1102 In metal-silicate partition data using gamma_FeO = 0.92
      calculated from Eq. (4), the printed regular-solution treatment for dilute Fe-In alloys, and the InO1.5–Fe exchange
      constant derived using the assumed InO1.5 melting entropy of 26.25 J.K-1 at 2,183 K.
