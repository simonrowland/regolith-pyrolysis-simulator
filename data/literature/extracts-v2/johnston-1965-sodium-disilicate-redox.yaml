      printed ion/total-element labels and titrated-ion method (Johnston 1965 pp. 185-186). For these same-element cells M
      cancels and each element basis has one cation; an oxide-equivalent Ti2O3/TiO2 reading would multiply Ti ratios by about
      1.11. Denominator is the paper's nominal total (p. 186 footnote), not an analysed value.
