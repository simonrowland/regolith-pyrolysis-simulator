      is not uniform and was not used. Log ticks bracketing the points: -5 at y=2885.5 and -6 at y=3508.5, so (3508.5-2885.5)
      = 623 px per log unit and neg_log10_p = 5 + (y-2885.5)/623. Example: y=2903.8 reads 5 + 18.3/623 = 5.029. The -4 to
      -5 gap is 608 px and was not used. y=3442.5 is the top of the -6 glyph, not the tick. Centres are dark centroids inside
      a 30 px radius, threshold 70. The line-inflated component bbox is not the marker width. Half the diamond, clear of the
      dotted line, is 24 px: 24/623 = 0.039 dex and 3.0 K. The diamond beside the VIII legend glyph is not a datum. Partial
      pressure is not an activity, so the pure-oxide rule is not applied.'
