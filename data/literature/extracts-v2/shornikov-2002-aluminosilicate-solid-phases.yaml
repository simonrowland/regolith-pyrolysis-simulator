      = 5.173. The centre is the dark centroid inside a 30 px radius, threshold 70. Half the diamond, clear of the dotted
      line, is 24 px: 24/623 = 0.039 dex and 3.0 K. Partial pressure is not an activity, so the pure-oxide rule is not applied.'
