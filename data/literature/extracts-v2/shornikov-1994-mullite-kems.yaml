      over mullite and pure-oxide reference pressures. p_O over mullite is author-calculated from vapor-phase equilibria;
      p_SiO and Al-bearing Table 2 pressures are measured by ion-current comparison. Pure-oxide reference pressures are not
      printed as Table 2 pressure cells.
