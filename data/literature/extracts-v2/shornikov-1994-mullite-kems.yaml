      400:1; no separate orifice material is stated.
    table_6_derivation: Equations (12)–(13), p.480 (PDF page index 2), calculate the Table 6 activities from vapor pressures
      over mullite and pure-oxide reference pressures. p_O over mullite is author-calculated from vapor-phase equilibria;
      p_SiO and Al-bearing Table 2 pressures are measured by ion-current comparison. Pure-oxide reference pressures are not
      printed as Table 2 pressure cells.
    oxygen_pressure_corroboration: On p. 479 the authors calculate p_O from MoO3 ⇌ MoO2 + O (1), then calculate p_O2 from
      O2 ⇌ 2O (2). Values from equilibria (1) and (2) correspond within about 15% to values calculated using AlO ⇌ Al + O,
      2AlO ⇌ Al2O + O, Al2O ⇌ 2Al + O, and SiO2 ⇌ SiO + O equilibria (3)–(6); those Al/Si equilibria are a consistency check,
      not parents.
