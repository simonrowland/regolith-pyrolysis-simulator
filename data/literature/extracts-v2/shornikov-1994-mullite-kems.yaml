    overlap: Doklady Table 2 on translated p.96 (PDF page index 1) repeats the Rapid Communications Table 2 Al, AlO, Al2O,
      and AlSiO rows. The Al value at 1833 K is rounded there to 0.36 ± 0.02 versus 0.355 ± 0.018 here; the other row cells
