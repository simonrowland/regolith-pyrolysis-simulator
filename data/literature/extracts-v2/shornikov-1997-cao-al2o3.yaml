    relation: 'Equation (7), published page 24: ΔH_fus = ΔH_T(liq) − ΔH_T(sol). The stored method V enthalpy is 23.0 kJ/mol.
      Its interval 1833–2033 K includes T_fus 1877 ± 5 K, so this extract assigns that row no single condensed phase. Equation
      (5) prints Δf H_T = −35420 x_CaO x_Al2O3 with no unit. Table 3 prints kJ/mol. For CaO·Al2O3, x_CaO = 1/2. Treating the
      printed coefficient as J/mol gives ΔH_T(sol) = −8.8550 kJ/mol and ΔH_fus = 31.8550 kJ/mol, which rounds to the printed
      31.9.'
