    method:
      state:
        tag: value
        value: The calculations used the values of the melting temperatures of CaO and MgO, equal to 3214±12 K and 3246±13
          K, respectively. They were calculated from data on the position of the liquidus line in the CaO–MgO system, obtained
          by Foex (1968) and did not contradict the experimental data (Ronchi & Sheindlin, 2001; Manara et al., 2014). The
          calculated values of the melting enthalpy of calcium and magnesium oxides are presented in Table 1 and correspond
          to the rest of the data. The thermodynamic calculations took into account the amendments proposed in (Gourishankar
          et al., 1993).
