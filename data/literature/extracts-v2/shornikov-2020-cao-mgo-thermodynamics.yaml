        value: In the present study the theoretical calculations of oxide activities and mixing energies in the CaO–MgO melts
          were performed using a semi-empirical model (Shornikov, 2019) in the temperature range of 2600–3300 K in order to
          refine its parameters. The model parameters were the standard Gibbs energies ΔG° for the formation of oxides (CaO,
          MgO and CaMgO2), as well as the gas phase components listed in Table 2. They were calculated from experimental and
          theoretical data. The table also shows the calculated values of ΔG° of condensed phases and gas phase components
          over the CaO–MgO melts at 2973 K, which used to find equilibrium conditions at a given composition and temperature.
          The solution of the equation for the total Gibbs energy of the system under study was found by the Gibbs energy
          minimization method (GEMM).
