  provenance:
    activity_calibration_anchor:
      source: Sugawara et al. [27] (2011)
      method_as_printed: 'Abstract: “Enthalpies of mixing of liquids obtained from different calorimetry techniques are critically
        evaluated.” The abstract says the “data on calorimetric enthalpy, activity of Na2O, cristobalite liquidus, and immiscibility
        gap” determine the mixing properties “as a function of composition by the least squares method.”'
      activity_model_as_printed: Section 3 is titled “Thermodynamic formulation of Gibbs energy of mixing”. It says “Gibbs
        energy of mixing of liquid at temperature T and composition α, (G^L_Mix,T,α), is given by”. Equation (14) gives ΔG^L_Na2O,T,α
        = RT ln a^L_Na2O,T,α = Σ_i (h_i − T s_i)(1−i)(X^L_SiO2)^i; the text says “where h_i and S_i are the empirical constants
        to be determined by regression analysis.”
      interpretation: The 70SiO2–30Na2O anchor is evaluated from this fitted mixing model, not directly measured.
      locators:
        abstract:
          page: 1
          pdf_page_index: 0
          published_page: 1390
          section: Abstract
        activity_model:
          page: 3
          pdf_page_index: 2
          published_page: 1392
          section: 3. Thermodynamic formulation of Gibbs energy of mixing
          equation: '14'
    printed_value: '-9.01'
    printed_form: log10
