      labelled 9 stub at y=2354.0 reads 9.011 on that line (5.75 px, 0.011 dex), and was not rejected. T ticks: 1800 at x=5543.5
      and 2000 at x=7133.5, so T = 1800 + (x-5543.5)/7.950. The frame-end stub at x=8401 does not continue that spacing out
      to the 2200 label, and was not used. The squares near 1800 K sit within 140 px of the 1800 tick. The lowest square is
      0.35 dex below the 10 tick and above the axis at y=3095. Half a marker is 22 px: 0.044 dex and 2.8 K. Hole centres,
      seed-started flood, closed 28 px interiors. Partial pressure is not an activity, so the pure-oxide rule is not applied.
      Other Figure 2 interiors are one row each in the audit.'
