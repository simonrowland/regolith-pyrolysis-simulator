    pdf_page_index: 4
    figure: '3'
    note: 'Figure 3, 600 dpi, PDF page 5, published page 1041. T = 1900 K. Quantity as printed is -log p_1900(i) with p in
      atm. Symbols: filled circles SiO, inverted triangles Al, filled triangles AlO, crossed squares O. Log axes, calibrated
      in log space from the labelled tick marks, not the digit centres and not the data guides. The 9.0 tick is the solid
      stub at y=1367-1371 (centre 1369). The 9.5 baseline is the axis line at y=1612-1615 (centre 1613.5). That pair is (1613.5-1369)/0.5
      = 489 px per log unit. Lower scale: -log = 9.0 + (y-1369)/489. The 8.5 label is crossed by an oxygen marker; the horizontal
      bar at y=1106-1109 is that marker cross, not a free tick, and was not used. The predicted 8.5 position on this line
      is y=1124.5. The upper segment has one labelled line, the dotted 4.0 line at y=685 (darkest row). The same 489 px per
      log unit is anchored there: -log = 4.0 + (y-685)/489. Example: the oxygen marker at mean y=1052.7 reads 9.0+(1052.7-1369)/489
      = 8.353. X ticks: left, the y-axis at x=2799.5 is 0 mol% and the stub at x=3230.5 is 20 mol%, so mol% = (x-2799.5)/21.55.
      Right, the stub at x=3619.5 is 60 mol% and the stub at x=4347.5 is 100 mol%, so mol% = 60+(x-3619.5)/18.20. The 80 stub
      at x=3986.5 is 3 px (0.16 mol%) off that line, inside the half-marker width. Read uncertainty is half a marker on this
      scale: 16 px = 0.033 dex, 22 px where two markers touch = 0.045 dex. The old extra 0.03 dex near the break is not applied.
      Read 1 is the connected-component centre. Read 2 is the radius-12 centroid at threshold 140. The stored coordinate is
      the mean. It is a digitising width, not a printed interval. Partial pressure is not an activity, so the pure-oxide reference
      rule is not applied. The isolated inverted triangle at mean (3193.8, 1448.1) is stored as shornikov_2003_f3_al_11. Piles
      on the y axis, the fused oval near 68 mol% on the 4.0 line, the legend stack, and the guide-line blobs were refused
      one by one; the audit lists them.'
