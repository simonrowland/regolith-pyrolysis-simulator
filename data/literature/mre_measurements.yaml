            units: fraction
            status: reported_whole_percent
            disposition: out-of-domain
            evidence_scope: exterior_rga_collected_o2_basis
            source_locator: {table: 2, row: "3 h", column: "Faradaic Efficiency"}
          - observable_id: mre_extraction_efficiency_fraction
