    unsupported_observables:
      - {observable_id: outlet_o2_volume_fraction, reason: "No hollow-anode gas-volume, residence-time, collection, or RGA response model."}
      - {observable_id: cell_potential_V, reason: "Figure 2(b) is injected as a measured-response replay and is not a prediction."}
      - {observable_id: mre_extraction_efficiency_fraction, reason: "The paper's extraction-efficiency denominator is not equated to the runtime bulk-metal projection without a source-verified metric definition."}
      - {observable_id: "cathodic_element_presence:P", reason: "P2O5 electrolysis and cathodic P speciation are absent."}
      - {observable_id: cathodic_eds_atomic_fraction, reason: "Runtime has bulk metal inventory but no Mo-alloy spatial EDS regions."}
      - {observable_id: hollow_anode_transport_efficiency, reason: "Hollow-anode collection and leakage are outside the builtin intent."}
      - {observable_id: ysz_degradation_or_electronic_leakage, reason: "YSZ degradation and electronic leakage are not modeled."}
