    - observation_id: sh98_cell_reaction_qualifier
      type: laboratory_conditions
      locator:
        published_page: 1171
        pdf_page_index: 0
        section: Introduction
        note: Verbatim translation transcription checked against rendered page image.
      units: verbatim source context
      values:
        statement_as_printed: Study of vaporization of silicon dioxide involves inevitable experimental difficulties
          originating from complex reactions of both molecular forms of the vapor (predominantly silicon monoxide
          and oxygen) and condensed phases with the material of the crucible, support, or effusion cell. The nature
          of these high-temperature reactions mainly depends on the cell material and affects the results of determination
          of the thermodynamic properties of silicon dioxide. These reactions affect the partial pressures of the
          molecular forms of the vapor over [SiO2] and probably determine the more negative enthalpies of formation
          of (SiO), obtained by the Knudsen effusion procedure [4], as compared with the other methods.
    - observation_id: sh98_platinum_standard_qualifier
      type: laboratory_conditions
      locator:
        published_page: 1171
        pdf_page_index: 0
        section: Introduction
        note: Verbatim translation transcription checked against rendered page image.
      units: verbatim source context
      values:
        statement_as_printed: Moreover, the vapor pressures of silver and gold recommended by IUPAC [11] as standards
          for evaluation of the partial pressures of the vapor over tested compound cannot be used when the crucibles
          are prepared of platinum metals.
    - observation_id: sh98_prior_studies_qualifier
      type: laboratory_conditions
      locator:
        published_page: 1171
        pdf_page_index: 0
        section: Introduction
        note: Verbatim translation transcription checked against rendered page image.
      units: verbatim source context
      values:
        statement_as_printed: Except [10, 12, 13] direct experimental studies of vaporization of silicon dioxide
          at temperatures above mp were not carried out, and data on the thermodynamic properties in this temperature
          range are limited to a few experimental works [14, 15]. The results obtained in [10, 12–14] are characterized
          by significant errors; e.g., in [14] the enthalpy of sublimation of silicon dioxide was determined with
          an accuracy of 53%.
    - observation_id: sh98_oxide_film_qualifier
      type: laboratory_conditions
      locator:
        published_page: 1172
        pdf_page_index: 1
        section: Introduction
        note: Verbatim translation transcription checked against rendered page image.
      units: verbatim source context
      values:
        statement_as_printed: The presence of atomic and molecular oxygen over silicon dioxide during its vaporization
          from metallic cells prepared from Ir [12, 16, 17], Pt [18–25], Ta [21–24], Mo [21–24], W [16, 26], and
          Pt–Rh alloys [16, 17, 19, 20, 27] at high temperatures provides formation of oxide films on the surface
          of the cells, which shifts the equilibrium in the main reactions of vaporization from the chemically neutral
          conditions.
    - observation_id: sh98_translation_garbled_masses
