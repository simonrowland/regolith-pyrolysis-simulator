        statement_as_printed: In the mass spectrometric study of vaporization of silicon dioxide it is necessary
          to separate the peaks of the vapor mass spectra at with the m/e 28 and 44, corresponding to the fragment
          28(Si)+ of the 44(SiO)+ molecular ion from the ions 28(N2)+ and 44(CO2)+ of the background spectrum [16,
          17, 30, 31].
