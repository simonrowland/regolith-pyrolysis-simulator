        pdf_page_index: 0
        section: Abstract
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The partial pressures of molecular forms of the vapor over SiO2 were determined by
          the procedure of complete vaporization and by comparison of ion currents using the partial vapor pressures
          of silver and gold as standards.
    - observation_id: sh98_source_statement_03
      type: laboratory_conditions
      locator:
        published_page: 1171
        pdf_page_index: 0
        section: Introduction
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The melting point of [SiO2] is 1996 ± 5 K [4, 5], though slightly different temperatures
          are also published [6, 7].
    - observation_id: sh98_source_statement_04
      type: laboratory_conditions
      locator:
        published_page: 1172
        pdf_page_index: 1
        section: Introduction
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: According to [4], at temperatures higher than 1800 K under the chemically neutral
          or close-to-neutral conditions the vapor phase over silicon dioxide predominantly consists of (SiO), (O),
          (O2), and (SiO2).
    - observation_id: sh98_source_statement_05
      type: laboratory_conditions
      locator:
        published_page: 1172
        pdf_page_index: 1
        section: Introduction
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The total concentration of (Si2O2), (O3), and (Sin) (n = 1, 2, 3) molecules in the
          vapor is lower than 0.05%.
    - observation_id: sh98_source_statement_06
      type: laboratory_conditions
      locator:
        published_page: 1172
        pdf_page_index: 1
        section: Introduction
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: This probably explains the overestimated total vapor pressures over silicon dioxide
          as determined by the method of boiling points and the rapid breakdown of iridium crucible at 2333 K [10].
    - observation_id: sh98_source_statement_07
      type: laboratory_conditions
      locator:
        published_page: 1172
        pdf_page_index: 1
        section: Introduction
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: As known [8], the vapor of silicon monoxide at high temperatures reacts with platinum
          forming platinum silicide [Pt5Si2], which, according to the equilibrium phase diagram of the Pt–Si system,
          forms an eutectic with metallic platinum at 1103 K [9]. Similar processes can occur with the other platinum
          group metals.
    - observation_id: sh98_source_statement_08
      type: laboratory_conditions
      locator:
        published_page: 1172
        pdf_page_index: 1
        section: Introduction
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The enthalpy of fusion of cristobalite (9.6 ± 0.5 kJ/mol), recommended in [4], was
          determined indirectly by solution calorimetry as the difference between the enthalpies of formation of
          cristobalite and vitreous [SiO2].
    - observation_id: sh98_source_statement_09
      type: laboratory_conditions
