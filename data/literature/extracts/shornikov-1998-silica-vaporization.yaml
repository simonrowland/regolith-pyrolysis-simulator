    - observation_id: sh98_source_statement_14
      type: laboratory_conditions
      locator:
        published_page: 1173
        pdf_page_index: 2
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: Dissociative ionization of the (SiO) molecule begins at the ionization energy of 16
          eV, and at 32 eV it is about 15% [31].
    - observation_id: sh98_source_statement_15
      type: laboratory_conditions
      locator:
        published_page: 1173
        pdf_page_index: 2
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The isotopic ratio of the (Si)+ and (SiO)+ ions in the mass spectra of the vapor over
          silicon dioxide agrees with the natural isotopic abundances given in [4] to within 13%.
    - observation_id: sh98_source_statement_16
      type: laboratory_conditions
      locator:
        published_page: 1173
        pdf_page_index: 2
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The presence in the vapor of (Mo)+, (MoO)+, (MoO2)+, and (MoO3)+ and (W)+, (WO)+,
          (WO2)+, (WO3)+, (W2O2)+, and (W2O6)+ ions during vaporization of silicon dioxide from the molybdenum and
          tungsten effusion cells and the absence of (Pt)+, (PtO)+, (PtO2)+, and (PtO3)+ and (Ir)+, (IrO)+, (IrO2)+,
          (IrO3)+, and (Ir2O)+ ions during vaporization of silicon dioxide from the platinum–rhodium and iridium
          effusion cells, respectively, indicates in the former case a reaction of silica with the material of the
          effusion cell.
    - observation_id: sh98_source_statement_17
      type: laboratory_conditions
      locator:
        published_page: 1173
        pdf_page_index: 2
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: However, almost no (MoO)+, (MoO2)+, and (MoO3)+ and (WO)+, (WO2)+, (WO3)+, (W2O2)+,
          and (W2O6)+ ions were observed in the mass spectra during vaporization of [SiO2] from the platinum–rhodium
          and iridium-coated tungsten effusion cells.
    - observation_id: sh98_source_statement_18
      type: laboratory_conditions
      locator:
        published_page: 1174
        pdf_page_index: 3
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: In vaporization from the cells of all types, the peak intensity of the 22(SiO)2+ ion
          registered in the vapor over silicon dioxide was ≤0.90 ± 0.5% relative to the 44(SiO)+ ion.
    - observation_id: sh98_source_statement_19
      type: laboratory_conditions
      locator:
        published_page: 1174
        pdf_page_index: 3
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The mass spectra of the vapor over silicon dioxide obtained on an MS-1301 mass spectrometer
          (Uion 70 V) did not allow correct evaluation of the intensity of the ion current of (SiO2)+.
    - observation_id: sh98_source_statement_20
      type: laboratory_conditions
      locator:
        published_page: 1174
        pdf_page_index: 3
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: We studied the dependence of the mass spectra of the vapor over [SiO2] as influenced
          by the ionization energy and found a threefold decrease in the peak intensity of the (SiO2)+ ion as compared
          with (SiO)+ with Uion increased from 20 to 70 eV (Fig. 1a).
    - observation_id: sh98_source_statement_21
      type: laboratory_conditions
      locator:
        published_page: 1174
        pdf_page_index: 3
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: This decrease in the peak intensity of the (SiO2)+ ion in the mass spectra of the
          vapor over silicon dioxide with increasing ionization energy is due to greater fragmentation, which is
          confirmed by simultaneous increase in the content of the (Si)+ fragment in the mass spectrum (Fig. 1b).
    - observation_id: sh98_source_statement_22
      type: laboratory_conditions
      locator:
        published_page: 1174
        pdf_page_index: 3
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The evaluated intensity of the (SiO2)+ ion in the mass spectra of the vapor over [SiO2]
          did not exceed 0.5 ± 0.1% as compared with the ion current of (SiO)+; this is comparable with the sensitivity
          of the MS-1301 mass spectrometer.
    - observation_id: sh98_source_statement_23
      type: laboratory_conditions
      locator:
        published_page: 1174
        pdf_page_index: 3
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: The partial pressures (pi) of (SiO), (SiO2), (O), and (O2) during vaporization of
          [SiO2] from the platinum–rhodium cell were calculated from the Hertz–Knudsen equation [35, 37, 38] taking
          into account the vaporization coefficient of silicon monoxide [27] and were similar within an error of
          about 15% to those determined by the method of comparison of ion currents [16, 17].
    - observation_id: sh98_source_statement_24
      type: laboratory_conditions
      locator:
        published_page: 1175
        pdf_page_index: 4
        section: Results
        note: Verbatim translation transcription re-checked against the rendered page image.
      units: verbatim source statement
      values:
        statement_as_printed: As seen from Table 2, the coefficient A in the temperature dependences of the partial
          vapor pressures for all types of the cells remains constant within the calculation error, and its values
          are fairly close to those obtained in [13, 25, 27, 40].
    observations: []
