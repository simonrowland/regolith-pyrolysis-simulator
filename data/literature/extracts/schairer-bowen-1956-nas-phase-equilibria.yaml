    - observation_id: sb1956_data_qualifications
      type: method
      locator:
        published_page: 132-133
        pdf_page_index: 3-4
      units: as printed
      values:
        quantity: data_qualifications
        statements:
        - text: Above 40 percent SiO2 no particular loss of alkali took place during preparation, and there was
            negligible loss of Na2O if the precautions described in the previous paper were followed.
          locator:
            published_page: 132
            pdf_page_index: 3
        - text: In the low-silica portions Na2O volatilized during preparation and the analytical soda content was
            lower than planned.
          locator:
            published_page: 132
            pdf_page_index: 3
        - text: Low liquidus compositions on or near the albite-silica line and in the mullite/corundum fields below
            about 1400°C were very viscous and difficult to crystallize; several weeks or months at about 75°C below
            liquidus were needed to grow small crystals.
          locator:
            published_page: 133
            pdf_page_index: 4
        - text: Synthetic albite was very difficult to crystallize.
          locator:
            published_page: 133
            pdf_page_index: 4
        - text: The refractive index values in Table 2 are believed accurate to ±0.003.
          locator:
            table: '2'
            published_page: 137-157
            pdf_page_index: 8-28
        - &id752
          text: Quenching experiments between the liquidus and complete crystallization are reported for 340 synthetic
            compositions.
          locator:
            published_page: 129
            pdf_page_index: 0
        - &id753
          text: The abstract lists the primary phases as cristobalite, tridymite, quartz, mullite, corundum, albite,
            nepheline, carnegieite, sodium disilicate, sodium metasilicate, and sodium orthosilicate; it says some
            have variable composition because of solid solution.
          locator:
            published_page: 129
            pdf_page_index: 0
        - &id754
          text: “No field of ‘β-Al2O3’ was found and, whatever may be its composition, it is metastable with respect
            to corundum at the temperatures investigated.”
          locator:
            published_page: 129
            pdf_page_index: 0
        - &id755
          text: “Na2O is much less volatile than K2O in corresponding compositions.”
          locator:
            published_page: 131
            pdf_page_index: 2
        - &id756
          text: Na2O–SiO2 glasses were described as much less hygroscopic than corresponding K2O–SiO2 glasses; they
            were crystallized at once, kept dry, and then used as a source of Na2O and SiO2 in preparing ternary
            glasses.
          locator:
            published_page: 131
            pdf_page_index: 2
        - &id757
          text: Crystallization of Na2O–SiO2 glasses was stated to be little difficult, particularly at temperatures
            50° to 75°C below liquidus; cristobalite and quartz crystallized easily in their respective stability
            ranges, while tridymite was obtained with some difficulty.
          locator:
            published_page: 131
            pdf_page_index: 2
        - &id758
          text: Albites were partially crystallized and the congruent melting point of albite was given as 1118°
            ± 3°; the cited pure synthetic carnegieite melting point was 1526° ± 2°.
          locator:
            published_page: 131
            pdf_page_index: 2
        - &id759
          text: “In a similar manner it was possible to crystallize albite even at temperatures around 750° because
            of the fairly low viscosity of the melts” and to follow the albite field toward pure albite and the
            albite–silica system, “where crystallization of albite is very difficult.”
          locator:
            published_page: 132
            pdf_page_index: 3
        - &id760
          text: 'The authors list Na2O–SiO2 join compositions and preparation labels in weight percent: Al500 (Na2O
            7, SiO2 93); Al300 (9.5, 90.5); Al900 (12, 88); J (13.3, 86.7); Al700 (14.7, 85.3); Al800 (17.5, 82.5);
            Al600 (20.5, 79.5); Al400 (23, 77); Al200 (25, 75); Al100 (27.5, 72.5); Al1100 (30, 70); Al1200 (32,
            68); Dial (34.0, 66.0); Al1300 (40, 60).'
          locator:
            published_page: 132
            pdf_page_index: 3
        - &id761
          text: “In general, considerably less difficulty was encountered in the crystallization of Na2O–Al2O3–SiO2
            glasses than was experienced with glasses in the K2O–Al2O3–SiO2 system.”
          locator:
            published_page: -1
            pdf_page_index: -1
        - &id762
          text: “The above observations indicate that alkali losses in complex silicate systems are not controlled
            by alkali content alone but that SiO2 and Al2O3 tend to stabilize compositions and prevent or minimize
            alkali losses while CaO or MgO tends to increase them.”
          locator:
            published_page: 160
            pdf_page_index: 31
        - text: “There was a rapid decrease in viscosity of melts in the albite field to the left of the line carnegieite–silica
            (WSiO2) of figures 3 and 4. As a result, even though liquidus temperatures were lower, albite crystallized
            more easily than at higher temperatures in compositions in the line carnegieite–silica.”
          locator:
            published_page: 178
            pdf_page_index: 49
        - text: “The very small crystals, presumably high-temperature albite, were ideal for quenching runs to determine
            liquidus temperatures but too small for exact optical determinations.”
          locator:
            published_page: 178
            pdf_page_index: 49
        - text: “Pure carnegieite melts congruently at 1526° ± 2°.”
          locator:
            published_page: 178
            pdf_page_index: 49
        - text: The cited reversible inversion of pure NaAlSiO4 was 1248° ± 5° (Bowen, 1912), later redetermined
            as 1254° ± 5° (Greig and Barth, 1938).
          locator:
            published_page: 179
            pdf_page_index: 50
        - text: The cited reversible metastable carnegieite inversion was 687.0° on cooling or 692.1° on heating;
            one preparation showed another at 226.5°.
          locator:
            published_page: 180
            pdf_page_index: 51
        - text: In nepheline–anorthite, nepheline and carnegieite take up about 35% and somewhat less than 5% anorthite,
            respectively, raising the inversion temperature to 1352° ± 5°.
          locator:
            published_page: 180
            pdf_page_index: 51
        - text: In nepheline–albite, nepheline and carnegieite take up about 34% and about 14.5% albite, respectively,
            raising inversion to about 1280°.
          locator:
            published_page: 180
            pdf_page_index: 51
        - text: In nepheline–sodium disilicate, the cited study reports no solid solution in either nepheline or
            carnegieite and a constant inversion temperature.
          locator:
            published_page: 180
            pdf_page_index: 51
        - text: In nepheline–sodium metasilicate, carnegieite takes up to 24% Na2SiO3 in solid solution, nepheline
            has no appreciable Na2SiO3 solid solution, and the inversion temperature is lowered to 1163°.
          locator:
            published_page: 180
            pdf_page_index: 51
        - text: The paper states that natural nepheline is never pure soda nepheline (NaAlSiO4) because of extensive
            solid solution; potassium commonly occupies the larger alkali sites.
          locator:
            published_page: 180
            pdf_page_index: 51
        - text: A cited 850° low/high nepheline inversion was not supported by a break in the nepheline liquidus
            or optical evidence in Tilley’s (1933) nepheline–sodium disilicate study or in the present compositions.
          locator:
            published_page: 181
            pdf_page_index: 52
        - text: In NaAlSiO4–CaSiO3 the cited inversion temperature was raised to 1267°; the cited work reported
            little or no solid solution in carnegieite.
          locator:
            published_page: 181
            pdf_page_index: 52
        - text: In NaAlSiO4–CaO·Al2O3, pure soda nepheline may take up at least 60% CaO·Al2O3 in solid solution,
            while carnegieite takes up only about 5%.
          locator:
            published_page: 182
            pdf_page_index: 53
        - text: A preliminary report on five triangular joins in Na2O–Al2O3–Fe2O3–SiO2 indicated that nepheline
            and perhaps carnegieite may take up appreciable but limited Fe2O3, replacing part of Al2O3 in the solid
            solutions.
          locator:
            published_page: 182
            pdf_page_index: 53
        - text: Albite-composition glass was heated between 1500° and 1600°C for 24-hour periods; seven or eight
            heatings with intermediate cooling and fine crushing were needed. Samples held about 100° below albite’s
            melting point failed to crystallize for several years; one preparation held five years at 1025°C produced
            no crystals.
          locator:
            published_page: 182
            pdf_page_index: 53
        - text: “The process of ‘acclimating’ the albite glass consisted of holding the melt at 1400° for several
            days … at 1300° for several days, at 1200° for several weeks, and … at 1150° for … several months.”
            At 1050°C the sample had about 1% very small sharp albite laths, which grew slowly with continued heating.
          locator:
            published_page: 183
            pdf_page_index: 54
        - text: Cited Greig and Barth (1938) work found that adding a small amount of water lowered albite-glass
            viscosity and allowed small albite crystals to grow in a few days; in the present account a two-week
            quenching run on small samples is noted.
          locator:
            published_page: 183
            pdf_page_index: 54
        - text: Kracek (1930) gave an incongruent sodium-orthosilicate melting point of 1120° ± 5° to a solid (presumably
            Na2O) and liquid, and a sodium orthosilicate–sodium metasilicate eutectic at about 1022°.
          locator:
            published_page: 179
            pdf_page_index: 50
        - text: Merwin optical values for Kracek’s pure sodium orthosilicate crystals were γ = 1.537 and α = 1.524,
            the highest and lowest observed values; lamellar twinning made figure determinations impossible.
          locator:
            published_page: 179
            pdf_page_index: 50
        - text: Preparation MN32 was held four hours at 980°; the reported sodium-orthosilicate solid-solution crystals
            had 2V about 50°.
          locator:
            published_page: 179
            pdf_page_index: 50
    - observation_id: sb1956_printed_numeric_context
      type: characterization
      locator: {published_page: 131-191, pdf_page_index: 2-62, section: Discussion and cited data}
      units: as printed
      values:
        quantity: printed_numeric_context_and_qualifications
        claims:
        - text: "In compositions with less than about 40% silica, slight Na2O volatility occurred in preparations with liquidus above about 1525°, and at much lower temperatures in area B′J′K′ (figs. 3–4)."
          locator: {published_page: 159, pdf_page_index: 30}
        - text: "K2O–Al2O3–SiO2 glasses with less than about 75% silica and Na2O–SiO2 glasses with less than about 60% silica were hygroscopic. Preston and Turner measured appreciable Na2O volatility from Na2O–SiO2 glasses at 1400°."
          locator: {published_page: 159, pdf_page_index: 30}
        - text: "Tridymite could not be crystallized in any albite–silica preparation. Cristobalite persisted below 1470° ± 10° in the tridymite stability range."
          locator: {published_page: 162, pdf_page_index: 33}
        - text: "Al731 metastable β-Al2O3 liquidus was 1607°C before corundum was present; stable corundum liquidus was 1611°C after recrystallization. β-Al2O3 and mullite needles at 75°–100° below liquidus later disappeared."
          locator: {published_page: 164, pdf_page_index: 35}
        - text: "No values for the indices of inhomogeneous glasses are given in Table 2. Crystallization at about 1450°C gave twinned carnegieite s.s. with β-Al2O3 and/or corundum. The Pt 90 Rh 10 furnace burned out after a short run at 1725°C."
          locator: {published_page: 167, pdf_page_index: 38}
        - text: "At M, 1050° ± 10°, tridymite from viscous dry liquids was actually cristobalite metastably, introducing only a small temperature error."
          locator: {published_page: 171, pdf_page_index: 42}
        - text: "The precision of the data in quadrilateral B′WK′J′ is much less than for the rest of the system."
          locator: {published_page: 175, pdf_page_index: 46}
        - text: "B′WK′ compositions begin to melt between 900° ± 2° at H′ and 995° ± 5° at E′. MN23 is completely crystalline at 955°, the temperature of E′."
          locator: {published_page: 175, pdf_page_index: 46}
        - text: "A charge held 42 days at 7° below the eutectic left only a trace of glass. I is bracketed by M (sharp albite at 1060° after 42 days; only cristobalite at 1065°) and LM (albite plus rare cristobalite at 1060°; corroded albite only at 1065°)."
          locator: {published_page: 162, pdf_page_index: 33}
        - text: "Glasses with at least 90% albite were viscous. Al9-1/2 (albite 95, sodium disilicate 5) grew albite in a few weeks at 1025°C. Four preparations crystallized completely at 740°C."
          locator: {published_page: 163, pdf_page_index: 34}
        - text: "Preparations 721 and 721-1/2 required many months at 1050°C. Runs of a month located the albite–corundum eutectic at 1108° ± 3°."
          locator: {published_page: 164, pdf_page_index: 35}
        - text: "Albite crystallized in days or weeks at 50°–75° below liquidus where liquidus was at or below about 1040°. Mullite crystallization was difficult below about 1400°; liquidus near 1200° or below required many months at about 75° below liquidus."
          locator: {published_page: 177, pdf_page_index: 48}
        - text: "Temperature falls along SR from about 1280° at S to about 1270° at R. Nepheline and carnegieite are limited NaAlSiO4–NaAlSi3O8 solid solutions."
          locator: {published_page: 173, pdf_page_index: 44}
        - text: "No quenching data are reported for joins Na2O·SiO2–(Na2O 70, Al2O3 30) and Na2SiO3–(Na2O 90, Al2O3 10). I′F′ falls from 1163° ± 5° to 915° ± 5°."
          locator: {published_page: 174, pdf_page_index: 45}
        - text: "Na2Si2O5 has a congruent melting point of 874° ± 3°; transitions Aα⇌Aβ at 707° and Aβ⇌B at 678°; 2V is about 55°; indices α=1.495, β=1.503, γ=1.506 ±0.003."
          locator: {published_page: 176, pdf_page_index: 47}
        - text: "Na2SiO3 (B′) has a congruent melting point of 1089° ± 1° and 2V about 80°."
          locator: {published_page: 176, pdf_page_index: 47}
        - text: "Sodium metasilicate indices are α=1.513, β=1.520, γ=1.528. Mullite has an incongruent melting point of 1810° ± 10°."
          locator: {published_page: 177, pdf_page_index: 48}
        - text: "Carnegieite maximum γ is 1.514, rising to about 1.537 at NaAlSiO4 63.4 / Na2O·Al2O3 36.6. Brownmiller and Bogue reported γ=1.580 for Na2O·Al2O3."
          locator: {published_page: 167, pdf_page_index: 38}
        - text: "Carnegieite inverts on cooling at 687° (Bowen and Greig, 1925). The liquidus rises continuously from 1526° at pure carnegieite to an estimated 1850° ± 30° at Na2O·Al2O3. Matignon’s 1650° melting point was not confirmed by Brownmiller and Bogue, who observed no melting at 1650°."
          locator: {published_page: 168, pdf_page_index: 39}
        - text: "Tilley’s Na2SiO3–NaAlSiO4 eutectic is at 46.75% NaAlSiO4 / 53.25% Na2SiO3 and 906°. Spivak reported 907° ± 2° and coexistence to 900° ± 2°. The eutectic is about 47.0 / 53.0; melting during cooling occurs below 24% silica."
          locator: {published_page: 168, pdf_page_index: 39}
        - text: "Albite crystals grew at 1115° and dissolved at 1120°, giving 1118° ± 3°. Amelia albite converted at 1050°–1100°; the low/high albite inversion is at or below 700°C (Tuttle and Bowen)."
          locator: {published_page: 184, pdf_page_index: 55}
        - text: "The preliminary albite–silica eutectic was 1115° (1935), revised to 1062° ± 3° (Schairer, 1950)."
          locator: {published_page: 161, pdf_page_index: 32}
          evidence: quoted_attributed
          attribution: "Schairer (1935); Schairer (1950)"
        - text: "Bowen and Greig reported a cristobalite–mullite eutectic at 1545° ± 5° and Al2O3 5.5 / SiO2 94.5; the value was revised to 1585° ± 10°."
          locator: {published_page: 134, pdf_page_index: 5}
          evidence: quoted_attributed
          attribution: "Bowen and Greig; revised by Schairer and Bowen"
        - text: "Cristobalite melting point was 1713° ± 5° (Greig, 1927); corundum melting point was 2050° ± 20° (Kanolt, 1914)."
          locator: {published_page: 135, pdf_page_index: 6}
          evidence: quoted_attributed
          attribution: "Greig (1927); Kanolt (1914)"
        - text: "Na2O·Al2O3 analyses gave 61.76, 61.97, and 61.59% Al2O3 (calculated 62.19%). The melting point was reported as 1650°C, with dissociation below 1650° for Na2O-excess compositions."
          locator: {published_page: 135, pdf_page_index: 6}
          evidence: quoted_attributed
          attribution: "Matignon (1923); Brownmiller and Bogue (1932)"
        - text: "Brownmiller and Bogue reported a homogeneous solid at Na2O 37.8 / Al2O3 62.2."
          locator: {published_page: 135, pdf_page_index: 6}
          evidence: quoted_attributed
          attribution: "Brownmiller and Bogue (1932)"
        - text: "Na2O 3.5 / Al2O3 96.5 heated at 1100° gave corundum and β-Al2O3; the sample heated to 1500° formed β-Al2O3 and Na2O·Al2O3 with no corundum; β-Al2O3 was found up to 96.5% Al2O3."
          locator: {published_page: 136, pdf_page_index: 7}
          evidence: quoted_attributed
          attribution: "Schairer and Bowen (1955)"
        - text: "Fusion to form Na2O·Al2O3 was complete only at 1000°–1100°C; it dissociated at 1200°–1300°."
          locator: {published_page: 136, pdf_page_index: 7}
          evidence: quoted_attributed
          attribution: "Strokov et al. (1940)"
        - text: "Kato and Yamauchi (1943) used Na2O 2, 4, 6, 8, 10, 15, 25%; heated 1550°–1600°C for one hour; reported Na2O·12.34Al2O3; below 10% Na2O yielded corundum and at least 15% yielded β-like material."
          locator: {published_page: 136, pdf_page_index: 7}
