evidence_policy:
  classification: model
  measurement_claim: No new instrument measurements are reported. Laboratory points discussed in the validation section are attributed to Hastie et al. (1982) and Hastie & Bonnell (1985); no uncertainties are supplied for those points.
  model_generator: LavAtmos using MELTS oxide activities, JANAF thermochemical data, mass-action reactions, and internally solved oxygen partial pressure; comparison models are named per table or note.
  missing_values: Printed em dashes in Table 2 remain strings and are not converted to zero.
  figure_policy: Figures 1-6 are qualitative or plotted output; no numeric curve values were read off or invented.
  scope_note: This is a chemical-equilibrium modelling/code paper. It contains no sample mass, crucible, cell/orifice geometry, vacuum apparatus, pumping, gas-flow, temperature calibration, fO2-control apparatus, or run-duration measurements.
