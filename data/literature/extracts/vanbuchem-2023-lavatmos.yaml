- table: validation_and_limitations
  locator: {page: 1153, section: Validation}
  classification: quoted_attributed
  values:
    method_class: attributed_laboratory_comparison
    generator: Hastie et al. (1982) and Hastie & Bonnell (1985) laboratory data, as reported and compared by van Buchem et al.; no uncertainties printed
    quantity: validation_scope_and_reported_comparison
    claims_as_printed:
    - "LavAtmos and MAGMA align well with the O2 laboratory data for SRM glass."
    - "For SRM glass, LavAtmos and VapoRock K partial pressures differ by about a factor 2; VapoRock is closer to the experimental data; MAGMA is about one order of magnitude below VapoRock."
    - "For illite, LavAtmos O2 agrees with the data at 1750 K and above; MAGMA underestimates K by about a factor 2 near 1550 K and about an order of magnitude above 2000 K."
    - "For illite, LavAtmos and VapoRock SiO predictions are similar and both underestimate the experimental data by about a factor 2."
    - "No experimental uncertainties were provided by the cited laboratory authors."
    - "The authors state that suitable experimental data were not available for the remaining species beyond the cited O2, K, Na, and SiO comparisons."
