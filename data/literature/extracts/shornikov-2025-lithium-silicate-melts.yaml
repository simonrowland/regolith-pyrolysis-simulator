          published_page: 59
          pdf_page_index: 2
          section: body
        units: as reported
        values:
          quantity: model scope
          method_class: model_derived
          temperature_range_K: [1000, 2000]
          model: Semi-empirical model (Shornikov, 2019).
          model_inputs: >-
            Standard Gibbs energies of Li2O and SiO2 in the crystalline and liquid
            state, and of Li8SiO6, Li4SiO4, Li2SiO3, Li6Si2O7 and Li2Si2O5.
          gas_species_considered:
            [Li, Li2, LiO, Li2O, Li2O2, Si, Si2, Si3, Si4, SiO, SiO2, Si2O2, Li2SiO3, O, O2, O3, O4]
          condensed_compounds_as_printed:
            - {formula: Li4SiO4, oxide_equivalent: 2Li2O · SiO2, congruent_melting_K: 1528}
            - {formula: Li2SiO3, oxide_equivalent: Li2O · SiO2, congruent_melting_K: 1474}
            - {formula: Li2Si2O5, oxide_equivalent: Li2O · 2SiO2, congruent_melting_K: 1307}
            - {formula: Li8SiO6, oxide_equivalent: 4Li2O · SiO2, decomposes_K: 1104}
            - {formula: Li6Si2O7, oxide_equivalent: 3Li2O · 2SiO2, exists_K: '1493–1503'}
            - {formula: Li2Si3O7, oxide_equivalent: Li2O · 3SiO2, dissociates_at_or_below_K: 600, source: Takahashi and Yoshio, 1970}
            - {formula: Li4Si3O8, oxide_equivalent: 2Li2O · 3SiO2, dissociates_at_or_below_K: 600, source: Takahashi and Yoshio, 1970}
          sio2_activity_not_measured: >-
            Published page 60: the SiO2 activity in lithium-silicate melts has not
            been experimentally determined.
          mixing_sentence_typo: >-
            Published page 60 prints "mixing energies in the Li2O–SiO3 melts".
            The title, the abstract and the Fig. 4 caption print Li2O–SiO2. The
            typo is left as printed and is not a second system.
          schultz_reference_not_this_model: >-
            Schultz et al. (1986) normalized experimental data to Li2SiO3. That
            is the cited EMF reference, a compound. This paper's own calculated
            activities are not given that reference.
