  Li2O:
    observations:
      - observation_id: shornikov_2025_li2o_sio2_fig3a_series6
        type: activity_coefficient
        experiment: shornikov_2025_li2o_sio2_model
        locator:
          page: 4
          published_page: 60
          pdf_page_index: 3
          figure: '3'
          panel: A
          note: >-
            Caption series 6, calculated in the present study. 600 dpi render of
            PDF page 4: continuous stroke, no marker centre. The caption's
            temperature clause conflicts with itself and with the body. The
            opening clause puts Schultz et al. (1986) at 1473 K as series 1 and
            Ikeda et al. (1982) at 1600 K as series 2. The closing clause says
            "at 1600 (1) and 1673 (2–8) K" and does not mention series 9. The
            body says the Li2O activities of this study (Fig. 3A) are at 1673 K.
            Series 6 is inside the closing clause's 2–8 group. No temperature
            was chosen in order to digitize a point.
        phase: condensed
        units: dimensionless activity as plotted, log10
        T_range_K: [1673, 1673]
        standard_state: >-
          Published page 59 (PDF page 3): the standard Gibbs energies of formation
          of the simple oxides are taken in the crystalline and liquid states
          (Barin, 1995). The paper does not state which of those phases is the
          reference of the plotted Li2O activity. The same page says Schultz et al.
          (1986) normalized their EMF data to Li2SiO3 lithium metasilicate. That
          sentence describes the cited EMF work. It is not stated as the reference
          of this study's calculated activities.
        uncertainty:
          note: No read uncertainty, because no marker centre was admitted.
        values:
          quantity: activity
          method_class: figure_only
          admission_status: typed_refusal
          series: 6
          temperature_K_as_printed_for_this_study: 1673
          reason: Continuous calculated stroke. No marker centre. The caption temperature clause is inconsistent and was not used to invent a point.
