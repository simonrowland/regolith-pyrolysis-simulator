schema_version: literature_extract.v1
source_id: mckay-1991-simulated-lunar-glass-reduction
source:
  citation: >-
    McKay, D. S., Morris, R. V. and Jurewicz, A. J. (1991). Experimental
    reduction of simulated lunar glass by carbon and hydrogen and implications
    for lunar base oxygen production. Lunar and Planetary Science XXII,
    Press Abstracts, pp. 49–52. NASA accession N91-20009.
  year: 1991
  corpus_asset: raw/mckay-1991-simulated-lunar-glass-reduction/mckay-1991-simulated-lunar-glass-reduction.pdf
  corpus_sha256: 8c9cfcdb7742380be9e0eb874d07ced2f4cb8dedcd7f49b8feb2c6b4f7f0315c
extraction:
  method: >-
    Manual transcription from the four-page LPSC XXII press-abstract PDF.
    Pages were rendered at 200 dpi and read as images; the born-digital
    pdftotext -layout layer was used only as a cross-check. Table 1 cells
    were read from the page-4 image. No figures are present. No values were
    estimated or digitised. Temperatures are stored as printed in C.
    The 24.5 kg O2/t, 2 kg/t, and 100 kg/t oxygen figures are author
    estimates, not measured oxygen yields; the authors state they did not
    directly measure oxygen production.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/mckay-1991-simulated-lunar-glass-reduction/
review_status: draft
benches:
- id: jsc-gas-mixing-furnace
  identity: {basis: described_in_this_work}
  apparatus_family:
    state: {tag: value, value: controlled atmosphere gas mixing furnace with flowing gas}
    locator: &exp_loc {page: 50, pdf_page_index: 1, published_page: '50', section: Experimental}
  heating_method:
    state: {tag: value, value: gas mixing furnace; temperatures from 950 C (glass still solid powder) to 1200 C (glass partially melted and behaved as a fluid)}
    locator: *exp_loc
  detector:
    state: {tag: value, value: Mossbauer spectroscopy of the cooled solid after the run, to determine the relative amount of metallic iron produced}
    locator: *exp_loc
  atmosphere:
    state: {tag: value, value: flowing gases including carbon monoxide, carbon dioxide, and hydrogen; very low oxygen partial pressure in the flowing gas (numeric pO2 not printed); some experiments also mixed the sample with carbon}
    locator: *exp_loc
