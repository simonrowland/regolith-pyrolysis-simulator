extraction:
  method: >-
    mineru_table_draft emit of Table 1 CSV row 29 and Table 2 CSV row 14.
    The ± cells were split by hand after a 600 dpi render check. The Table 1
    minus sign is the en dash pdftotext reads (U+2013); MinerU stored an ASCII
    hyphen. Table 2 column headers were rewritten from the render because
    MinerU had folded the MgO body rows into the header. The liquid-state
    pair on published page 292 is prose, added by hand from that render.
    Figure 4 series 8 was read from the 600 dpi render of PDF page 5.
    Tick marks were calibrated in linear space. Each stored centre was
    re-read on that render. A marker was stored only when it is an open
    right-pointing triangle with no bar and its centre is visible.
    Figure 2 series 16 was read the same way from PDF page 3. The 2210 K
    point was read again on a 1200 dpi render of the same page. A marker
    was stored when its open right-pointing outline and its centre could
    be located. A crossing outline alone was not a reason to refuse.
