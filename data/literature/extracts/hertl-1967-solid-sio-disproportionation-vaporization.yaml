        values:
          quantity: heat_of_vaporization_of_solid_SiO_unresolved_reaction
          schema_gap_note: >-
            The authors calculate 72.5 kcal/mole from the slope in Fig. 4, then state that their experiments do not distinguish SiO(s) = SiO(g) from Si(s) + SiO2(s) = 2SiO(g). The vaporization-enthalpy quantity tokens are restricted to a named reaction (simulator/battery/enums.py::Quantity.ENTHALPY_OF_VAPORIZATION_2ND_LAW and simulator/battery/enums.py::Quantity.ENTHALPY_OF_VAPORIZATION_3RD_LAW); no exact quantity token represents this unresolved reaction. The observation type and quantity sets are closed (tools/validate_literature_extracts.py::OBSERVATION_TYPES, simulator/battery/migrate.py::TYPE_QUANTITY, simulator/battery/migrate.py::QUANTITY_ALIASES). The SiO vaporization heat and activation-energy fit are carried as context in mamiya-2000-sio-disproportionation rather than assigned a guessed thermochemical token.
          method_class: quoted_attributed
          evidence_class: quoted_attributed
          attribution: Hertl and Pultz (1967), this work.
          result_as_published: heat of vaporization of SiO
          calculation_as_published: Calculated from the slope of Fig. 4.
          possible_reactions_as_published:
            - SiO(s) = SiO(g)
            - Si(s) + SiO2(s) = 2SiO(g)
          value_as_published: 72.5
          unit_as_published: kcal/mole

