    - observation_id: bielefeldt2013_simulation_setup
      type: method_note
      locator:
        page: 7
        published_page: 7
        section: Materials and Methods
      units: as printed
      values:
        method_class: method_only
        evidence_class: method_only
        software: FactSage 6.3, Equilibrium module, FToxid sub-systems (phase equilibria); melts database (viscosity)
        conditions_as_printed:
        - wt.% CaO / wt.% SiO2 (binary basicity, B2) kept constant (generally B2 = 2) for any MgO content
        - fixed amount of 20 wt.% Al2O3 for all simulations
        - constant total mass of 100 g
        - temperatures of 1,500°C; 1,550°C; 1,600°C
        goals_as_printed: (1) thermodynamic study of the phases at equilibrium at B2 = 2 in C-M-S-A slags; (2) evaluate
          slag viscosity vs composition and temperature against literature data (slide 6)
    - observation_id: bielefeldt2013_effective_viscosity_model
      type: model_parameter_context
      locator:
        page: 19
        published_page: 19
        equation: Roscoe-Einstein (Pretorius and Carlisle)
      units: dimensionless
      values:
        method_class: quoted_attributed
        evidence_class: quoted_attributed
        equation_as_printed: η_e = η (1 − 1.35 Θ)^(−5/2)
        symbols:
          η_e: effective viscosity of the slag
          η: viscosity of the molten (Liquid) slag
          Θ: fraction of precipitated solid phases
        attribution: Pretorius and Carlisle effective-viscosity concept, based on the Roscoe-Einstein model (slide
          19)
        applied_case: 'Figure 10: effective viscosity for the liquid slag 10.3 wt% MgO, 20 wt% Al2O3, 46.5 wt% CaO,
          23.3 wt% SiO2 at 1,600 °C (slide 21); curve figure_only'
    - observation_id: bielefeldt2013_conclusions
      type: literature_comparison
      locator:
        page: 22
        published_page: 22
        section: General Conclusions
      units: qualitative
      values:
        method_class: model_derived
        evidence_class: model_derived
        conclusions_as_printed:
        - The 1600 °C isotherm of the Slag Atlas 20 wt% Al2O3 diagram and the FactSage diagram show acceptable similarity
        - Some FactSage periclase-saturation MgO contents are somewhat smaller than the Slag Atlas data
        - The Slag Atlas gives no viscosity values for B2 = 2; for some compositions at 1,500 °C it shows some consistency
          with FactSage values
