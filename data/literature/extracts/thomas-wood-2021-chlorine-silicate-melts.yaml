source_id: thomas-wood-2021-chlorine-silicate-melts
source:
  citation: Thomas, R. W. & Wood, B. J. (2021), "The chemical behaviour of chlorine in silicate melts",
    Geochimica et Cosmochimica Acta 294:28–42, DOI 10.1016/j.gca.2020.11.018
  doi: 10.1016/j.gca.2020.11.018
  url: https://doi.org/10.1016/j.gca.2020.11.018
  year: 2021
extraction:
  method: pdftotext -layout of publisher article-in-press PDF (GCA 11993; encrypted, text layer present)
    cross-checked against 150 dpi pdftoppm PNG of Table 1 (PDF p.4) and Table 2 (PDF p.7). Verbatim numbers
    retained. Parenthetical Clglass uncertainties as printed. Unit companions T_K = T_C + 273.15 and P_Pa
    = P_GPa * 1e9 carry derived stamps. Author Henry-region logClmelt regressions stay in context (model_derived
    cohort not scored). Supplementary Table 1 glass majors not present as numbers in the supplied PDF
    body and were not reconstructed.
  date: '2026-09-22'
  worker: n6-thomas-ueshima-jaggi
review_status: draft
corrections:
- note: Table 2 reprints AgI/Cl-005 in the pressure series with Measured Clglass wt% printed as 2.55 (0.4);
    the same experiment ID is printed as 2.55 (0.04) in the time, f(Cl2), and temperature series blocks.
    Both spellings retained without reconciliation.
  locators:
  - pdf_page_index 7 Table 2
