          \                                                     37\n\n  Phase equilibria\
          \ studies were conducted for the CaO-MgO-ZnO system. The initial\nexperimental\
          \ compositions for the CaO-MgO-ZnO system are shown in Table 1 in\nChapter\
          \ 3. The initial composition was selected as an area in the phase diagram\n\
          where two or three different equilibrium phases co-exist. The initial compositions\n\
          were marked in the phase diagrams as open symbols, as shown in Figures 15\
          \ to 17.\nFigures 13 (a) to (d) show SEM images of the equilibrated phases\
          \ of the CaO-MgO-\nZnO system at 1500, 1550, and 1600 oC, respectively.\
          \ Immiscible monoxide#1,\nmonoxide#2, and zincite solid solutions were observed\
          \ at 1500 oC and 1550 oC. A\nnon-equilibrium slag phase was also observed\
          \ at 1550 oC. It is assumed that the\nliquid slag phase would be unstable\
          \ with the narrower area in the phase diagram,\nas shown in Figure 16. The\
          \ unstable slag phase could be changed to a monoxide or\nzincite phase.\
          \ At 16oo oC, immiscible monoxide#1, monoxide#2, and liquid slag\nphases\
          \ were observed. The zincite phase was not observed due to Zn vaporization,\n\
          as shown in Figure 17. The composition of the equilibrium phases of the\
          \ CaO-MgO-\nZnO system are shown in Table 5. The standard deviations of\
          \ equilibrated phases\nfrom EDS results were observed as 0.1 to 2.7 mol%.\
          \ This could be caused by Zn\nvaporization. EPMA was not available in this\
          \ study which could have made results\nmore accurate.\n\n\n\n\nFigure 13.\
          \ SEM image of phase equilibria of the ternary CaO-MgO-ZnO systems. Initial\n\
          composition: 0.3CaO-0.2MgO-0.5ZnO and 0.1CaO-0.2MgO-0.7ZnO for all temperatures.\
          \ (a) at\n1500 oC (b) at 1550 oC (c) at 1600 oC (center), and (d) at 1600\
          \ oC (edge), Publication 2, © 2022\nJunmo Jeon and Daniel Lindberg. Published\
          \ by Elsevier Ltd., under CC by 4.0.\n\n  More phase equilibria studies\
          \ for the CaO-MgO-ZnO system at 1500 oC were\nperformed. The initial experimental\
          \ compositions are shown in Table 1. The initial\ncomposition was selected\
          \ from areas in the phase diagram where two different\nequilibrium phases\
          \ co-exist, marked in the phase diagrams as open symbols, as\nshown in Figure\
          \ 15. As a result, Figures 14 (a) to (d) show SEM images of the\nequilibrated\
          \ phases of the CaO-MgO-ZnO system at 1500 oC. Two different\nequilibrium\
          \ phases were observed, i.e., immiscible monoxides or zincite. In\nparticular,\
          \ un-equilibrated phases were observed at the boundary of the\nequilibrated\
          \ phases, as shown in Figures 14 (a) and (b). Their composition fits well\n\
          with the tie lines of the immiscible monoxide phases of the phase diagram\
          \ at 1500\noC, as shown in Figure 15.\n\n\n\n\n                        \
          \                      38\n\nFigure 14. SEM images of phase equilibria of\
          \ the ternary CaO-MgO-ZnO system at 1500 oC, Initial\ncomposition: (a) 0.45CaO-0.45MgO-0.1ZnO\
          \ (b) 0.375CaO-0.375MgO-0.25ZnO (c) 0.02CaO-\n0.35MgO-0.63ZnO, and (d) 0.4CaO-0.05MgO-0.55ZnO,\
          \ Publication 2, © 2022 Junmo Jeon and\nDaniel Lindberg. Published by Elsevier\
          \ Ltd., under CC by 4.0.\n\n  Figures 15 to 17 show the phase diagrams of\
          \ CaO-MgO-ZnO at 1500, 1550, and\n1600 oC, respectively. The dash-dot lines\
          \ were calculated by FactSage database,\nwhile the solid lines were calculated\
          \ using the optimized parameters in this study.\nThe equilibrated experimental\
          \ data are marked as symbols in the phase diagrams.\nThe optimized parameters\
          \ for the binary MgO-ZnO, CaO-ZnO, and CaO-MgO\nsystems were also in good\
          \ agreement with the experimental data at 1500 oC and\n1550 oC, while an\
          \ additional ternary parameter of 1600 o C was required due to the\ngreat\
          \ stability of the liquid phase. Therefore, a ternary parameter for the\
          \ monoxide\nsolid solution was introduced because the monoxide phases were\
          \ significantly\nstable in the phase diagram. The optimized lines are in\
          \ good agreement with the\nexperimental data, as shown in Figures 15 to\
          \ 17. In particular, the optimized lines\nreflect well the liquid phase\
          \ observed in the phase equilibria study in this study at\n1550 oC and 1600\
          \ oC. The optimized parameter values are shown in Table 6.\n\n\n\n\nFigure\
          \ 15. Optimized phase diagram of the ternary CaO-MgO-ZnO system at 1500\
          \ oC. Experimental\ndata from this study, Publication 2, © 2022 Junmo Jeon\
          \ and Daniel Lindberg. Published by Elsevier\nLtd., under CC by 4.0.\n\n\
          \n                                               39\n\nFigure 16. Optimized\
          \ phase diagram of the ternary CaO-MgO-ZnO system at 1550 oC. Experimental\n\
          data from this study, Publication 2, © 2022 Junmo Jeon and Daniel Lindberg.\
          \ Published by Elsevier\nLtd., under CC by 4.0.\n\n\n\n\nFigure 17. Optimized\
          \ phase diagram of the ternary CaO-MgO-ZnO system at 1600 oC. Experimental\n\
          data from this study, Publication 2, © 2022 Junmo Jeon and Daniel Lindberg.\
          \ Published by Elsevier\nLtd., under CC by 4.0.\n\n\n\n\n              \
          \                                 40\n\n  The liquidus lines of the ternary\
          \ CaO-MgO-ZnO system calculated by the FactSage\ndatabase and the optimized\
          \ parameters in this study are shown in Figures 18 (a)\nand (b), respectively.\
          \ The existence of invariant eutectic point for two immiscible\nmonoxides,\
          \ zincite, and liquid phases was expected between 1500 oC and 1550 oC\n\
          for the phase equilibria study because the liquid phase was not observed\
          \ at 1500 oC\nbut observed at 1550 oC and 1600 oC. Figure 18 (a) shows that\
          \ the invariant point\nwas not calculated because the liquid phase is in\
          \ equilibrium with a single monoxide\nbelow 1900 oC. However, the invariant\
          \ point as eutectic point was calculated with\noptimized parameters in this\
          \ study. The eutectic point is 29.6 mol% CaO – 9.0 mol%\nMgO – 61.4 mol%\
          \ ZnO at 1528 oC.\n\n\n\n\nFigure 18. Liquidus lines of the ternary CaO-MgO-ZnO\
          \ system: (a) FToxid database from FactSage,\n(b) Optimized lines from this\
          \ study, Publication 2, © 2022 Junmo Jeon and Daniel Lindberg.\nPublished\
          \ by Elsevier Ltd., under CC by 4.0.\n\n\n\n\n                         \
          \                     41\n\n4.1.3 MgO-ZnO-SiO2\nFor the ternary MgO-ZnO-SiO2\
          \ system, the parameters of liquid solutions for the\nbinary ZnO-SiO2 and\
          \ ternary MgO-ZnO-SiO2 systems were optimized using the\nMQM model with\
          \ phase equilibria studies. For the binary ZnO-SiO2 system, the\noptimized\
          \ Phase diagrams is shown in Figure 19. For the ternary MgO-ZnO-SiO2\nsystems,\
          \ SEM images and optimized phase diagrams are shown in Figure 20 to 25.\n\
          The liquid solution parameters of ZnO-SiO2 systems were optimized with an\n\
          \                                                        \U0001D456\U0001D457\
          \  \U0001D456  \U0001D457               \U0001D45C\U0001D45C\nempirical\
          \ equation, a pair fraction model, ∆\U0001D454\U0001D434\U0001D435 = ∑ \U0001D454\
          \U0001D434\U0001D435 \U0001D44B\U0001D434\U0001D434   \U0001D44B\U0001D435\
