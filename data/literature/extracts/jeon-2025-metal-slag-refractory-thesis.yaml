          FToxid, while the solid lines were calculated by the optimized parameters\
          \ of the\nliquid solution in this study, using MQM with the experimental\
          \ data [83-86]. The\noptimized liquidus lines fit well with the experimental\
          \ data, while the calculated\nphase diagram using parameters of excess Gibbs\
          \ energy from previous data [41]\nshowed gaps from the experimental data\
          \ [83,84,86]. The optimized parameter\nvalues for the binary ZnO-SiO2 system\
          \ are shown in Table 7."
