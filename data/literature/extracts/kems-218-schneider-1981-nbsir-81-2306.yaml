    Figures 1 and 2 were rendered at 600 dpi and recorded without digitising plotted values. The task
    brief's reference to Table 3 on PDF page 7 points to a fit-coefficient table, not raw KEMS readings;
    the report says 250 K-pressure readings underlie the fits, and shows readings only as figure markers.
    No ion-intensity calibration method is printed in this report.
