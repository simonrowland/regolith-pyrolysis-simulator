        cell_configuration_as_printed: Pt/Ni·NiO(s)/ZrO2·MgO/Sn-slag(l)/electrode/Pt
        sample_side_electrodes_as_printed: Iron for iron saturation; tungsten for lower oxygen partial pressure;
          lanthanum-chromate for higher oxygen partial pressure than the metal miscibility gap, respectively.
        cell_train_and_electrode_locator: {published_page: 794, pdf_page_index: 1, section: Experimental, note: Continuation of the p.793 cell description}
