    - observation_id: takeda_1990_gamma_derivation_inputs
      type: context
      locator:
        published_page: 795
        pdf_page_index: 2
        equations: 6–7
      units: as printed
      values:
        quantity: SnO_activity_coefficient_calculation_inputs
        standard_state: SnO(l), pure liquid oxide standard as denoted by γSnO(l)
        method: Author reduction using K, (%Sn), [%Sn], (n_T), [n_T], pO2 and [gamma_Sn] in equations (6)–(7).
          K comes from equation (5); slag/metal composition and oxygen-cell measurements are this study's inputs.
          Metal [gamma_Sn] at 1573 K was estimated from Nunoue data at 1823 K and 1873 K.
        activity_basis: SnO is estimated as divalent; no gas-ion or ion-current definition is used
        equation_6_as_printed: K = a_SnO/(a_Sn pO2^(1/2)) = (gamma_SnO)(%Sn)[n_T]/{[gamma_Sn](n_T)[%Sn]pO2^(1/2)}
        equation_7_as_printed: (%Sn) = K[%Sn](n_T)pO2^(1/2)[gamma_Sn]/{(gamma_SnO)[n_T]}
        definitions: Parentheses designate slag and square brackets designate metal; a is activity and gamma is activity coefficient.
        n_T_basis_g: 100
        n_T_definition: Total mole number of constituents in 100 g of metal or slag; [n_T] is metal and (n_T) is slag.
        calculation_discussion_locator: {published_page: 798, pdf_page_index: 5, section: Activity coefficient of SnO}
        reduction_scope: The published 1.0–7.0 summary endpoints are not uniquely assigned to individual table rows; retained as author-reduction context with no invented reduced Observation.
