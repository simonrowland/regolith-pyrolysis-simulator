        E_unit_as_printed: V
        Ni_oxidation_reaction_as_printed: Ni(s) + 1/2 O2 = NiO(s)
        equation_5_reference_assumption: Activities of unity for both SnO(l) and Sn(l); this is the reference equilibrium, not every Sn-Fe alloy run.
    - observation_id: takeda_1990_analysis_and_qualifications
      type: context
      locator:
        published_page: 794
        pdf_page_index: 1
        section: Experimental
      units: as printed
      values:
        quantity: analysis_and_data_qualifications
        analysis: HCl dissolution; Si gravimetric; Fe in slag or metal over 20% and ferrous iron in slag
          by volumetric K2Cr2O7 titration; Ca by spectrophotometric EDTA titration; small Fe/Sn/MgO by AAS;
          tin in slag and metal over 20 mass% by KI standard-solution titration.
        ferric_correction_reaction: 2Fe3+(slag) + Sn2+(slag) = 2Fe2+(aq) + Sn4+(aq)
        ferric_uncertainty: authors state stoichiometry of the ferric correction was uncertain; Fe3+ derived by
          difference from total and ferrous iron
        volatilization_qualification: authors considered oxygen-potential decrease from SnO volatilization insignificant
          because samples were taken within one minute after EMF and diffusion was faster than SnO volatilization
        stirring: viscous slag B stirred two or three times with a magnesia rod before EMF measurement
        postrun_sampling: slag sampled immediately after EMF with a water-cooled copper tube; liquid metal sucked through a silica tube
        composition_drift: composition changes with oxygen potential; measured equilibrium slag/metal compositions
          are reported per test rather than treated as fixed starting compositions
