        electrode_protection: Tungsten or lanthanum-chromate rods were covered with a magnesia tube.
        oxygen_measurement: EMF against Ni/NiO oxygen reference, converted to log pO2 using the printed cell relation
          and standard Gibbs energies
        oxygen_potential_control: Sn-Fe metal composition and ratio of pre-melted FeOx-CaO-SiO2 slag to chemical reagents
        temperature_calibration: not stated for the slag-metal experiments
        mass_spectrometry: not used; ionization cross sections, ionization energy, multiplier/isotope corrections
