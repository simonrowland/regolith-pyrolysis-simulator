source:
  citation: Hastie, J. W. and Bonnell, D. W. (1980), Molecular Chemistry of Inhibited Combustion Systems, National
    Bureau of Standards, NBSIR 80-2169, final report, December 1980.
  year: 1980
extraction:
  method: Table content transcribed from MinerU machine text and checked against pdftotext-layout. Every cell in
    the included tables was checked against its rendered PDF page; the render resolved layout and digit conflicts.
    The source is born-digital.
  date: '2026-11-07'
  worker: w1107hb-hb80
  provenance_path: raw/hastie-bonnell-1980-nbsir-80-2169-molecular-chemistry/hastie-bonnell-1980-nbsir-80-2169-molecular-chemistry.pdf
review_status: draft
corrections: []
scope_assessment:
  requested_data: High-temperature gas partial pressures and thermochemistry for P-, Na-, and Li-bearing vapor species,
    plus the authors' printed reaction-model data.
  included_printed_tables:
    main_table_2_rows: 10
    main_table_3_rows: 15
    main_table_4_rows: 10
    appendix_B_table_2_rows: 6
    appendix_D_table_D_1_rows: 3
    appendix_D_table_D_2_rows: 7
    appendix_E_table_E_1_rows: 4
    appendix_E_unnumbered_PO_comparison_rows: 3
    appendix_E_table_E_2_rows: 6
    appendix_E_table_E_3_rows: 4
    appendix_E_table_E_4_rows: 8
  excluded_printed_tables:
  - locator:
      page: 21
      published_page: 15
      table: '1'
    reason: Qualitative flame and smoke outcomes; no vapour or thermochemical values.
  - locator:
      page: 114
      published_page: '1122'
      table: '1'
    reason: Burner and measurement-technique inventory; not vapour or thermochemical results.
  - locator:
      page: 143
      published_page: B17
      table: '1'
    reason: Flame-property comparison table; not vapour or thermochemical results.
  - locator:
      page: 169
    reason: Duplicate scan of Table D.2 on printed page D7; stored once at PDF page 167.
  - locator:
      page: 203
    reason: NBS report cover form, not a data table.
  - locator:
      page: 205
    reason: Date-due page, not a data table.
  figure_only_candidates:
  - Figures D.3-D.9: Underlying Na and Li emission intensities and experimental error bounds are figure-only; no
      point values were read from them.
  - Figure 6: HPO2/PO temperature curve; no figure-only values were read.
  note: Table 2 reports ion-intensity-normalized pressure values, not raw ion intensities. The printed TMP column
    is retained as printed and is not mapped to total flame pressure because the report does not define it as the
    flame's total pressure. No unprinted pressure, gas mixture, or temperature is added. Rows in Tables 3, 4, D.1
    and D.2 that lack exact quantity tokens are typed-refused and retained in full below. Printed numbers in parentheses
    in main Table 2 are predicted equilibrium partial pressures, not measurement errors. Main Table 2 upper-limit
    pressure cells are retained verbatim in its full-table record; the existing pressure selection path does not
    migrate partial-pressure bounds.
schema_gaps:
- quantity: flame_reaction_kinetic_parameters
  symbols:
  - tools/validate_literature_extracts.py::OBSERVATION_TYPES
  - simulator/battery/enums.py::Quantity.LOG10_K_REACTION
  - simulator/battery/enums.py::Quantity.MASS_LOSS_RATE
  - simulator/battery/migrate.py::QUANTITY_ALIASES
  - simulator/battery/migrate.py::TYPE_QUANTITY
  reason: The closed quantities contain log10_K_reaction but no linear reaction equilibrium constant, reaction enthalpy,
    rate constant, or reaction rate. MASS_LOSS_RATE is not a chemical reaction rate; LOG10_K_REACTION is log-only.
    Tables 3 and 4 remain typed-refused.
- quantity: relative_gas_pressure_ratio
  symbols:
  - simulator/battery/enums.py::Quantity.VALENCE_RATIO
  - simulator/battery/enums.py::Quantity.ION_INTENSITY_RATIO
  - simulator/battery/enums.py::Quantity.DISTRIBUTION_RATIO
  reason: The HPO2/PO and H/H2O pressure ratios and NaPO2/Na and LiPO2/Li ratios are not valence ratios, ion-intensity
    ratios, or a phase-distribution ratio. They remain typed-refused in Tables D.1 and D.2.
- quantity: bond_dissociation_energy_and_thermochemical_fit_coefficients
  symbols:
  - simulator/battery/enums.py::Quantity.DELTA_FH
  - simulator/battery/enums.py::Quantity.CP
  - simulator/battery/enums.py::Quantity.S
  reason: The Table E.2 D(X-PO) bond-dissociation energies are not formation enthalpies. Table E.1 coefficients
    are a seven-coefficient thermodynamic-function representation, not CP or S values. Both remain typed-refused;
    the exact S and elemental-frame formation enthalpies are separately admitted from Tables E.2-E.4.
