          \ the Li4 SiO4 phase was not considered in the present work for the reasons previously\n                 discussed\
          \ in Section 5.1, although an increase of entropy is resulted from this transformation.\n                 However,\
          \ it does not affect significantly the modeling on this region of the phase diagram.\n                       The\
          \ data for invariant reactions calculated with the thermodynamic parameters op-\n                 timized in the\
          \ present work are compared with temperatures experimentally determined\n                 by different methods like\
          \ quenching method from [10,54], DTA from [11,12,54–56], drop\n                 calorimetry from [35], KEMS from\
          \ [51], DSC from [41,57] and assessment from [15] in\n                 Table 6. Results of calculations for the\
