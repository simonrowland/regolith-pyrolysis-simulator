    - observation_id: greig1927_t1_calibration_materials
      type: method
      locator: {page: 7, published_page: 7, table: I, note: Table notes; standard melting points/e.m.f. reference Day and Sosman 1911 and Adams 1914}
      units: text
      values:
        method_class: method_only
        procedure: Both determinations printed when two runs were made. Gold was Heraeus pure gold; palladium was used in establishing the nitrogen thermometer scale; platinum was that of the thermoelement. Metal melting e.m.f. determined by heating curves; small gold/palladium pieces formed the thermoelement wire junction.
    - observation_id: greig1927_silica_lots_preparation
      type: method
      locator: {page: 8, published_page: 8, section: Materials used}
      units: g; mm; hours; °C
      values:
        method_class: method_only
        lot_a: Laboratory stock quartz crushed and purified with HCl; evaporation with HF and H2SO4 followed by ammonium carbonate left 0.0056 g residue from a 10-g analytical sample. Sparse inclusions, the larger approximately 0.005 mm and almost full of liquid.
        lot_b: Quartz crystal from Hot Springs, Arkansas; no microscopically visible inclusions.
        lot_c: Quartz of unknown origin; no microscopically visible inclusions.
        preparation: Ground quartz from all three lots heated in a gas furnace for 3 hours near 1600°. Lots a and b completely converted to cristobalite with numerous voids (b almost opaque). Lot c less than half cristobalite with remaining quartz; its cristobalite homogeneous and void-free. Lot c subsequently converted first to silica glass, then crystallized to homogeneous cristobalite.
    - observation_id: greig1927_earlier_calibration_footnote
      type: method
      locator: {page: 8, published_page: 8, note: Footnote 10; compare precise calibration values on p. 10}
