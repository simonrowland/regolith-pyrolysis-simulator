    - observation_id: greig1927_prior_alumina_silica_work
      type: quoted_context
      locator: {page: 27, published_page: 27, note: Continues p. 28; Bowen and Greig 1924}
      units: wt%
      values:
        method_class: quoted
        statement: Prior investigation ranged from pure silica to 90 per cent Al2O3, completely melting mixtures up to 75 per cent Al2O3. No immiscibility; exact cristobalite liquidus not determined throughout because equilibrium took too long. Homogeneous glasses prepared at 1¼, 2½ and 5 per cent Al2O3 and investigated enough to show no abnormal liquidus shape.
    - observation_id: greig1927_prior_alkali_silica_work
      type: quoted_context
      locator: {page: 28, published_page: 28, note: Na2O and K2O binary discussion; Figs. 16–17}
      units: text
      values:
        method_class: quoted
        statement: Morey and Bowen sodium metasilicate-silica study showed no immiscibility. Potassium metasilicate-silica diagram constructed from Morey and Fenner H2O-K2O.SiO2-SiO2 data by extrapolating eutectics; no silica-liquidus points determined. Greig's own K glasses are carried separately.
