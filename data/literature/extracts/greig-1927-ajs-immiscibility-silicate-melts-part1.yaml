      type: method
      locator: {page: 25, published_page: 25, section: Material used}
      units: mass percent; text
      values:
        method_class: method_only
        preparation: J. T. Baker C.P. BaCl2 dissolved in water and precipitated with concentrated HCl to remove other group members; chloride washed with concentrated acid and procedure repeated. Double precipitation with ammonia and ammonium carbonate. Very pure carbonate mixed with laboratory stock quartz.
        spectroscopic_analysis: E. G. Zies found calcium not detectable, strontium possibly trace but certainly less than 0.05 per cent, lead absent.
