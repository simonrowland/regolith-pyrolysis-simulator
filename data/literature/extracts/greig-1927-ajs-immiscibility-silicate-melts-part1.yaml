        method: Pt-Rh furnace designed and built by H. S. Roberts
        result: Silica-rich MgO-SiO2 and CaO-SiO2 mixtures formed two immiscible liquids when all crystals disappeared; SrO-SiO2 behaved similarly; BaO-SiO2 melted to a single liquid.
    - observation_id: greig1927_wire_and_refractory_preparation
      type: method
      locator: {page: 4, published_page: 4, note: Continues p. 5 and Fig. 1 caption}
      units: text
      values:
        method_class: method_only
        wire: Pt-Rh purified and drawn by Heraeus; Pt purified by E. Wichers of the United States Bureau of Standards. Commercial Pt iridium contaminates the thermoelement and reduces its e.m.f.; all Pt introduced into the furnace was to be as pure as possible.
        refractory: Norton dense alundum tube with very little bond shrank only slightly; pre-firing above operating temperature was desirable but could not be done. Purest grain alundum central packing shrinks much less than magnesia and avoids repacking between windings.
    - observation_id: greig1927_leakage_and_calibration_procedure
      type: method
      locator: {page: 6, published_page: 6, note: Charge-length and furnace exploration continuation p. 7}
      units: μV; text
      values:
        method_class: method_only
        leakage_statement: Leakage very rarely as much as 15 μV and always steady; carefully shielded measuring system. Reversing heating current reversed leakage sign without changing furnace temperature. DC readings corrected for leakage; much work used the sufficiently constant nighttime AC supply, which avoided leakage trouble.
        calibration: Working element 4 compared frequently with standards 5 and 7 at constant temperature to obtain its correction; standards inserted only for comparisons and remained practically constant. After standard calibration the MgO, CaO and SrO two-liquid temperatures were determined and later used as fixed points.
        furnace_check: Furnace frequently repacked and explored to check hottest-point position; central charges never over ½ cm long had negligible temperature gradient.
