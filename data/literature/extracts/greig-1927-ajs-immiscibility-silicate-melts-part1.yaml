    - observation_id: greig1927_magnesia_liquid_separation
      type: characterization
      locator: {page: 21, published_page: 21, note: Continued pp. 22–24; Figs. 7–11}
      units: wt%; °C; min; mm
      values:
        method_class: measured_text
        composition_mass_percent: {MgO: 15, SiO2: 85}
        method: Three powder charges in platinum crucibles heated in quenching furnace at 1715° for 10, 30 and 180 minutes respectively; thin sections examined microscopically.
        result_10_min: Viscous siliceous cylinder with intimately mixed phases; more fluid magnesian phase drains or is squeezed out, collecting below. Cristobalite formed in drained phase on cooling.
        result_30_min: More magnesian phase drained than first charge; irregular masses about 1 mm diameter and much smaller spherical globules distributed through siliceous phase.
        result_180_min: Irregular masses collected into larger ones, some probably drained out; small globules remained as thickly distributed. Separation initially fairly rapid, then slows; very long heating would be needed to complete separation.
