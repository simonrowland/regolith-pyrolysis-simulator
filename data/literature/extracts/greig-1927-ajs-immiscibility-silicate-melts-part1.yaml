    - observation_id: greig1927_calibration_and_melting_comparison
      type: method
      locator: {page: 12, published_page: 12, section: Discussion}
      units: °C
      values:
        method_class: author_statement
        comparison: Present 1713° ± 5° versus Ferguson and Merwin 1710° ± 10°. Prior result extrapolated calibration from palladium melting; present result interpolated two elements calibrated at platinum 1755°, palladium 1549.5°, gold 1062.6°, ice 0°, and another element at platinum 1755°, anorthite 1550°, diopside 1391.5°.
        phase_rule: Cristobalite plus two liquids plus vapor are four phases in a binary invariant system, allowing only one equilibrium temperature.
