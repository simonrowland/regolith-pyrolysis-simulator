    - observation_id: greig1927_cristobalite_microscopy
      type: characterization
      locator: {page: 41, published_page: 41, note: Continued p. 42–43}
      units: magnification; count; text
      values:
        method_class: measured_text
        microscopy: At magnification 600–1200 dots usually form clusters; larger ones can be rods radiating from a common center. In a few favorable cases rods counted as six; in others more and complex. Orientation not definitely determined, apparently octahedron-corner axes. Skeletons grade through fir-tree forms into well-shaped cube/octahedron cristobalite.
        x_ray_method: R. W. G. Wyckoff powder-method X-ray photographs show faint sharp cristobalite lines for larger dots; finer dots give lines too faint to see. Microscopy and X-rays identify cristobalite, not metastable second liquid.
    - observation_id: greig1927_ribbon_quench_details
      type: method
      locator: {page: 44, published_page: 44, note: Opening paragraph continuing p. 43; Fig. 12 preparation from p. 20}
      units: mm; °C
      values:
        method_class: method_only
        droplet_greatest_diameter_mm_as_printed: '< 1'
        ribbon_thickness_mm_as_printed: '0.01'
        method: Narrow Pt-Rh ribbon electrically heated to about 1725°; beaker of water dumped over ribbon to chill droplet. Not perfectly quenched; central small globules formed enough cristobalite to appear brown microscopically.
    - observation_id: greig1927_ten_gram_quench_comparison
      type: characterization
      locator: {page: 44, published_page: 44, note: Second paragraph; distinct comparison charge}
      units: composition wt%; g; °C
      values:
        method_class: measured_text
        composition_mass_percent: {CaO: 37, SiO2: 63}
        charge_mass_g_as_printed: 10
        mass_as_printed: ten-gram charge
        method: Completely quenched by plunging under water.
        author_comparison: At 1700° this liquid would have less viscosity than the approximate 27.5CaO/72.5SiO2 liquid, but its much lower liquidus increases viscosity at quench. The 1700° is a viscosity-comparison condition, not an asserted quench setpoint.
    - observation_id: greig1927_baria_quench_treatments
      type: method
      locator: {page: 44, published_page: 44, note: Final paragraph}
      units: text
      values:
        method_class: method_only
        procedure: Crystal-free baria-silica liquids easily quench clear even in large charges. Holding just below liquidus produces large cristobalite crystals; rapid cooling into a blast of air yields clear glass but higher-index glass film around crystals. Dropping charge under mercury usually removes that film.
        atmosphere_note: Blast of air is a cooling treatment; it does not specify furnace operating atmosphere.
