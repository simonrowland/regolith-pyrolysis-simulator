scope_assessment:
  in_scope:
  - Table II A and B (cristobalite melting quenches) and the printed melting point 1713° ± 5°
  - Table I thermoelement calibration, including signed corrections and replicates
  - Table III all CaO-SiO2, MgO-SiO2 and SrO-SiO2 columns and equilibrium temperatures
  - Table IV A-C, Table V all systems, and Table VI BaO-SiO2
  - Table VII A-E (MgO-CaO-, MgO-Al2O3-, CaO-Al2O3-, MgO-Na2O-, MgO-K2O-SiO2)
  - Printed prose scientific numbers, impurity analyses and material/method facts throughout Part I
  - apparatus pp. 4-8, 10
  out_of_scope:
  - figure curves (figure_only; not digitized)
  - Part II (FeO-SiO2 etc.) is a separate article not in this PDF
