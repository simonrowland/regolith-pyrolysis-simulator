        calibration_as_printed: Diopside 1391°, anorthite 1550°, platinum 1755°; Pt-Rh furnace, Pt:90Pt10Rh thermoelement, White potentiometer. Earlier series made two years before Table II A.
        discrepancy_note: Footnote prints 1391°; p. 10 prints 1391.5° ± 1.5°. Both retained at their own locators.
