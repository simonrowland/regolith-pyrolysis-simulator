        premise: Melting at 1713° assumes cristobalite in equilibrium with liquid at completion of critical runs, without superheating; considerable liquid formed below 1713° but crystals persisted to that temperature and disappeared above it. Table II B used laboratory stock quartz without previous heat treatment.
