        potassium_isotope_as_printed: "potassium-40"
        quote: "Also the anomaly of a high argon-40 content which has been found in the surface of lunar fines (Hanneman, 1970; Heymann and Yaniv, 1970; Hintenberger et al., 1970; Marti et al., 1970; Pepin et al., 1970) might be explained in part as an implantation from the decay of the potassium-40 in a surficial potassium condensate layer on these particles, with subsequent loss of the exposed potassium layer by evaporation or solar wind sputtering."
