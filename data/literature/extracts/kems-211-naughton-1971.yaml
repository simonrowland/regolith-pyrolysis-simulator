    - observation_id: naughton_1971_abstract_evidence_enumeration
      type: qualifying_statement_context
      locator:
        published_page: 449
        pdf_page_index: 0
      units: "printed source context; unscored"
      values:
        method_class: "measured_direct"
        quantity: "abstract_evidence_enumeration"
        evidence_as_printed: ["(1) A high content of K was found in the basaltic component of the lunar fines examined, when compared to the accompanying rock from which presumably they were derived.","(2) From electron microprobe studies, regions of significantly high K content were found on or near the original lunar surfaces, which in some cases showed an anticorrelation with Si.","(3) On heating in a vacuum a low-temperature release pattern was found for K from lunar surface rocks and fines relative to that found for the rock interiors, indicating the presence of surficial K."]
        note: "Enumeration labels 1–3 identify observations; they are not measured counts. Condensation/erosion and surficial K are the authors' interpretation."
