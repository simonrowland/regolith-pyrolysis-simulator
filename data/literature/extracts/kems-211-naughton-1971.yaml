species:
  K:
    observations: []
    context:
    - observation_id: naughton_1971_kems_method_and_schedule
      type: method
      experiment: kems-stepwise-lunar-samples
      locator:
        published_page: 450
        pdf_page_index: 1
        section: Vaporization from Lunar Samples Heated in Vacuum
        note: Quote runs from p. 450 onto p. 451.
      units: verbatim method statement
      values:
        method_class: method_only
        quantity: experiment_description
        quote: >-
          The nature of the vaporization process and of the species vaporized from lunar samples and from terrestrial rocks was investigated by the use of a Knudsen cell-mass spectrometer unit. The theory and methodology of this technique for measurement of equilibrium vapor pressures is well documented (Carlson, 1967). Samples were heated in a platinum container within the cell at approximately 100°C step intervals, from about 200°C to incipient melting at about 1150°C, thereby minimizing sample-crucible interaction. Vacuum in the heated furnace was in the 10^-5 to 10^-6 torr range. Heating at each step was maintained for one hour while repeated spectral scans were made.
    - observation_id: naughton_1971_kems_calibration_and_scan
      type: apparatus
      experiment: kems-stepwise-lunar-samples
      locator:
        published_page: 451
        pdf_page_index: 2
        section: Vaporization from Lunar Samples Heated in Vacuum
      units: verbatim calibration statement; mass range in atomic mass units as printed
      values:
        method_class: method_only
        quantity: calibration_and_mass_range
        mass_range_amu: 0-100
        calibration_standard: B2O3
        quote: >-
          The mass spectral region from 0 to 100 atomic mass units was scanned. Background corrections were applied. Calibration was accomplished using B2O3 as a standard sample.
    - observation_id: naughton_1971_kems_species_and_detection_limit
      type: characterization
      experiment: kems-stepwise-lunar-samples
      locator:
        published_page: 451
        pdf_page_index: 2
        section: Vaporization from Lunar Samples Heated in Vacuum
        note: Quote runs from p. 451 onto p. 452.
      units: verbatim species statement; detection limit in torr as printed
      values:
        method_class: measured_direct
        quantity: detected_species_and_detection_limit
        detection_limit_torr_as_printed: 10^-6
        quote: >-
          Aside from the peaks due to gases normally released from heated rocks, mainly water and carbon dioxide, the alkalis and their oxides were the chief species detected. One lunar sample (12022,47) showed a considerable release of sulfur gas species presumably due to the decomposition of troilite. If other volatiles were present their equilibrium vapor pressures were below 10^-6 torr, the limit of instrument detection. The relative concentrations of the vaporized species evolved at each incremental heating step are shown in Fig. 2. Bracketed species are indistinguishable by mass from the other species shown, but from comparative studies on other alkalis they are believed to be relatively low in concentration. Monatomic ions (Na+, K+), dimers (Na2+, K2+), and oxides (KO+, Na2O+, K2O+) were the distinct species recognized, with no measurable evidence of halides.
    - observation_id: naughton_1971_kems_absolute_pressure_order
      type: qualifying_statement_context
      experiment: kems-stepwise-lunar-samples
      locator:
        published_page: 452
        pdf_page_index: 3
        section: Vaporization from Lunar Samples Heated in Vacuum
      units: verbatim; pressure order of magnitude in torr as printed
      values:
        method_class: measured_reduced
        quantity: partial_pressure_order_of_magnitude
        pressure_order_torr_as_printed: 10^-4
        quote: >-
          Absolute vapor pressures were calculated from these measurements, which showed the main partial pressures to be contributed by K and Na, with pressures in the 10^-4 torr range.
        note: Authors' reduction of their measured spectra; pressure relation, intensities, sensitivities/cross-sections and per-sample/per-temperature inputs are not published. Order of magnitude only, kept unscored without invented lineage.
    - observation_id: naughton_1971_fig2_relative_intensities
      type: figure_only
      experiment: kems-stepwise-lunar-samples
      locator:
        published_page: 452
        pdf_page_index: 3
        figure: '2'
      units: caption verbatim; figure not digitized
      values:
        method_class: figure_only
        quantity: relative_ion_intensity_vs_temperature
        sample_id: Lunar rock 12022,47
        ions_plotted_as_printed: Na2O+(NaK+), Na+, Na2+, K+(NaO+), KO+, K2O+, K2+
        caption: >-
          Fig. 2. Relative intensities of alkali species emitted from a lunar sample during stepwise heating in a Knudsen cell-mass spectrometer system.
    - observation_id: naughton_1971_cold_finger_apparatus
      type: apparatus
      experiment: cold-finger-stepwise
      locator:
        published_page: 452
        pdf_page_index: 3
        section: Vaporization from Lunar Samples Heated in Vacuum
      units: verbatim apparatus statement
      values:
        method_class: method_only
        quantity: apparatus_description
        quote: >-
          One of the most informative techniques was the use of a simple cold finger collector, inserted above the surface of the sample in a small quartz crucible heated by an external furnace. Cooling of the finger was by means of a rapid stream of water circulated internally. The assembly was held within an evacuated (10^-5–10^-6 torr) quartz tube, and the finger could be removed at intervals for qualitative and quantitative analysis of sublimed materials collected onto its surface. While not giving information on specific vapor species, this apparatus was easier to set up and use than the Knudsen cell equipment, and gave good quantitative results.
    - observation_id: naughton_1971_cold_finger_release_peaks
      type: qualifying_statement_context
      experiment: cold-finger-stepwise
      locator:
        published_page: 453
        pdf_page_index: 4
        section: Vaporization from Lunar Samples Heated in Vacuum
        note: Quote runs from p. 453 onto p. 454.
      units: verbatim; peak temperatures in K as printed
      values:
        method_class: author_estimate
        quantity: alkali_release_peak_temperatures
        release_peak_temperatures_K_as_printed:
        - 800
        - 1050
        - 1200
        quote: >-
          Again heating was conducted in the same stepwise manner as in the Knudsen cell experiments. Time studies of alkali evolution showed that a steady-state release (diffusion controlled) of alkalis was quickly achieved, so one hour heating intervals were used. Research with alkali degraded and un-degraded terrestrial basalts showed a pattern of high alkali release in three regions discernible as three peaks centering around 800°K, 1050°K, and 1200°K (Fig. 3). These have been attributed to release of alkali to the sample surfaces along three pathways—directly from the surfaces, through diffusion in microcracks and grain boundaries, and volume diffusion through crystal lattices and through the melt. Samples that have been exposed to alkali vapors have prominent low-temperature release peaks. For lunar samples (Fig. 3) a middle-temperature release peak (1050°K) was found for surface samples and for lunar fines, but not for samples from the interior of the rocks examined.
        note: Peak temperatures are the authors' approximate centres ("centering around"); they are not measured setpoints.
    - observation_id: naughton_1971_fig3_potassium_release
      type: figure_only
      experiment: cold-finger-stepwise
      locator:
        published_page: 453
        pdf_page_index: 4
        figure: '3'
      units: caption verbatim; figure not digitized (axes printed as PERCENT POTASSIUM LOSS/HR. vs TEMPERATURE, °C)
      values:
        method_class: figure_only
        quantity: potassium_loss_rate_vs_temperature
        panels_as_printed: UNREACTED BASALT HK-123; K-DEGRADED BASALT HK-123; INTERNAL SECTION LUNAR ROCK 12002,44; SURFACE SECTION LUNAR ROCK 12052,34; LUNAR FINES 12070,164
        caption: >-
          Fig. 3. Potassium released during stepwise heating of an unreacted tholeiite basalt, and a similar sample after degradation by potassium vapor. Comparison is made with release from internal and external sections of lunar rocks, and with release from lunar fines. Collection of vaporized potassium was made onto a cold finger surface. Dashed lines show characteristic temperature where release occurs from potassium degraded samples.
    - observation_id: naughton_1971_potassium_vapor_exposure
      type: qualifying_statement_context
      locator:
        published_page: 450
        pdf_page_index: 1
        section: Erosion of Rocks by Alkali Vapors
        note: Fig. 1 (p. 451) caption repeats "Maximum potassium vapor pressure about 10^-4 torr". Fig. 1 is a photograph pair and is figure-only.
      units: verbatim; pressure in torr as printed
      values:
        method_class: measured_direct
        quantity: potassium_vapor_exposure_conditions
        max_potassium_vapor_pressure_torr_as_printed: about 10^-4
        quote: >-
          "Before and after" sequential photographs of the action of potassium vapor on a fine-grained terrestrial basalt are shown in Fig. 1. This sample was exposed to potassium vapor with a maximum pressure of about 10^-4 torr, through the sequence of a lunar day. A small piece of lunar rock 12022,47 exposed in the same manner was completely disintegrated.
        figure_1_caption_locator: {published_page: 451, pdf_page_index: 2, figure: '1'}
        figure_1_caption: >-
          Fig. 1. The comminuting action of potassium vapor on terrestrial tholeiite basalt when exposed through the heating cycle of one lunar day. Maximum potassium vapor pressure about 10^-4 torr. A. Before exposure. B. After exposure. The dimensions covered by the photographs are 90 × 120 mm.
        photograph_dimensions_mm_as_printed: 90 × 120
        note: The apparatus for this exposure test is not described. Photograph caption values are carried; no image or curve was digitized.
    - observation_id: naughton_1971_evaporated_nonalkali_elements
      type: characterization
      locator:
        published_page: 454
        pdf_page_index: 5
        section: Vaporization from Lunar Samples Heated in Vacuum
      units: verbatim
      values:
        method_class: measured_direct
        quantity: other_elements_detected_in_evaporate
        threshold_temperature_C_as_printed: above 850
        quote: >-
          In addition to the alkalis, it was possible to detect iron, calcium, and chlorine in the material evaporated from lunar samples treated at temperatures above 850°C, using trace analyses by atomic absorption and spectrophotometric absorption techniques. Aluminum, magnesium, silicon, copper, and titanium also were detected in lower amounts by emission spectroscopy.
    - observation_id: naughton_1971_basaltic_fines_fragment_potassium
      type: composition
      locator:
        published_page: 454
        pdf_page_index: 5
        section: Evidence of Alkali Condensation and Degradation in Lunar Samples
      units: '% as printed; percentage basis not published'
      values:
        method_class: measured_direct
        quantity: potassium_content_of_basaltic_fragments_in_lunar_fines
        K_pct_as_printed: 0.66
        size_fraction_mm_as_printed: between 0.1 and 1 mm diameter
        analysis_method: atomic absorption
        quote: >-
          In order to make a similar comparison basaltic fragments from the lunar fines between 0.1 and 1 mm diameter in size were separated by hand-picking from other particles in the same size range and analyzed separately for alkalis by atomic absorption. Rock type of particles was verified by mounting and identifying as thin sections. An analysis of the small amount of basaltic pieces available was carried out by atomic absorption. These had a potassium content of 0.66%, a concentration about three times greater than that of the assorted other fragments in this size range, and approximately ten times the concentration of this element found in the crystalline rock samples collected in the Apollo 12 area.
        note: The paper prints "0.66%" without stating mass or element-vs-oxide basis explicitly; recorded as printed under K (element), with the field name taken from the printed word "potassium". The fines sample number is not given in this passage.
    - observation_id: naughton_1971_microprobe_surface_potassium
      type: characterization
      locator:
        published_page: 455
        pdf_page_index: 6
        section: Evidence of Alkali Condensation and Degradation in Lunar Samples
        note: Quote runs from p. 455 onto p. 456.
      units: verbatim
      values:
        method_class: measured_reduced
        quantity: near_surface_potassium_enrichment
        interior_comparison_beyond_microns_as_printed: 70
        scan_locations_as_printed: over 200
        surface_enrichment_within_first_microns_as_printed: seventy
        scan_population: Various regions of different samples; separate from the approximately 200 ten-second point counts on rock 12002,144.
        survey_quote: >-
          Scans for over 200 locations on various regions of different samples were taken with the electron microprobe. At each location, pictures of sample topography and of alkali and silicon distribution were made. Visual, photographic, and statistical observations of the surface edges show a tendency for potassium to be concentrated within the first seventy microns from the surface edge. The regions of such concentration were noted on the edges of crystals at the grain boundaries, on the surfaces of crystals along natural cracks or fissures, and along the undisturbed surface edge of the section. An extreme example of this type of concentration is shown in Fig. 4. Some areas of high K concentration showed an anticorrelation with the silicon content (Fig. 4). The basaltic fragments in the fines showed a higher content of potassium than that found in rock pieces as qualitatively judged from the microprobe scans.
        reduction_limitation: Author statistical comparison; no raw counts, t statistic, degrees of freedom or printed test equation are published. No scored observation or invented inputs.
        confidence_level_pct_as_printed: 90
        quote: >-
          In order to evaluate these differences more quantitatively, point counts of ten-second duration were made of random sections of rock 12002,144 for potassium and sodium X-ray emission, going inward from the surface in about 10-micron steps. Approximately 200 such point counts were carried out. "T-test" comparisons were made on the ratemeter read-outs of the rock surface regions and related to those from internal regions (beyond 70 microns). The tests showed that for this sample the potassium content of the surface regions was significantly higher than that of the internal regions to the 90% level of confidence. Sodium showed no such difference, as would be expected from the exchange mechanism proposed.
    - observation_id: naughton_1971_filed_layers_aa_detectability
      type: characterization
      locator:
        published_page: 456
        pdf_page_index: 7
        section: Evidence of Alkali Condensation and Degradation in Lunar Samples
      units: verbatim; relative change detectability in percent as printed
      values:
        method_class: measured_direct
        quantity: atomic_absorption_detectability_and_null_result
        detectable_change_pct_as_printed:
          Na: 1
          K: 5
        quote: >-
          Thin regions were carefully removed by filing from sample 12052,63 going inward from the surface, and were subjected to analysis for alkalis by atomic absorption. Changes of about 1% for sodium and 5% for potassium would be detectable by this means, for the element concentration in these rocks in the size of sample used. No difference between the surface and the interior could be detected.
