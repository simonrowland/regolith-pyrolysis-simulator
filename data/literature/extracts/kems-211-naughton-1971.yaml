    - observation_id: naughton_1971_erosion_and_release_qualifications
      type: qualifying_statement_context
      locator:
        published_page: 450
        pdf_page_index: 1
      units: "printed source context; unscored"
      values:
        method_class: "author_estimate"
        quantity: "observed_comparisons_and_tentative_mechanisms"
        qualifications: [{"published_page":450,"pdf_page_index":1,"quote":"Of the abundant alkalis, sodium has been found to have a slight comminuting effect when tested on terrestrial basalts, but potassium is many times more active in this regard.","status":"Authors' qualitative observed comparison."},{"published_page":450,"pdf_page_index":1,"quote":"There is evidence that an exchange takes place between the potassium vapor and minerals containing sodium, with increased release of sodium vapor from rocks degraded by potassium.","status":"Evidence with proposed alkali-exchange interpretation."},{"published_page":450,"pdf_page_index":1,"quote":"It is noteworthy that glasses or glassy rocks are not attacked.","status":"Authors' observed material qualification; no numeric rate printed."},{"published_page":454,"pdf_page_index":5,"quote":"This suggests that potassium is present at accessible sites in an easily released form on the surface and dust samples, and that it could have been contributed by vapor deposition.","status":"Tentative interpretation of middle release peak, not a new measurement."},{"published_page":456,"pdf_page_index":7,"quote":"However, chemical leaching of the surface of samples of lunar fines as reported by Hapke et al. (1971) and by Keller and Huang (1971) showed potassium as a significant component.","status":"Quoted prior-work qualification of present AA null result."},{"published_page":456,"pdf_page_index":7,"quote":"Verification of these observations on additional samples from diverse areas of the moon would be desirable.","status":"Authors' conclusion limits the evidence."},{"published_page":450,"quote":"Also Russian investigators (Vinogradov, 1971) have noted the violent vaporization that would occur from lava erupted into the lunar vacuum. This latter type of loss is pertinent to the erosional process discussed here, since there would be concomitant condensation of the volatilized vapor in adjacent cooler areas.","status":"Cited prior work and author interpretation; not an independently measured rate.","pdf_page_index":1},{"published_page":450,"quote":"The pathway of vapor access to minerals is on exposed surfaces, but comminution is most likely to result from infiltration along microcracks and grain boundaries. It is probable that the greater specific volume of the exchanged mineral when confined between crystals results in stresses which lead to sundering.","status":"Tentative comminution mechanism.","pdf_page_index":1},{"published_page":450,"quote":"Polycrystalline rocks seem to break apart at grain boundaries, giving smaller pieces or individual crystals. The particles of rock powder are “sticky” and adhere to the larger pieces, with a striking resemblance to the lunar fines.","status":"Qualitative grain-boundary/material comparison.","pdf_page_index":1},{"published_page":450,"quote":"The importance of potassium as a vapor component is a consequence of the generally higher dissociation vapor pressure of potassium compounds (Brewer, 1953).","status":"Cited qualitative pressure comparison; no numeric external-reference pressure imported.","pdf_page_index":1},{"published_page":454,"quote":"Sodium showed little or no evidence of surface segregation, which would be expected if sodium exchange is involved as the mechanism of comminution.","status":"Observed sodium null comparison with tentative exchange interpretation.","pdf_page_index":5},{"published_page":454,"quote":"In the subsequent experiments, potassium-silicon correlations were studied to enable differentiation between potassium associated with regions of high silicon content, as in the mesostasis, and unassociated or anticorrelated potassium which might be ascribed to other concentrating mechanisms such as vapor condensation.","status":"Method/interpretation qualification; sentence continues onto p. 455.","pdf_page_index":5}]
        note: "Qualitative observations and tentative mechanisms distinguished; no new pressure/activity value or reduction model."
  Na:
