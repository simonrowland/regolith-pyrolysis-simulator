    - observation_id: naughton_1971_potassium_triggered_sodium_release
      type: qualifying_statement_context
      experiment: cold-finger-stepwise
      locator:
        published_page: 454
        pdf_page_index: 5
        section: Vaporization from Lunar Samples Heated in Vacuum
      units: verbatim
      values:
        method_class: measured_direct
        quantity: sodium_release_enhancement
        quote: >-
          Also it was noted that the ease of sodium release was increased for rock samples that have been partially eroded by exposure to potassium vapor, suggesting that alkali exchange is involved in the erosion mechanism. A similar pattern of anomalous potassium-triggered release of sodium was noted for lunar surface and fines samples, although not for interior samples, again suggestive of surficial potassium available for exchange.
