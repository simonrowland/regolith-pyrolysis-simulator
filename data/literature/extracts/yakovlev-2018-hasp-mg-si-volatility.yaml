          model: Korzhinskii acid-base interaction interpretation of evaporation in the CMAS system
          qualifications:
            - quote: "An inversion of SiO2 and MgO volatility occurs during high-temperature melt evaporation in the CaO–MgO–Al2O3–SiO2 (CMAS) system."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Abstract}
            - quote: "SiO2, which is usually more volatile than MgO, becomes less volatile during the evaporation of melts enriched in the refractory oxides CaO and Al2O3."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Abstract}
            - quote: "The volatility inversion is adequately explained within the theory of acid–base interaction of silicate melt components developed by D.S. Korzhinskii."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Abstract}
            - quote: "The compositions of high-Al2O3 and SiO2-poor glasses (known as HASP glasses) from the lunar regolith show a systematic decrease in MgO/SiO2 with increasing CaO content, which is a direct consequence of the influence of acid–base effects."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Abstract}
            - quote: "HASP glasses were found in the regolith material of almost all lunar missions."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "the content of CaO, as the main contributor to melt basicity in the CMAS system, controls the activities and, correspondingly, volatilities of SiO2 and MgO."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "an inversion in SiO2 and MgO volatility occurs at increasing CaO content in the melt."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "This results in that SiO2 (which is more volatile than MgO) becomes less volatile than MgO in melts enriched in the refractory oxides CaO and Al2O3."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "During melt evaporation, its relative enrichment in refractory CaO leads to a concomitant decrease in MgO content and an increase in SiO2 content relative to MgO."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "As a result, the MgO/SiO2 ratio of the residual melt decreases, which is observed in the real compositions of Ca–Al inclusions from CV3 chondrites (Fig. 1a)."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "The systematic decrease of MgO/SiO2 value in melt at an increase in its CaO content is undoubtedly a direct consequence of the influence of acid–base interaction."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "Their composition provides compelling evidence for extensive volatility-controlled differentiation (Naney et al., 1976)."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "The compositional characteristics of HASP glasses (high Al2O3 and low SiO2 contents) are related to the selective high-temperature volatilization of melt components with almost complete loss of SiO2 and retention of refractory CaO and Al2O3 in the residue."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "It can be seen that the compositions form an almost linear trend of decreasing SiO2/Al2O3 with increasing CaO and Al2O3 contents in the rocks and glasses."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "The distribution of the compositions of HASP glasses is characterized by (1) lower SiO2/Al2O3 values compared with the ANT rocks, which could be parental for the impact glasses, and (2) a decrease in the SiO2/Al2O3 ratio of glasses with increasing contents of CaO and Al2O3, which is obviously related to different thermal and evaporation histories."
              locator: {page: 71, published_page: 71, pdf_page_index: 0, section: Introduction}
            - quote: "All the compositions that fall below this limit could be formed only through evaporative differentiation; hence, this limiting ratio can be served for the identification of HASP glasses."
              locator: {page: 72, published_page: 72, pdf_page_index: 1, section: Introduction}
            - quote: "igneous rocks of the anorthosite series cannot have lower ratios."
              locator: {page: 72, published_page: 72, pdf_page_index: 1, section: Introduction}
            - quote: "Our experiments on chondrite and lunar basalt evaporation (Yakovlev et al., 1984, 1987; Markova et al., 1986) clearly indicated that a significant decrease in SiO2 content in the evaporating melt is accompanied by an increase in MgO content, which suggests that the volatility of MgO is lower than that of SiO2."
              locator: {page: 72, published_page: 72, pdf_page_index: 1, section: Role of the acid-base factor}
            - quote: "However, this experimental observation is not supported by the real compositions of HASP glasses, which do not show MgO enrichment relative to SiO2."
              locator: {page: 72, published_page: 72, pdf_page_index: 1, section: Role of the acid-base factor}
            - quote: "The minus sign of the degree of association β implies that SiO2 in melt is an acceptor rather than a donor of oxygen ions."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Role of the acid-base factor}
            - quote: "In terms of acid–base properties, the CMAS system consists of acidic (SiO2), amphoteric (Al2O3), and basic (CaO and MgO) oxides. Calcium oxide is the most basic component and is, therefore, the main donor of oxygen ions in melt; consequently, its concentration exerts a controlling influence on melt basicity."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Discussion}
            - quote: "Relations (2) and (4) indicate that an increase in melt basicity (activity of O2–) must be accompanied by an increase in the activity of MgO, which shows basic properties in melt, and a decrease in the activity of SiO2, which shows acidic properties."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Role of the acid-base factor}
            - quote: "In turn, the activity of a component in melt controls its volatility"
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Role of the acid-base factor}
            - quote: "the higher the CaO content in melt, the higher the MgO activity and the lower the SiO2 activity."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Discussion}
            - quote: "In accordance with this relation, MgO will show high volatility in CaO-rich melts, which can become even higher than that of SiO2."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Discussion}
            - quote: "Our previous thermodynamic calculations showed that an inversion in the activities and, correspondingly, volatilities of MgO and SiO2 occurs at CaO contents of ~20–25 wt % (Shornikov, 2008, 2016; Yakovlev et al., 2017)."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Discussion}
            - quote: "an increase in the content of refractory CaO and, correspondingly, an increase in melt basicity during melt evaporation are accompanied by an increase in the activity and volatility of MgO and a decrease in those of SiO2."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Discussion}
            - quote: "The evaporation will result in the depletion of MgO in the residual melt and SiO2 enrichment relative to MgO, despite SiO2 vaporization."
              locator: {page: 73, published_page: 73, pdf_page_index: 2, section: Discussion}
            - quote: "this process will result in a decrease in their MgO content, which is observed in HASP glasses."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Discussion}
            - quote: "The MgO/SiO2 ratio of HASP melts will decrease with increasing CaO content."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Discussion}
            - quote: "the MgO/SiO2 ratio of HASP glasses is an order of magnitude lower than that of Ca–Al inclusions. In addition, HASP glasses show a weaker correlation between this ratio and CaO content."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Discussion}
            - quote: "It can be suggested that evaporation during a highly disordered turbulent shock event occurred at a higher mean temperature and within a shorter period of time, which could result in a more significant MgO loss from the high-CaO melt."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Discussion}
            - quote: "The evaporation of MgO and SiO2 from melts in the CaO–MgO–Al2O3–SiO2 system is controlled by the acidity–basicity factor, which is a function of CaO content."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Conclusions}
            - quote: "An increase in CaO concentration in melt causes an increase in the activity and, correspondingly, volatility of MgO and a decrease in the activity and volatility of SiO2."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Conclusions}
            - quote: "The MgO/SiO2 ratio of lunar HASP glasses decreases systematically with increasing CaO content, which is a direct consequence of the influence of the acid–base interaction."
              locator: {page: 74, published_page: 74, pdf_page_index: 3, section: Conclusions}
