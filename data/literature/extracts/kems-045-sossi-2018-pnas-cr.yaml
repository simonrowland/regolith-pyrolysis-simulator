    6 pages; published 10920-10925). Born-digital. pdftotext -layout used only as a map; Table 1 and printed
    prose numbers transcribed from a 400 dpi pdftoppm render (PDF pages 1-6). Where the decode and the
    render disagree the render wins (PCC-1 d53Cr row is split across lines in pdftotext). This paper is
