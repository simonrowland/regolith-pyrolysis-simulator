        sulphur_capacity_definition_as_printed: 'Cs = (wt% S) x (pO2/pS2)^1/2'
        how_equilibrium_shown_as_printed: CaS X-ray diffraction lines begin to show for (pS2/pO2)^1/2 exceeding the saturation
