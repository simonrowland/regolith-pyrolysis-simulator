- experiment_id: sossi-2020-p-5-04-17b
  bench_id: sossi-vertical-tube-furnace
  method: 1-atm_vertical_tube_furnace_evaporation
  locator: &id003
    page: 6
    table: '1'
    record: P 5/04/17b
  sample:
    mass_kg:
      state:
        tag: value
        value:
          kind: point
          point: '0.000025'
          approximate: true
      locator:
        published_page: 318
        pdf_page_index: 2
        section: 2.1 Experimental
        note: Printed sample mass about 25 mg; SI unit conversion only
    printed_composition:
      state:
        tag: value
        value: An42Di58 with about 15 wt% forsterite and about 15 wt% Fe2O3; Cu-Zn or Metalloids trace-element mix
      locator:
        published_page: 318
        pdf_page_index: 2
        section: 2.1 Experimental
    initial_composition:
      state:
        tag: value
        value:
          basis: sossi_2020_measured_oxide_mole_fraction
          amount_basis: mole_fraction
          components:
          - [CaO, '0.178646943159']
          - [Al2O3, '0.059209341645']
          - [SiO2, '0.395271364779']
          - [MgO, '0.219592440789']
          - [FeO, '0.115579694296']
          - [CuO0.5, '0.014498540589']
          - [ZnO, '0.017201674743']
      locator:
        published_page: 320
        pdf_page_index: 4
        section: 3.1 Experimental Glasses / 3.2 Copper and Zinc concentrations
        note: 'Converted from the paper''s measured major oxides and measured Cu-Zn Cu/Zn concentrations; FeOT retained as total-iron FeO equivalent, and Cu/Zn ppm converted to CuO0.5/ZnO oxide mole fractions.'
      method_class: calculated
      inference:
        relation: measured_oxide_wt_pct_and_trace_ppm_to_oxide_mole_fraction
        inputs:
        - 'measured_major_oxide_composition_wt_pct: SiO2 41.70, Al2O3 10.60, MgO 15.54, FeOT 14.58, CaO 17.59'
        - 'starting_material_measured_concentrations[Cu-Zn]: Cu/Zn ppm as printed'
        - 'FeOT retained as total iron on an FeO-equivalent basis; no Fe2O3 conversion'
        - 'Cu/Zn ppm converted to CuO0.5/ZnO oxide masses using atomic and formula masses'
        output_unit: mole_fraction
    form:
      state:
        tag: value
        value: slurry smeared on noble-metal wire loops
      locator: &id002
        published_page: 318
        pdf_page_index: 2
        section: 2.1 Experimental
    pretreatment:
      state:
        tag: value
        value: Oxide powders mixed three times in agate mortar under acetone, fired overnight at 1000 C in air to decarbonate,
          then Cu and Zn oxides added
      locator: *id002
  apparatus:
    geometry:
      orifice_diameter_m:
        state:
          tag: not_applicable
          reason: not_applicable
        locator:
          published_page: 318
          pdf_page_index: 2
          section: 2.1 Experimental
          note: Open wire-loop evaporation
          not an effusion-orifice experiment: null
      orifice_channel_length_m:
        state:
          tag: not_applicable
          reason: not_applicable
        locator:
          published_page: 318
          pdf_page_index: 2
          section: 2.1 Experimental
          note: Open wire-loop evaporation
          not an effusion channel: null
    cell_material_and_liner:
      state:
        tag: value
        value: Pt wire loop
      locator: *id003
  conditions:
    temperature_K:
      state:
        tag: value
        value: '1773.15'
      locator: *id003
  pressure_environment:
    total_pressure_Pa:
      state:
        tag: value
        value:
          kind: point
          point: '101325'
      locator:
        published_page: 318
        pdf_page_index: 2
        section: 2.1 Experimental
        note: Printed total pressure 1 atm; SI unit conversion only
    sweep_gas:
      state:
        tag: unknown
        reason: not_published
      note: Printed as air or CO-CO2 mixture; the SweepGas shape carries one species field and cannot represent a mixture
        or an alternative, so the printed text is retained rather than a single species chosen.
      locator: *id002
    regime:
      regime_class:
        tag: unknown
        reason: not_published
  fO2_control:
    channel:
      tag: value
      value: commanded
    buffer:
      state:
        tag: value
        value: log fO2=-0.68
      locator: *id003
  thermal_schedule:
    method:
      state:
        tag: value
        value: Run time recorded once thermocouple reached about 99% of set temperature; oxygen fugacity equilibrated about
          10 min before sample introduction
      locator: *id002
    total_duration_s:
      state:
        tag: value
        value:
          kind: point
          point: '3600'
      locator: *id003
    cooling_or_quench:
      state:
        tag: value
        value: rapidly dropped into de-ionised-water bath
      locator: *id002
