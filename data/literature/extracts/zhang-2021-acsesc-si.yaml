    E. S., McKeegan, K. D. & Dauphas, N. (2021), Supporting Information for “Loss and isotopic fractionation of
    alkali elements during diffusion-limited evaporation from molten silicate: theory and experiments”, ACS Earth
    and Space Chemistry 5, 755–784.'
