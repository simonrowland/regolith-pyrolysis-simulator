scope_assessment:
  document_type: supporting information for experimental and theoretical study of alkali evaporation from basaltic melt
  requested_measurements: measured Na(g)/Na vapour pressure or Na-specific evaporation flux
  measured_direct_observations: 0
  measured_reduced_bulk_mass_loss_points: 12
  absent_from_source:
  - printed Na(g)/Na vapour pressure
  - printed Na-specific evaporation flux
  - species-resolved evaporation mass balance
  figure_read_candidates:
  - Fig. S6 and Figs. S7–S15: elemental concentration profiles in residues; figure values are out of scope for this wave.
  note: >-
    Table S1 mass loss is whole-sample and multi-element; it is not assigned to
    Na. The main article's Table 1 per-run oxide summary is partially present in
    kems-006-zhang-2021. The 488 spot-level EPMA rows in Tables S2–S11 remain
    pending a scope ruling on whether to add the raw spots alongside that
    existing per-run summary.
