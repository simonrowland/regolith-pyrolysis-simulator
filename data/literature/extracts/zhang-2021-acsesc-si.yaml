    checked against page renders. Bulk mass-loss percentages reduced from printed Table S1 weights; residue compositions
    stored as printed.
  date: '2026-10-27'
  worker: w1027naA-zhang-2021-acsesc-si
  provenance_path: text/zhang-2021-acsesc-si/pdftotext-layout.txt
review_status: draft
schema_gaps:
- Table S1 initial/final sample weights have no standalone mass-measurement quantity token; retained as measured-direct
  typed refusal, with mass-loss fractions linked to those weights.
- A complete multicomponent residue-composition vector has no value field in the current migrator; each run is retained
  as a typed-refused residue_composition_vs_time row; all nine printed oxide cells remain under printed_residue_oxide_wt_pct.
