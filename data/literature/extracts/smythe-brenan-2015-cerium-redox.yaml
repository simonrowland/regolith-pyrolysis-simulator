  year: 2015
extraction:
  method: "Table 3 EPMA glass oxide wt% values, totals, Ce valence ratios and parenthetical widths transcribed from the paper. Table 3 oxide wt% is converted to row mole fractions; Table 1 compositions remain labelled starting-material records. The authors infer that the hydrous Ce ratios were not shifted during quench and state in Section 5.2 that the measured glass ratios represent those at temperature. Table 2 log fO2 is absolute log10(fO2/1 bar); Ru and Ir are retained as the imposing noble-metal oxide assemblages. Its eight hydrous H2O values are determined by difference from EPMA totals. Printed pressure in GPa is converted to Pa using the exact SI factor. Confidence level for parenthetical widths is not stated. Figure-only candidates are not extracted."
  date: '2026-10-16'
  worker: rdxw2-ce15
review_status: draft
