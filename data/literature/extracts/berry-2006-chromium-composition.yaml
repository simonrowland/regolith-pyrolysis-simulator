schema_version: literature_extract.v1
source_id: berry-2006-chromium-composition
source:
  citation: Berry, A.J., O'Neill, H.St.C., Scott, D.R., Foran, G.J. & Shelley, J.M.G. (2006), The effect of composition
    on Cr2+/Cr3+ in silicate melts, American Mineralogist 91:1901-1908.
  doi: 10.2138/am.2006.2097
  year: 2006
extraction:
  method: Table 1 was transcribed from a 300 dpi pdftoppm render of PDF page 2 (published page 1902); pdftotext
    -layout was used only to locate the table. All three printed log fO2 columns are included. The 27 printed composition
    rows yield 81 author-measured cells, of which 74 are numeric and 7 are source omissions. The 15 italicized ratio
    cells for rows 1-5 are earlier Berry and O'Neill (2004) results and are stored separately as quoted_attributed.
    Composition means and one-standard-deviation values in parentheses are retained per composition row. The table
    excludes approximately 0.5 wt% Cr2O3 from its host-glass composition columns. Table 1 reports sigma(log fO2)
    = ±0.03 and sigma(Cr2+/ΣCr) = ±0.03, both one standard deviation. The paper does not state total pressure, so
    P is explicitly not_published. The paper states the Fe-free quenched glasses preserve the high-temperature Cr
    oxidation-state ratio; rows are Phase.L. Sossi 2018's quoted 0.32 and 0.91 do not match any Table 1 row and
    remain its separately attributed quoted values.
  figure_read_candidates:
  - 'Figure 2a-b: Cr2+/ΣCr values at log fO2 = -16.13 shown in figures, not digitized.'
  - 'Figure 3: log[Cr2+/Cr3+] versus optical basicity at log fO2 = -9, not digitized.'
  - 'Figure 2c: in-situ MORB Cr2+/ΣCr versus fO2 at 1400 °C, not digitized.'
  date: '2026-10-16'
  worker: rdxw-cr06-1016
review_status: draft
