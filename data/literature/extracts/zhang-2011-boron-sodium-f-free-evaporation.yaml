source_id: zhang-2011-boron-sodium-f-free-evaporation
source:
  citation: 'Zhang, Zuo Tai; Sridhar, Seetharaman; Cho, Jung Wook (2011). An Investigation of the Evaporation of B2O3 and Na2O in F-Free Mold Slags. ISIJ International 51(1), 80–87.'
  doi: 10.2355/isijinternational.51.80
  url: https://doi.org/10.2355/isijinternational.51.80
  year: 2011
extraction:
  method: 'table tool unavailable: born-digital, pdftotext + image audit'
  date: '2026-10-27'
  worker: w1027na1-zhan11
  provenance_path: raw/zhang-2011-boron-sodium-f-free-evaporation/zhang-2011-boron-sodium-f-free-evaporation.pdf
  scope_note: >-
    Tables 1, 2 and 6 are transcribed from pdftotext-layout and checked cell by cell
    against rendered PDF pages 2 and 8. The table converter cannot run because this
    born-digital paper has no MinerU content lists. Tables 3–5 are retained as
    calculation context on page 7. Figures 3–9 contain weight-loss curves and
    apparent activation-energy plots; no values were digitised from figures. Table
    6's measured values are whole-slag mass fluxes and Table 6's estimated column
    is a calculated gas-film flux. The schema has no mass-per-area-per-time
    quantity token, so these values remain typed refusals with their printed units.
    The absolute argon flow, total pressure, and individual starting mass are not
    stated; the authors say the flow was five times the rate expected to control
    evaporation. Table 2's caption says post-measured slag, while section 3.1 identifies
    the XRF analysis as pre-melting composition; Table 2 compositions are used for
    the named base slags only. The CS-3 plus ZrO2 mixture composition is retained
    as printed without inventing a normalized analysis. Explicit Table 2
    composition conditions remain at their printed p2/table2 locator; current
    migration leaves identity.composition unknown for mass_loss_rate. The
    migrator gap and expected identity projection are recorded in the audit map.
