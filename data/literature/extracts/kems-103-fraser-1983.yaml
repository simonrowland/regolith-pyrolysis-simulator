    - observation_id: fraser_1983_table2_gamma_NaAlSi2O6
      type: activity_coefficient
      locator:
        published_page: 114
        table: '2'
        figure: '3'
        equation: '[13]'
        note: Table II activity coefficients of NaAlSi2O6 in NaAlSi2O6-KAlSi2O6 melts
      T_range_K: [1473.15, 1873.15]
      phase: NaAlSi2O6-KAlSi2O6_pseudobinary_silicate_melt
      condensed_form:
        state: liquid_melt
        metastable: false
        basis: explicit_author
        note: melts; glassy quench products (p.116)
      standard_state: >-
        Raoultian / pure liquid NaAlSi2O6. gamma_NaAlSi2O6 = a_NaAlSi2O6 /
        X_NaAlSi2O6 as in eq. [13] (the K-component form is printed; the
        Na-component coefficients in Table II are the integrated result).
        Pure-end-member row X_Na=1.0 is gamma=1.000 by definition.
      regime: kems_effusion
      units: dimensionless Raoultian gamma
      uncertainty:
        note: >-
          Authors (p.114): errors estimated by integrating alternative
          curves through max/min error bars on Fig. 3 and counting squares.
          Range from zero at X_NaAlSi2O6=1.0 up to around ±4% in the worst
          case at X_NaAlSi2O6=0.4. Table II prints parenthetical ± only on
          the X_Na=0.4 row, on X_Na=0.75 at 1600 °C (±~0.02), and on
          X_Na=1.0 at 1600 °C (± 0). Do not invent ± for other cells.
      values:
        quantity: activity_and_raoultian_gamma
        method_class: derived_gibbs_duhem_integration
        system: NaAlSi2O6-KAlSi2O6
        system_class: silicate_melt
        oxide_formula_as_published: NaAlSi2O6
        composition_basis: mole_fraction_NaAlSi2O6_equals_X_Na
        gamma_definition: >-
          Table II header is Y_NaAlSi2O6 (gamma). Authors obtain values
          from regression lines through Fig. 2 by computing ln I_Na/I_K
          at each composition and T, plotting the Belton-Fruehan integrand
          (eq. 13) in Fig. 3, and integrating two straight-line segments
          with a slope change at X_Na=0.75. 1600 °C is an evaluation of
          those regressions; measured 1/T in Appendix 1 spans about
          1154-1528 °C (abstract 1150-1530 °C).
        gamma_KAlSi2O6: absent
        gamma_KAlSi2O6_note: >-
          True absence, not 0. p.114: compositions more K-rich than
          X_Lc=0.6 were not investigated because of high liquidus
          temperatures; activity coefficients of the KAlSi2O6 component
          could not be determined by integration.
