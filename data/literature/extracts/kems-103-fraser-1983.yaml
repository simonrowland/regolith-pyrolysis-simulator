source:
  citation: >-
    Fraser, D. G., Rammensee, W. & Jones, R. H. (1983), "The mixing
    properties of melts in the system NaAlSi2O6-KAlSi2O6 determined by
    Knudsen Cell Mass Spectrometry", Bulletin de Minéralogie 106(1-2),
    111-117. DOI 10.3406/bulmi.1983.7673.
  doi: 10.3406/bulmi.1983.7673
  url: https://www.persee.fr/doc/bulmi_0180-9210_1983_act_106_1_7673
  year: 1983
extraction:
  method: >-
    Official Persée HTML (DC.rights=free) plus official page/illustration
    renders. PDF at citation_pdf_url answered HTTP 403 altcha challenge and
    was not fetched. Table I, Table II and Appendix 1 transcribed from
    Persée renderIllustration PNGs (not HTML "~" grids); every cell
    visually certified against the 1340 px page renders. Figures 1-7 listed
    figure-only; not digitised this round. Measured ion-current ratios
    (Appendix 1) kept distinct from least-squares regressions (Table I)
    and Gibbs-Duhem activity coefficients (Table II).
