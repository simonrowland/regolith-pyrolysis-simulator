          S_ppm: measured_direct; mean of twelve electron microprobe/WDS analyses of quenched glass
          observed_SD_ppm: reported standard deviation of twelve analyses; confidence level not stated
          S_calc_ppm: model_derived; calculated from regression Eqn. 10 and Table 3
          X_FeS: printed sulfide-phase composition; ND remains ND
          a_FeS_1_atm: model_derived activity relative to pure FeS at 1 atm; not the experimental total pressure
          delta_IW: buffer-relative calculated log fO2, ΔIW; not absolute log fO2
        schema_gap:
          printed_quantity: X_FeS, composition of coexisting sulfide phase
          decision: Preserve the printed values in each run context and row-linked typed refusal; do not map sulfide
            to matte or another near-miss phase role.
          code_symbols_checked:
          - tools/validate_literature_extracts.py::OBSERVATION_TYPES
          - simulator/battery/migrate.py::QUANTITY_ALIASES
          - simulator/battery/migrate.py::TYPE_QUANTITY
          - simulator/battery/migrate.py::_phase_role_token
          - simulator/battery/enums.py::PHASE_BASIS_TOKENS
          - simulator/battery/enums.py::PhaseRole
