              locator: {page: 1, pdf_page_index: 0, section: References, note: "Reference [12]"}
            - statement: "[13] Hashimoto A. 1990. Nature 347:53–55."
              locator: {page: 1, pdf_page_index: 0, section: References, note: "Reference [13]"}
          no_source_experiment: "This abstract gives recommendations and discussion, not a new experimental run set; it reports no apparatus, cell or liner, orifice geometry, pressure calibration, ionization cross-sections, ionization energy, multiplier or isotope correction, temperature sensor or calibration, residual pressure, or sample preparation/composition."
          methodological_statements:
            - statement: "Evaporation and condensation processes play an important role in the formation of Ca-Al-inclusions [1] whose composition can be described in a chemical and phase state within the framework of the CaO-MgO-FeO-Al2O3-TiO2-SiO2 system."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 1"
            - statement: "It is known [2] that there are no theoretical approaches that make it possible to precisely calculate αᵥ values."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 2"
            - statement: "The assumption of the presence of an adsorbed layers characterized by activation energy is confirmed by experimental data on the evaporation of substance in the crystalline state and can be established according to Knudsen and to Langmuir."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 2"
              transcription_note: "The printed wording ‘an adsorbed layers’ is grammatically garbled; retained verbatim."
            - statement: "Proceeding from the same theoretical assumptions and the experimental data available, it is possible that in case of a liquid the activation energy is low and αᵥ is close to 1."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 2"
            - statement: "A number of experimental approaches to the determination of αᵥ that correspond to various components of the gas phase over the substance under study are considered in [3, 4]."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 2"
            - statement: "In the liquid state, αᵥ for SiO2 [4], FeO [9] and Al2O3 [10] are equal 1."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 3"
            - statement: "On the basis of the evaporation theory there are strong reasons to assume that αᵥ for other oxides – CaO, MgO and TiO2 in the liquid state are also equal to 1."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 3"
            - statement: "This assumption is confirmed by the thermodynamic calculations of changes in the composition of multicomponent oxide melts in the evaporation process [11], which match the experimental results [12]."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 3"
            - statement: "Thus, there is no need to take αᵥ into account in calculating the evolution of the Ca-Al-inclusions melt composition at evaporation."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 3"
            - statement: "Determination of the rate of nonequilibrium evaporation from an open surface [13] is very approximate."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 4"
            - statement: "This is because there is an increase in the evaporation rate as a consequence of the reducing conditions for the samples caused by interaction with the crucible material, and a decrease in the evaporation rate of the samples caused by the effect of surface self-cooling at evaporation."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 4"
            - statement: "An additional error can be introduced by uncontrollable change in the sample shape at evaporation."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 4"
            - statement: "These reasons lead to underestimated αᵥ values."
              locator:
                page: 1
                pdf_page_index: 0
                paragraph: "Paragraph 4"

