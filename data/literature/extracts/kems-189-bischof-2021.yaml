source:
  citation: >-
    Bischof, L., Sossi, P. A., Sergeev, D., Müller, M. & Schmidt, M. W. (2021),
    "Vaporisation of group 13 elements from basaltic melts by Knudsen Effusion
    Mass Spectrometry", Goldschmidt2021 abstracts (Virtual, 4-9 July 2021),
    DOI 10.7185/gold2021.7353
  doi: 10.7185/gold2021.7353
  url: https://doi.org/10.7185/gold2021.7353
  year: 2021
  version: publishedVersion_1page_abstract
  related_sources:
    - source_id: kems-137-bischof-2023
      doi: 10.1016/j.gca.2023.08.027
      relation: later_full_paper_melt_activities_same_group
      note: >-
        GCA 360:1-15 (2023) reports numeric gamma(GaO1.5)/gamma(InO1.5) and
        melt p(i) for An-Di eutectic KEMS. Different DOI; conference abstract
        here has no tabulated gamma or Psat. Do not merge, remint, or copy
        2023 numbers into this extract.
    - source_id: kems-138-bischof-2023
      doi: 10.1016/j.calphad.2022.102507
      relation: later_full_paper_pure_oxide_kems_same_group
      note: >-
        Calphad 80:102507 (2023) reports tabulated pure-Ga2O3/In2O3 KEMS
        partial pressures and 2nd/3rd-law enthalpies. Different DOI; this
        2021 abstract prints only a qualitative pM2O > pM0 >> pMO order.
        Do not merge or copy 2023 table cells here.
extraction:
  method: >-
    Official OA PDF https://goldschmidtabstracts.info/2021/7353.pdf (HTTP 200
    application/pdf, 118782 bytes, 1 page A4). DOI 10.7185/gold2021.7353
    resolves (curl -sI HTTP 302 to goldschmidtabstracts.info abstractView).
    Unpaywall is_oa true, oa_status bronze, license null. Crossref license
    null. No MinerU. pdftotext -layout of the single page plus visual
    certification of ion-charge superscripts against 150 dpi pdftoppm
    (pdftotext collapses M^{2+} and M2+; page prints M+, M^{2+}, M^{3+},
    M2+, MO+, M2O+). pdfimages -list empty: no embedded figures. No numbered tables.
    Measured ion identities and the printed partial-pressure order kept
    distinct from the qualitative activity comparison (no numeric gamma)
    and from later 2023 tabulated values (not copied). Missing = absent,
    never 0. No unit conversion. Tilde doping levels stored as printed
    approximations.
