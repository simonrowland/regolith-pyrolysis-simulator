schema_version: literature_extract.v1
source_id: sutherland-2025-mare-simulant-volatile-loss
source:
  citation: Sutherland J. et al. (2025) Volatile loss during heating of lunar mare simulants and related compositions. Chemical Geology 698, 123115.
  doi: 10.1016/j.chemgeo.2025.123115
  url: https://epub.ub.uni-muenchen.de/130313/1/1-s2.0-S0009254125005054-main.pdf
  version: version of record
  year: 2025
  sha256: dd3e0adc8c8f95cac05039bc57466abfe2ad23b3ab0d203fcec498339669e789
extraction:
  method: Manual transcription of the version-of-record PDF. Tables 1 and 2 were read from rendered page images at 200 dpi twice, first by rows and then by columns. Experimental conditions and sample descriptions were read from the methods and sample-origins sections. Natural-deposit and processed-analogue rows were outside the requested mare-simulant scope. NPD phase-profile figures were reviewed but not transcribed as residue compositions because they report diffraction/phase changes, not chemical residue analyses or numerical mass loss.
  date: '2026-10-12'
  worker: suth25
review_status: draft
benches:
- id: simultaneous-tga-dsc-ega-ms
  identity: {basis: described_in_this_work}
  apparatus_family:
    state: {tag: value, value: 'Mettler Toledo TGA/DSC 3+ with high-temperature furnace, linked to ThermoStar Pfeiffer Vacuum GSD 320 EGA-MS'}
    locator: &methods_loc {page: 3, published_page: 3, section: '2.2.1'}
  heating_method:
    state: {tag: value, value: '150–1300 °C ramp at 15 °C/min, 10-min isothermal hold at 1300 °C, then cooling at 30 °C/min'}
    locator: *methods_loc
  cell_material_and_liner:
    state: {tag: value, value: alumina crucible}
    locator: *methods_loc
  detector:
    state: {tag: value, value: ThermoStar Pfeiffer Vacuum GSD 320 EGA-MS}
    locator: *methods_loc
  other_facts:
  - name: evolved_gas_transfer_line
    unit: as published
    value:
      state: {tag: value, value: {kind: categorical, categorical: heated at 150 °C to prevent gas condensation}}
      locator: *methods_loc
  - name: gas_analysis_vacuum
    unit: bar
    value:
      state: {tag: value, value: {kind: point, point: '1e-9'}}
      locator: {page: 3, published_page: 3, section: '2.2.1', note: 'Printed 10⁻⁹ bar; this is the integrated pump retrieving gases from the STA furnace, not the sample furnace pressure.'}
