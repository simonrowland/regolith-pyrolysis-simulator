notes:
- text: 'Printed Tables 12, 14, 15, 16, and 17 are transcribed in full: 7, 22, 26, 26, and 15 data rows respectively
    (96 rows total). Each printed row is a direct atomic-absorption absorbance reading. The table headers and captions
    call these potassium vapor-pressure data, but the numeric measurement column is Absorbance.'
  locator:
    page: 112
    table: '12'
- text: All extract locators use absolute PDF page numbers. The printed-page offset varies across the thesis; printed
    folios are listed separately in the cell audit rather than used as a page locator.
  locator:
    page: 112
    table: '12'
- text: 'Schema gap: absorbance has no exact quantity token. Quantity candidates were checked against simulator/battery/enums.py::Quantity,
    simulator/battery/migrate.py::QUANTITY_ALIASES and ::TYPE_QUANTITY, and tools/validate_literature_extracts.py::OBSERVATION_TYPES.
    Each measured row keeps its numeric printed absorbance under a descriptive quantity and is typed_refused; do
    not infer partial pressure from the observation type. The phase token gas is supported by simulator/battery/migrate.py::PHASE_MAP.
    Kido et al. (2004), data/literature/extracts/kido-2004-mn-cr-high-temperature-glass-spectra.yaml, preserves
    absorbance as context where no absorbance token exists.'
  locator:
    page: 112
    table: '12'
- text: The thesis states absorbance is directly related to vapor concentration and concentration to pressure, then
    says pressure is not exactly equal to concentration/absorbance and is only within a few percent. No pointwise
    pressure values or pressure unit are printed in Tables 12 or 14-17, so no pressure is calculated. Equation 2
    is retained as a Plante [45] calibration relation with its pressure unit marked not stated.
  locator:
    page: 109
    equation: '2'
- text: Figure 15 fits are for log absorbance versus reciprocal temperature and use Table 12 rows; Figure 18 fits
    use Tables 14 and 15; Figure 19 fits use Tables 16 and 17. Only printed fit parameters are retained. Curve points
    are not digitised. The fit records list exactly the corresponding stored observation IDs as their inputs.
  locator:
    page: 114
    figure: '15'
- text: Equations 3 and 4 are the printed platinum and graphite log-absorbance fits based on Table 12. Equation
    5 is the NBS log pressure relation attributed to [45]. The fit coefficient cells are preserved separately from
    their repeated Figure 15 caption values.
  locator:
    page: 111
    equations: 3-5
- text: No experiment total pressure or absolute log fO2 is printed for these observations. Table 12 has no row-specific
    gas mixture; the Ar-4%H2 atmosphere is printed in Figures 18 and 19 captions for Tables 14-17 only. Gas composition
    is recorded as a gas mix and is not converted to fO2. The abstract's general apparatus description of ambient
    pressure is not assigned to individual experiments.
  locator:
    page: 112
    table: '12'
- text: Asterisked absorbance values in Tables 14 and 15 are marked by the author as not used in calculations because
    the recorder was limited. Table 15 row 20 (printed row 20; draft coordinate 21) also prints >101 peak-height
    divisions and >1.32* absorbance; both greater-than qualifiers are retained.
  locator:
    page: 136
    table: '15'
- text: No sodium vapor-pressure or sodium vapor measurement rows were found. Table 13 reports furnace sensitivity
    rather than potassium vapor pressure; Tables 1-11 concern furnace apparatus and sensitivity. Figures 16 and
    17 are figure-read candidates for the effects of opening the sample port to air and adding water vapor; their
    plotted points are not digitised.
  locator:
    page: 119
    table: '13'
