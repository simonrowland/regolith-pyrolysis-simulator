source:
  citation: Ozawa, K., Nagahara, H., Morioka, M., Matsumoto, N., Hutcheon, I. D., Noguchi, T., & Kagi, H. (2012). Kinetics
    of evaporation of forsterite in vacuum. American Mineralogist, 97, 80–99.
  doi: 10.2138/am.2012.3750
  year: 2012
  corpus_asset: raw/ozawa-2012-forsterite-vacuum-evaporation/ozawa-2012-forsterite-vacuum-evaporation.pdf
  corpus_sha256: 4bb85893e310db589b706dc90464933116e4ba716852a9ffc8b5b53f487f8874
extraction:
  method: Born-digital pdftotext-layout transcription with 600-dpi row/column binding checks against Table 1, Table 3, Table
    2, and Appendix Table 1 renders. The MinerU table tool did not apply because no MinerU HTML table blocks exist.
  date: '2026-10-20'
  worker: codex-fam22-1020
  provenance_path: raw/ozawa-2012-forsterite-vacuum-evaporation/
review_status: draft
notes:
- The PDF title is Kinetics of evaporation of forsterite in vacuum, American Mineralogist 97:80–99 (2012), DOI 10.2138/am.2012.3750;
  the PDF is the requested Ozawa, Nagahara et al. source.
- Table 1 has 86 experimental run rows; each printed f (evaporated mass fraction) is typed once with its sample, surface,
  temperature, duration, pressure when measured, and raw weight and size cells retained as supporting inputs. Pressure dashes
  mean not measured and remain unknown.
- Explicit Table 1 comments are retained on their run rows, including melt-present, trace-melt, surface-preparation, orientation,
  and observation notes. Printed quote marks remain quote marks as ditto comments; blank comment cells remain unfilled.
- Table 2(a)–(c) reports measured morphology without a matching quantity token; Table 2(d) thickness is calculated from Table
  3 and remains model context. Table 3(a) has 42 rate cells (30 author measurements reduced from Table 1 inputs and 12 values
  attributed to Yamada et al. 2006). Table 3(b) fitted J0/E/Q values remain model context. Table 4(a) intrinsic rates and
  Table 4(b) fits are model-derived context.
- Appendix Table 1 has six typed Mg isotope-delta values. Its three f values refer to Table 1 runs 832, 831, and 887 and are
  recorded as a second locator/precision note rather than duplicated mass-loss observations. Alpha_min values are isotope
  fractionation factors and alpha_hkl is the roughening parameter; neither is a vapour evaporation coefficient.
- The paper reports no vapour evaporation coefficient alpha. Equations 1 and 2 are preserved as printed in context; they define
  the authors' nominal retreat-rate and mass-loss geometry calculations, not a Hertz–Knudsen accommodation coefficient.
- No MinerU table blocks exist for this source. The table draft/emit tool is MinerU-HTML-only and refuses pdftotext-only drafts;
  the born-digital pdftotext layout was used, with row/column bindings checked against 600-dpi renders. Figure records have
  metadata only and no digitised values.
- No independent fO2 is reported or controlled. Table 1 dash pressure cells remain unknown; Table 3 rates summarize experiments
  and do not carry one pressure value per rate row.
