extraction:
  method: >-
    Born-digital pdftotext-layout transcription checked against the PDF page
    renders. Every number below is a number printed in the paper's own prose
    or in a figure caption or as an axis tick or run label. Text inside
    reproduced figures from Tachibana et al. 2011, Takigawa et al. 2009, and
    Takigawa and Tachibana 2012 was not copied as a measurement of this paper.
    No data marker was digitised. Figures 10 and 11 were left as figure
    records because both-axis tick calibration of the symbol coordinates was
    not completed.
