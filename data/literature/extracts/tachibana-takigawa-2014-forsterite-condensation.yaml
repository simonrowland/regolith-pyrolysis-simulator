experiments:
  - experiment_id: tt2014_forsterite_condensation
    method:
      state:
        tag: unknown
        reason: >-
          Infrared vacuum-furnace condensation from a forsterite vapour in
          flowing H2-H2O has no matching experiment-method token.
      locator:
        published_page: 6
        pdf_page_index: 5
        section: "4.1"
    method_as_printed: >-
      Silica-glass tube furnace, continuously evacuated, with an Ir-crucible
      forsterite gas source and a Pt-mesh substrate 15-25 mm from the source.
    locator:
      published_page: 6
      pdf_page_index: 5
      section: "4.1"
  - experiment_id: tt2014_forsterite_evaporation_review
    method:
      state:
        tag: unknown
        reason: >-
          The forsterite evaporation coefficients are quoted from earlier
          papers. This review does not print a method token for those runs.
      locator:
        published_page: 5
        pdf_page_index: 4
        section: "3"
    method_as_printed: >-
      Evaporation of forsterite in vacuum and in low-pressure hydrogen gas,
      as reviewed from references 8, 10, and 11.
    locator:
      published_page: 5
      pdf_page_index: 4
      section: "3"
  - experiment_id: tt2014_iron_condensation_review
    method:
      state:
        tag: unknown
        reason: >-
          The metallic-iron condensation furnace is quoted from reference 7.
          This review does not print a method token for that apparatus.
      locator:
        published_page: 2
        pdf_page_index: 1
        section: "2"
    method_as_printed: >-
      Metallic iron pellet inside an alumina tube, evaporated onto an alumina
      disk in a cooler region of the furnace.
    locator:
      published_page: 2
      pdf_page_index: 1
      section: "2"
