schema_version: literature_extract.v1
source_id: ta-mendybaev-2002-lpsc
source:
  citation: >-
    Mendybaev, R. A., Davis, A. M. & Richter, F. M. (2002), "The Effect of
    Sample Size on Experimental Evaporation of Type B CAIs", Lunar and Planetary
    Science XXXIII, abstract 2040.
  url: https://www.lpi.usra.edu/meetings/lpsc2002/pdf/2040.pdf
  year: 2002
  conference: Lunar and Planetary Science XXXIII
extraction:
  method: >-
    Corpus PDF raw/ta-mendybaev-2002-lpsc/ta-mendybaev-2002-lpsc.pdf (2-page LPSC
    abstract 2040). Clean text layer via pdftotext -layout; no OCR and no figure
    digitisation. Printed starting oxides, vacuum furnace conditions, and prose
    weight-loss rates / Mg kinetic fractionation factor retained verbatim.
    N4b FILL (Y4 P1): page-2 printed multi-T 1.0 mm rates (~1.1x10^-5 / ~2x10^-6
    / ~3x10^-7 g/mm^2/min at 1800/1700/1600 C) and Ea=580 kJ/mole landed with
    locators; forsterite Ea comparators retained as quoted_attributed in the Ea
    row. Figure 1–3 curves were not digitized. Kelvin companions for printed °C
    carry DERIVED stamps (T_K = T_C + 273.15).
  date: '2026-09-22'
  worker: n4b-y4-omissions
  provenance_path: data/literature/extracts/ta-mendybaev-2002-lpsc.yaml
review_status: draft
corrections: []
scope_assessment:
  document_type: 2-page LPSC conference abstract (vacuum evaporation of Type B CAI-like liquids)
  measured_direct_observations: 5
  method_observations: 2
  figure_only_observations: 0
  model_derived_observations: 1
  absent_from_source:
  - tabulated per-run residue oxide compositions
  - digitized weight-loss time series from Fig. 1
  - digitized weight-loss rate vs surface area from Fig. 2
  - digitized Mg isotope Rayleigh plot from Fig. 3
  - absolute sample masses
  - furnace conductance / orifice geometry
  - oxygen fugacity buffer
  note: >-
    Abstract reports effect of Ir-loop sample size on vacuum evaporation rate and
    Mg isotopic fractionation of B133-glass Type B CAI-like liquids. N4 scored
    1800 C rate averages and Rayleigh alpha; N4b adds page-2 printed 1.0 mm
    multi-T rates (1700/1600 C) and apparent Ea=580 kJ/mole. Related full papers
    (Richter 2002/2007) already have separate extracts and are not re-ingested
    here.
