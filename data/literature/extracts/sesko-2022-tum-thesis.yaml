        units: as printed
        values:
          quantity: temperature_and_pressure_measurement_methods
          temperature: Optris IR camera through the solar window; logged peak temperature at emissivity 0.98; Type-K thermocouples were not useful during solar exposure
          camera_window_error_C: '14.5 average over 1000 °C to 1450 °C, based on eight measurement sets'
          pressure: KJL CCPG-H2-6 cold-cathode/Pirani combination gauge connected directly to the chamber
          heating_method: concentrated sunlight from heliostat mirror and Fresnel lens; manual shade removal starts and ends each exposure
          heating_rate: not reported
          holding_time: no separate isothermal hold; exposure duration is listed per run in Table 3.3
      - observation_id: sesko_2022_edx_melt_residue_qualitative
        type: characterization
        locator: {page: 34, pdf_page_index: 48, figure: '3.19'}
        units: qualitative EDX, silicon-normalized counts
        values:
          quantity: qualitative_residue_composition_context
          samples: [10, 11, 12]
          method: Point EDX on selected melt and condensation-skin surfaces; no quantitative composition table is printed.
          melt_surface: Oxygen signal lower than the bulk EAC-1A reference for all three samples; no significant difference in other major elements was resolved.
          condensation_skin: Oxygen signal appears lower than bulk, with larger variation in other elements; magnesium signal elevated at sample 11 point 2 and sample 12 points 1 and 2.
          sample_11_skin_point_1: Strong iron and oxygen signal, excluded from Figure 3.19b to avoid skewing the graph; source suggests a high-iron-oxide particle.
          limitation: EDX depth and condensate thickness are unknown; no composition of the melt beneath the surface is established.
          composition_basis: Recorded qualitatively; plotted silicon-normalized counts are not reported as composition percentages.
      - observation_id: sesko_2022_exposure_12_condensate_edx_distinction
        type: characterization
        experiment: sesko_2022_exposure_12
        locator: {page: 35, pdf_page_index: 49, figure: '3.20'}
        units: qualitative EDX
        values:
          quantity: qualitative_condensate_composition_context
          regions: [A, B]
          relation: Region A appears to have deposited first; region B is layered over it.
          region_A: Aluminum and oxygen are present; the thesis attributes aluminum to the alumina crucible seen through a thin condensate layer.
          region_B: Aluminum peak absent; sodium signal is stronger relative to potassium than in region A.
          overlap_note: 'The exposure-12 condensate EDX measurement is held in kems-036-sesko-2024; this row retains only the thesis-specific A/B layering and relative-signal description not represented there.'
      - observation_id: sesko_2022_measured_yield_absence
        type: experiment_series
        locator: {page: 29, pdf_page_index: 43, section: '3.3.1 Pressure and temperature measurements'}
        units: as printed
        values:
          quantity: measured_gas_and_mass_loss_results
          oxygen_yield: no quantitative oxygen or gas yield reported; RGA produced no significant gas-composition results
          mass_loss: no mass-loss value reported; Table 3.3 m is mass of melted regolith samples, not initial-minus-final sample mass
          heating_rate: not reported
          source_note: All exposures exceeded the RGA measurement limit of 10^-5 mbar; source attributes much of the gas to desorbed volatiles and says the amount of vaporization products is undetermined.
