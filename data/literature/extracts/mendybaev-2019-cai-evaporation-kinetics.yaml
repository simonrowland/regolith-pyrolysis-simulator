          statement_verbatim: >-
            The evaporation process can be described by the Hertz-Knudsen equation and for the CMAS system the ratio of
            the evaporative fluxes of Mg and Si is proportional to their evaporation coefficients (γ_i) and activities
            (a_i) in the melt.
          locator_note: Relation is retained as qualitative prose; no derived flux or measurement is created.
