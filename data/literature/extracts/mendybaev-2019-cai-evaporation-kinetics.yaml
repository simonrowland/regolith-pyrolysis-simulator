          theory: ideal_associated_solutions
          model_assumption_verbatim: >-
            The model is based on the theory of ideal associated solutions, which consider a solution as an ideal mixture
            of monomeric molecules and associative complexes at all concentrations.
          qualifications_verbatim:
            - >-
              The calculated a_i in several melts using different available models (FactSage, Thermocalc, CMAS) showed
              variations in a_CaO, a_MgO and a_Al2O3 up to a factor of ~10 at 2173 K which results in very different
              evaporation trends.
            - >-
              We have calculated the evaporation trajectories for a number of melt compositions (melilitic, anorthitic,
              forsteritic) using model of [6] which showed very good agreement with the experimental data.
            - >-
              For example, in agreement with the experiments the calculated trajectories for melilitic melts show very
              weak temperature dependence and did not require adjusting γ_Mg and γ_Si to fit the experimental trends
              (γ_Mg=γ_Si=1 was used in our calculations) unlike CMAS based calculations.
          locator_note: Numeric model comparison is reported in prose; no corresponding data table is supplied.
