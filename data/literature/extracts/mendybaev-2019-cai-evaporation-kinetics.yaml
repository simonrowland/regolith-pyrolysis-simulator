          method_scope_verbatim:
            - >-
              Majority of Ca-,Al-rich inclusions (CAIs) in chondrites have experienced high-temperature melting followed
              by slow cooling as indicated by their coarse-grained igneous textures.
            - >-
              The melting and evaporation under low-pressure conditions result in chemical and mass-dependent isotopic
              fractionations as recorded in CAIs.
            - >-
              The effects have been successfully reproduced in vacuum and in low-pressure H2 laboratory evaporation
              experiments [1, 2].
            - >-
              Several attemps have been made to model the evaporation thermodynamically [3−5] using Berman’s CMAS model
              or its combination with the MELTS.
            - >-
              The major advantage of the model is that it utilizes a_i directly measured in Knudsen cell experiments at
              1600–2500 K rather than being obtained indirectly.
            - >-
              We will expand the experimental database on evaporation kinetics (to CMAS + TiO2 system first) to further
              check correctness of the model for complex systems.
          bibliography_as_printed:
            - '[1] Richter et al (2007) GCA 71, 5544–5564.'
            - '[2] Mendybaev et al. (2013) GCA 123, 368–384.'
            - '[3] Grossman et al. (2000) GCA 64, 2879–2894.'
            - '[4] Alexander et al. (2002) MAPS 37, 245–256.'
            - '[5] Ebel (2005) GCA 69, 3183–3193.'
            - '[6] Shornikov (2009) Heralds Earth Sci. Rus. Acad. Sci. 27, 1–3.'
      - observation_id: mendybaev_2019_abstract_evaporation_relation
