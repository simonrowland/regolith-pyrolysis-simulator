    - observation_id: gaillard_2003_oxidizing_range_interpretation
      type: statement
      locator:
        page: 27
        pdf_page_index: 26
      units: as printed
      values:
        method_class: author_estimate
        statement: NNO+4.9 < fO2 < NNO+7.3; FeOtotal 2.45–3.15 wt.%; hydrous hematite saturation at 1160°C versus anhydrous 1245°C; water 5.55–6.06 wt.%; XFe2O3/XFeO
          1.55–1.85. Sample9/1 is hematite-undersaturated.
    - observation_id: gaillard_2003_solubility_and_redox_interpretation
      type: statement
      locator:
        page: 28
        pdf_page_index: 27
      units: as printed
      values:
        method_class: author_estimate
        statement: Water solubility decreases 5.2→4.5 wt.% as FeO increases 0.6→7.2 wt.%; effect of iron on IR extinction unknown, independent confirmation needed.
          Four oxygen isobars NNO−1.25 to NNO+4.9, two temperatures 1000/1160°C. γFeO ~1 at NNO−1.25 to ~4 at NNO+1.4; three nearly identical run9 measurements at
          NNO+4.9 show turnover, maximum between NNO+1.4 and NNO+4.9. Ferric activity nearly ideal at NNO+1.4, strongly negative at NNO−1.25, nonlinear at NNO−0.8/+1.4;
          run9 aFe2O3 0.069–0.070 at XFe2O3 0.02.
