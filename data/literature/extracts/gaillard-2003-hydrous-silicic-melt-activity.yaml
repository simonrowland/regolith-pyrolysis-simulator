source_id: gaillard-2003-hydrous-silicic-melt-activity
source:
  citation: Gaillard, F., Pichavant, M. & Scaillet, B. (2003). Experimental determination of activities of FeO and Fe2O3 components in hydrous silicic melts under
    oxidizing conditions. Geochimica et Cosmochimica Acta 67(22), 4389–4409. HAL author manuscript hal-00069333.
  doi: 10.1016/S0016-7037(03)00376-4
  year: 2003
  corpus_asset: raw/gaillard-2003-hydrous-silicic-melt-activity/gaillard-2003-hydrous-silicic-melt-activity.pdf
  sha256: 24f82320c06715c2bc367e293dab62f0a471f82e68ff4a874016814ac0bdc951
  version_note: HAL author manuscript (36 PDF pages, no printed journal page numbers); tables are raster images. Locators are PDF pages.
extraction:
  method: Every page rendered and read; table images (Tables 1-5, A1) extracted with pdfimages at native resolution and read from 2x LANCZOS-upscaled overlapping
    crops (Table A1 from a 400 dpi page render). All Table 2-5 and A1 cells transcribed to CSV; Table 1 transcribed in full. Prose and equations from the text layer
    were checked against page images. Table 4 H2O cells were script-checked against Table 5 (all 55 match). Figures are figure_only. Apparatus facts not printed are
    typed unknown; orifice fields not_applicable (no effusion cell).
  date: '2026-10-05'
  worker: regolith-empirical-s37b
review_status: draft
