        pdf_page_index: 4
      units: as printed
      values:
        method_class: quoted_attributed
        statement: aFeOliq = exp(ΔG°(1)/RT) aFe (fO2)^(1/2); aFe of pure metal = 1; prior Henry-law FeO concentration range 0 to 17–18 wt.% at 1 bar. Fig.1 caption
          Hm-Liq curve aFeOliq = 0.02.
    - observation_id: gaillard_2003_prior_methods_and_alloy_domain
      type: statement
      locator:
        page: 6
        pdf_page_index: 5
      units: as printed
      values:
        method_class: quoted_attributed
        statement: 'Prior Fe-Ni/Fe-Ni-Co experiments at 1 atm to ~5 log units above IW: Fe2O3 <1 wt.%; 450 available points; prior ferric fraction <10% of total
          Fe. Fe-Ir stability limited near NNO+9; continuous solution 0–100 at.% Fe at ~900–1400°C; Ir solubility <100 ppb; Fe alloy detection about 500 ppm, limiting
          method near NNO+2.'
    - observation_id: gaillard_2003_standard_state_domain
      type: statement
      locator:
        page: 7
        pdf_page_index: 6
      units: as printed
      values:
        method_class: model_derived
        statement: Molten Fe0.947O wustite contains ≥13 wt.% Fe2O3 at IW; FeO standard-state optimization uses SiO2–FeO±Fe2O3 at 1 atm.
    - observation_id: gaillard_2003_generic_ferric_mass_action
      type: statement
      locator:
        page: 8
        pdf_page_index: 7
      units: as printed
      values:
        method_class: method_only
        statement: 2 Fe + 3/2 O2 ⇔ Fe2O3; aFe2O3liq = a_Fe^2 (fO2)^1.5 exp(ΔG°(5)/RT). Table 1 prints different stoichiometry [sic]; retain each located form.
    - observation_id: gaillard_2003_hematite_reactions
      type: statement
      locator:
