        pdf_page_index: 8
      units: as printed
      values:
        method_class: method_only
        statement: Fe2O3 (hematite) ⇔ 2 FeO (liquid) + 1/2 O2; Fe2O3 (hematite) ⇔ Fe2O3 (liquid). Pressure units are not printed beside the activity expressions.
    - observation_id: gaillard_2003_starting_composition_domain
      type: statement
      locator:
        page: 10
        pdf_page_index: 9
      units: as printed
      values:
        method_class: author_estimate
        statement: '15 glasses; SiO2 ~69–78 wt.%, FeOtotal ~0.5–9 wt.%, Si4O8 56–63 mol.%; glasses #2,4,6,8,9 previously used in Gaillard et al. (2001); gels melted
          at ~1400°C in air.'
    - observation_id: gaillard_2003_charge_preparation
      type: statement
      locator:
        page: 13
        pdf_page_index: 12
      units: as printed
      values:
        method_class: method_only
        statement: '1 atm: about 1 wt.% Ir powder, grain size ~10 μm, and parallel Ir-free mixtures; Pt-wire suspension sample/Pt mass ratio ~10. 2 kbar: 75 μm Ir
          wires initially, ≥25 d required; later ~10 μm powder and parallel Ir-free mixtures. Typically ~10 mg H2O per ~100 mg solids; undersaturated water charges
          2–10 mg. Au/Au-Pd/Pt capsules 15–20 mm long, 2.5 mm internal diameter, 0.1 or 0.2 mm walls. Fig.3 schematic labels wire ~25 d versus powder 5–6 d.'
    - observation_id: gaillard_2003_additional_control_and_probe_facts
      type: statement
      locator:
        page: 15
        pdf_page_index: 14
      units: as printed
      values:
        method_class: method_only
        statement: H2 + 1/2 O2 ⇔ H2O. Melt fH2O uncertainty 10%; alloy beam 1–2 μm; Fe-Ir grains ≤~10 μm. fH2 set per run by Co-Ni-Pd sensors, not continuously monitored.
    - observation_id: gaillard_2003_density_and_reduction_limit
      type: statement
      locator:
        page: 16
        pdf_page_index: 15
      units: as printed
      values:
        method_class: method_only
        statement: Calculated glass density agrees within less than 10% with measurements on similar glasses. Wet FeO is measured only on Ir-free starting mixtures;
          Ir-bearing and oxide-bearing glass FeO is empirical-fit reduced, with Fe2O3 by difference. FTIR uses calculated, not measured, density.
    - observation_id: gaillard_2003_equilibrium_checks_1atm
      type: statement
      locator:
        page: 17
        pdf_page_index: 16
      units: as printed
      values:
        method_class: method_only
        statement: No formal reversals; Fe50Ir50 is a hypothetical example of reversal starting alloy, not an experimental composition. At ~1200°C equilibration
          needs weeks; 1210°C run1 and each 1-atm run last 25 d. Independent Pt/Ir activities agree within error, using Pt–Fe calibration Heald (1967) alongside Fe–Ir calibration Schwartzendruber (1984). Runs7–8 in air cannot be metal-crosschecked because
          Fe in alloy is below detection.
    - observation_id: gaillard_2003_figure4_validation_caption
      type: statement
      locator:
        page: 18
        pdf_page_index: 17
      units: as printed
      values:
        method_class: method_only
        statement: Non-equilibrated 10-day non-tabulated comparator; equilibrated profiles at 25 d; 18 analysed Fe-Ir grains in sample1/3.
    - observation_id: gaillard_2003_wire_local_equilibrium
      type: statement
      locator:
        page: 20
        pdf_page_index: 19
      units: as printed
      values:
        method_class: method_only
        statement: At 1000°C, 2 kbar and water saturation, nearly flat bulk Ir-wire Fe profiles at 25 d; shorter runs4–5 attain reproducible local metal-melt equilibrium
          at the interface, not bulk wire equilibration.
    - observation_id: gaillard_2003_powder_kinetics_and_sensor_failure
      type: statement
      locator:
        page: 21
        pdf_page_index: 20
      units: as printed
      values:
        method_class: method_only
        statement: 'At 1000°C and 2 kbar water saturation, powder alloy equilibrium after 6 d; ferric/ferrous equilibrium takes hours at 800–1000°C. About 50% Fe
          loss at highest capsule/melt ratios. Fig.6: 4 d and 10 d non-equilibrated; 25 d nearly equilibrated run omitted because its redox sensor was sulfide-polluted
          and unusable.'
    - observation_id: gaillard_2003_independent_sensors_magnetite
      type: statement
      locator:
        page: 22
        pdf_page_index: 21
      units: as printed
      values:
        method_class: method_only
        statement: 'Sample2/7 Pt-capsule and Ir-powder sensors differ by ~1400 J. Fe3O4 ⇔ 3 FeO + 1/2 O2; liquid FeO standard properties use Table1 and Lange/Carmichael
          (1990), magnetite properties/mixing Ghiorso/Sack (1991). Fig.7: 23 grains, 6 d, sample3/8; Fig.8: Au capsule sample3/3 after 6 d.'
    - observation_id: gaillard_2003_partial_equilibrium
      type: statement
      locator:
        page: 23
        pdf_page_index: 22
      units: as printed
      values:
        method_class: method_only
        statement: Independent activities within 10% in samples6/5–6/6; Fe3O4 ⇔ 3 Fe + 2 O2. Equilibrium of iron components suffices for activities; global equilibrium
          of all noble metals is explicitly not claimed. Ternary validation at 1380°C, 1 atm, 10 d, FMQ; 8.04 wt.% FeOtotal, ~50 μm ternary zone; aFeO 0.077/0.081.
    - observation_id: gaillard_2003_melt_component_basis
      type: statement
      locator:
        page: 24
        pdf_page_index: 23
      units: as printed
      values:
        method_class: method_only
        statement: Mole fractions use Si4O8, KAlO2, NaAlO2, CaAl2O4, Al2O3, CaO, H2O, OH, FeO, Fe2O3. All but 1 or 2 Ca-free glasses are peraluminous. Moderately
          reducing range NNO−1 to NNO−1.5. Runs4–5 have local metal-melt equilibrium only.
    - observation_id: gaillard_2003_water_chemical_potential
      type: statement
      locator:
        page: 26
        pdf_page_index: 25
      units: as printed
      values:
        method_class: author_estimate
