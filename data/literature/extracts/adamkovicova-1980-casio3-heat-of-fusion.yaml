            - {T_K: 1848, minus_delta_H_cool_kJ_mol-1: 219.9, point_uncertainty_status: not_reported_individually}
            - {T_K: 1859, minus_delta_H_cool_kJ_mol-1: 222.2, point_uncertainty_status: not_reported_individually}
            - {T_K: 1915, minus_delta_H_cool_kJ_mol-1: 230.5, point_uncertainty_status: not_reported_individually}
            - {T_K: 1961, minus_delta_H_cool_kJ_mol-1: 238.9, point_uncertainty_status: not_reported_individually}
