species:
  CaSiO3:
    observations:
      - observation_id: adamkovicova_1980_table1_solid_cooling_measured
        experiment: adamkovicova-pseudowollastonite-drop-series
        type: heat_capacity_and_heat_content_series
        locator: {page: 3, published_page: 195, pdf_page_index: 2, table: I}
        T_range_K: [1506, 1780]
        phase: crystalline_pseudowollastonite_alpha_wollastonite
        condensed_form: {polymorph: alpha}
        polymorph_notes: 'The authors identify the solid as α-wollastonite (pseudowollastonite); no more specific pseudowollastonite enum token exists.'
        standard_state: 'Cooling enthalpy from each stated T to 298 K; values are per mole of CaSiO3.'
        units: 'T in K; enthalpy in kJ mol−1 CaSiO3'
        values:
          quantity: negative_enthalpy_change_on_cooling
          method_class: measured_direct
          table_csv: tables/adamkovicova-1980-casio3-heat-of-fusion/t1.csv
          sign_convention: 'Table I prints ΔHcool without a leading minus; the discussion and Eq. (3) use −ΔHcool and positive magnitudes.'
          points:
            - {T_K: 1506, minus_delta_H_cool_kJ_mol-1: 139.6, point_uncertainty_status: not_reported_individually}
            - {T_K: 1576, minus_delta_H_cool_kJ_mol-1: 150.6, point_uncertainty_status: not_reported_individually}
            - {T_K: 1630, minus_delta_H_cool_kJ_mol-1: 157.1, point_uncertainty_status: not_reported_individually}
            - {T_K: 1678, minus_delta_H_cool_kJ_mol-1: 165.0, point_uncertainty_status: not_reported_individually}
            - {T_K: 1730, minus_delta_H_cool_kJ_mol-1: 173.9, point_uncertainty_status: not_reported_individually}
            - {T_K: 1780, minus_delta_H_cool_kJ_mol-1: 183.3, point_uncertainty_status: not_reported_individually}
        uncertainty: {reported_status: not_reported_for_individual_points, note: 'The paper reports 1.1 kJ mol−1 as the regression error for Eq. (3), not as a per-point uncertainty.'}

      - observation_id: adamkovicova_1980_table2_solid_solution_heats_measured
        experiment: adamkovicova-pseudowollastonite-solution-series
        type: heat_capacity_and_heat_content_series
        locator: {page: 4, published_page: 196, pdf_page_index: 3, table: II}
        T_range_K: [298, 298]
        phase: crystalline_pseudowollastonite_alpha_wollastonite
        condensed_form: {polymorph: alpha}
        polymorph_notes: 'The authors identify the solid as α-wollastonite (pseudowollastonite).'
        standard_state: 'Heat of solution in concentrated HF:HNO3 (2:1) at 298 K; per mole of CaSiO3.'
        units: 'T in K; enthalpy in kJ mol−1 CaSiO3'
        values:
          quantity: heat_of_solution
          method_class: measured_direct
          table_csv: tables/adamkovicova-1980-casio3-heat-of-fusion/t2.csv
          sign_convention: 'Table II lists positive values; the authors report the mean as −ΔHsol = 309.2 ± 1.8 kJ mol−1.'
          points:
            - {measurement: 1, T_K: 298, delta_Hsol_kJ_mol-1_as_printed: 311.1, point_uncertainty_status: not_reported_individually}
            - {measurement: 2, T_K: 298, delta_Hsol_kJ_mol-1_as_printed: 310.4, point_uncertainty_status: not_reported_individually}
            - {measurement: 3, T_K: 298, delta_Hsol_kJ_mol-1_as_printed: 308.3, point_uncertainty_status: not_reported_individually}
            - {measurement: 4, T_K: 298, delta_Hsol_kJ_mol-1_as_printed: 307.6, point_uncertainty_status: not_reported_individually}
            - {measurement: 5, T_K: 298, delta_Hsol_kJ_mol-1_as_printed: 310.7, point_uncertainty_status: not_reported_individually}
            - {measurement: 6, T_K: 298, delta_Hsol_kJ_mol-1_as_printed: 307.3, point_uncertainty_status: not_reported_individually}
          reported_mean_minus_delta_Hsol_kJ_mol-1: 309.2
          reported_mean_uncertainty_kJ_mol-1: 1.8
          reported_mean_reliability: 0.95
          single_measurement_mean_relative_error: 0.014
        uncertainty: {reported_status: printed, individual_points: not_reported, mean_kJ_mol-1: 1.8, confidence: 'reliability coefficient (1−α) = 0.95'}

      - observation_id: adamkovicova_1980_table1_solid_relative_enthalpy_measured_reduced
        type: heat_capacity_and_heat_content_series
        locator: {page: 3, published_page: 195, pdf_page_index: 2, table: I}
        T_range_K: [1506, 1780]
        phase: crystalline_pseudowollastonite_alpha_wollastonite
        condensed_form: {polymorph: alpha}
        polymorph_notes: 'The authors identify the solid as α-wollastonite (pseudowollastonite).'
        standard_state: 'Relative enthalpy Hrel defined by Eq. (1), from T to the 298 K reference.'
        units: 'T in K; Hrel in kJ mol−1 CaSiO3'
        values:
          quantity: relative_enthalpy
          method_class: measured_reduced
          table_csv: tables/adamkovicova-1980-casio3-heat-of-fusion/t1.csv
          points:
            - {T_K: 1506, H_rel_kJ_mol-1: 448.8, point_uncertainty_status: not_reported_individually}
            - {T_K: 1576, H_rel_kJ_mol-1: 459.8, point_uncertainty_status: not_reported_individually}
            - {T_K: 1630, H_rel_kJ_mol-1: 466.3, point_uncertainty_status: not_reported_individually}
            - {T_K: 1678, H_rel_kJ_mol-1: 474.2, point_uncertainty_status: not_reported_individually}
            - {T_K: 1730, H_rel_kJ_mol-1: 483.1, point_uncertainty_status: not_reported_individually}
            - {T_K: 1780, H_rel_kJ_mol-1: 492.5, point_uncertainty_status: not_reported_individually}
          derivation:
            relation: 'Hrel = −(ΔHcool + ΔHsol), Eq. (1); use the Table I cooling values and the Table II arithmetic mean solution heat.'
            inputs: [adamkovicova_1980_table1_solid_cooling_measured, adamkovicova_1980_table2_solid_solution_heats_measured]
          derived_from: [adamkovicova_1980_table1_solid_cooling_measured, adamkovicova_1980_table2_solid_solution_heats_measured]
        uncertainty: {reported_status: not_reported_for_individual_points, note: 'The fitted relative-enthalpy function in Eq. (6) has a stated error of 2.1 kJ mol−1.'}

      - observation_id: adamkovicova_1980_solid_cooling_fit_eq3
        type: heat_capacity_and_heat_content_series
        locator: {page: 3, published_page: 195, pdf_page_index: 2, equation: '3', table: I}
        T_range_K: [1506, 1780]
        phase: crystalline_pseudowollastonite_alpha_wollastonite
        condensed_form: {polymorph: alpha}
        units: 'T in K; enthalpy in kJ mol−1 CaSiO3'
        values:
          quantity: fitted_enthalpy_of_cooling
          method_class: measured_reduced
          equation_as_printed: '−ΔHcool,CS,c,φ = −2.15 × 10^1 + 6.358 × 10^−2 T + 2.862 × 10^−5 T^2 [kJ mol−1]'
          fit_error_kJ_mol-1: 1.1
          fit_error_note: 'Eq. (2) error definition: half-width of the 95% reliability interval, approximately twice the Gaussian standard deviation.'
          fit_points:
            - {T_K: 1506, minus_delta_H_cool_kJ_mol-1: 139.2}
            - {T_K: 1576, minus_delta_H_cool_kJ_mol-1: 149.8}
            - {T_K: 1630, minus_delta_H_cool_kJ_mol-1: 158.2}
            - {T_K: 1678, minus_delta_H_cool_kJ_mol-1: 165.8}
            - {T_K: 1730, minus_delta_H_cool_kJ_mol-1: 174.2}
            - {T_K: 1780, minus_delta_H_cool_kJ_mol-1: 182.4}
          derivation:
            relation: 'Least-squares regression of measured pseudowollastonite cooling enthalpies, with ΔHcool = 0 at 298 K, Eq. (3).'
            inputs: [adamkovicova_1980_table1_solid_cooling_measured]
          derived_from: [adamkovicova_1980_table1_solid_cooling_measured]
        uncertainty: {reported_status: printed, value_kJ_mol-1: 1.1}

      - observation_id: adamkovicova_1980_solid_relative_enthalpy_fit_eq6
        type: heat_capacity_and_heat_content_series
        locator: {page: 4, published_page: 196, pdf_page_index: 3, equation: '6', table: I}
        T_range_K: [1506, 1780]
        phase: crystalline_pseudowollastonite_alpha_wollastonite
        condensed_form: {polymorph: alpha}
        standard_state: 'Relative enthalpy Hrel defined at 298 K by Eq. (1).'
        units: 'T in K; Hrel in kJ mol−1 CaSiO3'
        values:
          quantity: fitted_relative_enthalpy
          method_class: measured_reduced
          equation_as_printed: 'Hrel,CS,c,φ′ = 2.877 × 10^2 + 6.358 × 10^−2 T + 2.862 × 10^−5 T^2 [kJ mol−1]'
          fit_error_kJ_mol-1: 2.1
          fit_points:
            - {T_K: 1506, H_rel_kJ_mol-1: 448.4}
            - {T_K: 1576, H_rel_kJ_mol-1: 459.0}
            - {T_K: 1630, H_rel_kJ_mol-1: 467.4}
            - {T_K: 1678, H_rel_kJ_mol-1: 475.0}
            - {T_K: 1730, H_rel_kJ_mol-1: 483.4}
            - {T_K: 1780, H_rel_kJ_mol-1: 491.6}
          derivation:
            relation: 'Add the Eq. (3) fitted cooling enthalpy and mean solution enthalpy from Eq. (5) under the Eq. (1) reference-state definition.'
            inputs: [adamkovicova_1980_solid_cooling_fit_eq3, adamkovicova_1980_table2_solid_solution_heats_measured]
          derived_from: [adamkovicova_1980_solid_cooling_fit_eq3, adamkovicova_1980_table2_solid_solution_heats_measured]
        uncertainty: {reported_status: printed, value_kJ_mol-1: 2.1}

      - observation_id: adamkovicova_1980_solid_heat_capacity_eq4
        type: heat_capacity_and_heat_content_series
        locator: {page: 4, published_page: 196, pdf_page_index: 3, equation: '4'}
        T_range_K: [1506, 1780]
        phase: crystalline_pseudowollastonite_alpha_wollastonite
        condensed_form: {polymorph: alpha}
        units: 'T in K; molar heat capacity in kJ mol−1 K−1 CaSiO3'
        values:
          quantity: molar_heat_capacity
          method_class: measured_reduced
          equation_as_printed: 'C_Cs,c,φ = 6.358 × 10^−2 + 5.724 × 10^−5 T [kJ mol−1 K−1]'
          derivation:
            relation: 'Authors obtain Eq. (4) from the temperature derivative of the Eq. (3) fitted cooling enthalpy.'
            inputs: [adamkovicova_1980_solid_cooling_fit_eq3]
          derived_from: [adamkovicova_1980_solid_cooling_fit_eq3]
        uncertainty: {reported_status: not_reported}

