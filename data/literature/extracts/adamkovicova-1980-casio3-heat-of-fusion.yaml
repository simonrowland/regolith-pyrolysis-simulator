source:
  citation: 'Adamkovičová, K., Kosa, L. & Proks, I. (1980), "The Heat of Fusion of CaSiO3", Silikáty XXIV, 193–201.'
  doi: null
  url: https://www2.irsm.cas.cz/materialy/cs_content/1980/Adamkovicova_CS_1980_0000.pdf
  year: 1980
extraction:
  method: manual_transcription_checked_against_all_nine_page_images
  date: '2026-10-03'
  worker: t1115-adamkovicova1980
  provenance_path: text/adamkovicova-1980-casio3-heat-of-fusion/pdftotext-layout.txt
  source_note: >-
    Every page was rendered with pdftoppm at 180 dpi and visually read; all numeric
    table entries were checked against their page images. The paper has three data
    tables, all transcribed in tables/adamkovicova-1980-casio3-heat-of-fusion/.
    Temperatures are K as printed. Energies and heat capacities are kJ mol−1 and
    kJ mol−1 K−1 per mole of CaSiO3 formula units as printed; no unit conversion
    was made. Hrel is defined at 298 K by Eq. (1), Hrel = −(ΔHcool + ΔHsol).
    The sidecar licence field is empty: the paper and the controller's archive-fetch
    metadata provide no licence statement.
  method_token_note: >-
    The paper reports drop calorimetry and solution calorimetry. Neither has an
    experiment MethodToken; the two experiments retain typed unknown method States
    with the published method names. No enum value was added.
