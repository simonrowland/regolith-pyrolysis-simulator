schema_version: literature_extract.v1
source_id: ottonello-2000-polymeric-cao-feo-silica
source:
  citation: >-
    Ottonello, G. (2000), “Thermodynamic constraints arising from the polymeric approach to
    silicate slags: the system CaO–FeO–SiO2 as an example,” Sixth International Conference
    on Molten Slags, Fluxes and Salts, paper 017, 31-page proceedings manuscript.
  year: 2000
  corpus_source_id: ottonello-2000-polymeric-cao-feo-silica
extraction:
  method: >-
    Born-digital pdftotext-layout.txt was read as the primary source. The first page, Table 1,
    and the figure pages 15–31 were checked against PDF renders. This is a thermodynamic
    modelling paper with no new experiments or measured-data tables. Table 1's fitted model
    parameters are retained as model-derived context. Figures 1–17 compare calculated curves
    and surfaces with literature measurements or assessments; all are recorded with
    digitisation deferred. No plotted values were estimated.
  date: '2026-10-21'
  worker: fam37-1021
review_status: draft
species:
  SiO2:
    observations: []
    context:
      - observation_id: ottonello_2000_table_1_polymeric_model_parameters
        type: thermodynamic_model
        locator: {page: 14, pdf_page_index: 13, published_page: '14', table: '1'}
        units: model equations as printed; T in K
        values:
          method_class: model_derived
          quantity_as_printed: fitted polymerization constants and temperature-dependent strain coefficients
          phase_system: liquid CaO–SiO2 and liquid FeO–SiO2 binary slags
          printed_parameters: |
            ln Kp,FeO-SiO2 = -3600/T
            chi1,FeO-SiO2 = -4.7469 + 0.002328 T
            chi2,FeO-SiO2 = 29.316 - 0.01426 T
            chi3,FeO-SiO2 = -45.828 + 0.021348 T
            chi4,FeO-SiO2 = 32.129 - 0.013545 T
            ln Kp,CaO-SiO2 = -15372/T
            chi1,CaO-SiO2 = -3.075 + 0.0011465 T
            chi2,CaO-SiO2 = 29.490 - 0.01147 T
            chi3,CaO-SiO2 = -81.311 + 0.032785 T
            chi4,CaO-SiO2 = 67.579 - 0.028095 T
          note: >-
            These are parameters of the paper's polymeric thermodynamic model, not measured
            thermodynamic observations. They are not emitted as interaction_parameter points.
