schema_version: literature_extract.v1
source_id: johnston-1965-sodium-disilicate-redox
source:
  citation: W. D. Johnston, "Oxidation-Reduction Equilibria in Molten Na2O.2SiO2 Glass," Journal of the American Ceramic Society 48(4):184-190 (1965).
  doi: 10.1111/j.1151-2916.1965.tb14709.x
  url: https://doi.org/10.1111/j.1151-2916.1965.tb14709.x
  year: 1965
extraction:
  method: >-
    Table I transcribed from the MinerU content-list table and MinerU markdown, with pdftotext-layout as the second machine read. The rendered PDF page was used to resolve differing cells and confirm the V headers, row assignments, ditto marks, and nominal-total footnotes. Identity composition is normalized from the printed 1:2 Na2O:SiO2 formula-unit ratio. The apparent-Delta-H list was transcribed from both machine reads. Figure-only values were not extracted.
  date: '2026-10-16'
  worker: wave3b-john65
  table_i_printed_data_rows: 47
  apparent_delta_h_printed_entries: 7
  schema_gaps:
  - >-
    No quantity token represents apparent enthalpy of reduction. The seven printed values are retained under gibbs_table with quantity apparent_enthalpy_of_reduction; the real migrator must leave them unavailable.
  - >-
    Table I contains no Fe row. Fe appears only in the apparent-Delta-H list; the paper attributes that fit to prior iron-equilibrium work (ref. 1), whose input rows are not in this extract.
  - >-
    The paper prints no numeric row-level pO2 or total pressure. Each Table I atmosphere is retained as printed; numeric fO2_Pa and total_pressure_Pa remain unknown.
  figure_read_candidates:
  - Figures 2-3: log pO2 axes and redox curves; not transcribed as rows.
  - Figure 5: temperature-dependent equilibrium-constant curves; not transcribed as rows.
review_status: draft
corrections: []
