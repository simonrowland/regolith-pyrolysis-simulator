      standard_state: method geometry; not a species observation
      regime: kems_effusion
      units: as published
      values:
        quantity: kems_method_geometry_reference
        method_class: measured
        semantics: method_geometry_reference_not_measured_species_observation
        instrument: Hitachi RM-6K Knudsen-cell mass spectrometer
        analyser: 90 deg magnetic-scan single-focusing; curvature radius 200 mm
        heating: electron bombardment; upper and lower pair of 0.5 mm phi ring tungsten filaments
        temperature_control: total emission current from upper and lower filaments held constant; upper/lower
          current ratio trims the cell Delta-T
        temperature_fluctuation_C: 0.5
        temperature_fluctuation_as_printed: +/- 0.5 C during ion-ratio measurement
        thermocouple: two pairs Pt-30%Rh / Pt-6%Rh on the susceptor top and bottom
        thermocouple_note: Pt-Rh tips evaporate in vacuum near 1600 C within hours; tip recut each run
        ionizing_electron_energy_eV_Fe_V: 16-20
        ionizing_electron_energy_eV_Fe_V_Cr: 19.5
        ion_accelerating_voltage_kV: 3.6 or 4.5
        detected_ions_as_printed:
        - 51V+
        - 53Cr+
        - 54Fe+
        - 57Fe+
        sample_mass_g: 1-3
        sample_mass_note: solid and solid+liquid samples as chips; others as blocks
        chamber_pressure_Torr_as_printed: 3e-7 to 1.5e-6
        cell_upper_hotter_than_lower_C: 10-14
        cell_upper_hotter_note: orifice kept 10-14 C hotter than the bottom to avoid sample deposition
          on the orifice
        Al_addition_at_percent_of_V: 1.0
        Al_addition_purpose: deoxidation and to suppress oxygen pickup from cell-material dissociation;
          liquid-state measurements only
        orifice_diameter_mm_as_printed:
        - 0.5
        - 0.3
        missing_for_motzfeldt:
        - orifice_area
        - clausing_factor
        - sample_surface_area
        composition_after_run: chemical analysis; matched the master-alloy charge
      uncertainty:
        note: Temperature stability within +/-0.5 C. Ideal-orifice surface-depletion calculation at
          1600 C assuming effective evaporation area/orifice area=324 gives Fe 1% depletion time
          >=1e5 s; authors treat depletion as negligible
          (published p.3054, section 4.2). Empty-cell 51V+ background was about 20% of the sample
          signal at N_V=0.093 and was corrected; at N_V=0.201 the correction was <5%.
      equipment:
        cell_material:
          value: High-purity alumina Knudsen cell (Nihon Kagaku Togyo SSA-S). Body inner diameter 9 mm,
            outer diameter 11 mm, height 12 mm. Lid diameter 11.5 mm, thickness 1 mm or 0.5 mm. Orifice
            diameter 0.5 mm or 0.3 mm. Lid/body contact faces precision-ground. Cell in a tantalum susceptor
            with isothermal plates (Fig. 2). Homemade cell-support and filament-support on a Hitachi RM-6K
            Knudsen-cell mass spectrometer (90 deg magnetic-scan single-focusing, analyser radius 200
            mm).
          locator:
            published_page: 3051
            pdf_page_index: 2
            section: '3.1'
            figure: '1'
            note: Hitachi RM-6K; alumina SSA-S cell; Ta susceptor Fig. 2
