source_id: kems-119-furukawa-1975
source:
  citation: Furukawa, T. and Kato, E. (1975), "Thermodynamic Properties of the Fe-V, Fe-V-Cr Alloys at
    1600 C by Mass-Spectrometry", Tetsu-to-Hagane 61(15):3050-3059, DOI 10.2355/tetsutohagane1955.61.15_3050
  doi: 10.2355/tetsutohagane1955.61.15_3050
  url: https://doi.org/10.2355/tetsutohagane1955.61.15_3050
  year: 1975
extraction:
  method: 'Official J-STAGE OA PDF (corpus raw/kems-119-furukawa-1975/kems-119-furukawa-1975.pdf, sha256
    f2e3d5a84037dac5c18fffab90a809f99e7297854de0a4779036f8ca585202d3). No MinerU decode. Tables 1-3 transcribed
    from a 400 dpi pdftoppm render of PDF pages 1-10 (published pp. 3050-3059). pdftotext-layout is a
    noisy OCR layer and was not used as data. Ion-current ratio tables labelled measured. Activities,
    gamma fits, and partial molar heats that pass through the modified Gibbs-Duhem / Belton-Fruehan integrals
    labelled model_derived. Figs 3-12 and Photo 1 listed figure-only; no numbers off axes. Japanese body:
    numbers and English captions/abstract transcribed from the render; untranslated running prose was unseen
    in that original pass. Bench registry repair (2026-09-21) rechecked source text sections 3.1, 3.2 and
    4.2: one instrument, unassigned per-run orifices, qualified durations, and stability distinct from
    calibration uncertainty. Source text also corrects 53Cr+, the ideal-orifice depletion bound, and
    the empty-cell background ratio in the method observation.'
  date: '2026-09-13'
  worker: extract-alloys-b3
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
review_status: draft
