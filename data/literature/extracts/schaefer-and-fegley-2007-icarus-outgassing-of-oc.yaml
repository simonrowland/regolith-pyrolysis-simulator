deepening:
  date: '2026-09-12'
  worker: extract-pyro-outgas
  method: 350 dpi pdftoppm of the WUSTL reprint. No figure digitisation. Table 1 is the authors' METBASE
    average of falls, not an instrument measurement of a named stone. Tables 2–3 split observed (quoted)
    from Hebe-calculated (model_derived) columns. Gas-release curves are figure-only.
  authors_own_instrument_measurements: none; this paper is a Gibbs-energy minimization study
  figure_only:
  - Fig. 1 Hebe T–P profiles (Ghosh et al. 2003 input)
  - Figs 2–17 calculated gas chemistry, fO2, mineralogy, sensitivity, C/N metal solubility
  refused:
  - axis values from Figs 1–17
  - interpolation of Table 1 averages from ranges
  - treating quoted Muenow / Gooding and Muenow / Brett and Sato numbers as this work
  reproduction_target_note: A simulator reproduction of this paper is a closed-system equilibrium outgassing
    of the Table 1 H/L/LL bulk compositions along the Hebe 3.7 Ma T–P path (T up to 1225 K; P lithostatic,
    printed ~340 bar at 1200 K if all C as CO). Residual comparison is to the printed tables and to the
    qualitative major-gas identity (CH4, H2, H2O, N2, NH3; CO never major during metamorphism), not to
    undigitised figure curves.
