schema_version: literature_extract.v1
source_id: matsumaru-1999-plasma-arc-silicate-evaporation
source:
  citation: >-
    Matsumaru, K., Fukuyama, H., Susa, M., and Nagata, K. (1999), "Plasma Arc
    Evaporation from Molten Silicate Glasses", Journal of the Japan Institute
    of Metals, 63(1), 21–27.
  year: 1999
  doi: 10.2320/jinstmet1952.63.1_21
extraction:
  method: >-
    Born-digital pdftotext-layout and the MinerU table draft were compared.
    Tables 1–3 are retained in context because their ion-pair model inputs,
    bulk-system mass-loss rates, and quoted incinerator-ash compositions do not
    map to a row-level species observation without changing their meaning.
    Every numeric table cell was checked against 600-dpi PDF renders on physical
    pages 5–6; Table 2's two calculated Fe-Glass cases share one printed cell.
    The text's explicit 75 mol% Fe2+ value at 450 s is typed as one measured
    valence-ratio point. Figures 3–10 are metadata only; no plotted coordinates
    were digitized.
  date: '2026-10-19'
  worker: fam18-1019
review_status: draft
fidelity_samples:
  - species: Fe
    observation_id: matsumaru_1999_text_fe2_fraction_450s
    field: value
    value: '0.75'
    locator:
      page: 3
      pdf_page_index: 2
      published_page: 23
      section: Results
      figure: '3'
      note: The text states that 75 mol% of the initial Fe3+ had changed to Fe2+ by 450 s.
