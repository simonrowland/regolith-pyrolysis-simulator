source_caveats:
  - locator: {page: 1, published_page: 615, section: Experimental}
    quote: 'The whole experimental set-up is kept under vacuum conditions (< 10^-3 Pa).'
    note: >-
      This printed setup pressure is an upper bound. It is retained as a located
      unknown condition; the limit is not substituted as an exact total pressure.
  - locator: {page: 2, published_page: 616, table: 'I'}
    note: >-
      The printed composition includes CO2, for which the migrator has no
      composition component token. The complete ten-component map is retained
      verbatim in context; the partial-pressure observations' composition axis
      remains unknown rather than dropping the printed component. The additive
      series states 5 mass per cent TiO2 but prints no complete final mixture
      composition, so its composition axis also remains unknown.
  - locator: {page: 1, published_page: 615, equation: '3'}
    quote: 'Therefore, the alkali oxide activity was calculated according to Equation [3].'
    note: >-
      This extract has no numeric Na2O activity rows; the activity curves in
      Figures 2, 3 and 5 are figure-only. The reference equation prints
      Na2O(1, s), with the digit 1. Reading this as liquid/solid is an
      interpretation; the paper does not resolve that notation. Kp is taken
      externally from FACT. The printed pO2 = p_Na/4 relation is an activity
      assumption, not a measured fO2.
  - locator: {page: 2, published_page: 616, table: 'II'}
    quote: 'NBO/T according to Equation [5]'
    note: >-
      Table II's structural values are derived using the printed expression
      NBO/T = [Na2O + K2O + FeO + MgO + CaO − (Fe2O3 + Al2O3)] /
      [SiO2 + TiO2 + 2*(Fe2O3 + Al2O3)]. Its negative values are preserved as
      printed. No closed scored quantity exists for these structural descriptors;
      the values are typed-refused rather than normalized or repaired.
