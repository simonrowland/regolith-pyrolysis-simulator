species:
  FeO:
    observations:
    - observation_id: plante_1992_table2_feo_activity_coefficient_1973k
      experiment: feo-mgo-sio2-series
      type: activity_coefficient
      locator:
        table: '2'
        page: 1278
        pdf_page_index: 3
      T_range_K:
      - 1973.0
      - 1973.0
      phase: l
      condensed_form:
        state: liquid_melt
        metastable: false
        basis: explicit_author
        note: >-
          Authors (p. 1277) cite Levin Phase Diagrams for Ceramists that all
          measured compositions were liquid and single-phase at the experimental
          temperatures. Join x(MgO)/x(SiO2)=1.
      standard_state: >-
        Raoultian relative to pure liquid FeO. The authors write in the p. 1279
        Discussion: "All of these estimates are relative to pure liquid FeO as
        the standard state." The Fig. 4 caption calls it "liquid standard
        state".
      regime: kems_effusion
      units: dimensionless activity
      admission_status: admitted
      values:
        quantity: activity
        oxide_formula_as_published: FeO
        system: FeO-MgO-SiO2
        join: x(MgO)/x(SiO2)=1
        gamma_symbol_as_published: f(FeO)
        gamma_definition: >-
          Authors' f(FeO) is the Raoultian activity coefficient, and x(FeO) is
          its mole fraction (Eq. (3), p. 1277). The activity is derived as
          a(FeO)=f(FeO)*x(FeO); the printed Table 2 cells are f and x(FeO), not
          a. Each row records the multiplication and retains the printed f.
        T_K_table: 1973.0
        experimental_T_window_K_as_published: 1850-1980 (highest-FeO sample 1790-1910)
        T_independence_as_published: essentially independent of temperature between 1850 and 1980 K
        f_at_x_0_1: 4.04
        method_class: directly_reduced_measurement
        method: analytical integration of measured ion-current ratios
        method_as_printed: 'Activity coefficients at 1973 K were calculated by analytical integration of Eq. (4).'
        system_class: silicate_melt
        pO2_as_published: not_tabulated
        pO2_note: >-
          O2+ recorded only occasionally and explicitly not required for the
          activity determinations (p. 1277). Do not invent a pO2 boundary.
        rows:
        - x_FeO: 0.1
          T_K: 1973
          x_MgO: 0.45
          x_SiO2: 0.45
          x_MgO_SiO2_inference: (1-x_FeO)/2 on the stated join
          composition_mol: {FeO: '0.1', MgO: '0.45', SiO2: '0.45'}
          f: 4.04
          activity: 0.404
          arithmetic: a=f*x; 4.04*0.1=0.404
          in_table1: false
          locator:
            page: 1278
            pdf_page_index: 3
            table: '2'
            note: >-
