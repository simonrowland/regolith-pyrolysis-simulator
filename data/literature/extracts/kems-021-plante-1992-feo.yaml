schema_version: literature_extract.v1
source_id: kems-021-plante-1992-feo
source:
  citation: >-
    Plante, E. R., Hastie, J. W. & Kowalska, M. (1992), "Activity of FeO in the
    FeO-MgO-SiO2 System Determined by High Temperature Mass Spectrometry",
    ISIJ International 32(12):1276-1279, DOI 10.2355/isijinternational.32.1276
  doi: 10.2355/isijinternational.32.1276
  year: 1992
extraction:
  method: >-
    400 dpi pdftoppm crops of Tables 1-2 + eqs. (5)-(6); visual certification;
    tesseract second reader; MinerU 2.5 HTML tables (studio-3 new-kems-021) third
    reader. pdftotext layer rejected (scanned HyperGEAR). No figure digitization.
  date: '2026-08-27'
  worker: orphans-close
  provenance_path: docs-private/research/2026-08-27-ocr-repair/kems-021-plante-1992-feo/
review_status: draft
benches:
- id: tungsten-iridium-kems
  identity: {basis: described_in_this_work}
  apparatus_family:
    state: {tag: value, value: modulated-beam Knudsen effusion mass spectrometer}
    locator: &plante_apparatus {page: 1277, pdf_page_index: 2, section: '3. Experimental Procedure'}
  cell_materials:
    - state:
        tag: value
        value: W
      locator: *plante_apparatus
    - state:
        tag: value
        value: Ir
      locator: *plante_apparatus
  cell_material_and_liner:
    state: {tag: value, value: tungsten cell with iridium inner cup}
    locator: *plante_apparatus
  geometry:
    orifice_diameter_m:
      state: {tag: value, value: {kind: point, point: '0.0005'}}
      locator: {page: 1277, pdf_page_index: 2, section: '3. Experimental Procedure', note: 'Printed 0.5 mm; unit conversion only'}
    cell_internal_dimensions:
      diameter_m:
        state: {tag: unknown, reason: not_published}
        locator: {page: 1277, pdf_page_index: 2, section: '3. Experimental Procedure', note: 'No cell body dimensions are stated.'}
      height_m:
        state: {tag: unknown, reason: not_published}
        locator: {page: 1277, pdf_page_index: 2, section: '3. Experimental Procedure', note: 'No cell body dimensions are stated.'}
  temperature_measurement:
    sensor:
      state: {tag: value, value: optical pyrometer sighted into the effusion orifice}
      locator: *plante_apparatus
  detector:
    state: {tag: value, value: modulated-beam mass spectrometer with phase-sensitive detection}
    locator:
      page: 1277
      pdf_page_index: 2
      section: 3. Experimental Procedure
      note: 'The instrument is referenced as described earlier in ref. 8; no model number is printed in this paper.'
  ionization:
    method:
      state: {tag: value, value: electron impact}
      locator: *plante_apparatus
