  doi: 10.1139/v61-065
  year: 1961
extraction:
  method: >-
    Scanned source transcribed from the available MinerU output and checked against
    the PDF. The table draft tool found Table I but classified all rows as headers
    (zero body rows); its reaction-specific calculated quantities do not map safely
    to scored profiles, so they remain context. Table I was checked against a 600 dpi
    render of PDF page 6. The MinerU and pdftotext pressure for reaction V disagree;
    the rendered cell reads 2.27 × 10^-1 mm Hg. Figures 1–4 are recorded without
    numeric points; the measured curves in Figures 2–3 are deferred to a figure pass.
