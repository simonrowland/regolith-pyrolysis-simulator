extraction:
  method: Official J-STAGE OA PDF (raw/kems-095-ueda-1986/kems-095-ueda-1986.pdf). Japanese body with
    English abstract, table captions, and figure captions. pdftotext -layout is a noisy OCR layer and
    is not data. Tables 1-2 transcribed from 400 dpi pdftoppm renders of PDF pages 3 and 5 (published
    pp. 1083, 1085). Where the decode and the render disagree, the render wins. Table 2 B (binary, ignore
    oxygen) and T (Ti-Co-O path) columns kept as printed. Figs 1-13 listed figure-only. Japanese-only
    prose beyond captions/numerals recorded as unseen.
