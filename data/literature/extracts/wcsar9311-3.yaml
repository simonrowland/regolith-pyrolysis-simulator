schema_version: literature_extract.v1
source_id: wcsar9311-3
source:
  citation: >-
    Wittenberg, L. J. (1993). In-situ Extraction of Lunar Soil Volatiles.
    WCSAR-TR-AR3-9311-3, Wisconsin Center for Space Automation and Robotics,
    University of Wisconsin-Madison, November 1993. Prepared for Space 94,
    Albuquerque NM, 26 February–3 March 1994.
  year: 1993
  report_number: WCSAR-TR-AR3-9311-3
  corpus_asset: raw/wcsar9311-3/wcsar9311-3.pdf
  corpus_sha256: 14bea83bb242b4d1e7ee33d1ba3bb6f95cac3d49bbfaa55d6d12a2d0147da1fa
extraction:
  method: >-
    Manual transcription from the 12-page University of Wisconsin technical
    report PDF. Pages were rendered at 200 dpi and read as images; the
    pdftotext -layout layer was used as a cross-check (the PDF is
    print-allowed but copy-restricted). The report has no numeric data
    tables. Figures 1–3 are context-only figure records with no digitised
    points. Printed numbers are retained with their evidence class:
    quoted literature values, design assumptions, and author calculations.
    This paper reports a conceptual in-situ heating design and energy-cost
    estimate; it does not report a laboratory pyrolysis experiment.
    Temperatures, pressures, and energy figures are stored as printed.
    The bibliography lists Horai as 1991 while the in-text citation is
    Horai, 1981; the in-text year is the one carried with the conductivity
    values.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/wcsar9311-3/
review_status: draft
species:
  lunar_maria_regolith:
    observations: []
    context:
    - observation_id: wcsar9311_3_cited_volatile_concentrations_and_handling_loss
      type: textual_fact
      locator:
        pdf_page_index: 2
        section: Introduction
      units: as printed
      values:
        quantity: cited_solar_wind_volatile_abundance_and_handling_loss
        method_class: quoted_attributed
        evidence_class: quoted_attributed
        H2_concentration_as_printed: 50-60 ppm
        He3_concentration_as_printed: 10−2 ppm
        concentration_sentence_source: printed in the Introduction without a citation on that sentence
        mechanical_He_release_as_printed: mechanical stress on the soil particles was observed to release helium (Carrier, 1993)
        sieving_He_loss_as_printed: sieving the soil may have evolved 20-30% of the He (Cameron, 1987)
        later_discussion_as_printed: the loss of 20-30% of the volatile gases by mechanical handling should be reduced in half by the pneumatic structure
        later_discussion_locator: {pdf_page_index: 9, section: Discussion}
    - observation_id: wcsar9311_3_thermal_conductivity_inputs
      type: textual_fact
      locator:
        pdf_page_index: 3
        section: Techniques for Heating the Soil
      units: as printed
      values:
        quantity: thermal_conductivity
        lunar_surface_k_as_printed: 10−3 W/m·K at the surface
        lunar_k_below_0_5_m_as_printed: 10−2 W/m·K at >0.5 m
        lunar_k_attribution: Langseth, 1976
        evidence_class_lunar_k: quoted_attributed
        simulated_soil_k_with_He_as_printed: 0.6-0.7 W/m·K at 1 atm pressure
        simulated_soil_conditions_as_printed: simulated lunar soil in a conductivity cell at ∼ 27°C with He introduced into the sample
        simulated_soil_k_attribution: Horai, 1981
        evidence_class_simulated_k: quoted_attributed
        predicted_bed_k_as_printed: 1.03 W/m·K
        predicted_bed_k_attribution: empirical relationship (Deissler and Boegli, 1958), because the thermal conductivity of He increases with temperature
        predicted_bed_k_assumption_as_printed: a 1 atm of He or H2 could be temporarily maintained in the lunar soil
        evidence_class_predicted_k: quoted_attributed
        abstract_k_increase_as_printed: The low thermal conductivity of the lunar soil is increased by a factor of 100 by the inject of H2 gas.
        abstract_k_locator: {pdf_page_index: 2, section: Abstract}
        bibliography_year_note: The reference list on pdf_page_index 10 prints Horai, K., 1991, for the same conductivity paper; the in-text citation used with the 0.6-0.7 W/m·K values is Horai, 1981.
    - observation_id: wcsar9311_3_heater_design_and_feht_results
      type: textual_fact
      locator:
        pdf_page_index: 3
        section: Techniques for Heating the Soil
      units: as printed
      values:
        quantity: in_situ_heating_design_and_calculated_boundary_temperature
        method_class: model_derived
        solar_daylight_as_printed: ∼ 320 hr
        flat_plate_example:
          heater_T_as_printed: 1000°C
          atmosphere_as_printed: 1 atm of H2
          volatile_release_minimum_T_as_printed: 650°C
          penetration_as_printed: would only extend ∼ 0.5 m into the soil
          evidence_class: author_estimate
        solar_wind_depth_as_printed: the solar-wind elements are known to exist to at least 3 m depth
        heater_geometry_as_printed: cylindrical heaters ∼ 2 cm diameter, placed vertically into the soil to a depth of 3 m
        code_as_printed: Finite-Element Heat Transfer Code (Klein, 1990)
        model_as_printed: center-line maintained at 1073 K; zero heat flow at the outer radius, simulating the boundary between two adjacent cylinders
        preliminary_result_as_printed: at a radius of 0.5 m, the boundary temperature reached ∼ 1000 K in 400 hr
        preliminary_evidence_class: model_derived
        refined_discretisation_as_printed: number of nodes at this radius systematically increased to 136 and the time-steps were increased to 800
        fig1_result_as_printed: the boundary temperature approaches 900 K in 320 hr
        fig1_result_locator: {pdf_page_index: 4, figure: '1'}
        fig1_evidence_class: model_derived
        volatile_release_estimate_as_printed: Such a time-temperature correlation should be sufficient to release ∼ 90% of the H2 and He, ∼ 10% of the volatile C compounds but only 4% of the N2.
        volatile_release_evidence_class: author_estimate
        volatile_release_note: >-
          These release fractions are printed as what the calculated
          time-temperature correlation "should be sufficient to release".
          No laboratory yield table is given, and no citation is attached
          to that sentence. They are not stored as measured pyrolysis yields.
    - observation_id: wcsar9311_3_dome_trench_and_heater_layout
      type: method
      locator:
        pdf_page_index: 5
        section: Configuration of the Mining Site
      units: as printed
      values:
        quantity: pneumatic_dome_and_heater_layout
        method_class: method_only
        evidence_class: author_estimate
        dome_atmosphere_as_printed: one atmosphere of H2
        fabric_as_printed: carbon fibers; butyl rubber elastomer recommended to impregnate the fibers and form a 1 mm thick fabric
        unrestrained_thickness_as_printed: woven fabric thickness required is 5.6 mm, which is too thick to be flexible
        restrained_cells_as_printed: restraining cables ... individual cells ∼ 5 m ×5 m
        restrained_fabric_thickness_as_printed: the woven carbon fabric needs to be only 0.4 mm thick
        H2_permeation_as_printed: ∼ 80 kg/yr of H2 permeates the dome fabric
        H2_permeation_attribution: Based upon the permeation of H2 through butyl rubber (Steinmeyer and Braun, 1976)
        H2_permeation_fraction_as_printed: which is only 1.3% of the H2 collected from heating the soil
        trench_as_printed: inflated pillow fills a trench 0.3 m wide by 5 m deep, the nominal depth of the regolith
        core_drill_as_printed: heaters inserted vertically by use of the core-drill apparatus (NASA Report, 1980), demonstrated to be useful to a depth of 3 m
        heater_construction_as_printed: heat-pipes composed of Mo alloy shells containing Na or Li
        heater_spacing_as_printed: A distance of one meter would separate each heater from its 6 surrounding close-packed neighbors
        edge_setback_as_printed: at the edge of the heated field a distance of 1.5 m is needed to separate the outer heater from the trench
        heater_length_and_insertion_as_printed: The heaters are only 2 m long but are inserted to a depth of 3 m, so that one-meter of unheated regolith extends above the heaters
        solar_as_printed: four heliostats to a collector mounted in the center on top of the dome; concentrated solar energy reflected through a small aperture into a long Mo furnace tube
        layout_locator_heaters: {pdf_page_index: 6, section: Configuration of the Mining Site}
    - observation_id: wcsar9311_3_gas_flow_model_and_transmission
      type: textual_fact
      locator:
        pdf_page_index: 6
        section: Techniques for Volatiles Containment and Collection
      units: as printed
      values:
        quantity: hydrogen_cover_gas_flow_and_bottom_loss
        method_class: model_derived
        viscous_to_molecular_transition_as_printed: This transition occurs between 10^2 − 10^3 Pa
        transition_result_as_printed: these diffusing particles ... form a gas pressure which eventually reaches 10^3 Pa and allows the viscous wave to penetrate to lower depths in the heated soil
        model_as_printed: A one dimensional transient model for viscous gas flow in porous media (Arastoopour 1984) was used for this study as previously described (Wittenberg 1992b)
        fig3_cycle_as_printed: the H2 pressure was increased from 10^3 Pa to 10^5 Pa over a period of 1200 s (10 min) and then decreased to 10^3 Pa during 1200 s
        fig3_cycle_locator: {pdf_page_index: 7, figure: '3'}
        fig3_4m_as_printed: At 4 m below the surface the pressure fluctuated between (2 − 5) × 10^3 Pa; the value where H2 flow changes from viscous to molecular flow
        mare_tranquillitatis_regolith_depth_as_printed: ∼ 5 m
        unsealed_zone_as_printed: A 1 m zone exists, therefore, between the viscous flow regime and the bottom of the regolith
        transmission_equation_as_printed: log λ = −1.11 d (cm)
        transmission_equation_attribution: radiative heat transfer through a randomly packed bed of spheres modeled by the Monte Carlo method (Yang et al., 1983)
        photon_absorption_assumption_as_printed: 40% of the radiant energy was assumed to be absorbed as each photon reflected from a sphere
        transmission_probability_as_printed: ∼ 10^{−111}/m
        transmission_locator: {pdf_page_index: 8, section: Techniques for Volatiles Containment and Collection}
        transmission_conclusion_as_printed: hence, an insignificant loss of gas to lower depths
        section_title_note: The section title on pdf_page_index 6 is "Techniques for Volatiles Containment and Collection".
        note: >-
          The printed transmission probability is the extraordinary value
          ∼ 10^{-111}/m, obtained from log λ = −1.11 d (cm) at d = 1 m
          expressed per metre. The value is stored as printed; it was not
          recomputed or corrected.
