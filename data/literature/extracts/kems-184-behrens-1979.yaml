source_id: kems-184-behrens-1979
source:
  citation: "Behrens, Robert G., and Rinehart, Gary H. (1979). Vaporization Thermodynamics and Kinetics of Hexagonal Silicon Carbide. Characterization of High Temperature Vapors and Gases, NBS Special Publication 561, volume 1, pp. 125–142."
  year: 1979
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nbsspecialpublication561v1.pdf
  report_number: NBS SP 561 volume 1
  doi_status: Not supplied by hunt; resolver verification unavailable in network-disabled seat.
  calibration_caveat:
    locator: {page: 138, section: Discussion}
    quote: The partial vapor pressures of Si(g), SiC₂(g), and Si₂C(g) reported in table 2 for the present work are believed to be too high and the corresponding third-law enthalpy changes are believed to be too low for the following reasons.
    explanation: Authors question the assumed mass-independent quadrupole transmission in the separate gold calibration; source values preserved without retuning.
