extraction:
  method: >-
    Manual transcription from the born-digital pdftotext layout. Table 6 endmember
    heat-of-fusion values quoted from earlier literature are typed as attributed
    observations. The SFB basalt's calorimetric tables and derived fit are retained
    in context: the measured relative enthalpies use a 273 K reference, and the
    derived basalt fusion enthalpy has no registered table input asset. Figures 1–7
    are deferred for figure reading.
