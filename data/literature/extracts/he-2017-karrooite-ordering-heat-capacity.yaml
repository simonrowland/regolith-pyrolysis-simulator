extraction:
  method: >-
    Born-digital pdftotext-layout transcription. The MinerU table tool found no
    content-list JSON. Tables 1–5 were checked against physical PDF pages 7,
    10, 14, and 15 rendered at 600 dpi. Figures 1–12 are records only; figure
    values are not digitized.
  date: '2026-10-20'
  worker: fam24-1020
review_status: draft
scope_assessment:
  tables:
    - table: '1'
      disposition: context-no-token
      reason: >-
        Candidate tokens cp, S, delta_fH, and H_minus_H298 do not fit synthesis
        conditions, lattice parameters, Rietveld factors, bond lengths, or the
        Mg/Ti disorder parameter X.
    - table: '2'
      disposition: context-no-token
      reason: >-
        Candidate thermochemistry tokens cp, S, delta_fH, and H_minus_H298 do
        not type Raman frequencies or activities. Experimental columns are
        quoted from [8, 36].
    - table: '3'
      disposition: context-no-token
      reason: >-
        Candidate thermochemistry tokens cp, S, delta_fH, and H_minus_H298 do
        not type IR frequencies or activities. Experimental columns are quoted
        from [37, 38].
    - table: '4'
      disposition: context-model
      reason: >-
        Elastic stiffness coefficients and the DFT bulk modulus have no matching
        quantity token; the paper labels the table as theory.
    - table: '5'
      disposition: context-measured-lineage-pending
      reason: >-
        Table 5 totals remain in context because the component values have no
        distinct Quantity token. derivation pending a corpus table asset
        (controller, t-1382); 126.1 is the X=0 extrapolation of the experimental
        S° totals, each of which is Svib plus Sconfig from equation (1), and is
        not a calorimetric standard entropy of ordered MgTi2O5.
  figure_only_candidate: >-
    Figure 10 contains measured Cp points, but figure digitization is deferred
    by the family rule. Figures 11–12 are calculated or reduced curves and
    remain unscored context.
