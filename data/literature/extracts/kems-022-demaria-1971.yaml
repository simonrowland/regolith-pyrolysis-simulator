    context:
    - observation_id: demaria_1971_alkali_run_procedure_and_missing_order
      type: method
      locator:
        published_page: 1368
        pdf_page_index: 2
        paragraph: experiments performed utilizing alternate procedures; progressive and fixed temperature procedures
      units: as printed
      values:
        quantity: alkali_run_temperature_procedure
        method_class: quoted_attributed
        procedure_quote: >-
          The experiments were performed utilizing alternate procedures which consisted either of studying the
          vaporization of the sample progressively, namely by changing the temperature step by step
          (“progressive depletion” procedure) or of heating the sample to a predetermined temperature
          (“fixed temperature” procedure). The latter mode was controlled by the limits imposed by the validity
          of the Knudsen effusion conditions. This procedure was mainly used in the initial part of the BC
          experiments.
        temperature_visit_order: not stated; ascending, descending, or cyclic order is not specified (pp. 1367–1380 searched)
        fresh_sample_per_temperature: not stated (pp. 1367–1380 searched)
        time_at_temperature: not stated (pp. 1367–1380 searched)
        sample_depletion_procedure_note: The paper calls the stepwise procedure “progressive depletion,” but does not give a point-by-point run sequence.
        sample_12065_procedure_relation: >-
          The authors say that the procedure for sample 12065 was similar to that for 12022 (p. 1375).
          They do not specify point-by-point run order, fresh sample use, or hold times.
    - observation_id: demaria_1971_alkali_depletion_statements
      type: method
      locator:
        published_page: 1368
        pdf_page_index: 2
        paragraph: As the sample vaporized a depletion in the volatile components occurred
        note: Additional Na and K depletion statement at p. 1369, Alkaline components paragraph.
      units: as printed
      values:
        quantity: alkali_depletion_with_vaporization
        method_class: quoted_attributed
        depletion_quote_p1368: >-
          As the sample vaporized a depletion in the volatile components occurred. This process caused a change
          in the intensities of species at constant temperature to values which, in some cases, dropped below
          the sensitivity-detection limits of the instruments. We therefore considered only the “initial points,”
          namely the values measured in a temperature range corresponding to the conditions under which
          presumably no appreciable variation of the concentration of the relative components in the condensed
          phase occurred.
        results_treatment_quote_p1368: >-
          The treatment of the experimental results given in this paper, is mainly restricted to such data.
        alkali_depletion_quote_p1369: >-
          Owing to the low content in the sample (0.36 and 0.068 wt. % of Na2O and K2O, respectively) depletion
          of these components occurred very soon, so that only a few initial points could be measured.
        time_or_successive_heating_detail: not stated beyond the quoted depletion statements; pp. 1367–1380 searched
        depletion_interpretation_note: >-
          depletion steepens the apparent slope only if the lower-temperature points were measured after the
          higher-temperature ones; the order is not stated; in an upward progressive run depletion flattens it.
        thermodynamic_context_flags:
          liquidus: All transcribed Fig. 1 Na points are below the lunar-sample liquidus.
          effusion_saturation: Not demonstrated; the area calculated from the reported diameter is 4.15 mm², and sample surface area is not stated.
          absolute_pressure_uncertainty: At least a factor of two according to the authors (p. 1375).
    - observation_id: demaria_1971_figure1_symbol_key
      type: experiment_series
      locator:
        published_page: 1369
        pdf_page_index: 3
        figure: '1'
        paragraph: Figure 1 caption symbol definitions
      units: as printed
      values:
        quantity: figure_symbol_and_instrument_key
        method_class: quoted_attributed
        caption_quote: >-
          The circles are referred to the sample 12022 while the squares are relative to the sample 12065.
          Open points are referred to experiments carried out with BC instrument; full points are relative to
          NAA experiments. Barred points are relative to different series of data. This notation is followed
          through the text.
        BC_instrument: Bendix Co. time-of-flight mass spectrometer, model 3015 (p. 1367)
        NAA_instrument: Inghram-type Nuclide Analysis HT model (NAA), 60° magnetic-sector, 12″ radius of curvature, vertically mounted (p. 1367)
        differential_pumping_and_background_note: Differential pumping and background discrimination used a movable slit (p. 1367).
        series_interpretation: The caption does not name or number the different series; a bar marks a point from a different data series.
        figure_reading_note: |-
          # Fig. 1 digitization derivation (p. 1369; image pixels are full-page render coordinates)
          # Locate the printed tick centres, fit value = slope × pixel + intercept separately for each axis,
          # then map the centroid of each isolated marker's dark body pixels. Crops were enlarged for manual
          # seed placement; grayscale pixels <150 within the marker body supplied the centroid. The 300 and
          # 600 dpi readings were made independently. The crowded lower cluster is recorded by extent only.
          # 300 dpi: x = 0.00183503073162 px + 4.834633153; y = -0.00442985392815 py + 1.884830493.
          # Printed Fig. 1 symbols are uniform in size.
          # Reviewer measurement: isolated 8-connected components at grayscale < 150, inclusive pixel coverage, 300 dpi;
          # maximum half-extent 9.5 × 8.5 px at S1 (S3: 9 × 8.5 px).
          # Round that maximum up to a 10 × 9 px half-width floor; larger stored widths remain.
          # Using the stored 300 dpi calibration (x slope 0.00183503073162 in 10^4/T per px; y slope 0.00442985392815 dex per px),
          # the floor is x=10×0.00183503073162=0.018350307 in 10^4/T and y=9×0.00442985392815=0.039868685 dex;
          # S1: half-widths 0.016516/0.035439 → 0.018351/0.039869 axis units; totals 0.017307/0.042132 → 0.019142/0.046562.
          # 600 dpi: x = 0.000917868016649 px + 4.834366353; y = -0.00221636267629 py + 1.888778039.
          # From the mapped centre (x,y), T = 10^4/x K and p = 10^y atm. Each point stores the 300/600 dpi
          # pixel centres and uncertainty components: maximum absolute tick-fit residual + marker half-width
          # + absolute difference between the independent coordinate readings.
          # Worked point C1: the two mapped centres average to x=6.946, y=-6.039; T=10^4/6.946=1439.68 K,
          # p=10^-6.039=9.1411324e-7 atm. Sanity check: 300 dpi x tick at px=1180 maps to 6.9999694 (~7.0);
          # 600 dpi y tick at py=4912.686 maps to -8.9995159 (~-9.0).
          # Calibration residual tables (tick | pixel | fitted value | residual):
          # 300 x: 6.5|907.5500|6.5000153|+0.0000153; 7.0|1180.0000|6.9999694|-0.0000306;
          # 7.5|1452.5000|7.5000153|+0.0000153.
          # 300 y: -6|1780.2154|-6.0012637|-0.0012637; -7|2004.9516|-6.9968122|+0.0031878;
          # -8|2232.0000|-8.0026035|-0.0026035; -9|2457.0000|-8.9993206|+0.0006794.
          # 600 x: 6.5|1814.6051|6.4999343|-0.0000657; 7.0|2359.5604|7.0001314|+0.0001314;
          # 7.5|2904.0863|7.4999343|-0.0000657.
          # 600 y: -6|3559.7625|-6.0009467|-0.0009467; -7|4009.4570|-6.9976328|+0.0023672;
          # -8|4462.5741|-8.0019046|-0.0019046; -9|4912.6860|-8.9995159|+0.0004841.
