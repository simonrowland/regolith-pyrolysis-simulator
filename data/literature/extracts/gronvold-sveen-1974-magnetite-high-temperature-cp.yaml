      type: sample_characterization_context
      locator:
        page: 2
        published_page: 860
        section: Sample
      units: compositional values as printed
      values:
        method_class: measured_direct
        characterization: 'Synthetic magnetite prepared from pure Fe2O3 and iron powder; exploratory X-ray showed
          >95% reaction after 15 min at 1273 K. Fe2O3 spectrographic impurities (ppm by mass): Si 3; Mn 1; Cu <1;
          Mg <1; 46 other sought elements not detected. Oxidation mass gain corresponded to FeO1.334±0.001, assuming
          Fe2O3 product. Duplicate dichromate titrations: Fe2+ 24.05±0.02 mass% (theoretical 24.11), total Fe 72.39±0.06
          mass% (theoretical 72.36). Sample mass sealed in the ampoule: 68.485 g.'
