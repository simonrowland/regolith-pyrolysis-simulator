starting_compositions:
  locator: {page: 38, table: 1}
  units: wt.%
  iron_basis: All Fe as FeO (Table 1 footnote b); FeO* denotes wt.% of all Fe in glass computed as FeO based on mass balance (Table 2 footnote c)
  rows:
    Prim. Home Plate Avg.: {n: not_reported, SiO2: '49.42', TiO2: '0.98', Al2O3: '9.84', Cr2O3: '-', FeO*: '17.78', MnO: '0.35', MgO: '11.57', CaO: '6.51', Na2O: '3.12', K2O: '0.43', NiO: '–', Sum: '100'}
    MB1: {SiO2: '51.01', TiO2: '1.01', Al2O3: '10.15', Cr2O3: '0.0', FeO*: '18.36', MnO: '0.36', MgO: '11.94', CaO: '6.72', Na2O: '0.0', K2O: '0.0', NiO: '0.45', Sum: '100'}
    Syn-MB1: {SiO2: '51.01', TiO2: '1.00', Al2O3: '10.15', Cr2O3: '0.0', FeO*: '18.36', MnO: '0.36', MgO: '11.94', CaO: '6.72', Na2O: '0.0', K2O: '0.0', NiO: '0.46', Sum: '100'}
    Syn-MB1 Exp. Avg: {n: '107', SiO2: '50.33(28)', TiO2: '1.00(3)', Al2O3: '10.09(8)', Cr2O3: BDL, FeO*: '18.13(31)', MnO: '0.37(4)', MgO: '11.76(9)', CaO: '6.89(8)', Na2O: '0.06(2)', K2O: BDL, NiO: '0.33(8)', Sum: '98.96'}
    Syn-MB2: {SiO2: '48.36', TiO2: '0.83', Al2O3: '8.36', Cr2O3: '0.0', FeO*: '18.86', MnO: '0.301', MgO: '16.62', CaO: '5.71', Na2O: '0.0', K2O: '0.0', NiO: '0.38', Sum: '100'}
    Syn-MB2 gl: {n: '20', SiO2: '50.13(11)', TiO2: '0.94(3)', Al2O3: '9.46(8)', Cr2O3: BDL, FeO*: '18.61(18)', MnO: '0.32(4)', MgO: '13.03(8)', CaO: '6.54(8)', Na2O: '0.10(1)', K2O: BDL, NiO: '0.21(3)', Sum: '99.35'}
    Syn-MB2 ol: {n: '15', SiO2: '38.92(14)', TiO2: BDL, Al2O3: BDL, Cr2O3: BDL, FeO*: '18.50(10)', MnO: '0.25(1)', MgO: '41.17(16)', CaO: '0.16(1)', Na2O: BDL, K2O: '–', NiO: '1.53(5)', Sum: '100.55'}
  notes:
    - Table 1 footnote c: Prim. Home Plate Avg. is the average of Home Plate primitive magma compositions from Filiberto and Dasgupta (2011).
    - Table 1 footnote d: MB1 is the target after replacing K2O with an equal amount of NiO and renormalizing on an alkali-free basis.
    - Table 1 footnote e: Syn-MB1 is the as-weighed composition.
    - Table 1 footnote f: Syn-MB1 Exp. Avg. averages 107 analyses from 12 experiments; parenthetical digits are analytical uncertainties in least units, e.g. 50.33(28) means 50.33 ± 0.28 (standard deviation).
    - Table 1 footnote g: Na2O average uses experiments 11, 13, 57, 60, and 61 where Na2O exceeded detection.
    - Table 1 footnote h: NiO average excludes experiments 30 and 57 where NiO was below detection.
    - Table 1 footnote i: Syn-MB2 is 83% Syn-MB1 experimental average plus 17% synthetic Fo77 olivine; Fe, Ni, and Na values were calculated using theoretical Syn-MB1 values due to possible Fe and Ni loss and Na gain.
    - Table 1 footnote j: Syn-MB2 gl and Syn-MB2 ol are coexisting glass and olivine from experiment 2-3 at 1300 °C, log10 fO2 -7.24, 41.25 hrs.
    - BDL means below detection limit; a dash means not analyzed or not reported.
