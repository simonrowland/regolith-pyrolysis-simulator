source_id: saini-2023-sulfur-vanadium-borosilicate-structure
source:
  citation: 'Saini R, Neuville DR, Youngman RE, Goel A (2023). Deciphering the structural origins of high sulfur solubility in vanadium-containing borosilicate glasses. Journal of Non-Crystalline Solids 619, 122554.'
  doi: 10.1016/j.jnoncrysol.2023.122554
  year: 2023
  corpus_asset: raw/saini-2023-sulfur-vanadium-borosilicate-structure/saini-2023-sulfur-vanadium-borosilicate-structure.pdf
extraction:
  method: >-
    Born-digital journal article; pdftotext-layout is primary and MinerU table draft found no table blocks. Tables 1, 2, and 3 on PDF pages 3, 7, and 8 were rendered at 600 dpi and transcribed from the render. The ten figures were reviewed at 600 dpi and are deferred without numeric points. The paper reports qualitative V redox inferences and XPS binding-energy shifts, but no numeric V valence fractions or ratios. Glass-composition vectors, room-temperature structural descriptors, and binding energies are retained in context because no matching quantity token describes them.
  table_dispositions:
    table_1: context-only; measured whole-glass composition vectors and SO3 solubility have no matching battery quantity token
    table_2: context-only; room-temperature Al coordination and NMR parameters have no matching quantity token
    table_3: context-only; room-temperature B coordination and NMR parameters have no matching quantity token
    redox: no numeric measured V valence fraction or ratio is printed; XPS binding-energy values and qualitative interpretation are context
    figures: ten figure records are deferred without numeric points
  date: '2026-10-20'
  worker: fam31-1020
review_status: draft
