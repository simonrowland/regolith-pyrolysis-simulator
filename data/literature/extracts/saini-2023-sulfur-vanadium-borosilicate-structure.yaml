    - observation_id: saini_2023_vanadium_redox_xps_context
      type: measured_text_context
      locator: {page: 4, pdf_page_index: 3, section: '3.1 Redox chemistry of vanadium'}
      attribution: present work
      units: XPS binding energy eV
      candidate_tokens: [valence_ratio, oxidation_state]
      reason: The paper uses binding-energy shifts and glass color qualitatively to infer V oxidation states; it prints no numeric V3+/V4+/V5+ fraction or ratio, and binding energy has no matching quantity token.
      values:
        XPS_as_printed: V 2p3/2 peak maximum near 517.3 eV for V2O5 below 7.5 mol.%; expected V5+ energy 517.91 eV; peak shifts lower at V2O5 at or above 7.5 mol.%, with expected V4+ peak 516.35 eV.
        qualitative_interpretation_as_printed: Vanadium is primarily +5; V4+ is minimal at V2O5 up to 5 mol.% and a notable fraction above 5 mol.%. Blue color at 10 mol.% V2O5 indicates V4+ presence; the paper gives no measured valence fraction.
        experimental_conditions_as_printed: glasses melted at 1200 °C for 1 h; synthesis atmosphere is not stated; XPS on freshly fractured monolithic samples.
