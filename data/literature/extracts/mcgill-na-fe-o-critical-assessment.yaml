  source_note: >-
    This is the journal article as its own source, separate from the authors' 2015 thesis. The paper models alpha, beta, and gamma NaFeO2; the later reported delta polymorph is discussed but excluded from the optimization for lack of transition thermochemistry. Figure-only heat-content and heat-capacity points are not extracted.
