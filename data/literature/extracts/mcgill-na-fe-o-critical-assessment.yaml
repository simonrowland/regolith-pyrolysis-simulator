    Transcribed Tables II-VI from the MinerU content list and markdown plus the born-digital pdftotext layout. Render checks resolve flagged numeric cells and verify table row/column assignments. Figure-only values are excluded.
  date: '2026-11-05'
  worker: codex-resume-77747-1793930354
