schema_version: literature_extract.v1
source_id: van-limpt-2006-sodium-evaporation
source:
  citation: >-
    van Limpt, H., Beerkens, R., and Verheijen, O. (2006). "Models and Experiments for Sodium Evaporation From Sodium-Containing Silicate Melts," Journal of the American Ceramic Society 89(11), 3446–3455.
  doi: 10.1111/j.1551-2916.2006.01233.x
  year: 2006
extraction:
  method: >-
    Born-digital pdftotext-layout transcription with table and figure-page render checks; MinerU was used only as an independent table comparison. Table I contains calculated gas diffusion coefficients; Table II repeats the six transpiration mass-balance measurements also transcribed in the 2007 van Limpt thesis (kems-046-van-limpt-2007). The main Na evaporation, NaOH vapor-pressure, and Na2O activity measurements are plotted in Figures 3–8 and deferred to a figure pass; Figure 9 is an industrial CFD model output.
  date: '2026-10-28'
  worker: recon-vanlimpt06
  provenance_path: data/literature/extracts/audits/van-limpt-2006-sodium-evaporation.mapping.yaml
review_status: draft
schema_gaps:
  - The reported total sodium rate is a molar areal flux in mol·m-2·s-1; no exact quantity token represents it, so the printed values remain unavailable with quantity unknown.
  - Table II reports absolute Na2O-equivalent loss in mg and a ratio of two mass-loss methods; no exact quantity token represents either form.
  - The relative-to-original-glass Na2O activity comparison has no exact quantity token; its printed percentage remains unavailable with quantity unknown.
