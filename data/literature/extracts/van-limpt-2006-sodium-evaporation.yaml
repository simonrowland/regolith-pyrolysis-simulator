source:
  citation: >-
    van Limpt, H., Beerkens, R., and Verheijen, O. (2006). "Models and Experiments for Sodium Evaporation From Sodium-Containing Silicate Melts," Journal of the American Ceramic Society 89(11), 3446–3455.
  doi: 10.1111/j.1551-2916.2006.01233.x
  year: 2006
extraction:
  method: >-
    Born-digital pdftotext-layout reading with table and figure-page render checks. Table I contains calculated gas diffusion coefficients; Table II repeats the six transpiration mass-balance measurements also transcribed in the 2007 van Limpt thesis (kems-046-van-limpt-2007). The main Na evaporation, NaOH vapor-pressure, and Na2O activity measurements are plotted in Figures 3–8 and deferred to a figure pass; Figure 9 is an industrial CFD model output.
  date: '2026-10-20'
  worker: fam35-1021
review_status: draft
