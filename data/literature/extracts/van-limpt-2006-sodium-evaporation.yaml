      - observation_id: van_limpt_2006_printed_evaporation_fluxes_context
        type: measured_quantity_context
        locator:
          source_path: corpus/raw/van-limpt-2006-sodium-evaporation/van-limpt-2006-sodium-evaporation.pdf
          page: 6
          published_page: 3451
          pdf_page_index: 5
          note: >-
            Text reports total sodium-species molar evaporation rates (Na, NaOH, etc.): approximately 1.2×10^-4 mol m^-2 s^-1 at 1450–1460 °C; at 1400 °C the compared rates are 6.7×10^-5 to 7.4×10^-5 mol m^-2 s^-1 with differences up to about 10%. Candidate token checked: EVAPORATION_RATE, but its canonical unit is kg/s total; the paper reports areal molar flux and provides no single vapor species or directly usable total conversion. Retained with the printed units.
