schema_gaps:
  - The reported total sodium rate is a molar areal flux (mol·m-2·s-1); simulator/battery/enums.py has no matching quantity token, so its printed values remain unavailable with quantity unknown.
  - Table II reports total Na2O loss in mg and an extractive-to-gravimetric ratio, not a rate or fraction. simulator/battery/enums.py has no matching quantity token for these forms; the six mass-loss rows remain unavailable with quantity unknown, and the ratio is retained in context.
  - Numerical Na(g), NaOH(g) saturation-pressure and Na2O-activity values occur only in Figures 3, 4, 6, and 7 and are not digitized in this wave; the prose's relative Na2O-activity comparison remains unavailable with quantity unknown because simulator/battery/enums.py has no matching token for this relative comparison.
