          \                                                                               MgFe2 O4 is nearly an\
          \ inverse spinel at room temperature,\n                                                              \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                      with Fe3+ occupying tetrahedral sites and both\
          \ Mg2+ and Fe3+\n                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                in octahedral sites. As the temperature increases, it gradu-\n      \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \          ally transitions toward normal spinel structure. At low (about\n                          \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                          500◦ C) temperatures,\
          \ the cation distribution does not achieve\n                                                         \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                           equilibrium due to limited cation mobility.\
          \ Conversely, at high\n                                                                              \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                      temperatures (above 1100◦ C), quenching makes it challenging\n\
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                to preserve the equilibrium cation arrangement. The degree of\n                     \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                               inversion\
          \ of MgFe2 O4 spinel was investigated in several works.\n                                            \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                        Cation distribution in MgFe2\
          \ O4 spinel was investigated using SM\n                                                              \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                      [58–61], XRD [62–64], and Mossbauer spectroscopy\
          \ [62, 65]. The\n                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                experimental results of Mozzi and Paladino [64] are in agreement\n  \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \              with those of O’Neill et al. [62]; these experimental data were used\n                \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    as\
          \ a reference in the present work (Figure 6a).\n\n                                                   \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                 Nell et al. [66] and Trestman-Matts\
          \ et al. [67] measured the\n                                                                         \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                                                                                    \
          \                                           cation distribution in spinel using a thermopower technique.\n\
