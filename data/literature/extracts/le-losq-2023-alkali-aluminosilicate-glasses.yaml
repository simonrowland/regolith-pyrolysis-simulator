extraction:
  method: >-
    Context-only review of the authoritative born-digital pdftotext-layout file.
    The paper reports an i-Melt machine-learning model and its compiled datasets,
    not new measured property rows. Tables 1 and 2 are model performance metrics;
    Table 3 combines model-derived partial molar properties with literature
    comparisons. The quoted partial heat-capacity values in the discussion are
    contributions resolved by Al coordination, for which no matching store
    quantity and sample composition are printed. Figure records have no numeric
    points; every plotted figure is deferred to a figure pass.
