extraction:
  method: manual transcription from controller-supplied PDF; all pages rendered at 180 dpi and data-table pages checked against images
  date: '2026-10-04'
  worker: extract-abdul2023
  provenance_path: tables/abdul-2023-cao-sio2-calphad
  method_token_note: >-
    Drop calorimetry and solution calorimetry have no MethodToken in the pinned simulator
    vocabulary. Own drop-calorimetry and DSC methods retain their published names; the
    drop-calorimetry experiment uses the typed unknown method State. No enum token was added.
  source_note: >-
    The paper uses CALPHAD calculated quantities, experimental comparisons, and cited
    source values. Printed values and labels are preserved in the table context rows and CSVs.
    Table 3's printed heat-content unit header reads J mol−1 K−1 and that exact header is
    retained in its context table. The typed H_minus_H298 projection uses the listed
    heat-content amounts in J/mol, then the simulator's exact J-to-kJ conversion; no
    numeric value is adjusted. This preserves the apparent printed dimensional mismatch.
    No numerical CaO melting point or explicit CaO liquid reference-state value is printed.
