          activity_data_fit_status: 'Activity data was not fit in this assessment.'
          activity_comparison: Calculated SiO2 activity agrees with Baird and Taylor [58], with good agreement at high CaO concentrations across [56], [58], [59]; CaO activities are in line with prior models [10], [13] and agree with Carter and Macfarlane [80].
          rankinite_heat_content_comparison: Some agreement with Haas [3]; FactSage FTPs [5] calculated values clearly overestimate the measured heat content.
          belite_heat_content_comparison: γ-Ca2SiO4 measurements from 972–1072 K agree with FactSage [5], Haas [3], and Coughlin [41]. Above 1072 K, γ and α′ measurements disagree with FactSage; measured α′ values are 24–32 kJ lower, while Haas [3] and Coughlin [41] agree.
          h298_s298_comparison: Most values are within expected error of Haas [3]; rankinite H298 disagrees, as previously reported by Hillert et al. [11]; α′-Ca2SiO4 H298 and S298 disagree with Haas owing to new enthalpy and heat-capacity data in this work.
          model_derived_enthalpy_comparison: Generally good agreement; the main discrepancy is triclinic-Ca3SiO5 at x=0.25, attributed to Brunauer et al. [45] conflicting with King [42].
