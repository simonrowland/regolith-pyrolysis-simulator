    - {locator: {page: 73, pdf_page_index: 72, table: '4.2'}, row_count: '3 oscillator rows', numeric_cells: 15, evidence: 'MinerU table and pdftotext agree on the numeric rows; rendered PDF page 73 confirms row assignments and all numeric cells.'}
    - {locator: {page: 86, pdf_page_index: 85, table: '4.6'}, row_count: 8, numeric_cells: 47, evidence: 'No MinerU table block exists for this page. The pdftotext read and rendered PDF page 86 confirm the table and every cell.'}
    - {locator: {page: 100, pdf_page_index: 99, table: 'A.2'}, row_count: 16, numeric_cells: 78, evidence: 'MinerU table and pdftotext agree; PDF render page 100 confirms both eight-row blocks and comma-decimal cells.'}
