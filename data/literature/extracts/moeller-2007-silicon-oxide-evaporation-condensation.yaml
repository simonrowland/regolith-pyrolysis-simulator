schema_version: literature_extract.v1
source_id: moeller-2007-silicon-oxide-evaporation-condensation
source:
  citation: "Moeller, S. (2007), Infrarotspektroskopische Untersuchungen des Verdampfens, der Kondensation und des Temperns von Siliziumoxid, Diplomarbeit, Universität Duisburg-Essen."
  year: 2007
extraction:
  method: Machine-text transcription from MinerU tables and pdftotext-layout; table rows cross-checked between reads and row/column layout checked against the printed table.
  date: '2026-11-06'
  worker: w1106a-moel07
  scope_note: Numeric data limited to tabulated IR band positions, printed deposition conditions/rates/thicknesses, and annealing temperature-duration data. Figure-only vapor-pressure points, spectra, and figure-read values are deferred.
  schema_gap: >-
    IR band wavenumber has no exact quantity token in simulator/battery/enums.py::Quantity or
    simulator/battery/migrate.py::QUANTITY_ALIASES / TYPE_QUANTITY, and table_record is not an
    observation type in tools/validate_literature_extracts.py::OBSERVATION_TYPES. Retain the
    printed table records as context with descriptive non-token quantity labels; do not alias
    them to transition_temperature or another near-match. Phase basis tokens in
    simulator/battery/enums.py::PHASE_BASIS_TOKENS and roles in
    simulator/battery/enums.py::PhaseRole describe phase composition, not IR wavenumber. The
    neighbouring candidate evaporation_rate is mass/time; it does not represent printed film
    thickness growth in nm/min. See existing spectral table-record precedent in
    he-2017-karrooite-ordering-heat-capacity.yaml and jackson-2005-ferrous-glass-multispectroscopy.yaml.
  compare_adjudication: >-
    The compare output flags Table 4.6 as unverifiable because its PDF page has no MinerU caption
    block, and flags Table A.2 because the caption parser reports appendix label A. The source
    PDF renders at pages 86 and 100 show the printed captions 4.6 and A.2 and all cells; extract
    locators retain those exact printed table labels.
