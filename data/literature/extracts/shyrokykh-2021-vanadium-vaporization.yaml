extraction:
  method: Born-digital pdftotext-layout transcription. The table draft tool was attempted but no MinerU
    content-list JSON exists for this source; Tables I–III were transcribed by hand and every cell checked
    against 600 dpi physical-page renders. Figures 1–16 are recorded without digitized points.
  date: '2026-10-19'
  worker: fam17-1019
  table_disposition:
    Table I: CSV1/CSV2 starting compositions are bound to the corresponding text-reported yield bounds
      by sample ID; CSV3 remains context because its outcomes are figure-only. The two bounds migrate
      as unavailable with the typed reason in values.unavailable_reason; shared support is tracked by
      t-1367.
    Table II: Treatment matrix retained in context; it contains conditions but no measured outcome column.
    Table III: All 25 selected-element EDX atomic-percent cells retained in context because no token fits
      this partial elemental composition table.
