        axes_as_printed: as printed in caption and panel labels
        caption_as_printed: >-
          Fig. 11. Correlations between the isotopic composition of magnesium, silicon and oxygen with: (a) the fraction of magnesium remaining in the evaporation residue, expressed as −ln(f24Mg); and (b) the fraction of silicon remaining in the evaporation residue, expressed as −ln(f28Si). The data used in these figures are from all the FUN1 residues and from FUN2 residues with MgO >15 wt%. The solid lines are the best fit to the d25Mg (open circles), d29Si (open squares), and d18O (open diamonds) as a function of −ln(f24Mg) or −ln(f28Si). The dashed lines show the amount of magnesium evaporated from Vigarano 1623-5 and Allende C1 FUN CAIs as estimated from their d25Mg, d29Si and d18O. In the case of C1, all three isotopic systems give a very similar estimate of original magnesium (~18%, from panel a) and silicon (~25%, from panel b) remaining. In the case of 1623-5, the oxygen and magnesium isotopes give a similar estimate of ~18% for the magnesium remaining, while the silicon isotopic composition suggests that a larger fraction of magnesium (~29%) did not evaporate (panel a). As for amounts of silicon remaining in 1623-5 (panel b), the magnesium and oxygen isotopic composition suggests that ~18% of original silicon remains, but the silicon isotopic composition indicates that as much as 37% of silicon still remains.
