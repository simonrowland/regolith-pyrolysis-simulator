    - observation_id: mendybaev_2013_figure1_context
      type: figure_only
      locator:
        page: 3
        pdf_page_index: 2
        figure: '1'
      units: as plotted; no numeric points
      values:
        quantity: isotope_delta_context
        method_class: figure_only
        identity:
          species: O and Mg-Si isotopes
          phase: minerals and inclusions
          T_as_printed: 1900 °C for evaporation experiments; starting-material panels as captioned
          sample: whole-rock and mineral samples
        axes_as_printed: as printed in caption and panel labels
        caption_as_printed: >-
          Fig. 1. Oxygen isotopic compositions of whole-rock and individual minerals from FUN inclusions: (a) Vigarano 1623-5 (Davis et al., 2000) and (b) Allende C1 (Clayton et al., 1977; Krot et al., 2008). Various lines are shown: TFL is the terrestrial fractionation line with slope approximately one half defined by the mass-dependent oxygen isotopic fractionation of terrestrial samples; the CAI line with a slope of approximately one as defined by the oxygen isotopic composition of whole-rock CAIs and their mineral separates (e.g., Clayton et al., 1977). FUN FL is the mass-dependent fractionation line with slope 1/2 defined by forsterite, spinel and pyroxene in 1623-5, and by spinel and pyroxene in C1. The FUN FL line for both 1623-5 and C1 intersects the CAI line at point A with d17O = −49‰ and d18O = −49‰ (Δ17O ~ −24‰), but position of FUN FL could vary for individual inclusions (e.g., Δ17O ~ −16‰ for TE FUN CAI, Krot et al., 2008, 2010). Melilite in both 1623-5 and C1 (and anorthite in C1) plot close to the intersection of CAI line and TFL (point B). The intersection of the dashed line drawn from the melilite values (point B) through the whole-rock values of the FUN inclusion with the FUN FL line (point C) gives our estimate of the average oxygen isotopic composition of the FUN inclusion prior to the oxygen exchange that affected the isotopic composition of melilite and anorthite. The difference between points A and C is our best estimate of the degree of mass-dependent oxygen isotope fractionation due to evaporation (change in d18O of ~35‰) for both C1 and 1623-5.
