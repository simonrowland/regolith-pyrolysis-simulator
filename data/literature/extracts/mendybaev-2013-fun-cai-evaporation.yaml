        method_class: figure_only
        identity:
          species: Mg isotope fractionation
          phase: olivine and glass
          T_as_printed: 1900 °C for evaporation experiments; starting-material panels as captioned
          sample: FUN1/FUN2 evaporation samples
        axes_as_printed: as printed in caption and panel labels
        caption_as_printed: >-
          Fig. 7. Rayleigh plot of the magnesium isotopic fractionation of the FUN1 and FUN2 evaporation residues as a function of the amount of 24Mg remaining in the residue. R = 25Mg/24Mg of a residue, R0 = 25Mg/24Mg of the zero-time residue, and f24Mg is the fraction of the initial 24Mg remaining in the residue. The slope of the best fitting line through the data of a set of evaporation residues from a common initial composition is a measure of 1 − a25,24, where a25,24 is the kinetic isotope fractionation factor defined as the isotopic ratio of the evaporation flux to that of the evaporating source. The FUN1 and FUN2 residues containing more than 15 wt% MgO (solid line) result in an estimate of a25,24 = 0.98380 ± 0.00039; the most evaporated FUN2 residues (<15 wt% MgO, dashed line) result in an estimate of a25,24 = 0.98567 ± 0.00046, close to a25,24 = 0.98607 ± 0.00017 of residues from a Type B CAI-like melt evaporated at 1900 °C (Richter et al., 2007). Also shown for comparison are experimental data on molten Mg2SiO4 at 1900 °C reported by Davis et al. (1990).
