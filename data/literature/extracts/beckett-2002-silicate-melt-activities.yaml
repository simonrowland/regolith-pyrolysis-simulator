source:
  citation: >-
    Beckett J.R. (2002). Role of basicity and tetrahedral speciation in controlling the thermodynamic properties of silicate liquids, part1: The system CaO–MgO–Al2O3–SiO2. Geochimica et Cosmochimica Acta66(1):93–107.
  doi: 10.1016/S0016-7037(01)00751-7
  url: https://doi.org/10.1016/S0016-7037(01)00751-7
  year: 2002
  version: published original journal PDF
  sha256: 0f3b3ac1f985bbb80b027b59799753243a9df13e0cc08128e8c88742329189de
extraction:
  method: >-
    Manual transcription of the model-method, standard-state and numerical
    composition statements from the supplied PDF; activity and activity-
    coefficient figures are recorded caption-only as figure_only, without
    digitizing plotted points, under the controller ruling. Page locators were
    checked against 200 dpi renders. No data tables are printed.
  date: '2026-10-13'
  worker: codex-resume-71406-1791906764
review_status: draft
notes:
  - >-
    The SOURCE.md citation and year are retained exactly. The PDF prints PII
    S0016-7037(00)00751-7, whereas the registered DOI is
    10.1016/S0016-7037(01)00751-7; this visible discrepancy is recorded, not
    silently corrected.
