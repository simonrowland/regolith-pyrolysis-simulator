  - species: CaO
    observation_id: beckett_2002_cao_standard_state
    observable: thermodynamic_context
    field: standard_state_quote
    value: 'In this work, lime, periclase, corundum, and high cristobalite at temperature and 1 atm are used as standard states for oxide components in the melt.'
    locator: {page: 2, published_page: 94, pdf_page_index: 1, equation: '2'}
  - species: CaO
    observation_id: beckett_2002_cao_model_method
    observable: method
    field: method_quote
    value: 'In this study, the model of Berman (1983) is used to evaluate the activities of end-member oxides in the system CaO-MgO-Al2O3-SiO2 (CMAS).'
    locator: {page: 2, published_page: 94, pdf_page_index: 1, section: 2.1}
  - species: CaO
    observation_id: beckett_2002_cao_model_method
    observable: method
    field: method_detail_quote
    value: 'The basic idea is to use calorimetric data and exchange reactions between coexisting solids and liquids or pairs of liquids to constrain the excess free energy, Gexcess, of the liquid. The activity coefficient of a specific oxide component relative to its standard state can be derived from Gexcess through suitable differentiation.'
    locator: {page: 2, published_page: 94, pdf_page_index: 1, section: 2.1}
  - species: CaO
    observation_id: beckett_2002_cao_printed_numerical_context
    observable: thermodynamic_context
    field: quote
    value: 'All three of these variables are simple functions of the optical basicity Λ with which they display minima near Λ ~ 0.54 that are generated by liquids with low ratios of nonbridging to tetrahedral oxygens (NBO/T) (<0.3) and a mole fraction ratio, XSiO2^Liq/XAl2O3^Liq, in the range 4 to 20. Variations in ln(γCaO^Liq) at constant Λ near the minimum are due mostly to liquids with (XCaO^Liq + XMgO^Liq)/XAl2O3^Liq < 1.'
    locator: {page: 1, published_page: 93, pdf_page_index: 0, section: Abstract}
  - species: CaO
    observation_id: beckett_2002_cao_cmas_composition_ranges
    observable: thermodynamic_context
    field: quote
    value: 'A temperature of 1600°C was selected for most calculations because liquids are stable over much of the system but the temperature is not so high that extrapolation of Berman’s (1983) model, which is based mostly on phase equilibria acquired at temperatures at or below 1600°C, becomes excessive. For 1600°C, accepted liquids have mole fractions of oxides in the range of 0 to 0.71 for CaO, 0 to 0.55 for MgO, 0 to 0.45 for Al2O3, and 0 to 0.95 for SiO2.'
    locator: {page: 3, published_page: 95, pdf_page_index: 2, section: 2.3}
  - species: CaO
    observation_id: beckett_2002_cao_temperature_dependence_context
    observable: thermodynamic_context
    field: quote
    value: 'For optical basicities near Λ = 0.54, ln(γCaO^Liq) increases with temperature, rising by as much as a factor of twenty over 400°C. On the other hand, the temperature effect is quite modest for Λ > ~0.65 at NBO/T = 0.'
    locator: {page: 5, published_page: 97, pdf_page_index: 4, section: 2.3}
  - species: CaO
    observation_id: beckett_2002_cao_stable_nbot_context
    observable: thermodynamic_context
    field: quote
    value: 'At 1600°C, stable CMAS liquids encompass an NBO/T range of -0.2 to +4.0.'
    locator: {page: 8, published_page: 100, pdf_page_index: 7, section: 2.4}
  - species: CaO
    observation_id: beckett_2002_cao_and_mgo_minima_context
    observable: thermodynamic_context
    field: quote
    value: 'For NBO/T = 0, there is a minimum in ln(γCaO^Liq) at XSiO2^Liq/XAl2O3^Liq ~ 4 to 6, in ln(γCaO^Liq γAl2O3^Liq) at XSiO2^Liq/XAl2O3^Liq ~ 5 to 7, and in ln(γMgO^Liq γAl2O3^Liq) at XSiO2^Liq/XAl2O3^Liq ~ 7 to 10.'
    locator: {page: 11, published_page: 103, pdf_page_index: 10, section: 2.5}
