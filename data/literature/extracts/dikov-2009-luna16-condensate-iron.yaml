source:
  citation: Dikov, Yu. P., Gerasimov, M. V., Yakovlev, O. I. & Ivanov, A. V. (2009), "Valence State of Iron in a Condensate from the Luna 16 Regolith", Petrology 17(5):429–438. DOI 10.1134/S0869591109050014.
  doi: 10.1134/S0869591109050014
  year: 2009
extraction:
  method: >-
    Machine transcription used the corpus pdftotext-layout and MinerU markdown/content-list tables first.
    The three table layouts were then checked against rendered PDF pages 2, 3, and 6; all numeric cells
    agreed between the two machine reads. Table 1's 100.01 total was render-checked after the table QA
    comma-decimal flag. The printed upper-layer Fe proportions and the two differing temperature ranges
    were checked against rendered PDF pages 1 and 4. Figures 1–9 were not digitized; the figure-only
    values are deferred. Elemental at.% tables are retained as typed refusals: Quantity.CONDENSATE_COMPOSITION
    is a component mole-fraction vector and Quantity.RESIDUE_COMPONENT_COMPOSITION is not elemental
    concentration; QUANTITY_ALIASES has no exact elemental-at-percent quantity. See the audit mapping.
  date: '2026-11-06'
