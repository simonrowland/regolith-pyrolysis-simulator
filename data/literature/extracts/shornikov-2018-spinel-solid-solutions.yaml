 ai/d(1/T); (46) ΔSi=−dΔμi/dT; (47) ΔGT=ΔHT−TΔST; (48) ΔGT=sum_i xi Δμi; (49) ΔHT=sum_i xi ΔHi; (50) ΔST=sum_i xi ΔSi. Eq. (26), Eq. (38), and the Table 2 equation headers are reproduced as printed and are not silently corrected.",
