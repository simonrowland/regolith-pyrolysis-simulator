            "attribution": "Shornikov (2018), this paper",
            "statements": [
              {
                "statement": "The partial pressure values of vapor species over spinel solid solutions and the boundary of the solid spinel solutions in the MgAl2O4 (solid solution) + Al2O3 region are determined on the basis of the data obtained by Knudsen effusion mass spectrometric method in the temperature range 2000–2200 K.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Abstract"
                }
              },
              {
                "statement": "The values of oxide activities, Gibbs energies, enthalpies and entropies of formation of solid solutions show a slightly negative deviations from ideality.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Abstract"
                }
              },
              {
                "statement": "MgAl2O4 spinel has cubic syngony.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The O2− oxygen atoms in the spinel structure are in the densest cubic packing, in which there are 96 empty positions: 64 tetrahedral and 32 octahedral.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "In spinels with a normal structure, eight tetrahedral positions of the unit cell are filled with Mg2+ atoms and 16 octahedral positions with Al3+ atoms.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "In total, the unit cell contains 32 oxygen atoms.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The Mg2+ cation is surrounded by four oxygen atoms; the Al3+ cation is surrounded by six oxygen atoms; each oxygen atom is bonded to one Mg2+ atom and three Al3+ atoms.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "In the inverted structure, eight tetrahedral positions are occupied by Al3+ atoms, and half of the 16 octahedral positions are occupied by each cation.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The gamma-alumina unit cell has the composition Al8/3O4.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Such a structure is referred to as disordered, since half the Al3+ atoms and the Mg2+ atoms are statistically distributed in octahedral positions, and the nature of the distribution has yet to be determined definitively, despite a considerable number of performed studies.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Spinel solid solutions are formed by replacing some of the Mg2+ (Al3+) atoms with Al3+ (Mg2+) atoms.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              }
            ]
          }
        },
        {
          "observation_id": "shornikov_2018_prior_experiments",
          "type": "thermodynamic_example",
          "locator": {
            "page": 1447,
            "published_page": 1447,
            "pdf_page_index": 0,
            "section": "Introduction"
          },
          "units": "as printed",
          "values": {
            "quantity": "located_context",
            "method_class": "quoted_attributed",
            "attribution": "Sata et al. [8, 9] and Sasamoto et al. [10], as cited by Shornikov (2018)",
            "statements": [
              {
                "statement": "Sata et al. [8, 9] studied (according to Langmuir) the nonequilibrium vacuum evaporation of a number of compositions of spinel solid solutions using furnaces with tungsten heaters in the temperature range of 1873–2173 K and determined the temperature [8] and concentration [9] dependences of the compositions’ rates of evaporation.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Sata et al. [8, 9] observed the formation of corundum grains on composition surfaces. These were explained by diffusion processes, but they were most likely caused by nonequilibrium evaporation conditions.",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Sasamoto et al. [10] studied the stationary evaporation of three compositions of spinel solid solutions (50.00, 66.67, and 73.68 mol % of Al2O3) from tungsten cells in the temperature range of 1850–2300 K and found molecules and atoms typical of individual oxides in the gas-phase above spinel solid solutions (i.e., (Mg), (Al), and (AlO) [11, 12]), along with the molecular forms resulting from interaction between the investigated compositions and the cell material (i.e., (WO), (WO2), and (WO3)).",
                "locator": {
                  "page": 1447,
                  "published_page": 1447,
                  "pdf_page_index": 0,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Sasamoto et al. [10] reported that tungsten-containing gas species “lowered the partial pressure of oxygen in the gas phase above the compositions and thus raised the partial pressure of vapor forms that had little or no oxygen.”",
                "locator": {
                  "page": 1448,
                  "published_page": 1448,
                  "pdf_page_index": 1,
                  "section": "Introduction"
                }
              }
            ]
          }
        },
        {
          "observation_id": "shornikov_2018_prior_pressures_and_activity_comparisons",
          "type": "thermodynamic_example",
          "locator": {
            "page": 1448,
            "published_page": 1448,
            "pdf_page_index": 1,
            "section": "Introduction"
          },
          "units": "as printed",
          "values": {
            "quantity": "located_context",
            "method_class": "quoted_attributed",
            "attribution": "Sasamoto et al. [10], Petric and Chatillon [14], and Fuji et al. [5], as cited by Shornikov (2018)",
            "statements": [
              {
                "statement": "The low sensitivity of the apparatus allowed determination of only the partial pressure of atomic magnesium (pMg) above the studied compositions, and the estimated values of the partial pressures of the rest vapor forms were 10^2–10^3 times lower.",
                "locator": {
                  "page": 1448,
                  "published_page": 1448,
                  "pdf_page_index": 1,
                  "section": "Introduction"
                }
              },
              {
                "statement": "However, the approach using Eq. (2) is not completely correct, since it assumes equality between the partial vapor pressures of oxygen above the composition of a spinel solid solution and above magnesium oxide at the same temperature. This is not confirmed by our experimental data [1].",
                "locator": {
                  "page": 1448,
                  "published_page": 1448,
                  "pdf_page_index": 1,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The aMgO value extrapolated to the boundary of the region of spinel solid solutions with corundum (Fig. 1a) (which was found by Petric and Chatillon in [14]) does not agree fully with the activities of magnesium oxide in spinel solid solutions that were obtained by Sasamoto et al. [10] (albeit at higher temperatures), and thus with the values in [2, 13].",
                "locator": {
                  "page": 1448,
                  "published_page": 1448,
                  "pdf_page_index": 1,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Using Knudsen effusion mass spectrometric method, Petric and Chatillon [14] also determined the aMgO activity at a temperature of 1773 K for the heterogeneous reaction [MgO] = (Mg) + 1/2(O2) in the MgAl2O4 + Al2O3 region.",
                "locator": {
                  "page": 1448,
                  "published_page": 1448,
                  "pdf_page_index": 1,
                  "section": "Introduction"
                }
              }
            ]
          }
        },
        {
          "observation_id": "shornikov_2018_prior_thermochemistry_limits",
          "type": "thermodynamic_example",
          "locator": {
            "page": 1449,
            "published_page": 1449,
            "pdf_page_index": 2,
            "section": "Introduction"
          },
          "units": "as printed",
          "values": {
            "quantity": "located_context",
            "method_class": "quoted_attributed",
            "attribution": "Fuji et al. [5], Navrotsky et al. [15], and Gribchenkova et al. [16], as cited by Shornikov (2018)",
            "statements": [
              {
                "statement": "The oxide activities in spinel solid solutions at 1800 and 1873 K were determined using the same approach (Fig. 1). Note that these data are close to those obtained by Petric and Chatillon [14] and thus contradict the results obtained in [2, 10, 13].",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The enthalpies of formation (ΔHT) of several compositions in the 50 to 78 mol % range of Al2O3 concentrations, associated (according to Navrotsky et al. [15]) with the spinel solid solutions, were obtained via calorimetry by dissolution in Pb2B2O5 salt at the fairly low temperature of 975 K.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "However, a completely different region (MgAl2O4 + Al2O3) is found in the one of spinel solid solutions proposed by Navrotsky et al. [15] according to the phase diagram of the MgO–Al2O3 system [3]. Therefore ΔH975 values obtained by Navrotsky et al. are associated more with a mixture of spinel and corundum than with the spinel solid solutions.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Note that the above estimate of the aAl2O3 values (Fig. 1b) does not agree with the results of Fuji et al. in [5].",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "These thermodynamic values were calculated using the absolute values of the pMg and pO partial pressures, obtained with a rather low accuracy of around 30%.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Deviations in the determination of the experimental pMg values above the MgAl2O4 + Al2O3 and MgO + MgAl2O4 systems reached a value of Δ log pMg ≤ 0.7, greatly exceeding the values obtained in [10, 14], which lay within a range of 0.1–0.2, and this was the source of the considerable errors in determining the aMgO values in spinel solid solutions (Fig. 1a).",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              }
            ]
          }
        },
        {
          "observation_id": "shornikov_2018_prior_cell_interaction_and_contradictions",
          "type": "thermodynamic_example",
          "locator": {
            "page": 1449,
            "published_page": 1449,
            "pdf_page_index": 2,
            "section": "Introduction"
          },
          "units": "as printed",
          "values": {
            "quantity": "located_context",
            "method_class": "quoted_unattributed",
            "attribution": "Shornikov (2018), this paper",
            "statements": [
              {
                "statement": "The authors also noted the formation of magnesium tungstates in the condensed phase, which in our opinion was due to the low quality of the iridium coating of the effusion inner surface of the cell.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The drop in the magnesium ion current intensity (IMg) in the isothermal experiments was explained by the authors as a result of the interaction between the sample and the iridium coating, which led to the formation of intermetallic phases.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "A similar observation was made by Sasamoto et al. [10], and was explained by the evaporation surface of the spinel solid solution sample being slowly covered with precipitated Al2O3.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "At the same time, Gribchenkova et al. [16] did not observe a similar drop in IMg during the evaporation of compositions belonging to the MgAl2O4 + Al2O3 region.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "In our opinion, the observed drop in IMg corresponded to a change in the homogeneous condensed phase composition of the spinel solid solution due to the preferential evaporation of the vapor species belonging to the MgO phase, which was not considered by either Gribchenkova et al. [16] or Sasamoto et al. [10].",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The absence of a drop in this value is typical of the MgAl2O4 + Al2O3 heterogeneous phase evaporating without changing its composition.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The available information on the thermodynamic properties of spinel solid solutions in the MgO–Al2O3 system thus seems very sporadic, limited, and contradictory.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "Studies of the properties of the gas phase above spinel solid solutions are limited to a single component; i.e., atomic magnesium, the partial pressure values of which have been determined with poor accuracy.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The oxide activities in the spinel solid solutions are determined indirectly and do not agree with one another, nor do they correspond to the data on stoichiometric spinel.",
                "locator": {
                  "page": 1449,
                  "published_page": 1449,
                  "pdf_page_index": 2,
                  "section": "Introduction"
                }
              },
              {
                "statement": "The values of the experimentally determined enthalpies of formation for spinel solid solution compositions were obtained for low temperatures and correspond more to the MgAl2O4 + Al2O3 region in the phase equilibrium diagram of the MgO–Al2O3 system; or, they were determined with considerable errors that do not allow us to draw correct conclusions about the behavior of a solid solution.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Introduction"
                }
              },
              {
                "statement": "It should be noted that the boundaries of the spinel solid solutions in the MgO–Al2O3 system need to be refined, along with a number of other invariant points of this system.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Introduction"
                }
              }
            ]
          }
        },
