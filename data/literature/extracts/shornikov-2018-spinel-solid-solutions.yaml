          "units": "as printed",
          "values": {
            "quantity": "located_context",
            "method_class": "quoted_unattributed",
            "attribution": "Shornikov (2018), this paper",
            "statements": [
              {
                "statement": "Thermodynamic data on the properties of spinel solid solutions in the concentration range of the MgAl2O4–Al2O3 system were obtained via Knudsen effusion mass-spectrometric method with the stationary evaporation of a stoichiometric spinel sample from a molybdenum cell in the temperature range of 2000–2200 K.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "Stoichiometric spinel was synthesized by sintering active ultradisperse powders obtained via the joint crystallization of magnesium and aluminum nitrates, along with magnesium and aluminum sulfates; and by means of solid-phase synthesis.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "Mixture compositions were prepared using a stoichiometric ratio of magnesium and aluminum oxides, followed by X-ray diffraction studies and chemical analysis of the spinel samples.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "As was shown in [1, 2], (Mg) is the predominant component of the gas phase above stoichiometric spinel, while the (Al), (AlO), (Al2O), (MgO), (O), and (O2) molecular forms are present in the gas phase to a lesser extent, and (MgAlO) is found in very small amounts.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The evaporation process in stoichiometric spinel can be conditionally described by reaction (9), allowing us to obtain spinel solid solution compositions directly in an effusion container during evaporation because of the preferential evaporation of the components containing magnesium atoms.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The change in the composition of a residual spinel melt can in this case be calculated using the isothermal evaporation approach proposed by Sidorov et al. [17].",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The change of the spinel composition during evaporation continued up to compositions at the boundary between the region of spinel solid solutions and the MgAl2O4 + Al2O3 region.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              }
            ]
          }
