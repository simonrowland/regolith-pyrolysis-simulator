            "attribution": "Shornikov (2018), this paper",
            "statements": [
              {
                "statement": "Just as with the stoichiometric spinel in [1], ions typical of the vapor above magnesium and aluminum oxides [11, 12] were observed in the mass spectra of the vapor above spinel solid solutions with an ionizing electron energy of 30 eV, along with small amounts of the ion of the (MgAlO) complex gaseous oxide in [1, 2].",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "Other ions with the general formula (MgAl_iO_k) (i = 1, 2; k = 0, 2, 3, 4) were not detected.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The ion-source design and its use for high-temperature mass spectrometry are referred to the apparatus descriptions in [1, 2].",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The presence of the (MoO_j) ions (j = 0–3) in the mass spectra of the vapor above spinel solid solutions was due to the interaction between the spinel and the material of the molybdenum container.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "As in [10], this led to conditions of reductive evaporation.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The choice of the energy of the ionizing electrons was a compromise between obtaining the maximum intensity of ions in the vapor mass spectra and the possibility of their minimum fragmentation under the action of an electron impact.",
                "locator": {
                  "page": 1450,
                  "published_page": 1450,
                  "pdf_page_index": 3,
                  "section": "Experimental"
                }
              },
              {
                "statement": "The monotonic behavior of the ionization efficiency curves did not display any of the breaks typical of the presence of fragmentary ions, though it did not exclude the possibility of their occurrence.",
