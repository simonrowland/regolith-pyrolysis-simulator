extraction:
  method: >-
    Authoritative pdftotext-layout was reviewed first. The MinerU table converter found no table blocks. The
    sample compositions and mineral components in Table 1, all nine fit rows in Table 2, and all seven
    component pairs in Table 3 were transcribed from 600 dpi renders of physical PDF pages 8–10. Figures
    1–4 were rendered at 600 dpi and recorded without digitising plotted K pressures. The report gives no
    numerical O2 pressure values and prints no ion-to-pressure calibration method.
