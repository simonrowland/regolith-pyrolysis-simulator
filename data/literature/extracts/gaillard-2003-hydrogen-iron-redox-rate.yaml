schema_version: literature_extract.v1
source_id: gaillard-2003-hydrogen-iron-redox-rate
figure_policy: Figures are deferred to a figure pass; figure records contain no numeric points.
source:
  citation: Gaillard, F., Schmidt, B., Mackwell, S. and McCammon, C. (2003). Rate of hydrogen-iron redox exchange
    in silicate melts and glasses. Geochimica et Cosmochimica Acta 67(13), 2427-2441.
  doi: 10.1016/S0016-7037(02)01407-2
  year: 2003
  corpus_asset: raw/gaillard-2003-hydrogen-iron-redox-rate/gaillard-2003-hydrogen-iron-redox-rate.pdf
  sha256: 664cadf15198f52522432bfef60efe7039fe676e2bb5b1c06351e49125853c7b
  doi_as_printed: 10.1016/S0016-7037(00)01407-2 (printed DOI contains a year-code typo; repository sidecar gives
    02)
extraction:
  method: Born-digital paper; pdftotext-layout.txt used as the table-text source. The source folder has no MinerU
    table content-list, and the table tool only drafts from MinerU inputs, so Tables 1-4 were hand-transcribed and
    checked against 600 dpi renders of physical PDF pages 2, 3, 4 and 9. Figures 1-10 were inspected on 600 dpi
    renders of pages 5-10, 12 and 13 and are deferred without numeric points. Table 1's whole-glass wt% composition
    is retained in context because no existing quantity names starting-glass composition; the Fe3+/Fetot cell is
    typed as a valence fraction. Tables 2-3 front distances and durations have no matching quantity token and are
    retained row-by-row in context; fH2 and initial pH2/pAr are typed under existing fugacity/partial-pressure quantities.
    Table 4's measured log K has no matching quantity token and its solubility/diffusivity/alpha columns are model-derived,
    so the printed rows and equations are retained in context. Table 2's log fO2 is stored as a bare point_conditions.fO2_log;
    the controller directed use of the existing bar convention and a locator note because the paper omits an atm/bar
    reference. The 13 higher/lower fH2 brackets remain typed as Value intervals in the extract; the current migrator
    does not select interval-valued fugacity, so those migrate unavailable rather than choosing an endpoint.
  date: '2026-10-19'
  worker: fam14b-1019
review_status: draft
