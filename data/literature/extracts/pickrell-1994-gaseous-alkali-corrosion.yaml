schema_version: literature_extract.v1
source_id: pickrell-1994-gaseous-alkali-corrosion
source:
  citation: >-
    Pickrell, G. R. (1994). High temperature alkali corrosion kinetics of low expansion ceramics.
    PhD dissertation, Virginia Polytechnic Institute and State University.
  year: 1994
extraction:
  method: >-
    Tables 1–4 transcribed from MinerU table HTML and pdftotext-layout, with page renders used to verify
    table layouts and the Table 4 final-row zero. The prose rate constants and associated measured bounds
    for alumina, mullite, cordierite, transformation-toughened zirconia, and aluminum titanate are added
    from the cited source pages. Numerical corrosion outputs retain descriptive non-token quantity labels
    where the closed vocabulary has no exact token. Tables 5–12 are separate carbonate–ceramic batch
    reaction phase studies, not alkali-vapor exposures. Figure-only corrosion traces remain undigitized.
  campaign_atmosphere:
    concentration_as_reported: 'approximately 1.0 +/- 0.1 vol% NaNO3 vapor; Figure 10 caption states 0.98 vol%'
    derivation: Assuming ideal gases, calculated from NaNO3 weight-loss rate and fixed compressed-air flow.
    scope: One fixed campaign concentration used throughout the corrosion experiments.
    locator: {page: 39, published_page: 27, section: '3.3'}
    alternate_caption_locator: {page: 66, published_page: 54, figure: '10'}
  date: '2026-10-28'
  worker: w1028naF-pickrell94-corr
review_status: draft
fidelity_samples:
  - path: species.Si3N4.observations[pickrell_1994_table1_si3n4_reaction_rate].values.points[0].value
    value: 3.00
    locator: {page: 50, published_page: 38, table: '1', row: 1, table_row_number: 2, table_phase_column: 2}
  - path: species.SiC.observations[pickrell_1994_table2_sic_reaction_rate].values.points[2].value
    value: 5.33
    locator: {page: 67, published_page: 55, table: '2', row: 3, table_row_number: 4, table_phase_column: 2}
  - path: species.Al2O3.observations[pickrell_1994_table3_alumina_product_analysis].values.points[3].alumina_moles
    value: 4.48
    locator: {page: 79, published_page: 67, table: '3', row: 4, table_row_number: 5, table_phase_column: 2}
  - path: species.Al2O3.observations[pickrell_1994_table4_beta_alumina_peak_area_measurements].values.points[7].beta_alumina_peak_area
    value: 0
    locator: {page: 81, published_page: 69, table: '4', row: 8, table_row_number: 9, table_phase_column: 2}
  - path: species.Al2O3.observations[pickrell_1994_table4_beta_alumina_peak_area_ratio_after_26h_etch].values.value
    value: 0
