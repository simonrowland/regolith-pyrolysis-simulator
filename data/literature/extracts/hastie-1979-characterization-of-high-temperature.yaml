schema_version: literature_extract.v1
source_id: hastie-1979-characterization-of-high-temperature
source:
  citation: >-
    Bonnell, D. W. and Hastie, J. W. (1979), "Transpiration Mass Spectrometry of
    High Temperature Vapors", in Hastie, J. W. (ed.), Characterization of High
    Temperature Vapors and Gases, NBS Special Publication 561, Vol. 1,
    pp. 357–414, National Bureau of Standards, Washington, DC.
  year: 1979
  doi: 10.6028/NBS.SP.561v1
  doi_scope: >-
    Volume DOI shared with other NBS SP 561/1 chapters already extracted
    (kems-042-plante-1979; kems-184-behrens-1979). This extract is the Bonnell &
    Hastie TMS chapter only (printed pp. 357–414).
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nbsspecialpublication561v1.pdf
extraction:
  method: >-
    Manual visual transcription from 120–160 dpi pdftoppm renders of the 848-page
    volume PDF. Scope: Bonnell & Hastie chapter printed tables only (Tables 1–4).
    Modelled on kems-020-hastie-1981-nbsir / kems-042-plante-1979. Figures
    (vapour-pressure plots etc.) not digitized — figure_only ledger. Derived
    absolute pressures in Table 3 stamped derived. Detailed TMS numbers that
    kems-020 cites as "Bonnell and Hastie 1979" live here.
  date: '2026-09-22'
  worker: n2-hastie-dacko
  null_hypothesis_check: >-
    No extract for Bonnell & Hastie 1979 TMS chapter. Volume DOI already used by
    Plante (kems-042) and Behrens (kems-184) for different chapters; those are
    not duplicates of this chapter. kems-020-hastie-1981-nbsir is a different
    report (NBSIR 81-2279) that cites this chapter as original_source.
review_status: draft
fidelity_samples:
  - species: N2
    observable: concentration_series
    observation_id: bonnell_hastie_1979_table1_calibration_gas
