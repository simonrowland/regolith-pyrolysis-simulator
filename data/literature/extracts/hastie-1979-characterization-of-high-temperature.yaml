    locator:
      published_page: 376
      pdf_page_index: 400
      table: '1'
  - species: N2
    observable: concentration_series
    observation_id: bonnell_hastie_1979_table1_calibration_gas
    field: electron_energy_eV
    value: 30
    locator:
      published_page: 376
      pdf_page_index: 400
      table: '1'
