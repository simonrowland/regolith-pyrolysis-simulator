source:
  citation: Ueshima, Y., Ichise, E. & Mori, T. (1983), "Iron-Molybdenum Phase Diagram in the Temperature Range of 1360 to
    1622 C", Tetsu-to-Hagane 69(6):556-563, DOI 10.2355/tetsutohagane1955.69.6_556
  doi: 10.2355/tetsutohagane1955.69.6_556
  url: https://doi.org/10.2355/tetsutohagane1955.69.6_556
  year: 1983
extraction:
  method: Official J-STAGE OA PDF (https://www.jstage.jst.go.jp/article/tetsutohagane1955/69/6/69_6_556/_pdf). Japanese body
    with English synopsis and English table/figure captions. pdftotext -layout used only as a page map. Tables 1-2 and printed
    invariant/quoted KEMS temperatures transcribed from 400 dpi pdftoppm PNG renders of PDF pages 1-8 (published pp. 556-563).
    Where decode and render disagree, the render wins. THIS PAPER'S OWN MEASUREMENTS ARE ANNEALING + OPTICAL/X-RAY/EPMA, NOT
    KEMS. KEMS activity and KEMS thermal-analysis temperatures printed here are quoted from the authors' previous papers (refs
    1 and 2) and are labelled quoted_measurement. Figs 1-3 and Photos 1-3 are figure-only.
  date: '2026-09-13'
  worker: extract-alloys-b4
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/EXTRACT-057.md
