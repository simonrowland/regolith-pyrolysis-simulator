notes:
- Table 1 is the authors’ preliminary Na2O-SiO2 double-cell series at 1300°C. It has 12 rows. Its silica activity
  reference state is not stated in this source; the β-cristobalite standard declared for the later 1630°C CaO systems
  is not assigned to Table 1.
- Tables 2 and 3 report 11 and 52 rows respectively. The authors measured double-cell e.m.f. at 1630°C with same-composition
  Fe-Si electrodes and a common C or MgO intermediate oxygen electrode. Table 2 marks magnesia containers (M, followed
  by ditto marks); Table 3 marks magnesia (M) and graphite (G) containers row by row. The authors reduce e.m.f.
  by equation (3-13) with β-cristobalite at 1630°C as the SiO2 activity standard state (physical PDF page 14; printed
  page 257).
- The paper defines the activity coefficient as γA = aA/NA in its binary-solution discussion (physical PDF page
  16; printed page 259). Table 2 and 3 coefficients are measured_reduced from each same-row printed activity and
  SiO2 mole fraction, with lineage to the activity observation. Activities are quoted_attributed because the source
  has no registered e.m.f. quantity token for the measurement input.
- 'The reference slag composition is internally inconsistent in the source: page 8 (printed page 251) prints CaO
  45.2%, SiO2 2.2%, Al2O3 53.6%; page 14 (printed page 257) prints CaO 45.2%, SiO2 2.2%, Al2O3 52.6%. Both statements
  were verified in page renders and are preserved here without selecting a corrected value. This reference slag
  is not substituted for the row compositions.'
- Table 2 row CB-7 prints 32.0 wt% CaO and 59.5 wt% SiO2 (PDF page 9); these weight cells sum to 91.5%, while the
  same row prints 41.8 and 58.2 mol%. The 600 dpi page render clearly reads 32.0, so both printed composition forms
  are retained without correction.
- No experimental total pressure, absolute fO2, or gas mixture is printed for the tabulated cell runs. The argon
  mentioned for preparing the Fe-Si alloy and the H2/H2O equilibrium quoted for Sanbongi and Ohtani are not carried
  onto other experiments or used as cell-run conditions.
- Table 4 has 7 printed comparison rows. Six scalar activities are observations; the Sakagami interval 0.16~0.17
  has no registered interval form and is kept in context as a typed refusal. Table 4 gives the 2CaO-SiO2 saturation
  condition but no numerical liquid composition. Its external-reference standard states and methods are not supplied
  in this paper except for the limited attribution/method text retained row by row.
- 'Schema gaps: the scanned tables print e.m.f. cells, but there is no quantity token for e.m.f.; these numeric
  input cells are not emitted as observations. The single activity interval is typed-refused. Figure-read candidates,
  not digitized in this extraction: Figures 2, 3, 5, 6, 7, and 9.'
