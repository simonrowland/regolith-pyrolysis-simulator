    and oxide composition are retained as printed. Figure-only plotted values are not digitized.
  date: '2026-11-02'
  worker: w1103ro-ro74
review_status: draft
experiments:
- experiment_id: roeder_1974_iron_equilibrium_runs
  method: quench_equilibration
  method_as_printed: High-temperature experiments in iron crucibles; samples were continuously mixed with a metallic iron
    rod at 60 rpm for at least 90 hours in a gas atmosphere controlled by mixing CO2 and H2. The runs were quenched in water
    to below red heat in less than ten seconds; a thin oxidized film formed on the top surface of each run. The authors state
    that this film and metallic iron blebs prevented separate ferrous and ferric iron analyses.
  locator:
    page: 3
    published_page: 399
    pdf_page_index: 2
    section: Experimental details
