# Fidelity-sample policy for literature extracts (t-510).
#
# Policy: ENFORCED_FOR_NEW (effective 2026-08-03).
# Extracts that carry observations MUST include reviewer-verified
# fidelity_samples — except members of the pre-policy allowlist below.
#
# Why grandfathering: the pilot corpus (68 extracts) was migrated from
# DRAFT acquisition blocks, not from OCR/source page review. Instantly
# requiring OCR-verified samples would invalidate a green corpus without
# improving evidence quality. New / OCR-produced extracts (t-509) are not
# exempt.
#
# SHRINK-ONLY: closed_set_source_ids is frozen at policy adoption (hash
# pinned in tests/test_literature_extracts.py). active_pre_policy_source_ids
# must always be a subset of closed_set_source_ids. Removals from active
# are allowed (and expected) when an extract gains reviewer-verified
# samples and graduates — move the id into graduated_pre_policy_source_ids
# (append-only tombstones), and append the same id to the independent canonical
# history in _fidelity_graduation_ledger.yaml. The closed set is partitioned:
#   active ∪ graduated = closed,  active ∩ graduated = ∅
# Re-adding any id in current or committed canonical graduation history to
# active is refused, even if both current ledger and policy tombstone are
# deleted in the same change. Additions to closed are refused.

schema_version: literature_extract_fidelity_policy.v1
policy: ENFORCED_FOR_NEW
effective_date: "2026-08-03"
rationale: >
  Pilot extracts migrated from DRAFT blocks (vp-acquire-5/-6, CEA sweep)
  pre-date the reviewer-verified fidelity-sample requirement. New extracts
  produced by the t-509 OCR campaign must carry fidelity_samples from day one.

