    quantity: printed_figure_trends
    rows_as_printed:
    - {figure: 3, trend: 'Atmospheric coupling raises surface temperature and delays the totally molten and partially molten stages; condensation of vapor water occurs at the mush-stage transition.'}
    - {figure: 4, trend: 'Magma-ocean duration varies with initial H2O and CO2 inventories; H2O produces the stronger sensitivity.'}
    - {figure: 5, trend: 'Partial pressures of uncondensed H2O and CO2 evolve over time; CO2 is exsolved early and 99% is exsolved within a few hundred thousand years.'}
    - {figure: 7, trend: 'Liquidus/solidus profile choice changes melt-fraction and partial-pressure evolution and the magma-ocean duration.'}
    - {figure: 10, trend: 'Planetary distance changes surface temperature and magma-ocean duration; the delay is approximately 1 Myr for Earth and 10 Myr at Venus distance.'}
    - {figure: 12, trend: 'Planet radius and gravity alter solidification timing; Mars reaches the end of the magma-ocean phase sooner than Earth or Venus.'}
