  measurement_claim: No new instrument measurements are reported. The paper presents a 1-D parameterized magma-ocean convection model coupled to a 1-D radiative-convective atmosphere model; experimental and laboratory values cited in the paper are attributed to prior sources and are not extracted as measurements of this paper.
  model_generator: Lebrun et al. parameterized convection and volatile-coupling model, coupled to Marcq (2012) radiative-convective atmosphere model; equations use cited parameterizations and tabulated literature inputs.
