    pages; pdftotext -layout is empty (9 bytes) and is not data. Tables 1–4, the unnumbered O2-fraction
    and metal-yield tables, and the Experiments section transcribed from 400 dpi pdftoppm PNG renders
    of PDF pages 4–7 (published pp. 126–129). MinerU used only as a page map and rejected as a data source.
