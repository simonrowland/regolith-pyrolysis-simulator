extraction:
  method: Born-digital source transcribed from pdftotext-layout.txt. The table draft tool accepts MinerU content-list
    tables and does not emit a mapping from this pdftotext-only source; Table 3 was parsed from machine text and
    its row/column assignments were checked against 600 dpi renders of physical PDF pages 8–9. Table 7–10 grid assignments
    were checked against 600 dpi renders of physical PDF pages 19, 21, 22, and 25; the remaining table page transcriptions
    preserve the machine text without re-keying cells. Figures 1–10 are recorded with no numeric points under the
    figure-deferred rule.
  date: '2026-10-20'
