notes:
- The paper reports in-situ Mars Exploration Rover Opportunity (MER-B) MIMOS II Mössbauer observations. Table 3
  has 94 target rows; the target name and full location block are retained because some printed sample IDs recur.
- The paper reports 95 analyzed targets in its text; Table 3 contains 94 rows. B033RR0 is listed in Table 1 but
  has no Table 3 area row, so no 95th area record is inferred.
- For Table 3 derived Fe3+/FeT values, the required corpus table asset is absent from the indexed corpus. Values
  and all inputs are retained in context and in the untracked follow-up CSV; follow-up derived rows are pending
  controller seating of that asset.
- The table draft tool could not emit a mapping because this paper has no MinerU table source; there is no second
  table implementation to commit.
