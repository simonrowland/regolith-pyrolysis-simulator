        temperature_as_printed: MIMOS II in-situ spectra for Meridiani Planum target rocks and soils; target-specific
          temperature windows are printed in the panels.
        axes_as_printed: Velocity (mm/s) versus TC/BC − 1.0; caption defines TC as total counts and BC as baseline
          counts.
        caption: Figure 1. Representative Mössbauer spectra from Meridiani Planum. Spectra are the sum over all
          temperature windows within the indicated temperature ranges. The computed fit and component subspectra
          (Lorentzian line shapes) from least squares analyses are shown by the solid red line and the solid shapes,
          respectively. (a) Full and (b) reduced velocity MB spectra for interior Burns outcrop exposed by RAT grinding
          show that hematite, jarosite, and Fe3D3 (unidentified Fe3+ phase) are the major Fe-bearing phases. (c)
          MB spectrum for a rind or crust of outcrop material that has an increased contribution of hematite relative
          to jarosite plus Fe3D3. (d and e) MB spectra of two MoessBerry Subclass soils that have high concentrations
          of hematite. The spectrum in Figure 1e is typical for hematite lag deposits at ripple crests. (f) The
          MB spectrum of a Nougat Subclass soil is transitional between MoessBerry Subclass soil and Laguna Class
          soil. Example MB spectra of the (g) Panda and (h) Gobi Subclasses of Laguna Class soil are basaltic in
          nature and have olivine, pyroxene, and npOx as their major Fe-bearing phases. MontBlanc_LesHauches is
          considered to be enriched in Martian dust. MB spectra in Figures 1i–1k are for three single-occurrence
          rocks. (i) BounceRock is monomineralic pyroxene with respect to Fe-bearing phases. (j) Barberton contains
          metallic iron, and (k) Heat Shield Rock is nearly monomineralic kamacite (Fe-Ni metal alloy with ~5% Ni).
          TC, total counts; BC, baseline counts.
