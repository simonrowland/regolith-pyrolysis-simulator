    named_failure:
      observation_id: stolyarova_1991_sio2_activity_eq8_1933k
      reason: Eq. [8]* is a Belton-Fruehan integral of the measured ion-current ratio and has no printed ±; tested at
        the paper's 15% bound it gives z = 2.98 on {0.33, 0.25}. It is the one series allowed to fail, and it is named.
  caption_notes:
  - table: Ia
    note: Table Ia is captioned 1993 K as printed, while the abstract states the measurements were at 1933 K, and Table IIa
      (captioned 1933 K) reproduces the Table Ia P_CaO ratios to 0.01 dex (regolith-empirical t-1123 proposal pre-check,
      not printed). The caption is left as printed (regolith-main t-1123 Q5).
      A misprint ruling needs internal evidence (text, another table, or the experimental section stating 1933 K for this
      series), not a temperature difference by itself.
    locator: {page: 3711, published_page: 3711, pdf_page_index: 2, table: Ia, note: 'Caption: "... CaO-SiO2 system at 1993 K obtained by the complete evaporation method (1) and the ion comparison method (2)." Abstract, p. 3710: "... 0.1-0.5 mole fraction of SiO2 at 1933 K."'}
