phase_field_records:
  # t-1123a (regolith-main ruling 2026-10-06 + regolith-physics confirmation). Printed facts read by the
  # general two-test rule in simulator/battery/phase_field.py. Only the outside_side reading is not printed.
  liquidus:
  - id: stolyarova-1991-cao-sio2-lime-side-liquidus
    system: CaO-SiO2
    component: SiO2
    amount_basis: mole_fraction
    position_as_printed: 0.37 ± 0.02
    position: '0.37'
    sigma: '0.02'
    temperature_K_as_captioned: 1933.0
    superseded_positions: ['0.41']
    superseded_as_printed: earlier mentioned 0.41 mole fraction of SiO2 (30)
    outside_side: below
    outside_side_basis: Reading, not printed. The paper prints no per-row phase. On the CaO-SiO2 diagram the single-liquid
      field is the SiO2-rich side of this liquidus point; compositions below it (lime side) are outside the single-liquid
      field. Adopted by regolith-main (t-1123 Q1) and confirmed by regolith-physics, 2026-10-06.
    text_as_printed: The congruent character of vaporization processes in the range from 0.01 to 0.37 ± 0.02 mole fractions
      of SiO2 was shown on the basis of analysis of the dependencies of the CaO, Ca, and SiO evaporation isotherms, Fig. 1.
      Owing to this observation, we concluded that the liquidus point on the phase diagram may be corrected compared with
      the earlier mentioned 0.41 mole fraction of SiO2 (30).
    locator: {page: 3711, published_page: 3711, pdf_page_index: 2, section: Results, note: 'Right column, last paragraph of Results; its Fig. 1 is captioned 1933 K. Ref. (30) is the earlier phase diagram. The sentence itself prints no temperature.'}
  plateaus:
  - id: stolyarova-1991-table-ia-1993k-lime-plateau
    temperature_K_as_captioned: 1993.0
    composition_field: SiO2_mole_fraction_as_printed
    compositions: ['0.33', '0.25']
    locator: {page: 3711, published_page: 3711, pdf_page_index: 2, table: Ia}
    series:
