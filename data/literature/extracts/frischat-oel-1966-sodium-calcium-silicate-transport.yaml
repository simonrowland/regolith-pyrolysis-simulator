typed_absence_notes:
  - >-
    Table 2 contains 12 printed body rows, 18 printed temperature cells, and 30
    printed D cells: 48 printed numeric cells. Glass rows 3, 7, and 11 have
    blank temperature cells; they carry forward the preceding 305, 435, and
    575 °C group temperatures as three inherited values. The populated grid has
    21 temperature entries and 30 D entries: 51 populated numeric entries. The
    18 blank D cells and the three blank Polykristall temperature cells for rows
    10-12 are represented in typed_absences; none is zero or imputed.
  - >-
    Glass samples were rapidly cooled and some remained without crystallizing
    (page 2). The source gives no fO2 or experimental total pressure for Table 2;
    3750 atm is only the pressure used to press powder tablets during preparation.
