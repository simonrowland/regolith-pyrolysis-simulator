source_id: koehler-barany-kelley-1961-ri5711-ferrite-aluminate-formation
source:
  citation: >-
    Koehler, M. F., Barany, R., and Kelley, K. K. (1961). Heats and free
    energies of formation of ferrites and aluminates of calcium, magnesium,
    sodium, and lithium. U.S. Bureau of Mines Report of Investigations 5711.
  year: 1961
  corpus_asset: raw/koehler-barany-kelley-1961-ri5711-ferrite-aluminate-formation/koehler-barany-kelley-1961-ri5711-ferrite-aluminate-formation.pdf
extraction:
  method: >-
    Transcribed from the MinerU content-list tables and markdown, then
    reconciled with pdftotext-layout.txt. Numeric and layout mismatches in the
    target tables were checked against 300-dpi page renders. Absolute PDF page
    numbers are used in locators; printed report pages are recorded separately.
  date: '2026-11-05'
  worker: w1105fe-ri5711
  provenance_path: text/koehler-barany-kelley-1961-ri5711-ferrite-aluminate-formation/pdftotext-layout.txt
  source_note: >-
    Scope is NaFeO2, CaFe2O4, and Ca2Fe2O5. Table 7 reports the authors'
    298.15 K heats of formation from oxides and elements in cal/mol; Table 8
    quotes entropies from Kelley and King (1961) in cal/(deg mol). Tables 9,
    10, and 12 report oxide-reference ΔH and ΔF° values in kcal/mol; Tables
    20, 21, and 23 report element-reference values in kcal/mol. Values and
    units are retained as printed. The authors state that high-temperature
    heat-content data were taken from Kelley (1960), and that space did not
    permit retabulation; no Cp equation or H(T)-H(298) rows for the target
    ferrites are printed in this report. No fusion enthalpy or incongruent
    melting statement for the target ferrites was found. Table captions label
    products c or c,l; table rows at transition and melting temperatures are
    retained with their printed row labels and footnote markers. Experiment
    pressure is not stated for these thermochemical values.
