  source_note: 'Heat capacities and heat-content increments remain in printed calorie
    units (cal/mol/K and cal/mol). Table 26 separates the present measurements from
    W. P. White comparison values. Tables 9, 15, 17, 19 and 20 are the authors’ composition-corrected
    measurements with raw_inputs: not_printed; smooth Cp tables 10, 16, 18 and 21
    are measured_reduced from their stored parents. Table 25 stores absolute S°298.16
    plus its printed extrapolated and measured components; the component columns and
    high-temperature S_T−S_298.16 columns remain descriptive quantity-unknown values.
    No table of this report gives heats of formation or solution for a named mineral.
    The paper defines 1 cal. = 4.1833 international joules; values remain in printed
    calories. Reaction ΔH and ΔF tables 34, 36, and 37 are retained as unscored context
    because the closed observation schema has no reaction-level type; no value is
    assigned to one mineral.'
