    ferry pdfs-l3-l5/kems-087-yamada-kato-1980.pdf). English Transactions ISIJ version. pdftotext -layout
    is a noisy OCR layer and is not data. No numeric per-heat activity/composition table is printed.
    epsilon_P^P = 7.3 +/- 0.1, e_P^P = 0.054, sample mass, orifice range, 22 eV, and the Fig. 9 average
    812.7 transcribed from 400 dpi pdftoppm renders of PDF pages 1-7 (published pp. 244-250). Figs 1-10
