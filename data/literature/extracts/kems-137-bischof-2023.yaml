source:
  citation: Bischof, L., Sossi, P. A., Sergeev, D., Müller, M. & Schmidt, M. W. (2023), "Determination
    of activities and condensation temperatures of GaO1.5 and InO1.5 in anorthite-diopside eutectic melts
    by Knudsen Effusion Mass Spectrometry", Geochim. Cosmochim. Acta 360:1-15, DOI 10.1016/j.gca.2023.08.027
  doi: 10.1016/j.gca.2023.08.027
  url: https://doi.org/10.1016/j.gca.2023.08.027
  year: 2023
  version: accepted_manuscript_plus_published_supplement
extraction:
  method: Official Elsevier CDN accepted manuscript (am.pdf) + CC-BY supplement mmc1.pdf; pdftotext -layout
    of both. VoR typeset PDF blocked (ScienceDirect Cloudflare 403; ars.els-cdn main.pdf 400). Tables
    transcribed from AM/supplement text layer. Figures listed figure-only, not digitised. Measured p(i)
    vs derived gamma vs FactSage T50c / Henrian A,B kept distinct. Round 2 preferred-gamma locators on AM
    page 23 (not Table 8 page 22); T50c retyped transition_point (FactSage model, not gamma); Henrian A,B
    retyped gibbs_table; mmc1 filed beside AM. Round 3 harvested printed KEMS laboratory parameters from
    AM §2.1–2.2.1, Table 2 and eqs. 2–3 (AM p. 8); supplement has no apparatus section. Orifice area not
    invented from the printed 0.4 mm diameter; chamber pressure kept as the printed nominal ~10^-6 mbar.
