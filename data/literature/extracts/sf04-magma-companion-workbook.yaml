schema_version: literature_extract.v1
source_id: sf04-magma-companion-workbook
source:
  citation: >-
    Schaefer, L. & Fegley, B. (2004), "A thermodynamic model of high
    temperature lava vaporization on Io", Icarus 169:216-241; numerical
    MAGMA grid preserved in the VapoRock Schaefer2004-MAGMA-valid.xlsx
    companion workbook.
  doi: 10.1016/j.icarus.2003.08.023
  year: 2004
  version: Schaefer2004-MAGMA-valid.xlsx sheet tho
  source_workbook_sha256: ebe0f4daca57926e9347de09edef2167c94cb8b70f85c13572d3cda26c7f0e0f
  checked_in_fixture_sha256: e792f4c12a2f29778d3dc13185364022803c2b1f7bf6c469467635bab5791cbe
extraction:
  method: >-
    Reviewed transcription of the checked-in openpyxl data-only workbook
    fixture. The paper supplies the Table 5 composition and Fig. 10a graphical
    locator; it does not print these numerical high-temperature species rows.
  date: '2026-09-01'
  worker: vr13-b-calibration
  provenance_path: tests/fixtures/imcc_sf04_magma_workbook.csv
review_status: reviewed
coverage:
  composition: tholeiite
  calculation_range_stated_in_paper_K: [1700.0, 3000.0]
  figure_range_K: [1700.0, 2400.0]
  companion_workbook_grid_range_K: [1500.0, 2500.0]
  extracted_range_K: [1750.0, 2500.0]
  limitation: >-
    SF04 prints no numerical 1700-3000 K species-pressure table. These are
    model-model companion-workbook anchors, not independent measurements.
    Values above 2400 K are outside the plotted range, and 2500 K is the last
    preserved workbook row.
composition_wt_pct:
  SiO2: 50.71
  MgO: 4.68
  Al2O3: 14.48
  TiO2: 1.70
  Fe2O3: 4.89
  FeO: 9.07
  CaO: 8.83
  Na2O: 3.16
  K2O: 0.77
  MnO: 0.22
  H2O: 1.04
  P2O5: 0.36
experiments:
- experiment_id: sf04-tholeiite-workbook-grid
  method: engine_evaluation
  locator:
    published_page: 227
    pdf_page_index: 12
    figure: 10a
    record: tests/fixtures/imcc_sf04_magma_workbook.csv sheet=tho
    note: Shared tholeiite input and extracted workbook temperature grid; species pressures below are outputs, not chamber pressure.
  sample:
    printed_composition:
      state:
        tag: value
        value: {SiO2: 50.71, MgO: 4.68, Al2O3: 14.48, TiO2: 1.70, Fe2O3: 4.89, FeO: 9.07, CaO: 8.83, Na2O: 3.16, K2O: 0.77, MnO: 0.22, H2O: 1.04, P2O5: 0.36}
      locator:
        published_page: 227
        table: '5'
        note: Tholeiite composition supplied by the paper and reused by the companion workbook.
    initial_composition:
      state:
        tag: value
        value:
          basis: printed_oxides
          amount_basis: mole_fraction
          components:
          - [SiO2, '0.561712451127652']
          - [MgO, '0.0772804695853422']
          - [Al2O3, '0.0945171149074712']
          - [TiO2, '0.0141665622663591']
          - [Fe2O3, '0.0203803363216040']
          - [FeO, '0.0840211907933131']
          - [CaO, '0.104796790278981']
          - [Na2O, '0.0339326517983188']
          - [K2O, '0.00544041660906938']
          - [MnO, '0.00206405679436486']
          - [P2O5, '0.00168795951752513']
      locator:
        published_page: 227
        table: '5'
        note: Derived from the printed oxide wt% recipe; H2O and non-oxide total are retained in printed_composition but omitted from the engine oxide vector.
      method_class: calculated
      inference:
        relation: wt_pct_to_mole_fraction
        inputs:
        - Printed Table 5 oxide mass percentages above.
        - mole_i = wt_pct_i / M_i; x_i = mole_i / sum(mole_j) over supported oxide components.
        output_unit: mole_fraction
  conditions:
    temperature_K:
      state: {tag: unknown, reason: not_published}
      locator:
        record: tests/fixtures/imcc_sf04_magma_workbook.csv sheet=tho
        note: Extracted workbook grid is a range, not a single scalar setpoint; typed interval is retained in thermal_schedule.setpoints_and_holds.
  pressure_environment:
    total_pressure_Pa:
      state: {tag: unknown, reason: not_published}
      locator:
        published_page: 227
        figure: 10a
        note: Workbook values are species partial-pressure outputs; chamber total pressure is not printed.
    sweep_gas:
      state: {tag: unknown, reason: not_published}
      locator:
        published_page: 227
        figure: 10a
        note: No sweep-gas configuration is printed for this companion model grid.
    regime:
      regime_class: {tag: unknown, reason: not_published}
  thermal_schedule:
    setpoints_and_holds:
    - temperature_K:
        state: {tag: value, value: {kind: interval, interval_low: '1750.0', interval_high: '2500.0'}}
        locator:
          record: tests/fixtures/imcc_sf04_magma_workbook.csv sheet=tho
          note: Extracted workbook grid range; interval retained rather than inventing a single setpoint.
