source_id: jin-2022-cl-cr-sulfur-glass-solubility
source:
  citation: "Jin T, Rivers EL, Kim D, Droubay TC, Jahrman EP, Mar D, Weese BL, Seidler GT, Kruger AA (2022; online 2021). Effect of chlorine and chromium on sulfur solubility in low-activity waste glass. International Journal of Applied Glass Science 13(1):82-93."
  doi: 10.1111/ijag.16540
  year: 2022
  corpus_asset: raw/jin-2022-cl-cr-sulfur-glass-solubility/jin-2022-cl-cr-sulfur-glass-solubility.pdf
extraction:
  method: >-
    PDF is born-digital; pdftotext-layout is the primary read. MinerU produced no table blocks, so Tables 1-4 were transcribed from the text layer; Tables 1, 2, and 4 were checked against 600 dpi renders (PDF pages 14-16). The controller ruled that this base has no composition-vector quantity: the full Table 2 glass analyses are context, not split into species concentration observations. The salt-saturated glasses were melted at 1150 °C for one hour and water-quenched; Table 4's measured Cr(VI)/Cr(total) values are typed as fractions from the printed percentages. No figures were digitised.
  table_dispositions:
    table_1: context-quoted; target glass compositions, not measurements in this work
    table_2: context-no-token; candidate equilibrium_phase_composition and liquidus_composition; schema gap for glass composition vectors
    table_3: context-no-token; aqueous wash-solution analyses, not an equilibrium glass composition
    table_4: typed; measured Cr(VI)/Cr(total) fractions
  date: '2026-10-20'
  worker: fam31-1020
review_status: draft
