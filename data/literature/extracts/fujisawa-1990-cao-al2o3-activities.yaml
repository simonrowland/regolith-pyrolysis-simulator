      - observation_id: fujisawa_1990_gibbs_duhem_integration
        type: method
        locator: {page: 4, published_page: 371, equation: '13-17', section: '4.3 Activities of CaO and Al2O3'}
        units: as printed
        values:
          gibbs_duhem_CaS_saturated: 'N_Al2O3 d ln(a_Al2O3) + N_CaO d ln(a_CaO) = 0; the CaS term vanishes because a_CaS = 1.'
          differentiated_equilibrium: 'd ln(a_Al2O3) = 3 d ln(a_CaO) + d ln(h_Al^2 h_S^3), at fixed temperature.'
          integrate_CaO: 'ln(a_CaO) = - integral [1/(3 + N_CaO/N_Al2O3)] d ln(h_Al^2 h_S^3), along the CaS-saturated liquid composition path; start at the CaO-saturated liquid boundary where a_CaO = 1.'
          integrate_Al2O3: 'ln(a_Al2O3) = integral [1/(3(N_Al2O3/N_CaO) + 1)] d ln(h_Al^2 h_S^3), along the CaS-saturated liquid composition path; start at Al2O3 + CA6 coexistence where a_Al2O3 = 1.'
          phase_boundary_sources:
            oxide_binary_phase_diagram: 'R. W. Nurse, J. H. Welch, and A. J. Majumdar, Trans. Brit. Ceram. Soc., 64 (1965), 409 (reference 7).'
            cao_saturated_liquid_boundary: 'B. Ozturk and E. T. Turkdogan, Met. Sci., 18 (1984), 299 (reference 6), plus the present CaS-solubility measurements.'
          cas_solubility_at_CA_liquidus_mass_percent: 2
          cas_solubility_qualifier: 'Approximately 2 mass percent at the CaO·Al2O3 (CA) liquidus, as cited from reference 6.'
