            CA6: 'CaO(s) + 6Al2O3(s) = CaO·6Al2O3(s); log K_CA6 = -log a_CaO - 6 log a_Al2O3.'
          compound_formation_standard_states: 'Pure solid CaO(s), pure solid Al2O3(s), and the named solid calcium-aluminate compound.'
          measured_reaction_free_energy_27_kJ_mol: -338
          measured_reaction_free_energy_uncertainty_kJ_mol: 19
          measured_reaction_free_energy_note: 'Authors calculate the mean from reaction equilibria at their measurement points.'
          reaction_free_energy_expressions:
            equation_28: 'CaO(s) = Ca(g) + 1/2 O2(g); ΔG° = 795378 - 195.06 T J/mol.'
            equation_29: 'CaS(s) = Ca(g) + 1/2 S2(g); ΔG° = 704397 - 191.29 T J/mol.'
            equation_30: 'Al2O3(s) = 2Al(l) + 3/2 O2(g); ΔG° = 1697700 + 15.69 T log T - 385.85 T J/mol.'
            equation_31: 'Al(l) = [Al]; ΔG° = -71100 - 19.4 T J/mol.'
