schema_version: literature_extract.v1
source_id: vickerfalt-2024-al-si-v-phase-diagram
source:
  citation: Vickerfält A, Huss J, Martinsson J, Sichen D (2024). The Al2O3-SiO2-‘V2O3’ phase diagram at 1873 K.
    Calphad 87, 102771.
  doi: 10.1016/j.calphad.2024.102771
  url: https://doi.org/10.1016/j.calphad.2024.102771
  year: 2024
  provenance_path: raw/vickerfalt-2024-al-si-v-phase-diagram/vickerfalt-2024-al-si-v-phase-diagram.pdf
  note: Table 1 reports averaged WDS phase compositions from three analysis points; Table 2 prints the three mullite
    analyses and means for samples 7 and 8. Vanadium valence was not determined.
extraction:
  method: manual_from_pdftotext_layout_and_600dpi_render_checks
  date: '2026-10-22'
  worker: codex-fam46-1022
  note: Table 1's 13 liquid phase vectors are typed as one d-223 scalar row per oxide component. All measured solid
    phase compositions are retained in table context because d-223 has no solid PhaseRole. Table 2 replicate values
    and the repeated Table 1 means are retained in context. Figures 1-6 are deferred.
