        sentence_as_published: >-
          With an increase in temperature, the position of the minimum mixing energy
          in the melt is maintained with an increase in the ΔGm value to –33 kJ/mol
          at 1873 K (Fig. 3).
        reference_phase: >-
          Mixing energy in the melt. The reference phase is not stated.
