extraction:
  method: >-
    The PDF is a journal excerpt. This extract is only the SiO2–P4O10 article on
    published pages 57–60 (PDF pages 3–6). The CaO–P4O10 ending on published page 57
    and the MgO–P4O10 opening on published page 60 are excluded. No numeric table is
    printed. Figures were inspected at 600 dpi. Calculated curves have no discrete
    markers of this study, so no coordinates were read. Cited experimental symbols
    were not read.
