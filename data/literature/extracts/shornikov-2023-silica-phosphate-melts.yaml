      values:
        admission_status: refused
        reason: >-
          Fig. 2 curves 3 and 4 and Fig. 3B curves 5 and 6 are mixing energies.
          Curves 3 and 5 are calculated in this study and have no discrete markers.
          Curves 4 and 6 are Rahman et al. (2013). Fig. 2 prints lg a and a ΔG/RT
          quantity on one axis, so a kJ/mol reading of curve 3 would not be the
          printed scale. The prose minima are the stored numbers.
