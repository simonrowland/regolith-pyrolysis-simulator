experiments:
  - experiment_id: shornikov-2023-sio2-model
    kind: thermodynamic_model
    locator: {page: 4, pdf_page_index: 3, published_page: 58, section: Abstract}
    method: >-
      Semi-empirical model, 700–2000 K, described in Shornikov (2019). Oxide
      activities, mixing energies and partial pressures are calculated. Parents
      are the cited ΔG° compilations, not printed per point.
  - experiment_id: shornikov-2023-sio2-cited-points
    kind: literature
    locator: {page: 6, pdf_page_index: 5, published_page: 60, figure: '5'}
    method: >-
      Symbols on Figs. 4 and 5 are Lopatin and Semenov (1995), Shornikov et al.
      (1996) and Stolyarova et al. (1990). Rahman et al. (2013) is a compared
      calculation. They are not measurements of this article.
