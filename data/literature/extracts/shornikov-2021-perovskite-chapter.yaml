    - observation_id: activity_definitions
      type: thermodynamic_example
      locator:
        published_page: 122
        pdf_page_index: 11
        section: The thermodynamic properties of perovskite melts
        equations: 5–8
      units: as printed
      values:
        quantity: oxide activities
        method_class: quoted_attributed
        attribution: Shornikov [64], using Lewis [65], Belton–Fruehan [66] and Gibbs–Duhem [67].
        activity_definitions:
        - oxide: CaO
          relation: Lewis equation ai=pi/pi°; pure individual oxide vapor pressure divided into melt vapor pressure.
          defining_ion: The Lewis ratio is pressure-based; equation (7) gives the TiO2/CaO activity ratio from ICa/ITiO.
          standard_state: Pure individual oxide vapor-pressure reference; whether condensed oxide is solid or liquid is unspecified.
        - oxide: TiO2
          relation: Lewis equation ai=pi/pi°; activity also by the Belton–Fruehan integration (6) and equation (7).
          defining_ion: Ca+ and TiO+ current ratio in equation (7).
          standard_state: Pure individual oxide vapor-pressure reference; whether condensed oxide is solid or liquid is unspecified.
