        - {equation: 44, relation: 'p_O=\frac{p_{MoO_3}}{p_{MoO_2}}K_{36}(T)'}
        - {equation: 45, relation: '\lg p_i=a_i/T+b_i'}
        - {equation: 46, relation: 'R\ln K_r(T)=-\frac{\Delta_r G_T}{T}=-\frac{\Delta_r H_T}{T}+\Delta_r S_T'}
        transcription_note: 'Equation (43) prints a squared pO2 numerator under the square root; retained without correcting a possible print error. No ai or bi fitted coefficients are printed for equation (45).'
    - observation_id: additional_printed_numeric_and_method_context
      type: thermodynamic_example
      locator: {published_page: '115–129', pdf_page_index: '4–18', section: 'Located printed statements'}
      units: as printed
      values:
        method_class: quoted_attributed
        attribution: 'Shornikov (2021), with the original cited studies named in each located fact.'
        facts:
        - locator: {published_page: 115, pdf_page_index: 4, section: Introduction}
          statement_as_printed: 'The other calcium titanates, Ca4TiO6 [8], Ca3TiO5 [9], Ca8Ti3O14 [8, 10], Ca2TiO4 [9], Ca5Ti4O13 [11], Ca2Ti3O8 [6], CaTi2O5 [12, 13], CaTi3O7 [14], Ca2Ti5O12 [15], and CaTi4O9 [16], are mentioned in the literature. They also seem to be unstable, which does not exclude their possible existence [17].'
        - locator: {published_page: 117, pdf_page_index: 6, section: Structural transitions}
          statement_as_printed: 'However, based on diffraction data about the perovskite structure obtained in the temperature range of 296–1720 K, Yashima and Ali [31] concluded that the Cmcm phase does not exist and claimed that the first transition is the (Pbnm) → (I4/mcm) at 1512 ± 13 K, followed by the (I4/mcm) → (Pm3m) transition at 1635 ± 2 K.'
        - locator: {published_page: 117, pdf_page_index: 6, section: Formation enthalpy}
          statement_as_printed: 'Although the obtained value was determined with poor accuracy due to the difficulty of determining the amounts of substances in the reaction products (1), it corresponded satisfactorily to the more accurate results of Kelley et al. [33], who determined this value according to the reaction:'
        - locator: {published_page: 118, pdf_page_index: 7, section: Calorimetry}
          statement_as_printed: 'Navrotsky et al. [19, 26, 34, 37–43] performed a number of studies by various calorimetric methods, using adiabatic calorimetry [26] and solution calorimetry in the (Li, Na)BO2 [41], Pb2B2O5 [37, 42, 43], and Na6Mo4O15 [19, 34, 38–40] salts in the temperature range 973–1074 K.'
        - locator: {published_page: 118, pdf_page_index: 7, section: Calorimetry}
          statement_as_printed: 'The ΔH1078(CaTiO3) value determined by Koito et al. [44] by similar method (solution calorimetry in Pb2B2O5 salt) is less accurate but close to the results obtained by Navrotsky et al. [19, 34, 37–43].'
        - locator: {published_page: 118, pdf_page_index: 7, section: EMF studies}
          statement_as_printed: 'A mixture of FeO and Fe (or NbO and Nb) was used as the reference electrode, and a mixture of La2O3-ThO2 crystals was used as the solid electrolyte.'
          attribution: 'Golubenko and Rezukhina [45]'
        - locator: {published_page: 118, pdf_page_index: 7, section: EMF studies}
          statement_as_printed: 'Rezukhina et al. [35] later made more precise measurements of ΔGT(CaTiO3) in the temperature range of 888–972 K, inside a galvanic cell with CaF2 as the electrolyte (Figure 3).'
        - locator: {published_page: 118, pdf_page_index: 7, section: EMF studies}
          statement_as_printed: 'Taylor and Schmalzried [51] (at 873 K) and Jacob and Abraham [36] (at 900–1250 K) also determined the perovskite Gibbs energy via EMF using the same solid electrolyte.'
        - locator: {published_page: 119, pdf_page_index: 8, section: Oxide activities}
          statement_as_printed: 'Banon et al. [52] (at 2150 K) and Shornikov et al. [48, 53, 56] (at 1791–2398 K) determined the values of CaO and TiO2 activities (Figure 4) and ΔGT(CaTiO3) via Knudsen effusion mass spectrometric method.'
        - locator: {published_page: 121, pdf_page_index: 10, section: Melting of perovskite}
          statement_as_printed: 'The enthalpy of perovskite melting estimated using Walden’s empirical rule [62] is also close to the result obtained by Shornikov [48]: ΔHmelt = 8.8 [J/(g-at K)] Tmelt = 49.39 kJ/mol.'
        - locator: {published_page: 121, pdf_page_index: 10, section: Perovskite melts}
          statement_as_printed: 'Based on the partial vapor pressures (Ca), (TiO), and (TiO2) over melts at 2150 K, the authors calculated the Ti, TiO, Ti2O3, TiO2, and CaTiO3 activities, as well as mixing energies in the melts.'
          attribution: 'Banon et al. [52]'
          activity_standard_states: {state: {tag: unknown, reason: not_published}, note: 'The chapter does not specify the reference phases or standard states for these five activities.'}
        - locator: {published_page: 121, pdf_page_index: 10, section: Perovskite melts}
          statement_as_printed: 'In the case of the CaTiO3-TiO2 melts, the TiO2 and CaTiO3 activities were calculated by extrapolation from the data relating to the CaTiO3-Ti2O3-TiO2 system and thus had, according to the authors themselves, low accuracy, which apparently was caused by inconsistency with different versions of the CaO-TiO2 phase diagram [7, 9, 11, 18]. Nevertheless Banon et al. [52], interpreting the obtained high values of TiO2 activities in the region close to titanium dioxide (Figure 5), assumed the presence of immiscibility of the CaO-TiO2 melts in this region.'
        - locator: {published_page: '121–122', pdf_page_index: '10–11', section: Perovskite melts}
          statement_as_printed: 'As it is shown in Figure 5, one of the two studied compositions of the CaO-TiO2 system at 2057 K was in the “CaO + liquid” region, and thus its value should be close to 1. The second composition was in the region of “Ca4Ti3O10 + liquid” according to the information presented in [7, 18], or in the region of “Ca3Ti2O7 + liquid”, as follows from the data presented by Tulgar [11]. However, the calculated values are quite close (Figure 5), which contradicts the CaO-TiO2 phase diagram (Figure 1). A possible reason for the discrepancies seems to be a significant error in the measurements of CaO activities in the melt, which may be, in our opinion, more than 50%.'
          attribution: 'Stolyarova et al. [63] results; chapter author’s expectation and possible-error assessment, not measured activity 1 or a measured uncertainty.'
        - locator: {published_page: 123, pdf_page_index: 12, section: Perovskite melts}
          statement_as_printed: 'The results presented by Banon et al. [52] correlate with the data found in [64]. Some difference in values, as mentioned above, is probably due to the procedures for extrapolating information obtained by Banon et al. [52] for compositions of the CaTiO3-Ti2O3-TiO2 triple system, which could reduce their accuracy. The observed behavior of TiO2 activity in melts in the concentration region close to rutile may indicate some immiscibility of the melt, which follows from the observed inflection of the concentration dependence (Figure 5, line 3). However, in our opinion, the behavior of TiO2 and CaTiO3 activities (Figure 5, lines 4 and 6) are close to the ideal.'
        - locator: {published_page: 124, pdf_page_index: 13, section: The gas phase over perovskite}
          statement_as_printed: 'Balducci et al. [72] detected (Ti2O3) and (Ti2O4) molecules in the gas phase over cobalt titanate CoTiO3 at 2210–2393 K by the Knudsen effusion mass spectrometric method, which can be involved in the following equilibria:'
        - locator: {published_page: 125, pdf_page_index: 14, section: The gas phase over perovskite}
          statement_as_printed: 'The partial pressures of the (Ca), (TiO), (TiO2), and (O) vapor over perovskite at 2150 K were calculated using the thermochemical data of [57] and are shown in Figure 7 as a function of the inverse temperature (for easily understanding, the temperature scale was scaled appropriately).'
          attribution: 'Banon et al. [52], as discussed by Shornikov'
        - locator: {published_page: 126, pdf_page_index: 15, section: Mass spectra}
          statement_as_printed: 'The TiO+ ion also contained a fragment component of the TiO2+ ion, and the Ti+ ion was completely fragmentary.'
          attribution: 'Lopatin and Semenov [84]; sentence begins on p. 125'
        - locator: {published_page: 127, pdf_page_index: 16, section: Mass spectra}
          statement_as_printed: 'It corresponded to that observed by Samoilova and Kazenas [78] in the same temperature range at evaporation of CaO from alundum cell and by Semenov [86] at evaporation of TiO2 from a tungsten cell.'
          note: 'Comparison refers to the preceding ion-current ratio for perovskite at 2182 K.'
        - locator: {published_page: 128, pdf_page_index: 17, section: Cell interaction}
          statement_as_printed: 'Note that Berkowitz et al. [81] found that during evaporation of titanium oxide from a molybdenum liner inserted into a tantalum crucible at 1881 K, pMoO2 was initially 10–10^2 times higher than pTiO2.'
        - locator: {published_page: 128, pdf_page_index: 17, section: Cell interaction}
          statement_as_printed: 'The high pMoO2 observed in [81] probably was due to poor quality of the molybdenum liner material (or its alloy). Possibly it was made using powder technology from MoO3 reduced to metal molybdenum at ~1300 K. It could lead to such an excess of partial pressure of (MoO3) and its decrease as it evaporates from the surface layers of the liner material.'
          note: 'Explicitly speculative liner-manufacturing explanation; not a measured sample-preparation fact.'
        - locator: {published_page: 128, pdf_page_index: 17, section: Mass spectra}
          statement_as_printed: 'The appearance energies of ions in the mass spectra of vapor over perovskite were determined by the Warren method [87] and corresponded to the accepted values of the ionization energies of atoms and molecules [88].'
        - locator: {published_page: 129, pdf_page_index: 18, section: Vapor-pressure comparisons}
          statement_as_printed: 'The partial pressures of the predominant vapor species of the gas phase over perovskite (Ca, TiO, TiO2 and O) are compared in Figure 7 with the results on evaporation of simple oxides (CaO and TiO2) under similar redox conditions caused by the interaction of oxygen with molybdenum [79, 81], tungsten [71], and tantalum [80] effusion cells or in chemically neutral conditions (in the absence of this interaction) for alundum cell [78].'
        - locator: {published_page: 129, pdf_page_index: 18, section: Vapor-pressure comparisons}
          statement_as_printed: 'We used the TiO and TiO2 activities as well as the Gibbs energy of perovskite obtained by Banon et al. [52] and thermochemical data [52] on equilibriums (17), (18), (23), and (24) to estimate the partial pressure of vapor species over the perovskite at 2150 K.'
