    - observation_id: qualifying_and_directional_statements
      type: thermodynamic_example
      locator:
        published_page: 115–132
        pdf_page_index: 4–21
        section: Introduction through Conclusions
      units: Verbatim English text
      values:
        quantity: qualifying, comparative and directional statements rechecked against page images
        method_class: quoted_unattributed
        claims:
        - quote: Calcium titanate (CaTiO3) or perovskite was found by Rose [1] in the Ural Mountains in 1839 and named after
            the Russian Statesman Count Lev Perovski.
          locator:
            published_page: 115
            pdf_page_index: 4
            section: Introduction
        - quote: In addition to perovskite, two more calcium titanates, Ca3Ti2O7 [6] and Ca4Ti3O10 [7], melting incongruently,
            were found in the CaO-TiO2 system.
          locator:
            published_page: 115
            pdf_page_index: 4
            section: Introduction
        - quote: They also seem to be unstable, which does not exclude their possible existence [17].
          locator:
            published_page: 115
            pdf_page_index: 4
            section: Introduction
        - quote: High-temperature heat capacity of perovskite Cp(CaTiO3) is reported over 15–398 K [26], 293–773 K [27], 376–1184
            K [28], 383–1794 K [29], and 413–1825 K [30].
          locator:
            published_page: 115
            pdf_page_index: 4
            section: Thermodynamic properties of perovskite solid phase
        - quote: 'Naylor and Cook [29] determined the enthalpy of perovskite phase transition: 2.30 ± 0.07 kJ/mol at 1530
            ± 1 K.'
          locator:
            published_page: 116
            pdf_page_index: 5
            figure: '2'
        - quote: The overlapping phase transitions in perovskite observed by Guyot et al. [30] were explained as consequences
            of a structural change, i.e., a transition from orthorhombic (Pbnm) to orthorhombic (Cmcm) structure at 1384 ±
            10 K and the overlapping of transitions from orthorhombic to tetragonal (I4/mcm) and tetragonal to cubic phase
            (Pm3m) at 1520 ± 10 K with heat effects of 1.0 ± 0.5 and 5.5 ± 0.5 kJ/mol, respectively.
          locator:
            published_page: 116
            pdf_page_index: 5
            figure: '2'
        - quote: At 1873 K, Suito et al. [54, 55] studied the equilibrium [Ti] + 2(O) = [TiO2] in CaO-TiOx (or CaO-TiOx-Al2O3)
            slags with liquid nickel relative to oxygen and nitrogen, depending on Ti (or Al) content in the metal. Crucibles
