schema_version: literature_extract.v1
source_id: evans-2009-sulfur-mn-ni-w-xanes
source:
  citation: 'Evans KA, O’Neill HStC, Mavrogenes JA, Keller NS, Jang LY, Lee JF (2009). XANES evidence for sulphur speciation in Mn-, Ni- and W-bearing silicate melts. Geochimica et Cosmochimica Acta 73(22), 6847–6867.'
  doi: 10.1016/j.gca.2009.08.013
  year: 2009
  corpus_asset: raw/evans-2009-sulfur-mn-ni-w-xanes/evans-2009-sulfur-mn-ni-w-xanes.pdf
extraction:
  method: >-
    Born-digital journal article; pdftotext-layout is primary and MinerU table draft found no table blocks. Tables 1, 2a, 2b, 2c, 3, 4, 5, and 6 were transcribed from text and checked against 600 dpi renders. Figures 1-11 are recorded with deferred digitisation and no numeric points. The paper reports proportions of S-XANES peak components, not oxidation-state fractions: it explicitly rejects a one-to-one mapping between components and sulphur species. The battery has no matching quantity for these peak proportions, for whole-glass composition vectors, or for the sulfur concentration data.
  table_dispositions:
    table_1: context-only; run conditions include printed fugacity logs, but there are no scored observations to attach them to
    table_2a: context-only; measured Mn-bearing whole-glass composition vectors have no matching store quantity
    table_2b: context-only; measured W-bearing whole-glass composition vectors have no matching store quantity
    table_2c: context-only; measured Ni-bearing whole-glass composition vectors have no matching store quantity
    table_3: context-only; fitted S-XANES peak proportions are not sulfur oxidation-state fractions, and no peak-proportion quantity exists
    table_4: context-only; correlation coefficients are derived statistics rather than measured quantities
    table_5: context-only; EXAFS coordination and bond-distance fit parameters have no matching quantity token
    table_6: context-only; Ni pre-edge energy offsets are structural/spectral descriptors without a matching quantity token
    redox: no numeric Mn, Ni, or W valence fractions are printed; metal oxidation states are interpreted qualitatively from XANES
    figures: eleven figure records are deferred without numeric points
  date: '2026-10-20'
  worker: fam31-1020
review_status: draft
