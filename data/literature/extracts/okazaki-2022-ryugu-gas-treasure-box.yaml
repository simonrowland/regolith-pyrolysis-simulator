schema_version: literature_extract.v1
source_id: okazaki-2022-ryugu-gas-treasure-box
source:
  citation: 'Okazaki, R., Miura, Y. N., Takano, Y., Sawada, H., Sakamoto, K., Yada, T., Yamada, K., Kawagucci, S., Matsui, Y., Hashizume, K., and others (2022), First asteroid gas sample delivered by the Hayabusa2 mission: A treasure box from Ryugu, Science Advances 8, eabo7239.'
  doi: 10.1126/sciadv.abo7239
  url: https://doi.org/10.1126/sciadv.abo7239
  year: 2022
extraction:
  method: Born-digital publisher PDF; transcribed from pdftotext -layout. Main article reports prose values and apparatus details; table S1 and table S2 are cited but not included in this 12-page PDF, so their unprinted cells were not reconstructed.
  date: '2026-09-19'
  worker: w3-okazaki-2022-ryugu-gas-treasure-box
