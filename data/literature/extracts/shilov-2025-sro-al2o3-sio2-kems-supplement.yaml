          and WO3+ ions are produced by ionization of the WO2 and WO3 vapor species, which are formed as a result
          of the interaction between the sample and material of the cell made from tungsten. At the higher temperature
          2105 K, tungsten oxides are unstable and were not observed in the mass spectra of vapor over sample N
          1. The ion current intensities of i-species are presented with the correction for the background signal
          and without corrections for the sensitivity coefficient of the secondary electron multiplier as well as
