              section: Support footnote
              note: "Top-left footnote marked by the asterisk after the conclusion on page 43."
          references_as_printed:
            - text: "1. Chamberlin, L., J. R. Beckett, E. Stolper (1995). Palladium oxide equilibration and the thermodynamic properties of MgAl2O4 spinel. Amer. Miner., vol. 80, no. 3–4, pp. 285–296."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 1, left column"}
            - text: "2. Fujii, K., T. Nagasaka, M. Hino (2000). Activities of the constituents in spinel solid solution and free energies of formation of MgO, MgO·Al2O3. JISJ Int., vol. 40, no. 11, pp. 1059–1066."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 2, left column"}
            - text: "3. Kalyanram, M. R. and H. B. Bell (1961). Activities in the system CaO–MgO–Al2O3. Trans. Brit. Ceram. Soc., vol. 60, no. 2, pp. 135–145."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 3, left column"}
            - text: "4. Rein, R. H. and J. Chipman (1965). Activities in the liquid solution SiO2–CaO–MgO–Al2O3 at 1600 °C. Trans. Met. Soc. AIME, vol. 233, no. 2, pp. 415–425."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 4, left column; 1600 °C belongs to the cited work, not this experiment"}
            - text: "5. Richet, P. (1993). Melting of forsterite and spinel with implications for the glass transition of Mg2SiO4 liquid. Geophys. Res. Lett., vol. 20, no. 16, pp. 1675–1678."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 5, left column"}
            - text: "6. Rutman, D. S., I. L. Schetnikova, T. S. Ignatova, E. I. Kelareva, L. V. Uzberg, G. A. Semenov (1969). The study of the evaporation process of refractory materials based on MgO and ZrO2. Trudy Vostochnogo instituta ogneuporov, no. 9, pp. 143–161 [in Russian]."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 6, left column"}
            - text: "7. Sasamoto, T., H. Hara, T. Sata (1981). Mass spectrometric study of the vaporization of magnesium oxide from magnesium aluminate spinel. Bull. Chem. Soc. Japan, vol. 54, no. 11, pp. 3327–3333."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 7, left column"}
            - text: "8. Shornikov, S. I. and I. Yu. Archakov (2001). High temperature mass spectrometric study of vaporization processes and thermodynamic properties in the MgAl2O4–SiO2 system. High Temperature Corrosion and Materials Chemistry III, vol. 2001–12, pp. 322–329."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 8, left column; vol. 2001–12 retained as printed"}
            - text: "9. Wark, D., and W. V. Boynton (2001). The formation of rims on calcium-aluminum-rich inclusions: Step I – Flash heating. Met. Planet. Sci., vol. 36, no. 8, p. 1135–1166."
              locator: {page: 44, published_page: 44, pdf_page_index: 2, section: References, note: "Reference 9, left column"}
          statements:
            - text: 'In the present study we have investigated the evaporation of a stoichiometric spinel from Knudsen effusion molybdenum cells, the gas phase composition over spinel was identified by mass spectrometric method in the temperature range 1850–2300 K.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Experimental description}
            - text: 'The ions, characteristic to the oxides of magnesium and aluminum, as well as the MgAlO complex gaseous oxide ion were detected in the mass spectra of vapor over spinel.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Experimental description}
            - text: 'The established molecular composition of the gas phase over spinel allowed to make the assumption that the spinel evaporation occurs mainly by heterogeneous reactions, typical for the individual oxide’s vaporization.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'The MgAlO molecular form presented in minor amounts in the gas phase over spinel and indicated about the possible heterogeneous reaction:'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: '[MgAl2O4] = (MgAlO) + (Al) + 3(O).'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, equation: '1'}
            - text: 'The partial pressures values of the vapor species over spinel (pi) in the temperature range 1850–2090 K were determined by the Hertz-Knudsen equation and shown in the Fig. 1.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, figure: '1', section: Results}
            - text: 'There was a noticeable change of spinel composition at higher temperatures due to the preferential evaporation of the vapor species, belonging to the magnesium oxide.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'The activity values of oxides in spinel were calculated by the Lewis equation:'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, equation: '2'}
            - text: '(pi and pi° – the partial pressures values of the vapor species over spinel and simple oxide, respectively).'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, equation: '2'}
            - text: 'The activity values of oxides in spinel in the crystalline state at higher temperatures (2050–2300 K) were found using the data [Shornikov and Archakov, 2001] on the MgAl2O4–SiO2 melts evaporation.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'The value of the Gibbs energy of spinel formation ΔG_T(MgAl2O4) was found by the relation:'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, equation: '3', section: Results}
            - text: 'ΔG_T(MgAl2O4) = RT ∑ x_i ln a_i.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, equation: '3'}
            - text: 'where x_i is the mole fraction of oxide (∑ x_i = 1).'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, equation: '3'}
            - text: 'The values of enthalpy ΔH_T(MgAl2O4) and entropy ΔS_T(MgAl2O4) of spinel formation has been calculated using by the least squares method from the ΔG_T(MgAl2O4) temperature dependences in the approximation of constancy of these values in the considered temperature interval and equal to −12.02±1.14 kJ/mole and 5.03±0.56 J/(mole·K), respectively, and are consistent with available data.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'Thermodynamic information on the oxide activities in the MgAl2O4–SiO2 melts [Shornikov and Archakov, 2001] allowed also to calculate the Gibbs energy values of spinel in the liquid state and find of enthalpy and entropy of spinel formation, equal to 43.79±4.84 kJ/mole and 28.09±1.64 J/(mole·K), respectively, and calculate the enthalpy of spinel melting, equal to 55.81±4.62 kJ/mole at the temperature of 2420±25 K.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'The values of ΔH_T(MgAl2O4) and ΔS_T(MgAl2O4) determined in the present study are correlated with results of the Knudsen mass spectrometric effusion method [Rutman et al, 1969; Sasamoto et al., 1981], performed at lower temperatures.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'Information obtained in studies of heterogeneous equilibria involving spinel [Kalyanram and Bell, 1961; Rein and Chipman, 1965; Chamberlin et al., 1995; Fujii et al., 2000] does not contradict the results of the present study, however they have a significant error.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'The values characterizing the spinel melting found in the present work are in good agreement with the experimental data, obtained by Richet [Richet, 1993].'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Results}
            - text: 'Thus, the spinel evaporation from the molybdenum cell was studied by the Knudsen mass spectrometric effusion method studied at 1850–2300 K.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Conclusion}
            - text: 'The molecular components typical for simple oxides forming the spinel and also in a small number of the MgAlO complex gaseous oxide were identified in the gas phase over spinel.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Conclusion}
            - text: 'The partial pressures values of vapor species over spinel were determined at the first time.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Conclusion}
            - text: 'The spinel thermodynamic data related to their crystalline and liquid state were determined too.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Conclusion}
