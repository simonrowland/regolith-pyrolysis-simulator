      - observation_id: shornikov_2016_crystalline_spinel_formation_thermodynamics
        type: thermodynamic_example
        locator:
          page: 43
          published_page: 43
          pdf_page_index: 1
          equation: '3'
          section: Results
          note: Crystalline MgAl2O4 formation properties; values are repeated in the abstract on page 42.
        units: as printed per property
        values:
          quantity: spinel_formation_thermodynamics
          method_class: model_derived
          attribution: Calculated in the present study from the Delta G(T) dependence using least squares under the stated constancy approximation.
          phase: crystalline MgAl2O4
          standard_state: Formation from oxides; the source does not identify whether each simple-oxide reference is solid or liquid.
          rows:
            - property: enthalpy_of_formation_from_oxides
              value: -12.02
              plus_minus_as_printed: 1.14
              unit: kJ/mole
              uncertainty_semantics: The source prints ±; it does not state a confidence level here.
            - property: entropy_of_formation_from_oxides
              value: 5.03
              plus_minus_as_printed: 0.56
              unit: J/(mole·K)
              uncertainty_semantics: The source prints ±; it does not state a confidence level here.
      - observation_id: shornikov_2016_liquid_spinel_formation_and_melting
        type: thermodynamic_example
        locator:
          page: 43
          published_page: 43
          pdf_page_index: 1
          section: Results
          note: Liquid-state properties are derived using oxide activities in MgAl2O4–SiO2 melts attributed to Shornikov and Archakov (2001).
        units: as printed per property
        values:
          quantity: liquid_spinel_formation_and_melting_thermodynamics
          method_class: model_derived
          attribution: The present authors calculate these values using MgAl2O4–SiO2 melt activity data from Shornikov and Archakov (2001), reference 8.
          phase: liquid MgAl2O4
          standard_state: Formation from oxides; the source does not identify whether each simple-oxide reference is solid or liquid.
          rows:
            - property: enthalpy_of_formation_from_oxides
              value: 43.79
              plus_minus_as_printed: 4.84
              unit: kJ/mole
              uncertainty_semantics: The source prints ±; it does not state a confidence level here.
            - property: entropy_of_formation_from_oxides
              value: 28.09
              plus_minus_as_printed: 1.64
              unit: J/(mole·K)
              uncertainty_semantics: The source prints ±; it does not state a confidence level here.
            - property: enthalpy_of_melting
              value: 55.81
              plus_minus_as_printed: 4.62
              unit: kJ/mole
              melting_temperature_K: 2420.0
              melting_temperature_plus_minus_as_printed_K: 25.0
              uncertainty_semantics: The source prints ± for both quantities; it does not state a confidence level here.
      - observation_id: shornikov_2016_introduction_qualifications
        type: thermodynamic_example
        locator:
          page: 42
          published_page: 42
          pdf_page_index: 0
          section: Introduction
        units: as printed
        values:
          quantity: introduction_qualifications
          method_class: quoted_unattributed
          statements:
            - text: 'The MgAl2O4 spinel is of particular interest to cosmochemistry as a basic mineral (up to 24 vol. %) of all types of substances of the refractory Ca–Al–Inclusions (CAIs).'
              locator: {page: 42, published_page: 42, pdf_page_index: 0, section: Introduction}
            - text: 'They are the earliest objects in the Solar system with an unusual isotopic characteristics and founded in carbonaceous chondrites.'
              locator: {page: 42, published_page: 42, pdf_page_index: 0, section: Introduction}
            - text: 'Spinel is also a dominant mineral in the Wark-Lowering rims (up to 71 vol. %), which are formed in the flesh-heating process (above the temperature of 2300 K) due to changes in the CAls mineral composition, which caused by the enrichment of refractory minerals (mainly spinel and perovskite and pyroxene) due to melilite [Wark and Boynton, 2001].'
              locator:
                page: 42
                published_page: 42
                pdf_page_index: 0
                section: Introduction
                note: The printed phrase "flesh-heating process" is plainly garbled English and is retained verbatim.
            - text: 'That’s why, the thermodynamic data characterized the evaporation processes of spinel at temperatures exceeding 1500 K acquired a special interest.'
              locator: {page: 42, published_page: 42, pdf_page_index: 0, section: Introduction}
            - text: 'The thermochemical information is based on measurements of the specific heat of the spinel, their differences are exceeded 10 J/(mole·K), leading to systematic deviations.'
              locator: {page: 42, published_page: 42, pdf_page_index: 0, section: Introduction}
            - text: 'Studies of the heterogeneous equilibria in oxide melts including spinel [Kalyanram and Bell, 1961; Rein and Chipman, 1965; Chamberlin et al., 1995; Fujii et al., 2000] are inaccurate, the differences in the Gibbs energy values exceed 15 kJ/mole (on 1 mole of the compounds), the values of enthalpy and entropy of spinel formation has a considerable error.'
              locator:
                page: 42
                published_page: '42–43'
                pdf_page_index: 0
                section: Introduction
                note: Sentence begins on page 42 and continues at the top of page 43.
            - text: 'Thermochemical data on the value of the enthalpy of spinel melting are contradictory.'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Introduction}
            - text: 'The information on the evaporation processes of spinel are scarce [Rutman et al, 1969; Sasamoto et al., 1981] and it limited the values of partial vapor pressure of the gas phase dominant component (atomic of magnesium).'
              locator: {page: 43, published_page: 43, pdf_page_index: 1, section: Introduction}
            - text: 'The enthalpy and entropy of spinel formation from oxides, equal to –12.02±1.14 kJ/mole and 5.03±0.56 J/(mole·K), correspondingly, and the enthalpy of melting equal to 55.81±4.62 kJ/mole are corresponding to literature information.'
              locator: {page: 42, published_page: 42, pdf_page_index: 0, section: Abstract}
