    - observation_id: schneider_1980_q3_phase_handling_and_xrd
      type: qualifying_statement_context
      locator:
        published_page: 7
        pdf_page_index: 12
        section: Phase Equilibria
      units: As defined in source; symbolic relations and qualitative context, no digitization.
      values:
        quantity: phase_experiment_method_qualification
        method_class: quoted_unattributed
        statement: Hygroscopic samples required dry handling. X-ray diffraction used Cu Kα radiation, a dry cell and graphite
          monochromator; high-temperature diffraction used dry nitrogen. SEM/EDX characterized products. Platinum containers,
          powder drying and nitrogen atmosphere in this chapter do not identify the KCAS KEMS bench or sample preparation.
        qualifications:
        - Preparation, purity and handling procedures for these hygroscopic phase materials were described in reference [3]; no numeric purity is supplied here.
        - The high-temperature X-ray apparatus of reference [4] required pressed pellets because of weight loss at cold surfaces. This introduced temperature and lattice-parameter errors, so observations were only qualitative.
        - Sealed-capsule experiments showed no indication of platinum reaction or color change, suggesting the anomalous melting behavior was independent of platinum reaction or interaction with air.
        qualification_locators: [{published_page: 7, pdf_page_index: 12}, {published_page: 9, pdf_page_index: 14}]
