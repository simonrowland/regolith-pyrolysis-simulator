        method_class: figure_only
        note: The remainder contains phase-equilibrium figures, conductivity plots, micrographs, and EDX spectra. They are outside the vapor-pressure series; no curves or spectra were digitized.
    - observation_id: schneider_1980_q3_prior_calcia_effect
      type: qualifying_statement_context
      locator: {published_page: 2, pdf_page_index: 7, section: Vaporization Studies}
      units: verbatim comparison with prior reports
      values:
        method_class: quoted_unattributed
        quantity: previously_reported_CaO_effect
        quote: >-
          Previous reports have described and compared the potassium pressure measurements on a K2O-Al2O3-SiO2 composition in the absence of CaO with results obtained on two K2O-CaO-Al2O3-SiO2 samples. These results showed that calcia has a major effect on K2O retention and increases the K2O activity by orders of magnitude at calcia concentrations which would be characteristic of Western slags obtained by combustion of Western coals (for example, Rosebud) in a seeded MHD combustion process.
    - observation_id: schneider_1980_q3_summary_claims
      type: qualifying_statement_context
      locator: {published_page: 1, pdf_page_index: 6, section: Summary of Progress to Date}
      units: verbatim qualitative summary
      values:
        method_class: quoted_unattributed
        quantity: K-pressure and K2O-activity comparisons
        quote: >-
          Vapor pressure data of K over K2O-CaO-Al2O3-SiO2 samples are reported and compared. The K pressure at equal K2O and CaO concentrations is insensitive to variation in the Al2O3 and SiO2 concentration (probably within limits) if the sum of the Al2O3 and SiO2 concentrations is constant. The K2O activity of two samples at equal K2O concentrations is reduced by increased Al2O3 + SiO2 concentration and reduced CaO concentration, but remains proportional at varying K2O concentrations.
    - observation_id: schneider_1980_q3_sample_selection_and_goal
      type: qualifying_statement_context
      locator: {published_page: 2, pdf_page_index: 7, section: Vaporization Studies}
      units: verbatim experiment scope and sample qualification
      values:
        method_class: quoted_unattributed
        quantity: vaporization_measurements_and_sample_selection
        quote: >-
          Measurements of the K and O2 vapor pressures over a third sample in the K2O-CaO-Al2O3-SiO2 system were completed. These data were obtained using a Knudsen-effusion, modulated beam mass spectrometric method. The objective of these measurements is to produce sufficient experimental results to provide a data base for the construction of a simple empirical model for prediction of alkali seed retention of real slags produced by combustion of Western sub-bituminous coals in an MHD seeded environment. This report includes new data obtained on a third K2O-CaO-Al2O3-SiO2 model slag. As in the previous work, this slag model is based on the 4 component phase diagram and has been selected so that the initial composition lies close to an invariant melting point. We believe that such compositions will tend to give rise to liquid solutions which will have vaporization properties similar to slag solutions once melting has taken place. Later work will be extended to include compositions in which one or more solid phases may be present.
    - observation_id: schneider_1980_q3_vp1_vp3_comparison
      type: qualifying_statement_context
      locator: {published_page: 2, pdf_page_index: 7, section: Vaporization Studies}
      units: verbatim pressure comparison and composition values
      values:
        method_class: quoted_unattributed
        quantity: comparative_K_pressures_and_compositions
        quote: >-
          The CaO concentrations in KCAS-VP-1 and KCAS-VP-3 are 27.5 and 28.0 wt% respectively and the observed K pressures at equal K2O concentrations agree within reasonable experimental error (certainly ±30 percent). This is true despite the changes in the Al2O3 and SiO2 concentrations which are 22.2 and 35.5 wt% respectively for the KCAS-VP-1 sample and 13.5 and 46.0 wt% respectively for the KCAS-VP-3 sample. This indicates that within a limited composition range, Al2O3 and SiO2 can be interchanged on a wt% basis with essentially no effect on the K2O activity. Comparison of the K pressures of KCAS-VP-2 and KCAS-VP-3 at equal K2O concentrations shows that the KCAS-VP-3 pressures are about 2.3 times as great as the KCAS-VP-2 pressures independent of the K2O concentration. This difference is attributed to the lower calcia content of the KCAS-VP-2 sample but part of the effect may also be due to the higher Al2O3 + SiO2 concentration.
    - observation_id: schneider_1980_q3_vp3_fit_and_temperature
      type: qualifying_statement_context
      locator: {published_page: 2, pdf_page_index: 7, section: Vaporization Studies}
      units: verbatim figure description and fit method
      values:
        method_class: quoted_unattributed
        quantity: figure_1a_description
        quote: >-
          These results are illustrated in figure 1-a which shows the K pressure as a function of wt% K2O at a temperature of 1667 K. The points for the KCAS-VP-1 and KCAS-VP-2 data were calculated at the average K2O concentrations from the least squares constants listed in Table 2 while the curve for KCAS-VP-3 was obtained from a fit of the data to an equation assuming a linear dependence of log P_K on the wt% K2O in the sample.
    - observation_id: schneider_1980_q3_initial_run_reliability
      type: qualifying_statement_context
      locator: {published_page: 3, pdf_page_index: 8, section: Vaporization Studies, table: '2'}
      units: verbatim fit and reliability qualification
      values:
        method_class: quoted_unattributed
        quantity: initial_data_reliability_and_off_composition
        quote: >-
          Generally the observed slopes are in reasonably good agreement except for the initial data for each sample. The initial data in each series is subject to more error due to evaporation of unreacted starting materials such as unreacted K2CO3 and is believed, therefore, to be less reliable. The initial data in the KCAS-VP-1 series shows slopes which are more characteristic of evaporation of K from KAlSiO4 than from slag solutions. This may possibly be due to having a sample which is somewhat off-composition.
