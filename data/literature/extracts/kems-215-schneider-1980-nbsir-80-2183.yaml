    - observation_id: schneider_1980_q3_phase_lattice_hypotheses
      type: qualifying_statement_context
      locator:
        published_page: 11
        pdf_page_index: 16
        section: Phase Equilibria
      units: As defined in source; symbolic relations and qualitative context, no digitization.
      values:
        quantity: tentative_lattice_intergrowth_interpretation
        method_class: author_estimate
        statement: MATCH 1 compared idealized primitive hexagonal carbonate and m3m aluminate potassium sites. A K2CO3 (001)/KAlO2
          (111) interface has negligible cumulative mismatch over several hundred Å in the model. Proposed KAlO2 (110)/(100) intergrowth,
          possible potassium/platinum intercalation and vacancy ordering are hypotheses for extra diffraction lines, not observed
          quantitative layer dimensions.
        model_distance_as_printed: several hundred Å
    - observation_id: schneider_1980_q3_liquidus_model_qualifications
      type: qualifying_statement_context
      locator:
        published_page: 12
        pdf_page_index: 17
        section: Phase Equilibria
      units: As defined in source; symbolic relations and qualitative context, no digitization.
      values:
        quantity: ideal_solution_model_limitations
        method_class: author_estimate
        statement: Measured eutectics from prior reports/references were compared with ideal-solution liquidus curves. Marked
          disagreement implies nonideality; solid solutions also affect the comparison. KAlSiO4–KAlSi2O6 is an exception, but
          its agreement may be fortuitous because phase-derived inputs came from reference [8]. Plotted curve coordinates and
          eutectics were not digitized.
    - observation_id: schneider_1980_q3_corrosion_mobility_and_source_conflict
      type: qualifying_statement_context
      locator:
        published_page: 38
        pdf_page_index: 43
        section: Metal Corrosion
      units: As defined in source; symbolic relations and qualitative context, no digitization.
      values:
        quantity: corrosion_directional_qualifications
        method_class: quoted_unattributed
        statements:
        - Fe was most mobile, followed by Cr; Ni was least mobile and did not penetrate the deposit except at the interface. Preferential
          Cr/Fe leaching left Ni-rich layering.
        - Oxygen-rich specimens had the clearer reaction band. Fume was less separated into cations, possibly because it formed
          by vaporization rather than direct molten-salt contact.
        - Fuel-rich reaction zones were less distinct; S associated with higher Ni could indicate nickel-sulfur compounds, rather than proving their
          formation.
        - The text on p. 38 calls 8-6 fuel rich, conflicting with the explicit oxygen-rich identification on p. 37 and the caption
          on p. 41. The source conflict is retained rather than silently reversing the sample binding.
        source_conflict_locators:
        - published_page: 37
          pdf_page_index: 42
        - published_page: 38
          pdf_page_index: 43
        - published_page: 41
          pdf_page_index: 46
        later_discussion_locator:
          published_page: 39
          pdf_page_index: 44
    - observation_id: schneider_1980_q3_corrosion_conclusion_qualification
      type: qualifying_statement_context
      locator:
        published_page: 40
        pdf_page_index: 45
        section: Metal Corrosion
      units: As defined in source; symbolic relations and qualitative context, no digitization.
      values:
        quantity: corrosion_interpretation_limits
        method_class: quoted_unattributed
        statement: Corrosion occurred readily in both environments; differences were minimal overall, though the oxygen-rich reaction
          band was more definable. Fe and Cr were more mobile and Ni relatively unreacted. In oxygen-rich material Ni remained
          at the interface as Fe left; fuel-rich material did not show high Ni. Migration of metal cations accounts for corrosion
          in both. In sulfate specimen 6-6 the absence of Ni could reflect loss or displacement; the reason was not resolved.
