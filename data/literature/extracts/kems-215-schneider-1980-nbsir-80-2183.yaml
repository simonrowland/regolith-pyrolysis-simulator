    - observation_id: schneider_1980_q3_other_chapter_numeric_context
      type: qualifying_statement_context
      locator: {published_page: 1, pdf_page_index: 6, section: Summary of Progress to Date}
      units: verbatim numeric summary facts outside the KEMS series
      values:
        quantity: other_report_sections_numeric_summary
        quote: >-
          The measurements support the suggestion made in previous reports that above 1385 °C, ionic conductivity is the predominant transport mechanism in this particular slag which contains a relatively large amount of iron. Type 316 stainless steel tubes were exposed to an oxygen-rich and fuel-rich environment seeded with K2SO4 and K2CO3. The samples were maintained at 500 °C and 590 °C wall temperature using internal air cooling. In the coming quarter the plans are to continue the study of Type 316 stainless steels using SEM-EDX analysis and to collect and analyze x-ray diffraction data on residue salt deposit material from fuel-rich and oxygen-rich system. Also, the feasibility of using metal and ceramic coatings on mild steel (with the testing of specific materials at 590 °C) will be examined.
        note: These summary claims concern other report chapters; their measured curves and corrosion imagery were not digitized into KEMS observations.
    - observation_id: schneider_1980_q3_non_kems_figures_scope
      type: figure_curve_context
