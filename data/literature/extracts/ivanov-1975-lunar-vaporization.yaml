    - observation_id: ivanov_1975_directional_claims_pages1341_1349
      type: characterization
      locator:
        page: 1
        published_page: 1341
        section: Abstract
      units: verbatim translated English statements and locators
      values:
        quantity: directional_comparative_and_qualifying_claims
        statements:
        - page: 1
          published_page: 1341
          quote: Analysis of data for the composition of regolith glasses and lithic fragments shows the important
            role and the wide distribution of vaporization processes on the lunar surface.
        - page: 1
          published_page: 1341
          quote: These processes occur not only for the relatively volatile alkali elements, but also for the main
            petrogenic elements such as iron and silicon.
        - page: 1
          published_page: 1341
          quote: The result of these processes is especially clear for highland samples and is shown by the regular
            change of petrochemical type, in particular, the conversion of gabbro-noritic compositions into (spinel)
            troctolite.
        - page: 1
          published_page: 1341
          quote: One can consider that similar processes have played an important role at a definite stage in the
            formation of terrestrial planets and to some extent it can be responsible for the known overall deficit
            of the volatile elements in the moon.
        - page: 2
          published_page: 1342
          quote: Glasses of probable volcanic origin are an exception and are known to exist at some sites. However,
            the role of such types of glasses is generally quantitatively insignificant, except in some areas, and
            they are not considered in this paper.
        - page: 2
          published_page: 1342
          quote: the processes of transportation and mixing can noticeably influence the composition of glasses,
            resulting in some averaging of the regolith composition and allowing one to judge the lunar surface
            composition over a large area based on a sample taken at a given point.
        - page: 3
          published_page: 1343
          quote: The noted peculiarities of the compositions of the particles are very difficult to explain by any
            mechanism of separating the usual lunar minerals by crystallization differentiation to give such a strong
            removal of SiO2.
        - page: 1
          published_page: 1341
          quote: The glass content is different in the various samples and is characterized by the clear tendency
            to increase with increasing regolith maturity, i.e. with increasing exposure age.
        - page: 1
          published_page: 1341
          quote: For silicon the vaporization losses exceed 30% in some cases.
        - page: 2
          published_page: 1342
          quote: 'Overall the sequence of volatilization of the main components of a basaltic melt with increasing
            temperature is as follows: K2O–Na2O–FeO–SiO2–MgO–CaO–Al2O3–TiO2.'
        - page: 2
          published_page: 1342
          quote: At temperatures of about 1400°C the melt loses iron and silica in noticeable amounts.
        - page: 2
          published_page: 1342
          quote: for silicate melts of acid composition the intensity of Na2O evaporation is higher than K2O.
        - page: 3
          published_page: 1343
          quote: The anomalous particles commonly have rather low alkali contents.
        - page: 3
          published_page: 1343
          quote: They are also characterized by much lower alkali concentrations, somewhat lower iron concentrations,
            and much higher concentrations of calcium, aluminum, and titanium, in comparison (where possible) with
            particles of similar chemical composition but not affected by vaporization (or affected to a small extent,
            which is difficult to determine).
        - page: 3
          published_page: 1343
          quote: the estimations of silica loss so obtained are undoubtedly low since as a rule (en + fs) > wo in
            pyroxenes of lunar rocks and, in addition, vaporization of other components is not taken into account.
        - page: 4
          published_page: 1344
          note: Passage begins on p. 1344 and continues on p. 1345.
          quote: The relative rarity of glasses with anomalous composition (deficit of silica) is evidently explained
            by the masking effect of simultaneous vaporization of the other components, particularly alkalis and
            iron, as well as the transformation of ferromagnesian silicates into less silica saturated forms (i.e.
            replacement of pyroxenes by olivines).
        - page: 5
          published_page: 1345
          quote: Mare basalts, in comparison with terra rocks of the ANT suite, are characterized by much higher
            concentrations of Na and K and significantly higher Fe concentrations.
        - page: 5
          published_page: 1345
          quote: these components (Na, K, Fe) are significantly more volatile than silica in melts of basaltic composition.
        - page: 5
          published_page: 1345
          quote: iron and alkalis evaporate simultaneously with SiO2 (and even predominate) and mask the volatilization
            of silica.
        - page: 5
          published_page: 1345
          quote: the lower ratio of olivine/(olivine + pyroxene) simply leads to an increase of this ratio during
            relatively slight evaporation of SiO2.
        - page: 5
          published_page: 1345
          quote: conversion from glasses corresponding to pyroxene rocks to glasses corresponding to olivine and
            spinel varieties
          subsection: listed as expected variations during fractional vaporization
        - page: 5
          published_page: 1345
          quote: decrease of the iron content of ferro-magnesian minerals
          subsection: listed as expected variations during fractional vaporization
        - page: 5
          published_page: 1345
          quote: decrease of the content of alkali feldspars and increase of anorthite content of plagioclase
          subsection: listed as expected variations during fractional vaporization
        - page: 5
          published_page: 1345
          quote: increase of the amount of ilmenite because of the low volatility of titanium.
          subsection: listed as expected variations during fractional vaporization
        - page: 8
          published_page: 1348
          quote: Nine samples from these have the apparent signs noted above, indicative of a SiO2 deficits.
          scope: Nine of the 34 spinel-troctolite lithic fragments assigned by Conrad et al. (1973); separate from Ridley et al. glass samples.
        - page: 6
          published_page: 1346
          quote: the normative content of wo in them is much greater than that of (en + fs).
          scope: samples c and d
        - page: 6
          published_page: 1346
          quote: The minimum relative quantity of SiO2 vaporization, calculated from the method considered above,
            amounts to 10.6% and 6.9% for samples “a” and “b” and 3.5% and 1.9% for “c” and “d”.
        - page: 6
          published_page: 1346
          quote: the titanium and iron concentrations of these glasses are excessively high for troctolitic rocks.
        - page: 8
          published_page: 1348
          quote: glasses of Group 6, relative to Group 4, are as a whole characterized by decreasing iron and alkali
            contents and by increasing content of normative ilmenite, etc.
        - page: 8
          published_page: 1348
          quote: some of the glass samples included in Group 4 were also evidently vaporized in large part, e.g.
            sample “f” has parameters close to that for glasses of Group 6
        - page: 8
          published_page: 1348
          quote: on an average have SiO2 deficits, where the amount of SiO2 vaporized according to our calculations
            is not less than 3.5% of the initial content.
          scope: 30 Apollo 16 gabbro-anorthosite glass samples
        - page: 9
          published_page: 1349
          quote: the process of fractional vaporization during meteoroid bombardment is much more important than
            the simple petrochemical changes of the secondary surficial formations.
        - page: 9
          published_page: 1349
          quote: the geochemical role of this process was evidently much greater than at present.
        - page: 9
          published_page: 1349
          quote: the moon, having a relatively small mass, could to a noticeable extent lose the more highly volatile
            elements vaporized by impacts.
        numeric_context:
        - page: 1
          published_page: 1341
          statement: Silicon vaporization losses exceed 30% in some cases.
        - page: 2
          published_page: 1342
          statement: The cited volatility order is K2O–Na2O–FeO–SiO2–MgO–CaO–Al2O3–TiO2 as temperature increases;
            melt iron and silica loss becomes noticeable at about 1400°C.
        - page: 3
          published_page: 1343
          note: Fragment identifier completes the sentence on p. 1344, PDF page 4 / index 3.
          statement: A cited Brown et al. (1971, p. 39, fragment 104EO931HG) comparison gives silica loss from 0% to more than 30%.
        - page: 8
          published_page: 1348
          statement: Dowty et al. (1973) found in Luna 20 fines a lithic fragment with an overall SiO2 deficit;
            its interstitial phase has a very low SiO2 content of 34.8%. This is not a whole-fragment analysis.
        - page: 8
          published_page: 1348
          statement: Conrad et al. (1973) assigned 34 lithic fragments to the spinel-troctolite group; nine of
            those fragments showed apparent SiO2-deficit signs. This population is separate from the 30 Ridley
            et al. (1973) Apollo 16 gabbro-anorthosite glass samples.
        - page: 8
          published_page: 1348
          statement: The reported Apollo 16 group contains 30 gabbro-anorthosite glass samples.
        - page: 8
          published_page: 1348
          statement: The paper reports an average silica loss not less than 3.5% of initial content for that group.
        - page: 5
          published_page: 1345
          statement: Chao et al. (1972) analyzed more than 200 Apollo 14 impact-glass particles divided into eight
            chemically different groups.
        - page: 5
          published_page: 1345
          statement: The Group 6 discussion identifies two plotted samples (a and b) out of five available samples.
        source_qualifications:
        - page: 1
          published_page: 1341
          statement: Abstract identifies highland samples and regular petrological-type change; the paper is compositional
            interpretation rather than new vaporization measurement.
        - page: 2
          published_page: 1342
          statement: Volcanic-origin glasses are treated as an exception and are not considered.
        - page: 3
          published_page: 1343
          statement: CIPW normative estimates can be made only through non-observed minerals (leucite, nepheline,
            periclase, etc.) and do not alone establish actual mineralogy.
        - page: 3
          published_page: 1343
          statement: 'Authors construct a minimum-loss norm by adding SiO2 for feldspars, olivines, and pyroxenes;
            calcium remaining after plagioclase formation sets the pyroxene quantity through wollastonite and
            wo = en + fs. Their estimates are low because en + fs generally exceeds wo in lunar pyroxenes and
            vaporization of other components is omitted.'
        - page: 5
          published_page: 1345
          statement: 'Glass-group assignments and probable parent rocks rely on Chao et al. (1972); group names and
            numbers follow that source: basalts (Group 4), feldspathic peridotites (Group 5), spinel troctolites
            (Group 6), and peridotites (Group 7).'
        - page: 5
          published_page: 1345
          statement: Group 4 glasses are considered by Chao et al. (1972) to be products of melting regolith
            breccias and fines; the cited reasons are abundance (they amount to about half of the glasses analyzed),
            heterogeneity, and chemical compositions. The fraction is approximate verbal context, not an exact measured percentage.
        - page: 5
          published_page: 1345
          statement: Groups 5, 6, and 7 may correspond to main regional rock types, explicitly stated as Chao et
            al. opinion.
        - page: 8
          published_page: 1348
          statement: The paper says its dataset permits only limited use of glass and lithic-fragment composition
            to recognize primary rock types due to transport, mixing, impact melting, and fractional vaporization.
