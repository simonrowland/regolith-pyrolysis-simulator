schema_version: literature_extract.v1
source_id: berry-oneill-2004-chromium-xanes
source:
  citation: Berry, A. J. and O’Neill, H. St. C. (2004), “A XANES determination of the oxidation state of chromium
    in silicate glasses”, American Mineralogist 89:790-798.
  year: 2004
extraction:
  method: Cr K-edge XANES, reduced-data derivative peak area for the 1s to 4s shoulder. Table 2 standards are physical
    mixtures of powdered endpoint glasses (AD and AD + En) prepared near Cr2+/SumCr = 0 at log fO2 about -2 and
    near 1 at log fO2 about -14. The authors convert derivative area to Cr2+/SumCr with Eq. 6, Cr2+/SumCr = a0 +
    a1 A(1s/4s), using the composition-specific a0 and a1 in Table 4. Table 3 ratios are therefore measured_reduced.
    Table 3 reports values as printed; no ratio was recalculated here. The Cr K-edge spectra were recorded on quenched
    glasses from melts equilibrated at 1400 C. Table 1 major-oxide compositions exclude about 0.5 wt% Cr2O3 added
    to the starting glasses. Table 3 log fO2 values are absolute as printed. Table 3 footnote calls the -16.13 control
    Cr2C3/CO; Experimental Methods p. 791 describes Cr3C2 powder enclosed in a graphite capsule under flowing CO
    at 1 bar; both wordings are preserved.
  date: '2026-10-16'
  worker: rdxw-cr04-1016
  full_cell_audit: See the accompanying text report berry-oneill-2004-audit.md. All stored Table 3 values, Table
    1 composition central values and uncertainties, Table 4 log K-prime values and fit slopes, and Table 4 fit counts
    were checked against pdftoppm renders.
  figure_only_candidates: Figures 3, 5, and 6 contain plotted XANES/redox points; no values visible only in figures
    were digitized. They remain figure-read candidates.
review_status: draft
