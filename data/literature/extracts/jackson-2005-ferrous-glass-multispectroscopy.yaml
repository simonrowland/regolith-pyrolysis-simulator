      phase: glass
      units: normalized elemental formula; NBO/T dimensionless; Tg K
      attribution: Authors' sample preparation and estimates; Toplis (1998) is the stated Tg method.
      values:
        quantity_as_printed: Sample formulas, NBO/T ratios, minor Cr2O3 contents, and estimated glass transition temperatures
        candidate_tokens: [equilibrium_phase_composition, transition_temperature, valence_ratio]
        method_class: measured_direct for microprobe cation proportions; model_derived for NBO/T and estimated Tg
        schema_gap: The normalized cation formulas cannot be represented as oxide compositions without reconstructing oxides. NBO/T has no quantity token. The Tg estimates are model-based Toplis estimates rather than measured glass transitions; their inputs are not stored as typed oxide compositions. The nominal 0.3 wt.% Cr2O3 additions are preparation data; the separate approximately 2.0 wt.% Cr2O3 values found in NC1 and NC2 are typed below as component compositions.
