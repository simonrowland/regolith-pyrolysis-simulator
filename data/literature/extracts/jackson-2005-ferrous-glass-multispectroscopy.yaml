          RB2: Rb2FeSi3O8 (nominal)
          NA1: Na1.08Fe1.17Si3.13O8
          NC6: Na1.46Ca0.24Fe1.08Si2.97O8
          NC2: Na1.09Ca0.51Fe0.72Si3.10O8
          NC1: Na0.99Ca0.92Fe0.24Si3.17O8
          BAS: Na0.29Mg0.53Ca0.52Fe0.56Al0.91Si2.44O8
        microprobe_cation_proportions_basis: relative to eight oxygens, for NA1, NC6, NC2, NC1, BAS
        minor_chromium_as_printed: 'Cr2O3: 0.3 wt.% incorporated in NA1, NC6, and BAS; approximately 2.0 wt.% found in NC1 and NC2 from reaction with the iron crucibles.'
