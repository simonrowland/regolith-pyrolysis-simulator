    - observation_id: kramer_1991_figure_6_oxygen_solubility
      type: figure_record
      locator: {page: 7, published_page: 77, pdf_page_index: 6, figure: '6'}
      panel: whole_figure
      attribution: present work, author-calculated curves
      units: oxygen solubility as plotted
      values:
        quantity_as_printed: oxygen solubility in glass melts
        quantity_token: unavailable
        schema_gap: No existing quantity enum represents dissolved oxygen solubility in glass melt.
        species: [O2]
        phase: glass melt
        temperature_as_printed: temperature-dependent curves; individual temperatures not labelled in caption
        pressure_as_printed: pO2 = 1 bar
        axes_as_printed: {x: 'Temperature in °C', y: 'Oxygen solubility'}
        caption: Oxygen solubility in a glass melt with an antimony redox equilibrium for pO2 = 1 bar as a function of temperature for several basicity numbers.
        series: [{name: B=15.6, marker: circle, marker_count: 13}, {name: B=20.4, marker: plus, marker_count: 13}, {name: B=34.1, marker: star, marker_count: 13}, {name: B=35.6, marker: open square, marker_count: 13}]
        points: []
      reported_model_context: >-
        The author calculates saturation solubility S_O2 at oxygen fugacity 1 bar, density 2.3 g/cm3, c=0.50 wt% Sb2O3, and basicity B=34.1 using ln(k2(T)) = -37 290 800/T^2 + 25 962.5/T - 0.21 244 (equations 31-32; references [41,42]) and S_O2 = 0.00125·w/(1+w), where w=B^3/(34.1^3·k2(T,Sb,B')) (equation 33). S_O2 is in g O2/(cm3 bar^1/2). These are author-calculated curves, not measured points.
      digitisation: deferred to a figure pass
