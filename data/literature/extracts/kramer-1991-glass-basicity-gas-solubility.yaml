schema_version: literature_extract.v1
source_id: kramer-1991-glass-basicity-gas-solubility
source:
  citation: "Krämer FW (1991). Contribution to basicity of technical glass melts in relation to redox equilibria and gas solubilities. Glastechnische Berichte 64(3):71-80."
  doi: 10.34657/14114
  year: 1991
  corpus_asset: raw/kramer-1991-glass-basicity-gas-solubility/kramer-1991-glass-basicity-gas-solubility.pdf
extraction:
  method: >-
    Scanned paper; MinerU supplied the two tables and pdftotext-layout supplied the surrounding text. Both tables and all figure pages were checked against 600 dpi PDF renders. No printed quantity in the tables or figures has a matching store token: the redox ratios and solubilities occur only in deferred figures, while the author-defined acidity/basicity scales and fitted laws are not stored measurement quantities. All measured table numbers, plotted-series metadata, conditions and author fits are retained in context; no values were digitised from figures.
  table_dispositions:
    table_1: context-only; published oxide acid-value scales have no store quantity token
    table_2: context-only; author-calculated glass basicity values have no store quantity token; inputs recorded in .agent-scratch/F31-tables/kramer-1991-glass-basicity-gas-solubility/table2.csv; derivation pending a corpus table asset (controller, t-1382)
    figures_1_to_9: context-only; figure values deferred; figure 1 oxygen-ion activity and figures 6-9 gas solubilities have no store quantity token
  date: '2026-10-20'
  worker: fam31-1020
review_status: draft
