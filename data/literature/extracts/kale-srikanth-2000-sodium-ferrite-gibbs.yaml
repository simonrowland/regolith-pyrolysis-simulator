      - observation_id: kale_srikanth_1999_transition_context
        type: phase_transition_context
        locator:
          page: 4
          published_page: 178
          section: Results and Discussion
        units: >-
          K for temperature values; reaction and phase labels are as printed.
        values:
          current_phase_equilibration_boundary_as_printed: 1048 ± 10 K
          current_emf_segment_intersection_as_printed: 1028 ± 5 K
          thery_1980_boundary_as_cited: 1030 ± 5 K
          current_phase_boundary_reaction_as_printed: 3Na2Fe2O4(s) + 2Fe2O3(s) ⇌ 2Na3Fe5O9(s)
          interpretation_as_printed: >-
            These temperatures concern the reaction between the lower-temperature Na2Fe2O4 and higher-temperature Na3Fe5O9 assemblages in the Na2Fe2O4–Fe2O3 system; they are not an intrinsic α-to-β or delta transition of NaFeO2.
          stability_comparison_as_printed: >-
            The authors say Na3Fe5O9 is not stable below 1073 ± 10 K in their results, contrary to Yamaguchi et al. [8], who found it stable down to 850 K.
          beta_phase_observation_as_printed: >-
            Table III lists β-Na2Fe2O4 as a minor phase at 1048 and 1073 K.
          absent_requested_properties: >-
            No δ phase near 1498 K, fusion temperature or enthalpy, standard formation enthalpy at 298 K, S298, Cp(T) equation or table, or H(T)-H298 values are printed for Na2Fe2O4 in this paper.
          figure_read_candidate: >-
            Figure 3 compares Gibbs-energy curves and Figure 4 compares Na3Fe5O9 data, but they are plots; no figure-only numeric values were digitized.
