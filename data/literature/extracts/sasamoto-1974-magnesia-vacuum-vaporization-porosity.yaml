schema_version: literature_extract.v1
source_id: sasamoto-1974-magnesia-vacuum-vaporization-porosity
source:
  citation: Sasamoto, T., Lee, H.-L. & Sata, T. (1974), Effects of Porosity on Vacuum-Vaporization of Magnesia,
    Yogyo-Kyokai-Shi 82(11), 603–610.
  year: 1974
  corpus_asset: raw/sasamoto-1974-magnesia-vacuum-vaporization-porosity/sasamoto-1974-magnesia-vacuum-vaporization-porosity.pdf
review_status: draft
extraction:
  method: MinerU table conversion and digit-agreement prescreen, followed by rendered-page cell audit for Tables
    1–4. Table 3 contains 32 printed runs; render-resolved ditto cells and Table 4 formulas were transcribed with
    the source spelling retained.
  date: '2026-10-25'
  worker: w1025c-sasa74
  provenance_path: raw/sasamoto-1974-magnesia-vacuum-vaporization-porosity/sasamoto-1974-magnesia-vacuum-vaporization-porosity.pdf
  schema_gaps:
  - Table 3 total-weight-loss rates are areal mass fluxes (10^-8 g/cm2·sec); no mass-loss-rate-per-area quantity
    token exists, so every Table 3 rate is a typed refusal.
  - Table 4 H* (apparent activation enthalpy) and S* (apparent activation entropy) have no corresponding quantity
    tokens; preserve as typed refusals.
  - Table 1 mixes detection limits, ranges, a combined Na & K row, and blank cells; its complete impurity matrix
    is preserved in characterization context and not interpreted as a scored composition vector.
  source_condition_audit: Table 3 prints temperatures and sample porosities. It reports no individual total pressure,
    oxygen fugacity, run duration, total mass loss, or numerical exposed area. The vacuum-system capability below
    10^-5 torr is apparatus context only. The 30-minute duration is the separate microscopy protocol on PDF p. 3.
  prose_table_range_note: Section 3.2 states 1400–1640°C, while Table 3 also prints 1700 and 1800°C for specimen
    1; retain the table values and record the discrepancy.
  figure_read_candidates: Figures 1–8 were not digitized. MinerU-generated <details> chart tables were ignored as
    invented figure interpretations; Figure 2 is microphotography, and plotted values in the other figures remain
    candidates for a separate figure pass.
