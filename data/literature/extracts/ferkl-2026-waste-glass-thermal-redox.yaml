extraction:
  method: Born-digital pdftotext-layout transcription; the corpus contains no MinerU table draft for this source.
    Table 1 (14 reactions, 42 numeric cells) and Table 2 (23 components across four sample columns, 92 numeric cells)
    were transcribed from physical PDF page 4 and checked against its 600 dpi render. Table 3 (six sample rows,
    40 numeric cells) and Table 4 (four values) were checked against the 600 dpi render of physical page 7. Table
    5 (five values) was checked against the 600 dpi render of physical page 10. Tables 1–3 are retained as source
    CSV assets. Rapidox ratios and XANES ratios are typed; target compositions are bound by sample and retained
    in context because the target recipe is not a measured final-glass analysis and includes elemental Cl and F;
    particle statistics, fitted partial water values, and model outputs remain context. Figures 1–11 are deferred
    without numeric points.
