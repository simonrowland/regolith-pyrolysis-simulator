source:
  citation: Davis, A. M., Hashimoto, A., Clayton, R. N. & Mayeda, T. K. (1990), Isotope mass fractionation during evaporation
    of Mg2SiO4, Nature 347:655–658, DOI 10.1038/347655a0.
  doi: 10.1038/347655a0
  url: https://doi.org/10.1038/347655a0
  year: 1990
extraction:
  method: Transcribed from MinerU Table 1; all numeric cells were checked against the page 2 render because the pdftotext
    layer contains only copyright headers. Table values use 2,050 °C for the rows where a prose sentence says 2,940 °C. The
    paper describes the experiments as in vacuum but prints no numerical pressure in the article. Residue composition is not
    printed; initial composition is encoded from the printed synthetic forsterite formula Mg2SiO4 as the oxide mole ratio
    MgO:SiO2 = 2:1, without inferring the residue composition. Table 2 fitted Rayleigh fractionation factors are retained
    as context only, not as independent measurements.
  date: '2026-10-22'
  worker: wave51-F60
  provenance_path: text/davis-1990-forsterite-evaporation-isotopes/pdftotext-layout.txt and mineru/p001-p004
