extraction:
  method: >-
    Manual transcription from the born-digital pdftotext-layout source. Table 1 was
    checked against a 600 dpi render of PDF page 15. The table tool accepts MinerU
    content-list tables and refuses a pdftotext-only table, so Table 1 is retained
    as source-attributed context. Figures 1–3 are model calculations and are recorded
    without digitised points. The paper reports no new measurements.
