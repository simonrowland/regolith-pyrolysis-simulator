source:
  citation: Robinot, J., Rodat, S., Abanades, S., Bêche, E., Paillet, A. & Cowley, A. (2026), "Quantification
    of oxygen production from solar pyrolysis of lunar regolith", Adv. Space Res., DOI 10.1016/j.asr.2026.02.003,
    HAL hal-05512237
  doi: 10.1016/j.asr.2026.02.003
  url: https://doi.org/10.1016/j.asr.2026.02.003
  year: 2026
extraction:
  method: Official HAL / article-in-press PDF from corpus raw/kems-044-robinot-2026/kems-044-robinot-2026.pdf
    (15 pages; HAL cover is PDF page 1). pdftotext -layout and MinerU decode used only as a map. Printed
    numbers transcribed from a 400 dpi pdftoppm render; the render wins where the decode disagrees (Eq.
    6 coefficients; MinerU Fig. 1 numeric dump is all zeros and was rejected). Fig. 4c bar labels are
    printed on the figure and were transcribed; Figs 1, 4a, 4b, 5 and 8 have no printed point table and
    were not digitised. Authors' measured O2 yield and mass-balance prose kept distinct from the HSC 10
    model yield, from Šeško 2024 EAC-1 composition quoted as feedstock, and from EDS/XRD qualitative by-product
    text. This paper is solar vacuum pyrolysis with an O2 trace analyser, not KEMS.
