    - observation_id: shornikov_2020_qualifier_01
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'One of the first phase diagrams plotted for the calcium titanate system by Umezu and Kakiuchi [2]
          on the basis of visual observations contained a single component: perovskite CaTiO3, which has a melting
          temperature of 2013 ± 10 K.'
        attribution: Shornikov (2020)
        note: Background temperature; Table 1 includes the cited transition.
    - observation_id: shornikov_2020_qualifier_02
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: Wartenberg et al. [5] discovered new calcium titanates Ca2TiO4 and Ca3TiO5 with melting temperatures
          of 2073 ± 20 and 2148 ± 20 K, respectively.
        attribution: Shornikov (2020)
        note: Background values; cited in Table 1.
    - observation_id: shornikov_2020_qualifier_03
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Meanwhile, Roth [11] identified another new compound: Ca4Ti3O10, which decomposes into perovskite and a liquid at a temperature of 2028 ± 10 K. Jongejan and Wilkins [12] later reported a higher temperature of Ca4Ti3O10 decomposition, based on data from high-temperature microscopy: 2143 ± 10 K.'
        attribution: Shornikov (2020)
        note: Conflicting literature values; both appear in Table 1.
    - observation_id: shornikov_2020_qualifier_04
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'However, Imlach and Glasser [13] did not confirm the existence of Ca4Ti3O10 in X-ray diffraction studies, due probably to the conditions used in annealing their samples.'
        attribution: Shornikov (2020)
        note: Phase-identification qualification.
    - observation_id: shornikov_2020_qualifier_05
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'The hypotheses of Kimura and Muan [14] and Shultz [15] about the existence of a region of Ca3Ti2O7–Ca4Ti3O10 solid solutions was disproven by the results from X-ray diffraction studies performed by Tulgar [16], who discovered yet another new component: Ca5Ti4O13, which decomposes at 2113 ± 20 K.'
        attribution: Shornikov (2020)
        note: Phase interpretation as printed.
    - observation_id: shornikov_2020_qualifier_06
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'who discovered yet another new component: Ca5Ti4O13, which decomposes at 2113 ± 20 K.'
        attribution: Shornikov (2020)
        note: Verbatim continuation excerpt; the subject is Tulgar [16] in the preceding clause. Table 1 includes the cited value.
    - observation_id: shornikov_2020_qualifier_07
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: Limar’ and Kisel’ [17, 18] and Pfaff [19] synthesized and studied metastable CaTi4O9 and CaTi2O5,
          which decomposed at 993 ± 20 and 1123 ± 20 K, respectively, into rutile and other calcium titanates.
        attribution: Shornikov (2020)
        note: Background temperatures; Table 1 includes the values.
    - observation_id: shornikov_2020_qualifier_08
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Savenko and Sakharov [20] found that the products of thermolysis contain Ca2Ti5O12, which is stable in the temperature range of 1023–1273 K and decomposes into rutil and perovskite.'
        attribution: Shornikov (2020)
        note: The English translation prints “rutil” here; preserved verbatim, apparently a translation typo for
          rutile.
    - observation_id: shornikov_2020_qualifier_09
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Difficulties in synthesizing and identifying components of the CaO–TiO2 system could be due to reductive conditions that can lead in particular to the formation of Ca3Ti2O6 [21] or CaTi2O4 [22–25].'
        attribution: Shornikov (2020)
        note: Conditional qualification.
    - observation_id: shornikov_2020_qualifier_10
      type: data_qualification
      locator:
        published_page: 1289
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'In studying CaO inclusions in perovskite via electron microscopy, Ceh and Kolar [26] discovered the formation of homological Ca6Ti5O16, Ca8Ti7O22, and Ca9Ti8O25 oxides that grew along with CaTiO3 in its lattice faults.'
        attribution: Shornikov (2020)
        note: Comparative phase statement.
    - observation_id: shornikov_2020_qualifier_11
      type: data_qualification
      locator:
        published_page: 1290
        pdf_page_index: 1
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Note that studies of the thermodynamic properties of other calcium titanates (Ca3Ti2O7 and Ca4Ti3O10) were limited by the results from several works [37, 43–45] performed at temperatures below 1250 K.'
        attribution: Shornikov (2020)
        note: Numeric scope statement.
    - observation_id: shornikov_2020_qualifier_12
      type: data_qualification
      locator:
        published_page: 1290
        pdf_page_index: 1
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: Thermodynamic information about the CaO–TiO2 system’s properties in the region of temperatures above
          1700 K is quite scarce and limited by the results from only several experimental studies (Fig. 2).
        attribution: Shornikov (2020)
        note: Numeric scope statement.
    - observation_id: shornikov_2020_qualifier_13
      type: data_qualification
      locator:
        published_page: 1290
        pdf_page_index: 1
        section: Introduction
        note: Sentence begins on p. 1290 and continues below Table 1 on p. 1291.
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Activities aTiO2 calculated by Suito et al. [46, 47] correlated with their values measured by Banon et al. [48] via Knudsen effusion mass spectrometry in the temperature range of 1900–2200 K (Table 2).'
        attribution: Shornikov (2020)
        note: Comparative claim.
    - observation_id: shornikov_2020_qualifier_14
      type: data_qualification
      locator:
        published_page: 1291
        pdf_page_index: 2
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: In the authors’ opinion, this made them imprecise, which is why they do not correspond to different
          variants of the CaO–TiO2 phase diagram [5, 10, 12, 16].
        attribution: Shornikov (2020)
        note: Earlier extrapolations were qualified as imprecise.
    - observation_id: shornikov_2020_qualifier_15
      type: data_qualification
      locator:
        published_page: 1291
        pdf_page_index: 2
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Nevertheless, Banon et al. [48] assumed the CaO–TiO2 melt was immiscible in the region close to TiO2 when interpreting the high activities aTiO2 obtained in a range of concentrations close to this region (Fig. 3).'
        attribution: Shornikov (2020)
        note: Attributed immiscibility interpretation.
    - observation_id: shornikov_2020_qualifier_16
      type: data_qualification
      locator:
        published_page: 1292
        pdf_page_index: 3
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: As follows from Table 2, the Belton–Fruehan [53] values calculated in [50, 51] for the activities
          of the oxides in perovskite at 2100 K with regard to the pseudo-binary CaTiO3–CaSiO3 and CaTiO3–SiO2 systems,
          respectively, were close to those estimated by Banon et al. in [48].
        attribution: Shornikov (2020)
        note: Comparative activity statement; 2100 K.
    - observation_id: shornikov_2020_qualifier_17
      type: data_qualification
      locator:
        published_page: 1292
        pdf_page_index: 3
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'Figure 2 shows that at 2057 K, one of the two studied CaO–TiO2 compositions lies in the CaO + liquid region, so its activity aCaO must be close to unity.'
        attribution: Shornikov (2020)
        note: Phase/activity inference.
    - observation_id: shornikov_2020_qualifier_18
      type: data_qualification
      locator:
        published_page: 1292
        pdf_page_index: 3
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The second composition lies in the Ca4Ti3O10 + liquid region according to the data from [10, 11]
          or in the Ca3Ti2O7 + liquid region, as follows from those of Tulgar [16].
        attribution: Shornikov (2020)
        note: Competing phase assignment.
    - observation_id: shornikov_2020_qualifier_19
      type: data_qualification
      locator:
        published_page: 1292
        pdf_page_index: 3
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: However, calculated activities aCaO are fairly close to each other (Table 2), thus contradicting
          the CaO–TiO2 phase diagram (Fig. 2).
        attribution: Shornikov (2020)
        note: Comparative contradiction.
    - observation_id: shornikov_2020_qualifier_20
      type: data_qualification
      locator:
        published_page: 1292
        pdf_page_index: 3
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: A possible reason for these discrepancies would seem to be the considerable error when measuring
          the CaO activities in a melt, which we believe could be more than 50%.
        attribution: Shornikov (2020)
        note: Authors’ uncertainty estimate.
    - observation_id: shornikov_2020_qualifier_21
      type: data_qualification
      locator:
        published_page: 1292
        pdf_page_index: 3
        section: Introduction
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'We can see that the thermodynamic data obtained in [42, 46–51] is consistent, but for the only composition corresponding to perovskite.'
        attribution: Shornikov (2020)
        note: Comparative claim and limitation.
    - observation_id: shornikov_2020_qualifier_22
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The change in the composition of the residual perovskite melt during evaporation testified to the
          predominant vaporization of the calcium component from the melt.
        attribution: Shornikov (2020)
        note: Prior Langmuir study [55]; non-congruent evaporation/composition drift.
    - observation_id: shornikov_2020_qualifier_23
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: Although the estimated value of the total vapor pressure over the perovskite melt corresponded to
          our data in [41], the other thermodynamic information obtained by Zhang et al. [55] was not confirmed
          experimentally.
        attribution: Shornikov (2020)
        note: Prior-study qualification.
    - observation_id: shornikov_2020_qualifier_24
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The information about the phase diagram of the calcium titanate system is contradictory (Figs. 1
          and 2) and must be refined with regard to the presence (or absence) of calcium titanates and the positions
          of invariant points, including the melting temperatures of individual oxides (Table 1).
        attribution: Shornikov (2020)
        note: Authors’ phase-diagram qualification.
    - observation_id: shornikov_2020_qualifier_25
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'The preliminary estimates obtained for the activities of oxides in the CaO–TiO2 system at different temperatures and compositions (predominantly in the solid phase) do not give a full picture of the physicochemical properties of the melts of this system (Table 2), which is required for their theoretical description.'
        attribution: Shornikov (2020)
        note: Authors’ limitation.
    - observation_id: shornikov_2020_qualifier_26
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'As shown in [49], the first stage of the evaporation of calcium–titanate–silicate melts was characterized by the predominant vaporization of the silicon dioxide contained in a melt at a constant concentration of calcium titanate component.'
        attribution: Shornikov (2020)
        note: Prior work [49]; evaporation sequence.
    - observation_id: shornikov_2020_qualifier_27
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: At the second stage of the evaporation of melts of CaO–TiO2–SiO2 depleted of silicon dioxide down
          to concentrations close to the field of calcium oxide (∼70 to 80 mol % CaO), the calcium silicate component
          of each melt was evaporated until the removal of SiO2 was nearly complete.
        attribution: Shornikov (2020)
        note: Prior work [49]; numeric composition range.
    - observation_id: shornikov_2020_qualifier_28
      type: data_qualification
      locator:
        published_page: 1293
        pdf_page_index: 4
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: Subsequent evaporation of the residual CaO–TiO2 melt was conducted with the predominant vaporization
          of calcium oxide down to the region of concentrations close to the rutil TiO2 field.
        attribution: Shornikov (2020)
        note: The English translation prints “rutil” here; preserved verbatim, apparently a translation typo for
          rutile.
    - observation_id: shornikov_2020_qualifier_29
      type: data_qualification
      locator:
        published_page: 1294
        pdf_page_index: 5
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'The ratio between the intensities of ion currents in the mass spectra of vapor over the CaO–TiO2
          melt that was 57.81 ± 0.15 mol % TiO2 at 2278 ± 10 K was I_Ca : I_CaO : I_Ti : I_TiO : I_TiO2 : I_CaTiO3
          : I_O : I_O2 = 25 : 0.02 : 0.1 : 56 : 100 : 0.13 : 0.44 : 0.012, which differs slightly from the one found
          for perovskite in [41].'
        attribution: Shornikov (2020)
        note: Comparative current-ratio statement.
    - observation_id: shornikov_2020_qualifier_30
      type: data_qualification
      locator:
        published_page: 1294
        pdf_page_index: 5
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The partial pressures calculated for the components of gas phase over a CaO–TiO2 melt at 2278 ± 10
          K with an error less than 10% are given in Table 3.
        attribution: Shornikov (2020)
        note: Stated uncertainty bound.
    - observation_id: shornikov_2020_qualifier_31
      type: data_qualification
      locator:
        published_page: 1294
        pdf_page_index: 5
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The partial pressures determined for atomic oxygen (Table 4) using Eq. (11) were in satisfactory
          agreement with the values calculated with the thermochemical data in [39] on equilibrium constants Kr(T)
          of possible reactions (1)–(3), (5), and (10) occurring in the gas phase over a melt, according to the equations
        attribution: Shornikov (2020)
        note: Verbatim prose excerpt preceding Eqs. (12)–(16); the equations are retained in the pressure-relation context.
    - observation_id: shornikov_2020_qualifier_32
      type: data_qualification
      locator:
        published_page: 1294
        pdf_page_index: 5
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The Clausing factor represents the collisions between the gas phase components inside the channel
          of the vent (effusion container) and their rebounding off the channel walls. Its value is less than unity
          and depends on the ratio between the diameter and the thickness of the vent.
        attribution: Shornikov (2020)
        note: Geometry relation; actual dimensions absent.
    - observation_id: shornikov_2020_qualifier_33
      type: data_qualification
      locator:
        published_page: 1295
        pdf_page_index: 6
        section: Experimental or results
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The activities determined for the oxides in CaO–TiO2 melts using Eqs. (22) and (23) at 2278 K are
          compared in Table 5. We can see they are in satisfactory agreement with the values determined independently
          with Eqs. (17) and (18).
        attribution: Shornikov (2020)
        note: This broad agreement statement coexists with inconsistent Table 5 CaO values at 43.15 and 83.14 mol
          % TiO2.
    - observation_id: shornikov_2020_qualifier_34
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The results [48] correlate with the data of this work.
        attribution: Shornikov (2020)
        note: Comparative statement.
    - observation_id: shornikov_2020_qualifier_35
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: As mentioned above, the difference between activities aTiO2 is likely due to the procedures for extrapolating
          the information in [48] for CaTiO3–Ti2O3–TiO2 ternary system compositions with a possible loss of precision.
        attribution: Shornikov (2020)
        note: Authors’ explanation.
    - observation_id: shornikov_2020_qualifier_36
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: 'The behavior observed for the activity of TiO2 in melts for the region of concentrations close to rutile [48] could be evidence of some immiscibility in a melt, as follows from the observed kink in the concentration dependence of aTiO2 (Fig. 3, line 3), and the proximity to the constant values obtained for the concentration dependences of pTi, pTiO, pTiO2, pO, and pO2 (Table 3) in this work.'
        attribution: Shornikov (2020)
        note: Conditional interpretation.
    - observation_id: shornikov_2020_qualifier_37
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: In our opinion, however, the behavior of the TiO2 and CaTiO3 activities (Fig. 3, curves 4 and 6)
          is closer to ideal.
        attribution: Shornikov (2020)
        note: Comparative interpretation; Fig. 3 not digitized.
    - observation_id: shornikov_2020_qualifier_38
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The maximum value of aCaTiO3 corresponds to the region of compositions close to perovskite (Fig.
          3, curves 5 and 6).
        attribution: Shornikov (2020)
        note: Maximum/composition statement; Fig. 3 not digitized.
    - observation_id: shornikov_2020_qualifier_39
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The differences from activities aCaO in [54] (Fig. 3, points 1) would seem to be due to their low
          precision.
        attribution: Shornikov (2020)
        note: Authors’ interpretation.
    - observation_id: shornikov_2020_qualifier_40
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The partial and integral thermodynamic dependences of CaO–TiO2 melts in Fig. 4 are of a symbate character.
        attribution: Shornikov (2020)
        note: Translation wording “symbate” retained.
    - observation_id: shornikov_2020_qualifier_41
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The enthalpies of formation and entropies of these melts are positive.
        attribution: Shornikov (2020)
        note: Sign statement; Fig. 4 not digitized.
    - observation_id: shornikov_2020_qualifier_42
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The extremal values of the integral thermodynamic properties of these melts belong to the region
          of concentrations close to the composition of perovskite, confirming its stability in a melt.
        attribution: Shornikov (2020)
        note: Extremum and stability interpretation.
    - observation_id: shornikov_2020_qualifier_43
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: As with the CaO–SiO2 melts, the shift of the extremum in the integral thermodynamic functions of
          CaO–TiO2 melts [65] could be due to the presence of oxide compounds with higher amounts of CaO in a melt,
          relative to perovskite CaTiO3.
        attribution: Shornikov (2020)
        note: Comparative composition interpretation.
    - observation_id: shornikov_2020_qualifier_44
      type: data_qualification
      locator:
        published_page: 1296
        pdf_page_index: 7
        section: Results and discussion
        note: Sentence begins on p. 1296 and continues on p. 1297.
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The comparison presented in Fig. 5 for the energies of mixing of CaO–TiO2 melts and their values
          for CaO–SiO2 [65] and CaO–Al2O3 [66] melts at 2300 K indicates that the chemical interaction in the CaO–TiO2
          melt was stronger than in the CaO–Al2O3 melt, but weaker than in the CaO–SiO2 melt, as exhibited by its
          higher energies of mixing.
        attribution: Shornikov (2020)
        note: Comparative statement at 2300 K; Fig. 5 not digitized.
    - observation_id: shornikov_2020_qualifier_45
      type: data_qualification
      locator:
        published_page: 1297
        pdf_page_index: 8
        section: Conclusions
        note: Complete sentence; no figure curve digitized.
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The obtained experimental information testifies to the symbate behavior of the determined thermodynamic
          functions that characterize the melts of this system and the possible immiscibility of CaO–TiO2 melts
          in the region close to TiO2, as mentioned earlier.
        attribution: Shornikov (2020)
        note: Conclusion repeats conditional immiscibility.
    - observation_id: shornikov_2020_qualifier_46
      type: data_qualification
      locator:
        published_page: 1297
        pdf_page_index: 8
        section: Conclusions
      units: as printed
      values:
        quantity: verbatim_data_qualification_or_comparison
        quote: The experimental values of the integral thermodynamic properties of these melts belong to the region
          of concentrations close to the composition of perovskite, thus confirming its stability in a melt.
        attribution: Shornikov (2020)
        note: Conclusion repeats stability interpretation.
    - observation_id: shornikov_2020_qualifier_47
