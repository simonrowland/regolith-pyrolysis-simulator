    - observation_id: de_maria_1969_method_apparatus_and_calibration
      type: method_and_calibration_context
      experiment: de_maria_1969_andesinic_basalt_kems
      locator:
        page: 4
        published_page: 526
        pdf_page_index: 3
        section: Experimental Procedure
      units: as printed
      values:
        instrument_and_temperature_as_printed: High-temperature Bendix Co. time-of-flight mass spectrometer, model 3015; resolving
          power 750; ion flight path 200 cm. Radiation heating and electron bombardment were used; temperatures as high as
          2400° K were reached with electron-bombardment heating.
        temperature_measurement_and_calibration_as_printed: Temperature was measured with a Leeds and Northrup optical pyrometer
          and a W, W—Re thermocouple. The discrepancies never exceeded 12°C. The optical pyrometer was calibrated at the melting
          point of gold [8]; bottom-window transmission correction was based on Benford [9].
        background_pressure_as_printed: Below 10^-6 Torr in the Knudsen-cell region and 10^-7 Torr in the analyzer.
        beam_and_readout_as_printed: A molecular beam shutter distinguished ions formed from neutral particles in the beam
          from ions created by surface ionization or background gases. Two standard readout channels were used for ion-intensity
          ratios and isotopic distributions.
        container_as_printed: Molybdenum effusion cell, 1.2 cm high, 1 cm external diameter, with a 1 mm knife-edge orifice;
          previously outgassed at 1800° K.
        sample_as_printed: Crushed andesinic basalt of Nuraghe Silvanis; its composition corresponds to Table IV, sample no.
          2, of reference 10. The rock is described as vesicular and porphyritic of vitrophyric type.
        silver_and_pressure_calibration_as_printed: “Two silver calibrations were made, before and after the vaporization
          of the sample. The reproducibility of the instrument sensitivity factor was within 15%. On the basis of an extensive
          observation made during several years in this laboratory, we are led to believe that this procedure would affect
          the pressure calibration within an uncertainty of 10–15% at the most.”
    - observation_id: de_maria_1969_sample_vaporization_temperature_context
      type: experiment_temperature_context
      experiment: de_maria_1969_andesinic_basalt_kems
      locator:
        page: 6
        published_page: 528
        pdf_page_index: 5
        section: Results
      units: as printed
      values:
        quantitative_evaporation_as_printed: 178 mgr of sample; starting from room temperature; stages at intervals of about
          100°C; about four hours at each stage; the series lasted five days.
        initial_stage_as_printed: Temperature interval 300°–500° K; weight loss 7.3 mgr (4.1% of sample), compared with 4.71%
          calculated water in the original sample.
        intermediate_stage_as_printed: In the temperature range 500°–1800° K the weight loss was negligible while the alkaline
          metals and presumably part of the alkaline-earth elements volatilized.
        container_reaction_as_printed: At 1200° K the crucible inner free surfaces began to be covered by brown granules,
          later identified by X-ray as nonstoichiometric molybdenum oxides.
        melting_as_printed: Melting of the sample occurred between 1200° and 1300° K.
        table_conditions_as_printed: Table I intensities were measured at 70 eV electron energy and corrected for surface
          ionization and photo-effect following the usual procedure [5].
        surface_ionization_as_printed: At 1600° K and 70 eV, the surface-ionization contribution to Na+ intensity was about
          15% of the total peak.
    - observation_id: de_maria_1969_appearance_potential_method_context
      type: appearance_potential_calibration_context
      experiment: de_maria_1969_andesinic_basalt_kems
      locator:
        page: 9
        published_page: 531
        pdf_page_index: 8
        section: Results
      units: as printed
      values:
        method_as_printed: The ionization potentials were determined by using the method of linear extrapolation and by assuming
          Hg+ as a standard to calibrate the energy scale.
        curve_scope_as_printed: Figures 2, 3, and 4 show ionization-efficiency curves for Na+, K+, SiO+, Fe+, m/e 25 and 26,
          and m/e 50, 51, and 52. They are not digitized in this extract.
    - observation_id: de_maria_1969_vaporization_stage_context
      type: vaporization_interpretation_context
      experiment: de_maria_1969_andesinic_basalt_kems
      locator:
        page: 10
        published_page: 532
        pdf_page_index: 9
        section: Results
      units: as printed
      values:
        first_stage_as_printed: Between 1300° and 1900° K, alkaline and alkaline-earth metals vaporized largely as atomic
          or oxygen-containing heteronuclear polyatomic species, and to a lesser degree species containing Al and presumably
          Si.
        second_stage_as_printed: Approximately 2000°–2300° K; Si and Fe and part of Al volatilized. Si volatilized mainly
          as SiO; iron and aluminum as monatomic species.
        third_stage_as_printed: Above 2300° K; residue largely composed of Al2O3 and molybdenum oxide volatilized. Evaporation
          was not completed because the residue appeared to have reacted strongly with the container and weight loss exceeded
          initial sample weight.
        molybdenum_oxide_ions_as_printed: At 70 eV, volatilized molybdenum oxide produced MoO3+, MoO2+, and MoO+ ion peaks,
          mainly from the outer crucible surfaces.
    - observation_id: de_maria_1969_mass40_and_species_interpretation_context
      type: ion_assignment_context
      experiment: de_maria_1969_andesinic_basalt_kems
      locator:
        page: 12
        published_page: 534
        pdf_page_index: 11
        section: Results
      units: as printed
      values:
        mass40_as_printed: Between 1400° and 1800° K, the m/e 40 peak was attributed to re-evaporation of calcium from the
          shields.
        sio_isotopic_peaks_as_printed: The m/e 44, 45, and 46 currents agree reasonably with SiO isotopic distribution; SiO
          appearance was noticed at about 1800° K.
        surface_ionization_mass50_52_as_printed: The surface-ionization contribution for m/e 50, 51, and 52 was of the order
          of 5–10% of the whole peak.
    - observation_id: de_maria_1969_activity_estimates_context
