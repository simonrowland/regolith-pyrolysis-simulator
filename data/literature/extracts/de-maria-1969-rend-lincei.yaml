    - observation_id: de_maria_1969_oxygen_reaction_statement
      type: oxygen_potential_context
      experiment: de_maria_1969_andesinic_basalt_kems
      locator:
        page: 13
        published_page: 535
        pdf_page_index: 12
        section: Conclusions
      units: as printed
      values:
        observed_oxygen_reaction_quote: The failure to detect oxygen—made more difficult because of the relatively high background
          peak at mass 16—shows that most of the oxygen in the sample reacted with the molybdenum to form non-stoichiometric
          oxides that began to volatilize at approximately 2000° K.
        fO2_assignment: No experimental fO2 value is printed or assigned.
