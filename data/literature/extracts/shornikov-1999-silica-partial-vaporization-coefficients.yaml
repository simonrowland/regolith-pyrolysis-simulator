          1171–1177, 1998) prints the melting point of [SiO2] as 1996±5 K. This interval ends at 1950
          K, outside the melting band 1991–2001 K and within 100 K of that melting point. This cell is
          the printed result of equation (10). It is not recomputed, and it is not linked to Table 3.
