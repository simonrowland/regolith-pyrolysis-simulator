    - observation_id: shornikov_2023_intro_context
      type: author_context
      locator:
        page: 1
        pdf_page_index: 0
        section: Introduction
      units: "source prose; numeric_facts units are stated per value"
      values:
        quantity: introductory_claims
        method_class: quoted_unattributed
        statements:
        - "CAIs represent the most primitive substance of the Solar System with an age of 4.567 billion years."
        - "Most researchers believe that CAIs were formed by condensation of solar composition gas."
        - "According to modern concepts [1, 2], high-temperature evaporation processes also played a significant role in CAIs formation."
        - "There are two main stages in CAIs evolution: the stage of formation of CAIs primary condensates and the stage of heating, melting and partial evaporation of substance."
        numeric_facts:
        - name: Solar_System_age_as_printed
          value: 4.567
          unit: billion years
          locator: {page: 1, pdf_page_index: 0, section: Introduction}
    - observation_id: shornikov_2023_experimental_context
      type: experimental_context
      locator:
        page: 1
        pdf_page_index: 0
        section: Experimental
      units: "ion species and author-stated reaction prose"
      values:
        quantity: starting_material_ions_and_cell_reaction
        method_class: measured_direct
        starting_material_statement: "The studied samples were natural inclusions in Efremovka chondrite (CV3) of types A and B (Table 1). They contained also some oxides of potassium, sodium, sulfur, iron, titanium, chromium and nickel."
        ions_detected_as_printed: "Ca+, Mg+, Al+, AlO+, Al2O+, SiO+, SiO2+, O2+, K+, Na+, SO2+, Fe+, Ni+, Cr+, TiO+, TiO2+; WO2+ and WO3+; CaWO3+ and CaWO4+."
        tungsten_oxide_statement: "The WO2+ and WO3+ ions corresponded to gaseous tungsten oxide formed due to the interaction of oxygen in the gas phase with the material of the tungsten effusion cell."
        calcium_tungstate_statement: "The presence of CaWO3+ and CaWO4+ ions in the mass spectra is due to the gas phase reaction: CaO + WO_i = CaWO_(i+1)."
    - observation_id: shornikov_2023_pressure_conversion_context
      type: pressure_calibration_context
      locator:
        page: 1
        pdf_page_index: 0
        section: Results and Discussion
      units: "equation and calibration description"
      values:
        quantity: ion_current_to_partial_pressure_relation
        method_class: quoted_unattributed
        equation_as_printed: "p_i = (I_i T_i / I_s T_s) p_s × (σ_s η_s / σ_i η_i) = K (I_i T_i)/(σ_i η_i), equation (2)."
        definitions_as_printed: "I_i and I_s are ion-current intensities of studied and standard substances; σ_i and η_i are the effective ionization cross-section and isotopic distribution coefficient of species i."
        standard: "Gold partial pressure p_s from reference [3]."
        cross_section_reference: "Reference [4]."
        note: "No numerical ion-current, cross-section, isotope-correction, or pressure values are tabulated in this abstract."
    - observation_id: shornikov_2023_oxygen_calculation_context
      type: author_calculation_context
      locator:
        page: 2
        pdf_page_index: 1
        section: Results and Discussion
      units: "equations and qualitative interpretation"
      values:
        quantity: atomic_oxygen_pressure_reactions
        method_class: model_derived
        pO_basis_as_printed: "pO was calculated based on WO2 + O = WO3, equation (3)."
        comparison_reactions_as_printed: "Al + O = AlO (4); 2Al + O = Al2O (5); SiO + O = SiO2 (6); TiO + O = TiO2 (7); O2 = 2O (8)."
        correspondence_statement: "The obtained pO values (Fig. 2) satisfactorily corresponded to those determined on the basis of similar reactions involving atomic oxygen."
        interpretation_statement: "The correspondence of the calculated pO values for reactions (3)–(8) testified to the molecular origin of the recorded ions."
    - observation_id: shornikov_2023_hertz_knudsen_calculation_context
      type: author_calculation_context
      locator:
        page: 2
        pdf_page_index: 1
        section: Results and Discussion
      units: "equation and dimensionless coefficient"
      values:
        quantity: vaporized_oxide_calculation
        method_class: model_derived
        equation_as_printed: "Δq_i = α_i p_i / sqrt(2πRT/M_i), equation (9)."
        definition_as_printed: "M_i is a molecular weight of oxide."
        partial_evaporation_coefficient: 1.0
        coefficient_statement: "The partial evaporation coefficients (α_i), characterizing the change in the structure of a molecules during its transition to the gas phase, in this case are equal to 1 [5]."
        numeric_facts:
        - name: partial_evaporation_coefficient_alpha_i
          value: 1.0
          unit: dimensionless
          locator: {page: 2, pdf_page_index: 1, section: Results and Discussion}
    - observation_id: shornikov_2023_directional_and_qualifying_statements
      type: data_qualification_context
      locator:
        page: 2
        pdf_page_index: 1
        section: Results and Discussion
      units: "source prose; numeric_facts units are stated per value"
      values:
        quantity: author_qualifications_and_comparisons
        method_class: quoted_unattributed
        statements:
        - "The comparison of the temperature dependences of partial pressures of vapor species over CAIs melts of types A and B (Fig. 1 and 2) shows their approximate similarity."
        - "Note that the CaO and Al2O3 content in the condensed phase of CAIs type A is higher than in type B."
        - "At the same time there are some differences in the p_i temperature dependences of CAIs melts of types A and B."
        - "It can be seen that in CAIs type A melts MgO is the first to leave the melt, ahead of SiO2 that it follows from the position of the p_Mg and p_SiO maxima (Fig. 1)."
        - "On the contrary the MgO and SiO2 simultaneous exit from the melt that is specific for CAIs melts of type B."
        - "An interesting feature of the evaporation of CAIs melts of types A and B is the presence of SiO vapor specie in the gas phase to high temperatures exceeding 2500 K (Fig. 1). This indicates the presence of silicon dioxide in the condensed phase of CAIs melts."
        - "The calculated changes in CAIs melt compositions of types A and B during evaporation at 1800–2600 K are shown in Fig. 3. The interesting feature of CAIs melt evaporation is the similarity of changes in the compositions of residual melts of types A and B."
        numeric_facts:
        - name: SiO_vapor_presence_threshold_as_printed
          value: 2500.0
          unit: K (source says exceeding 2500 K)
          locator: {figure: '1', page: 2, pdf_page_index: 1, section: Results and Discussion}
        - name: residual_composition_figure_temperature_low
