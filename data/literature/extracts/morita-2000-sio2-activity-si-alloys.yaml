          ln_gamma0_Mg_l: 'ln γ°_Mg(l) = −11300/T + 4.51; refs. 4–5'
          epsilon_Ca_Ca: 'ε_Ca^Ca = 55600/T − 22.1; refs. 4–5'
          epsilon_Al_Al: 'ε_Al^Al = 1.00 × 10^5/T − 40.1; refs. 4–5'
          epsilon_Mg_Mg: 'ε_Mg^Mg = 6.02; refs. 4–5'
          epsilon_Ca_Al: 'ε_Ca^Al = 6.46; refs. 4–5'
          measured_here: 'No alloy activity coefficient or interaction parameter is measured in this paper; the alloy inputs in Table 1 are cited to refs. 4–5.'
          standard_state_notes: 'The printed reaction species use Si(l), Ca(l), Al(l), and Mg(l); the paper gives no separate prose definition of the superscript ° convention.'
