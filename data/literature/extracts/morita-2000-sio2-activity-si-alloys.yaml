        quote: 'Morita, Kume & Sano list the alloy auxiliary quantities in Table 1 from T. Miki, K. Morita & N. Sano (refs. 4–5), and cite R. G. Berman et al. (ref. 6), JANAF (ref. 7), and T. Wakasugi & N. Sano (ref. 8) for the standard Gibbs-energy expressions.'
