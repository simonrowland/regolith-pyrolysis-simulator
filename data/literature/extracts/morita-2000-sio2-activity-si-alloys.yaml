          standard_gibbs_energy_Ca: 'ΔG° = 156,000 − 20.0T J/mol; refs. 6–8'
          standard_gibbs_energy_Al: 'ΔG° = 132,100 − 14.31T J/mol; refs. 6–7'
          standard_gibbs_energy_Mg: 'ΔG° = 134,700 − 16.85T J/mol; refs. 6–7'
          ln_gamma0_Ca_l: 'ln γ°_Ca(l) = −14300/T + 1.55; refs. 4–5'
