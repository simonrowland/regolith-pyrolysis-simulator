schema_version: literature_extract.v1
source_id: chen-2020-ce2o3-cmas-activity-phase-equilibria
source:
  citation: 'Chen, X.; Deng, T.; Zhao, Z.; Yan, B. (2020). Thermodynamic Study on CaO-SiO2-Al2O3-5%MgO-10%Ce2O3
    Slag System: Liquide Lines and Distribution Behavior of Cerium at 1873 K. ISIJ International 60(8):1602–1609.'
  doi: 10.2355/isijinternational.ISIJINT-2019-683
  year: 2020
  corpus_asset: raw/chen-2020-ce2o3-cmas-activity-phase-equilibria/chen-2020-ce2o3-cmas-activity-phase-equilibria.pdf
  corpus_sha256: 2b85713ca35a54a13dd69e29dcc8ce086468692e48c43dcec3f5a6535d827128
extraction:
  method: Tables 1 and 2 manually transcribed from pdftotext -layout and checked against the rendered PDF pages.
    Table 1 has all 23 initial mixtures and 48 measured phase rows; Table 2 has 17 new rows and 2 starred inherited
    comparisons. Figures 1–9 are micrographs/XRD; Figure 10 visualizes Table 1 and its dotted joins are explicitly
    not data; Figure 11 is a FactSage calculation; Figures 12–14 show Table 2 data and fitted relations without
    additional independent values. No figures were digitized.
  date: '2026-11-10'
  worker: w1110xchen
  note: Table 1 initial cerium is printed as CeO2 while measured phase cerium is Ce2O3; these labels are preserved.
    Table 2 activity is retained as printed and scaled by its printed ×10^-7 multiplier. The paper adopts the Zhao
    et al. (2019) activity calibration; it does not print a Ce2O3 standard-state polymorph. No activity coefficient
    is inferred. Table 2 sample numbers 101–117 are distinct from Table 1 sample numbers. The starred observation
    IDs retain Zhao 2019 sample numbers only as a crosswalk; Chen prints an asterisk for those rows.
