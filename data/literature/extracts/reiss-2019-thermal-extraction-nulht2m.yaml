source_id: reiss-2019-thermal-extraction-nulht2m
source:
  citation: 'Reiss, P., Grill, L. & Barber, S.J. (2019), "Thermal extraction of volatiles from the lunar
    regolith simulant NU-LHT-2M: Preparations for in-situ analyses on the Moon", Planetary and Space Science,
    DOI 10.1016/j.pss.2019.05.001, accepted manuscript PII S0032-0633(18)30382-9, PSS 4666'
  doi: 10.1016/j.pss.2019.05.001
  url: http://dx.doi.org/10.1016/j.pss.2019.05.001
  year: 2019
extraction:
  method: Accepted-manuscript PDF (corpus raw/reiss-2019-thermal-extraction-nulht2m; Open Research Online
    cover is PDF page 1, Elsevier accepted-manuscript sheet is PDF page 2). Tables 1–2 and printed apparatus
    / thermal-program / peak-band / yield numbers transcribed from 350 dpi pdftoppm renders of PDF pages
    4–7, 10–13, 16–18 and 24. pdftotext-layout and MinerU used only as a table/figure inventory; they
    are not data. Figs 5–11 (hydration mass-gain, RGA partial-pressure curves, mass spectra, parameter
    comparisons) recorded figure-only except coefficients printed on Fig. 5. Figs 12–13 are simulated
    temperature fields, model_derived and figure-only. Yield mass fractions in §Volatiles yield are authors'
    integrals of the RGA curves with an assumed pump rate, labelled model_derived, not direct balance
    measurements. Table 2 mineralogy is quoted from Rickman and Lowers (2012), not this work.
  date: '2026-09-12'
  worker: extract-pyro-outgas
  provenance_path: docs-private/reviews/2026-09-12-pyrolysis-extracts/
