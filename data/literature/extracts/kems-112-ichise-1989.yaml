schema_version: literature_extract.v1
source_id: kems-112-ichise-1989
source:
  citation: Ichise, E. and Horikawa, K. (1989), "Thermodynamic Study of Fe-Ta and Fe-Nb Alloys by Means
    of the Knudsen Cell Mass Spectrometry", ISIJ International 29(10):843-851, DOI 10.2355/isijinternational.29.843
  doi: 10.2355/isijinternational.29.843
  url: https://doi.org/10.2355/isijinternational.29.843
  year: 1989
extraction:
  method: 'Official J-STAGE OA PDF (corpus raw/kems-112-ichise-1989/kems-112-ichise-1989.pdf, sha256 38753dce3d1f8556f3584620ea7dfb72eb1fda0b6c54dd3e945faf05180c360b).
    No MinerU decode. Tables 1-6 transcribed from a 400 dpi pdftoppm render of PDF pages 1-9 (published
    pp. 843-851). pdftotext-layout is a noisy OCR layer and was not used as data. Table 1/5 a_Fe from
    ion-intensity ratios labelled measured. Tables 4 and 6 gamma/Delta-G/a_Ta/a_Nb labelled model_derived
    (Gibbs-Duhem). Table 2 metallography measured. Table 3 EPMA boundaries measured; Average row model_derived.
    Figs 1-7 figure-only. Ionizing energy unstated. Sample mass unstated for KEMS (metallography samples
    about 2 g). Chamber pressure printed: ion source ~5e-5 Pa, cell chamber ~1e-4 Pa. gamma0_Ta(l) body
    0.31±0.07 vs conclusion 0.31±0.06 both retained. L4 2026-09-22: Table 1 Fe-Ta and Table 5 Fe-Nb molar
    fractions landed as per-heat fe-ta-xta-* / fe-nb-xnb-* experiments with Fe complement; table1/table5
    a_Fe rows split onto those experiments. Table 3 EPMA phase boundaries not used as bulk charge. Vacuum
    KEMS: no fO2 invented.'
  date: '2026-09-13'
  worker: extract-alloys-b2
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
