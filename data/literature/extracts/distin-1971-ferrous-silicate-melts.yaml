schema_version: literature_extract.v1
source_id: distin-1971-ferrous-silicate-melts
source:
  citation: 'Distin, P. A., Whiteway, S. G. & Masson, C. R. (1971), "Thermodynamics and constitution of ferrous silicate melts", Canadian Metallurgical Quarterly 10(2):73-78.'
  doi: 10.1179/cmq.1971.10.2.73
  year: 1971
  sha256: 3049d522612c3c141afa47a7d4c31b1eb5b00fd9099d42630f7cf19e526d3f06
source_tables:
  experimental_results:
    locator: {page: 74, table: 'Experimental results'}
    title: Experimental results
    columns: [initial SiO2 in slag (%), final FeO (%), final Fe2O3 (%), final SiO2 (%), oxygen in metal (%), time of equilibration (sec), activity of FeO]
    note: No numeric uncertainty is printed for the table measurements. The p. 74 experimental text states, 'For each experiment 0.31 ±0.015 gram of slag and 3.3 ± 0.09 grams of iron were employed.'
    row_count: 24
    standard_state:
      text: Activities of 'FeO' were obtained as the ratio of the oxygen content of the iron in equilibrium with the slag to that in equilibrium with pure 'FeO' at the same temperature.
      locator: {page: 74, section: Experimental}
      interpretation: The p. 75 Discussion identifies the measured standard state as nonstoichiometric oxide in equilibrium with liquid iron; conversion to the stoichiometric oxide is a later step.
source_evidence:
  liquid_iron_contact:
    text: >-
      In this method, liquid iron was levitated in contact with liquid 'FeO'-SiO2
      slags and samples of slag and metal at equilibrium were withdrawn for
      analysis.
    locator: {page: 73}
  atmosphere:
    text: >-
      Melts were equilibrated in helium or argon + helium atmospheres of the
      same composition and flow rate as previously employed, so that the
      temperatures of equilibration were 1785°, 1880° and 1960°C.
    locator: {page: 74, section: Experimental}
extraction:
  method: Manual transcription from layout-preserving pdftotext, checked against the p. 73-74 page renders.
  date: '2026-10-16'
  worker: codex
review_status: draft
