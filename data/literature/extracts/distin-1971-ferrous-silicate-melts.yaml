species:
  FeO:
    observations:
      - observation_id: distin1971_t1_1785_1_4
        experiment: distin1971-1785c
        type: activity_coefficient
        locator: {page: 74, table: 'Experimental results', row: '1785 C, initial SiO2 1.4%'}
        phase: liquid FeO-SiO2 slag
        derived_from: [&distin_source_asset pdf:distin-1971-ferrous-silicate-melts]
        derivation: &distin_activity_derivation
          relation: >-
            a_FeO = O_metal / O_sat(T). The p. 74 Experimental method sentence states:
            "Activities of 'FeO' were obtained as the ratio of the oxygen content of the iron in equilibrium with the slag to that in equilibrium with pure 'FeO' at the same temperature." O_metal is this row's printed values.oxygen_in_metal_wt_percent_as_printed (printed p. 74, table Experimental results). The p. 75 Results sentence states that the measured oxygen values are divided by the saturation values "0.44, 0.63 and 0.83 per cent at 1785°, 1880° and 1960°C, respectively" (printed p. 75). O_sat(T) therefore uses 0.44 wt% at 1785 °C, 0.63 wt% at 1880 °C, and 0.83 wt% at 1960 °C. At 1960 °C, all seven printed activities through initial SiO2 31.9 wt% equal round(O_metal / 0.84, 3), although the p. 75 sentence states 0.83 wt%. Worked row: initial SiO2 38.6 wt% has O_metal = 0.38 wt% and printed activity 0.456; round(0.38 / 0.84, 3) = 0.452, while round(0.38 / 0.83, 3) = 0.458. The printed activity remains unchanged.
          inputs: [*distin_source_asset]
          output_unit: dimensionless
        standard_state: &distin_wustite_standard_state_1785
          state:
            tag: value
            value:
              convention: raoultian_pure_endmember
              endmember:
                formula: Fe(1-x)O
                phase: {tag: value, value: l}
                polymorph:
                  tag: not_applicable
                  reason: non-stoichiometric liquid wüstite has no crystalline polymorph
                charge: {tag: value, value: 0}
              component_basis: Fe(1-x)O
              reference_pressure_bar: '1.01325'
              iron_saturation_composition:
                method: derived_from_source_analyses
                composition_as_printed: Table I final slag oxide analyses; derived N0 limit
                quote: >-
                  Activities of FeO, as measured in this study, refer to the nonstoichiometric oxide in
                  equilibrium with liquid iron at the temperature of measurement as the standard state.
                locator: {page: 74, table: 'Experimental results'}
                n_fe2_plus: '0.9786949448512436295642817507'
                provenance: >-
