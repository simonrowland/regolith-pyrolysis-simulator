source_metadata:
  table1:
    class_tag: metadata
    locator:
      page: 5
      table: '1'
      pdf_page_index: 10
    title: Typical Coal-Conversion and Combustion Systems
    rows:
    - section: Conventional Steam Plants
      process: ''
      temperature_K_as_printed: 1000-1500
      pressure_atm_as_printed: '1'
      comments_as_printed: ''
      quote: Conventional Steam Plants | 1000-1500 | 1
    - section: Pressurized Fluidized Bed Combustion
      process: ''
      temperature_K_as_printed: '1200'
      pressure_atm_as_printed: 1-10
      comments_as_printed: 2 % excess O2, 300 ppm SO2
      quote: Pressurized Fluidized Bed Combustion | 1200 | 1-10 | 2 % excess O2, 300 ppm SO2
    - section: Coal Gasification[a,b,c]
      process: Cogas
      temperature_K_as_printed: 570-2250
      pressure_atm_as_printed: 3-6
      comments_as_printed: entrained/slag
      quote: Coal Gasification[a,b,c] | Cogas | 570-2250 | 3-6 | entrained/slag
    - section: Coal Gasification[a,b,c]
      process: Koppers-Totzek[d]
      temperature_K_as_printed: 1750-2100
      pressure_atm_as_printed: '0'
      comments_as_printed: entrained/slag, medium btu
      quote: Coal Gasification[a,b,c] | Koppers-Totzek[d] | 1750-2100 | 0 | entrained/slag, medium btu
    - section: Coal Gasification[a,b,c]
      process: Bi-gas
      temperature_K_as_printed: 1200-1920
      pressure_atm_as_printed: 66-100
      comments_as_printed: entrained/slag
      quote: Coal Gasification[a,b,c] | Bi-gas | 1200-1920 | 66-100 | entrained/slag
    - section: Coal Gasification[a,b,c]
      process: Atgas
      temperature_K_as_printed: 480-1750
      pressure_atm_as_printed: 0-0.3
      comments_as_printed: molten iron
      quote: Coal Gasification[a,b,c] | Atgas | 480-1750 | 0-0.3 | molten iron
    - section: Coal Gasification[a,b,c]
      process: Kellogg
      temperature_K_as_printed: 1100-1480
      pressure_atm_as_printed: 27-80
      comments_as_printed: molten salt
      quote: Coal Gasification[a,b,c] | Kellogg | 1100-1480 | 27-80 | molten salt
    - section: Coal Gasification[a,b,c]
      process: CO2 Acceptor
      temperature_K_as_printed: 1100-1370
      pressure_atm_as_printed: 10-20
      comments_as_printed: fluidized (dolomite)
      quote: Coal Gasification[a,b,c] | CO2 Acceptor | 1100-1370 | 10-20 | fluidized (dolomite)
    - section: Coal Gasification[a,b,c]
      process: Hygas
      temperature_K_as_printed: 920-1300
      pressure_atm_as_printed: 66-100
      comments_as_printed: fluidized, high btu, high S
      quote: Coal Gasification[a,b,c] | Hygas | 920-1300 | 66-100 | fluidized, high btu, high S
    - section: Coal Gasification[a,b,c]
      process: Synthane
      temperature_K_as_printed: 370-1260
      pressure_atm_as_printed: 33-66
      comments_as_printed: entrained/fluidized, high btu
      quote: Coal Gasification[a,b,c] | Synthane | 370-1260 | 33-66 | entrained/fluidized, high btu
    - section: Coal Gasification[a,b,c]
      process: Lurgi
      temperature_K_as_printed: 870-1260
      pressure_atm_as_printed: 20-33
      comments_as_printed: fixed bed, low btu
      quote: Coal Gasification[a,b,c] | Lurgi | 870-1260 | 20-33 | fixed bed, low btu
    - section: Magnetohydrodynamics
      process: Open cycle--hot walls
      temperature_K_as_printed: 1500-3000
      pressure_atm_as_printed: 1-10
      comments_as_printed: 1 % K seed, fuel rich or stoichiometric
      quote: Magnetohydrodynamics | Open cycle--hot walls | 1500-3000 | 1-10 | 1 % K seed, fuel rich or
        stoichiometric
    footnotes:
      a: Comparable conditions exist in ammonia plant secondary reformers, e.g., 1060K, 13 to 20 atm,
        28 percent H2, 50 percent H2O, 6.4 percent CO, and 4 percent CO2.
      b: After Crowley (1975).
      c: For technological status, see Vorres (1980) and Lenzer and Laurendeau (1976).
      d: In commercial operation.
      e: 1 atm = 1.01325 x 10^2 kpascal.
    note: Typical process conditions compiled by authors, not KEMS observations. Printed zero pressures
      preserved as text without reinterpretation.
