          figure_caption_as_printed: "Figure 4. Comparison between the current experimental iron vapor-pressure data and available published data. Shown in the figure are experimental data from: ○, the current experimental work; ▼, Darken and Gurry,⁹; ◇, Mikulinskii and Umova,¹⁰; triangle pointing right, Wessel,¹¹ 1951; triangle pointing left, Vintaikin,¹² 1957; ×, Turkdogan and Leake,¹³ 1960; □, Smith and Shuttleworth,¹⁴ 1965; △, Karasev et al.,¹⁵ 1971; ▽, Yavoiskii et al.,¹⁶ 1971; and +, Lindscheid and Lange,¹⁷ 1975. Fits to experimentally measured data are shown for Zellars et al.,¹⁸ 1959 (bold dotted line); Chegodaev et al.,¹⁹ 1978 (solid line); Bodrov et al.,²⁰ 1982 (dotted line); and Zaitsev et al.,²¹ 1990 (bold solid line). The compilation of iron data by Desai 1986 (dashed line) is also shown in the figure."
