        type: relation
        locator: {page: 4, pdf_page_index: 3, published_page: 500, section: Results}
        units: kJ/mol
        values:
          method_class: model_derived
          quotation_as_printed: "By assumption of negligible error in the thermodynamic data, the error levels for the individual data points shown in Figure 3 and Table 1 correspond to an approximately ±3 kJ/mol deviation in individual enthalpy calculations. An inverse square of these individual error levels was used to calculate a mean enthalpy of vaporization at 298.15 K of ΔH = 431.2 ± 0.4 kJ/mol, where the error level is based on the standard deviation of this mean value."
          value_kJ_mol: 431.2
          uncertainty_kJ_mol_as_printed: 0.4
