extraction:
  method: >-
    Manual transcription from the rendered page image for Table 1, checked independently by rows and columns; prose and equation checked against the page render. The paper identifies the sample only as “a sample of iron (99.97% purity)” (p. 497, Experimental Equipment) and “a sample of high-purity (99.97%) iron” (p. 498, Experimental Procedure); supplier and physical form are not stated. Purity basis is unstated (mass or mole). Bound: for 0.03% impurity of even the lightest plausible impurity (C, 12 g/mol), the impurity mole fraction is <= (0.03/12) / (99.97/55.85 + 0.03/12) = 0.0025/1.7925 = 0.14 mol %, so the sample is >=99.86 mol % Fe under either purity basis.
