extraction:
  method: Official J-STAGE OA PDF (corpus raw/kems-120-ueshima-1984/kems-120-ueshima-1984.pdf, sha256
    0f99f1d9b4c851d8d666ca8d1f02f80c9c8e8537a885f5cc9ab4fd22e6dad8ff). No MinerU decode. Tables 1-4 transcribed
    from a 400 dpi pdftoppm render of PDF pages 1-8 (published pp. 549-556). pdftotext-layout is a noisy
    OCR layer and was not used as data. Two-phase a_Fe averages labelled measured. ln-gamma fits, Gibbs-Duhem
    a_W, and Tables 2-3 partial molar quantities labelled model_derived. Table 4 Fe-Mo is a height-correction
    of the authors' prior KEMS (ref 6), labelled model_derived. Figs 1-11 figure-only. Japanese running
    prose unseen except language-independent numbers and English captions/abstract. Chamber pressure numeric
    value unstated.
