    - observation_id: bowles_rosenblum_1965_na_fit_this_work
      experiment: sodium-vapor-pressure-series
      type: psat_series
      locator:
        published_page: 7
        pdf_page_index: 9
        equation: '1'
      T_range_K:
      - 1072
      - 2154
      phase: liquid_sodium
      standard_state: sodium vapor pressure in atm; temperature in K
      regime: author_least_squares_integrated_clausius_clapeyron_fit
      units: atm as published
      uncertainty:
        standard_deviation: 3.2 percent in p
      values:
        quantity: pure_vapor_pressure_fit
        gas_species: Na(g)
        method_class: model_derived
        model_generator: authors' least-squares fit of the 49 Table I static-capsule measurements using a two-constant integrated
          Clausius-Clapeyron equation
        log_p_equation: log10(p_atm) = 4.51961 - 5202.12/T_K
