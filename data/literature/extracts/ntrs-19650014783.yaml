species:
  Na:
    observations:
    - observation_id: bowles_rosenblum_1965_na_method_and_apparatus
      experiment: sodium-vapor-pressure-series
      type: rate_series
      locator:
        published_page: 2
        pdf_page_index: 4
        section: Experiment - Apparatus and Procedure
      phase: liquid_sodium
      standard_state: sodium vapor in equilibrium with sodium in a closed capsule
      regime: static_capsule_equilibrium
      units: as published
      uncertainty:
        temperature_measurement: ±0.25 percent on the Kelvin scale
        pressure_runs_1_to_4: ±0.12 atm up to 50 atm; ±0.40 atm over 50 atm
        pressure_run_5: ±0.013 atm for the 0-3.4 atm transducer; ±0.06 atm for the 0-34 atm transducer
      values:
        quantity: vapor_pressure_measurement_method
        method_class: method_only
        evidence_class: measured_direct
        method: static capsule; heat a quantity of sodium in a closed capsule and measure pressure at test temperatures
        equilibrium_statement: sufficient time was allotted between temperature changes for capsule and contents to reach
          equilibrium temperature
        sodium_purification:
          feed_description: as-received chemically pure sodium filtered through a 20-micron stainless-steel filter, hot gettered
            with titanium, then vacuum distilled into stainless-steel storage containers
          oxygen_content_ppm_range:
          - 50
          - 100
          oxygen_content_note: analysis of several storage containers 1 to 2 years after purification
        pressure_measurement:
          runs_1_to_4: four overlapping pressure-transducer ranges, 0-238, 0-340, 0-544, and 0-680 atm
          run_5: two pressure-transducer ranges, 0-3.4 and 0-34 atm
          calibration: all transducers calibrated at 120 C with a standard dead-weight piston gage
        apparatus_details:
          capsule_dimensions:
            value: 25.4 cm long; 2.54 cm outside diameter; 1.77 cm inside diameter
            locator:
              published_page: 2
              pdf_page_index: 4
              section: Experiment - Apparatus
          pressure_capillary_dimensions:
            value: 8.9 cm long; 0.32 cm outside diameter; 0.25 cm inside diameter
            locator:
              published_page: 2
              pdf_page_index: 4
              section: Experiment - Apparatus
          heater:
            value: tungsten resistance heater concentric around capsule, extending 3.8 cm beyond both ends
            locator:
              published_page: 2
              pdf_page_index: 4
              section: Experiment - Apparatus
          vacuum_chamber:
            value: steel vacuum bell jar with external cooling coils and optical sight port
            locator:
              published_page: 2
              pdf_page_index: 4
              section: Experiment - Apparatus
          injector_volume:
            value: 27 ml; piston displacement calibrated to 0.01 ml
            locator:
              published_page: 3
              pdf_page_index: 5
              section: Experiment - Apparatus
          storage_tank_inventory:
            value: about 1 pound of sodium
            locator:
              published_page: 3
              pdf_page_index: 5
              section: Experiment - Apparatus
          temperature_sensors:
            value: Chromel-alumel in run 1; tungsten-rhenium in runs 2 to 4; Pt-Pt-13 percent Rh in run 5
            locator:
              published_page: 4
              pdf_page_index: 6
              section: Temperature measurements
          temperature_calibration:
            value: Pt-Pt-13Rh against NBS standardized thermocouple; W-Re against Pt-Pt-13Rh from 845 to 1820 K, extrapolated
              to 2200 K with deviation no more than 6 K
            locator:
              published_page: 4
              pdf_page_index: 6
              section: Temperature measurements
          purge_gas:
            value: argon
            locator:
              published_page: 3
              pdf_page_index: 5
              section: Procedure
          thermal_equilibration:
            value: capsule heated through a series of test temperatures; time allowed for equilibrium
            locator:
              published_page: 3
              pdf_page_index: 5
              section: Procedure
      equipment:
        cell_material:
          value: 90 percent tantalum and 10 percent tungsten alloy capsule
          locator:
            published_page: 2
            pdf_page_index: 4
            section: Experiment - Apparatus
