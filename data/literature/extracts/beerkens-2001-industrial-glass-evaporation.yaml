extraction:
  method: >-
    Born-digital layout text and the MinerU table draft were compared. Table 1
    dust and specific emissions and its filter-dust composition have no matching
    species-level token for these generalized furnace ranges; Table 2 is
    explicitly estimated from models; Table 3's measured dust and Na2O totals
    use kg/t glass rather than a rate or mass fraction, and its NaOH pressures
    are model-derived. The four numeric CO pressures in Table 3 are typed as
    measured partial pressures; the fifth is a printed upper bound. Table 3's
    five furnace columns were transcribed from its 600-dpi render. Figures 1–10
    are metadata only with no digitized points.
