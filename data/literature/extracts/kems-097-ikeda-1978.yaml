  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 167
  table: '1'
  quote: >-
    Table 1. Third-law reaction enthalpy for reaction (1). Header: T | -log Kp |
    -Delta fef (cal K-1 mole-1) | Delta H degrees 298 (Kcal mole-1). Rows:
    2413 | 26.93 | 180.15 | 732.1; 2413 | 27.91 | 180.15 | 742.9;
    2433 | 27.02 | 180.12 | 739.1; 2388 | 26.99 | 180.18 | 725.2;
    2363 | 27.92 | 180.22 | 727.8; 2333 | 28.96 | 180.27 | 729.7;
    2313 | 30.24 | 180.30 | 737.1; 2283 | 31.09 | 180.36 | 736.6;
    2248 | 31.13 | 180.38 | 725.7; Average | 732.9. The average Delta H
    degrees 298 from the third law for this reaction is 732.9 +/- 10 Kcal/mole,
    which is in good agreement with the reference value 739.2 Kcal/mole.
    Al2O3(c) = 2 Al(g) + 3 O(g) (1). The equilibrium constant Kp and the third
    law Delta H degrees 298 for these reaction shown in Table 1 were obtained on
    combining the partial pressures and the free energy function change referenced
    in JANAF data.
- observation_id: ikeda_1978_kems_geometry_and_calibration
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 160-167
  quote: >-
    Impurities in this specimen were Mg and Ca less than 0.5%. The Knudsen cell
    assembly used in this experiment is shown in Fig. 1. This has two parts, one
    being an inner effusion cell which is fabricated from above various refractory
    metals and another being an outer cell supporter machined from tungsten block.
    The Knudsen cell assembly is heated up to experimental temperature by electron
    bombarding. A vaporized molecular beam enters the ionization chamber of a sector
    type single focussing mass spectrometer (HITACHI) and is ionized by a electron
    beam accelerated to 30 eV. A dinode type SEM is used as a detector. The gains of
    Al+ and Al2O+ were directly measured and those of rather smaller peak ions were
    estimated from interpolating a calibration curve. Absolute partial pressures of
    vapor species are estimated from silver calibration method. Through the vertical
    hole, (2.0 mm dia.) molecular beams vaporized enter from the lower Knudsen cell
    chamber into the upper ion source chamber. On the other hand, through the
    horizontal hole, (4.0 mm dia.) a rod-like shutter fabricated from a tantalum
    sheet goes in and out by outer operation. Since the clearance of the rod-like
    shutter and the stainless steel block is less than 0.1 mm, the penetration of
    non condensable gases could be interrupted sufficiently. The appearance
    potentials found for the species were 6.0 +/- 0.5 eV for Al, 9.5 +/- 0.5 eV for
    AlO and 8.7 +/- 0.5 eV for Al2O. In order to detect O+ ion effectively, ionizing
    electron energy of 30 eV was used. No other vapor species could be found, the
    search being made up to mass 300. The error of silver calibration is estimated
    to be within +/-20%. The error due to temperature distribution is similarly
    estimated to be within +/-20%. Another error due to ion currents measurements is
    also estimated to be within +/-10%. Consequently the error of this work is
    totally within 50%, this is shown in Fig. 3 by an error bar. The ratios of P(O)
    to P(Al) were about 1.0 over tungsten cell. If a neutral condition and congruently
    evaporation was reached the ratio was estimated to be 1.15. By a non equilibrium
    method, the ratio being 1.4 was reported.
    Table 1 temperature entries run from the printed 2248 K row through the printed
    2433 K row.
- observation_id: ikeda_1978_al_w_al2o3_psat_fig3_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 162-167
  figure: '3'
  quote: >-
    Fig. 3. Partial pressures (atm) of the vapor species in the W-Al2O3 system as
    a function of 1/T x 10^4 K-1. Printed figure labels: 2400 K; 2200 K; Al; O;
    AlO; Al2O; WO; WO2; WO3; FARBER et al; J. DROWART et al; -LOG P, ATM;
    10^4/T (K). As shown from the figure, slightly higher values of vapor pressures
    for Al and O are obtained in this work, while those of AlO indicate rather low
    values. The error of this work is totally within 50%, this is shown in Fig. 3
    by an error bar.
- observation_id: ikeda_1978_al_mo_al2o3_psat_fig4_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 163-167
  figure: '4'
  quote: >-
    Fig. 4. Partial pressures (atm) of the vapor species in the Mo-Al2O3 system as
    a function of 1/T x 10^4 K-1. Printed figure labels: 2400 K; 2200 K; Al; O;
    AlO; Al2O; Mo; MoO; MoO2; J. DROWART et al; -LOG P, ATM; 10^4/T (K).
    For the partial pressures of Al, AlO and Al2O, the values obtained in this work
    were lower than those of the reference, while for O and molybdenum oxides higher
    values were obtained. The partial pressures of Al and O for molybdenum cell are
    slightly higher than those for tungsten. The error of this work is totally
    within 50%.
- observation_id: ikeda_1978_al_ta_al2o3_psat_fig5_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 164-167
  figure: '5'
  quote: >-
    Fig. 5. Partial pressures (atm) of the vapor species in the Ta-Al2O3 system as
    a function of 1/T x 10^4 K-1. Printed figure labels: 2200 K; 2000 K; Al; AlO;
    Al2O; Ta; TaO; TaO2; REACTION; -LOG P, ATM; 10^4/T (K). At lower temperature
    region, the partial pressures of Al and Al2O in both tantalum and niobium cells
    are about one order higher than in tungsten or molybdenum cells. When the
    temperature of the cell reached at a level (1950 K for Ta and 2000 K for Nb),
    rapid increasing of those pressures were started. At the temperature (2083 K
    for Ta and 2045 K for Nb), the cells was kept on this constant temperature for
    about two hours until the pressures revealed comparatively stable values. The
    error of this work is totally within 50%.
- observation_id: ikeda_1978_al_nb_al2o3_psat_fig6_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 165-167
  figure: '6'
  quote: >-
    Fig. 6. Partial pressures (atm) of the vapor species in the Nb-Al2O3 system as
    a function of 1/T x 10^4 K-1. Printed figure labels: 2200 K; 2000 K; Al; AlO;
    Al2O; Nb; NbO; NbO2; REACTION; -LOG P, ATM; 10^4/T (K). When the temperature
    of the cell reached at a level (1950 K for Ta and 2000 K for Nb), rapid
    increasing of those pressures were started. At the temperature (2083 K for Ta
    and 2045 K for Nb), the cells was kept on this constant temperature for about
    two hours. In the niobium cell, rapid increase of vapor pressures were revealed
    again at the cell temperature 2155 K. The error of this work is totally within
    50%.
- observation_id: ikeda_1978_al_p_vs_dgf_fig7_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 168-169
  figure: '7'
  quote: >-
    Fig. 7. Pressures of Al (atm) over various metal-Al2O3 systems at 1920 K versus
    the free energy of formation of metal oxides, assuming those to be formed by
    reduction of Al2O3 in the cells. The dotted line is a rough approximation.
    The presumed oxides are WO3 for W, MoO2 for Mo, Ta2O5 for Ta and NbO for Nb,
    but such selections of composition of oxides are speculative.
- observation_id: ikeda_1978_alo_third_law_rxn2_average
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 167
  quote: >-
    Al(g) + O(g) = AlO(g) (2). For the reaction (2) the Delta H degrees 298 obtained
    is -111.9 +/- 6 Kcal/mole whose reference data is -121.1 Kcal/mole. Table 1
    temperature entries run from the printed 2248 K row through the printed 2433 K
    row.
- observation_id: ikeda_1978_alo_psat_figs3to6_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 162-167
  figure: 3-6
  quote: >-
    Figs. 3-6 print AlO in the vapor-species legends; their temperature-axis labels
    span 2400 K and 2200 K for W-Al2O3 and Mo-Al2O3, and 2200 K and 2000 K for
    Ta-Al2O3 and Nb-Al2O3. The partial pressures of AlO and Al2O obtained in this
    work are in good agreement with those of J. Drowart et al., but not so good with
    Farber et al. Consequently, the smaller values of AlO partial pressures may be
    characteristic in the tungsten-Al2O3 system. The error of this work is totally
    within 50%.
- observation_id: ikeda_1978_al2o_third_law_rxn3_average
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 167
  quote: >-
    Al2O(g) = Al(g) + AlO(g) (3). For the reaction (3) the Delta H degrees 298 =
    134.4 +/- 6 Kcal/mole is obtained which corresponds to the literature value
    128.2 Kcal/mole. Table 1 temperature entries run from the printed 2248 K row
    through the printed 2433 K row.
- observation_id: ikeda_1978_al2o_psat_figs3to6_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 162-167
  figure: 3-6
  quote: >-
    Figs. 3-6 print Al2O in the vapor-species legends; their temperature-axis labels
    span 2400 K and 2200 K for W-Al2O3 and Mo-Al2O3, and 2200 K and 2000 K for
    Ta-Al2O3 and Nb-Al2O3. At lower temperature region, the partial pressures of Al
    and Al2O in both tantalum and niobium cells are about one order higher than in
    tungsten or molybdenum cells. The vapor species such as Al2O2 or AlO2 were
    reported by previous experiments. However, we could not detect such species.
    The error of this work is totally within 50%.
- observation_id: ikeda_1978_o_w_mo_psat_figs3_4_figure_only
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 161-167
  figure: 3-4
  quote: >-
    Figs. 3 and 4 print O in the vapor-species legends and print temperature-axis
    labels 2400 K and 2200 K. In order to detect O+ ion effectively, ionizing
    electron energy of 30 eV was used. The partial pressures of Al and O obtained
    using tungsten cells in this work are in good agreement with those of the
    reference within error factor. The ratios of P(O) to P(Al) were about 1.0 over
    tungsten cell. The error of this work is totally within 50%.
- observation_id: ikeda_1978_o_ta_nb_true_absence
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 161-165
  figure: 5-6
  quote: >-
    While in tantalum and niobium cells, the observed vapor species were Al and Al2O
    as major components. AlO ion was rather small. On the other hand, comparatively
    high metal and metal oxide ions were identified, which were Ta, TaO, TaO2 and Nb,
    NbO, and NbO2. O and O2 vapor species could not be observed in these cases.
    Figs. 5 and 6 print temperature-axis labels 2200 K and 2000 K.
- observation_id: ikeda_1978_o2_estimated_one_order_below_o
  field: quote
  old: omitted
  new: recorded_in_correction_entry
  page: 161
  quote: >-
    O2 was scarcely observed due to presence of rather high background. From the
    estimated decomposition equilibrium constant, the partial pressures of O2 were
    about one order smaller than those of O atom.
