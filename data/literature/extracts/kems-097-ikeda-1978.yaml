source:
  citation: Ikeda, Y., Tamaki, M. & Matsumoto, G. (1978), "A Mass Spectrometric Study of Vaporization
    of Refractory Metal-Al2O3 Systems in Elevated Temperature", J. Mass Spectrom. Soc. Jpn. 26(2):159–169,
    DOI 10.5702/massspec1953.26.159
  doi: 10.5702/massspec1953.26.159
  url: https://doi.org/10.5702/massspec1953.26.159
  year: 1978
extraction:
  method: Official J-STAGE VOR PDF (https://www.jstage.jst.go.jp/article/massspec1953/26/2/26_2_159/_pdf).
    Scanned CCITT pages; pdftotext -layout is a noisy OCR layer, not used as data. Table 1 transcribed
    from a 400 dpi pdftoppm render of PDF page 9 (published p. 167). Figs 1–7 listed figure-only; Clausius–Clapeyron
    grids were not digitised. Measured KEMS third-law Table 1 kept distinct from Farber/Drowart comparison
    values, from JANAF-fef-derived gas equilibria (2)–(3), and from the authors' estimated p(O2).
    r2 wave-W2-ikeda-1978-r2. T_range_K min 1850.0 replaced with Table 1 lowest printed T 2248.
    Geometry retyped as method metadata (not a measured rate). Estimated p(O2) and Fig. 7
    correlation labelled model_derived.
