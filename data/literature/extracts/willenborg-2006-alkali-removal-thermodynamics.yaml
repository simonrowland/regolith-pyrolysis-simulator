schema_version: literature_extract.v1
source_id: willenborg-2006-alkali-removal-thermodynamics
source:
  citation: 'Willenborg, W., Müller, M., & Hilpert, K. (2006). Alkali Removal at About 1400 °C for the Pressurized Pulverized Coal Combustion Combined Cycle. 1. Thermodynamics and Concept. Energy & Fuels, 20(6), 2593–2598.'
  doi: 10.1021/ef060305k
  year: 2006
extraction:
  method: >-
    Transcribed the two printed composition tables from MinerU HTML and the
    exact born-digital pdftotext layer, then audited all table values and row
    assignments against the 200-dpi page render. MinerU table QA reports full
    numeric agreement for both tables. Extracted only approximate activity
    values explicitly printed in the text; values available only in Figures
    3–9 were not digitized (Figure 5 is calculated). The authors calculate
    Na2O activity from stoichiometric Na2O(l,s) vaporization, assume ideal gas
    behavior, neglect dimers, monoxides, and atomic oxygen, use pO2 = pNa/4,
    and take Kp from the FACT pure-substance database. The activity values
    reduce measured partial pressures through Eq. 3, but the pressure inputs
    for these points are not stored, so the reported activities are
    quoted_attributed. The calibration
    constant was determined against pure silver partial pressure. The source
    does not report the KEMS run total pressure or oxygen fugacity; the
    apparatus vacuum statement is not assigned to the sample as a pressure.
  date: '2026-10-27'
  worker: w1027na4-will06
  scope_notes:
    - 'Boiler-slag activity values are retained as typed refusals. The 5% and 10% prose summaries combine SiO2 and TiO2 treatments without per-treatment compositions; the untreated Table 1 analysis totals 92.9 mass percent, with the remainder unreported.'
    - 'The approximately 0.6 Pa and 0.3 Pa alkali partial pressures are retained as typed refusals because the source does not name a gas species.'
    - 'The comparison of about two times higher Na2O activity for AlSi8Mg8Na5 than AlSi8Mg4Na5 gives no absolute activity value and refers to two compositions; it is retained as a typed refusal.'
    - 'Figure 5 is calculated and not extracted. Figs. 3–4 and 6–9 contain measured plotted values only; no values were digitized.'
