scope_assessment:
  included: All 12 Table 1 rows and all 11 Table 2 rows; CaO activities, printed SiO2/Al2O3 activity inputs,
    and the row-specific printed wt% and mol% compositions.
  activity_row_count:
    CaO: 31
    SiO2_inputs: 22
    Al2O3_inputs: 10
