    both are unknown, with no ambient or standard-pressure assumption.
  method_context: This article calculates CaO activity using previously measured e.m.f. double-cell SiO2
    and Al2O3 activities. It does not report a new gas-equilibration or crucible experiment for these
    table rows.
  figure_read_candidates:
  - Figures 5 and 8 contain additional CaO activity curves; no values were extracted from the figures.
