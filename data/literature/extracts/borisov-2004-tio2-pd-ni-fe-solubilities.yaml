extraction:
  method: Born-digital pdftotext-layout.txt was the primary transcription source. The MinerU table converter had no MinerU
    table drafts for this source, so Tables 1 and 2 were transcribed manually. Every Table 1 and Table 2 cell, including dittos
    and explicit dashes, was checked against the 600 dpi render of physical PDF page 2. The table row grids are independently
    pinned in the focused test. Table 1 ditto marks are expanded only for the same-run temperature, duration, and fO2 printed
    condition. Printed −log fO2 values are preserved and represented in canonical fO2_log with the standing bar convention
    because Table 1 gives no reference; no fO2 was computed. Table 2 footnotes explicitly give atm. The methods report uncertainties
    not exceeding ±0.1 in cited log fO2 and ±2 °C in temperature. Equilibrated melts are represented as liquid at T with the
    F14 quench-provenance encoding. Fits and figure points remain unscored context.
