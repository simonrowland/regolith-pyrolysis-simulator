source_id: greig-1927-immiscibility-part2
source:
  citation: J. W. Greig, “Immiscibility in Silicate Melts. Part II,” American Journal of Science, 5th series, 13
    (74), 133–154 (1927).
  doi: 10.2475/ajs.s5-13.74.133
  year: 1927
extraction:
  method: Manual transcription from MinerU HTML tables and MinerU Markdown; the independent Tesseract OCR was used
    as the second machine read, with page renders resolving disagreements and layout assignment.
  date: '2026-11-08'
  worker: w1108gr-gr27b
  provenance_path: tables/greig-1927-immiscibility-part2/
review_status: draft
scope_assessment:
  in_scope:
  - Small-charge FeO-SiO2 run outcomes at the printed 5 and 40 per cent FeO limits, with their approximate 1700° run temperature, on physical p. 2.
  - Table VIII FeO-rich phase assays A and B and the Table VIII C charge analysis/context.
  - All nine Table IX and all four Table X quench/run-product rows.
  - The four printed pairs of conjugate limb compositions and four equilibrium temperatures in the unnumbered summary
    on physical p. 21.
  - The separate FeO-SiO2 control-temperature bracket 1679°–1698° and 1689° ± 10° estimate on physical p. 4.
  - Numerical B2O3-SiO2 results quoted from previous work and relevant printed composition discrepancies.
  out_of_scope:
  - 'Figure-only curves and locations: Fig. 27 FeO-SiO2 (physical p. 11); Fig. 28 MgO-FeO-SiO2 (p. 12); Fig. 29
    overview (p. 15); Fig. 30 composition relations (physical p. 17, published p. 149); no values read from figures.'
  - No monotectic temperature is printed as such; the text and inline summary report cristobalite + two-liquid equilibrium
    temperatures.
