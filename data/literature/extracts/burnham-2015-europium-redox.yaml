schema_version: literature_extract.v1
source_id: burnham-2015-europium-redox
source:
  citation: 'Burnham, A. D., Berry, A. J., Halse, H. R., Schofield, P. F., Cibin, G. & Mosselmans, J. F. W. (2015). The oxidation state of europium in silicate melts as a function of oxygen fugacity, composition and temperature. Chemical Geology 411, 248-259. doi: 10.1016/j.chemgeo.2015.07.002.'
  year: 2015
extraction:
  method: manual_from_draft
  date: '2026-10-16'
  worker: codex-rdxw2-eu15
  provenance_path: data/literature/extracts/burnham-2015-europium-redox.yaml
review_status: draft
notes:
  - >-
    schema_gap: Table 2 (PDF pp. 34–37; published pp. 255–258) also reports
    Eu3+/SumEu calculated from the Eu2+ peak. That column is not extracted
    because VALENCE_RATIO has no measurement-variant identity axis; it is
    recorded for a separate schema task. The extracted observations use the
    Eu3+-peak column.
  - >-
    The paper reports agreement between glass and melt Eu3+/SumEu for Fe-free systems, but says the high-temperature ratio is not preserved in Fe-bearing melts because Eu2+ + Fe3+ reacts during quenching.
