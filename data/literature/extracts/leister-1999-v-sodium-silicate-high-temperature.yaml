source:
  citation: >-
    Leister, M., Ehrt, D., von der Goenna, G., Ruessel, C. and Breitbarth, F. W.
    (1999). Redox states and coordination of vanadium in sodium silicates melted
    at high temperatures. Physics and Chemistry of Glasses, 40(6), 319–325.
  year: 1999
extraction:
  method: >-
    Born-digital pdftotext-layout transcription, checked against the publisher
    PDF at 600 dpi. Tables 1–4 were checked against rendered pages 322 and 324;
    figures 1–10 are retained as figure-only context records with no digitised
    points. Table 2's Na2O.5·67SiO2 reducing row is printed as 1600°C, while the
    Experimental procedure gives 1500°C for that composition; the table's
    coordinate is retained as printed and the disagreement is recorded in the
    audit. Table 2 SWV columns are author-calculated equilibrium values and are
    retained in context. Host glass compositions are the declared binary
    Na2O-SiO2 compositions; vanadium dopant is recorded separately and is not
    added to a reconstructed ternary composition.
  date: '2026-10-18'
  worker: codex
  provenance_path: text/leister-1999-v-sodium-silicate-high-temperature/pdftotext-layout.txt
