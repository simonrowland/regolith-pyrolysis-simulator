extraction:
  method: >-
    No numerical table is printed. MinerU content list for this PDF has charts and
    images and no table blocks, so mineru_table_draft emit was not run. Figures 1–4
    were read on 600 dpi renders of PDF pages 3 and 4. This-study series are continuous
    calculated strokes with no marker centre. Literature symbols stay in the audit
    sidecar and are not re-extracted.
