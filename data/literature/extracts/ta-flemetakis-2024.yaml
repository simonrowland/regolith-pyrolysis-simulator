source_conclusions:
  - statement: No concentration zoning was observed; diffusion and advection were not rate-limiting, and surface evaporation was rate-limiting under these conditions.
    evidence_class: author_stated_conclusion
    locator: {source_path: /Users/simonrowland/Repos/regolith-corpus/raw/ta-flemetakis-2024/ta-flemetakis-2024.pdf, published_page: 175, pdf_page_index: 3, section: 3 Results}
  - statement: B evaporation increased with oxygen fugacity and temperature; air was approximately five times faster than FMQ-4 at 1350 C.
    evidence_class: author_stated_conclusion
    locator: *abstract
absent_parameters:
  - exposed_evaporating_area: sample diameter is approximate and no area is printed; no area inferred
  - vacuum_orifice_geometry: not applicable to this open tube-furnace experiment
  - independent_fO2_calibration: no separate calibration or sensor stated beyond CO/CO2 mixing control
  - run_specific_sample_mass_after_hooking: only approximate shard mass is printed
