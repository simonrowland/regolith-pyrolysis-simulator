schema_version: literature_extract.v1
source_id: mysen-virgo-1989-nas-redox
figure_policy: No plotted numeric points are included. Figure-only redox relationships in Figs. 9 and
  15 are deferred to a figure pass; Figs. 3–5 are representative Mössbauer spectra used only to locate
  the unprinted fit inputs.
source:
  citation: 'Mysen, B. O. and Virgo, D. (1989). Redox equilibria, structure, and properties of Fe-bearing
    aluminosilicate melts: Relationships among temperature, composition, and oxygen fugacity in the system
    Na2O-Al2O3-SiO2-Fe-O. American Mineralogist, 74, 58–76.'
  year: 1989
  corpus_asset: raw/mysen-virgo-1989-nas-redox/mysen-virgo-1989-nas-redox.pdf
extraction:
  method: Transcribed from the MinerU Table 1 and Table 2 blocks and pdftotext-layout, then checked against
    the 400 dpi renders of PDF pages 2 and 3. All 52 composition cells and all 159 stored Table 2 value/condition
    cells were render-checked; the row and column layout of all four detected tables was checked against
    its render. QA-flagged cells in Tables 1-4 were settled from renders of PDF pages 2, 3, 15, and 16.
    Table 1 nominal starting compositions are weight percent, supported by the methods' 5 wt% Fe2O3 addition
    and the Figure 2 wt% key. Table 2 prints absolute log fO2 in bars; the method controls it with CO-CO2
    mixing but prints no gas ratio. Table 2 contains 53 experimental body rows; all are retained. The
    double-starred spectra are kept as separate rows and the printed 77 K measurement note is preserved.
    Table 3 is a Chayes natural-rock compilation, not an experimental NAS melt series; Table 4 contains
    regression coefficients rather than sample points, so neither is included. No fO2, gas ratio, total
    pressure, or individual fit areas were inferred.
  date: '2026-11-04'
  worker: w1104fer-mv89
  provenance_path: text/mysen-virgo-1989-nas-redox/pdftotext-layout.txt
  render_audit:
    physical_pages_400dpi:
    - 2
    - 3
    - 4
    - 15
    - 16
    numeric_cells_checked: 211
    table_row_layout_checked:
    - 1
    - 2
    - 3
    - 4
    check_note: Table 1 and Table 2 values stored in this extract were checked against their page renders;
      QA-flagged cells in out-of-scope Tables 3 and 4 were also render-checked. The quench-preservation
      statement was checked on PDF page 4.
