notes:
- The paper is a primary experimental reduction and characterization study, not a review or equilibrium model.
- It contains no measured vapour pressures, activities, evaporation or sublimation rates/fluxes, mass-loss series, condensation temperatures, or thermodynamic tables for relevant gas species.
- OH* concentration assays and biological-fluid recipes were read for triage but excluded as unrelated to the battery rails.
- Table 1 composition values are a mixture of the authors' table and cited source data; the footnotes are retained rather than treated as new primary measurements.
- The reduction treatment is not a vacuum experiment: chamber pressure, H2 pressure/flow, exposed area, fO2, and furnace calibration are not printed.
