schema_version: literature_extract.v1
source_id: fredrickson-chasanov-1973-na2o-enthalpy-1300k
source:
  citation: 'Fredrickson, D. R. & Chasanov, M. G. (1973), “The enthalpy of sodium oxide Na2O to 1300 K by drop calorimetry”, Journal of Chemical Thermodynamics 5, 485–490.'
  doi: null
  url: null
  year: 1973
extraction:
  method: MinerU and pdftotext table transcription; flagged cells and table layouts checked against rendered PDF pages
  date: '2026-11-02'
  worker: w1103fc-fc73
  provenance_path: text/fredrickson-chasanov-1973-na2o-enthalpy-1300k/pdftotext-layout.txt
  source_note: >-
    The source reports 31 drop-calorimetry measurements of H°(T)−H°(298.15 K),
    two least-squares equations, a differentiated heat-capacity equation, and
    a 12-row smoothed enthalpy/heat-capacity/entropy table. The table 1 and
    table 2 enthalpy and heat-capacity values requested here are stored in the
    printed thermochemical calories, with no converted twins. The paper states
    cal_th = 4.184 J and temperatures based on IPTS-68. Its table 3 contains
    derived formation enthalpy, Gibbs energy, and log K values; those quantities
    are outside this extraction's requested H(T)−H(298.15 K), Cp, and transition
    data. Table 2 entropy increments are also outside the requested scope.
    Table 1 has 31 drops (not 32; MinerU's extra body row is the equation (2)
    subheading). Table 2 has 12 data rows. The measured table 1 range is
    511.8–1285.1 K; the fitted ranges are 298–900 K and 900–1300 K.
    Absolute PDF pages are 1–6; printed journal pages are 485–490.
  method_token_note: >-
    The authors call the method high-precision drop calorimetry. The calorimeter
    output is corrected for the capsule heat and divided by the stated Na2O
    sample amount; no dedicated drop-calorimetry MethodToken is required here.
