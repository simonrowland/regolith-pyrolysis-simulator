    value:
      method_class: "figure_only"
      caption: "Fig. A.1. (a) Edge step-normalised intensity vs. energy for standards from the NMNH 117393 reference block (Cottrell et al., 2009), showing the spectra over the energy range of the pre-edge region used in fitting both standards and samples. Spectra for the standards are coloured by their reference Fe3+/ΣFe values as determined by Mössbauer spectroscopy. Inset: Raw, un-normalised spectrum of one standard glass over the full energy range analysed, with the energy range used for normalisation shaded in grey. (b) Edge step-normalised intensity vs. energy for representative Laki melt inclusions, coloured by their measured Fe3+/ΣFe values as calibrated using the NMNH standards. The black line labelled ‘olv’ is a melt inclusion analysis contaminated by the host olivine. Inset: Raw, un-normalised spectra for the same Laki melt inclusions, showing the post-edge shoulder. Note the structure at ∼7140 eV in the olivine-contaminated spectrum. (For interpretation of the colours in this figure, the reader is referred to the web version of this article.)"
      axes: "x: Energy (eV); y: Normalised intensity"
      not_digitised: "Continuous XANES spectra have no discrete data markers."
