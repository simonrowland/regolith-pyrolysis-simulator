  method: >-
    All 8 pages rendered with pdftoppm at 600 dpi for Figure 2 and Figure 3
    marker reads; the paper has no numeric data tables. Figure 2 MA-S activity
    markers are the filled upward triangles at the printed x(SiO2) compositions:
    six for MgO, five for Al2O3 and five for SiO2 (no up-triangle at x=0 on
