    context:
    - observation_id: shornikov_2001_abstract_scope_and_comparison
      type: interpretation
      locator:
        published_page: 322
        pdf_page_index: 0
        section: Abstract
      units: as printed
      values:
        statement_as_printed: '“The regularities of the MgAl2O4-SiO2 system melts evaporation were studied at 1623-2523 K using the high-temperature mass spectrometric Knudsen effusion method. The obtained thermodynamic data on the MgAl2O4-SiO2 system melts were compares with the similar data previously determined for the CaAl2O4-SiO2 and CaTiO3-SiO2 system melts. The increase of the deviations from the ideal behavior in the following order MgAl2O4-SiO2 → CaAl2O4-SiO2 → CaTiO3-SiO2 was shown.”'
        temperature_range_K:
        - 1623
        - 2523
        systems_compared:
        - MgAl2O4-SiO2
        - CaAl2O4-SiO2
        - CaTiO3-SiO2
    - observation_id: shornikov_2001_background_thermodynamic_evidence
      type: interpretation
      locator:
        published_page: 322
        pdf_page_index: 0
        section: Introduction
      units: as printed
      values:
        statements_as_printed:
        - '“The wide usage of the refractory materials on the base of spinel ceramics causes a proper interest to the investigations of physicochemical properties and phase relations in the MgO-Al2O3-SiO2 system at high temperatures.”'
        - '“The study of this system is a point of particular interest due to the problems connected with the development of new materials with exceptionally low or even negative values of the thermal extension coefficients (1).”'
        - '“The phase relations in the MgO-Al2O3-SiO2 system and in the corresponding binary systems (MgO-Al2O3, MgO-SiO2, and Al2O3-SiO2) were studied several times. However it should be noted that these data shows substantial contradictions (1-5).”'
        - '“The thermodynamic data on MgO-Al2O3-SiO2 system are limited by the properties of ternary compounds at rather low temperatures (~1000 K) obtained by the various calorimetric methods (6-10).”'
        - '“The results of the heterogeneous equilibria studies of slags with Fe-Si-C alloys saturated with graphite or silicon carbide at 1873 K (11, 12) did not correlate to the calorimetric data.”'
        - '“The authors of (5, 13-15) consider the data (11, 12) to be rather doubtful.”'
        temperatures_K:
        - 1000
        - 1873
        translation_note: 'The translation prints “thermal extension coefficients”; retained verbatim.'
    - observation_id: shornikov_2001_system_and_prior_comparators
      type: interpretation
      locator:
        published_page: 323
        pdf_page_index: 1
        section: Introduction
      units: as printed
      values:
        statements_as_printed:
        - '“In accordance with the phase diagram of this pseudobinary system shown in Fig. 1a (4) the phase relations are determined by the thermodynamic properties of the following compounds - MA, A3S2, M4A5S2 and M2A2S5 (here and further M = MgO, A = Al2O3, S = SiO2, L = liquid).”'
        - '“It was instructive to compare the data presented in this work with the same data previously obtained for some similar systems - CA-S (14) and CT-S (16, 17).”'
        variables_as_printed: M=MgO; A=Al2O3; S=SiO2; L=liquid; C=CaO; T=TiO2
    - observation_id: shornikov_2001_ions_and_gas_reaction_context
      type: method
      locator:
        published_page: 323
        pdf_page_index: 1
        section: Results and Discussion
      units: as printed
      values:
        ionization_energy_eV: 20
        molecular_ions_as_printed:
        - SiO+
        - Mg+
        - SiO2+
        - O+
        - MgO+
        - O2+
        - AlO+
        - Al+
        - Al2O+
        - AlSiO+
        fragment_ion_as_printed: Si+
        statements_as_printed:
        - '“The (SiO)+, (Mg)+, (SiO2)+, (O)+, (MgO)+, (O2)+, (AlO)+, (Al)+, (Al2O)+ and (AlSiO)+ molecular and the (Si)+ fragmentary ions were determined in the mass spectra of vapor over the studied melts at 20 eV.”'
        - '“It was shown that the above mentioned molecular ions were the result of the ionization of the corresponding vapor species formed according to the reactions similar to the evaporation reactions of individual oxides.”'
        - '“[MgO] = (Mg) + (O)” (1); “[MgO] = (MgO)” (2); “[Al2O3] = 2(Al) + 3(O)” (3); “[Al2O3] = 2(AlO) + (O)” (4); “[Al2O3] = (Al2O) + 2(O)” (5); “[SiO2] = (SiO) + (O)” (6); “[SiO2] = (SiO2)” (7).'
        notation_as_printed: Square brackets denote condensed phase; round brackets denote gas phase.
    - observation_id: shornikov_2001_al_sio_and_mo_cell_ion_reactions
      type: method
      locator:
        published_page: 325
        pdf_page_index: 3
        section: Results and Discussion
        equation: '8–9'
      units: as printed
      values:
        statements_as_printed:
        - '“As it was discussed in (19) the (AlSiO) molecules were the result of the following reaction.”'
        - '“The (MoO)+, (MoO2)+ and (MoO3)+ observed molecular ions corresponded to the processes of the interaction of gas phase over the studied melts with the molybdenum effusion cell.”'
        reactions_as_printed:
        - '(Al) + (SiO) = (AlSiO) (8)'
        - '(MoOᵢ₊₁) = (MoOᵢ) + (O) (9)'
        cell_interaction_ions_as_printed:
        - MoO+
        - MoO2+
        - MoO3+
        qualification: The reported MoO ions are attributed to gas interaction with the Mo effusion cell, not simply to sample vapor species.
    - observation_id: shornikov_2001_associated_molecules_not_reliably_detected
      type: interpretation
      locator:
        published_page: 323
        pdf_page_index: 1
        section: Results and Discussion
      units: as printed
      values:
        statement_as_printed: '“The special search showed the absence of the ions corresponding to the probable associated molecules (MgAl_iO_j) and (MgSiO_k) (i = 1, 2; j = 1, 2, 3, 4; k = 1, 2, 3) in the amounts sufficient for the reliable determination.”'
        absent_species_families:
        - MgAl_iO_j
        - MgSiO_k
        qualification: They were not detected in quantities sufficient for reliable determination; this is not a claim of absolute absence.
