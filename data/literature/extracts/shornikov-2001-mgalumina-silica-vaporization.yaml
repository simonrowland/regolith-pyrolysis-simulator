        - CA-S
        - CT-S
        cited_sources_as_printed: '(4, 13, 18)'
        note: Phase-diagram fields and curves were inspected on the page image and retained as figure-only context; no curves or OCR graph grids were digitized.
    - observation_id: shornikov_2001_phase_diagrams_differ_but_evaporation_regularities_match
      type: interpretation
      locator:
        published_page: 325
        pdf_page_index: 3
        section: Results and Discussion
      units: as printed
      values:
        statement_as_printed: '“One can see from Fig.1 that the phase diagrams of the silicate systems under consideration are essentially different. Nevertheless the evaporation of the MA-S system, as well as CA-S and CT-S systems shows the same regularities.”'
    - observation_id: shornikov_2001_evaporation_sequence_and_noncongruent_change
      type: interpretation
      locator:
        published_page: 325
        pdf_page_index: 3
        section: Results and Discussion
      units: as printed
      values:
        statements_as_printed:
        - '“The first stage of this evaporation was the predominant silica vaporization from the melt placed in the effusion cell.”'
        - '“This process went so far that the composition of the condensed phase reached the point of magnesium aluminate (or CA, or CT, correspondingly) in the crystallization line.”'
        - '“The vaporization rate of the obtained crystallized solid phase is lower in comparison with the one of the melt evaporation.”'
        - '“At the next stage the dominant process for the obtained phase compositions is the vaporization of magnesium oxide (or CaO) at the further temperature increase.”'
        - '“The composition of the samples was changed in the line of corundum (or rutile) field having a minor volatility.”'
        qualification: The reported vaporization changes sample composition; no post-run composition assay is tabulated.
    - observation_id: shornikov_2001_constant_current_ratios_and_activity_reduction
      type: method
      locator:
        published_page: 325
        pdf_page_index: 3
        section: Results and Discussion
        equation: '10–14'
      units: as printed
      values:
        statements_as_printed:
        - '“Another interesting characteristic of the MA-S system vaporization (as well as CA-S and CT-S system melts) is practically constant relations of the ion current intensities (I(i)+) over a wide concentration range.”'
        - '“It should be mentioned that these relations determine the oxygen partial pressure.”'
        - '“The above mentioned regularities allowed to determine the values of MgO, Al2O3 and SiO2 activities in the MA-S melts using the Belton-Fruehan method (20) modifying the Gibbs-Duhem equation.”'
        ion_current_ratios_as_printed:
        - I(MgO)+ / I(Mg)+
        - I(AlO)+ / I(Al)+
        - I(SiO2)+ / I(SiO)+
        - I(MoO3)+ / I(MoO2)+
        activity_ion_current_ratios_as_printed:
        - I(Mg)+ / I(SiO)+
        - I(Al)+ / I(SiO)+
        - I(SiO)+ / I(Mg)+
        - I(Al)+ / I(Mg)+
        activity_ions_by_component:
          SiO2:
            current_ratios:
            - I(Mg)+ / I(SiO)+
            - I(Al)+ / I(SiO)+
            equation: '12'
            integration_reference: x(SiO2)=1
          MgO:
            current_ratios:
            - I(SiO)+ / I(Mg)+
            - I(Al)+ / I(Mg)+
            equation: '13'
            anchor: a*(MgO)
          Al2O3:
            inputs:
            - a(MgO)
            - a(SiO2)
            - a*(Al2O3)
            equation: '14'
        derivation_as_printed: |
          (11), printed p. 325 / PDF page index 3:
          ln a(i) = −∫ x(j) d ln[a(j)/a(i)] − ∫ x(k) d ln[a(k)/a(i)].
          (12), printed p. 326 / PDF page index 4:
          ln a(SiO2) = −∫_[x(SiO2)=1]^[x(SiO2)] [x(MgO)/(1+x(Al2O3))] d ln[I(Mg)+/I(SiO)+] − 2∫_[x(SiO2)=1]^[x(SiO2)] [x(Al2O3)/(1+x(Al2O3))] d ln[I(Al)+/I(SiO)+].
          (13), printed p. 326 / PDF page index 4:
          ln a(MgO) = ln a*(MgO) − ∫_[x*(SiO2)]^[x(SiO2)] [x(SiO2)/(1+x(Al2O3))] d ln[I(SiO)+/I(Mg)+] − 2∫_[x*(SiO2)]^[x(SiO2)] [x(Al2O3)/(1+x(Al2O3))] d ln[I(Al)+/I(Mg)+].
          (14), printed p. 326 / PDF page index 4:
          ln a(Al2O3) = ln a*(Al2O3) − ∫_[x*(SiO2)]^[x(SiO2)] [x(MgO)/x(Al2O3)] d ln a(MgO) − ∫_[x*(SiO2)]^[x(SiO2)] [x(SiO2)/x(Al2O3)] d ln a(SiO2).
          Integral bounds are written as ∫_[lower]^[upper]; + after an ion denotes its printed positive charge, and * denotes the printed anchor superscript.
    - observation_id: shornikov_2001_activity_reference_anchor
      type: method
      locator:
        published_page: 326
        pdf_page_index: 4
        section: Results and Discussion
        equation: '12–14'
      units: as printed
      values:
        statement_as_printed: '“where a*(i) - is the activity of the i component of the MA compound crystallized from the MA-S melt at the concentration equal to x*(i). The values of x*(i) were determined according to the experimental data on the melts vaporization as well as in (5) and this value equal to 34.08 ± 0.18 mole % SiO2 at 2050 K.”'
        x_star_SiO2_mole_percent: 34.08
        x_star_uncertainty_mole_percent: 0.18
        temperature_K: 2050
        standard_state_note: 'Equations (13) and (14) anchor the MgO and Al2O3 activities to those oxide components in crystallized MA at x*(SiO2)=34.08 ± 0.18 mole % SiO2 and 2050 K. Equation (12) instead integrates SiO2 activity from x(SiO2)=1; the equation does not explicitly state a solid or liquid phase for that endpoint.'
        activity_reference_states_by_component:
          MgO: Activity of the MgO component in MA crystal at x*(SiO2)=34.08 ± 0.18 mole % and 2050 K.
          Al2O3: Activity of the Al2O3 component in MA crystal at x*(SiO2)=34.08 ± 0.18 mole % and 2050 K.
          SiO2: Equation (12) integration reference x(SiO2)=1; pure-endpoint phase is not explicitly stated.
    - observation_id: shornikov_2001_activity_comparisons_and_ideality
      type: interpretation
      locator:
        published_page: 326
        pdf_page_index: 4
        section: Results and Discussion
      units: as printed
      values:
        statements_as_printed:
        - '“According to Fig 2a the maximal value of the alkaline-earth oxide (MgO or CaO) activity in the ternary silicate systems under investigation was determined for the MA-S system.”'
        - '“It should be mentioned that due to nearly the same values of the activities of aluminum oxide (or titanium dioxide) and silicon dioxide (Figs. 2b and c), the alkaline-earth activities values determine the deviations from ideality (Fig. 3).”'
        - '“The activity values vs concentration dependencies maxima of aluminum oxide (or titanium dioxide) for the CA-S (or CT-S) melts are caused to all appearance by the closeness of A + L (or CTS + L) fields.”'
        - "“For the MA-S melts such closeness of the A3S2 + L field doesn't effect a(Al2O3) due to the value of the melting enthalpies of these compositions.”"
        translation_note: 'The sentence beginning “The activity values vs concentration dependencies maxima” and the printed “doesn’t effect” are retained as translated; the first sentence is grammatically unclear.'
    - observation_id: shornikov_2001_alumina_activity_disagreement
      type: interpretation
      locator:
        published_page: 326
        pdf_page_index: 4
        section: Results and Discussion
      units: as printed
      values:
        statements_as_printed:
        - '“A point that should be mentioned is that the values of the aluminum oxide activities obtained in the present work are nearly ten times lower that the ones reported in (11).”'
        - '“The reason of such discrepancies could be explained by the rough approximations done in (11) by the Schuhmann method (21).”'
        - '“The effect of such approximations was previously discussed for mullite (5, 15, 19).”'
        - '“Notice that for the ternary MA-S system the thermodynamic data on spinel MA reported in (11) also contradict the most of reference data.”'
        attribution: 'The comparison and criticism concern reference (11), identified in the references as Rein and Chipman (1965).'
        translation_note: 'The source prints “lower that” and “contradict the most”; wording retained.'
    - observation_id: shornikov_2001_gibbs_and_silica_activity_comparisons
      type: interpretation
      locator:
        published_page: 328
        pdf_page_index: 6
        section: Results and Discussion
      units: as printed
      values:
        statements_as_printed:
        - '“The values of the silica activities in the ternary system under study are close, the deviations were identified for the compositions of the SiO2 mole fraction less then 30 mole % (Fig. 2c).”'
        - '“The determined values of the Gibbs energies of melt formation (ΔfG) for the MA-S system are close to ideality.”'
        - '“These data correlate with the phase relationships and the structure of MgO-Al2O3-SiO2 melts (1, 4).”'
        - '“The observed minimums for ΔfG concentration dependencies in CA-S and CT-S (Fig. 3) correspond to the concentrations close to gehlenite C2AS and sphene CTS (Figs. 1b and 1c).”'
        - '“The deviations from ideality in the studied systems increase in the following order: MA-S → CA-S → CT-S.”'
        translation_note: 'The source prints “less then 30”; retained.'
    - observation_id: shornikov_2001_conclusion_evaporation_order
      type: interpretation
      locator:
        published_page: 328
        pdf_page_index: 6
        section: Conclusions
      units: as printed
      values:
        statement_as_printed: '“The consideration of the evaporation processes in the melts under study have demonstrated that the initial stages of the evaporation are characterized by the predominant evaporation of SiO2, the next stages are the MgO evaporation and, finally, the Al2O3 evaporation. The same rules are also characteristic for the previously studied CaO-Al2O3-SiO2 and CaO-TiO2-SiO2 system melts.”'
    - observation_id: shornikov_2001_conclusion_ideality_order
      type: interpretation
      locator:
        published_page: 328
        pdf_page_index: 6
        section: Conclusions
      units: as printed
      values:
        statements_as_printed:
        - '“The activity values of the components and the Gibbs energies of melt formation determined in the present study have showed the negligible negative deviations from ideality.”'
        - '“This fact is in agreement with the modern considerations on the phase equilibria and the structure of the MgO-Al2O3-SiO2 melts.”'
        - '“The deviations from ideality in the studied systems increase in the following order: MgAl2O4-SiO2 → CaAl2O4-SiO2 → CaTiO3-SiO2.”'
