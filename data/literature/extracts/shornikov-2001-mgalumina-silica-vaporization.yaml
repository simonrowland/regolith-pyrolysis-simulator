    the printed 52.21 mole% position is a square of curve 3, so it is not
    stored. The readings are not converted, because the schema has
    no quantity token for dimensionless ΔfG/RT. Other curves remain figure-only. Axis
    calibration and raw pixel reads are in
    crown4-1018-figure-read-audit.md.
