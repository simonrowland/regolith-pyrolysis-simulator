    - observation_id: yakovlev_2017_olivine_abstract_claims
      type: experiment_series
      locator:
        published_page: 82
        pdf_page_index: 0
        section: Abstract and Introduction
      units: qualitative claims and ratios as printed
      values:
        statements_as_printed:
        - "All authors both past and modern experimental works suggested that forsterite evaporates congruently (without changing the solid state composition)."
        - "Evaporation of olivine as a phase of variable composition, occurs in such a way that between the substance in a condensed state (liquid or solid) and in gas phase may be the difference in Fe-contents, while the 'olivine' stoichiometry [(Mg + Fe) / Si = 2] remains unchanged."
        - "A critical analysis of almost all experimental data showed that actually the process of olivine evaporation from the solid phase (sublimation) is really close to congruent, while the liquid phase evaporation is clearly incongruent."
        - "As shown by our study, the olivine evaporation depends on the kinetics of the process."
        - "In the evaporation pulsed mode the ratio of the Mg / Si was close to 1, which does not correspond to the olivine stoichiometry and therefore congruent evaporation character."
        - "A high degree of relative content of olivine in chondrites explains the interest of researchers to its primary condensation from a gas phase and its evaporation at the stage of nebular evolution."
        - "In the last decades there were published a lot of experimental works for determining the total pressure of forsterite and the partial pressure of the forsterite components depending on the temperature."
        - "Thus, Fig. 1 presents mainly data on the vapor pressure of forsterite at its sublimation."
        - "Fig. 1 shows for comparison the temperature dependence of the vapor pressure of magnesium (MgO) and silicon oxides (SiO2)."
    - observation_id: yakovlev_2017_olivine_discussion_claims
      type: experiment_series
      locator:
        published_page: 83
        pdf_page_index: 1
        section: Discussion
      units: qualitative claims and ratios as printed
      values:
        statements_as_printed:
        - "Many authors both past and contemporary experimental works suggested that forsterite evaporates congruently, i.e. without changing the composition."
        - "Moreover, the evaporation of olivine as a phase of variable composition occurs in such a way that between the substance in a condensed state (liquid or solid) and gas may be the difference in FeO contents, but olivine stoichiometry [(Mg + Fe) / Si = 2] remains unchanged, that is, olivine evaporates congruently too."
        - "Critical analysis of experimental data showed, however, that the process of evaporation from the solid phase (sublimation) is really close to congruent, then as evaporation of liquid phase is clearly incongruent in nature."
        - "Well known that the sublimation only affects the surface layer of crystalline substances, while leaving the inner part of the crystal unchanged. In this case, the evaporation process can be described as congruent, as the olivine in the process of evaporation keeps generally the unchanging of the composition. However, in the surface layer composition may be essentially different."
        - "Interestingly, that at the sublimation of forsterite in a narrow surface zone of a crystal with a thickness of only ~5 microns recorded a strong isotopic fractionation of magnesium (Wang et al., 1999)."
        - "As for evaporation from the liquid phase any clear data on the nature of evaporation of olivine melt is absent."
        - "Many authors often refer to the results of the work A. Hashimoto (Hashimoto, 1990) where in some experiments the temperature was beyond the melting temperature of forsterite (Fig. 1) and where, as believed, given the proofs of congruence of the melt evaporation."
        - "But in reality, there are no any evidences in the Hashimoto's work, while it was written literally the following: 'Molten forsterite also evaporates almost stoichiometrically. Only the most highly evaporated residues contained a trace (~5 vol. %) of SiO2-rich glass (~65 wt. % SiO2)'."
        - "Hashimoto's article contains no data on 'almost congruent' evaporation of forsterite melt and does not give interpretation on the fact of SiO2 accumulation in the residual melt."
        - "In recent works on evaporation (Mendybaev et al., 2014) it is also argued that the melts close to forsterite compositions evaporate congruently."
        - "However, our calculations of the Mendybaev’s and his colleagues analytical data showed the wrongness of this proposition (Fig. 2)."
        - "In addition, as shown by our study (Yakovlev et. al., 1995; Gerasimov et. al., 2015) the evaporation of olivine is determined by the kinetics of the process."
        - "The results of experiments on of high-mg olivine evaporation in the condition of impact and laser-pulse heating showed that the condensed vapor compositions differed from the residual melt ones."
        - "In the conditions of high temperature and rapid evaporation the ratio of elements Mg/Si in a vapor was close to 1 (Fig. 3) that does not correspond to the olivine stoichiometry and, therefore, congruent character of evaporation."
        hashimoto_quote:
          method_class: quoted_attributed
          attribution: Hashimoto (1990), quoted in this source
          residue_glass_volume_percent_approx: 5
          glass_silica_mass_percent_approx: 65
        pulse_evaporation_ratio:
          method_class: quoted_attributed
          attribution: Yakovlev et al. (1995) and Gerasimov et al. (2015), summarized by this source
          Mg_to_Si_vapor_ratio_approx: 1
          initial_olivine_stoichiometric_Mg_plus_Fe_to_Si_ratio: 2
        internal_qualification:
          reason: source_internally_inconsistent
          note: "The p. 82 abstract says past and modern works suggested congruent evaporation and that pulsed vapor Mg/Si is close to 1 rather than the olivine ratio 2. On p. 83 the authors repeat the stoichiometric congruence claim, then distinguish near-congruent solid sublimation from clearly incongruent liquid evaporation. These claims are retained as competing statements, not reconciled."
