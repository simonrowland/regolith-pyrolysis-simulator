    - observation_id: yam1983_na2o_table1_minus_log10_a_AT_B
      type: activity_coefficient
      locator:
        page: 3
        published_page: 738
        pdf_page_index: 3
        table: '1'
        figure: '5'
        equation: '-log a_Na2O = A/T + B'
        note: >-
          Table 1 caption (English in source): "Coefficients of lines for
          -log a_Na2O = A/T + B." Column headers: X_Na2O, 10^{-4}·A,
          10^{-4}·δA, B, δB. The 10^{-4}·A column is A×10^{-4}, so
          A/K = (printed)×10^4. Ref. row is the Fe2O3-bearing reference melt,
          not a binary X_Na2O.
      T_range_K:
      - 1173.0
      - 1673.0
      phase: Na2O-SiO2_binary_melt
      standard_state: >-
        Pure liquid Na2O. Paper p.737 (PDF p.2): 「なお，Na2O の活量の基準状態には
        すべて液体をとった。」 = "The standard state for the activity of Na2O
        was taken as the liquid in all cases." Confirmed by p.738:
        「参照融体中の Na2O の液体基準の活量」 = "liquid-standard activity of
        Na2O in the reference melt." The EMF cell (a_Na2CO3 = 1, pure Na2CO3
        melt under fixed pO2 and pCO2) is an electrode convention used only
        to place a_Na2O* of the reference melt onto that liquid-Na2O scale
        via JANAF ΔGf°(Na2O) and ΔGf°(Na2CO3) (eqs. 4–5). Reported a_Na2O
        is the component activity, not a cell-relative ratio.
      regime: emf_beta_alumina_concentration_cell
      units: dimensionless a (log10); Raoultian γ = a/X
      uncertainty:
        note: >-
          Table 1 δA and δB are the least-squares coefficient errors.
          Propagated σ(log10 a) = sqrt((δA/T)^2 + (δB)^2) as the authors
          describe around eq. (9). Do not invent additional uncertainty.
      values:
        quantity: activity_and_raoultian_gamma
        oxide_formula_as_published: Na2O
        composition_basis: mole_fraction_Na2O_in_Na2O-SiO2
        log_base: 10
        equation_as_printed: -log a_Na2O = A/T + B
        equation: '-log10(a_Na2O) = A/T + B'
        T_in_equation: kelvin
        gamma_definition: >-
          Papers publish a_Na2O, not γ_Na2O. Raoultian
          γ_Na2O = a_Na2O / X_Na2O follows from the liquid/Raoultian
          standard. Conversion shown on each evaluated binary row.
        cell_convention_is_not_the_reported_standard: >-
          Concentration cell measures a_Na2O / a_Na2O* (eq. 3, pO2 terms
          cancel when pO2 = pO2*). a_Na2O* itself was determined against
          pure liquid Na2CO3 (a_Na2CO3=1) and converted with JANAF 1971
          ΔGf° to liquid Na2O. Do not treat the Na2CO3 electrode as the
          activity standard state.
        reference_melt_mole_fraction:
          Na2O: 0.395
          SiO2: 0.526
