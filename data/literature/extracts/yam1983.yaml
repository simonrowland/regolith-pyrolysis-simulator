schema_version: literature_extract.v1
source_id: yam1983
source:
  citation: >-
    Yamaguchi, S., Imai, A. & Goto, K.S. (1983), "Measurement of Activity of
    Na2O in Na2O-SiO2 Binary Melt Using Beta-Alumina as a Solid Electrolyte"
    / 「β-アルミナ固体電解質を用いた Na2O-SiO2 系融体中の Na2O の活量の測定」,
    J. Japan Inst. Metals (日本金属学会誌) 47(9), 736-742.
  doi: 10.2320/jinstmet1952.47.9_736
  url: https://doi.org/10.2320/jinstmet1952.47.9_736
  year: 1983
extraction:
  method: >-
    Manual visual transcription from PDF page images of
    docs/references/pdfs/99-kems-langmuir/yam1983.pdf (Japanese body + English
    abstract/table captions). Table 1 and Table 2 coefficients read from the
    printed tables, not from Fig. 5/6. Japanese standard-state wording
    translated alongside the original.
  date: '2026-08-26'
  worker: t745-na2o-extracts
review_status: draft
species:
  Na2O:
