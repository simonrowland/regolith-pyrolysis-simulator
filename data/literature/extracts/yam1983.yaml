        Raoult's law".
      regime: emf_beta_alumina_concentration_cell
      units: dimensionless a as published (order-of-magnitude span)
      values:
        quantity: activity_range
        activity_range:
        - 1.0e-10
        - 0.001
        X_Na2O_range:
        - 0.2
        - 0.6
        original_english_abstract: >-
          The activity of sodium oxide measured showed an extremely large
          negative deviation from Raoult's law with the values of 10^{-10}
          to 10^{-3} depending upon temperature and composition.
        original_japanese_conclusion: >-
          Na2O の活量は、Raoult 則より大きく負に偏移し、X_Na2O=0.2 では
          10^{-10}〜10^{-8}、X_Na2O=0.6 においても 10^{-5}〜10^{-3} という値を示した。
        gamma_range_note: >-
          Authors do not tabulate γ. Using γ=a/X on the conclusion endpoints
          gives roughly 5e-10–5e-8 at X=0.2 and 2e-5–2e-3 at X=0.6
          (order-of-magnitude only; prefer Table 1 evaluations).
        temperatures_K:
        - 1173.0
        - 1673.0
