source_id: shornikov-2019-perovskite-evaporation-thermodynamics
source:
  citation: >-
    Shornikov, S. I. (2019). Thermodynamics of evaporation of perovskite—the
    mineral of white inclusions of chondrites. Experiment in Geosciences,
    25(1), 38–40.
  year: 2019
extraction:
  method: >-
    No MinerU table. Prose transcribed from pdftotext. Equations (8) and (9)
    were read on the 600 dpi render. Fig. 2 and Fig. 3 markers were read on
    the 600 dpi render of PDF page 2. Axes were calibrated from the printed
    tick stubs. Each stored centre is the core of one filled marker, or the
    white hole of one open marker, and was drawn back onto the page.
  date: '2026-10-20'
  worker: t1372-w4-fix1-t5
review_status: draft
