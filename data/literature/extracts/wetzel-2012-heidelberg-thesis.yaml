schema_version: literature_extract.v1
source_id: wetzel-2012-heidelberg-thesis
source:
  citation: >-
    Wetzel, S. (2012), Infrarotspektroskopische Untersuchung von Siliziumoxiden,
    Silikaten, deren Wechselwirkung mit Metallinselfilmen sowie
    Dampfdruckmessungen an Siliziummonoxid, PhD thesis, Heidelberg.
  year: 2012
  corpus_asset: raw/wetzel-2012-heidelberg-thesis/wetzel-2012-heidelberg-thesis.pdf
extraction:
  method: >-
    SiO chapter machine text transcribed from the born-digital pdftotext layer;
    MinerU table draft and QA found no tables in the available chunks. Rendered
    PDF pages were used to verify apparatus values, the equation cells, and the
    full Table 2.2 layout. Numeric points shown only in Figure 2.11 were not
    digitized.
  date: '2026-11-02'
  worker: w1103cw2-wz12
  overlap:
    source_id: gail-2013-sio-nucleation-silicate-dust
    note: >-
      Gail et al. 2013 reuses the Wetzel 2012 Heidelberg Knudsen-cell/QCM SiO
      measurements, including the plotted alpha and vapor-pressure series.
      This extract records the thesis fit equations and Table 2.2, not duplicate
      graph points; count this as the same experiment.
schema_gaps:
- observation_ids:
  - wetzel_2012_sio_sublimation_enthalpy_1400K
  - wetzel_2012_sio_sublimation_enthalpy_298K
  quantity_label: sublimation_enthalpy
  reason: >-
    The printed SiO sublimation enthalpy has no exact quantity token. Quantity
    only has second-law and third-law enthalpy-of-vaporization tokens;
    QUANTITY_ALIASES has no exact sublimation-enthalpy alias, and TYPE_QUANTITY
    would infer delta_fG for gibbs_table if the descriptive quantity were
    omitted. The rows remain typed refusals with the printed values retained.
  code_symbols:
  - simulator/battery/enums.py::Quantity
  - simulator/battery/migrate.py::QUANTITY_ALIASES
  - simulator/battery/migrate.py::TYPE_QUANTITY
  - tools/validate_literature_extracts.py::OBSERVATION_TYPES
