- species: O
  observation_id: shornikov_2026_table2_O_partial_pressure
  field: note
  value: Paraphrase of the Experimental Methodology (physical PDF page 8, published page 303, PDF index 7), with the directly quoted sentence retained "Evaporation of tricalcium silicate from a molybdenum effusion cell (according to Knudsen) was studied by mass spectrometry in the temperature range 1804–2208 K." The sample of tricalcium silicate was kindly provided by Alexandra Boikova (Grebenshchikov Institute of
    Silicate Chemistry of the Russian Academy of Sciences), the synthesis conditions are described in [14]. [...]
    Special attention was paid to the synthesis of a Ca3SiO5 sample. It was obtained by repeated firing of a strictly
    stoichiometric mixture of chemically pure SiO2 and CaCO3 (or CaO) at 1773–1823 K, followed by X-ray phase and
    chemical analysis of the sample. [...] The partial pressures of the vapor species over tricalcium silicate calculated
    by ratios (13)–(15) with an error not exceeding 7%.
  locator:
    page: 8
    published_page: 303
    pdf_page_index: 7
    section: Experimental Methodology
