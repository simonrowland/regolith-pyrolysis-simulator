        caption: Figure 6. (a) Total iron concentration, (b) total Fe3+ concentration, (c) Fe concentration from
          the Fe2D2 (pyroxene) subspectrum, (d) S concentration, (e) Cl concentration, and (f) P concentration as
          a function of the concentration of Fe from npOx. Figures 6a and 6b show that npOx accounts for 5 to 70%
          of total iron and 25 to 100% of total Fe3+ , respectively, as shown by the dashed lines. The concentration
          of Fe from the Fe2D2 subspectrum tends to decrease as the concentration of Fe from npOx increases, showing
          no evidence for Fe3+ in Px (Figure 6c). The increases in the concentrations of S (Figure 6d) and Cl (Figure
          6e) with increasing concentration of Fe from npOx imply that npOx itself is S- and Cl-bearing or formed
          in proportion with S- and Cl-bearing phases. The concentration of P does not vary with the concentration
          of Fe from npOx, implying no association of npOx with P (Figure 6f). The solid lines in Figures 6d, 6e,
          and 6f are least squares fits for soil data only.
