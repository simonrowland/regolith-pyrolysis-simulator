source:
  citation: 'Morris, R. V., et al. (2006), ‘Mössbauer mineralogy of rock, soil, and dust at Gusev crater, Mars:
    Spirit’s journey through weakly altered olivine basalt on the plains and pervasively altered basalt in the Columbia
    Hills’, Journal of Geophysical Research: Planets 111, E02S13, doi:10.1029/2005JE002584.'
  doi: 10.1029/2005JE002584
  url: https://doi.org/10.1029/2005JE002584
  year: 2006
extraction:
  method: Born-digital source transcribed from pdftotext-layout.txt; no MinerU table source is present, so the MinerU
    table tool cannot draft mappings. Table 5 rows were preserved by printed target, location block, each f-factor-corrected
    area cell, Fe3+/FeT, and printed temperature window; row/column placement and the 82-row count were checked
    against 600 dpi physical pages 8–9. The Table 3/Table 5 A472 identifier discrepancy was checked against the
    600 dpi physical PDF page 6 and page 8. Figures 1–13 are records with no numeric points.
  date: '2026-10-20'
  worker: codex-resume-45736-1792513930
  provenance_path: raw/morris-2006-gusev-mossbauer/morris-2006-gusev-mossbauer.pdf
review_status: draft
notes:
- The paper reports in-situ MER Spirit (MER-A) MIMOS II Mössbauer measurements; target names, location blocks, and
  temperature measurement intervals are retained as printed.
- Table 5 contains 82 target rows although the methods text reports 86 targets. Tables 1–3 contain 83 unique sample
  IDs; Table 3 prints A472RU0 for Keystone_Haunch, while Table 5 prints A472RB0. Both are retained as printed; no
  missing target rows or ID corrections are inferred.
- Table 5 target Fe3+/FeT ratios and measurement windows remain in context because these are whole-sample Mössbauer results without a melt-equilibrium temperature or fO2; they are not melt redox observables. The printed areas, ratios, target names, and windows are preserved; no ratio is recomputed and no temperature midpoint is assigned.
- Figure 2 caption prints 210–70 K for its Keel spectrum while the panel and Table 5 show 210–270 K; the caption
  is retained as printed and the internal mismatch is noted in its figure record.
