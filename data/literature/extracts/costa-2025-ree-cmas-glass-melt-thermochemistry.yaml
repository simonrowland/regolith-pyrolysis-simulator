    - observation_id: costa_2025_table6_thermochemical_cycle
      type: method
      locator:
        page: 13
        pdf_page_index: 12
        table: '6'
      units: kJ mol−1 as printed
      values:
        quantity_as_printed: thermochemical cycle for glass formation enthalpies from constituent oxides and elements
          at room temperature
        method_class: model_derived
        method: Table 6 combines the glass and constituent oxide drop-solution enthalpies at 1073 K with binary oxide
          formation enthalpies to calculate glass formation enthalpies at 298 K.
        equations_as_printed:
        - ΔH1 = −ΔHds(glass); ΔH2 through ΔH6 are oxide stoichiometric coefficients multiplied by the corresponding ΔHds.
        - ΔH7 = ΔH2 + ΔH3 + ΔH4 + ΔH5 + ΔH6; ΔH7 is formation from oxides (glass).
        - ΔH13 = ΔH7 + ΔH8 + ΔH9 + ΔH10 + ΔH11 + ΔH12; ΔH13 is formation from elements (glass).
        inputs:
        - Table 2 composition-derived stoichiometric coefficients
        - Table 4 drop-solution enthalpies
        - Table 5 FactSage binary-oxide enthalpies
        render_correction: The pdftotext layout duplicated the c/2 Al2O3 row; the 600-dpi PDF render contains one row,
          which is retained.
