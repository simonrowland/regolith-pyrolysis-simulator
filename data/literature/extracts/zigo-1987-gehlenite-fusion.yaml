schema_version: literature_extract.v1
source_id: zigo-1987-gehlenite-fusion
source:
  citation: 'Žigo, O., Adamkovičová, K., Kosa, L., Nerád, I. & Proks, I. (1987), "Determination of the heat of fusion of 2CaO·Al2O3·SiO2 (gehlenite)", Chemical Papers 41(2), 171–181'
  doi: null
  url: https://www.chempap.org/?id=7&paper=4269
  year: 1987
extraction:
  method: 'Manual transcription of the complete 11-page publisher PDF. pdftotext -layout and PDF images were checked; Tables 1, 3, and 4 and equations (2), (5), and (6) were visually checked against page images. No unit conversion. The publisher gives no DOI in the paper.'
  date: '2026-10-03'
  worker: t1101-zigo1987
  provenance_path: text/zigo-1987-gehlenite-fusion/pdftotext-layout.txt
review_status: draft
fidelity_samples:
