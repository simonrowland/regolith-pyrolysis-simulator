    value: 335.9
    locator: {page: 174, pdf_page_index: 4, table: '1'}
  - path: species.gehlenite.observations[zigo_1987_t3_crystal_relative_enthalpy_measured_derived].values.points[5].H_rel_kJ_mol-1
    value: 1282.4
