extraction:
  method: >-
    Corpus PDF from ferry inbox
    from-main-B3-20260923T024400Z/pdfs/tenkate-2010-vapor-instrument.pdf
    (sha256 cad604c54f8982d5eb6f91f122ca1b257252d6994b220333226220b86154df5f
    matches sidecar). Clean text layer via pdftotext -layout; Table 4 and method
    prose transcribed; Figs 5–9 EGA traces are figure-only and were NOT digitised
    (authors state the work was not calibrated and no attempt was made to
    quantify evolved-gas amounts). Printed protocol numbers (sample masses,
    ramp 5 °C/min, 25–1200 °C, chamber pressures) and qualitative Table 4
    detection lists for this work are landed. Kelvin companions carry DERIVED
    stamps (T_K = T_C + 273.15). Modelled on pyrolysis / instrument extracts
    (cardiff-2007-vacuum-pyrolysis-gsfc; N1 lpsc-2024 style benches/experiments).
