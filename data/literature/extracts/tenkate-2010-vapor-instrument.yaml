    ten Kate, I.L., Cardiff, E.H., Dworkin, J.P., Feng, S.H., Holmes, V.,
    Malespin, C., Stern, J.G., Swindle, T.D. & Glavin, D.P. (2010), "VAPoR –
    Volatile Analysis by Pyrolysis of Regolith – an instrument for in situ
    detection of water, noble gases, and organics on the Moon", Planetary and
    Space Science 58:1007–1017, DOI 10.1016/j.pss.2010.03.006
  doi: 10.1016/j.pss.2010.03.006
  url: http://dx.doi.org/10.1016/j.pss.2010.03.006
