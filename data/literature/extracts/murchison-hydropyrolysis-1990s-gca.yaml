    and Gilmour, I. (2004), Hydropyrolysis of insoluble carbonaceous matter in the Murchison meteorite:
    new insights into its macromolecular structure, Geochimica et Cosmochimica Acta 68(6) 1385-1393, DOI
    10.1016/j.gca.2003.08.019'
