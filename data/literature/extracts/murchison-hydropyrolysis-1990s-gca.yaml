    Elsevier GCA. pdftotext -layout used only to locate tables; not data. Tables 1-3 transcribed from
    a 400 dpi pdftoppm render (docs-private/research/ocr-artifacts/murchison-hydropyrolysis-1990s-gca/p-5.png
    and p-6.png). Printed units retained (wt%, ppm, permil, deg C, MPa) before converting T to K as T_K
    = t_C + 273.15. This work''s H2-pyrolysis IRMS (Table 1 plain text) kept distinct from italics mass-balance
