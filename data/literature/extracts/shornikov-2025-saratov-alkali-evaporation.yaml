            - '“They appeared in the first millions of years at the stage of formation of the protoplanetary disk.”'
            - '“According to the estimates of various authors, the chondrules were completely melted at 1800–2100 K in a few minutes, which could have been caused by the passage of a shock wave through the dust component of a gas-dust cloud.”'
            - '“Further cooling of the chondrules occurred in a wide range of velocities (50–1000 K/h) in a hydrogen medium at 10^-4–10^-3 atm.”'
