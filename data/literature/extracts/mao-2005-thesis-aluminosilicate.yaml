  method: >-
    Manual review of the 44-page KTH kappa PDF. Pages were rendered at 200 dpi
    and read as images; the born-digital pdftotext -layout layer was used as a
    cross-check. The file contains the abstract, preface, chapters 1–6,
    acknowledgements and bibliography (printed pp. v–34). The Contents line
    "Appended papers" is present, but papers I–V are not in this PDF (the
    file ends at the bibliography). There are no data tables and no figures
    in this kappa. Printed model formulae, coordination-number statements,
    and the bibliographic identities of papers I–V are retained in context.
    No assessed parameters, invariant points, or experimental tables were
    printed here, and none were taken from the missing appended papers.
