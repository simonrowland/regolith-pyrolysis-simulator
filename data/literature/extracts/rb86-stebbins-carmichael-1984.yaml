        reading_note: Table 1 run numbers indicate measurement order; run 294 is the printed identifier
          and is retained unchanged.
    - observation_id: sc1984_capsules_and_calorimetry_method
      type: experimental_method_context
      locator:
        page: 2
        published_page: 293
        pdf_page_index: 1
        section: Calorimetry
      units: as printed
      values:
        method_as_printed: Diphenyl ether drop calorimeter; reference temperature 300 K; Pt-40%Rh wire-wound
          furnace.
        sample_mass_as_printed: about 2 g
        capsules_as_printed: Capsules made from 0.25 mm Pt–10%Rh sheet and tubing; argon filled and arc
          sealed. C-2 interior plated with about 0.03 mm iron.
        calibration_as_printed: NBS 720 sapphire standard run once for every one or two sample drops.
        capsule_mass_change_as_printed: Neither capsule showed weight changes greater than a few tenths
          of a milligram.
        source_note: The capsule material is recorded here as printed; the argon fill is not promoted
          to a total-pressure condition.
    - observation_id: sc1984_table1_fit_note
      type: author_fit_context
      locator: *id003
      units: J g−1 and J g−1 K−1 as printed
      values:
        equation_as_printed: 'runs 210–220: ΔH = 1.1960 T − 255.86 J g−1'
        fit_uncertainty_as_printed: σ_H = 9.2 J g−1; σ_Cp = 0.045 J g−1 K−1
        temperature_range_status: No fit temperature interval is printed; the note names runs 210–220.
        standalone_liquid_Cp: No standalone liquid Cp is printed. The slope is retained only as a coefficient;
          no Cp was calculated from it.
    - observation_id: sc1984_table2_method_and_precision
      type: chemical_analysis_method_context
      locator:
        page: 2
        published_page: 293
        pdf_page_index: 1
        section: Analysis of samples after experiments
      units: '% and stated relative precision'
      values:
        total_iron_method: Total iron determined by ammoniacal thioglycolic acid and reported as FeO.
        ferrous_iron_methods: Colorimetric Wilson (1960) includes metallic iron as FeO; titrimetric Wilson
          (1955) responds differently. Sensitivity was calibrated using samples with known metal amounts.
        reduction_note: Combination of the three analyses yields ferrous, ferric, and metallic iron. Fe2O3
          is calculated from FeO and FeOtot; Fe° is calculated from FeOtot and two FeO analyses except
          zeros determined from absence of magnetic material.
        method_precision_as_printed: Total iron ±0.5% of amount present; Fe2O3 ±20%; Fe° ±50%. Errors
          for Fe2O3 and Fe° are larger because values are calculated from small differences between large
          numbers.
        confidence_level: not stated
        post_quench_state: The analysis is of quenched bulk sample and excludes metal precipitated onto
          or dissolved in capsule walls.
    - observation_id: sc1984_table2_theoretical_fayalite_reference
      type: reference_composition_context
      locator:
        page: 3
        published_page: 294
        pdf_page_index: 2
        table: '2'
        row: theoretical fayalite
      units: '% by weight'
      values:
