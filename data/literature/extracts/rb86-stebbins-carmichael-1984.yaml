        eq10_temperature_range: not stated
        simplified_fit_eq11_as_printed: ΔH_inc = 119.91 T − 3.1167 × 10−2 T² − 21057 J mol−1
        eq11_temperature_range_as_printed: 900–1900 K
        incongruent_fusion_as_printed: 88.4 ± 1.1 kJ mol−1 at the 1 bar peritectic temperature of 1490
          K.
        error_definition: Error bracket is twice the standard error calculated from calorimetry uncertainty
          and an assumed 50% uncertainty in peritectic liquid ferric content; quench phase-ratio uncertainty
          is probably smaller.
    - observation_id: sc1984_congruent_fusion_correction_and_result
      type: fusion_result_context
      locator:
        page: 5
        published_page: 296
        pdf_page_index: 4
        equation: '12'
        section: Heat of fusion calculations
      units: kJ mol−1 and J mol−1 as printed
      values:
        reaction12_as_printed: Fe2SiO4(solid) = Fe2SiO4(liquid)
        reaction13_as_printed: 0.025Fe°(sol) + 0.025Fe3O4(liq) = 0.10FeO(liq)
        estimated_reaction_enthalpy_as_printed: 0.025 × 35 kJ mol−1 ≈ 900 J mol−1
        hypothetical_congruent_fusion_as_printed: 89.3 ± 1.1 kJ mol−1
    - observation_id: sc1984_inherited_solid_enthalpy_and_quench_mixture_correction
      type: inherited_input_context
      locator:
        page: 5
        published_page: 296
        pdf_page_index: 4
        equation: '8'
        section: Heat of fusion calculations
      units: J mol−1 and J g−1 as printed
      values:
        attribution: Robie, Hemingway, and Fisher (1982), inherited high-temperature fayalite solid enthalpy
          equation based on Orr (1953) drop calorimetry and 5–383 K adiabatic heat capacity.
        equation8_as_printed: H_T − H_300 = 123.80T + 3.1167 × 10−2 T² − 36771 J mol−1
        accuracy_and_range_as_printed: Within 200 J mol−1 between 900 and 1900 K.
        glass_correction_as_printed: If non-fayalite mixture were primarily glass, computed fusion heat
          could be too low by 10–15%; careful microscopy found no glass and authors estimate less than
          2% of sample.
        laihunite_caveat: If the interstitial mix contained a high proportion of laihunite, precise correction
          could not be made because thermochemical data were unavailable; the erratum changes only the
          laihunite reference, not measured values or equations.
        equation9_as_printed: Fe3O4(sol) + Fe°(sol) + 2SiO2(sol) = 2Fe2SiO4(sol); ΔH = −121.0 J per g
          magnetite, attributed to Robie et al. (1979).
        c2_magnetite_mixture_estimate: C-2 indicates 0.0946 g Fe3O4 per g sample; assuming interstitial
          residuum is magnetite plus tridymite gives H_300^fay − H_300^mix = −11.45 J per g sample, about
          2.5% of ΔH_inc.
