    - observation_id: sc1984_table2_c2_postquench_liquid_and_iron_loss
      type: quench_correction_context
      locator:
        page: 3
        published_page: 294
        pdf_page_index: 2
        table: '2'
        section: Results and discussion
      units: '% by weight as printed'
      values:
        c2_iron_loss_as_feo: about 0.5 ± 0.5%
        c2_metal_in_bulk_analysis: about 1.5% Fe°
        equilibrium_peritectic_liquid_fe2o3_from_iron_loss_only: 0–2 wt.%
        quench_disproportionation: Each mole of metallic Fe formed during quench generated one mole of
          ferric iron; Eq. (3) is 2Fe2SiO4(liq) = Fe°(sol) + Fe2O3(liq) + FeO(liq) + 2SiO2(liq).
        liquid_equilibrium_fe2o3: Table 2 footnote 7 calculates 2.1 wt.% Fe2O3 for the liquid in equilibrium
          with metallic iron at 1520 K, assuming the metal formed during quench.
        other_run: For Orr (1953), some fayalite apparently remained unmelted and nucleated during cooling;
          the paper says that liquid did not apparently disproportionate on quench and cites 2.3% Fe2O3
          from Bowen and Schairer.
    - observation_id: sc1984_capsule_iron_loss_and_c1_liquid_correction
      type: iron_loss_correction_context
      locator:
        page: 2
        published_page: 293
        pdf_page_index: 1
        section: Run products
      units: '% by weight as printed'
      values:
        c1_capsule_wall: At least 15% Fe at silicate contact, falling to near zero by 0.1 mm into platinum.
        c1_required_iron_loss: 1–2% as FeO from sample.
        c2_plating: Iron plating remained intact; iron precipitated on the capsule wall during melting
          could not be distinguished from original plating.
        c1_liquid_fe2o3_before_quench: about 3.7 ± 1 wt.% Fe2O3; also stored as a measured-reduced liquid
          composition observation.
        cp_composition_corrections: The adjustment to equilibrium peritectic liquid Cp is 0.18%; correction
          to pure Fe2SiO4 liquid Cp is 0.34%; both are much less than experimental Cp error of about 3.5%
          and were ignored.
    - observation_id: sc1984_incongruent_fusion_equations_and_result
      type: fusion_result_context
      locator:
        page: 5
        published_page: 296
        pdf_page_index: 4
        section: Heat of fusion calculations
      units: kJ mol−1 and J mol−1 as printed
      values:
