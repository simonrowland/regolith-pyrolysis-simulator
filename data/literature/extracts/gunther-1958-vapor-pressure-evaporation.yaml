    area was checked against the page render. The scanned pdftotext-layout.txt is empty; MinerU supplied the machine
    transcription. The standalone tools/mineru_table_draft.py (offer-21 line) compare reports 12 exact matches and
    24 comma-decimal mismatches; all 24
    mismatches were resolved against the PDF renders, and row/column assignments were checked against the renders.
    The pressure columns are printed p·10^4 [Torr]; pressure_as_printed retains each mantissa, while numeric P/value fields apply the printed 10^-4 scale and migrate through the existing Torr conversion.
    The SiO orifice area is kept per point as printed. Figure 5 is figure-only and excluded.
