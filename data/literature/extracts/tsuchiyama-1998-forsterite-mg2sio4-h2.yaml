      type: apparatus
      locator:
        published_page: 115
        pdf_page_index: 2
        section: Evaporation experiments and Fig. 1
      units: as printed
      values:
        quantity: experimental_method_and_apparatus
        method_as_printed: Isothermal evaporation of forsterite single crystals under maintained H2 pressure in
          a two-chamber vacuum furnace; paper does not call it Knudsen effusion or Langmuir free evaporation. No
          matching experiment-method enum was selected.
        chamber_base_pressure_bar: sample-chamber pressure below about 10^-8 bar before heating
        H2_start_delay_min: 8
        H2_pressure_bar: 1.4×10^-5
        H2_pressure_drift_bar: within 6×10^-7 during heating
        pressure_gauge: ion gauge; corrected using ionization sensitivities of H2 and N2
        ionization_cross_sections: No cross-section values/source stated; H2 and N2 sensitivity correction only.
        ionization_energy_eV: not applicable; no mass spectrometer was used (bench ionization fields are typed not_applicable)
        multiplier_or_isotope_corrections: not applicable; no mass spectrometer was used (bench fields typed not_applicable)
        intensity_to_pressure_calibration: not applicable; no mass spectrometric ion intensities or sample vapor
          partial pressures were measured
        cell_geometry: Mo crucible inner diameter 16 mm, length 124 mm; no liner stated; no orifice
        temperature_sensors: W5Re-W26Re TC-2 on sample side measured; W5Re-W26Re TC-1 below crucible controlled
          temperature
        temperature_calibration: Fe melting point 1535°C, Ni 1453°C, Au 1064°C
        temperature_precision: better than ±10°C
        apparatus_details: Stainless-steel two-chamber furnace; sample chamber turbomolecular pumped; heater chamber
          diffusion pumped; Ta heater and shields; W walls between chambers near heater; alumina insulators omitted
          within about 7 cm of sample.
        source_sensor_label_conflict: Figure 1 caption assigns TC-1 to measurement and TC-2 to control; body text
          assigns TC-2 to measurement and TC-1 to control. The body text also says TC-2 is at sample side and TC-1
          below crucible.
