    - observation_id: tsuchiyama_1998_alpha_discussion_qualifiers
      type: thermodynamic_example
      locator:
        published_page: 121
        pdf_page_index: 8
        section: Evaporation rates in the experiments and Table 2 discussion
      units: as printed
      values:
        quantity: author_interpretation_and_data_qualifiers
        method_class: quoted_unattributed
        claims:
        - Measured rates are below ideal model rates; surface kinetics constrain evaporation.
        - The present alpha changes from 0.04 to 0.12 between 1200 and 1450°C; extrapolation reaches alpha=1 at
          forsterite melting temperature 1898°C, “as Sata et al. (1978) proposed for other oxides” (pp. 121–122).
        - Possible alpha effects include vapor recondensation, furnace redox change, surface kinetic constraints.
          Based on the analysis of Tsuchiyama (1998) as printed on p. 122, recondensation flux is not large enough
          to explain low alpha, but cannot be ignored completely.
        - Mo crucible is expected to slightly reduce gas and enhance j_Fo; the effect is small (Tsuchiyama, 1998;
          p. 122).
        - Surface atomic processes kinetically control evaporation; solid contaminants suppress evaporation and
          melt contaminants might promote it.
        - Quantitative contributions of interface kinetics and contaminants cannot be evaluated.
        - alpha is approximately 0.1 under H2-rich 1.4×10^-5 bar at 1200–1450°C; melt contaminant amount may increase
          with increasing temperature.
        - Strictly alpha is a function of temperature and p_total, but data are insufficient and scattered; authors
          conclude roughly 0.1 irrespective of temperature, p_total, or regime, with errors within factor about
          three.
        - Forsterite evaporates roughly with alpha=0.1 in H2 and vacuum.
        activity_standard_state: No oxide activities were measured or reported; no activity standard state applies.
