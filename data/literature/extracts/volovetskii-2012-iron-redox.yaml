  - species: Fe
    observation_id: volo12_i2_granite_table1
    field: experimental_conditions_as_printed
    value: "Experiments were carried out at a total pressure of 1 atm using a high-temperature furnace with controlled oxygen partial pressure (up to 1500°C). The furnace is described in detail elsewhere [22]. Approximately 550 mg of a starting glass were preliminarily ground in an agate mortar under ethanol and placed in a cylindrical corundum crucible with a height of 8 mm and an inner diameter of 6 mm. The crucible with the material was suspended in the gradient-free zone of the furnace, which is a vertical ceramic tube with an inner diameter of 22 mm. Temperature was controlled using a PtRh10 thermocouple placed directly near the sample container with an accuracy of 1–2°C. The temperature gradient in the sample was no higher than 2–3°C. The sample was quenched by rapid removal from the furnace and immersion in water. The desired oxygen regime in the working volume of the furnace was maintained during the experiment using air–nitrogen and H₂–CO₂ gas mixtures of certain compositions. The uncertainty of fO2 was no higher than 0.1 logarithmic units."
    locator: {"pdf_page_index":5,"page":6,"published_page":335,"section":"Experimental Procedure"}
