figures:
- figure: '1'
  caption_as_printed: 'Gibbs energies of formation of mullite from oxides: determined (1) by high-temperature
    calorimetry [69], (2–4) from heterogeneous equilibria in slags [7, 10, 44], and (5–9) by Knudsen mass
    spectrometry in [29, 32, 59, 60] and this work; calculated (10–16) from the thermochemical data in
    [14, 17, 22, 25, 28, 33] and this work, (17) by the Redlich–Kister equation [49], (18) by the Monte
    Carlo method [68], (19) by the Kapur–Froberg equation [24], (20) by the lattice model [26], (21) from
    the data on the phase diagram [63], (22) by the quasi-chemical model [27]; and (23) estimated values
    [67].'
