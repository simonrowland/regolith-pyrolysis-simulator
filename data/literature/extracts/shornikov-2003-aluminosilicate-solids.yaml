      type: partial_pressure
      locator:
        page: 5
        published_page: 1041
        pdf_page_index: 4
        figure: '3'
        note: "Figure 3, 600 dpi, PDF page 5, published page 1041. T = 1900 K. Quantity as printed is -log p_1900(i) with p in atm. Symbols: filled circles SiO, inverted triangles Al, filled triangles AlO, crossed squares O. Log axes, calibrated in log space from the label centres beside the y axis: 4.0 at y=685 (the dotted reference line; the 4.0 digit centre is y=699, 14 px lower), 8.5 at y=1104, 9.0 at y=1364, 9.5 at y=1606. Lower scale -log = 8.5 + (y-1104)/520, from the 8.5 and 9.0 labels (520 px per log unit). The 9.5 label lies 18 px (0.035 log) off that line; that residual is inside the stated read uncertainty. The upper segment has only the 4.0 line, so the same 520 px per log unit is applied: -log = 4.0 + (y-685)/520. The tilde break is y=847-880; nothing in that band was stored. Lower-segment points with 890 < y < 1000 sit above the 8.5 tick toward the break, and their dex uncertainty is widened by 0.03. The upper-segment SiO circles and the O squares near y=1053 do not get that extra term. Left of the x-axis break, mol% = (x-2799)/21.60 (0 at the y axis, 20 at the glyph midpoint x=3231). Right of the break, mol% = 60 + (x-3618.5)/18.20 (60 at x=3618.5, 80 at x=3985, 100 at x=4347). Read 1 is the connected-component centre. Read 2 is the radius-12 centroid at threshold 140. The stored coordinate is the mean. read_uncertainty is at least half a marker (16 px, 22 px where two markers touch) and contains both reads. It is a digitising width, not a printed interval. Partial pressure is not an activity, so the pure-oxide reference rule is not applied. Piles on the y axis, the fused oval near 68 mol% on the 4.0 line, the legend stack, and the guide-line blobs were refused one by one; the audit lists them."
