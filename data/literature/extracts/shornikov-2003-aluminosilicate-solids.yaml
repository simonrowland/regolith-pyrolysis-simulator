extraction:
  method: Prose values checked against pdftotext-layout and the 600 dpi renders. No content_list table
    exists. Figure 3 partial pressures that sit on a distinct x, off the piles and off the legend, were
    read on the 600 dpi page and recalibrated from the labelled tick marks (9.0 stub centre y=1369, 9.5 baseline centre y=1613.5, 489 px per log unit). The isolated Al triangle at (3193.8, 1448.1) was added. Figure 2 panel (b) open squares of caption symbol 1 were scored at six measured hole centres. Filled triangles on the same panel were scored as caption symbol 2 (three upright triangles) and caption symbol 4 (four inverted triangles). The second symbol-4 centre, (5890.2, 2687.5), is the centroid after a radius-3 opening, because the raw component includes the fit line. The third symbol-4 centre, (7829.7, 1390.2), is the same opening centroid, between the labelled 7 and 8 stubs and between the labelled 2000 and 2200 stubs. Panel (a) adds one filled inverted triangle, caption symbol 4, at (4008.1, 1336.3). Panel (c) adds one open diamond, caption symbol 6, at (1715.6, 5503.5). Panel (e) adds two filled diamonds, caption symbol 7, and one filled square, caption symbol 10. Panel (f) adds one filled square, caption symbol 10, at (8382.8, 6082.9). Panel (h) adds two filled squares, caption symbol 10, at (6234.0, 9858.7) and (8332.1, 8607.4). A centre past the outermost labelled tick is read when the marker's own edges fit and the axis has at least two labelled ticks. The extrapolation is flagged and is inside the read uncertainty. An unlabelled stub is not an anchor. Every other filled component on Figure 2, including markers the 90 px census missed because they join the fit line, is one audit row and was not given a pressure. This article does not print the 12.9 ± 0.8 kJ/mol or 11.6 ± 0.4 J/(mol K) mullite values;
    those are in the 2002 Doklady paper.
