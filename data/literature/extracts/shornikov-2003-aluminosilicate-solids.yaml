          caption symbol 2 and the filled inverted triangles at (6746.1, 2302.4) and
          (5890.2, 2687.5) are caption symbol 4; all three are stored. The second symbol-4
          centre is a radius-3 opening centroid, because that marker joins the fit line.
          A gray<90 census of the eight panels (bbox 14-90 px, area 350-2800, enclosed hole
          at most 60 px) found 105 filled components. Markers joined to a line were outside
          that bbox cut. A radius-3 opening separated those bodies, and each new body has an
          audit row. Literature symbols 11-18 stay context. The fit lines were not digitized.'
