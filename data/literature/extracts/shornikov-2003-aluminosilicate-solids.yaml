  method: Prose values checked against pdftotext-layout and the 600 dpi renders. No content_list table
    exists. Figure 3 partial pressures that sit on a distinct x, off the piles and off the legend, were
    read on the 600 dpi page and recalibrated from the labelled tick marks (9.0 stub centre y=1369, 9.5 baseline centre y=1613.5, 489 px per log unit). The isolated Al triangle at (3193.8, 1448.1) was added. Figure 2 panel (b) open squares of caption symbol 1 were scored at six measured hole centres. Filled triangles on the same panel were scored as caption symbol 2 (one upright triangle) and caption symbol 4 (two inverted triangles). The second symbol-4 centre, (5890.2, 2687.5), is the centroid after a radius-3 opening, because the raw component includes the fit line. Every other filled component on Figure 2, including markers the 90 px census missed because they join the fit line, is one audit row and was not given a pressure. This article does not print the 12.9 ± 0.8 kJ/mol or 11.6 ± 0.4 J/(mol K) mullite values;
    those are in the 2002 Doklady paper.
