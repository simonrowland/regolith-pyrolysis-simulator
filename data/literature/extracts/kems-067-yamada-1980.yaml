extraction:
  method: Official J-STAGE OA PDF (raw/kems-067-yamada-1980/kems-067-yamada-1980.pdf). Japanese
    body with English synopsis, table captions, and figure captions. pdftotext -layout is
    a noisy OCR layer and is not data. Tables 1-2 and printed numerals transcribed from 400
    dpi pdftoppm renders of PDF pages 1-8 (published pp. 488-495). Where the decode and the
    render disagree, the render wins. Figs 1-9 listed figure-only; axes were not digitised.
    Table 1 ion-current ratios kept as measured. log gamma_Si^o = -3.1 +/- 0.2 and epsilon_Si^Si
    = 11.5 +/- 1.5 kept as model_derived (Belton-Fruehan integration of this-work ion ratios,
    using a literature-average log gamma_Si = -0.33 at N_Si=0.5 as the integration constant).
    Table 2 This work row kept distinct from quoted investigators. Japanese-only prose beyond
    captions/numerals recorded as unseen.
