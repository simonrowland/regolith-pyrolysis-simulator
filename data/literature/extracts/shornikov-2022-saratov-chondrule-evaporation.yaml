source:
  citation: >-
    Shornikov, S. I., Yakovlev, O. I., Minaeva, M. S. and Minaev, V. S. (2022).
    Thermodynamics of evaporation of chondrule melts of Saratov chondrite.
    53rd Lunar and Planetary Science Conference, abstract 1250.
  year: 2022
  conference: 53rd Lunar and Planetary Science Conference
  url: https://www.hou.usra.edu/meetings/lpsc2022/pdf/1250.pdf
  corpus_asset: raw/shornikov-2022-saratov-chondrule-evaporation/shornikov-2022-saratov-chondrule-evaporation.pdf
  corpus_sha256: f5c249e8d31939b1a6b980ebac3ab722d6d63672272df88af8f537a5bafa43f6
extraction:
  method: >-
    Manual review of the two-page LPSC 2022 abstract. Pages were rendered at
    200 dpi and read as images; the born-digital pdftotext -layout layer was
    used as a cross-check. The abstract has no tables. Figures 1–3 are
    context-only figure records with no digitised points. Printed numeric
    statements (starting composition, temperature ranges, approximate alkali
    mass loss, calculated activity-coefficient range, and discussion residuals)
    are retained in context. The mass-spectrometric experiment is attributed
    to Yakovlev et al. 1987 [3]; this abstract reports a thermodynamic
    calculation compared with that experiment. No new measured table is printed.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/shornikov-2022-saratov-chondrule-evaporation/
