        sample_label: type IIB pyroxene chondrules of Saratov chondrite
        attribution: >-
          Composition is printed in this abstract as the oxide material of the
          chondrules. The evaporation experiment itself is cited as a single
          mass spectrometric experiment [3] (Yakovlev et al., 1987, Meteoritika
          46, 104–118). Experimental details are cited to Yakovlev et al. [4]
          (1984, Meteoritika 43, 126–132).
        SiO2: '54.44'
        TiO2: '0.13'
        Al2O3: '3.20'
        FeO: '13.17'
        MgO: '24.98'
        CaO: '2.24'
        Na2O: '1.44'
        K2O: '0.40'
        note: >-
          Eight oxides are printed. The printed values sum to 100.00 wt%.
          No other oxide (MnO, Cr2O3, P2O5, NiO) is printed in this abstract.
    - observation_id: shornikov_2022_experiment_cited_from_yakovlev_1987
      type: method
      locator:
        page: 1
        pdf_page_index: 0
        published_page: '1250.pdf'
        section: body
      units: as printed
      values:
        quantity: cited_knudsen_evaporation_experiment
        method_class: method_only
        evidence_class: quoted_attributed
        attribution: 'Yakovlev et al. [3] (1987); details [4] (1984)'
        apparatus_as_printed: tungsten cell (according to Knudsen)
        temperature_range_K_as_printed: 1300–2400
        sample_as_printed: pyroxene chondrules of Saratov chondrite
        residue_calculation_as_printed: >-
          The composition of the residual melt (Figs. 1a and 2) was calculated
          from the partial pressures (p) of the vapor species over the
          chondrule melt vs. the temperature and evaporation time [3].
        this_work_as_printed: >-
          Theoretical calculations of thermodynamic properties of the chondrule
          melt of Saratov chondrite at 1300–2400 K were performed using a
          semi-empirical model designed to calculate activity coefficients in
          the CaO–MgO–Al2O3–FeO–TiO2–SiO2 melts [5], supplemented with
          thermodynamic data for K2O–SiO2 [6], Na2O–SiO2 [7], and
          K2O–Na2O–SiO2 melts [8].
    - observation_id: shornikov_2022_two_stage_evaporation_text
      type: textual_fact
      locator:
        page: 1
        pdf_page_index: 0
        published_page: '1250.pdf'
        section: body
      units: as printed
      values:
        quantity: evaporation_stages_as_printed
        method_class: quoted_attributed
        evidence_class: quoted_attributed
        attribution: Stated as following from Fig. 1a and 2, which show results of [3] as symbols and calculated lines from this work.
        stage_1:
          T_range_K_as_printed: 1300–1600
          process_as_printed: evaporation of K2O and Na2O from the melt with an almost unchanged content of the remaining oxides (Fig. 1a)
          mass_loss_as_printed: the melt loses approximately 2 wt % during evaporation, which corresponds to the total amount of evaporated alkaline oxides
        stage_2:
          T_range_K_as_printed: 1600–2400
          volatility_order_as_printed: 'FeO, SiO2, MgO, TiO2, CaO and Al2O3 (Fig. 2)'
          inversion_as_printed: an inversion occurs in the MgO / SiO2 content ratio in the chondrule melt
          residual_refractory_as_printed: >-
            a symbatic increase in the TiO2, CaO and Al2O3 content up to 5 wt %
            of residual melt. Then the melt successively loses TiO2 and CaO.
        alkali_volatility_as_printed: >-
          the symbateness of the change in the K2O and Na2O contents during
          evaporation indicates an approximate equality of their volatility.
        note: >-
          The phrases "approximately 2 wt %" and "up to 5 wt % of residual
          melt" are carried verbatim. No figure points were digitised, and
          the 2 wt % statement was not recomputed from the printed Na2O+K2O
          contents.
    - observation_id: shornikov_2022_calculated_alkali_activity_coefficients
      type: textual_fact
      locator:
        page: 2
        pdf_page_index: 1
        published_page: '1250.pdf'
        figure: '1b'
        section: body
      units: dimensionless
      values:
        quantity: activity_coefficient
        method_class: model_derived
        evidence_class: model_derived
        quantity_token: activity_coefficient
        species_as_printed:
        - K2O
        - Na2O
        range_as_printed: '10−12–10−8'
        dependence_as_printed: symbatic linear logarithmic dependences of their activity coefficients (Fig. 1b)
        simultaneous_end_as_printed: the evaporation of these oxides ends almost simultaneously (Fig. 1c)
        k_vs_na_pressure_as_printed: >-
          Despite the K2O high individual volatility, its partial pressure is
          lower than the Na2O partial pressure due to its low content in the
          melt.
        acidity_as_printed: >-
          The chondrules of Saratov chondrite contain a significant amount of
          SiO2 (54.44 wt %), which provides a high acidity of the melt, which
          does not allow K2O to exhibit high volatility during evaporation.
        note: >-
          The activity-coefficient range is a calculated result from this
          work, shown as a figure curve. The range is stored as printed;
          individual γ(T) points were not digitised.
