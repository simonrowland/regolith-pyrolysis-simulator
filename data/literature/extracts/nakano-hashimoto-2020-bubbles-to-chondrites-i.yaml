      - observation_id: nakano_2020_apparatus_and_run_conditions
        type: rate_series
        locator: {page: 3, section: Experimental methods, figure: '1'}
        phase: boiling_silicate_melt
        regime: laser_boiling_with_inert_gas_cooling
        units: as_published
        values:
          apparatus:
            laser: 'cw CO2, 10.6 um, 20-210 W, NIIC NC-3010-M, ZnSe lens focal distance 127 mm'
            chamber: 'stainless steel, 97 mm ID x 310 mm H'
            pumps: '50 L/s turbomolecular pump plus oil-free roughing pump'
            evacuation: '10^-5 Torr before filling; valves closed during run'
            gas: 'H2 to 10^-2 bar, then Ar to 0.3 bar; stated purities H2 99.99%, Ar 99.9%'
            holder: '0.5 mm Re wire and graphite disk with 0.5-1 mm gap'
            sample: 'about 15 mg, approximately 3 mm high x 2.3 mm diameter; miniature cylinder'
            temperature: 'IMPAC IS-12 automated pyrometer, 0.7-1.1 um, 700-3500 °C, effective spot about 0.7 mm; quartz/prism absorption correction'
            collection: '7 um mesh paper filter; five Cu plates and chamber wall for droplets'
          timing: '200 W: melts in about 0.2 s and begins boiling in about 0.5 s; 50 W timing varies by run'
          vapor_handling: 'authors state vapor was 100% converted to solid condensates by collision with cold ambient gas; condensates recovered by vacuum suction'
          temperature_profile_example: 'run 3 reaches 2200 °C in 1 s and about 2600 °C in 14 s (Fig. 4)'
