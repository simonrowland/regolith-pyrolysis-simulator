source:
  citation: >-
    Kupčák, J. and Mališ, A. (1992). Use of oxygen probes in the study of thermodynamic properties of the system Na2O-SiO2
    and the effect of electron conductivity of solid electrolyte on EMF of the concentration cell. Ceramics-Silikáty 36(1):1–6.
  year: 1992
extraction:
  method: >-
    Table I and Table II transcribed from the MinerU table blocks and pdftotext-layout text, then checked against rendered
    PDF pages 3 and 4 for row and column assignments. Table I cell readings agree numerically between the two machine reads;
    comma-decimal detection is a false positive for its x(SiO2) composition column. Table II numeric readings agree between
    both machine reads. Figure 4 was inspected only to record its axes and series; no figure values were digitised.
  date: '2026-10-28'
  worker: codex
