schema_version: literature_extract.v1
source_id: kems-220-sasamoto-1979
source:
  citation: >-
    Sasamoto, T., Kobayashi, M., and Sata, T. (1979). Mass Spectrometric
    Investigation of Vapor Species over Liquid Germanium Dioxide, in
    Hastie, J. W. (ed.), Characterization of High Temperature Vapors
    and Gases, NBS Special Publication 561, Vol. 1, pp. 283-288,
    National Bureau of Standards, Washington, DC. Proceedings of the
    10th Materials Research Symposium, Gaithersburg, Maryland,
    September 18-22, 1978. Issued October 1979.
  doi: 10.6028/NBS.SP.561v1
  doi_scope: volume; this extract is the Sasamoto, Kobayashi and Sata chapter only (printed pp. 283-288)
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nbsspecialpublication561v1.pdf
  year: 1979
  corpus_asset: raw/hastie-1979-characterization-of-high-temperature/hastie-1979-characterization-of-high-temperature.pdf
  corpus_sha256: 5d49070831fdc68ca308fa85c9ea96203e6d717ac72ad65cd280ed2f562d44a2
extraction:
  method: >-
    Manual transcription from the NBS SP 561 Vol. I scan already on the
    box. Printed pages 283-288 are PDF pages 307-312 (pdf_page_index
    306-311; PDF page = printed page + 24). Pages were rendered at 200
    and 400 dpi and read as images; pdftotext was used only as a
    cross-check. Appearance potentials have no closed scored observation
    type in literature_extract.v1 and are stored as context. The two
    printed parent-species abundance ratios at about 1300 °C are scored
    as gas_speciation. Figures 1-3 were not digitised. Equation (2) is
    an author estimate from eq. (1) with no supporting T-P table and is
    kept as context. Printed page 288 is blank in this scan. Distinct
    from sasamoto-1974-magnesia-vacuum-vaporization-porosity and from
    kems-042-plante-1979 in the same volume.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/hastie-1979-characterization-of-high-temperature/
review_status: draft
