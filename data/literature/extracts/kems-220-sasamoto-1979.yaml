        pdf_page_index: 307
        section: Experimental
      units: as printed (relative ionization cross sections from [2,3])
      values:
        quantity: assumed_relative_ionization_cross_sections
        method_class: kems
        evidence_class: quoted_attributed
        sigma_Ge_as_printed: '5.71'
        sigma_O_as_printed: '1.27'
        sigma_GeO_as_printed: σ_Ge + σ_O = 6.98
        sigma_GeO2_as_printed: σ_Ge + 2σ_O = 8.25
        sigma_Ge2O3_over_GeO_as_printed: '2.1'
        multiplier_assumption_as_printed: we assumed the sensitivity of the secondary electron multiplier was S = 1 for all species
        references_as_printed: '[2,3]'
        note: These cross-sections are adopted from Mann [2] and Drowart et al. [3], not measured in this chapter.
    - observation_id: sasamoto_1979_observed_ions_and_appearance_potentials
      type: textual_fact
      locator:
        published_page: 285
        pdf_page_index: 308
        section: Results and Discussion
      units: eV
      values:
        quantity: observed_ions_and_appearance_potentials
        method_class: kems
        evidence_class: measured_direct
        figure2_ions_as_printed: 'Ge+, GeO+, GeO2+, Ge2O+, Ge2O2+, Ge3+, Ge3O+ and Ge3O3+'
        first_time_under_neutral_conditions_as_printed: 'Mass spectral ions from liquid GeO2, namely GeO2+, Ge2O+, Ge2O2+, Ge3+, Ge3O+, and Ge3O3+ were observed for the first time under neutral oxidizing conditions.'
        not_previously_observed_as_printed: 'The ions Ge3+ and Ge3O+ were not previously observed in the system, GeO2(hex) + Ge(c), although Ge2O+, Ge2O2+, and Ge3O3+ were observed.'
        ap_method_as_printed: The approximate appearance potentials were obtained by the linear extrapolation method, the energy scale being calibrated with the appearance potential (12.6 eV) of the H2O+ ion.
        appearance_potentials_eV:
          Ge_plus: '16.4'
          GeO_plus: '13.4'
          GeO2_plus: '13.4'
          Ge2O2_plus: '15.8 ± 3'
          Ge3O3_plus: '12.4'
        parent_ion_assignment_as_printed: >-
          We, therefore, consider that GeO+ is the parent ion and Ge+ is
          a fragment ion from GeO as Drowart, et al. suggested. From
          similar reasoning we consider that GeO2+ and Ge3O3+ are parent
          ions. Ge2O+, Ge3+ and Ge3O+ are safely considered to be
          fragment ions judging from their unusual composition, though
          their appearance potentials were not measured.
        comparison_with_drowart_as_printed: Although our values of the appearance potentials are several eV higher than those by Drowart, et al. [3], the relative magnitude of our appearance potentials for the two main gaseous species Ge+ and GeO+ compares well with that by Drowart, et al. [3].
        drowart_values_reprinted: false
        note: Appearance potentials are stored here because literature_extract.v1 has no closed scored type for them. Drowart et al. numerical appearance potentials are not reprinted and were not invented.
