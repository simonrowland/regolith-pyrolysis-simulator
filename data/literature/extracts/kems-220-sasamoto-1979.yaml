        method_class: kems
        evidence_class: method_only
        sample_as_printed: hexagonal GeO2 (99.99 percent purity)
        sample_mass_as_printed: about 200 mg
        instrument_as_printed: A Matauch-Herzog type double-focusing mass spectrograph (JMS-01BM, Japan Electron Optics Laboratory) equipped with a Knudsen source
        instrument_spelling_as_printed: Matauch-Herzog
        cell_as_printed: Knudsen cell (Pt 90%-Rh 10%)
        effusion_hole_diameter_as_printed: 0.3 mm
        heating_as_printed: The Knudsen cell was indirectly heated by the radiation from a tungsten outer cell which was heated by electron bombardment.
        thermocouple_as_printed: W 5 percent Re/W 26 percent Re thermocouple positioned at the bottom of the cell
        temperature_calibration_as_printed: Temperature calibration was made using an optical pyrometer and a carbon cell.
        ionizing_energy_as_printed: ionized by electrons of 20 eV except when measuring appearance potentials
        shutter_as_printed: The shutter effect was used to verify that the gaseous species originated from within the Knudsen cell.
