          main_apparatus: SETARAM TGA 24 with sample held in an alumina ring inside an alumina reaction tube; the paper states the slag films were saturated with Al2O3.
          preliminary_apparatus: SHTT films formed on Pt-30 pct Rh/Pt-6 pct Rh thermocouple wire at TUBAF.
          tga_temperature_range_K: 1673 to 1873
          tga_heating_rate_K_per_min: '30'
          tga_cooling_rate_K_per_min: '40'
          argon_preheat_flow_Nml_per_min: '50'
          oxidant_flow_Nml_per_min: '320'
          stated_starvation_flow_Nml_per_min: '300'
          mass_and_temperature_recording_interval_s: '2'
          atmosphere_change: Oxidant gas was switched on after the target temperature was reached.
          experimental_atmospheres_as_printed: [air, pure oxygen, argon]
          numeric_experimental_oxygen_partial_pressure: not stated
          total_pressure: not stated
          disposition: Gas flow rates are not total pressure; do not infer pO2 from a gas label.

