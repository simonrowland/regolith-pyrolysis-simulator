              values: ['66.59', '3.07', '17.84', '8.03', '4.47', '0.00']
          detection_note: Separately, the discussion says the result after 6 h in oxygen was near WDS noise; no detection limit is given, and that statement is not assigned to the 24 h Table IV cells.
          schema_gap: >-
            The Cr cells have the exact elemental-composition candidate under simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION, but the migrator cannot scale the printed at.% value for component_amount. Their structured rows retain each printed number and unit with component_amount null and a typed refusal. The Spinel sample phase label is preserved while the supported slag phase role identifies its host. The same two rows appear in Albertsson (2013), Table 20; that is overlapping data from the same study, not an independent replication.
          disposition: All twelve elemental cells are retained in table context; the Cr cells also have structured typed-refused records, with no values divided by 100.

