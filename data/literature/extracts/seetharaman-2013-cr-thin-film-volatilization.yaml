          schema_gap: >-
            The reported maximum dissolved ring Cr is atomic percent but is not assigned to one experiment. simulator/battery/enums.py::Quantity.RESIDUE_COMPONENT_COMPOSITION is mass-based and simulator/battery/enums.py::PHASE_BASIS_TOKENS has no atomic_percent basis; retain it as context with the printed unit and do not divide it.

