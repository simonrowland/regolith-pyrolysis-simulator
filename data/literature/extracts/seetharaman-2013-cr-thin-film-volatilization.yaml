schema_version: literature_extract.v1
source_id: seetharaman-2013-cr-thin-film-volatilization
source:
  citation: "Seetharaman, S., Albertsson, G. J., and Scheller, P. (2013), Studies of vaporization of chromium from thin slag films at steelmaking temperatures in oxidizing atmosphere, Metallurgical and Materials Transactions B."
  doi: 10.1007/s11663-013-9904-y
  year: 2013
extraction:
  method: >-
    Born-digital pdftotext-layout and MinerU table drafts. Tables I-IV and their row/column assignments were checked against 600 dpi page renders. Figure-only numeric points were left undigitized; printed figure legends and captions were checked against 600 dpi renders.
  date: '2026-11-03'
  worker: Codex
  schema_gap: >-
    Measured elemental Cr concentrations are printed in atomic percent. The exact candidate quantity is simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION; simulator/battery/migrate.py::QUANTITY_ALIASES maps component_amount to it, and tools/validate_literature_extracts.py::OBSERVATION_TYPES admits concentration_series. The controller ruled that these at.% values stay exactly as printed, with units at.%, and remain typed-refused until the migrator can scale this quantity. simulator/battery/migrate.py::_convert_compilation_amount passes component_amount through unchanged for this quantity; the percent_to_fraction selector in simulator/battery/migrate.py::select_declared_source does not include Quantity.EQUILIBRIUM_PHASE_COMPOSITION. Therefore each row retains the printed number in component_amount_as_published, sets component_amount to null, and gives a refusal reason; no divided value or converted twin is stored. simulator/battery/enums.py::PHASE_BASIS_TOKENS includes mole_fraction but no atomic_percent token. Table IV's Spinel label is retained separately from the supported slag phase role. Cr-specific loss and relative mass-loss-rate forms have no exact quantity token: simulator/battery/enums.py::Quantity.MASS_LOSS_FRACTION and simulator/battery/enums.py::Quantity.MASS_LOSS_RATE describe total-sample mass loss, simulator/battery/enums.py::Quantity.YIELD_FRACTION is not Cr loss, and simulator/battery/enums.py::Quantity.DISTRIBUTION_RATIO compares phase contents. The same Table IV WDS result is reproduced in Albertsson (2013), Table 20, and is not independent replication.
review_status: draft
