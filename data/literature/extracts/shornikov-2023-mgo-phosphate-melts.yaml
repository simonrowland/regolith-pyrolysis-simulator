extraction:
  method: >-
    The PDF is a journal excerpt. This extract is only the MgO–P4O10 article on
    published pages 60–62 (PDF pages 3–5). The SiO2–P4O10 ending on published page 60
    and the Slobodov article starting on published page 63 are excluded. No numeric
    table is printed. Figures were inspected at 120 dpi. Calculated curves have no
    discrete markers of this study, so no coordinates were read. Cited experimental
    symbols were not read.
