schema_version: literature_extract.v1
source_id: lpi-compendium-14163
source:
  citation: 'C. Meyer (2011), Lunar Sample Compendium: 14163 Bulk Soil Sample, Lunar and Planetary Institute, 11
    pp.'
  url: https://www.lpi.usra.edu/lunar/samples/atlas/compendium/14163.pdf
  year: 2011
extraction:
  method: 'transcription from the PageMaker PDF text layer; Table 1a/1b major-element cells assigned to columns
    from a 200 dpi render (pdftotext column alignment is ambiguous for the sparse columns); modal tables checked
    on a 150 dpi render; fix round 2026-10-05: trace blocks, p. 7-9 tables and Figure 8/9 annotations transcribed
    with pdftotext -bbox column x-coordinates and re-read on 300 dpi pdftoppm renders'
  date: '2026-10-05'
  worker: backlog30-lpi14163; fix-lpi14163
  provenance_path: tables/lpi-compendium-14163/
  scope: secondary compilation of Apollo 14 bulk-soil provenance, characterization and composition; no vaporization
    experiment
  apparatus_status: no vaporization apparatus, run conditions, pressure, temperature, crucible or calibration record
    stated
review_status: draft
scope_assessment:
  in_scope:
  - Table 1a and 1b major elements (SiO2 % to S %), one context row per reference column
  - modal tables (Simon et al. 1981; Carr and Meyer 1972)
  - sample provenance, masses and processing
  - maturity, grain size, C and N
  - mixing model
  - cosmogenic nuclides
  - Table 1a/1b trace elements (Sc to U), one context row per reference column (t5, t6)
  - p. 7 Table 2 coarse-fines compositions, one context row per printed column (t7)
  - p. 8 processing-diagram allocation masses (t8)
  - p. 9 Table 2 small rocks from 14422 (t9), Table 3 coarse fines (t10), Table 4 granitic coarse-fines 14161 (t11)
  - Figure 8 and Figure 9 printed annotations and run conditions (quoted; curves not digitised)
  out_of_scope:
  - Figures 1-9 curves, point clouds and axis ticks (figure_only; not digitised)
  - bibliographic page ranges and citation years in the reference list (pp. 9-11)
  battery_relevance_note: 'A secondary compilation: the bulk composition of a standard Apollo 14 highland soil (KREEP-rich)
    as reported by several labs, for feedstock definition. No experiment, so 0 observations, no bench and no experiment.
    Precedent lpi-compendium-14240 put its Table 1 under observations as composition_series (a scored type); here
    the composition rows are context type bulk_composition_compilation; main can promote them if it wants the 14240
    pattern. Fix round (2026-10-05, review FIX-FIRST at 8f46fd06): every printed number is carried as a located
    context row; no row moved to observations[] (observation-vs-context for 14163 is left to main).'
