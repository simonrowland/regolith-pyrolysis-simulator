          note: >-
            Caption assigns this study the numbers 3, 6 and 9 at 1673 K. On the
            600 dpi render, panel A holds strokes 1–6 and panel B holds 7–9.
            The body says panel A shows both the alkali-oxide activities and the
            P4O10 activities, with the alkali-oxide activity falling in the order
            Li2O, Na2O, K2O. Series 3 is the uppermost stroke of that alkali group.
            It is a continuous stroke, with no marker centre. Series 1 and 2 are
            the K2O–P4O10 and Na2O–P4O10 calculations and are not stored.
        phase: condensed
        units: dimensionless activity as plotted, log10
        T_range_K: [1673, 1673]
        standard_state: >-
          Published page 62 (PDF page 3): the initial values of the standard Gibbs
          energies of formation of the simple oxides are taken in the crystalline
          and liquid states (Glushko, 1978–1982; Barin, 1995). The paper does not
          state which of those phases is the reference of the plotted Li2O activity.
        uncertainty:
