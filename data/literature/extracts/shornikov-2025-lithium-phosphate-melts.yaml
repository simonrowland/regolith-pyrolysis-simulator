          method_class: model_derived
          temperature_range_K: [700, 1800]
          model: Semi-empirical model (Shornikov, 2019).
          model_inputs: >-
            Standard Gibbs energies of Li2O and P4O10 in the crystalline and liquid
            state, and of Li3PO4, Li4P2O7, Li5P3O10, Li6P4O13 and LiPO3.
          gas_species_considered:
            [Li, Li2, LiO, Li2O, Li2O2, P, P2, P3, P4, PO, PO2, PO3, P2O3, P2O4, P2O5, P3O6, P4O6, P4O7, P4O8, P4O9, P4O10, O, O2, O3, O4, LiPO3]
          condensed_compounds_as_printed:
            - {formula: LiPO3, oxide_equivalent: 2Li2O · P4O10, congruent_melting_K: 938}
            - {formula: Li4P2O7, oxide_equivalent: 4Li2O · P4O10, congruent_melting_K: 1158}
            - {formula: Li3PO4, oxide_equivalent: 6Li2O · P4O10, congruent_melting_K: 1498}
            - {formula: Li5P3O10, oxide_equivalent: 10Li2O · 3P4O10, dissociates_at_or_below_K: 400, source: 'Meadowcroft and Richardson, 1963'}
            - {formula: Li6P4O13, oxide_equivalent: 3Li2O · P4O10, dissociates_at_or_below_K: 400, source: 'Meadowcroft and Richardson, 1963'}
          stoichiometry_kept_as_printed: >-
            Li6P4O13 is printed as 3Li2O · P4O10. That oxide equivalent is stored
            as printed. It was not corrected.
          cited_mixing_enthalpy_298_K: >-
            Wagman et al. (1981) mixing enthalpies of LiPO3, Li4P2O7 and Li3PO4
            at 298 K are printed as −272 to −255 kJ/mol. Those are cited estimates,
            not this study.
          mixing_energy_minimum_composition: >-
            The minimum mixing energies of the alkali-phosphate melts lie from 22
            to 27 mol % P4O10. That is a composition range across the comparison,
            not a Gibbs-energy value for this study.
          prose_figure_slip: >-
            The body says "as follows from Fig. 1" for the LiPO3 partial-pressure
            comparison. The plot with that caption is Fig. 2. The phase diagram is
            Fig. 1. The extract follows the captions.
