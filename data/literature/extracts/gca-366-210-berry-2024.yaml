    - observation_id: berry_2024_ti3_sumti_table2
      type: as_printed_table
      locator:
        page: 214
        table: '2'
      units: dimensionless Ti3+/ΣTi fraction, as calculated and printed
      uncertainty:
        note: Table 2 states that uncertainty in Ti3+/ΣTi is estimated to be similar to the LCF uncertainty,
          ±0.015; applied here to each numeric table cell as the shared printed estimate.
      values:
        quantity_as_printed: Ti3+/ΣTi
        method: Recorded spectra of the most oxidised and most reduced glasses are fitted by linear combination
          over 4960–5000 eV, with the reduced glass Ti3+ fraction initially unknown. Eq. (3) jointly optimises
          that fraction, log K′, and the fO2 shift using the expected redox relation with fixed −1/4 dependence.
          Only afterward, Eq. (4) derives pure Ti3+ and Ti4+ end-member spectra. Printed pp. 212–214.
        table2_model_interpretation: These Ti3+/SumTi values are outputs of a fit that assumes the one-electron
          (-1/4) fO2 dependence; the fO2 slope of this table is therefore not an independent measurement.
          The independent information is the position (log K') per composition.
        fO2_representation_as_printed: 'Table 2 reports nominal and calculated log fO2 in the conventional
          standard state, calculated ΔFMQ, and defines log fO2 relative to IW as log fO2_cal + 9.71. This
          printed offset is −log fO2(IW) at 1400 °C. The IW relation is attributed to O''Neill and Pownceby
          (1993): 14.056 − 28776.5/T − 2.0384 log T (printed p. 217). Extractor''s check (not printed
          in the paper): at T = 1673.15 K the relation gives 14.056 − 17.199 − 6.571 = −9.714, consistent
          with the printed 9.71 offset. The experimental section cites Chase (1998) for thermodynamic
          data used for absolute log fO2 and O''Neill et al. (2018) for FMQ-relative values; these apply
          at 1400 °C. No fO2 values have been computed in this extract.'
        temperature: 1400 °C for all rows.
        fixed_method_phrase: Recorded most oxidised and most reduced glass spectra are fitted by linear
          combination; Eq. (3) jointly optimises the reduced-glass Ti3+ fraction, log K′ and fO2 shift
          using the fixed −1/4 redox relation, then Eq. (4) derives pure-valence end-member spectra.
        table2_cell_count: 50
        table2_numeric_fraction_count: 48
        table2_printed_dash_count: 2
        table2_inputs: Supplementary Spreadsheet 1 (recorded spectra and LCF proportions) is absent from
          the local corpus package; fitted values are represented as quoted_attributed under d-110.
        calibration_and_model:
          method_and_locator: Ti K-edge XANES spectra, printed pp. 212–215 (PDF pp. 4–7).
          energy_reference: Ti foil first derivative-spectrum peak set to 4966.4 eV; printed p. 212.
          spectral_feature: LCF over 4960–5000 eV; printed p. 212. Pre-edge fit uses three same-line-shape
            pseudo-Voigt peaks and intensity-weighted centroid around 4970 eV; printed p. 212. Table 2
            values use the LCF model rather than the centroid as direct valence calibration.
          end_members: For each composition, the recorded spectra of the most oxidised and most reduced
            glasses are fitted by linear combination; the reduced glass Ti3+ fraction is initially unknown.
            Eq. (3) jointly optimises that fraction, log K′, and the shared fO2 shift using the expected
            log(Ti3+/Ti4+)–log fO2 relation with fixed −1/4 dependence (printed pp. 212–213). Only afterward,
            Eq. (4) derives pure Ti3+ and Ti4+ end-member spectra (printed p. 214).
          physical_compounds: Ti2O3, TiO2, and Ni2.62Ti0.69O4 (spinel) standards mixed with BN (~1 wt%
            Ti) are described as prepared previously; printed p. 212. The paper does not state that these
            compounds set the Table 2 Ti3+/ΣTi scale.
          model_note: The expected relation is log(Ti3+/Ti4+) = −1/4 log fO2 − log K′ (Eq. 1, printed
            p. 211). Table 2 values are transcribed as quoted_attributed because the measured fit inputs
            are unavailable locally; no slope or fO2 value has been recalculated in this extract.
