        type: as_printed_table
        locator: {page: 214, table: '2'}
        units: dimensionless Ti3+/ΣTi fraction, as calculated and printed
        uncertainty:
          note: Table 2 states that uncertainty in Ti3+/ΣTi is estimated to be similar to the LCF uncertainty, ±0.015; applied here to each numeric table cell as the shared printed estimate.
        values:
          quantity_as_printed: Ti3+/ΣTi
          method: Recorded spectra of the most oxidised and most reduced glasses are fitted by linear combination over 4960–5000 eV, with the reduced glass Ti3+ fraction initially unknown. Eq. (3) jointly optimises that fraction, log K′, and the fO2 shift using the expected redox relation with fixed −1/4 dependence. Only afterward, Eq. (4) derives pure Ti3+ and Ti4+ end-member spectra. Printed pp. 212–214.
          table2_model_interpretation: These Ti3+/SumTi values are outputs of a fit that assumes the one-electron (-1/4) fO2 dependence; the fO2 slope of this table is therefore not an independent measurement. The independent information is the position (log K') per composition.
          fO2_representation_as_printed: >-
            Table 2 reports nominal and calculated log fO2 in the conventional standard state, calculated ΔFMQ, and defines log fO2 relative to IW as log fO2_cal + 9.71. This printed offset is −log fO2(IW) at 1400 °C. The IW relation is attributed to O'Neill and Pownceby (1993): 14.056 − 28776.5/T − 2.0384 log T (printed p. 217). Extractor's check (not printed in the paper): at T = 1673.15 K the relation gives 14.056 − 17.199 − 6.571 = −9.714, consistent with the printed 9.71 offset. The experimental section cites Chase (1998) for thermodynamic data used for absolute log fO2 and O'Neill et al. (2018) for FMQ-relative values; these apply at 1400 °C. No fO2 values have been computed in this extract.
          temperature: 1400 °C for all rows.
