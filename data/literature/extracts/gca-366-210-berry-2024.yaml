    context:
      - observation_id: berry_2024_experimental_conditions
        type: experiment_series
        locator: {page: 211, section: Experimental}
        units: as printed
        values:
          system: CaO-MgO-Al2O3-SiO2 (CMAS), five compositions; 1 wt% TiO2 added
          preparation: Reagent-grade SiO2, Al2O3, MgO, and TiO2 were dried at 1000 °C; CaCO3 was dried at 300 °C. Powders were ground and mixed under acetone using an agate mortar and pestle, then mixed with polyethylene oxide and water to form a paste.
          furnace: Vertical gas-mixing furnace; atmospheric pressure; 1400 °C.
          oxygen_fugacity_control: CO2-CO gas mixing at log fO2 values −3.1 to −14, calculated using thermodynamic data in Chase (1998), corresponding to 3.3 to −7.6 log units relative to FMQ as calculated using O'Neill et al. (2018). For nominal log fO2 as low as −20, powders were pressed into pellets, placed in wells drilled in a graphite block, and equilibrated with CO or CO diluted with Ar; for CO = 1/2 O2 + C, log fO2 = 2 log K + 2 log fCO and 2 log K = −16.1 at 1400 °C.
          oxygen_fugacity_check: For experiments at log fO2 −11 to −14, values were checked using the Fe content of Ti-free AD equilibrated simultaneously on an Fe loop. At the more reducing graphite-block conditions, Table 2 also reports model-calculated log fO2.
          containers: Wire loops of Pt or Re suspended from a chandelier. At log fO2 = −3, loops and chandelier were Pt; at −3 > log fO2 ≥ −12, both Pt and Re loops were used with a Pt chandelier; at log fO2 ≤ −13, loops were Re and the chandelier was ceramic. At log fO2 ≤ −16.1, graphite block with drilled wells was used. Results in this work are for samples prepared using Re loops.
          duration: About 20 h.
          quench: Quenched in water; resulting glass beads were 3–5 mm.
          run_temperature: 1400 °C for all melts in Table 2.
          locator_details: Furnace, gas control, run setup, duration, and quench are described on printed p. 211 (PDF p. 3); graphite-block method on printed p. 212 (PDF p. 4); Table 2 caption states 1400 °C on printed p. 214 (PDF p. 6).
