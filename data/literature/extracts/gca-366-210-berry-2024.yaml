          calibration_and_model:
            method_and_locator: Ti K-edge XANES spectra, printed pp. 212–215 (PDF pp. 4–7).
            energy_reference: Ti foil first derivative-spectrum peak set to 4966.4 eV; printed p. 212.
            spectral_feature: LCF over 4960–5000 eV; printed p. 212. Pre-edge fit uses three same-line-shape pseudo-Voigt peaks and intensity-weighted centroid around 4970 eV; printed p. 212. Table 2 values use the LCF model rather than the centroid as direct valence calibration.
            end_members: For each composition, the recorded spectra of the most oxidised and most reduced glasses are fitted by linear combination; the reduced glass Ti3+ fraction is initially unknown. Eq. (3) jointly optimises that fraction, log K′, and the shared fO2 shift using the expected log(Ti3+/Ti4+)–log fO2 relation with fixed −1/4 dependence (printed pp. 212–213). Only afterward, Eq. (4) derives pure Ti3+ and Ti4+ end-member spectra (printed p. 214).
            physical_compounds: Ti2O3, TiO2, and Ni2.62Ti0.69O4 (spinel) standards mixed with BN (~1 wt% Ti) are described as prepared previously; printed p. 212. The paper does not state that these compounds set the Table 2 Ti3+/ΣTi scale.
            model_note: The expected relation is log(Ti3+/Ti4+) = −1/4 log fO2 − log K′ (Eq. 1, printed p. 211). No slope or fO2 value has been calculated in this extract.
