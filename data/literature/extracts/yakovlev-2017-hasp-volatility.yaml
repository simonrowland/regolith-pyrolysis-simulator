    - observation_id: yakovlev_2017_numeric_and_qualifying_statements
      type: characterization
      locator:
        pdf_page_index: 0
        section: Introduction
      units: verbatim; values as printed
      values:
        quantity: source_claims_and_numeric_context
        method_class: quoted_unattributed
        statements:
        - statement_id: p1_impact_and_selective_evaporation
          attribution: Yakovlev & Shornikov
          quote: Acidity-basicity is a universal characteristic of any melt. To test the effectiveness of its application
            to the volatility of melt components we investigated the impact HASP-glass lunar regolith. HASP-glasses
            formed on the lunar surface through an impact process involving high-temperature rock melting and deep
            selective evaporation [1].
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_hasp_composition_and_losses
          attribution: Yakovlev & Shornikov
          quote: HASP-glass composition features high Al2O3 and poor SiO2 due to the high temperature selective
            evaporation of melts with loss of easily and moderately volatile oxides such as Na2O, K2O and FeO, partial
            loss of SiO2, and accumulation in the residue of CaO and Al2O3.
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_anorthite_limit
          attribution: Yakovlev & Shornikov
          quote: The rock and HASP-glass compositions fall in an almost linear decreasing relationship of SiO2 /
            Al2O3 which becomes smaller as calcium and aluminum oxides increase. The dotted line indicates the SiO2
            / Al2O3 ratio in pure anorthite (equal to 1.18). For the moon this may be a petrochemical limit below
            which the generation of igneous anorthositic rocks is impossible. All compositions which are below this
            limit can be formed only at evaporation differentiation and thus this limit relation is a marker for
            the HASP-glasses identification.
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_evaporation_mass_loss_and_temperature
          attribution: Yakovlev & Shornikov
          quote: Fig. 1 also presents selected results of evaporation experiments on lunar aluminous basalt [3].
            These show that the compositions of the most HASP-glasses were probably formed in the range of evaporation
            mass losses of ~20–50 %, corresponding to an evaporation temperature of ~1750–1900 °C [4].
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_previous_experiment_inversion
          attribution: Yakovlev & Shornikov
          quote: Our experiments on the evaporation of chondrites and lunar basalt [3, 5, 6] clearly showed that
            during the evaporation when the SiO2 content in the melt decreases significantly the MgO content increases
            slightly indicating that the MgO is low volatility compared to SiO2.
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_hasp_composition_contrasts_experiment
          attribution: Yakovlev & Shornikov
          quote: However, this experimental observation was not reflected in the actual compositions of HASP-glasses
            as higher content of MgO relative to SiO2 in glasses is not observed. On the contrary, there is a very
            low ratio of MgO / SiO2 (0.01 to 0.1) and very low contents of MgO – an average of 0.8 mass. % [2].
            The compositional features of HASP-glasses in the main oxides of K2O, Na2O, FeO, SiO2, CaO and Al2O3
            are easily explained by evaporative differentiation of the melt components, the MgO behavior contradicts
            to the evaporative mechanism of HASP-glasses formation.
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_acid_base_theory_basis
          attribution: Yakovlev & Shornikov
          quote: To resolve these questions, we applied the Korginsky theory on acid-base interaction components
            in the melt [7]. According to this theory, the basicity index of a melt is determined by the ion
            oxygen activity that is always present in the melt due to the partial dissociation of the oxide components.
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_oxygen_activity_effect
          attribution: Yakovlev & Shornikov
          quote: The effect of ion oxygen activity is different for different oxides and may be the opposite for
            oxides contrasting in their individual acid-base properties. For example, an increase in ion oxygen
            activity should lead to an increase of the activity of the basic oxide MgO and decrease of the activity
            of the acidic oxide SiO2 as the silicon oxide in the melt is not the donor of the oxygen ions but the
            acceptor.
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_activity_and_volatility_relation
          attribution: Yakovlev & Shornikov
          quote: 'The component activity in the melt determines their component volatility in the vapor according
            to a generalized Raoult-Henry law:'
          locator:
            pdf_page_index: 0
            section: Introduction
        - statement_id: p1_volatility_parameters
          attribution: Yakovlev & Shornikov
          quote: 'Relation (1) shows that the volatility of the oxide above the melt depends on three parameters:
            1) the vapor pressure of the pure oxide; 2) the oxide concentration in the melt; 3) the interaction
            nature of oxide in the melt. The last two parameters determine the activity of the component and its
            behavior during evaporation from the melt.'
          locator:
            pdf_page_index: 1
            section: Introduction
        - statement_id: p2_cmas_and_calcium_effect
          attribution: Yakovlev & Shornikov
          quote: The properties of HASP-glass compositions may be modeled as the CMAS oxide system. The main oxides
            of the system on the acid-basic properties are divided into acid – SiO2, amphoteric – Al2O3 and two
            basic – CaO and MgO. CaO is the major basic oxide and is a major donor of oxygen ions in the melt and
            therefore its concentration plays a major role in determining cause of the melt basicity. This also
            implies that the MgO and SiO2 activity depends on the CaO concentration.
          locator:
            pdf_page_index: 1
            section: Discussion
        - statement_id: p2_high_calcium_melt_volatility
          attribution: Yakovlev & Shornikov; statement cites [8]
          quote: According to acid-base interaction in high-calcium melts the MgO will have high volatility and
            it can be higher than the SiO2 volatility [8].
          locator:
            pdf_page_index: 1
            section: Discussion
        - statement_id: p2_direction_of_residue_change
          attribution: Yakovlev & Shornikov
          quote: It becomes clear why the MgO low content observes in the HASP-glasses. It’s easy to imagine that
            during the melt evaporation the CaO content increases (and the melt basicity increase too) and so the
            MgO activity (and volatility) will increase and the SiO2 activity (and volatility) will fall. As a result
            of the evaporation process the MgO content in the residual melt will decrease and SiO2 content will
            increase relative to MgO. For HASP-glasses that means as the CaO content will increase, the MgO / SiO2
            ratio will decrease. Chemical analyses of the HASP-glasses [2] confirm this trend (Fig. 2b).
          locator:
            pdf_page_index: 1
            section: Discussion
        - statement_id: p2_cai_comparison_and_genesis
          attribution: Yakovlev & Shornikov
          quote: It is interesting to note that the evaporation of some CAIs, which also belong to CMAS system,
            may be also described in the framework of the melt acid-base theory. Fig. 2a shows the same behavior
            of oxides on the evaporation of CAI melts [9] in spite of HASP-glasses and CAIs have absolutely different
            genesis. The HASP-glasses compositions were formed during the impact process whereas the CAIs formed
            in the course of a complex process including high temperature melt evaporation in the event of unknown
            nature.
          locator:
            pdf_page_index: 1
            section: Discussion
        - statement_id: p2_support_statement
          attribution: Yakovlev & Shornikov
          quote: 'The present study was supported by RAS Presidium Program #7 (Experimental and theoretical studies
            of Solar system objects and star planetary systems. Transients in astrophysics).'
          locator:
            pdf_page_index: 1
            section: Discussion
