schema_version: literature_extract.v1
source_id: van-ende-2008-mn-cr-slag-steel
source:
  citation: >-
    Van Ende, M.-A., Guo, M., Jones, P. T., Blanpain, B. and Wollants, P. (2008),
    “Manganese and Chromium Distribution between CaO–SiO2–MgOsat.–CrO1.5–MnO Slags
    and Fe–Cr–Mn Stainless Steel,” ISIJ International 48(10), 1331–1338.
  doi: 10.2355/isijinternational.48.1331
  url: https://doi.org/10.2355/isijinternational.48.1331
  year: 2008
  corpus_source_id: van-ende-2008-mn-cr-slag-steel
extraction:
  method: >-
    Born-digital pdftotext-layout.txt was the primary text source. Tables 1–4 and all
    figure captions were checked against 600 dpi page renders. No table values were
    emitted as observations: the tables contain steelmaking interaction parameters,
    initial and equilibrated phase-composition vectors, and Mn/Cr distribution ratios;
    these do not match a quantity token for slag activity. Activity coefficients and
    activities are calculated quantities, and every plot remains deferred without
    digitisation. No plotted values were estimated.
  date: '2026-10-21'
  worker: fam37-1021
review_status: draft
species:
  SiO2:
    observations: []
    context:
