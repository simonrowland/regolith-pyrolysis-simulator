review_status: draft
corrections: []
evidence_policy:
  classification: mixed_quoted_measurement_model_and_figure
  measurement_claim: This is a review/technical synthesis. It reports measured-reduced grain-size statistics and informal author observations, but its cited sintering results and the Figure 5 fluidization result are not new primary experiments in this paper.
  apparatus_status: No sample mass, crucible, cell dimensions, or temperature calibration is stated for the cited experiments; Figure 3 names thermocouples in a NASA/JSC inconel chamber, but does not provide a complete apparatus or run record.
  model_generators:
  - author's simple cylindrical-reactor fluidization calculation for Figure 5; the source does not name a software package
  figure_policy: Figure 1, Figure 5, and Figure 6 plotted curves are not digitised; only values printed in prose or captions are retained.
  missing_conditions: Vacuum level, pumping, gas pressure/flow details, sample mass/form, exposed area, fO2 control, temperature calibration, and run durations are absent unless explicitly stated in an observation below.
