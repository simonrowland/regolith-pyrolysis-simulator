  url: https://ntrs.nasa.gov/citations/20070030826
  year: 2007
extraction:
  method: Born-digital 9-page PDF; pdftotext -layout; printed prose, figure captions, and printed summary statistics transcribed; plotted curves and axis readings not digitised.
