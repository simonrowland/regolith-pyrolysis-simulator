source:
  citation: Heck, W. F., Herrmann, A. D. & Jackson, C. R. M. (2025), "Experimental degassing of moderately
    volatile chalcophile elements from silicate melt with and without sulfur present", Geochim. Cosmochim.
    Acta 402:153-172, DOI 10.1016/j.gca.2025.05.007
  doi: 10.1016/j.gca.2025.05.007
  url: https://doi.org/10.1016/j.gca.2025.05.007
  year: 2025
  related_sources:
  - document: 10.17632/hpmts74ksr.1
    relation: author_data_tables_mendeley
    note: CC BY 4.0 data tables reported in the paper (Tables 1-6 and S1-S5).
  - document: 10.1016/j.gca.2025.12.014
    relation: publisher_erratum
    note: Erratum GCA 413:267 (2026-01-15). CC-BY VOR. Typeset PDF not obtained (ScienceDirect 403 / CDN
      400). Erratum body unseen this round.
extraction:
  method: 'Official OA: Crossref VOR CC BY 4.0. DOI resolves (curl -sI 302 linkinghub PII S0016703725002406).
    ScienceDirect article/pdf HTTP 403 Cloudflare JS challenge — not bypassed. ars.els-cdn main.pdf HTTP
    400 NONAUTHATTACH; am.pdf 404. LSU repository landing 200 but viewcontent 403 JS challenge — not bypassed.
    HAL/PMC/EuropePMC empty. Tables 1-6 and S1-S5 transcribed from official Mendeley Data xlsx DOI 10.17632/hpmts74ksr.1
    (CC BY 4.0); S1-S5 byte-identical to Elsevier CDN mmc1-mmc5.xlsx. Figures 1-12 from Elsevier CDN grN_lrg.jpg;
    listed figure-only except Fig. 1 printed r_total labels. No MinerU. No unit conversion. Measured EPMA/LA-ICP-MS
    kept distinct from inverse-model D, fitted K*/ΔH*/ΔS*, and magma-ocean Fig. 12. S1 printed 0 = below
    detection limit (footnote), not a measured zero. Round 2 (review F-1/F-2/F-3): inverse-model Table 4 D
    and Table S5 3L retyped gibbs_table + method_class model_derived (kems-036 convention) with semantics
    inverse_model_fit_not_measured_rate; composition/run-log/ppm parked as gibbs_table not rate_series;
    chamber_pressure 1.0 atm flagged inferred from printed atm=atmospheric air / log10 fO2=-0.68.'
  date: '2026-09-06'
  worker: wave-W2-kems-140-heck-2025
  provenance_path: docs-private/research/2026-09-06-wave-2/W2-kems-140-heck-2025/kems-140-heck-2025/
