schema_version: literature_extract.v1
source_id: shornikov-2025-ca-al-inclusion-kems
source:
  citation: >-
    Shornikov, S., and O. Yakovlev (2025), Mass spectrometric investigation of
    evaporation of the Ca–Al–inclusions of chondrite melts, in A. Çiner et al.
    (eds.), Recent Research on Sedimentology, Stratigraphy, Paleontology,
    Tectonics, Geochemistry, Volcanology and Petroleum Geology, Advances in
    Science, Technology & Innovation, Springer, pp. 119–122.
    https://doi.org/10.1007/978-3-031-87558-8_24
  year: 2025
  doi: 10.1007/978-3-031-87558-8_24
  corpus_asset: raw/shornikov-2025-ca-al-inclusion-kems/shornikov-2025-ca-al-inclusion-kems.pdf
extraction:
  method: >-
    No MinerU table and no MinerU chart block. Fig. 1 (published p. 120) was
    rendered at 600 dpi. Both axes were calibrated from the labelled ticks,
    and the log axis was calibrated in log space. Every filled-circle marker
    was read twice, as the centre of mass of its series-colour mask and as
    the distance-transform peak. Partial pressures are stored at two
    significant figures. Pixel coordinates, both reads, and the tick fits are
    in the companion figure-audit CSV. Figs. 2-5 were not read.
  date: '2026-10-28'
  worker: refr-figs
review_status: draft
fidelity_samples:
- path: species.Ca.observations[shornikov_2025_fig1_typeA_Ca_digitized].values.points[0].pressure_atm
  value: "4.5e-8"
  locator:
    figure: '1'
    published_page: 120
    pdf_page_index: 3
    note: >-
      A-Ca-01, filled circle, partial pressure of Ca on Fig. 1 panel A
      (published p. 120). Crop pixel centres (790.90, 1419.47) and
      (791.00, 1419.00); crop origin (400, 3650) on the 600 dpi render.
      Panel A ticks: 1800 K at 377 px, 2000 K at 807 px, 2200 K at 1236.5 px,
      2400 K at 1666 px, and 2600 K at 2095.5 px. Ordinate ticks: lg p of -5
      at 487 px, -6 at 884 px, and -7 at 1281.5 px. The fit is
      T_K = 0.46554932300556573*x_px + 1624.3948170359188 and
      lg p = -0.002517306149736147*y_px - 3.7742818126082898.
experiments:
  - experiment_id: shornikov-2025-efremovka-cai-kems
    kind: kems
    locator:
      page: 3
      published_page: 119
      pdf_page_index: 2
      section: Experimental
    method: knudsen_effusion
    method_as_printed: >-
      Knudsen effusion mass spectrometry of natural Efremovka (CV3) CAI melts,
      types A and B, 1300-2600 K. Samples of 10-15 mg in rhenium foil in a
      tungsten effusion cell, electron bombardment heating, ionizing energy 28 eV,
      about 3 K/min. The Murchison (CM2) curves are the comparison of Yakovlev
      et al. (1987), not a new measurement in this chapter.
    pressure_environment:
      total_pressure_Pa:
        state: {tag: unknown, reason: not_printed}
        locator:
          figure: '1'
          published_page: 120
          pdf_page_index: 3
          note: "Fig. 1 prints partial pressures as lg p_i, atm. It does not print a total pressure."
      sweep_gas:
        state: {tag: unknown, reason: not_printed}
        locator:
          page: 3
          published_page: 119
          pdf_page_index: 2
          section: Experimental
          note: "The effusion cell is tungsten with a rhenium foil liner. No sweep gas is stated."
      regime:
        regime_class: {tag: unknown, reason: not_printed}
        locator:
          page: 3
          published_page: 119
          pdf_page_index: 2
          section: Experimental
          note: "The chapter describes Knudsen effusion and does not print a Knudsen number."

