source:
  citation: >-
    Shornikov, S., and O. Yakovlev (2025), Mass spectrometric investigation of
    evaporation of the Ca–Al–inclusions of chondrite melts, in A. Çiner et al.
    (eds.), Recent Research on Sedimentology, Stratigraphy, Paleontology,
    Tectonics, Geochemistry, Volcanology and Petroleum Geology, Advances in
    Science, Technology & Innovation, Springer, pp. 119–122.
    https://doi.org/10.1007/978-3-031-87558-8_24
