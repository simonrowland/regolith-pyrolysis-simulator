  doi: 10.1007/978-3-031-87558-8_24
  corpus_asset: raw/shornikov-2025-ca-al-inclusion-kems/shornikov-2025-ca-al-inclusion-kems.pdf
extraction:
  method: >-
    No MinerU table. The chapter's numeric results are figures. A 600 dpi
    distance-transform read of Fig. 1 did not give one centroid per marker
    within a stated uncertainty, so no figure value was stored.
  date: '2026-10-20'
  worker: t1372-w1
review_status: draft
experiments:
  - experiment_id: shornikov-2025-efremovka-cai-kems
    kind: kems
    locator:
      page: 3
      published_page: 119
      pdf_page_index: 2
      section: Experimental
    method: >-
      Knudsen effusion mass spectrometry of natural Efremovka (CV3) CAI melts,
      types A and B, 1300–2600 K. Samples of 10–15 mg in rhenium foil in a
      tungsten effusion cell, electron bombardment heating, ionizing energy 28 eV,
      about 3 K/min. The Murchison (CM2) curves are the comparison of Yakovlev
      et al. (1987), not a new measurement in this chapter.
