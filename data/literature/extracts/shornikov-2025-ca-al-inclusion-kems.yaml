          unavailable_reason: outside_named_quantity_list_and_not_separable
          value_as_printed: not sampled
      - observation_id: shornikov_2025_fig3_oxide_activities_not_digitised
        type: figure_not_digitised
        locator:
          page: 5
          published_page: 121
          pdf_page_index: 4
          figure: '3'
          note: >-
            Series 1 CaO, 2 Al2O3, and 3 SiO2 were determined. Series 4 is
            gehlenite calculated from those activities with Shornikov (2007).
            The same Fig. 1 centroid failure applies to these smaller markers.
        units: lg a_i
        standard_state: >-
          Published p. 120: the CaO, Al2O3, and SiO2 activities were determined
          (Fig. 3). The paper does not state a reference state.
        values:
          quantity_as_printed: lg a_i
          method_class: figure_only
          status: context_only
          unavailable_reason: marker_centroids_not_separated
          value_as_printed: not sampled
          standard_state_note: >-
            The pure-oxide-at-experiment-T inference was not used. The chapter
            does not say the reference was measured over the pure oxide in the
            cell, and it does not state the reference temperature.
      - observation_id: shornikov_2025_calculated_compound_activities
        type: calculated_activity_comparison
        locator:
          page: 4
          published_page: 120
          pdf_page_index: 3
          section: Results and Discussion
          note: >-
            Gehlenite, anorthite, and grossular activities were calculated from
            the oxide activities using Shornikov (2007). Not a measured activity.
        units: activity ratio as printed
        values:
          value_as_printed: >-
            The anorthite and grossular activities at 2500 K are 10^5 and 10^11
            times lower than the Ca2Al2SiO7 activity, respectively.
          schema_gap: >-
            A calculated ratio of compound activities is not an oxide activity
            with a stated pure-oxide reference.
