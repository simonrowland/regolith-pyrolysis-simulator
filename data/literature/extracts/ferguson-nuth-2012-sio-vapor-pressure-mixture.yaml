source:
  citation: Ferguson, F. T. and Nuth, J. A. (2012), Vapor Pressure and Evaporation Coefficient of Silicon Monoxide
    over a Mixture of Silicon and Silica, Journal of Chemical & Engineering Data.
  doi: 10.1021/je200693d
  year: 2012
  corpus_asset: raw/ferguson-nuth-2012-sio-vapor-pressure-mixture/ferguson-nuth-2012-sio-vapor-pressure-mixture.pdf
extraction:
  method: Transcribed from MinerU machine tables and markdown, then checked cell-by-cell against rendered PDF pages
    4–5. Apparent Table 1 pressure is kept raw and is not treated as equilibrium or total pressure. The Table 2
    equilibrium pressure over Si(s)+SiO2(s) is retained as a typed refusal because the current p_sat identity cannot
    encode that two-solid system. Printed alpha points use the existing coefficient quantity; they are reported
    as measured_reduced from the authors’ weighted FITEXY reduction of their Table 1 effusion measurements.
  date: '2026-10-23'
  worker: wave53b-F68
  review_status: draft
schema_gaps:
- Table 1 apparent measured pressure and its multi-column experimental data bundle have no quantity token; retained
  as a typed refusal with all printed cells in values.points. Table 2 equilibrium pressure is over the two-solid
  assemblage Si(s)+SiO2(s), which the current p_sat identity cannot encode; retained as a typed refusal with printed
  values.
