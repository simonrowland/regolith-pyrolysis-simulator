schema_gaps:
  - >-
    MELT_ACTIVITY has activity and activity_coefficient quantities but no token
    for the printed base-10 log activity or RT ln activity (kJ/mol). Preserve
    the printed values and leave these rows typed-refused.
evidence_classification:
  reference_rows: >-
    Table labels [2] are quoted_attributed to reference [2]. The three “This
    study” rows report outputs reduced from EMF plus reference [2], but this
    summary gives neither numeric EMF inputs nor an explicit reduction relation;
    under d-110 they are also quoted_attributed because lineage inputs cannot be
    stored. No value is promoted to measured_reduced without those inputs.
  identity_composition_gap: >-
    A typed-refused activity with no numeric activity cannot enter the
    migrator's exploded-point path, so its printed row composition remains in
    values.points.point_conditions but cannot reach the migrated Identity.
    Do not invent a positive activity or change the schema/migrator to avoid
    this source-form refusal.
figure_read_candidates:
  - Figure 2 shows other-source activity points and an inherited Sugawara et al. [2] curve; not digitized.
