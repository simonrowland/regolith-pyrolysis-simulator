schema_gaps:
- quantity: sample_chemical_analysis_wt_percent
  rows: Table 1 actual and theoretical values
  reason: No exact Quantity token exists for non-equilibrium sample oxide analysis. Quantity.RESIDUE_COMPONENT_COMPOSITION
    is residue composition; Quantity.EQUILIBRIUM_PHASE_COMPOSITION is equilibrium phase composition.
  code:
  - tools/validate_literature_extracts.py::OBSERVATION_TYPES
  - simulator/battery/migrate.py::QUANTITY_ALIASES
  - simulator/battery/migrate.py::TYPE_QUANTITY
  - simulator/battery/enums.py::Quantity.RESIDUE_COMPONENT_COMPOSITION
  - simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION
  - simulator/battery/enums.py::PHASE_BASIS_TOKENS
- quantity: relative_entropy_increment_S_T_minus_S_298_15
  rows: Table 3 S_T-S_298.15
  reason: Quantity.S is absolute entropy; there is no exact relative entropy increment token.
  code:
  - simulator/battery/enums.py::Quantity.S
  - simulator/battery/migrate.py::QUANTITY_ALIASES
  - simulator/battery/migrate.py::TYPE_QUANTITY
- quantity: solid_solid_transition_enthalpy
  rows: ΔH at 830 K and 750 K
  reason: Quantity.ENTHALPY_OF_FUSION represents fusion enthalpy; no solid-solid transition enthalpy token
    exists.
  code:
  - simulator/battery/enums.py::Quantity.ENTHALPY_OF_FUSION
  - simulator/battery/enums.py::Quantity
  - simulator/battery/migrate.py::QUANTITY_ALIASES
- quantity: qualitative or interval-only transition/fusion bounds
  rows: 733–753 K quoted range, irreversible change above 1309 K, fusion slightly above 1504 K
  reason: These are intervals or bounds, not exact scalar transition_temperature values; kept typed-refused.
  code:
  - simulator/battery/enums.py::Quantity.TRANSITION_TEMPERATURE
  - simulator/battery/migrate.py::QUANTITY_ALIASES
