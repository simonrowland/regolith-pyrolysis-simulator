scope_review: Chapter 7 Tables 7.1 and 7.2 are the thesis's new measured phase-composition runs. Chapter 4 Fig.
  4.1 is a preliminary decarbonation measurement and is retained only as a figure-read candidate. Tables 4.2/4.3
  give rounded starting-composition views; Tables 7.1/7.2 contain the row-specific experimental compositions. Chapter
  10 describes thermodynamic evaluation/optimization and states no systematic new experiments; Chapters 5, 6, 8,
  9, and 11 are critical evaluations or models.
