method_and_quench_locators:
- page: 62
  section: 4.1.1.1
  render_check: preliminary DSC/DTG method and prose report about 25 h for CO2 loss; about 18% is the calculated
    expected CO2 mass loss, not a digitized measurement
- page: 174
  section: 7.3.1
  render_check: open Pt capsule, 1698/1583 K, 10 K/min, air, 1-168 h, liquid-N2 quench, EPMA/XRD method
- page: 176
  section: 7.3.2
  render_check: air-run quench crystals are explicitly counted as glass in phase composition analysis
- page: 179
  section: 7.3.2
  render_check: For NAF6-1, NAF7-1, and NAF7-2, EPMA area mapping included quench crystals; analyzed liquid compositions
    matched starting compositions, and the source says quench crystals did not influence the analysis.
- page: 180
  section: 7.4.1
  render_check: sealed low-carbon Fe capsule, external argon purge, 1473 K/12 h pretreatment, target 1673/1573 K
    for 1 h, water quench
- page: 181
  section: 7.4.2
  render_check: metal droplets confirm Fe saturation and Fe-rich quench crystals are observed in glass. Page 179
    reports crystal-inclusive area mapping for NAF6-1, NAF7-1, and NAF7-2; the source does not state whether crystals
    were included for other Table 7.2 samples.
schema_gaps:
- row_count: 45
  kind: measured crystalline phase compositions
  reason: 'Measured crystalline phase composition is retained as typed-refused context: simulator/battery/enums.py::PhaseRole
    has no solid role. simulator/battery/enums.py::PHASE_BASIS_TOKENS includes wt_percent and mole_fraction; simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION
    and tools/validate_literature_extracts.py::OBSERVATION_TYPES support the exact quantity. simulator/battery/migrate.py::QUANTITY_ALIASES
    has no extra alias needed for the explicit canonical token; simulator/battery/migrate.py::TYPE_QUANTITY has
    no default for this observation type, so values.quantity is explicit. The composition cannot be emitted without
    a closed phase role under simulator/battery/migrate.py::_phase_role_token and simulator/battery/migrate.py::_phase_row_rejection.
    Existing glass/melt and metal examples are retained in data/literature/extracts/park-2021-vanadium-thermodynamics-thesis.yaml.'
- row_count: 1
  kind: measured mixed N(A,F)+ Glass phase row
  reason: The printed phase label combines N(A,F) and glass, so one equilibrium_phase_composition observation cannot
    name the measured phase. The measured cells are retained as typed-refused context rather than assigning a single
    phase. The phase-role candidate set is simulator/battery/enums.py::PhaseRole and the closed row check is simulator/battery/migrate.py::_phase_row_rejection.
