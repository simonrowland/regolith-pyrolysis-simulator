migration:
  status: isolated_migration_complete_car3_flagged_residue_extent
  required_mutation: The focused tests change FUN1-10 final_weight_g and require xi to move, then delete both grams while retaining the scalar and require the migrated xi value to become unavailable; pytest is not run under owner hold.
  code_path_checked:
    - simulator/battery/enums.py::Quantity.MASS_LOSS_FRACTION
    - simulator/battery/migrate.py::_MASS_LOSS_YIELD_FIELDS
    - simulator/battery/migrate.py::_item_mass_loss_field
    - simulator/battery/identity.py::profile_for
    - simulator/battery/score.py::_score_identity_equal
    - simulator/battery/score.py::_predict_mass_loss_with_residue
    - simulator/battery/residue.py::predict_mass_loss_fraction
    - simulator/battery/residue.py::_initial_oxide_wt_percent
    - simulator/battery/migrate.py::_mass_loss_fraction_from_printed_weights
    - simulator/battery/residue.py::predict_langmuir_residue_composition
    - simulator/battery/score.py::_extent_residue_prediction
  finding: The generic extract migrator derives mass_loss_fraction from the two located gram operands and drops a stale scalar when either operand is absent. Table 1's starting assays now migrate through sample.initial_composition; residue point_conditions retain the per-row assay. Both FUN experiments resolve to langmuir_free_evaporation with method_locator.
  scope_rule: One generic mass-loss operand rule lives in simulator/battery/migrate.py. The residue caller reuses integrate_knudsen_residue_inventory and the existing pressure closure; no second integrator or DP id was added.
  source_restrictions: >-
    The weight-derived mass_loss_fraction reducer in simulator/battery/migrate.py
    is explicitly restricted to source_id mendybaev-2013-fun-cai-evaporation.
    The scorer's Langmuir residue route in simulator/battery/score.py is also
    explicitly restricted to that Mendybaev source_id.
  isolated_migration: Direct in-memory Migrator._migrate_extract plus finalize; 120 observations, 24 mass_loss_fraction and 96 residue_component_composition, 0 hard issues, 0 registry issues, 52 queued locator/source issues. Every row has the correct FUN start composition and 2173.15 K temperature, with its printed row time in point_conditions. This was not a store regeneration.
  fidelity_counts:
    pre_car1_green: {uncovered_observation: 2, unattested_sample: 1}
    car1_base: {uncovered_observation: 26, unattested_sample: 4}
    tip: {uncovered_observation: 2, unattested_sample: 0}
    evidence: Production fidelity_source_warnings one-off with REGOLITH_CORPUS_ROOT set; 120 Table 1 xi-field pins are located and attested, including 3 retained pins and 117 additions.
  uncertainty_counts:
    printed: 96
    none: 24
    confidence_not_stated: 96
    confidence_not_recorded: 24
  identity_axes_after_migration:
    FUN1-3: {composition: FUN1 starting charge, total_pressure_Pa: unknown, fO2_Pa: unknown, temperature_K: '2173.15'}
    FUN1-10: {composition: FUN1 starting charge, total_pressure_Pa: unknown, fO2_Pa: unknown, temperature_K: '2173.15'}
    FUN2-10: {composition: FUN2 starting charge, total_pressure_Pa: unknown, fO2_Pa: unknown, temperature_K: '2173.15'}
  identity_composition_d460_finding: >-
    Page 5 (published page 372), Table 1 caption: “starting materials and evaporation residues from FUN1 and FUN2 experiments.”
    The starting rows are the true initial charge, and both experiment records now carry that located Table 1 assay
    in sample.initial_composition through the existing converter. Every FUN1 residue and xi identity uses the FUN1
    charge; every FUN2 row uses the FUN2 charge. No composition_role is used. Row-local point_conditions.composition
    continues to hold only the measured residue assay.
  current_prediction_first_refusal: >-
    The car-3 score path dispatches only residue_component_composition on langmuir_free_evaporation experiments
    with no declared cohort predictor. It calls predict_langmuir_residue_composition using the matching Table 1
    sample row's measured xi. Missing xi returns measured_mass_loss_fraction_missing_or_invalid before any clock
    predictor can run. The caller scores a one-point isothermal 2173.15 K extent, including positive xi on zero-time
    diagnostic rows.
  identity_pressure: >-
    Keep identity.total_pressure_Pa unknown. The source ceiling remains located in experiment conditions and row
    point conditions where printed. The paper prints the <0.0001 Pa threshold before the temperature ramp to
    1900 °C; 0 Pa is the modelled extent assumption within that pre-ramp threshold, not a printed pressure value.
engine_readiness:
  observable: mass_loss_fraction, used as the per-bead gravimetric extent anchor by the later residue comparison.
  rows: 24
  ready_for_extent_anchor: 24
  direct_mass_loss_profile_ready: 0
  prediction_code_path: "simulator/battery/score.py::_extent_residue_prediction -> simulator/battery/score.py::_langmuir_residue_prediction -> simulator/battery/residue.py::predict_langmuir_residue_composition"
  prediction_first_refusal: measured_mass_loss_fraction_missing_or_invalid when the bead has no matched Table 1 xi anchor.
  experiment_links: FUN1 and FUN2 remain separate; each residue and xi row uses its experiment's located Table 1 starting composition and 2173.15 K.
  missing_or_deferred_inputs:
    identity.total_pressure_Pa: The printed one-sided ceiling remains located as evidence; identity pressure stays unknown because the source gives a bound.
    identity.fO2_Pa: No imposed fO2 is printed; the scorer uses the existing congruent-vapour zero-storage closure and flags it.
    sample_mass_and_area: Not read on the extent path; each bead's independent gravimetric xi anchors the comparison.
    phase: The recovered bulk phase remains unspecified; no liquid phase stamp is added.
    identity.per: Bound to the printed fraction denominator with simulator/battery/enums.py::PerBasis.INITIAL_MASS.
  method_token: Both Mendybaev experiment records migrate as langmuir_free_evaporation with method_locator; the alias car is complete.
  next_car_note: >-
    Car 3 scores all 96 existing residue rows in the flagged absolute tier; it adds DP-005 relative-alpha sensitivity and melt_well_mixed_assumed notices, the 1900 C isothermal extent-band notice, the congruent-vapour closure notice, and pressure provenance. No new cohort or DP id is added.
expected_store_delta: >-
  No store regen was committed. Score-time car 3 changes no stored observations.
  Relative to the pre-Mendybaev car-1 baseline cbdb6448e, migration retains all
  120 Mendybaev observation ids and all 24 xi point values; the 24 xi identities
  bind to their FUN starting charge, and those rows no longer repeat the charge
  composition or pressure as point conditions. The 96 residue observations
  retain their FUN-start identities. Relative to green 4a566e411, the corpus
  gains 24 Mendybaev mass_loss_fraction observations; the audit's in-car
  observation delta is zero against the already-folded car-1 migration. No
  Wang extract or store rows change.
