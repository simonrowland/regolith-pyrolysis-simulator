migration:
  status: isolated_migration_complete_identity_binding_conflict
  required_mutation: The authored focused test changes FUN1-10 final_weight_g, recomputes the fraction, and pins the changed migrated value; the pytest mutation is not run under owner hold.
  code_path_checked:
    - simulator/battery/enums.py::Quantity.MASS_LOSS_FRACTION
    - simulator/battery/migrate.py::_MASS_LOSS_YIELD_FIELDS
    - simulator/battery/migrate.py::_item_mass_loss_field
  finding: The existing mass-loss reader consumes values.mass_loss_fraction. Printed grams and their arithmetic derivation are retained on every row. The extract also binds each row to its printed initial-charge composition and initial_mass basis.
  scope_rule: No simulator or migrator code changed.
  isolated_migration: Direct in-memory Migrator run; 120 observations, 24 mass_loss_fraction and 96 residue_component_composition, 0 hard issues, 0 unavailable values, 0 registry issues, 0 quantity-unknown observations. Species phase is unknown for all 120 observations; Car 1 does not assign a single phase to this integrated mass-loss quantity, and the existing composition rows are unchanged. This was not a simulator run or store regeneration.
  uncertainty_counts:
    printed: 96
    none: 24
    confidence_not_stated: 96
    confidence_not_recorded: 24
  identity_axes_after_migration:
    FUN1-3: {composition: unknown, total_pressure_Pa: unknown, fO2_Pa: unknown, temperature_K: '2173.15'}
    FUN1-10: {composition: unknown, total_pressure_Pa: unknown, fO2_Pa: unknown, temperature_K: '2173.15'}
    FUN2-10: {composition: unknown, total_pressure_Pa: unknown, fO2_Pa: unknown, temperature_K: '2173.15'}
  identity_binding_conflict: >-
    Printed starting compositions are linked through sample.printed_composition and each mass-loss observation's
    point_conditions.printed_composition, but the isolated Migrator still leaves identity.composition unknown
    without composition_role initial_charge_only (the existing path is
    simulator/battery/migrate.py::_declared_composition_role). Car 1's design explicitly prohibits composition_role. The
    generic identity-binding rule requires printed composition to reach identity; no existing extraction-only
    path found satisfies both requirements. No migrator/schema change was made; controller ruling is needed.
  identity_pressure: >-
    Car 1 design section 4 directs this case: retain the printed one-sided ceiling in point_conditions and leave
    identity.total_pressure_Pa unknown. The existing simulator/battery/migrate.py::_point_pressure_for_identity
    path cannot represent this bound as an identity pressure; no point value is inferred.
engine_readiness:
  observable: mass_loss_fraction, used as the per-bead gravimetric extent anchor by the later residue comparison.
  rows: 24
  ready_for_extent_anchor: 24
  direct_mass_loss_profile_ready: 0
  experiment_links: FUN1 and FUN2 remain separate; each row points to its experiment's starting composition and has its own printed temperature and pressure bound. The identity composition gap is recorded above.
  missing_or_deferred_inputs:
    identity.composition: Printed starting compositions are present and linked to each run, but not promoted to identity because Car 1 forbids composition_role; see identity_binding_conflict.
    identity.total_pressure_Pa: The printed one-sided ceiling remains in point_conditions; the design directs identity pressure to remain unknown for a bound.
    identity.fO2_Pa: No absolute fO2 value or oxygen-buffer condition is printed; every row carries a located unknown.
    identity.sample_mass_kg: The observation profile requires it, but Car 1 forbids sample.mass_kg; the initial and final grams remain in the mass-loss values and are not converted to kilograms.
    identity.reservoir: The design leaves this bulk-bead phase unspecified.
    identity.sweep_gas: No gas mixture or carrier-flow value is reported for the vacuum-furnace conditions.
    identity.exposure: Run duration is printed per bead; exposed area is not printed.
    identity.per: Bound to the printed fraction denominator with simulator/battery/enums.py::PerBasis.INITIAL_MASS.
  method_token: vacuum_evaporation still awaits the separate Car 2 alias.
  next_car_note: >-
    Car 1 emits no scored or predicted residue rows, so steer 4 requires no changes here. For Car 3, phrase DP-005 alpha_assumed as relative-alpha sensitivity for MgO and SiO2, and add the typed melt_well_mixed_assumed notice using diffusion time R^2/D against evaporation time; bead radius is unprinted. Reuse an existing notice mechanism and add no DP id. Leave method fields to the separate alias fold.
expected_store_delta: +24 mass-loss observations; the existing 96 composition points remain unchanged and sample_mass_kg remains unknown. No battery-store regen was committed.
