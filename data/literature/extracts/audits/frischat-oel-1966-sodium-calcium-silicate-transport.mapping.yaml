        polycrystal: '500 bis 900 °C: 0,20 (0,16 bis 0,24)'
      uncertainty_note: confidence level not stated
    - page: 10
      printed_page: 59
      render_check: verified
      values: {glass: '0,16', crystal: '0,20'}
      method_note: >-
        The authors say these factors were determined experimentally from the
        failure of the Nernst-Einstein relation for measured Na self-diffusion
