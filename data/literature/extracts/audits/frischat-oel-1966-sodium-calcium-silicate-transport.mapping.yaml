    printed_page: 54
    render_check: verified from the page 5 text/table layout
    glass_as_printed: 250-900 °C measured; 250-600 °C fitted expression
    polycrystal_as_printed: 350-900 °C measured; 470-900 °C fitted expression
  factors_as_printed:
