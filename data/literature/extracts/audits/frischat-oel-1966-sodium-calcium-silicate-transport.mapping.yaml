  printed_title: 'Einfluß der absichtlich geänderten Zusammensetzung auf die Kristallisation, Analysenwerte'
  units_as_printed: Gew.-%
  layout_and_cells_render_check: >-
    MinerU did not produce a table block for Table 1. PDF page 2 (printed page
    51) was rendered; the render verifies all 15 numeric cells, the delta signs,
    row/column assignments, and the target-column dash. The pdftotext reads
    30,98(-0,33) as malformed 30,980-0,33); the render confirms 30,98(−0,33).
  target_Sollwerte:
    Na2O: '17,49'
    CaO: '31,65'
    SiO2: '50,86'
    R2O3: {typed_absence: em_dash}
