source_id: frischat-oel-1966-sodium-calcium-silicate-transport
source_citation: Frischat and Oel (1966), Glastechnische Berichte 39(2), 50-61
source_language: German
audit_status: source_cells_resolved
input_order:
  primary_machine_reads:
    - MinerU table blocks and markdown
    - pdftotext-layout
  backup: PDF page renders for the flagged decimal-comma cells and locator/layout checks
tables:
  - printed_table: '2'
    page: 5
    draft_key: p005-t01
    printed_body_rows: 12
    columns:
      1: Glas temperature, °C
      2: Glas, beta-plus activity, D in cm2/s
      3: Glas, gamma activity, D in cm2/s
      4: Polykristall temperature, °C
      5: Polykristall, beta-plus activity, D in cm2/s
      6: Polykristall, gamma activity, D in cm2/s
    cell_audit:
      machine_read_agreement: >-
        Table QA reports 51 numeric cells and 1.000 agreement between the
        MinerU table draft and pdftotext. The render resolves comma-decimal
        values and checks the complete row/column assignment.
      layout_check: >-
        Rendered PDF page 5 (printed page 54) verifies the six-column grouping,
        row assignments, both separate 435 °C and 575 °C glass rows, and all
        printed integer temperatures.
      flagged_decimal_cells: >-
        Rendered PDF page 5 verifies all 30 D cells flagged for comma decimals.
        Their transcribed decimal coefficients and exponents are the values in
        the MinerU draft cells at CSV rows 4-15, columns 2, 3, 5, and 6.
      printed_rows_and_values:
        - {printed_row: 1, temperature_C: [207, 512], numeric_D_cells: [glass_beta, glass_gamma, poly_beta], absent_D_cells: [poly_gamma]}
        - {printed_row: 2, temperature_C: [305, 520], numeric_D_cells: [glass_beta, glass_gamma, poly_gamma], absent_D_cells: [poly_beta]}
        - {printed_row: 3, temperature_C: [305, 575], numeric_D_cells: [glass_beta, poly_beta, poly_gamma], absent_D_cells: [glass_gamma]}
        - {printed_row: 4, temperature_C: [375, 633], numeric_D_cells: [glass_beta, glass_gamma, poly_beta], absent_D_cells: [poly_gamma]}
        - {printed_row: 5, temperature_C: [425, 643], numeric_D_cells: [glass_gamma, poly_gamma], absent_D_cells: [glass_beta, poly_beta]}
        - {printed_row: 6, temperature_C: [435, 701], numeric_D_cells: [glass_beta, glass_gamma, poly_gamma], absent_D_cells: [poly_beta]}
        - {printed_row: 7, temperature_C: [435, 775], numeric_D_cells: [glass_beta, glass_gamma, poly_gamma], absent_D_cells: [poly_beta]}
        - {printed_row: 8, temperature_C: [517, 790], numeric_D_cells: [glass_beta, glass_gamma, poly_beta], absent_D_cells: [poly_gamma]}
        - {printed_row: 9, temperature_C: [520, 885], numeric_D_cells: [glass_gamma, poly_gamma], absent_D_cells: [glass_beta, poly_beta]}
        - {printed_row: 10, temperature_C: [575, null], numeric_D_cells: [glass_beta, glass_gamma], absent_D_cells: [poly_temperature, poly_beta, poly_gamma]}
        - {printed_row: 11, temperature_C: [575, null], numeric_D_cells: [glass_gamma], absent_D_cells: [glass_beta, poly_temperature, poly_beta, poly_gamma]}
        - {printed_row: 12, temperature_C: [633, null], numeric_D_cells: [glass_beta, glass_gamma], absent_D_cells: [poly_temperature, poly_beta, poly_gamma]}
    printed_count_reconciliation: >-
      12 printed body rows; 21 numeric temperature cells (12 glass and 9
      polycrystal); 30 numeric D cells and 18 blank D cells. Total 51 numeric
      cells, matching the table QA census. Blank cells are typed absences, not
      zeros.
    row_assignment_basis: >-
      Column headings identify Glas versus Polykristall, beta-plus versus gamma
      activity, and D in cm2/s. The page render confirms these assignments.
    figure_policy: >-
      Fig. 6, Fig. 8, Fig. 10, and Fig. 11 sodium diffusion values and Fig. 7
      conductivity points remain figure_only and undigitised. Fig. 10's printed
      curve legend and Fig. 11's prose comparison are retained as located
      context without digitizing plotted values.
composition:
