      page: 5
      printed_page: 54
      scope: sodium self-diffusion in glass and polycrystal; includes off-stoichiometric curves
      status: figure_only; undigitised
    - figure: '7'
      page: 5
      printed_page: 54
      scope: electrical conductivity in glass and polycrystal
      status: figure_only; undigitised
    - figure: '8'
      page: 5
      printed_page: 54
      scope: comparison with Na self-diffusion in comparable soda-lime silicate glasses
      status: figure_only; undigitised
    - figure: '10'
      page: 9
      printed_page: 58
      render_check: >-
        Render confirms the printed four-item curve legend: measured and
        conductivity-calculated Na self-diffusion series; no plotted points
        were transcribed.
      status: figure_only; undigitised
    - figure: '11'
      page: 10
      printed_page: 59
      render_check: >-
        Page render confirms the printed prose correspondence of 400 °C in
        glass to 485 °C in crystal and 600 °C in glass to 720 °C in crystal.
      scope: equal Na self-diffusion curve for glass and crystal
      prose_comparison: >-
        The body text says 400 °C in glass corresponds to 485 °C in crystal,
        and 600 °C in glass corresponds to 720 °C in crystal. These prose
        comparisons are retained with the figure candidate; no plotted points
        were transcribed.
      status: figure_only; undigitised
schema_gap:
  candidate_code_symbols:
    - simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION
    - simulator/battery/enums.py::PHASE_BASIS_TOKENS
    - simulator/battery/enums.py::PhaseRole
    - simulator/battery/enums.py::RefusalReason.BULK_NOT_LIQUID_COMPOSITION
    - simulator/battery/migrate.py::QUANTITY_ALIASES
    - simulator/battery/migrate.py::TYPE_QUANTITY
    - tools/validate_literature_extracts.py::OBSERVATION_TYPES
  evidence: >-
    No exact quantity token was found for sodium self-diffusion coefficient,
    Arrhenius D0 or activation energy, conductivity Arrhenius-fit parameters,
    correlation factor, or sodium transference number. The closed observation
    types also have no exact transport-data type. Existing extracts
    schreiber-1986-oxygen-diffusion-redox and alexander-2001-maps retain
    diffusion coefficients in context when no coefficient token exists.
  bulk_composition_candidate:
    code_symbols:
      - simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION
      - simulator/battery/enums.py::PHASE_BASIS_TOKENS
      - simulator/battery/enums.py::PhaseRole
      - simulator/battery/enums.py::RefusalReason.BULK_NOT_LIQUID_COMPOSITION
      - simulator/battery/migrate.py::QUANTITY_ALIASES
      - simulator/battery/migrate.py::TYPE_QUANTITY
      - tools/validate_literature_extracts.py::OBSERVATION_TYPES
    disposition: context
    reason: >-
      Quantity.EQUILIBRIUM_PHASE_COMPOSITION is the closest token, but its
      accepted phase basis and role describe a named phase composition. Table 1
      gives nominal and analyzed bulk compositions without a printed phase.
      composition_series exists as a broad observation type, but it does not
      provide an exact bulk-composition Quantity. Existing extract
      park-2021-vanadium-thermodynamics-thesis uses the phase-composition path
      for actual equilibrium phase analyses. BULK_NOT_LIQUID_COMPOSITION is a
      RefusalReason, not a Quantity.
  controller_ruling: >-
    Store the diffusion coefficients, Arrhenius D fits, conductivity fits,
    correlation factors, and quoted transference claim in context rows with
    schema_gap and typed_unavailable. Keep values structured for mechanical
    promotion; do not use a misleading observation type.
  future_diffusion_quantity_requirements: >-
    Main can raise an exact sodium self-diffusion coefficient Quantity with the
    engine: it needs D in a canonical length-squared/time unit as a temperature
    series, phase (glass or crystal), Na species, and printed composition as
    identity; D0, activation energy, and fit temperature interval must remain
    attached as fit parameters. The source prints no run pressure or fO2, so
    those axes must stay unknown or be optional for this quantity.
  electrical_conductivity_candidate:
    code_symbols:
      - simulator/battery/enums.py::Quantity.ELECTRICAL_CONDUCTIVITY
      - simulator/battery/migrate.py::_convert_printed_amount
      - simulator/battery/identity.py::profile_for
      - tools/validate_literature_extracts.py::OBSERVATION_TYPES
    disposition: context
    reason: >-
      Quantity.ELECTRICAL_CONDUCTIVITY exists for scalar conductivity in S/m,
      but this paper prints Arrhenius fit parameters and Figure 7 values, not a
      tabulated scalar conductivity point. Computing point conductivities from
      the fit would add unprinted values, while digitizing Figure 7 is out of
      scope. The migration unit converter has no conversion for the printed
      Ω^-1 cm^-1 unit; the scalar identity profile also requires total pressure,
      which the source does not print for these runs. OBSERVATION_TYPES has no
      conductivity-series type. Therefore neither the fits nor figure points
      can be represented as real observations using the existing path.
phase_and_conditions:
  glass_phase_token: glass
  polycrystal_phase_token: cr
  condition_policy: >-
    Table 2 prints experimental temperatures and Table 1 prints the target
    composition. The source does not print experimental total pressure or fO2
    for these diffusion rows; no pressure or atmosphere is assumed.
  quench_statement:
    page: 2
    printed_page: 51
    state: asserted_preserved
    source_statement_as_printed: >-
      Durch Ausgießen der Schmelze auf eine kalte Platte in eine Form und
      anschließendes Tempern gelangen bei schnellem Arbeiten einige Proben
      ohne Kristallisation.
    interpretation: Glass phase was preserved without crystallization; the source makes no quench redox statement.
comparison:
  output_file: frischat-oel-1966-sodium-calcium-silicate-transport.compare.txt
  result: >-
    compare mode found no numeric observation candidates because the controller
    ruling requires the untypeable transport rows to remain under context.
    Table 1's four locators are reported as unverifiable because MinerU did not
    extract a caption block; the page 2 render confirms the printed Table 1
    caption and cells. Table 2's context values are independently pinned as a
    complete grid in the focused test and fully render-checked above.
  table2_cell_comparison: >-
    Not available in compare mode for context records. The table draft and QA
    pre-screen were used for Table 2 machine-read agreement; the focused test
    compares all 12 rows and 30 numeric D cells to independent render literals.
