schema_version: literature_extract_mapping_audit.v1
source_id: borisov-2010-silica-ferric-ferrous
tables:
- table: '1'
  locator:
    page: 2
    pdf_page_index: 1
    published_page: 546
    table: '1'
  printed_data_rows: 7
  columns_as_printed:
  - Sample
  - SiO2
  - Al2O3
  - Fe2O3
  - MgO
  - CaO
  - Total
  - x
  mapped_fields:
  - values.rows[].composition_as_printed
  - values.rows[].point_conditions.composition.state.value.components
  - values.rows[].composition_total_wt_pct_as_printed
  - values.rows[].silica_formula_x_as_printed
  - values.composition_map_cell_locators
  - values.composition_total_wt_pct_locators
  - values.silica_formula_x_locators
  row_binding: >-
    Table 1 identifies these as initial mixtures and notes the compositions are
    calculated averages from similar experimental glasses. Table 2 and Table 4
    use the matching series names. No individual analysed-glass compositions
    are printed, so no such composition is inferred.
  explicit_unreported_cells: >-
    Table 1 has no P2O5 column. It is absent from the printed composition maps;
    the dash for DAFL x is retained as the printed dash, not converted to zero.
- table: '2'
  locator:
    page: 2
    pdf_page_index: 1
    published_page: 546
    table: '2'
  printed_data_rows: 6
  columns_as_printed:
  - T °C
  - h
  - Samples produced simultaneously in the same series
  mapped_fields:
  - values.rows[].T_C
  - values.rows[].duration_h_as_printed
  - values.rows[].temperature_run_id_as_printed
  - values.rows[].atmosphere_as_printed
  row_binding: >-
    Run suffixes bind the sample names in Table 4 to the corresponding Table 2
    series row. Table 2 uses DA for the iron-rich base samples called DAF in
    Table 4 and Table 1. Its note states all series were synthesized in air.
  atmosphere_locator:
    page: 2
    pdf_page_index: 1
    published_page: 546
    table: '2'
    row: note
  explicit_unreported_cells: >-
    No numeric oxygen fugacity is printed for these runs. The extract records
    air as printed and does not calculate an fO2.
- table: '4'
  locator:
    page: 4-5
    pdf_page_index: 3-4
    published_page: 548-549
    table: '4'
  printed_data_rows: 22
  extracted_run_rows: 22
  columns_as_printed:
  - Sample no.
  - Fe3+ magnetic component fit parameters
  - Fe3+ magnetic / Fe3+ total
  - Fe3+/Fe2+
  - vmax (mm/s)
  mapped_fields:
  - values.rows[].run_id_as_printed
  - values.rows[].cell_locators.run_id_as_printed
  - values.rows[].Fe3_over_Fe2
  - values.rows[].vmax_mm_s_as_printed
  - values.rows[].cell_locators
  row_binding: >-
    Twenty-two distinct oxidized-glass samples have a final-column ratio. For
    DAFL-9 and DAFL-10, the full-range ±19 mm/s fit is retained; the other
    printed fit variants for those samples are method comparisons, not new runs.
    For DAF-2, DAS20F-2, DAS40F-2, and DAS60F-2, the first ratio includes the
    magnetic ferric component; the lower values printed under “magnetic ferric
    was ignored” are alternate fits, not separate experiments.
  uncertainty: >-
    Folio 550 estimates an absolute Δ(Fe3+/Fe2+) of about 0.05 for most
    iron-rich samples from a baseline shift of ±1σ, and states total ratio error
    after reprocessing cannot exceed 0.1. The baseline perturbation is not a
    per-row 1σ interval. Individual row uncertainties are not printed. Figure
    7 on folio 551 displays error bars for the iron-rich series. Parenthetical
    values in Tables 4 and 4—Extended are fit-parameter uncertainties, not
    ratio uncertainties.
  uncertainty_locator:
    published_page: 550
    pdf_page_index: 5
    section: The effect of silica concentration on the Fe3+/Fe2+ ratio
  figure_uncertainty_locator: {published_page: 551, pdf_page_index: 6, figure: '7', series: iron-rich}
  cross_source_count_check: >-
    Aithala et al. supplementary Table S-5 summarizes 21 fitted experiments in
    six series. Its listed series counts total 21 and omit the one printed
    DAS90F-5 ratio row. DAS90F-5 is retained because the source paper prints
    its ratio and Table 2 gives its run conditions.
- table: '3'
  locator:
    page: 3
    pdf_page_index: 2
    published_page: 547
    table: '3'
  printed_data_rows: 6
  distinct_context_samples: 3
  extracted_run_rows: 0
  columns_as_printed:
  - Sample no.
  - Fe2+-I hyperfine parameters
  - Fe2+-II hyperfine parameters
  mapped_fields:
  - experiments[0].comparison_runs[].sample_id_as_printed
  - experiments[0].comparison_runs[].T_C
  - experiments[0].comparison_runs[].source_relation
  - experiments[0].comparison_runs[].fO2_as_printed
  - experiments[0].comparison_runs[].log_fO2
  - experiments[0].comparison_runs[].log_fO2_basis
  row_binding: >-
    DAFe-11, DAS25Fe-11, and DAS70Fe-11 are reduced-glass comparisons from
    Borisov (2007), not numeric Fe3+/Fe2+ results in this paper. The discussion
    gives their shared conditions as 1400 °C and oxygen fugacity of 10⁻¹²·³ atm.
    Figure 3 prints log fO2 = -12.3 on that atm basis. Table 3
    reports Fe2+ hyperfine parameters; the text says the ferric proportion was
    negligible and prints no Fe3+/Fe2+ ratio for these runs.
  conditions_locator: {published_page: 546, pdf_page_index: 1, section: Experimental Methods}
  sample_id_locator: {published_page: 547, pdf_page_index: 2, table: '3', column: Sample no.}
