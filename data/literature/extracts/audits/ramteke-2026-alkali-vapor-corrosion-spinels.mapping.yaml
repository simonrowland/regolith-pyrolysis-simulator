schema_gap_checks:
  penetration_depth:
    rejected_candidates:
      - OBSERVATION_TYPES in tools/validate_literature_extracts.py:79-100 has no penetration_depth_measurement type.
      - TYPE_QUANTITY in simulator/battery/migrate.py:435-444 and QUANTITY_ALIASES in simulator/battery/migrate.py:453-546 have no corrosion_depth or infiltration_depth token.
      - Quantity in simulator/battery/enums.py:62-111 contains wall_deposit_mass (mass), but no depth quantity.
    disposition: preserve printed measured depths in context; do not misuse wall_deposit_mass.
  eds_atomic_percent:
    rejected_candidates:
      - OBSERVATION_TYPES in tools/validate_literature_extracts.py:79-100 permits composition_series, but not a dedicated standardless_EDS_composition type.
      - EQUILIBRIUM_PHASE_COMPOSITION exists in simulator/battery/enums.py:108; PHASE_BASIS_TOKENS at :663 permits wt_percent, mole_fraction, and ppm_mass, not at_percent.
      - PhaseRole at simulator/battery/enums.py:301-312 is melt, slag, glass, metal, matte; it has no reacted solid-feature role for these EDS regions.
    precedent_check: Park 2021 and Barcza 1979 use equilibrium_phase_composition for mol% or wt% equilibrium liquid rows, not standardless EDS at% of corroded solid features.
    disposition: preserve the measured EDS table cells in context as printed at%; do not convert or claim an equilibrium composition.
  corrosion_phases:
    rejected_candidates:
      - OBSERVATION_TYPES in tools/validate_literature_extracts.py:79-100 has no corrosion_phase_identification type.
      - TYPE_QUANTITY in simulator/battery/migrate.py:435-444 supplies transition_temperature for transition_point, not a categorical reaction-product quantity.
      - PHASE_MAP in simulator/battery/migrate.py:380-405 maps sample phase tokens; it is not a product-assemblage quantity.
    disposition: preserve XRD product identifications as context.
no_mass_change: The paper reports no specimen mass change; no numerical row or observation is fabricated.
figure_only_candidates:
  - Figure 1C heating schedule; no digitized temperatures or dwell coordinates extracted.
  - Figure 3 XRD pattern peak positions; phase names are taken from the authors' text, not digitized.
  - Figures 7-12 microscopy; only printed dimensions and table cells are transcribed.
