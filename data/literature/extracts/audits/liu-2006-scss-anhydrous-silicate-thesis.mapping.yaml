schema_gap: Appendix I ln S (ppm), model predictions, and model deviations have no exact logarithmic sulfur-concentration
  quantity token, so own ln S rows are quantity-unknown and model values remain located typed refusals in context.
  The closed tools/validate_literature_extracts.py::OBSERVATION_TYPES set accepts concentration_series as a type
  but does not define a logarithmic concentration quantity; simulator/battery/migrate.py::QUANTITY_ALIASES and TYPE_QUANTITY
  have no exact token or safe inference for ln(ppm); simulator/battery/enums.py::Quantity has no log-concentration
  quantity. These are not ordinary phase amounts admitted by PHASE_BASIS_TOKENS; glass is a valid phase role, but
  does not change the logarithmic quantity. Existing equilibrium-phase-composition extracts such as data/literature/extracts/kunisada-1986-na-silicate-dephosphorization.yaml
  use component_amount for non-log phase amounts, which is not an exact match.
machine_read_qa: 'mineru_table_qa numeric agreement: Table 1 0.898, Table 2 1.000, Table 3 0.874, Table 4 0.436,
  Table 5 0.986, Table 6 0.985, Appendix I 0.502. Every stored numeric cell was checked on its page render; flagged
  Table 5 uncertainty spellings were crop-checked at 300 dpi.'
appendix_condition_note: Appendix I ln fO2 for yn38 is a natural logarithm in bar. On shared run yn40 it matches
  ln(10) times the Table 3 log10(bar) value; identity fO2_Pa is converted using exp(ln fO2) × 100000 Pa/bar. The
  Appendix 10000/T and P/T predictors are retained as printed and not converted into a T or P condition.
compare_resolution: 'mineru_table_draft.py compare reports 50 matched and 250 mismatch among 300 numeric values,
  with no no-match, locator-error or unverifiable rows. All 250 are Table 4 glass and Appendix I own log-S cells:
  their values match the machine table cells, but the comparer phase filter tools/mineru_table_draft.py::_phase_matches_column
  rejects the valid phase token glass. Table 5 matched values include the rendered resolutions of 2.22(0.82) and
  0.056 (35). The committed compare output is accompanied by the full render-cell audit; no phase or value was altered
  to satisfy the comparer.'
