render_checks:
  pages: [1, 2, 3, 4]
  high_resolution_pages: [2, 3]
  result: Every stored numeric cell was read on a page render because the MinerU article text was absent and pdftotext is OCR. The p379 muffle dimension disagreement resolves to 18 by 2 in. ID on the render (pdftotext reads 13 by 2); the p380 Fig. 5 legend resolves to 1330°C and 3600 sec for the cross and filled-circle series.
schema_gaps:
  - Vaporization heat is unresolved between two printed reactions; exact quantity token is unavailable, as in the ruling documented by powell-1971-alkali-sulfate-metasilicate-vapour.
  - Apparent activation energy has no quantity token in simulator/battery/enums.py::Quantity or simulator/battery/migrate.py::QUANTITY_ALIASES and no observation type in tools/validate_literature_extracts.py::OBSERVATION_TYPES; rate_series would infer mass_loss_rate through simulator/battery/migrate.py::TYPE_QUANTITY if the explicit descriptive label were omitted.
figure_read_candidates:
  - Fig. 1 mass loss versus charge weight.
  - Fig. 2 mass loss versus time.
  - Fig. 3 mass loss versus argon flow rate.
  - Fig. 4 Arrhenius plot of SiO weight loss.
  - Fig. 5 disproportionation amount versus time.
  - Fig. 6 Arrhenius plot of terminal disproportionation.
  disposition: Figure-only records preserve captions, printed conditions, prose summaries, and legend pairings. No graph coordinates were digitized. No numerical SiO vapour pressures are printed.
