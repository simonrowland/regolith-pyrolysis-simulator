  - {row: 3, pdf_table_row: 4, temperature_C: '1439', extractive_weight_loss_mg: '166', gravimetric_weight_loss_mg: '170', ratio: '0.98', source_reads: 'MinerU + pdftotext', render: confirmed}
  - {row: 4, pdf_table_row: 5, temperature_C: '1354', extractive_weight_loss_mg: '69', gravimetric_weight_loss_mg: '79', ratio: '0.87', source_reads: 'MinerU + pdftotext', render: confirmed}
  - {row: 5, pdf_table_row: 6, temperature_C: '1454', extractive_weight_loss_mg: '188', gravimetric_weight_loss_mg: '188', ratio: '1.00', source_reads: 'MinerU + pdftotext', render: confirmed}
  - {row: 6, pdf_table_row: 7, temperature_C: '1356', extractive_weight_loss_mg: '85', gravimetric_weight_loss_mg: '71', ratio: '1.21', source_reads: 'MinerU + pdftotext', render: confirmed}
prose_measurements:
- page: 6
  locator: Results V(1), carrier-gas comparison
  source_reads: MinerU and pdftotext agree on the digits and exponents; PDF page 6 render confirms the printed sentence.
  values_as_printed:
    at_1400_C: '6.7 × 10^-5 to 7.4 × 10^-5 mol·(m2·s)^-1'
    at_1450_to_1460_C: '~1.2 × 10^-4 mol·(m2·s)^-1'
  interpretation: The paper does not assign the 1400 C range endpoints to the two carrier gas experiments; the higher-temperature rates are stated to be nearly identical.
  conditions_as_printed:
    H2O_partial_pressure_bar: '0.25 ± 0.01'
    H2O_uncertainty_notice: confidence level not stated
    N2_H2O_O2_partial_pressure_bar: '<0.01'
    air_H2O_O2_partial_pressure_bar: '~0.16'
    normalized_gas_flow_m3n_s: '1.6E-4'
    flow_normalization_reference_as_printed: 'T = 293.15 K and P = 101325 Pa; these are flow normalization conditions, not the experiment pressure.'
    total_experiment_pressure: not_printed
    caveat: The total experiment pressure is not reported.
  evidence_class: measured_reduced
  reduction: ICP-ES sodium concentrations, carrier-gas volume flow, and experiment duration in the transpiration measurements; endpoint assignment is not stated.
  disposition: unavailable_quantity_unknown
relative_activity_statement:
  page: 7
  locator: Results V(3), measured chemical activities of Na2O
  source_reads: MinerU and pdftotext agree on the relative range; page 7 render confirms the prose statement.
  value_as_printed: about 10–15% lower
  reference: original glass sample Na2O surface activity
  scope_as_printed: both sodium-disilicate and soda-lime-silicate melts
  conditions_not_assigned: The neighboring about-6-h and 1400–1500 °C conditions describe the soda-lime surface-concentration decrease, not this summarized relative activity comparison; atmosphere and individual temperatures are not tied to the comparison.
  evidence_class: measured_reduced
  reason: The authors summarize Na2O surface activities reduced from ICP-ES measurements in the transpiration experiments; the numeric activity points are figure-only and not digitized here.
  disposition: unavailable_quantity_unknown
figure_read_candidates:
- {figure: '3', page: 6, candidate: measured NaOH saturation pressure versus square-root water pressure; no points digitized}
- {figure: '4', page: 6, candidate: measured Na(g) saturation pressure versus temperature; no points digitized}
- {figure: '5', page: 8, candidate: cumulative Na2O release versus time for eight runs A-H; green retains the A-H temperature and water-pressure labels, and curve points remain undigitized}
- {figure: '6', page: 8, candidate: measured and modeled Na2O activity in sodium disilicate; no points digitized}
- {figure: '7', page: 8, candidate: measured and modeled Na2O activity in soda-lime-silicate; no points digitized}
- {figure: '8', page: 8, candidate: measured/model activity comparison; no points digitized}
printed_activity_values: No absolute activity values in prose or tables; relative statement above is retained, and all numeric activity markers are figure-only.
compare_scope: The comparator checks the six extractive-loss row values (the canonical value field). All other numeric cells in Table II are included in cell_audit and independently agree between MinerU and pdftotext; page-render layout verification covers their cell assignments.
