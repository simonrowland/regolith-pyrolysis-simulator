reconciliation_table:
- disagreement: Green's combined activity summary points to PDF page 8; the wave activity observation and review point to PDF page 7.
  resolution: Keep the green observation id and locate its relative-activity and cumulative-release prose at PDF page 7, published page 3452. Move the page 8 model-fit values into a separate context row.
  basis: PDF page 7 render places both prose summaries on page 7; PDF page 8 contains Figure 8 and its model comparison.
- disagreement: The wave figure-read audit lists Figure 8 on page 9 while green lists PDF page 8.
  resolution: Use PDF page 8, published page 3453.
  basis: PDF page 8 render contains Figure 8.
- review_finding: P2; Green labels the sodium rate context measured_direct, while the wave review classifies the author-reduced rates as measured_reduced.
  disposition: Use measured_reduced because the authors calculate the rates from ICP-ES concentrations, carrier-gas flow, and experiment duration.
  basis: PDF page 6 Results V(1) and the wave review's evidence-class finding.
- review_finding: P2; Green labels Table II measured_direct, and both wave reviews classify the extractive column measured_reduced.
  disposition: Use measured_tabulated for the author-reported Table II observation under the explicit Kim precedent. Keep the distinction that the extractive column is reduced from ICP-ES and the gravimetric column is directly weighed.
  basis: PDF page 7 Table II and the brief's measured_tabulated rule.
- review_finding: P2; Green classifies the combined activity and release summary as model_derived, while the wave review classifies the relative activity statement measured_reduced.
  disposition: Class the relative-activity and cumulative-release summaries measured_reduced. Keep the separate measured/model fit summary model_derived.
  basis: PDF page 7 prose reports measured summaries; PDF page 8 reports the modeled-versus-measured fit.
- review_finding: P1; the early wave version bound evaporation_rate to molar areal flux, mass_loss_fraction to absolute mg, and activity to relative-to-glass percent.
  disposition: The reviewed wave tip removed these bindings. Keep quantity absent on the nine observations, retain descriptive quantity_label and schema_gap fields, and do not add a schema token.
  basis: Canonical quantity units do not fit the printed units or relative reference; isolated migration leaves every quantity unknown.
- disagreement: Green used non-token quantity labels on several context rows, while the wave's early draft attempted false quantity bindings on observations.
  resolution: Convert descriptive Green context labels to quantity_label/schema_gap, and retain exact tokens only where they match the context observable, such as p_partial on pressure figures and activity on activity figures.
  basis: Context rows remain descriptive; the nine added observation rows migrate with quantity unknown and no rail.
- disagreement: Dividing the last Table II extractive mass by its gravimetric mass gives about 1.20 while the paper prints 1.21.
  resolution: Preserve the printed ratio 1.21 without recalculating it.
  basis: PDF page 7 render and both extracted row records print 1.21.
- review_finding: P2; the wave mapping audit says Figure 5's condition grid was not transcribed, although Green embeds conditions for all eight series.
  disposition: Preserve the Green Figure 5 A-H series labels and conditions without duplicating them.
  basis: PDF page 8 render confirms the A-H temperature and water-vapor-pressure grid.
- review_finding: P2; the first wave draft citation span is 3449–3457, unlike the Green citation and final wave commit.
  disposition: Keep 3446–3455.
  basis: The PDF first-page header prints 3446–3455.
- disagreement: Green omitted the wave's reported gas-flow normalization reference, which could be mistaken for an experiment pressure.
  resolution: Add 293.15 K and 101325 Pa to the existing rate-summary context as flow normalization metadata; keep experiment total pressure unreported.
  basis: PDF page 6 Results V(1) states the normalized flow reference; it does not state the experiment total pressure.
- review_finding: P1; the formula coefficients for Na2O·2SiO2 were converted into 1/3 and 2/3 mole fractions.
  disposition: Delete all composition_mol fraction maps. Store Na2O 1 and SiO2 2 as mol_inventory with basis printed_formula_stoichiometry on each rate and Table II point condition; leave identity composition absent because the v1 composition_mol reader cannot preserve inventory basis.
  basis: PDF formula and the batch4 printed-formula ruling; the green Shornikov test pins the same point-condition representation.
- review_finding: P1; the first wave version dropped the two sodium-rate points from migration.
  disposition: Retain two separate rate_series observations with unavailable values and unknown quantities. T_C binds 1400 °C; T_C_range and T_range_K preserve 1450–1460 °C without a midpoint.
  basis: PDF page 6 render and isolated migration.
- review_finding: P1; about 6 h and 1400–1500 °C were attached to the 10–15% activity comparison.
  disposition: Keep those conditions off the relative-activity observation. Do not add the neighboring surface-concentration measurement as a new observation in this reconciliation.
  basis: PDF page 7 render separates the soda-lime concentration sentence from the both-glass activity summary.
- review_finding: P2; the wave used transpiration_evaporation rather than the closed method token.
  disposition: Use transpiration on both rate observations, the activity observation, and the Table II observation.
  basis: The migrator closes on transpiration.
- review_finding: P2; MinerU was described as the primary read for a born-digital PDF.
  disposition: Record pdftotext-layout as primary and page renders as the verification source; retain MinerU only as the independent Table II comparison.
  basis: The controller ruling for this born-digital source and the page renders.
- review_finding: P2; catalog regeneration was requested while the controller deferred it.
  disposition: Leave INDEX.yaml, INDEX.md, and SOURCE_STATUS.yaml untouched as directed; no store or catalog output is committed.
  basis: Controller deferral recorded at the top of this mapping audit.
- review_finding: P3; p_H2O and normalized flow were not pinned in the wave tests.
  disposition: Pin both strings in the merged test and verify the flow migrates to Decimal 0.00016.
  basis: PDF page 6 render.
- review_finding: P2; the wave review disclosed figure-only and prose measurements outside the extracted rows, including soda-lime bulk/surface fractions and the page-9 error budget.
  disposition: Preserve Green's existing 74:16:10 glass composition, 0.5-3.5% cumulative-release summary, and Figure 5 A-H context. Do not add the unextracted 0.308 bulk fraction, 0.293±0.005 surface fraction after 78 h at 1402 °C, 0.328 initial surface fraction, 0.330±0.005 or 0.157±0.003 modeled surfaces, new figure digitizations, or page-9 error-budget values in this reconciliation.
  basis: Those values are disclosed in the review records but are absent from both extracts; the merged scope is their verified union, and numeric activity curves remain deferred.
- review_finding: P3; the re-review notes that the omitted prose and figure values are not itemized in the wave audit.
  disposition: List the omitted candidate values and deferral above; keep Figs. 3, 4, 6, 7, and 8 as undigitized figure context.
  basis: PDF pages 6-9 and review ror-navanlimpt06-na-evap-r2.md.
