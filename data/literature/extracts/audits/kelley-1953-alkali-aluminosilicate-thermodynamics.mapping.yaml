schema_gap_notes:
- Quantity.S = "S" (simulator/battery/enums.py:93) is absolute molar entropy; no exact
  token represents S51 extrapolated components, measured S298.16−S51 components, or
  S_T−S_298.16 increments.
- Quantity.DELTA_FH = "delta_fH" and Quantity.DELTA_FG = "delta_fG" (simulator/battery/enums.py:84-85)
  are formation quantities; the reaction ΔH and ΔF values in Tables 34, 36 and 37
  are not formation values.
- OBSERVATION_TYPES (tools/validate_literature_extracts.py:71-100) has no reaction-level
  type, and iter_extract_observations (simulator/battery/migrate.py:13482-13496) walks
  species-keyed observations only. gibbs_table maps to delta_fG for one substance
  (TYPE_QUANTITY, simulator/battery/migrate.py:435-450); log10_Kf (Quantity.LOG10_KF,
  simulator/battery/enums.py:69) is a formation equilibrium constant. Neither is an
  exact type or quantity for these reaction enthalpies and free energies, so the printed
  cells remain in context.
