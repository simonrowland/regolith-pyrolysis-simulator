- figure: '2.11'
  page: 35
  quantities:
  - alpha versus temperature
  - equilibrium vapor pressure versus temperature
  disposition: >-
    Numeric points are plotted only; not transcribed. The printed fit equations
    are retained in their separate equation observations.
- figure: '2.8'
  page: 28
  quantity: copper-melting-point calibration check
  disposition: Graph-only calibration point; not transcribed.
apparatus_mapping:
  page_renders:
  - page: 21
    facts: QCM-cell distance, post-bake chamber pressure, QCM frequency and mass sensitivity
  - page: 23
    facts: four-filament arrangement and approximate filament length
  - page: 27
    facts: ice-water reference temperature, thermocouple accuracy, calibration error
  - page: 30
    facts: assumed geometry, QCM rate, temperature and alpha error values
  - page: 34
    facts: SiO powder size and purity, both Knudsen-cell orifice diameters
evidence_class_decisions:
- observation: wetzel_2012_sio_evaporation_coefficient_fit_eq_2_25
  class: measured_reduced
  reason: >-
    The authors' alpha fit reduces the two Knudsen-cell measurement series.
    Keep it measured evidence so an apparatus or calibration gate cannot be
    bypassed by reclassing; raw plotted inputs are excluded as figure-only.
- observation: wetzel_2012_sio_equilibrium_pressure_fit_eq_2_26
  class: measured_reduced
  reason: >-
    Equation (2.20) reduces QCM mass rate to equilibrium pressure and Equation
    (2.26) fits the authors' own measurements. Preserve the measured evidence
    class; the raw graph points are excluded and the pressure law remains an
    unavailable series in migration.
- observation: wetzel_2012_sio_sublimation_enthalpy_1400K
  class: measured_reduced
  reason: Derived from the stored measured pressure fit by Equation (2.4).
- observation: wetzel_2012_sio_sublimation_enthalpy_298K
  class: quoted_attributed
  reason: >-
    The authors report a reduction from the 1400 K result using heat-capacity
    and integral inputs cited to [48] and [38]; those numeric inputs are not
    present in this chapter's extract.
quantity_schema_gap:
- printed_quantity: ΔH_sublimation(SiO)
  exact_label: sublimation_enthalpy
  affected_observations:
  - wetzel_2012_sio_sublimation_enthalpy_1400K
  - wetzel_2012_sio_sublimation_enthalpy_298K
  code_symbols_checked:
  - tools/validate_literature_extracts.py::OBSERVATION_TYPES
  - simulator/battery/migrate.py::QUANTITY_ALIASES
  - simulator/battery/migrate.py::TYPE_QUANTITY
  - simulator/battery/enums.py::Quantity
  result: >-
    No exact sublimation-enthalpy quantity exists. Quantity has enthalpy of
    vaporization second-law and third-law members but no sublimation member;
    QUANTITY_ALIASES has no exact label; TYPE_QUANTITY defaults gibbs_table to
    delta_fG if the explicit descriptive label is omitted. Both table rows are
    intentionally quantity-unknown typed refusals. Existing
    kems-057-kambayashi-1985 uses sublimation_enthalpy as the same descriptive
    non-token label.
