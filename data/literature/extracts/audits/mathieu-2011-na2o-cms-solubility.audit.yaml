scope:
  target: Table 6 Na2O solubility and gamma values for unique CMS quenched glasses
  admitted_sample_rows: 24
  stored_observations: 48
  table5_printed_rows: 37
  table6_printed_rows: 33
  row_accounting: 'Table 5: 29 CMS glass rows (5 same runs as the thesis excluded), 3 NCS glass rows (outside
    CMS scope; the same runs are also in the thesis), 2 crystal rows, and 3 sodium-source glass rows. Table 6: 29
    CMS rows (24 unique plus 5 same runs excluded), 3 same-run NCS rows, and one End-member-NS2 calibration row.
    Thus the target is 24 unique CMS glasses.'
  overlap_note: The eight excluded glasses are the same runs already held by the 2009 thesis extract and stay scored there; the 2011 Eq. (9)/(15) corrected values differ from the thesis values.
  unextracted_table6_columns: NBO/T, K, and KNa are structural/basicity descriptors, not Na2O solubility/activity;
    they are outside this sodium-priority extraction.
  figure_read_candidates: Figures 7, 8, 11, and 12 show plotted solubility/activity relations. No plotted
    coordinates were digitized; Table 6 supplies the tabulated results.
