schema_and_identity:
  quantity_tokens: equilibrium_phase_composition uses simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION;
    activity_coefficient uses simulator/battery/enums.py::Quantity.ACTIVITY_COEFFICIENT.
  phase_tokens: glass is the closed token simulator/battery/migrate.py::PHASE_MAP and PhaseRole.GLASS
    is simulator/battery/enums.py::PhaseRole.GLASS.
  composition_basis: The printed wt% composition uses the closed phase basis wt_percent and canonical
    unit %; simulator/battery/enums.py::PHASE_BASIS_TOKENS includes wt_percent. These typed phase values
    remain on their printed percentage scale in simulator/battery/migrate.py::select_declared_source; the
    percent-to-fraction path is for dimensionless fraction quantities. The equivalent mol% is retained as
    a source-value string and is not stored as a converted duplicate. The table's printed gamma column is
    γ×10^6; the dimensionless coefficient is normalized by 10^-6, with the raw cell and multiplier retained.
  absolute_fO2: 2.11 × 10^-6 atm from Figure 9(b), converted to 0.21379575 Pa for identity.
  total_pressure: 'Not mapped: no total experimental pressure is printed for Figure 9(b) runs. The 1 atm
    in Figure 9(a) applies only to the Na-free reference diagram; preparation vacuum is not a run pressure.'
  reference_state: The paper reports gamma Na2O and Eq. (15), but does not separately name a reference
    state in Table 6; none is inferred. The activity-coefficient identity therefore retains the source's
    printed reference state wording as a note and may be unavailable for comparison.
  evidence_class: All 48 rows are the authors' own measurement reductions. Solubility uses the Table 5 EPMA
    result and Eq. (9); gamma uses Table 6 mol% and Table 4 source aNa2O in Eq. (15). Both are
    measured_reduced with located not_printed raw inputs because those cells are not parent observations.
  schema_gaps: []
