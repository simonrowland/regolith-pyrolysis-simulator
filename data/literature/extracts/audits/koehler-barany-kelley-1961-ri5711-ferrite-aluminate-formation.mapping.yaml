fix_pass_rendered_pages: [11, 12, 13, 16, 17, 18, 19, 20]
fix_pass_findings:
  - Table 7 CaFe2O4 from oxides is -14580 ±180 cal/mol; reaction (17) prose separately prints ±130 cal/mol.
  - Table 20 Ca2Fe2O5 ΔF° at 1200 K is -392.3 kcal/mol.
  - Table 12 has 28 rows, both 1050 K rows retained; first 950 K and 1050 K rows carry Fe2O3 markers 2 and 3; NaFeO2 melting marker is 6.
  - NBS comparison values -49.5 and +22.5 are from oxides, at PDF page 20 / published page 13; the element values cited are not printed.
  - For every printed (c,l) table, the marked melting row is crystalline and its following unmarked duplicate-temperature row plus later rows are liquid.
