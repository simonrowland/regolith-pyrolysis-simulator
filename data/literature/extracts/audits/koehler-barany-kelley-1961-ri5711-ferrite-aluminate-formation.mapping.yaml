non_table_mappings:
  - locator: {page: 13, published_page: 6, table: '2', row: 'Reaction 17'}
    stored: Prose uncertainty ±130 cal/mol for CaFe2O4 formation from oxides; differs from Table 7's ±180 cal/mol.
  - locator: {page: 16, published_page: 9, section: Table 7}
    stored: Target 298.15 K formation values, printed reactions and reference states.
  - locator: {page: 17, published_page: 10, section: Entropies and high-temperature heat contents}
    stored: Attribution for Table 8 entropy and source statement that Kelley (1960) high-temperature heat contents are not retabulated.
  - locator: {page: 20, published_page: 13, section: Discussion and conclusions}
    stored: NBS element values are cited but not printed; the authors convert them to the reported CaFe2O4 and NaFeO2 oxide-basis comparison values.
schema_gaps:
  - >-
    The calorimetric reaction-enthalpy quantity has no exact token in
    simulator/battery/enums.py::Quantity or simulator/battery/migrate.py::QUANTITY_ALIASES;
    the rows remain typed-refused with their printed reaction result.
evidence_class_decisions:
  - Table 7 authors' calorimetric formation reductions: measured_reduced, linked to the printed calorimetric reaction result.
  - Table 8 entropy: quoted_attributed to Kelley and King (1961), as cited by the authors.
  - Tables 9, 10, 12, 20, 21, and 23: measured_reduced; authors derive the series from thermochemical data and Kelley (1960) heat contents, which are not retabulated.
render_checks:
  - {pdf_page: 11, printed_page: 4, reason: 'Table 1 Ca2Fe2O5 reaction 6 measured and corrected results.'}
  - {pdf_page: 13, printed_page: 6, reason: 'Table 2 CaFe2O4 reaction 17 prose uncertainty and Table 4 NaFeO2 reaction 25 and 30 values with separate uncertainties.'}
  - {pdf_page: 16, printed_page: 9, reason: 'Target rows and all numeric cells in Tables 7 and 8; layout, signs, uncertainty marks, phase labels and units.'}
  - {pdf_page: 17, printed_page: 10, reason: 'Target rows and all numeric cells in Tables 9 and 10; layout, duplicated transition/fusion temperatures, markers, signs and columns.'}
  - {pdf_page: 18, printed_page: 11, reason: 'Target rows and all numeric cells in Table 12; layout, duplicate rows, phase-transition and fusion markers, signs and columns.'}
  - {pdf_page: 19, printed_page: 12, reason: 'Target rows and all numeric cells in Tables 20, 21, and 23; layout, markers, phase transitions, melting rows, signs and columns.'}
  - {pdf_page: 20, printed_page: 13, reason: 'NBS oxide-basis comparison values for CaFe2O4 and NaFeO2; cited NBS element values are not printed.'}
stored_conditions:
  temperature: Values use printed T_K coordinates; Table 7/8 values are at 298.15 K.
  total_pressure: Not printed; omitted, with no standard-pressure value inferred.
  fO2: Not applicable to the standard thermochemical tables and not printed.
  reaction: Printed reaction strings retained per formation quantity.
source_comparison:
  - >-
    CaFe2O4: Table 7 is -14580 cal/mol from oxides; NBS oxide-basis prior is -49.5 kcal/mol. The cited element value is not printed; Table 7 and reaction (17) prose uncertainties differ (±180 vs ±130 cal/mol).
  - >-
    NaFeO2: Table 7 is -18470 cal/mol from oxides; NBS oxide-basis prior is +22.5 kcal/mol. The cited element value is not printed; the signs disagree and units remain as printed.
  - 'Ca2Fe2O5: No other same-compound formation value is cited in the discussion.'
transitions_and_fusion:
  Ca2Fe2O5: Table 9 and Table 20 mark melting at 1750 K; no separate fusion enthalpy is printed.
  CaFe2O4: Table 10 and Table 21 mark melting at 1510 K; no separate fusion enthalpy is printed.
  NaFeO2: Tables 12 and 23 mark α→β at 870 K, β→γ at 1270 K, and melting at 1620 K; no separate transition or fusion enthalpy is printed.
incongruent_melting: No target-compound incongruent-melting statement appears in the report.
