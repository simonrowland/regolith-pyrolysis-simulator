table_mappings:
  - printed_table: '1'
    pdf_page: 4
    row_count: 19
    columns:
      - CaO composition in mol. %
      - MgO composition in mol. %
      - FeO composition in mol. %
      - Al2O3 composition in mol. %
      - TiO2 composition in mol. %
      - SiO2 composition in mol. %
      - T in K
      - Experimental approach
      - Material of cell or heater
      - Research results
      - References
    destination: existing context record shornikov_2022_table1_conditions
    value_change: none
    dashes: typed absence markers; never treated as zero
    footnotes:
      Iᵃ: vacuum furnaces according to Langmuir
      IIᵇ: effusion mass spectrometric method according to Knudsen
  - printed_table: '2'
    pdf_page: 6
    row_count: 16
    destination: typed refusal context shornikov_2022_table2_linear_reaction_constants_refusal
    value_change: none; printed linear K values are not converted to log10 K
table_tool_emit:
