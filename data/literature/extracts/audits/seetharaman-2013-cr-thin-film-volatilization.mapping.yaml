source_id: seetharaman-2013-cr-thin-film-volatilization
scope: >-
  New Seetharaman et al. 2013 extract. Prioritize measured Cr loss and whole-sample mass change, retain every printed table row, quote the prior-work CrO3 pressure estimate with attribution, and keep plotted values undigitized.
source_order:
  - MinerU table HTML and markdown
  - born-digital pdftotext-layout
  - 600 dpi PDF page render for table layout, flagged cells, prose checks, and figure legend verification
supplement: No supporting binary supplement was present.
table_audit:
  - table: I
    page: 3
    caption: Purity of the Chemicals Used, Weight Percent
    printed_body_rows: 6
    stored_body_rows: 6
    disposition: All reagent rows retained as method context, not slag measurement data.
    machine_reads: MinerU and pdftotext agree on all six purity cells, including the mixed text-and-number SiO2 purity cell.
    qa: Digit agreement 0.800; the only flagged value cell is the printed “99 (reagent grade)” SiO2 purity. Formula subscripts in row labels are not numeric data.
    render_check: 600 dpi render confirms the six row assignments, all purity cells, and the reagent-grade parenthetical.
  - table: II
    page: 3
    caption: Alumina-saturated synthetic slag, basicity CaO/SiO2 set to 1
    printed_body_rows: 1
    stored_body_rows: 1
    disposition: Starting slag composition retained as method context.
    machine_reads: MinerU and pdftotext agree on all five mass-percent cells.
    qa: Digit agreement 1.000.
    render_check: 600 dpi render confirms the header order Al2O3, CaO, SiO2, MgO, Cr2O3 and the sole body row.
  - table: III
    page: 3
    caption: Amounts of condensed phases in slag in air according to FACTSAGE
    printed_body_rows: 3
    stored_body_rows: 3
    disposition: All model-derived phase amounts retained as context; not measured Cr loss.
    machine_reads: MinerU and pdftotext agree on the nine amount cells and three temperature headers.
    qa: Digit agreement 0.833; the reported mismatch is in numeric subscripts of the CaMg2Al16O27_Solid phase label, not in a numeric amount cell. MinerU marks the empty leading header cell and formula label as nonnumeric layout cells.
    render_check: 600 dpi render confirms phase-row assignments, temperature columns, and all nine amount cells.
  - table: IV
    page: 5
    caption: WDS analysis after 24 h at 1873 K in oxygen, atomic percent
    printed_body_rows: 2
    stored_body_rows: 2
    disposition: All printed cells retained in the table transcription. The two Cr cells also have structured typed-refused observations with at.% unchanged and component_amount unavailable.
    machine_reads: MinerU and pdftotext agree on all twelve elemental cells.
    qa: Digit agreement 1.000.
    render_check: 600 dpi render confirms the Spinel and Matrix row assignments and the O, Mg, Al, Si, Ca, Cr column order.
    overlap: The exact WDS rows also appear in Albertsson (2013), Table 20; this is the same study, not independent replication.
draft_comparison:
  result_rows: 0
  disposition: >-
    The compare tool emits no point comparisons because all three structured at.% Cr observations have component_amount null under the controller's typed-refusal ruling. All printed Table I-IV cells remain in the extract context and are covered by the cell audit and independent table pins.
