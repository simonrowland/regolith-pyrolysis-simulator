docx_methods:
- locator: S1 P32
  finding: Ambient fNa and fO2 depend on bead flight path and are not known a priori.
- locator: S2 P38
  finding: Melt droplets cooled to form glass beads; no claim that volatile concentrations are preserved on quench.
- locator: S2 P51
  finding: 1640 K is model initial T0, not measured profile temperature.
- locator: S3 P69-P88
  finding: Map2Profile conversion, standards/calibration, layer averaging, and uncertainties; no re-computation performed.
- locator: S4 P92
  finding: Tables S2-S5 hold analytical data and Table S1 EMPA conditions.
audit_policy: All 71,773 numeric source cells across Tables S1-S5 were cross-read from openpyxl and direct XLSX OOXML <v>.
  The 7,777 numeric cells stored per-cell in S1-S4 have one canonical record in cells.csv with displayed value, number format,
  stored XML value, and every extract target resolved against the extract. The 63,996 S5 values are represented by 32 non-overlapping
  located ranges and row/column shapes, without per-cell values. compare.csv is a compact per-table counts/exceptions summary.
  Table layout is read from workbook sheet headers/groups. DOCX prose paragraph numbers were checked from OOXML after textutil
  export.
