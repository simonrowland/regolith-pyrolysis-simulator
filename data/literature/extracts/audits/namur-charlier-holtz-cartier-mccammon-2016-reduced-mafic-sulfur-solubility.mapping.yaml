method_and_phase_notes:
  fO2: >-
    The authors calculate fO2 using SiMet + O2 = SiO2Sil (Equation 2, PDF page
    4 / published page 105) and refer to the Appendix for details. Run-specific
    values and Si analyses are absent with Supplementary Dataset 1.
  quench: >-
    The paper describes quenched silicate melt, but does not state whether
    sulfur composition is preserved or altered on quenching. No glass result
    rows are present in the held main-text tables, so no per-run quench status
    can be attached.
  conditions: >-
    Table 1 is a starting-material table and Table 2 is a fitted-model table;
    neither contains per-run T, P, fO2, duration, capsule, or final phase
    compositions. The main-text prose ranges are not promoted to run rows.
schema_gap:
  fitted_coefficients: >-
    Table 2 coefficients are preserved as typed-unavailable context with their
    equation and printed 1σ widths. OBSERVATION_TYPES names the sulfur measured
    series but not model-fit coefficients; TYPE_QUANTITY does not infer a
    sulfur-series quantity; QUANTITY_ALIASES and Quantity have no exact SCSS
    regression-coefficient token. interaction_parameter would be a false
    interpretation. Symbols: tools/validate_literature_extracts.py::OBSERVATION_TYPES,
    simulator/battery/migrate.py::TYPE_QUANTITY,
    simulator/battery/migrate.py::QUANTITY_ALIASES,
    simulator/battery/enums.py::Quantity.
