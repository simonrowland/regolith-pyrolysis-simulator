audit_method: MinerU is machine read 1; pdftotext-layout is machine read 2; every numeric table cell and
  the row/column assignments were checked from page renders (method b). No OCR redo was needed because
  all four tables remained readable when rendered.
mineru_qa_prescreen: The QA pre-screen flagged all four tables for low digit agreement (pages 2, 7, 8,
  9; numeric agreements 0.667, 0.741, 0.653, 0.653). Each table was fully checked from its page render;
  cell-level OCR disagreements are noted in the audit CSV.
render_layout_check: Rendered table layout was checked once per table. Table 2a run columns map to fO2
  isobars -8.50 (43, 38, 41), -9.50 (35, 36, 37), and -10.00 (49, 47, 48); the MinerU merged-header candidate
  shifts run 41 to -9.50, corrected from the render. Tables 2b and 2c carry -10.50 and -11.50 respectively.
  Table 2b has 7 DB/3 and 2 PAL-685 glass analyses; Table 2c has 5 DB/3 and 4 secondary glass analyses.
