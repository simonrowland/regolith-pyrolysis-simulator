schema_gap:
  observation_types: tools/validate_literature_extracts.py::OBSERVATION_TYPES
  quantity_types: simulator/battery/migrate.py::TYPE_QUANTITY
  quantity_aliases: simulator/battery/migrate.py::QUANTITY_ALIASES
  quantity_enum: simulator/battery/enums.py::Quantity
  explanation: >-
    concentration_series and rate_series are available observation types, but no exact quantity
    token represents concentration in ppm or refractory surface-recession distance/rate in mm or
    mm/year. p_partial is not equivalent to concentration without a printed total pressure; mass_loss_rate
    is not equivalent to dimensional surface recession. Therefore these printed rows keep their
    descriptive non-token quantity labels, migrate as quantity-unknown typed refusals, and preserve
    the printed values, conditions, units, attribution, and source locators in the extract.
