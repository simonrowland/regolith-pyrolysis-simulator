source_id: gronvold-sveen-1974-magnetite-high-temperature-cp
source_read_order:
  - MinerU table HTML and markdown
  - pdftotext-layout machine text
  - Rendered PDF pages 4, 6, 7, and 13 for table layout checks and flagged cells
tables:
  - table_key: p004-t01
    printed_locator: {page: 4, published_page: 862, table: '1'}
    printed_rows: 100
    mapping: >-
      Columns 1-8 contain four paired T/Cp blocks. Series labels change within
      the printed table; table row assignments were verified against the page
      render. All 100 T/Cp pairs are stored as measured_direct with per:
      mol_species, per mole Fe3O4.
    cell_audit: >-
      The companion cells CSV preserves the MinerU table grid. All numeric
      digits agree with pdftotext-layout; page 4 render confirms paired-column
      layout, series labels, and row-to-column assignment.
  - table_key: p006-t02
    printed_locator: {page: 6, published_page: 864, table: '2'}
    printed_rows: 19
    mapping: >-
      The two four-column blocks each contain T, Cp, enthalpy increment, and
      entropy increment. The right-hand H° heading is ΔH° under the caption
      definition. All 38 temperatures are stored for each column. Cp and
      ΔH° are measured_reduced from Table 1 and documented low-temperature
      data, per mol_species; ΔH° has reference_temperature_K 298.15. The
      printed ΔS° = S°(T)−S°(298.15 K) values are retained with their exact
      symbol but schema-gapped because Quantity.S is absolute standard entropy.
    cell_audit: >-
      Three flagged temperature cells were resolved against the page 6 render:
      row 10 column 5 is 840 (omitted by pdftotext-layout), row 11 column 5 is
      860 (omitted by pdftotext-layout), and row 15 column 1 is 560 (OCR reads
      56O). The render also confirms the right-hand enthalpy heading and all
      row/column assignments. Remaining numeric digits agree with the text.
    render_verified:
      - {row: 10, column: 5, text: '840', reason: 'pdftotext-layout drops the temperature; the page 6 render reads 840.'}
      - {row: 11, column: 5, text: '860', reason: 'pdftotext-layout drops the temperature; the page 6 render reads 860.'}
      - {row: 15, column: 1, text: '560', reason: 'pdftotext-layout OCR reads 56O; the page 6 render reads 560.'}
  - table_key: p013-t04
    printed_locator: {page: 13, published_page: 871, table: '4'}
    printed_rows: 17
    mapping: >-
      The five columns are T, −log10(pH2O/pH2), −ΔrG°, Δ{G°(T)−H°(0)}, and
      −ΔfH°(Fe3O4,T→0); each data column is stored separately. The negative
      reaction Gibbs energy and gas ratio are quoted from Rau; the Gibbs
      function is measured_reduced from Table 2 and standard-state functions
      for Fe(s), H2O(g), and H2(g), assuming S°(0)=0 for each species; the
      last column is model_derived from Rau's equilibrium data and those
      functions. All four non-token columns retain typed schema gaps per the
      controller ruling. The second 790.5 K row was read from the render:
      pdftotext-layout/OCR has 190.5 there.
    cell_audit: >-
      The companion cells CSV preserves the MinerU table grid. All numeric
      digits agree with pdftotext-layout except the flagged temperature; page
      13 render confirms 790.5 and all row/column assignments.
    render_verified:
      - {row: 14, column: 1, text: '790.5', reason: 'pdftotext-layout reads 190.5; the page 13 render clearly reads 790.5.'}
context_audit:
  page_3: >-
    Sample characterization, composition, impurities, and ampoule mass are
    printed on published page 861. No calorimetry pressure is printed, so
    pressure is absent.
  page_4: >-
    The measured heat-capacity maximum is 337 J K−1 mol−1 at 848.04 K over
    1.052 K. Curie-temperature fits and transition entropy estimates are
    separately located context. No transition enthalpy is printed.
  page_7: >-
    The authors report magnetic entropy increments and the more conservative
    50.3 J K−1 mol−1 estimate; this is not presented as a transition enthalpy.
  table_3: >-
    Table 3 decomposes Cp into lattice, dilation, and magnetic components. It
    is an authors' analytical decomposition rather than experimental Cp rows
    or the requested thermodynamic-function table; those component values are
    left out of the requested extract. MinerU QA flags row 2 column 5 as 673
    while pdftotext-layout reads 613; the page 7 render confirms 673. Its
    component values are not stored.
  page_12: >-
    The authors' least-squares fit to the Table 4 enthalpy values gives a
    zero-point entropy of 4.13 J K−1 mol−1; they state verbatim that the best
    value is about 4 J K−1 mol−1.
  page_13: >-
    The following page reports Rau's results as insufficiently accurate to
    settle the question; this is not attributed to the authors' fit statement.
  figures: >-
    Figure 1 quotes graphical earlier-investigator heat capacities only; these
    are figure-read candidates and are not extracted as numeric observations.
