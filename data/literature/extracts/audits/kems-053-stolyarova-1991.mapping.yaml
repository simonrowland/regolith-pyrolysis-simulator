source_id: kems-053-stolyarova-1991
table: Ia
locator:
  pdf_page: 2
  published_page: 3711
printed_caption: 'Table Ia. The partial pressures of components (atm) over the CaO-SiO2 system at 1993 K obtained by the complete evaporation method (1) and the ion comparison method (2).'
printed_row_count: 11
stored_pressure_cell_count: 44
mapping:
  row_axis:
    printed_column: 1
    source_field: SiO2 mole fraction
    stored_field: values.points[].composition_mol
  data_columns:
    - printed_column: 2
      header: 'P_Ca · 10^7'
      printed_unit: atm
      species: Ca(g)
      method: complete evaporation (1)
      output: partial_pressure
      uncertainty_field: values.points[].sigma
    - printed_column: 3
      header: 'P_Ca · 10^7'
      printed_unit: atm
      species: Ca(g)
      method: ion comparison (2)
      output: partial_pressure
      uncertainty_field: values.points[].sigma
    - printed_column: 4
      header: 'P_CaO · 10^8'
      printed_unit: atm
      species: CaO(g)
      method: complete evaporation (1)
      output: partial_pressure
      uncertainty_field: values.points[].sigma
    - printed_column: 5
      header: 'P_CaO · 10^8'
      printed_unit: atm
      species: CaO(g)
      method: ion comparison (2)
      output: partial_pressure
      uncertainty_field: values.points[].sigma
  conditions:
    temperature: 1993 K, printed in caption
    composition: SiO2 mole fraction per row; CaO is the binary complement documented by the extract
    total_pressure: unknown; paper reports effusion under vacuum but no numeric in-cell pressure
  evidence: measured_direct
uncertainty:
  scope: per-cell for all 44 pressure cells
  printed_form: '±' width in each Table Ia pressure cell
  printed_cell_field: values.points[].P_Ca_times_10^7_atm_as_printed or values.points[].P_CaO_times_10^8_atm_as_printed
  migrator_field: values.points[].sigma
  unit: atm; sigma is the physical pressure width represented by the table header scale
  locator: PDF page 2, published page 3711, Table Ia, stored on each observation locator
  confidence_level: not stated
  unit_resolution: unit='atm' on the observation locator is read by simulator/battery/score.py::_uncertainty_unit
  field_owner: simulator/battery/migrate.py::Migrator._emit_exploded_point
  band_reader: simulator/battery/score.py::_printed_uncertainty_band
  no_uncertainty_rows: []
