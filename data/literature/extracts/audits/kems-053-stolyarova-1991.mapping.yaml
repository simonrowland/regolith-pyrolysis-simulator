table_compare:
  output: kems-053-stolyarova-1991.compare.csv
  summary: matched=0, no-match=76, locator-error=173, unverifiable=62
  table_ia_resolution: The 44 Table Ia no-match entries compare the stored physical pressure in atm with the table mantissa before its printed ×10^7 or ×10^8 scale. All 44 mantissas and ± widths agree between MinerU and pdftotext, and the rendered page confirms their row and column assignments. The source values were not re-extracted or changed.
  locator_resolution: The draft index reads the caption as 1A; the render prints Table Ia. Its Table II locator labels are also machine-index limitations. Existing Table Ib, Table IIa, Table IIb and Table III cells outside this uncertainty pass were not changed.
