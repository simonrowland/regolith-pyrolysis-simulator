  transcription_audit: 'Table 1 render checked at 600 dpi on physical PDF page 2. Table QA pre-screen: 82.9%
    numeric agreement, 48 numeric mismatches and 35 comma/dot flags; no stored cells remain unresolved.'
  composition_decode: The code gives the molar SiO2/metal-oxide molar ratio and Fe2O3 wt% added to the binary
    starting material. Nominal mole fractions are computed from one mole of metal oxide, the printed SiO2 ratio,
    and the Fe2O3 mass addition per 100 mass units of binary starting material using oxide molar masses. The
    result is normalized to mole fraction and passed through the existing composition_mol path. Numerical microprobe
    analyses are not published.
  fO2_decode: The printed −log fO2 value is retained verbatim. The identity mapper receives its signed negative
    as log10 fO2 and the existing 1 bar reference convention, which is explicitly marked unprinted. No total
    pressure is assigned.
  evidence_decision: 'Measured_reduced: the paper reports Fe3+/ΣFe from fitted Mössbauer doublet areas. The
    numeric raw spectra are not published; Figure 1 shows selected spectra only.'
  quench: All samples were quenched in either liquid nitrogen or water. The source does not state Fe redox
    preservation, so every glass row is quench_state=not_stated, located to the experimental-methods text.
  numeric_cell_audit: For each of the 34 rows, cells in columns 2, 3, and 10 are listed in the companion CSV;
    each was confirmed by render (b), physical PDF page 2. Column 1 composition labels were also checked against
    the render and decoded per the printed footnote.
  draft_compare_coordinates: The MinerU grid has two header rows, so body rows 1–34 map to grid rows 3–36.
    table_column_number 10 is the printed Fe3+/ΣFe column. These coordinates are only for the draft compare;
    row labels and the printed table number remain the source locators.
