source_id: wood-wade-2013-trace-activities
input_order:
  mineru_table: p008-t01
  pdftotext_and_mineru_markdown: pages 8-9
  render: physical PDF page 8, used to verify Table 1 row and column placement after the draft marked early body rows as headers
tables:
- printed_table: '1'
  physical_pdf_page: 8
  published_page: 918
  pdf_page_index: 7
  caption: Compositions of phases produced at 1.5 GPa/1,650 °C
  table_row_count: 21
  numeric_data_cell_count: 16
  columns:
  - printed_column: Identifier / Silicate / Metal row labels
    use: Link the table to the single run identifier BW1102; distinguish the silicate and metal phase analyses.
  - printed_column: numeric values
    use: Retain every numeric cell in wood_wade_2013_bw1102_table1_partitioning_inputs; preserve parenthetical one-standard-deviation widths where printed.
  row_mapping:
    - printed_rows: '3-8'
      printed_cells: SiO2, Al2O3, FeO, MgO, CaO, Total
      stored_as: species.PbO.context[wood_wade_2013_bw1102_table1_partitioning_inputs].values.silicate_major_oxide_cells_as_printed and silicate_major_oxide_sum
      use: analyzed silicate phase composition; unit and composition basis are absent from the table and remain unknown for engine identity.
    - printed_row: '9'
      printed_cell: gamma FeO, value 0.92, footnote a
      stored_as: species.PbO.context[wood_wade_2013_bw1102_table1_partitioning_inputs].values.gamma_FeO_as_printed
      use: calculated partitioning input, not a trace-oxide output.
    - printed_rows: '11-14'
      printed_cells: Cu, Ag, In, Pb under Trace (ppm), Silicate
      stored_as: species.PbO.context[wood_wade_2013_bw1102_table1_partitioning_inputs].values.trace_concentrations.silicate
      use: printed metal-silicate partitioning inputs.
    - printed_row: '16'
      printed_cell: Fe 99.7 (0.7), Metal
      stored_as: species.PbO.context[wood_wade_2013_bw1102_table1_partitioning_inputs].values.trace_concentrations.metal.Fe
      use: retain the printed cell; its unit is not stated.
    - printed_rows: '18-21'
      printed_cells: Cu, Ag, In, Pb under Trace (ppm), Metal
      stored_as: species.PbO.context[wood_wade_2013_bw1102_table1_partitioning_inputs].values.trace_concentrations.metal
      use: printed metal-silicate partitioning inputs.
  non_target_rows:
  - row: 10
    label: Trace (ppm)
    treatment: section label, not a numeric cell
  - row: 15
    label: Metal
    treatment: phase label, not a numeric cell
  - row: 17
    label: Trace (ppm)
    treatment: section label, not a numeric cell
