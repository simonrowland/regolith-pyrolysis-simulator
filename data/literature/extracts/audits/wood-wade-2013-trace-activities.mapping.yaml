additional_exclusions:
- No activity value is numerically printed; do not calculate activity from the reported coefficients.
- The liquid-Fe activity coefficients for Pb, Cu and In are partitioning inputs, not silicate-melt activity-coefficient rows.
- Table 1 has no printed row for an Ag melt activity coefficient.
- Table 1 major-oxide units and composition basis are not printed; do not assume wt% or convert the values to an engine composition.
