context_audit:
  page_7: Abstract formation values, 298.15 K reference, and 298–1263 K range are retained. Render checked.
  page_9: Sample composition, theoretical composition, impurities, HF solution mass/concentration, dichromate mass,
    silica stoichiometry, and the 25°C/73.7°C solution-calorimetry process are transcribed. Analysis and methods
    layout checked against render.
  page_10: The Table 1 footnote states reactants at 25°C and products at 73.7°C for reactions (1)–(6); these are
    preserved as two process temperatures rather than collapsed to a single T condition.
  page_11: The prose repeats the overall reaction heat as 13.009 ±0.044 kcal, while Table 1 gives 13.005 ±0.044
    kcal. Both prose values are render-verified and retained; compare reports the prose value outside table cells.
  page_13: Table 4 lists auxiliary data sources but no numerical values; input numbers used in Tables 5 and 6 are
    not reproduced.
  page_15: Discussion identifies 1263 K as reported acmite melting point; no fusion enthalpy or liquid acmite values
    are printed.
lineage_and_schema:
- Table 1 reaction means link to Table 2 mean values; reaction (7) links to reactions (1)–(6).
- Table 3 element-frame reaction (14) links to reaction (7) and literature reactions (8)–(12). The formation-from-oxides
  reaction (15) links to reaction (7) and reactions (10)–(13).
- Tables 5–6 Cp, S, −(G−H298)/T, and H−H298 are quoted from Ko et al. (1977). The authors' calculated formation
  and log K rows link to the stored formation/thermal inputs and declare the additional numerical Table 4 inputs
  not printed.
- 'Reaction heats and oxide-frame formation values are typed-refused: simulator/battery/enums.py::Quantity, simulator/battery/migrate.py::QUANTITY_ALIASES
  and ::TYPE_QUANTITY, and tools/validate_literature_extracts.py::OBSERVATION_TYPES have no exact reaction-heat
  type/token; Quantity.DELTA_FH/DELTA_FG are elements-frame only.'
figure_reads: No figure-only values extracted; none identified as a data candidate.
