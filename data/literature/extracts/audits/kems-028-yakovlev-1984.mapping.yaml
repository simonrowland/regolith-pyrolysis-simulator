schema_gaps:
  - observation_ids:
      - yakovlev_1984_CAI_Al_suboxide_fraction
      - yakovlev_1984_CAI_Al2O_in_suboxide_fraction
    printed_quantity: ratio of combined AlO and Al2O partial pressures to total aluminium pressure
    quantity_label: Al_suboxide_pressure_fraction
    reason: No closed quantity token represents this gas-pressure ratio. Keep the descriptive quantity label so the migrator returns quantity unknown.
    code_review:
      - simulator/battery/enums.py::Quantity has p_partial, equilibrium_phase_composition and distribution_ratio but no gas partial-pressure fraction quantity.
      - simulator/battery/migrate.py::QUANTITY_ALIASES has no exact alias; simulator/battery/migrate.py::TYPE_QUANTITY maps psat_series to p_sat, so the explicit descriptive label prevents that non-exact fallback.
      - simulator/battery/enums.py::PHASE_BASIS_TOKENS and simulator/battery/enums.py::PhaseRole cover phase-composition basis and melt/glass roles, not a ratio among gas partial pressures.
      - tools/validate_literature_extracts.py::OBSERVATION_TYPES admits equilibrium_phase_composition; data/literature/extracts/park-2021-vanadium-thermodynamics-thesis.yaml uses it for composition within a phase, not this gas-pressure ratio.
    migrated_status: Both values remain quantity-unknown and are refused; no nearby token is substituted.
