  - species: NaO0.5
    observation_id: oneill_2005_fig1_sodium_exchange_figure_only
    field: caption
    value: >-
      FIGURE 1. Sodium exchange among compositions from a conventional
      wire-loop experiment (B26/3/02) on the join ADeu–Na2SiO3, run at 1400
      ºC, fO2 = 10–12 bars, 118 hours. Compositions are the means of six
      analyses, error bars are ±2σ, and SiO2 is plotted renormalized to an
      Na-free basis ([SiO2]º). The intended compositions would fall on the
      dashed curve. Final compositions show both Na gain (the two samples
      lowest in SiO2) and Na loss. The remarkably regular correlation between
      final [NaO0.5] and [SiO2]º is explained by assuming constant aNaO0.5
      among the samples, with the correlation caused by decreasing γNaO0.5
      with increasing SiO2.
    locator: {page: 2, published_page: 498, pdf_page_index: 1, figure: '1'}
