  - species: NaO0.5
    observation_id: oneill_2005_fig2_measured_solubility_figure_only
    field: caption
    value: >-
      FIGURE 2. Solubility of NaO0.5 in AD6 compositions relative to that in
      the ADeu “reference” composition. The experiment with the highest
      NaO0.5 was produced with pure Na2SiO3 in the reservoir at fO2 = 10−6.7
      bars; most other runs were done in air. Solid curves are best fits for
      AD + Qz and AD + Wo compositions to Equation 5, omitting the highest
      Na datum. The dashed curves are from Equation 6, and include the
      highest Na datum.
    locator: {page: 3, published_page: 499, pdf_page_index: 2, figure: '2'}
  - species: NaO0.5
    observation_id: oneill_2005_fig3_measured_solubility_figure_only
    field: caption
    value: >-
      FIGURE 3. The effect of AlO1.5 on the solubility of NaO0.5 in
      compositions on the join Di-Cor. The transition from melts with molar
      Na/Al < 1 (peraluminous) to Na/Al > 1 (peralkaline) is indicated by
      the dashed curve. There appears to be no effect on the solubility of
      NaO0.5 on crossing this compositional threshold. Two compositions
      from B18/6/03 were lost.
    locator: {page: 4, published_page: 500, pdf_page_index: 3, figure: '3'}
