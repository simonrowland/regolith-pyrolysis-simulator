schema_version: literature_extract.v1
source_id: shornikov-1994-mullite-kems
source:
  citation: "Shornikov, S. I., Stolyarova, V. L., and Shultz, M. M. (1994). High Temperature Mass Spectrometric Study of 3Al2O3·2SiO2. Rapid Communications in Mass Spectrometry, 8, 478–480."
  year: 1994
extraction:
  method: "Manual transcription from the owner-supplied PDF text layer, with printed table values and locators retained; no figure values digitized."
  date: 2026-09-30
  worker: codex
review_status: draft
provenance:
  canonical_source: "Rapid Communications in Mass Spectrometry 8 (1994), 478–480; this is the canonical extract."
  related_doklady_paper: "Shul'ts, Shornikov, and Stolyarova, Doklady Physical Chemistry 336 (1994), 95–98."
  overlap: "Doklady Table 2 on translated p.96 (PDF page index 1) repeats the Rapid Communications Table 2 Al, AlO, Al2O, and AlSiO rows. The Al value at 1833 K is rounded there to 0.36 ± 0.02 versus 0.355 ± 0.018 here; the other row cells are repeated. Doklady labels its Al2O scale as ×10^9 while this canonical paper visibly prints p_Al2O · 10^-8; retain this paper's label and values, do not merge or silently rescale."
  sample_composition: "The paper identifies the sample as mullite, 3Al2O3·2SiO2. Table 2 and Table 6 report no row-specific mole fraction or weight percent."
  sample_phase: "The paper does not label the sample solid or liquid. It states an incongruent melting point of 2163 ± 4 K; all Table 2 and Table 6 temperatures are below that value."
  cell_and_orifice: "The paper prints a molybdenum Knudsen effusion cell and a vaporization-to-effusion-orifice ratio of 400:1; no separate orifice material is stated."
  table_6_derivation: "Equations (12)–(13), p.480 (PDF page index 2), calculate the Table 6 activities from vapor pressures over mullite and pure-oxide reference pressures. p_O over mullite is author-calculated from vapor-phase equilibria; p_SiO and Al-bearing Table 2 pressures are measured by ion-current comparison. Pure-oxide reference pressures are not printed as Table 2 pressure cells."
