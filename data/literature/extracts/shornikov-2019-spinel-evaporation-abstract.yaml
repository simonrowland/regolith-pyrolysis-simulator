source:
  citation: >-
    Shornikov, S. I., and Yakovlev, O. I. (2019), "Thermodynamic study of
    spinel evaporation by Knudsen effusion mass spectrometry," 50th Lunar
    and Planetary Science Conference, LPI Contrib. No. 2132, abstract 1722.
  year: 2019
  corpus_asset: raw/shornikov-2019-spinel-evaporation-abstract/shornikov-2019-spinel-evaporation-abstract.pdf
  corpus_sha256: 5bb613a34c809008b1286b6d8b75162863650b2b781a79bd8cb4c1cd7d08fb48
extraction:
  method: >-
    Figure 5 on PDF page 2 was read from a 600 dpi render. Both axes are
    linear. Calibration uses labelled tick lines only. Series 1, the black
    filled circles for MgO–Al2O3 at 2200 K, was segmented by colour and the
    connecting stroke was removed with a 10 px erosion. That erosion merges
    the two circles near 50 mol % Al2O3, so each of those was fitted on its
    own exposed arc. The merged midpoint is not stored. Series 2 and 3 are
    cited from references [8] and [9] and were not read. The series numerals
    and the dotted heterogeneous-area guides were not read. Thermo numbers
    and Figs. 2–4 repeat the full papers and were not copied. The mixing
    energy is derived from KEMS activities. The figure read itself is
    figure_only. It stays context because Quantity has no mixing-energy token.
  date: '2026-10-20'
  worker: t1372-w2-w10-t1
review_status: draft
corrections: []
scope_assessment:
  document_type: 2-page LPSC abstract (spinel Knudsen evaporation)
  scored_observations: 0
  note: >-
    Series 1 of Fig. 5, fifteen MgO–Al2O3 mixing-energy markers at 2200 K,
    is the only numeric read. It is context, not a scored observation.
    Series 2 and 3
    are cited and were not read. The same PDF's enthalpy, entropy, and
    melting values are already in shornikov-2017-spinel-thermodynamics.
