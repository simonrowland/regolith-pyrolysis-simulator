extraction:
  method: >-
    Official IRSM CAS Ceramics-Silikaty archive PDF (HTTP 200 application/pdf,
    1315009 B). Scanned Acrobat Image Conversion 2024-07-02. pdftotext -layout
    is a noisy OCR layer and was not used as data. Table I transcribed from a
    400 dpi pdftoppm render of PDF page 4 (published p. 292). Figs 1–6 listed
    figure-only; Clausius–Clapeyron and P(T) grids were not digitised.
    Second-law Table I enthalpies and averaged log P equations (2)–(3) labelled
    model (kems-036 / MODEL RULE). Appearance potentials and apparatus facts
    are instrument/method, not Psat series. Missing cells left absent, never 0.
    No unit conversion. No MinerU. DOI none: doi.org 404 on guessed 10.13168/cs.1975.* stems.
