schema_version: literature_extract.v1
source_id: lpi-compendium-12022
source:
  citation: >-
    Meyer, C. (2005). Lunar Sample Compendium: 12022 (Ilmenite Basalt).
    Lunar and Planetary Institute. Footer on every page: "C Meyer 2005".
    The first page is marked DRAFT. 9 pages. Sample mass printed as 1864.3 grams.
  year: 2005
  url: https://www.lpi.usra.edu/lunar/samples/atlas/compendium/12022.pdf
  corpus_asset: raw/lpi-compendium-12022/lpi-compendium-12022.pdf
  corpus_sha256: d5ff753e28defbaf0eda04a3c5aebed994da3c45aa00842f09dbda390788ba07
extraction:
  method: >-
    Manual transcription from the 9-page compendium PDF. Pages were rendered
    at 200 dpi. Tables 1a and 1b were read cell-by-cell from the page-4 and
    page-5 images and checked against pdftotext -layout. Blank cells are
    omitted, not filled with zero. Technique letters are stored beside the
    values they mark. The mineralogical mode on page 2 and the printed age,
    C/S/N, and An range are retained as context. Figures 4–8 (plotted
    compilations) are figure-only and were not digitised. Photographs
    (Figs. 1–3, 9–13) are not treated as data figures. This file is a
    secondary compilation of published analyses of Apollo 12 sample 12022,
    not a primary vaporization experiment. Distinct from
    smales-1971-lpsc-12022 (a 1971 conference abstract, not this compendium)
    and from other lpi-compendium-<sample> extracts already on green.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/lpi-compendium-12022/
review_status: draft
