source_id: stolyarova-1995-cao-alumina-kems
source:
  citation: >-
    Stolyarova, V. L., Shornikov, S. I. and Shultz, M. M. (1995),
    "High-temperature Mass Spectrometric Study of the Thermodynamic Properties
    of the CaO–Al2O3 System."
  year: 1995
extraction:
  method: >-
    MinerU VLM OCR transcription checked against the scanned page images. Table 1
    verification: the present-study cell-material cell was checked (1 checked,
    0 corrected). Table 2 verification: all 54 pressure cells (50 numeric, 4
    em dashes) and all 9 CaO mole-fraction cells were checked (0 corrected).
    Table 2 prints positive scale headings p_Ca × 10^9, p_Al × 10^9,
    p_AlO × 10^10, p_O × 10^9 and p_O2 × 10^11, with pressure in atm;
    pressure_atm is declared as the printed coefficient multiplied by 10^-n atm.
    The four printed em dashes (p_Ca at x_CaO=0.000; p_Al, p_AlO, and p_O
    using Eqn 2 at x_CaO=1.000) remain absent, never zero. Tables 3–5 report
    thermodynamic quantities rather than partial pressures and are outside this
    pressure extraction. Figures 1–4 are retained as figure-only placeholders;
    no figure values were digitized.
  date: '2026-09-30'
  worker: codex
  provenance_path: raw/stolyarova-1995-cao-alumina-kems/ocr-mineru/full/vlm/stolyarova-1995-cao-alumina-kems.md
