        values:
          quantity: equilibrium_phase_composition
          method_class: model_derived
          admission_status: figure_only
          caption: >-
            Figure 3. Isobaric Si-O phase diagrams at elevated pressure predicted
            by the HSC- and SiO(l)-vWRK parameterizations. Phase relations
            predicted by the CSRK are similar but shifted to lower temperature.
            The vaporous geometry is defined by the SiO-rich azeotrope that
            forms as a consequence of the stability of molecular SiO in the
            vapor at X_O ~ 0.5 and the SiO2-rich negative azeotrope at X_O ~ 0.3.
            At 10-100 MPa, the vaporous is continuous from Si to compositions at
            which supercritical O-rich fluids (F4) are stable. The SiO2-rich
            negative azeotrope (L2 = V) lies to the Si-rich side of the SiO2
            composition. The SiO(l) parameterization predicts stability of an
            SiO-rich liquid (L2). At 10 MPa (Figure 3d) the invariant reactions
            involving this liquid, with increasing temperature, are L1 + L2 =
            L1' (O-rich Si-liquid), L2 + L3 = V, and L2 = L1 + V. The L1 + L1'
            and L1' + L2 fields at approximately 3100-3200 K are not labeled. At
            100 MPa (Figure 3e) the reactions are L2 = V and L2 = L1 + V. The
            critical point for the SiO2-rich azeotropic boiling curve occurs at
            pressures between 100 MPa (Figures 3b and 3d) and 1 GPa (Figures 3c
            and 3f; Table 3). The Shornikov and Low-c parameterization phase
            relations are similar to the HSC result.
