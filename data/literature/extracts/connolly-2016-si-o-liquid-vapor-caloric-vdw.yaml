          caption: >-
            Figure 4. Entropy-temperature and density-temperature azeotropic
            boiling envelopes for SiO2-rich fluid predicted by the various vWRK
            and CSRK parameterizations. The small filled circles indicate the
            vWRK critical point predictions obtained by using the geometric
            rather than the harmonic mean mixing rule. Previous predictions
            indicated by crosses (critical and/or boiling points; Table 3)
            and/or thin dashed curves. The open squares indicate s-T coordinates
            of shock and release experiments by Kraus et al. [2012] (cyan) and
            Boslough [1988] (red and blue as reinterpreted by Kraus et al.).
            Kraus et al. interpret the trend of rising temperature with entropy
            in their high entropy (>5000 J/K-kg) experiments to indicate
            conditions on the vapor-rich side of the boiling envelope, in which
            case the recorded temperature would likely be that of the compressed
            supercritical fluid. This interpretation implies that the high
            entropy experiments provide an upper bound on the critical
            temperature; the CSRK predictions are consistent with this
            interpretation. The green x symbols locate rho-T coordinates
            obtained by extrapolating the isochores for SiO2 obtained by
            molecular dynamics simulations to zero pressure [Karki et al., 2007;
            Iosilevskiy et al., 2014], given that the relatively low pressures
            of interest these coordinates should approximate the liquid density
            along the boiling curve. The magenta x symbol locates the rho-T
            critical coordinate assumed for fitting the MANEOS [Melosh, 2007].
