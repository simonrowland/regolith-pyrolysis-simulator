          admission_status: figure_only
          caption: >-
            Figure 1. Critical and boiling points predicted by the melting point
            parameterizations of the vW EoS for Hg, Rb, and hypothetical
            monospecies SiO2 and Si fluids. The experimentally constrained
            boiling curves for Hg [Huber et al., 2006] and Rb [Dillon et al.,
            1966; Pfeifer et al., 1979] and “ideal” boiling curves are shown for
            comparison. The ideal curves are computed assuming that the volume
            of the liquid is insignificant, the ideal gas law for the vapor,
            and the calorimetric data in Table A1. The ideal model should
            underestimate the Clapeyron slope of the boiling curve and therefore
            provide an upper bound on boiling curve temperature as illustrated
            by the curves for Rb and Hg, which also show that the ideal model
            provides a good approximation to the real boiling curves. The
            critical point predictions of the regularized vW EoS are consistent
            with the trends indicated by the ideal models, whereas the
            unregularized vW EoS predictions are scattered and, in the case of
            SiO2, lie consistently on the high-temperature side of the ideal
            boiling curve.
