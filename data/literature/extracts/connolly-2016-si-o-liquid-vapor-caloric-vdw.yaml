          admission_status: figure_only
          caption: >-
            Figure 5. The SiO2-rich azeotropic boiling curves and corresponding
            fluid speciation predicted by various vW parameterizations. The
            small filled circles indicate the vWRK critical point predictions
            obtained by using the geometric mean mixing rule rather than the
            harmonic mean. Previous predictions are indicated by crosses
            (critical and/or boiling points) and/or thin dashed curves. In
            Figure 5b the solid and dashed curves indicate, respectively,
            liquid and vapor speciation; the fine dashed line patterns near the
            critical temperature indicate where results have been extrapolated.
            The estimated boiling curve (dashed green) of Schick [1960], used
            by Melosh [2007] to locate the MANEOS critical point (magenta x
            symbol), neglects the liquid volume and speciation, the liquid is
            assumed to be pure SiO2, and the gas is assumed to be ideal and
            consist of 67 mol% SiO + 33 mol% O2. The ideal + vWRK SiO2(l)
            boiling curve is computed from the HSC parameterization, assuming a
            pure SiO2 vWRK liquid in equilibrium with an ideal multispecies
            vapor. The ideal + high-c curve assumes a constant-volume, high heat
            capacity (5nR) model for the liquid, and ideal (HSC) multispecies
            vapor. This curve illustrates the effect that the anomalously high
            heat capacities reported by Karki et al. [2007] would have on the
            vW EoS predictions of the boiling-curve trajectory.
