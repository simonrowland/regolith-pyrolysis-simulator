extraction:
  method: >-
    Minimal extract from the born-digital pdftotext-layout.txt. The paper reports
    model results rather than original Si-O measurements. Two quoted SiO2(l)
    properties from Kraus et al. (2012) are retained as quoted_attributed rows;
    the Kraus shock-derived estimate row is retained as unscored context because
    its specific-entropy and critical-point quantities do not fit a store token.
    Figures 1-7 are recorded without numeric points. The table parser accepts
    MinerU HTML, which is absent for this born-digital source; the cited cells
    were transcribed from the text and checked against 600 dpi renders of PDF
    pages 13 and 24.
    The following quoted values remain explicitly parked, not scored: Table A2
    Schnurre 174.02/79.01, Hudon 173.11/85.77, Holland and Powell 173.28/82.50,
    and Ghiorso 184.15/82.6; the Si(l) block at Tm 1,687 K (gm -68,583,
    sm 91.92, vm 10.92 ± 0.34, cm 27.20); the Jackson (1976) Clapeyron slope
    ±0.1 K/MPa; and Table 3 footnote d corrected vapor entropy 7,477 ± 12 J/K-kg.
