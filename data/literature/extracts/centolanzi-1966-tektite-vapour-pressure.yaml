  document_type: experimental tektite-glass vapor-pressure study using furnace vaporization and arc-jet ablation
  typed_observations: 8
  context_records: 13
  vapor_species_as_printed: not stated; the reported tektite vapor pressure is not assigned to Na, K, or a gas molecule
