  carrier_gas_and_atmosphere: furnace atmosphere is argon at variable pressure; arc-jet gas composition is not stated
  standard_state: no thermodynamic standard-state statement is printed
  scope_gaps:
    - No Na or K vapor species, partial pressures, equilibrium constants, ion intensities, or activities are printed.
    - Figure-only series points were not digitized; see the audit for candidates.
