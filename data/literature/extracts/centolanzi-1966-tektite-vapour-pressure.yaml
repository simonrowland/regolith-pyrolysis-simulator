  method: >-
    Transcribed from the MinerU machine text and pdftotext-layout.txt, in that order.
    The content lists contain no printed tables; their <details> chart tables are
    generated readings and were ignored. The explicit Figure 7 rate labels, fit
    equations, and boiling caption/prose values were checked against rendered PDF
    pages. Figure-encoded points without printed numeric labels remain undigitised.
