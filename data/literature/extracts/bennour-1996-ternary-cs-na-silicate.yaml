schema_version: literature_extract.v1
source_id: bennour-1996-ternary-cs-na-silicate
source:
  citation: Bennour F., Chastel R., Mathieu J.-C., Coutures J.-P., and Bergman C. (1996). Determination of the Excess Thermodynamic
    Functions in Ternary Cs2O–SiO2–Na2O Melts by Knudsen Effusion Mass Spectrometry. Physics and Chemistry of Liquids33(4):229–248.
  doi: 10.1080/00319109608039824
  url: https://web.archive.org/web/20250623030342id_/http://electronicsandbooks.com/edt/manual/Magazine/P/Physics%20and%20Chemistry%20of%20Liquids/1996%20Volume%2033/4/229-248.pdf
  year: 1996
  version: published original 20-page article plus publisher cover; 21 PDF pages
extraction:
  method: Manual transcription from rendered source PDF pages cross-checked against pdftotext -layout. Tables I–IV and all
    three unnumbered data tables were retained with printed versus derived status; Figure 7 Cs2O activities were digitized
    from the calibrated linear axes and carry read uncertainty. Table I values are measured; Tables II–IV and the unnumbered
    calculations retain model/derived status.
  date: '2026-11-10'
  worker: codex-resume-22915-1791907429
  note: >-
    Published p. 238 states: Our results on the mixing of ((1 - X1 - X2) SiO2, X2Cs2O, X3Na2O) are calculated by assuming
    the second reference state that means that the oxide activities are related to the square of the ionic intensities.
    Figure 7 uses the silicate dimer end member for each section; its closed reference-state convention remains unknown.
    The figure-only total x(Cs2O)=0.015 point on XSiO2=0.85 is retained as digitized, while Table I starts at 0.045.
    Temperature conversion to T_C uses T_C = T_K - 273.15; printed 1573 K is retained. Table I and Figure 7 composition
    coordinates use the printed quasi-binary path relation, with derivation noted.
review_status: draft
