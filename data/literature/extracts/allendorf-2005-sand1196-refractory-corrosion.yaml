source:
  citation: >-
    Allendorf, M. D. et al. (2005). Development of Models and Online Diagnostic Monitors of the
    High-Temperature Corrosion of Refractory Oxides. Sandia Report SAND2005-1196.
  year: 2005
  doi: 10.2172/922757
review_status: draft
extraction:
  method: >-
    Machine-text transcription from the report's MinerU table blocks and pdftotext-layout text.
    Table 5-1 row and column placement, the 221 cell, plusminus marks, and cited prose observations
    were checked against page renders. Measurements and their printed units are preserved. Where
    the closed quantity vocabulary has no concentration or refractory-recession token, the printed
    measurements are retained in typed-refused observations and are unavailable after migration.
  date: '2026-11-02'
  worker: w1103cw1-al05
  note: >-
    This extract contains 20 printed measured points: ten available numerical cells in the six-row
    Table 5-1, three Faber and Beerkens NaOH concentration ranges, the Walsh-reported NaOH value,
    one Monofrax test concentration, two reported refractory recession distances, two reported
    recession rates, and a later Buckley-reported NaOH concentration. Table 5-1's two n.a. cells
    are retained in printed_table_rows below, never as zero. No condition is supplied unless printed
    for that observation. Measured activity curves and figure-only corrosion series are listed in
    the companion audit and are not digitized.
  printed_table_row_count: 6
  printed_table_rows:
    - row: 1
      port: Right side midtank port
      extraction_sample_na_ppm: '185'
      naoh_elif_ppm: '125'
    - row: 2
      port: Right side exhaust port
      extraction_sample_na_ppm: '202'
      naoh_elif_ppm: '117'
    - row: 3
      port: Right side uptank port
      extraction_sample_na_ppm: '158'
      naoh_elif_ppm: '143'
    - row: 4
      port: Fill end
      extraction_sample_na_ppm: n.a.
      naoh_elif_ppm: '90'
    - row: 5
      port: Left side downtank port
      extraction_sample_na_ppm: '221'
      naoh_elif_ppm: '31'
    - row: 6
      port: Left side refiner-entrance
      extraction_sample_na_ppm: '17'
      naoh_elif_ppm: n.a.
