laboratory_parameters:
  sample_collection:
    value:
      surface_material_depth_as_printed: '<1 mm'
      skim_max_penetration_estimated: 5 mm
      scoop_penetration_estimated: 3 cm
      nearby_drive_tube_penetration_estimated: 27 cm
      core_material_total_length_returned_excluding_cs_vc: about 480 cm
    locator: *surface_sampling
    note: Depths are collection descriptions and estimates, not inferred sample dimensions.
  contact_soil_sampling_device:
    value:
      box_dimensions_cm_as_printed: '12 x 10 x 2.5'
      collector_plate_material: aluminum
      collector_plate_cover: nylon fabrics, one beta-cloth-like
      applied_load: own weight only, ideally
      collected_layer_thickness_as_printed: about 100 microns
      sealing: containers carefully sealed before and after deployment
    locator:
      source_path: /Users/simonrowland/Repos/regolith-corpus/raw/jsc-a16-special-samples/jsc-a16-special-samples.pdf
      pdf_page_index: 46
      figure: '1'
  core_sample_vacuum_container:
    value:
      container: vacuum-sealed Core Sample Vacuum Container (CSVC)
      drive_tube_caps: two teflon caps
      seal: stainless-steel knife-edge screwed into an indium seal
      storage_vacuum_as_printed: about 10^-4 torr
      placement: drive-tube sample inserted immediately after extraction
      receiving_atmosphere: sterile nitrogen atmosphere on LRL opening
      additional_containment: two vacuum seals
    locator:
      source_path: /Users/simonrowland/Repos/regolith-corpus/raw/jsc-a16-special-samples/jsc-a16-special-samples.pdf
      pdf_page_index: 53
      section: 'Figure 38 caption and A.3 Core Sample Vacuum Container'
    note: This is a storage/contamination-control condition, not a vaporization-run pressure.
  core_tube_geometry:
    value:
      internal_diameter_cm_as_printed: 4.13
      area: not computed
    locator: *table1
    note: The report prints the internal diameter in a Table I footnote; no area is inferred.
  absent_parameters:
    - thermal treatment or vaporization run
    - furnace or heated cell
    - crucible or container material for a thermal experiment
    - effusion orifice geometry and exposed thermal area
    - pumping mechanism and pumping speed
    - run pressure history distinct from CSVC storage vacuum
    - gas identity and pressure during a run
    - temperature measurement, calibration and uncertainty
    - fO2 control
    - chemical composition analysis
    - BET surface area
