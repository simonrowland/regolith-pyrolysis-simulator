fidelity_samples:
  - path: species.regolith.observations[jsc_a16_special_samples_document_scope].values.quantity
    value: sample_provenance_and_characterization
    note: source-scope fidelity pin
    locator: *introduction
species:
  regolith:
    observations:
    - observation_id: jsc_a16_special_samples_document_scope
      type: rate_series
      locator: *introduction
      quote: 'The purpose of this report is to give the individual investigator documentary background information about these samples.'
      units: as printed in the source
      regime: sample_provenance_and_characterization
      values:
        quantity: sample_provenance_and_characterization
        method_class: measured_tabulated
        evidence_class: measured_tabulated
        data_scope: sample collection, returned-core mass/geometry/density/recovery, and x-radiographic stratigraphy
        vaporization_results: not_present
        chemical_composition: not_present
    - observation_id: jsc_a16_table_I_returned_core_characterization
      type: rate_series
      locator: *table1
      units: as printed in Table I
      regime: returned_core_characterization
      values:
        quantity: returned_core_characterization
        method_class: measured_tabulated
        evidence_class: measured_tabulated
        rows: *table1_rows
        uncertainty_policy: printed +/- values and ranges retained; unprinted cells omitted
    - observation_id: jsc_a16_xradiographic_grain_size_characterization
      type: rate_series
      locator: *core_log_60009_10
      units: as printed in core logs
      regime: x_radiographic_core_log
      values:
        quantity: grain_size_and_stratigraphy
        method_class: measured_direct
        evidence_class: measured_direct
        drive_tube_60009_60010: *grain_60009_10
        drive_tube_60013_60014: *grain_60013_14
        uncertainty_note: x-radiographic grain-size distribution, sorting and density are not unambiguous
