schema_version: literature_extract.v1
source_id: yakovlev-2024-cai-vaporization
source:
  citation: Yakovlev, O.I. & Shornikov, S.I. (2024), Evaporation features of the outer zones of Ca-Al-inclusions
    of chondrites, Experiment in Geosciences, 30(1), 30-32.
  year: 2024
extraction:
  method: Digitized every data marker in Figs. 2-3 from 600 dpi PDF-page renders. Axes were calibrated from printed
    ticks; each marker has a visual centre read and a second visual centre from a fresh 1200 dpi crop at a different offset, converted through the same tick fit. Log ordinates are preserved
    in each point note and in the figure audit; the controller-ruled linear p_partial and activity value is stored
    once. MinerU details chart tables are generated reconstructions and were not transcribed as printed tables.
  date: '2026-10-18'
  worker: crown2-1018
  provenance_path: raw/yakovlev-2024-cai-vaporization/yakovlev-2024-cai-vaporization.pdf
  printed_text_values:
  - id: akermanite_profile_allende_5241
    attribution: Kerekgyarto et al. (2016), as cited by Yakovlev and Shornikov (2024)
    source_as_printed: As follows from Fig. 1, the akermanite content in the core zone of the inclusion is approximately
      50 wt. %, the akermanite content drops to 20 wt. % in the mantle melilite zone, and up to 7 wt. % in the rim
      zone.
    values:
      core_akermanite_wt_pct: 50.0
      mantle_akermanite_wt_pct: 20.0
      rim_akermanite_wt_pct: 7.0
    locator:
      published_page: 31
      pdf_page_index: 2
      paragraph: Fig. 1 discussion
  - id: magnesium_disappearance_abstract
    attribution: Yakovlev and Shornikov (2024), this work
    source_as_printed: complete disappearance of magnesium components is observed at temperatures above 2200 K,
      while the silicon components remain in the CAIs melt
    values:
      threshold_T_K: 2200.0
      comparison: above
      silicon_components_remain: true
    locator:
      published_page: 30
      pdf_page_index: 1
      section: Abstract
  - id: magnesium_disappearance_conclusion
    attribution: Yakovlev and Shornikov (2024), this work
    source_as_printed: when CAIs type B evaporates at temperatures above 2200 K, a complete disappearance of magnesium
      is observed while the silicon component remains in the melt
    values:
      threshold_T_K: 2200.0
      comparison: above
      silicon_component_remains: true
    locator:
      published_page: 32
      pdf_page_index: 3
      section: Conclusions
  schema_gaps:
  - figure: 3B
    quantity: activity ratios
    status: typed_unavailable
    reason: No general activity-ratio quantity token exists; marker coordinates and reads are retained in the audit
      without assigning a false activity quantity.
  - text_value: akermanite wt% profile by CAI zone
    status: typed_unavailable
    reason: No current quantity token represents this cited mineral-profile quantity; exact values and attribution
      are retained in printed_text_values.
  - quantity: pure-compound reference activities
    source_as_printed: >-
      The oxide activities in melts of the «pure» compounds were taken from data obtained in (Shornikov et al.,
      1996; Bale et al., 2016; Shornikov, 2017).
    status: typed_unavailable
    reason: cited collectively; values and per-activity mapping not printed in this paper
