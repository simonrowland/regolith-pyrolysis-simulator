              state:
                tag: unknown
                reason: only Al2O3 mol% printed on the figure x-axis; full residual composition not given
              locator:
                figure: '2'
                panel: B
                published_page: 31
                pdf_page_index: 2
                note: Al2O3 = 17.46 mol% on figure x-axis; no complete residual composition map is given.
