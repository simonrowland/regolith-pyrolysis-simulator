- experiment_id: cai-type-b-evaporation
  bench_id: yakovlev-2024-knudsen-ms
  method: knudsen_effusion
  locator:
    published_page: 31
    pdf_page_index: 2
    figure: '2'
    note: CAI type B melt and residual-melt observations.
  sample:
    name_as_printed: CAI type B
    printed_composition:
      state:
        tag: unknown
        reason: CAI type B named; only a qualitative mineral profile and quoted akermanite fractions printed; no initial oxide map
      locator:
        published_page: 30
        pdf_page_index: 1
        note: The paper names a CAI type B sample but does not print a complete initial-melt oxide composition map.
    characterization:
      state:
        tag: value
        value: >-
          Quoted mineral profile in Yakovlev and Shornikov (2024, p. 31): “an external monomineral rim
          consisting of melilite rich in gehlenite”; the paper says the “typical profile of akermanite and
          δ25Mg between the core and rim zones in CAI of subtype B1 (Allende 5241)” is from Kerekgyarto et
          al. (2016). Their quoted values are: “the akermanite content in the core zone of the inclusion is
          approximately 50 wt. %, the akermanite content drops to 20 wt. % in the mantle melilite zone, and
          up to 7 wt. % in the rim zone.” Yakovlev and Shornikov (2024) also state: “Subtype B2 is similar in
          mineral composition to the core zone of subtype B1.” These are cited zonal profile values, not an
          initial bulk oxide map.
      locator:
        published_page: 31
        pdf_page_index: 2
        paragraph: Fig. 1 discussion; Kerekgyarto et al. (2016) citation
  conditions:
    temperature_K:
      state:
        tag: unknown
        reason: not_published
      locator:
        published_page: 31
        pdf_page_index: 2
        note: Temperature is shown in Fig. 2A only.
    pressure_environment:
      total_pressure_Pa:
        state:
          tag: unknown
          reason: not_published
        locator:
          published_page: 30
          pdf_page_index: 1
  phase: CAI type B melt
