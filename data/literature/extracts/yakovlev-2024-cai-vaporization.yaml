            Fig. 2B CaO activity is reduced from the matching Fig. 2A Ca(g) partial-pressure series by
            figure x-position; Fig. 2A uses temperature while Fig. 2B uses Al2O3 mol%. The authors state:
            “The oxide activities in melts of the «pure» compounds were taken from data
            obtained in (Shornikov et al., 1996; Bale et al., 2016; Shornikov, 2017).” The numeric
            pure-compound reference values are typed unavailable, reason: cited collectively; values and
            per-activity mapping not printed in this paper. The authors use the oxide activities in the
            printed Lewis Eqs. (1)–(3) to calculate the Fig. 3A compound activities.
          inputs:
          - yakovlev_2024_fig2a_ca_figure_only
