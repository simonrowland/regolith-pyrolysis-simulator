    context:
    - observation_id: bonnickson_1954_cafe2o4_melting_interval
      type: source_context
      locator:
        page: 2
        published_page: 1481
        table: I
      units: cal/mol; cal/(deg mol); K, as applicable to printed statement
      values:
        statement_as_printed: According to the existing phase diagram for the CaO–Fe2O3 system, the compound CaFe2O4
          melts incongruently over a range of temperature. There is some evidence in the present results of beginning
          of melting as low as 1,463°K., and melting is not complete at 1,530°K. (Note results labeled a in Table
          I.) Five determinations (labeled b in Table I) in the temperature range 1,573 to 1,594°K. are discordant
          by about 1.3% on the average; either there was some lack of equilibrium, or the substance was not completely
          melted. These five points were given no weight in drawing the curve for the liquid in Fig. 1 or in subsequent
          treatment of the data. Because of the incongruent melting range, the melting temperature has been taken
          rather arbitrarily at an intermediate value of 1,510°K. The heat of fusion at this temperature is 25,870
          cal./mole, and the entropy of fusion is 17.13 cal./deg. mole.
    - observation_id: bonnickson_1954_cafe2o4_equation_cr
      type: source_context
