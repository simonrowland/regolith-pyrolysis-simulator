refused:
- what: Typed quantity for Table 1 delta_q
  why: The current closed quantity vocabulary has no areal mass-loss quantity; values are retained verbatim under mass_loss with source-native delta_q fields, and a schema amendment is proposed.
  locator: {published_page: 207, pdf_page_index: 3, table: '1'}
- what: Numeric P(H2O) partial pressure for individual runs
  why: The paper states variable water-vapour partial pressure and 60% relative humidity, but prints no numeric P(H2O) per run; no value was inferred.
  locator: {published_page: 206, pdf_page_index: 2, section: Experimental}
- what: Run-specific oxygen fugacity or oxygen partial pressure
  why: No fO2, pO2, buffer, or oxygen-gas value is printed; the typed fO2 channel remains unknown.
  locator: {published_page: 207, pdf_page_index: 3, table: '1'}
- what: Numeric c2 coefficients for NaOH, NaBO2, and HBO2
  why: The three Table 4 C2 cells are blank in the PDF; blank is not zero and no value was invented.
  locator: {published_page: 211, pdf_page_index: 7, table: '4', note: 'rows Na2O/NaOH, Na2O/NaBO2, B2O3/HBO2'}
- what: Numeric coordinates digitized from Figure 2
  why: Figure 2 is retained as figure-only qualitative evidence; its plotted points duplicate Table 1 and were not digitized.
