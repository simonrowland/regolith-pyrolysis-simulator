    value: 60
    locator:
      published_page: 207
      pdf_page_index: 3
      table: '1'
      note: Table 1 header — 60% relative humidity (room temperature)
  - species: glass_melt
    observable: mass_loss
    observation_id: dacko_2004_table1_weight_loss_delta_q
