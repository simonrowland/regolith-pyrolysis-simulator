schema_version: literature_extract.v1
source_id: ta-dacko-conradt-low-p-transpiration
source:
  citation: >-
    Dacko, D., Wilsmann, W. & Conradt, R. (2004), "Low Pressure evaporation
    from boron containing glass melts by the transpiration method",
    Glastech. Ber. Glass Sci. Technol. 77 C, 205–212 (Norbert Kreidl Memorial
    Conference).
  year: 2004
  doi: null
  doi_status: not_printed_in_PDF_and_Crossref_bibliographic_query_returned_no_match
extraction:
  method: >-
    Manual visual transcription from 200–250 dpi pdftoppm renders of the corpus
    PDF. Printed tables only (Tables 1, 2, 4, 5). Figure 2 not digitized.
    Equations (2)–(4) retained as author least-squares fits of the
    quasi-stationary rates (derived). Activities in Table 2 attributed to the
    thermodynamic model of Conradt [3] (model_derived). Absence is never zero.
  date: '2026-09-22'
  worker: n2-hastie-dacko
  null_hypothesis_check: >-
    No extract under Dacko/Wilsmann/Conradt or this corpus stem; SOURCE_STATUS
    lists source_id ta-dacko-conradt-low-p-transpiration as inbox / no extract.
review_status: draft
fidelity_samples:
  - species: glass_melt
    observable: mass_loss
    observation_id: dacko_2004_table1_weight_loss_delta_q
