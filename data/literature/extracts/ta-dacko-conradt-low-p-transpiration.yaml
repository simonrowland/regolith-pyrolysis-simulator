    locator:
      published_page: 207
      pdf_page_index: 3
      table: '1'
  - species: Na2O
    observable: activity_coefficient
    observation_id: dacko_2004_table2_activities_model
    field: a_Na2O_1400C
    value: 1.6e-6
    locator:
      published_page: 209
      pdf_page_index: 5
      table: '2'
