            Al2O3: 3
            minor_constituents: 1
      locator:
        published_page: 205
        pdf_page_index: 1
        section: Abstract
        note: >-
          Also restated Experimental p.206. "the rest to 100 are minor
          constituents" — abstract lists 1 minor constituents.
    form:
