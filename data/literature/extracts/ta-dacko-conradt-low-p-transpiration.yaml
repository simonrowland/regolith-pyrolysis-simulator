    - observation_id: dacko_2004_eq2_to_eq4_rate_fits
      experiment: alkali-borosilicate-low-p-transpiration-series
      type: rate_series
      locator:
        published_page: 208
        pdf_page_index: 4
        equation: '2-4'
        note: Least-squares fits on quasi-stationary rates (exposition time >30 min)
      phase: alkali_borosilicate_melt
      regime: low_pressure_transpiration
      units: log r as printed; T in K; P as printed in log P term; EA in kJ/mol
      values:
        quantity: log_evaporation_rate_fit
        method_class: derived
        derivation: >-
          Author linear regression on rates read from the quasi-stationary
          region of Table 1 / Fig. 2 (exposition >30 min). Stamp DERIVED.
        fits:
        - equation: '2'
          exposition_h: 0.5
          T_C_range: [1400, 1600]
          P_Pa_range: [2.0e4, 1.0e5]
          log_r_expression: '3.239 - 10770/T - 0.311 log P'
          EA_kJ_per_mol: 206.2
          std_dev_r_pct: 5.79
          locator_page: 208
        - equation: '3'
          exposition_h: 1
          T_C_range: [1400, 1600]
          P_Pa_range: [2.0e4, 1.0e5]
          log_r_expression: '2.843 - 10528/T - 0.458 log P'
          EA_kJ_per_mol: 201.6
          std_dev_r_pct: 6.18
          locator_page: 209
        - equation: '4'
          exposition_h: 2
          T_C_range: [1400, 1600]
          P_Pa_range: [2.0e4, 1.0e5]
          log_r_expression: '1.961 - 9003/T - 0.089 log P'
          EA_kJ_per_mol: 172.4
          std_dev_r_pct: 9.65
          locator_page: 209
      uncertainty:
        note: Author-printed standard deviations of r retained per fit.
