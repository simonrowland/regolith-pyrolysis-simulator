        pure_end_member_bracket_as_printed: The inversion temperature, in the pure end member, was found to lie between
          1259° and 1249°. Bowen found it to lie between 1245° and 1252°.
        crystallized_samples_as_printed: To determine these temperatures we crystallized samples of the glasses (with
          the exception of the 33.5 per cent glass) completely to carnegieite and to nephelite.
        glass_not_completely_crystallized_wt_pct_albite: 33.5
        carnegieite_first_as_printed: No difficulty was experienced in obtaining materials completely carnegieite, but
          we found that in the temperature region in which crystallization is fairly rapid, carnegieite formed first and
          that nephelite was obtained only by inverting the carnegieite. To convert the carnegieite completely to nephelite
          was a slow process. Instead of doing this, charges were crystallized to nephelite at low temperatures in sealed
          tubes.
        directional_as_printed: With increase in the silica content of the solid solutions the temperature of the inversion
          rises. The change does not then take place at a single temperature but over a range of temperatures, as indicated
          on the equilibrium diagram by the field labelled carnegieite + nephelite. The data do not well define the width
          of this field.
        bowen_inversion_rates_as_printed: It may be noted in passing that whereas our materials inverted very slowly indeed,
          Bowen obtained almost complete conversion of nephelite to carnegieite in one hour at 1252°, and partial conversion
          of carnegieite to nephelite in one hour at 1245°.
