          enough that it can be held there for an appreciable time without melting completely, but this is in marked
          contrast with albite: carnegieite approaches equilibrium so rapidly (compared with albite) that Bowen could
          fix its melting point by heating curves (1525° and 1527°, placed at 1526°, fn 12). Albite is the sluggish
          phase (crystals persist four days at 1126°, p. 100).'
        rate_comparison_as_printed: Although the rate of approach to equilibrium, when carnegieite is heated just above
          its melting temperature, is slow enough so that it can be held there for an appreciable time without melting
          completely, it is in marked contrast with the rate at which equilibrium is approached when albite is so treated.
          So rapid indeed is this approach that Bowen was able to determine the melting point by making heating curves,
          and the temperature so determined agrees with the temperature determined by the runs listed in Table I. No
          doubt this exact agreement is fortuitous, but it serves to illustrate the remarkable difference in behavior
          of carnegieite and albite near their melting temperatures—a difference very similar to that found by Day
          and Allen between the behaviors of anorthite and albite.
