    - observation_id: greig_barth_1938_solidus_qualifications
      type: method
      locator:
        published_page: 104
        pdf_page_index: 11
        section: Solidus
      units: as printed
      values:
        quantity: crystallization_and_solidus_qualification
        claims:
        - Solidus curves are not located as well as corresponding liquidus curves.
        - Non-occurrence of melting is used to decide temperature is not above solidus; with very viscous materials
          this alone gives less certainty than a liquidus point.
        - Glass may fail to crystallize completely if its composition differs from crystals that separate; possible
          causes include impurities, differential material loss during glass preparation, and inhomogeneity.
        - Nephelite glasses appeared free of visible glass after rapid spherulitic crystallization, but the authors
          suspected partial crystallization. After several days voids were plentiful and refractive index increased;
          small amounts of glass or carnegieite were not detectable by refractive index.
        - At higher temperatures glass appeared, voids disappeared, and blocky nephelite crystals developed. Solidus
          is drawn below temperatures at which this change occurred and above temperatures at which it did not.
