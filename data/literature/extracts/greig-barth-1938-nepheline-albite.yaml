    - observation_id: greig_barth_1938_sealed_tube_crystal_growth
      type: method
      locator:
        published_page: 98
        pdf_page_index: 5
        continued_page: 100
        section: Melting Temperature of Albite (preparation of crystalline albite)
      units: as printed
      values:
        quantity: sealed_tube_crystal_growth_preparation
        air_growth_as_printed: We grew crystals of albite in the powdered albite glass in air but did not use them for
          the final work, for we found that by growing them under a small pressure of water vapor in sealed tubes of
          silica glass, we had a much better choice of size and distribution of crystals. In the same way we also prepared
          crystalline albite free from all but small traces of glass.
        sealed_tube_as_printed: Powdered albite glass was placed in a crucible of platinum foil, and the platinum folded
          down tightly over the charge, sealing it in. The charge, together with a source of water, was then sealed in
          an evacuated tube of silica glass and heated in an electric furnace.
        water_source_as_printed: As a source of water we used gibbsite in some cases, and a rhyolitic glass containing
          about 3 per cent of water in others.
        water_sources:
        - gibbsite
        - rhyolitic glass
        rhyolitic_glass_water_pct_approx: 3
        rhyolitic_glass_water_pct_approximate: true
        water_source_locator:
          published_page: 98
          pdf_page_index: 5
          continued_page: 100
          note: Sentence breaks across the page turn; p. 99 is the rotated Table II.
        water_vapor_pressure:
          state:
            tag: unknown
            reason: not_published
          note: Printed only as "a small pressure of water vapor" (p. 98).
        contamination_as_printed: Under these conditions some volatilization of silica from the walls of the tube occurs,
          but there is no detectable contamination of the charge inside its platinum container.
        contamination_locator:
          published_page: 100
          pdf_page_index: 7
          footnote: '8'
          note: 'Footnote 8 cites Greig, J. W., Merwin, H. E., and Shepherd, E. S.: This Journal, 25, 61-73, 1933.'
    - observation_id: greig_barth_1938_albite_persistence_context
      type: method
      locator:
        published_page: 100
        pdf_page_index: 7
        section: Melting Temperature of Albite
      units: as printed
      values:
        quantity: albite_crystal_history_and_persistence
        merwin_change_as_printed: Merwin had, some years before, found that some change takes place in natural albite
          crystals, when they are heated in the neighborhood of 900°, and that it takes place in a few hours.
        merwin_change_temperature_C_approx: 900
        merwin_change_duration_as_printed: a few hours
        merwin_reference: 'Merwin, H. E.: J. Wash. Acad. Sci., 1, 59-60, 1911 (footnote 9).'
        growth_temperature_test_as_printed: As the duration of our runs was always several times as great as this, we
          did not expect any difference in the behavior of crystals grown at different temperatures. However, we tried
          crystals grown at 800°, 930°, and 1000°, but found no differences in behavior.
        crystal_growth_temperatures_tested_C:
        - 800
        - 930
        - 1000
        persistence_as_printed: It will be seen from the data of Table IV that crystals of albite in an albite liquid
          persist for long periods of time at temperatures above the melting point. Thus after four days at 1126°, some
          crystal remnants still persist.
        foreign_liquid_as_printed: These crystals in contact with a liquid of their own composition behave exactly like
          the same crystals in a somewhat different liquid when held just above the temperature of the liquidus, e.g.
          the albite crystals in the 91.6 per cent liquid at 1115° (see Table I).
        foreign_liquid_wt_pct_albite: 91.6
        foreign_liquid_temperature_C: 1115
        foreign_liquid_table_row: Table II row 32 (91.6 wt% albite, 1115°, 19 hrs, Albite nearly all melted)
        quartz_analogy_as_printed: It is of interest in this connection, that quartz, which, like albite, may persist
          far above its melting temperature, likewise melts at the surface, at least over a considerable range of temperatures
          above the melting temperature.
        quartz_footnote_as_printed: This was reported by Ferguson and Merwin (This Journal, 46, 417-426, 1918) and has
          been repeatedly observed by one of us. An extreme example may be cited. A particularly fine quartz crystal was
          heated to about 1800° C. in an effort to melt it quickly. After cooling, it was found that the outer portion
          was silica glass but the inner part was still crystalline quartz.
        quartz_heating_temperature_C_approx: 1800
        quartz_heating_temperature_approximate: true
        quartz_footnote_locator:
          published_page: 100
          pdf_page_index: 7
          footnote: '10'
    - observation_id: greig_barth_1938_feldspar_system_comparison
      type: method
      locator:
        published_page: 111
        pdf_page_index: 18
        section: Summary (comparison with nephelite, carnegieite—anorthite)
      units: as printed
      values:
        quantity: directional_comparison_with_anorthite_system
        jadeite_stability_as_printed: Although the composition of jadeite, Na2O.Al2O3.4SiO2, lies between that of nephelite
          and albite, it is evidently unstable under the conditions represented in the diagram. This was to be expected,
          for it is not known in the ordinary igneous rocks and has been considered by petrologists to be formed only
          at high pressures.
        solid_solution_direction_as_printed: In both systems the compositions of the nephelite and the carnegieite vary
          within limits from Na2O.Al2O3.2SiO2 toward the composition of the feldspar, anorthite, or albite, or, expressing
          this variation in composition in other words, nephelite and carnegieite take a limited amount of feldspar into
          solid solution.
        inversion_direction_as_printed: In both systems the temperature of the inversion nephelite-carnegieite rises with
          increased feldspar content.
        feldspar_end_solubility_as_printed: At the other end of each diagram, as drawn, some slight solubility of nephelite,
          carnegieite in the feldspar is indicated.
        feldspar_end_solubility_note: Nephelite and carnegieite dissolved in the feldspar (not feldspar dissolved in
          nephelite).
        optical_sign_as_printed: Bowen found that with increasing anorthite content the birefringence of nephelite decreased,
          became zero, then increased again, the crystals having become optically positive. The small size of the nephelite
          crystals, that grew in the nephelite-albite liquids, prevented satisfactory measurements of the indices of
          refraction, but the change to optically positive nephelite does not occur in this system. These nephelites
          are all optically negative, as are the naturally occurring examples.
