experiments:
- experiment_id: kress-carmichael-wet-chemistry-runs
  series: Natural silicate melt ferric-ferrous equilibrium experiments
  bench_id: kress-carmichael-vertical-furnace
  method: furnace_gas_mixing_quench_equilibration
  locator: {page: 3, published_page: 1269, section: Experimental Technique}
  sample:
    characterization:
      state: {tag: value, value: Ground natural rock powders fused at 1400 °C in air and broken into 1-g fragments; Table 1 prints the individual run composition labels}
      locator: {page: 3, published_page: 1269, section: Experimental Technique}
    form:
      state: {tag: value, value: Powder fragments welded with an oxyacetylene torch onto 4-mm loops of 0.117-mm Pt90Rh10 wire}
      locator: {page: 3, published_page: 1269, section: Experimental Technique}
    printed_composition:
      state: {tag: value, value: Table 1 composition labels are JDFD2, 780-U-105, 20424, COL-11, K-1919, and KIL-2}
      locator: {page: 4, published_page: 1270, table: '1', note: Table 1 tabulates analyzed run-glass compositions and conditions; these are not separate initial-charge analyses. Its continuation footnote states that totals for 780-U-105 and 20424 omit significant SrO, BaO, and other minor elements}
    initial_composition:
      state: {tag: unknown, reason: not_published}
      locator: {page: 4, published_page: 1270, table: '1', note: Table 1 reports run glass compositions; starting charge compositions are not separately tabulated}
  fO2_control:
    channel: {tag: value, value: gas_mix}
    buffer:
      state: {tag: value, value: The paper defines fO2 relative to the pure-component standard state at P and T; CO-CO2 gas-mixture fugacities were calculated and corrected against iron-wustite, nickel-nickel oxide, and magnetite-hematite calibrations}
      locator: {page: 3, published_page: 1269, section: Experimental Technique, note: Standard-state convention is defined on PDF page 1, published page 1267}
  thermal_schedule:
    method:
      state: {tag: value, value: Run durations varied from 2 to 12 h; longer durations caused no significant change in ferric/ferrous ratio}
      locator: {page: 3, published_page: 1269, section: Experimental Technique}
    cooling_or_quench:
      state: {tag: value, value: Quenched by dropping into cold distilled water previously boiled for 8 h; furnace was designed so the charge remained under its gas mixture during quench}
      locator: {page: 3, published_page: 1269, section: Experimental Technique}
  apparatus:
    container:
      state: {tag: value, value: 4-mm loops of 0.117-mm Pt90Rh10 wire; ten loops comprising five duplicate pairs suspended in the furnace hot spot}
      locator: {page: 3, published_page: 1269, section: Experimental Technique}
  note: CO-CO2 gas mixing was controlled by calibrated floating-ball flow meters; fO2 was calculated from measured gas ratios and corrected against iron-wustite, nickel-nickel oxide, and magnetite-hematite buffers. The applied CO-CO2 mixing-ratio corrections ranged from +0.09 to +0.4 log10 units. FeO was determined by wet-chemical techniques. Total iron was determined separately; Fe2O3 was calculated by difference from total iron and ferrous iron, using Fe2O3 = 1.1113(FeO* - FeO), where FeO* is total iron as FeO.
  note_locator: {page: 3, published_page: 1269, section: Experimental Technique}
