review_status: draft
ratio_derivation_note: 'For every row, n(Fe3+)/n(Fe2+) = [2*w(Fe2O3)/159.688]/[w(FeO)/71.844]; wt% cancels and g/mol cancels, so the result is dimensionless. Sanity check: Fe2O3=159.688 and FeO=143.688 give ratio 1.'
