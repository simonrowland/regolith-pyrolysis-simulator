source_id: frandsen-1933-phosphorus-pentoxide-calorimetry
source:
  citation: M. Frandsen, “The heat capacity, heat of sublimation, and heat of solution of phosphorus pentoxide,”
    Bureau of Standards Journal of Research 10, Research Paper 514, 35–58 (1933).
  year: 1933
extraction:
  method: MinerU table draft for Tables 2, 4, and 5; full retained-cell render audit; equation transcription
    from machine text checked against rendered pages.
  date: '2026-10-26'
  worker: w1026b-fran33
  provenance_path: text/frandsen-1933-phosphorus-pentoxide-calorimetry/pdftotext-layout.txt
  source_note: Transcribed in the required machine-text order from MinerU tables and the born-digital
    pdftotext layout. The three target tables and all retained numeric cells were checked against the
    page renders because table QA reported digit disagreements and grouped comma values. The article occupies
    PDF pages 1–24, Bureau of Standards Journal pages 35–58. The vapor is called P2O5 for convenience
    although the source says its molecular form at bright red heat is closer to P4O10.
  schema_gap: No battery quantity token represents integral heat of solution, heat of sublimation, heat
    of transformation, or interval-mean Cp. The printed units cal.15 mole−1 and cal.15 mole−1 °C−1 have
    no exact migrator conversion, and the method vocabulary has no calorimetry token. Supported
    H_minus_H298 and point-Cp results remain admitted with unavailable values; unsupported heat results and
    raw calorimeter records remain in the species context with typed-refusal status.
