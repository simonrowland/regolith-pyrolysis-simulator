    preserved verbatim in context because no store quantity token represents diffusion coefficient. The three Table 3 liquidus temperatures are
    retained as composition-bearing liquidus transition points, attributed to the ternary diagram [12]; solidus values and FactSage viscosities remain
    context under t-1326. All 11 figures are context-only records with deferred digitisation and no numeric points.
