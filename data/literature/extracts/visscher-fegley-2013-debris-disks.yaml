schema_version: literature_extract.v1
source_id: visscher-fegley-2013-debris-disks
source:
  citation: Visscher, Channon & Fegley, Bruce (2013), "Chemistry of impact-generated silicate melt-vapor debris disks", The Astrophysical Journal Letters 767(1), L12.
  doi: 10.1088/2041-8205/767/1/L12
  year: 2013
extraction:
  method: manual_from_layout_text
  date: '2026-09-19'
  worker: w3-visscher-fegley-2013-debris-disks
  scope_notes:
  - This is a MAGMA thermochemical-equilibrium model paper, not an experimental apparatus paper.
  - No sample mass, container, cell/orifice geometry, exposed area, vacuum, pumping, gas pressure, temperature calibration, fO2 control, run duration, or measurement uncertainty is reported.
  - Table 1 compositions are compilation_assessed inputs; equations and results are model_derived from MAGMA; no measured_direct rows are claimed.
