schema_version: literature_extract.v1
source_id: visscher-fegley-2013-debris-disks
source:
  citation: Visscher, Channon & Fegley, Bruce (2013), "Chemistry of impact-generated silicate melt-vapor debris disks", The Astrophysical Journal Letters 767(1), L12.
  doi: 10.1088/2041-8205/767/1/L12
  year: 2013
extraction:
  method: manual_from_layout_text
  date: '2026-09-19'
  worker: w3-visscher-fegley-2013-debris-disks
  scope_notes:
  - This is a MAGMA thermochemical-equilibrium model paper, not an experimental apparatus paper.
  - No sample mass, container, cell/orifice geometry, exposed area, vacuum, pumping, gas pressure, temperature calibration, fO2 control, run duration, or measurement uncertainty is reported.
  - Table 1 compositions are compilation_assessed inputs; equations and results are model_derived from MAGMA; no measured_direct rows are claimed.
review_status: draft
fidelity_samples:
- path: species.SiO2.observations[visscher_2013_table1_bulk_silicate_compositions].values.compositions.Moon
  value: {SiO2: 44.6, MgO: 35.1, Al2O3: 3.9, TiO2: 0.17, FeO: 12.4, CaO: 3.3, Na2O: 0.05, K2O: 0.004, ZnO: 0.0002, Total: 99.5, Mg_mol_pct: 83.3}
  locator: {published_page: 2, table: '1'}
species:
  SiO2:
    observations:
    - observation_id: visscher_2013_table1_bulk_silicate_compositions
      type: rate_series
      locator: {published_page: 2, table: '1'}
      phase: bulk_silicate_composition_input
      regime: MAGMA_IMCC_model_input
      units: oxide wt%; Mg mol% as printed
      values:
        quantity: compiled_bulk_silicate_compositions
        method_class: compilation_assessed
        attribution: "Palme and O'Neill 2003; O'Neill 1991; Lodders 2000; Lodders and Fegley 2011; Warren and Kallemeyn 1990; Warren et al. 1995; Mittlefehldt et al. 2002; Ringwood 1960; Vdovykin 1970; Wiik 1972; Jarosewich 1990; Klock et al. 1998"
        evidence_class: compilation_assessed
        generator: literature compilations named in Table 1 note; used as MAGMA input, not measured by Visscher and Fegley
        composition_basis: bulk silicate composition; abundances renormalized to 100% for code calculations
        compositions:
          BSE: {SiO2: 45.40, MgO: 36.76, Al2O3: 4.48, TiO2: 0.21, FeO: 8.10, CaO: 3.65, Na2O: 0.349, K2O: 0.031, ZnO: 0.0067, Total: 99.0, Mg_mol_pct: 89.0}
          Moon: {SiO2: 44.60, MgO: 35.10, Al2O3: 3.90, TiO2: 0.17, FeO: 12.40, CaO: 3.30, Na2O: 0.050, K2O: 0.004, ZnO: 0.0002, Total: 99.5, Mg_mol_pct: 83.3}
          Mars: {SiO2: 45.39, MgO: 29.71, Al2O3: 2.89, TiO2: 0.14, FeO: 17.21, CaO: 2.36, Na2O: 0.983, K2O: 0.111, ZnO: 0.0076, Total: 98.8, Mg_mol_pct: 75.5}
          EPB: {SiO2: 46.26, MgO: 31.55, Al2O3: 3.27, TiO2: 0.16, FeO: 14.82, CaO: 2.58, Na2O: 0.110, K2O: 0.009, ZnO: 0.00004, Total: 98.8, Mg_mol_pct: 79.1}
          Angrite: {SiO2: 40.32, MgO: 11.10, Al2O3: 11.45, TiO2: 1.12, FeO: 20.10, CaO: 15.89, Na2O: 0.022, K2O: 0.007, ZnO: 0.0005, Total: 100.0, Mg_mol_pct: 49.6}
          Ureilite: {SiO2: 43.65, MgO: 39.98, Al2O3: 0.37, TiO2: 0.10, FeO: 14.60, CaO: 1.23, Na2O: 0.065, K2O: 0.022, ZnO: 0.027, Total: 100.0, Mg_mol_pct: 83.0}
        source_composition_references: [Palme and O'Neill 2003, O'Neill 1991, Lodders 2000, Lodders and Fegley 2011, Warren and Kallemeyn 1990, Warren et al. 1995, Mittlefehldt et al. 2002, Ringwood 1960, Vdovykin 1970, Wiik 1972, Jarosewich 1990, Klock et al. 1998]
      uncertainty: not reported for compiled input values in this paper
    - observation_id: visscher_2013_sio2_pure_melt_vapor_pressure_fit
      quote: Visscher and Fegley (2013), quoting Fegley and Schaefer 2012 MAGMA calculation
      type: psat_series
      locator: {published_page: 4, equation: '2', section: '3.2'}
      phase: pure_molten_SiO2
      regime: MAGMA_equilibrium_model_comparison
      units: P in bar; T in K
      values:
        quantity: p_sat
        attribution: Fegley and Schaefer (2012), as cited by Visscher and Fegley in Section 3.2.
        method_class: quoted_attributed
        generator: Visscher and Fegley (2013), quoting Fegley and Schaefer 2012 MAGMA calculation
        expression: log10(P_vap_bar) = 8.203 - 25898.9/T_K
        coefficients: {intercept: 8.203, inverse_T_coefficient_K: -25898.9}
      uncertainty: no model uncertainty reported
  SiO:
    observations:
    - observation_id: visscher_2013_sio_partial_pressure_equilibrium
      derivation:
        relation: "The MAGMA equilibrium calculation determines SiO partial pressure using the printed Eq. (5) relation and model activities."
        raw_inputs: &visscher_magma_raw_inputs
          state: {tag: value, value: not_printed}
          locator: {page: 2, pdf_page_index: 1, published_page: 2, section: '2.1. Chemical Model'}
        method:
          state: {tag: value, value: "MAGMA equilibrium relation for SiO partial pressure using melt activity and oxygen fugacity."}
          locator: {page: 4, pdf_page_index: 3, published_page: 4, section: '3.2', equation: '5'}
        references: &visscher_magma_references
          - "Fegley, B., & Cameron, A. G. W. 1987, Earth and Planetary Science Letters, 82, 207."
          - "Schaefer, L., & Fegley, B. 2004, Icarus, 169, 216."
      type: psat_series
      locator: {published_page: 4, equation: '5', section: '3.2'}
      phase: multicomponent_silicate_melt
      regime: MAGMA_IMCC_equilibrium
      units: partial pressure in bar; fO2 in bar; T dependence through K4
      values:
        quantity: p_partial
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation using IMCC activities
        expression: P_SiO = K4 * a_SiO2 * fO2^(-0.5)
        terms: {equilibrium_constant: K4, melt_activity: a_SiO2, oxygen_fugacity: fO2}
      uncertainty: no model uncertainty reported
  Na:
    observations:
    - observation_id: visscher_2013_low_temperature_volatile_dominance
      derived_from: [visscher_2013_table1_bulk_silicate_compositions]
      derivation:
        relation: >-
          The MAGMA calculations compare saturated vapor compositions across the printed melt compositions;
          the paper states that volatile abundance controls the temperature transition.
        inputs: [visscher_2013_table1_bulk_silicate_compositions]
        method:
          state:
            tag: value
            value: >-
              We used the MAGMA code (Fegley & Cameron 1987; Schaefer & Fegley 2004) to calculate the
              temperature-dependent chemical equilibrium composition of silicate melt and coexisting vapor.
          locator:
            page: 2
            pdf_page_index: 1
            published_page: 2
            section: '2.1. Chemical Model'
        references: *visscher_magma_references
      type: rate_series
      locator: {published_page: 3, section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      standard_state: saturated vapor in chemical equilibrium with molten silicate
      standard_state_locator:
        page: 2
        pdf_page_index: 1
        published_page: 2
        section: '2.1. Chemical Model'
        note: The authors describe the calculated equilibrium composition of silicate melt and coexisting vapor.
      basis: >-
        Qualitative mole-fraction dominance in the saturated vapor as a function of temperature; the
        transition depends on volatile-element abundances in the melt.
      basis_locator:
        page: 4
        published_page: 4
        pdf_page_index: 3
        section: '3.1'
        note: The discussion links the SiO/Na/Zn transition temperature to volatile abundances in each melt.
      units: qualitative mole-fraction dominance; transition temperatures in K
      values:
        quantity: evolved_gas_yield
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        value_as_printed: >-
          At high temperatures (> 3000 K), the disk atmosphere is dominated by SiO, O2, and O, whereas more
          volatile species such as Na and Zn tend to dominate the silicate vapor at lower temperatures.
        transition_statement_as_printed: >-
          For bulk compositions with relatively higher abundances of volatiles (BSE, Mars, Ureilite) this
          transition occurs between 3000-3500 K. For melt compositions with lower volatile abundances
          (Moon, EPB, Angrite), this transition occurs at temperatures near 2500 K.
        transition_locator:
          page: 4
          pdf_page_index: 3
          published_page: 4
          section: '3.1'
        lower_temperature_dominant_species: [Na, Zn, O2]
        lower_temperature_regime: below 3000 K generally; transition is composition-dependent
        transition_temperature_K_as_printed: {volatile_rich_compositions: '3000-3500', volatile_poor_compositions: 'near 2500'}
      uncertainty: no model uncertainty reported
  Zn:
    observations:
    - observation_id: visscher_2013_low_temperature_volatile_dominance_zinc
      derived_from: [visscher_2013_table1_bulk_silicate_compositions]
      derivation:
        relation: >-
          The MAGMA zinc-bearing vapor calculation depends on the relative abundances of volatile elements
          in the printed melt compositions.
        inputs: [visscher_2013_table1_bulk_silicate_compositions]
        method:
          state:
            tag: value
            value: >-
              We used the MAGMA code (Fegley & Cameron 1987; Schaefer & Fegley 2004) to calculate the
              temperature-dependent chemical equilibrium composition of silicate melt and coexisting vapor.
              Zinc thermochemistry was recently added to the code calculations in order to explore the
              chemical behavior and potential volatile loss of Zn-bearing gases from the protolunar disk
              atmosphere (e.g., Paniello et al. 2012).
          locator:
            page: 2
            pdf_page_index: 1
            published_page: 2
            section: '2.1. Chemical Model'
        references:
        - "Fegley, B., & Cameron, A. G. W. 1987, Earth and Planetary Science Letters, 82, 207."
        - "Schaefer, L., & Fegley, B. 2004, Icarus, 169, 216."
        - "Paniello, R. C., Day, J. M. D., & Moynier, F. 2012, Nature, 490, 376."
      type: rate_series
      locator: {published_page: 3, section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      standard_state: saturated vapor in chemical equilibrium with molten silicate
      standard_state_locator:
        page: 2
        pdf_page_index: 1
        published_page: 2
        section: '2.1. Chemical Model'
        note: The authors describe the calculated equilibrium composition of silicate melt and coexisting vapor.
      basis: >-
        Qualitative mole-fraction dominance of zinc-bearing vapor as a function of temperature and melt
        volatile-element abundance.
      basis_locator:
        page: 4
        pdf_page_index: 3
        published_page: 4
        section: '3.1'
        note: The paper states that the Zn-dominated transition depends on volatile abundances in the melt.
      units: qualitative mole-fraction dominance; transition temperatures in K
      values:
        quantity: evolved_gas_yield
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        value_as_printed: >-
          The Zn-dominated regime depends upon the relative abundances of the volatiles in the melt. For bulk
          compositions with relatively higher abundances of volatiles (BSE, Mars, Ureilite) this transition
          occurs between 3000-3500 K. For melt compositions with lower volatile abundances (Moon, EPB,
          Angrite), this transition occurs at temperatures near 2500 K.
        value_locator:
          page: 4
          pdf_page_index: 3
          published_page: 4
          section: '3.1'
        dominant_with_lower_temperature_volatile_species: [Na, Zn, O2]
        composition_sensitivity: relative abundance of volatile elements in melt
      uncertainty: no model uncertainty reported
  O2:
    observations:
    - observation_id: visscher_2013_saturated_vapor_oxygen_fugacity
      derivation:
        relation: "MAGMA model outputs give oxygen fugacity through the printed Eq. (8) relation; the authors use gamma_O2 approximately 1."
        raw_inputs: *visscher_magma_raw_inputs
        method:
          state: {tag: value, value: "MAGMA oxygen fugacity calculated from oxygen mole fraction and total pressure using Eq. (8)."}
          locator: {page: 5, pdf_page_index: 4, published_page: 5, section: '3.3', equation: '8'}
        references: *visscher_magma_references
      type: psat_series
      locator: {published_page: 5, figure: '3b', section: '3.3'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: fO2 in bar; temperature K
      values:
        quantity: p_partial
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        expression: fO2 = gamma_O2 * P_O2 = gamma_O2 * X_O2 * P_T
        model_approximation: gamma_O2 approximately 1, therefore fO2 approximately P_O2 approximately X_O2 * P_T
        qualitative_result: saturated vapor is several orders of magnitude more oxidizing than solar-composition gas
      uncertainty: no model uncertainty reported
    context:
    - observation_id: visscher_2013_o2_vapor_fraction
      type: printed_data_context
      quote: Visscher and Fegley (2013), MAGMA equilibrium calculation
      locator:
        published_page: 3
        figure: '2'
        section: '3.1'
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: mole fraction
      values:
        quantity: O2 mole fraction in saturated silicate vapor
        method_class: quoted_attributed
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        mole_fraction_range_as_printed: '20-30%'
        note: O2 mole fraction is described as relatively temperature-independent across all melt compositions.
      uncertainty: no model uncertainty reported
  SiO2_melt:
    observations:
    - observation_id: visscher_2013_total_vapor_pressure_sum
      derivation:
        relation: "The saturated vapor pressure over the multicomponent melt is the sum of partial pressures of all equilibrium gas species, as printed in Eq. (3)."
        raw_inputs: *visscher_magma_raw_inputs
        method:
          state: {tag: value, value: "MAGMA equilibrium vapor pressure from the sum of gas-species partial pressures using Eq. (3)."}
          locator: {page: 4, pdf_page_index: 3, published_page: 4, section: '3.2', equation: '3'}
        references: *visscher_magma_references
      type: psat_series
      locator: {published_page: 4, equation: '3', section: '3.2'}
      phase: multicomponent_silicate_melt
      regime: MAGMA_IMCC_equilibrium
      units: pressure in bar
      values:
        quantity: p_sat
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        expression: P_T = sum(P_i)
        species_scope: all gas species in equilibrium with the multicomponent melt
    - observation_id: visscher_2013_bse_total_vapor_pressure_fit
      derivation:
        relation: "Fit to the authors' MAGMA-calculated total saturation vapor pressure over the BSE-composition melt."
        raw_inputs: *visscher_magma_raw_inputs
        method:
          state: {tag: value, value: "MAGMA total saturation vapor-pressure fit for BSE-composition melt using Eq. (6)."}
          locator: {page: 4, pdf_page_index: 3, published_page: 4, section: '3.2', equation: '6'}
        references: *visscher_magma_references
      type: psat_series
      locator: {published_page: 4, equation: '6', section: '3.2'}
      phase: BSE_composition_melt
      regime: MAGMA_IMCC_equilibrium
      units: P in bar; T in K
      values:
        quantity: p_sat
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        expression: log10(P_vap_bar) approximately equals -51.17 - 1048.8/T_K + 14.60*log10(T_K)
        composition: BSE
      uncertainty: no model uncertainty reported
    - observation_id: visscher_2013_bsm_total_vapor_pressure_fit
      derivation:
        relation: "Fit to the authors' MAGMA-calculated total saturation vapor pressure over the BSM-composition melt."
        raw_inputs: *visscher_magma_raw_inputs
        method:
          state: {tag: value, value: "MAGMA total saturation vapor-pressure fit for BSM-composition melt using Eq. (7)."}
          locator: {page: 4, pdf_page_index: 3, published_page: 4, section: '3.2', equation: '7'}
        references: *visscher_magma_references
      type: psat_series
      locator: {published_page: 4, equation: '7', section: '3.2'}
      phase: BSM_composition_melt
      regime: MAGMA_IMCC_equilibrium
      units: P in bar; T in K
      values:
        quantity: p_sat
        method_class: model_derived
        generator: Visscher and Fegley (2013), MAGMA equilibrium calculation
        expression: log10(P_vap_bar) approximately equals -41.45 - 4052.3/T_K + 14.90*log10(T_K)
        composition: BSM
      uncertainty: no model uncertainty reported
    - observation_id: visscher_2013_figure2_vapor_species_trends
      type: rate_series
      locator: {published_page: 3, figure: '2', section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: qualitative plotted mole-fraction trend; curves not digitized
      values:
        quantity: vapor_species_map
        method_class: figure_only
        generator: MAGMA equilibrium calculation
        admission_status: figure_only_no_digitization
        panels: [BSE, Moon, Mars, EPB, Angrite, Ureilite]
        plotted_species: [O, O2, Mg, MgO, Si, SiO, SiO2, Fe, FeO, Al, Ca, Na, K, Zn]
        trend_as_printed: lower-temperature vapor is volatile-rich; higher-temperature vapor becomes SiO/O2/O-rich
      uncertainty: no figure uncertainty reported
  H2O:
    observations:
    - observation_id: visscher_2013_water_ratio_constraint
      derivation:
        relation: "The printed equilibrium relation predicts H2O/H2 from oxygen fugacity determined by the silicate melt-vapor chemistry; H2O is not included in MAGMA."
        raw_inputs: *visscher_magma_raw_inputs
        method:
          state: {tag: value, value: "Equilibrium relation for H2O/H2 as a function of MAGMA-derived oxygen fugacity using Eq. (10)."}
          locator: {page: 5, pdf_page_index: 4, published_page: 5, section: '3.3', equation: '10'}
        references: *visscher_magma_references
      type: psat_series
      locator: {published_page: 5, equation: '10', section: '3.3'}
      phase: saturated_silicate_vapor
      regime: MAGMA_equilibrium_fO2_constraint
      units: dimensionless ratio; fO2 in bar
      values:
        quantity: p_partial
        method_class: model_derived
        generator: Visscher and Fegley (2013), equilibrium relation constrained by MAGMA-derived fO2; H2O not included in MAGMA model
        expression: H2O/H2 = K9 * fO2^0.5
        model_status: inferred constraint, not a directly calculated MAGMA species abundance
      uncertainty: no model uncertainty reported
  CO2:
    observations:
    - observation_id: visscher_2013_carbon_dioxide_ratio_constraint
      derivation:
        relation: "The printed equilibrium relation predicts CO2/CO from oxygen fugacity determined by the silicate melt-vapor chemistry; CO2 and CO are not included in MAGMA."
        raw_inputs: *visscher_magma_raw_inputs
        method:
          state: {tag: value, value: "Equilibrium relation for CO2/CO as a function of MAGMA-derived oxygen fugacity using Eq. (12)."}
          locator: {page: 5, pdf_page_index: 4, published_page: 5, section: '3.3', equation: '12'}
        references: *visscher_magma_references
      type: psat_series
      locator: {published_page: 5, equation: '12', section: '3.3'}
      phase: saturated_silicate_vapor
      regime: MAGMA_equilibrium_fO2_constraint
      units: dimensionless ratio; fO2 in bar
      values:
        quantity: p_partial
        method_class: model_derived
        generator: Visscher and Fegley (2013), equilibrium relation constrained by MAGMA-derived fO2; CO2 and CO not included in MAGMA model
        expression: CO2/CO = K11 * fO2^0.5
        model_status: inferred constraint, not a directly calculated MAGMA species abundance
      uncertainty: no model uncertainty reported
