          Angrite: {SiO2: 40.32, MgO: 11.10, Al2O3: 11.45, TiO2: 1.12, FeO: 20.10, CaO: 15.89, Na2O: 0.022, K2O: 0.007, ZnO: 0.0005, Total: 100.0, Mg_mol_pct: 49.6}
          Ureilite: {SiO2: 43.65, MgO: 39.98, Al2O3: 0.37, TiO2: 0.10, FeO: 14.60, CaO: 1.23, Na2O: 0.065, K2O: 0.022, ZnO: 0.027, Total: 100.0, Mg_mol_pct: 83.0}
        source_composition_references: [Palme and O'Neill 2003, O'Neill 1991, Lodders 2000, Lodders and Fegley 2011, Warren and Kallemeyn 1990, Warren et al. 1995, Mittlefehldt et al. 2002, Ringwood 1960, Vdovykin 1970, Wiik 1972, Jarosewich 1990, Klock et al. 1998]
      uncertainty: not reported for compiled input values in this paper
    - observation_id: visscher_2013_sio2_pure_melt_vapor_pressure_fit
      type: psat_series
      locator: {published_page: 4, equation: '2', section: '3.2'}
      phase: pure_molten_SiO2
      regime: MAGMA_equilibrium_model_comparison
      units: P in bar; T in K
      values:
        quantity: p_sat
        method_class: model_derived
        generator: Fegley and Schaefer 2012 MAGMA calculation, reproduced as comparison
        expression: log10(P_vap_bar) = 8.203 - 25898.9/T_K
        coefficients: {intercept: 8.203, inverse_T_coefficient_K: -25898.9}
      uncertainty: no model uncertainty reported
  SiO:
    observations:
    - observation_id: visscher_2013_sio_partial_pressure_equilibrium
      type: psat_series
      locator: {published_page: 4, equation: '5', section: '3.2'}
      phase: multicomponent_silicate_melt
      regime: MAGMA_IMCC_equilibrium
      units: partial pressure in bar; fO2 in bar; T dependence through K4
      values:
        quantity: p_partial
        method_class: model_derived
        generator: MAGMA equilibrium calculation using IMCC activities
        expression: P_SiO = K4 * a_SiO2 * fO2^(-0.5)
        terms: {equilibrium_constant: K4, melt_activity: a_SiO2, oxygen_fugacity: fO2}
      uncertainty: no model uncertainty reported
  Na:
    observations:
    - observation_id: visscher_2013_low_temperature_volatile_dominance
      type: rate_series
      locator: {published_page: 3, section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: temperature K; qualitative model trend
      values:
        quantity: evolved_gas_yield
        method_class: model_derived
        generator: MAGMA equilibrium calculation
        lower_temperature_dominant_species: [Na, Zn, O2]
        lower_temperature_regime: below 3000 K generally; transition is composition-dependent
        transition_temperature_K_as_printed: {volatile_rich_compositions: '3000-3500', volatile_poor_compositions: 'near 2500'}
      uncertainty: no model uncertainty reported
  Zn:
    observations:
    - observation_id: visscher_2013_low_temperature_volatile_dominance_zinc
      type: rate_series
      locator: {published_page: 3, section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: temperature K; qualitative model trend
      values:
        quantity: evolved_gas_yield
        method_class: model_derived
        generator: MAGMA equilibrium calculation
        dominant_with_lower_temperature_volatile_species: [Na, Zn, O2]
        composition_sensitivity: relative abundance of volatile elements in melt
      uncertainty: no model uncertainty reported
  O2:
    observations:
    - observation_id: visscher_2013_o2_vapor_fraction
      type: rate_series
      locator: {published_page: 3, figure: '2', section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: mole fraction
      values:
        quantity: evolved_gas_yield
        method_class: model_derived
        generator: MAGMA equilibrium calculation
        mole_fraction_range_as_printed: '20-30%'
        note: O2 mole fraction is described as relatively temperature-independent across all melt compositions.
      uncertainty: no model uncertainty reported
    - observation_id: visscher_2013_saturated_vapor_oxygen_fugacity
      type: psat_series
      locator: {published_page: 5, figure: '3b', section: '3.3'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
      units: fO2 in bar; temperature K
      values:
        quantity: p_partial
        method_class: model_derived
        generator: MAGMA equilibrium calculation
        expression: fO2 = gamma_O2 * P_O2 = gamma_O2 * X_O2 * P_T
        model_approximation: gamma_O2 approximately 1, therefore fO2 approximately P_O2 approximately X_O2 * P_T
        qualitative_result: saturated vapor is several orders of magnitude more oxidizing than solar-composition gas
      uncertainty: no model uncertainty reported
  SiO2_melt:
    observations:
    - observation_id: visscher_2013_total_vapor_pressure_sum
      type: psat_series
      locator: {published_page: 4, equation: '3', section: '3.2'}
      phase: multicomponent_silicate_melt
      regime: MAGMA_IMCC_equilibrium
      units: pressure in bar
      values:
        quantity: p_sat
        method_class: model_derived
        generator: MAGMA equilibrium calculation
        expression: P_T = sum(P_i)
        species_scope: all gas species in equilibrium with the multicomponent melt
    - observation_id: visscher_2013_bse_total_vapor_pressure_fit
      type: psat_series
      locator: {published_page: 4, equation: '6', section: '3.2'}
      phase: BSE_composition_melt
