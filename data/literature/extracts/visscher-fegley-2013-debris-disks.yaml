      values:
        quantity: vapor_species_map
        method_class: figure_only
        generator: MAGMA equilibrium calculation
        admission_status: figure_only_no_digitization
        panels: [BSE, Moon, Mars, EPB, Angrite, Ureilite]
        plotted_species: [O, O2, Mg, MgO, Si, SiO, SiO2, Fe, FeO, Al, Ca, Na, K, Zn]
