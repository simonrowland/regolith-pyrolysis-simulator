        method_class: model_derived
        generator: MAGMA equilibrium calculation
        expression: log10(P_vap_bar) approximately equals -41.45 - 4052.3/T_K + 14.90*log10(T_K)
        composition: BSM
      uncertainty: no model uncertainty reported
    - observation_id: visscher_2013_figure2_vapor_species_trends
      type: rate_series
      locator: {published_page: 3, figure: '2', section: '3.1'}
      phase: saturated_silicate_vapor
      regime: MAGMA_IMCC_equilibrium
