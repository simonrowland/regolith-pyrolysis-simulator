          calorimeter: Setaram HT1500 operated in step-scanning mode
          detector: upper thermopile around alumina sample crucible with Pt inner crucible; lower thermopile around alumina reference crucible
          sample_container: snugly fitting Pt crucible with Pt-foil lid
          reference_container: alumina crucible half-filled with dried corundum powder
          sample_mass_g: 1.30602
          reference_mass_g: 0.94967
          separate_crucibles: approximately 2 g each and within 0.05 g of one another
          furnace: graphite furnace; detector centered in approximately 10 cm isothermal zone
          temperature_uniformity_K: less_than_2
          thermocouple: Pt-60-percent-Rh/Pt-30-percent-Rh next to sample crucible
          temperature_calibration: thermocouple calibration checked by melting Au at 1337 K
          data_acquisition: Keithley 181 nanovoltmeter with National Instruments IEEE-488 interface
          scanning_outside_melting: ten alternating heating and cooling steps at 1 K/min for 5 min, each followed by 20 min isothermal interval
          scanning_inside_melting: ten continuous heating steps at 1 K/min for 5 min, each followed by 20 min isothermal interval
          temperature_equilibration: sample reached within 0.5 K of final temperature in 1-2 min after heating; detector typically required about 20 min
