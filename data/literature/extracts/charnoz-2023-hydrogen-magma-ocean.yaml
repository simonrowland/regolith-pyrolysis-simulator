source:
  citation: >-
    Charnoz, S., Falco, A., Tremblin, P., Sossi, P., Caracas, R. & Lagage, P.-O.
    (2023), "The effect of a small amount of hydrogen in the atmosphere of ultrahot
    magma-ocean planets: Atmospheric composition and escape", Astronomy & Astrophysics
    674:A224.
  doi: 10.1051/0004-6361/202245763
  url: https://doi.org/10.1051/0004-6361/202245763
  year: 2023
extraction:
  method: >-
    Manual transcription from the 15-page born-digital PDF using pdftotext -layout;
    printed table cells, equations, bounds, ranges, and figure-caption conditions retained.
    Plotted curves were not digitized.
  date: '2026-09-20'
  worker: i1-charnoz-2023-hydrogen-magma-ocean
  source_pdf: /Users/simonrowland/Repos/regolith-corpus/raw/charnoz-2023-hydrogen-magma-ocean/charnoz-2023-hydrogen-magma-ocean.pdf
review_status: draft
species: {}
evidence_policy:
  classification: model_derived_and_compilation_assessed
  measurement_claim: >-
    No new laboratory measurements or apparatus runs are reported. The paper is a
    chemical-equilibrium and atmospheric-escape modelling study; cited observations,
    catalog values, and comparisons remain attributed or compiled evidence.
  model_generators:
  - authors' coupled vapor-liquid equilibrium model
  - CEA/NASA chemical-equilibrium code (Gordon & McBride 1996)
  - VapoRock activity-coefficient outputs (Wolf et al. 2023)
  - JANAF thermochemical data (Chase 1998)
  - VASP density-functional-theory molecular-dynamics comparison
  - energy-limited atmospheric-escape scaling following Salz et al. (2016)
  missing_values: >-
    No sample mass, crucible, cell/orifice geometry, exposed area, vacuum, pumping,
    gas-flow, temperature calibration, fO2-control apparatus, or experimental run
    duration is stated because this source contains no laboratory experiment.
  figure_policy: >-
    Figures 3-15 and Appendices A-B are retained as qualitative figure-only records
    or caption conditions; numeric curve values were not read off or invented.
model_tables:
- table: '1'
  locator: {published_page: 5, pdf_page_index: 5, table: '1'}
  classification: model_derived
  values:
    method_class: model_derived
    generator: JANAF equilibrium constants and the authors' coupled magma-ocean model
    quantity: liquid_gas_vaporization_reaction_inventory
    rows_as_printed:
    - {number: 1, reactants: 'SiO2(l)', vapor: 'SiO(g) + 1/2O2', s: 1/2, reference: 'Chase (1998)'}
    - {number: 2, reactants: 'SiO2(l)', vapor: 'SiO2(g)', s: 0, reference: 'Chase (1998)'}
    - {number: 3, reactants: 'NaO1/2(l)', vapor: 'Na(g) + 1/4O2', s: 1/4, reference: 'Chase (1998)'}
    - {number: 4, reactants: 'KO1/2(l)', vapor: 'K(g) + 1/4O2', s: 1/4, reference: 'Chase (1998)'}
    - {number: 5, reactants: 'MgO(l)', vapor: 'Mg(g) + 1/2O2', s: 1/2, reference: 'Chase (1998)'}
    - {number: 6, reactants: 'FeO(l)', vapor: 'Fe(g) + 1/2O2', s: 1/2, reference: 'Chase (1998)'}
    note: NaO1/2 and KO1/2 are oxide-normalized forms; their melt mole fractions are Na2O and K2O.
- table: '2'
  locator: {published_page: 6, pdf_page_index: 6, table: '2'}
  classification: compilation_assessed
  values:
    method_class: compilation_assessed
    generator: BSE composition attributed to Palme & O'Neill (2014), used as fixed model input
    quantity: BSE_magma_ocean_composition
    units: molar fraction
    rows_as_printed:
    - {oxide: MgO, molar_fraction: 0.468}
    - {oxide: SiO2, molar_fraction: 0.388}
    - {oxide: FeO, molar_fraction: 0.0579}
    - {oxide: Na1O1/2, molar_fraction: 0.00578}
    - {oxide: K1O1/2, molar_fraction: '3.42 × 10−4'}
model_conditions:
- locator: {published_page: 5, pdf_page_index: 5, section: '3. Full model method calculation'}
  classification: model_derived
  values:
    method_class: model_derived
    generator: authors' coupled vapor-liquid equilibrium model with CEA/NASA
    quantity: model_setup
    liquid_components: [SiO2(l), MgO(l), FeO(l), Na2O(l), K2O(l)]
    magma_ocean: infinite_fixed_composition
    hydrogen_state: all H remains in vapor; H2 and H2O dissolution excluded
    equilibrium_constraints: [liquid_gas_equilibrium, oxygen_mass_conservation, hydrogen_mass_conservation]
    activity_model: 'a(liquid j) = Xj × Γj; Γj interpolated from VapoRock'
- locator: {published_page: 6, pdf_page_index: 6, section: '3.2. Constitutive equations'}
  classification: model_derived
  values:
    method_class: model_derived
    generator: CEA/NASA coupled to the authors' liquid-vapor model
    quantity: numerical_solution_conditions
    temperature_range_K: '1800–3500'
    total_hydrogen_pressure_range_bar: '10−6–10^6'
    pressure_limit_note: '>1 Mbar metallic hydrogen beyond scope; ideal-gas breakdown estimated above ~10^3–10^4 bar'
    relative_accuracy_each_partial_pressure: 'better than 10−3'
    fiducial_temperatures_K: [1800, 2000, 3000, 3400]
    included_CEA_species: 'Fe, FeO, H, H2, H2O, H2O2, HO2, K, K2, K2O, K2O2, K2O2H2, KH, KNa, KO, KOH, Mg, Mg2, MgH, MgO, MgOH, Na, Na2, Na2O, Na2O2, Na2O2H2, NaH, NaO, NaOH, O, O2, O3, OH, Si, Si2, Si3, SiH, SiH2, SiH3, SiH4, SiO, SiO2'
- locator: {published_page: 6, pdf_page_index: 6, section: '3.4. Validation against molecular dynamics calculations'}
  classification: model_derived
  values:
    method_class: model_derived
    generator: VASP ab initio molecular dynamics with PBE generalized-gradient approximation
    quantity: molecular_dynamics_validation_setup
    temperature_K: 3000
    density_g_cm3: 0.4
    initial_configurations: 5
    simulation_duration_ps: '50–136'
    timestep_fs: 2
    pyrolite_composition_as_printed: '1/2Na2O·2CaO·3/2Al2O3·4FeO·30MgO·24SiO2'
    main_vapor_components: [SiO, FeO2, Na, O2, Mg, FeO, O, SiO2]
    discrepancy: FeO2 appears in the ab initio vapor but is absent from the thermodynamic model
