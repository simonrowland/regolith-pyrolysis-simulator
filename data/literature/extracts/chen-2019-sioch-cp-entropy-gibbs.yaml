source:
  citation: Chen, J., Li, L., Li, J., Sun, J., Zhang, H. & Li, X. (2019), “Heat capacities, entropies, and Gibbs free energies
    of formation of low-k amorphous Si(O)CH dielectric films and implications for stability during processing”, Journal of
    Chemical Thermodynamics 128, 320–335.
  doi: 10.1016/j.jct.2018.08.026
  year: 2019
extraction:
  method: mineru_table_draft transcription from born-digital tables, checked against pdftotext layout and rendered table layouts
  date: '2026-10-20'
  worker: fam30-1020
  source_note: Tables 5-12 are measured molar heat-capacity tables; every printed numeric Cp point is retained in its printed
    unit and precision. Tables 1-3 and residual Table 4 values, plus model-derived Tables 13-21, are retained in context; numeric grids are transcribed in this extract. Figures 1-4 are retained as deferred figure records without numeric points.
review_status: draft
notes:
- text: Table 1 identifies eight whole-film samples. Each Cp observation binds values.sample_id to the table sample number;
    these are sample labels, not chemical formulae. The samples are amorphous bulk films. Atom-percent composition is retained
    as printed in table drafts and is not reconstructed into oxides.
  locator:
    page: 3
    pdf_page_index: 2
    table: '1'
- text: The measured PPMS pressure was 1.2 mPa (0.0012 Pa), with stated standard uncertainty 0.1 mPa; every table 5-12 CP
    point is measured under this pressure. Temperature uncertainty is 4 mK; Cp standard uncertainty is 5% below 20 K and 2%
    at/above 20 K.
  locator:
    page: 4
    pdf_page_index: 3
    table: '5'
    note: The table footnotes are repeated on Tables 5-12.
