      - observation_id: shornikov_2021_model_qualifications
        type: thermodynamic_example
        locator:
          page: 69
          published_page: 69
          pdf_page_index: 4
          section: Results and discussion
        units: as printed
        values:
          quantity: model_results_and_qualifications
          method_class: model_derived
          reported_mixing_energy_range_as_printed: "−10 to −25 kJ/mol"
          reported_temperature_span_as_printed: 1873–2273 K
          statements_as_reported:
            - Fig. 2 results show discrepancies between obtained FeO activity results.
            - The article reports no satisfactory agreement between experimental oxide activities in ternary melts and values for the MgO–SiO2 and FeO–SiO2 boundary melts.
            - The article characterizes the available thermodynamic information as varied.
            - Present-study MgO activity calculations at significant FeO concentration correspond satisfactorily to Wu et al. (1993), Bjorkvall et al. (2000), and Costa et al. (2017), but large discrepancies occur in the forsterite region (Fig. 3e).
            - Experimental and theoretical FeO activities correspond except the Bjorkvall et al. (2000) calculations, which show significant positive deviations from ideality (Fig. 3b and f).
            - SiO2 activities in the presented cross sections and the present calculations differ approximately 3 times from Wu et al. (1993) and Bjorkvall et al. (2000), whose values do not quite correspond to accepted boundary-melt values.
            - The observed discrepancies are probably due to low mixing-energy values in the MgSiO3–FeSiO3 and Mg2SiO2–Fe2SiO4 melts.
            - Mixing energies are described as practically unchanged at 1873–2273 K, indicating melt behavior close to ideal.
            - The conclusion states that calculated oxide activities in MgO–FeO–SiO2 melts at 1800–2400 K satisfactorily correspond to available physicochemical experimental and theoretical data.
          uncertainty_as_reported: No numerical uncertainty, confidence interval, or error bars are reported for the present calculations.
