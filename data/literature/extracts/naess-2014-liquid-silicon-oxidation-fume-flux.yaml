        temperature_as_printed: not stated
        axes_as_printed: not applicable (mechanism sketch)
        caption_as_printed: 'Sketch of suggested molecular mechanism for the active oxidation of liquid silicon.
          The boundary layer of SiO(g) is one order of magnitude thinner that the O2(g) boundary layer. The gas
          velocity will affect the O2(g) boundary layer, but not the SiO(g) boundary layer. When the oxygen travels
          through the SiO(g) boundary layer, there are two possible paths: (1) it meets an outgoing SiO(g) molecule
          and reacts to become an SiO2(g) molecule and an O*radical, which further will (a) react with the Si surface
          and make a new SiO(g) molecule, or (b) react with a SiO(g) molecule to form more SiO2(g). (2) it reacts
          directly with the Si(l) surface to form two SiO(g) molecules which are oxidized to SiO2(g)'
        panel: whole figure
        series:
        - name: captioned reaction path 1
          marker_count: 0
          attribution: present study
        - name: captioned reaction path 2
          marker_count: 0
          attribution: present study
        attribution: present study
