source_notes:
  table2_full_cell_audit: The per-cell comparison is in the task notes audit CSV. The generic Albite row differs
    from the CHNOSZ row named albite for delta_fG (printed -3703.293; aid -3711.715 kJ/mol), delta_fH (printed
    -3921.618; aid -3935.100 kJ/mol), and S (printed 224.412; aid 207.443 J/(mol K)). The printed values are
    retained; they align with the separate low-Albite row in the aid. The four fluid rows are absent from the
    CHNOSZ transcription, so their printed values are used.
  CHNOSZ_aid: Third-party CHNOSZ transcription, 67 rows; energies stored in J/mol while Table 2 prints kJ/mol. The
    printed tables remain authoritative. CHNOSZ uses an extended winTWQ Cp representation with k4-k6 zero; these
    are aid-side extension fields and are not added to the printed four-term parameter set.
  Benson_Helgeson_convention: At the reference state only, apparent G equals delta_fG. No delta_fG is emitted at
    other temperatures.
  Cp_range_semantics: Table 3a Range (K) intervals are retained as source-data intervals, not asserted as an equation
    validity envelope. The paper cautions against use below the lowest data temperature, usually about 250 K.
  MELTS_lineage: alphaMELTS and ThermoEngine are MELTS-family engines whose solid-phase properties share the Berman
    1988 parameter lineage. This is a provenance label, not a scoring gate.
  corpus_assets: The source PDF is a 300 dpi scan with OCR. No MinerU markdown was present in the source corpus
    paths at extraction time; pdftotext and rendered table pages were used.
