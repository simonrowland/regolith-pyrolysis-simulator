        locator:
          page: 20
          published_page: 274
          pdf_page_index: 19
          table: '3'
          note: >-
            Four compiled diffusion rows. Rendered at 600 dpi: D0 values are 1.98×10^-5, 1.56×10^-5,
            1.55×10^-4, and 3.7×10^-6 m2/s; E values are 173±27, 172±27, 201±25, and 176±2 kJ/mol;
            A values are 168, 168, 177, and 184 kJ/mol; printed temperature ranges are 1350–1500,
            1350–1500, 1294–1398, and 1320–1600 °C. The row sources are LaTourrette et al. (1996),
            Lowry et al. (1982), and Lesher et al. (1996), as marked in the table. Candidate token:
            none; the store has no self-diffusion-coefficient token.
        units: printed units
        values:
          quantity: compiled_self_diffusion_and_viscous_flow_inputs
          method_class: quoted_attributed
