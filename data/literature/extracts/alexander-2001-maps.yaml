schema_version: literature_extract.v1
source_id: alexander-2001-maps
source:
  citation: >-
    Alexander, C. M. O'D. (2001). "Exploration of quantitative kinetic models for the evaporation of silicate melts in vacuum and in hydrogen." Meteoritics & Planetary Science 36, 255–283.
  doi: 10.1111/j.1945-5100.2001.tb01870.x
  year: 2001
extraction:
  method: >-
    MinerU table draft (four tables) and OCR Markdown; source PDF checked against pdfinfo and a 600 dpi first-page render. The paper develops and compares PCR/EQR kinetic models against experiments reported by Hashimoto, Wang, Davis, Yu and Hewins, Floss, Grossman, and Parsad. Figures 1–18 contain the plotted data/model comparisons and are deferred to a figure pass; no points were digitised. Tables 1, 2, and A1 report model inputs or fitted coefficients, not independent measurements. Table 3 compiles diffusion inputs from cited works; diffusion coefficient has no store token, so the table is retained as context. No measured melt-activity series is reported.
  date: '2026-10-20'
  worker: fam35-1021
review_status: draft
species:
  SiO2:
    observations: []
    context:
      - observation_id: alexander_2001_table3_diffusion_data_context
