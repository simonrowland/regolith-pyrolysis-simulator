source:
  citation: Carrillo-Sánchez, J. D., Bones, D. L., Douglas, K. M., Flynn, G. J., Wirick, S., Fegley, B. Jr., Araki, T., Kaulich,
    B. & Plane, J. M. C. (2020), "Injection of meteoric phosphorus into planetary atmospheres", Planetary and Space Science
    187, 104926.
  doi: 10.1016/j.pss.2020.104926
  url: https://doi.org/10.1016/j.pss.2020.104926
  year: 2020
extraction:
  method: Manual transcription from MinerU table HTML and machine text. Table 3 row and column assignments were checked against
    the rendered PDF page. PDF renders were checked for the prose measurement summary on page 9 and MASI conditions on page
    3. No plotted curve points were digitized.
  date: '2026-11-03'
  worker: w1103cw3-cs20
  provenance_path: raw/carrillo-sanchez-2020-phosphorus-ablation/carrillo-sanchez-2020-phosphorus-ablation.pdf
review_status: draft
evidence_policy:
  classification: mixed
  measurement_claim: MASI measured normalized PO and Ca laser-induced fluorescence profiles. The only numerical MASI release
    result stated in text is the PO peak-temperature interval for Allende particles with radius above 19 μm. No numerical
    MASI mass-loss series or post-ablation residue P content is tabulated in the article; the profile data are plotted and
    were not digitized.
  model_generator: >-
    Table 3 reports CABMOD-ZoDy global phosphorus fluxes and planetary ablation efficiencies. The 48 P/PO/PO2
    flux cells remain quoted_attributed typed refusals under d-110 because model inputs are not stored. The twelve
    parenthetical phosphorus-ablation efficiencies and six total cosmic-dust mass rates are model_derived context;
    they are not furnace pyrolysis yields or elemental-P influx comparison points.
  missing_values: The article gives a linear temperature-ramp form but no numerical heating rate. It states about 15 Pa in
    N2 for MASI, but gives no experimental fO2. Table 3 does not print an experimental temperature, total pressure, fO2, or
    per-row composition for its integrated planetary model outputs.
  figure_policy: Figures 3 and 6 contain normalized PO and Ca LIF curves; Figures 4 and 5 contain measured MASI points mixed
    with model predictions. None were digitized. The curve and point series remain figure-read candidates.
  scope_note: Table 1 is XANES phosphorus speciation, not ablation release data. Table 2 contains thermodynamic/model inputs.
    Neither supplies measured MASI mass loss or residue P content. Supporting Information containing individual MASI profiles
    was not present in the available corpus or supporting-source tree.
