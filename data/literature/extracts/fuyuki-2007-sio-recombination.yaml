source:
  citation: 'Fuyuki, M., Sugita, S., Kadono, T., Hasegawa, S. & Matsui, T. (2007), “Spectroscopic measurements of Si-O recombination process in laser-induced quartz vapor plumes”, Earth, Planets and Space 59:437–451.'
  doi: 10.1186/BF03352705
  year: 2007
extraction:
  method: >-
    Manual extraction from the born-digital pdftotext-layout source. The table tool
    accepts MinerU content-list tables and refuses pdftotext-only tables, so Table 1
    was transcribed by hand and every numeric and N/A cell was checked against a
    600 dpi render of PDF page 13. Figures 1–14 are recorded without numeric points
    as required for this figure-deferred pass. Unsupported measured and calculated
    quantities are preserved in context rather than assigned an unrelated token.
  date: '2026-10-18'
  worker: fam4-1018
  provenance_path: raw/fuyuki-2007-sio-recombination/fuyuki-2007-sio-recombination.pdf
