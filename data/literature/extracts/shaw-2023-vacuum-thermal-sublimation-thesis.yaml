source_id: shaw-2023-vacuum-thermal-sublimation-thesis
source:
  citation: Shaw, Matthew (2023), "Vacuum Thermal Sublimation for Metal Production from Lunar Regolith", PhD thesis, Swinburne University of Technology.
  doi: 10.25916/sut.26297335.v1
  url: https://ndownloader.figshare.com/files/47665792
  year: 2023
extraction:
  method: >-
    Manual extraction from the source PDF. Chapter 8 Table 8.1 (PDF p. 227 / printed p. 203),
    Chapter 8 Table 8.2 (PDF p. 242 / printed p. 218), and Chapter 7 Table 7.5 (PDF p. 206 /
    printed p. 182) were rendered with pdftoppm at 300 dpi and transcribed from the images.
    Each table was transcribed independently by rows and by columns, then compared; no differing
    cells remained. Table 7.5 is retained as an author-calculated table: FactSage 8.2 vapour
    pressures passed through the vacuum Hertz/Knudsen/Langmuir equation with evaporation
    coefficient 1. Chapter 8 prose was read for apparatus, method, and run findings. The table
    of contents and lists of tables and figures were used to identify chapter 7-8 material not
    extracted here. Numeric error bounds and the mass-balance instrument resolution are not
    reported for Chapter 8.
  date: '2026-10-11'
  worker: shaw23
review_status: draft
corrections: []
