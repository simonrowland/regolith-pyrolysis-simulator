          - [K2O, '0.0023700227669609']
          - [P2O5, '0.0015727895366566']
          - [Cr2O3, '0.0007344130916787']
          - [SO3, '0.0341601612314651']
      locator: {pdf_page_index: 9, table: '3', note: 'Derived from the printed CI XRF oxide wt% map; FeOT is represented as FeO equivalent; SO3 retained.'}
      method_class: calculated
      inference:
        relation: wt_pct_to_mole_fraction
        inputs:
        - 'printed CI XRF oxide wt% map in sample.printed_composition; FeOT treated as FeO equivalent'
        - 'x_i = (w_i / M_i) / sum_j(w_j / M_j)'
        output_unit: mole_fraction
  pressure_environment:
    total_pressure_Pa:
      state: {tag: value, value: {kind: point, point: '3000'}}
      locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: 30-mbar helium atmosphere; unit conversion only}
    sweep_gas:
      state:
        tag: value
        value:
          species: Helium
          flow_sccm: {tag: value, value: '10'}
          partial_pressure_Pa: {tag: unknown, reason: not_published}
      locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: Helium flow 10 sccm}
    regime:
      regime_class: {tag: unknown, reason: not_published}
  conditions:
    temperature_K:
      state: {tag: unknown, reason: not_numeric}
      locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: Starts at ambient; no numerical start temperature printed}
  thermal_schedule:
    method:
      state: {tag: value, value: Heated from ambient to 1000 C at 35 C/min under 10 sccm helium}
      locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis}
    ramps:
    - rate_K_s:
        state: {tag: value, value: {kind: point, point: '0.5833333333333333333333333333'}}
        locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: 'Printed 35 C/min; unit conversion only.'}
    total_duration_s:
      state: {tag: unknown, reason: not_published}
      locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: Heating rate and ambient start are printed, but no duration is stated}
