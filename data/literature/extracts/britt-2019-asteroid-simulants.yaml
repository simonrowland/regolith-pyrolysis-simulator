schema_version: literature_extract.v1
source_id: britt-2019-asteroid-simulants
source:
  citation: Britt, D. T., Cannon, K. M., Donaldson Hanna, K., Hogancamp, J., Poch, O., Beck, P., Martin, D., Escrig, J., Bonal, L. & Metzger, P. T. (2019), "Simulated asteroid materials based on carbonaceous chondrite mineralogies", Meteoritics & Planetary Science 54, 2067-2082.
  doi: 10.1111/maps.13345
  year: 2019
extraction:
  method: pdftotext -layout transcription of the clean text-layer corpus PDF; PDF pages 5, 7, 9 and 11-12 read for recipes, characterization, XRF composition and TG/EGA measurements. Figure 6 curves were not digitized.
  date: '2026-09-19'
  worker: extract-britt-2019-asteroid-simulants
  provenance_path: raw/britt-2019-asteroid-simulants/britt-2019-asteroid-simulants.pdf
review_status: draft
corrections: []
benches:
- id: labsys-evo-thermostar
  identity: {basis: described_in_this_work}
  apparatus_family:
    state: {tag: value, value: Differential scanning calorimeter and thermal gravimeter with quadrupole mass spectrometer}
    locator: &tga_locator {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: Labsys EVO DSC/TG connected to ThermoStar quadrupole mass spectrometer}
  heating_method:
    state: {tag: value, value: Labsys EVO differential scanning calorimeter/thermal gravimeter}
    locator: *tga_locator
  detector:
    state: {tag: value, value: ThermoStar quadrupole mass spectrometer}
    locator: *tga_locator
experiments:
- experiment_id: tga-ega-ci
  bench_id: labsys-evo-thermostar
  method: thermogravimetry_evolved_gas_analysis
  locator: {pdf_page_index: 11, section: Thermogravimetry and Evolved Gas Analysis, note: CI, CM, and CR prototype simulants measured at NASA JSC ARES}
  sample:
    printed_composition:
      state:
        tag: value
        value: {SiO2: 25.0, TiO2: 0.5, Al2O3: 3.1, FeOT: 25.8, MnO: 0.3, MgO: 30.2, CaO: 3.0, Na2O: 6.4, K2O: 0.4, P2O5: 0.4, Cr2O3: 0.2, SO3: 4.9}
      locator: {pdf_page_index: 9, table: '3', note: 'CI Simulant column; XRF major-element bulk oxide wt% as printed; FeOT and SO3 retained as printed; Table 2 mineral-recipe wt% is not the sample bulk analysis'}
    initial_composition:
      state:
        tag: value
        value:
          basis: printed_oxides
          amount_basis: mole_fraction
          components:
          - [SiO2, '0.2322263749183867']
          - [TiO2, '0.0034941106327481']
          - [Al2O3, '0.0169689387665278']
          - [FeO, '0.2004252090267317']
          - [MnO, '0.0023603223079137']
          - [MgO, '0.4181979852952432']
