species:
  asteroid_simulants:
    observations:
    - observation_id: britt_2019_table2_prototype_recipes
      type: gibbs_table
      locator:
        pdf_page_index: 5
        table: '2'
        note: Initial prototype mineral recipes and suggested future updates; all values wt% as printed.
      phase: CI_CM_CR_asteroid_simulant_prototypes
      standard_state: prototype recipe mass fraction as printed
      regime: simulant_characterisation
      units: wt% as printed
      values:
        quantity: prototype_mineral_recipe
        method_class: measured_direct
        evidence_class: authors_own_recipe
        recipes:
          CI_prototype:
            Mg-serpentine: 48.0
            Epsomite: 6.0
            Magnetite: 13.5
            Palygorskite: 5.0
            Olivine: 7.0
            Pyrite: 6.5
            Vermiculite: 9.0
            Coal: 5.0
          CM_prototype:
            Mg-serpentine: 72.5
            Magnetite: 10.4
            Olivine: 7.8
            Pyrite: 2.6
            Coal: 3.6
            Pyroxene: 2.1
            Siderite: 1.0
          CR_prototype:
            Mg-serpentine: 9.2
            Magnetite: 14.3
            Olivine: 33.7
            Pyrite: 4.1
            Coal: 2.0
            Pyroxene: 31.6
            Iron metal: 4.6
            Nickel metal: 0.5
        note: The table also prints future-update recipes; they are retained only as quoted recipe data, not treated as measurements of the prototype samples.
    - observation_id: britt_2019_tga_ega_thermal_program
      type: rate_series
      locator:
        pdf_page_index: 11
        section: Thermogravimetry and Evolved Gas Analysis
        figure: '6'
        note: TG/EGA method paragraph; Labsys EVO DSC/TG connected to ThermoStar quadrupole mass spectrometer.
      T_range_K:
      - 273.15
      - 1273.15
      phase: CI_CM_CR_asteroid_simulant_prototypes
      standard_state: TG/EGA run conditions as printed
      regime: tga_ega_flowing_helium
      units: °C, °C min^-1, sccm, mbar and m/z as printed
      values:
        quantity: tga_ega_experimental_conditions
        method_class: measured_direct
        evidence_class: authors_own_experiment
        instrument: Labsys EVO differential scanning calorimeter/thermal gravimeter with ThermoStar quadrupole mass spectrometer
        atmosphere_as_printed: helium
        pressure_mbar_as_printed: 30
        ramp_C_per_min_as_printed: 35
        T_start_C_as_printed: ambient
        T_end_C_as_printed: 1000
        flow_rate_sccm_as_printed: 10
        monitored_species:
        - gas_species: H2O
          mz_as_printed: 18
        - gas_species: C3H3
          mz_as_printed: 39
        - gas_species: CO2
          mz_as_printed: 44
        - gas_species: SO2
          mz_as_printed: 64
        sample_mass: not_printed
        crucible_or_container: not_printed
        temperature_measurement_and_calibration: not_printed
        vacuum_or_pumping: not_applicable; 30-mbar He atmosphere was used
        run_duration: not_printed
      uncertainty:
        note: No numerical uncertainty is printed for the TG/EGA conditions or total integrated mass losses.
    - observation_id: britt_2019_tga_ega_release_patterns
      type: rate_series
      locator:
        pdf_page_index: 11
        section: Thermogravimetry and Evolved Gas Analysis
        figure: '6b-d'
        note: Text description of the measured EGA traces; curves were not digitized.
      phase: CI_CM_CR_asteroid_simulant_prototypes
      standard_state: qualitative temperature-dependent EGA release pattern as printed
      regime: tga_ega_flowing_helium
      units: temperature intervals in °C and mass-spectrometer channels m/z as printed
      values:
        quantity: evolved_gas_release_pattern
        method_class: measured_qualitative_from_text_and_figure
        evidence_class: authors_own_measurement
        figure_only_data_status: curves not digitized; no point values inferred
        H2O:
          mz_as_printed: 18
          release_pattern_as_printed: distinct releases at both low and high temperatures
        C3H3:
          mz_as_printed: 39
          release_temperature_as_printed: around 530 °C in all simulants
        CO2:
          mz_as_printed: 44
          release_temperature_as_printed: multiple overlapping releases between 500 and 850 °C; rise toward 1000 °C; minor release around 400 °C in CR simulant
        SO2:
          mz_as_printed: 64
          release_temperature_as_printed: minor releases from 450 to 900 °C; more complex pattern in CI simulant
      uncertainty:
        note: No numerical uncertainty is printed; temperature descriptions are retained as ranges or approximate wording.
  CI_Asteroid_Simulant:
    observations:
    - observation_id: britt_2019_ci_table3_xrf_major_oxide_composition
