extraction:
  method: Table 1 was transcribed from the two OCR-redo Tesseract reads and resolved cell by cell against the 600
    dpi render. Tables 2-5 were reconciled from the MinerU cell drafts and pdftotext, with every stored numeric
    cell checked against its 600 dpi page render.
  date: '2026-11-02'
  worker: w1103kc-kc89
  provenance_path: raw/kress-carmichael-1989-lime-iron-silicate-redox/kress-carmichael-1989-lime-iron-silicate-redox.pdf
  row_count_note: Table 1 prints 52 experimental rows. Table 3 prints 51 sample rows plus E.S.D.; Table 5 prints
    16 comparator rows plus Mean and E.S.D.
  quench_note: Table 1 measurements are retained as quenched glass results under the source's statement that only
    completely glass-quenched results are considered. Per-run assignment of liquid-Hg versus distilled-water quench
    is not printed.
  pressure_note: The paper does not report total experimental pressure for Table 1. No total-pressure value is inferred.
    Table 1 prints a bare log(fO2) and does not print a pressure reference.
