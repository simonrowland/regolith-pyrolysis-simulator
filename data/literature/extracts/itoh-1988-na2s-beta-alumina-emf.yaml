experiments:
  itoh_1988_na2s_emf_cell:
    method: emf
    method_as_printed: Open-circuit EMF measurement with beta-alumina solid electrolyte
    locator:
      page: 1
      pdf_page_index: 0
      published_page: 1395
      section: 2. Experimental procedure
    cell_as_printed: 'Cell I: Na(l)|β″-alumina|Na2S + Ag2S + Ag'
    reaction_as_printed: ½Ag2S(s) + Na(l) ↔ ½Na2S(s) + Ag(s)
    electrolyte_as_printed: β″-alumina crucible
    reference_electrode_as_printed: Na(l); 3N sodium; 3×10^-3 kg
    temperature_range_K_as_printed: 463.4 to 843.7 K
    sample_molar_ratio_by_run:
      '1': Ag:Ag2S:Na2S = 1.00:1.00:1.00
      '2': Ag:Ag2S:Na2S = 3.00:3.00:1.00
    atmosphere_as_printed: The evacuated system was backfilled with purified argon.
    conditions:
      total_pressure_Pa:
        state:
          tag: unknown
          reason: not_published
        locator:
          page: 1
          pdf_page_index: 0
          published_page: 1395
          section: 2. Experimental procedure
          note: The source reports evacuation and argon backfill but gives no total pressure.
      fO2_log:
        state:
          tag: unknown
          reason: not_published
        locator:
          page: 1
          pdf_page_index: 0
          published_page: 1395
          section: 2. Experimental procedure
          note: Purified argon is named but no oxygen fugacity or gas ratio is printed.
      temperature_K:
        state:
          tag: unknown
          reason: varies_by_table_row
        locator:
          page: 2
          published_page: 1396
          pdf_page_index: 1
          table: I
          note: Every Table I measurement prints its temperature in column T(K); row-level values are carried on each observation.
    fit_forms:
      itoh_1988_eq3_emf_fit: E/V(±0.00057) = 1.75793(±0.00086) − 4.452(±0.014)×10^-4(T); 463.4 < T < 737.7 K
      itoh_1988_eq4_exchange_gibbs_fit: ΔG(J ± 55) = −169613(±83) + 42.95(±0.13)(T)
      itoh_1988_eq7_na2s_delta_fg_fit: ΔG°_Na2S(J mol^-1 ± 130) = −427940(±200) + 124.92(±0.32)(T); 463.4 < T < 737.7 K
      itoh_1988_eq8_reference_na2s_delta_fg_fit: ΔG°_Na2S(J mol^-1) = −441729 + 145.44(T); 500 < T < 700 K
    sample_molar_ratio_locator:
      page: 1
      published_page: 1395
      pdf_page_index: 0
      section: 2. Experimental procedure
    equilibrium_criterion_as_printed: Equilibrium EMF remained within ±0.1 mV for longer than 8 ksec at constant temperature.
    emf_correction_as_printed: EMF values were corrected for thermoelectromotive force between the leads.
    phase_note: The paper estimates a 738 ± 5 K eutectic; it reports appearance of a liquid sulphide phase above 738 K. The sample phase is recorded
      as cr at or below 738 K and l above 738 K.
