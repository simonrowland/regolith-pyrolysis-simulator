    - observation_id: sf18_speciation_Li2O
      type: activity_coefficient
      locator:
        note: 'SF18-T1 p.404: Li ~ Li2O > LiO > Li3O, Li2O2 over Li2O, 1000–1700 K;

          primary review LH84 (closure §2.4).

          '
        section: SF18-T1 / speciation ordering
      phase: gas_over_oxide
      units: dimensionless ordering (not a numeric gamma)
      values: &id001
        speciation_note: 'SF18-T1 p.404 (Kimura et al. 1980; LH84): Li ~ Li2O > LiO > Li3O, Li2O2.

          Li is least-volatile alkali in ferrobasalt evaporation (SF18-T3 p.424).

          '
        semantics: bound_not_point_ordering
