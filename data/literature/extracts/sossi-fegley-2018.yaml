        semantics: bound_not_point_ordering
  As4O6:
    observations:
    - observation_id: sf18_speciation_As4O6
      type: activity_coefficient
      locator:
        note: 'SF18-T1 p.402: As4O6 ≫ As4O5, As4O4, As2O3, AsO over As2O3(s,l),

          367–1700 K; Behrens & Rosenblatt 1972; Brittain et al. 1982.

          We carry As2O3 forms only — a minor member.

          '
        section: SF18-T1 / speciation ordering
      phase: gas_over_oxide
      units: dimensionless ordering (not a numeric gamma)
      values:
        speciation_note: Dominant gas is As4O6; As2O3(g) is a minor member (SF18-T1 p.402)
        semantics: bound_not_point_ordering
  Sb4O6:
    observations:
    - observation_id: sf18_speciation_Sb4O6
      type: activity_coefficient
      locator:
        note: 'SF18-T1 p.405: Sb4O6 dominant over Sb2O3(s,l), 580–1073 K;

          Hincke 1930; Behrens & Rosenblatt 1973; Semenov et al. 1983.

          We carry Sb2O3, not the tetramer.

          '
        section: SF18-T1 / speciation ordering
      phase: gas_over_oxide
      units: dimensionless ordering (not a numeric gamma)
      values:
        speciation_note: Sb4O6 (+ Sb4O5, Sb3O4, Sb2O2, SbO); congruent associative (SF18-T1 p.405)
        semantics: bound_not_point_ordering
  VO_VO2:
    observations:
    - observation_id: sf18_speciation_VO_VO2
      type: activity_coefficient
      locator:
        note: 'SF18-T1 p.407: VO dominant over VO(s) and V2O3; VO2 over V2O4;

          V4O10 over V2O5; 1003–2270 K. Berkowitz et al. 1957a; Farber et al.

          1972b; Frantseva & Semenov 1969.

          '
        section: SF18-T1 / speciation ordering
      phase: gas_over_oxide
      units: dimensionless ordering (not a numeric gamma)
      values:
        speciation_note: 'Over VO(s): VO(g) > V(g) > VO2(g) (Ban86; BIC57). VO2 becomes

          important over higher oxides (SF18-T1). V4O10 over V2O5 is a

          separate associative channel at lower T.

          '
        semantics: bound_not_point_ordering
