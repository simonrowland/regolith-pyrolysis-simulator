      locator:
        note: 'SF18-T1 p.404: Ga2O most abundant over Ga2O3(s), 1013–1841 K;

          Frosch & Thurmond 1962; Shchukarev et al. 1969; LH87 §2.2.h p.432.

          Ferrobasalt column lists GaO, Ga (SF18-T5) — regime-dependent.

          '
        section: SF18-T1 / speciation ordering
      phase: gas_over_oxide
      units: dimensionless ordering (not a numeric gamma)
      values:
        speciation_note: Ga2O ≫ Ga, GaO over pure Ga2O3 under reducing; ferrobasalt may shift to Ga/GaO
