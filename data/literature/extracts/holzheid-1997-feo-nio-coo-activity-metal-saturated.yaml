  FeO:
    observations:
    - observation_id: holzheid_1997_table2_page23_feo
      type: activity_coefficient
      locator: {page: 23, table: '2'}
      derived_from: [holzheid_1997_equilibrium_free_energy_fits]
      derivation:
        relation: authors' equilibrium-constant calculation from measured oxide mole fractions and log fO2
        inputs: [holzheid_1997_equilibrium_free_energy_fits]
        output_unit: dimensionless
      phase: silicate_melt
      standard_state:
        state:
          tag: value
          value:
            convention: raoultian_pure_endmember
            endmember:
              formula: Fe(1-x)O
              phase:
                tag: value
                value: l
              polymorph:
                tag: not_applicable
                reason: non-stoichiometric liquid wüstite has no crystalline polymorph
              charge:
                tag: unknown
                reason: non-stoichiometric Fe(1-x)O has no single fixed formal charge
            component_basis: Fe(1-x)O
            reference_pressure_bar: '1.01325'
        inferred: false
        note: >-
          The paper states verbatim: "For FeO we have chosen an "FeO"-wüstite(l) standard state." The reference is
          non-stoichiometric liquid wüstite Fe(1-x)O at 1 atm for Fe(s) + 1/2 O2(g) = "FeO"(l). The typed schema has
          no explicit non-stoichiometric liquid-wüstite convention; it preserves Fe(1-x)O and liquid phase in the
          closest Raoultian pure-endmember form and does not label the material stoichiometric FeO.
        locator:
          published_page: 31
          section: 4.1 Activity coefficients
      regime: experimental_melt_equilibration
      units: mole percent and dimensionless activity coefficient as printed
      values:
        method_class: model_derived
        quantity: activity_coefficient
        source_table_description: >-
          Table 2(a) AD FeNiCo-alloy subset and Table 2(b) BK Co,Ni subset. The paper says alloy experiments were
          recalculated to equilibria with 100% pure metals using literature alloy activity coefficients.
        composition_rule:
          AD: use the Table 1 AD starting composition (SiO2 50.9, CaO 24.9, MgO 10.4, Al2O3 13.8, FeO 0.0 wt.%);
            Table 2 labels the silicate anorthite-diopside and does not print additional oxide additions for these rows.
          BK: use the Table 1 BK starting composition (SiO2 49.1, CaO 19.2, MgO 10.6, Al2O3 14.1, FeO 7.0 wt.%);
            Table 2 labels the silicate komatiitic basalt and does not print additional oxide additions for these rows.
