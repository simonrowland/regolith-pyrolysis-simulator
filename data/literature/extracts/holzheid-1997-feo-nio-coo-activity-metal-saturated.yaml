schema_version: literature_extract.v1
source_id: holzheid-1997-feo-nio-coo-activity-metal-saturated
source:
  citation: Holzheid, A., Palme, H. & Chakraborty, S. (1997), "The activities of NiO, CoO and FeO in silicate melts", Chemical
    Geology 139, 21-38.
  doi: 10.1016/S0009-2541(97)00030-2
  year: 1997
source_tables:
  table_1:
    locator: {page: 22, table: '1'}
    title: Silicate starting compositions (electron microprobe analysis)
    columns: [oxide, wt.%, AD (anorthite-diopside), BK (komatiitic basalt)]
    footnotes: none printed
  table_2:
    locator: {pages: [23, 24, 25], table: '2'}
    title: Mole fraction and activity coefficients (γ) of metal oxides
    columns: [run, T (K), log fO2, XCoO, XFeO, XNiO, XFeO, γCoO, γNiO, "γ of ‘FeO’"]
    footnotes: no explanatory footnote is printed; the body prints the run label AD 14* without explanation
    scope_note: 57 FeO activity-coefficient experiments, identified by a printed γ of quoted FeO value
    FeO_row_counts_by_page: {23: 26, 24: 25, 25: 6}
    FeO_row_total: 57
  table_3:
    locator: {pages: [26, 27], table: '3'}
    title: Equilibration of metal and silicate melts with variable MgO-content
    columns:
      table_3a: [run, T (K), duration (h), log fO2, CoO (wt.%), CoO s.d. (%), MgO (wt.%), MgO s.d. (%), γCoO,
        run, T (K), duration (h), log fO2, NiO (wt.%), NiO s.d. (%), MgO (wt.%), MgO s.d. (%), γNiO]
      table_3b: [run, T (K), duration (h), log fO2, CoO (wt.%), CoO s.d. (%), NiO (wt.%), NiO s.d. (%), FeO (wt.%),
        FeO s.d. (%), MgO (wt.%), MgO s.d. (%), Co (wt.%), Co s.d. (%), Ni (wt.%), Ni s.d. (%), Fe (wt.%), Fe s.d. (%),
        γCoO, γNiO, "γ of ‘FeO’"]
      table_3c: [run, T (K), duration (h), log fO2, CoO (wt.%), CoO s.d. (%), FeO (wt.%), FeO s.d. (%), MgO (wt.%),
        MgO s.d. (%), Co (wt.%), Co s.d. (%), Fe (wt.%), Fe s.d. (%), γCoO, "γ of ‘FeO’"]
      table_3d: [run, T (K), duration (h), log fO2, NiO (wt.%), NiO s.d. (%), FeO (wt.%), FeO s.d. (%), MgO (wt.%),
        MgO s.d. (%), Ni (wt.%), Ni s.d. (%), Fe (wt.%), Fe s.d. (%), γNiO, "γ of ‘FeO’"]
    footnotes: none printed
    FeO_row_counts_by_page: {26: 7, 27: 8}
    FeO_row_total: 15
  FeO_activity_row_total: 72
  activity_calculation:
    locator: {page: 30, equation: '9'}
    reference_state_text: >-
      pure liquid Fe(1-x)O (the source's wüstite(l)); reference reaction Fe(s) + 1/2 O2(g) = "FeO"(l), corresponding Fe reaction in section 3;
      deltaG0 source O'Neill and Pownceby (1993) and Barin (1989)
    source_wording: The paper identifies the liquid "FeO" reference as wüstite(l); it contrasts this with stoichiometric
      FeO(l), whose activity coefficients are higher.
    calculation: >-
      The paper says the corresponding reaction for Fe was calculated from free energies of formation using thermodynamic
      data from O'Neill and Pownceby (1993) and Barin (1989). The Fe free-energy expression is ΔG("FeO"(l)) [J/mol] =
      -244118 + 115.559·T - 8.474·T·ln T (Eq. 9, T in K); it is used in Eq. 4 with log γFeO = log K - log XFeO +
      1/2·log fO2. The text states the oxide activity coefficients are relative to pure liquid oxide at 1 atm.
    typed_structure_limit: >-
      Typed standard_state can encode a Raoultian pure endmember and liquid phase, but it has no field for the liquid
      wüstite nonstoichiometry Fe(1-x)O; each FeO activity row also records that identity in standard_state text.
    conversion_factors_as_printed:
    - factor: 2.02
      temperature_C: 1300
      direction_and_wording: >-
        γFeO/γ"FeO" is the activity coefficient relative to stoichiometric FeO divided by the activity coefficient
        relative to wüstite; the ratio is 2.02 at 1300°C.
      locator: {page: 30, section: '4.1 Activity coefficients'}
    - factor: 1.94
      temperature_C: 1400
      direction_and_wording: >-
        Activity coefficients using a stoichiometric FeO(l) standard state are higher by a factor of 1.94 relative to
        the activity coefficients based on wüstite(l).
      locator: {page: 31, section: '4.1 Activity coefficients'}
    - factor: 1.66
      temperature_C: 1600
      direction_and_wording: >-
        γFeO/γ"FeO" is the activity coefficient relative to stoichiometric FeO divided by the activity coefficient
        relative to wüstite; the ratio is 1.66 at 1600°C.
      locator: {page: 30, section: '4.1 Activity coefficients'}
