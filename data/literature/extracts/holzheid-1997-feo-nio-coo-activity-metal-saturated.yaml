  NiO_activity_model:
    observations:
    - observation_id: holzheid_1997_equilibrium_free_energy_fits
      type: activity_coefficient
      locator:
        page: 29
        equations: 7-9
        section: 3. Calculation of activity coefficients
      phase: liquid_oxide_standard_state
      regime: thermodynamic_equilibrium_calculation
      units: J/mol, T in K, as printed
      values:
        method_class: model_derived
        generator: equilibrium-constant calculation using O'Neill and Pownceby (1993) and Barin (1989) thermodynamic data
        equations:
          NiO_liquid_deltaG_J_per_mol: -185092 + 99.844*T - 4.898*T*ln(T)
          CoO_liquid_deltaG_J_per_mol: -187746 + 91.371*T - 5.672*T*ln(T)
          FeO_wustite_liquid_deltaG_J_per_mol: -244118 + 115.559*T - 8.474*T*ln(T)
        reaction_form: metal(s) + 1/2 O2(g) = oxide(liquid)
        standard_state: pure liquid oxide at 1 atm; FeO uses wustite(liquid) notation
        located_note:
          text: "Applying Eq. 9 with a(Fe) = 1 to the printed log fO2 and X(FeO) does not reproduce the printed gamma (e.g. AD 10); the printed values are stated to be recalculated to equilibrium with pure metals from alloy experiments. The printed gamma is the datum; do not recompute it from Eq. 9."
          locator: {page: 23, table: '2', row: AD 10, note: 'Eq. 9 is on page 30'}
      uncertainty:
        reported_status: source discusses uncertainties in thermodynamic data but gives no uncertainty for these fitted expressions
      equipment: {}
