- experiment_id: taniguchi-1997-feo-slag-1673-1873k
  method: quench_equilibration
  method_as_printed: Slag and molten Cu-Fe alloy equilibrated in a molybdenum crucible at 1673-1873 K under CO-CO2
    for 16-24 h; both phases were exposed to the atmosphere and the slag/metal/gas equilibrium was established.
    After rapid cooling the slag and metal were analysed.
  locator:
    page: 2
    published_page: 957
    pdf_page_index: 1
    section: Experimental Procedures
  conditions:
    quench: rapid cooling
    crucible: molybdenum
