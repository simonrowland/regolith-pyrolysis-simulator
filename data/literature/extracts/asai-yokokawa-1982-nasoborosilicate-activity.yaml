      values:
        quantity: literature_context
        method_class: quoted_attributed
        attribution: Streltsina et al. (ref. 10)
        statement_verbatim: Streltsina et al.(10) has measured the glass transition temperature as well as the temperature of constant
          viscosity value of 10^13 poise as a function of composition and determined the single phase limit and tie lines. These results
          essentially agree with the phase diagram in Fig. 4, which was proposed by Haller et al.(11) based on their solubility measurements.
        viscosity_poise_as_printed: 10^13
    - observation_id: asai_1982_abe_rule
      type: literature_context
      locator:
        published_page: 576
        pdf_page_index: 5
        section: IV. Discussion
      units: as printed
      values:
        quantity: literature_context
        method_class: quoted_attributed
        attribution: Abe (ref. 12)
        statement_verbatim: Abe(12) proposed an theoretical interpretation by a rule that two BO4 groups never meet together and one
          BO3 group never joins to two BO4 groups. Thus, one BO4 to four BO3 is a maximum number of the ratio and NaBO4·2B2O3 or Na2O·5B2O3
          is the melt of the most highly strengthened network.
        BO4_to_BO3_maximum_ratio_as_printed: one BO4 to four BO3
    - observation_id: asai_1982_nmr_bray_milberg
      type: literature_context
      locator:
        published_page: 576
        pdf_page_index: 5
        section: IV. Discussion
      units: as printed
      values:
        quantity: literature_context
        method_class: quoted_attributed
        attribution: Bray (ref. 13), Milberg (ref. 14) and others
        statement_verbatim: Later works of NMR measurement by Bray(13), Milberg(14) and others are not in quantitative agreement with
          Abe's theory, and the BO4 to BO3 ratio seems to continue to increase beyond the predicted composition limit especially in
          the ternary as well as the binary system. Figure 5 is the thermal expansivity contour quoted in Abe's paper.
    - observation_id: asai_1982_milberg_brungs_n4
      type: literature_context
      locator:
        published_page: 576
        pdf_page_index: 5
        section: IV. Discussion
      units: as printed
      values:
        quantity: literature_context
        method_class: quoted_attributed
        attribution: Milberg (ref. 14); Brungs and McCartney (ref. 15)
        statement_verbatim: Milberg(14) and Brungs and McCartney(15) found similar tendency in their NMR works. They conclude that N4=R
          within R<0.5 in the binary and N4 stays high beyond R≥0.5 in the ternary, where N4 is the fraction of BO4 and R is Na2O/B2O3
          mole ratio. They estimate that N4=0.8 at R=1, and after that ratio the excess Na2O starts modifying the SiO2 network.
        N4_estimate: 0.8
        R_at_estimate: 1
        binary_relation_as_printed: N4=R within R<0.5
        ternary_relation_as_printed: N4 stays high beyond R≥0.5
    - observation_id: asai_1982_ainsworth_strength
      type: literature_context
      locator:
        published_page: 576
        pdf_page_index: 5
        section: IV. Discussion
        note: sentence continues on p. 577
      units: as printed
      values:
        quantity: literature_context
        method_class: quoted_attributed
        attribution: Ainsworth (ref. 9)
        statement_verbatim: According to Ainsworth, among the glasses with 1 to 4 of Na2O to SiO2 mole ratio 16Na2O·16B2O3·68SiO2 is
          the highest in strength, suggesting that BO4 group effectively co-operates with SiO2 to build up the network while Si–O- group
          does not yet appear.
        composition_as_printed: 16Na2O·16B2O3·68SiO2
        Na2O_to_SiO2_mole_ratio_as_printed: 1 to 4
