source:
  citation: Asai, K. & Yokokawa, T. (1982). Thermodynamic activity of Na2O in Na2O–B2O3–SiO2 melt. Transactions of the Japan Institute
    of Metals 23(9), 571–577.
  doi: 10.2320/matertrans1960.23.571
  url: https://www.jstage.jst.go.jp/article/matertrans1960/23/9/23_9_571/_pdf
  year: 1982
extraction:
  method: All seven PDF pages (scanned at 300 ppi) rendered with pdftoppm at 300 dpi and read as images. Tables 1 and 2 were transcribed
    independently from the page images (strip pass, then a column-by-column second pass), then diffed against the unverified draft CSVs
    pinned at b663bc1b; the draft errors were corrected from the images. The PDF text layer contains no table numbers and was used only
    as a lead for prose.
  date: '2026-10-05'
  worker: regolith-empirical-b6-asai
  provenance_path: tables/asai-yokokawa-1982-nasoborosilicate-activity
review_status: draft
