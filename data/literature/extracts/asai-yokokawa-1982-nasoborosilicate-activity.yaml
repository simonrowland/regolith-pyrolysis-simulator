      not printed.
  sample:
    printed_composition:
      state:
        tag: value
        value: Na2O–B2O3–SiO2 melts along constant Na2O mole fraction lines 2/5, 1/3, 1/4, 1/5, 1/7, 1/10 and 1/16, plus six complementary
          compositions; reference melt Na2O·2B2O3
      locator:
        published_page: 575
        pdf_page_index: 4
        section: III. Results
        note: per-observation compositions are carried in each observation
    form:
      state:
        tag: value
        value: oxide melt
      locator:
        published_page: 574
        pdf_page_index: 3
        section: II. Experimental
    pretreatment:
      state:
        tag: value
        value: Powder mixture of nominal weights of Na2CO3, H3BO3 and SiO2 (guaranteed reagent grade, Wako Chem. Co.) heated in a platinum
          crucible in air at around 1300 K for more than 20 h
      locator:
        published_page: 574
        pdf_page_index: 3
        section: II. Experimental
        note: continues on p. 575
    characterization:
      state:
        tag: value
        value: Composition did not change beyond ±1 wt% as estimated from chemical analysis (SiO2) and an ion-selective-electrode method
          (Na2O)
      locator:
        published_page: 575
        pdf_page_index: 4
        section: II. Experimental
  conditions:
    temperature_K:
      state:
        tag: unknown
        reason: not_published
      locator:
        published_page: 572
        pdf_page_index: 1
        table: '1'
