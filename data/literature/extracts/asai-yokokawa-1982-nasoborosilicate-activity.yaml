    - observation_id: asai_1982_abstract_statements
      type: directional_statement
      locator:
        published_page: 571
        pdf_page_index: 0
        section: Abstract
      units: as printed
      values:
        quantity: author_statements_verbatim
        statements_verbatim:
        - The relative partial molar quantities of Na2O in the ternary system were evaluated from an electro-motive force measurement.
        - B2O3 functions as an acid more strongly than SiO2 in the composition studied.
        - Large entropy change of Na2O implies the nature characteristic of network formation.
        - The results were discussed in comparison with Na2O–B2O3–Al2O3 melt.
    - observation_id: asai_1982_results_statements
      type: directional_statement
      locator:
        published_page: 575
        pdf_page_index: 4
        section: III. Results
      units: as printed
      values:
        quantity: author_statements_verbatim
        statements_verbatim:
        - In Fig. 1 are drawn contour lines of ΔG(Na2O) on the composition diagram. Most of lines go down on the right side. In other
          words, the sodium oxide activity decreases more extensively with B2O3 than SiO2.
        - In the previous work(5), the ratio of activities of Na2O in Na2O·2B2O3 to Na2O·2SiO2 at higher temperatures was measured.
          The present data on the terminal binary (Na2O–SiO2) melts did not reproduce quite well the previous value.
        - Considering the difference between the temperature ranges of two experiments and the composition sensitivity of the cell emf,
          this only qualitative reproducibility seems tolerable.
        - The present data from repeated measurements with many runs of different charges are more plausible compared with the previous
          ones.
        - ΔH(Na2O) and ΔS(Na2O) are plotted in Figs. 2 and 3.
    - observation_id: asai_1982_discussion_statements_p575_576
      type: directional_statement
      locator:
        published_page: 575
        pdf_page_index: 4
        section: IV. Discussion
        note: continues on p. 576
      units: as printed
      values:
        quantity: author_statements_verbatim
        statements_verbatim:
        - The smooth parallel lines in Fig. 1 suggest that SiO2 functions as a weaker acid than B2O3 or even simply as a diluent in
          this ternary system.
        - The chemical thermodynamic data, to be compared with the present data, seem scarce on this system at high temperatures.
        - Since two two-phase regions meet near the SiO2 corner, the tie lines become complex, their direction changing with temperature.
          Although the wide temperature departure does not allow a direct comparison, these results show good consistency with the contours
          in this region in Fig. 1. (p. 576)
        - Looking at Figs. 2 and 3, we find two features which were newly born out in the ternary system. The first one is the effect
          of SiO2 on the minima of ΔH(Na2O) and ΔS(Na2O) in the Na2O–B2O3 binary melt. These minima are well known as "borate anomaly",
          and the region of low energy and high order is interpreted in terms of the coordination peculiarity of boron atom. (p. 576)
        - Thus, a tightening of the network, through the coordination change from BO3 to BO4, precedes its disintegration which is popular
          in SiO2. Therefore, B2O3 can be said an acid in dual sences, i.e. in one sence that boron atom tends to coordinate one more
          oxygen when available and in another sence that B–O–B covalent bond is modified with O2- on further addition of alkali oxides.
          The first stage is characterized by its abnormal hardness (high density, low thermal expansivity etc). (p. 576)
        - In spite of controvertial interpretations, the consistency of Figs. 3 and 4 with Fig. 5 is quite remarkable. The minimum goes
          even deeper at first and then slowly increases toward the SiO2 apex. (p. 576)
        - Secondly, the contour lines' bending at around 1 to 1 for Na2O to B2O3 mole ratio (along the dot-dash lines) in Figs. 2 and
          3 is worthy of note. This implies stronger acidity of B2O3 over that of SiO2, and Na2O to B2O3 ratio is more important rather
          than Na2O to B2O3+SiO2 to determine the overall basicity of the melt. (p. 576)
        - In other words, Na2O neutralizes B2O3 first and SiO2. (p. 576)
    - observation_id: asai_1982_discussion_statements_p577
      type: directional_statement
      locator:
        published_page: 577
        pdf_page_index: 6
        section: IV. Discussion
      units: as printed
      values:
        quantity: author_statements_verbatim
        statements_verbatim:
        - '... suggesting that BO4 group effectively co-operates with SiO2 to build up the network while Si–O- group does not yet appear.'
        - It will be interesting to compare the present system with the Na2O–B2O3–Al2O3 system which has been studied previously. In
          the temperature range between 1100 and 1200 K, Al2O3 is almost as acidic as B2O3 except for a high dilute alkali range, where
          Al2O3 is even more acidic than B2O3. Therefore the acidity order is Al2O3≧B2O3>SiO2.
        - A more detailed comparison reveales a difference in role between Al2O3 and SiO2. Figure 6 is the reproduction of ΔS(Na2O)
          in the Al2O3 containing system.(6) The low entropy valley in the Na2O–B2O3 binary goes down to Na2O poor direction on one
          hand and climbs gradually toward 1 to 1 of Na2O to Al2O3 mole ratio (along the dashed line) on the other hand.
        - The area surrounded by dot-dash lines is known to be a region of easy glassification. The overlapping of this area with the
          low entropy region is impressive. Here, AlO4 (formally NaAlO2 and structurally similar to BO4) seems to contribute to the
          network formation, in which otherwise the ionic sodium borate crystalization prevents glassification on cooling.
        - On the other hand, in the present system SiO2 remains in the network until Na2O neutralizes B2O3 to BO4 and the excess starts
          to modify SiO2 to easily crystalizable ionic compounds.
    - observation_id: asai_1982_conclusion_statements
      type: directional_statement
      locator:
        published_page: 577
        pdf_page_index: 6
        section: V. Conclusion
      units: as printed
      values:
        quantity: author_statements_verbatim
        statements_verbatim:
        - Na2O activity was measured as for Na2O–B2O3–SiO2 melts. B2O3 was found to be more acidic than SiO2. The borate anomaly continues
          to be pronounced and then gradually decays on addition of SiO2. Function of SiO2 was compared with Al2O3.
    - observation_id: asai_1982_intro_prior_work_na2o_b2o3_al2o3
