    - observation_id: chen22_table_ii_experimental_method
      type: method
      locator:
        published_page: 677
        pdf_page_index: 1
        section: Experimental
        table: II
      units: temperature °C; duration min or h; SEM-EDS settings as printed
      values:
        quantity: equilibrium_phase_composition_method
        method_class: method_only
        method_as_published: High-temperature isothermal equilibration, quenching, and direct phase analysis by XRD and SEM-EDS.
        sample_preparation_as_published: Synthetic slag (0.15–0.3 g) was pre-heated at 1600°C for 30 min and then equilibrated
          at 1500°C. Pure platinum foil supported the pellet; a Pt wire held the crucible.
        equilibration_and_quench_as_published: Samples were annealed at 1500°C for equilibration and quenched in an ice-water
          mixture. Samples were annealed at the experimental temperature for 12 h.
        atmosphere_as_published: air
        analysis_as_published: 'SEM-EDS at 15 kV, 20 nA, and 20 mm working distance; at least ten random measurements per
          phase; Proza (Phi-Rho-Z) matrix correction before normalization. Standards: quartz for O-Kα and Si-Kα, rutile for
          Ti-Kα, and pure metals Mg for Mg-Kα. XRD used Cu Kα radiation, 40 kV, 40 mA, over 10° to 90° (2θ).'
        T_C: 1500
        attribution: This work
