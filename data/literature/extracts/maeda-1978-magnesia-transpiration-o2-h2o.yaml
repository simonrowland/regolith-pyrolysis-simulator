source:
  citation: Maeda, E., Sasamoto, T., and Sata, T. (1978). Vaporization from Magnesia in O2-H2O Atmospheres. Yogyo-Kyokai-Shi
    (Journal of the Ceramic Association of Japan), 86(10), 491-499.
  year: 1978
  corpus_asset: raw/maeda-1978-magnesia-transpiration-o2-h2o/maeda-1978-magnesia-transpiration-o2-h2o.pdf
extraction:
  method: MinerU table draft emission reconciled with born-digital pdftotext and page renders; every extracted pressure-table
    cell was rendered and audited.
  date: '2026-10-25'
  worker: w1025c-maed78
  provenance_path: raw/maeda-1978-magnesia-transpiration-o2-h2o/maeda-1978-magnesia-transpiration-o2-h2o.pdf
  table_dispositions:
    table_1: Common feed description and impurity assay; used to state that the 99.9% MgO feed lacks a closed run
      composition.
    table_2: 'All 24 transpiration rows retained: Mg(OH)2 partial pressure plus one typed-refusal input record per
      row for collected Mg mass, flow, and duration. The kp column is outside the requested pressure-and-run-condition
      scope.'
    table_3: Third-law thermochemical treatment of Table 2; outside the requested run-pressure scope.
    table_4: 'All 10 transpiration rows retained: MgO partial pressure plus one typed-refusal input record per row
      for collected Mg mass, flow, and duration. Third-law columns are outside the requested run-pressure scope.'
    figures: Figures 3-8 contain plotted flow-rate or calculated species-pressure series; no figure-only values
      digitized. Figures 5 and 8 are figure-read candidates for a future figure pass.
  condition_policy: Only source-stated conditions are stored. Table 2 gives O2-H2O and per-run p(H2O), but not per-run
    gas ratio or pO2; no O2 balance is calculated. Table 4 marks O2+CO2 runs but gives no mixture ratio; their fO2
    remains unknown.
  schema_gaps:
  - Absolute collected Mg mass in g has no quantity token; the 34 input rows are typed refusals and retain the printed
    mass, duration, and flow.
  - The extract does not store Table 2 kp or Table 3/Table 4 third-law thermochemical outputs because they are outside
    the requested per-run pressure data.
