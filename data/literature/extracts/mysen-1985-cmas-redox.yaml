schema_version: literature_extract.v1
source_id: mysen-1985-cmas-redox
source:
  citation: 'Mysen, B. O., Virgo, D., Neumann, E.-R. and Seifert, F. A. (1985), Redox equilibria and the structural states
    of ferric and ferrous iron in melts in the system CaO-MgO-Al2O3-SiO2-FeO: relationships between redox equilibria, melt
    structure and liquidus phase equilibria, American Mineralogist 70, 317-331.'
  year: 1985
extraction:
  method: Transcribed the MinerU Table 1 and Table 2 machine drafts, checked against pdftotext-layout, and render-checked
    every stored numeric table cell.
  date: '2026-11-04'
  worker: w1104fer-m85
  review_status: draft
  machine_inputs:
  - MinerU table HTML and Markdown
  - pdftotext-layout.txt
  table_layout_check: 'The 600-dpi PDF renders of pages 4 and 6 were checked. Table 2 contains 88 sample rows: 53 CAS and
    35 MAS rows. The MinerU draft body count of 89 includes the single MgO system heading on draft row 57. At data row 23,
    the draft label CASVIIIF5+ was render-corrected to CASVIIF5†; at row 77, MASIXIF5 was render-corrected to MASIXF5. The
    six underlined 77 K spectra are data rows 23, 37, 48, 77, 80, and 84, located by the Table 2 footnote.'
  table_qa: 'MinerU/pdftotext numeric agreement: Table 1 0.821; Table 2 0.742. All stored table cells were checked against
    the page renders because QA flagged numeric disagreement.'
  condition_notes: Table 2 values are Fe3+/ΣFe fractions as printed. Table 2 prints -log fO2; each exact positive printed
    number is retained in the point record and fO2_as_printed. point_conditions.fO2_log carries its signed absolute-log coordinate
    for the existing identity path. The Table 2 CO-CO2 experiments are at 1 atm as stated in the abstract.
  figure_read_candidates:
  - 'Figure 2: nominal iron-free end-member oxide composition coordinates; not digitized. Table 2 sample codes and F5/F10
    additions are retained.'
  - 'Figures 7-8: redox curves plotted against oxygen fugacity and melt composition; figure-only values are deferred.'
  printed_row_count:
    Table 1: 6
    Table 2: 88
  cell_audit: 'Full numeric cell audit: data/literature/extracts/audits/mysen-1985-cmas-redox.cells.csv.'
review_status: draft
experiments:
- experiment_id: mysen_1985_table1_method_comparison_samples
  series: External comparison samples reanalysed or reported by wet chemistry and Mössbauer spectroscopy; Table 1 does not
    state their run temperature, oxygen fugacity or total pressure.
  locator:
    page: 4
    pdf_page_index: 3
    published_page: 320
    table: '1'
- experiment_id: mysen_1985_table2_cmas_quench_runs
  series: Quenched CaO-Al2O3-SiO2-Fe-O and MgO-Al2O3-SiO2-Fe-O melts at the printed temperatures and absolute -log fO2 values;
    Mössbauer-derived Fe3+/ΣFe.
  locator:
    page: 6
    pdf_page_index: 5
    published_page: 322
    table: '2'
  condition_method: CO-CO2 gas mixtures; oxygen fugacity monitored with a Y2O3-doped ZrO2 sensor, calibrated against NNO and
    IW buffers and calculated from CO/CO2. The source reports ±0.05 log-unit accuracy and better than 0.02 log-unit precision.
    Temperatures were accurate to ±5 C and precise to ±1 C.
  composition_method: Nominal iron-free compositions are identified by sample codes and Figure 2; F5/F10 denote 5/10 wt% Fe2O3
    addition. Run-product microprobe analyses are available upon request, not printed.
