schema_version: literature_extract.v1
source_id: sukenaga-2021-sodium-silicate-thermal-conductivity-heat-capacity
source:
  citation: >-
    Sukenaga, S., Endo, T., Nishi, T., Yamada, H., Ohara, K., Wakihara, T.,
    Inoue, K., Kawanishi, S., Ohta, H. & Shibata, H. (2021), "Thermal
    Conductivity of Sodium Silicate Glasses and Melts: Contribution of Diffusive
    and Propagative Vibration Modes", Frontiers in Materials 8:753746.
  doi: 10.3389/fmats.2021.753746
  year: 2021
extraction:
  method: >-
    Born-digital PDF transcribed from pdftotext-layout; Table 1 was checked
    against the 600 dpi render of physical PDF page 3. Figure records are
    deferred; no plotted values were digitised.
  date: '2026-10-21'
  worker: codex
review_status: draft
evidence_policy:
  classification: measured_table_and_figure_only
  measurement_claim: >-
    Table 1 reports room-temperature properties of silica and sodium disilicate
    glasses. The printed density, mass-specific heat capacity, thermal
    diffusivity, and thermal conductivity values are retained in context because
    the current extract migrator has no density source field, the heat-capacity
    token is molar-basis, and no compatible tokens exist for the other properties.
    Figures 1–3 are recorded for a later figure pass.
  missing_values: No plotted values were estimated or digitised.
species:
  SiO2:
    observations: []
    context:
    - observation_id: sukenaga_2021_table1_room_temperature_glass_properties
      type: table_record
      locator:
        page: 3
        pdf_page_index: 2
        published_page: 3
        table: '1'
      phase: glass
      units: mol%, 10^-7 m2 s^-1, J kg^-1 K^-1, kg m^-3, W m^-1 K^-1
      quote: >-
        Composition and properties of the glass samples at room temperature.
        The analyzed composition of the NS2 glass is indicated in parentheses.
        Assuming the uncertainty in Cp is ±1%, the possible error range for the
        derived κ value is ±2.2%.
      values:
        method_class: measured_tabulated
        quantity_as_printed: composition and thermophysical properties
        room_temperature_K: 300
        rows:
        - sample: SiO2 glass
          composition_mol_pct: {SiO2: 100, Na2O: not_reported}
          thermal_diffusivity_10^-7_m2_s: 8.67
          thermal_diffusivity_sigma_10^-7_m2_s: 0.17
          cp_J_kg_K: 736
          cp_attribution: Richet et al. (1982), footnote 1
          density_kg_m3: 2200
          density_sigma_kg_m3: 2
          thermal_conductivity_W_m_K: 1.40
        - sample: NS2 glass (Na2O·2SiO2)
          nominal_composition_mol_pct: {SiO2: 67.0, Na2O: 33.0}
          analyzed_composition_mol_pct: {SiO2: 66.1, Na2O: 33.9}
          thermal_diffusivity_10^-7_m2_s: 4.40
          thermal_diffusivity_sigma_10^-7_m2_s: 0.11
          cp_J_kg_K: 886
          density_kg_m3: 2490
          density_sigma_kg_m3: 10
          thermal_conductivity_W_m_K: 0.971
        candidate_tokens:
        - density: enum exists, but QUANTITY_SOURCE_FIELDS has no density field, so the value cannot migrate
        - cp: token is molar-basis; the printed values are mass-specific
        - thermal diffusivity: no store quantity token
        - thermal conductivity: no store quantity token
        schema_gap: >-
          Thermal conductivity is derived by the authors from thermal
          diffusivity, density and Cp; those inputs have no compatible
          extract-to-store mapping. Derivation pending a corpus table asset
          (controller, t-1382).
        note: >-
          Silica-glass Cp=736 J kg^-1 K^-1 is attributed to Richet et al.
          (1982), not measured in this study. The prose on physical PDF page 3
          repeats the two densities as 2200 ± 2 and 2490 ± 10 kg m^-3; this
          table is the single retained record. The printed κ uncertainty is
          ±2.2% for derived κ, not a row-specific uncertainty.
    - observation_id: sukenaga_2021_text_reported_structure_and_mean_free_path
      type: printed_data_context
      locator:
        page: 6
        pdf_page_index: 5
        published_page: 6
        section: Discussion; phonon mean free path
      phase: glass
      units: nm
      quote: >-
        The silica-glass phonon mean free path was approximately 0.6 nm at
        300 K, while the NS2-glass value was close to 0.4 nm. The total
        correlation function had major peaks at 0.163, 0.233, 0.264, and
        0.316 nm, assigned respectively to Si-O, Na-O, O-O, and Si-Si
        correlations.
      values:
        method_class: model_derived
        quantity_as_printed: estimated phonon mean free path and total correlation peak positions
        T_K: 300
        silica_glass_mean_free_path_nm: 0.6
        silica_glass_mean_free_path_approximate: true
        NS2_glass_mean_free_path_nm: 0.4
        NS2_glass_mean_free_path_approximate: true
        total_correlation_function_major_peaks_nm:
        - {correlation: Si-O, r_nm: 0.163}
        - {correlation: Na-O, r_nm: 0.233}
        - {correlation: O-O, r_nm: 0.264}
        - {correlation: Si-Si, r_nm: 0.316}
        schema_gap: No store token for phonon mean free path or total correlation peak positions.
