source_id: knight-gca2009
source:
  citation: Knight, K. B., Kita, N. T., Mendybaev, R. A., Richter, F. M., Davis, A. M. & Valley, J. W.
    (2009), "Silicon isotopic fractionation of CAI-like vacuum evaporation residues", Geochimica et Cosmochimica
    Acta, 73(20), 6390–6401, doi:10.1016/j.gca.2009.07.008.
  year: 2009
  doi: 10.1016/j.gca.2009.07.008
  doi_status: crossref_confirmed
  corpus_pdf_note: Corpus file is LLNL preprint LLNL-JRNL-414068 (37 PDF pages, WiscSIMS OA mirror path
    in sidecar). Title/authors/DOI match Crossref VOR; journal pagination 6390–6401. Locators below use
    this PDF's page index.
extraction:
  method: Manual transcription from pdftotext -layout of LLNL OA PDF plus visual checks of 200 dpi page-25
    render. Table 1 chemical + Si-isotope columns landed. δ25Mg column is Richter et al. (2007) reprint
    (footnote 4) — stamped attributed. Rayleigh-fit α29Si / α30Si (combined and per-T) landed as derived.
    Inverse-sqrt-of-mass model α curves and CAI-precursor reconstructions typed as model absence. Figures
    not digitized. Oxide compositions of residues are reprinted from Richter et al. (2007a) as stated
    by authors; Si isotopes are this work's SIMS measurements. Absence is never zero.
  date: '2026-09-23'
  worker: n15-aq-oa-batch-a
  null_hypothesis_check: 'No prior extract for Knight et al. 2009 or DOI 10.1016/j.gca.2009.07.008. Related
    but distinct: kems-010-richter-2007 (same residue campaign; Mg isotopes + evaporation kinetics; NO
    Si isotope α table), kems-037-richter-2002, N4 LPSC abstracts. SOURCE_STATUS lists knight-gca2009
    as located / no document (pre-AQ).'
