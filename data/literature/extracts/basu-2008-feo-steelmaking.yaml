extraction:
  method: >-
    Manual transcription checked against 250 dpi renders of all ten PDF pages. Tables I-III were transcribed before encoding; Table II has 65 solutions and Table III has 43. Printed compositions are retained separately from the authors' calculated activities. Figure curves were not digitized. The paper refers apparatus details to reference 26; no details from that cited work were imported.
    Fix round 1 (2026-10-05, regolith-empirical seat, applying regolith-empirical review.md of 2305fff9): Table II/III a(FeO) and h_O moved from context to activity_coefficient observations (a(FeO) measured_reduced from its h_O row via Eq. [1]; h_O carried as the authors' tabulated value with its unprinted inputs typed absent), each with the solution's printed mass-percent composition; page locators of Table II solutions 64-65, Figures 1-13 and nine quotations corrected against 250 dpi renders; duplicate Figure 8 caution removed; Kishimoto [22] and Turkdogan and Pearson [9] attributions restored; 18 uncarried qualifying statements added; Table I cells made verbatim to print; reference_state_endmember_formula (FeO for a(FeO), O for h_O) typed from the printed standard states; seven fidelity_samples pinned to values re-read from the page images.
  date: '2026-10-05'
  worker: codex-resume-19137-1791246666
review_status: draft
