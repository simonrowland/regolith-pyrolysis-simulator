source:
  citation: 'Basu, S., Lahiri, A. K. & Seetharaman, S. (2008), "Activity of Iron Oxide in Steelmaking Slag", Metallurgical and Materials Transactions B 39B (June 2008), pp. 447-456.'
  doi: 10.1007/s11663-008-9148-4
  year: 2008
  corpus_asset: raw/basu-2008-feo-steelmaking/basu-2008-feo-steelmaking.pdf
