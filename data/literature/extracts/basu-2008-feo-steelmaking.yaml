      type: thermodynamic_example
      locator: {page: '447-455', pdf_page_index: '0-8', section: 'Experimentation; Results and Discussion'}
      units: as printed
      values:
        quantity: numeric_context_and_author_correlations
        method_class: model_derived
        numeric_context:
          solid_wustite_stoichiometry_x_range: ['0.95', '0.98']
          prior_pure_ferrous_oxide_melt_mass_pct_FeO: '94'
          prior_pure_ferrous_oxide_melt_mass_pct_Fe2O3: '6'
          prior_corresponding_FeO_stoichiometry: 'FeO1.03'
          interaction_parameter_compilation_year: 1974
          experiment_temperature_K: ['1873', '1923']
          FeO_concentration_range_mass_pct: ['10', '30']
          basicity_range_mass_pct_CaO_over_SiO2: ['1.2', '3.5']
          equilibration_time_hours: '8'
          temperature_control_uncertainty_K: '±1'
          source_claim_temperature_interval_K: '50'
          eq2: 'log10 gamma(FeO) = -0.7335 log10 X(FeO) - 0.2889; r2 = 0.93'
          eq3: 'log10 gamma(FeO) = 1262/T - 1.1302 X(FeO) + 0.96 X(SiO2) + 0.123 X(CaO) - 0.4198; r2 = 89 pct'
          eq2_eq3_correlation_coefficients_as_discussed_pct: ['92', '93']
        formula_note: "Activities in Tables II-III are calculated by the authors from their equilibrated steel analyses (h[O] = [mass pct O] x fO; a(FeO) from h[O] by Eq. [1]); the paper does not print the oxygen analysis or metal composition underlying each h[O] number. The a(FeO) and h_O values are carried as activity_coefficient observations."
        source_internal_inconsistencies:
        - 'source_internally_inconsistent: Eq. [2] prints r2 = 0.93 (p. 454) and Eq. [3] prints r2 = 89 pct (p. 455), but p. 455 states "The correlation coefficients of Eqs. [2] and [3] are practically the same (92 and 93 pct)." Both printed forms are carried; not reconciled.'
        - 'source_internally_inconsistent: p. 450 states "the oxygen concentration in steel is expressed in parts per million (by mass)", yet Tables II-III (pp. 451-452) print no ppm oxygen column, only h_O. This is why the h[O] reduction inputs are typed absent (not_published).'
    - observation_id: basu_2008_qualifying_and_directional_statements
      type: method
      locator: {page: '447-456', pdf_page_index: '0-9', section: 'Experimentation; Results and Discussion; Conclusions', note: 'Present authors statements. Statements attributed to other workers are in basu_2008_attributed_literature_statements.'}
      units: verbatim statements
      values:
        quantity: qualifiers_and_directional_claims_rechecked_against_page_images
        method_class: quoted_unattributed
        claims:
        - page: 447
          quotation: "“The desired temperature was maintained within ±1K in the furnace tube through the use of two B-type thermocouples, one located inside the furnace tube and the other just outside the same, together with a PID controller.”"
        - page: 448
          quotation: "“none of these three parameters show any perceptible change beyond 8 hours of soaking.”"
        - page: 448
          quotation: "“All the experiments were started with MgO-free slags, and the saturation concentration was attained by dissolution of MgO from magnesia crucibles into the slag.”"
        - page: 448
          quotation: "“Therefore, the possibility of the presence of solid/undissolved MgO in the slag was neglected.”"
        - page: 448
          quotation: "“It is seen that some of the slag samples probably contained solid fractions at 1873 K.”"
        - page: 448
          quotation: "“Microscopic examination of some selected slag samples, quenched from the equilibration temperature, confirmed the presence of solid fractions.”"
        - page: 449
          quotation: "“the solid phases to consist primarily of silicates of calcium, with traces of phosphorus and magnesium.”"
        - page: 449
          quotation: "“the constituents in the slag were present partly in the silicate phase and partly in the liquid fraction of the slag.”"
        - page: 449
          quotation: "“because the samples were at thermodynamic equilibrium, the activity of any species in both the phases would still be the same.”"
        - page: 450
          quotation: "“FeO exhibits positive deviation from ideality for most chemical compositions investigated, except at high FeO concentrations, i.e., exceeding 0.4 mole fraction.”"
        - page: 450
          quotation: "“positive deviation of the activity of FeO was observed by these workers, with the exception of Chipman.”"
        - page: 450
          quotation: "“The results of Ichise and Iwase show negative deviation in a few cases at low iron oxide concentrations (X(FeO) < 0.1), whereas Wrampelmeyer et al. observed some incidences of negative deviation of FeO at intermediate concentrations (X(FeO) = 0.25 to 0.4).”"
        - page: 450
          quotation: "“the results of Chipman exhibit no positive deviation at all, but a small negative deviation of a(FeO) at X(FeO) exceeding 0.4 is seen in Figure 4.”"
        - page: 450
          quotation: "“the change in basicity as well as temperature has only a negligible influence on the activity coefficient of FeO, for any given range of FeO concentration.”"
        - page: 450
          quotation: "“A marginal decrease of γ(FeO) with the increase of basicity can be noticed upon careful analysis of Figure 5.”"
        - page: 450
          quotation: "“Bishop et al. reported a gentle decrease in a(FeO) when the basicity, defined as the ratio mole pct (CaO + MgO + MnO)/mole pct (SiO2 + PO2.5 + Al2O3), increased beyond 2, for FetO concentration within the range of 10 to 60 mole pct.”"
        - page: 450
          quotation: "“Fetters and Chipman, and also Turkdogan and Pearson, reported that the activity of FeO reached a distinct local maximum corresponding to a basicity of approximately 2.”"
        - page: 450
          quotation: "“no such local maximum was observed by the present authors.”"
        - page: 450
          quotation: "“no definite correlation could be obtained between γ(FeO) and optical basicity of the slags.”"
        - page: 450
          quotation: "“The changes in γ(FeO), seen in Figure 5, are due primarily to changes in FeO concentration.”"
        - page: 450
          quotation: "“The activity coefficient of FeO depends very strongly on its concentration, irrespective of basicity and temperature, within the range investigated.”"
        - page: 450
          quotation: "“The figure shows a nearly linear decrease of the activity coefficient with increasing FeO concentration”"
        - page: 450
          quotation: "“the activity of FeO exhibits positive deviation at lower FeO concentrations but moves closer to ideality as the FeO concentration increases.”"
        - page: 450
          quotation: "“The activity coefficient of FeO appears to be independent of temperature, at least over the interval investigated.”"
        - page: 450
          quotation: "“negative deviation is exhibited when the concentration of FeO exceeds 40 molar pct (X(FeO) > 0.4).”"
        - page: 453
          quotation: "“all the workers, except Bodsworth, reported an increase in the activity coefficient of FeO with increasing SiO2 concentration.”"
        - page: 450
          quotation: "“no definite correlation of γ(FeO) with CaO concentration can be observed.”"
        - page: 452
          quotation: "“At low concentrations of FeO, i.e., X(FeO) < 0.1, γ(FeO) tends to decrease gradually with increasing CaO concentration. However, no such trend is visible at X(FeO) exceeding 0.1.”"
        - page: '452-453'
          quotation: "“a change of temperature within the range investigated appears to cause insignificant change in the activity coefficient of FeO.”"
        - page: 454
          quotation: "“the trend shown in Figure 8 should be treated with caution.”"
        - page: '453-454'
          quotation: "“Increase in FeO concentration, at any given level of basicity, caused a proportionate decrease in the concentrations of both CaO and SiO2.”"
        - page: 454
          quotation: "“This resulted in a negative correlation between X(FeO) and X(SiO2).”"
        - page: 453
          quotation: "“Also, the nature of the plot remains the same if the concentration of SiO2 (and CaO) is expressed in terms of mass percent instead of molar fraction.”"
        - page: 454
          quotation: "“It is likely that a similar situation might have existed with some of the results shown in Figure 10, but that could not be verified due to the nonavailability of complete information for many of the sources.”"
        - page: '454-455'
          quotation: "“Basicity of the slag was found to be statistically insignificant as an independent variable and, hence, was excluded from the correlation.”"
        - page: 455
          quotation: "“The correlation coefficients of Eqs. [2] and [3] are practically the same (92 and 93 pct).”"
        - page: 455
          quotation: "“it can be concluded that γ(FeO) can be adequately estimated using Eq. [2], and incorporation of additional compositional variables does not yield any significant improvement.”"
        - page: 455
          quotation: "“The activity of FeO ... shows pronounced positive deviation from ideality, at least up to X(FeO) = 0.4.”"
        - page: 455
          quotation: "“Change in basicity over the range (pct CaO)/(pct SiO2) = 1 to 4 had a negligible effect on γ(FeO).”"
        - page: 455
          quotation: "“γ(FeO) shows a strong tendency to decrease with increasing mole fraction of FeO, irrespective of temperature and basicity.”"
        - page: 455
          quotation: "“Increase of SiO2 mole fraction tends to have a positive effect on γ(FeO), but the trends cannot be confirmed, because X(SiO2) was strongly dependent on X(FeO).”"
        - page: 456
          quotation: "“The proposed correlation is capable of fairly accurate estimation of the activity coefficient of FeO.”"
        - page: 450
          quotation: "“The concentrations of CaO, SiO2, FeO, P2O5, and MgO are considered in mass percent, and the oxygen concentration in steel is expressed in parts per million (by mass).”"
        - page: 450
          quotation: "“Change in CaO concentration has a likewise minimal influence, but γ(FeO) is affected more significantly by the concentration of SiO2.”"
        - page: 450
          quotation: "“It is seen that γ(FeO) increases with the increase in the molar concentration of SiO2.”"
        - page: '450-452'
          quotation: "“the results appear segregated into different ranges based on FeO concentration only.”"
        - page: 453
          quotation: "“The scatter in the value of γ(FeO), for any particular level of SiO2 (or CaO) concentration, may have resulted from variations in iron oxide concentration.”"
        - page: 453
          quotation: "“However, very little description of the effect of CaO concentration on γ(FeO) has been reported. It can be assumed that the earlier findings were probably similar to the absence of definite correlation with CaO concentration, as has been observed by the present authors.”"
        - page: 453
          quotation: "“It should be noted that the concentrations of SiO2 and FeO were not strictly independent variables in the samples investigated in the present work.”"
        - page: 454
          quotation: "“Figure 6 illustrates that the activity coefficient of FeO is practically a function of FeO concentration only, with a negligible influence of temperature. The relatively small temperature interval of only 50 K could have been partly responsible for this.”"
        - page: 455
          quotation: "“This conforms to the trend seen in Figure 5, which shows no definitive influence of basicity on γ(FeO).”"
        - page: 455
          quotation: "“It can be seen in Figures 8 and 9 that the concentration of SiO2 has an effect on the activity coefficient of FeO, while CaO concentration has a much weaker influence.”"
        - page: 455
          quotation: "“Equation [3] shows that the activity coefficient of FeO is influenced by the concentrations of both CaO and SiO2, even though it is unaffected by basicity. In fact, the coefficients of X(CaO) and X(SiO2) have the same sign, which may explain why no perceptible dependence of γ(FeO) on basicity could be observed.”"
    - observation_id: basu_2008_attributed_literature_statements
      type: quoted_comparator
      locator: {page: '447-453', pdf_page_index: '0-6', section: 'II. Stoichiometry; III. Experimentation; IV. Results and Discussion', note: 'Statements the paper attributes to other workers or to cited sources; each carries its attribution and reference numbers as printed.'}
      units: verbatim statements
      values:
        quantity: attributed_literature_statements
        method_class: quoted_attributed
        attribution: 'Basu et al. (2008) quoting or summarising the cited workers named in each claim (reference numbers as printed).'
        claims:
        - page: 447
          quotation: "“Deo and Boom observed that this nonstoichiometry is of negligible significance in steelmaking operations.[25] They suggested that the free energy of formation of “FeO” and that of FexO may be considered as the same. This convention has been followed up on in the present work.”"
          attribution: 'Deo and Boom [25]; the convention defines what "FeO" means in Tables II-III'
        - page: 448
          quotation: "“Similar results were obtained from the commercial thermodynamic packages THERMOCALC* and FACTSAGE.**”"
          attribution: 'commercial packages THERMOCALC and FACTSAGE (footnotes, p. 448); refers to the probable solid fractions at 1873 K'
        - page: '448-449'
          quotation: "“Previous investigations have already confirmed the presence of two-phase slag in some of the samples, particularly those with higher basicity.[26,27]”"
          attribution: 'present authors earlier work [26,27]'
        - page: 450
          quotation: "“Similar behavior of FeO activity was observed by several others as well.[18,22,31–34]”"
          attribution: 'refs. [18,22,31-34]'
        - page: 450
          quotation: "“Turkdogan and Pearson had reported negative deviation of a(FeO) in CaO-MgO-MnO-FeO-SiO2 slags at all FeO concentrations, but only when SiO2 concentration was less than 0.8 molar pct (X(SiO2) < 0.008).[9] At higher concentrations of SiO2, the activity of FeO exhibited positive deviation.”"
          attribution: 'Turkdogan and Pearson [9]; the second sentence continues their finding'
        - page: 450
          quotation: "“A similar trend was reported by Kishimoto and co-workers, who concluded that the increase in basicity over the range X(CaO)/X(SiO2) = 2.0 to 6.0, at any level of FeO concentration, caused only a marginal decrease in the activity coefficient of FeO.[22]”"
          attribution: 'Kishimoto and co-workers [22]'
        - page: 450
          quotation: "“A similar trend was reported by Bodsworth,[13] Kishimoto et al.,[22] and by Fetters and Chipman[5] as well as Turkdogan and Pearson,[9] whose findings are shown in Figure 7.”"
          attribution: 'Bodsworth [13], Kishimoto et al. [22], Fetters and Chipman [5], Turkdogan and Pearson [9]'
        - page: 450
          quotation: "“The results of Chipman[1] are an exception and show negative deviation over the entire range of FeO concentration.”"
          attribution: 'Chipman [1]'
        - page: 453
          quotation: "“Turkdogan and Pearson observed that the activity of FeO showed a marginally negative deviation in silica-free steelmaking slags, which changed to positive deviation as the SiO2 content was increased.[9] A similar trend has been reported by others as well.”"
          attribution: 'Turkdogan and Pearson [9]; others unnamed'
