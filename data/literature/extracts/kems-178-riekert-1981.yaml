schema_version: literature_extract.v1
source_id: kems-178-riekert-1981
source:
  citation: Riekert, G., Lamparter, P. & Steeb, S. (1981), "The Determination of Thermodynamic Properties
    of melts from the Cu-Si-System by Mass Spectrometry", Zeitschrift für Naturforschung A, 36(5), 447–453,
    doi:10.1515/zna-1981-0505.
  year: 1981
  doi: 10.1515/zna-1981-0505
  doi_status: crossref_confirmed
extraction:
  method: Manual visual transcription from 200–300 dpi pdftoppm renders of the corpus OA PDF (De Gruyter
    Z. Naturforsch. A). Printed Tables 1–4 only. Figures 1–9 not digitized. Section 6 Regular / Schmid–Schürmann
    model outputs typed as model absence. Table 1 = measured ion-current ratios; Table 2 = least-squares
    fit coefficients (derived); Tables 3–4 = Belton–Fruehan integration / excess Gibbs products at 1700
    K (derived). Absence is never zero.
  date: '2026-09-23'
  worker: n15-aq-oa-batch-a
  null_hypothesis_check: No prior extract for Riekert/Lamparter/Steeb 1981 or DOI 10.1515/zna-1981-0505.
    kems-049-kato-1993-ms-review cites this paper as a Cu-Si reference only (not a primary extract). SOURCE_STATUS
    lists kems-178-riekert-1981 as located / no document (pre-AQ).
