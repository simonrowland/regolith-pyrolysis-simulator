  new: &yu_quote |-
    The decline in the concentrations of Na2O and K2O was measured as a function of time at 1723 K.
    Fig. 4. Evaporation rate data for (A) Na and (B) K from the experiments of Yu et al. (2003) on a chondrule analog composition in low-pressure air, compared to predictions of the evaporation model for three values of evaporation coefficients for Na and K.
