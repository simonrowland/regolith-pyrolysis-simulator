corrections:
- observation_id: fedkin_2006_na_yu_langmuir
  field: printed_quote
  old: absent
  new: 'The decline in the concentrations of Na2O and K2O was measured as a function
    of time at 1723 K.

    Fig. 4. Evaporation rate data for (A) Na and (B) K from the experiments of Yu
    et al. (2003) on a chondrule analog composition in low-pressure air, compared
    to predictions of the evaporation model for three values of evaporation coefficients
    for Na and K.

    It is seen that the Na data are best fit by αNa = 0.26 ± 0.05 and the K data by
    αK = 0.13 ± 0.02.'
  page: 213, 214
