schema_version: literature_extract.v1
source_id: pankratz-1968-ri7201-sodium-calcium-silicates
source:
  citation: Pankratz, L. B. (1968), High-Temperature Heat Contents and Entropies of Four Crystalline Sodium-Calcium
    Silicates, U.S. Bureau of Mines Report of Investigations 7201.
  year: 1968
extraction:
  method: Transcribed from MinerU and pdftotext machine text; every numeric cell reconciled by the two-read
    agreement rule or page render and recorded in the cell audit.
  date: '2026-10-31'
  worker: w1031na-pank68
review_status: draft
notes:
- text: Table 1 prints CaO and SiO2 analyses with theoretical values in parentheses for four crystalline
    compounds. Na2O was obtained by difference, but no numeric Na2O values are printed; none are inferred.
  locator:
    pdf_page_index: 8
    page: 9
    published_page: 2
    table: '1'
- text: Table 2 contains 71 measured drop-calorimetry rows. The series statement that capsules were sealed
    under 1 atmosphere of helium is retained as setup context and is not treated as measurement total
    pressure. The source prints no fO2.
  locator:
    pdf_page_index: 9
    page: 10
    published_page: 3
    table: '2'
- text: Table 3 contains 47 smoothed heat-content rows and 47 relative entropy-increment rows. H_T-H_298.15
    values are model_derived from the fits; S_T-S_298.15 is retained as a distinct typed refusal because
    no exact relative-entropy quantity token exists. No absolute S is printed.
  locator:
    pdf_page_index: 12
    page: 13
    published_page: 6
    table: '3'
- text: The six heat-content equations are printed on published page 5. Their ranges and average deviations
    are retained as printed, and each fit is linked only to the Table 2 points in its printed fit interval.
    The 1309.0 K, 1300.3 K, and 1504.4 K measured endpoints beyond those ranges remain measured and are
    not fit parents.
  locator:
    pdf_page_index: 11
    page: 12
    published_page: 5
    section: Measurements and results
- text: Phase labels α and β are stored only at the Table 3 points where those labels are printed (830
    K for Na2CaSiO4 and 750 K for Na2Ca2Si3O9). Other calorimetric rows retain the source-supported crystalline
    phase only.
  locator:
    pdf_page_index: 12
    page: 13
    published_page: 6
    table: '3'
- text: X-ray diffraction identified Na2CaSiO4 and Na2Ca2Si2O7 as matching ASTM patterns except for two
    low-intensity unidentified lines in the latter; Na2Ca2Si3O9 matched Kroger and Blomer; Na4CaSi3O9
    matched its reference pattern except for four low-intensity unidentified lines. Sodium oxide analysis
    was obtained by difference from 100 percent, without printed numeric Na2O values.
  locator:
    pdf_page_index: 7
    page: 8
    published_page: 1
    section: Materials
- text: The calorimeter capsules were platinum-rhodium and the paper says they were sealed under 1 atmosphere
    of helium. This setup statement is not treated as total measurement pressure. No fO2 is printed. The
    reported standard errors are 0.1 percent for Na2CaSiO4, Na2Ca2Si3O9, and Na4CaSi3O9, and 0.2 percent
    for Na2Ca2Si2O7; the confidence level is not stated.
  locator:
    pdf_page_index: 9
    page: 10
    published_page: 3
    table: '2'
- text: Measurements on Na2Ca2Si2O7 and Na4CaSi3O9 were limited by incongruent melting. The paper gives
    no numerical fusion temperature or enthalpy for either. It states that Na4CaSi3O9 fusion information
    could not be determined because its 298 K reference state had changed. Figure 1 plots (H_T-H_298.15)/(T-298.15);
    its figure-only values are not transcribed.
  locator:
    pdf_page_index: 13
    page: 14
    published_page: 7
    section: Discussion
