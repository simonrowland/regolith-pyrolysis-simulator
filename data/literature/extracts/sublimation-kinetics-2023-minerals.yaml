          T_K: 1173.15
          evaporation_rate: 1.4e-09
        - T_C: 1000.0
          T_K: 1273.15
          evaporation_rate: 3.1e-08
        - T_C: 1050.0
          T_K: 1323.15
          evaporation_rate: 1.3e-07
        - T_C: 1100.0
          T_K: 1373.15
          evaporation_rate: 4.6e-07
        - T_C: 1150.0
          T_K: 1423.15
          evaporation_rate: 1.5e-06
        - T_C: 1200.0
          T_K: 1473.15
          evaporation_rate: 4.6e-06
      equipment:
        sample_surface_area:
          value:
            basis: HKL_per_m2
            geometric_area: refused_not_printed
            note: This flux column is already divided by area. The area later used for g/h/g is the BET
