schema_version: literature_extract.v1
source_id: sublimation-kinetics-2023-minerals
source:
  citation: >-
    Shaw, M. G., Humbert, M. S., Brooks, G. A., Rhamdhani, M. A., Duffy, A. R. &
    Pownceby, M. I. (2023), "Metal and Oxide Sublimation from Lunar Regolith: A
    Kinetics Study", Minerals 13, 79, DOI 10.3390/min13010079
  doi: 10.3390/min13010079
  url: https://doi.org/10.3390/min13010079
  year: 2023
  related_sources:
  - source_id: kems-022-demaria-1971
    relation: cited_kems_verification_not_this_work
    note: Shaw compare FactSage p_sat to De Maria et al. 1971 KEMS on Apollo 12022 (their ref. [15]).
      Those KEMS points are not re-tabulated here; they already live in kems-022-demaria-1971. Figures
      3–4 that overlay De Maria traces are figure-only.
extraction:
  method: Born-digital Minerals 13:79 PDF from regolith-corpus raw/sublimation-kinetics-2023-minerals/sublimation-kinetics-2023-minerals.pdf
    (12 pages, clean text layer). Transcribed with pdftotext -layout plus 150 dpi pdftoppm of pages 5–8
    to certify Table 2 cells and to confirm Figures 1 and 3–5 have no printed data labels. Table 1 and
    Table 2 cells are from the text layer. Printed BET numbers are from abstract/§3.1/§5 prose, not from
    digitising Figure 1. Figure 1 has additional unlabelled sinter-temperature points that were not digitised.
    Table 2 p_sat and HKL flux, and the 1200 °C g/h/g headline rates, are FactSage/HKL model output, stored
    as model_derived, not as measurements. LMS-1 oxide composition is not printed in this source.
  date: '2026-09-19'
  worker: extract-sublimation-kinetics-2023
review_status: draft
corrections: []
