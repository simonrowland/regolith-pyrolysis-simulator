      units: mol/s/m2 as printed
      values:
        quantity: evaporation_rate
        method_class: model_derived
        admission_status: model_output_not_measurement
        gas_species: Fe(g)
        alpha_e_assumed: 1.0
        condensation_term: removed (Langmuir evaporation; ac*pi neglected)
        area_basis: per_m2
        geometric_area: refused_not_printed
        bet_area: applied_only_in_g_h_g_rates_not_in_this_column
