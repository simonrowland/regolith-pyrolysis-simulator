      - 1473.15
      phase: condensed_solid
      condensed_form:
        state: pressed_simulant_pellet
        metastable: false
        basis: explicit_author
        note: LMS-1 compressed in a 13 mm steel die; height/thickness not printed. Partial melting of
          the simulant was observed at 1200 C (see shaw_2023_lms1_fig2_micrographs_and_partial_melt).
      standard_state: vacuum-sintered compressed LMS-1 pellets; BET later, not an evaporation-rate measurement
      regime: vacuum_sintering
      units: as printed (g, mm, kN, min, h, atm, C)
      uncertainty:
        note: no uncertainty printed on pellet mass, die diameter, compaction force, or hold time
