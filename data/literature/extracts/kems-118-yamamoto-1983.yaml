source_id: kems-118-yamamoto-1983
source:
  citation: Yamamoto, M., Mori, S. and Kato, E. (1983), "Mass Spectrometric Study of the Thermodynamic
    Properties of the Liquid Fe-Sn and Fe-Sn-Cu Alloys", Trans. ISIJ 23(1):56-64, DOI 10.2355/isijinternational1966.23.56.
    Originally published in Tetsu-to-Hagane, 67 (1981), 1952, in Japanese.
  doi: 10.2355/isijinternational1966.23.56
  url: https://doi.org/10.2355/isijinternational1966.23.56
  year: 1983
extraction:
  method: Official J-STAGE OA PDF (corpus raw/kems-118-yamamoto-1983/kems-118-yamamoto-1983.pdf, sha256
    128431853efacfcb1a2347221d72858c7ce4e095504a37ec10bfb4bdeedd2769). No MinerU decode. Tables 1-6 transcribed
    from a 400 dpi pdftoppm render of PDF pages 1-9 (published pp. 56-64). pdftotext-layout is a noisy
    OCR layer and was not used as data. Table 2/4/5 ion-current ratios labelled measured. Table 3 a/gamma/Delta-H
    from Belton-Fruehan / Gibbs-Duhem integration labelled model_derived. Table 5 epsilon_Sn^Cu and Table
    6 Present Authors rows model_derived. Table 6 other-worker rows quoted_measurement (Hultgren Estimation
    quoted_unattributed). Figs 1-15 figure-only. Table 3 N_Sn=0.700 a_Sn(1550 C)=0.882 transcribed as
    printed (inconsistent with gamma_Sn=1.174). Sample mass unstated. Chamber pressure unstated. Ionizing
    energy unstated.
  date: '2026-09-13'
  worker: extract-alloys-b2
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
