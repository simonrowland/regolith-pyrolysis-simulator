schema_version: literature_extract.v1
source_id: kems-028-yakovlev-1984
source:
  citation: 'Yakovlev, O.I., Markova, O.M., Semenov, G.A. & Belov, A.N. (1984), "The vaporization peculiarities
    of CAI inclusions in chondrites: experimental data", Lunar and Planetary Science XV, 945–946'
  doi: null
  url: https://ui.adsabs.harvard.edu/abs/1984LPSC...15..945Y
  year: 1984
extraction:
  method: 'Corpus PDF is a 2009 Acrobat Paper Capture scan of the LPI/ADS LPSC XV abstract (2 letter pages,
    published pp. 945–946). pdftotext -layout and MinerU are noisy OCR layers and were not used as data.
    Printed partial-pressure sentences and the Po2 table transcribed from a 400 dpi pdftoppm PNG. Figs
    1–2 were digitised for SiO, Mg, Ca, and Al from a 600 dpi pdftoppm render; paired pixel reads and axis fits are in the companion figure audit CSV. Other plotted species remain figure-only. Authors'' measured KEMS partial pressures (torr as
    printed) are kept distinct from the Po2 table, which the authors calculate from AlO=Al+O and O2=2O.
    Temperatures converted from printed C to K use T_K = T_C + 273.15. The printed range sentence says
    ''Maximum P_FeO=10^-2 tor'' over 1450–1725 C, while the adjacent sentence gives a top iron-oxide
    pressure P_FeO=8.1×10^-5 tor at 1650 C; this conflict is preserved. The range row remains assigned
    to Fe(g) under the existing correction based on Fig. 1 labels; The existing figure index rows remain figure-only; SiO, Mg, Ca, and Al marker series are stored in separate species-owned digitized observations. Authors'' measured KEMS pressures remain distinct from the model-derived Po2 table.
    Typewriter I for 1 in that table (I.4×10^-6) is read as 1.4.'
  date: '2026-09-12'
  worker: extract-kems-026
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
review_status: draft
corrections:
- observation_id: yakovlev_1984_murchison_Fe_max_1450_1725C
  field: values.gas_species
  old: FeO(g)
  new: Fe(g)
  page: 945
  quote: Maximum P_FeO=10^-2 tor is watched in the wide temperature range (T=1450-1725 C). The top pressure
    of iron oxide (P_FeO=8.1×10^-5 tor) relates to T=1650 C. Fig. 1 (p. 946) labels Fe, not FeO, as the
    species reaching lg P (tor) ≈ -2 in that temperature band.
