          \ This variation of tendencies is caused by\n                                  the diﬀerent behaviors\
          \ of vanadium oxides in the slag.\n                                  In the slag system, VO and VO1.5\
          \ act like a network\n                                  modiﬁer and VO2 acts like a network former. Compared\n\
          \                                  to the activity coeﬃcients of VO in the previous work,\n          \
          \                        those in the present study were much higher due to\n                        \
          \          lower oxygen partial pressures. On the other hand, the\n                                  activity\
          \ coeﬃcients of VO1.5 and VO2 in the present\n                                  study showed higher values\
          \ than those of previous work\n                                  at 3.2 × 10^-9 atm and lower values than\
          \ those at\n                                  3.1 × 10^-7 atm. It is considered that the activity\n  \
          \                                coeﬃcients of VO1.5 and VO2 of previous work at\n                   \
          \               3.1 × 10^-7 atm were overestimated. In addition, while\n                             \
          \     the activity coeﬃcient of VO2 in the present study\n                                  decreased\
          \ with increasing slag basicity, the activity\n                                  coeﬃcients of VO2 in\
          \ previous work showed increasing\n                                  tendency. These contrasting tendencies\
          \ may be ascribed\n                                  to the diﬀerence that the major redox pairs in the\n\
          \                                  previous work were V3+/V4+ and V4+/V5+, while those\n             \
          \                     were V2+/V3+ and V3+/V4+ in the present study. As\n                            \
          \      VO2 is an amphoteric oxide, it acted like a network\n                                  modiﬁer\
          \ in the previous work, while it acted like a\n                                  network former in the\
          \ present study. When the results of\n                                  the present study and those of\
          \ Wang are compared, the\n                                  activity coeﬃcients of VO1.5 and VO2 measured\
          \ by\n                                  Wang were also lower than those of present study. As\n876—VOLUME\
