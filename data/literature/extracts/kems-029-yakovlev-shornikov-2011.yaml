schema_version: literature_extract.v1
source_id: kems-029-yakovlev-shornikov-2011
source:
  citation: Yakovlev, O.I. & Shornikov, S.I. (2011), "Experimental study of meteorites and Ca–Al-inclusions",
    Vestn. Otd. nauk Zemle 3, NZ6104, doi:10.2205/2011NZ000234
  doi: 10.2205/2011NZ000234
  url: https://doi.org/10.2205/2011NZ000234
  year: 2011
extraction:
  method: Corpus PDF is a born-digital 3-page Vestnik typeset PDF (not a scan). Table of O2 pressure transcribed
    from a 400 dpi pdftoppm PNG of PDF page 2; method numbers from the same-resolution render of PDF page
    1. MinerU figure grids were not used as data. Figs 1–2 (lg P_i atm vs T) were digitised at printed marker centres;
    log ordinates are retained in point notes and the audit. The O2 table is the authors' calculated p(O2) in bar (thermodynamic analysis of CAI
    vs chondrite vaporization) and is labelled model_derived; it is the torr table of Yakovlev et al.
    LPSC XV 945–946 (kems-028) converted to bar (1.4×10^-6 torr ≈ 1.9×10^-9 bar). Complementary vapor
    wt% are derived from this-work KEMS partial pressures via the Hertz–Knudsen equation, kept distinct
    from the direct P(T) figures. Equipment (MS-1301, gold calibration, W cell, 15 mg Re boat, ±1 C) is
    method metadata, not a measured rate.
  date: '2026-09-12'
  worker: extract-kems-026
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
review_status: draft
