        as_printed: at the relatively low temperature (up to 1300 C) the K2O contents reached 5–10 wt.
          % and the Na2O contents up to ~70 wt. %. In the temperature interval 1400–1700 C the Fe vapor
          was prevailed and reached ~40 wt. %. It is important to note that at the temperature 1800 C
          and higher the SiO disappeared in the vapor phase while the Al2O3 and CaO increased. The Al2O3
          contents reached 60-65 wt. % at the temperature ~2000 C.
        derivation: Partial pressures were converted to evaporation rates with the Hertz–Knudsen equation;
          rates were used to determine residual-melt and vapor compositions.
      uncertainty:
        note: Ranges and ~ values as printed; no further numeric uncertainty.
