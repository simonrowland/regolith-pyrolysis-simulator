metadata:
  experimental_status: direct_CO2_pressure_measurements_and_sodium_thermochemistry
  source_note: >-
    Table 8 potassium pressures are not reproducible equilibrium values; the
    authors describe multi- or trivariant behavior. No uncertainty is stated
    for the pressure measurements. The paper gives no K4SiO4 formation heat
    or fusion data and explicitly declines to calculate Na4SiO4 formation heat.
