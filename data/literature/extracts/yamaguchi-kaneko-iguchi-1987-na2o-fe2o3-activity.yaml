  source_note: >-
    Printed discrepancies are retained at their own locators without
    normalization: abstract versus Tables 3/4, inconsistent temperature
    boundaries, Table 4's Eq. (A) label versus its caption/body reaction (B),
    and the activity-ratio direction in Eq. (6). No value is inferred from
    Figure 5. Printed uncertainties are statistical only, not total
    experimental/reference uncertainty; confidence level is not stated.
