          na2fe2o4_reaction_as_printed: '2Na3Fe5O9 + 2Na2O(s,l) = 5Na2Fe2O4 (C); Na2O(s,l) + Fe2O3 = Na2Fe2O4 (α,β,γ) (D)'
          na2fe2o4_reduction_as_printed: 'ΔG°(C) = 2RT ln aNa2O(N3F5/NF) (5); ΔG°(Na2Fe2O4) = 1/5[ΔG°(B) + 2RT ln aNa2O(NF/N3F5)] (6)'
