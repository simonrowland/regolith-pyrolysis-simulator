          schema_gap: >-
            simulator/battery/enums.py::Quantity contains no exact EMF quantity,
            and simulator/battery/migrate.py::QUANTITY_ALIASES contains no alias.
            The source's eight EMF fit rows therefore remain typed located context.
          similar_existing_data: kim-2004-na2o-float-glass-emf
          fit_expression_gap: >-
            The exact quantity tokens are present: simulator/battery/enums.py::Quantity.ACTIVITY and
            Quantity.DELTA_FG; simulator/battery/migrate.py::QUANTITY_ALIASES and ::TYPE_QUANTITY
