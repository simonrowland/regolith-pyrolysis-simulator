            does not evaluate it into point observations. Existing coefficient-only fits such as
            data/literature/extracts/chatain-2021-nacro2-thermodynamics.yaml retain typed refusals.
          quantity_unknown_rows: all eight Gibbs fits; reaction-(B) and reaction-(D) energies have no exact reaction-extent quantity token.
          reaction_extent_gap: >-
            simulator/battery/enums.py::Quantity.DELTA_FG and simulator/battery/migrate.py::QUANTITY_ALIASES plus ::TYPE_QUANTITY provide no exact reaction-extent Gibbs-energy quantity. Keep the printed reaction-(B) and reaction-(D) energies quantity-unknown rather than mapping them to per-formula delta_fG.
