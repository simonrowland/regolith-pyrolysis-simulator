deepening:
  class_ledger:
  - measured_direct: apparatus, run conditions, Table 1 experimental Zn rows, Table 2 measured sample rows
  - measured_reduced: experimentally inferred alpha values in Conclusions
  - model_derived: kinetic alpha values and pressure/recondensation relation; generator named above
  - figure_only: no figure-read numeric values admitted
  - compilation_assessed: no independent compilation rows admitted from this paper
  missing_or_unreported:
  - chamber pressure during the laser experiments
  - imposed argon flow rate and pressure-control setpoint
  - sample mass for each individual run; only the introduced 5-40 mg range is printed
  - exposed sample area and orifice/cell geometry; containerless apparatus has no crucible or effusion orifice
  - fO2 control and temperature calibration details beyond external pyrometer
  - run-specific Zn evaporation flux; authors state mass cannot be constrained quantitatively and use Al normalization
  notes:
  - null isotope cells preserve unanalysed rows; they are not zero
  - Table 3 enrichment factors were reviewed as author-reduced data but not copied as point values because the rendered table's
    OCR did not preserve several minus signs and decimal points reliably; the narrative preserves its reported Zn-loss ranges
    and alpha summaries
fidelity_samples:
- path: species.Zn.observations[wimpenny_2019_zn_fractionation_summary].values.alpha
  value: 0.99879
  locator:
    published_page: 24
    section: 6 Conclusions
    note: experimental rhyolitic-soil alpha printed as 0.99879 +/- 0.00013
