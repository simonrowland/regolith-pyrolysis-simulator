  lunar_major_elements:
    observations:
    - observation_id: lpi_1991_major_element_atom_abundances
      type: composition_summary
      locator:
        published_page: 362
        section: 8.3.1
      units: atom_percent_as_published
      values:
        quantity: lunar_major_element_atom_abundance_summary
        method_class: secondary_compilation
        semantics: narrative_summary_of_lunar_surface_materials_not_single_sample
        oxygen_atoms_percent: ">60"
        silicon_atoms_percent: "16-17"
        aluminum_atoms_percent_highlands: 10
        aluminum_atoms_percent_maria: 4.5
        calcium_atoms_percent_highlands: "about 5"
        calcium_atoms_percent_maria: "about 4.5"
        magnesium_atoms_percent: "about 5"
        iron_atoms_percent_highlands: "approximately 2.5"
        iron_atoms_percent_maria: "approximately 6"
        titanium_and_sodium_atoms_percent: "remaining percent or so"
      quote: "More than 60% of the atoms are O; Si contributes 16-17%; Al is about 10% in highlands and 4.5% in mare basalts; Ca and Mg are about 5% each; Fe is approximately 2.5% in highlands and 6% in maria."
    - observation_id: lpi_1991_major_element_weight_abundances
      type: composition_summary
      locator:
        published_page: 363
        section: 8.3.1
      units: wt_percent_as_published
      values:
        quantity: lunar_major_element_weight_abundance_summary
        method_class: secondary_compilation
        semantics: oxide-equivalent_major_element_summary_not_single_sample
        O: "about 45"
        Si: 21
        Al_highlands: "about 13"
        Al_maria: "about 5"
        Ca_highlands: "about 10"
        Ca_maria: "about 8"
        Fe_highlands: "about 6"
        Fe_maria: "about 15"
        Mg_highlands: 5.5
        Mg_maria: 5.5
        Ti_highlands: "fraction of a percent"
        Na_highlands: "fraction of a percent"
        Ti_maria: ">1; may be as high as ~5"
        Na_maria: "fraction of a percent"
      quote: "O is about 45% by weight, Si 21%, Al about 13% for highlands and 5% for maria, Ca about 10% for highlands and 8% for maria, Fe about 6% for highlands and 15% for maria, and Mg 5.5% for both."
    - observation_id: lpi_1991_typical_analytical_sample_size
