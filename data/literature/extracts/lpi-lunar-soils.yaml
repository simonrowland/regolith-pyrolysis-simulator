laboratory_parameters:
  collection_scope:
    value: 'All non-core soil samples returned by the Apollo missions.'
    locator: *introduction
  sample_containers:
    value:
      contingency_and_documented_bags: Teflon bags
      lunar_sample_return_container: 'Aluminum ALSRC; not all containers retained vacuum integrity.'
      special_environmental_sample_container: 'Thin-walled stainless steel container, 6 cm diameter and 12 cm long, with indium-silver alloy gasket.'
    locator: *introduction
  processing_conditions:
    value:
      Apollo_11: 'Initially vacuum chamber, later N2-filled glove cabinets.'
      Apollo_12: 'Processed in vacuum, about 10^-6 torr; some material processed in N2-filled glove cabinets.'
      Apollo_14: 'Processed in stainless-steel, N2-filled glove cabinets held under negative pressure; exhaust monitored by gas chromatography.'
      Apollo_15_to_17: 'Processed in stainless-steel glove boxes filled with dry N2 under positive pressure; exhaust analyzed by gas chromatography.'
    locator: *processing
  sieving_protocol:
    value:
      Apollo_14_wet_sieve_intervals_um: [500, 250, 125, 62.5, 31]
      Apollo_14_sieves: '3-inch diameter stainless-steel sieves; <1 mm aliquots wet-sieved with Freon.'
      Apollo_15_to_17_nominal_fractions: ['<1 mm', '1-2 mm', '2-4 mm', '4-10 mm']
      Apollo_15_to_17_coarse_material: '>10 mm coherent pieces processed as rock.'
      fraction_handling: 'Each fraction was weighed and assigned its own five-digit sample number.'
    locator: *processing
  handbook_data_sheet_semantics:
    value: 'Unless otherwise noted, physical and chemical properties on the Apollo 15-17 data sheets pertain to the 1 mm sieve fraction.'
    locator: *format
  absent_experimental_parameters:
    value:
      vaporization_run: not_reported
      heated_cell_or_furnace: not_reported
      effusion_orifice_geometry: not_reported
      vaporization_run_pressure_history: not_reported
      run_temperature_and_calibration: not_reported
      fO2_control: not_reported
      vaporization_run_duration: not_reported
    locator: *format
