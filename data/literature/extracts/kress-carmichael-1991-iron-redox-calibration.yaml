extraction:
  method: >-
    Scanned PDF; MinerU table drafts supplied the cell source. Physical pages 3-7 and 10 were rendered
    at 600 dpi and checked against the draft values; pages 8-9 were rendered for deferred figure records.
    Table 2 has 83 printed rows although the prose reports 86 measurements. Run 145 alpha is stored as
    printed, 100 (640). Table 5 prints decimal commas in the B105 and B120 log-fO2 cells; the numeric
    values are normalized for migration and the exact spellings are retained as published. Table 2
    acoustic velocity, frequency, and absorption values have no quantity token; fit tables 6-9 and A1
    have model/fit parameters and no store quantity token. Table 4 does not inherit Table 5's fO2 values.
    Figures 1-3 are deferred.
  date: '2026-10-19'
  worker: fam14-1019
