    No MinerU decode. Tables 1-2 transcribed from a 400 dpi pdftoppm render of PDF pages 1-6 (published
    pp. 1337-1342). pdftotext-layout is a noisy OCR layer and was not used as data. Table 1 ion-current
    ratios labelled measured; Table 1 partial pressures and Table 2 a_P2O5 / ln gamma / L_P that pass
    through JANAF P4O10 or slag-metal free-energy functions labelled model_derived. Interaction parameters
    are least-squares of those activity coefficients. Figs 1-3 figure-only. Sample 20 is in Table 1 only;
    composition not invented.
