          quantity_as_printed: ionization cross-section calibration and supporting ion-current measurements
          scope_species: [B2O3, NaBO2, NaPO3, KPO3, Ag]
          candidate_tokens: [ion_intensity, p_partial]
          schema_gap: 'Ionization cross-section itself has no store token; printed supporting calibration values are retained here.'
          apparatus_and_method: 'MS-1301; molybdenum effusion chamber; 30 eV ionizing electrons; silver standard σ(Ag)=5.05 × 10−16 cm2; chamber temperature accuracy ±10 K; ion appearance energy accuracy ±0.3 eV; starting reagent purity at least 99.9%.'
          B2O3: 'Ag+ current 430 arb. units at 1389 K; B2O3+ current 290 arb. units at 1557 K. Ag+ appeared from approximately 1270 K; B2O3+ appeared at 1350 K with appearance energy 14.0 eV; Ag+ appearance energy 7.6 eV. The text repeats measured σ(B2O3)=1.72 × 10−16 cm2 and additive estimate 6.31 × 10−16 cm2; these are also in Table 1 above.'
          NaBO2: 'At approximately 1300 K, vapor spectrum contained Na+, NaBO2+, Na2BO2+, and Ag+. At 1374 K the currents were 72, 72, 45, and 9 arb. units, respectively. Appearance energies were 9.8, 9.9, 11.7, and 7.6 eV. The paper identifies NaBO2+ and Ag+ as molecular ions, Na+ and Na2BO2+ as dissociative-ionization products, and accounts for NaBO2 dimerization in sample mass.'
          NaPO3: 'At approximately 1300 K, Na+, NaPO3+, and Ag+ peaks were recorded. Appearance energies: Na+ 10.2 eV, Ag+ 7.6 eV; NaPO3+ was not measured because of low ion-current intensity. At 1344 K, Na+ and Ag+ currents were 44 and 6.6 arb. units. The paper identifies NaPO3+ and Ag+ as molecular ions and Na+ as a dissociative-ionization product.'
          KPO3: 'At approximately 1320 K, K+ and Ag+ peaks were recorded. Appearance energies: K+ 9.8 eV, Ag+ 7.6 eV. At 1491 K, their currents were 66 and 3.0 arb. units. The paper identifies Ag+ as a molecular ion and K+ as a dissociative-ionization product.'
