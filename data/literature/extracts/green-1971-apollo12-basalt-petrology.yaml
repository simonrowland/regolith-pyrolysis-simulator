        units: as printed
        values:
          melting_charge: Most runs above the solidus used glass prepared by melting 0.3–0.5 g powdered, homogenized lunar sample.
          starting_material_alternatives: Oxide-mix glasses also used for some melting experiments on 12009, 12040 and 12021 and subsolidus work on 12040/12009; no differences from natural-rock glasses were detected.
