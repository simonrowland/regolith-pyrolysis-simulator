          duration: Most runs at T ≥1100°C lasted 1–6 h; run-specific duration assignments are not stated.
          container: Metallic Fe capsules.
          fO2: Authors state redox conditions closely match Apollo 12 natural-rock crystallization, supported by matching Cr, V and Ni in olivine/spinel.
