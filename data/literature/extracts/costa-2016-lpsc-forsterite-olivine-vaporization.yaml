            - '“Many of these planets orbit stars with solar or near-solar composition.”'
            - '“Olivine is also one of the most abundant silicate minerals in the solar system. Its ubiquity is due to its high thermodynamic stability and the large solar elemental abundances of its constituent elements (O, Mg, Si, Fe) [1,2].”'
          background_claims_as_printed: 'Fo-rich olivine is a major constituent of peridotite rock, plausibly the major rock on hot rocky exoplanets such as Kepler-10b, and among the most abundant silicate minerals in the solar system.'
      - observation_id: costa_2016_data_qualifications_and_comparisons
        type: characterization
        locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Summary}
        units: verbatim statement excerpts
        values:
          quantity: data_qualifications
          method_class: quoted_unattributed
          statements:
            - '“Our results confirm preferential evaporation of fayalite (Fa) relative to forsterite (Fo) reported by [1]”'
            - '“near-equilibrium vaporization”'
      - observation_id: costa_2016_results_qualifications
        type: characterization
        locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Results}
        units: verbatim statements
        values:
          method_class: quoted_unattributed
          statements:
            - '“Vapor pressure measurements below the melting point are shown in Fig. 1.”'
            - '“Comparing the measured partial pressure over olivine to those over pure materials lead to thermodynamic activities as a function of inverse temperature.”'
            - '“Partial molar enthalpies are determined from the slope of this plot and listed in Table 1.”'
      - observation_id: costa_2016_methods_qualifications
        type: characterization
        locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Experimental methods}
        units: verbatim statements
        values:
          method_class: quoted_unattributed
          statements:
            - '“An iridium cell was fairly inert to olivine below the melting point; however there was some reaction above the melting point.”'
            - '“The onset of melting was observed at ~2050K, consistent with the literature.”'
            - '“It was also observed that significant losses of FeO occurred at the melting point.”'
      - observation_id: costa_2016_discussion_qualifications
        type: characterization
        locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Discussion}
        units: verbatim statements
        values:
          method_class: quoted_unattributed
          statements:
            - '“These are constructed with all available thermodynamic and phase data at the time of the assessment and provide a self-consistent thermodynamic description of this system.”'
            - '“A comparison of the data from this study to the assessments indicates that the data is consistent with previous measurements and allows inferences about the exact phase composition of the olivine.”'
            - '“It also suggests improvements for future assessments.”'
            - '“Table 1 compares the measured partial molar enthalpies of each component to those calculated from the two databases discussed above.”'
            - '“Agreement between our measurements and the database of Fabrichnaya [6] is reasonable.”'
            - '“The relatively low partial enthalpy of MgO and high partial enthalpy of SiO2 are important and need to be included in future assessments.”'
      - observation_id: costa_2016_summary_page2_qualifications
        type: characterization
        locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Summary}
        units: verbatim statements
        values:
          method_class: quoted_unattributed
          statements:
            - '“Thermodynamic data was taken on this composition below the melting point.”'
            - '“The equilibrium constant for each component’s (MgO, Fe/FeO, and SiO2) were compared to the equilibrium constant for the pure material.”'
            - '“Thermodynamic activities and partial molar enthalpies were derived for these components in olivine.”'
            - '“Our data were compared to activities calculated from two thermodynamic databases in the literature.”'
