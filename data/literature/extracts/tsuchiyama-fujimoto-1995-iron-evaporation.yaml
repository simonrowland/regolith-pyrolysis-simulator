extraction:
  method: MinerU table drafts checked against pdftotext-layout. Table 1 and Table 2 row/column assignments were
    checked against 200 dpi renders of physical PDF pages 2 and 6. The two corpus MinerU passes are duplicate reads
    of the same printed tables; their numeric cells agree. Table 2 standard deviations and Table 1 run metadata
    were hand-assembled because the table emitter cannot join adjacent columns. The paper also estimates pO2 under
    a residual-air assumption; that estimate is retained as text and not mapped to fO2. Its alpha_v comparison uses
    JANAF equilibrium-pressure inputs not stored here, so the reported alpha relation is quoted context, not model_derived.
