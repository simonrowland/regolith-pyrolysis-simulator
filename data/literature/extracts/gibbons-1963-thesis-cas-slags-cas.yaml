        pdf_page_index: 66
        section: The Lime-Alumina System
      units: C
      values:
        method_class: method_only
        experimental_method: gas-slag equilibration in platinum crucibles; sulphurising potential (A value); CaS saturation when sulphur content
          rises markedly for slight increase in sulphurising capacity (figs 4–5)
        temperature_C: 1550
        a_CaS_at_saturation_as_printed: 1
        data_tables_as_printed: Table I (compositions at CaS saturation, CaS-free basis, PDF p. 55); Tables II and III (lime-alumina and lime-alumina-silica run results, PDF pp. 56–58).
        plots_as_printed: figs. 4, 5 and 6; lime activities at CaS saturation plotted in fig. 7
        how_equilibrium_shown_as_printed: CaS free phase at saturation so aCaS=1; correction for change in CaS-free lime % from
          S gain/loss is approximate and within experimental error except one point
        a_CaO_formula_at_sat_as_printed: 'aCaO = 1/(K · A) at CaS saturation (thesis p. 49)'
        equilibrium_constants_as_printed:
