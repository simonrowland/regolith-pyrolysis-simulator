source_id: vickerfalt-2024-autogenous-slag-thesis
source:
  citation: Vickerfält, A. (2024). A study of an autogenous slag for steel production with consideration of possible
    vanadium extraction. Doctoral Thesis in Material Science, KTH Royal Institute of Technology, Stockholm. ISBN
    978-91-8040-836-3.
  year: 2024
  provenance_path: raw/vickerfalt-2024-autogenous-slag-thesis/vickerfalt-2024-autogenous-slag-thesis.pdf
  note: This thesis repeats phase-diagram measurements from Vickerfält et al. (2020) and Vickerfält et al. (2024).
    Tables 7-15 are retained as linked context; the thesis copies are not scored twice. The unique H-DRI and autogenous-slag
    data in Tables 4-6 are typed where d-223 has a compatible phase role.
extraction:
  method: pdftotext-layout primary; Tables 4-6 hand-transcribed and checked against 600 dpi page renders; table-tool
    MinerU conversion returned no tables; figures deferred.
  date: '2026-10-22'
  worker: codex-resume-7103-1792656483
  review_status: draft
  note: Table 4 analyzed slag/iron compositions and author-reported LP/LV are unique to the thesis extract. Table
    5 liquid rows have possible slow-cooling precipitation. Table 6 liquid rows are typed; solid phase compositions
    are context because PhaseRole has no solid role. Tables 7-15 and Figures 30-34 duplicate two published articles
    and remain linked context.
