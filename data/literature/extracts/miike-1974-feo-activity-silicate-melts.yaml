schema_version: literature_extract.v1
source_id: miike-1974-feo-activity-silicate-melts
source:
  citation: Miike, K., Morinaga, K., Suginohara, Y. & Yanagase, T. (1974). Activity of FeO in the silicate
    melts. Journal of the Mining and Metallurgical Institute of Japan 90(1036), 411–416.
  year: 1974
extraction:
  method: MinerU table draft; four table blocks map to printed Tables 1–3. All numeric body cells and
    row/column assignments were checked against the rendered PDF page because the cells are absent from
    pdftotext.
  date: '2026-10-25'
  worker: w1025a-mii74
  notes: 'Tables 1–3 report 24 rows (Table 1: six, Table 2: ten, Table 3: eight) of liquid-slag compositions
    in wt% and mol%, temperature, measured e.m.f., calculated P_O2, and calculated a_FeO (24 rows). The
    paper prints no gamma_FeO values. The standard formation Gibbs energy is stated, but a pure FeO reference
    phase is not. Total pressure is not printed. Figure-only activity curves, including Fig. 5, are candidates
    for later figure reading and were not digitised.'
review_status: draft
