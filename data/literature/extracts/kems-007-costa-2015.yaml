          apparatus figures (field/source apertures are collimation, not cell
          orifices). Partial multi-orifice observation only — do not invent Clausing.
      uncertainty:
        note: high-side of measured D(Fe+) band adopted as conservative pin; figure scatter ~0.011–0.020
        alpha_range: [0.011, 0.02]
      equipment:
        multi_orifice_series:
          value:
            n_cells: 3
            cell_material: Mo
            orifice_sizes: different_diameters_not_stated_numerically
            method: Whitman-Motzfeld
            restricted_collimation: true
            definitions:
              W_A: transmission factor of the cell body
              W_B: transmission factor of the orifice
              A: cross sectional area of the cell
              B: cross sectional area of the orifice
              f: W_B * B / A
              alpha_from_two_cells: >-
                α = (f2 − f1·(I1/I2)) / ((I2/I1) − 1) using ion intensities of
                cells with different orifice geometries
            note: >-
              Numeric orifice diameters and transmission factors not given in OCR
              text; apparatus schematic shows field aperture 1 mm diam and source
              aperture 2 mm diam (molecular-beam collimation, not Knudsen orifice).
