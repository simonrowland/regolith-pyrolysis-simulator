schema_version: literature_extract.v1
source_id: ta-mendybaev-2020-lpsc
source:
  citation: >-
    Mendybaev, R. A., Shornikov, S. I., Jacobson, N. S. & Kowalski, B. (2020),
    "Thermodynamics and Evaporation Kinetics of CAI-like Melts", 51st Lunar and
    Planetary Science Conference, abstract 2168.
  url: https://www.hou.usra.edu/meetings/lpsc2020/pdf/2168.pdf
  year: 2020
  conference: 51st Lunar and Planetary Science Conference
extraction:
  method: >-
    Corpus PDF raw/ta-mendybaev-2020-lpsc/ta-mendybaev-2020-lpsc.pdf (2-page LPSC
    abstract 2168). Clean text layer via pdftotext -layout; no OCR and no figure
    digitisation. Landed the NASA Glenn TGA free-surface vs Knudsen SiO2 rates
    and the resulting experimental gamma_Si ~0.04. Model-fit gamma_Mg/gamma_Si
    values used to match CMAS evaporation profiles (Figs 1-2) are retained only
    as context (author fits assuming a thermodynamic model), not as measured
    alpha observations. Figure 1-3 curves not digitized.
  date: '2026-09-22'
  worker: n4-cai-liquid-evaporation
  provenance_path: data/literature/extracts/ta-mendybaev-2020-lpsc.yaml
review_status: draft
corrections: []
scope_assessment:
  document_type: 2-page LPSC conference abstract (CAI-like melt thermodynamics / TGA kinetics)
  measured_direct_observations: 3
  method_observations: 2
  figure_only_observations: 0
  model_fit_context_rows: 1
  absent_from_source:
  - digitized Fig. 1a/1b evaporation profiles
  - digitized Fig. 2 multi-composition trajectories
  - digitized Fig. 3 TGA weight-loss curve points
  - activities a_i measured for CAI-like compositions (authors state none available)
  - gamma_Mg experimental determination (deferred to future work)
  - absolute sample masses and Ir-loop surface areas beyond diameter/orifice claims
  note: >-
    Distinguishes true evaporation coefficients (gamma_i = J_i,free / J_i,eq from
    Langmuir vs Knudsen TGA) from profile-fit gammas that absorb thermodynamic-
    model error. Only the TGA-derived gamma_Si and the two printed SiO2 rates are
    scored.
