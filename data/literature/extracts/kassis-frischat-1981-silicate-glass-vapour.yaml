extraction:
  method: >-
    Manual extraction from the two-page scan. No pressure table is printed;
    Figure 2 was digitized at the four labelled temperatures 1300, 1250, 1200,
    and 1150 °C using the logarithmic pressure axis. Values are approximate
    readings in Pa and are marked figure_only. The plotted Kroeger and
    Soerstroem comparison series is excluded because it belongs to the cited
    work. The abstract's overall pressure envelope is ≈3×10^-2 to 3 Pa. The
    paper gives total-pressure vaporization enthalpies and entropies but no
    explicit log p = A - B/T fit or printed validity interval. No uncertainty
    width or confidence level is stated.
  date: '2026-10-12'
  worker: codex
review_status: draft
