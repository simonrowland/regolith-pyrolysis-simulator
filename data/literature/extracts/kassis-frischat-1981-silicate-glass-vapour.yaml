schema_version: literature_extract.v1
source_id: kassis-frischat-1981-silicate-glass-vapour
source:
  citation: "Kassis N. and Frischat G.H. (1981). Vapor Pressures of Simple Silicate Glass Melts. Journal of the American Ceramic Society 64:C28–C29."
  doi: 10.1111/j.1151-2916.1981.tb09566.x
  url: https://doi.org/10.1111/j.1151-2916.1981.tb09566.x
  year: 1981
extraction:
  method: >-
    Manual extraction from the two-page scan. Figure 2 was rendered at 600 dpi and
    redigitized from its printed axis ticks. It reports the elemental partial
    pressures pNa and pRb and the total pressures of the two glass systems;
    the Kroeger and Soerstroem comparison curve is excluded. Figure readings are
    approximate, retained to two significant figures, and marked figure_only.
    Figure 1's specific vaporization-rate series is not extracted. The abstract's
    rate envelope and Figure 2's printed thermochemical values are preserved as
    context below. No equation fit, extrapolation, or uncertainty width is added.
  date: '2026-10-13'
  worker: codex
review_status: draft
