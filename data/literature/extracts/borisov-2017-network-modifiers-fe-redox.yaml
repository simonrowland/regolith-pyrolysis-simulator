review_status: draft
extraction:
  method: Born-digital paper transcribed from the authoritative pdftotext-layout source. The table tool accepts
    only MinerU content-list drafts; no MinerU table blocks are present, so Table 1 was hand-structured from the
    text layer and all 702 Table 1 cells were checked against 600 dpi renders of physical PDF pages 4 and 5. Ditto
    condition cells and the printed same-run note bind rows 19–36 to one run despite the sample suffix changing
    from -93 to -94. Tables 2 and 3 model coefficients were checked against 600 dpi renders of physical PDF pages
    11 and 12. Figures 1–8 were inspected on 600 dpi renders and recorded without numeric points. Table 1 omits
    one or both alkali oxide values in every row; those incomplete glass compositions remain unknown. Air is recorded
    as the atmosphere and numeric fO2 remains unknown because no log fO2 is printed. Figure 2 composition and Figure
    6 residual quantities have no matching store tokens and remain context-only.
  date: '2026-10-19'
  worker: fam16-1019
  audit_files:
  - tests/fixtures/borisov_2017_table1_render_grid.psv
