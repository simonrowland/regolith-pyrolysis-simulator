            - '(1) (PO) = 1/4(P2) + 1/2(PO2)'
            - '(2) (SnPO2) = (SnO) + (PO)'
            - '(3) (SnPO3) = (SnO) + (PO2)'
            - '(4) (PO2) = (PO) + (O)'
            - '(5) (O2) = 2(O)'
            - '(6) pO = K4 pPO2 / pPO'
            - '(7) pO2 = pO^2 / K5'
            - '(8) (PO) = 1/2(P2) + (O)'
            - '(9) (PO2) = 1/2(P2) + 2(O)'
            - '(10) (PO) + (PO2) = (P2) + 3(O)'
            - '(11) (SnO) = (Sn) + (O)'
