extraction:
  method: >-
    Manually transcribed from 400 dpi renders of the six-page corpus PDF; pdftotext -layout
    was used to locate material, not as the source for numeric cells. Tables 1–5 transcribed
    in full: Table 1 has 10 observed-ion rows, Table 2 has 8 vapor-species rows, Table 3 has
    7 system rows, Table 4 has 4 composition rows, and Table 5 has 6 composition rows (35
    printed rows total). Five rows were checked digit-by-digit against the page renders:
    Table 1 47(PO)+ and 183(SnPO2)+; Table 2 (PO); Table 4 xSnO=40.0; Table 5 xSnO=40.0.
    Dashes are recorded separately from numeric zeroes. Table 1 literature comparison
    columns and Table 2 literature data columns are transcribed as printed and attributed
    to their cited sources.
  date: '2026-10-09'
  worker: cshilov-x1
