      - observation_id: ivanova_2018_qualifying_and_directional_statements
        type: qualitative_result
        locator: {page: 1, published_page: 1, pdf_page_index: 0, section: "Introduction, Experimental and analytical methods, Results and Discussion", note: "Container locator; the claims span pp. 1-2 (pdf_page_index 0-1). Each claim carries its own page locator."}
        units: verbatim prose
        values:
          method_class: quoted_unattributed
          claims:
            - quote: "The bulk compositions of CAIs record the cumulative effects of these high-temperature and largely volatility-controlled processes during the first several million years of solar system history [1]."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Introduction}
            - quote: "The calculations showed that unlike for most other CAI composition melts, evaporation of a melt with a spinel-rich and calcium-poor CAI composition (5aN) starts with faster evaporation of Si over Mg, resulting in a compositional trend that well fits the CAI compositions of CH-CB chondrites [2]."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Introduction}
            - quote: "Unlike most CAIs from CV chondrites, 5aN is a pristine fine-grained spinel-rich inclusion with no traces of melting or evaporation."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Introduction}
            - quote: "Its Al2O3-enriched bulk composition has a non-solar CaO/Al2O3 ratio of ~0.3."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Introduction}
            - quote: "The bulk chemical composition of 5aN is plotted in the anorthite field of spinel-rich CAIs on a Ca2SiO4-Al2O3-Mg2SiO4 diagram [2]."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Introduction}
            - quote: "Most of the run products (Fig. 1a) consist of intergrowths of quench textured ‘Christmas tree’-like spinel and glass."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Results}
            - quote: "The most evaporated samples 5aN-1 and 5aN-7 which lost all its MgO and SiO2 (Table 1) are composed mostly of hibonite and CaAl2O4 with a minor amount of CaAl4O7 (Fig. 1b)."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Results}
            - quote: "It is interesting to note that as evaporation proceeds spinel gradually becomes more saturated in Al2O3 compared to the stoichiometric one."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Results}
            - quote: "As a starting material in the experiments we used a CAI 5aN-like composition prepared by mixing MgO, SiO2, Al2O3 and CaCO3 with CaO/Al2O3 ratio of ~0.3."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Experimental and analytical methods}
            - quote: "One run (‘5aN-3’) was quenched as soon as the furnace temperature have reached 1900°C); its analyzed composition is taken as the starting composition in all our experiments."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Experimental and analytical methods}
            - quote: "% Mg and % Si lost have been calculated relative to 5aN-3 (0 min run) chemical compositions of which has been considered as a starting composition of the samples before evaporation at 1900 °C"
              locator: {page: 1, published_page: 1, pdf_page_index: 0, table: "1", note: "Transcribed wording as printed, including the grammatical construction; the printed footnote ends at '1900 °C' with no terminal period."}
            - quote: "As refractory Ca and Al do not evaporate under conditions of the experiments (CaO/Al2O3 ratio in evaporation residues would remain constant until all Si and Mg are lost), the weight loss of samples is caused by evaporation of Mg and Si."
              locator: {page: 1, published_page: 1, pdf_page_index: 0, section: Results}
            - quote: "First, note good agreement between calculated and experimentally determined trends."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "Second, evaporation of 5aN starts with much faster loss of Si compared to Mg, which is similar to the initial CAIB trend."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "This might be due to the fact that the initial chemical compositions of both 5aN and CAIB melts are plotted in anorthite stability field in Fig. 2."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "As evaporation proceeds, the rates of Si and Mg loss become comparable, and in highly processed 5aN melt Mg evaporates faster than Si and the trend shifts toward Ca-aluminates."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "In case of evaporation of more SiO2-rich and MgO-poor CAIB melt with CaO/Al2O3=1.2, the residual melt evolves toward gehlenite-rich melilite."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "Unlike our 5aN and CAIB melts, an initial faster loss of Mg compared to Si was observed when MgO-rich forsteritic melts were evaporated in vacuum [4, 7] and in thermodynamically calculated trends for several CAIs from CV chondrites [2, 3, 9]."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "Note also the different evaporation trajectories of 5aN and CAI4 melts with the same MgO/Al2O3 and SiO2/Al2O3 ratios (~1.1 and ~1.5 correspondingly, where 5aN and CAI4 curves intersect in Fig. 3), yet differnent CaO/Al2O3."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results, note: "'differnent' is the printed spelling (authors' typo for 'different'), confirmed on the page image and PDF text layer; kept as printed. The earlier 'different evaporation trajectories' ('dif-ferent' across a line break) is spelled correctly in print."}
            - quote: "Taken together, these differences in evaporation trajectories are most likely due to the difference in starting melt compositions. This suggests that melt structure plays an important role during the evaporation process."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Results}
            - quote: "As shown on Fig. 2, the compositional trends of evaporated 5aN, CAIB and CAI4 melts obtained in experiments and by theoretical model calculations are very similar."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Discussion}
            - quote: "The experiments confirms our thermodynamic calculations based on the theory of associated solutions and on experimental data for activities of oxides in the system CaO-MgO-FeO-Al2O3-TiO2-SiO2 [3,8]."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Discussion, note: "Verbatim, keeping the printed grammar ('confirms'). Comparative statement (experiments versus calculation) and the stated model basis (associated-solution theory plus oxide-activity data) of the calculated trends in Figs. 2-3."}
            - quote: "Both experiments and calculations show that evaporation of CAI 5aN-like melt results in a compositional trend that well fits the CAI compositions of CH-CB chondrites [2] (Fig. 2)."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Discussion}
            - quote: "The reason why the evaporative trend of 5aN-like melt is different from those with other compositions studied (like CAIB or CAI4) is not clear: it might be due to the melt composition being in the anorthite stability field with high concentrations of Al2O3; or is caused by acidity-basicity factors of the melts [10]."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Discussion}
            - quote: "Our results showed that spinel-rich melts can be possible precursors for very refractory population of CAIs from CH-CB chondrites."
              locator: {page: 2, published_page: 2, pdf_page_index: 1, section: Discussion}
