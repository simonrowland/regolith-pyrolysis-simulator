      units: as printed
      standard_state: Equation (1) integrates ln a(SiO2) from the limit x(Al2O3) = 0 up to
        x(Al2O3). The paper does not state whether that limit is a solid oxide, a liquid oxide,
        or a polymorph, and it does not say a pure-silica cell was measured at 2220 K.
