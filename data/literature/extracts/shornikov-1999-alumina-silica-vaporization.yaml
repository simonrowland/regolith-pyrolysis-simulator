      values:
        sentence_as_printed: The position of the point in the liquidus line also dictated the
          choice of the standard state for calculations of the activity of aluminum oxide.
        equation_as_printed: ln a(Al2O3) = −∫ from x(SiO2)=0.263 to x(SiO2) of
          [x(SiO2)/(1−x(SiO2))] d ln a(SiO2)
        equation: '(3)'
        anchor_as_printed: x(SiO2) = 0.263
        anchor_kind: liquidus composition
        phase_as_printed: The paper does not name a pure-oxide phase for this reference.
        expected_migration_phase: unknown
        schema_gap: A pure-endmember standard state cannot express an activity anchored at
          x(SiO2) = 0.263. No activity row is stored, so no row carries an invented field.
