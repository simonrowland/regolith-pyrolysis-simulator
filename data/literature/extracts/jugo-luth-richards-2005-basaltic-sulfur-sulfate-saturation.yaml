schema_gaps:
- observation_id: jugo-luth-richards-2005-basaltic-sulfur-sulfate-saturation_table5_formula_units_totals_mgno_context
  reason: The code supports physical phase cr, but crystal/mineral phase composition is refused because simulator/battery/enums.py::PhaseRole
    has no crystal role and simulator/battery/migrate.py::_phase_row_rejection requires one. Cations per formula
    unit and Mg-no. lack exact tokens under simulator/battery/enums.py::PHASE_BASIS_TOKENS, simulator/battery/enums.py::Quantity
    and simulator/battery/migrate.py::QUANTITY_ALIASES.
- observation_id: jugo-luth-richards-2005-basaltic-sulfur-sulfate-saturation_table6_formula_units_total_context
  reason: Crystal oxide composition is refused because simulator/battery/enums.py::PhaseRole has no crystal role
    and simulator/battery/migrate.py::_phase_row_rejection requires one. Formula-unit amounts have no basis token
    in simulator/battery/enums.py::PHASE_BASIS_TOKENS. Fe3+/ΣFe is retained in context because its measured_reduced
    lineage uses the estimated Fe3+ cation row, which cannot be a scorable crystal observation without that role.
- observation_id: jugo-luth-richards-2005-basaltic-sulfur-sulfate-saturation_table7_formula_units_and_totals_context
  reason: Crystal oxide compositions are refused because simulator/battery/enums.py::PhaseRole has no crystal role
    and simulator/battery/migrate.py::_phase_row_rejection requires one. Formula-unit amounts and totals are also
    retained as context because no exact basis / quantity token covers them.
- observation_id: jugo-luth-richards-2005-basaltic-sulfur-sulfate-saturation_table8_formula_units_and_totals_context
  reason: Crystal oxide compositions are refused because simulator/battery/enums.py::PhaseRole has no crystal role
    and simulator/battery/migrate.py::_phase_row_rejection requires one. Formula-unit amounts and totals are also
    retained as context because no exact basis / quantity token covers them.
- observation_id: jugo-luth-richards-2005-basaltic-sulfur-sulfate-saturation_sulfate_qualitative_eds_context
  reason: The paper states quantitative sulfate WDS composition could not be obtained; qualitative EDS does not
    provide a supported numeric phase composition.
