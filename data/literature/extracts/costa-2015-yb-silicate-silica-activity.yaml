  year: 2015
  corpus_asset: raw/costa-2015-yb-silicate-silica-activity/costa-2015-yb-silicate-silica-activity.pdf
extraction:
  method: >-
    Born-digital pdftotext-layout was checked against 600 dpi renders of the paper's tables, figures and relevant prose. Figures are metadata-only, deferred records. The 2018 published corrigendum was checked against its 600 dpi render and is retained with the erroneous original Table 2 as context; the cycle-derived elemental formation enthalpy is not scored because its inputs have no registered table asset.
  date: '2026-10-21'
  worker: fam33b-1020
review_status: draft
