      - observation_id: hashimoto_2021_model_setup
        type: rate_series
        locator: {page: 2, section: '2.1 Methods'}
        phase: primordial_CI_like_dust_aggregate
        regime: authors_3_plus_2_component_numerical_fitting
        units: as_published
        values:
          quantity: numerical_model_parameters_and_constraints
          method_class: model_derived
          generator: authors_3_plus_2_component_numerical_fitting
          components: [jet-droplet, differential_vapor, integrated_vapor, final_integrated_vapor, CI_star]
          oxide_elements: [Na, Mg, Al, Si, K, Ca, Ti, Cr, Mn, Fe]
          linear_system: 'A_m,n F_n = B_m; m=1-5, n=1-5'
          step_size_q: 1.001
          q_definition: 'X_Al,k / X_Al,k-1'
          CI_star_fs_temporarily: 0.5
          CI_star_fs_solution_range: '0.3-1.0'
          final_vaporization_degree_relation: 'final VD is twice the VD producing average chondrule composition'
          positive_solution_constraint: 'all F_n positive'
          fit_constraints: [average_chondrule_Na, average_chondrule_Fe, bulk_chondrite_composition]
