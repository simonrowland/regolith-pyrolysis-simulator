schema_version: literature_extract.v1
source_id: doyle-1988-feo-activity-multicomponent-magma
source:
  citation: Doyle, C.D. (1988). Prediction of the activity of FeO in multicomponent magma from known values in [SiO2-KAlO2-CaAl2Si2O8]-FeO
    liquids. Geochimica et Cosmochimica Acta 52, 1827–1834.
  year: 1988
extraction:
  method: 'Manual transcription from MinerU table drafts and pdftotext; all Table 1A row/column assignments were
    checked against the PDF page 4 render. Table 1B has no MinerU table block; all cells were checked against the
    page 5 render. Table 1A has 129 printed composition/activity rows: Fig. 2A 30, Fig. 2B 33, Fig. 2C 38, Fig.
    2D 28, matching the abstract. Each activity row is a liquid activity at 1600±2 K; Table 1A compositions are
    run-product glasses, and the paper states no quench-preservation claim. Table 1B fO2 values are printed as -log10
    fO2 with two decimals and no pressure reference; the controller ruling allows the migrator bare-log default
    bar because bar/atm differs by 0.0057 dex, below the 0.01 dex printed resolution. The values are kept verbatim
    as printed in fO2_as_printed and signed fO2_log for migration. Table 1A activities are author-reduced using
    Eq. (5), a_FeO = f_O2^0.5 exp(28719.2/T - 5.837). The stated standard state is molten Fe0.947O (Coughlin, 1954);
    the schema has no exact reference-state token for this nonstoichiometric liquid, so that standard state remains
    prose and the typed schema gap is recorded. Equations attached as printed: (4) Fe(metal) + 0.5O2(gas) = FeO(liquid);
    (3) a_FeO^magma = a_FeO^SKAnF × Fe/(Fe+Mn+Mg+Ca^ex); (5) above; (6) a_FeO^this study/a_FeO^Doyle and Naldrett
    = exp(-1043.9/T + 0.085). The paper prints gamma_FeO = a_FeO/X_FeO but gives no numerical activity coefficients
    or EMF values. The quoted a_FeO=1.93 is attributed to Stull and Prophet (1971), for stoichiometric liquid FeO
    at the Fe-O liquid coexisting with iron at 1380±5°C. Figures 2–6 have plotted values not transcribed; they are
    figure-only candidates. Table1A dashes are retained as absent, not zero. Table 1B prints ''+0.02'' under the -log10 fO2 heading; it is recorded as the shared ±0.02 log10 fO2 uncertainty on all eight setpoints and their 129 joined Table 1A conditions, without changing any central value.'
  date: '2026-11-02'
  worker: codex
review_status: draft
