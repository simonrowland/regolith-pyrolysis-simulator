          page: 6
          published_page: 1898
          pdf_page_index: 5
          table: 'II'
          note: >-
            All five temperature rows checked against the page render. Candidate token checked: sulfur_solubility_and_sulfate_capacity_series, but this is a record type rather than a scalar Quantity token and cannot express L_SO2^c in mol/(m3 bar). The additional minimum Budd-curve values are author-reported comparisons, not this study's measurements.
        units: mol/(m3 bar) SO2
        values:
          quantity: sulfite_solubility_at_one_bar_sulfur_dioxide
          method_class: measured_reduced
          solubility_symbol: L_SO2_c
          rows:
