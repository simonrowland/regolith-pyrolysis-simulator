      - observation_id: beerkens_2003_sodium_oxide_activity_1673K_context
        type: derived_value_context
        locator:
          source_path: corpus/raw/beerkens-2003-sulfate-decomposition-na2o-activity/beerkens-2003-sulfate-decomposition-na2o-activity.pdf
          page: 6
          published_page: 1898
          pdf_page_index: 5
          note: >-
            The text prints about 1.7×10^-8 for the float-glass Na2O activity at 1673 K. It is derived using Ka, a(Na2SO4)=1, p(SO2)=0.666 bar, and p(O2)=0.33 bar; the derivation also depends on the Kpc determination. Candidate token: activity. Kpc values are figure data or temperature fits rather than stored rows; no corpus TABLE_CSV asset exists for the inputs. Retained pending the required TABLE_CSV lineage (controller t-1382). The paper estimates a maximum error of 30–40% for the derived activity.
        units: dimensionless activity
        values:
          quantity: sodium_oxide_activity
          method_class: measured_reduced
          formula: Na2O
          temperature_K: 1673
          value_as_published: about 1.7 × 10^-8
          inputs_as_published:
            sodium_sulfate_activity: 1
            sulfur_dioxide_partial_pressure_bar: 0.666
            oxygen_partial_pressure_bar: 0.33
            equilibrium_constant: Ka from Eq. (3); Kpc determination as described in the paper
          standard_state: >-
            Pure liquid sodium oxide at the experiment temperature; the paper defines oxide and sulfate activities relative to pure phases at the same temperature. At 1673 K, pure Na2O is liquid above the JANAF Na-012 alpha-to-liquid transition at 1405.2 K (inferred stable phase).
          standard_state_inferred: true
          standard_state_basis: JANAF Na-012, alpha-to-liquid transition at 1405.2 K; 1673 K is above the pure oxide melting transition.
          derivation_pending: corpus TABLE_CSV asset (controller, t-1382)
