            - {temperature_K: 1723, float_glass: 6.14, model_glass: 15.7, minimum_budd_curve_model_glass: unknown}
            - {temperature_K: 1773, float_glass: 5.4, model_glass: 13, minimum_budd_curve_model_glass: 8}
          method: >-
            Derived as Kcon/Kpc from the square-wave voltammetry peak and fining sulfur-retention measurements. The quoted minimum Budd-curve values are for the model glass.
