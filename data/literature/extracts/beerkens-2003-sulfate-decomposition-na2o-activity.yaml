schema_version: literature_extract.v1
source_id: beerkens-2003-sulfate-decomposition-na2o-activity
source:
  citation: >-
    Beerkens, R. G. C. (2003). "Sulfate Decomposition and Sodium Oxide Activity in Soda–Lime–Silica Glass Melts," Journal of the American Ceramic Society 86(11), 1893–1899.
  doi: 10.1111/j.1151-2916.2003.tb03578.x
  year: 2003
extraction:
  method: >-
    Born-digital pdftotext-layout reading with PDF-render verification of the tables and figure inventories. Table I reports measured total sulfur solubility at sodium-sulfate-gall saturation, and Table II reports sulfite solubility, but neither has a matching scalar quantity token in this seat. Figures 1–6 are recorded with no digitised points. The author-reported approximate Na2O activity at 1673 K is derived from Kpc, the sulfate-saturation result, and gas pressures; the necessary Kpc input is plotted or represented by a fit without a registered table asset, so it is retained in context pending the required TABLE_CSV lineage.
  date: '2026-10-20'
  worker: fam35-1021
review_status: draft
species:
  S:
    observations: []
    context:
      - observation_id: beerkens_2003_table_i_sulfur_saturation_context
        type: table_context
        locator:
          source_path: corpus/raw/beerkens-2003-sulfate-decomposition-na2o-activity/beerkens-2003-sulfate-decomposition-na2o-activity.pdf
          page: 3
          published_page: 1895
          pdf_page_index: 2
          table: 'I'
          note: >-
            Six table rows were checked against the page render; the 1573 K model-glass cell and 1723 K float-glass cell are blank, not zero. Maximum total sulfur solubility, expressed as dissolved S in mol/m3: 1573 K model blank, float 0.69; 1623 K model 0.68, float 0.63; 1673 K model 0.66, float 0.635; 1698 K model blank, float 0.63; 1723 K model 0.67, float blank. The model glass is 74 wt% SiO2, 16 wt% Na2O, 10 wt% CaO. The float glass is 72.2 wt% SiO2, 13.4 wt% Na2O, 9.5 wt% CaO, 2.2 wt% MgO, 1.5 wt% Al2O3, 0.9 wt% K2O. Measured after isothermal furnace treatment with excess sodium sulfate, equilibrium with a pure sodium sulfate gall; total dissolved sulfur by XRF. Candidate tokens checked: concentration_series and equilibrium_phase_composition; neither stores a measured total sulfur solubility scalar in mol/m3.
        units: mol/m3 dissolved S
        values:
          quantity: maximum_sulfur_solubility_at_sodium_sulfate_gall_saturation
          method_class: measured_direct
          rows:
            - {temperature_K: 1573, model_glass_mol_m3: unknown, float_glass_mol_m3: 0.69}
            - {temperature_K: 1623, model_glass_mol_m3: 0.68, float_glass_mol_m3: 0.63}
            - {temperature_K: 1673, model_glass_mol_m3: 0.66, float_glass_mol_m3: 0.635}
            - {temperature_K: 1698, model_glass_mol_m3: unknown, float_glass_mol_m3: 0.63}
            - {temperature_K: 1723, model_glass_mol_m3: 0.67, float_glass_mol_m3: unknown}
