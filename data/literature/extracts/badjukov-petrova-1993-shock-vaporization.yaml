schema_version: literature_extract.v1
source_id: badjukov-petrova-1993-shock-vaporization
source:
  citation: 'Badjukov D.D. and Petrova T.L. (1993). Vaporization by shock loading of albite, jadeite, and pyrex glass: Experimental study. Lunar and Planetary Science XXIV, 51–52, abstract 1026.'
  url: https://www.lpi.usra.edu/meetings/lpsc1993/pdf/1026.pdf
  year: 1993
extraction:
  method: 'Manual transcription from rendered pages 1–2 (printed pp. 51–52). The abstract reports numerical shock-pressure estimates, total vaporized-matter estimates, and calculated atomic Na/Al vapor ratios in text. Figures 1 and 2 show bulk melt compositions; their plotted individual compositions are not transcribed here because they are not vapor or condensate compositions. Figure 3 compares tektites and proposed source rocks using data from references (8–11); no plotted values are transcribed.'
  date: '2026-10-13'
  worker: badj93-1013
review_status: draft
species:
  Albite:
    observations:
    - observation_id: badj93_albite_shock_vaporized_mass
      type: mass_loss
      locator: {page: 1, pdf_page_index: 0, published_page: 51, figure: '2', note: 'Text paragraph beginning “The albite and jadeite glasses contain steel droplets”; loss estimate refers to albite glass.'}
      phase: glass
      regime: shock_fusion_vaporization
      units: wt.%
      values:
        quantity: mass_loss_fraction
        method_class: author_estimate
        points:
        - mass_loss_pct: 4.0
          approximate: true
          T_C: 5000
          starting_composition_as_printed: pure albite powder
          mass_loss_as_printed: about 4 wt. %
          assumption_as_printed: Assuming that Si was not lost during the shock fusion
          point_conditions:
            temperature_K:
              state: {tag: value, value: 5273.15}
              locator: {page: 1, pdf_page_index: 0, published_page: 51, section: 'Experimental study', note: 'Unit conversion only from printed shock temperature about 5000 C.'}
          locator: {page: 1, pdf_page_index: 0, published_page: 51, figure: '2', note: 'Text paragraph beginning “The albite and jadeite glasses contain steel droplets”; loss estimate refers to albite glass.'}
      uncertainty:
        note: No numerical uncertainty or confidence level is stated for this mass-loss estimate.
    context:
    - observation_id: badj93_albite_atomic_vapor_na_al_ratio
      type: composition
      locator: {page: 1, pdf_page_index: 0, published_page: 51, figure: '2', note: 'Text paragraph beginning “The albite and jadeite glasses contain steel droplets”; calculated atomic Na/Al ratio in vapor.'}
      units: atomic ratio, as printed
      values:
        quantity: calculated_atomic_vapor_composition_ratio
        method_class: author_derived
        evidence_class: printed_author_calculation
        gas_species: Na and Al, elemental atomic ratio
        atomic_Na_over_Al: 1.3
        attribution_as_printed: The calculated atomic Na/Al ratio in the vapor is equal to 1.3 for the albite and jadeite glasses
    - observation_id: badj93_albite_shock_loading_method_and_pressure_conditions
      type: method
      locator: {page: 1, pdf_page_index: 0, published_page: 51, section: 'Experimental study', note: 'Paragraph beginning “Powder samples of pure albite and jadeite were shocked”.'}
      units: GPa, °C, km/s, as printed
      values:
        quantity: shock_loading_method_and_conditions
        method_class: method_only
        setup_as_printed: Powder samples of pure albite and jadeite were shocked in steel cylindrical containers surrounded by high explosive. Due to a geometry of a shock wave propagation and a porosity of the samples, high pressure and temperature were generated in an area located along the sample cylinder axis.
        peak_pressure_GPa_as_printed: about 70
        shock_temperature_C_as_printed: about 5000
        pressure_uncertainty_as_printed: achieved shock parameters cannot be determined exactly
        sample_condition_as_printed: chips of vesiculated glasses were picked up from central part of the samples
        analysis_method_as_printed: electron probe with using the broad beam method
        duration: not stated
        ambient_pressure_or_gas: not stated
