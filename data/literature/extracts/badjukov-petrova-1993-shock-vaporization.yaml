      units: wt.%, as printed
      values:
        quantity: analysis_totals_and_boron_loss
        method_class: measured
        initial_pyrex_analysis_total_wt_pct_as_printed: about 84.5
        initial_analysis_total_explanation_as_printed: that should be due to presence of boron
        shock_fused_pyrex_analysis_total_wt_pct_as_printed: about 86
        shock_fused_analysis_interpretation_as_printed: that suggest a B loss during the impact fusion
    - observation_id: badj93_steel_droplets_and_iron_in_glasses
      type: characterization
      locator: {page: 1, pdf_page_index: 0, published_page: 51, figure: '1', note: 'Paragraph beginning “The albite and jadeite glasses contain steel droplets”.'}
      units: as printed
      values:
        quantity: sample_characterization
        method_class: measured
        albite_and_jadeite_glasses: contain steel droplets that could come into the melt from walls and bottoms of the containers
        albite_black_areas: contain dissolved iron as a minor component
        jadeite_glass: slightly enriched in Fe
    - observation_id: badj93_pyrex_al_loss_uncertainty_statement
      type: characterization
      locator: {page: 1, pdf_page_index: 0, published_page: 51, figure: '2', note: 'Paragraph beginning “The albite and jadeite glasses contain steel droplets”; qualitative Al-loss comparison.'}
      units: as printed
      values:
        quantity: qualitative_aluminum_loss_and_uncertainty
        method_class: measured
        result_as_printed: The Al loss for the pyrex glass appears to be smaller, although it lies out of the range of the analytical uncertainties.
        numeric_uncertainty_width: not stated
        confidence_level: not stated
    - observation_id: badj93_figure3_cited_tektite_comparison
      type: method
      locator: {page: 2, pdf_page_index: 1, published_page: 52, figure: '3', note: 'Caption identifies data from references (8–11); panel compares tektites, irgizites, and proposed source rocks.'}
      units: as printed
      values:
        quantity: cited_comparison_figure
        method_class: figure_only
        caption_as_printed: 'Fig.3. Na2O–Al2O3–SiO2 relationship among tektites, irgizites (open symbols) and their proposed source rocks (solid symbols). Data from (8–11).'
        digitization_status: not digitised; plotted data are attributed to references (8–11)
    - observation_id: badj93_shock_loading_method_and_pressure_conditions
      type: method
      locator: {page: 1, pdf_page_index: 0, published_page: 51, section: 'Experimental study', note: 'Paragraph beginning “Powder samples of pure albite and jadeite were shocked”.'}
      units: GPa, °C, km/s, as printed
      values:
        quantity: shock_loading_method_and_conditions
        method_class: method_only
        pyrex_setup_as_printed: Pyrex glass projectiles were launched with velocity of 6 km/s onto a silicate target; remelted projectile glasses adhering to the shock fused agglutinates were studied.
        pyrex_projectile_velocity_km_s: 6
        pyrex_projectile_peak_pressure_range_GPa: [51, 65]
        pyrex_peak_pressure_condition_as_printed: depending on impedances of the targets
        analysis_method_as_printed: electron probe with using the broad beam method
        experimental_temperature_for_pyrex: not stated
        duration: not stated
        gas_or_ambient_pressure: not stated
        container_for_pyrex: not stated
        figure_1_caption_as_printed: 'Fig. 1. Bulk chemistry of melts for albite, jadeite (a), and pyrex glass experiments onto a Al2O3–SiO2–Na2O diagram.'
        figure_2_caption_as_printed: 'Fig. 2. Na2O–Al2O3–SiO2 relationships among melts produced by shock experiments. The composition of the melts shows depletion both Na2O and Al2O3 relative to initial matter.'
        figure_3_cited_sources_as_printed: '(8–11)'
