species:
  Fe2O3:
    observations:
    - observation_id: suzuki_2026_hematite_mass_loss_1200C
      experiment: hematite-vacuum-heating-1200C
      type: mass_loss
      locator:
        pdf_page_index: 3
        published_page: 'Article in Press; no printed page number'
        figure: '2'
        equation: '1'
        section: Results
      phase: condensed_solid
      regime: vacuum_chamber_pyrolysis
      units: wt% as printed
      values:
        quantity: mass_loss_fraction
        method_class: measured_direct
        T_C: 1200
        mass_loss_wt_pct: 3.5
        starting_material_as_printed: hematite reagent powder, Fe2O3
        sample_form_as_printed: pressed pellet
        product_phases_as_printed:
        - magnetite, Fe3O4
        oxygen_reaction_as_printed: 6Fe2O3(s) -> 4Fe3O4(s) + O2(g)
        reduction_outcome_as_printed: Complete reduction to magnetite
      uncertainty:
        note: No uncertainty width or confidence level is stated for the 3.5 wt% result; Methods reports a 0.1% balance uncertainty without specifying its basis.

    context:
    - observation_id: suzuki_2026_hematite_oxygen_pressure_ratio
      experiment: hematite-vacuum-heating-1200C
      type: laboratory_conditions
      locator:
        pdf_page_index: 3
        published_page: 'Article in Press; no printed page number'
        figure: '2'
        section: Results
      units: times as printed
      values:
        printed_quantity: oxygen partial pressure with sample relative to blank
        printed_value: 50-100 times higher initially; gradually decreased to the value without sample
        oxygen_yield_or_extraction_ratio: Not reported for this figure result; the abstract separately reports 0.03 g oxygen removed from a 1 g initial hematite pellet.
    - observation_id: suzuki_2026_hematite_abstract_oxygen_removed
      experiment: hematite-vacuum-heating-1200C
