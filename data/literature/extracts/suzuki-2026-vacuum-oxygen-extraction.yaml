species:
  Fe2O3:
    observations:
    - observation_id: suzuki_2026_hematite_mass_loss_1200C
      experiment: hematite-vacuum-heating-1200C
      type: mass_loss
      locator:
        pdf_page_index: 3
        published_page: 'Article in Press; no printed page number'
        figure: '2'
        equation: '1'
        section: Results
      phase: solid pellet before heating; magnetite after heating
      regime: vacuum_reduction
      units: wt% as printed
      values:
        quantity: mass_loss_fraction
        method_class: measured_direct
        T_C: 1200
        mass_loss_wt_pct: 3.5
        duration_h: 1.5
        starting_material_as_printed: hematite reagent powder, Fe2O3
        sample_form_as_printed: pressed pellet
        product_phases_as_printed:
        - magnetite, Fe3O4
        oxygen_reaction_as_printed: 6Fe2O3(s) -> 4Fe3O4(s) + O2(g)
        reduction_outcome_as_printed: Complete reduction to magnetite
      uncertainty:
        note: No uncertainty width or confidence level is stated for the 3.5 wt% result; Methods reports a 0.1% balance uncertainty without specifying its basis.

    context:
    - observation_id: suzuki_2026_hematite_oxygen_pressure_ratio
      experiment: hematite-vacuum-heating-1200C
      type: laboratory_conditions
      locator:
        pdf_page_index: 3
        published_page: 'Article in Press; no printed page number'
        figure: '2'
        section: Results
      units: times as printed
      values:
        printed_quantity: oxygen partial pressure with sample relative to blank
        printed_value: 50-100 times higher initially; gradually decreased to the value without sample
        oxygen_yield_or_extraction_ratio: Not reported; mass loss and oxygen partial pressure are the reported measures.

  Fe2SiO4:
    observations: []
    context:
    - observation_id: suzuki_2026_fayalite_melting_and_oxygen_pressure
      experiment: fayalite-vacuum-heating-1500C
      type: laboratory_conditions
      locator:
        pdf_page_index: 4
        published_page: 'Article in Press; no printed page number'
        figure: '2'
        section: Results
      units: °C and times as printed
      values:
        melting_observation: The pellet melted when heated to 1330 °C.
        oxygen_partial_pressure_as_printed: At 1500 °C, initially 10 times the no-sample value, then gradually decreased to the no-sample value.
        oxygen_yield_or_extraction_ratio: Not reported.
        mass_loss: Not reported for the fayalite pellet.
        product_phases: No phase assemblage is assigned to the pure-fayalite run.

  fayalite_alumina_mixture:
    observations: []
    context:
    - observation_id: suzuki_2026_fayalite_alumina_mixture_products
      experiment: fayalite-alumina-vacuum-heating-1500C
      type: laboratory_conditions
      locator:
        pdf_page_index: 4
        published_page: 'Article in Press; no printed page number'
        figure: '2'
        section: Results
      units: phases and composition as printed
      values:
        starting_mixture_as_printed: fayalite and alumina mixture; mixture proportion not stated
        melting_observation: Partially melted while retaining the pellet shape
        product_phases_as_printed:
        - hercynite, FeAl2O4
        - corundum, Al2O3
        - recrystallized fayalite, Fe2SiO4
        product_phase_origin_as_printed: Hercynite formed by reaction of iron oxide in the melt with the alumina container.
        silica_fate_as_printed: SiO2 constituent was likely partly removed as SiO and O2 gaseous species or retained in the glass matrix.
        mass_loss: Not reported for this mixture.
        oxygen_partial_pressure_as_printed: Higher than for the pure-fayalite pellet; no ratio stated.
        oxygen_yield_or_extraction_ratio: Not reported.

