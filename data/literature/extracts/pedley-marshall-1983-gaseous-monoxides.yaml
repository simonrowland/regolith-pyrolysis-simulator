      - observation_id: pedley_marshall_1983_appendix_ii_page_1021_footnotes
        context_id: pedley_marshall_1983_appendix_ii_page_1021
        type: compilation_table
        locator: {published_page: 1021, appendix: II}
        units: cm-1 as printed
        values:
          quantity: molecular_parameter_definitions_and_footnotes
          method_class: literature_parameter_compilation
          rows: []
          notes: ["Data from Huber and Herzberg [3] unless otherwise indicated (see footnotes which follow). Energy units are cm-1.", "Definitions: g, statistical weight of electronic level; Te, term value; omega_e, fundamental frequency; omega_e x_e, anharmonicity correction; Be, rotational constant; alpha_e, rotational-vibrational interaction constant; De, centrifugal distortion constant.", "Term symbols marked ? are unknown but assumed not to be sigma states.", "a. Lanthanide monoxide parameters were estimated using an ionic model: 80MUR/HIL observed that their dissociation energies could be explained by an ionic model with doubly charged metal ion configuration 5d14f^n (n = 0 for La2+ and n = 14 for Lu2+). Predominantly ionic bonding implies similar potential energy curves near the minimum and little change in omega_e and Be, as indicated by LaO, CeO, and LuO. Remaining gaseous lanthanide monoxide values were interpolated from those three species. Hund's rule gives multiplicities rising from 2 for LaO to 9 for GdO then falling to 2 for LuO. LaO and LuO have 2Sigma+ ground states, indicating the 5d electron has ml = 0, probably because the orbital contributes a polarisation term to the ionic model. Retaining this d orbital and filling higher-value 4f orbitals first gives nonzero total angular momentum except for GdO, where maximum spin imposes the 9Sigma state.", "b. Ground-state electronic configuration was estimated by comparison with other monoxides in the same Periodic Table group."]
