          notes:
            - "Rows follow the printed periodic-table blocks (Main Group Elements, Transition Elements, Lanthanides, Actinides) left to right, top to bottom; element is the printed column head and formula is its monoxide. The O cell is the O-O molecule and is carried as formula O2 (interpretation of the periodic-table layout; the printed head is O)."
            - "D0_printed is the literal printed token; parentheses mark author estimates (estimated: true) and a printed < is kept in D0_relation with the numeric bound in the value column."
            - "Cells with footnote a or b print no bracketed uncertainty; uncertainty_printed is false and no uncertainty value is carried (typed absence, not zero)."
            - "Footnote b (As) states an upper limit from Huber and Herzberg; no inequality sign is printed on the As value, so D0_relation keeps the printed '=' and the upper-limit meaning is carried in footnote/attribution."
            - "The title prints no temperature subscript. All 68 formulas of Tables 4-5 also appear here; Tables 4-5 head that column D°0 (see cross_table_notes). No temperature is inferred for this table."
            - "Species with a value here but no row in Tables 4-5: CO, NO, O2, FO, ClO, AsO, BrO, RbO, IO, TlO, TcO, HgO, PmO, PaO."
          cross_table_notes:
            - "Au: this table prints 52.3 [5]; Table 4 (p. 982) prints AuO D°0 52.5 ± 5.0. Both are stored as printed and not reconciled; Table 7 prints 219, which 52.3 x 4.184 = 218.8 and 52.5 x 4.184 = 219.7 both round to."
            - "Cd prints (55) and Re prints (149); Table 4 prints the estimated D°0 as 55.4 and 148.8. Table 7 Cd (232) agrees with 55.4 x 4.184 = 231.8 rather than 55 x 4.184 = 230.1."
            - "21 bracketed uncertainties here are printed to fewer digits than Table 4's D°0 uncertainty (Be, Al, Si, Se, Ba, Sc, Ti, V, Fe, Co, Y, Zr, La, Hf, Ir, Ce, Er, Tm, Th, U, Pu; e.g. Sc [2.5] vs 2.7, V [5] vs 4.5, Th [3] vs 2.9). Stored as printed."
            - "S prints 123.6 with footnote a (Huber and Herzberg) and no bracketed uncertainty, while Table 4 prints SO D°0 123.6 ± 1.0, class 1."
            - "Every other D0 value of the 68 shared species equals the Table 4 D°0 value, including the < bounds on In and Zn and the parentheses on Cd, Os, Pd and Re."
