scope_assessment:
  document_type: Critical compilation and assessment of thermochemical literature.
  completed_scope: Tables 4–5, selected standard enthalpies of formation and dissociation energies for gaseous monoxides; Tables 6–7, dissociation energies in periodic-table order (located context); Tables 8–9, calculated Gibbs energy functions (located context, model_derived); Tables 10–11, calculated enthalpy functions (located context, model_derived); Appendix II, molecular parameters for gaseous monoxides.
