    pdf_page_index: 2
    paragraph: formation enthalpy
    note: Prose 12.9 ± 0.8 kJ/mol, checked on the 600 dpi render of PDF page 3.
experiments:
- experiment_id: shornikov-2002-doklady-solid-kems
  kind: kems
  locator:
    page: 1
    published_page: 82
    pdf_page_index: 0
  method: Knudsen effusion mass spectrometry, molybdenum cells, eight compositions, 1676–2327 K. The paper
