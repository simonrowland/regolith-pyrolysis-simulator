          x-axis y=3541, x=5430-8913, T ticks 1700/1800/1900/2000/2100 at x=5692/6502/7232/7886/8478,
          log10(p) ticks -3/-4/-5/-6 at y=1659/2277/2885/3442; (b) y-axis x=5522, y=3971-6238,
          x-axis y=6238; (c) y-axis x=5430, y=6719-9130, x-axis y=9130. The low-T crop of panel (a),
          x=5460-7000 and y=2300-3520, is the region of the claimed isolated VIII near 1740 K.
          The diamond at the top of that crop is the legend entry, not a datum. A 2 px opening
