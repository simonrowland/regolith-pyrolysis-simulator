    the dotted fit lines or symbols still crossed by those dashes; each has an audit row.
    Figure 3 is a broken-axis schematic on S/M/A labels and was not digitized. The mullite
    formation enthalpy keeps the printed least-squares lineage; the Gibbs-energy grid is not printed.
  date: '2026-10-20'
