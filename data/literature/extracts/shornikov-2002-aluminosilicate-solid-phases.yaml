    - observation_id: shornikov_2002_transition_enthalpies
      type: quoted_phase_transition_estimate
      locator:
        page: 3
        published_page: 84
        pdf_page_index: 2
        note: Author estimates. The sentences are on published page 84, which is PDF page 3. Partial pressures below 10^−9 atm. Not fusion enthalpies of a pure endmember.
      units: kJ/mol
      values:
        M_plus_S_to_M_plus_liquid_and_S_plus_liquid_maximum_kJ_mol: '5'
        bound: do not exceed
        M_plus_A_to_A_plus_liquid_kJ_mol: 13 ± 10
        note_as_printed: The 13 ± 10 kJ/mol estimate exceeds published values, which are typically no
          higher than 3 kJ/mol.
    - observation_id: shornikov_2002_evaporation_coefficients_not_measured
      type: quoted_assumption
      locator:
        page: 2
        published_page: 83
        pdf_page_index: 1
      units: dimensionless
      values:
        reason: Direct experimental data on the partial evaporation coefficients for the aluminosilicate
          system are unavailable. They were assumed equal to silica [11] and alumina [12]. Not stored
          as alpha.
    - observation_id: shornikov_2002_fig2_pressures_not_digitized
      type: figure_partial_pressure_overlap
      locator:
        page: 2
        published_page: 83
        pdf_page_index: 1
        figure: '2'
        note: log p(SiO), log p(Al), and log p(O) versus T. Eight compositions, open symbols in silica–mullite
          and filled symbols in mullite–alumina, plus changed-composition replicas. Symbols overlap. Lines
          are silica [10], the S–M and M–A summaries, and alumina from Drowart [13] and Shornikov [14].
      units: atm
      values:
        method_class: figure_only
        reason: '1200 dpi PDF page 2. Panel frames, page pixels: (a) y-axis x=5430, y=1155-3541,
          x-axis y=3541, x=5430-8913, T ticks 1700/1800/1900/2000/2100 at x=5692/6502/7232/7886/8478,
          log10(p) ticks -3/-4/-5/-6 at y=1659/2277/2885/3442; (b) y-axis x=5522, y=3971-6238,
          x-axis y=6238; (c) y-axis x=5430, y=6719-9130, x-axis y=9130. The low-T crop of panel (a),
          x=5460-7000 and y=2300-3520, is the region of the claimed isolated VIII near 1740 K.
          The diamond at the top of that crop is the legend entry, not a datum. A 2 px opening
          leaves 24x24 dash cores of the dotted lines (area about 417) and a few larger cores
          still crossed by dashes. Three filled diamonds at (5898.5, 2903.8), (6042.5, 2897.7) and (5892.5, 2993.5)
          match legend VIII and are stored on shornikov_2002_fig2a_sio_viii. Every other core
          has its own audit row. Replica filled symbols are changed composition, and the new
          mole percent is not printed, so the stored value is the printed 84.14 mol% Al2O3.
          The same overlap holds on panels (b) and (c).'
        sample_mol_percent_Al2O3: 1.19, 3.31, 12.84, 28.20, 60.00, 67.63, 70.21, 84.14
        temperature_span_as_printed_K: 1676–2327
    - observation_id: shornikov_2002_fig3_schematic
