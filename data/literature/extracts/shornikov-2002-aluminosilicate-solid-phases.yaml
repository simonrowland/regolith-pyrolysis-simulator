species:
  Al6Si2O13:
    observations:
    - observation_id: shornikov_2002_mullite_delta_fH
      type: gibbs_table
      regime: kems_effusion
      locator:
        page: 3
        published_page: 84
        pdf_page_index: 2
        equation: '6'
        note: Least squares of ΔfG over 1676–2180 K. The same digits are later tabulated as this work
          in shornikov-2003-mullite-thermodynamics (RJPC 77(7) 1044–1050) with a printed span 1720–2180
          K and a 1950 K row label. This row keeps the Doklady wording and the 1676–2180 K span. No single
          temperature is printed here, so none is invented.
      units: kJ/mol
      phase: cr
      standard_state: 'The paper recommends the enthalpy of formation of mullite from oxides over 1676–2180
        K (published page 84, equation (6)). It does not state whether those oxides are pure solid or
        pure liquid endmembers. The reference phase is not stated. The 2026-10-20 pure-oxide phase inference
        is not applied: equations (4) and (5) compare partial pressures between the heterogeneous regions
        adjacent to mullite, not ion currents over a pure oxide in the cell.'
      per: mol_species
      experiment: shornikov-2002-doklady-solid-kems
      derivation:
        relation: Least squares of the Gibbs energies of formation from equations (4) and (5)
          over 1676-2180 K. The Gibbs-energy grid is not printed.
        output_unit: kJ/mol
        raw_inputs:
          state: {tag: value, value: not_printed}
          locator:
            page: 3
            published_page: 84
            pdf_page_index: 2
            equation: '6'
            note: Equations (4) and (5) supply the Gibbs energies. The grid is not printed.
              Equation (6) is the least-squares result on published page 84.
      values:
        quantity: delta_fH
        method_class: measured_reduced
        value_as_printed: 12.9 ± 0.8
        value: '12.9'
        temperature_span_as_printed: 1676–2180
        equation_as_printed: ΔfG_T(M) = ΔfH_T(M) − T ΔfS_T(M)
        attribution: this work, least squares of the Gibbs energies from equations (4) and (5)
      uncertainty:
        value: '0.8'
        unit: kJ/mol
        basis: as printed
        note: confidence level not stated
      T_range_K:
      - 1676.0
      - 2180.0
    context:
    - observation_id: shornikov_2002_mullite_delta_fS_schema_gap
      type: quoted_prose_schema_gap
      locator:
        page: 3
        published_page: 84
        pdf_page_index: 2
        equation: '6'
        note: Printed with the enthalpy. The extract schema has no token for formation entropy delta_fS,
