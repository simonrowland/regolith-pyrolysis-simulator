schema_version: literature_extract.v1
source_id: sugawara-2011-sodium-silicate-fusion-mixing
source:
  citation: >-
    Sugawara, T.; Shinoya, K.; Yoshida, S.; Matsuoka, J. (2011). Thermodynamic mixing properties of liquids in the
    system Na2O-SiO2. Journal of Non-Crystalline Solids 357, 1390–1398.
  doi: 10.1016/j.jnoncrysol.2010.09.064
  year: 2011
  url: https://doi.org/10.1016/j.jnoncrysol.2010.09.064
extraction:
  method: >-
    Transcribed from the MinerU table blocks and born-digital pdftotext layout. Table 1, Table 2 and Table 3 row/column
    assignments and every stored numeric cell were checked against renders of PDF pages 2, 3 and 5. Figure-only values
    were not digitized.
  date: '2026-11-02'
  worker: w1103su11-su11
  note: >-
    Table 1 reports three corrected DSC fusion results and three liquid mixing enthalpies calculated from those results
    and Table 2 data. The results prose adds two full-formula DSC fusion values, four attributed comparison values, and
    a weighted mean at NS composition. Table 2 supplies five liquid heat-capacity values, four solid heat-capacity
    equations, five fusion enthalpies (three calculated from the fitted model), and five solid enthalpies at Tm stored
    as typed-refused input observations. Table 3 reports the ten fitted h_i and s_i coefficients. Integral liquid enthalpy of mixing has no
    exact quantity token and the three Table 1 values plus the weighted mean are retained as typed-refused data. Table 1 and Table 2 disagree in the N2S silica composition (66.4 vs 66.6 mol%); both are
    preserved as printed. Table 1 prints 26.6 for 1/2 Na2SiO3 and the prose prints 53.2 for Na2SiO3 on its full formula
    basis; both are retained as printed. Table 1 and its prose report different Na2Si2O5 fusion enthalpies (14.5 for
    1/3 Na2Si2O5 vs 29.0 for Na2Si2O5); neither is converted or reconciled. Table 1 gives the eutectic melting
    temperature as 1064 K, while Table 2 gives 1164 K at the same printed composition; both table values are preserved.
