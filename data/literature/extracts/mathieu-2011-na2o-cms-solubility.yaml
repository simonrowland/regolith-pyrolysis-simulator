schema_version: literature_extract.v1
source_id: mathieu-2011-na2o-cms-solubility
source:
  citation: Mathieu, R., Libourel, G., Deloule, E., Tissandier, L., Rapin, C. & Podor, R. (2011). Na2O
    solubility in CaO–MgO–SiO2 melts. Geochimica et Cosmochimica Acta, 75(2), 608–628.
  year: 2011
  doi: 10.1016/j.gca.2010.11.028
  provenance_path: raw/mathieu-2011-na2o-cms-solubility/mathieu-2011-na2o-cms-solubility.pdf
  note: Table 6 has 29 CMS glass rows, 3 NCS rows, and the End-member-NS2 source row. Five CMS rows and
    all three NCS rows are the same experiments already represented in the Mathieu (2009) sodium-solubility
    thesis. The 2011 Eq. (9)/(15) corrections differ from the thesis results, but these experiments are
    not admitted again here. The NS2 source row is a calibration reference, not a CMS melt.
extraction:
  method: Transcribed from the born-digital pdftotext and MinerU table drafts. Table 5 row/column layout
    checked against the page 10 render; Table 6 layout checked against page 11. Table 6 CMS31 Na2O wt%
    uncertainty was render checked because MinerU and pdftotext read the flagged cell as 0.212.
  date: '2026-11-03'
  worker: w1103cw3-ma11
  note: The extract retains the 24 unique CMS glass compositions in Table 6. It stores the printed Na2O
    wt% as the single composition value; the equivalent mol% is retained as a source-value string rather
    than a converted unit twin. Gamma is stored as a dimensionless coefficient normalized from the printed
    γ×10^6 column; the printed cell and scale are retained. All Table 6 parenthetical uncertainties are
    2 SD. The Table 6 values are the authors' own measurement reductions. Normalized Na2O values are
    measured_reduced from Table 5 EPMA by Eq. (9); gamma values are measured_reduced using Table 6 mol%
    and Table 4 source activity by Eq. (15). The printed inputs are located in each derivation but are not
    parent observations.
    The source's direct quench statement is preserved, but it does not assert glass
    preservation. The paper reports total pressure only for preparation, not during the run; the 1 atm
    in Fig. 9(a) is for the Na-free comparison and is not assigned to Fig. 9(b) CMS data. Figure-only
    solubility/activity curves are noted as digitization candidates and are not sampled.
