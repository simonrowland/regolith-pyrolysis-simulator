source_id: gran-2011-thesis-high-basicity-cmas-liquidus
source:
  citation: Gran, J. (2011). Some Fundamental Aspects Concerning Secondary Steelmaking. Doctoral thesis,
    Royal Institute of Technology (KTH).
  year: 2011
  corpus_asset: raw/gran-2011-thesis-high-basicity-cmas-liquidus/gran-2011-thesis-high-basicity-cmas-liquidus.pdf
  sha256: 17d30fc1ec3175eba336bab4c8f4e6ee730be20fdef82f35dfa7a227d30c081a
  corpus_sha256: 17d30fc1ec3175eba336bab4c8f4e6ee730be20fdef82f35dfa7a227d30c081a
extraction:
  method: Manual transcription of Table 12 liquid compositions and estimated component activities at 1873
    K from PDF pages 44–45 (printed pages 35–36). The table calls these estimates; all are retained as
    model-derived, not measured. Table footnotes mark the two separate Al2O3 estimates as calculated using
    thermodynamic data [32] and [33]. The discussion on PDF page 45 states that the Al2O3 estimate depends
    strongly on MgO.Al2O3 formation Gibbs-energy data and the stoichiometric-spinel assumption.
  date: '2026-11-26'
  worker: w1126homgsi
  audit_file: data/literature/extracts/audits/gran-2011-thesis-high-basicity-cmas-liquidus.cells.csv
  note: Table 12 covers 25 and 35 mass% Al2O3 liquidus sections. Periclase-bearing samples have CaO, MgO
    and two separate Al2O3 estimates; CaO-only samples have CaO and MgO estimates. Liquid compositions
    are the printed mass percentages in column order CaO, Al2O3, SiO2, MgO.
