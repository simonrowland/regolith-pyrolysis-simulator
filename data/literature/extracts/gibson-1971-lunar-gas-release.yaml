benches:
- id: gibson-1971-mettler-finnigan
  identity: {basis: described_in_this_work}
  apparatus_family:
    state: {tag: value, value: Mettler recording vacuum thermoanalyzer interfaced with a Finnigan 1015S/L quadrupole mass spectrometer}
    locator: &proc
      page: 2
      pdf_page_index: 1
      published_page: 1352
      section: Experiment Procedures
      note: "Proof string beginning on published p. 1352 and continuing on p. 1353: 'The lunar samples were analyzed utilizing a Mettler recording vacuum thermoanalyzer interfaced with a Finnigan 1015S/L quadrupole mass spectrometer (Gibson and Johnson, 1971). The mass spectrometer source was placed directly in the reaction chamber.'"
  cell_material_and_liner:
    state: {tag: value, value: previously outgassed 16 mm diameter platinum crucible}
    locator: *proc
  detector:
    state: {tag: value, value: Finnigan 1015S/L quadrupole mass spectrometer with the source placed directly in the reaction chamber; spectra obtained every 12.5°C; reproducible background spectra from bakeout subtracted}
    locator: &proc1353
      page: 3
      pdf_page_index: 2
      published_page: 1353
      section: Experiment Procedures
      note: "Proof strings on p. 1353: 'Spectra were obtained every 12.5°C during the heating cycle. Reproducible background spectra were obtained during the bakeout procedures before sample analysis began and were later subtracted from the obtained spectra.'"
  temperature_measurement:
    state: {tag: value, value: calibrated platinum/platinum-10% rhodium thermocouples located at the base of the sample crucibles}
    locator: *proc1353
  balance_sensitivity_mg:
    state: {tag: value, value: '0.05'}
    locator:
      page: 3
      pdf_page_index: 2
      published_page: 1353
      section: Experiment Procedures
      note: "Proof string starting at the end of p. 1352 and opening p. 1353: 'The sensitivity of the analytical balance used for weight loss studies was 0.05 mg.'"
experiments:
- experiment_id: gibson-1971-vacuum-pyrolysis-4c-min
  bench_id: gibson-1971-mettler-finnigan
  method: vacuum_chamber_pyrolysis
  locator: *proc1353
  sample:
    printed_set:
      state:
        tag: value
        value: "Apollo 11 soil 10086,16; Apollo 11 breccia 10073,23; Apollo 11 crystalline rock 10017,57 (surface chip); Apollo 12 soil 12023,9; Apollo 12 crystalline rock 12022,38 (interior chip). Soil samples were neither crushed nor homogenized. Breccia and crystalline rock came from 2.5 g samples previously homogenized (< 60 mesh)."
      locator:
        page: 3
        pdf_page_index: 2
        published_page: 1353
        section: Experimental Results
  conditions:
    temperature_K:
      state: {tag: unknown, reason: "Programmed heating from room temperature to 1400°C, not a single setpoint."}
      locator: *proc1353
    heating_rate_C_per_min:
      state: {tag: value, value: '4'}
      units: °C/min
      locator: *proc1353
    peak_T_C:
      state: {tag: value, value: '1400'}
      units: °C
      locator: *proc1353
  pressure_environment:
    total_pressure_Pa:
      state: {tag: unknown, reason: "Only the evacuation pressure 2 × 10^{-6} torr is printed, not a converted pascal point or a distinct running pressure."}
      locator: *proc
    vacuum_torr_as_printed:
      state: {tag: value, value: "evacuated to 2 × 10^{-6} torr"}
      locator: *proc
    sweep_gas:
      state:
        tag: unknown
        reason: Vacuum pyrolysis is described (evacuated to 2 × 10^{-6} torr); no sweep or carrier gas is printed.
      locator: *proc
