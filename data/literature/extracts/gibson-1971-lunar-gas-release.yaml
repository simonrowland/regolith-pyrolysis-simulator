source:
  citation: "Gibson, E. K., Jr. & Johnson, S. M. (1971), Thermal analysis-inorganic gas release studies of lunar samples, Proceedings of the Second Lunar Science Conference, Vol. 2, pp. 1351–1366, The M.I.T. Press."
  year: 1971
  bibcode: 1971LPSC....2.1351G
  url: https://ui.adsabs.harvard.edu/abs/1971LPSC....2.1351G
  corpus_asset: raw/gibson-1971-lunar-gas-release/gibson-1971-lunar-gas-release.pdf
extraction:
  method: "Scanned LPI/ADS PDF with no usable text layer. All tabulated numbers were read from 400 dpi crops of Table 1 (published p. 1360) and Table 2 (published p. 1361). Prose numbers and figure-caption sample weights were read from 200 dpi pdftoppm renders of all 16 pages (1351–1366). Figures 1–5 ion-intensity vs temperature curves are figure-only and were not digitized. Concentrations printed as em-dashes in Table 2 are recorded as not reported, never guessed. Cited analyses from other workers (Chang, Friedman, Maxwell, Hanneman, Stoenner, Lambert, and others) are not stored as this paper's measurements. A printed discrepancy between the Fig. 1 caption sample weight 242.94 mg and the Table 1 weight 242.96 mg for 10086,16 is retained in both places; neither value was altered."
  date: '2026-11-12'
  worker: w1112emp-gj71
  provenance_path: raw/gibson-1971-lunar-gas-release/gibson-1971-lunar-gas-release.pdf
review_status: draft
