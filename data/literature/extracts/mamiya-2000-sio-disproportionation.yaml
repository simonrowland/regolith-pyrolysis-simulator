      - observation_id: mamiya_2000_fig4_12_kinetic_fit_and_activation_energy
        type: thermodynamic_example
        locator:
          page: 99
          published_page: 93
          pdf_page_index: 99
          section: 4.6 Arrhenius plot on the Si crystallization
          equation: unnumbered
          note: Fitted relation and activation energy from Fig. 4-12 data; 900 C omitted from the 1000-1300 C fit.
        units: k unit as Fig. 4-14 (s-1); activation energy in kJ mol-1
        values:
          quantity: first-order Si crystallization rate constant and fitted activation energy, as printed
          method_class: derived_least_squares
          reaction_as_printed: 2SiO(amorphous) -> Si(crystal) + SiO2(amorphous)
          kinetic_relation_as_printed: (I/Imax) = 1 - exp(-k t); I is XRD intensity; Imax is its maximum; k is velocity constant; t is reaction time
          arrhenius_relation_as_printed: k = A exp(-E*/RT); log k = log A - (E*/R)(1/T)
          fitted_equation_as_printed: log k = 9.190 - 9884.7 x (1/T)
          fitted_parameter_as_printed: E* = 82.2 kJ mol-1
          fit_method_as_printed: least squares method
          fit_temperature_range_C: 1000 to 1300
          fit_data_source: time dependence of crystallized Si amount from Fig. 4-12 represented by first-order curves in Fig. 4-13
          excluded_data_as_printed: 900 C data; authors state crystallization was incomplete after 10 hours and omit these data from kinetic analysis
          uncertainty_as_printed: vertical bars on calculated k in Fig. 4-14 estimated from standard deviation; no numerical widths or confidence level stated
          limitations_as_printed: authors note different maximum I/Imax values and possible oxidation by intermigrated oxygen in flowing gas
        point_conditions:
          <<: *run_conditions
          temperature: {state: {tag: value, value: fit range 1000 to 1300 C}, locator: {page: 99, published_page: 93, pdf_page_index: 99, section: 4.6 Arrhenius plot on the Si crystallization}}
