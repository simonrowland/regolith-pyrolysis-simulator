- what: typed melt-composition quantity for the Fig. 1 Na2O wt% series
  reason: the current typed schema has no melt-composition-series quantity; raw digitized values and locators are retained and an amendment is proposed
- what: typed sodium evaporation-flux quantity for the Fig. 2 jNa series and fits
  reason: the current typed schema has no surface-flux quantity with the paper's printed (Na2O=20 wt%)/(cm^2 sec) units; raw values and locators are retained and an amendment is proposed
- what: typed activity-polynomial quantity for Eqs. (5)-(6)
  reason: the current typed schema has no model-parameter home for a printed log-activity polynomial; all coefficients and the equation locators are retained and an amendment is proposed
- what: numeric values of the calculated fitting curves drawn in Fig. 1
  reason: curves are model lines without printed point values; only central experimental markers were digitized
- what: numeric values of the visible Fig. 1 error bars
  reason: error-bar magnitudes are not printed or tabulated
- what: individual H2/CO2 mixing ratios and component partial pressures
  reason: the paper names H2-CO2 streams and target p(O2), but does not print the mixing ratios or component pressures
- what: ambient Na partial pressure p(Na) and recondensation flux
  reason: Eq. (2) explicitly says p(Na) is usually unknown in these experiments
- what: sample mass and exposed melt surface area
  reason: not printed in the two-page abstract
- what: identities of runs that crystallized tridymite
  reason: the paper says those runs were excluded but does not identify them by time, p(O2), or charge
- what: independently measured Na flux in absolute SI units
  reason: Fig. 2 reports jNa only as plotted and the paper does not provide a calibration or unit conversion beyond the plotted quantity
