          The activity of Na2O was found to vary from 1 × 10^{-7} at 40% Na2O
          to 5 × 10^{-5} at 60% Na2O at 1200 °C.
        original_japanese_conclusion: >-
          1200℃ では Na2O が 40 mol% から 60 mol% へ増加するに従い、
          Na2O の活量は 1×10^{-7} から 5×10^{-5} へと増加した。
        composition_window_as_published: 33% to 60% Na2O (synopsis); figures use mol%
        temperatures_C:
        - 1100.0
        - 1200.0
        - 1300.0
      uncertainty:
        note: >-
          Order-of-magnitude synopsis endpoints, not Table 2 coefficients.
          60 mol% value has no Table 2 row.
