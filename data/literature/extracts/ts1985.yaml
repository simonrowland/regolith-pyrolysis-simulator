source_id: ts1985
source:
  citation: >-
    Tsukihashi, F. & Sano, N. (1985), "Measurement of the Activity of Na2O in
    Na2O-SiO2 Melts by Chemical Equilibration Method" / 「化学平衡法による
    Na2O-SiO2 系融体中の Na2O の活量の測定」, Tetsu-to-Hagane (鉄と鋼)
    71(7), 815-822.
  doi: 10.2355/tetsutohagane1955.71.7_815
  url: https://doi.org/10.2355/tetsutohagane1955.71.7_815
  year: 1985
extraction:
  method: >-
    Manual visual transcription from PDF page images of
    docs/references/pdfs/99-kems-langmuir/ts1985.pdf (Japanese body + English
    synopsis/table captions). Tabulated coefficients taken from Table 1 and
    Table 2; no figure digitization of Fig. 4. Japanese captions/headers
    retained alongside translation. 2026-08-27: Table 2 A,B evaluated at the
    experimental 1100/1200/1300 °C isotherms into per-point activity rows
    with composition_mol, C-CO pO2, system_class, and condensed_form so the
    reproduction battery can score them. Arithmetic is log10(a)=A/T+B only.
  date: '2026-08-27'
  worker: transcribe-activity
review_status: draft
species:
  Na2O:
    observations:
    - observation_id: ts1985_na2o_table2_log10_a_AT_B
      type: activity_coefficient
      locator:
        page: 7
        published_page: 821
        pdf_page_index: 7
        table: '2'
        figure: '4'
        equation: log a_Na2O = A/T + B
        note: >-
          Table 2 coefficients. Authors state (p.820) that A, B were obtained
          by reading Fig. 4 at X_Na2O = 0.40, 0.45, 0.50, 0.55
          (「Fig.4の結果から読みとつた」). Evaluated a and γ below use the
          printed A, B; they are not independent figure reads.
      T_range_K:
      - 1373.15
      - 1573.15
      phase: Na2O-SiO2_binary_melt
      standard_state: >-
        Raoultian / pure liquid Na2O. Paper p.816 (PDF p.2): 「a_Na2O:
        ラウール基準の Na2O の活量」 = "a_Na2O: Raoultian-standard
        activity of Na2O". Reaction written as Na2O(l)+C(s)=2Na(g)+CO(g)
        (eq. 1) and Na2O(l)+C(s)=2Na(l in Pb)+CO(g) (eq. 2), so the
        condensed-oxide standard state in the mass-action expression is
        Na2O(l). This is a component activity, not an EMF-cell convention.
      regime: chemical_equilibration_graphite_CO_PbNa
      units: dimensionless a (log10); Raoultian γ = a/X
      uncertainty:
        note: >-
          Per-row ± on A and B as printed in Table 2. Separate experimental
          envelope on log a_Na2O from p.819 (PDF p.5): ±0.16 at 1100 °C,
          ±0.15 at 1200 °C, ±0.14 at 1300 °C, dominated by ΔG° of eq. (2)
          (stated 1 kcal/mol) rather than Na analysis.
        log10_a_envelope:
          '1100_C': 0.16
          '1200_C': 0.15
          '1300_C': 0.14
      values:
        quantity: activity_and_raoultian_gamma
        oxide_formula_as_published: Na2O
        composition_basis: mole_fraction_Na2O_in_Na2O-SiO2
        log_base: 10
        equation_as_printed: log a_Na2O = A/T + B
        equation: log10(a_Na2O) = A/T + B
        T_in_equation: kelvin
        gamma_definition: >-
          Papers publish a_Na2O, not γ_Na2O. Raoultian
          γ_Na2O = a_Na2O / X_Na2O is the definition implied by
          「ラウール基準」. Conversion shown on each evaluated row.
        table2_was_read_from_figure_4_by_authors: true
