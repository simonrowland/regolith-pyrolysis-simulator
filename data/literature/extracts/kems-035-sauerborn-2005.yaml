        quote: "Schon in der Vorheizphase wiesen die aufgezeichneten und ausgewerteten Daten der\nProbentemperatur\
          \ und der Gasanalyse interessante Verhaltensweisen auf. Neben den sehr\nauffälligen Ausheiz-Peaks zeigte\
          \ auch der Verlauf der einzelnen Gase wiederkehrende\nMuster. So wurde bei allen Versuchen eine auffällige\
          \ Abnahme des Sauerstoffpartialdruckes\nfestgestellt, sobald die Bestrahlung bzw. die Vorheizphase begann.\
          \ Auf der anderen Seite\nwurde der Ausheiz-Peak am Anfang der Bestrahlung, wie das QMS zeigte, vor allem\
          \ durch\neine Partialdruckerhöhung der übrigen untersuchten Gase (Ar, H2O, N2, CO2, O) gebildet.\nEin\
          \ ähnliches Verhalten wurde bei den Gaspartialdrücken zu Beginn der Hochtemperatur-\nphase beobachtet.\
          \ Hier stieg jedoch in der Regel auch der Partialdruck des O2 mit an.\nAn Hand der Referenzversuche konnte\
          \ der Unterschied zwischen freiwerdenden O2 durch\nPyrolyse und O2-Auftreten durch Ausgasung in der Anlage\
          \ während der Hochtemperatur-\nphase dokumentiert werden. Dazu wurden die ermittelten O2-Partialdrücke\
          \ dieser Versuche\nin einem Diagramm (Abbildung 5.55) zusammengestellt. Für den Vergleich wurde der\n\
          Basisdruck vor der Hochtemperaturphase bei allen Versuchen auf 10-7 mbar normiert. Im\nVersuch ohne Probe\
          \ und mit CaO ist ein Ausheizverhalten mit unterschiedlich hohen\nAusheiz-Peaks zu sehen. Da der Versuch\
          \ mit SiO2 zuvor über Nacht nachhaltig abgepumpt\nund vor der eigentlichen Hochtemperaturphase schon\
          \ kurzzeitig bei hohen Temperaturen\n(1175 °C) ausgeheizt worden war, trat bei diesem Versuch kein weiterer\
          \ hoher Ausheiz-Peak\ndes O2 auf. Auf der anderen Seite ist aber bei hohen Temperaturen ein leichter\
          \ Anstieg des\nO2 zu erkennen, der auf eine leichte Freisetzung des Gases durch Pyrolyse hinweist. Im\n\
          Versuch mit ZnO steigt der O2-Partialdruck durch die Pyrolysereaktion sogar sehr deutlich\nund rapide\
          \ um das 1000-fache an.\n                          1.E-3\n                                     Vorheizen\
