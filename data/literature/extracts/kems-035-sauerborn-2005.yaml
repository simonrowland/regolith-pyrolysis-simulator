        quote: "Der gemessene Höchstwert der Probe beträgt 1580 °C. Insgesamt dauerte die Hoch-\ntemperaturbestrahlung\
          \ 174 s. Die maximale Probentemperatur lag 172 s lang über 1000 °C\nund 250 s lang über 800 °C.\nDer\
          \ Verlauf der Gaspartialdrücke (Abbildung 5.46) wurde deutlich von der sich nur langsam\nverringernden\
          \ Ausgasung der Restgase geprägt, die durch den verhaltenen Anstieg der\nProbentemperatur noch verzögert\
          \ wurde. So war der Partialdruck von CO2 erst bei\nTemperaturen über 1200 °C deutlich rückläufig. Der\
          \ Gasanteil von H2O verringerte sich\nsogar erst ab ca. 1300 °C. Der O-Anteil verhielt sich wie der des\
          \ CO2-Partialdruckes,\nschwankte dabei allerdings weniger stark. Ar und N2 zeigten demgegenüber nur einen\
          \ sehr\ngeringen Rückgang, so dass ihr Druck erst am Ende der Hochtemperaturphase das\nAusgangsniveau\
          \ erreichte.\nDer O2-Gehalt zeigte ab 9 min 55 s mit dem Schwanken der Probentemperatur zwischen\netwa\
          \ 1210 °C und 1300 °C ein im Vergleich zu den anderen Gasen gegenläufigen Trend.\nDer Sauerstoffanteil\
          \ stieg ab diesem Zeitpunkt deutlich an und erreichte nach einem kurzen\nZwischentief bei 10 min 30 s\
          \ bei stagnierenden Temperaturen (1500 °C) einen Spitzenwert,\nder über eine Zehnerpotenz höher lag als\
          \ der Ausgangswert am Ende der Vorheizphase.\nNach Ende der Hochtemperaturphase bzw. Schließen des Shutters\
          \ fielen die O2-Werte aber\nwieder schnell auf das Ausgangsniveau.\nNach dem Schließen des Shutters stiegen\
          \ alle Partialdrücke bis auf den von O2 erheblich\naber gleichmäßig an. Es zeigte sich dabei ein ähnlicher\
          \ Verlauf wie im Versuch MS4, bei\ndem allerdings nur der Druck von H2O und CO2 anstieg. Die große aufgeplatzte\
          \ Gasblase in\nder Mitte der erstarrten Probe (vgl. Abbildung 5.47) könnte in MS5 die Ursache für diesen\n\
          schnellen Druckanstieg sein. Dies würde auch erklären, warum die detektierten Gas-\npartialdrücke nach\
          \ der Hochtemperaturphase dem Verhältnis vor dieser Phase entsprachen.\nDie gemessenen Gase wären damit\
          \ hauptsächlich freiwerdende Restgase gewesen, die bis\nzum Platzen der großen Gasblase unter der Schmelze\
          \ zurückgehalten worden waren.\n\n                                           Abbildung    5.47:   Probe\
          \    MS5    nach   der\n                                           Bestrahlung. In der Mitte der aufgeschäumten\n\
          \                                           Basaltglasschmelze hat sich ein Loch gebildet,\n        \
          \                                   das offensichtlich beim Aufplatzen einer großen\n               \
          \                            Gasblase entstanden ist. Rechts im Glas ist die\n                      \
          \                     nicht geschmolzene Restmenge (54 Gew.%) des\n                                 \
          \          Granulats zu sehen. (Tiegel: ∅ = 25 mm, Höhe =\n                                         \
          \  30 mm)\n\n\n\n\nBei diesem Versuch war schon vor dem Belüften eine leichte, farbige Bedampfung auf\
          \ der\nmittleren Höhe des Konus zu erkennen. Nach dem Belüften der Kammer wandelte sich diese\nin die\
          \ schon beobachtete weißliche, matte Schicht um und breitete sich weiter auf den\noberen zwei Dritteln\
          \ des Konus und auf der Innenseite der Glaskuppel aus. Die Bedampfung\nschien diesmal stärker zu sein\
          \ als bei den vorherigen Versuchen mit Mondstaub-Simulat.\nDie Probe war wie im Versuch MS4 nur teilweise\
          \ (43 Gew.%) geschmolzen. Die Schmelze\nwar auch hier wieder stark aufgeschäumt, hatte den Tiegelrand\
          \ dabei aber nicht überstiegen.\nAuf dem Boden der gekühlten Abschirmung gab es diesmal allerdings zahlreiche\
          \ Basaltglas-\nspritzer, die höchstwahrscheinlich mit der aufgeplatzten großen Gasblase in der Mitte\
          \ der\nProbe zusammenhängen.\nEine Überprüfung der gesamten Probenmasse nach der Bestrahlung ergab, unter\
          \ Annahme\nunveränderter Tiegelmasse, einen Massenverlust von 2,9 Gew.%. Die Auswertung eines\nTeils\
          \ des entstandenen Basaltglases von MS5 mit der RFA (Abbildung 5.31 und Abbildung\n5.32 in Kapitel 5.1.6)\
          \ zeigte, wie schon bei den Proben von MS2 und MS4 zuvor, dass sich\ndurch die Bestrahlung vor allem\
          \ die volatilen Bestandteile (Na2O, K2O, P2O5) gegenüber dem\n\n                                    \
          \                                                    98"
