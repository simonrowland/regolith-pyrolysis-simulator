      source_quotes:
      - locator:
          page: 15
          pdf_page_index: 14
        quote: "Die Mondoberfläche ist in Gebiete mit großen Ebenen (Mare-Regionen) und Gebirgen\n(Hochland-Regionen)\
          \ unterteilt, deren Entstehungsgeschichte und Zusammensetzung im\nAnhang Kapitel 7.1 erläutert wird.\
          \ Der Großteil der Oberfläche ist heute von losen felsigen\nGesteinsbrocken aus Meteoriteneinschlägen\
          \ und feinem Staub bedeckt. Dieses Gemisch\naus Glas und Mineralen, das Regolith genannt wird, besteht\
          \ in den Maria hauptsächlich aus\nbasaltartigem Vulkangestein mit zahlreichen Pyroxenen und Plagioklase,\
          \ während es in den\nGebirgen hauptsächlich Anorthosit-Gestein mit Plagioklase enthält. Die Schichtdicke\
          \ dieses\nTrümmerstaubes variiert zwischen 4 bis 5 m in den Mare-Regionen und 10 bis 15 m in den\nHochland-Regionen\
          \ [HeVa 91]. In Tabelle 2.1 sind verschiedene Regolith-Proben aus\nunterschiedlichen Regionen des Mondes\
          \ nach elementarer Zusammensetzung der\nHauptelemente aufgelistet, während in Abbildung 2.1 der Chemismus\
          \ zweier exemplarischer\nProben des Mare- und Hochland-Regoliths miteinander verglichen werden.\nTabelle\
          \ 2.1: Atomare Zusammensetzung verschiedener Mondstaubproben unterschiedlicher\nMondmissionen und -regionen\
          \ (in Gew.%.) [HeVa 91].\n\n                           Hochland-Region                           Mare-Region\n\
          \    Element          Apollo 14          Apollo 16          Apollo 12               Luna\nO         \
          \              45,0               45,0               43,0                 43,0\nSi                  \
          \    22,5               21,1               21,8                 19,9\nAl                       9,3  \
          \             14,2                7,2                  8,1\nCa                       7,9            \
          \   11,1                7,2                  8,9\nNa                       0,5                0,4   \
          \             0,4                  0,3\nMg                       5,5                3,6             \
          \   5,8                  5,3\nFe                       8,1                4,3               12,1    \
          \             13,0\nTi                       1,0                0,4                1,6              \
          \    2,0\nübrige                   0,3                1,0                0,9                  0,4\n\n\
          \n\n\nAbbildung 2.1: Vergleich des Chemismus zwischen Mondstaub-Proben aus Hochland- und\nMare-Region\
          \ (in Gew.%.) [HeVa 91]. Die analysierten Proben weichen in der Zusammensetzung\nbei den Hauptelementen\
          \ auffällig im Titan- und Eisengehalt voneinander ab. Außerdem sind die\nSiO2-, Al2O3- und CaO-Anteile\
          \ im Hochland-Regolith erhöht.\nMondgestein hat aufgrund des Entstehungsverlaufes verschiedene Besonderheiten\
          \ gegen-\nüber irdischem Gestein. Bei Untersuchungen der Mondproben wurden deshalb auch einige\nbis dahin\
          \ unbekannte Minerale entdeckt. Eine wichtige Ursache hierfür ist, dass die einzigen\nErosionsarten,\
          \ denen das Mondgestein heute ausgesetzt ist, das kosmische Bombardement\nmit Meteoriten, die hauptsächlich\
          \ aus Kleinstpartikeln bestehen, und der Sonnenwind sind.\nLetzterer ist ein von der Sonne ausgehender\
          \ Partikelstrom, der hauptsächlich aus Protonen\nund Elektronen besteht.\nEin weiterer Unterschied zu\
          \ den irdischen Rahmenbedingungen ist die geringe Schwerkraft\ndes Mondes, die keine Atmosphäre halten\
          \ kann. Dieser Umstand wirkt sich ebenfalls auf die\nZusammensetzung des Mondgesteins aus. Gase oder\
          \ Dämpfe wie H2O, SO2 oder CO2, die\naus dem Innern ausgasen oder bei Reaktionen freigesetzt wurden,\
          \ gingen, wenn sie nicht\nunmittelbar wieder gebunden werden konnten, ins Weltall verloren. Dadurch und\n\
          \n                                                                                          15"
