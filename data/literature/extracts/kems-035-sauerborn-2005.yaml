          historical parent is retained; its untranscribed-table list is superseded.
      uncertainty:
        note: not applicable
      supersedes: sauerborn_2005_true_absence_alpha_gamma_psat
      source_quotes:
      - locator:
          page: 67
          pdf_page_index: 66
        quote: "5 Ergebnisse und Diskussion\nIn Kapitel 5.1 werden die Verläufe und die Ergebnisse der einzelnen\
          \ Bestrahlungs-\nexperimente zusammengestellt und diskutiert. Danach werden in Kapitel 5.2 die Resultate\n\
          verglichen und es wird eine Bilanz zur Pyrolyse und zur Gewinnung von Sauerstoff gezogen.\nAnschließend\
          \ wird in Kapitel 5.3 noch die Eignung einiger Anlagenkomponenten diskutiert.\nDer Versuch MS3 wurde\
          \ auf Grund technischer Schwierigkeiten bei der Bestrahlung nicht\nausgewertet.\n\n5.1 Detaillierte Auswertung\
          \ der einzelnen Bestrahlungsversuche\nZum besseren Verständnis des Verhaltens der Anlage und des Prozessverlaufs\
          \ wurden zu\njedem diskutierten Experiment drei Diagramme erstellt, die zeitlich parallel das Verhalten\n\
          wichtiger Werte während der Hochtemperaturphase zeigen. Dadurch können die unter-\nschiedlichen Daten\
          \ einfacher miteinander verglichen werden, so dass sich die verschiedenen\nauftretenden Effekte besser\
          \ darstellen und diskutieren lassen.\nIm ersten Diagramm eines jeweiligen Experiments werden zunächst\
          \ hauptsächlich die\nAnlagedaten dargestellt. Dazu gehören der Druck in der Vakuumkammer und im Messkreuz\n\
          des QMS, die vom Pyrometer gemessene Temperatur der Glaskuppel, die Temperaturwerte\ndes Thermoelementes\
          \ direkt unter der Oberfläche der konusförmigen Abschirmung und an\nder Kühlfalle, sowie die Shutter-Position.\n\
          Im zweiten Diagramm werden verschiedene ermittelte Temperaturwerte der Probe und des\nProbenträgers aufgeführt.\
          \ Als Graphen sind zu sehen: die maximale und mittlere\nProbentemperatur sowie die maximale und mittlere\
          \ Temperatur des keramischen\nProbenträgers. Zur besseren Übersicht wurde die Shutter-Position ebenfalls\
          \ eingetragen.\nDie dritte Grafik enthält die aus den Massenpartialdrücken berechneten Gaspartialdrücke\n\
          von O2, O, CO2, N2, Ar und H2O, sowie zum Vergleich nochmals den Gesamtdruck im\nMesskreuz und die maximale\
          \ Probentemperatur. Durch die Anpassung des Zuleitungs-\nventils, mit dem der Druckunterschied zwischen\
          \ Kammer und QMS geregelt wurde (vgl.\nKapitel 3.2.5), variiert das Druckniveau im Messkreuz von Experiment\
          \ zu Experiment teils\ndeutlich. Da das QMS ohnehin nur die herrschenden Gaspartialdruckverläufe und\
          \ –verhält-\nnisse misst, spielt diese Veränderung keine wesentliche Rolle bei der Auswertung der Daten.\n\
          Der Verlauf des Vorheizens (Tmax < 600 °C) lief ebenso wie die spätere Abkühlphase (unter\n600 °C) fast\
          \ immer nach dem gleichen Schema ab. Da für das Verständnis und die\nBeurteilung des Pyrolyseprozesses\
          \ die zeitlich viel kürzere Hochtemperaturphase erheblich\ninteressanter ist, beschränken sich die Versuchsdiagramme\
          \ auf den Zeitraum um diese\nPhase. In den verschiedenen Diagrammen wurden die Bestrahlungsphasen zur\
          \ besseren\nÜbersicht mit Trennlinien unterteilt (rot für Shutter öffnen bzw. blau für Shutter schließen).\n\
          Nach einer Beschreibung und Interpretation der ersten visuellen Eindrücke der Probe und\ndes Aufbaus\
          \ werden die Ergebnisse der verschiedenen mineralogischen Untersuchungen\nder Proben erläutert.\nDa es\
          \ immer wieder zu Abdampfungen der bestrahlten Proben bzw. Bedampfung des\nInnenaufbaus der Vakuumkammer\
          \ kam, ließen sich auch entsprechende Spuren auf den\nKühlfallenfolien finden. Die Folien wurden deshalb\
          \ mit REM und EDX untersucht.\nUm die Auswertungsmethodik und Ergebnisse der Experimente besser bewerten\
          \ zu können,\nmuss angemerkt werden, dass sich Versuche im Sonnenofen unter strengen experimen-\ntellen\
          \ Gesichtspunkten nur mit viel Aufwand exakt reproduzieren lassen. Verschiedene\nRahmenbedingungen wie\
          \ die Flussdichteverteilung oder die Positionierung des Strahls und\nallgemein die Wetterlage stellen\
          \ in Kombination einen komplexen Ausgangszustand dar. Das\ngilt insbesondere auch für den Versuchsaufbau,\
          \ der durch die verwendete Diffusionspumpe\nnoch zusätzlich ungleiche Vakuumbedingungen aufwies. Die\
          \ Bestrahlungs- wie auch die\nDruckverhältnisse lassen sich zwar erneut antreffen bzw. einstellen, aber\
          \ nur unter zum Teil\nerheblichem Aufwand. Um z. B. bei den Startbedingungen größere Übereinstimmung\
          \ zu\nerreichen, wäre die Optimierung des Strahls und damit ein Abwarten auf identische\nEinstrahlbedingungen\
          \ nötig gewesen, was letztendlich die Anzahl der Bestrahlungen\nverringert hätte. Da jedoch die Rahmenbedingungen\
          \ für den untersuchten Prozess nur grob\n\n\n                                                       \
          \                                    67"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
