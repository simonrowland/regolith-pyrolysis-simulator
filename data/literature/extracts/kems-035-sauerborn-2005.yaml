          pdf_page_index: 90
        quote: "Die Kühlfalle war in diesem Experiment erheblich weiter von der Probe entfernt (rund 15 cm)\nals\
          \ im Versuch mit MS1. Die Bedampfungsrate war deshalb entsprechend geringer, was\nauch die Untersuchung\
          \ im REM (Abbildung 5.36) und die Werte der EDX-Analysen zeigten.\n\n\n                             \
          \                                           Abbildung 5.36: RE-Bild der\n                           \
          \                                             Kühlfallenfolie von MS2. Auf der\n                    \
          \                                                    leicht bedampften Tantalfolie sind\n           \
          \                                                             zahlreiche    Spritzer aus     der\n  \
          \                                                                      Probenschmelze zu erkennen. Im\n\
          \                                                                        Vergleich zur Kühlfallenfolie\
          \ des\n                                                                        Versuches MS1 ist die\
          \ Anzahl der\n                                                                        Spritzer    allerdings\
          \  erheblich\n                                                                        geringer. Sie sind\
          \ außerdem\n                                                                        teilweise größer\
          \ und variieren\n                                                                        deutlicher in\
          \ ihrer Zusammen-\n                                                                        setzung.\n\
          \n\n\n\nIn Tabelle 5.5 sind die Ergebnisse der EDX-Untersuchungen einer unbehandelten Tantalfolie\nund\
          \ der eingesetzten Folie von MS2 gegenübergestellt. Dabei wurden nur Bereiche auf der\nFolie ohne Spritzer\
          \ gescannt. Man sieht, dass es zu einem leichten Anstieg von Natrium und\neventuell auch von Phosphor\
          \ durch die Bestrahlung kam. Die Werte aller anderen\nElementen liegen im Bereich der Untergrundschwankungen.\
          \ Da beide Folien unter gleichen\nVakuumbedingungen untersucht wurden, weist die deutliche Erhöhung des\
          \ Sauerstoffanteils\n(von 17,4 auf 39,4 Atom.%) auf eine oberflächliche Oxidation der Tantalfolie hin.\
          \ Der O-\nAnteil ist zumindest zu hoch, um nur Bestandteil einer Bedampfungsschicht aus Na2O und\nP2O5\
          \ zu sein.\nTabelle 5.5: EDX-Analysen der Kühlfallenfolie des Versuchs MS2\nGemitteltes Ergebnis der\
          \ EDX-Analysen an verschiedenen Stellen der Kühlfallenfolie im\nVergleich zu entsprechenden Untersuchungen\
          \ an einer unbestrahlten Tantalfolie. Werte in\nAtom.%. Werte > 1 Atom.% liegen im Fehlerbereich des\
          \ Untergrundrauschens.\n                                                                   10\n     \
          \                                   O     Na    Mg   Al   Si          P    K     Ca    Ti    Fe    Ta\n\
          \n Unbehandelte        Mittelwert        17.4   0.3   0    0     -         0.8   0.2   0.1   0     0.1\
          \   81.1\n    Folie\n                  Standardabweichung   1.3    0.2   0    0     -         0.4   0.2\
          \   0.1   0     0.1   1.5\n\nKühlfallenfolie      Mittelwert        39.4   3.5   0    0     -       \
          \  1.3   0.3   0.2   0.1   0.1   55.\n     MS2\n                  Standardabweichung   5.2    1.1   0\
          \    0     -         0.3   0.1   0.1   0.1   0.2   6.0\n\n\n5.1.7 MS4\nIm Versuch MS4 blieb die Probenmenge\
          \ mit ca. 1 g gleich. Beim Probenträger wurde statt\ndes Ringes ein kleines Rohrstück aus demselben Material\
          \ (Al2O3) mit einem geringeren\nDurchmesser (20 mm) zur Begrenzung der Schmelze verwendet. Die Durchheizung\
          \ der\nProben und die damit verbundenen Reaktionen in der Schmelze hingen deshalb mehr als\nbisher von\
          \ der Wärmeleitfähigkeit des Probenmaterials ab.\nSchon in der 712 s langen Vorheizphase zeigte sich,\
          \ dass sich die Probe im hohen Tiegel\nerheblich schlechter ausheizen ließ als in der flacheren Probenanordnung.\
          \ Deshalb wurde\ndie Vorheiztemperatur von 600 °C trotz Erhöhung der Strahlleistung erst relativ spät\
          \ erreicht\nund der Gesamtdruck in der Kammer blieb am Ende des Vorheizens deutlich über dem\n\n10\n\
          \  Da im Röntgenspektrum die Linien von Silizium von den Linien des dominierenden Tantals über-\nlagert\
          \ werden, kann bei einem schwachen Signal für Silizium kein konkreter Wert ermittelt werden.\n\n    \
          \                                                                                                   \
