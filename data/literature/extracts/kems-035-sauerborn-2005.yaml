        \ [Ley 02])\nDie Drucksensoren gehören bei diesen Experimenten zu den wichtigsten Messgeräten.\nDeshalb\
        \ wird in diesem Abschnitt auf die verschiedenen Druckmessmethoden bzw. Sensor-\ntypen, die benutzt\
        \ wurden, eingegangen. Dies ist insbesondere nötig, weil die Messgenauig-\nkeit und Reproduzierbarkeit\
        \ der Systeme recht unterschiedlich ausfallen. Daher werden zur\nGewichtung ihrer Messwerte einige\
        \ zusätzliche Informationen benötigt. Ein weiteres Problem\nist, dass einige Messröhren zur Druckmessung\
        \ Ionen erzeugen, die die Messwerte des\nMassenspektrometers (QMS) beeinflussen können. Wie groß dieser\
        \ Einfluss ist und wie\nauftretende Probleme zu umgehen sind, wird in den folgenden Abschnitten kurz\
