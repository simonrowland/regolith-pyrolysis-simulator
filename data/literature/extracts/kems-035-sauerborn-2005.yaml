          \ als\nMondstaub-Simulat, sowie einigen einfachen Metalloxiden als Referenzproben durchgeführt.\nIn Vorversuchen\
          \ wurden als Probenhalter hochschmelzende Metalle und in den Pyrolyse-\nexperimenten mit Pulverproben\
