          \        5.21). Der vom Keramikring aus-\n                                                          \
          \                          gehende Plagioklas hat ein\n                                             \
          \                                       Mischkristallverhältnis von 72 %\n                          \
          \                                                          Ca[Al2Si2O8], 21 % Na[AlSi3O8]\n         \
          \                                                                           und 7 % KaAl[Si3O8].\n\n\n\
          \n\nNach dem Belüften der Kammer mit atmosphärischer Luft erschien auf dem Konus wie auch\nstellenweise\
          \ auf der Innenseite der Glaskuppel eine sehr dünne, milchige, matte Schicht. Sie\nließ sich aber leicht\
          \ abwischen. Die Mitte der Kuppel war bedampfungsfrei geblieben.\n(Vergleiche auch die Ausführungen zur\
          \ Glaskuppel im nachfolgenden Abschnitt MS2.)\n  1000\n                                             \
          \                MS1: Basaltglas\n                                               Messungen an verschiedenen\
          \ Stellen der Probe\n                                    Probenrand Unten                           \
          \     Probenrand Oben\n\n                            103.4        101.3             101.9           \
          \ 101.4         100.7       100.5\n     100           SUM\n\n                   SiO 2\n\n\n         \
