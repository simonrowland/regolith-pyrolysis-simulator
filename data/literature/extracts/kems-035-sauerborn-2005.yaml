        quote: "In diesem Versuch konnte aus Zeitmangel ungünstigerweise keine Kühlfallenfolie eingesetzt\nwerden,\
          \ so dass entsprechende Informationen nicht gesichert werden konnten.\n\n5.1.5 MS1\nDer Versuch MS1 war\
          \ das erste Experiment, bei dem Mondstaub-Simulat auf einem\nkeramischen Probenträger im Sonnenofenstrahl\
          \ aufgeheizt wurde. In der zeitlichen Abfolge\nwaren die Versuche MS1 bis MS4 vor den bisher diskutierten\
          \ Bestrahlungstests mit den\nReferenzproben durchgeführt worden. Als Probenmenge wurden etwa 0,72 g eingesetzt,\
          \ die\nauf dem Träger zentral aufgehäuft und anschließend plan gestrichen wurden (Abbildung\n5.17). Gegenüber\
          \ den Vortests war dies zudem eine erheblich größere Menge an Proben-\nmasse, die in der Anlage auf einmal\
          \ bestrahlt wurde. Deshalb waren unter anderem auch\ndas Verhalten der Schmelze und die Stärke der Abdampfung\
          \ von besonderem Interesse.\nZur Übersicht wurden wesentliche Temperaturdaten der Versuche mit Mondstaub-Simulat\
          \ in\nTabelle 5.3 zusammengestellt und mit Aufheiz- und Abkühlraten ergänzt.\nTabelle 5.3: Daten zum\
          \ Verlauf der Oberflächentemperatur der bestrahlten Proben aus\nMondstaub-Simulat aufgenommen mit der\
