      quote: "wurde eine zusätzliche Penning-Messröhre an die Kammer am Gaseinlass angeflanscht.\nEine weitere\
        \ überwachte den Hochvakuumdruck der Diffusionspumpe und war unter deren\nButterfly-Ventil am Messflansch\
        \ montiert. Durch die Verdampfungen bei den Experimenten\nkam es zu stärkeren Verunreinigungen aller\
        \ Penning-Röhren. Ein Ausheizen der Röhren\nunter Hochvakuum bewirkte wegen der Temperaturbeschränkung\
        \ relativ wenig. Nur eine\nmanuelle Säuberung der Innenoberflächen der Sensoren verbesserte nachhaltig\
        \ das Mess-\nverhalten und beseitigte störende Zitterbewegungen der Drucklinie.\nTabelle 3.3: Verwendete\
        \ Vakuumdrucksensoren und ihre Position im Versuchsaufbau\n(*Kombiröhre)\nSensortyp               \
        \       Hersteller / Model                     Position\nPirani                         BOC Edwards\
        \ / PK10-K        Vorpumpe 1 / Diffusionspumpe\nPirani                         Vacuubrand / VAP 5 \
        \         Vorpumpe 2 / Diffusionspumpe\nPirani                         Leybold Vacuum / TR        \
        \ Vorpumpe / Turbomolekularpumpe\n*Pirani & Penning              Pfeiffer Vacuum / PKR 251   Vakuumkammer\n\
        *Pirani & Bayard-Alpert        Pfeiffer Vacuum / IMR 265   Vakuumkammer\nPenning                  \
        \      BOC Edwards / CP 25-EK      Vakuumkammer\nPenning                        BOC Edwards / CP 25-S\
        \       Diffusionspumpe\n\n\n\n3.3 Messinstrumente und Datenerfassung\nZum Versuchsaufbau gehörten\
        \ verschiedene Messinstrumente, die bis auf die IR-Kamera\nund das QMS zum Auslesen über die Messbox\
        \ des 3D-Tisches oder direkt mit der Daten-\nerfassung verbunden waren. Die Daten dieser Instrumente\
        \ wurden über verschiedene\nMesskanäle mit dem Messprogramm im Datenerfassungsrechner im Sekundentakt\
        \ aufge-\nnommen.\nIm Datenerfassungsprogramm wurden virtuelle Kanäle definiert, in denen aus den aufge-\n\
        nommenen Daten - in der Regel Spannungswerte - mittels Kalibrierfunktionen ent-\nsprechende physikalische\
        \ Größen berechnet wurden (Temperatur, Druck, etc.). Für einige\nMesswerte bzw. physikalischen Größen\
        \ wurden akustische Alarmgrenzen zur besseren\nÜberwachung eingerichtet.\nVon der Datenerfassung wurden\
        \ neben den Daten der Messinstrumente noch weitere Werte\naufgenommen:\n• Versuchszeit [hh:mm:ss]\n\
        • solare Direktstrahlung [W/m2]: Wert der direkten solaren Einstrahlung, gemessen von der\n    Wetterstation\
        \ des Sonnenofens\n• Shutter-Position [%]: Öffnungsstand des Shutters des Sonnenofens. (0 % = zu; 100\
        \ % =\n    ganz geöffnet)\n• Virtuelle Strahlleistung [kW]: Aus den Daten der Direktstrahlung und der\
        \ Shutter-Position\n    berechnete Leistung des Sonnenofenstrahls.\nDie Uhrzeiten der Datenerfassung,\
        \ IR-Kamera und Massenspektrometer mussten öfters\nsynchronisiert werden.\n\n3.4 Temperaturmessung\n\
        \n3.4.1 Temperaturmessung am Aufbau\nUm Überhitzungen am Aufbau zu entdecken bzw. zu vermeiden und\
        \ die Auswirkungen der\nunterschiedlichen Modifizierungen zu überprüfen, wurden verschiedene Temperatur-\n\
        messungen durchgeführt. Zur Messung der Kühlwassertemperatur wurden Widerstands-\nThermometer vom Typ\
        \ PT100 (Messbereich: -200 °C – 850 °C) verwendet, während die\nKontaktsensoren am und im Versuchsaufbau\
        \ Thermoelemente Typ K (Thermopaar: NiCr-Ni\nmit Messbereich: 0 °C bis 1200 °C) waren.\n\n        \
        \                                                                                  45"
