      source_quotes:
      - locator:
          page: 16
          pdf_page_index: 15
        quote: "insbesondere durch die Mondentstehung selbst ist das Mondgestein insgesamt arm an\nvolatilen (d.h.\
          \ leicht flüchtigen) Elementen wie Na, K, Rb, Cl, Br, Zn, Te, Hg, Cd, Ge und Pb.\nDer Mondstaub (Regolith)\
          \ besteht hauptsächlich aus Silikaten und Metalloxiden mit einem\nGesamtanteil von rund 45 Gew.% Sauerstoff\
          \ (siehe Tabelle 2.1). Alle vorkommenden Oxide\nsind jedoch - wegen der fehlenden Atmosphäre - stark\
          \ reduziert, d. h. es gibt kaum sauer-\nstoffreiche Oxide. So enthält Mondstaub (vgl. Abbildung 2.1)\
          \ zwar beispielsweise einen\ngrößeren Anteil an FeO, allerdings tritt kein höher oxidiertes Fe2O3 auf.\
          \ Auf dem Mond\nlassen sich sogar metallische Eisenkörner finden. Im Vergleich dazu enthält irdischer\
          \ Basalt\nhauptsächlich Fe2O3 und nur wenig FeO. Vorkommen mit metallischem Eisen lassen sich auf\nder\
          \ Erde nur sehr selten finden. Sie müssen unter Sauerstoffabschluss lagern, da Eisen\nsonst leicht oxidiert.\
          \ Es tritt in kohlenstoffreichen Gesteinen auf, die sehr hohen\nTemperaturen ausgesetzt waren, so dass\
          \ ein natürlicher Hochofenprozess ablaufen konnte\n[UnBa 91] [ScTr 94] [MBGP 71].\nIm Regolith kommen\
          \ hauptsächlich drei Minerale vor: Pyroxen, Plagioklas und Olivin. Auch\nSpuren von Ilmenit und Chromit\
          \ sind vorhanden (vgl. Tabelle 2.2). Die aufgeführten Proben-\nwerte sind für die zwei verschiedenen\
          \ Hauptregionen des Mondes eher durchschnittlich,\nkönnen aber innerhalb dieser regionalen Einteilung\
          \ zum Teil noch deutlich variieren.\nTabelle 2.2: Mineralogische Zusammensetzung verschiedener Mondstaubproben\
          \ unter-\nschiedlicher Mondmissionen und -regionen (in Vol.-%) [HeVa 91].\n                         \
          \  Hochland-Region                         Mare-Region\nMineral                       Apollo 16     \
          \                        Apollo 17\nPlagioklas                        45                            \
          \         16\nPyroxen                            4                                     31\nOlivin   \
          \                          1                                      1\nIlmenit                        \
          \    1                                      6\nGläser                            49                 \
          \                    46\n\nWeiterführende Informationen zur Entstehungsgeschichte des Mondes und zur\
          \ Mineralogie\ndes Mondgesteins sind im ersten Teil des Anhangs zusammengestellt. In zahlreichen\nPublikationen\
          \ ([Mat 96], [HeVa 91]) lassen sich weitere Informationen über Zusammen-\nsetzung und Vorkommen von lunarem\
          \ Regolith, anderen Mondgesteinen und Allgemeines zu\nBasalten finden.\n\n2.1.2 Mondstaub-Simulat JSC-1\n\
          Für die verschiedenen Pyrolyseexperimente wurde das Mondstaub-Simulat JSC-1 der NASA\nverwendet [MKCa\
          \ 94]. Dieses basaltische, körnige Pulver, dessen Partikel eine durchschnitt-\nliche Dichte von 2,9 g/cm³\
          \ aufweisen, ist beim NASA Johnson Space Center für wissen-\nschaftliche Untersuchungen erhältlich. Seit\
          \ Anfang der Neunziger Jahre wird dieses Simulat\nauch in großen Mengen kostenfrei von der NASA zur Verfügung\
          \ gestellt. Möglich wurde dies\ndurch eine gezielte Suche nach vergleichbarem irdischen Basalt, der mit\
          \ geringem\nBergungs- und Aufbereitungsaufwand akzeptable Übereinstimmung zu lunarem Regolith\naufweist.\
          \ Ausgangsmaterial ist eine basaltische, vulkanische Asche aus einem Vulkangebiet\nbei San Francisco,\
          \ die in vorgegebene Körnergrößen gemahlen, gemischt und seither\nverwitterungssicher gelagert wird.\n\
          Eine Gegenüberstellung des Simulats in Abbildung 2.2 mit Mare-Regolith, der auf der Apollo\n14 Mission\
          \ geborgen wurde, zeigt, dass die chemische Zusammensetzung nach Oxiden nur\nwenig voneinander abweicht.\
          \ Zum Teil sind die Werte sogar gleich. Auch das Vorkommen\nund die Häufigkeit des Glasanteils und der\
          \ Minerale sind miteinander vergleichbar. Dies ist\nfür die Pyrolyseexperimente von besonderem Interesse.\n\
          Ein Simulat aus reinen Oxiden wäre sicher bezüglich des Chemismus identisch mischbar,\nwürde aber das\
          \ Schmelzverhalten der komplexeren Minerale des Basaltstaubes nicht\nberücksichtigen. Ob das Verhalten\
          \ einer Mondstaubschmelze damit übereinstimmen würde,\nmüsste erst an aufwendigen separaten Untersuchungen\
          \ herausgefunden werden, was\nwährend dieser Arbeit jedoch nicht möglich war. Grundsätzlich muss auch\
          \ darauf hinge-\nwiesen werden, dass sich Mondbasalt und irdisches Gestein immer durch charakteristische\n\
          Merkmale unterscheiden [Str 95] [AlCa 85]. Dazu gehören unter anderem Minerale und\n                \
          \                                                                           16"
