          \ Bestrahlungstests mit den\nReferenzproben durchgeführt worden. Als Probenmenge wurden etwa 0,72 g eingesetzt,\
          \ die\nauf dem Träger zentral aufgehäuft und anschließend plan gestrichen wurden (Abbildung\n5.17). Gegenüber\
          \ den Vortests war dies zudem eine erheblich größere Menge an Proben-\nmasse, die in der Anlage auf einmal\
          \ bestrahlt wurde. Deshalb waren unter anderem auch\ndas Verhalten der Schmelze und die Stärke der Abdampfung\
          \ von besonderem Interesse.\nZur Übersicht wurden wesentliche Temperaturdaten der Versuche mit Mondstaub-Simulat\
