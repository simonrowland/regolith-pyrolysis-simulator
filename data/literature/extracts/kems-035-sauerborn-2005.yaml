    source_quotes:
    - locator:
        page: 37
        pdf_page_index: 36
      quote: "Abbildung 3.4 gibt einen Überblick über die Arbeitsbereiche der verschiedenen Vakuum-\npumpentypen.\
        \ Es ist zu erkennen, dass im Allgemeinen Pumpen für das Grob- und\nFeinvakuum kein Hochvakuum von\
        \ 10-5 mbar erreichen, während umgekehrt fast alle Hoch-\nund Ultrahochvakuumpumpen im Grobvakuum wirkungslos\
        \ sind.\n\n\n\n\nAbbildung 3.4: Arbeitsbereich verschiedener Vakuumpumpen (Auszug aus [Ley 02])\nDie\
        \ Ansprüche an die Pumpsysteme dieses Versuchsaufbaus waren sehr unterschiedlich. In\nder Kammer wurden\
        \ während des Versuches verschiedenste Gase bzw. Dämpfe frei. Die\nmeisten Gase (N2, O2, Ar, H2O, etc.)\
        \ werden von den verschiedenen Hochvakuumpumpen\nproblemlos abgepumpt. Andere aber waren dagegen recht\
        \ problematisch. Wenn die Gase\nbzw. Dämpfe aus der Probenschmelze stammten, konnte es sich allerdings\
        \ auch um Metall-\ndämpfe oder Dämpfe von einfachen Oxiden oder Suboxiden handeln. Diese kondensierten\n\
        und bildeten eine metallische bzw. mineralische feste Bedampfungsschicht und konnten sich\n- im Falle\
        \ der aggressiven Suboxide - dort außerdem noch mit Sauerstoff verbinden. Solche\nDämpfe erfordern\
        \ einen deutlich höheren Wartungsaufwand und verkürzen die Lebensdauer\nder meisten Vakuumpumpen.\n\
        Ein weiteres Problem war immer wieder der starke Druckanstieg beim Aufheizen der Proben\ndurch den\
        \ Sonnenofenstrahl. Diese Gas-Peaks erreichten innerhalb von Sekunden Werte\nvon fast bis zu 1·10-2\
        \ mbar bei einem Ausgangsdruck von unter 1·10-4 mbar. Die freige-\nsetzten Gase (vor allem Restgase)\
        \ mussten relativ zügig abgepumpt werden, um den\nProzess nicht zu sehr zu beeinflussen.\nTabelle 3.1:\
        \ Verwendete Vakuumpumpstände\n(*mit Membranpumpe oder ** mit Drehschieberpumpe als Vorpumpe)\n\n \
        \  Pumpstand        Vakuumpumpentyp       Saugvermögen (für N2)           Enddruck\n              \
        \                                                               -4\n                     Drehschieberpumpe\
        \            5,6 m³/h                4·10 mbar\n Vakuumkammer                                     \
        \                          -6\n                      Diffusionspumpe              85 l/s          \
        \       10 mbar\n                                                                             -2\n\
        \                        Kolbenpumpe               16 m³/h                 2·10 mbar\n      QMS   \
        \                                                         -7           -9\n                    Turbomolekularpumpe\
        \           680 l/s          10 mbar* (10 mbar**)\n\nDas Vakuum in der Versuchsanlage wurde von unterschiedlichen\
        \ Vakuumpumpen erzeugt.\nDiese Pumpstände sind Kombinationen, die den Ansprüchen des Systems entgegenkamen.\n\
        Da die Experimente für die Pyrolysereaktion im Hochvakuum ablaufen sollten, wurde die\nKammer mit einem\
        \ Hochvakuumpumpstand abgepumpt. Im Rezipienten sollte dafür vor dem\njeweiligen Versuch zügig (innerhalb\
        \ von 2 Stunden) ein Basisdruck von weniger als 1·10-4\nmbar erzeugt werden. Für die Vakuumkammer wurde\
        \ in den Pyrolyseexperimenten ein\nDiffusionspumpstand (HP 63B) von Vacuubrand mit Drehschieberpumpe\
        \ als Vorpumpe\neingesetzt (vgl. Tabelle 3.1).\n\n\n\n                                            \
        \                                              37"
