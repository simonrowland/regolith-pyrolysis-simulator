        quote: "Ausgasungs-Peak. Da die Sonneneinstrahlung gleichmäßig bei etwa 710 W/m² lag, variierte\ndie Leistung\
          \ des Strahls ebenfalls nur mit der Shutter-Stellung. Beim Öffnen des Shutters\nstieg deshalb mit jedem\
          \ weiteren Schritt die Probentemperatur kurzzeitig stärker an, so dass\nder Temperaturanstieg stufenweise\
          \ verlief. Bei 36 min 20 s und etwa 1260 °C (vgl. Abbildung\n5.18) wies dieser Aufwärtstrend allerdings\
          \ eine kurzzeitige Unterbrechung auf, die nicht\ndurch eine Änderung der Strahlleistung hervorgerufen\
          \ worden war. Genau bei diesem Wert\nsollte das Mondstaub-Simulat nach den theoretischen Analysen (vgl.\
          \ Kapitel 2.1.2)\nvollständig aufschmelzen. Das Aufbringen der dafür nötigen Schmelzwärme erklärt somit\
          \ die\nbeobachtete Temperaturstufe.\n\n\n\n\nAbbildung 5.17: Pulverprobe MS1 in der Vakuumkammer vor\
