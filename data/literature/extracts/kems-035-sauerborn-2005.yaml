      experiment: jsc1-solar-series
      type: rate_series
      locator:
        page: 67
        paragraph: Kapitel 5 Ergebnisse und Diskussion
        note: full-paper audit of tables 2.1-2.3, 3.1-3.3, 4.1, 5.1-5.8, 7.1-7.3 and figures 1.1-7.21
      phase: JSC-1_solar_furnace_melt
