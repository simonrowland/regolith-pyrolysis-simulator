        \                                                    1261 °C)\n                                   \
        \ MS5\n                                                            Ausgasung\n\n\n                \
        \          1.E-6\n\n\n\n\n O2-Partialdruck [mbar]\n                                               \
        \         MS5\n\n\n                                                        MS4\n\n\n              \
        \            1.E-7                         MS1\n\n                                                \
        \        MS2\n\n\n\n\n                          1.E-8\n                              500   600   700\
        \   800   900       1000    1100   1200   1300       1400       1500      1600    1700\n          \
        \                                                              [°C]\n\nAbbildung 5.56: Verlauf des\
        \ O2-Partildrucks in der Hochtemperaturphase in Abhängigkeit der\nTemperatur der Versuche mit Mondstaub-Simulat.\
        \ Für den Vergleich wurde der Basisdruck\n                        -7\naller Experimente auf 10 mbar\
        \ normiert. Bis 1200 – 1300 °C sind die Ausgasungs-Peaks zu\nsehen. Um den rot markierten Bereich bzw.\
        \ um den theoretischen Wert von 1261 °C stagniert\nder Temperaturanstieg (außer bei MS2) kurzzeitig,\
        \ was auf das vollständige Aufschmelzen der\nProben hinweist. Über 1400 °C steigen die O2-Partialdrücke\
        \ wieder deutlich an und zeigen die\nFreisetzung von O2 an. (Um den zeitlichen Verlauf des Experimentes\
        \ zu dokumentieren, haben\ndie berechneten Datenpunkte aller Linien 1 s Abstand.)\nEine theoretisch\
        \ ebenfalls denkbare Quelle für Sauerstoff stellen Gleichgewichtsreaktionen\ndar, die bei hohen Temperaturen\
        \ O2 binden und bei niedrigen entsprechend freisetzen. In\nKapitel 3.2.2 wurde dazu das Verhalten von\
        \ NO diskutiert, das entsprechende Reaktion\naufweist. Auch wenn die geringe Reaktionswahrscheinlichkeit\
        \ des Gases dagegen spricht,\nkonnte sie vorab nicht ausgeschlossen werden. Bei einem Vorversuch wurde\
        \ deshalb der\nMassenpartialdruck 30 u während der Bestrahlung gemessen. Es konnte jedoch keine\nKorrelation\
        \ zwischen der Abnahme des Sauerstoffpartialdrucks und einem Anstieg von NO\nfestgestellt werden. Vielmehr\
        \ zeigt der Verlauf der NO-Kurve das Ausheizverhalten anderer\nreaktionsträger Restgase wie z. B. Ar.\
        \ Der Partialdruck von NO blieb dabei immer mindes-\ntens eine halbe Zehnerpotenz unter dem von Sauerstoff.\
        \ Selbst wenn ein passendes\nDruckverhalten vorläge, würde dies auf keinen Fall relevante Verluste\
        \ von O2 ausreichend\nerklären.\nAnzumerken ist, dass NO im QMS auch als Kreuzprodukt bei der Ionisierung\
        \ von N2 und O2\nentsteht, und daher immer bei der Detektion der beiden Gase mitregistriert wird.\n\
        \n5.2.2 Mineralogische Untersuchungen\nDie bestrahlten Proben aus Mondstaub-Simulat und die Kühlfallenfolien\
        \ wurden mit den er-\nwähnten mineralogischen Analyseverfahren (REM, EDX, RFA, Elektronenstrahl-Mikrosonde)\n\
        auf einen möglichen Sauerstoffverlust hin untersucht. Es zeigte sich, dass diese unübliche\nAufgabenstellung\
        \ nur begrenzt umgesetzt werden konnte. Trotzdem konnten mehrere\nplausible Indizien für Reduzierungen\
        \ in der Probe und Freisetzung von Sauerstoff gefunden\nwerden.\nAlle Proben aus Mondstaub-Simulat\
        \ waren hauptsächlich zu Basaltglas mit auffällig vielen\nGasblasen erstarrt. Die durchgehend aufgeschmolzenen\
        \ Proben MS1 und MS2 waren bis\nauf vereinzelte, kleine Kristalle (Plagioklase), ausschließlich zu\
        \ Basaltglas erstarrt. Die\nAbkühlrate dieser Schmelzen (Tabelle 5.3) war offensichtlich zu hoch für\
        \ Kristallisationen.\n\n\n                                                                        \
        \                                                      107"
