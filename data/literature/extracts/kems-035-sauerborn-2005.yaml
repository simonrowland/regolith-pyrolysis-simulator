      quote: "IR-Detektoren für niedrige Temperaturen werden mit flüssigem Stickstoff gekühlt, um das\nthermische\
        \ Untergrundrauschen zu verringern und damit die Empfindlichkeit zu steigern. Bei\nzu niedrigen Temperaturen\
        \ nimmt allerdings die Beweglichkeit der Ladungsträger in den\nHalbleitern ebenfalls deutlich ab, was\
        \ die photoelektrische Empfindlichkeit verschlechtert. Es\nmuss daher eine optimale Betriebstemperatur\
        \ für den Detektor eingestellt werden [Glü 92]\n[ebs 98].\nEin Problem bei der Temperaturbestimmung\
        \ mit einem Strahlungssensor ist, dass hierzu der\ngenaue Wert des Emissivitätsfaktors ε des abstrahlenden\
        \ Körpers benötigt wird. Hat ε\nbeispielsweise einen Fehler von nur 5 % und der beobachtete Körper\
        \ eine Temperatur von\n2200 K, so beträgt der daraus resultierende Fehler der Temperaturangabe eines\
        \ Sensors,\nder bei 12 µm arbeitet, schon alleine ca. 23 K [Roh 02]. Da die Bestimmung des Emissivitäts-\n\
        faktors kompliziert und aufwendig ist, werden in der Regel Literaturwerte verwendet.\n\n7.4.2 Drucksensoren\n\
        In der Vakuumtechnik werden oft verschiedene Sensortypen gleichzeitig verwendet, da es\nkein Messverfahren\
        \ gibt, das den gesamten Druckbereich abdeckt. Von allen Herstellern\nwerden inzwischen Kompakt- bzw.\
        \ Full-Range-Gauges angeboten, die aus einer Mess-\neinheit mit zwei unterschiedlichen, kombinierten\
        \ Detektoren bestehen. Sie können durch\nautomatisches Umschalten zwischen den Sensoren von Normaldruck\
        \ bis ins Ultrahoch-\nvakuum messen.\nTabelle 7.3: Druckmessröhren des Experiments\n*Genauigkeit und\
        \ Reproduzierbarkeit beziehen sich auf den Messbereich. Im übrigen\nAnzeigebereich ist die Genauigkeit\
        \ in der Regel erheblich schlechter.\n\n             Druckmessröhre                               \
