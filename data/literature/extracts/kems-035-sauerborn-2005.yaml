        In der Vakuumpyrolyse, nach dem Verfahren wie es u. a. von [Ste 83] und [Sen 89] vorge-\nschlagen wurde,\
        \ wird Regolith in einem geschlossenen Behälter von außen mittels\nkonzentrierter Solarstrahlung auf\
        \ sehr hohe Temperaturen erhitzt und aufgeschmolzen.\nDurch Pyrolyse werden aus der Schmelze Sauerstoff\
        \ und metallische sowie Suboxid-\nDämpfe freigesetzt. Zur Vermeidung von Rekombinationen der Edukte\
        \ werden sie über\nfraktionierte Destillation getrennt. Dazu werden schrittweise zunächst Metalldämpfe\
        \ und\nSuboxide abgefangen und anschließend der molekulare Sauerstoff verflüssigt. Abbildung 2.4\n\
        zeigt ein vereinfachtes Schema einer möglichen solarthermischen Vakuumpyrolyseanlage, in\nder aus geschmolzenem\
        \ Regolith Sauerstoff gewonnen wird.\nGegenüber den meisten anderen in Kapitel 2.2.4.1 bzw. Tabelle\
        \ 2.3 aufgeführten Verfahren\nhat die solarthermische Vakuumpyrolyse verschiedene Vorteile. Während\
        \ insbesondere die\nReduktionsverfahren spezielles Gestein bzw. angereichertes Erz benötigen, kann\
        \ für die\nPyrolyse sowohl das Regolith des Hochlandes als auch das der Mare-Regionen verwendet\nwerden.\n\
        Neben der unkomplizierten Verwertung des vorhandenen Gesteinsvorkommens, nutzt das\nVerfahren auch\
        \ die Energieressourcen vor Ort sehr effizient aus. So werden die hohen\nProzesstemperaturen in der\
        \ Anlage durch die direkte Einkopplung des konzentrierten\nSonnenlichts eines Sonnenkonzentrators erzeugt.\
        \ Andere Methoden benötigen Strom, der\nzumeist photovoltaisch gewonnen werden soll. Die Photovoltaik\
        \ hat allerdings einen\ngeringen Wirkungsgrad. Eine solarthermischen Anlage hat bei der Erzeugung von\n\
        Prozesswärme demgegenüber prinzipiell einen erheblich höheren Wirkungsgrad, da die\n\n            \
        \                                                                             21"
