      source_quotes:
      - locator:
          page: 44
          pdf_page_index: 43
        quote: "Um eine günstige Ionenausbeute des frisch aus der Kammer einströmenden Gases im QMS\nzu haben,\
          \ wurde die Ionenquelle zentral im Messkreuz positioniert. Damit lag sie genau in\nder Strahlachse zwischen\
          \ der Probengaseinlassöffnung (Kugelventil) und der Turbopumpe.\nDer Emissionsstrom in der Ionenquelle\
          \ lag bei 1 mA, wodurch die Elektronenenergie bis zu\n70 eV betrug.\nZur Kontrolle des Gesamtdruckes\
          \ war am Messkreuz ein separater Vakuumdrucksensor\n(Full-Range-Gauge mit integrierter Penning-Röhre\
          \ / vgl. Kapitel 0) angeflanscht. Der Einfluss\ndes Drucksensors auf das QMS wurde durch ein Zwischenstück\
          \ mit 90° Winkel verringert.\nDas QMS blieb während der gesamten Versuchsreihe unter Vakuum und wurde\
          \ vor jedem\nExperiment ausgeheizt, um es weitestgehend von hartnäckigen Restgasen wie Wasser und\nanderen\
          \ Verschmutzungen (Treibmittel und Pumpenöl) zu reinigen.\nBeim Bruch der Glaskuppel während eines Vorversuches\
          \ reagierte die Schutzabschaltung\nnicht schnell genug auf den plötzlichen starken Gaseinbruch, so dass\
          \ das Wolfram-Filament\nder Ionenquelle durchbrannte. Da der zweite Kathodenfaden durch andere Vorversuche\n\
          angegriffen war, wurden beide ausgewechselt.\nDas verwendete QMS konnte entweder über eine minutenlange\
          \ Messphase das gesamte\nMassenspektrum von 1 bis 100 u bzw. 200 u aufnehmen oder innerhalb einiger Sekunden\n\
          bis zu 12 ausgewählte Massenpartialdrücke detektieren. Die erste Methode lässt sich nur bei\nsich langsam\
          \ ändernden Gasverhältnissen sinnvoll einsetzen, wie z. B. nach längerem\nAbpumpen. Vor der Bestrahlung\
          \ und einige Minuten nach dem Schließen des Shutters\nkonnte so ein komplettes Massenspektrum von 1 bis\
          \ 100 u aufgenommen werden, um einen\nÜberblick über die vorhandenen Gase zu erhalten.\nIn den Bestrahlungsphasen\
          \ bei den Pyrolyseexperimenten wurden dagegen sehr schnelle\nPartialdruckveränderungen aufgenommen, weshalb\
          \ die Messung auf die Verfolgung der\nwesentlichen Gasmassen beschränkt werden musste. Deshalb wurde\
          \ die Untersuchung auf\ndie Massen der vorhergesagten Pyrolyseprodukte und der am stärksten vertretenen\
          \ Rest-\ngase begrenzt. Das QMS untersuchte in den Bestrahlungsphasen dazu die in der Tabelle 3.2\naufgeführten\
          \ Massenpartialdrücke.\nTabelle 3.2: Vom QMS während der Bestrahlung untersuchte Massenpartialdrücke.\n\
          Masse     2      14     16     17     18     28     32     40      43     44     56     72\n        \
          \                                    N2,                          CO2,   Fe,\n Gas     H2      N    \
          \  O     OH     H2O            O2    Ar, Ca   AlO                 FeO\n                             \
          \              CO, Si                        SiO    CaO\n\n3.2.7 Vakuumdruckmesser\nZur Überprüfung und\
          \ Datenaufnahme des Drucks wurden verschiedene Vakuumdruck-\nmesser verwendet, welche zusammen mit ihrer\
          \ Positionierung im Aufbau in Tabelle 3.3\naufgelistet sind. Die Messerfassung berechnet aus den ausgegebenen\
          \ Spannungen der\nDruckmesser mit Hilfe entsprechender Kalibrierungsformeln den Vakuumdruck. Die Druck-\n\
          messer wurden auf dem 3D-Tisch im Aufbau integriert.\nUm das Vorvakuum in den einzelnen Pumpständen zu\
          \ überprüfen, wurden drei Pirani-\nRöhren eingesetzt. In den zwei Kombiröhren waren ebenfalls Pirani-Röhren\
          \ zusammen mit\nHochvakuum-Messröhren integriert, so dass eine Messung des vorherrschenden Drucks\nüber\
          \ den gesamten Druckbereich gewährleistet war.\nDer Druck in der Kammer sollte möglichst genau gemessen\
          \ werden. Da der Basisdruck der\nExperimente jedoch unter 1·10-4 mbar lag, konnte kein Kapazitätsvakuummeter\
          \ oder Pirani-\nManometer eingesetzt werden. Stattdessen wurde ein Glühkathoden-Manometer verwendet.\n\
          Einige Vorversuche zeigten allerdings, dass erhebliche Verdampfungen bzw. Verunreini-\ngungen auftreten\
          \ konnten. Deshalb wurde an die Vakuumkammer ein Drucksensor ange-\nbracht, der speziell für Sputter-\
          \ und Plasmaprozesse ausgelegt ist aber trotzdem eine hohe\nGenauigkeit und Reproduzierbarkeit aufweist.\n\
          Durch den Einsatz mehrerer Sensoren im Kammerbereich konnten Untergrundstörungen\nentdeckt werden. So\
          \ führten beispielsweise Verunreinigungen in den Röhren zu spontanen,\nleichten Schwankungen, die nur\
          \ im betroffenen Detektor beobachtet wurden. Auch der\nAusfall eines Sensors und damit die Aufzeichnung\
          \ des Druckverlaufes – wie in einem\nVorversuch geschehen – wurden durch die Messung der anderen Sensoren\
          \ abgesichert. So\n\n                                                                               \
          \              44"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
