    - observation_id: sauerborn_2005_melts_liquidus_model_deep2
      experiment: jsc1-solar-series
      type: rate_series
      locator:
        page: 17
        paragraph: MELTS simulation liquidus
      phase: JSC-1_model
      regime: model_calculation
      units: degC
      values:
        quantity: MELTS_liquidus_model_output
        evidence_class: model
        method_class: model_derived
        semantics: bound_not_point_ordering
        liquidus_C: 1264
        note: Schema rate_series pointer with bound-not-point semantics; not a measured rate or transition. Model
          component split from the mixed legacy composition rows.
      source_quotes:
      - locator:
          page: 17
          pdf_page_index: 16
        quote: "Metalllegierungen, die auf der Erde nicht oder nur äußerst selten vorkommen, und durch die\nauf\
          \ dem Mond vorherrschenden Bedingen - wie die fehlende Gassphäre oder dem Bombar-\ndement von kosmischen\
          \ Kleinstpartikel bis zu großen Meteoriten - geprägt wurden. Weitere\nInformationen zu diesem Thema stehen\
          \ im Anhang Kapitel 7.1.1.\n\n\n\n\nAbbildung 2.2: Vergleich zwischen einer Mondstaub-Probe der Apollo\
          \ 14 Mission mit dem für\ndie Experimente verwendeten Mondstaub-Simulat JSC-1 der NASA (Analyse der Oxide\
          \ und die\nmineralogische Zusammensetzung) [MKCa 94].\nEine Untersuchung mit dem Simulationsprogramm\
          \ MELTS ergab für JSC-1 Lunar Soil\nSimulant unter Normaldruck einen Schmelzpunkt von 1264 °C [melt 03].\
          \ Oberhalb dieser\nTemperatur sind die verschiedenen enthaltenen Phasen des Granulats vollständig aufge-\n\
          schmolzen.\nDieses Simulat weist einige kleinere Abweichungen zum echten Regolith auf, die bei der\n\
          Verwendung zur Vakuumpyrolyse von Bedeutung sind. Es hat einen deutlich erhöhten Anteil\nan volatilem\
          \ Na und enthält durch den Fe2O3-Anteil, der im Mondbasalt nicht vorkommt,\nzudem auch etwas mehr Sauerstoff\
          \ als das lunare Vergleichsmaterial. Der Sauerstoff ist in\nder Verbindung mit Fe3+ außerdem leichter\
          \ gebunden, so dass die Sauerstoffgewinnung mit\ndiesem Simulat etwas einfacher sein könnte.\n\n2.2 Pyrolyse\
          \ von Mineralen unter Vakuum\nNach einer kurzen Einführung, über die Pyrolyse und einem Überblick in\
          \ welchen Bereichen\nder Chemie sie unter anderem eingesetzt wird, wird verdeutlicht, was in dieser Arbeit\
          \ unter\nHochtemperaturpyrolyse von Mineralschmelzen zu verstehen ist. Ferner wird der Einfluss\ndes\
          \ Vakuums auf die Prozesse diskutiert.\n\n2.2.1 Pyrolyse\nDer Begriff Pyrolyse leitet sich aus den griechischen\
          \ Wörtern pyro für „Feuer, Hitze“ und lysis\nfür „Lösung“ bzw. „durch Auflösen entstanden“ ab. Man spricht\
          \ auch von thermischer\nZersetzung, Aufspaltung oder Dissoziation. In der Chemie versteht man unter Pyrolyse\n\
          allgemein den Abbau höhermolekularer Stoffe zu kleineren, eventuell einfacher gebauten\nMolekülen durch\
          \ Einwirkung von Hitze [LCh 87]. Diese Prozesse gehören zur Klasse der\npyrochemischen Reaktionen, womit\
          \ man durch Wärme bewirkte chemische Umsetzungen\nbezeichnet. Der Begriff der pyrochemischen Reaktionen\
          \ umfasst auch aufbauende Reak-\n\n                                                                 \
          \                           17"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
    - observation_id: sauerborn_2005_melts_full_melt_model_1261_deep2
      experiment: jsc1-solar-series
      type: rate_series
      locator:
        page: 107
        paragraph: theoretischen Wert von 1261 °C
      phase: JSC-1_model
      regime: model_calculation
      units: degC
      values:
        quantity: MELTS_liquidus_model_output
        evidence_class: model
        method_class: model_derived
        semantics: bound_not_point_ordering
        liquidus_C: 1261
        note: Printed theoretical full-melt value differs from the earlier MELTS sentence; no averaging or reconciliation.
      source_quotes:
      - locator:
          page: 107
          pdf_page_index: 106
        quote: "1.E-5\n                                    MS1                                          vollständiges\n\
          \                                                                                 Aufschmelzen\n    \
          \                                MS2                                                                \
          \ Freisetzung von O 2\n                                                                             \
          \      (theor. ab\n                                    MS4\n                                        \
          \                                            1261 °C)\n                                    MS5\n    \
          \                                                        Ausgasung\n\n\n                          1.E-6\n\
          \n\n\n\n O2-Partialdruck [mbar]\n                                                        MS5\n\n\n  \
          \                                                      MS4\n\n\n                          1.E-7     \
          \                    MS1\n\n                                                        MS2\n\n\n\n\n   \
          \                       1.E-8\n                              500   600   700   800   900       1000 \
          \   1100   1200   1300       1400       1500      1600    1700\n                                    \
          \                                    [°C]\n\nAbbildung 5.56: Verlauf des O2-Partildrucks in der Hochtemperaturphase\
          \ in Abhängigkeit der\nTemperatur der Versuche mit Mondstaub-Simulat. Für den Vergleich wurde der Basisdruck\n\
          \                        -7\naller Experimente auf 10 mbar normiert. Bis 1200 – 1300 °C sind die Ausgasungs-Peaks\
          \ zu\nsehen. Um den rot markierten Bereich bzw. um den theoretischen Wert von 1261 °C stagniert\nder\
          \ Temperaturanstieg (außer bei MS2) kurzzeitig, was auf das vollständige Aufschmelzen der\nProben hinweist.\
          \ Über 1400 °C steigen die O2-Partialdrücke wieder deutlich an und zeigen die\nFreisetzung von O2 an.\
          \ (Um den zeitlichen Verlauf des Experimentes zu dokumentieren, haben\ndie berechneten Datenpunkte aller\
          \ Linien 1 s Abstand.)\nEine theoretisch ebenfalls denkbare Quelle für Sauerstoff stellen Gleichgewichtsreaktionen\n\
          dar, die bei hohen Temperaturen O2 binden und bei niedrigen entsprechend freisetzen. In\nKapitel 3.2.2\
          \ wurde dazu das Verhalten von NO diskutiert, das entsprechende Reaktion\naufweist. Auch wenn die geringe\
          \ Reaktionswahrscheinlichkeit des Gases dagegen spricht,\nkonnte sie vorab nicht ausgeschlossen werden.\
          \ Bei einem Vorversuch wurde deshalb der\nMassenpartialdruck 30 u während der Bestrahlung gemessen. Es\
          \ konnte jedoch keine\nKorrelation zwischen der Abnahme des Sauerstoffpartialdrucks und einem Anstieg\
          \ von NO\nfestgestellt werden. Vielmehr zeigt der Verlauf der NO-Kurve das Ausheizverhalten anderer\n\
          reaktionsträger Restgase wie z. B. Ar. Der Partialdruck von NO blieb dabei immer mindes-\ntens eine halbe\
          \ Zehnerpotenz unter dem von Sauerstoff. Selbst wenn ein passendes\nDruckverhalten vorläge, würde dies\
          \ auf keinen Fall relevante Verluste von O2 ausreichend\nerklären.\nAnzumerken ist, dass NO im QMS auch\
          \ als Kreuzprodukt bei der Ionisierung von N2 und O2\nentsteht, und daher immer bei der Detektion der\
          \ beiden Gase mitregistriert wird.\n\n5.2.2 Mineralogische Untersuchungen\nDie bestrahlten Proben aus\
          \ Mondstaub-Simulat und die Kühlfallenfolien wurden mit den er-\nwähnten mineralogischen Analyseverfahren\
          \ (REM, EDX, RFA, Elektronenstrahl-Mikrosonde)\nauf einen möglichen Sauerstoffverlust hin untersucht.\
          \ Es zeigte sich, dass diese unübliche\nAufgabenstellung nur begrenzt umgesetzt werden konnte. Trotzdem\
          \ konnten mehrere\nplausible Indizien für Reduzierungen in der Probe und Freisetzung von Sauerstoff gefunden\n\
          werden.\nAlle Proben aus Mondstaub-Simulat waren hauptsächlich zu Basaltglas mit auffällig vielen\nGasblasen\
          \ erstarrt. Die durchgehend aufgeschmolzenen Proben MS1 und MS2 waren bis\nauf vereinzelte, kleine Kristalle\
          \ (Plagioklase), ausschließlich zu Basaltglas erstarrt. Die\nAbkühlrate dieser Schmelzen (Tabelle 5.3)\
          \ war offensichtlich zu hoch für Kristallisationen.\n\n\n                                           \
          \                                                                                   107"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
