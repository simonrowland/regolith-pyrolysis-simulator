          \                                                                 Pyroxen\n\n\n\n5.2 Bilanz der Versuchs-\
          \ und Untersuchungsergebnisse\nBei der Auswertung der Experimente wurden mehrere Hinweise für eine solarthermische\n\
          Pyrolyse des untersuchten Mondstaub-Simulats gefunden, durch die Sauerstoff freigesetzt\nwurde. Sowohl\
          \ die Ergebnisse der Gasanalysen als auch die der mineralogischen Unter-\nsuchungen enthielten entsprechende\
          \ Indizien mit unterschiedlicher Beweiskraft. Tabelle 5.7\ngibt einen Überblick über die Aussagekraft\
          \ der gefundenen Hinweise dieser Unter-\nsuchungen. Die Wertung schätzt dabei grobe die Qualität des\
          \ Messverfahrens und die\nMöglichkeit für eine Fehlinterpretation der vorliegenden Daten ab. Wie zu sehen\
          \ ist, konnten\nkeine gegenteiligen Hinweise gefunden werden, so dass in der Summe der vorliegenden\n\
          Untersuchungsergebnisse von einer Sauerstofffreisetzung und damit von einer Pyrolyse des\nMondstaub-Simulats\
          \ ausgegangen werden kann.\nUm zu den Resultaten zu kommen, mussten bei der Gasanalyse der einzelnen\
          \ Versuche die\nUrsachen für die beobachteten Verläufe der Gaspartialdrücke geklärt werden. Die damit\n\
          \n11\n  Fo17-Fa83 = Olivinmineral mit 17 % Forsterit- und 83 % Fayalitanteil; Spinellmix = Mischphase\
          \ der\nSpinellgruppe; An71-Al29 = Plagioklas mit 71% Anorthit- und 29 % Albitanteil\n\n             \
