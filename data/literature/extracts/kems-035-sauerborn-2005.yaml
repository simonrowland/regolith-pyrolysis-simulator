      source_quotes:
      - locator:
          page: 17
          pdf_page_index: 16
        quote: "Metalllegierungen, die auf der Erde nicht oder nur äußerst selten vorkommen, und durch die\nauf\
          \ dem Mond vorherrschenden Bedingen - wie die fehlende Gassphäre oder dem Bombar-\ndement von kosmischen\
          \ Kleinstpartikel bis zu großen Meteoriten - geprägt wurden. Weitere\nInformationen zu diesem Thema stehen\
          \ im Anhang Kapitel 7.1.1.\n\n\n\n\nAbbildung 2.2: Vergleich zwischen einer Mondstaub-Probe der Apollo\
          \ 14 Mission mit dem für\ndie Experimente verwendeten Mondstaub-Simulat JSC-1 der NASA (Analyse der Oxide\
          \ und die\nmineralogische Zusammensetzung) [MKCa 94].\nEine Untersuchung mit dem Simulationsprogramm\
          \ MELTS ergab für JSC-1 Lunar Soil\nSimulant unter Normaldruck einen Schmelzpunkt von 1264 °C [melt 03].\
          \ Oberhalb dieser\nTemperatur sind die verschiedenen enthaltenen Phasen des Granulats vollständig aufge-\n\
          schmolzen.\nDieses Simulat weist einige kleinere Abweichungen zum echten Regolith auf, die bei der\n\
          Verwendung zur Vakuumpyrolyse von Bedeutung sind. Es hat einen deutlich erhöhten Anteil\nan volatilem\
          \ Na und enthält durch den Fe2O3-Anteil, der im Mondbasalt nicht vorkommt,\nzudem auch etwas mehr Sauerstoff\
          \ als das lunare Vergleichsmaterial. Der Sauerstoff ist in\nder Verbindung mit Fe3+ außerdem leichter\
          \ gebunden, so dass die Sauerstoffgewinnung mit\ndiesem Simulat etwas einfacher sein könnte.\n\n2.2 Pyrolyse\
          \ von Mineralen unter Vakuum\nNach einer kurzen Einführung, über die Pyrolyse und einem Überblick in\
          \ welchen Bereichen\nder Chemie sie unter anderem eingesetzt wird, wird verdeutlicht, was in dieser Arbeit\
          \ unter\nHochtemperaturpyrolyse von Mineralschmelzen zu verstehen ist. Ferner wird der Einfluss\ndes\
          \ Vakuums auf die Prozesse diskutiert.\n\n2.2.1 Pyrolyse\nDer Begriff Pyrolyse leitet sich aus den griechischen\
          \ Wörtern pyro für „Feuer, Hitze“ und lysis\nfür „Lösung“ bzw. „durch Auflösen entstanden“ ab. Man spricht\
          \ auch von thermischer\nZersetzung, Aufspaltung oder Dissoziation. In der Chemie versteht man unter Pyrolyse\n\
          allgemein den Abbau höhermolekularer Stoffe zu kleineren, eventuell einfacher gebauten\nMolekülen durch\
          \ Einwirkung von Hitze [LCh 87]. Diese Prozesse gehören zur Klasse der\npyrochemischen Reaktionen, womit\
          \ man durch Wärme bewirkte chemische Umsetzungen\nbezeichnet. Der Begriff der pyrochemischen Reaktionen\
          \ umfasst auch aufbauende Reak-\n\n                                                                 \
          \                           17"
