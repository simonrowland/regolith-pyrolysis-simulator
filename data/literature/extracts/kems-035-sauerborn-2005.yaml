          \    XX                 -                XX             X\n\n   MS2          XXX                    \
          \ X                 XX                XX                 -            XX\n\n   MS4           XX     \
          \                X                 XX                X                  0             X\n\n   MS5   \
          \       XXX                     X                 XX                XX                XXX           \
          \     -\n\nAnalog wird im darauffolgenden Unterkapitel eine Bilanz der mineralogischen Untersu-\nchungen\
          \ (REM, EDX, Elektronenstrahl-Mikrosonde) der Proben und der Kühlfallenfolien\ngezogen.\n\n5.2.1 Untersuchungsbilanz\
          \ der Temperaturverläufe und Gasanalysen\nDie Pyrolyseversuche mit Mondstaub-Simulat lassen sich in zwei\
          \ Gruppen einordnen. Die\nersten zwei Proben MS1 und MS2 wurden vollständig aufgeschmolzen, während bei\
          \ den\nletzten beiden MS4 und MS5 ein größerer Anteil an Restgranulat übrig blieb. Das\nRestgranulat\
          \ erschwerte die Gasanalyse, da dieses noch in der Hochtemperaturphase\nkontinuierlich ausgaste und damit\
          \ größere Mengen der störenden Restgase freisetzte.\nEffekte der Anlage und Reaktionen in den bestrahlten\
          \ Proben lassen sich deshalb deutlicher\nan den Verläufen der Gasanalysen der komplett geschmolzenen\
          \ Proben erkennen.\nUm die Verhältnisse beim Ausheizen der Restgase besser abschätzen zu können, enthält\n\
          Tabelle 5.8 einige wesentliche Daten zu den gemessenen Druckwerten der Ausheiz-Peaks\nder Vorheiz- und\
          \ Hochtemperaturphase. Dazu wurden ein Versuch ohne Probe und zwei mit\nunterschiedlich großen Mengen\
          \ an Mondstaub-Simulat miteinander verglichen.\nDie vorliegenden Daten in Tabelle 5.8 zeigen deutlich,\
          \ dass mit der Probenmenge auch die\nRestgasmenge ansteigt. So verringerte sich im Experiment MS5 mit\
          \ der größten Proben-\nmasse der Druck trotz 20 Minuten andauernden Vorheizens (sonst 15 Minuten) nicht\n\
          nachhaltig. Der Kammerdruck konnte bei diesem Versuch wegen der großen Restgas-\nmengen in der Probe\
          \ nicht einmal die halbe Höhe des Ausgasungs-Peaks unterschreiten.\nDie Saugleistung der Diffusionspumpe\
          \ war dafür offensichtlich zu gering.\nTabelle 5.8: Dauer und Druckverhältnis der Ausheiz-Peaks verschiedener\
          \ Experimente\n(* Die Halbwertsbreite definiert sich über den vor der Bestrahlung herrschenden Basisdruck\n\
          und die Höhe der Ausheiz-Peaks)\n                                                   Halbwertsbreite*\
