      source_quotes:
      - locator:
          page: 89
          pdf_page_index: 88
        quote: "Ein Teil des Materials der Probe MS2 wurde mit Hilfe einer RFA genauer auf ihre elementare\nZusammensetzung\
          \ untersucht. Da die Temperatur innerhalb der Proben nach unten hin\nabnahm und damit sehr inhomogen\
          \ war, muss auch der Fortschritt der Pyrolyseprozesse\nlokal unterschiedlich gewesen sein. Die RFA konnte\
          \ jedoch nur die Gesamtveränderung des\nbestrahlten Mondstaub-Simulats feststellen, da sich die untersuchten\
          \ Proben wegen der\ngeringen Probenmenge nicht nach Probenbereichen proportionierten und damit differen-\n\
          zieren ließen. In Abbildung 5.31 wurden die gemessenen Werte der Proben MS2, MS4 und\nMS5 mit den einer\
          \ unbehandelten Probe MS0 des Ausgangsmaterials (JSC-1) verglichen.\nAbbildung 5.32 zeigt die Veränderung\
          \ in der Probenzusammensetzung durch die\nBestrahlung im Verhältnis zum Aluminiumoxidanteil.9 Die Auswertung\
          \ der RFA der Probe\nMS2 zeigt, dass sich durch die Behandlung vor allem die volatilen Bestandteile Na2O,\
          \ K2O\nund P2O5 um 32 bis 43 % reduziert hatten. Auch die Anteile der stabileren Oxide SiO2, TiO2,\n\
          Fe2O3, MgO, MnO und CaO waren gegenüber den Ausgangswerten um rund 5 bis 7 % leicht\nvermindert.\n  \
          \                        100\n                                         EDX                          \
          \           MS 0\n                                                                                 MS\
          \ 2 Rand Außen\n                                                                                 MS 2\
          \ Mitte\n                                                                                 MS 2 Rand Träger\n\
          \                               10\n\n\n\n\n    atomarer Anteil [Atom.%]\n                          \
          \      1\n\n\n\n\n                               0.1\n\n\n\n\n                  0.01\n              \
          \                       O   Na    Mg   Al   Si   P   K   Ca    Ti       Mn      Fe\n\nAbbildung 5.33:\
          \ Elementare Zusammensetzung der Probe MS2 ermittelt durch EDX-Flächen-\nanalysen über verschiedene Bereiche\
          \ des Probenquerschnitts. Zum Vergleich ist die Mittelung\ngroßflächiger EDX-Analysen einer unbehandelten\
          \ Probe des Mondstaub-Simulats (MSO)\nangegeben.\nWie schon die RFA für die gesamte Probe zeigt, ergab\
          \ auch die Auswertung der EDX-\nAnalysen eine deutliche Verringerung der volatilen Elemente (Natrium,\
          \ Phosphor, Kalium),\nvor allem am äußeren Probenrand (Abbildung 5.34). Dafür reicherten sich vor allem\
          \ in der\nMitte der Schmelze Magnesium, Aluminium, Silizium und Titan an. Die Werte von Calcium\nund\
          \ Eisen erhöhten sich in der Mitte der Schmelze ebenfalls, nahmen aber am äußeren\nRand der Probe ab.\
          \ Der Mangananteil verringerte sich zwar in der Nähe der Aluminiumoxid-\nkeramik, diese blieb aber innerhalb\
          \ des Messfehlers der EDX-Messung (vgl. Kapitel 0), da\nder Mn-Anteil in der Probe ohnehin nur sehr gering\
          \ war.\nEine eingebettete Feinschliffprobe von MS2 wurde im REM untersucht. Hierbei wurden\neinzelne\
          \ plane Flächen aus Basaltglas, die zwischen den Blasen lag über die Probe verteilt\nwaren, mit dem EDX\
          \ vermessen. Die Analysen wurden in die Bereiche „Rand Außen“, „Mitte“\nund „Rand Al2O3“ eingeordnet.\
          \ Die ermittelten lokalen Werte wurden einerseits mit den Daten\neiner unbehandelten Probe bzw. dem Ausgangsmaterial\
          \ (MS0) in Abbildung 5.33 ver-\n\n9\n Hierbei wird, wie es allgemein bei solchen Reaktionen in der Mineralogie\
          \ üblich ist, angenommen,\ndass sich die absolute Menge des Al2O3 in der Probe trotz der Aufheizung quasi\
          \ nicht verändert hat.\n\n                                                                          \
          \                        89"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
