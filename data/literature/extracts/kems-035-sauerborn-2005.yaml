        quote: "An einem kleinen Abschnitt des Keramikringes hatte sich sogar etwas Glas gebildet. Nach\nSchließen\
          \ des Shutters bekam die Trägerplatte aus Al2O3 vermutlich durch den Thermo-\nschock einen Sprung. Da\
          \ sich die Probe dabei überall im Aufbau verteilt hatte, konnte die\nProbenmasse nach der Bestrahlung\
          \ nicht mehr exakt ermittelt werden.\n\n\n                                                          \
          \ Abbildung 5.8: RE-Bild der Kühlfallenfolie\n                                                      \
          \     des Bestrahlungsversuches mit CaO. Auf\n                                                      \
          \     der stark geriffelten Oberfläche der\n                                                        \
          \   Tantalfolie wurde mit dem EDX eine leichte\n                                                    \
          \       Bedampfung       mit     Ca    detektiert.\n                                                \
          \           (Bildbereich: 1 mm x 1 mm)\n\n\n\n\nBei einer Untersuchung der bestrahlten Probenmenge mit\
          \ Hilfe der XRD wurden neben CaO\nzusätzlich nur noch geringe Spuren von Calciumhydroxid (Ca(OH)2) gefunden.\
          \ Dieses\nmusste sich aber nachträglich trotz Trockenlagerung durch Luftfeuchtigkeit aus dem CaO\ngebildet\
          \ haben. Es konnten demnach keine Pyrolyseprodukte gefunden werden.\nNach dem Belüften zeigte sich auf\
          \ der Innenseite der konusförmigen Abschirmung eine\nleichte, matte Schicht, die das Licht farbig brach.\
          \ Auch die Kühlfallenfolie wies eine deutliche\nBeschichtung auf (vgl. Abbildung 4.11). Heiße CaO-Körner\
          \ hatten auf der gekühlten Boden-\nplatte einige schwarze Flecken auf dem bestrahlten Aluminium hinterlassen.\
          \ Auf der Glas-\nkuppel war dagegen keine auffällige Bedampfung zu erkennen.\nBei der Untersuchung der\
          \ Tantalfolie im REM (Abbildung 5.8) wurde mit dem EDX eine\nleichte Bedampfung mit Calcium festgestellt\
          \ (Tabelle 5.2). Dabei kann davon ausgegangen\nwerden, dass es sich um CaO oder Ca(OH)2 handelt, das\
          \ nach dem Belüften entstand. Viel\nauffälliger und stärker als die Werte des Calciums hatten sich die\
