          pdf_page_index: 67
        quote: "abgesteckt sind (vgl. Kapitel 2.2.4.2), war eine Variierung der experimentellen Bedingungen\nohnehin\
          \ vorgesehen.\nWeil die Proben unterschiedlich stark ausgasten, musste die Ventilstellung zum Messkreuz\n\
          während der Messreihe zweimal nachgestellt werden. Dadurch veränderte sich der\nDrucklevel für das QMS\
          \ - nicht aber die verhältnismäßige Zusammensetzung der Gase,\nweshalb auch die Auswertung nicht beeinflusst\
          \ wird.8 Die verschiedenen Druckniveaus, die\nunterschiedlichen Restgasmengen und Restgaszusammensetzungen\
          \ bewirken, dass bei\nallen Versuchen die Gaspartialdrücke vor der Hochtemperaturphase im Vergleich zueinander\n\
          zum Teil variierten. Wesentliche Einflussnahmen dieser Schwankungen werden bei den\neinzelnen Versuchen\
          \ diskutiert.\n\n5.1.1 Versuche ohne Proben\nEs wurden einige Bestrahlungen ohne Proben durchgeführt,\
          \ um die Auswirkungen der\nBestrahlung auf die Anlage und deren Einflüsse auf die Messungen besser abschätzen\
          \ zu\nkönnen. Diese Versuche waren insbesondere für die Auswertung der Daten des\nMassenspektrometers\
          \ von Interesse, da hierbei das Gasaufkommen der leeren Anlage beim\nAusheizen sichtbar wurde. Durch\
          \ diese Tests konnten beispielsweise verschiedene Effekte,\ndie bei den Versuchen mit Proben ebenfalls\
          \ auftraten, dem Hintergrundverhalten der Anlage\nzugeschrieben werden. In Abbildung 5.1, 5.2 und 5.3\
          \ sind die wesentlichen Daten eines\nsolchen Tests ohne Probe mit dem hauptsächlich verwendeten Probenhalter\
          \ (Scheibe mit\naufgelegtem Begrenzungsring) zu sehen. Um außerdem eine Übersicht über die zahlreichen\n\
          ermittelten Daten der Bestrahlungen der einzelnen Vergleichsexperimente ohne Proben und\nmit Referenzprobe\
          \ zu erhalten, sind verschiedene interessante Messwerte in Tabelle 5.1\nzusammengestellt.\nTabelle 5.1:\
          \ Daten zum Verlauf der Referenztests. (*Werte des Probenträgers)\n                                 \
          \           ohne Probe         CaO           SiO2          ZnO\nmaximale Probentemperatur (Tmax)    \
          \          800 °C*         1638 °C       1400 °C       1188 °C\nProbenmasse                         \
          \             -           0.7789 g       0.6719 g      0.6072 g\nBestrahlungsdauer der\nHochtemperaturphase\
