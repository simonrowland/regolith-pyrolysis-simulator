      - locator:
          page: 76
          pdf_page_index: 75
        quote: "Partialdruck einen gegenläufigen Anstieg. Diese Partialdruckwerte lassen durchaus den\nSchluss\
          \ zu, dass der Anstieg des Sauerstoffes durch eine Pyrolyse bedingt war.\nDie Hochtemperaturbestrahlung\
          \ dauerte 84 s und die maximale Probentemperatur lag\ninsgesamt 98 s lang über 1000 °C und 137 s lang\
          \ über 800 °C.\nAbbildung 5.12 zeigt die Probe auf dem Probenträger nach der Bestrahlung. Aus dem feinen\n\
          Pulver entstand durch das Aufheizen ein Granulat aus gröberen Körnern, die in der oberen\nSchicht der\
          \ Probe leicht miteinander verbacken waren. Erwartungsgemäß war das Proben-\npulver trotz der hohen Temperaturen\
          \ nur etwas gesintert. Das zeigt auch die übliche leichte\nSchrumpfung an, durch die sich das verbackene\
          \ Pulver vom Begrenzungsring entfernt hatte.\nDer ermittelte Massenverlust der Probe betrug 1,1 Gew.%.\n\
          Auch diese Probe wurde mittels XRD untersucht. Gefunden wurde jedoch nur das\nAusgangsmineral Quarz (SiO2),\
          \ also keine reduzierte SiO-Phase. Es konnte somit keine\nPyrolyse nachgewiesen werden. Eine nachträgliche\
          \ Oxidation des möglicherweise in der\nProbe entstandenen SiO zu Beginn der Abkühlphase bei noch hohen\
          \ Probentemperaturen\nkann hingegen nicht ausgeschlossen werden. Denn wenn SiO entstanden war, konnte\
          \ es\nauch vollständig ausgedampft sein. Allerdings war keine Bedampfung am Innenaufbau oder\nan der\
          \ Glaskuppel zu erkennen. Auch die Kühlfallenfolie wies keine sichtbare Beschichtung\nauf. Eine genaue\
          \ Untersuchung der Tantalfolie mit dem EDX wurde durch die Überlagerung\nder Röntgensignale des Siliziums\
          \ und des Tantals gestört (vgl. Kapitel 4.4.2), so dass die\nermittelten Daten keine Aussagekraft hatten.\n\
          \n5.1.4 ZnO\nWie in Kapitel 0 schon beschrieben, ist die solarthermische Pyrolyse von ZnO ein intensiv\n\
          untersuchter Prozess. Während sich die erwärmten Proben (SiO2, CaO) in den\nvorangegangenen Experimenten\
          \ der Versuchsreihe eher passiv verhielten, ist dieser\nReferenztest im Vergleich dazu ein Beispiel für\
          \ eine deutliche Pyrolysereaktion. Mit diesem\nVersuch konnte das verstärkte Auftreten von Sauerstoff\
          \ in der Anlage verfolgt werden, der\ndurch eine thermische Zersetzung freigesetzt wurde. Die Ausgangsmasse\
          \ des auf den\nProbenträger ausgestreuten Zinkoxidpulvers betrug dabei etwa 0,61 g.\nDamit es bei dem\
          \ Probenmaterial nicht schon in der Vorheizphase zu ungewollten\nReaktionen kam, wurde die Temperatur\
          \ bei einer Strahlleistung von bis zu 0,4 kW auf etwa\n500 °C (statt 600 °C) beschränkt. Diese niedrigere\
          \ Vorheiztemperatur wurde durch ein\nlängeres Ausheizen der Probe (1358 s) ausgeglichen.\nDie Sonneneinstrahlung\
          \ lag bei diesem Bestrahlungsversuch fast konstant bei etwa 720\nW/m², weshalb eine Leistungsänderung\
          \ des Sonnenofenstrahls nur von der Stellung des\nShutters abhing. Auch bei diesem Versuch blieben die\
          \ Temperaturwerte des Versuchs-\naufbaus (Abbildung 5.13) unterhalb kritischer Grenzen. Die Glaskuppel\
          \ wurde 225 °C und\ndie Kühlfalle 198 °C heiß. Für die Kühlfalle war dies eine Temperatur, die erheblich\
          \ unter\ndenen der anderen Versuche mit Probe lag. Ursache dafür war wahrscheinlich die ebenfalls\ndeutlich\
          \ niedrigere Temperatur des Probenmaterials (Abbildung 5.14), und die damit ver-\nbundene schwächere\
          \ Wärmeabstrahlung.\nVon der Vorheiztemperatur ausgehend stieg zu Beginn des Pyrolyseheizens die Temperatur\n\
          der Probe sprunghaft bis auf rund 1170 °C an. Sie blieb danach allerdings fast über den\ngesamten Bestrahlungszeitraum\
          \ auf diesem Niveau, obwohl der Shutter stufenweise von 25\n% auf 40 % geöffnet worden war. Im ersten\
          \ Abschnitt der Hochtemperaturphase wurde ein\nAnstieg der Temperaturwerte offensichtlich durch den Reduktionsprozess\
          \ verhindert. Dies\nzeigt sich sehr deutlich an der starken Erhöhung des O2-Partialdrucks, der alle anderen\
          \ Gas-\nPartialdrücke um ein vielfaches überstieg (Abbildung 5.15). Im Laufe der Bestrahlung\nverringerte\
          \ sich der O2-Partialdruck jedoch langsam, so dass davon auszugehen ist, dass die\n„Sauerstoffquelle“\
          \ versiegte bzw. der ZnO-Vorrat auf dem Probenträger verbraucht war.\nInsgesamt dauerte die Hochtemperaturbestrahlung\
          \ 101 s und der gemessene Höchstwert\nder Probe betrug etwa 1190 °C. Die Probentemperatur war 119 s lang\
          \ Werte über 1000 °C\nund 166 s lang über 800 °C.\nDie Kurven von N2, CO2, H2O und O verliefen während\
          \ der gesamten Pyrolysephase etwa\nparallel zum O2-Partialdruck. Dieses Verhalten kann mit dem anhaltenden\
          \ Aufwirbeln von\nRestgasen durch den freiwerdenden Sauerstoff erklärt werden. Nach Schließen des Shutters\n\
          \n                                                                                         76"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
