        \    Aufkohlung              Oxidation\nMolybdän 2622 °C     2200 °C\n                            \
        \    300 °C\n                                            stabil     stabil\n                      \
        \                                           700-1100 °C     1000 °C\n                             \
        \                                                                kohlung\n                        \
        \                                                                                1200 °C\n        \
        \                                                                                     1400 °C\n   \
        \                                                                                            Auf-\n\
        \                               Oxidation                           Nitrierung   Aufkohlung       \
        \       Oxidation\nWolfram    3410 °C   2700 °C\n                                400 °C\n         \
        \                                   stabil     stabil\n                                           \
        \                      1000-1100 °C     900 °C\n                                                  \
        \                                           kohlung\n                                             \
        \                                                           1200 °C\n                             \
        \                                                                1400 °C\n\nIn der Schmelztechnik und\
        \ der Mineralogie werden verschiedene Materialien für Tiegel und\nProbenhalter zum Aufschmelzen von\
        \ Mineralen eingesetzt. Bei den Werkstoffen aus\nEdelmetall zeigen vor allem die Gefäße aus Iridium\
        \ oder aus einer Platin-Legierung mit Gold,\nIridium oder Rhodium hervorragende Eigenschaften. Diese\
        \ Edelmetalle sind sogar bei\nextrem hohen Temperaturen gegenüber verschiedenen aggressiven Schmelzen\
        \ sehr wider-\nstandsfähig. Gerätschaften aus diesen Materialien sind allerdings auch teuer. Zum einen\n\
        sind die Rohmetallpreise sehr hoch [ENGE 99]. Und zum anderen ist auch die Verarbeitung\nder Metalle\
        \ wegen der sehr hohen Temperaturen aufwendig, zumal diese nur mit speziellen\nWerkzeugmaterialien\
        \ bearbeitet werden können.\nPlatin ist ein silberweiß glänzendes, verhältnismäßig zähes Edelmetall.\
        \ Um die geringe\nHärte, insbesondere bei hohen Temperaturen auszugleichen, wird es mit Iridium, Gold\
        \ und\nRhenium mit einem Mischanteil bis 30 % legiert. Es wird für Thermoelemente, Widerstands-\nheizdrähte\
        \ in Hochtemperaturöfen, hochwertige chemische Geräte und chirurgische\nInstrumente eingesetzt [Bri\
        \ 95] [HERA 98].\nIridium, ein silberweißes, äußerst hartes und sprödes Edelmetall besitzt die höchste\n\
        Massendichte (22,6 g/cm³) überhaupt. Es ist äußerst reaktionsträge und wird deshalb\ninsbesondere für\
        \ Schmelztiegel im Hochtemperaturbereich zur Züchtung von sehr reinen\nund fehlerfreien Einkristallen\
        \ verwendet [Bri 95] [HERA 98].\nNeben den Edelmetallen werden auch andere günstigere Metalle wie Wolfram,\
        \ Tantal oder\nMolybdän bei hohen Temperaturen benutzt. Da sie unedler sind, sind sie nicht völlig\n\
        beständig gegen Oxidation. Allerdings passiviert wie bei Aluminium eine an der Oberfläche\nentstehende\
        \ dünne Oxidschicht das darunter liegende Metall, so dass es nicht weiter\nangegriffen werden kann\
        \ [HeGö 94].\nWolfram ist ein weißglänzendes, sehr festes und sprödes Schwermetall mit sehr hohem\n\
        Schmelzpunkt (3410 °C). Seine maximale Einsatztemperatur liegt bei 2700 °C, wodurch es\nbesonders für\
        \ Hochtemperaturanwendungen wie Glühlampenfäden, Schweißspitzen,\nAnodenmaterial für Röntgenröhren,\
        \ Heizleiter in Hochtemperaturöfen und Raketendüsen\ngeeignet ist. Wolfram oxidiert in sauerstoffhaltiger\
        \ Atmosphäre schon ab 400 °C (vgl. Tabelle\n7.2). Dabei bildet sich aber eine passivierende Oxidschicht\
        \ auf der Metalloberfläche. Über\n1000 °C setzt zunehmend Lochfraßkorrosion ein, weshalb es bei hohen\
        \ Temperaturen nur\nunter Inertgas oder Vakuum verwendet werden kann [Bri 95],\nTantal ist ein hellgrau\
        \ glänzendes, sehr hartes und dehnbares, in mehreren Wertigkeits-\nstufen vorkommendes Metall mit sehr\
        \ hohem Schmelzpunkt (vgl. Tabelle 7.2). Da es gegen\nviele auch sehr reaktive Chemikalien (u. a. Königswasser)\
        \ sehr beständig ist, wird es häufig\nanstelle von Platin für zahnärztliche und chirurgische Instrumente,\
        \ Röntgenröhrenkathoden\n\n                                                                       \
