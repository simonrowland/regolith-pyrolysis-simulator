        quantity: figure_only_unquoted_digitized_series
        evidence_class: figure_only
        semantics: bound_not_point_ordering
        legacy_digitization_observation_id: sauerborn_2005_fig556_o2_vs_T_normalized
        note: Numeric digitization coordinates and estimates are preserved unchanged in the legacy parent. They
          are not printed cells and are not relabelled as quoted measurements. This superseder retains the figure
          provenance; no new digitization performed.
      supersedes: sauerborn_2005_fig556_o2_vs_T_normalized
      source_quotes:
      - locator:
          page: 107
          pdf_page_index: 106
        quote: "1.E-5\n                                    MS1                                          vollständiges\n\
          \                                                                                 Aufschmelzen\n    \
          \                                MS2                                                                \
          \ Freisetzung von O 2\n                                                                             \
          \      (theor. ab\n                                    MS4\n                                        \
          \                                            1261 °C)\n                                    MS5\n    \
          \                                                        Ausgasung\n\n\n                          1.E-6\n\
          \n\n\n\n O2-Partialdruck [mbar]\n                                                        MS5\n\n\n  \
          \                                                      MS4\n\n\n                          1.E-7     \
          \                    MS1\n\n                                                        MS2\n\n\n\n\n   \
          \                       1.E-8\n                              500   600   700   800   900       1000 \
          \   1100   1200   1300       1400       1500      1600    1700\n                                    \
          \                                    [°C]\n\nAbbildung 5.56: Verlauf des O2-Partildrucks in der Hochtemperaturphase\
          \ in Abhängigkeit der\nTemperatur der Versuche mit Mondstaub-Simulat. Für den Vergleich wurde der Basisdruck\n\
          \                        -7\naller Experimente auf 10 mbar normiert. Bis 1200 – 1300 °C sind die Ausgasungs-Peaks\
          \ zu\nsehen. Um den rot markierten Bereich bzw. um den theoretischen Wert von 1261 °C stagniert\nder\
          \ Temperaturanstieg (außer bei MS2) kurzzeitig, was auf das vollständige Aufschmelzen der\nProben hinweist.\
          \ Über 1400 °C steigen die O2-Partialdrücke wieder deutlich an und zeigen die\nFreisetzung von O2 an.\
          \ (Um den zeitlichen Verlauf des Experimentes zu dokumentieren, haben\ndie berechneten Datenpunkte aller\
          \ Linien 1 s Abstand.)\nEine theoretisch ebenfalls denkbare Quelle für Sauerstoff stellen Gleichgewichtsreaktionen\n\
          dar, die bei hohen Temperaturen O2 binden und bei niedrigen entsprechend freisetzen. In\nKapitel 3.2.2\
          \ wurde dazu das Verhalten von NO diskutiert, das entsprechende Reaktion\naufweist. Auch wenn die geringe\
          \ Reaktionswahrscheinlichkeit des Gases dagegen spricht,\nkonnte sie vorab nicht ausgeschlossen werden.\
          \ Bei einem Vorversuch wurde deshalb der\nMassenpartialdruck 30 u während der Bestrahlung gemessen. Es\
          \ konnte jedoch keine\nKorrelation zwischen der Abnahme des Sauerstoffpartialdrucks und einem Anstieg\
          \ von NO\nfestgestellt werden. Vielmehr zeigt der Verlauf der NO-Kurve das Ausheizverhalten anderer\n\
          reaktionsträger Restgase wie z. B. Ar. Der Partialdruck von NO blieb dabei immer mindes-\ntens eine halbe\
          \ Zehnerpotenz unter dem von Sauerstoff. Selbst wenn ein passendes\nDruckverhalten vorläge, würde dies\
          \ auf keinen Fall relevante Verluste von O2 ausreichend\nerklären.\nAnzumerken ist, dass NO im QMS auch\
          \ als Kreuzprodukt bei der Ionisierung von N2 und O2\nentsteht, und daher immer bei der Detektion der\
          \ beiden Gase mitregistriert wird.\n\n5.2.2 Mineralogische Untersuchungen\nDie bestrahlten Proben aus\
          \ Mondstaub-Simulat und die Kühlfallenfolien wurden mit den er-\nwähnten mineralogischen Analyseverfahren\
          \ (REM, EDX, RFA, Elektronenstrahl-Mikrosonde)\nauf einen möglichen Sauerstoffverlust hin untersucht.\
          \ Es zeigte sich, dass diese unübliche\nAufgabenstellung nur begrenzt umgesetzt werden konnte. Trotzdem\
          \ konnten mehrere\nplausible Indizien für Reduzierungen in der Probe und Freisetzung von Sauerstoff gefunden\n\
          werden.\nAlle Proben aus Mondstaub-Simulat waren hauptsächlich zu Basaltglas mit auffällig vielen\nGasblasen\
          \ erstarrt. Die durchgehend aufgeschmolzenen Proben MS1 und MS2 waren bis\nauf vereinzelte, kleine Kristalle\
          \ (Plagioklase), ausschließlich zu Basaltglas erstarrt. Die\nAbkühlrate dieser Schmelzen (Tabelle 5.3)\
          \ war offensichtlich zu hoch für Kristallisationen.\n\n\n                                           \
          \                                                                                   107"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
      - locator:
          page: 106
          pdf_page_index: 105
        quote: "Reinigungsmitteln (Ethanol, Aceton) oder die technischen Öle der Vakuumpumpen verbrannt\nsein (vgl.\
          \ Kapitel 3.2.2), die auch im Massenspektrum des QMS als Anlagenbackground\ngefunden wurden. Die Veränderungen\
          \ des CO2-Partialdrucks korrelierte allerdings nicht mit\nder Verringerung des O2. In welchen Mengen\
          \ Sauerstoff innerhalb der Anlage verbraucht\nwurde bzw. reagierte, war nicht genau definierbar. Die\
          \ Tatsache, dass O2 verbraucht wurde,\nwar allerdings offensichtlich. Welche Reaktionen dafür verantwortlich\
          \ waren, ließ sich mit\nden gewonnenen Daten und den Rahmenbedingungen der Messung jedoch nicht klären.\n\
          Genaueres dazu wird noch in Kapitel 0 diskutiert. Eine Schwierigkeit bereitete hierbei vor\nallem der\
          \ ermittelte O-Partialdruck. Seine Werte unterlagen auch bei niedrigen\nTemperaturen einer auffälligen\
          \ Korrelation zu pH2O und pCO2 . Da O selbst kein Restgas ist,\nscheinen die Werte nicht völlig von p16O(H\
          \ O) - und p16O(CO ) -Anteilen bereinigt zu sein. Dieses\n                                          \
          \ 2              2\n\nProblem wurde schon in Kapitel 4.3.2 besprochen und hängt mit dem größeren Fehler\
          \ der\nKalibrierungskurve zusammen.\nEine andere mögliche Erklärung für den Verbrauch von Sauerstoff\
          \ in der Vakuumkammer\nwäre eine Oxidation der intensiv bestrahlten Aluminiumoberflächen. Damit diese\
          \ gut\nreflektierten, wurden sie vor der Bestrahlung gründlich gereinigt, so dass O2 beim Aufheizen\n\
          mit dem freiliegenden Aluminium reagieren konnte. Schon bei den Vorversuchen wurde eine\nsolche verstärke\
          \ oberflächliche Oxidation trotz Vakuum (ca. 1 mbar) unter anderem an den\neigentlich passivierten Oberflächen\
          \ der Probenträger aus Tantal und Molybdän beobachtet.\nDie Temperaturbeobachtungen und die Gasanalysen\
          \ zeigten außerdem, wie auch in\nAbbildung 5.56 zu sehen ist, dass die Proben bei den Versuchen mit Mondstaub-Simulat\n\
          zunächst i. d. R. bei Temperaturwerten um den theoretische definierten Wert von 1261 °C\ndurchgehend\
          \ schmolzen. Durch das schnelle Aufheizen konnte die lange Taktung der IR-\nKamera den Temperaturverlauf\
          \ und damit wichtige Temperaturmarken, wie die Schmelz-\ntemperature, nicht genau festhalten. Auf den\
          \ IR-Bildern erreichte die obere Schmelzschicht\nbei MS1 sogar Temperaturenwerte über 1300 °C. Wahrscheinlich\
          \ kam es dort durch die\nSchmelzvorgänge in tieferen Bereichen der Probe zur lokalen Überhitzung. Der\
          \ Verlauf der\nPartialdruckwerte bei MS5 ist dagegen auf Grund der großen Probenmenge und dem\ngrößeren\
          \ Restgasanteil sehr komplex und lässt sich dadurch schlechter interpretieren.\nAb etwa 1425 °C setzte\
          \ bei diesen Versuchen (vgl. einzelne Experimente und Abbildung\n5.56) ein starker Anstieg des O2-Partialdrucks\
          \ ein, der gegen den asymptotisch absinkenden\nTrend der anderen beobachteten Gaspartialdrücke verlief\
          \ und damit eine deutliche Frei-\nsetzung von O2 anzeigte. Ein Vergleich mit den Referenzversuchen (Abbildung\
          \ 5.55) (ohne\nProbe, CaO, SiO2 und ZnO) zeigt, dass dieser Sauerstoff von dem bestrahlten, basaltischen\n\
          Mondstaub-Simulat und nicht aus der Anlage oder dem Probenträger stammte.\nMit Beenden der Hochtemperaturphase\
          \ bzw. mit Schließen des Shutters und Abkühlen der\nProbe sank als Folge des Abbruchs der Pyrolysereaktion\
          \ der O2-Partialdruck i. d. R. rapide\num mehr als eine ganze Dekade. Der Partialdruck fiel bei den Versuchen\
          \ mit Mondstaub-\nSimulat so schnell ab, dass von einem Sauerstoffverbrauch in der Anlage ausgegangen\n\
          werden muss. Ursache dafür sind eventuell Rückreaktionen bzw. Oxidationsprozesse mit der\nnoch heißen\
          \ Probe. Dadurch wurde ein Sauerstoffpartialdruck erreicht, der unter dem Niveau\nvor der Bestrahlung\
          \ lag. Danach folgte durch Endringen von Leckagegas ein langsamer,\nasymptotischer Anstieg des Sauerstoffpartialdrucks.\n\
          Dieses Absinken und das nachfolgende langsame Ansteigen des Sauerstoffpartialdrucks\nzeichnete sich zwar\
          \ bei allen Versuchen ab, war allerdings bei den Proben aus Mondstaub-\nSimulat erheblich intensiver.\
          \ Der Anstieg des O2-Partialdruckes in der Abkühlphase lässt sich\nam einfachsten mit atmosphärischem\
          \ Sauerstoff begründen, der auch noch durch die\nDichtungen einströmte. Dafür spricht auch das ähnlich\
          \ verlaufende Verhalten von N2 und Ar,\nderen Partialdrücke nach dem Experiment stets wieder das gleiche\
          \ Niveau anstrebten, wie\nes vor der Bestrahlung herrschte. Die Bestrahlung bewirkte bei diesen Gasen\
          \ nur einen\nverhaltenen Anstieg der Partialdrücke, was sich durch das Aufwirbeln von Restgasen beim\n\
          Ausheizen erklären lässt. Wasser dagegen, das aufgrund seiner Dipolwechselwirkung haupt-\nsächlich von\
          \ den Wänden der Anlage stammt, wurde durch die Bestrahlung effektiv ausge-\nheizt und hatte nach dem\
          \ Experiment einen deutlich reduzierten Partialdruck.\n\n\n                                         \
          \                                                    106"
        method: pdftotext -layout; whitespace retained; superscripts follow PDF text order
      numeric_provenance_note: Printed cells/sentences are quoted with their printed page below. Where retained,
        T_K = T_C + 273.15 and pressure_Pa = pressure_mbar * 100. T_range_K endpoints refer to the quoted run-temperature
        cells, not independent measurements.
    - observation_id: sauerborn_2005_fig555_printed_zno_increase_deep2
