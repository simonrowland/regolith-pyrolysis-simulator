source:
  citation: >-
    Shornikov, S. I. and Archakov, I. Yu. (2003). Mass spectrometric study of
    thermodynamic properties of the SiO2–CaTiO3 melts. The supplied PDF prints
    pages 112–116 and does not name the proceedings. Shornikova (2019), Russ.
    J. Phys. Chem. A 93, 1428, reference [47], identifies it as Proceedings of
    the 2nd International Symposium on High Temperature Mass Spectrometry,
    ed. L. Kudin, M. Butman, and A. Smirnov (ISUCST, Ivanovo, 2003), p. 112.
  year: 2003
extraction:
  method: >-
    No MinerU table. Prose transcribed from pdftotext. Fig. 1 and Fig. 2
    markers were read on the 600 dpi render of PDF page 4. Axes were
    calibrated from the printed ticks. Each stored centre was checked against
    the connected-component core (filled markers) or the white hole and stroke
    radius (open markers), and the centres were drawn back onto the page.
  date: '2026-10-20'
  worker: t1372-w4-fix1-t5
