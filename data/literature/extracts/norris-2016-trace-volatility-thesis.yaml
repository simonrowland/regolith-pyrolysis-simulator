notes:
- Table 5.7 values are the same measurements shown figure-only in norris-2017-earth-volatiles-nature observations
  norris_2017_figure3_volatility_factors_neg7, norris_2017_figure3_volatility_factors_neg9, norris_2017_figure3_volatility_factors_neg11,
  and norris_2017_figure3_volatility_factors_neg13. That separate extract is unchanged.
- The values above 1 for Cr, Ga, V, W, and other cells are retained exactly as printed; the thesis discusses these
  as within-error constancy or contamination rather than physical negative loss.
- FM is element retention X_final/X_initial; no battery quantity for per-element retention exists yet (separate schema task).
- Table 5.7 run preparation prints 3 g charge mass and a 1 cm diameter pressed pellet; pellet thickness is not stated.
- The furnace used a CO–CO2 mixture and 300 mL/min total flow, but this thesis does not give the per-run gas ratio or component flows; fO2-control ratios are referred to Deines et al. (1976).
