schema_version: literature_extract.v1
source_id: stebbins-carmichael-weill-1983
source:
  citation: >-
    Stebbins, J. F., Carmichael, I. S. E. & Weill, D. E. (1983), "The high
    temperature liquid and glass heat contents and the heats of fusion of
    diopside, albite, sanidine and nepheline", American Mineralogist 68,
    717-730.
  year: 1983
extraction:
  method: manual_transcription_checked_against_held_pdf_and_layout_text
  date: '2026-10-03'
  worker: t1107-stebbins1983
  provenance_path: text/stebbins-carmichael-weill-1983/pdftotext-layout.txt
  method_token_note: >-
    The paper reports high-temperature diphenyl-ether drop calorimetry and twin
    Calvet inverse-drop/drop-solution calorimetry. Neither method has a MethodToken;
    both experiments retain an UNKNOWN method State with the published method name.
    No enum value was added.
  source_note: >-
    DOI is absent because none is printed in the PDF. Published formula-unit molar
    values are retained in cal/mol or kcal/mol as printed; no unit conversions
    were needed. Specific heats retain the printed cal/mol/K units. Uncertainties
    are recorded only where printed. Table 4 footnote 1 distinguishes liquid
    enthalpies referred to rapidly quenched glass from glass-fit equations
    referenced to the more annealed glass. Footnote 2 says nepheline glass Cp at
    985 K is assumed equal to solid Cp, not independently measured; footnote 3
    gives 78 cal/mol as the standard deviation of the mean at 985 K. The discussion
    prints liquid nepheline Cp as 52.9 +/- 1.9 cal/mol/K (p. 726).
  table_evidence_classes:
    table_1: measured inverse-drop calorimetry; authors' means and differences remain reported values
    table_2: measured DSC glass heat capacities; points are means of 2-4 measurements
    table_3: measured drop-calorimetric liquid and glass heat contents
    table_4: measured_reduced author-fitted heat-capacity and heat-content equations; derived from measured tables and cited solid data
    table_5: measured drop-calorimetric heat contents; includes the printed mean and its source inconsistency
    table_6: quoted_attributed heats of vitrification from cited workers, adjusted by the authors as shown
    table_7: measured_reduced fusion estimates and equations; Ferrier's quoted result is a separate quoted_attributed observation
review_status: draft
