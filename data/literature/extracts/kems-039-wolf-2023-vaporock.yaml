source:
  citation: >-
    Wolf, A. S., Jäggi, N., Sossi, P. A. & Bower, D. J. (2023), "VapoRock:
    Thermodynamics of vaporized silicate melts for modeling volcanic outgassing
    and magma ocean atmospheres", The Astrophysical Journal, arXiv:2208.09582v2.
  doi: null
  url: https://arxiv.org/abs/2208.09582
  year: 2023
extraction:
  method: >-
    Born-digital 40-page PDF transcribed with pdftotext -layout. Numeric table
    cells and printed prose retained; unlabelled figure traces were not digitised.
  date: '2026-09-20'
  worker: extract-kems-039-wolf-2023-vaporock
  provenance_path: /Users/simonrowland/Repos/regolith-corpus/raw/kems-039-wolf-2023-vaporock/kems-039-wolf-2023-vaporock.pdf
review_status: draft
evidence_policy:
  classification: mixed_compilation_and_model
  measurement_claim: >-
    This is a computational VapoRock paper, not a new laboratory experiment.
    No measured_direct rows are created. External KEMS values are retained only
    as quoted_attributed or figure_only evidence and keep their primary authors.
  engine_constraint: >-
    VapoRock is one of this project's engines. Every model_derived row names
    VapoRock (or explicitly names MAGMA where the paper reports the comparator);
    model output is engine reference, never validation evidence.
  apparatus_status: >-
    The paper summarizes KEMS work by Hastie et al. and De Maria et al. but does
    not print their sample mass, cell/orifice geometry, pumping, calibration,
    fO2-control apparatus, or run durations. No apparatus record is attached.
  absent_not_zero:
    - primary KEMS apparatus parameters
    - raw numeric pressure points underlying Figures 1 and 2
    - printed uncertainty for the cited silicate-melt KEMS points
