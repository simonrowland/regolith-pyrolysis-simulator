source:
  citation: 'Paul Niggli (1913). The phenomena of equilibria between silica and the alkali carbonates. Journal of
    the American Chemical Society 35(11): 1693–1727.'
  doi: 10.1021/ja02200a004
  year: 1913
  corpus_asset: raw/niggli-1913-silica-alkali-carbonate-equilibria/niggli-1913-silica-alkali-carbonate-equilibria.pdf
review_status: draft
extraction:
  method: MinerU table drafts and pdftotext-layout were reconciled against page renders for all retained numeric cells
    in Tables II, VI, and VIII, the adjacent Mallard table, and the melting-point passages. The reported Table II
    percentage loss is Niggli's calculation from gravimetric CO2 loss; the individual raw weighing inputs are not
    tabulated, so it is attributed to the paper rather than represented as an independently migrated raw measurement.
  date: '2026-10-28'
  worker: w1028naH-niggli13
  scope_note: Table II contains potassium-system measured equilibrium CO2-loss data and auxiliary displaced-moles
    values; Table VI contains the soda-system measured displaced-moles data; Table VIII and the adjacent Mallard table
    contain attributed comparison values. Printed melting points are included as transitions, and qualitative
    eutectic descriptions remain context. Table II's printed binary-mixture mole fraction is completed from the stated
    K2CO3 + SiO2 basis for identity mapping; printed composition bases remain separately recorded.
