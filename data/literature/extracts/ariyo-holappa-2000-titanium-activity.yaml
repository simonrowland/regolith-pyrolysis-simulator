    Molten Slags 2000 conference proceedings, paper 039.
  year: 2000
extraction:
  method: Hand-transcribed the born-digital pdftotext tables; no MinerU tables were present. Render-checked the
    full Table 1 rows on PDF pages 12–13 at 600 dpi. Figures 3–4 are recorded with digitisation deferred.
  date: '2026-10-21'
  worker: fam38-1021
review_status: draft
scope_assessment:
  document_type: experimental electromotive-force study of TiO1.67 activities in CaO-SiO2-Ti3O5 slags
  scored_observations: 0
  note: Table 1 has 13 printed activity-coefficient results; retained as context because their derivation needs
    a corpus TABLE_CSV asset (controller, t-1382). The log activity columns have no scalar printed_form field on
    this base and are retained verbatim as context. Figures 3–4 are deferred. SCST10 is retained as printed, although
    excluded from final results by the authors as unreliable.
