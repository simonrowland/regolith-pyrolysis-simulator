      - observation_id: ivanova_2018_model_numeric_and_directional_claims
        type: model_comparison
        experiment: CAI_model_calculations
        locator: {page: 1, published_page: 6070, pdf_page_index: 0, section: 'Introduction; Results and Discussion'}
        units: as printed
        values:
          quantity: model_trends_and_comparisons
          method_class: model_derived
          evidence_class: model_derived
          CAIB_melt_CaO_Al2O3_ratio: {kind: point, point: '1.2', approximate: true}
          48E_like_CaO_Al2O3_ratio: {kind: point, point: '0.7', approximate: true}
          comparator_attribution: "Richter et al. (2007), reference [9], is cited for the CAIB-melt ratio."
          statements:
            - "By comparing both the experimental data and the thermodynamic calculations we discuss the effect of Al2O3 content and the CaO/Al2O3 ratio on the evaporation process."
            - "Similarly to the 5aN-like melt, the compositional trajectory produced by evaporation of CAI 54E–like melt (14.8 wt% MgO, 52.1 wt% Al2O3, 15.8 wt% SiO2, 17.3 wt% CaO, CaO/Al2O3 ~0.3) trends toward the grossite stability field."
            - "Evaporation of four hypothetical melts with CaO/Al2O3 ~0.3 but different MgO/SiO2 ratios (0.3; 0,5; 1.0; 1.3) also eventually results in compositions in the fields of hibonite- and grossite-bearing CAIs of CH-CB types."
            - "On the other hand, the calculated evaporation trajectory of the hibonite-melilite-rich CAI 48E-like melt with closer to solar CaO/Al2O3 ratio (5.6 wt% MgO, 43.9 wt% Al2O3, 20.6 wt% SiO2, 29.9 wt% CaO, CaO/Al2O3 ~0.7) moves away from the compositions of refractory hibonite-rich CAIs from CH-CB chondrites."
            - "The latter trend is similar to those obtained for melts with compositions of CAIs from CV3 chondrites [2, 3]."
            - "The fact that evaporation of 5aN-like melt (initial composition within the anorthite stability field) and 54E-like melt (initial composition within the melilite stability field, close to the melilite-grossite boundary) result in compositions typical for CH-CB hibonite- and grossite-bearing CAIs are probably due to their initial high Al2O3 contents and low CaO/Al2O3 ratio of ~0.3."
            - "As the CaO/Al2O3 ratio in starting materials increases (to ~0.7 in 48E-or to ~1.2 in CAIB-melts [9] the evaporation trajectories trend away from the field of refractory CAIs of CH-CBs)."
            - "We cannot also exclude possible effects of acidity-basicity factor of the melt [10] or melt structure during evaporation."
            - "The lack of enrichments in heavy Si and Mg isotopes in CH-CB CAIs [11] might be related to relatively high pressures during evaporation [9]."
      - observation_id: ivanova_2018_prior_activities_model_comparison
        type: quoted_comparison
        locator: {page: 1, published_page: 6070, pdf_page_index: 0, section: Introduction}
        units: qualitative; as printed
        values:
          quantity: prior_CAImodel_and_experiment_comparison
          method_class: quoted_attributed
          evidence_class: quoted_attributed
          attribution: "Ivanova et al. (2017), reference [2]; Ivanova et al. (2018), reference [3]"
          statement: "We recently presented results on thermodynamic modeling of evaporation of CAIs with different compositions from CV3 chondrites [2]. The modeling, confirmed by experiments [3], showed that evaporation of a spinel-rich and calcium-poor CAI composition melt (5aN) results in a compositional trend that well fits the compositions of refractory hibonite-rich CAIs from CH-CB chondrites [2, 3]."
      - observation_id: ivanova_2018_intro_numeric_context
        type: characterization
        locator: {page: 1, published_page: 6070, pdf_page_index: 0, section: Introduction}
        units: as printed
        values:
          quantity: contextual_numeric_claims
          method_class: quoted_attributed
          evidence_class: quoted_attributed
          attribution: "MacPherson (2014), reference [1]"
          54E_CaO_Al2O3_ratio: {kind: point, point: '0.3', approximate: true}
          statements:
            - "CAIs record the cumulative effects of high-temperature volatility-controlled processes during the first several million years of solar system history [1]."
            - "54E (fine-grained; CaO/Al2O3 ~0.3) and 48E (texturally similar to Compact Type As; CaO/Al2O3 ~solar)"
