            state: {tag: not_applicable, reason: not_applicable}
            note: "No vapor-pressure or ion-current measurement is reported for this vacuum-furnace residue experiment."
          statements:
            - "Most of the 5aN evaporation residues consist of intergrowths of quench textured ‘Christmas tree’-like spinel and glass."
            - "As evaporation proceeds the residues become enriched in CaO and Al2O3 due to loss of Mg and Si, resulting in formation of non-stoichiometric spinel, which has been reported in natural CAIs [5–7] and in experiments [8] when CAI-like melt was exposed to a reducing gas and lost significant amounts of Mg from the near-surface areas of partially molten droplets by evaporation."
            - "The experiments showed that the most evaporated samples, which lost all their Mg and Si, are mostly composed of hibonite and CaAl2O4 with minor CaAl4O7."
