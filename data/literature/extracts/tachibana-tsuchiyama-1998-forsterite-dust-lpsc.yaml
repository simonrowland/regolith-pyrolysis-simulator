species:
  forsterite:
    observations:
    - observation_id: tachibana_1998_forsterite_hkl_flux_equation
      type: rate_series
      class: model
      locator:
        page: 1
        equation: '1'
        section: Evaporation rates
      quote: jFo = alpha(peSiO-pSiO)/(2 pi mSiO k T)^(1/2)
      phase: forsterite_dust
      regime: free_or_buffered_evaporation_model
      units: mol cm^-2 s^-1
      values:
        quantity: evaporation_rate
        method_class: model_derived
        generator: Hertz-Knudsen equation coupled to forsterite stoichiometry and equilibrium vapor pressures
        gas_species: SiO(g)
        evaporation_coefficient_symbol: alpha
        variables:
          peSiO: equilibrium SiO(g) vapor pressure over forsterite at T
          pSiO: SiO(g) partial pressure in the solar nebula
          mSiO: SiO(g) molecular mass
          k: Boltzmann constant
        note: The equation is printed as the model definition; no numeric flux value is printed in the prose.
    - observation_id: tachibana_1998_forsterite_hbd_alpha_assumption
      type: alpha
      class: model
      locator:
        page: 1
        section: Evaporation rates
        paragraph: In the HBD regime
      quote: We assumed here that alpha is approximately 0.1 in the HBD regimes too.
      phase: forsterite_dust
      regime: H2O_H2_buffer_dominated
      units: dimensionless
      values:
        quantity: evaporation_coefficient_alpha
        method_class: author_estimate
        generator: author assumption used by the Hertz-Knudsen evaporation model
        alpha: 0.1
        qualifier: approximate
        note: Assumed model input, not a measured evaporation coefficient.
    - observation_id: tachibana_1998_forsterite_prior_experiment_alpha_constraint
      type: alpha
      class: quoted_attributed
      locator:
        page: 1
        section: Evaporation rates
        paragraph: In the FED and HRD regimes
      quote: alpha approximately 0.1 irrespective of T; alpha = 0.03-0.2 at T = 1200-1800 degrees C and pH2 <= 8.6 x 10^-5 bar.
      phase: forsterite_dust
      regime: free_evaporation_dominated_or_hydrogen_reaction_dominated
      units: dimensionless
      values:
        quantity: evaporation_coefficient_alpha
        method_class: quoted_attributed
        attribution: experimental studies [1-4] as summarized by the authors; source-specific provenance is not resolved in this abstract
        alpha_range:
        - 0.03
        - 0.2
        alpha_nominal: 0.1
        temperature_range_C:
        - 1200
        - 1800
        pH2_upper_bound_bar: '8.6 x 10^-5'
        qualifier: approximately; range and bound retained as printed
        note: This is a reported constraint from cited experiments, not a direct measurement performed in this abstract.
    - observation_id: tachibana_1998_forsterite_gas_chemistry_species_model
      type: gas_speciation
      class: model
      locator:
        page: 1
        section: Evaporation rates
        paragraph: Eighteen gas species
      quote: Eighteen gas species for H, Mg, Si, and O, He(g) and CO(g) were considered to calculate peSiO.
      phase: forsterite_dust
      regime: thermochemical_gas_equilibrium
      units: count and species labels as printed
      values:
        quantity: equilibrium_vapor_composition
        method_class: model_derived
        generator: gas chemistry calculation using Chase et al. (1985) JANAF Thermochemical Tables, 3rd Ed.
        modeled_species_count: 18
        explicitly_named_species_groups:
        - H
        - Mg
        - Si
        - O
        - He(g)
        - CO(g)
        note: The abstract does not print the complete 18-species list.
    - observation_id: tachibana_1998_forsterite_fig1_model_grid
      type: rate_series
      class: figure_only
      locator:
        page: 2
        figure: '1'
        caption: Calculated evaporation rate of forsterite, jFo, with alpha=0.1 plotted in the T-ptotal condition
      phase: forsterite_dust
      regime: FED_HRD_HBD_model_grid
      units: mol cm^-2 s^-1; temperature K; total pressure bar
      values:
