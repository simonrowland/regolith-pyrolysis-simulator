    - observation_id: dohmen_1998_text_kems_gas_detection
      type: measured_numeric_context
      locator:
        page: 5
        pdf_page_index: 4
        published_page: 974
        section: Results, Gas phase composition
      units: as printed
      values:
        quantity_as_printed: gas species detection and identification
        method_class: measured_direct
        detectable_temperature_as_printed: about 1100 °C
        magnesium_observation_temperature_range_as_printed: 1100–1400 °C
        dominant_gas_species_as_printed: SiO, O2, O, Mg
        magnesium_behavior_as_printed: >-
          The Mg partial pressure increases dramatically when Fe is present,
          whether or not Fe contacts the olivine. The text gives no numeric
          partial-pressure value; Figure 5 is recorded as figure-only.
        sio_identification_as_printed: >-
          At 1400 °C during later annealing, after CO2 was degassed, SiO was
          identified using the 28Si16O, 29Si16O, and 30Si16O isotope signals.
    - observation_id: dohmen_1998_text_fe_rich_olivine_film_thickness
      type: measured_numeric_context
      locator:
        page: 7
        pdf_page_index: 6
        published_page: 976
        section: Single-crystal experiments
      units: μm
      values:
        quantity_as_printed: thickness of newly formed Fe-rich olivine films
        method_class: measured_direct
        maximum_thickness_as_printed: up to 300 μm
        schema_gap: >-
          This is a measured film-thickness bound, not an olivine composition
          or gas pressure. No exact thickness observation type or quantity
          token is available in tools/validate_literature_extracts.py::OBSERVATION_TYPES,
          simulator/battery/migrate.py::TYPE_QUANTITY or
          simulator/battery/migrate.py::QUANTITY_ALIASES. The candidate
          quantity family in simulator/battery/enums.py::Quantity and
          composition basis tokens in simulator/battery/enums.py::PHASE_BASIS_TOKENS
          do not encode film thickness. It remains unscored context rather
          than being mislabeled as a concentration or pressure row.
