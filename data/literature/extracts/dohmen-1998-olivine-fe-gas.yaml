schema_version: literature_extract.v1
source_id: dohmen-1998-olivine-fe-gas
source:
  citation: >-
    Dohmen, R., Chakraborty, S., Palme, H., and Rammensee, W. (1998),
    "Solid-solid reactions mediated by a gas phase: An experimental study of
    reaction progress and the role of surfaces in the system olivine+iron
    metal," American Mineralogist 83, 970-984.
  year: 1998
  doi: 10.2138/am-1998-9-1005
  corpus_asset: raw/dohmen-1998-olivine-fe-gas/dohmen-1998-olivine-fe-gas.pdf
  corpus_sha256: d99c7803f5940fb365c74fe0c13f824d2b5654de42ef6a92e70c279d6aa5e12b
extraction:
  method: >-
    MinerU table draft and markdown plus pdftotext-layout machine text. Table
    1 row and column assignments and its fayalite/forsterite subscripts were
    checked against the physical PDF page 4 render. The figure-only data blocks
    embedded by MinerU were ignored; plotted points were not digitized.
  date: '2026-11-03'
  worker: w1103cw4-dh98
review_status: draft
source_caveats:
- locator:
    page: 6
    pdf_page_index: 5
    published_page: 975
    section: 'Results, Gas phase composition'
  quote: 'O2 pressure at the iron-wustite buffer is approximately 2.0 x 10^-10 bar at 1400 C.'
  note: >-
    This is the printed iron-wustite buffer pressure, not a KMS O2 measurement;
    the paper says O2 was not detected in V892, V914, or V929. It is attached
    only to V929, the named iron+wustite run. Table 1 also lists Fe + wustite
    for V932, but the prose does not name V932 for this absolute buffer value.
    V892 and V914 are stated to be below the buffer value, without a printed
    absolute point.
- locator:
    page: 6
    pdf_page_index: 5
    published_page: 975
    section: Results, Olivine composition
  quote: 'V937 (Fa = 70 mol%)'
  note: >-
    Results prose gives Fa = 70 mol%, while Table 1 gives Fa74Fo26. The two
    printed forms differ; both are retained, and neither is treated as a
    correction or replacement for the other.
- locator:
    page: 4
    pdf_page_index: 3
    published_page: 973
    table: '1'
    row: V937
  quote: 'Molten sample: Fa74Fo26'
  note: >-
    "Molten sample" is the run state at 1400 °C, not the measured phase of the
    after-run assay. The row is also emitted as an observation with phase
    unknown; the paper does not report whether the analyzed material remained
    glass, crystallized partly, or was analyzed in situ. The footnote records
    cooling at 20 °C/min, not a quench.
- locator:
    page: 4
    pdf_page_index: 3
    published_page: 973
    section: Experiments
  quote: >-
    All samples were characterized after the experiments using X-ray diffraction
    (XRD) (mainly to determine the oxidation states of the Fe present) and
    electron microprobe analysis (EMPA).
  note: >-
    This locates the characterization after the run and identifies XRD and
    electron microprobe analysis. The paper does not describe the V937 assay as
    bulk wet chemistry or a defocused-beam average, so its measured phase
    remains unknown.
- locator:
    page: 4
    pdf_page_index: 3
    published_page: 973
    section: Experiments
  quote: >-
    Oriented single crystals of olivines (forsterite, Fo100, or San Carlos
    olivine, Fo92), polished on one side, were used to study the exact mechanism
    of the reaction.
  note: >-
    This page-level statement identifies San Carlos olivine as Fo92. Table 1
    remains transcribed as printed; the later Fo90-92 and run-specific
    statements are preserved separately without choosing a composition.
- locator:
    page: 7
    pdf_page_index: 6
    published_page: 976
    section: Single-crystal experiments
  quote: >-
    The crystals used were either pieces of synthetic forsterite (white in
    color, Fo100) or San Carlos olivine (pale green, Fo90-92).
  note: >-
    This prose gives the San Carlos starting crystal as Fo90-92. Table 1 is
    retained as printed; the differing composition statements are not
    reconciled by this extract.
- locator:
    page: 7
    pdf_page_index: 6
    published_page: 976
    section: Single-crystal experiments
  quote: >-
    In one case (V932), two single crystals of both compositions were placed
    next to, but not touching, each other.
  note: >-
    The prose reports two V932 olivine crystals. Table 1 is preserved verbatim
    and no V932 table position is rewritten from this sentence.
- locator:
    page: 7
    pdf_page_index: 6
    published_page: 976
    figure: '7'
  quote: >-
    BSE of forsterite (a) and San Carlos olivine (both experiment V933) (c)
    with thick film of overgrown Fe-rich olivine; (b) and (d): enlargement of
    fayalite-rich regions in (a) and (c), respectively.
  note: >-
    Figure 7 assigns both crystal images to V933. Table 1's starting-material
    rows remain unchanged; this conflicting run assignment is retained without
    choosing which account is correct.
- locator:
    page: 10
    pdf_page_index: 9
    published_page: 979
  quote: >-
    This is seen clearly in experiment V932 where two single crystals of
    olivine (Fo100 and Fo92) were used simultaneously.
  note: >-
    This Results statement also names Fo100 and Fo92 for V932. It is kept
    separately from the Table 1 grid and the page-7 description; no account is
    selected over the others.
- locator:
    page: 7
    pdf_page_index: 6
    published_page: 976
    figure: '7'
  quote: >-
    The extreme iron enrichment, leading to the formation of molten olivine
    (dark glass) near the top of the overgrown film is seen clearly in the
    photographs with crossed polarizers.
  note: >-
    Figure 7 identifies the pictured San Carlos olivine crystal as experiment
    V933. This glass description belongs to V933 and does not identify the
    measured phase of the separate V937 product.
- locator:
    page: 8
    pdf_page_index: 7
    published_page: 977
    section: Single-crystal experiments
  quote: >-
    sections from experiment V933 show that the films are made up of olivine
    that is optically continuous with the substrate and grades into a glassy
    region near the top of the layer (Figs. 7e–7h). This glass is seen to
    penetrate and flow through cracks in the film and the substrate. It shows
    that small volumes of fayalitic glass can be quenched even with cooling
    rates as slow as 20 °C/min, as in our experiments.
  note: >-
    These sentences describe glass in V933 films and state that small volumes
    of fayalitic glass can be quenched at the reported slow cooling rate. They
    do not identify the measured phase of V937, whose phase remains unknown.
- locator:
    page: 2
    pdf_page_index: 1
    published_page: 971
    section: 1 atm experiments
  quote: 'at the same conditions, two olivines of different compositions pressed against each other showed diffusion profiles 60 micrometers long after the anneal (Chakraborty 1997)'
  note: This 60 micrometer result is attributed to Chakraborty (1997), not measured in the Dohmen et al. experiment, and is not extracted as a result.
- locator:
    page: 4
    pdf_page_index: 3
    published_page: 973
    table: '1'
  quote: 'Table 1. Details of Knudsen-cell mass spectrometry experiments and experimental products'
  note: >-
    The table contains seven run rows: V892, V893, V914, V929, V932, V933,
    and V937. The existing dohmen-2003-coupled-kinetics extract covers its own
    SC1-SC6 study; none of these seven 1998 run rows are duplicated there.
