species:
  Fe:
    observations:
    - observation_id: dohmen_1998_table1_v892_product
      experiment: dohmen-1998-kems-v892
      type: composition_series
      phase: cr
      units: as printed
      locator: {page: 4, pdf_page_index: 3, published_page: 973, table: '1', row: V892}
      values:
        quantity: olivine_product_endmember_composition_not_equilibrium_phase_composition
        method_class: measured_direct
        T_C: '1400'
        composition_as_published: Fa6Fo94
        schema_gap: >-
          Measured post-run olivine endmember composition is not asserted to be
          an equilibrium phase composition in every Table 1 run. The closed
          candidate Quantity.EQUILIBRIUM_PHASE_COMPOSITION is defined for an
          equilibrium gas or condensed phase, and its phase-row reader requires
          a closed PhaseRole; olivine/cr is not one. composition_series is an
          allowed OBSERVATION_TYPES shape, but TYPE_QUANTITY and QUANTITY_ALIASES
          have no exact non-equilibrium crystalline endmember-composition
          quantity. PHASE_BASIS_TOKENS describes value basis, not the missing
          observation quantity. The park-2021 extract uses this phase-row
          quantity for an explicitly equilibrated metal phase, unlike these
          post-run olivine products. See
          simulator/battery/enums.py::Quantity.EQUILIBRIUM_PHASE_COMPOSITION,
          simulator/battery/enums.py::PhaseRole and
          simulator/battery/enums.py::PHASE_BASIS_TOKENS,
          simulator/battery/migrate.py::_phase_role_token,
          simulator/battery/migrate.py::TYPE_QUANTITY,
          simulator/battery/migrate.py::QUANTITY_ALIASES, and
          tools/validate_literature_extracts.py::OBSERVATION_TYPES.
