extraction:
  method: >-
    MinerU table draft and pdftotext-layout were compared; both fragments of Table 1 were checked against 600-dpi page renders. Its 12 reaction equilibrium constants have no quantity token in the extract schema, so the emitter's refusal-only staging rows were moved to context refusals with their printed reactions, expressions, values, and locators retained. Text observations and deferred figure records were transcribed from the target paper pages only.
  date: '2026-10-18'
  worker: w4b-1018
review_status: draft
notes:
  - >-
    The source bundle contains the end of an unrelated paper on PDF page 1 and the beginning of another paper on PDF page 5; only the target paper on PDF pages 2–4 is extracted.
  - >-
    Table 1 is split between PDF pages 2 and 3. Twelve equilibrium constants are retained as context refusals because the schema has no reaction-equilibrium-constant type; none are relabeled as pressure, activity, or Gibbs energy.
  - >-
    The repeated equilibrium oxygen pressure 2.72×10⁻⁷ atm is cross-referenced to its existing observation, not duplicated.
  - >-
    Figure series are recorded without numeric coordinates, as deferred by the wave ruling. The paper contains no DH_T or DS_T table for formation from oxides and no liquid-phase or asterisk temperature assigned a melting-point subtype.
