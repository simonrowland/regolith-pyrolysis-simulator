source_id: kems-025-markova-1983
source:
  citation: 'Markova, O. M., Yakovlev, O. I., Semenov, G. A. & Belov, A. N. (1983), "Vaporization of Lunar
    Highland Rocks: Experimental Investigation", Lunar and Planetary Science XIV, 460-461. ADS bibcode
    1983LPI....14..460M.'
  doi: null
  url: https://ui.adsabs.harvard.edu/abs/1983LPI....14..460M
  year: 1983
  bibcode: 1983LPI....14..460M
extraction:
  method: >-
    Held ADS JBIG2 scan (raw/kems-025-markova-1983/kems-025-markova-1983.pdf).
    pdftotext -layout is empty (one bibcode token per page) and is not data.
    The unnumbered composition table is transcribed from a 400 dpi pdftoppm
    render of PDF page 2 (published p. 461). Fe(g), Mg(g), and FeO(g) marker
    centers in Figs 1-4 were digitised from that render under the source-specific
    authorization. Each plotted marker is retained once; connecting curves are
    not sampled or fitted. Axis coordinates are calibrated from the printed
    ticks, with log10 pressure declared, and every point records pixel position,
    sample composition, and locator. Temperature conversion is T_K = T_C +
    273.15; pressure reconstruction is P_Torr = 10^(digitised log10 P_i in
    Torr), followed by the migrator's declared Torr-to-Pa conversion. AlO/Al2O
    not-higher-than-10% remains a printed bound, not a series. Detected species
    without printed numeric values remain measured_not_tabulated. The MgO
    identification remains flagged as printed MgO (?).
  date: '2026-10-01'
  worker: extract-kems-023
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
review_status: draft
