extraction:
  method: Held ADS JBIG2 scan (raw/kems-025-markova-1983/kems-025-markova-1983.pdf). pdftotext -layout
    is empty (one bibcode token per page) and is not data. The unnumbered composition table transcribed
    from a 400 dpi pdftoppm render of PDF page 2 (published p. 461). Where MinerU and the render disagree,
    the render wins. Figs 1-4 (lg P_i, torr vs T deg C) listed figure-only; curves were not digitised.
    AlO/Al2O not-higher-than-10% bound kept as a printed bound, not a series. Detected species without
    printed numbers recorded as measured_not_tabulated. MgO identification flagged as printed MgO (?).
