source:
  citation: "Knight, K. B., Kita, N. T., Mendybaev, R. A., Richter, F. M., Davis, A. M. & Valley, J. W. (2009), Silicon isotopic fractionation of CAI-like vacuum evaporation residues, Geochimica et Cosmochimica Acta 73, 6390–6401."
  doi: 10.1016/j.gca.2009.07.008
  url: https://doi.org/10.1016/j.gca.2009.07.008
  year: 2009
  corpus_asset: raw/knight-2009-cai-silicon-isotope-fractionation/knight-2009-cai-silicon-isotope-fractionation.pdf
extraction:
  method: "Born-digital GCA PDF. Table 1 was transcribed from a 300 dpi landscape render of published p. 6393 (left- and right-hand crops), and every numeric cell was cross-checked against pdftotext -layout. Kinetic isotope fractionation factors α29Si and α30Si (combined and per-temperature) were transcribed from a 350 dpi crop of the closing paragraph on published p. 6395 continuing onto p. 6396. Oxide weight percents in Table 1 were originally reported in Richter et al. (2007a) and are stored here as reprinted in this table, with that attribution. δ25Mg in Table 1 is footnote-d attributed to Richter et al. (2007) and is stored only as a reprint, not as a new measurement. Figures 1–9 were not digitized. The extrapolated α25Mg = 0.9908 ± 0.0006 at the Type B CAI liquidus (Fig. 8 discussion, from Richter et al. 2007a data) is not stored as a Knight measurement. Forsterite and CI-melt αSi values from Davis et al. (1990) and Wang et al. (2001) are cited comparisons and are not stored as this paper's measurements. The ideal inverse-square-root mass values are model comparisons, not measurements."
  date: '2026-11-12'
  worker: w1112emp-kn09
  provenance_path: raw/knight-2009-cai-silicon-isotope-fractionation/knight-2009-cai-silicon-isotope-fractionation.pdf
