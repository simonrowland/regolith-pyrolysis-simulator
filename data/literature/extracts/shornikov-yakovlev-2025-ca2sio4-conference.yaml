  notes:
    - >-
      This conference source prints the experimental interval as 1762–2269 K. The journal abstract is reported elsewhere
      as 1762–2267 K, and an old queue citation as 2288 K; only 1762–2269 K is transcribed from this file.
    - >-
      Figure 2's caption says inverse temperature, but its plotted abscissa is T (K), confirmed on the rendered page.
      Figure-only pressure and mixing-energy values were not digitized.
    - >-
      No numerical component activities or printed standard-state definition occur in this conference text. No reference
      frame is assigned to the mixing quantities.
    - >-
      The text calls the reported mixing enthalpy and entropy calculated; they are KEMS-derived results, not calorimetry.
