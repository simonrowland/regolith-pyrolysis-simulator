  field: points[T_C=1960].mass_loss_pct
  old: 36.05
  new: 86.05
  page: 510
  table: '2'
  quote: Table 2 left panel, T=1960 row, M% column. MinerU HTML read 36.05. Mass loss is monotonic in
    every other VI row (65.21 at 1883 C, 89.25 at 2038 C), so 36.05 is impossible. The 400 dpi glyph is
    a damaged 8/3; 86.05 sits between 65.21 and 89.25.
