schema_version: literature_extract.v1
source_id: kems-026-markova-1984
source:
  citation: Markova, O.M., Yakovlev, O.I., Belov, A.N. & Semenov, G.A. (1984), "The role of the vaporization
    process in the impact-accretion history of the Moon", Lunar and Planetary Science XV, 509–510
  doi: null
  url: https://ui.adsabs.harvard.edu/abs/1984LPSC...15..509M
  year: 1984
extraction:
  method: Corpus PDF is a 2009 Acrobat Paper Capture scan of the LPI/ADS LPSC XV abstract (2 letter pages,
    published pp. 509–510). pdftotext -layout and MinerU are noisy OCR layers and were not used as data.
    Tables 1–2 transcribed from a 400 dpi pdftoppm PNG of PDF page 2; page-1 method numbers transcribed
    from the same-resolution render of PDF page 1. Where MinerU/tesseract and the render disagree, the
    render wins. Fig. 1 (ternary residual-melt tracks) and Fig. 2 (dissipation-level curves) listed figure-only
    and were not digitised. Partial pressures, p(O2), total pressure and melt activities for compositions
    I–IV are referred by the authors to Markova et al. 14th LPS (1983) 460 and are not tabulated here.
    Dissipation percentages in the Discussion are model_derived (calculated from this-work vapor forms
    plus an escape-velocity model), kept distinct from the tabulated residual-melt compositions. Damaged
    typewriter 8/3/4/6 glyphs on Table 2 were resolved only when an independent printed-page constraint
    (monotonic mass-loss or T, or Table 1 recast of sample VI) selects one reading; each such change is
    a corrections entry. Unreadable Table 1 cells are omitted, not guessed.
  date: '2026-09-12'
  worker: extract-kems-026
  provenance_path: docs-private/reviews/2026-09-12-kems-extracts/
review_status: draft
