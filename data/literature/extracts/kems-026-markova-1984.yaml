    other V row (1544 then 1719). The 400 dpi glyph is a damaged 6/5; 1640 C is the reading consistent
    with increasing T.
- observation_id: markova_1984_table2_residual_melt_V_alumina_basalt
  field: points[T_C=1719].MgO
  old: 3.11
  new: 8.11
  page: 510
  table: '2'
  quote: Table 2 right panel, T=1719 row, MgO column. MinerU HTML read 3.11. The 400 dpi glyph is a damaged
