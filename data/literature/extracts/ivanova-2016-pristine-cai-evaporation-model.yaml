      - observation_id: ivanova_2016_background_history_attributed
        type: characterization
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Introduction}
        units: as printed
        values:
          method_class: quoted_attributed
          attribution: "MacPherson (2014), reference [1]"
          statements:
            - "The bulk compositions of most calcium-aluminum inclusions (CAIs) record the cumulative effects of multiple high-temperature and largely volatility-controlled processes during the first 1–2 million years of solar system history [1]."
      - observation_id: ivanova_2016_background_3n_attributed
        type: characterization
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Introduction}
        units: as printed
        values:
          method_class: quoted_attributed
          attribution: "Ivanova et al. (2012) and Ivanova et al. (2015), references [2, 3]"
          statements:
            - "CAI 3N from the Northwest Africa (NWA) 3118 CV3 carbonaceous chondrite is a unique ~2 cm-sized compound object, primarily a forsterite-bearing type B (FoB) CAI, that encloses at least 26 smaller CAIs of different types, including compact type A (CTA), B, C, and an ultra-refractory inclusion [2, 3]."
      - observation_id: ivanova_2016_background_numeric_context
        type: characterization
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Introduction}
        units: as printed
        values:
          method_class: quoted_unattributed
          statements:
            - "3N originated either as an aggregate of many smaller CAIs (mostly types A, B, C) plus accreted Fo-bearing material (resembling an amoeboid olivine aggregate) which experienced partial melting of the whole; or else as a FoB melt droplet that collided with and trapped many smaller solid CAIs."
            - "Relative to typical type A and B CAIs found elsewhere, the bulk compositions of the A and B CAIs within 3N more closely match the bulk compositions predicted by equilibrium condensation of a gas of solar composition."
            - "Being trapped within the FoB host-CAI may have protected them from melt evaporation that affected most ‘standalone’ CAIs."
            - "Therefore the unique 3N CAI contains possibly the most pristine types of refractory material, and their bulk compositions are very important for the investigation of CAI vaporization processes."
      - observation_id: ivanova_2016_page1_model_qualifications
        type: model_comparison
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Results}
        units: as printed
        values:
          method_class: model_derived
          claims:
            - "During CAI melt evaporation, FeO, MgO, and SiO2 evaporate rapidly from the melt in this sequence."
            - "The most refractory Al2O3 content in the residual molten material increases."
            - "CaO also evaporates rapidly, unless TiO2 is present in which case CaO is retained due to its affinity with TiO2 (perovskite compositional affinity)."
            - "Despite variations in the CAIs’ initial melt compositions (Table. 1), there is a certain general similarity in the change of the ratio of the most refractory components (CaO and Al2O3) in the residual melts during evaporation."
            - "Oxygen content in the gas also depends on the initial ratios of the Al2O3 and TiO2 contents in the melt, Al/Ti ratios: 3N-20 (8.3), 3N-Host (12.3), 3N-1 (17.3), 3N-12 (18.4), 3N-6 (19.7), 3N-7 (23.0)."
            - "The observed differences in the gas phase above the evaporated melts reveal the outsized role of TiO2, which is a minor component in the initial melt."
      - observation_id: ivanova_2016_page1_prior_oxygen_claim
        type: quoted_comparison
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Results}
        units: mol.% as printed
        values:
          method_class: quoted_attributed
          evidence_class: quoted_attributed
          attribution: "Shornikov et al. (2015), reference [6]"
          statement: "The oxygen content in the gas phase above the evaporating melts is significant and increases almost identically for all of the melts from 37 to 55 mol. % [6]."
      - observation_id: ivanova_2016_page1_discussion_model_qualifications
        type: model_comparison
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Discussion}
        units: as printed
        values:
          method_class: model_derived
          claims:
            - "All trends finally lead to CAI compositions corresponding to a Ca-aluminate binary system after FeO, MgO, SiO2 vaporization from the melts."
            - "However, at various points along these trends the CAIs could have different compositions – from known Types A and B, to hibonite-rich inclusions including transitional fields."
            - "If we vaporize the 3N host, 3N-1 and 3N-12, we obtain CAIs of Type B, A, and intermediate compositions between Type A and B."
            - "Vaporization of 3N-6 CAI material leads to the approximate composition of the hibonite-rich CAIs."
            - "It is interesting to note that CAI 3N-6 is more enriched in Al2O3 and depleted in SiO2 compared to other enclosed CAIs from CAI 3N, and a high concentration of Al2O3 affects the final compositional trend."
            - "Vaporizing 3N-7, we obtain hibonite-rich inclusions and unusual CAI compositions that do not match any known types of CAIs."
            - "However, the composition of 3N-7 could not be pristine because Type C CAIs by themselves could be a result of modification of previous material [7]."
      - observation_id: ivanova_2016_page2_model_qualifications
        type: model_comparison
        locator: {page: 2, published_page: 2315, pdf_page_index: 1, section: Discussion, note: The 3N-20 sentence starts at the bottom of PDF page 1 and finishes at the top of PDF page 2.}
        units: as printed
        values:
          method_class: model_derived
          claims:
            - "Vaporization of 3N-20 (Type A) leads to a composition field that is characterized by an above-solar Ca/Al ratio."
            - "This probably depends on the high initial content of CaO and the special role of TiO2 in the evaporation process."
      - observation_id: ivanova_2016_figure1_caption_and_contents
        type: figure_only
        locator: {page: 2, published_page: 2315, pdf_page_index: 1, figure: '1'}
        units: figure-only
        values:
          method_class: figure_only
          statement: "Trends for bulk compositions of the CAIs crystallized from residual melts after evaporation (for CAIs: 3N-host, 3N-1, 3N-6, 3N-7, 3N-12, 3N-20)."
          projection_basis_as_printed: "Spinel Projection Wt. %"
          treatment: Curves inspected and not digitized.
      - observation_id: ivanova_2016_initial_cai_classifications
        type: characterization
        locator: {page: 1, published_page: 2315, pdf_page_index: 0, section: Results, note: Sentence spans bottom left and top right columns.}
        units: as printed
        values:
          method_class: quoted_unattributed
          statement: "In texture and mineralogy the host CAI 3N corresponds to Fo-bearing Type B; the CAIs 3N-1, 3N-6 and 3N-12 belong to Type B; and CAI 3N-20 is Type A."
