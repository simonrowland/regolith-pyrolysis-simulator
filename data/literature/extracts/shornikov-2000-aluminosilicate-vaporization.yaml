          method_class: model_derived
          relation_as_printed: "m_t(j)=m_0(j) multiplied by the time integral of I_j(i)+ from 0 to t divided by the integral from 0 to t_0"
          definition_as_printed: "t_0 is the time of complete vaporization of component j from an Al2O3-SiO2 melt"
