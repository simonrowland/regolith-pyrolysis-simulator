      - observation_id: shornikov_2000_published_directional_claims_page679
        type: thermodynamic_example
        locator: {published_page: 679, pdf_page_index: 2, section: Results and Discussion}
        units: as printed
        values:
          quantity: vaporization_and_composition_qualifiers
          method_class: quoted_unattributed
          statements_as_printed:
            - "It follows that vaporization of aluminosilicate melts largely follows the heterogeneous reactions characteristic of vaporization of pure oxides constituting the Al2O3-SiO2 system."
            - "As follows from the mass spectrum of vapor over Al2O3-SiO2 melts given above and the mass spectrum of vapor over mullite [8, 15, 16], an increase in temperature decreases the amount of polyatomic molecules corresponding to the (AlO)+, (Al2O)+, (AlO2)+, (Al2O2)+, (SiO2)+, and (AlSiO)+ ions in the gas phase over Al2O3-SiO2 melts in comparison with the simpler molecular species corresponding to the (SiO)+ and (Al)+ molecular ions."
            - "Note that the polyatomic molecules mentioned above such as (AlO), (Al2O), (AlO2), and (Al2O2) detected in the gas phase over aluminosilicate melts and over dialuminum trioxide [5, 8, 13-16] are formed as a result of vaporization of Al2O3 present in the Al2O3-SiO2 system rather than in reduction reactions between melts and the effusion cell material, as was erroneously stated in [20]."
            - "According to [21, 22], the compositions of the condensed phase and the gas phase over it are different."
            - "Vaporization of Al2O3-SiO2 melts causes substantial changes in the concentration ratio between the components in the condensed phase."
            - "This makes it possible to obtain virtually the whole set of ion currents from the initial to the final composition, which corresponds to the component with the higher melting point, under given temperature conditions."
            - "Such changes in the intensities of ion currents corresponding to molecular forms in the vapor phase over melts are evidence of a rapid increase in the concentration of aluminum oxide x(Al2O3) in the condensed phase during vaporization (Fig. 3)."
            - "The ratio between the (SiO)+ and (Al)+ ion current intensities remained constant starting with a 73.67 ± 0.15 mol% Al2O3 concentration."
            - "The observed changes in x(Al2O3) were determined from the ratio between the masses of condensed phase components calculated from a decrease in mass mt(j) of the jth component during time t by the equation (1)."
            - "This means that, during vaporization of an Al2O3-SiO2 melt, the ratio between the concentrations of the oxides constituting this melt changed to that corresponding to a liquidus line point."
            - "These experiments enabled us to determine the positions of liquidus points by selecting different temperature conditions of measurements. Some of these points are shown in Fig. 4."
