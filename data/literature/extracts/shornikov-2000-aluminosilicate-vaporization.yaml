            - "If silicon dioxide volatilized from the surface, samples contained well-defined layers of Al2O3 grains."
            - "The chemical analysis and microscopic examination data show that mullite melts congruently in vacuum at 2183 K."
      - observation_id: shornikov_2000_melting_disagreement_qualifiers_page680
        type: thermodynamic_example
        locator: {published_page: 680, pdf_page_index: 3, section: Results and Discussion, note: 'The final comparison continues onto page 681'}
        units: as printed
        values:
