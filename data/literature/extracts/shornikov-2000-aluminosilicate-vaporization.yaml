            incongruent_melting_composition_discrepancy_wt_percent: 23
            incongruent_melting_temperature_discrepancy_K: 60
            pure_oxide_temperature_measurement_error_upper_bound_K: 20
          statements_as_printed:
            - "A detailed analysis of the data on nonvariant points in the Al2O3-SiO2 system shows that melting of mullite is considered congruent in some works and incongruent in others (table)."
            - "Data on the concentrations and temperatures corresponding to the nonvariant points of the Al2O3-SiO2 system for the M + S + L, M + L, and M + A + L phases (A = Al2O3, S = SiO2, M = mullite, and L = liquid) are discrepant."
            - "According to the table, these discrepancies equal 7.5 wt % and 100 K in the works in which mullite is assumed to melt congruently and 23 wt % and 60 K in the works claiming incongruent melting of mullite."
            - "These deviations far exceed the deviations obtained in the same works for the temperatures of fusion of pure Al2O3 and SiO2 oxides, which coincide within the errors of measurements not exceeding 20 K and correspond to the generally accepted values [22, 39] (table)."
            - "We believe that the difference in opinions concerning the character and temperature of fusion of mullite (table) is to a great degree determined by different conditions of measurements, first and foremost temperature conditions (heating and cooling rates) and the composition of the gas phase, and also other factors influencing melting of this compound [12, 23, 46-50]."
            - "The dual character of melting of mullite gives grounds to believe that mullite melts incongruently under equilibrium conditions and congruently under metastable conditions [26, 29, 41, 51, 52]."
            - "However, according to Galakhov [53], a detailed consideration of these works (in particular, [26]) does not allow an equilibrium phase diagram to be constructed with incongruent melting of mullite."
            - "The point of view expressed in [26, 29, 41, 51, 52] is opposite to that [23, 42, 54-57], where the conclusion is drawn that the stable variant of the Al2O3-SiO2 phase diagram is characterized by congruent melting of mullite, whereas the metastable variant includes incongruent mullite melting."
      - observation_id: shornikov_2000_impurity_drift_and_heating_qualifiers_page681
        type: thermodynamic_example
        locator: {published_page: 681, pdf_page_index: 4, section: Results and Discussion, note: 'The phase-characterization sentence continues on p. 682; the final polymorph sentence is printed on p. 682.'}
        units: as printed
        values:
          quantity: factors_qualifying_mullite_melting_interpretation
          method_class: quoted_unattributed
          statements_as_printed:
            - "The question of the reliability of determining the phase relations in the region of mullite melting is complicated by insignificance of the temperature difference between the melting point and the eutectic horizontal and by closeness of the eutectic point to the stoichiometric composition of mullite."
            - "According to [50], the character of mullite melting is intermediate between congruent and incongruent."
            - "As a consequence, we come across opposite views on the matter in works of the same authors, for instance, melting of mullite is claimed to be incongruent in [24] and congruent in [38]."
            - "The presence of a third component such as manganese oxide [58] in the Al2O3-SiO2 system facilitates mullite formation, whereas sodium oxide [43], silicon monoxide [29, 31, 32], and nickel and iron oxides [46] hinder the reaction, which can create the impression that mullite melts incongruently."
            - "Similar conclusions can be drawn when stoichiometric mullite samples are held for a long time in open containers and heated in vacuum, because their initial composition then shifts to the side of aluminum oxide."
            - "This process is difficult to take into account because of different temperature dependences of the integral vaporization coefficients of silicon dioxide and aluminum oxide."
            - "Note that when mullite is heated at a high rate in a microfurnace, samples can be overheated, which favors the congruent interpretation [50]."
            - "Special attention should be given to the determination of the phase composition of Al2O3-SiO2 samples, because X-ray diffractograms or microscopic examination of separate probe regions may give a distorted idea of equilibrium phase relations [11, 65-67]."
            - "The effects of aluminum oxide polymorphs on the attainment of equilibria in the Al2O3-SiO2 system should also be taken into account [68-70]."
      - observation_id: shornikov_2000_conclusion_page682
        type: thermodynamic_example
        locator: {published_page: 682, pdf_page_index: 5, section: Conclusion}
        units: as printed
        values:
          quantity: author_conclusion
          method_class: quoted_unattributed
          statements_as_printed:
            - "The data of one of the earliest works [40] concerned with the phase diagram of the Al2O3-SiO2 system appear to be fairly approximate."
            - "It follows from the table that the data obtained in this work provide unambiguous evidence of the existence of a eutectic composition in the M + A + L region and are in agreement with the results of [11, 12, 37, 38, 42]."
            - "This proves the congruent character of mullite melting observed in the same works in the temperature range 2123-2207 K."
            - "The conclusion that mullite melts incongruently [24-26, 28, 30, 35, 41, 43, 44] cannot be considered convincing for the reasons given above; this conclusion is influenced by such factors as experimental procedure, the presence of impurities, and changes in the initial concentration of samples during measurements."
            - "Our data do not confirm the occurrence of a peritectic compound in the concentration range 37-66 mol % Al2O3 [24-27, 44]."
            - "The calculations of this peritectic composition performed in [45] are based on the thermodynamic data obtained in mass spectrometric experiments with the use of the Knudsen effusion method for the Al6Si2O13-Al2O3 and CaAlSi2O8-Al6Si2O13-Al2O3 equilibria in the temperature range 1472-1761 K; these temperatures are too low for obtaining reliable data."
            - "In our view, the results of [45] cannot be considered sufficiently correct and require a detailed examination."
            - "The reliability of the results of this work is substantiated by thermodynamic data, which unambiguously favor the congruent character of mullite melting."
            - "It should be noted that the point of view expressed and substantiated by Toropov and Galakhov in [11, 23, 47, 65-67] is often (for instance, in [25, 52, 71-73]) unjustly ignored in considering the properties of the Al2O3-SiO2 system."
            - "To summarize, we performed a mass spectrometric study with the use of the Knudsen effusion method of vaporization of Al2O3-SiO2 melts. The mass spectrometric data and the results obtained in studying the phase diagram of the Al2O3-SiO2 system in the mullite region by the method of quenching allowed us to refine the position of the liquidus line in this system and prove the congruent character of mullite melting at 2180 K."
            - "Mainly, our data are in agreement with the phase diagram of the Al2O3-SiO2 system constructed by Toropov and Galakhov and provide a basis for thermodynamic calculations of the properties of this system."
