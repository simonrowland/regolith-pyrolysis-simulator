      values:
        statements:
        - statement_as_printed: For both reactions, we have used solid oxides as reference states.
          locator:
            page: 6
            published_page: 308
            pdf_page_index: 5
            equation: '2'
            note: Reference-state prose immediately following equations (1) and (2)
        - statement_as_printed: Fe0.947O was chosen as a standard state rather than estimated values for stoichiometric
            FeO because the latter yield ferrous iron activities in the melt which exceed unity (see e.g.,
            DOYLE, 1988).
          locator:
            page: 6
            published_page: 308
            pdf_page_index: 5
            equation: '2'
            note: Explicit Fe0.947O versus stoichiometric FeO standard-state choice
        - statement_as_printed: All activities are relative to a solid standard state at temperature.
          locator:
            page: 7
            published_page: 309
            pdf_page_index: 6
            table: '4'
            note: Table 4 caption
        - statement_as_printed: Activity coefficients (γ’s) for NiO, FeO, MgO and Fe2O3 are for the liquid
            phase and that of Lb (= NiSi1/2O2) is for olivine.
          locator:
            page: 7
            published_page: 309
            pdf_page_index: 6
            table: '4'
            note: Table 4 caption
        - statement_as_printed: Relative to the uncertainty in ln a_Fe0.947O, ±20%, the difference between
            ln a_FeO and ln a_Fe0.947O is quite small. Consequently, we have taken ln a_FeO ≈ ln a_Fe0.947O
            in the subsequent calculations.
          locator:
            page: 6
            published_page: 308
            pdf_page_index: 5
            note: Footnote on relation between stoichiometric FeO and Fe0.947O activities
        equation_2_as_printed: 0.947Fe_alloy + 1/2 O2 = Fe0.947O_solid
        equation_2_locator:
