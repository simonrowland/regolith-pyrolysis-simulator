  method: Born-digital pdftotext-layout; Tables 1 and 2 transcribed and checked against a 600 dpi PDF render.
  date: '2026-10-20'
  worker: fam30-1020
  source_note: >-
    The article reports XPS elemental compositions and computed thermodynamic values for polymer-derived SiOC. Table 1 is XPS
    composition of whole ceramic samples, not a single phase or a mass-loss result, so it is retained as context. Table 2 and its
    Gibbs-minimization outputs are model-derived context. The paper gives no quantitative mass-loss or evolved-gas yields; its
    CO/CO2 statement is qualitative and linked to proposed reactions. The ramp was 2 °C/min under Ar with 300 mL/min gas flow.
