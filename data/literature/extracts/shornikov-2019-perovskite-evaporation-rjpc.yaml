extraction:
  method: >-
    MinerU tables and pdftotext-layout were compared; mapped numeric cells were emitted and checked against the page renders. Table 2 and Table 5 are shared with the TMS chapter extract and are cross-referenced. Table 3 was transcribed as one measured and five quoted-attributed partial-pressure series because its equations have mixed evidence classes. Table 4 fit refusals, unique cited context, and deferred figure records remain in species context containers.
  date: '2026-10-18'
  worker: w4b-1018
review_status: draft
notes:
  - >-
    Table 2 has 76 numeric pressure cells and matches the existing TMS chapter series point for point: Ca 13, CaO 10, Ti 8, TiO 13, TiO2 13, O2 11, and CaTiO3 8. The seven existing observation IDs are cross-referenced below; no duplicate scored observations are stored.
  - >-
    Table 5 matches all ten existing TMS thermochemistry context rows. Its three negative values retain their negative signs in the RJPC and TMS renders; differing OCR dash glyphs are not value differences. Existing IDs are cross-referenced below.
  - >-
    Table 3 is unique to RJPC: the 13 equation (22), (23) pressures are the measured_tabulated Hertz–Knudsen series; equations (24)–(28) are quoted_attributed because their thermochemical K values from [9] are not printed. The five series omit dash cells and retain the printed minus glyph.
  - >-
    The relative ion-current ratio at 2182 K differs between the publications. Both readings and locators are preserved in the CaTiO3 context and flagged for controller decision; the existing TMS extract is unchanged.
  - >-
    Table 4 prints a function fit and coefficients but the extract schema has no token for this coefficient form. Eight fit records are typed refusals with their printed coefficients retained in context; no pressures are reconstructed.
