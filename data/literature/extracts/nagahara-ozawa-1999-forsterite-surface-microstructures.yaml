          sample_dimensions_mm: about 4 x 3 x 1 mm rectangular parallelepiped, cut parallel to (100), (010), and (001)
          quench: heater shut down; cooled from experimental temperature to 1000 C in 1-2 minutes
          measurements: pre-experiment micrometer size; before/after high-precision balance weight; post-experiment SEM; EPMA surface/interior composition for SC olivine
