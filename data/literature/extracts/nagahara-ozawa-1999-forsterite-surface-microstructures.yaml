        table_notes:
        - Jc is evaporation rate from the (001) surface.
        - Forsterite Jc at 1400 C is extrapolated from experiments above 1500 C.
        - Olivine Jc at 1400 C is extrapolated from Fo92 to pure forsterite.
        - Pit density was measured on samples evaporated at 1500 C for forsterite and 1400 C for SC olivine.
        - SC olivine evaporation rate was obtained with a diffusion-controlled model and contains considerable uncertainty.
        - SC olivine rate rows are model-derived and must not be admitted as direct measured evidence.
