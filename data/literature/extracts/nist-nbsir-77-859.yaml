source:
  citation: >-
    Roder, H.M. (1977), "The Thermodynamic Properties of Slush Hydrogen and
    Oxygen", NBSIR 77-859, National Bureau of Standards Cryogenics Division,
    Boulder, CO; Final Report prepared for NASA-Johnson Space Center,
    November 1977.
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nbsir77-859.pdf
  year: 1977
extraction:
  method: >-
    Corpus PDF ferry-inbox/from-main-B4-20260923T031628Z/new-pdfs/nist-nbsir-77-859.pdf
    (private; not committed). Digitized 45-page NBSIR. pdftotext -layout;
    SHA-256 matches sidecar
    e209245db0109d8a42327a58baa33007ff718da4a0e70f4b092d9c9389bdd065.
    PDF p1/p3 title/author match sidecar citation. Landed only clearly printed
    thermodynamic fixed points and heats of fusion at the triple point that the
    author selects as reference values for the slush computer programs. Full
    melting-line / solid-vapor pressure fit coefficients, solid-density
    polynomials, and Appendix A/B FORTRAN listings are not re-homed (program
    code / fit surfaces, not new lab measurements). Kelvin/atm values kept as
    printed; Pa companions carry DERIVED stamps (1 atm = 101325 Pa).
  date: '2026-09-22'
  worker: n11-nist-ntrs
  provenance_path: data/literature/extracts/nist-nbsir-77-859.yaml
review_status: draft
corrections: []
scope_assessment:
  document_type: NBSIR compilation + computer programs for slush H2/O2 thermodynamic properties
  measured_direct_observations: 0
  method_observations: 1
  figure_only_observations: 0
  absent_from_source:
  - author-new calorimetric heat-of-fusion series (H2 ΔHfus from Dwyer et al. 1965b; O2 from Giauque & Johnston 1929)
  - digitised Appendix A/B program listings as observations
  - full solid-vapor / melting-line tabulated property grids (returned by the programs, not printed as measurement tables here)
  note: >-
    Author states properties are calculated from literature values or
    extrapolations based on other simple fluids; programs extend prior EOS
    (Roder & McCarty 1975 H2; Weber 1977 O2). Scored rows are the printed
    reference fixed points / selected ΔHfus the author adopts — evidence_class
    secondary_compilation / author_selected_literature, not this report's lab
    campaign.
