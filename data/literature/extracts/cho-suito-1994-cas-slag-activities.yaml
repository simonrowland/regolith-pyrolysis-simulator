      - observation_id: cho_suito_1994_method_equations
        type: thermodynamic_example
        locator: {page: 3, published_page: 179, section: '3.1 Estimation from Nitride Capacity and Nitrogen Distribution Ratio', equation: '6-9'}
        units: as printed
        values: {quantity: activity_calculation_method, method_class: quoted_attributed, evidence_class: quoted_attributed, equations: 'Si + O2 = SiO2(s); ΔG°6 = −816200 + 216.0T J/mol (refs. 9,10). 1/2 N2 = N; ΔG°7 = 3600 + 23.9T J/g-atom (ref. 9). log aSiO2 = 4/3 log(C(N)/LN) + log(K6 · fN^(4/3) · aSi / K7^(4/3)) (Eq. 9).', standard_state: 'solid SiO2(s), polymorph unstated; liquid iron solutes use dilute one mass-percent standard state.', sources: 'G. K. Sigworth and J. F. Elliott, Met. Sci. 8 (1974), 298; J. F. Elliott, M. Gleiser and V. Ramakrishna, Thermochemistry for Steelmaking, vol. 2 (1963).'}
      - observation_id: cho_suito_1994_activity_equations_and_auxiliary_data
        type: thermodynamic_example
        locator: {page: 5, published_page: 181, equation: '10-13; see also pp. 179, equations 6-9'}
        units: as printed
        values:
          quantity: activities_thermodynamic_basis
          method_class: measured_tabulated
          equations: 'Al deoxidation Eq. 1: 2Al + 3O = Al2O3(s). Eq. 10: 3Si + 2Al2O3(s) = 4Al + 3SiO2(s), ΔG°10 = 658300 − 107.2T J/mol (refs. 9,10). Eq. 11: log aAl = 3/4 log aSi + 1/4(2 log aAl2O3 − 3 log aSiO2 + log K10). Ca exchange Eq. 12: 2Ca + SiO2(s) = 2CaO(s) + Si. Eq. 13: log aCa + 1/2 log K12 = 1/2 log aSi + 1/2(2 log aCaO − log aSiO2). Nitride equations and Eq. 9 for aSiO2 are given in the adjacent context. Sulfide route: Eq. 14, 1/2 S2 + O2− = S2− + 1/2 O2; Eq. 16, Al + 3/4 O2 = 1/2 Al2O3(s), ΔG°16 = −776800 + 188.8T J/mol; Eq. 17, 1/2 S2 = S, ΔG°17 = −135100 + 23.4T J/g-atom; Eq. 18 derives CS2− = LS(K17 aAl2O3^(1/3))/(K16^(2/3) fS aAl^(2/3)); Eq. 19 is log aAl2O3 = 3 log(CS2−/LS) + log(K16^2 fS^3 aAl^2/K17^3).'
          standard_states: 'Oxide activities in Table 5 are relative to pure solid oxide standards; SiO2 polymorph not specified. Liquid iron solutes use dilute one mass-percent standard states. No liquid-Si standard state is used.'
          interaction_parameters: 'For Al: eAlS=0.030, eAlSi=0.056, eAlAl=0.045; eOAl=−3.9, eOSi=−0.131, eOS=−0.133; eNAl=−0.028, eNSi=0.047; eSiS=0.056, eSiAl=0.058, eSiSi=0.11; eCaS=−140*, eCaAl=−0.072, eCaSi=−0.097; eSS=−0.028, eSAl=0.035, eSCa=−110*, eSSi=0.063. Ca-O parameters are range-dependent in Table 4. Asterisked entries cite ref. 8. All values at 1873 K.'
          auxiliary_sources: 'Refs. 6, 8, 9, 10, 11, 26; no Ca, Al, Mg or Si activity coefficients in liquid silicon are used because the metal solvent is liquid iron. The text says the effect of Mg on oxygen is neglected in Eq. 2, then notes it should be considered in MgO-bearing slags; no e_O^Mg value is provided.'
