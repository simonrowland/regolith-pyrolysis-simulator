apparatus_not_stated:
  status: true
  reason: This source is a thermochemical-equilibrium calculation; it does not report a laboratory bench or per-run experimental apparatus.
  locator: {pdf_page_index: 7, section: '2. Computational Methods', row: calculation method, column: apparatus}
refused:
  - what: numeric curve coordinates for Figures 1-7, 10 and 11 beyond the conservative Figure 8-9 points
    why: the PDF provides plotted curves and qualitative prose, not tabulated coordinates; promoting visual read-offs to printed values would violate the evidence rule
    locator: {pdf_page_index: 37, figure: '1', row: all, column: curve coordinates}
  - what: fO2 values for all model runs
    why: the source specifies total pressure and bulk composition but does not print oxygen fugacity or oxygen partial pressure; no fO2 was inferred from composition
    locator: {pdf_page_index: 7, section: '2. Computational Methods', row: model conditions, column: fO2}
  - what: sulfide dotted curve and sulfate boundary in Figure 8c
    why: the page labels these aggregate curves as “sulfides” and “sulfates” rather than identifying a canonical species-specific boundary; no coordinates are promoted without that mapping
