  method: Born-digital NASA workshop poster PDF from regolith-corpus raw/wilkerson-2021-jsc1a-tga-ms-poster/wilkerson-2021-jsc1a-tga-ms-poster.pdf.
    Transcribed from 400 dpi pdftoppm PNG renders of all 12 PDF pages. pdftotext-layout and MinerU were
    used only to locate slides, not as data. Conclusions table (pdf page 11) is the only printed numeric
    yield table. TG and MS traces on pdf pages 4, 5, 6 and 8 exist only as plots and were recorded figure-only;
