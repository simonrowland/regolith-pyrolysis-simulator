evidence_policy:
  classification: mixed_primary_measurement_and_author_model
  subject_scope: Liquid-iron Mg deoxidation; not a silicate vaporization experiment, but Mg/O melt-equilibrium measurements and Mg thermodynamic model parameters are retained for the Mg/redox and thermochemistry rails.
  measurement_status: Table 2 contains this-work measured concentrations. Table 1 and the fitted coefficients are not direct measurements.
  model_generator: Authors' Wagner activity formalism with first- and second-order interaction parameters; least-squares/regression treatment of this work's concentration data.
  figure_policy: Figures 1, 3, 4, 5, 6, 7 and 8 were inspected. Plotted scatter/curves were not digitised; only printed labels and captions are retained.
