source_id: shornikov-2005-potassium-germanate
source:
  citation: Shornikov, S. I. (2005), “Vaporization behavior and thermodynamic properties of K2O–GeO2 melts
    studied by mass spectrometry,” Inorganic Materials 41(12), 1345–1356.
  year: 2005
  corpus_asset: raw/shornikov-2005-potassium-germanate/shornikov-2005-potassium-germanate.pdf
extraction:
  method: No MinerU table. Table 1 (published page 1348) and Table 2 (published page 1354) were transcribed
    from the text layer and checked cell by cell on 600 dpi renders. No digit was changed. Fig. 2 panel
    (a) series 4 stars were read from labelled ticks at 600 dpi. Table 2 enthalpies and entropies are stored
    per mol_species. The fusion-entropy unit is stored as J/mol K; the caption prints J/(mol K). Fig. 2 panels
    (c), (d) and (e) series-4 stars that sit clear of the other glyphs were read from labelled ticks. Panel
    (e) stars inside the frame but above the highest labelled tick are in-frame extrapolations, and the
    half-width is the distance past that tick. Panel (b) stars are drawn inside the series-3 squares and
    stay deferred on the corrected log scale. Fig. 5 series-4 open stars each have a centre on the 600 dpi page. Panel (i) stars are read from the labelled ticks and stay context. The endpoint beside the 100 mol percent tick has no stored value, because the two centre estimates differ by about 10 px. The other Fig. 5 panels are not calibrated. Those reads stay context. Delta_fG/(RT) and delta_fS have no
    quantity, and the melt delta_fH is not one oxide partial enthalpy.
  date: '2026-10-20'
  worker: t1372-w2-w8-t1
