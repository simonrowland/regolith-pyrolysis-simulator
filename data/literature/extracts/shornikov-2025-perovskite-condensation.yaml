notes:
- The source bundle contains unrelated papers on PDF pages 1 and 5; only the perovskite article on PDF pages 2–4
  is extracted.
- The article summarizes prior Shornikov KEMS results. Table 1 values and the five prose pressures are quoted_attributed
  to the prior works named in the article; no new experiment is claimed.
- Duplicate-value check against the 2019 TMS chapter, 2019 RJPC extract, 2020 fractionation extract and 2020 CaO–TiO2
  melts extract found no matching species, temperature and printed-pressure tuple for these Table 1 or prose values.
  The 2241 K Table 1 column remains a temperature condition, while the separately stated melting point is recorded once.
- The eight printed xi,2400 / xi,1800 ratios are retained as typed context refusals because they span two temperatures
  and the extract schema has no ratio-across-temperatures token; their source values and both temperatures are retained
  without recomputation.
- Figure 1 panels A and B are records only; plotted curves are not digitized in this wave. Curves have no discrete
  markers in the render.
- Only “under reducing conditions” is specified; numeric oxygen fugacity and total pressure are not reported. No
  melt composition is printed for this stoichiometric perovskite system.
