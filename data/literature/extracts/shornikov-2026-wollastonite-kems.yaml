source:
  citation: Shornikov, S. I. (2026). Mass-Spectrometric Investigation of Evaporation Processes and Thermodynamic
    Properties of Wollastonite. Geochemistry International, 64(8), 608-632.
  doi: 10.1134/S0016702926700035
  year: 2026
  venue: Geochemistry International
  corpus_asset: raw/shornikov-2026-wollastonite-kems/shornikov-2026-wollastonite-kems.pdf
  corpus_sha256: c10b085a4cf7cd76c800914da74ab94ccc0749a5a443f84fbbfcb255001387f6
extraction:
  method: The corpus text directory has pdftotext-layout.txt and no MinerU content list, so mineru_table_draft
    emit was not run. Tables 3, 4 and 5 and Eqs. (14)-(20), (24), (25) and (31)-(34) were read from 600
    dpi renders. Table 3 and Table 4 are rotated on the portrait page; the reading order was checked on
    a rotated render. Dashes are omitted. Table 5 coefficients were refit by unweighted least squares
    of log10(p) = a/T + b against the parent pressures and each printed coefficient falls inside its printed
    width, so those rows are linked. Columns (14)-(19) and Table 6 use Glushko constants that this paper
    does not print, so those rows are not linked. The rankinite mixing enthalpy and entropy are context,
    not scored, because the schema has no mixing quantity. Shared summary constants already in
    shornikov-2024-wollastonite-evaporation are not re-admitted. Fig. 3 series 23 markers outside the
    melting band were read at 600 dpi. Fig. 10 series 1 was read and left unscored.
  date: '2026-10-20'
  worker: t1372-w2-w7-t1
review_status: draft
