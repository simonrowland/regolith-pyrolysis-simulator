    - observation_id: yakovlev_2018_isotope_ratio_figure_claim
      type: located_directional_context
      locator: {page: 60, pdf_page_index: 2, section: Discussion}
      units: isotope-ratio comparison and qualitative trend
      values:
        quantity: magnesium_silicon_isotope_fractionation_efficiency
        method_class: quoted_attributed
        attribution: Data attributed to Mendybaev et al. (2013), as discussed by Yakovlev and Shornikov (2018)
        quote_as_printed: >-
          The Fig. 2 shows the dependence of the δ26Mg / δ30Si ratio on the calcium oxide content in the melt. The cross symbol shows the CaO initial content before evaporation. The data demonstrate more efficient mass fractionation of magnesium isotopes compared to mass fractionation of silicon isotopes as calcium oxide accumulates in the melt.
        numeric_axis_ticks_as_printed: {delta26Mg_over_delta30Si: [1.4, 1.6, 1.8, 2.0], CaO_wt_percent: [0, 5, 10, 15, 20]}
        data_digitized: false
    - observation_id: yakovlev_2018_evaporation_and_isotope_conclusions
      type: located_directional_context
      locator: {page: 60, pdf_page_index: 2, section: Discussion and Conclusion}
      units: qualitative evaporation-rate and isotope-fractionation comparisons
      values:
        quantity: activity_controlled_evaporation_and_isotope_fractionation
        method_class: quoted_unattributed
        quote_as_printed: >-
          Under these conditions, the acid-base factor has a strong influence on the MgO and SiO2 evaporation rates. It leads to the fact that the evaporative weight loss of magnesium are becoming higher relative to the weight loss of silicon.
        second_quote_as_printed: >-
          In turn, the Mg and Si evaporation rates determine the efficiency of isotope fractionation, which increases in the basic acidity of magnesium oxide and decreases in acidic silicon oxide as the melt evaporates.
        third_quote_as_printed: >-
          Thus, the accelerated weight loss of magnesium is determined by its increasing activity in the melt (as a consequence of the increase in the basicity of the melt during evaporation). In turn, it determine its effective mass fractionation of magnesium isotopes in comparison with the mass fractionation of silicon isotopes.
        fourth_quote_as_printed: >-
          The obtained equation shows that at evaporation of multicomponent melt, the component evaporation rate is determined not only by the pure component vapor pressure, but also their concentration in the melt and the activity coefficient, taking into account the nature of the interaction of this component in the melt. The equation clearly shows the dependence of evaporation on the composition of the system.
