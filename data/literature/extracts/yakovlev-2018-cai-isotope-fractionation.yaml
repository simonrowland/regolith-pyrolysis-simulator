    - observation_id: yakovlev_2018_abstract_directional_claims
      type: located_directional_context
      locator: {page: 58, pdf_page_index: 0, section: Abstract}
      units: qualitative volatility, activity, and isotope-fractionation comparisons
      values:
        quantity: abstract_claims_about_cao_enrichment
        method_class: quoted_unattributed
        quote_as_printed: >-
          When CAIs melts evaporate at high temperatures, the SiO2 and MgO volatilities are inverted: SiO2, which is more volatile than MgO, becomes less volatile when melts are enriched in refractory CaO. This volatility inversion can be explained within the framework of the theory of acid–base interaction between components in silicate melts. According to this theory an increase in CaO concentration in the melt increases its basicity, and this, in turn, increases the activity (and hence, also volatility) of MgO and decreases those of SiO2.
        second_quote_as_printed: >-
          This acidity-basicity factor has a strong effect on the rate of magnesium and silicon evaporation that in turn has a strong effect on isotope fractionation which as the melt evaporates increases the efficiency of isotopic fractionation in magnesium compared to silicon isotopes.
    - observation_id: yakovlev_2018_intro_qualifiers_and_scope
      type: located_directional_context
      locator: {page: 58, pdf_page_index: 0, section: Introduction}
      units: qualitative experimental and physical-conditions context
      values:
        quantity: introductory_claims_and_open_conditions
        method_class: quoted_unattributed
        quote_as_printed: >-
          The CAIs have clear features of mass-dependent isotopic fractionation Mg and Si, which, according to experimental data, are formed at high mass losses of evaporating melt.
        second_quote_as_printed: >-
          Most researchers are of the opinion that CAIs formed by condensation of gas of Solar composition at the earliest stage of evolution of the Sun. Some researchers develop an alternative hypothesis according to CAIs are objects formed outside the Solar system.
        third_quote_as_printed: >-
          To date, the CAIs origin and the particularities of their isotopic characteristics with respect to Mg and Si are clear and do not give rise to disputes. However, there are questions, and there are a lot of them, to the physico-chemical conditions of the evaporation process, namely, temperature, melt cooling rate, pressure and composition of the surrounding gas, the composition of the CAIs initial condensate.
        fourth_quote_as_printed: >-
          It is the acid-base melt factor, which, among other factors, determines the evaporation sequence of MgO and SiO2 oxides from CAIs melt, as well as the isotopic composition of magnesium and silicon in the residual melt.
        fourth_quote_locator: {page: 59, pdf_page_index: 1, section: Discussion, note: First left-column paragraph; other three passages remain on p. 58.}
    - observation_id: yakovlev_2018_prior_acid_base_and_oxide_classification
      type: located_directional_context
      locator: {page: 59, pdf_page_index: 1, section: Discussion}
      units: qualitative oxide classification and activity trends
      values:
        quantity: cited_acid_base_interpretation
        method_class: quoted_attributed
        attribution: Korzhinskii (1959) and Yakovlev et al. (2017), as cited by Yakovlev and Shornikov (2018)
        quote_as_printed: >-
          In our paper (Yakovlev et al., 2017) we showed that D. S. Korzhinskii's theory on acid-base interaction of components in silicate melts (Korzhinskii, 1959) explains well the behavior of moderately volatile and different acid-base properties of MgO and SiO2 oxides at evaporation from CAIs melts.
        second_quote_as_printed: >-
          CAIs compositions can be described within the framework of the quadric oxide system CaO–MgO–Al2O3–SiO2. According to the acid-base properties of oxides of these system are divided into acid (SiO2), amphoteric (Al2O3) and basic (CaO and MgO).
    - observation_id: yakovlev_2018_raoult_henry_qualifiers
      type: located_theoretical_context
      locator: {page: 59, pdf_page_index: 1, section: Discussion}
      units: qualitative pressure-dependence statement
      values:
        quantity: pure_oxide_vapor_pressure_and_melt_interaction_factors
        method_class: quoted_unattributed
        quote_as_printed: >-
          The expression of the Raoult-Henry law shows that the volatility or, more correctly, the pressure of the ith oxide over the melt depends on three parameters: 1) the vapor pressure of the pure oxide, that is, its individual properties; 2) the oxide concentration in the multicomponent melt; 3) the interaction nature of this component in the melt.
    - observation_id: yakovlev_2018_discussion_directional_claims
      type: located_directional_context
      locator: {page: 59, pdf_page_index: 1, section: Discussion}
      units: qualitative activity and melt-basicity comparisons
      values:
        quantity: discussion_claims_about_basicity_and_oxide_activities
        method_class: quoted_unattributed
        quote_as_printed: >-
          It was shown that with the increase in the melt basicity, the parameter of which is the activity of oxygen ions, the activity of MgO, which has the base properties in the melt, should increase, and the activity of SiO2, which has the acid properties in the melt, decrease.
        second_quote_as_printed: >-
          Moreover, CaO has more basic properties and, accordingly, greater dissociation degree than MgO, and therefore CaO produces more oxygen ions during dissociation. For this reason, calcium oxide is the main donor of oxygen ions in the melt, and therefore its concentration plays a major role in determining the melt basicity parameter.
        third_quote_as_printed: >-
          It is logical to assume then that the MgO and SiO2 activity depend and mainly determined by the CaO concentration in the melt, and thus, if the higher CaO content in the melt, than the higher the MgO activity values and lower the SiO2 activity values.
        fourth_quote_as_printed: >-
          The dependences presented in the Fig. 1 clearly illustrate the strong and opposite effect of CaO concentration on the MgO and SiO2 activity. It is in full compliance with the Korzhinskii's theory of acid-base interaction of the melt components.
        fifth_quote_as_printed: >-
          As shown above, the MgO and SiO2 activities in melts depends on the CaO concentration, which plays a major role in the formation melt basicity. In accordance with this relationship, in the CAIs evaporating melt at the CaO content increasing, the magnesium oxide activity will increase (and accordingly the MgO volatility will increase too) and, on the contrary, the silicon oxide activity will decrease (and the SiO2 will become less volatile).
