          of differentiation; Fe/Mg ratios of augite are determined by calculation and scatter widely. The dots
          represent the results of calculations that assume a regular increase of Fe/Mg ratio of augite with increased
          amount of differentiation; Fe/Mg ratios of olivine are determined by calculation and scatter widely. Plagioclase
          compositions are obtained by calculation and show slight differences related to assumptions regarding
          composition of mafic phases. Triangles represent selected points on the curves of weight percent mineral
          plotted against weight percent glass calculated from modal data of undifferentiated samples (fig. 16).
          B, Weight percent of olivine, augite, and plagioclase lost as a function of the amount of differentiation
          (refer to mixing equation in caption for fig. 22). Coefficients b (olivine), c (augite), and d (plagioclase)
          are plotted against a (amount of differentiate). Symbols as in A. The calculated amounts of crystallizing
          phases are little affected by assumptions regarding composition of augite and olivine (see above). There
          is a break at about 87 percent glass where both the absolute amount of the rate of crystallization of
          augite and plagioclase increase at the expense of olivine.
