- 'Duplicate check: the corpus PDF title page identifies Wright and Okamura (1977), USGS Professional Paper 1004;
  no DOI is printed. No extract with this title, author-year, or source stem was found in the candidate extracts
  or review branches.'
- Table 17 first three columns are footnoted electron-microprobe analyses by R. T. Helz and explicitly report residual
  glass. The fourth column, A12-1011 (wet chemical), is recalculated from four impure separates after feldspar and
  apatite correction; its derived values are recorded in context pending their source inputs.
- 'Tables 10–12 follow the controller ruling: only explicitly single-phase glass compositions are typed; pumice,
  core, segregation-vein, and ambiguous melt-in-bit bulk analyses stay in context. Table 10A glass samples M1-1G/M-3/M-8/M-12/M-18/M-22
  and Table 11 glass sample 69-1-22 are typed.'
- Table 9 reports sample-specific collection temperatures, frequently as approximate values or ranges. They are
  not promoted to a point temperature on Table 17 observations, whose temperature is not printed.
- Table 27 prints oxygen-fugacity profiles. fO2 is a condition; no value has been computed. The condition-only profile
  table is retained in context because no separate measured result anchors it.
