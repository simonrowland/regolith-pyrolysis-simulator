          is in shadow. Part of the shallower east pit is shown at the far right. Surface features are labeled in
          figure 3. The relatively smooth surface, marked by polygonal cracks and flow lines, formed following the
          last crustal foundering episode on March 19, 1965. The elongate area in the right center and some smaller
          areas near the vent are lower in altitude than the overturn crust surface and were the locus of the latest
          ooze-outs on March 20. Darker areas are islands of crust; those associated with the low area to the right
          are remnants of a pressure ridge that was formed during the first eruptive phase on March 5. Those at
          the left are pieces of the vent rafted out on the lake surface.
