schema_version: literature_extract.v1
source_id: related-beerkens-1986-deposits-condensation-thesis
source:
  citation: Beerkens, R.G.C. (1986). Deposits and Condensation from Flue Gases in Glass Furnaces. Doctoral thesis,
    Technische Universiteit Eindhoven.
  year: 1986
extraction:
  method: Measured gas concentrations and condensate/deposition results transcribed from MinerU and pdftotext-layout.
    Render checks were used for Tables 1.5, 2.4, 3.8, 4.1, 4.2, 4.3 and 4.4; explicit prose values were checked
    against both machine reads. Table values retain printed units. CFBL outputs are separate quoted model values
    because the full model inputs are not stored. Figure-only curves are not digitized.
  scope: Tables 1.5, 2.4, 4.2 and 4.3; the one explicitly measured Table 3.8 laboratory dew point; measured prose
    values for Na2SO4, K2SO4 and PbO; and cited literature dew points in section 2.4.
  schema_gaps:
  - Flue-gas elemental volume ppm has no exact quantity token; it is not converted to partial pressure because total
    pressure is not printed.
  - Wall deposition mass per area per time and paddle carryover g/24 h have no exact quantity token. The nearest
    closed quantities differ in dimensionality or direction.
  - The extract records printed gas mixtures verbatim in located atmosphere conditions. Identity.composition cannot
    represent the combination of gas species with volume-percent and volume-ppm values through the current closed
    composition path; no conversion or guessed identity was introduced. See simulator/battery/migrate.py::_COMPOSITION_COMPONENTS,
    simulator/battery/enums.py::AmountBasis.MOLE_PERCENT, simulator/battery/enums.py::PHASE_BASIS_TOKENS.
  - No measured Na2O or K2O activity was found. Table 2.2 is a calculated vapor-pressure/temperature relation, not
    a measured activity table.
  figure_read_candidates:
  - 'Figures 4.14-4.21: measured sodium sulphate, sodium metaborate, potassium sulphate and lead oxide deposition
    curves; only explicit prose values were transcribed.'
  - 'Figures 5.1-5.14: deposition calculations and recuperator profiles; model outputs are outside this measured-data
    pass.'
  date: '2026-11-02'
  worker: w1103cw1-be86
review_status: draft
