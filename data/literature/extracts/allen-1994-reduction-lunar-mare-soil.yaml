    - observation_id: allen_1994_abstract_result_summary
      type: result_qualification
      locator: {page: 23, pdf_page_index: 0, section: Abstract}
      phase: lunar mare soil and pyroclastic glasses
      units: as printed
      values:
        quantity: abstract_result_summary
        method_class: figure_only
        verbatim_statements:
        - 'Mare soil and orange and black pyroclastic glass were reduced in hydrogen gas at temperatures of 900-1100°C.'
        - 'The experiments support studies of regolith maturation, lunar volcanism, and the production of oxygen on the Moon.'
        - 'The most reactive component in the high-Ti soil was FeO in ilmenite, which was completely reduced to iron metal at all temperatures.'
        - 'Vitreous orange glass crystallized and was partially reduced to iron metal, pyroxene, and minor olivine.'
        - 'Initially devitrified black glass was similarly reduced and converted to iron metal, pyroxene, and minor olivine.'
        - 'The degree of reaction in both glasses increased with temperature.'
    - observation_id: allen_1994_cited_comparisons_and_references
      type: attributed_context
      locator: {page: 23, pdf_page_index: 0, section: Results - Mare Soil and References}
      phase: lunar reduction experiments
      units: bibliographic context
      values:
        quantity: source_cited_comparisons
        method_class: quoted_attributed
        quoted_from: 'Gibson et al., 1994, submitted JGR (reference (3))'
        comparison: 'The authors state their results are in close agreement with previous reduction experiments utilizing crushed lunar basalt (3).'
        cited_references_as_printed:
        - '(1) Heiken and McKay, 1974, PLSC5, 843'
        - '(2) Allen et al., 1993, Icarus, 104, 291'
        - '(3) Gibson et al., 1994, submitted JGR'
        - '(4) Hawke et al., 1990, PLPSC20, 249'
  Fe:
    observations: []
    context:
    - observation_id: allen_1994_mare_soil_qualifying_statements
      type: result_qualification
      locator: {page: 23, pdf_page_index: 0, section: Results - Mare Soil}
      phase: lunar mare soil 75061
      units: as printed
      values:
        quantity: results_qualifiers_and_directions
        method_class: figure_only
        verbatim_statements:
        - 'Most of the weight loss was due to reduction of ferrous oxide to iron metal, with concomitant release of oxygen.'
        - 'This sample contained FeO in several phases, including pyroxene, ilmenite, olivine, and agglutinitic and pyroclastic glass.'
        - 'The XRD and FeMS spectra (Fig. 1) show that a portion of the remaining Fe2+ was reduced to gamma iron in experiments above the transition temperature of 911°C.'
        - 'The most reactive phase in this Ti-rich soil was ilmenite.'
        - 'In our experiments the Fe2+ in ilmenite was completely reduced.'
        - 'No ilmenite remained in these samples, to the detection limit of FeMS and XRD.'
        - 'All ilmenite grains examined by SEM showed characteristic phase separation and reduction textures (Fig. 2).'
        - 'Other FeO-bearing phases showed much less evidence of reduction.'
        - 'Olivine grains exhibited small-scale reduction textures in SEM images.'
        - 'Olivine peaks in the FeMS spectra became smaller with increasing temperature.'
        - 'Agglutinitic glass underwent partial reduction, with increasing concentrations of iron metal particles as reduction temperature increased from 900 to 1050°C.'
        - 'Minor reduction of pyroxene was documented in the 1050°C experiment by SEM and FeMS.'
        - 'These results are in close agreement with data from previous reduction experiments utilizing crushed lunar basalt (3).'
        - 'They also provide an extreme "end member" for studies of reduction as a cause of lunar soil maturation.'
    - observation_id: allen_1994_pyroclastic_glass_qualifying_statements
      type: result_qualification
      locator: {page: 24, pdf_page_index: 1, section: Results - Pyroclastic Glass}
      phase: Apollo 17 pyroclastic glass 74220
      units: as printed
      values:
        quantity: results_qualifiers_and_directions
        method_class: figure_only
        verbatim_statements:
        - 'The XRD and FeMS spectra of all reduced glass samples were dominated by the peaks of iron metal (Fig. 3).'
        - 'The metal occurred as micrometer-scale blebs scattered throughout each glass particle (Fig. 4).'
        - 'A significant portion of the remaining Fe2+ formed gamma iron.'
        - 'Orange glass underwent devitrification in all of the experiments.'
        - 'Pyroxene crystals grew steadily with temperature, from less that 1 µm across in the 900°C sample to well over 10 µm at 1100°C.'
        - 'At this temperature the orange glass was totally devitrified to pyroxene and iron metal, plus minor olivine and titanium oxide (Fig. 4).'
        - 'Black glass spheres also underwent striking changes.'
        - 'At higher temperatures ever greater amounts of FeO in the glass and crystals were reduced to metal.'
        - 'Ilmenite was reduced to iron plus titanium oxide and olivine to iron plus pyroxene.'
        - 'In the 1100°C sample, spheres which were initially crystalline were almost indistinguishable from those which were initially vitreous.'
        - 'Reduction and devitrification experiments on orange and black glass provide constraints on conditions during lunar pyroclastic eruptions.'
        - 'They also support the contention that pyroclastic glass would be an ideal feedstock for lunar oxygen production (4).'
