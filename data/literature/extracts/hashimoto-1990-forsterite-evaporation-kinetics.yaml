            simulator/battery/migrate.py::TYPE_QUANTITY provide no exact mapping.
            simulator/battery/enums.py::Quantity.RESIDUE_COMPONENT_COMPOSITION
            describes an oxide component's composition, not a phase abundance.
            simulator/battery/enums.py::PHASE_BASIS_TOKENS has no volume-fraction
            basis; simulator/battery/enums.py::PhaseRole.GLASS names the glass
            role but does not type a phase amount.
          candidate_tokens:
            - residue_component_composition
            - mass_loss_fraction
            - yield_fraction
          value_as_printed: '~5 vol%'
          approximation_as_printed: '~'
          phase_as_printed: SiO2-rich glass in the forsterite residue
          quench_state_as_printed: not_stated
