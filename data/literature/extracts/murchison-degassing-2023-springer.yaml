source_id: murchison-degassing-2023-springer
source:
  citation: 'Voropaev, S. A., Dushenko, N. V., Fedulov, V. S. and Korochantsev, A. V. (2023), Osobennosti
    degazatsii uglistogo khondrita Murchison (CM2) v intervale temperatur 200-800 C, Astronomicheskii
    Vestnik 57(6) 571-582. English translation: Features of Degassing of the Murchison (CM2) Carbonaceous
    Chondrite in the Temperature Interval of 200-800 C, Solar System Research. Russian original DOI 10.31857/S0320930X23050067;
    English DOI 10.1134/S0038094623050064.'
  doi: 10.1134/S0038094623050064
  url: https://doi.org/10.1134/S0038094623050064
  year: 2023
extraction:
  method: Corpus PDF is the Russian Astronomicheskii Vestnik original (raw/murchison-degassing-2023-springer/murchison-degassing-2023-springer.pdf).
    Born-digital. pdftotext -layout and MinerU were used only to locate tables; they are not data. Tables
    1, 2 and 4 transcribed from a 400 dpi pdftoppm PNG render (docs-private/research/ocr-artifacts/murchison-degassing-2023-springer/p-06.png
    and p-10.png). Printed units retained (mkg/g, deg C, bar) before converting T to K as T_K = t_C +
    273.15. Authors' GC yields kept distinct from Chelyabinsk values they quote from Galimov/Voropaev
    2013 and Stennikov 2019, and from the Boudouard Kp fit (model_derived). Fig. 3 IR spectra listed figure-only
    and not digitised. Printed zeros in Table 2 recorded as printed cells, not invented. Sample mass is
    not printed (omitted). Prose on p. 580 quotes CO2 4045 ug/g and CO 10218 ug/g at 800 C; Table 1/4
    print 4040 +/- 40 and 10200 +/- 100. Table cells are the authority; prose not used to overwrite the
    table.
