      locator:
        table: '3'
        published_page: 7
        pdf_page_index: 7
        section: 3.3
        note: fitted internal standards across descent profile
      phase: LNMS_internal_standards
      regime: electron_ionization_mass_spectrometry
      units: Da or m/z as published; mean ± standard deviation; FWHM ranges as published
      values:
        quantity: fitted_mass_and_peak_width
        method_class: measured_reduced
        rows:
        - {standard: CH3+, averaged_mass_mz: '15.023 ± 0.001', mass_error_range_mz: '-0.003 to 0.001', averaged_FWHM_mz: '0.018 ± 0.001', FWHM_range_mz: '0.015-0.020'}
        - {standard: CO+, averaged_mass_mz: '27.995 ± 0.001', mass_error_range_mz: '-0.017 to 0.001', averaged_FWHM_mz: '0.040 ± 0.003', FWHM_range_mz: '0.033-0.042'}
        - {standard: N2+, averaged_mass_mz: '28.006 ± 0.003', mass_error_range_mz: '-0.019 to 0.009', averaged_FWHM_mz: '0.041 ± 0.004', FWHM_range_mz: '0.033-0.042'}
        - {standard: 40Ar+, averaged_mass_mz: '39.967 ± 0.002', mass_error_range_mz: '-0.001 to 0.012', averaged_FWHM_mz: '0.065 ± 0.005', FWHM_range_mz: '0.058-0.081'}
        - {standard: 136Xe+, averaged_mass_mz: '135.934 ± 0.027', mass_error_range_mz: '-0.046 to 0.086', averaged_FWHM_mz: '0.277 ± 0.031', FWHM_range_mz: '0.214-0.327'}
    - observation_id: mogul_2023_lnms_haze_clog_observations
      type: instrument_anomaly
      locator:
        published_page: 17
        pdf_page_index: 17
        section: 3.13
        note: printed prose describing count spikes and partial-clog altitudes
      phase: Venus_atmosphere_aerosol_instrument_interaction
      regime: LNMS_descent_sampling
      units: km, fold change, and km^-1 as published
      values:
        quantity: inlet_clog_and_mass_signal_anomalies
        method_class: measured_reduced
        partial_clog_altitudes_km: ['~15 ± 2', '~10 ± 3', '~3 ± 1']
        affected_mass_positions: '>37 between m/z 10-208'
        count_spike_range: '~5-500-fold'
        extinction_coefficients_km_minus_1: 'V13/V14 comparison values ~0.6-2.0; V13/V14 spikes ~2.24-2.30 near ~2 km'
        interpretation: authors interpret the spikes as chemical signatures of a deep atmospheric haze, not as furnace vaporization.
    - observation_id: mogul_2023_lnms_model_scope_and_fit_quality
      type: model_diagnostics
      locator:
        published_page: 4
        pdf_page_index: 4
        sections: 2.4-2.6
        note: targeted fit, normalization, and calibration method
      phase: Venus_atmosphere_mass_spectral_model
      regime: analytical_model
      units: dimensionless R2 and percent as published
      values:
