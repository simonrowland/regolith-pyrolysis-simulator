        - {PVGC_CO2_volume_percent_at_21.6_km: '96.4%', pressure_bar: 17.8, status: quoted_attributed}
        - {PVGC_CO2_mass_percent_at_51.6_km: '97.0% w/w', status: model_converted_from_quoted_volume_percent}
        - {PVGC_CO2_mass_percent_at_21.6_km: '97.7% w/w', status: model_converted_from_quoted_volume_percent}
