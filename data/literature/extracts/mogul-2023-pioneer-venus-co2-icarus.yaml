        method_class: model_derived
        generator: authors' Gauss-function regressions and calibration-curve model
        rows:
        - {fit_coverage: 'each minimized mass-cluster fit accounted for ≥95% of included counts'}
        - {FWHM_mass_regression_R2: '0.998 ± 0.002 across 64.2-0.9 km'}
        - {R2_30_eV: '0.996 ± 0.006, 3 spectra'}
        - {R2_22_eV: '0.995 ± 0.008, 3 spectra'}
        - {CO2_calibration_power_regression_R2: '≥0.987'}
        - {atmospheric_density_regression_R2: '≥0.999'}
