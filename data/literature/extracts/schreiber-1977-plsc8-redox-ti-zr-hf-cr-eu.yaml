        locator: {page: 16, pdf_page_index: 15, published_page: 1800, table: '3', row: 'Cr(III)-Cr(II), this study'}
        units: dimensionless fraction as printed
        values: {quantity: Cr(II) fraction in this study, method_class: model_derived, admission_status: typed_unavailable, reason: 'This-study estimate derived from experimental redox curves, whose points are deferred with Figures 4 and 5.', value_as_published: 0.7-0.95}
      - observation_id: schreiber_1977_figure1_redox_ion_flow
        type: figure_record
        locator: {page: 2, pdf_page_index: 1, published_page: 1786, figure: '1'}
        phase: l
        units: schematic; no numeric data
        values:
          quantity: redox_ion_flow_diagram
          method_class: figure_only
          species: [Cr, Fe, Ti, Eu]
          temperature_as_published: typical crystallizing lunar magma; not stated
          axes_as_published: none; schematic diagram
          caption_as_published: >-
            A schematic illustration of the role of different redox states of Cr,
            Fe, Ti, and Eu in the crystallization of a typical lunar magma. Some
            important minerals as well as modes of ion fractionation were not
            included in the diagram for the sake of simplicity.
          panel: single schematic
          series:
            - {label: redox ion flow and mineral incorporation, marker_count: 0}
          attribution: This work
          digitisation: deferred to a figure pass
          numeric_points: none
      - observation_id: schreiber_1977_figure2_epr_spectra
        type: figure_record
        locator: {page: 6, pdf_page_index: 5, published_page: 1790, figure: '2'}
        phase: glass
        units: normalized EPR signal derivative versus gauss
        values:
          quantity: epr_spectrum
          method_class: figure_only
          species: [Ti, Eu, Cr]
          temperature_as_published: synthesis temperature not specified for representative spectra
          axes_as_published: {x: magnetic field strength H (gauss), y: dP''/dH}
          caption_as_published: >-
            Representative EPR spectra of Ti-, Eu-, and Cr-doped glasses of
            synthetic composition. The general features of the three
            representative spectra were the same for both synthetic compositions.
            The spectra are shown as the derivative of the absorption versus the
            magnetic field strength. A_pp is the intensity of the resonance
            signal; the caption relates the resonance features to Ti(III), Eu(II),
            and Cr(III).
          panel: single plot with stacked Ti3+, Eu2+, and Cr3+ spectra
          series:
            - {label: Ti(III) spectrum, marker_count: 0}
            - {label: Eu(II) spectrum, marker_count: 0}
            - {label: Cr(III) spectrum, marker_count: 0}
          attribution: This work
          digitisation: deferred to a figure pass
          numeric_points: none
      - observation_id: schreiber_1977_figure3_epr_calibrations
        type: figure_record
        locator: {page: 7, pdf_page_index: 6, published_page: 1791, figure: '3'}
        phase: glass
        units: EPR normalized units and wt.% ion by redox titration
        values:
          quantity: redox_concentration_calibration
          method_class: figure_only
          species: [Ti, Eu, Cr, Gd]
          temperature_as_published: 1500 °C filled symbols; 1550 °C open symbols
          axes_as_published: >-
            EPR resonance intensity (A_pp) versus weight percent Ti(III), Eu(II),
            or Cr(III) determined by chemical redox titration
          caption_as_published: >-
            Calibration of the Ti(III), Eu(II), and Cr(III) EPR resonance
            intensities to the wt.% of each ion determined by chemical redox
            titrations for synthetic glasses. Solid/open symbols denote 1500/1550
            °C; circles/squares denote FAS/FAD. Panels A, B and C show Ti(III),
            Eu(II) and Cr(III) calibrations; panel B also compares Gd(III).
          panel: A Ti(III); B Eu(II) and Gd(III); C Cr(III)
          series:
            - {label: Ti(III), marker: circle and square, marker_count: uncounted}
            - {label: Eu(II), marker: circle and square, marker_count: uncounted}
            - {label: Gd(III) comparison, marker: triangle and diamond, marker_count: uncounted}
            - {label: Cr(III), marker: circle and square, marker_count: uncounted}
          marker_count_note: >-
            Multiple temperatures and compositions share marker shapes; exact
            per-series counts have not been separated in this deferred record.
          attribution: This work; Gd(III) comparison is also measured in this work
          digitisation: deferred to a figure pass
          numeric_points: none
      - observation_id: schreiber_1977_figure4_experimental_redox_equilibria
        type: figure_record
        locator: {page: 10, pdf_page_index: 9, published_page: 1794, figure: '4'}
        phase: glass
        units: oxygen fugacity and degree of redox reduction
        values:
          quantity: valence_ratio
          method_class: figure_only
          species: [Ti, Eu, Cr]
          temperature_as_published: 1500 and 1550 °C
          axes_as_published: x degree of reduction R or X; y oxygen fugacity
          caption_as_published: >-
            Experimental results for the redox equilibria of Ti, Eu, and Cr in
            synthetic silicate melts with respect to oxygen fugacity, temperature
            and melt composition. Solid/open symbols indicate 1500/1550 °C;
            circles/squares indicate FAS/FAD. Panel A is Ti(IV)-Ti(III), panel B
            Eu(III)-Eu(II), and panel C Cr(VI)-Cr(III) and Cr(III)-Cr(II).
          panel: A Ti; B Eu; C Cr(VI)-Cr(III) and Cr(III)-Cr(II)
          series:
            - {label: Ti, marker: circles and squares, marker_count: uncounted}
            - {label: Eu, marker: circles and squares, marker_count: uncounted}
            - {label: Cr(VI)-Cr(III), marker: circles and squares, marker_count: uncounted}
            - {label: Cr(III)-Cr(II), marker: circles and squares, marker_count: uncounted}
            - {label: Johnston (1965) Ti comparison, marker: triangle, marker_count: uncounted}
          marker_count_note: >-
            Marker counts across temperature and composition series have not been
            separated in this deferred record.
          attribution: Present work; Johnston (1965) comparison in panel A
          digitisation: deferred to a figure pass
          numeric_points: none
      - observation_id: schreiber_1977_figure5_redox_summary
        type: figure_record
        locator: {page: 12, pdf_page_index: 11, published_page: 1796, figure: '5'}
        phase: glass
        units: redox ratio and oxygen fugacity
        values:
          quantity: valence_ratio
          method_class: figure_only
          species: [Ti, Eu, Cr]
          T_C: 1500
          axes_as_published: x log R; y -log P(O2) (oxygen fugacity)
          caption_as_published: >-
            A summary of the Ti(IV)-Ti(III), Eu(III)-Eu(II), Cr(III)-Cr(II), and
            Cr(IV)-Cr(III) redox equilibria in synthetic Fe-free silicate melts at
            1500 °C with respect to imposed oxygen fugacity and bulk melt
            composition. Dashed/solid lines denote FAD/FAS; oxygen buffer fugacities
            are calculated values extrapolated from Huebner (1971).
          panel: single plot
          series:
            - {label: Ti(IV)-Ti(III), marker_count: 0}
            - {label: Eu(III)-Eu(II), marker_count: 0}
            - {label: Cr(III)-Cr(II), marker_count: 0}
            - {label: Cr(IV)-Cr(III), marker_count: 0}
          attribution: Present-work experimental results; buffer values from Huebner (1971)
          digitisation: deferred to a figure pass
          numeric_points: none
      - observation_id: schreiber_1977_figure6_reduction_potential_comparison
        type: figure_record
        locator: {page: 13, pdf_page_index: 12, published_page: 1797, figure: '6'}
        phase: glass
        units: relative reduction parameter and aqueous standard reduction potential
        values:
          quantity: reduction_potential
          method_class: figure_only
          species: [Ti, Eu, Cr, Fe, V, Mn, Co, Ce]
          temperature_as_published: adjusted to experimentally normalized lunar conditions
          axes_as_published: x aqueous standard reduction potential; y log R at 1500 °C and log P(O2) = -8.8
          caption_as_published: >-
            Relationship of a parameter proportional to a reduction potential of
            redox couples in silicate melts to standard aqueous reduction
            potentials. R and X are defined in Fig. 5; values were adjusted to
            experimentally normalized lunar conditions and combined with Johnston
            (1965).
          panel: single plot
          series:
            - {label: this work, marker: filled circle, marker_count: 3}
            - {label: Johnston (1965) estimates, marker: open triangle, marker_count: 6}
            - {label: guide line, marker_count: 0}
          attribution: Present work combined with Johnston (1965)
          digitisation: deferred to a figure pass
          numeric_points: none
