schema_version: literature_extract.v1
source_id: schreiber-1977-plsc8-redox-ti-zr-hf-cr-eu
figure_policy: Figures 1-6 are recorded without numeric plot points; all plotted series remain deferred to a figure pass.
source:
  citation: >-
    Schreiber, H. D. (1977). Redox states of Ti, Zr, Hf, Cr, and Eu in basaltic
    magmas: An experimental study. Proceedings of the Eighth Lunar Science
    Conference, 1785-1807.
  year: 1977
extraction:
  method: >-
    Scanned LPSC proceedings article transcribed from MinerU OCR. Table 3 was
    checked against a 600 dpi render of physical PDF page 16 (printed page
    1800). Table 1 bulk compositions and Table 2 fitted reduction enthalpies
    are retained in context. Figure values are not digitised.
  date: '2026-10-20'
  worker: fam27-1020
review_status: draft
fidelity_samples:
  - path: species.Cr.observations[schreiber_1977_t3_cr_schreiber_haskin_1976].values.points[0].range
    value: ['0.65', '1.0']
    locator: {page: 16, pdf_page_index: 15, published_page: 1800, table: '3', row: 'Cr(III)-Cr(II), Schreiber and Haskin (1976)'}
  - path: species.Eu.observations[schreiber_1977_t3_eu_philpotts_drake].values.points[0].value
    value: '0.7'
    locator: {page: 16, pdf_page_index: 15, published_page: 1800, table: '3', row: 'Eu(III)-Eu(II), Philpotts (1970), Drake (1975)'}
  - path: species.Ti.observations[schreiber_1977_t3_ti_weeks_1973].values.points[0].value
    value: '0.03'
    locator: {page: 16, pdf_page_index: 15, published_page: 1800, table: '3', row: 'Ti(IV)-Ti(III), Weeks (1973)'}
experiments:
