source:
  citation: >-
    Suzuki, Y., Kawasaki, S., Ookawa, M. and Yokokawa, T. (1995). Basicity of
    alkaline earth silicate melts based on the Cr6+/Cr3+ redox equilibria.
    Materials Transactions, JIM 36(12), 1483–1486. DOI: 10.2320/matertrans1989.36.1483.
  doi: 10.2320/matertrans1989.36.1483
  year: 1995
extraction:
  method: >-
    Scanned encrypted publisher PDF; MinerU machine text and tables were used.
    Table 1 and Table 2 were checked against the 600 dpi PDF page 3 render.
    No quantity token fits the measured Cr reduction potential or pO (negative
    log Na2O activity). Whole magma compositions have no composition-vector
    observation token. Their printed values are preserved in context; derived
    basicities are identified as author estimates. Figures 1–5 are deferred.
  date: '2026-10-20'
  worker: codex
