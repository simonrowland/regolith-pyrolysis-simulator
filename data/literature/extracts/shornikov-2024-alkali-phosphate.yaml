extraction:
  method: >-
    The PDF is a journal excerpt. This extract is only the K2O–P4O10 article on
    published pages 70–73 (PDF pages 2–5). The Na2O–P4O10 closing paragraph on
    published page 70 and the FeO–P4O10 opening on published page 73 are excluded.
    Na2O curves drawn on Fig. 3 are comparison context, not a second paper. No
    numeric table is printed. Figures were inspected at 600 dpi. Calculated curves
    have no discrete markers of this study, so no coordinates were read. Cited
    experimental symbols were not read.
