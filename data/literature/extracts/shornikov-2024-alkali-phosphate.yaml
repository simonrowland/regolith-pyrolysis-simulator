        temperature_K: 1175
        composition: potassium metaphosphate
        species: K
        partial_pressure_upper_bound_atm: '1e-14'
        sentence_as_published: >-
          The K partial pressure over the potassium metaphosphate at 1175 K is no
          more than 10−14 atm, which significantly differs from the results obtained
          by Steblevsky et al. (1977). The value determined by them is too high
          (Fig. 2, symbol 4).
