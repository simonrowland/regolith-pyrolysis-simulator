schema_version: literature_extract.v1
source_id: kems-042-plante-1979
source:
  citation: >-
    Plante, E. R. (1979), "Vapor pressure measurements of potassium
    over K2O-SiO2 solutions by a Knudsen effusion, mass spectrometric
    method", in Hastie, J. W. (ed.), Characterization of High
    Temperature Vapors and Gases, NBS Special Publication 561,
    Vol. 1, pp. 265-281, National Bureau of Standards, Washington, DC.
  doi: null
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nbsspecialpublication561v1.pdf
  year: 1979
extraction:
  method: >-
    Manual visual transcription from 250 dpi pdftoppm renders of
    docs/references/pdfs/99-kems-langmuir/kems-042-nbs-sp561-v1-hastie-1979.pdf
    printed pages 276-280 (PDF pages 300-304). Table 2 P_K points
    transcribed as printed. Two-phase (superscript a) rows and all
    of series 1214 omitted (author: those T,X sit in the
    cristobalite/tridymite + melt field and/or failed to
    equilibrate). Table 3 least-squares coefficients and the
    master-equation evaluations (eq. 8) are fits, not transcribed
    as measurements. Liquid-K2O reference conversion (eq. 9) is
    not applied: K_eq is not tabulated. Activity is the vapor-
    reference A of eq. (7) from each measured P_K via the stated
    P_O2 = 0.226 P_K.
  date: '2026-08-27'
  worker: transcribe-activity
  provenance_path: docs/references/pdfs/99-kems-langmuir/kems-042-nbs-sp561-v1-hastie-1979.pdf
review_status: draft
