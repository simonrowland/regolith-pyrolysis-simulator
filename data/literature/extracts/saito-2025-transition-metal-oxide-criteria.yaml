  worker: fam38-1021
review_status: draft
scope_assessment:
  document_type: thermodynamic model assessment and literature comparison for transition-metal oxides in slags
  scored_observations: 0
  note: No new measured activity series are tabulated. Measured literature data are plotted in Figures 1, 2, and
    6–8, and are deferred without point digitisation. Figure 3–5 contain schematic or calculated model results.
    Table I and the two explicitly printed model limits are retained in context.
