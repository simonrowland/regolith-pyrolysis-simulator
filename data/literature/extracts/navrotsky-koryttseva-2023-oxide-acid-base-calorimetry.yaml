          \                                         The data for the PbO–B2 O3 system\
          \ (Figure 1b) can be interpreted similarly [42]. In this\n             \
          \                       system, PbO is a moderately strong base (Pb2+ is\
          \ a weak acid), while B2 O3 is a strong acid.\n                        \
          \            The interaction between B2 O3 and PbO represents a strong acid–base\
          \ reaction:\n\n                                                  (1 − n)\
          \ PbO + n B2 O3 → (1 − n) Pb2+ + 2n {boron-based anion(s)}\n\n         \
          \                                 In a PbO–B2 O3 melt, there is a buffer\
          \ region in the composition range 0.25 < n (B2 O3 ) < 0.5,\n           \
          \                         where partial molar enthalpies of solution change\
          \ only to a moderate degree and the melt\n                             \
          \       acidity changes little with the change in composition. Because the\
          \ borate anions tend\n                                    to polymerize,\
          \ their types and amounts depend on (B2 O3 ). Such speciation has been\n\
          \                                    analyzed in detail [24]. The composition\
          \ used as a calorimetric solvent, 2PbO·B2 O3 with\n                    \
          \                n (B2 O3 ) = 0.33), lies within this buffer region. The\
          \ dependence of the enthalpy of solution\n                             \
          \       on the mole fraction of acidic oxide is similar in appearance to\
          \ that of an aqueous acid–base\n                                    titration\
          \ curve. Buffer regions are separated by rapidly changing regions of enthalpy,\
