          \                             Before proceeding to that discussion, some\
          \ comments on the acid–base chemistry of\n                             \
          \         the solvent systems themselves are in order. High-temperature\
          \ calorimetry has been used\n                                      to directly\
          \ measure enthalpies of mixing in a number of oxide glasses and melts, giving\n\
          \                                      insight into their acid–base equilibria.\
          \ The systems studied include PbO–V2 O5 [41], PbO–\n                   \
          \                   B2 O3 [42], PbO–SiO2 [43], PbO–GeO2 [44], Na2 O–MoO3\
          \ [45], Li2 O–B2 O3 , Na2 O–B2 O3 and\n                                \
          \      K2 O–B2 O3 [27]. In some cases, integral enthalpies of mixing were\
          \ measured by combining\n                                      large amounts\
          \ of components; in others, partial molar enthalpies of solution of one\
          \ or both\n                                      of the components in binary\
          \ systems were measured as a function of melt composition.\n           \
          \                           The selected data are summarized in Figure 1.\n\
          \                                           In the system Na2 O–MoO3 , Na2\
          \ O is a strongly basic oxide, while MoO3 is a strong\n                \
          \                      acid. We can write a number of successive stages\
          \ of acid–base interaction that occur when\n                           \
          \           MoO3 is added to a melt initially rich in Na2 O. The species\
          \ in the melt, with increas-\n                                      ing\
          \ MoO3 content, are MoO4 2− , Mo2 O7 2− and MoO3 . Their equilibria are\
          \ described by\n                                      the following:\n \
          \                                                             O2− (in melt)\
          \ + MoO3 (s) = MoO4 2− (in melt)\n\n\n                                 \
          \                              MoO4 2− (in melt) + MoO3 (s) = Mo2 O7 2−\
          \ (in melt)\n\fMolecules 2023, 28, 4623                                \
          \                                                                      \
          \        8 of 17\n\n\n\n\n                                             \
          \                        MoO3 (s) = MoO3 (in melt)\n                   \
          \                     When the melt contains a mixture of several types\
          \ of molybdate species, such as\n                                   those\
          \ above or their polymers, it is a buffered acid–base system (Figure 1a).\
          \ There are\n                                   several buffer regions in\
          \ the Na2 O–MoO3 system [45]. For 0.52 < n (MoO3 ) < 0.63 and n\n      \
          \                             (MoO3 ) > 0.7, where the enthalpy of solution\
          \ of MoO3 changes very slowly with increasing\n                        \
          \           mole fraction of MoO3 , these buffer regions contain mixtures\
          \ of molybdate species. The\n  Molecules 2023, 28, x FOR PEER REVIEW\n \
          \                                  composition chosen as a calorimetric\
          \ solvent (3Na2 O 4MoO3 ) is a buffer containing 7 of 17\n             \
          \                                                                      \
          \                                    mainly\n                          \
          \         MoO4 2− and Mo2 O7 2− species charge-balanced by Na+ ions.\n\n\
