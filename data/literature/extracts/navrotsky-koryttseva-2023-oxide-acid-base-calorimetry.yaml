          \ 1c,d. The relative strength of acids and bases can be judged by\n    \
          \                                the magnitude of the enthalpy “jump” on\
          \ the curve (the distance between the two relatively\n                 \
          \                   flat lines defining buffer regions). For example, Figure\
          \ 1d shows that the enthalpy jump\n                                    increases\
          \ in the order Li2 O–B2 O3 , Na2 O–B2 O3 , K2 O–B2 O3 , indicating an increase\
          \ in basic\n                                    properties in this direction,\
