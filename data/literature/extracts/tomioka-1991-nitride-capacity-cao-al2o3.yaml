    - observation_id: tomioka_1991_method
      type: method
      locator:
        published_page: 1316
        pdf_page_index: 1
        section: Experimental
      units: K; atm
      values:
        quantity: gas_slag_equilibration_nitride_capacity
        method_class: method_only
        experimental_method: gas-slag equilibration with N2-H2-H2O; Po2 by ZrO2-MgO solid electrolyte EMF; CaO, Al2O3, and Mo
          crucibles; 1723-1923 K
        how_equilibrium_shown_as_printed: approach from AlN-added and N-free sides; ~9 h to plateau in log CN3- vs time (Fig. 4);
          runs 12-24 h
        CN3_definition_as_printed: CN3- = (%N) * Po2^(3/4) / PN2^(1/2)
        temperature_measurement_as_printed: Pt–20%Rh/Pt–40%Rh thermocouple; hot zone 3 cm within ±2 K
        oxygen_potential_calibration_as_printed:
          Mo/MoO2: ΔG° = −56100 + 169.2 T J/mol; EMF measured at 1073 K
          H2O: ΔG° = −247500 + 55.86 T J/mol; P_H2O/P_H2 measured at 1073 K and used to recalculate P_O2 at 1723–1923 K
        analysis_method_as_printed:
          N: ion chromatography after Kjeldahl extraction; ±0.2 mass ppm; Kjeldahl-indophenol inaccurate below 10 mass ppm N
          Ca and Al: ICP emission spectrometry; ±0.5%
    - observation_id: tomioka_1991_fig7_liquidus_figure_only
      type: method
      locator:
        published_page: 1320
        pdf_page_index: 5
        figure: '7'
      units: none
      values:
        quantity: cao_al2o3_phase_diagram_with_present_liquidus_points
        method_class: method_only
        admission_status: figure_only
        note: Fig. 7 Hallstedt diagram with present liquidus points; not digitised
    - observation_id: tomioka_1991_activity_derivation
      type: activity_derivation
      locator:
        published_page: 1320
        pdf_page_index: 5
        section: '3.6 Activity Coefficient of AlN'
      units: J/mol; dimensionless
      values:
        equations_as_printed:
          equation_4: 2 Al + 3/2 O2(g) = Al2O3(s)
          equation_5: ΔG°4 = −1554000 + 377.6 T J/mol
          equation_6: 1/2 Al2O3(s) + 1/2 N2(g) = AlN(s) + 3/4 O2(g)
          equation_7: ΔG°6 = 516600 − 47.91 T J/mol
          equation_8: γ_AlN = (K6 / α_AlN) a_Al2O3^(1/2) / C_N3−
          alpha_AlN_definition: mole fraction of AlN divided by mass% N
    - observation_id: tomioka_1991_liquidus_molar_ratio_ranges
