        pdf_page_index: 5
        section: '3.4 Temperature Dependence / 3.5 Dependence of Slag Composition'
      T_range_K: [1723.0, 1923.0]
      phase: liquid CaO-Al2O3 at Al2O3 or CaO saturation (liquidus)
      units: molar ratio CaO/Al2O3 as printed
      values:
        note: Authors state Table I slag compositions correspond to liquidus; molar ratios varied as follows (printed). Fig. 7
          plots points on Hallstedt CaO-Al2O3 diagram — figure_only, not digitised.
        Al2O3_crucible_CaO_over_Al2O3_molar_range_as_printed: 1.5 to 0.85 (1723-1923 K)
        CaO_crucible_CaO_over_Al2O3_molar_range_as_printed: 1.9 to 2.8 (1723-1823 K)
        Mo_crucible_CaO_over_Al2O3_molar_ratio_as_printed: almost constant at 2.3
        agreement_as_printed: present slag compositions in good agreement with liquidus lines (Hallstedt)
      quote: 'since the molar ratios of CaO/Al2O3 in the slags were those corresponding to liquidus compositions, they varied
        from 1.5 to 0.85 (1723-1923 K) when Al2O3 crucibles were used, and from 1.9 to 2.8 (1723-1823 K) in the case of CaO
        crucibles.'
