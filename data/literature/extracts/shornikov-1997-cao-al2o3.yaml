- experiment_id: shornikov-1997-cao-al2o3-partials
  kind: kems
  locator:
    page: 1
    published_page: 23
    pdf_page_index: 0
    section: Thermodynamic properties of the CaO–Al2O3 system
  method: "The approach of the authors' 1996 mass-spectrometric study was used to estimate partial enthalpies\
    \ and entropies from the temperature dependences of the chemical potentials, assuming those partials\
    \ constant over 1833–2033 K. This paper does not reprint the ion currents."
- experiment_id: shornikov-1997-cao-al2o3-formation
  kind: derived_thermochemistry
  locator:
    page: 2
    published_page: 24
    pdf_page_index: 1
    equation: 3-4
    table: '2'
  method: "Integral formation values per 1 mol of compound. Method V is the Knudsen effusion reduction.\
    \ Method III is this paper's calculation from literature data."
- experiment_id: shornikov-1997-cao-al2o3-fusion
  kind: derived_thermochemistry
  locator:
    page: 2
    published_page: 24
    pdf_page_index: 1
    equation: 7-8
    table: '3'
  method: H_fus = H_T(liq) − H_T(sol), and H_fus = T_fus (S_T(liq) − S_T(sol)). Tfus is cited from Nurse
    et al., Chatterjee and Zhmoidin, and Chemekova and Udalov.
