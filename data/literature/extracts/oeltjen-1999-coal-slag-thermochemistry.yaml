source:
  citation: Oeltjen, Lars (1999). Vorhersage thermodynamischer Eigenschaften von Kohlenschlacken mittels Modellrechnungen.
    Berichte des Forschungszentrums Jülich, Jül-3688 (August 1999), RWTH Aachen dissertation D82. ISSN 0944-2952.
  year: 1999
  url: https://juser.fz-juelich.de/record/136170
  version: Jül-3688, August 1999
  corpus_asset: raw/oeltjen-1999-coal-slag-thermochemistry/oeltjen-1999-coal-slag-thermochemistry.pdf
  corpus_sha256: c253ab795342c9397bbde04bb0df89dfcc9b98fa54fecd3dd7a114e936759d4d
  source_note: Six own KEMS sample series. Experimental activity symbols in Figures 6.21 and 6.22 are digitized.
    The source prints no numeric run table and no per-point uncertainty. Sample 6 is 72.5 mol percent SiO2 in
    Table 5.1 and 0.725 on the Figure 6.22 label; those are the same composition. 0.735 is sample 4. Table 5.1
    is retained as printed and the figure labels are kept as printed.
extraction:
  method: Machine-text-first transcription from MinerU table blocks and pdftotext-layout; Table 4.1 and Table 5.1
    cell values and row-column assignments checked against the page renders. Figures 6.21 and 6.22 experimental
    symbols were read at 600 dpi from labelled axis ticks. Model curves and the other figure records were not digitized.
  date: '2026-11-02'
  worker: w1103oe-oe99
  provenance_path: data/literature/extracts/audits/oeltjen-1999-coal-slag-thermochemistry.audit.md
  source_note: Own K and Na partial pressures are described as derived from unprinted detector signals by equation
    5.1; alkali-oxide activities are reduced from pressures using equations 5.2-5.6 and the stoichiometric-evaporation
    assumption. The stored activities are the figure reads of that reduction, not pressures recomputed here. Model
    curves stay figure-only.
