      locator:
        page: 73
        published_page: 59
        pdf_page_index: 72
        figure: '6.22'
        marker: 'filled triangle'
        series_numeral: '6'
      derivation:
        relation: |
          Activities in Figures 6.21 and 6.22 are this thesis's own KEMS results, reduced from measured alkali partial pressures. Equation (5.1), PDF page 45: P_i = (P_0 * a_0 * sigma_0 * gamma_0 * I_i * T_i) / (a_i * sigma_i * gamma_i * I_0 * T_0) = K * (I_i * T_i) / (a_i * sigma_i * gamma_i). Equation (5.2), PDF page 46: Na2O(l) <=> 2 Na(g) + 0.5 O2(g). The printed sentence says the conversion is carried out for Na and holds analogously for K. Equation (5.3): a(Na2O(l)) = P(Na)^2 * P(O2)^0.5 / k_p, with k_p taken from the FACT pure-substance database. Equation (5.4), FeO(g) <=> Fe(g) + 0.5 O2(g), is printed as an alternative oxygen route limited to the two Fe-bearing samples above about 1700 K. The third printed method is stoichiometric evaporation. The thesis states: "Die Annahme stöchiometrischer Verdampfung stellt die dritte Methode zur Bestimmung des O2-Partialdrucks dar." For each O2 molecule the reaction in equation (5.2) produces four Na atoms, so equation (5.5) prints P(Na)^2 * P(O2)^0.5 = P(Na)^2 * 0.5 * P(Na)^0.5 = 0.5 * P(Na)^2.5. Equation (5.6): a(Na2O(l)) = P(Na)^2.5 / (2 * k_p). The stored number is the activity read from the figure, not a pressure recomputed here.
        raw_inputs:
          state:
            tag: value
            value: not_printed
          locator:
            page: 46
            published_page: 32
