    - observation_id: shornikov_2007_redox_sio2_alpha
      type: alpha
      locator:
        page: 2
        published_page: 38
        pdf_page_index: 1
        note: >-
          600 dpi PDF page 2, crop x 3000-4666, y 4458-4833. The word 0.04 is
