    section: Redox condition influence
  method: >-
    Conference note on redox conditions and oxide-melt evaporation. The printed
    pressure factors compare a reducing container with chemically neutral
    evaporation. The two evaporation coefficients are quoted from the
    paragraph on Hashimoto's graphite-container experiments. No single
    temperature is printed on those sentences.
species:
  SiO2:
