source:
  citation: >-
    Shornikov, S. I. (2007), Redox condition influence on CaO-MgO-FeO-Al2O3-SiO2
    melt evaporation, Experiment in Geosciences 14(1):37-39.
  year: 2007
  corpus_asset: raw/shornikov-2007-ca-aluminosilicate-activities/shornikov-2007-ca-aluminosilicate-activities.pdf
extraction:
  method: >-
    The PDF is three pages of Experiment in Geosciences 2007, volume 14, number 1.
    The redox note runs from journal page 37 through its references on journal
    page 39. The closing figure of the CaO-Al2O3-SiO2 melts paper and the
    Shushkanova diamond abstract, which begins after those references, were
    not extracted. The printed factors, the quoted Hashimoto coefficients, and
    the estimated total-pressure discrepancy were read on the 600 dpi pages.
    No figure curve was digitized.
  date: '2026-10-20'
  worker: t1372-w1
