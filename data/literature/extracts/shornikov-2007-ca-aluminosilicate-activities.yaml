      phase: l
      experiment: shornikov-2007-redox-note
      units: dimensionless evaporation coefficient as printed
      uncertainty:
        note: No uncertainty is printed on this coefficient.
      values:
        quantity: evaporation_coefficient_alpha
        method_class: quoted_attributed
        attribution: >-
          Hashimoto [14, 15]. Printed citations: Hashimoto A. // Geochem. J.
          1983. V. 17. No. 3. P. 111-145. Hashimoto A. // Nature. 1990. V. 347.
          No. 6288. P. 53-55. The coefficient sentence does not assign 0.04
          to one of the two papers.
        alpha: 0.04
        alpha_as_printed: '0.04'
        material: liquid silicon dioxide
        formula_as_printed: SiO2
        temperature_as_printed: >-
          The coefficient sentence does not print a temperature. The same
          paragraph prints Hashimoto's kinetics study at 1873-2373 K.
        source_disagreement: >-
          This note prints αv(SiO2) = 0.04 inside the paragraph that describes
          Hashimoto's graphite-container experiment [14, 15], for liquid
          silicon dioxide. The following paragraph says the evaporation
          coefficient of liquid SiO2 determined by this note's author is close
          to a unit and cites reference [19]; that sentence does not print
          0.04. Shornikov (2008), Geochemistry International 46(7):727, prints
          αv(SiO2) = 0.4 in the parallel sentence inside the Hashimoto [24, 25]
          paragraph, also for liquid silicon dioxide. Neither coefficient
          sentence prints a temperature. Both papers print 1873-2373 K as the
          range of that kinetics study. The 2008 extract stores 0.4 as
          author_estimate. The printed quantity, phase, and material are the
          same. The digits 0.04 and 0.4 disagree. This extract does not choose
          between them.
    - observation_id: shornikov_2007_redox_sio2_ptot_discrepancy
      type: partial_pressure
      locator:
        page: 3
        published_page: 39
        pdf_page_index: 2
        note: >-
          The sentence begins at the bottom of published p. 38, "Estimated
          discrepancies", and the number is the first line of the left column
          on published p. 39. 600 dpi PDF page 3. The words 10, superscript 4,
          hyphen, 10, superscript 5 are at pt x 221.70-251.58, y 41.45-53.88
          (px x 1848-2130, y 345-449). The 4 and the 5 sit above the baseline.
      phase: g
      experiment: shornikov-2007-redox-note
      units: pressure ratio as printed
      uncertainty:
        note: The sentence prints a range. No single value and no uncertainty are printed.
      values:
        quantity: partial_pressure
        method_class: author_estimate
        oxide_as_printed: SiO2
        quantity_as_printed: ptot(SiO2)
        ratio_as_printed: 10^4-10^5
        comparison_as_printed: >-
          Estimated discrepancies with the results obtained by Hashimoto [14, 15]
        absolute_pressure: not printed
        source_comparison: >-
          Shornikov (2008) prints the same estimated difference, 10^4-10^5, for
          p°tot(SiO2). This row stores the 2007 sentence. It does not print one
          temperature.
