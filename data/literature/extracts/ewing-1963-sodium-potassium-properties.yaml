      - observation_id: ewing_1963_na_table3_cp_context
        type: characterization
        locator: {page: 10, pdf_page_index: 15, table: '3'}
        units: 'temperature °C; specific heat cal/gm °C as printed'
        values:
          quantity: sodium_specific_heat_table_as_printed
          method_and_conditions: >-
            Saturated liquid sodium measured in earlier NRL low-temperature iron-bucket calorimetry. The source reports a mean deviation of ±0.5% against NBS values; this is a comparison statistic, not pointwise measurement uncertainty. No confidence level is stated.
          nrl_measured_points:
            - {T_C: 155.2, specific_heat_cal_g_C: 0.325}
            - {T_C: 255.3, specific_heat_cal_g_C: 0.315}
            - {T_C: 352.0, specific_heat_cal_g_C: 0.312}
            - {T_C: 449.7, specific_heat_cal_g_C: 0.304}
            - {T_C: 555.3, specific_heat_cal_g_C: 0.297}
            - {T_C: 652.6, specific_heat_cal_g_C: 0.300}
          exclusion: NBS comparator column is not measurement data from this work.
      - observation_id: ewing_1963_na_method_apparatus_context
        type: method
        locator: {page: 2, pdf_page_index: 7, figure: '1', section: Pressure-Volume-Temperature}
        units: as printed
        values:
          quantity: sodium_null_point_method_and_apparatus
          method_class: method_only
          method: >-
            Closed null-point chamber of known volume with a flexible 5 mil diaphragm, electrical-continuity probe, and external calibrated Bourdon-tube pressure gauges. Sodium pressure was balanced against external pressure. The cell was heated in a pressure furnace; two calibrated Pt-6%Rh/Pt-30%Rh thermocouples measured each end, with readings taken under isothermal conditions.
          sample_and_charge: >-
            Distilled sodium was introduced in small tared closed-end tubes made from Cb-1% Zr alloy; filling and weighing occurred in a vacuum-inert gas box. Five null-point experiments used a nominal 57 cc chamber. The report gives a 28.14 mg charge for Experiment 4 and 307.59 mg for Experiment 7; per-point run assignments are not given in Figure 6.
          pressure_and_gas: >-
            Reported sodium vapour pressures span 1 to 25 atm. The chamber was checked for residual gas after each experiment with an evacuated manometer; gas pressures as low as 0.01 psi could have been detected. No carrier gas is reported during measurement.
          duration: >-
            Pressure-temperature measurements covered at least one complete heating and cooling cycle per experiment; each cycle required continuous equipment operation for 52 to 60 hours.
          measurement_reproducibility: >-
            Equilibrium pressures were generally reproduced to better than ±0.1 psi before, during, and after cycling; the paper does not state a confidence level.
      - observation_id: ewing_1963_sodium_properties_context
        type: characterization
        locator: {page: 1, pdf_page_index: 6, section: Summary of Experimental Program}
        units: as printed
        values:
          quantity: sodium_potassium_measurement_scope
          sodium_density: >-
            High-temperature sodium density had been reported previously in references 1 and 2; additional density work is described as in progress. No sodium density table or points are reported in this document.
          potassium: >-
            Potassium vapor-pressure and heat-capacity measurements are described as future work. No measured potassium vapour pressure, density, heat capacity, enthalpy, or vapour-composition series is reported here.
          vapour_composition_and_thermodynamics: >-
            The preliminary sodium PVT discussion identifies dimer and trimer molecular species but reports no measured mole fractions, equilibrium constants, or enthalpy values. The report says these thermodynamic results will be obtained after additional experiments and treatment.
          scope: >-
            This is the complete Ninth Progress Report for 1 October to 31 December 1962, not a fragment of that report; the work is explicitly interim and continuing.
