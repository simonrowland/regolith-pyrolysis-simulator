      - observation_id: ewing_1963_na_table1_cp_context
        type: characterization
        locator: {page: 8, pdf_page_index: 13, table: '1'}
        units: 'temperature °C; specific heat cal/gm °C as printed'
        values:
          quantity: sodium_specific_heat_table_as_printed
          method_and_conditions: >-
            Saturated liquid sodium measured by NRL high-temperature calorimetry: an Inconel bucket was equilibrated in a known-temperature furnace and dropped into a calorimeter; heat evolved on cooling to 30°C was measured, with filled and empty bucket runs used to derive sample heat capacity. The report describes the probable error of the NRL measurement as 13%; no confidence level is stated.
          nrl_measured_points:
            - {T_C: 315.9, specific_heat_cal_g_C: 0.314}
