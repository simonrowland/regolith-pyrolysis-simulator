  cell_material_and_liner:
    state: {tag: value, value: Alumina ceramic crucible}
    locator: {page: 35, section: '3.3.2 Elemental analysis of selected samples', note: The crucible used for the exposure-12 condensate is pure alumina ceramic}
  heating_method:
    state: {tag: value, value: Heliostat mirror and horizontally positioned Fresnel lens focusing sunlight through a quartz window}
    locator: *setup_locator
  pumping_type:
    state: {tag: value, value: Turbomolecular pump(s)}
    locator: {page: 19, section: '3.1.1 Vacuum system', note: Setup versions use one directly connected turbopump or two turbopumps; the changing arrangement is retained on the experiment}
  temperature_measurement:
    sensor:
      state: {tag: value, value: Optris IR camera for peak surface temperature; two Type-K thermocouples for bake-out monitoring}
      locator: {page: 22, section: '3.1.3 Sensors and measurement', note: Thermocouples were not useful during solar exposures; the IR camera supplied the effective exposure temperature measurement}
  temperature_calibration:
    uncertainty:
      state: {tag: value, value: {kind: point, point: '14.5'}}
      locator: {page: 23, section: '3.1.3 Sensors and measurement', note: Average IR-camera error through the quartz window was 14.5 C over 1000-1450 C; temperature difference has the same magnitude in K}
  detector:
    state: {tag: value, value: Residual gas analyser (RGA)}
    locator: {page: 19, section: '3.1.1 Vacuum system', note: RGA was protected from pressure spikes; no gas-composition result was obtained}
