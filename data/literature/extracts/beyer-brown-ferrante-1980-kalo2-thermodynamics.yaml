source:
  citation: Beyer, R. P.; Ferrante, M. J.; Brown, R. R. (1980). Thermodynamic properties of KAlO2. Journal of Chemical
    Thermodynamics 12(10), 985–991. DOI 10.1016/0021-9614(80)90139-1.
  doi: 10.1016/0021-9614(80)90139-1
  year: 1980
extraction:
  method: MinerU table draft transcription cross-checked with born-digital pdftotext-layout and rendered PDF pages
    for cell and row/column verification.
  date: '2026-11-06'
  worker: w1106a-beyer80
  provenance_path: text/beyer-brown-ferrante-1980-kalo2-thermodynamics/pdftotext-layout.txt
  source_note: The source prints 54 direct Cp pairs (Table 1), 16 direct enthalpy increments (Table 2), and 59 smoothed
    rows over Table 3 pp. 988–989. Authors state both experimental Cp and enthalpy were smoothed with Justice FITAB.
    They rejected their HCl-calorimeter formation enthalpies because the final solution was cloudy. Table 3 is referenced
    to 0 K, extends to 1400 K although measurements stopped at 1197.8 K, and its G column is a thermal function,
    not ΔfG.
