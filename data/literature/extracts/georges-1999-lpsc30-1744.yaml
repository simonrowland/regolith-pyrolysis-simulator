        section: Results
      units: as printed
      values:
        quantity: residue_composition_vs_time
        method_class: measured_direct
        note: Measured results are retained in context because the existing residue-composition source fields have
          no K2O wt% field; no new quantity token or schema field was introduced.
        printed_values:
          experiment_1_conditions: K-free silicate melt (57.6 wt% SiO2, 15.1 wt% Al2O3, 15.3 wt% CaO, 12 wt% MgO)
            and K-bearing silicate melt (44.2 wt% SiO2, 14.9 wt% Al2O3, 12.6 wt% CaO, 10.2 wt% MgO, 18.1 wt% K2O),
            both at 1400°C, PO2 = 10^-16.2 atm and PK = 10^-3.5 atm.
          experiment_1_result: Both compositions reach steady state after 150 minutes at 6.0 ± 0.5 wt% K2O.
          experiment_2_conditions: K-free silicate melt (57.6 wt% SiO2, 15.1 wt% Al2O3, 15.3 wt% CaO, 12 wt% MgO),
            1400°C, PO2 = 10^-12.9 atm, PK = 2.6 × 10^-4 atm; Fig. 2 inset prints PK = 10^-3.6 atm.
          experiment_2_result: Equilibrium is reached in less than 90 minutes with 11.2 wt% K2O in the melt.
          discussion_result: K2O contents up to 10 wt% were obtained in less than one hour.
          isotope_result: The abstract reports time-dependent δ41K measurements and qualitative homogenization,
            but prints no numeric δ41K values in text.
