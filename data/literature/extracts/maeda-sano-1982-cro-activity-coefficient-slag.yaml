source:
  citation: >-
    Maeda, M. and Sano, N. (1982), “Thermodynamics of Chromium Oxide in Molten
    CaO-MgO-Al2O3-SiO2 Slags Coexisting with Solid Carbon”, Tetsu-to-Hagane
    68(7), 759–766.
  doi: 10.2355/tetsutohagane1955.68.7_759
  year: 1982
  corpus_asset: raw/maeda-sano-1982-cro-activity-coefficient-slag/maeda-sano-1982-cro-activity-coefficient-slag.pdf
extraction:
  method: >-
    The eight page Japanese paper was rendered at 350 dpi and read page by page.
    Gamma values at 1500 °C were digitized from Fig. 14; equilibrium chromium
    values at 1650 °C and their slag coordinates were read from Fig. 11. The
    activity values a_CrO are transcribed from Eqs. (12) and (13) on published
    page 764. Figure-reading uncertainty is recorded in the native CSV and each
    observation; the paper does not print individual measurement uncertainties.
  date: '2026-11-20'
  worker: w1120maeda
