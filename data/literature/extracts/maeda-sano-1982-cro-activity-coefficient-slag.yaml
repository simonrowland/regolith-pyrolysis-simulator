schema_version: literature_extract.v1
source_id: maeda-sano-1982-cro-activity-coefficient-slag
source:
  citation: >-
    Maeda, M. and Sano, N. (1982), “Thermodynamics of Chromium Oxide in Molten
    CaO-MgO-Al2O3-SiO2 Slags Coexisting with Solid Carbon”, Tetsu-to-Hagane
    68(7), 759–766.
  doi: 10.2355/tetsutohagane1955.68.7_759
  year: 1982
  corpus_asset: raw/maeda-sano-1982-cro-activity-coefficient-slag/maeda-sano-1982-cro-activity-coefficient-slag.pdf
extraction:
  method: >-
    The eight page Japanese paper was rendered at 350 dpi and read page by page.
    Gamma values at 1500 °C were digitized from Fig. 14; equilibrium chromium
    values at 1650 °C and their slag coordinates were read from Fig. 11. The
    activity values a_CrO are transcribed from Eqs. (12) and (13) on published
    page 764. The six 1650 °C gamma values were recalculated from Eq. (13), the
    printed Cr concentrations, and composition-specific total mole amounts on the AlO1.5
    basis. Footnote 3's simple ppm conversion is approximate and was not used
    for these MgO-bearing slags. A ±1 wt% Fig. 11 composition-coordinate
    digitization bound is propagated by exchanging MgO and Al2O3 at fixed CaO
    and SiO2. Fig. 14 gamma digitization uncertainty is estimated as ±3 units;
    the paper reports no point-specific measurement errors.
