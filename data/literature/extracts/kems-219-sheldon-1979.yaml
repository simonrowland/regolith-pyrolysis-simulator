    - observation_id: sheldon_1979_experimental_method
      type: method
      locator:
        published_page: 231
        pdf_page_index: 254
        section: Introduction and experimental
      units: as printed
      values:
        quantity: experimental_method
        method_class: kems
        evidence_class: method_only
        purpose_as_printed: >-
          The purpose of the present work was to measure these relative
          cross-sections for Ti and TiO which are the principal species
          over the titanium oxides less rich in oxygen than Ti2O3.
        instrument_as_printed: Nuclide mass spectrometer
        cell_as_printed: tungsten Knudsen cell
        energy_calibration_as_printed: The mass spectrometer was calibrated from the appearance potential of Hg+.
        electron_energies_eV_as_printed: ['9.7', '11.7', '13.7', '21.7', '31.7', '41.7', '71.7']
        ti_ag_experiment_as_printed: >-
          In the first experiment 1.25 mg of silver and 1.30 mg of
          titanium were loaded together in a tungsten Knudsen cell and
          were successively vaporized in a Nuclide mass spectrometer.
          The silver was vaporized first at temperatures ranging from
          1346 K to 1772 K, and then the titanium was vaporized at
          temperatures ranging from 1776 K to 2368 K.
        ti3o5_ag_experiment_as_printed: >-
          In the second experiment 1.79 mg of silver and 0.70 mg Ti3O5
          were vaporized in the mass spectrometer at temperatures ranging
          from 1319 K to 1402 K and 1953 K to 2009 K, respectively.
        titanium_sample_as_printed: Laboratory designation Ti-6
        ti3o5_sample_as_printed: >-
          The Ti3O5 sample, designated PJH-7, whose composition was
          Ti3O5.015 as determined by oxygen combustion analysis.
        congruent_assumption_as_printed: >-
          stoichiometric Ti3O5 vaporizes congruently to give two
          molecules of TiO2(g) and one of TiO(g)
        previous_work_1806K_as_printed: >-
          In recent work [1] the authors reported values for equilibrium
          pressures of Ti(g) and TiO(g) over stoichiometric titanium
          monoxide at 1806 K. ... In the first experiment 0.57 mg of a
          10.24-mg sample of stoichiometric titanium monoxide was
          vaporized in vacuum from a tungsten Knudsen cell.
        previous_pressures_reprinted: false
        note: >-
          The 1806 K equilibrium pressures of [1] are not reprinted in
          this chapter and were not invented. Sample designations and
          loaded masses are as printed.
