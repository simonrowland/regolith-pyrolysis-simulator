        caption_as_printed: Relative electron impact cross-sections of Ti and TiO.
        column_notes_as_printed: >-
          The measured products of electron multiplier gain and ionization
          cross-section of Ti(g) and TiO(g) relative to silver are given
          in the second and fourth columns in table 1. The uncertainties
          in these results based on uncertainties in the masses,
          multiplier gains, and A-values, are estimated to be about 10
          percent. The relative ionization cross-sections shown in the
          third and fifth columns of table 1 have been calculated from
          the results and the measured electron multiplier gains.
        final_column_as_printed: >-
          The relative ionization cross-section σ_TiO/σ_Ti in the final
          column is obtained by division. The value at 13.7 eV of 1.17
          is insignificantly different from the ratio 1.15 used
          previously [1]; hence, changes in the pressures are
          insignificant.
