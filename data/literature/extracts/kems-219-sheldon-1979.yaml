source:
  citation: >-
    Sheldon, R. I., and Gilles, P. W. (1979). The High Temperature
    Vaporization and Thermodynamics of the Titanium Oxides. XIV.
    Relative Ionization Cross-Sections of Ti, TiO, and TiO2, in
    Hastie, J. W. (ed.), Characterization of High Temperature Vapors
    and Gases, NBS Special Publication 561, Vol. 1, pp. 231-236,
    National Bureau of Standards, Washington, DC. Proceedings of the
    10th Materials Research Symposium, Gaithersburg, Maryland,
    September 18-22, 1978. Issued October 1979.
  doi: 10.6028/NBS.SP.561v1
  doi_scope: volume; this extract is the Sheldon and Gilles chapter only (printed pp. 231-236)
  url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nbsspecialpublication561v1.pdf
  year: 1979
  corpus_asset: raw/hastie-1979-characterization-of-high-temperature/hastie-1979-characterization-of-high-temperature.pdf
  corpus_sha256: 5d49070831fdc68ca308fa85c9ea96203e6d717ac72ad65cd280ed2f562d44a2
extraction:
  method: >-
    Manual transcription from the NBS SP 561 Vol. I scan already on the
    box. Printed pages 231-236 are PDF pages 255-260 (pdf_page_index
    254-259; PDF page = printed page + 24). Pages were rendered at 200
    and 400 dpi and read as images; pdftotext was used only as a
    cross-check. Table 1 was read cell-by-cell from a 400 dpi crop.
    Relative ionization cross-sections have no closed scored observation
    type in literature_extract.v1, so Table 1 and the measured
    multiplier gains are stored as context, not scored. Printed page 236
    is blank in this scan (recto bleed only). The right margin of printed
    page 234 is cropped by the binding; words at the line ends, including
    the electron energy of the TiO2+ measurements, are not fully
    printed and were not invented. Distinct from sheldon-gilles-1976-tio-vaporization-coo-1140-219
    and from kems-042-plante-1979 in the same volume.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/hastie-1979-characterization-of-high-temperature/
