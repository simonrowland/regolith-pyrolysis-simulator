        gases:
        - gas: H2
          release_temperature_as_printed: mostly 200-600 °C
          mass_channel_as_printed: 2
        - gas: N2
          release_temperature_as_printed: mostly 200-600 °C
          mass_channel_used_for_amounts: 14
        - gas: H2O
          release_temperature_as_printed: mostly 200-600 °C
          mass_channel_as_printed: 18
          quantification_status: lower limit only; some water condensed in the vacuum line between furnace and QMS
          condensation_effect: release pattern stated not to be affected by condensation
        - gas: CO2
          release_temperature_as_printed: higher temperatures; mass 16 pattern almost identical
          mass_channel_as_printed: 44 and 16
          interpretation_as_printed: mass 16 similarity suggests a small amount of methane
        - gas: CO
          release_temperature_as_printed: higher temperatures
          mass_channel_as_printed: 12
          note: mass 28 is essentially CO because it has an identical spectrum to mass 12
        common_feature: except for water and CO, most gases show a spike at approximately 700 °C, probably reflecting chemical reactions or structural transformation
      uncertainty:
        water_amount: lower limit only; no numerical uncertainty printed
