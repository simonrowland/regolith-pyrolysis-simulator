        units: mol% composition; Tg in °C; α in ppm/K; density in g/cm3; refractive-index data as printed
        reason: >-
          Whole-glass composition has no applicable composition-vector quantity
          token. Tg, thermal expansion, optical constants and temperatures at
          fixed viscosity have no matching observation form here. Density has
          a quantity token, but its canonical unit is kg/m3 and the migrator
          currently emits the printed g/cm3 number unchanged (2.85 instead of
          2850 kg/m3); it is retained here pending the required converter fix.
        values:
          quantity_as_printed: composition_and_properties_of_AS_and_ABS_base_glasses
          method_class: measured_direct
          points:
