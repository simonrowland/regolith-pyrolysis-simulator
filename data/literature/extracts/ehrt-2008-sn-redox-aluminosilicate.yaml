    value: '0.20'
    note: Table 1 and prose locate the AS glass at 1600°C under air; the prose gives the calibrated Sn2+ content as approximately 20%.
    locator: {page: 4, pdf_page_index: 3, published_page: 71, section: Results and discussion}
