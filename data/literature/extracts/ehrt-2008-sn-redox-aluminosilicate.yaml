schema_version: literature_extract.v1
source_id: ehrt-2008-sn-redox-aluminosilicate
source:
  citation: >-
    Ehrt, D. (2008). Redox behaviour of Sn4+/Sn2+ in alkali free
    aluminosilicate glasses and melts. Physics and Chemistry of Glasses:
    European Journal of Glass Science and Technology Part B, 49(2), 68–72.
  year: 2008
extraction:
  method: >-
    Publisher-layout PDF read with pdftotext-layout; Table 1 and Table 2
    checked against a 600 dpi render of physical page 2. The source text
    reports redox fractions in prose. Figure-derived chart transcriptions in
    MinerU <details> blocks are excluded and all Figures 1–8 are deferred.
    Table 1's whole-glass compositions and non-token properties are retained
    in context because the schema has no general glass-composition vector.
    Table 2's fitted UV
    absorption coefficients have no quantity token.
  date: '2026-10-20'
  worker: codex
  provenance_path: raw/ehrt-2008-sn-redox-aluminosilicate/ehrt-2008-sn-redox-aluminosilicate.pdf
review_status: draft
fidelity_samples:
