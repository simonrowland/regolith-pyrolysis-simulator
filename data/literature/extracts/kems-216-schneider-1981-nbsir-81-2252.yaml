    - observation_id: schneider_1980_summary_phase_status
      type: statement
      locator:
        page: 5
        published_page: 1
        pdf_page_index: 4
        section: Summary of Progress to Date
      units: located context
      values:
        printed_qualification: A series of 3 types of experiments for conclusive test of subsolidus equilibria
          involving 12 compounds in the system K2O-CaO-Al2O3-SiO2 has been devised and is nearly complete.
          Initial indications are that the previously postulated equilibrium diagram is essentially correct.
          However, an important modification must be made to allow for the presence of potassium-deficient
          KAlSi2O6 (ss). Existence of this previously unreported solid solution may have significant effect
          on the thermodynamics of K2O vaporization or absorption involving this phase.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_summary_conductivity_range
      type: statement
      locator:
        page: 5
        published_page: 1
        pdf_page_index: 4
        section: Summary of Progress to Date
      units: located context
      values:
        printed_qualification: Both AC and DC conductivity measurements have been initiated on a Western
          slag derived from coal from the Rosebud seam in Montana. These measurements are designed to
          investigate the conductivity mechanism in this slag which contains a minimal amount of iron
          (approximately 4 w/o) compared to a typical Eastern slag (approximately 12–16%). In this report,
          primary emphasis is placed on measurements in the temperature range between 1200 and 1500 °C.
          Measurements were made on a sample of yttria stabilized zirconia in an effort to verify the
          measurement technique on a purely ionic conductor of a given single phase composition.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_summary_corrosion
      type: statement
      locator:
        page: 5
        published_page: 1
        pdf_page_index: 4
        section: Summary of Progress to Date
      units: located context
      values:
        printed_qualification: Optical and SEM and EDX analysis were undertaken on sections of Type 316
          stainless steel tubing exposed to fuel rich and oxygen rich hot gas streams seeded with 80%
          by weight K2CO3 and 20% by weight K2SO4. Analysis revealed only slight differences as a result
          of the hot gas stream state. Distribution of species, Fe, Ni and Cr in the reaction zone (stainless
          steel–deposit interface) paralleled observations made on Type 304 stainless steel and detailed
          in previous reports.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_phase_model_scope
      type: statement
      locator:
        page: 9
        published_page: 5
        pdf_page_index: 8
        section: Phase Equilibrium Studies
      units: located context
      values:
        printed_qualification: The portion of the system under consideration (Fig. 2) involves 12 crystalline
          solids and 13 four-phase volumes. The first melt to appear upon heating each of the four-phase
          combinations bears a definite relationship to thermodynamic properties of the solids involved,
          allowing calculation of an equilibrium pK2O. This forms the basis for a quantitative four-component
          model to calculate potassium activities as a function of composition for K2O-CaO-Al2O3-SiO2
          melts simulating Western slags. The phase-equilibrium-derived model supplements models based
          on direct measurements of potassium pressures.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_phase_experiment_details
      type: statement
      locator:
        page: 9
        published_page: 5
        pdf_page_index: 8
        section: 1000-Hour Subsolidus Equilibrations
      units: located context
      values:
        printed_qualification: These experiments are conducted at 1200 °C for 9 of the 13 four-phase volumes
          and at lower temperatures for assemblages containing KAlSi3O8. The procedure is to seal carefully
          mixed equal weights of four solids thought to be in equilibrium in Pt capsules, heat them, quench,
          examine by X-ray, regrind, reseal and reheat. Thermodynamically important solid solutions can
          be detected by subtle shifts in X-ray parameters.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_glass_crystallization
      type: statement
      locator:
        page: 12
        published_page: 8
        pdf_page_index: 11
        section: Glass Crystallization Experiments
      units: located context
      values:
        printed_qualification: A third type of experiment designed to test phase relations proposed in
          Fig. 2 involves melting mixtures from postulated four-phase volumes, quenching to a glass, crushing
          and crystallizing. Previously, this type of experiment was not successful owing to incomplete
          crystallization. Periodic grinding and slight hydration may prove beneficial. These experiments
          are not yet complete and results will be discussed in the next quarterly report.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_subsolidus_plans
      type: statement
      locator:
        page: 12
        published_page: 8
        pdf_page_index: 11
        section: Plans
      units: located context
      values:
        printed_qualification: Finalize subsolidus equilibria in (Si, Al)-rich K2O-CaO-Al2O3-SiO2 and
          prepare results for publication. Determine accurately the composition of 13 minimum melts in
          the quaternary system. Continue modeling quaternary liquidus surfaces and subsolidus equilibria
          in the K2O-rich portion involving K2CaSiO4 and K2Si2O5.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_conduction_mechanism
      type: statement
      locator:
        page: 17
        published_page: 13
        pdf_page_index: 16
        section: Electrical Conductivity and Polarization
      units: located context
      values:
        printed_qualification: The QR July–Sept. 1972 from this laboratory discussed slag conduction in relation
          to iron content and semiconducting electron exchange between Fe+2 and Fe+3 ions. The activation
          energies displayed by the high-temperature data in these slag samples are higher than would be expected
          from a semiconducting transition involving iron. Since σ = neμ, with carrier concentration n nearly
          constant with T and carrier mobility μ, mobility may be the predominant activated process and would
          then depend on phase composition in a given temperature range. The phase composition of these slags
          must be studied in correlation with the temperature ranges where the data show activated processes.
          Careful attention must also be paid to slag viscosity above the melting point and its possible effect
          on conductivity.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_zro2_assessment
      type: statement
      locator:
        page: 18
        published_page: 14
        pdf_page_index: 17
        section: ZrO2 Conductivity
      units: located context
      values:
        printed_qualification: The yttria-stabilized zirconia was not well suited to demonstrate the viability
          of the analytical technique because electrode reversibility to the transported oxygen ion is
          not zero and oxygen is a component in the atmosphere, so exchange can occur in near-electrode
          areas and eliminate polarization in air. Another ionically conducting material should be used
          where the conducting ion does not react with the electrode and does not readily exchange with
          ambient atmosphere up to approximately 1500 °C.
        method_class: quoted_unattributed
        attribution: this report
