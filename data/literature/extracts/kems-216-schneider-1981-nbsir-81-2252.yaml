      units: as printed
      values:
        numeric_context_as_printed:
        - 'Rosebud slag: 20 w/o K2SO4 added; electrical properties intended over 500–1500 °C; one week is
          an example finite measurement-set time; equilibration threshold Δσ/Δt < 50 ppm/hour near 1000 °C;
          interpret above 1000 °C as characteristic; lower-temperature data depend on prior treatment.'
        - The Seventh International Conference on MHD Electrical Power Generation was held at MIT, Cambridge,
          Massachusetts, June 16–20, 1980, session 07. Eastern slag curves with no added potassium show two
          slopes above 1100 °C; Bow, NH slag as received had 14 w/o iron and added-iron slags also show two-slope
          regions. The highest-temperature slope gives approximately 1.8 eV activation energy; the steeper
          lower-temperature slope reaches near 4.0 eV and depends strongly on equilibration time. Rosebud’s
          high-temperature slope appears the same as Eastern slag but the conductivity magnitude there is
          reduced by about a factor of three. The report says activation energy is independent of iron content
          while conductivity magnitude depends on iron content.
