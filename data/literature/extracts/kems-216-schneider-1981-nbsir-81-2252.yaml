    - observation_id: schneider_1980_equilibration_progress
      type: statement
      locator:
        page: 9
        published_page: 5
        pdf_page_index: 8
        section: 1000-Hour Subsolidus Equilibrations
      units: as printed
      values:
        printed_qualification: So far no shifts have been detected after 764 hours. However, evidence
          has been found for potassium-deficient KAlSi2O6 (ss) showing no change in unit cell parameters.
          The 1000-hour equilibrations are approximately 90 percent complete at the time of writing.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_tieline_qualifications
      type: statement
      locator:
        page: 12
        published_page: 8
        pdf_page_index: 11
        section: Solid-State Tie Line Reactions
      units: as printed
      values:
        printed_qualification: Reactions 1, 2, 3, 4, 6 and 7 have unquestionably gone to the right. The
          existence of extra phases among the products of reactions 1, 6 and 7 is probably a matter of
          incomplete reaction. In the case of reaction 5, the mullite peak detectable in the starting
          material disappears with concomitant increase in intensity of the leucite lines. This observation
          has been made in numerous other experiments, and all results taken together constitute very
          strong evidence for extension of a leucite (ss) field toward potassium-deficient compositions.
          However, the long-term equilibrations discussed above indicate that the Kls + An tie line is
          probably stable; therefore, the existence of Lc (ss) + Ge at the expense of Kls + An in tie
          line reaction 5 is possibly a kinetic phenomenon. Alternatively, there may be a Kls (ss) field
          such that Kls coexisting with An is potassium deficient.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_tieline_exclusions
      type: statement
      locator:
        page: 10
        published_page: 6
        pdf_page_index: 9
        section: Solid-State Tie Line Reactions
      units: as printed
      values:
        printed_qualification: Tie line reactions 8 and 9 were not investigated because of the current unavailability
          of KAlSi3O8 starting materials. Study of tie line reactions 10 and 11 was not successful due to
          the low-melting nature of these compositions.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_rosebud_comparison
      type: statement
      locator:
        page: 16
        published_page: 12
        pdf_page_index: 15
        section: Slag Conductivity
      units: as printed
      values:
        printed_qualification: This slag is considerably lower in iron content than the Eastern slag measured
          previously, but has a larger amount of calcium. 20 w/o K2SO4 has been added to the base slag. Phase
          separation during potassium addition rejects some potassium, so final material contains less potassium
          than the amount of K2SO4 added would indicate. Rejection is enhanced with slags containing large
          amounts of calcium. Final potassium analysis is planned.
        method_class: quoted_unattributed
        attribution: this report
        previous_reports_as_printed: QR July–Sept. and October, 1973
    - observation_id: schneider_1980_conductivity_temperature_dependence
      type: statement
