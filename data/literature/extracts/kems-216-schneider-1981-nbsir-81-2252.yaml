        pdf_page_index: 15
        section: Slag Conductivity
      units: as printed
      values:
        printed_qualification: The dividing line in this material below which an equilibrated value (Δσ/Δt
          < 50 ppm/hour) of conductivity cannot be obtained easily is near 1000 °C. Therefore, it seems
          prudent to discuss only the data above 1000 °C as characteristic of the material at a given
          temperature. Data at lower temperatures is dependent on the past treatment and cannot be treated
