    - observation_id: schneider_1980_summary_pressure_trend
      type: statement
      locator:
        page: 5
        published_page: 1
        pdf_page_index: 4
        section: Summary of Progress to Date
      units: as printed
      values:
        printed_qualification: New K pressure data on a Western-type slag initially containing 20 wt%
          K2O are presented. The decrease in K pressure with decreasing K2O composition is less than in
          previous measurements. Analysis of previous data shows a decrease in K pressure of 20 percent
          for unit decrease in wt% K2O and an increase in K pressure of 8 percent for unit increase in
          wt% CaO.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_activity_trend
      type: statement
      locator:
        page: 6
        published_page: 2
        pdf_page_index: 5
        section: Vaporization Studies
      units: as printed
      values:
        printed_qualification: Previous measurements have shown within the limited composition ranges
          studied that the K2O activity as determined from measurements of the K and O2 pressures is insensitive
          to the individual Al2O3 and SiO2 concentrations, but is decreased as the sum of the Al2O3 and
          SiO2 concentrations is increased, increased by an increasing CaO concentration and increased
          by an increasing K2O concentration.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_vp4_comparison
      type: statement
      locator:
        page: 6
        published_page: 2
        pdf_page_index: 5
        section: Vaporization Studies
      units: as printed
      values:
        printed_qualification: Qualitatively, the agreement is satisfactory but the decrease in K pressure
          with K2O composition is not as great as was observed in the KCAS-VP-1 experiments. Thus, K pressures
          shown with a K2O concentration in the 7–10 wt% range are about a factor of 2 greater than those
          from the KCAS-VP-1 experiment when the condensed phase contains 14.8–12.4 wt% K2O. It does not
          appear likely that this difference is due to variations in the concentrations of the other constituents
          in the melt because the CaO concentration is actually greater for the KCAS-VP-1 melt by a few
          percent while the Al2O3 and SiO2 concentrations vary by only a few percent.
        method_class: quoted_unattributed
        attribution: this report
    - observation_id: schneider_1980_vp23_fit_comparison
      type: statement
      locator:
        page: 7
        published_page: 3
        pdf_page_index: 6
        section: Vaporization Studies
      units: as printed
      values:
        printed_qualification: In the previous report, it was noted that measurements in the KCAS-VP-2
          and KCAS-VP-3 series appeared to be consistent with each other if the K pressure was dependent
