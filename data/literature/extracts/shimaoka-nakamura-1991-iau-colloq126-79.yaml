      units: as printed
      values:
        quantity: prior_vaporization_relation_and_assumptions
        method_class: quoted_attributed
        attribution: Shimaoka and Nakamura (1989), as cited by the authors.
        equation: ln(C/C0) = -k(f S_tot/V_p)t
        symbol_definitions: C and C0 are concentrations in run product and starting material; k vaporization rate; S_tot overall
          charge surface area; V_p partial-melt volume; t heating duration; f effective melt surface area divided by total
          charge surface area.
        f_estimate:
          value: 0.2
          qualification: tentatively estimated
        stated_assumption: f, S_tot, and V_p are constant during heating; a linear relation of t and ln(C/C0) is expected.
