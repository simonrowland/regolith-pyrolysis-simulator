schema_version: literature_extract.v1
source_id: gail-2013-sio-nucleation-silicate-dust
source:
  citation: >-
    Gail, H.-P., Wetzel, S., Pucci, A. & Tamanai, A. (2013). Seed particle formation for silicate dust condensation by SiO nucleation. Astronomy & Astrophysics, 555, A119.
  url: https://arxiv.org/abs/1305.2879
  year: 2013
extraction:
  method: >-
    Manual transcription from MinerU machine text and pdftotext-layout, with targeted PDF page renders for flagged superscripts, coefficient uncertainties, and Table 1 row and column assignments. Table 1 is retained as unscored model-output context. Figure points were not digitized.
  date: '2026-11-02'
  worker: w1103cw2-gl13
review_status: draft
evidence_policy:
  classification: measured_reductions_quoted_comparisons_model_output_and_figure_candidates
  measurement_claim: >-
    The authors measured SiO vaporisation coefficient and equilibrium vapour pressure using Knudsen-cell mass loss measured by a quartz crystal microbalance. Equations (3) and (4) are their measured reductions; numeric figure points in Figures 2 and 3 are not transcribed. Equations (6) and (7) are comparison vapour-pressure relations quoted from Ferguson & Nuth (2008) and Schick (1960). Nuth and Donn's onset-rate estimates and the later empirical fit are quoted from this paper; their input points are plotted only in Figures 5 and 6. Table 1 is the authors' dust-driven-wind model output and is retained as model_derived context.
  missing_values: >-
    Figure 2 and Figure 3 points are represented by figure_only rows and were not digitized. The three nucleation-rate rows remain unavailable with quantity unknown because the schema has no nucleation_rate quantity; no point temperature or total pressure was assigned where the paper gives no single value for the quoted range or fit.
