schema_version: literature_extract.v1
source_id: gail-2013-sio-nucleation-silicate-dust
source:
  citation: >-
    Gail, H.-P., Wetzel, S., Pucci, A. & Tamanai, A. (2013). Seed particle formation for silicate dust condensation by SiO nucleation. Astronomy & Astrophysics, 555, A119.
  url: https://arxiv.org/abs/1305.2879
  year: 2013
extraction:
  method: >-
    Manual transcription from MinerU machine text and pdftotext-layout, with targeted PDF page renders for flagged superscripts, coefficient uncertainties, and Table 1 row and column assignments. Table 1 is retained as unscored model-output context. Figure points were not digitized.
  date: '2026-11-02'
  worker: w1103cw2-gl13
review_status: draft
evidence_policy:
  classification: quoted_fits_model_output_context_and_figure_candidates
  measurement_claim: >-
    The authors measured SiO vapour pressure using Knudsen-cell mass loss and a quartz crystal microbalance. Numeric pressure points are plotted only in Figure 3 and are not transcribed. Equation (4) is the printed fit to those measurements. Nuth and Donn's onset-rate estimates and the later empirical fit are quoted from this paper; their input points are plotted only in Figures 5 and 6. Table 1 is the authors' dust-driven-wind model output and is retained as model_derived context.
  missing_values: >-
    No plotted points were digitized. The three nucleation-rate rows remain unavailable with quantity unknown because the schema has no nucleation_rate quantity; no point temperature or total pressure was assigned where the paper gives no single value for the quoted range or fit.
species:
  SiO:
    observations:
      - observation_id: gail_2013_sio_vapor_pressure_fit_eq4
        type: psat_series
        locator:
          page: 3
          published_page: 3
          section: 2.2 Experimental setup
          equation: '4'
        phase: gas
        units: dyn cm−2
        point_conditions:
          temperature_K:
            state:
              tag: unknown
              reason: The fitted equation is a function of T and no single point temperature is printed.
            locator:
              page: 3
              equation: '4'
          total_pressure_Pa:
            state:
              tag: unknown
              reason: The vapour pressure is the output; no experimental total pressure is printed.
            locator:
              page: 3
              equation: '4'
          fO2_Pa:
            state:
              tag: unknown
              reason: No oxygen fugacity is printed for the Knudsen-cell measurements.
            locator:
              page: 3
              equation: '4'
        uncertainty:
          coefficients_as_printed: T_v = 49 520 ± 1 400 K; S_v = 32.52 ± 0.97
          confidence_level: not_stated
          notice: Confidence level not stated.
        values:
          quantity: pure_vapor_pressure
          method_class: quoted_attributed
          attribution: Gail et al. (2013), equation (4), fitted to their measured SiO vapour-pressure data; the laboratory measurements are also described in Wetzel et al. (2012a).
          equation_as_printed: P = exp(−T_v/T + S_v)
          coefficients_as_printed:
            T_v: 49 520 ± 1 400 K
            S_v: 32.52 ± 0.97
          pressure_species: SiO(g)
          condensed_reservoir: solid SiO
          fit_basis_as_printed: Best fit to the experimental data points.
          measurement_method_as_printed: >-
            Knudsen method; the cell mass-loss rate was measured with a quartz crystal microbalance. Two cell orifices of 0.50 mm and 0.79 mm diameter were used to determine vapour pressure and vaporisation coefficient. The cell was heated by electron bombardment with an electron-beam evaporator.
          reduction_as_printed: >-
            The Knudsen-cell mass-loss measurement gives P_K(T) by equation (1); the equilibrium vapour pressure is obtained using the Whitman–Motzfeld equation (2) and the vaporisation coefficient fit (3).
      - observation_id: gail_2013_nuth_donn_smoke_onset_rate_range
        type: rate_series
        locator:
          page: 4
          published_page: 4
          section: 4.1 Re-evaluation of the Nuth & Donn data
          paragraph: Smoke-onset criterion and rate estimate
        phase: gas
        units: particles cm−3 s−1
        point_conditions:
          temperature_K:
            state:
              tag: unknown
              reason: The printed rate interval is not paired with a temperature in the prose.
            locator:
              page: 4
              section: 4.1
          total_pressure_Pa:
            state:
              tag: unknown
              reason: No single total pressure is stated with this prose rate interval.
            locator:
              page: 4
              section: 4.1
          fO2_Pa:
            state:
              tag: unknown
              reason: No oxygen fugacity is printed for the hydrogen-atmosphere experiment.
            locator:
              page: 4
              section: 4.1
        values:
          quantity: nucleation_rate_at_smoke_onset_as_printed
          method_class: quoted_attributed
          attribution: Nuth & Donn (1982), as reported by Gail et al. (2013).
          rate_interval_as_printed: between 10^8 and 10^10 particles cm−3 s−1
          method_as_printed: >-
            Smoke onset was defined as the instant when extinction of a 200 nm light beam traversing the condensation zone reached 1%; the nucleation rate at onset was only crudely estimated.
          experimental_system_as_printed: >-
            Solid SiO was evaporated from a crucible into a hydrogen atmosphere to prepare a gas mixture containing only SiO and H2 molecules.
          pressure_estimate_method_as_printed: The condensation-zone pressure was estimated to be 1/10 of the vapour pressure at the crucible.
          schema_gap: >-
            No exact nucleation-rate quantity token exists. Keep the printed interval unavailable instead of inferring mass_loss_rate from rate_series; see simulator/battery/enums.py::Quantity, simulator/battery/migrate.py::QUANTITY_ALIASES, simulator/battery/migrate.py::TYPE_QUANTITY, and tools/validate_literature_extracts.py::OBSERVATION_TYPES.
