schema_gaps:
  - quantity: nucleation_rate
    code_checked:
      - simulator/battery/enums.py::Quantity
      - simulator/battery/migrate.py::QUANTITY_ALIASES
      - simulator/battery/migrate.py::TYPE_QUANTITY
      - tools/validate_literature_extracts.py::OBSERVATION_TYPES
    candidate_type: rate_series
    reason: >-
      rate_series is accepted, but TYPE_QUANTITY defaults it to mass_loss_rate and QUANTITY_ALIASES has no nucleation_rate token. The three Nuth & Donn rate/rate-fit observations therefore carry explicit descriptive quantity labels and migrate as quantity-unknown typed refusals.
  - quantity: mixed_wind_model_outputs_in_Table_1
    code_checked:
      - simulator/battery/enums.py::Quantity
      - tools/validate_literature_extracts.py::OBSERVATION_TYPES
    reason: >-
      Table 1 mixes stellar parameters, sonic-point properties, condensation fractions, terminal velocity, and optical depths. There is no single exact observation quantity or model_output observation type for this table; its complete row data remain in the existing unscored context container with method_class model_derived.
