          average_rate_as_printed: J_av = 10^(9±1) particles cm−3 s−1
          use_as_printed: Fixed value used to re-evaluate the experimental results.
          schema_gap: >-
            No exact nucleation-rate quantity token exists. Keep the printed estimate unavailable instead of inferring mass_loss_rate from rate_series; see simulator/battery/enums.py::Quantity, simulator/battery/migrate.py::QUANTITY_ALIASES, simulator/battery/migrate.py::TYPE_QUANTITY, and tools/validate_literature_extracts.py::OBSERVATION_TYPES.
      - observation_id: gail_2013_sio_nucleation_rate_fit_eq16
        type: rate_series
        locator:
          page: 5
          published_page: 5
          section: 4.2 Fit for the nucleation rate
          equation: '16'
        phase: gas
        units: particles cm−3 s−1
        point_conditions:
          temperature_K:
            state:
              tag: unknown
              reason: Equation (16) is a function of T, S, and n1; no single point temperature is printed.
            locator:
              page: 5
              equation: '16'
          total_pressure_Pa:
            state:
              tag: unknown
              reason: The printed equation is fitted across the experimental series and has no single total pressure.
            locator:
              page: 5
              equation: '16'
          fO2_Pa:
            state:
              tag: unknown
              reason: No oxygen fugacity is printed for the hydrogen-atmosphere experiment.
            locator:
              page: 5
              equation: '16'
        uncertainty:
          coefficients_as_printed: a = (4.40 ± 0.61) × 10^12; b = 22.05 ± 3.14; exponent constant = 1.33 ± 3.1
          confidence_level: not_stated
          notice: Confidence level not stated.
        values:
          quantity: nucleation_rate_equation_as_printed
          method_class: quoted_attributed
          attribution: Gail et al. (2013), equation (16), fitted to re-evaluated Nuth & Donn (1982) data.
          equation_as_printed: J = n1^2 exp[(1.33 ± 3.1) − ((4.40 ± 0.61) × 10^12)/(T^3 (ln S)^2)]
          fit_coefficients_as_printed:
            equation_15_a: (4.40 ± 0.61) × 10^12
            equation_15_b: 22.05 ± 3.14
            equation_16_exponent_constant: 1.33 ± 3.1
          fit_inputs_as_printed: n1 and S for given T from Nuth & Donn (1982), corrected using the new vapour-pressure formula; their numeric data points occur in Figures 5 and 6 and are not transcribed.
          input_series_pressure_conditions_as_printed:
            - pH2 = 50 Torr (black dots in Figure 5)
            - pH2 = 35 Torr (crosses in Figure 5)
          schema_gap: >-
            No exact nucleation-rate quantity token exists. Keep the empirical fit unavailable instead of inferring mass_loss_rate from rate_series; see simulator/battery/enums.py::Quantity, simulator/battery/migrate.py::QUANTITY_ALIASES, simulator/battery/migrate.py::TYPE_QUANTITY, and tools/validate_literature_extracts.py::OBSERVATION_TYPES. The empirical fit is quoted_attributed because its numeric input points are only plotted and are not stored.
