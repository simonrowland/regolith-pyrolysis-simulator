          equation_12_Fe: {published_page: 641, pdf_page_index: 5, equation: '12'}
          equation_20: {published_page: 643, pdf_page_index: 7, equation: '20'}
          equation_21: {published_page: 643, pdf_page_index: 7, equation: '21'}
          equation_22: {published_page: 643, pdf_page_index: 7, equation: '22'}
          conclusion_restatement: {published_page: 644, pdf_page_index: 8, section: 'V. Conclusion'}
        ranges_and_units: Temperatures in Eqs. (8) are 1550–1610 °C for liquid Fe; Eq. (10) is the Fe–O relation plotted over the paper's experimental temperature span. Eq. (8) uses the rate scale of Table 1 and oxygen in wt%; Eq. (10) uses absolute T in K and k_ad in (wt%)^-1. Eq. (12) gives mass rate per area. Eqs. (20)–(22) relate the apparent oxygen-bearing rate to surface pressure Π and temperature T; the paper presents those as a model for both liquid-metal systems.
        assumptions_and_scope: Coefficients in Eq. (8) were obtained from least-squares line fits to inverse-rate plots; Eq. (10) is a linear fit of log k_ad against 1/T. The Eq. (12) factor is rounded to 0.57 in the authors' final Fe expression. Eqs. (20)–(22) assume a monomolecular adsorption film and use the assumptions stated in the paper's Section IV.4.
