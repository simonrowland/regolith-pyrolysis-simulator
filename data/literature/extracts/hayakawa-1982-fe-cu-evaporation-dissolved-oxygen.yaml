        equations_as_printed:
          equation_1: 'w = α P sqrt(M/(2πRT)); for pure liquid-metal comparison the authors use α = 1'
          equation_4: 'w_N = w_1(1 − θ_o) + w_2 θ_o'
          equation_5: 'θ_o = k′_ad a_O/(1 + k′_ad a_O) ≈ k_ad [%O]/(1 + k_ad [%O])'
          equation_6: 'w_N = w_1 − (w_1 − w_2){k_ad [%O]/(1 + k_ad [%O])}'
          equation_7: '1/(w_1 − w_N) = 1/((w_1 − w_2) k_ad [%O]) + 1/(w_1 − w_2)'
          equation_8_Fe: '1610 °C: w_N = 4.4 − 2.4{48[%O]/(1 + 48[%O])}; 1580 °C: w_N = 3.1 − 1.8{63[%O]/(1 + 63[%O])}; 1550 °C: w_N = 2.1 − 1.2{89[%O]/(1 + 89[%O])}'
          equation_10_Fe: 'log k_ad = 15000/T − 6.41'
          equation_12_Fe: 'w_N = P sqrt(M/(2πRT)){1 − 0.57[k_ad [%O]/(1 + k_ad [%O])]}'
          conclusion_restatement: 'log k_ad = 15000/T − 6.4; w_N uses the Eq. (12) Fe expression with factor 0.57'
          equation_20: 'w_0 = w_1(1 − θ_o) = w_1/(1 + k_ad[%O])'
          equation_21: 'w_0 = C_1 exp{−(E + ΠΔS)/(kT)}'
          equation_22: 'ln w_0 = ln C_1 − (E + ΠΔS)/(kT)'
        equation_locators:
