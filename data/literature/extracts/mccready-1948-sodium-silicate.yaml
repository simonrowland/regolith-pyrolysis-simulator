      - observation_id: mccready_1948_ruff_grieger_reaction6
        type: gibbs_table
        locator: {page: 3, published_page: 1279, pdf_page_index: 2, equation: '6'}
        phase: crystalline sodium orthosilicate; reaction as reassigned by McCready
        standard_state: >-
          Reaction (6), with silicon in its standard state and crystalline
          Na4SiO4 as product; printed in calories per gram molecular weight.
        units: cal per gram molecular weight
        values:
          method_class: quoted_attributed
          quantity: reaction_enthalpy
          reaction: 2Na2O2(s) + Si(s) = Na4SiO4(cr)
          delta_H_cal_mol: -259350
          attribution: Ruff and Grieger, cited by McCready
          attribution_note: >-
            McCready notes Ruff and Grieger treated the products as sodium
            metasilicate and sodium oxide; he reassigns the product to
            orthosilicate because Na2O reacts with silica to form Na4SiO4.
      - observation_id: mccready_1948_ruff_grieger_reaction7
