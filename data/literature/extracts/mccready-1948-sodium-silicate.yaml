        derived_from: [mccready_1948_kroger_fingas_reaction11, mccready_1948_zintl_leverkus_reaction12]
        derivation:
          relation: Difference between Kröger-Fingas reaction (11) and Zintl-Leverkus reaction (12), evaluated with the stated logarithmic-pressure slopes.
          inputs: [mccready_1948_kroger_fingas_reaction11, mccready_1948_zintl_leverkus_reaction12]
        values:
          method_class: model_derived
          quantity: reaction_enthalpy
          reaction: Na6Si2O7(cr) = Na4SiO4(cr) + Na2SiO3(cr)
