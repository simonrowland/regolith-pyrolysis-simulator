metadata:
  experimental_status: literature_review_and_thermodynamic_calculation
  note: >-
    McCready reports no new calorimetric measurements in this article. The
    displayed measurements and thermochemical values are attributed to earlier
    authors; calculations made by McCready are marked model_derived. The
    repository's cal/mol unit token normalizes the printed calories per gram
    molecular weight, which the migrator converts to kJ/mol.
