  Na6Si2O7:
    observations:
      - observation_id: mccready_1948_kroger_fingas_reaction11
        type: gibbs_table
        locator: {page: 4, published_page: 1280, pdf_page_index: 3, equation: '11'}
        phase: reaction phases as assigned tentatively by McCready
        standard_state: >-
          Na2CO3(s) + Na4SiO4(s) = Na6Si2O7(s) + CO2(g), reaction assignment
          uncertain because products were not identified; printed equation's
          heat-capacity correction is not exact.
        units: log10 pressure equation, pressure unit not stated in McCready's summary
        values:
          method_class: quoted_attributed
          quantity: equilibrium_log_pressure_relation
          reaction: Na2CO3(s) + Na4SiO4(s) = Na6Si2O7(s) + CO2(g)
          log_p_relation_as_printed: 'log p = 9.13 - 5570/T'
          temperature_range: 1050 to 1150°C
          attribution: Kröger and Fingas (1935)
          caveat: McCready says the products were not identified and this reaction assignment is not certain.
      - observation_id: mccready_1948_kroger_fingas_reaction9
        type: gibbs_table
        locator: {page: 4, published_page: 1280, pdf_page_index: 3, equation: '9'}
        phase: carbonate and crystalline sodium metasilicate/pyrosilicate as tentatively assigned by McCready
        standard_state: >-
          Na2CO3(s) + 2Na2SiO3(s) = Na6Si2O7(s) + CO2(g); McCready notes that
          the reaction assignment is uncertain because products were not
          identified.
        units: log10 pressure equation, pressure unit not stated in McCready's summary
        values:
          method_class: quoted_attributed
          quantity: equilibrium_log_pressure_relation
          reaction: 2Na2SiO3(s) + Na2CO3(s) = Na6Si2O7(s) + CO2(g)
          log_p_relation_as_printed: 'log p = 10.334 - 10410/T'
          temperature_range: 870 to 1050°C
          attribution: Kröger and Fingas (1935)
          McCready_estimated_delta_H_f_cal_mol: -846600
          caveat: This rough estimate is not accepted; it is omitted from McCready's most probable value.
      - observation_id: mccready_1948_zintl_leverkus_reaction12
        type: gibbs_table
        locator: {page: 4, published_page: 1280, pdf_page_index: 3, equation: '12'}
        phase: reaction occurs above the melting point of sodium hydroxide
        standard_state: >-
          2NaOH + Na2SiO3 = Na4SiO4 + H2O; correction to 25°C is not exact
          because NaOH is molten and its heat capacity is not known.
        units: log10 pressure relation, pressure unit not stated in McCready's summary
        values:
          method_class: quoted_attributed
          quantity: equilibrium_log_pressure_relation
          reaction: 2NaOH(l) + Na2SiO3(s) = Na4SiO4(s) + H2O(g)
          log_p_relation_as_printed: 'log p = 6.250 - 2609/T'
          attribution: Zintl and Leverkus
      - observation_id: mccready_1948_pyrosilicate_reaction16
        type: gibbs_table
        locator: {page: 5, published_page: 1281, pdf_page_index: 4, equation: '16'}
