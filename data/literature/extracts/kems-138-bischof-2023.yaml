  version: publishedVersion_CC_BY_4.0
  related_sources:
    - source_id: kems-137-bischof-2023
      doi: 10.1016/j.gca.2023.08.027
      relation: later_melt_activity_paper_same_group
      note: >-
        GCA 360:1-15 (2023) measures gamma(GaO1.5) and gamma(InO1.5) in An-Di
        eutectic melts and cites this Calphad pure-oxide KEMS paper. Different DOI;
        do not merge or remint.
extraction:
  method: >-
    Official OA: VOR CC BY 4.0. ScienceDirect landing HTTP 403 Cloudflare JS
    challenge (not bypassed). Elsevier CDN served accepted manuscript
    (1-s2.0-S0364591622001109-am.pdf). ETH Research Collection bitstream served
    the typeset VOR PDF (1-s2.0-S0364591622001109-main.pdf). JuSER OpenAccess
    PDF returned a fast-challenge JS wall (not bypassed). No MinerU. Tables 1-13
    transcribed from pdftotext -layout of the AM (single column) and certified
    against VOR page renders (pdftoppm 150 dpi). Figures 1-15 listed figure-only
    (not digitised). Measured ion intensities and printed partial-pressure points
    kept distinct from 3rd-law reductions, 2nd-law van't Hoff fits, and FACTSAGE
    / literature-recalculated columns. No unit conversion. Missing = absent
    (n.d. and em-dash stored as printed, never 0).
