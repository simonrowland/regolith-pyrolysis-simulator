schema_version: literature_extract.v1
source_id: lead-25-wetzel-2012a
source:
  citation: >-
    Wetzel, S., Klevenz, M., Pucci, A. & Gail, H.-P. (2012). The Temperature-Dependent
    Decomposition of SiO Studied by Infrared Vibrational Spectroscopy. Applied Spectroscopy
    66(9), 1061–1067.
  doi: 10.1366/12-06658
  year: 2012
extraction:
  method: >-
    Transcribed from the born-digital pdftotext-layout source. Table I is not parseable by
    the MinerU-only table utility because no MinerU output exists; all 61 numeric table cells
    (15 parameter rows with repeated T coordinates, plus epsilon-infinity) were checked against
    a 600 dpi render of PDF page 4. Figures 1–8 are retained as context without digitizing
    plotted values. The paper reports infrared spectral quantities for which the store has no
    quantity token; those values remain in context rather than being assigned an unrelated type.
  date: '2026-10-18'
  worker: fam5-1019
review_status: draft
scope_assessment:
  document_type: >-
    Experimental infrared spectroscopy of SiO thin films deposited at varied substrate
    temperatures and of a 300 K-deposited film annealed at varied temperatures.
  scored_observations: 0
  note: >-
    Reported vibrational wavenumbers, oscillator strengths, Gaussian widths, and relative
    transmittance have no corresponding quantity token in simulator/battery/enums.py. Table I
    contains fitted Brendel oscillator parameters, retained as model_derived context. Measured
    spectral results and all deferred figures are retained in the SiO context container.
