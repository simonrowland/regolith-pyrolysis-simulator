      type: thermodynamic_example
      locator:
        page: 32
        published_page: L21
        section: FeO-SiO2
      units: as printed
      values:
        quantity: compiled_phase_equilibrium_fact
        method_class: quoted_attributed
        evidence_class: quoted_attributed
        statement_as_printed: '“The system FeO-SiO2 cannot be studied accurately as a binary system because the liquids are
          never purely ferrous, but Bowen and Schairer (1932) made a close approximation by working in iron crucibles in
          an atmosphere of oxygen-free nitrogen, obtained by passing the nitrogen through ammoniacal copper solution and
          then over hot copper gauze. They analyzed the resulting mixtures for the Fe2O3 content [...] Bowen and Schairer
          [...] drew the binary diagram of figure 12 by calculating all iron in each mixture to FeO and plotting the results
          accordingly.”'
        cited_sources:
        - 'Bowen, N. L., and Schairer, J. F., 1932, The system FeO-SiO2: Am. Jour. Sci., v. 24, p. 177-213.'
