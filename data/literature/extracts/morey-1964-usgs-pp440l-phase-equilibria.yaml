conventions:
  composition_basis: Compositions are in weight percent unless otherwise specified.
  temperature_scale_quote: Most of the temperatures in this section are given in the Geophysical Laboratory Scale of 1912.
    This is essentially the same as the International Celsius scale of 1948 up to 1550°C, slightly lower above 1550°C. The
    melting point of pure silica as cristobalite is 1713°C on the Geophysical Laboratory Scale of 1912, 1723°C on the International
    Scale of 1948. This subject is thoroughly discussed by Sosman (1952).
  temperature_corrections: Morey states the scale comparison above; no universal correction procedure is stated in the scoped
    text.
  conflicting_data: No global selection rule is stated. Morey identifies disagreements or uncertainty value by value; all
    cited alternatives and qualifiers are retained without averaging.
