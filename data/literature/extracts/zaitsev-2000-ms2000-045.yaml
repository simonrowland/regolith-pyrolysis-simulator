    context:
    - observation_id: zaitsev_2000_qualifying_statements
      type: thermodynamic_example
      locator:
        published_page: 2
        pdf_page_index: 1
        section: Experimental arrangement
      units: as printed
      values:
        quantity: directional_comparative_and_qualifying_claims
        method_class: quoted_unattributed
        claims:
        - quote: In this way representative files of experimental data, containing several hundred to several thousand
            values of activity of all components in wide temperature and concentration ranges, were obtained for
            molten slags and silicates of various nature and complexities.
          locator:
            published_page: 2
            pdf_page_index: 1
            section: Introduction
        - quote: Knudsen effusion technique is free from these disadvantages and in combination with mass spectrometric
            analysis of evaporated products allows one to determine activities of all, or at least majority of the
            components of multicomponent mixtures. However, its application to liquid slags is often limited by extremely
            low partial vapour pressure of these substances in the temperature range most suitable for the technique.
          locator:
            published_page: 1
            pdf_page_index: 0
            section: Introduction
        - quote: The partial pressure of the vapour species were calculated according to the equation p(i)=k[(sum_j
            I(i,j)T)/sigma(i)], where k is the mass-spectrometer sensitivity constant determined from the vapour
            pressure of a reference substance; sigma(i) is the cross-section of ionisation of an i-type; sum_j I(i,j)
            is the sum of intensities of ion currents resulting from ionisation of molecules i.
          locator:
            published_page: 3
            pdf_page_index: 2
            section: Experimental arrangement
        - quote: The temperature dependencies of the ion currents (vapour pressures) of the reference substances
            were reproducible in all cases and in good agreement with the databank of thermodynamic values IVTANTERMO
            [15].
          locator:
            published_page: 3
            pdf_page_index: 2
            section: Experimental arrangement
        - quote: The complete ion currents that originated from Mn and SiO were used for the determination of a(MnO)/a(SiO2),
            as ionisation of each of these molecules produces ions of a single type only.
          locator:
            published_page: 6
            pdf_page_index: 5
            section: Experimental realisation and assignment of mass spectra
        - quote: The ratios a(MnO)/a(SiO2), obtained in this way depend neither on the value of n nor on the choice of
            reductant because (K_P(3)/K_P(2))^(1/n) is equal to the equilibrium constant of the reaction
            SiO2(s,l)+Mn(g)=MnO(s,l)+SiO(g).
          locator:
            published_page: 4
            pdf_page_index: 3
            section: Theoretical basis
            note: Eq. (8); nth root and division rendered in plain-text mathematical notation.
        - quote: Owing to the two mechanisms of evaporation, the ion currents Na+ or K+ could originate from two
            sources, namely from ionisation of Na and NaO2 or K and KO2. O2+ could also have two precursors, O2
            and NaO2 or KO2, though the major source should be NaO2 or KO2. Formation of NaO+, or KO+ ions through
            dissociative ionisation of NaO2, or KO2 seems very unlikely.
          locator:
            published_page: 6
            pdf_page_index: 5
            section: Experimental realisation and assignment of mass spectra
        - quote: Therefore, appearance of O2+ lines in the mass spectra, like in the experiments with Mo or Ni cells,
            could be considered as indication that Na+, or K+ ions originated from both above sources. On the contrary,
            the absence of the O2+ in the mass spectra in experiments with Ta or Nb cells showed that the concentration
            of Na(K)O2 in the vapour was very low and Na(K)+ ions originated from a single source, reaction (12).
          locator:
            published_page: 6
            pdf_page_index: 5
            section: Experimental realisation and assignment of mass spectra
        - quote: These experiments revealed that, if Nb, or Ta cells were used, the measured vapour pressures of
            Na or K differed by the factor of 1.6 to 1.7, but a(Na2O) or a(K2O) calculated by means of equation
            (2) agreed within the experimental errors (1-3%).
          locator:
            published_page: 6
            pdf_page_index: 5
            section: Experimental realisation and assignment of mass spectra
        - quote: However, the vapour pressures measured, using Mo and Ni cells, resulted in significantly higher
            values of the alkali metals activity evidently because of activation of the second mechanism of Na(K)2O
            vaporisation and a substantial contribution into the Na(K)+ current of Na(K)+ ions formed by the dissociative
            ionisation Na(K)O2.
          locator:
            published_page: 6
            pdf_page_index: 5
            section: Experimental realisation and assignment of mass spectra
        - quote: At the ionising energy of 50 eV the constant b was found to be equal to 1.72 and 2.90 for Na2O
            and K2O, correspondingly, depending on neither sample composition nor temperature.
          locator:
            published_page: 7
            pdf_page_index: 6
            section: Experimental realisation and assignment of mass spectra
        - quote: In the cases, when I(O2+) were reliably established, the application of this b value to corrections
            of the Na(K)+ currents measured with the help of Mo and Ni effusion cells resulted in a(Na2O) and a(K2O)
            coinciding, within the experimental uncertainties, with those found using Nb and Ta cells.
          locator:
            published_page: 7
            pdf_page_index: 6
            section: Experimental realisation and assignment of mass spectra
        - quote: The results of the experiments with Mo and Ni effusion cells were used for a(Na2O) and a(K2O) determinations
            only when it was possible to obtain reliable values of I(O2+), that is when is was possible to divide
            I(Na+) and I(K+) into the two constituents discussed.
          locator:
            published_page: 7
            pdf_page_index: 6
            section: Experimental realisation and assignment of mass spectra
        - quote: Fig. 2 illustrates that the thermodynamic values, found as describe above in experiments with effusion
            cells of different materials and various orifice areas and in experiments with samples of different
            composition in the same heterogeneous region, were in good agreement. This result confirms the existence
            of equilibrium in the effusion cell during experiments and proves the reliability of the thermodynamic
            information acquired.
          locator:
            published_page: 7
            pdf_page_index: 6
            section: Experimental realisation and assignment of mass spectra
        - quote: Random chemical analysis showed that the concentration of the reductant oxides in the test substances
            after the experiments was insignificant (<0.05%).
          locator:
            published_page: 5
            pdf_page_index: 4
            section: Experimental realisation and assignment of mass spectra
        - quote: Al2O, Al2O2 and AlO are the products of reduction of Al2O3 by the effusion-cell materials, the
            reducing capability increasing in the series Mo < Ni < Ta < Nb.
          locator:
            published_page: 11
            pdf_page_index: 10
            section: Assignment of the mass spectra lines
        - quote: Depending on the activity of the components of the CaF2-Al2O3-CaO system, the above reactions can
            result in p(AlF) several orders of magnitude higher than the partial pressure of AlF3 attained owing
            to reaction (17).
          locator:
            published_page: 11
            pdf_page_index: 10
            section: Assignment of the mass spectra lines
        - quote: The concentration of Al atoms produced in the vapour by the reactions between Al2O3 and the cell
            materials is several orders of magnitude lower than that of AlF and AlF2.
          locator:
            published_page: 11
            pdf_page_index: 10
            section: Assignment of the mass spectra lines
        - quote: It should be noted that direct reduction of aluminium fluorides by the cell-materials is almost
            negligible and should lead to the pressure of the reduced species (AlF2, AlF, Al) several orders of
            magnitude lower than those observed in reality.
          locator:
            published_page: 11
            pdf_page_index: 10
            section: Assignment of the mass spectra lines
        - quote: However it should be noted that the results of the calculation of the ratio sigma2(AlF2)/sigma(AlF3)/sigma(AlF)
            happened to be is practically equivalent to the commonly used assumption that this ratio is equal unity
            for isomolecular reactions.
          locator:
            published_page: 12
            pdf_page_index: 11
            section: Assignment of the mass spectra lines
        - quote: Both methods gave coinciding results, but the first was preferred because of the low intensity
            of the AlF3+ ion current.
          locator:
            published_page: 12
            pdf_page_index: 11
            section: Assignment of the mass spectra lines
        - quote: The partial pressure of AIF over CaF2-Al2O3-CaO samples of the composition, belonging to the region
            of equilibrium with pure CaO, was almost three orders of magnitude higher than that of aluminium di-
            and trifluoride, thus meaning that the AlF+ and Al+ ion currents originated almost exclusively from
            AIF molecules.
          locator:
            published_page: 13
            pdf_page_index: 12
            section: Assignment of the mass spectra lines
        - quote: The result of assignment given in Table 2 are in good agreement with information obtained in the
            studies of AlF3 sublimation and equilibria involving aluminium mono-, di- and trifluorides [20-28].
          locator:
            published_page: 13
            pdf_page_index: 12
            section: Assignment of the mass spectra lines
        - quote: In all cases, both the position of distillation lines on the phase diagram and the values of partial
            pressures of the vapour species were in good agreement.
          locator:
            published_page: 14
            pdf_page_index: 13
            section: Consideration of equilibrium conditions in effusion cells
        - quote: In the experiments with the CaO-Al2O3-SiO2 melt only SiO+, MeO2+, MeO+ (Me=Ta, Nb, Mo) and MoO3+
            were detected in the mass spectra of the saturated vapour. This means that only silicon dioxide was
            reducted according to equation (3) [8]. On the contrary, no peaks connected with the products of reduction
            of silicon dioxide were detected in the mass spectra in the experiments with Na2O-SiO2 (Me=Ta, Nb, Mo,Ni)
            and K2O-SiO2 (Me=Ta, Nb, Mo,Ni,Al) mixtures [10,11]. Thus, only alkali oxides reacted with Me in the
            effusion cell.
          locator:
            published_page: 6
            pdf_page_index: 5
            section: Experimental realisation and assignment of mass spectra
        - quote: Very high intensity of some of the reactions (16)-(28) allowed us to use the isothermal-evaporation
            method along with determination of the component vapour pressures as functions of temperature.
          locator:
            published_page: 8
            pdf_page_index: 7
            section: Theoretical basis
        - quote: This allowed calculation of the component’s mole fractions in samples at the beginning of any experiment
            with an accuracy of ±0.0001 to ±0.0002 unattainable by conventional preliminary melting of samples and
            their subsequent chemical analysis.
          locator:
            published_page: 9
            pdf_page_index: 8
            section: Theoretical basis
        - quote: Of all components of the CaF2-CaO-Al2O3-SiO2 melts only the activities of CaF2 could be calculated
            straightforwardly as the ratios of the vapour pressures over the liquid solution and pure calcium difluoride.
          locator:
            published_page: 9
            pdf_page_index: 8
            section: Theoretical basis
        - quote: If one of the pressures listed happened to be immeasurable, then the corresponding equation could
            be replaced by another relationship, for example by equation following from reaction (19).
          locator:
            published_page: 9
            pdf_page_index: 8
            section: Theoretical basis
        - quote: If in some experiments the isothermal exposure leads to a shift of the configuration point of melt
            composition from the region of the liquid phase stability into a heterogeneous field, the initial values
            of the components’ activities can be calculated from the conditions of equilibrium between the liquid
            solution and solid compounds.
          locator:
            published_page: 10
            pdf_page_index: 9
            section: Theoretical basis
        - quote: The last equation reduced the number of experiments with effusion cells made of different materials
            to three. We now have a system of six equations containing five unknowns, which can be solved, for example,
            by the least squares method.
          locator:
            published_page: 13
            pdf_page_index: 12
            section: Assignment of the mass spectra lines
        - quote: The results of experiments, where the smallest differences between the intensities of AlF2+, AlF+
            and Al+ ion currents were observed, were used in equation (47).
          locator:
            published_page: 13
            pdf_page_index: 12
            section: Assignment of the mass spectra lines
        - quote: Thus in order to interpret the mass spectra under discussion completely, it was necessary to measure
            the AlF3+, AlF2+, AlF+ and Al+ ion currents over a slag mixture of the same composition, using effusion cells
            made from five different materials.
          locator:
            published_page: 13
            pdf_page_index: 12
            section: Assignment of the mass spectra lines
          note: The earlier methods description says Nb, Ta, Mo, and Ni were cell materials, while aluminium was
            powder only; the fifth cell material is not identified.
