schema_version: literature_extract.v1
source_id: kems-114-nichols-1995
source:
  citation: >-
    Nichols Jr., R. H., Wasserburg, G. J. & Grimley, R. T. (1995),
    "Evaporation of forsterite: identification of gas-phase species via
    Knudsen cell mass spectrometry", Lunar and Planetary Science XXVI,
    1047–1048. LPI abstract 1524. ADS bibcode 1995LPI....26.1047N.
  doi: null
  url: https://www.lpi.usra.edu/meetings/lpsc1995/pdf/1524.pdf
  year: 1995
  bibcode: 1995LPI....26.1047N
  lpi_abstract: "1524"
extraction:
  method: >-
    Official LPI OA PDF (HTTP 200, application/pdf). Scanned pages
    (Acrobat Paper Capture). pdftotext -layout OCR is dirty (furnace
    misread as hrnace; Fo90 as Fow; I+T as I'T). Every numeric value
    certified against 200/400 dpi page renders, not the OCR layer.
    No numbered tables exist (true absence). Figure 1 printed slope
    labels and Figure 1–2 axis ticks transcribed from the render.
    I+T and ion-ratio point series listed figure-only (not digitised:
    no printed point coordinates). Second-law slopes labelled
    model_derived. No MinerU. No unit conversion except T_C+273.15
    where shown. Measured species identification kept distinct from
    fitted slopes and from Porter et al. 1955 literature comparison.
  date: '2026-09-06'
  worker: wave-W2-kems-114-nichols-1995
  provenance_path: docs-private/research/2026-09-06-wave-2/W2-kems-114-nichols-1995/kems-114-nichols-1995/
review_status: draft
