schema_version: literature_extract.v1
source_id: oneill-2002-feo-activity-coefficients-cmas
source:
  citation: >-
    O'Neill, H.St.C. & Eggins, S.M. (2002), The effect of melt composition on trace element partitioning: an experimental investigation of the activity coefficients of FeO, NiO, CoO, MoO2 and MoO3 in silicate melts, Chemical Geology 186, 151-181.
  doi: 10.1016/S0009-2541(01)00414-4
  year: 2002
  sha256: d4006f3272e7f2d4c869e18b11fecf4e3597f7ee32547777e29832a93f84c887
extraction:
  method: >-
    Manual transcription checked against the supplied PDF and layout-preserving pdftotext. Table 7 activity coefficients are transcribed for every numeric cell; Table 4 Fe-equilibrated melt compositions are paired by melt name. Table 1 describes Mo/Ni/Co run products and is not substituted for the Fe-equilibrated Table 4 compositions. Table 4 does not label the major-oxide columns wt.%; their wt.% basis is inferred from electron-microprobe compositions summing to about 100 and is flagged in each row. Table 7 prints 1400 °C; the stored kelvin condition is converted by T_K = T_C + 273.15 = 1673.15 K. Table 4 prints log fO2 = -12.61; the experimental text identifies fO2 = 10^-12.61 bars and says it was calculated from the CO-CO2 gas mixture. Gamma values are author-calculated from measured compositions and oxygen fugacity, so evidence_class is measured_reduced. Table 6 supplies the standard-state thermodynamic data. Dashes in Table 7 for MoO2 and MoO3 at CMAS7 G and CAS3 remain unreported and are not zero or observations. The study uses wire-loop equilibration in a vertical tube furnace; it does not report KEMS cell/orifice, chamber pressure, orifice dimensions, orifice calibration, or a mass spectrometer.
  date: '2026-10-01'
  worker: codex
review_status: draft
experiments:
  - experiment_id: oneill-2002-fe-saturated-cmas
    method: quench_equilibration
    method_as_printed: "Samples were equilibrated using the wire-loop method in a conventional vertical tube furnace equipped for gas mixing, using CO – CO2 mixtures to control fO2."
    locator:
      page: 155
      published_page: 155
      pdf_page_index: 4
      section: Sample equilibration
    conditions:
      temperature_K:
        state:
          tag: value
          value: '1673.15'
        locator:
          page: 163
          published_page: 163
          pdf_page_index: 12
          table: '7'
          note: "Table 7 gives 1400 °C; converted using T_K = T_C + 273.15."
        inference:
          relation: celsius_to_kelvin
          inputs:
            - "T_K = T_C + 273.15"
            - "original_unit=C"
          output_unit: K
