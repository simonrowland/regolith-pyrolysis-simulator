  year: 1985
extraction:
  method: Official J-STAGE OA PDF (corpus raw/kems-057-kambayashi-1985/kems-057-kambayashi-1985.pdf, sha256
    6051eea158c439e144926afffa3f51f5e21254907f186cdfac12029a343355f8). No MinerU decode. Tables 1-7 transcribed
    from a 400 dpi pdftoppm render of PDF pages 1-8 (published pp. 1911-1918). pdftotext-layout is a noisy
    OCR layer and was not used as data. Ion-current ratio tables labelled measured. Partial pressures
    and Raoultian a_P2O5 that pass through JANAF P_Fe or P4O10(s) free-energy functions labelled model_derived.
    Figs 2-8 listed figure-only; no numbers off axes. P2O5(g) was not detected.
