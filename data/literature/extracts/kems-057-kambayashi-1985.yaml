source:
  citation: Kambayashi, S., Awaka, H. and Kato, E. (1985), "Mass Spectrometric Determination of Activities
    of P2O5 in PbO-P2O5 and FetO-P2O5 Systems", Tetsu-to-Hagane 71(16):1911-1918, DOI 10.2355/tetsutohagane1955.71.16_1911
  doi: 10.2355/tetsutohagane1955.71.16_1911
