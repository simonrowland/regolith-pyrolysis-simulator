    - observation_id: sh14_duplicate_of_2015
      type: conference_abstract_of_journal
      locator:
        page: 1
        pdf_page_index: 0
        note: Header prints 45th Lunar and Planetary Science Conference (2014) 1624.pdf.
          Both pages were read from pdftotext and from the 120 dpi renders.
      units: as printed
      standard_state: Equation (8) writes p(AlSiO) as proportional to a(Al2O3) to the
        power 1/2 times a(SiO2), divided by p(O) to the power 5/2. The abstract does
        not state whether either activity is referred to a solid oxide, a liquid oxide,
        or a polymorph.
      values:
        duplicate_of: shornikov-2015-complex-oxide-vapor
        evidence: Same authors, same Vernadsky affiliation, same system, and the same
          1% Knudsen-cell bound at 1500–2500 K for (CaAlO), (CaSiO3), (MgAlO), (AlSiO),
          and (CaTiO3). The journal paper (Geochemistry International 53(8), 690–699,
          received 20 March 2014) is the full article.
        repeated_in_the_journal: the 1% bound and the 1500–2500 K span
        labels_the_journal_does_not_print:
        - Fig. 1 is calculated at 2200 K. The journal Fig. 1 labels the Al2O3–SiO2
          panel at 2300 K and the CaO–SiO2 panel at 2100 K.
        - Fig. 3 is calculated at 2200 K. The journal Fig. 2 labels the mullite panel
          at 2000 K.
        - Fig. 2 cites Shornikov 2003, Herald of the Earth Sciences Department of RAS,
          21, No. 1. The journal spinel temperature panel cites Shornikov 2001.
        expected_migration_phase: unknown
