laboratory_parameters:
  heated_equipment:
    furnace:
      value: high-frequency induction furnace
      locator: *methods
    sample_mass:
      value: about 90
      units: g
      locator: *methods
    crucible_materials:
      value: MgO, Al2O3, MgO·Al2O3 spinel, and dolomite with MgO/CaO = 40/60 mass ratio
      locator: *methods
    crucible_dimensions:
      value: 25 O.D. × 20 I.D. × 50 H
      units: mm
      locator: *methods
    heating_atmosphere:
      value: (1:1) Ar-H2 mixed gas
      locator: *methods
    gas_flow:
      value: 200
      units: ml/min
      locator: *methods
    deoxidation_atmosphere:
      value: H2; deoxidation for more than 2 h after complete melting
      locator: *methods
    run_temperatures:
      value: [1873, 1948, 2023]
      units: K
      locator: *methods
    dominant_run_temperature:
      value: 1873
      units: K
      locator: *methods
    quench:
      value: power switched off and sample rapidly quenched after holding at the prescribed temperature
      locator: *methods
    deoxidizer:
      value: commercial Fe-48%Al alloy for MgO or spinel crucibles; commercial Mg wrapped in Fe foil for Al2O3 crucibles
      locator: *methods
    analysis:
      value: ICP emission spectrometry for Al, Mg and Ca after acid dissolution and solvent extraction; inert-gas impulse-fusion infrared absorption for O; X-ray diffraction for interfacial equilibrium phases
      locator: *methods
