  O2:
    observations:
    - observation_id: oneill_1988_shared_emf_cell_conditions
      type: gibbs_table
      locator:
        source_path: /Users/simonrowland/Repos/regolith-corpus/raw/ammin-73-470/ammin-73-470.pdf
        published_page: 471
        section: Experimental details; design of electrochemical cells with air reference electrodes
      units: mixed as printed
      values:
        method_class: measured_direct
        quantity: electrochemical_cell_apparatus_and_conditions
        apparatus:
          electrolyte: two calcia-stabilized-zirconia tubes, 8 mm outside diameter x 5 mm inside diameter x 300 mm length, 11 mol% CaO
          sample_electrode: upper CSZ tube; sample electrode on one side of the solid electrolyte
          reference_electrode: lower CSZ tube with air electrode; YDT pellet used for low-temperature air electrode
          guide_tube: thick-walled alumina, 3 mm wall thickness
          furnace: Deltech DT-31-VT tube furnace
          thermocouples: two, one above sample electrode and one below air reference electrode; beads separated by 8 mm
          constant_temperature_zone: approximately 10 mm within 0.5 K of peak temperature as measured in the furnace
          electrical_leads: platinum
          atmosphere_sample_compartment: evacuated, then filled with highly purified Ar; static Ar atmosphere
          reference_atmosphere: air
          pressure_reference_bar: 1.0
        temperature_measurement:
          range_recorded_K: [750.0, 1450.0]
          reading_precision_K: 0.1
          calibration: Au melting point 1337.58 K, IPTS-68; 18 calibrations on eight thermocouples; mean Au-point emf 10.275 +/- 0.002 mV
          calibration_uncertainty_K: 0.3
        pressure_environment:
          atmospheric_pressure_measurement: Hg barometer, corrected for local gravity; accuracy +/- 2 mbar
          water_vapor_measurement: wet-and-dry-bulb psychrometer
          atmospheric_water_vapor_range_mbar: [5.0, 20.0]
          typical_atmospheric_water_vapor_mbar: 8.0
          inferred_air_fugacity_error_J_per_mol: 40.0
        run_conditions:
          equilibration_time_h_by_temperature: '<12 h below 900 K; approximately 6 h at 900-1050 K; approximately 3 h at 1050-1300 K'
          high_temperature_reading_delay_min: '30-40 min after furnace-temperature change above 1300 K'
          emf_stability_requirement_mV: 0.05
          cell_reversibility_checks: temperature increase/decrease, small imposed current, and evacuation/refill with air or Ar-CH4 above 1000 K
        materials:
          Cu2O_and_FeO_preparation: Cu + CuO and Fe + Fe2O3 mixed with slight metal excess and sintered at 1000 C for approximately 8 h under purified flowing Ar
          Fe2O3_preparation: sintered in air at 1000 C for approximately 24 h; XRD identified well-crystallized alpha-Fe2O3
          Fe3O4: as supplied or sintered in flowing CO-CO2 QFM buffer; no performance difference observed
          purity: chemicals stated >99.9 percent except Fe metal >99.5 percent
        absent_from_source:
        - sample mass
        - pellet dimensions
        - exposed electrode area
        - pumping speed
        - absolute sample-compartment pressure after Ar refill
      uncertainty:
        total_measurement_precision_J_per_mol: 75.0
        reported_status: source separates precision from absolute accuracy and warns that oxygen leakage/electronic conductivity can bias high-temperature cells
