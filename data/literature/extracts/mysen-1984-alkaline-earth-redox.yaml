schema_version: literature_extract.v1
source_id: mysen-1984-alkaline-earth-redox
source:
  citation: 'Mysen, B.O., Virgo, D. & Seifert, F.A. (1984), Redox equilibria of iron in alkaline earth silicate
    melts: relationships between melt structure, oxygen fugacity, temperature and properties of iron-bearing
    silicate liquids. American Mineralogist 69, 834–847.'
  year: 1984
  provenance_path: raw/mysen-1984-alkaline-earth-redox/mysen-1984-alkaline-earth-redox.pdf
extraction:
  method: Table 1 machine text transcribed from MinerU and pdftotext; all stored row labels, temperatures,
    −log fO2 values, and Fe3+/ΣFe fractions were checked against a 600 dpi render of physical PDF page 2. Table
    3 has ten body rows and six unambiguous Fe3+/ΣFe entries; these were checked against a 600 dpi render of
    physical PDF page 9 and match rounded Table 1 rows. In Table 3 row CS.8F5, 0.71 is under the 1150 cm−1
    relative-area column and the Fe3+/ΣFe cell is an ellipsis; neither is treated as a redox result. Table 2
    contains no Fe redox fraction. Table 1 reports quenched glasses. The paper states
    that the fO2 reference frame is not printed; the signed log is carried through the existing 1 bar reference
    convention for identity conversion, while total experimental pressure remains unknown. Nominal composition
    maps decode the printed SiO2/metal-oxide molar ratio and Fe2O3 wt% added to starting material; the paper
    says glass analyses agree within 2% relative uncertainty but does not print the microprobe values. Figures
    1–8 are not digitized.
  date: '2026-11-04'
  worker: w1104fer-m84
  audit_files:
  - data/literature/extracts/audits/mysen-1984-alkaline-earth-redox.mapping.yaml
  - data/literature/extracts/audits/mysen-1984-alkaline-earth-redox.cells.csv
  - data/literature/extracts/audits/mysen-1984-alkaline-earth-redox.compare.txt
