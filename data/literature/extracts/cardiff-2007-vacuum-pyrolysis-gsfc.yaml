schema_version: literature_extract.v1
source_id: cardiff-2007-vacuum-pyrolysis-gsfc
source:
  citation: Cardiff, Eric H., Pomeroy, Brian R., Banks, Ian S. and Benz, Alexis (2007), "Vacuum Pyrolysis
    and Related ISRU Techniques", Space Technology and Applications International Forum (STAIF). NTRS
    20070014929
  url: https://ntrs.nasa.gov/citations/20070014929
  year: 2007
extraction:
  method: Corpus PDF raw/cardiff-2007-vacuum-pyrolysis-gsfc/cardiff-2007-vacuum-pyrolysis-gsfc.pdf. Scanned
    STAIF pages. Table 1 and the printed Fe/O and Ti/O ratios on Figure 5 transcribed from 400 dpi pdftoppm
    renders of PDF pages 3 and 5. pdftotext -layout is a noisy OCR layer and was not used as data. Figure
    4 RGA traces, Figures 6–7 HSC equilibrium plots, and Figure 9 P–T curve are figure-only and were not
    digitised. Printed caption numbers on Figure 8 (10 g MLS-1A, 10^{-5} Torr, 1400 C) are transcribed
    as caption text, not as axis readings. Cardiff Table 1 mass-loss cells for tests 2b and 3 are 16.00%
    and 37.00% as printed; they disagree with Matchett 2006 Table 3 (0.16% / 0.37%) and are not 'corrected'.
  date: '2026-09-12'
  worker: extract-pyro-steurer
  provenance_path: docs-private/research/2026-09-12-pyrolysis-extracts/cardiff-2007-vacuum-pyrolysis-gsfc/
