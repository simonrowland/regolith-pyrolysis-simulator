        electrolyte_as_printed: 4CaO.P2O5
        temperature_range_K_as_printed: 1473 to 1873
        standard_state_CaO_as_printed: pure solid
        how_equilibrium_shown_as_printed: EMF stable after 20–36 ks at setpoint; after temperature cycle returns to within ±1 mV
          (Fig. 2); polarization ±110 mV for 60 s recovers to equilibrium EMF ~360 s later (reversible); heating/cooling symbols
          agree on Fig. 3; post-run XRD shows only the intended two compounds; SEM/XRD of electrolyte surface shows no phases
          other than 4CaO.P2O5
        preparation_and_measurement_conditions_as_printed: Electrolyte powders were dried at 473 K for over one week, calcined in air at 1373 K for 43.2 ks, pelletized, and sintered in air at 1473 K for 36.0 ks; an alumina crucible was used and the pellet was buried in same-composition powder. The furnace atmosphere was air dried over P2O5 powder. A PID controller held temperature to ±1 K; the thermocouple position is shown in Fig. 1.
        cell_IV_liquidus_note_as_printed: above 1635 K Cell IV splits into (a) liquid + 3CaO.Al2O3 and (b) liquid + CaO.Al2O3
          at eutectic 1633±5 K, 50.65 wt% Al2O3
