      values:
        quantity: chloride_capacity_model
        method_class: model_derived
        evidence_class: author_stepwise_linear_regression
        generator: author stepwise linear regression fitted to 70 results (60 anhydrous from Thomas and Wood 2021, 2023 plus 10 hydrous experiments here); SPSS; F-test alpha=0.05
        equation_8: logCCl = 1.492 + (4331XCa - 3508XSi + 2440XFe - 3921XK - 741P)/T
        R2: 0.963
        standard_error_68_percent: 0.083
        water_treatment: HO0.5 treated as ideal diluent; no significant fitted HO0.5 term at alpha=0.05
        equation_16: log(aNaCl) = log(Cl-) + 0.23 + (-4331XCa + 3508XSi + 5694XFe + 7484XMg + 4726XNa + 3921XK - 3160)/T
        equation_16_generator: author model combining chloride capacities with Na2SiO3 and SiO2 partial molar free energies from Rhyolite-MELTS 1.2.0 for MATLAB; NIST-JANAF for gas and liquid NaCl standard-state free energies; Marcus NaCl volume data
        melT_outputs: calculated NaCl activities for experimental melts; individual values not printed in main-paper table
        figure_only_outputs: Figures 1-9 include plotted comparisons and calculated activities/salinities; coordinates not digitized
        fO2_generator: author calculation using Jakobsson and Oskarsson 1994 at 1.0 and 1.5 GPa; Modified Redlich-Kwong equation of state after Holloway 1977 at 0.5 GPa; NIST-JANAF 1-bar free energies; H2O correction from Moore et al. 1998
        fCl2_generator: Thomas and Wood 2021 chlorine-fugacity control equation from AgI/AgCl buffer
        uncertainty:
          standard_error_68_percent: 0.083
