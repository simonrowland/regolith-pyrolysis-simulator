  results: &results {source_path: *scan, published_page: 2006, section: Results, figure: '1'}
laboratory_parameters:
  heated_equipment: &heated
    chamber_pressure:
      value: 2.0e-6
      units: Torr
      locator: *procedures
      quote: Samples were evacuated to 2 × 10⁻⁶ Torr
      note: Evacuation pressure; also described as study vacuum in introduction and figure captions. No independent base-versus-running pressure history stated.
    oxygen_partial_pressure:
      value: '<10^-10'
      units: atm
      semantics: upper_bound_not_point
      method: calculated from mass spectra during each volatilization experiment
      locator: {source_path: *scan, published_page: 2004, section: Introduction and Experimental procedures}
    furnace:
      value: Mettler recording vacuum thermal analyzer
      locator: *procedures
    sample:
      form: powdered samples
      container: platinum crucible
      locator: *procedures
    heating_schedule:
      value:
        heating_rates_C_per_min: [4, 6]
        target_temperatures_C: [950, 1050, 1200, 1400]
        usual_hold_time_hr: 2
        variable_time_temperatures_C: [950, 1050]
        variable_hold_time_hr_range: [1, 72]
        cooling_from_C: 1400
        cooling_to: room temperature
        cooling_time_hr: 4
      locator: *procedures
      note: Two stated ramp rates, not a continuous range; no per-run assignment. Hold-time range is not collapsed. Furnace cooled along normal cooling curve.
    temperature_measurement:
      value: sample temperature continuously recorded
      locator: *procedures
      note: Sensor type, calibration, accuracy and uncertainty not stated.
    residue_analysis:
      value: stable isotope dilution mass spectrometry; atomic absorption for Na only
      locator: *procedures
    integrated_exposure:
      value:
        region_above_C: 900
        heating_crossing_time_min_as_printed: about 150
        heating_rate_C_per_min: 6
        cooling_crossing_time_min_as_printed: about 60
      locator: {source_path: *scan, published_page: 2007, section: Results, note: Sentence continues on printed page 2008}
      note: Authors warn that hold plus heating and cooling integrate loss over a range of temperatures. Retain printed crossing times without recalculation.
  soil_preparation:
    value: homogenized by grinding to 74 μ
    locator: *results
    sample_number: '14163'
  absent_parameters:
    - sample mass (weight was recorded, but no numerical mass is printed)
    - exposed surface area and crucible dimensions
    - pumping mechanism and pumping speed
    - distinct base pressure and time-resolved run pressure
    - temperature sensor, calibration and accuracy
    - per-run ramp-rate assignment
    - analytical uncertainties for Table 2
    - bulk oxide weight-percent composition
