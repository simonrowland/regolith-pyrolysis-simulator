table2_policy:
  locator: *table2
  column_order_as_printed:
    - "10017 | Initial"
    - "10017 | 1400°C 2 hr"
    - "10073 | Initial"
    - "10073 | 1400°C 2 hr"
    - "12022 | Initial"
    - "12022 | 950°C 2 hr"
    - "12022 | 1050°C 2 hr"
    - "12022 | 1200°C 2 hr"
    - "12022 | 1400°C 2 hr"
    - "14163 | Initial†"
    - "14163 | 1050°C instantaneous"
    - "14163 | 1050°C 1 hr"
    - "14163 | 1050°C 6 hr"
    - "14163 | 1050°C 72 hr"
  missing_cells: Printed dashes omitted from observations; never measured zeros.
  initial_conditions: Initial is a composition reference, not a temperature or zero-duration measurement.
  instantaneous_condition: Printed hold label retained; no zero exposure or instantaneous quench inferred.
  numeric_basis: Elemental abundances in ppm and printed K/Rb and K/Ba ratios; no oxide conversion, depletion calculation, or ratio recomputation.
  trace_species_status: Li, Rb, Ba, Sr and measured REEs retained as evidence regardless of engine support.
  uncertainty: No Table 2 analytical uncertainty printed; none assigned.
