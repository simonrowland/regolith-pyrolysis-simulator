source_caveats:
  - locator: *results
    quote: only 30% of the original Rb concentration remains
    note: Narrative for 12022 at 1050°C after 2 hours disagrees with Table 2 initial 0.738 and residue 0.286 ppm. No percentage recomputed or substituted into the observations.
  - locator: {source_path: *scan, published_page: 2004, table: '1'}
    note: Table 1 is after Brewer (1953), for simple oxides at specified pressures; excluded from lunar measured observations.
  - locator: {source_path: *scan, published_page: 2008, figure: '3'}
    quote: due to 10% interlab difference in K
    note: External comparison datasets, not a Table 2 error bar.
  - locator: {source_path: *scan, published_page: 2007, figure: '2'}
    note: OCR reconstructed figure table rejected; temperature annotations are not concentration measurements. No figure-derived numerical points entered.
  - locator: {source_path: *scan, published_page: 2009, section: Discussion, note: Pb-loss calculations on printed page 2010}
    note: Inferred natural metamorphic histories and Pb-loss calculations are not laboratory abundance measurements; excluded.
  - locator: *abstract
    note: Refractory retention is bounded by the studied temperature domain; it does not establish retention at every furnace-survivable temperature.
verification:
  numerical_review: Every Table 2 non-dash cell, column header and footnote checked against original PDF page 3 rendered at 300 dpi. All agree with markdown transcription.
  narrative_review: Apparatus and schedule on original page 2; thresholds on pages 1 and 4; integrated exposure on pages 5-6 checked visually.
  image_warning: MinerU table crop disagrees with original scan at Sm 20.9, Eu 2.14 and Ce 17.7. Original scan controls; no crop-based corrections applied.
  scope: 97 Table 2 observations (73 abundance cells, 24 ratios) plus 11 qualitative element statements. No numerical figure points.
  schema_limitation: Current migrator has no elemental-abundance or elemental-ratio quantity and no ppm-composition vocabulary. Preserve printed data here; fail-closed unknown quantities in v2 are not executable measurements. No schema or vocabulary change in this extract-only task.
  vocabulary_gaps:
    - initial_elemental_composition_ppm
    - hold_time_hr
    - oxygen_partial_pressure
    - furnace
    - heating_schedule
    - temperature_measurement
    - residue_analysis
    - integrated_exposure
    - soil_preparation
