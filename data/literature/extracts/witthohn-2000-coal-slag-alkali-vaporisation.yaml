    context:
      - observation_id: witthohn_2000_table1_bulk_coal_ash_and_slag_compositions
        type: bulk_composition_table
        locator: {page: 15, pdf_page_index: 14, table: '1'}
        units: mass fraction [%] as printed; temperature in °C
        values:
          quantity: bulk coal-ash and plant-slag chemical composition
          method_class: measured_direct
          admission_status: typed_unavailable
          candidate_quantity_tokens:
            - equilibrium_phase_composition
            - residue_component_composition
            - condensate_composition
          reason: >-
            Table 1 reports bulk oxide chemistry of combustion ashes and plant
            slags. It is not a controlled equilibrium-phase composition, an
            evaporation residue, or a condensate, so none of the candidate
            composition tokens describes the measured material.
          sample_classes_as_printed: >-
            A–D: lignite laboratory ashes from the Rheinland; E: hard-coal
            laboratory ash from the Saar; F–G: hard-coal plant slags from the
            Saar. The paper says F and G are quenched liquid slags from the
            combustor and granular-bed removal devices, respectively.
          footnotes_as_printed: >-
            1) ashing or local maximum particle temperature; 2) mass fraction
            [%]; 3) not analyzed; 4) TiO2, BaO, SrO, MnO.
          rows_as_printed: |-
            Sample | A | B | C | D | E | F | G
            Temperature 1) [°C] | 450 | 450 | 450 | 550 | 575 | ≈1500 | ≈1400
            Ash content 2) | 9.6 | 12.6 | 9.9 | 6.2 | 8.4 | – | –
            SiO2 2) | 42.4 | 46.7 | 36.4 | 12.7 | 38.3 | 42.0 | 40.9
            Al2O3 | 2.8 | 3.1 | 4.2 | 2.1 | 18.3 | 24.3 | 24.3
            Fe2O3 | 8.9 | 7.0 | 10.2 | 11.1 | 11.4 | 14.9 | 11.2
            CaO | 19.3 | 15.5 | 17.4 | 38.1 | 8.5 | 9.4 | 9.7
            MgO | 3.0 | 4.3 | 7.6 | 3.5 | 2.8 | 2.6 | 3.0
            Na2O | <0.1 | 0.5 | 1.5 | 0.3 | 1.1 | 1.2 | 1.5
            K2O | 0.3 | 0.4 | 0.5 | 0.1 | 1.7 | 1.7 | 1.7
            SO3 | 12.5 | 15.0 | 11.6 | 14.4 | 9.2 | <0.1 | <0.1
            P2O5 | <0.1 | <0.1 | <0.1 | 0.1 | 0.2 | 0.3 | 0.3
            CO2 | 5.9 | 3.0 | 5.1 | – (3; not analyzed) | 12.5 | <0.1 | <0.1
            Cl | 0.3 | 0.1 | 0.3 | 0.5 | <0.1 | – | –
            Rest 4) | 1.8 | 0.8 | 1.2 | 0.5 | 2.8 | 1.4 | 2.1
            Sum | 97.2 | 96.4 | 96.0 | 83.4 | 106.8 | 97.8 | 94.7
          additional_unlabelled_printed_text: K11.10/12.10/14.10/4.1/7.5/7.2/7.3
          note: >-
            The printed <0.1 entries are limits, not point values; dashes are
            unreported values. The trailing string below Sum is preserved
            without interpretation because Table 1 does not label it.
      - observation_id: witthohn_2000_kems_calibration_and_pressure_relation
        type: experimental_method_context
        locator: {page: 5, pdf_page_index: 4, section: Experimental}
        units: p_i in Pa; T_i in K; I_i in 1/s or A; sigma_i in m2
        values:
          quantity: KEMS partial-pressure calibration method
          method_class: measured_direct
          admission_status: typed_unavailable
          reason: >-
            This is the printed apparatus conversion relation and calibration
            provenance, not a pointwise partial-pressure result. Figure 2 and
            Figure 3 contain the plotted measurements and are deferred.
          relation_as_printed: p_i = K I_i T_i / (a_i sigma_i)
          calibration_as_printed: The calibration constant K was determined with pure silver as a reference.
          inputs_as_printed: >-
            The isotopic abundance a_i and ionisation cross-section sigma_i
            are taken from data collections. Samples were heated in steps of
            about 50 K, each followed by signal registration.
