figure_policy: Figures are deferred to a figure pass; no numeric figure points are stored.
source:
  citation: >-
    Witthohn, A., Oltjen, L., Biedenkopf, P. and Hilpert, K. (2000). Thermodynamic
    activities of Na and K in coal slags and their vaporisation. Sixth
    International Conference on Molten Slags, Fluxes and Salts, paper 041,
    unpaginated 18-page proceedings manuscript.
  doi: null
  year: 2000
  corpus_asset: raw/witthohn-2000-coal-slag-alkali-vaporisation/witthohn-2000-coal-slag-alkali-vaporisation.pdf
  corpus_sha256: 782f1d7ae062c22000805b300124305312dd80e8290560b1a7643bb5c6c68af3
extraction:
  method: >-
    Born-digital proceedings manuscript transcribed from pdftotext-layout.txt;
    the corpus copy has no MinerU table blocks, and the table tool does not
    accept pdftotext-only input. Table 1 was checked cell by cell against the
    600 dpi physical page 15 render. Figure captions and series metadata were
    checked against page-scoped text and 600 dpi renders on physical pages 16–18.
    No figure values were digitised.
  date: '2026-10-20'
  worker: fam22-1020
review_status: draft
