extraction:
  method: >-
    No numeric table is printed. Figure 1(c), Figure 2, and Figure 3 were read from
    600 dpi page renders with labelled-tick calibration. Green's higher-precision
    Figure 1(c) and Figure 3 series 1 reads are retained for the ten overlapping
    points; Batch4's two additional Figure 1(c) points, all 18 Figure 2 points, and
    five Figure 3 series 2 points are retained as context. MinerU chart tables were
    ignored. The PDF has no text layer; prose locators were checked against the
    page renders.
  date: '2026-10-20'
  worker: t1372-w2-w6-t1
  figure_read_candidates:
  - candidate_id: shornikov_2000_fig1c_na2o_activity
    figure: '1(c)'
    page: 60
    pdf_page_index: 2
    rail: melt_activity
    x_axis_as_printed: x(ZnO), mole %
    y_axis_as_printed: log a_i (i)
    units: dimensionless log activity; x composition in mole %
    standard_state_as_printed: pure oxides forming the ternary system
    series_as_printed: '1 Na2O; 2 ZnO; 3 P2O5'
    temperature_K: 1100
    note: Na2O is series 1; 8 points read and verified.
  - candidate_id: shornikov_2000_fig2_evaporation_composition
    figure: '2'
    page: 63
    pdf_page_index: 5
    rail: residue_composition
    x_axis_as_printed: x(Na2O), mole %
    y_axis_as_printed: x(ZnO), mole %
    units: mole %
    temperature_as_printed: not stated in the figure or caption
    series_as_printed: '1 Na2O·ZnO·P2O5; 2 4Na2O·6ZnO·5P2O5'
    note: Initial melt compositions are shown changing during evaporation; 18 points read and verified.
