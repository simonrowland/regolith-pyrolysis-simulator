          typed_quantity: concentration_series
          quantity_as_printed: chromium content in Pt crucible versus soaking time
          species: Cr in Pt alloy
          phase: solid alloy
          temperature_as_printed: not stated for this equilibration-time series
          x_axis_as_printed: soaking time (6, 8, 12, 15, 20 h)
          y_axis_as_printed: chromium content in Pt crucible
          caption_as_printed: >-
            Figure 3 plots the relationship between chromium content in the Pt crucible and
            soaking time; the text reports the tested times as 6, 8, 12, 15, and 20 h.
          panel: single
          series: [{name: measured chromium content, marker: symbols, marker_count: unknown}]
          digitisation: deferred to a figure pass
