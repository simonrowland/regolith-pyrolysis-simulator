schema_version: literature_extract.v1
source_id: dong-2009-cr-v-slag-activities
source:
  citation: >-
    Dong, P., Seetharaman, S. and Wang, X. (2009), “Thermodynamic Activity of Chromium,
    Vanadium Oxide in CaO-SiO2-MgO-Al2O3 Slags,” MOLTEN 2009, Santiago, Chile, pp. 328–337.
  year: 2009
  corpus_asset: raw/dong-2009-cr-v-slag-activities/dong-2009-cr-v-slag-activities.pdf
extraction:
  method: >-
    Born-digital pdftotext-layout.txt was read as the primary source; the PDF title page and
    figure captions were checked against the physical pages. There are no numbered data tables.
    Measured activity results are plotted in Figures 5–7 and estimated/experimental slag
    contents in Figure 8; all figure data are deferred without digitisation. Figure 3's measured
    equilibration-time series and Figure 4's Pt cross-section analysis are likewise deferred.
    The alloy activity-coefficient curves in Figures 5(b) and 6(b) use the cited Pretorius
    relationships and are model-derived. No plotted values were estimated.
  date: '2026-10-20'
  worker: fam37-1021
review_status: draft
species:
  Cr:
    observations: []
    context:
      - observation_id: dong_2009_experimental_conditions
        type: experiment_series
        locator: {page: 1, pdf_page_index: 0, section: Abstract and Experimental Procedure}
        units: as printed
        values:
          method_class: method_only
          quantity: gas-slag equilibrium experimental conditions
          measured_quantities: chromium-oxide and vanadium-oxide activities in multicomponent slag
          temperature_K: [1803, 1823, 1873, 1923]
          oxygen_partial_pressure_Pa: ['10^-3', '10^-4', '10^-5']
          gas_mixture: CO, CO2, and Ar
          equilibration_duration_h: 20
          tested_equilibration_times_h: [6, 8, 12, 15, 20]
          gas_flow_rate_ml_min: 200
          temperature_stabilization_h: at least 1
          initial_mixture_mass_g: approximately 1.5–2
          slag_crucibles: four platinum crucibles
          quench: rapid withdrawal to the cold end under argon
          note: >-
            Abstract and procedure values are experimental conditions, not independent
            numeric observations. No measured data table is printed. The cited Figures 3 and 4
            are referenced in the text but their plots are absent from the supplied PDF pages.
      - observation_id: dong_2009_equations_5_6_standard_reaction_free_energies
        type: thermodynamic_equations
        locator: {page: 3, pdf_page_index: 2}
        units: (J)
        values:
          method_class: quoted_attributed
          quantity_as_printed: standard reaction free-energy expressions for reactions (1) and (2)
          reactions:
            - reaction_number: '1'
              equation_number: '5'
              reaction_as_printed: 'Cr(Pt)(s) + 1/2 O2(g) = CrO(l)'
              delta_G0_as_printed: '−334218 + 63.81 T'
            - reaction_number: '2'
              equation_number: '6'
              reaction_as_printed: 'V(Pt)(s) + 3/4 O2(g) = VO1.5(s)'
              delta_G0_as_printed: '−600405 + 112.97 T'
          note: >-
            Expressions are retained as printed context; no value is evaluated at a
            selected temperature and no species formation free energy is emitted.
      - observation_id: dong_2009_fig3_equilibration_time
        type: figure
        locator: {page: 5, pdf_page_index: 4, figure: '3', section: Results — Equilibrium Time}
        units: chromium content in Pt versus soaking time; as plotted
        values:
