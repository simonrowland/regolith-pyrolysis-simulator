schema_version: literature_extract.v1
source_id: liu-2023-chromium-oxide-activity
source:
  citation: >-
    Liu, B., Li, Z. and Kobayashi, Y. (2023), Activity of chromium oxide in calcium silicate bearing molten slag for highly clean chromium steel refining, ISIJ International 63(2), 313-318.
  doi: 10.2355/isijinternational.ISIJINT-2022-368
  year: 2023
extraction:
  method: >-
    Transcribed from the supplied MinerU table blocks and born-digital pdftotext-layout.txt. Tables 1, 2 and 3 were each checked against a page render to confirm row and column alignment; the renders confirmed all values below. No MinerU details/chart block was used. Table 1's four rows are the initial slag compositions (mass%). Table 2's twelve rows are the average post-equilibration slag compositions (mass%); the separate CrO1.5 and CrO columns are kept as printed and no Cr2+/total-Cr ratio is derived. Table 3's twelve rows are retained for aCr, aCrO1.5, aCrO and aCrOx. The paper gives 1823 K (1550 C), not 1873 K. The Table 3 aCrO1.5 values 1.5519 and 3.2610 are kept as printed; the source explicitly reports an activity greater than one and no correction is made. Table 3 aCr is quoted_attributed because the per-run chromium concentration in the Cu-Cr alloy is not tabulated; the source attributes the activity coefficient to Kobayashi et al. (1995), ref. 27. Table 3 aCrO1.5 and aCrO are model_derived from the corresponding stored aCr row, printed P_O2 and T, using Eqs. (13) and (14). Table 3 aCrOx is retained as a typed refusal because CrOx has variable x and no canonical stoichiometric species token. Table 2 CrO1.5 and CrO mass-percent columns are typed refusals because no closed quantity token represents oxide mass percent as a redox observable in this schema; the printed values remain present. Table 2 full compositions are retained per row. The migrator cannot bind CaF2, CrO1.5, CrO or MoO2 as composition components, so slag-activity composition identity remains unavailable with that schema gap recorded; no partial composition is promoted. The Cr-Cu alloy composition is not printed and remains unknown for aCr. The source reports water quenching immediately after 24 h but does not state quench preservation. Table 2 is bulk quenched-slag analysis, not an asserted glass-only analysis. Figure 3 Cr2+/total-Cr mass ratio is figure-read-only and is not digitized.
