    sample:
      mass_kg:
        state: {tag: value, value: {kind: point, point: '0.004'}}
        locator: {page: 2, published_page: 1466, section: '3.1', note: 'Printed 4 g slag mixture; converted 4 g / 1000 g per kg = 0.004 kg. This is before adding the 2 g saturation solid.'}
      printed_composition:
        state: {tag: unknown, reason: not_published}
        locator: {page: 2, published_page: 1466, section: '3.1', note: 'Starting mixtures were prepared to be close to saturation, but the exact recipes are not stated; Table 1 reports the final saturated liquid composition.'}
      form:
        state: {tag: value, value: 'Pressed cylinder'}
        locator: {page: 3, published_page: 1467, section: '3.4'}
      container:
        state: {tag: value, value: 'Molybdenum two-chamber crucible'}
        locator: {page: 2, published_page: 1466, section: '3.1'}
      characterization:
        state: {tag: value, value: 'A 4 g slag mixture was melted; 2 g of the selected solid saturation phase was placed in one crucible chamber.'}
        locator: {page: 2, published_page: 1466, section: '3.1'}
      pretreatment:
        state: {tag: value, value: 'Each component was calcined at 1100 °C for at least 12 h; weighed mixtures were blended for 2 h in an agate ball mixer and pressed to cylinders.'}
        locator: {page: 3, published_page: 1467, section: '3.4'}
    conditions:
      temperature_K: {state: {tag: value, value: 1873.15}, locator: {page: 4, published_page: 1468, table: '1', note: 'Printed 1600 °C; converted T_K = T_C + 273.15.'}}
