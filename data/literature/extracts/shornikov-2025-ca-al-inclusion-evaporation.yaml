    - observation_id: shornikov_2025_directional_quotes
      type: method
      locator:
        page: 1
        published_page: 551
        pdf_page_index: 0
        section: Abstract through Conclusions
      units: verbatim English translation; per-quote locators included
      values:
        quantity: directional_and_qualifying_statements
        method_class: quoted_unattributed
        claims:
        - quote: The paper presents experimental results on the evaporation of the main types (A and B) of Ca–Al inclusions
            of chondrites in a Knudsen tungsten cell in the temperature range of 1000–2400°C.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Abstract
        - quote: A peculiarity of the evaporation of the inclusions is that the silicon component is preserved in the residual
            melt to high temperatures exceeding 2200°C.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Abstract
        - quote: At the same time, magnesium oxide completely evaporates from the melt, which leads to a decrease in the spinel
            content and even its disappearance during the crystallization of the residual melt at 2000°C.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Abstract
        - quote: Magnesium evaporation leads, in turn, to an increase in the Al2O3 content in the melt and, accordingly, to
            an increase in the content of gehlenite in melilite during its crystallization, as is observed in the high-temperature
            rims of subtype B1 inclusions.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Abstract
        - quote: Experiments have also shown that the high-temperature evaporation of Ca–Al inclusions occurs in an oxygen-rich
            atmosphere compared to carbonaceous chondrite matter.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Abstract
        - quote: In this regard, it is assumed that the condensation of the first mineral products of the inclusions occurred
            in the oxygen-rich atmosphere of the star (O-rich AGB) outside the protosolar system.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Abstract
        - quote: CAIs represent the oldest material of the Solar System and were dated at 4.567 Ga.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Introduction
        - quote: Chemically, CAIs consist of low-volatility (Al2O3, CaO, and TiO2) and medium-volatility (MgO and SiO2) oxides.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Introduction
        - quote: CAIs are rich in ¹⁶O (Clayton et al., 1973) and daughter products of some short-lived isotopes.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Introduction
        - quote: CAIs show evidence of mass-dependent isotope fractionation of Mg, Si, and O and evidence of nonlinear isotope
            anomalies of some elements of unknown nature.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Introduction
        - quote: A general consensus has been reached that CAIs formed at the condensation of solar-composition gas during
            the earliest evolution of the Sun.
          locator:
            page: 1
            published_page: 551
            pdf_page_index: 0
            section: Introduction
        - quote: CAIs of type A consist of melilite (mineral of the series akermanite Ca2MgSi2O7–gehlenite Ca2Al2SiO7), which
            commonly makes up ≥80 vol %, and magnesian spinel (MgAl2O4) in an amount of 5–15 vol %.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Introduction
        - quote: CAIs of type B are made up of melilite (60–70 vol %), Al,Ti-clinopyroxene Ca(Mg,Al,Ti+3,Ti+4)[(Al,Si)2O6]
            (10–25 vol %), and spinel (~10 vol %).
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Introduction
        - quote: Type B is poorer than type A in CaO and Al2O3 but notably richer in MgO and SiO2 (Table 1).
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Introduction
        - quote: Subtype B2 is mineralogically analogous to the cores of subtype B1.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Introduction
        - quote: Another major type of CAIs is C.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Introduction
        - quote: Type C of CAIs are mineralogically analogous to subtype B2 but are richer in anorthite than melilite and
            consist of anorthite (~50 vol %), melilite (~20 vol %), Ti–Al pyroxene (15–20 vol %), and spinel (~5 vol %).
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Introduction
        - quote: The evaporation experiments were carried out with the matter of CAIs of Types A and B, which were extracted
            from the Efremovka chondrite (CV3) by Dr. A. A. Ulyanov (Moscow State University) and kindly provided for our
            experiments.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: As seen in Table 1, the studied samples of type-A and B CAIs (Nazarov et al., 1984) corresponded to the composition
            ranges of inclusions discussed in (Grossman et al., 2000; Ivanova, 2023).
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: For illustrative purposes and comparison of evaporation features of CAIs of types A and B, we also present
            earlier data on the evaporation of the well-known Murchison chondrite (CM2).
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: The compositions of the Murchison chondrite (Dyakonova et al., 1979) and FAN1 CAIs (Mendybaev et al., 2013)
            are also listed in Table 1.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
            note: FAN1 is as printed in prose; the table heading is FUN1.
        - quote: The evaporation of melts of CAIs of Types A and B was experimentally studied using a Knudsen tungsten cell
            in the temperature range of 1000–2400°C and a MS-1301 mass spectrometer.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: The experiments were carried out at an accelerating voltage of 3 kV, with an entry slit of ion source 0.12
            mm wide, with the energy scatter of the ions no more than 0.5 eV.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: Samples (4) 10–15 mg in mass were evaporated from a tungsten cylindrical effusion cell (d = 15 mm, h = 16
            mm).
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
            note: (4) is the Figure 1 sample label, not a sample count.
        - quote: To preclude direct contact between the powdered sample and cell, the sample powder was placed into a rhenium
            liner (3), thus preventing immediate interaction between the molten sample and the tungsten cell material but
            not to preclude interaction between gas phase components over the melt (6) with the cell.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: No interactions between gas-phase components and the rhenium liner (3) were detected.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: 'The ratio of the surface area of the effusion orifice in the lid of the cell (2) to the evaporation surface
            area in the cell was 1 : 400 and enabled melt evaporation under conditions close to equilibrium, which are referred
            to as stationary evaporation conditions (Semenov et al., 1976).'
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: The temperature was measured by a EOP-66 optical pyrometer based on the luminosity intensity of the orifice
            (5) in the body base of the tungsten effusion cell (1), through a pyrometric window, with regard to light absorption
            in the window material.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
        - quote: Temperature was measured accurate to 10 at 1800°C.
          locator:
            page: 2
            published_page: 552
            pdf_page_index: 1
            section: Experimental
            note: Unit after 10 omitted in the English translation.
        - quote: Note that according to (Stolper, 1982; Stolper and Paque, 1986), the studied material of Type-A and B CAIs
            placed into a Knudsen effusion cell was a homogeneous liquid at temperatures above ~1400°C.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The partial pressures of molecular species of gas phase (p_i) over the melts were calculated using data on
            the partial pressure of standard substance (p_s) by the relation (Semenov et al., 1976).
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The standards were thermodynamic data on the partial pressure of gold (Paule and Mandel, 1972).
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: 'The following ions were identified in the mass spectra of vapor over the melts: Ca⁺, Mg⁺, Al⁺, AlO⁺, Al₂O⁺,
            SiO⁺, SiO₂⁺, O₂⁺, K⁺, Na⁺, SO₂⁺, Fe⁺, Ni⁺, Cr⁺, TiO⁺, and TiO₂⁺.'
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The detected WO₂⁺ and WO₃⁺ molecular ions corresponded to gaseous tungsten oxides, which were formed by the
            interaction between the oxygen of the gas phase and the material of the tungsten effusion cell by the reactions
            [W] + 2(O) = (WO₂) and [W] + 3(O) = (WO₃) (phases and square brackets are condensed and gaseous, respectively).
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The occurrence of the CaWO₃⁺ and CaWO₄⁺ ions in the mass spectra of the vapor were formed by reactions (CaO)
            + (WOᵢ) = (CaWOᵢ₊₁) in the gas phase.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: Note that calcium complex compounds forming in the gas phase start to fragment at ionizing electron energies
            higher than 13–15 eV and form the CaO⁺ fragment ion (Drowart et al., 1964), which was taken into account in our
            thermodynamic calculations.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The molecular flux from the effusion cell was ionized by electron impact at 28 eV ionizing electron energy.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The detector was a secondary-electron multiplier with an open entrance and with a multiplication coefficient
            of 10^5 at 2.3 kV.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The experiments were carried out at a stepwise increase in the temperature up to the complete evaporation
            of the sample.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: At each temperature step, the intensities of the ion currents were measured for 10 min.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The temperature was increased at a rate of ~3°C/min for all test compositions (Fig. 2).
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
        - quote: The temperature regime chosen for the heating of the Knudsen effusion cell did not allow the total vapor
            pressure over the melts to increase above 10–4 atm, which warranted us to regard the gas phase over the melt as
            an ideal one.
          locator:
            page: 3
            published_page: 553
            pdf_page_index: 2
            section: Experimental
            note: This total vapor pressure over the sample is not chamber background pressure.
        - quote: At high temperatures, oxide components of the melts dissociate, and the vapor over these melts contains mostly
            atomic and suboxide species, such as K, Na, Fe, Ni, Mn, Cr, Mg, Ca, Al, as well as PO, PO2, SiO, TiO, TiO2, AlO,
            Al2O, and Al2O2.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: Oxygen occurs as atomic and molecular species.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: The temperature sequence of the origin of metalized and oxide–suboxide species over melts generally coincides
            with the sequence of the pure oxide volatilities.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: 'For the major oxides of basalt and chondrite, this sequence (in descending order of the volatilities of
            the oxides) in the form of gaseous species really occurring in the vapor is commonly as follows: K → Na → Fe →
            SiO → Mg → Ca → TiO → Al.'
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: Note that the aforementioned sequence of the major oxides of CAIs arranged in descending order of their volatility
            should not be considered universal.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: It has been demonstrated (Mendybaev et al., 2013, 2014) that Mg volatility is higher than that of Si at the
            evaporation of high-Mg forsterite-bearing FAN CAIs melts, despite the fact that Mg oxide is less volatile than
            Si oxide.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
            note: FAN as printed here; p. 552 prints FAN1 and Table 1 prints FUN1.
        - quote: Obviously, the concentration of Mg oxide is very high compared to the compositions of CAIs of Types A and
            B.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: Results of experiments on the evaporation of CAIs of types A and B (Table 1) are presented in Fig. 4, which
            displays the partial pressures of the dominant Mg, SiO, Ca, and Al gaseous species calculated by (1) over the
            corresponding melts of CAIs of type A and B.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: The maximum in the Mg partial pressure shifts to the right relative Si along the temperature axis at the
            evaporation of type-B CAI melt, which is richer in Mg oxide.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: The Ca and Al partial pressures are higher at the evaporation of type-A CAIs.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: The initial type-A CAI melt is richer in Ca and Al oxides.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: 'In spite of the differences in the original compositions of CAIs of types A and B, the temperature sequence
            of the evaporation of melt components are closely similar and equally unusual: Mg → (SiO ≈ Ca) → Al.'
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: As an example, Fig. 3a shows the temperature evaporation sequence of the oxides of interest (those of Si,
            Mg, Ca, and Al) from melt of the Murchison (CM3) chondrite.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
            note: The same source calls the Murchison comparison CM2 on p. 552.
        - quote: 'The temperature dependences of the partial pressures of the dominant species of the gas phase over the melt
            make up the following evaporation sequence according to which the compounds of interest for this study pass into
            a vapor state: SiO → Mg → Ca → Al.'
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: 'Note the evaporation of the silicon and magnesium oxides: the former completely evaporates from the melt
            at 1870°C, whereas the latter still occurs in the melt (in an amount of 40 mol %) at this temperature and completely
