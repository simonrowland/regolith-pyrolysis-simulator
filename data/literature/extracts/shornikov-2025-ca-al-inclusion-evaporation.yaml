          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
            note: The preceding sentence identifies silicon and magnesium oxides; “the latter” is magnesium.
        - quote: Therewith only calcium and aluminum oxides still remain in the melt.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: The silicon partial pressure remains practically unchanging up to 2300°C, i.e., the temperature of complete
            melt evaporation.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: Therewith practically no Mg is detected in the vapor starting at temperatures above 1900°C.
          locator:
            page: 4
            published_page: 554
            pdf_page_index: 3
            section: Discussion of the experimental results
        - quote: Figure 5 shows the results of calculations done based on experimental data on the composition of residual
            melts of CAIs of type A and B in the process of their high-temperature evaporation.
          locator:
            page: 5
            published_page: 555
            pdf_page_index: 4
            section: Discussion of the experimental results
        - quote: It can be seen that the content of magnesium oxide in the residual melt decreases to zero due to evaporation
            at 2000°C, whereas silica remains detectable, although in a very low content, up to 2300°C.
          locator:
            page: 5
            published_page: 555
            pdf_page_index: 4
            section: Discussion of the experimental results
        - quote: 'Subtype B1 typically shows clearly discernible zoning: these CAIs possess clearly discernible almost monomineralic
            zones dominated by melilite (melilite mantle), whereas no such mantles are found in subtype-B2 CAIs.'
          locator:
            page: 5
            published_page: 555
            pdf_page_index: 4
            section: Zoning of subtype-B1 CAIs
        - quote: The clearly seen outermost zone consists of melilite, and the outer rim of the mantle is depleted in akermanite
            (Ca2MgSi2O7), because of which the melilite is dominated by the gehlenite (Ca2Al2SiO7) end member.
          locator:
            page: 5
            published_page: 555
            pdf_page_index: 4
            section: Zoning of subtype-B1 CAIs
        - quote: A compositional profile for CAIs of subtype B1 (sample 5241) from the Allende chondrite shows that melilite
            in the central parts of these CAIs contains ~50 wt % akermanite; the akermanite concentration in the mantle zone
            decreases to ~20 wt %; and this concentration in the outermost zone is ~7 wt % (Kerekgyarto et al., 2016).
          locator:
            page: 5
            published_page: 555
            pdf_page_index: 4
            section: Zoning of subtype-B1 CAIs
        - quote: The outermost zone of the inclusion is completely devoid of magnesian spinel (MgAl2O4), which is found in
            the central portion of the inclusion.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Zoning of subtype-B1 CAIs
        - quote: A melt droplet evaporated and lost its magnesium and silicon and simultaneously crystallized starting with
            its marginal parts toward the center.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: The selective evaporation of magnesium resulted in that magnesium-bearing minerals (spinel and Al,Ti-clinopyroxene)
            disappeared from the outer melted zone of the CAIs.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: The melt simultaneously enriched in low-volatility Al2O3 and CaO, and correspondingly, in gehlenite in the
            melilite.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: The occurrence of a melilite rim (mantle) in the material of subtype B1 CAIs and the absence of the mantle
            from subtype B2 was controlled by the evaporation rates of magnesium and silicon compared to their diffusion rates
            in the melt.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: If the diffusion rate is low and fails to maintain the chemical heterogeneity of the melt droplet, the rapid
            evaporation of magnesium and silicon from the outer zone of a melt droplet should lead to the crystallization
            of melilite enriched in gehlenite.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: This hypothesis has been experimentally tested in (Mendybaev et al., 2006) by studying the evaporation of
            CAIs of type B within a broad temperature range (1150–1650°C) and at broadly varied melting time (from hours to
            days), as well as various hydrogen pressure.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: Subtype B1 might have formed at pH₂ > 10⁻⁴ atm, whereas subtype B2 was produced at pH₂ < 10⁻⁵ atm.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: These experiments have demonstrated that the relatively rapid evaporation of melts in a hydrogen atmosphere
            is associated with a notable decrease in the magnesium concentration and a much less significant silicon concentration.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: For example, experiments in (Mendybaev et al., 2006) showed very low evaporation losses of relatively high-volatility
            silicon and, hence, its practically unvarying concentration in the melt, whereas magnesium evaporated very actively,
            and thus, its concentration in the melt notably decreases.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: At the same time, results of our experiments on the evaporation of silicate melts and chondrites (Yakovlev
            et al., 1984, 1987; Markova et al., 1986) definitely demonstrate that silicon (more specifically, silica) is a
            more volatile component of the melt than magnesium oxide.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: It has been demonstrated (Yakovlev et al., 1984; Shornikov and Yakovlev, 2023) that experiments with CAIs
            show complete Mg disappearance from the melt at the preservation of the silicon component.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: When magnesium completely evaporates from the melt of type-A CAI sample, the melt still contains ~20 mol
            % silica, and when magnesium completely evaporates from the melt of type-B CAI sample, the melt still contains
            ~16.5 mol % silica.
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: 'Inasmuch as MgO-bearing compounds occurring in the residual CAI melt completely evaporate from it at temperatures
            below 2000°C, a source of the Si-bearing component of CAI melt at temperatures above 2100°C can, theoretically,
            be two compounds: gehlenite and akermanite.'
          locator:
            page: 6
            published_page: 556
            pdf_page_index: 5
            section: Discussion
        - quote: As evident from Fig. 6, the activity of anorthite at high temperatures is roughly 10^5 times lower than the
            activity of gehlenite.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
        - quote: This low activity value of the end member indicates that it is practically absent from this melt.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
        - quote: This implies that the preservation of the silicon component in residual melts of CAIs of types A and B at
            evaporation at temperatures above 2100°C can be explained by the presence of gehlenite, which is highly stable
            in CAI melts.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
        - quote: Silica retention in the outermost melt zone of CAIs of subtype B1 takes place at magnesium evaporation.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
        - quote: During the subsequent crystallization of the melt, this leads to that spinel disappears and akermanite in
            gehlenite reduce, that is observed in the zone of the melilite rim of the CAIs substance.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
        - quote: Moreover, spinel decompositions and magnesium evaporation are associated with an increase in the Al2O3 concentration
            (Mendybaev et al., 2006), which also leads to enrichment of the melilite in gehlenite.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
            note: “Spinal” is transcribed as printed in the English translation where legible; the sentence concerns spinel.
        - quote: Figure 7a shows the calculated dependences of the end member activities on the concentration of low-volatile
            Al2O3, which increases during the melt evaporation; the activities of spinel decreases and that of gehlenite increases.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
        - quote: Figure 7b also shows a decrease in the gehlenite to akermanite ratio in the melilite (curve 1), as is actually
            seen in the compositional profiles across monomineralic melilite rims of the subtype-B1 CAIs.
          locator:
            page: 7
            published_page: 557
            pdf_page_index: 6
            section: Discussion
            note: Internally conflicts with Figure 7 caption/panel on p. 558.
        - quote: 'Our experimental data uncover still another evaporation feature of CAI melts: they are rich in oxygen, which
            is also seen from the high oxygen partial pressure during the final high-temperature evaporation stage of the
            matter.'
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: The partial pressure of molecular oxygen was determined experimentally, and the partial pressure of atomic
            oxygen was calculated using the reaction (WO₂) + (O) = (WO₃).
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: The values of pO thus obtained are reasonably well consistent with those determined from analogous reactions
            involving oxygen.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: Figure 8 shows the total oxygen pressure depending on temperature during the evaporation of melts of CAIs
            of type A and B.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: The differences are obvious, particularly in the high-temperature evaporation region, where oxygen partial
            pressure over CAI melts monotonously increases and reaches a maximum.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: Figure 8b displays dependences of the ratios of concentrations of molecular to atomic oxygen on melt temperature,
            which show the dominance of atomic species.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: Arguments were presented (Sahijpal and Soni, 2006) that the explosion of a low-mass star (whose mass was
            about 3 Sun masses) of the TP-AGB (Termally Pulsing Asymptotic Giant Branch) type occurred at a distance of ∼30
            light years from the protosolar gas–dust nebula.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
            note: Background astrophysical hypothesis cited by the authors.
        - quote: The exploded star may have been of the O-rich AGB class, i.e., a star rich in oxygen, with a ratio of C/O
            < 1 in the gas.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: This gas could condense oxide and silicate phases.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: The authors also argue that an oxygen-rich star of this type is a good candidate as a principal “provider”
            of short-lived radionuclides like 26Al, 41Ca, 60Fe, and 107Pd.
          locator:
            page: 8
            published_page: 558
            pdf_page_index: 7
            section: Oxygen at CAI evaporation
        - quote: Indeed, the experimental results indicate that the CAI evaporation at high temperatures (>1700°C) proceeds
            at a relatively high pressure of oxygen (Fig. 8a), which occurs in the gas as atomic and molecular species.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: As a temperature increases within the range of 1800–2000°C, the O₂/O ratio decreases by one order of magnitude,
            and the gas comes to be dominated by atomic oxygen.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: The experimental data indicate that the evaporation of chondrite terminates at ~1900°C, and the gas ceases
            to be replenished with oxygen.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: However, the melts of CAIs of types A and B evaporate at temperatures above 1900°C and release much oxygen.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: It is reasonable to suggest that the reverse process (condensation of carbonaceous chondrite and CAIs) also
            took place at different temperatures and under different external oxygen pressures.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: The first mineral products of CAIs should have condensed in an oxygen-rich environment.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: Comparison of data on the evaporation of CAIs of type A and B within the temperature range of 1600–2300°C
            reveal undoubted similarities, despite the differences in their compositions.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: It is demonstrated that the retention of the silicon component in the residual melts of CAIs of type A and
            B during evaporation at temperatures above 2100°C is caused by gehlenite presence, which is a mineral highly stable
            in CAI residual melts.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: The evaporation of CAI melts at temperatures above 2000°C is associated with the complete disappearance of
            magnesium from the melt and the retention of the silicon component.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: In this situation, the residual melt crystallizes neither spinel nor any other Mg-bearing minerals, as is
            the case with the CAIs of subtype B1 rims.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: Spinel decomposition in the residual melt and magnesium evaporation from it leads to alumina enrichment in
            this melt, which in turn, leads to gehlenite enrichment in the melilite, as is actually seen in the edges of the
            high-temperature zone of CAIs of subtype B1 rim.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: The evaporation of CAIs of type A and B is associated with the release of much oxygen from the melt.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
        - quote: It can be hypothesized that the condensation of the first mineral products of CAIs also occurred in an oxygen-rich
            environment.
          locator:
            page: 9
            published_page: 559
            pdf_page_index: 8
            section: Conclusions
