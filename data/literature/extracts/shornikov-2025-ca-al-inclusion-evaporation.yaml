extraction:
  method: >-
    Table 1 was transcribed from the MinerU content-list table and checked
    against pdftotext-layout. The MinerU table QA numeric agreement is 1.000.
    Its four data rows and all 32 numeric cells were checked against the 600 dpi
    render of PDF page 2; 28 nonduplicate cells are retained here. The four
    Murchison cells are cited in the table context but not repeated because the
    same source values are already in shornikov-2023-cai-melt-evaporation.
    Figures 3–8 are represented as context only. No plotted coordinates were
    digitized; Figure 4 pressures and Figure 5 residue compositions remain
    figure-read candidates. Figure 4 shows Ca, Mg, Al, and SiO, while Na, K, and
    Fe appear only in the detected-ion list, without pressure curves.
