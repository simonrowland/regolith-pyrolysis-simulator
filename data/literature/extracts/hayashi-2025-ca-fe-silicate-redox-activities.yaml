extraction:
  method: MinerU Table 1 and born-digital pdftotext transcription; page 3 render checked row and column assignment,
    all pO2 exponent cells, and every activity and valence cell. Full audit and comparison limitations are in the
    companion audit.
  date: '2026-11-02'
  worker: codex
  review_status: draft
  note: 'Table 1 prints 14 sample rows, although the experimental prose says 7 of 13 samples had Mössbauer measurements.
