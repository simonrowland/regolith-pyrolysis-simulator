    percent is typed; the octahedral and tetrahedral Fe3+/Fetotal percentages are typed-refused because no exact
    site-fraction identity exists. The unreported total pressure and per-gas CO/CO2 flow ratio remain unknown. Figure
    1 spectra and Figures 2, 3, 6, and 7 contain figure-read candidates and were not digitized.'
