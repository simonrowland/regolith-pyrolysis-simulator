schema_version: literature_extract.v1
source_id: yang-teng-seetharaman-2012-vanadium-evaporation
source:
  citation: >-
    Yang Y., Teng L., Seetharaman S. (2012). Kinetic Studies on Evaporation of
    Liquid Vanadium Oxide, VOx (Where x = 4 or 5). Metallurgical and Materials
    Transactions B. DOI 10.1007/s11663-012-9742-3.
  doi: 10.1007/s11663-012-9742-3
  year: 2012
extraction:
  method: >-
    Printed prose values transcribed from the born-digital pdftotext-layout;
    Figures 1–13 are recorded for a later figure pass and were not digitised.
    The numeric mass-loss summaries in the Results are retained as measured
    reduced values. Fitted coefficients, enthalpies and curves remain context.
  date: '2026-10-21'
  worker: codex
  provenance_path: text/yang-teng-seetharaman-2012-vanadium-evaporation/pdftotext-layout.txt
review_status: draft
