      - observation_id: vanlimpt_2011_transpiration_gas_film_method_context
        type: method
        locator: {page: 5, published_page: 81, pdf_page_index: 4, figure: '2', section: '5. Experimental procedure'}
        units: as printed
        values:
          quantity: gas_film_mass_transfer_method_context
          method_class: method_only
          apparatus: >-
            Laboratory transpiration evaporation facility with a tube furnace,
            platinum/rhodium boat and sampling probe, a 30 cm platinum/rhodium
            coating on the ceramic tube, gas inlet, and gas wash bottles. The
            boat contains about 25 g glass. Temperature near the boat is measured
            with a calibrated Pt/Rh thermocouple type B.
          gas_flow_and_composition: >-
            At the set-point temperature the tube is flushed with a controlled
            gas flow; gas velocity and furnace atmosphere are controlled. During
            a test, pO2, pH2O, and pN2 are fixed. The laboratory gas-flow rate
            and velocity are not numerically reported.
          measurement_protocol: >-
            Volatile species are sampled through a platinum/rhodium probe and
            collected in gas wash bottles. A 6 to 8 h experiment uses four
            samples, each with a duration of 1 h. Boat mass loss is measured
            gravimetrically after each experiment.
      - observation_id: vanlimpt_2011_gas_film_relation_context
        type: method
        locator: {page: 2, published_page: 78, pdf_page_index: 1, section: '3. Modelling of evaporation rates'}
        units: as printed
        values:
          quantity: gas_film_mass_transfer_relation_context
          method_class: method_only
          gas_film_relation_as_printed: >-
            Equation (6): Qg,i = Sh (Di/Lg) ((pi* - pi)/(RT))
            = (Di/deltaN) ((pi* - pi)/(RT)). Sh is the flat-plate Sherwood
            number, Sh = h Lg / D. Here h is the mass-transfer coefficient,
            D the interdiffusion coefficient, Lg the distance from the leading
            edge, pi the vapour pressure, R the universal gas constant, T the
            temperature, and deltaN the Nernst boundary-layer thickness. The
            relation assumes uniform temperature across that layer.
          industrial_gas_film_context: >-
            For an industrial furnace, Lg is the characteristic length of the
            gas stream flowing directly over the melt, typically a few metres.
            CFD may be used to calculate local Nernst boundary-layer thickness
            and local melt-surface temperature.
      - observation_id: vanlimpt_2011_experimental_range_and_species_scope_context
        type: laboratory_conditions
        locator: {page: 6, published_page: 82, pdf_page_index: 5, figure: '3', section: '6. Results'}
        units: as printed
        values:
          quantity: experimental_temperature_gas_range_and_species_scope_context
          method_class: method_only
          temperature_range: >-
            Experiments were performed at about 1400, 1450, and 1500 °C. The
            apparatus maximum is about 1500 °C.
          gas_flow_and_composition: >-
            The paper states the partial water-vapour pressure was set between
            0 and 0.35 bar. This is a stated partial-pressure range, not a
