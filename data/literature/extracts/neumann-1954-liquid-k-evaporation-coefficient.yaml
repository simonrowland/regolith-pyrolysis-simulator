schema_version: literature_extract.v1
source_id: neumann-1954-liquid-k-evaporation-coefficient
source:
  citation: 'Neumann, K. (1954), "Der Verdampfungskoeffizient des flüssigen Kaliums", Z. Phys. Chem. 2(3-4), 215-228.'
  doi: 10.1524/zpch.1954.2.3_4.215
  year: 1954
extraction:
  method: >-
    Machine-text transcription from pdftotext-layout.txt and the MinerU table block;
    Table 1 was cross-checked against both reads and its rendered page 2. Table 2
    is absent from the MinerU chunk; every numeric cell on PDF page 13 was checked
    against a pdftoppm render because pdftotext lost or garbled exponents. The
    staged standalone MinerU converter was used for the required presence compare:
    tools/mineru_table_draft.py (offer-21 line; run standalone).
  date: '2026-10-22'
  worker: codex
  provenance_path: raw/neumann-1954-liquid-k-evaporation-coefficient/neumann-1954-liquid-k-evaporation-coefficient.pdf
  note: >-
    Table 2 measures pure liquid potassium, not a silicate melt, between 66.6 and
    119.2 °C (339.75–392.35 K). This is direct evidence relevant to the runtime's
    K entry flagged no_direct_k_sticking_coefficient in
    vacuum_pyrolysis_sticking.yaml; it is a measured evaporation coefficient,
    not a sticking measurement. The paper reports alpha near 1 and no temperature
    dependence over this range.
  audit:
    printed_row_counts: {table_1: 12, table_2: 5}
    table_1: >-
      PDF p2: MinerU HTML and pdftotext agree on the numeric alpha and delta cells,
      including comma decimals and the printed ± on the Prüger water row. The
      render confirms each row/column assignment. In pdftotext, CCI, is the row-4
      CCl4 token and the row-5 species cell is blank; the render reads row 5 as
      C9H6. Delta is the printed free angular ratio,
      retained as context because this extract's quantity is alpha. Schema gap:
      no free-angular-ratio quantity token exists. Neumann's K row is retained as
      his own summary value, not attributed to prior work.
    table_2: >-
      PDF p13: render checked all numeric cells in rows 66.6, 66.7, 104.5, 111.0,
      and 119.2: theta, p, 2a0, 2b0, t, A, B, l−2a0, and alpha. The render resolves
      the text layer's lost exponents; the five row headings and column assignments
      match the printed table. Alpha values are measured_reduced from the authors'
      measured droplet evaporation and their printed equations (4)–(6). p is
      model-derived context computed with Neumann–Völker's equation; the paper's
      underlying equation inputs are not tabulated here, so p is not extracted as
      a separate model-derived observation.
    table_2_render_values: >-
      Row order (theta_C, p_mmHg, 2a0_cm, 2b0_cm, t, A_cm_s, B_cm3_s,
      l_minus_2a0_cm, alpha): (66.6,1.20e-6,0.15,0.12,200 h,2.55e-8,1.6e-10,0.55,0.89);
      (66.7,1.21e-6,0.12,0.11,211 h,2.7e-8,0.7e-10,0.18,0.93);
      (104.5,2.66e-5,0.12,0.10,180 min,0.93e-6,2.7e-9,0.38,1.01);
      (111.0,4.23e-5,0.11,0.10,220 min,1.45e-6,2.7e-9,0.29,1.00);
      (119.2,7.4e-5,0.12,0.10,190 min,2.40e-6,6.0e-9,0.38,0.95).
    mineru_compare: >-
      Staged standalone converter produced one p2 table draft. The required compare
      completed with total=0 because this tool version does not scan alpha values;
      p13 has no MinerU table. p2 numeric assignment was separately checked against
      the render; p13 numeric cells are all recorded above as render-checked.
    table_2_pressure_interpretation: >-
      The paper's p is saturation pressure calculated from equation (11), not
      chamber pressure. The runs are described as high vacuum; no chamber pressure
      is printed. The p column is retained as published context, with no total
      pressure stored in point_conditions or bound to identity.
    schema_gaps:
    - 'Table 1 delta: free angular ratio has no schema quantity token; kept as printed context.'
    - 'Table 2 pressure p is model-derived, but its Neumann–Völker equation inputs are not stored in this source; retained as context, not a typed pressure observation.'
review_status: draft
