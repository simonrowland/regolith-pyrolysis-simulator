    not as data. Table 1 DTA transitions transcribed in full. TGA and DTA profiles in Figures 1-4 are
    figure-only and were not digitised. Runs are flowing nitrogen, not vacuum. JSC-1AF mineral percentages
    in the Discussion are quoted from Carpenter 2005 / Taylor 2005, not this work's table.
