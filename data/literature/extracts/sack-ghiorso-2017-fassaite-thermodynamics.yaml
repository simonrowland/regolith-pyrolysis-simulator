extraction:
  method: >-
    Table 3 and Table 4 were transcribed by hand from the born-digital source
    and checked against 600 dpi renders of PDF pages 17 and 29 (printed pages
    823 and 835); numeric cells, signs, footnote marks, and row/column
    assignments were checked. MinerU returned only the equation continuation
    of Table 2. Tables 1 and 2 contain model expressions, not measured or
    quoted numeric data. The paper reports no new measurements in its tables.
    Table values are preserved as unscored context, with model_derived and
    quoted_attributed provenance identified per value. Figures 1–13 were
    inspected only to identify captions, series, and markers; plotted values
    were not digitized.
