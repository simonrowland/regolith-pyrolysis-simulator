          species: Di–Gr–AlBf–CATS fassaite solid solution
          model_system_as_published: Di–Gr–AlBf–CATS fassaite solid solution
          model_endmembers_as_published: >-
            diopside (CaMgSi2O6), grossmanite (CaTiAlSiO6),
            alumino-buffonite (CaMg1/2Ti1/2AlSiO6), and CATS (CaAl2SiO6)
          endmembers_as_published: diopside, grossmanite, alumino-buffonite, CATS
          temperature_as_published: 1473 K, 1503 K, and schematic 1511 K
          axes_as_printed:
            - Ternary fassaite composition projection with vertices Diopside, Grossmanite, and Alumino Buffonite.
            - Natural compositions projected from the CATS apex.
          caption_summary: >-
            Comparison of CAI fassaite composition data with a schematic
            extension of the Di–AlBf gap of Sack and Ghiorso (1994a, small
            purple circles) into the Di–Gr–AlBf ternary subsystem (green
            curves) to highlight the prominent gap between high- and low-Ti
            fassaite compositions. This extension is based on two improbable
            assumptions: equivalent critical temperatures (1511 K) for
            Di–AlBf and Di–Gr solid solutions (W12 = 41.68 kJ/gfw with random
            Si–Al mixing), and simple, continuous two-phase regions connecting
            these binary miscibility gaps. Accordingly, this representation is
            meant to highlight the composition gap only, and it is anticipated
            that any resemblance to the actual phase diagram is unlikely, if
            not coincidental, as, except for Di–AlBf, the schematic binodes are
            not based on physical evidence or rigorous thermodynamic analysis.
            Compositions of natural fassaites are projected from the CATS apex
            of the diopside–grossmanite–alumino-buffonite–CATS tetrahedron onto
            the diopside–grossmanite–alumino-buffonite face. Dashed lines are
            tielines connecting Ti-rich fassaite cores with diopsidic,
            Wark–Lovering rims reported by Wark and Lovering (1982), Meeker and
            others (1983), and Dyl and others (2011), compositions of
            coexisting sectors in zoned fassaites estimated from a graph in
            Simon and others (2003), and CAI fassaite data reported by Grossman
            (1975), El Goresy and others (1985), Beckett (ms, 1986), Bischoff
            and Palme (1987), Simon and Grossman (2006), and Simon and others
            (2001, 2007). Finally, the bright red star represents the type
            specimen for the mineral grossmanite (Ma and Rossman, 2009), a
            specimen which is richer in alumino-buffonite than in grossmanite.
          attribution: >-
            Plotted compositions are attributed to the cited sources listed in
            the series; schematic curves and assumptions are from this study.
