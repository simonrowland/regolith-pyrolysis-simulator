          caption_summary: >-
            Calculated phase relations compared with experimental constraints
            in the Di–AlBf–CATS fassaite ternary. Red diamonds connected by red
            lines represent experimental fassaite pairs produced at
            temperatures between 1501 and 1508 K (Yang, 1975); red circles
            are homogeneous fassaites produced between 1497 and 1511 K.
            Dashed lines with temperature labels are the calculated binodes
            of Sack and Ghiorso (1994a). Green and black curves are the
            calculated binodes at 1505 K for W13 = 17.23, W14 = 0 and W34 =
            24 kJ/gfw and for s = 0, and for the values of W13, W14, W34,
            ΔH̄4*Dis, ΔW13, ΔW34, Δ²W13, Δ²W14, and Δ²W34 given in Table 3.
            Dashed blue curves represent the 1473 and 1505 K AlBf–CATS
            miscibility gap, metastable with respect to spinel, melilite,
            anorthite, perovskite and hibonite or less CATS-rich fassaite.
            Continuous and dashed green lines indicate tielines for the
            diopside–alumino-buffonite gap and stable and metastable portions
            of the alumino-buffonite–CATS gap calculated for s = 0. Black
            lines are representative tielines calculated for the UBG with the
            parameters in Table 3. Orange curves are approximate phase
            boundaries inferred from experimental constraints by Yang (1976).
          attribution: Yang (1975, 1976), Sack and Ghiorso (1994a), and this study, as stated in caption.
