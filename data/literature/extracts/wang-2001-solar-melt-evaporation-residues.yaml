extraction:
  method: Born-digital pdftotext-layout transcription. The Table 1 multi-sample cells were reconciled to 600-dpi
    PDF renders on physical pages 4–5; Table 1 and Table 2 row bindings use the printed sample IDs. The corpus has
    no MinerU table blocks for this paper, so the MinerU draft/emit mapping tool did not apply.
  date: '2026-10-20'
  worker: codex-fam22-1020
  provenance_path: raw/wang-2001-solar-melt-evaporation-residues/
review_status: draft
notes:
- The title on the PDF is Chemical and isotopic fractionation during the evaporation of the FeO-MgO-SiO2-CaO-Al2O3-TiO2
  rare earth element melt system; GCA volume 65, issue 3, pages 479–494; DOI 10.1016/S0016-7037(00)00529-9. This
  is the requested Wang et al. (2001) source.
- Table 1 reports bulk residue analyses after quench. The complete normalized oxide composition of each residue
  is not reconstructed from separately reported major oxides, rare-earth totals, and elemental ppm.
- Table 2's total-melt mass-loss percentages are typed once under each printed sample ID SC1–SC16. SC1 uses the
  Table 2 run-summary value 57.29 wt%; Table 1's 57.35 wt% disagreement is cited in that observation's locator.
- Table 3 evaporation flux J and volatility J/C are author-calculated from residue compositions and a melt-density
  parameterization. They are not stored as measured total-mass evaporation rates.
- The fitted and comparison alpha values in Table 5 are isotope fractionation factors, not Hertz–Knudsen evaporation
  coefficients; no compatible quantity token exists.
- Table 1 reports ΣLn2O3 as the total of all rare-earth oxides. The aggregate does not have a single species formula;
  the individual La–Lu ppm values are typed.
- Table 1 prints 1σ standard errors for individual components. Nonzero cell errors are retained as standard_errors
  in each row; printed zero errors are omitted. The current residue-series migration does not carry these component-specific
  errors onto migrated observations.
