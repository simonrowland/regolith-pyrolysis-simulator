    fractionation during the evaporation of the FeO-MgO-SiO2-CaO-Al2O3-TiO2 rare earth element melt system. Geochimica
    et Cosmochimica Acta, 65(3), 479–494.
  doi: 10.1016/S0016-7037(00)00529-9
  year: 2001
  corpus_asset: raw/wang-2001-solar-melt-evaporation-residues/wang-2001-solar-melt-evaporation-residues.pdf
