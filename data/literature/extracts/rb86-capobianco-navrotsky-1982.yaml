source:
  citation: >-
    Capobianco, C. and Navrotsky, A. (1982). Calorimetric evidence for ideal
    mixing of silicon and germanium in glasses and crystals of sodium feldspar
    composition. American Mineralogist 67, 718–724.
  year: 1982
  doi: null
  corpus_asset: raw/rb86-capobianco-navrotsky-1982/rb86-capobianco-navrotsky-1982.pdf
extraction:
  method: >-
    MinerU table drafts and emitted Table 1 density cells; all table cells
    transcribed or reconciled against 600 dpi renders. Table 1 densities are
    retained in context because the printed g/cm3 unit has no supported
    conversion to the density token's canonical kg/m3. Tables 2 and 3 are
    context-only because no store token represents unit-cell lengths/angles or
    enthalpy of solution. Figures 1–4 are deferred without numeric points.
  date: '2026-10-19'
  worker: codex-resume-38721-1792451527
  provenance_path: text/rb86-capobianco-navrotsky-1982/pdftotext-layout.txt
  source_note: >-
    Table 1 is measured glass density, with quoted endmember values. Candidate
    token: density. The token's canonical unit is kg/m3; the paper prints
    g/cm3, and the current migrator has no density unit conversion. The
    source also does not print the density measurement temperature or total
    pressure. Table 2 reports crystallographic cell lengths and angles, for
    which no store quantity token fits. Table 3 reports enthalpy of solution;
    candidate tokens H_minus_H298, delta_fH, partial_molar_enthalpy, and
    heat_of_fusion do not represent solution enthalpy. Figure 1 repeats Table
    3 data; Figure 2 plots calculated molar volumes, Figure 3 plots quoted
    logarithmic viscosity data, and Figure 4 is a calculated phase diagram.
    No figure points were digitized. The printed melting points and quoted
    NaAlSi3O8 heat of fusion in the text are typed observations. The
    calculated NaAlGe3O8 heat of fusion and Kp remain model context because
    their inputs are not stored as observations.
