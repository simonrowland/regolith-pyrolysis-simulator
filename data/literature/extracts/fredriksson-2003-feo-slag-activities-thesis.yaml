          '5': ^E G_m = x_Fe x_Pt L_FePt
          '6': L_FePt = Σ_(ν=0,...) (x_Fe − x_Pt)^ν ^νL_FePt
          '7': (A,B)_0.25 (A,B)_0.25 (A,B)_0.25 (A,B)_0.25
        sublattices: 4
        sites_each: 0.25
        moles_atoms: 1
        ordering: 'All four equivalent fractions: disordered A1; three identical and one distinct: L12; two identical
          pairs with distinct pair fractions: L10 (continuation PDF 24 / print 15). CEF supports two or more sublattices.'
    - observation_id: fredriksson_2003_ordered_fcc_model_equations
      type: thermodynamic_example
      locator:
        page: 24
        published_page: 15
        equation: 8–13
      units: as printed
      values:
        method_class: quoted_unattributed
        quantity: Fe–Pt ordered-model equations 8–13
        equations:
          '8': G_m = G_m^dis(x_i) + ΔG_m^ord(y_i)
          '9': x_i = 0.25 Σ_(s=1 to 4) y_i^(s)
          '10': ΔG_m^ord = G_m^4sl(y_i) − G_m^4sl(x_i)
          '11': G_m^4sl = Σ_i Σ_j Σ_k Σ_l y_i^(1) y_j^(2) y_k^(3) y_l^(4) °G_(i:j:k:l) + 0.25 RT Σ_s Σ_i y_i^(s) ln(y_i^(s))
            + ^E G_m
          '12': °G_FeFeFePt = °G_FeFePtFe = … = G_Fe3Pt; °G_FeFePtPt = °G_FePtFePt = … = G_FePt; °G_FePtPtPt = °G_PtFePtPt
            = … = G_FePt3
          '13': ^E G_m = Σ_i1 Σ_(i2>i1) Σ_j Σ_k Σ_l y_i1^(r) y_i2^(r) y_j^(s) y_k^(t) y_l^(u) L_(i1,i2:j:k:l) + … +
            Σ_i1 Σ_(i2>i1) Σ_j1 Σ_(j2>j1) Σ_k Σ_l y_i1^(r) y_i2^(r) y_j1^(s) y_j2^(s) y_k^(t) y_l^(u) L_(i1,i2:j1,j2:k:l)
            + …
        definitions: Colon separates sublattices, comma constituents on the same sublattice. First two CEF interactions
          included, random mixing within each sublattice, cyclic permutations; disordered site fractions equal mole
          fractions so ordering term is zero.
