          '17': G_m = Σ_i x_(Ci_ci O_ai) °G_(Ci_ci O_ai) + RT p Σ_i y_ci ln(y_ci) + ^E G
          '18': ^E G = f(T,y_Si4+) + Σ_(i=1 to m−1) (Σ_(j=i+1 to m) y_Ci y_Cj Ω^CiCj(O))
          '19': Ω^Ci,Cj(O) = Ω_1^Ci,Cj(O) + Ω_2^Ci,Cj(O) T + (y_Ci−y_Cj)(Ω_3^Ci,Cj(O)+Ω_4^Ci,Cj(O) T) + (y_Ci−y_Cj)^2(Ω_5^Ci,Cj(O)+Ω_6^Ci,Cj(O)
