schema_version: literature_extract.v1
source_id: farber-1972-al2o3-suboxides
source:
  citation: >-
    Farber, M., Srivastava, R. D. and Uy, O. M. (1972), "Mass Spectrometric
    Determination of the Thermodynamic Properties of the Vapour Species from
    Alumina", Journal of the Chemical Society, Faraday Transactions 1, 68,
    249–258.
  year: 1972
extraction:
  method: >-
    Table 2 (PDF p. 5; published p. 253) transcribed from the MinerU HTML table
    and pdftotext-layout, with the full table layout and each target cell
    checked against the rendered page. The table has eight temperature rows;
    this extract retains 2200, 2300, and 2400 K for all seven printed species
    columns (21 reduced pressure cells and 3 explicitly estimated Al2O3 cells).
    The six non-estimate columns are absolute partial pressures reduced from
    chopped KEMS ion intensities using thermochemical data. Al2O3 is parenthesized
    and marked (est.) in the table, so its values are retained only as estimates.
    Table 1 relative intensities and the thermochemical reduction provenance are
    summarized in the observation notes. The source prints no total experiment
    pressure or oxygen fugacity; neither is supplied here.
  date: '2026-10-23'
  worker: codex
  provenance_path: text/farber-1972-al2o3-suboxides/mineru/p001-p010/out/farber-1972-al2o3-suboxides-p001-p010/vlm/farber-1972-al2o3-suboxides-p001-p010.md
