    units: molar_percent
    locator: *methods
    quote: a fixed molar ratio of 92% Ar, 1.6% CO2, and 6.4% H2
  levitation_gas_flow_sccm:
    value: [800, 1000]
    units: sccm
    semantics: range
    locator: *flow
    quote: gas flow is in the range of 800-1000 sccm (14-18 cm3/s)
  levitation_gas_flow_cm3_s:
    value: [14, 18]
    units: cm3/s
    semantics: range_as_printed_not_recalculated
    locator: *flow
