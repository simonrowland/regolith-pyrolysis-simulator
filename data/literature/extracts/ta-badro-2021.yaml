source_conclusions:
  - statement: Relative SiO2/MgO evaporation is independent of pressure, oxygen fugacity and furnace hydrodynamical regime.
    evidence_class: author_stated_conclusion
    locator: *abstract
    supporting_locator: *elemental
    note: Recorded without evaluation; does not change measurement classifications.
source_discrepancies:
  - duration_ranges: Both conflicting printed ranges retained; no run ordering or midpoint inferred.
  - abstract_fit_uncertainties:
      Mg_26_24: {value: 0.9906, uncertainty: 0.0004}
