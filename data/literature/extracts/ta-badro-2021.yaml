laboratory_parameters: &laboratory_parameters
  starting_composition:
    composition_wt_pct: {MgO: 12, SiO2: 46, Al2O3: 19, CaO: 23}
    units: wt%
    locator: {<<: *table1, paragraph: Starting}
    quote: Starting | 12 | 46 | 19 | 23 | 0.6316 | 2.4211
    note: Nominal starting recipe; not a measured post-prefusion composition.
  precursor_chunk_mass_mg:
    value: 15
    units: mg
    locator: *methods
