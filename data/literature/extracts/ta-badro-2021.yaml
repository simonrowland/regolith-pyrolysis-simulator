    value: 1.5
    units: mm
    locator: *flow
    quote: through a 1.5 mm diameter hole in the nozzle
    note: Levitation gas inlet; not an effusion or Knudsen orifice.
  laser_heating:
    value: Infrared CO2 laser melts a contactless sample supported by upward gas in a conical nozzle.
    locator: *apparatus
  temperature_measurement:
    value: Pyrometer measures above 900 degC and returns a baseline of 900 degC below.
    locator: *pyrometer
    note: No calibration procedure, emissivity or stated temperature uncertainty.
  prefusion:
    value:
      temperature: {value: 1600, units: degC}
      duration: {value: 30, units: s}
      gas: pure O2
      cooling_rate: {value: 850, units: degC/s}
    locator: *methods
    note: Preparation step; 30 s is not an evaporation-run duration.
  elemental_analysis:
    value: Standardised SEM-EDX using Mg, Si, Ca and Al K-lines; glasses homogeneous without crystal nucleation.
    locator: *analyses
  isotope_analysis:
    value: Laser-ablation MC-ICP-MS; isotope deltas relative to bracketing BHVO-2G.
    locator: *analyses
