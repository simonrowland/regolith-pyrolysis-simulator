  year: 2020
  provenance_path: raw/vickerfalt-2020-mgo-v2o3/vickerfalt-2020-mgo-v2o3.pdf
  note: The study measured solid MgO, spinel, and V2O3 phase compositions. The d-223 PhaseRole enum has no solid
    role, so Tables 2-4 are retained with their printed values in context. Table 1 gives starting compositions and
    conditions. The pO2 values differ by a factor of 2 from the related 2024 Vickerfält thesis Table 9; both printed
    sets are recorded in context without conversion.
