source:
  citation: Vickerfält A, Martinsson J, Yan B, Sichen D (2020). Phase relationship in the system MgO-V2O3 between
    1661 and 1873 K at PO2=(3.55±0.2)×10^-6 and (3.55±0.3)×10^-5 Pa. Calphad 70, 101777.
