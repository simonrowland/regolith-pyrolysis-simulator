  year: 1988
  corpus_asset: raw/rego-1988-silicate-na2o-activities/rego-1988-silicate-na2o-activities.pdf
  corpus_sha256: c2ce80eeb49b9f99d9b6c5f9149a42d69110f941219f411964fde4c81a86d044
extraction:
  method: >-
    MinerU tables and pdftotext-layout were compared. Both printed tables were
    rendered at 600 dpi and every numeric cell was checked. The measured Na2O
    isoactivity compositions occur in figures only. Figs 3, 5 and 6 marker
    centres were read at 600 dpi. Figure 4 is curves only and was not
    sampled. Figures 1, 2, 7 and 8 remain deferred. Table I and Table II values
    are preserved in context, with printed logarithms unconverted and the
    calculated Table II values kept distinct from measurements.
  date: '2026-10-18'
  worker: w9-1018
