source:
  citation: 'Rego, D. N., Sigworth, G. K., and Philbrook, W. O. (1988). "Thermodynamic activity of Na2O in Na2O-CaO-SiO2, Na2O-MgO-SiO2, and Na2O-CaO-SiO2-Al2O3 melts at 1400 C." Metallurgical Transactions B, 19(4), 655–661.'
