      - observation_id: rego_1988_gas_melt_equilibration_method
        type: method
        locator:
          page: 1
          published_page: 655
          pdf_page_index: 0
          section: Gas-Phase Equilibration Method
        units: temperature C; gas pressure as described in the text
        values:
          quantity: gas_melt_equilibration_method
          method_class: method_only
          rail: melt_activity
          method_as_published: >-
            Multiple multicomponent melts were equilibrated through a shared gas
            phase with a binary Na2O-SiO2 master melt in graphite. The Na vapour
            pressure was established by Na2O(l) + C(s) = 2Na(g) + CO(g). The
            low-permeability graphite crucible was evacuated and backfilled with
            CO; pure CO maintained a slight positive pressure, and the gas was
            not swept over the melt during equilibration. The melts were stirred
            at 40 to 60 rpm and equilibrated for 3.5 to 4 hours. Samples were
            withdrawn rapidly, cooled in air, dissolved in toto, and analysed by
            flame atomic absorption and emission spectrophotometry.
          standard_state_as_printed: pure liquid Na2O at 1400 C
          T_C: 1400
          gas_atmosphere_as_published: pure CO; slight positive pressure
          total_pressure: unknown; no numeric value published
          printed_composition_basis: >-
            The plotted composition axes are in mol pct for ternary systems;
            Figure 6 gives normalized mole-fraction ratios and 10 or 20 wt pct
            Al2O3 series. Full per-marker compositions are not tabulated.
          uncertainty_as_published: no printed uncertainty for the Na2O activity data
          attribution: This work
