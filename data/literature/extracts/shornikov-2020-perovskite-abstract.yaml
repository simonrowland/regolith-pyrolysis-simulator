          attribution: Statements by Shornikov et al. (2020).
          phase_notation_as_printed: '(here and further square brackets denote the condensed phase, round brackets denote the gas phase).'
          equations_as_printed:
            - {equation: 1, reaction: '[CaO] = (CaO)'}
            - {equation: 2, reaction: '(CaO) = (Ca) + (O)'}
            - {equation: 3, reaction: '[TiO2] = (TiO2)'}
            - {equation: 4, reaction: '(TiO2) = (TiO) + (O)'}
            - {equation: 5, reaction: '(TiO) = (Ti) + (O)'}
            - {equation: 6, reaction: '2(O) = (O2)'}
            - {equation: 7, reaction: '[CaTiO3] = (CaTiO3)'}
          statements:
            - locator: {page: 1, pdf_page_index: 0, section: Introduction}
              method_class: quoted_attributed
              statement: 'Calcium titanate CaTiO3 (perovskite) — a relatively rare mineral, is of particular interest for cosmochemical studies as a mineral of refractory Ca–Al–inclusions (CAIs) found in carbonaceous chondrites.'
            - locator: {page: 1, pdf_page_index: 0, section: Introduction}
              method_class: quoted_attributed
              statement: 'Perovskite is one of the first condensates of the Solar System and the earliest mineral with unusual isotopic characteristics [1].'
            - locator: {page: 1, pdf_page_index: 0, section: Introduction}
              method_class: quoted_attributed
              statement: 'In addition to the perovskite, the existence of two titanates of calcium — Ca3Ti2O7 and Ca4Ti3O10, which are melted incongruently (Fig. 1), were established in the CaO–TiO2 system.'
            - locator: {page: 1, pdf_page_index: 0, section: Introduction}
              method_class: quoted_attributed
              statement: 'It is believed that perovskite is a polygenic material that combines a relict substance formed in a shell in the inner part of supernova stars, a condensation product from a high-temperature gas, and a crystallization product of a silicate melt [3, 4].'
            - locator: {page: 1, pdf_page_index: 0, section: Results and discussion}
              method_class: quoted_attributed
              statement: 'The established molecular composition of the gas phase over perovskite and over the CaO–TiO2 melts according to reactions, typical for the evaporation of individual oxides is shown below:'
            - locator: {page: 1, pdf_page_index: 0, section: Results and discussion, equations: '1-7'}
              method_class: quoted_attributed
              statement: 'The (CaTiO3) presence in the gas phase in minor amounts was testified by the occurrence of the following heterogeneous reaction:'
            - locator: {page: 1, pdf_page_index: 0, section: Results and discussion}
              method_class: quoted_attributed
              statement: 'Values of partial pressures of vapor species (p_i) over perovskite and over the CaO–TiO2 melts were determined by the Hertz-Knudsen equation (Fig. 2).'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion}
              method_class: quoted_attributed
              statement: 'The oxide activities (a_i) were calculated from the partial pressures.'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion, figure: '3'}
              method_class: quoted_attributed
              statement: 'The determined values of CaO, TiO2 and CaTiO3 activities in the CaO–TiO2 melts at 2250 K are consistent with those obtained by Banon et al. [5] at slightly lower temperature — 2150 K (Fig. 3).'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion, figure: '3'}
              method_class: quoted_attributed
              statement: 'Some difference in the TiO2 activity is probably due to the extrapolation procedures of the data obtained by Banon et al. [5] for the compositions of the CaTiO3–Ti2O3–TiO2 ternary system, which could reduce their accuracy.'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion, figures: '2-3'}
              method_class: quoted_attributed
              statement: 'The behavior of the TiO2 activity in the melts closed to rutile, observed by Banon et al. (Fig. 3), as well as the constancy of partial pressure of vapor species obtained in the present study (Fig. 2, lines 3–7), indicate some immiscibility of the melt.'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion, figure: '3'}
              method_class: quoted_attributed
              statement: 'The maximum of CaTiO3 activity corresponds to the region of compositions closed to perovskite (Fig. 3, lines 4 and 5).'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion, figure: '4'}
              method_class: quoted_attributed
              statement: 'The melts containing CaO are in the series according to the degree of chemical interaction: FeO → Al2O3 → TiO2 → SiO2 (Fig. 4a), which is manifested in more negative values of the mixing energy of the melt.'
            - locator: {page: 2, pdf_page_index: 1, section: Results and discussion, figure: '4'}
              method_class: quoted_attributed
              statement: 'The titanate melts are in the following series: FeO → Al2O3 → MgO → CaO according to the rising of melt basicity (Fig. 4b).'
            - locator: {page: 2, pdf_page_index: 1, section: Acknowledgement}
              method_class: quoted_attributed
              statement: 'The present study was supported by the Russian Foundation for Basic Research (grant #19-05-00801A).'
          source_limitations:
