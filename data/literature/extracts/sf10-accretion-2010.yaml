    - observation_id: sf10_2010_figure1
      type: figure_record
      locator: {page: 440, pdf_page_index: 2, published_page: '440', figure: '1'}
      units: as printed
      values:
        quantity: calculated_major_gas_composition_vs_temperature
        method_class: figure_only
        evidence_class: figure_only
        digitisation: deferred to a figure pass
        numeric_points: none
        caption: >-
          Fig. 1. Major gas compositions produced by impact outgassing of
          different types of chondritic planetesimals at the nominal pressure
          of 100 bars as a function of temperature from 300 to 2500 K. The
          panels show outgassing of: (a) CI, (b) CV, (c) H, (d) EH, and (e)
          EL chondritic material.
        axes_as_printed: {x: 'Temperature (K)', y: 'gas mole fraction (log scale, as plotted)'}
        note: CM, L, and LL are not shown as Fig. 1 panels; the caption lists CI, CV, H, EH, and EL.
