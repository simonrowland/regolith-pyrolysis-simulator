    as numeric tables in this PDF — composition numbers are therefore absent
    here (not invented from the citations). Printed method nominals (1500 K,
    100 bars), the stated P–T grid, the Lodders (2000) Earth mixing fractions,
    and the composition-source list are retained as context (d-032 Option A).
