schema_version: literature_extract.v1
source_id: sf10-accretion-2010
source:
  citation: >-
    Schaefer, L. and Fegley, B., Jr. (2010). Chemistry of atmospheres formed
    during accretion of the Earth and other terrestrial planets. Icarus 208,
    438–448.
  doi: 10.1016/j.icarus.2010.01.026
  year: 2010
  corpus_asset: raw/sf10-accretion-2010/sf10-accretion-2010.pdf
  corpus_sha256: b1fe339f3780967dfe165c79b6d7a228ac06e374815978edb7520a6b8307a023
extraction:
  method: >-
    Manual transcription of the 11-page Icarus PDF. Pages were rendered at
    200 dpi and Table 1 was read from a cropped page-4 image and checked
    against pdftotext -layout. All Table 1 cells are stored as printed
    (including the × 10^n forms). Figures 1–6 are context-only figure
    records; no curves were digitised. The paper is a chemical-equilibrium
    (and kinetic) model of impact-generated atmospheres, not a laboratory
    vaporization experiment. Table 1 and the printed HCl abundances are
    author calculations and are retained in context. Overlap check: this
    paper is distinct from schaefer-and-fegley-2007-icarus-outgassing-of-oc,
    schaefer-fegley-2009-silicate-atmospheres, schaefer-fegley-2011-vaporization-earth,
    and 2010zahnle-schaefer-fegley-cshperspect-ori-a004895-2019.
  date: '2026-11-12'
  worker: empirical-b15-2026-11-12
  provenance_path: raw/sf10-accretion-2010/
review_status: draft
species:
  impact_generated_atmosphere:
