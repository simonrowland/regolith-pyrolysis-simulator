    - observation_id: sf10_2010_methods_and_nominal_conditions
      type: method
      locator:
        page: 439
        pdf_page_index: 1
        published_page: '439'
        section: '2. Methods'
      units: as printed
      values:
        quantity: chemical_equilibrium_model_scope
        method_class: method_only
        evidence_class: model_derived
        calculation_as_printed: thermochemical equilibrium calculations that were done with a Gibbs energy minimization code of the type described by Van Zeggern and Storey (1970)
        database_as_printed: We used the same database as in Schaefer and Fegley (2007)
        abe_matsui_composition_as_printed: their estimate of pressure and temperature depends on the atmospheric composition, which they took as H2O plus CO2
        species_count_as_printed: thermodynamic data for ~930 condensed and gaseous compounds of 20 major rock-forming and volatile elements (Al, C, Ca, Cl, Co, Cr, F, Fe, H, K, Mg, Mn, N, Na, Ni, O, P, S, Si, Ti)
        T_range_K_as_printed: 300–2500
        P_range_as_printed: log10 P of −4 to +4 bars
        nominal_T_K: 1500
        nominal_P_bar: 100
        nominal_basis_as_printed: based on the work of Abe and Matsui (1987)
        chondrite_types_as_printed: [CI, CM, CV, H, L, LL, EH, EL]
        composition_sources_as_printed:
          CI: Orgueil – Lodders (2003)
          H_L_LL: average H, L, and LL chondrites – Schaefer and Fegley (2007)
          CM: Murchison – METBASE (Koblitz, 2005)
          CV: Allende – METBASE (Koblitz, 2005)
          EH_EL: average EH and EL chondrites – METBASE (Koblitz, 2005)
        note: >-
          The Methods text names "a Gibbs energy minimization code of the
          type described by Van Zeggern and Storey (1970)" but does not
          print a program name. No name was invented.
