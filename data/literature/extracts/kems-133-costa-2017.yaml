source_id: kems-133-costa-2017
source:
  citation: 'Costa, G. C. C., Jacobson, N. S. & Fegley Jr., B. (2017), "Vaporization and thermodynamics of forsterite-rich olivine and some implications for silicate atmospheres of hot rocky exoplanets", Icarus 289:42–55, DOI 10.1016/j.icarus.2017.02.006'
  doi: 10.1016/j.icarus.2017.02.006
  url: https://www.sciencedirect.com/science/article/am/pii/S0019103516301798
  year: 2017
  related_sources:
    - source_id: kems-007-costa-2015
      document: NTRS 20150002321
      relation: same_campaign_prior_report
      note: >
        2015 NTRS olivine KEMS is a different document (no DOI on this 2017
        Icarus paper). Cross-reference only; do not remint kems-007 alpha rows
        and do not mint a second id for NTRS 20150002321.
      characterisation_as_published:
        kems_007: Fo93Fa7; solidus ~2069 K
        this_work_as_received: "Table 1 mole %: Mg, forsterite 93(5); Fe, fayalite 6.7(3)"
        this_work_solidus: "We measured the solidus temperature (~ 2050 K)"
extraction:
  method: 'Official Elsevier accepted-manuscript HTML (bronze OA URL). Direct GET HTTP 403 Cloudflare JS challenge; not bypassed. No PDF on disk. Tables 1–5 transcribed from the AM HTML text of that official URL. Figures 6–9 listed figure-only (not digitised). Figures 1–5 captions unseen this round. No MinerU. No unit conversion. Measured vs author-derived vs literature-model vs exoplanet-model kept distinct. r2 (wave-W2-costa-2017-r2): Table 5 retyped as MAGMA/HRE model_derived (not KEMS rate); Table 1 composition and Table 2 appearance potentials moved off the rate_series dump; kems-007-costa-2015 cross-referenced, not duplicated.'
  date: '2026-09-06'
  worker: wave-W2-costa-2017-r2
  provenance_path: docs-private/research/2026-09-06-wave-2/W2-kems-133-costa-2017/kems-133-costa-2017/
review_status: draft
