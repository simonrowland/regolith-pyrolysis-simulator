sources:
  halwax_sergeev_mueller_schenk_2024:
    citation: >-
      A. Halwax, D. Sergeev, M. Mueller, and J. Schenk, Enthalpy of Formation
      of Calcium and Magnesium Oxide Obtained by Knudsen Effusion Mass
      Spectrometry, Metallurgical and Materials Transactions B 55 (2024)
      821-835
    doi: 10.1007/s11663-024-02995-6
    url: https://doi.org/10.1007/s11663-024-02995-6
    extraction_note: >-
      The final article gives pressure series as Figures 7-13, not numeric
      point tables. It reports systematic temperature uncertainty of 5 K but
      no pointwise pressure uncertainty. Values remain absent until a
      reproducible figure-digitization artifact is archived.
