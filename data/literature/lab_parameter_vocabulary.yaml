  # flow
  - printed: knudsen_number_orifice
    field: pressure_environment.regime.knudsen_number_orifice
    unit: "1"
  - printed: knudsen_number_chamber
    field: pressure_environment.regime.knudsen_number_chamber
    unit: "1"
  # printed composition (as-published map; not a converted SI scalar)
  - printed: composition_wt_pct
    field: sample.printed_composition
    unit: wt_pct
  - printed: major_oxide_wt_pct
    field: sample.printed_composition
    unit: wt_pct
  - printed: oxides_wt_pct
    field: sample.printed_composition
    unit: wt_pct
  - printed: starting_glass_wt_pct
    field: sample.printed_composition
    unit: wt_pct
  - printed: sample_oxide_composition_wt_pct
    field: sample.printed_composition
    unit: wt_pct
