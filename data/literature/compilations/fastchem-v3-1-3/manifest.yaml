fit_basis:
  form_as_published: '#logK = a1/T + a2 ln T + a3 + a4 T + a5 T^2 for FastChem:'
  log_basis: ln
  temperature_unit: K
  standard_pressure: 1 bar
  coefficient_order:
  - a1
  - a2
  - a3
  - a4
  - a5
  documentation_column_aliases_not_applied:
  - a0
  - a1
  - b0
  - b1
  - b2
  paper_names_applied: false
  coefficients_inverted: false
  reaction_direction_status: not_resolved
  authorities:
    gas:
      citation: Stock, J. W.; Kitzmann, D.; Patzer, A. B. C. (2022). FastChem 2. arXiv:2206.08247v2 preprint,
        pages as printed on the PDF; related MNRAS 517, 4070. Corpus raw/stock-2022-fastchem2-methods/stock-2022-fastchem2-methods.pdf.
      form_page: preprint p. 3, Eq. (8)
      form_quote: The temperature dependent mass action constants for each molecule or ion are fitted
        as before ln Kbar_i(T) = a0/T + a1 ln T + b0 + b1 T + b2 T^2, with the five fit coefficients a0,
        a1, b0, b1, and b2.
      log_basis_and_pressure_page: preprint p. 3, Eq. (9)
      log_basis_and_pressure_quote: The natural logarithm of the dimensionless mass action constants are
        related to the change in the Gibbs free energy of the dissociation reaction (1) with respect to
        the standard-state pressure p° = 1 bar (= 10^5 Pa)
      mass_action_page: preprint p. 2, Eq. (5)
      mass_action_quote: can be calculated using the law of mass action (Guldberg & Waage 1864, 1867,
        1879)
      mass_action_where: where n_i is the number density of species i and K_i the temperature dependent
        mass action constant
      mass_action_equation_transcription: n_i = K_i * product_j n_j**nu_ij, for all i in S excluding the
        elements
      dissociation_page: preprint p. 2, Eq. (1)
      dissociation_quote: dissociative equilibrium is assumed, where the dissociation reaction
    condensed:
      citation: Kitzmann, D.; Stock, J. W.; Patzer, A. B. C. (2024). FastChem Cond. arXiv:2309.02337v2
        preprint, pages as printed on the PDF; related MNRAS 527, 7263. Corpus raw/kitzmann-2024-fastchem-cond-methods/kitzmann-2024-fastchem-cond-methods.pdf.
      pressure_page: preprint p. 16, after Eq. (A5)
      pressure_quote: For the data used in the FastChem code, p° is equal to 1 bar.
      form_page: preprint p. 16, Eq. (A6)
      form_quote: As stated by Stock et al. (2018), we parameterise ln Kbar_c as a function of the temperature
        T in form of the polynomial ln Kbar_c(T) = a0/T + a1 ln T + b0 + b1 T + b2 T^2, where a_i and
        b_i are the corresponding fit coefficients that are tabulated in the FastChem input file for each
        species.
      gibbs_page: preprint p. 15, Eq. (A1)–(A3)
      gibbs_quote: The dimension-less equilibrium constant Kbar_c(T) for a specific condensate c is calculated
        from the Gibbs free energy of reaction
      dissociation_quote: where Delta_r G_c is the change of Gibbs free energy for the dissociation reaction
      into_elements_quote: of a condensate species into its elements
      eq_A3_transcription: G_c(T) - sum_j nu_cj * G_j(T)
      not_janaf_lnK_quote: Thus, the ln Kbar used in FastChem and given in Table A1 should not be confused
        with the corresponding ln Kbar tabulated in thermochemical databases, such as the JANAF tables.
