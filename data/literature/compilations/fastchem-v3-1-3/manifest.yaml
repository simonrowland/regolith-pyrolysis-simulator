  form_as_published: '#logK = a1/T + a2 ln T + a3 + a4 T + a5 T^2 for FastChem:'
  record_format: 'FastChem v3.1.3 logK text: three header lines, then species lines ''symbol [name] :
    Elem count ... # citation'', one or more five-token coefficient lines. Gas has one coefficient line
    and no per-species temperature bound. Condensates print a phase flag and successive upper temperature
    limits, then that many coefficient lines. Natural log and standard pressure 1 bar are the method-paper
    statements in fit_basis. Printed coefficients are not inverted. No unit conversion.'
