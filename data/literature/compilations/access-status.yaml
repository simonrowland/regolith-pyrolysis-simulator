    remaining_action: Run tools/harvest_janaf_compilation.py from a network-enabled host to complete the official index.
    acquisition_constraint: Direct DNS/networking was unavailable in the managed worker; target and Stage-0 tables were retrieved from official NIST pages through the indexed web surface.

  nist_webbook_srd69:
    citation: P. J. Linstrom and W. G. Mallard, eds., NIST Chemistry WebBook, NIST Standard Reference Database 69.
    doi: 10.18434/T4D303
    access: open_public_web
    official_url: https://webbook.nist.gov/chemistry/
    local_status: existing_manual_extract_is_partial
    existing_path: data/literature/extracts/nist-webbook.yaml
    existing_species_count: 22
    harvest_status: not_bulk_harvested_in_this_pass
    reason: No stable bulk snapshot was acquired under worker network isolation; individual pages remain legitimately obtainable from NIST.
    note: WebBook pages vary by species and do not guarantee a complete thermochemical function table.

  nasa_cea:
    citation: McBride, B. J., Zehe, M. J. and Gordon, S., NASA Glenn Coefficients for Calculating Thermodynamic Properties of Individual Species, NASA/TP-2002-211556; NASA CEA thermo.inp.
    access: open_public_source
    official_repository_url: https://github.com/nasa/cea/blob/main/data/thermo.inp
    official_software_url: https://www.nasa.gov/glenn/research/chemical-equilibrium-with-applications/
    local_status: substantial_but_filtered_and_not_complete
    existing_path: data/literature/extracts/nasa-cea-thermo.yaml
    existing_species_count: 1615
    filter_note: Existing ingest deliberately omits ions, D/T isotopes, noble gases, and condensed non-feedstock species.
    harvest_status: not_extended_in_this_pass
    reason: The authoritative raw thermo.inp snapshot is absent locally and could not be downloaded under worker network isolation; rebuilding from an unverified derivative would violate provenance.

