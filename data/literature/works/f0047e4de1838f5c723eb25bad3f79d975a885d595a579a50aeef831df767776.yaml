  values:
    quantity: source_qualifying_statement
    quote: Tsuchiyama et al. (1981) obtained the vaporization rates at the atmospheric pressure which is much higher than
      the total pressure (7.7×10⁻⁶ torr) at which the present experiments were carried out.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_12
