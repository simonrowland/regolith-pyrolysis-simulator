- observation_id: shimaoka_1989_equation_1
  type: method
  locator:
    published_page: 261
    pdf_page_index: 9
    section: 4.1 Vaporization rate of Na
    equation: '1'
  units: as printed
  values:
    quantity: vaporization_equation
    relation: dM_p/dt = −kSC_p = −kS(M_p/V_p)
    definitions: M_p is Na amount in partial melt; V_p is partial-melt volume; S is useful partial-melt surface; C_p is partial-melt
      Na concentration. k depends on temperature, total pressure, oxygen partial pressure and composition (definition continues
      on p. 262).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_equation_1
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_equation_4_and_regression
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 and 4.3
    equation: '4'
  units: as printed
  values:
    quantity: author_rate_calculation
    surface_relation: S = f·S_tot = const. (f = const.)
    equation_4: ln(C/C₀) = −k(f·S_tot/V_p)t
    regression: Combined A/B run-product data at 1200 and 1300°C; regression line assumed to pass through the origin. At 1250
      and 1400°C only one heating duration was used and each single-point rate has only tentative significance.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_equation_4_and_regression
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_equations_2_3
  type: method
  locator:
    published_page: 262
    pdf_page_index: 10
    section: 4.1 Vaporization rate of Na
  units: as printed
  values:
    quantity: integrated_vaporization_equations
    equation_2: ∫[M₀→M] dM/M = −∫[0→t] kS/V_p dt
    intermediate_identity: ∫[M₀→M] dM/M = ln(M/M₀) = ln(C/C₀)
    equation_3: ln(C/C₀) = −k(S/V_p)t
    definitions: M(M₀) and C(C₀) are bulk-charge Na amount and concentration at duration t (or at t=0), respectively. Assumes
      all Na in partial melts and constant partial-melt surface and volume.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_equations_2_3
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
