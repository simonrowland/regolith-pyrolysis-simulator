    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The upper limit of total sodium contents in mineral phases is calculated to be 5% of all sodium in charges.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_40
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
