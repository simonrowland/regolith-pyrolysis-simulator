  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Because of a large blank contribution (~70%), concentration of Na in 32A (5 ppm) contains large uncertainties and
      is thus the lower limit of atomic absorption analyses in this work.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_30
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
