  type: method
  locator:
    published_page: 264
    pdf_page_index: 12
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The oxygen partial pressure within the heating chamber in this work is considered to be controlled by 1) residual
      air, 2) released gas from partial melts, 3) Fe–FeO buffer of charges and 4) Ta–Ta₂O₅ buffer of Ta-crucible, Ta-heater
      and Ta-tube.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_14
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_15
  type: method
  locator:
    published_page: 264
    pdf_page_index: 12
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Decomposition of silicate and sulfide melts may yield oxygen and sulfur, respectively.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_15
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_16
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: If the released gasses from partial melts are the main components which controlled the vaporization rates, the
      smooth variation of the observed vaporization rates in Fig. 4 is rather difficult to understand, which is in turn suggesting
      that the factor 2) is not too much important.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_16
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_17
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The gas in the chamber directly contacted with partial melts, olivine, pyroxene and minor Fe metal/sulfide. Then,
      the reaction of Fe with mafic minerals may work as an oxygen buffer.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_17
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_18
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Thus, a role of sulfur produced by decomposition of troilite may not be important. The most important reactions
      may be that of the partially molten charges themselves and/or Ta–Ta₂O₅ buffer.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_18
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_19
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The chemical compositions of partial melts obtained in this work are significantly different from bulk compositions
      of total melts examined by Tsuchiyama et al. (1981). Particularly, the differences in Al and Ca are worth noting.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_19
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_20
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: These authors recognized significantly large differences in vaporization rates for starting materials with different
      chemical compositions but they did not clarify the cause.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_20
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_discussion_qualifier_21
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Therefore, we can not rule out a possibility that the systematically higher vaporization rates obtained in this
      experiment were partly due to fractionated chemical compositions of partial melts.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_21
