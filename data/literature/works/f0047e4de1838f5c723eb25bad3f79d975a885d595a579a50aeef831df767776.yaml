    pdf_page_index: 12
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: In general, the vaporization rates are considered to be enlarged at more reduced pressures.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_discussion_qualifier_13
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
