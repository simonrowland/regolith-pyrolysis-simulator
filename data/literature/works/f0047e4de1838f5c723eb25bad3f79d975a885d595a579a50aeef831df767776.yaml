  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The f values are estimated to be significantly smaller than unity but were not estimated in this work.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_43
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_44
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The weight loss during vaporization is 1.8–3.8% of total charge. Since volatile components of 1.1% are considered
      to have been lost before partial melting, the net weight loss during melting is estimated to be 0.7–2.7%.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_44
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_46
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Volume changes of partial melts during vaporization are calculated to be 7% or smaller (the density of partial
      melt is assumed to be 2.5 g/cm³).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_46
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_47
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Uncorrected data points (typically data point of 1250°C) in Fig. 3 show unusual variations, the distribution of
      data points after correction for melt volumes and total surface areas is now appropriate and shows more clear linear
      trends in Fig. 4.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_47
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_48
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Systematic differences in data distributions between starting materials of different grain sizes are not clearly
      recognized here.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_48
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_49
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: In spite of relatively large uncertainties of surface areas and melt volumes, the expected linear trends are obtained
      at 1200 and 1300°C in Fig. 4.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_49
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_50
  type: method
  locator:
    published_page: 263
    pdf_page_index: 11
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Each heating experiment at 1250 and 1400°C was performed only for one heating duration and thus the vaporization
      rate calculated from each one data point is of only tentative significance.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_50
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_51
  type: method
  locator:
    published_page: 264
    pdf_page_index: 12
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: This value is significantly larger than that (2.6×10⁻⁴) obtained by Tsuchiyama et al. (1981) for sample 1 (1456°C,
      log[fO₂]=−9.2).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_51
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_52
  type: method
  locator:
    published_page: 264
    pdf_page_index: 12
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The extrapolated value of 1.4×10⁻²/f at 1586°C is even higher than that (8.8×10⁻³) obtained by the same authors
      for sample 2 at the same temperature (log[fO₂]=−9.2).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_52
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_53
  type: method
  locator:
    published_page: 264
    pdf_page_index: 12
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Depending on the f value, the calculated rates for the present experiments substantially shift to much higher.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_53
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_54
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The oxygen partial pressures are estimated to be 10⁻¹³ at 1200°C and 10⁻¹¹ atm at 1400°C (Johnson, 1986).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_54
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_55
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: If the Ta-materials work as the Ta-Ta₂O₅ buffer, then the oxygen partial pressures are calculated to be 10⁻²⁰ at
      1200°C and 10⁻¹⁷ atm at 1400°C.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_55
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_56
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: If this is the case, the oxygen partial pressures in these experiments are estimated to be a few to several orders
      of magnitude smaller than that in Tsuchiyama et al. (1981), which is relatively consistent with the higher vaporization
      rates of Na obtained in this work.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_56
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_57
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: In view of systematically high vaporization rates observed in this work, the reaction which controlled the oxygen
      partial pressure may have prevailed quite consistently through all the heating experiments.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_57
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_58
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: We also noted systematically fractionated chemical compositions of partial melts produced at different temperatures,
      but did not detect chemical effects on vaporization rates clearly.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_58
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_59
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Because of incomplete experimental data obtained in this work, vaporization rates of sodium estimated here include
      relatively large uncertainties and may need further evaluation.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_59
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_60
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The present data analysis, however, suggested that the vaporization rates of sodium obtained in this work in the
      lower temperature range (1200–1400°C) seem to be consistent with those by Tsuchiyama et al. (1981) at higher temperatures
      (1450–1600°C).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_60
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_61
  type: method
  locator:
    published_page: 265
    pdf_page_index: 13
    section: 4.3 Vaporization rates of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The vaporization mechanism of Na is basically the same for the partially to totally molten charges of chondritic
      materials in the temperature range from 1150 to 1600°C.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_61
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
