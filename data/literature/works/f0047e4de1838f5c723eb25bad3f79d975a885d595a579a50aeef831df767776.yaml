    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The expected total amount of Na in 31A (sample weight used for analysis=11 mg) from the general trend of samples
      heated at 1300°C is calculated to be 0.0008 µg which is far below the limit of our analytical capability.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_31
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_32
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The blank value of 0.72 µg corresponds to 65 ppm for 31A and thus the observed value of 100 ppm is even higher
      than expected from contamination. In view of potential variations of blank during analytical processes, the observed
      high value is not acceptable as a true one.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_32
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_33
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The Na concentration (460 ppm) in 27A is about several orders of magnitude larger than the expected value (7 ppm).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_33
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_34
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: This too high Na concentration is not explained solely as due to blank effect, even if variability of blank is
      considered.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_34
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_35
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: We have not repeated heating experiments to confirm the above observation. Hence, we can not rule out a possibility
      that the observed high Na content in 27A was caused by an extreme heterogeneity in the run product.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_35
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_36
  type: method
  locator:
    published_page: 261
    pdf_page_index: 9
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The Na data obtained for these two samples (27A and 31A) are not considered to represent concentrations in samples
      heated at 1300°C for longer duration.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_36
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_37
  type: method
  locator:
    published_page: 261
    pdf_page_index: 9
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The too much depletion of Na data point of 1250°C compared with data points of 1300°C appears unusual but is found
      to be reasonable if surface areas and degrees of partial melting of charges are corrected (see Fig. 4).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_37
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
