    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The rates of vaporizations for sodium were estimated for partial melts (degree of melting=11–34%) at 1200–1400°C.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_01
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
