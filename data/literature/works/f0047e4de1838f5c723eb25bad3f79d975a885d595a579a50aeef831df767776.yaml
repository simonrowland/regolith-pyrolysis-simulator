  type: method
  locator:
    published_page: 262
    pdf_page_index: 10
    section: 4.2 Application of vaporization equation
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The assumption (1) is considered to be valid, although this was examined for run products from samples B at 1150,
      1250, and 1400°C.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_41
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
