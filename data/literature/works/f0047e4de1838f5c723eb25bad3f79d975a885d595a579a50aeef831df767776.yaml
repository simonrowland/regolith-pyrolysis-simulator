  locator:
    published_page: 262
    pdf_page_index: 10
    section: 4.1 Vaporization rate of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The meaning of the calculated rates using the above equation is solely dependent on the validity of the above-mentioned
      assumptions.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_38
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
