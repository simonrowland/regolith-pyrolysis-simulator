- observation_id: shimaoka_1989_qualifier_02
  type: method
  locator:
    published_page: 252
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Differences in the vaporization rates for the partially molten charges obtained from different starting materials
      were not detected clearly at the same temperatures.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_02
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_03
  type: method
  locator:
    published_page: 252
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Systematically different trends of sodium vaporization rate are found between those obtained in this work and those
      previously reported for total melts (at 1450–1600°C) from similar starting materials (Tsuchiyama et al., 1981).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_03
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_04
  type: method
  locator:
    published_page: 252
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: It appears that the vaporization mechanism of Na is basically the same in the temperature range from 1200 to 1600°C
      for partially to completely molten charges.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_04
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_05
  type: method
  locator:
    published_page: 255
    pdf_page_index: 3
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Standard deviations of Na concentrations in bulk samples are 3% for sample A and 1.5% for sample B.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_05
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_06
  type: method
  locator:
    published_page: 255
    pdf_page_index: 3
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Differences of 6–8% in Na concentrations exist among small (3 mg) and larger (30 mg) samples but differences more
      than 10% were not detected among them.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_06
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_07
  type: method
  locator:
    published_page: 255
    pdf_page_index: 3
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: All the Na concentrations obtained for the coarse-grained sample B are systematically lower by 10% from those in
      sample A.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_07
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_08
  type: method
  locator:
    published_page: 255
    pdf_page_index: 3
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Ca, Mg, and Fe are distributed homogeneously in both starting materials, and sample A is higher in Ca by 9% and
      lower in Mg by 8% than sample B.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_08
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_09
  type: method
  locator:
    published_page: 255
    pdf_page_index: 3
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Na-carrying phases are distributed homogeneously in both starting materials at least for samples of more than 30-mg
      size, and a minor fraction of alkali-rich phases was lost from sample B during the sample preparation (possibly in the
      mesh-sorting process).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_09
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_10
  type: method
  locator:
    published_page: 256
    pdf_page_index: 4
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The plagioclase contents are calculated to be 11.1% and 9.6% for starting materials A and B, respectively.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_10
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_11
  type: method
  locator:
    published_page: 256
    pdf_page_index: 4
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The troilite contents in starting materials were not accurately determined in this work but were roughly estimated
      to be 3% and 0.8% for samples A and B, respectively.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_11
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_12
  type: method
  locator:
    published_page: 256
    pdf_page_index: 4
    section: 3.1 Starting material
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Chemical and mineral compositions of two starting materials with different grain-sizes are sufficiently homogeneous,
      and minor but significant differences, particularly in plagioclase and troilite contents, exist between them.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_12
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_13
  type: method
  locator:
    published_page: 257
    pdf_page_index: 5
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: All run products contain abundant holes (10–60% in area).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_13
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_14
  type: method
  locator:
    published_page: 257
    pdf_page_index: 5
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Run products of the coarse-grained starting material B have more abundant holes compared with those of the fine-grained
      starting material A at same temperatures, and, in general, heated samples obtained at higher temperatures have less
      abundant holes.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_14
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_15
  type: method
  locator:
    published_page: 257
    pdf_page_index: 5
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: It is likely that most holes were not formed by vesiculation of heated samples but represent open spaces unfilled
      with partial melts.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_15
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_16
  type: method
  locator:
    published_page: 258
    pdf_page_index: 6
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The cooling rate (600°C/min) in this work has not been fast enough to quench all the partial melts.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_16
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_17
  type: method
  locator:
    published_page: 258
    pdf_page_index: 6
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The Fa contents of overgrowth olivine grains are 31–35% for heated samples at 1200–1400°C and are systematically
      higher than those of adjacent olivines (Fa=18–29%).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_17
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_18
  type: method
  locator:
    published_page: 258
    pdf_page_index: 6
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The possible local heterogeneities of chemical compositions of glass materials were also examined by SEM-EDS but
      were not detected clearly, suggesting that melts had been sufficiently homogenized except for very narrow areas.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_18
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_19
  type: method
  locator:
    published_page: 258
    pdf_page_index: 6
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The areal proportions of overgrowth rim materials estimated from back-scattered images correspond to 20–50% of
      total amounts of glass and rim materials.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_19
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_20
  type: method
  locator:
    published_page: 259
    pdf_page_index: 7
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Because of heterogeneous distributions of holes and rim materials, estimated proportions of holes and degrees of
      partial melting mentioned above may contain considerably large uncertainties (20–30%).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_20
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_21
  type: method
  locator:
    published_page: 259
    pdf_page_index: 7
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The troilite grains were scarce in run products from the coarse-grained starting material B at all temperatures
      and also rare in run products from the fine-grained starting material A at 1150 and 1200°C, but instead metal grains
      poor in nickel were occasionally encountered.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_21
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_22
  type: method
  locator:
    published_page: 259
    pdf_page_index: 7
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Except for these run products, run products at 1300°C from sample A contain much more abundant troilite grains
      and less abundant metal grains.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_22
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_23
  type: method
  locator:
    published_page: 259
    pdf_page_index: 7
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The presence of more abundant troilite in sample A heated at the higher temperature (1300°C) than 1200°C and 1150°C
      appeared misleading but was confirmed for several run products.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_23
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_24
  type: method
  locator:
    published_page: 259
    pdf_page_index: 7
    section: 3.2 Melting textures
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Partial melting of silicate grains and decomposition of troilite occurred during the heating at 1150–1400°C.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_24
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_25
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.3 Chemical composition of partial melts
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: The Fo contents (%) in olivine grains range from 72 for 1200°C to 80±2 for 1400°C and are homogeneous at given
      temperatures. Most pyroxene grains are low-Ca orthopyroxene with compositions of Fs21–27.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_25
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_26
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.3 Chemical composition of partial melts
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Interstitial glass materials are normally poor in sulfur (almost below the detection limit of SEM-EDS) but run
      products from samples A heated at 1300°C have systematically higher sulfur contents (0.2–0.3 wt%).
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_26
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_27
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.3 Chemical composition of partial melts
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Chemical compositions of partial melts are systematically fractionated with heating temperature.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_27
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_28
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.3 Chemical composition of partial melts
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: At temperatures above 1200°C plagioclase was completely exhausted and significant amounts of olivine and pyroxene
      melted.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_28
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
- observation_id: shimaoka_1989_qualifier_29
  type: method
  locator:
    published_page: 260
    pdf_page_index: 8
    section: 3.4 Concentration of Na
  units: as printed
  values:
    quantity: source_qualifying_statement
    quote: Except for two samples (27A and 31A), the Na concentrations in run products decrease with an increase of heating
      duration.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_qualifier_29
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
  source_id: shimaoka-nakamura-1989-nipr2-252
  species: Na
