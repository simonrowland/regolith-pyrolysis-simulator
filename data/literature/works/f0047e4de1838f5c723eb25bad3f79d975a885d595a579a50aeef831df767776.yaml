  values:
    quantity: prior_work_conditions
    quote: Tsuchiyama et al. (1981) performed a vaporization experiment of sodium on silicate materials with chondrule compositions
      in the temperature range of 1450–1600°C under the atmospheric pressure with different oxygen fugacities.
  context_id: shimaoka-nakamura-1989-nipr2-252::context::shimaoka_1989_prior_vaporization_atmospheric_conditions
  work_id: f0047e4de1838f5c723eb25bad3f79d975a885d595a579a50aeef831df767776
