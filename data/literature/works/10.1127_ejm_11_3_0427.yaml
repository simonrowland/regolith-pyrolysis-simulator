    caption_as_printed: Fig. 3. Calculated phase diagram for the SiO2-TiO2 system. Symbols refer to critical quench experiments
      from DeVries et al. (1954), McTaggart & Andrews (1957) and Massazza & Sirchia (1958) that have been used to constrain
      non-ideal solution parameters with liquidus and solvus data. Triangles point liquidus experiments from Galakhov et al.
      (1974). Filled symbols indicate quenched crystalline + liquid phases stable, open symbols denote one liquid, slashed
      symbols two liquids. Additional solvus data of this work are plotted within 1σ boxes in composition and temperature.
      Numbers denote calculated temperatures of phase transitions.
    panel_as_printed: whole figure
