    axes_as_printed: 'x: x(Al2O3); y: temperature [K]'
    caption_as_printed: Fig. 2. Calculated phase diagrams for the Al2O3-SiO2 (a) and Al2O3-TiO2 (b) systems. Critical quench
      experiments are considered from Aramaki & Roy (1959), fusion experiments from Bunting (1933), Lang et al. (1952), Horibe
      & Kuwubara (1967), and mullite liquidus data from diffusion experiments (Davis & Pask, 1972). Slashed triangles denote
      unmixing experiments in glasses from Galakhov et al. (1976). Open symbols indicate one liquid and filled symbols liquid
      + crystalline phase stable. The dashed line indicates the calculated binodal of the solvus at subliquidus temperatures.
      Numbers denote calculated temperatures of phase transitions. Klug et al. (1987) documented the compositional shift of
      mullite from 2SiO2:3Al2O3 to 1SiO2:2Al2O3 at liquidus temperature, which is not modelled with the stoichiometric approach
      in this calculation.
    panel_as_printed: panel a
    attribution: Kirschen et al. (1999), figure as cited; literature series attributions retained in the caption.
