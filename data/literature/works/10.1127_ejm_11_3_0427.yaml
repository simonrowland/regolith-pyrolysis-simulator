    caption_as_printed: Fig. 6. Comparison of calculated miscibility gaps with experiments at 2073 K, 1 bar for the SiO2-TiO2-Al2O3
      system for different methods of extrapolation. Regions of liquid immiscibility are calculated (1) without correction
      to binary excess parameters (k = 0, dashed line), (2) extrapolated with the Kohler (1960) method (k = 1, dotted line),
      (3) with addition of ternary parameter W123 = -200 kJ/mol to binary excess parameters (dash-dotted line), and with a
      generalized excess function (k = -3, solid line). Solid spheres point to compositions of quenched coexisting liquids;
      open symbols denote quench of a homogeneous liquid. Mineral stability fields are omitted for clarity. Correction of
      binary SiO2-TiO2 excess terms with an additional ternary parameter results in an asymmetric decrease of the ternary
      miscibility gap, in disagreement with experiments.
