    caption_as_printed: Fig. 1. SiO2 content of quenched coexisting liquids in the CaO-MgO-SiO2-TiO2-Al2O3 system. Open symbols
      indicate quench of a homogeneous liquid. Addition of 3 wt% and 4 wt% Al2O3 reduces dramatically the consolute temperature
      and the extension of the miscibility gap of the Al-free melt (filled circles). In bulk compositions with 6 wt% Al2O3
      no stable liquid-liquid boundary was found, and phase separation is rendered metastable.
    panel_as_printed: whole figure
