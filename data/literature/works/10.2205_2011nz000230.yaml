- observation_id: shornikov_2011_text_conclusion_values
  type: author_interpretation
  locator:
    page: 2
    pdf_page_index: 1
    section: Results
    note: Final paragraph on PDF page 2.
  units: as printed
  values:
    method_class: quoted_attributed
    statements_as_printed:
    - Observable deviations of the calculated values of activities a(MgO) from experimental data (Fig. 1b) are insignificant
      – approximately in 2 times.
    - The minimal value of the Gibbs energy of melt formation (from oxides) in the CaO–MgO–Al2O3 system is not large (ΔfG1960
      = −31.5 kJ/mole).
    - It corresponds to the composition containing 45 mole % Al2O3 closed to liquidus line.
    - It shown the instability in melt of the ternary compound Ca3MgAl4O10 containing 33.3 mole % Al2O3.
    model_temperature_range_K_as_printed:
    - '1800'
    - '2200'
  context_id: shornikov-2011-cao-mgo-alumina-melts::context::shornikov_2011_text_conclusion_values
  work_id: 10.2205/2011nz000230
  source_id: shornikov-2011-cao-mgo-alumina-melts
