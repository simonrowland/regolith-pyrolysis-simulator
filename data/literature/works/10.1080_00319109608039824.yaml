- observation_id: bennour_1996_experimental_method
  type: method
  locator:
    page: 4
    published_page: 231
    pdf_page_index: 3
    section: 2. Experimental Procedure
  units: apparatus and method as printed
  values:
    quantity: apparatus_and_method_as_published
    method_class: method_only
    method_quote_as_published: A molecular beam issued from the Pt Knudsen cell enters the ionization chamber through a movable
      shutter which separates vaporizing species from those due to the background.
    conditions:
      ionizing_electron_energy_eV: '14'
    detector: secondary electron multiplier
    cell_and_beam: Molecular beam issued from a Pt Knudsen cell into the ionization chamber through a movable shutter.
    heating_method: electronic bombardment from a tungsten filament
    temperature_measurement: platine-platine rhodium 10% thermocouple placed at the bottom of the cell
    temperature_calibration: ionic intensity plateau during fusion of known pure substances
    sample_preparation: sodium and caesium carbonates for Na2O and Cs2O respectively and tetraethoxysilane for SiO2 by the
      sol-gel process
  note: Temperature interval is described as 950-1600 K in the abstract and experimental discussion.
