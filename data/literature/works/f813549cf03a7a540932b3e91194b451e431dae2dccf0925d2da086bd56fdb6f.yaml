    model: Semi-empirical model (Shornikov, 2019).
    model_inputs: Standard Gibbs energies of FeO and P4O10 in the crystalline and liquid state, and of FeP4O11, FeP2O6, Fe2P2O7,
      Fe3P2O8 and Fe5P3O13. Gas species from Barin (1995) and Stolyarova et al. (2004).
    gas_species_considered:
    - Fe
    - Fe2
    - FeO
    - FeO2
    - P
    - P2
    - P3
    - P4
    - PO
    - PO2
    - P2O3
    - P2O4
    - P2O5
    - P3O6
    - P4O6
    - P4O7
    - P4O8
    - P4O9
    - P4O10
    - FePO2
    - FePO3
    - O
    - O2
    - O3
    - O4
    condensed_compounds_as_printed:
    - formula: FeP4O11
      oxide_equivalent: FeO · P4O10
      congruent_melting_K: 998±10
      source: Weil and Glaum, 1998
    - formula: FeP2O6
      oxide_equivalent: 2FeO · P4O10
      congruent_melting_K: 1218±8
      source: Zhang, 2010
    - formula: Fe2P2O7
      oxide_equivalent: 4FeO · P4O10
      congruent_melting_K: 1378±8
      source: Zhang, 2010
    - formula: Fe3P2O8
      oxide_equivalent: 6FeO · P4O10
      congruent_melting_K: 1323±15
      source: Tromel and Schwerdtfeger
    fe_partial_pressure_bound: The Fe partial vapor pressure, and gaseous FePO2 and FePO3, over these iron phosphates does
      not exceed 10^-12 atm at 1275–1525 K. Published page 75. The 600 dpi render of PDF page 4 prints the exponent as a superscript
      minus. This is a bound, not a point.
    mixing_energy_minimum: The minimum mixing energy is in the concentration range close to the eutectic between Fe2P2O7 and
      FeP2O6. No numeric minimum is printed.
