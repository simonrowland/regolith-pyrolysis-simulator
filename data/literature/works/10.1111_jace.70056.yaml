    caption_as_printed: Mass spectra of vapor over sample N 1, containing SrO:Al2O3:SiO2 = 0.33:0.33:0.33, obtained by KEMS
      at the temperatures 1883 K and 2105 K. 1 is SiO+, 2 is Sr+, 3 is WO2+, and 4 is WO3+. The WO2+ and WO3+ ions are produced
      by ionization of the WO2 and WO3 vapor species, which are formed as a result of the interaction between the sample and
      material of the cell made from tungsten. At the higher temperature 2105 K, tungsten oxides are unstable and were not
      observed in the mass spectra of vapor over sample N 1. The ion current intensities of i-species are presented with the
      correction for the background signal and without corrections for the sensitivity coefficient of the secondary electron
      multiplier as well as the ionization cross-sections of the corresponding vapor species. The Sr+, WO2+, and WO3+ ion
      current intensities in Figure S2(a) were multiplied by 10.
    panel: whole figure; Figure S2(a) scaling is stated in the caption; temperature-to-panel mapping awaits render review
