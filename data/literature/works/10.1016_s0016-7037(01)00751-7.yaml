  source_id: beckett-2002-silicate-melt-activities
  species: CaO
- observation_id: beckett_2002_cao_temperature_dependence_context
  type: thermodynamic_context
  locator:
    page: 5
    published_page: 97
    pdf_page_index: 4
    section: '2.3'
  units: natural-log activity coefficient; °C
  values:
    quantity: CaO_activity_coefficient_temperature_dependence
    method_class: model_derived
    quote: For optical basicities near Λ = 0.54, ln(γCaO^Liq) increases with temperature, rising by as much as a factor of
      twenty over 400°C. [...] On the other hand, the temperature effect is quite modest for Λ > ~0.65 at NBO/T = 0 and reconnaissance
      calculations for other values of NBO/T show that a small temperature dependence is characteristic for Λ > ~0.65 to 0.70.
  context_id: beckett-2002-silicate-melt-activities::context::beckett_2002_cao_temperature_dependence_context
  work_id: 10.1016/s0016-7037(01)00751-7
  source_id: beckett-2002-silicate-melt-activities
  species: CaO
