- observation_id: beckett_2002_cao_standard_state
  type: thermodynamic_context
  locator:
    page: 2
    published_page: 94
    pdf_page_index: 1
    equation: '2'
    section: '2.1'
  units: as printed
  values:
    quantity: CaO_activity_coefficient_reference_state
    method_class: method_only
    standard_state_quote: In this work, lime, periclase, corundum, and high cristobalite at temperature and 1 atm are used
      as standard states for oxide components in the melt.
    component_identification_quote: In Eqn. 2, μsolid_o and μi_o,Liq are the standard state chemical potentials of the solid
      phase and of oxide i in the liquid, asolid is the activity of the solid relative to the end-member phase in its standard
      state, and γi^Liq is the activity coefficient of oxide component i in the liquid.
    component_reference_as_printed: lime
    standard_state_interpretation: CaO activity coefficient uses the lime (pure solid CaO) standard state at the calculation
      temperature and 1 atm; the paper does not specify a Henry or pure-liquid Raoult standard state.
  context_id: beckett-2002-silicate-melt-activities::context::beckett_2002_cao_standard_state
