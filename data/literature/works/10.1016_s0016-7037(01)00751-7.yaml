- observation_id: beckett_2002_cao_cmas_composition_ranges
  type: thermodynamic_context
  locator:
    page: 3
    published_page: 95
    pdf_page_index: 2
    section: '2.3'
  units: mole fraction; °C
  values:
    quantity: accepted_cmas_liquid_composition_ranges
    method_class: model_derived
    quote: A temperature of 1600°C was selected for most calculations because liquids are stable over much of the system but
      the temperature is not so high that extrapolation of Berman’s model, which is based mostly on phase equilibria acquired
      at temperatures at or below 1600°C, becomes excessive. [...] For 1600°C, accepted liquids have mole fractions of oxides
      in the range of 0 to 0.71 for CaO, 0 to 0.55 for MgO, 0 to 0.45 for Al2O3, and 0 to 0.95 for SiO2.
  context_id: beckett-2002-silicate-melt-activities::context::beckett_2002_cao_cmas_composition_ranges
  work_id: 10.1016/s0016-7037(01)00751-7
  source_id: beckett-2002-silicate-melt-activities
  species: CaO
- observation_id: beckett_2002_cao_model_method
  type: method
  locator:
    page: 2
    published_page: 94
    pdf_page_index: 1
    section: '2.1'
  units: as printed
  values:
    quantity: activity_coefficient_model_method
    method_class: method_only
    method_quote: In this study, the model of Berman (1983) is used to evaluate the activities of end-member oxides in the
      system CaO-MgO-Al2O3-SiO2 (CMAS).
    method_detail_quote: The basic idea is to use calorimetric data and exchange reactions between coexisting solids and liquids
      or pairs of liquids to constrain the excess free energy, Gexcess, of the liquid. The activity coefficient of a specific
      oxide component relative to its standard state can be derived from Gexcess through suitable differentiation and the
      resulting expression for the functional form used by Berman (1983) is given by Berman and Brown (1984).
    method_as_printed: calculated model outputs; no experiments or measurement procedure are reported in this paper
  context_id: beckett-2002-silicate-melt-activities::context::beckett_2002_cao_model_method
  work_id: 10.1016/s0016-7037(01)00751-7
  source_id: beckett-2002-silicate-melt-activities
  species: CaO
- observation_id: beckett_2002_cao_printed_numerical_context
  type: thermodynamic_context
  locator:
    page: 1
    published_page: 93
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: printed_model_composition_and_temperature_statements
    method_class: model_derived
    quote: All three of these variables are simple functions of the optical basicity Λ with which they display minima near
      Λ ~ 0.54 that are generated by liquids with low ratios of nonbridging to tetrahedral oxygens (NBO/T) (<0.3) and a mole
      fraction ratio, XSiO2^Liq/XAl2O3^Liq, in the range 4 to 20. Variations in ln(γCaO^Liq) at constant Λ near the minimum
      are due mostly to liquids with (XCaO^Liq + XMgO^Liq)/XAl2O3^Liq < 1.
    note: abstract composition constraints on model-calculated CMAS activities and coefficients
  context_id: beckett-2002-silicate-melt-activities::context::beckett_2002_cao_printed_numerical_context
  work_id: 10.1016/s0016-7037(01)00751-7
  source_id: beckett-2002-silicate-melt-activities
  species: CaO
