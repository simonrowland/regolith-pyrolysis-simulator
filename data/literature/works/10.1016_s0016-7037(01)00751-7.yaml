    quantity: oxide_activity_coefficient_composition_minima
    method_class: model_derived
    quote: For NBO/T = 0, which is the pertinent value for these joins, there is a minimum in ln(γCaO^Liq) at XSiO2^Liq/XAl2O3^Liq
      ~ 4 to 6 (cf. Figs. 1a and 1b), in ln(γCaO^Liq γAl2O3^Liq) at XSiO2^Liq/XAl2O3^Liq ~ 5 to 7 (Fig. 5a), and in ln(γMgO^Liq
      γAl2O3^Liq) at XSiO2^Liq/XAl2O3^Liq ~ 7 to 10 (Fig. 6a), which may be distant reflections of the same phenomenon.
