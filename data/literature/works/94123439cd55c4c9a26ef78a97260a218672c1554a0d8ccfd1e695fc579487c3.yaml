    section: Results and Discussion
  units: qualitative comparison
  values:
    statement_as_printed: The experiments also showed that despite a strong temperature effect on evaporation kinetics of
      Mg and Si (evaporation rates of Mg are ~2×10^-9, ~1×10^-8, (2–6)×10^-8 and (2–3) ×10^-7 moles/cm2/s at 1600°, 1700°,
      1800° and 1900°C, respectively), the temperature had only a small effect on evaporation trajectories.
    attribution: Type B CAI-like melt experiments, reference [1]
