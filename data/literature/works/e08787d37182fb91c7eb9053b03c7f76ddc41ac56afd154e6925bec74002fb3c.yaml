    equations_as_printed:
    - equation: '4'
      expression: log a2 / X2 = log gamma2 = (Tc/T) log gamma2c
      locator:
        page: 2
        published_page: 632
        pdf_page_index: 1
        equation: '4'
    - equation: '5'
      expression: log10 a2* = 1/4.575 [(-DeltaHm + A Tm + B/2 Tm^2 - C/Tm)(1/Tc - 1/Tm) + A ln(Tc/Tm) + B/2(Tc - Tm) + C/2(1/Tc^2
        - 1/Tm^2)] = log10 a2c
      locator:
        page: 2
        published_page: 632
        pdf_page_index: 1
        equation: '5'
    - equation: '6'
      expression: Delta Cp solid->liquid = A + B T + C/T^2
      locator:
        page: 2
        published_page: 632
        pdf_page_index: 1
        equation: '6'
    - equation: '7'
      expression: log10 a2c (below 1473 K) = log10 a2* - (Delta Ht/4.575)(1/Tc - 1/Tt)
      locator:
        page: 2
        published_page: 632
        pdf_page_index: 1
        equation: '7'
    - equation: '8'
      expression: d ln gamma2 / d(1/T) = DeltaHbar2 / R = Tc ln gamma2c = 2.3 Tc log gamma2c
      locator:
        page: 2
        published_page: 632
        pdf_page_index: 1
        equation: '8'
    - equation: '13'
      expression: log gamma2 = − integral from X1=0.36 to X1 of [X1/(1−X1)] d log(R1^2/X1) + log gamma2 at X1=0.36
      locator:
        page: 3
        published_page: 633
        pdf_page_index: 2
        equation: '13'
    - equation: '20'
      expression: log gamma2 = − integral from X1=0.26 to X1 of [X1/(1−X1)] d log(R1^2/X1) + log gamma2 at X1=0.26
      locator:
        page: 6
        published_page: 636
        pdf_page_index: 5
        equation: '20'
    - equation: '21'
      expression: log gamma2(T) = log gamma2(1473) + ([log gamma2(1473)−log gamma2(1673)]/(1/1473−1/1673))(1/1473−1/T)
      locator:
        page: 9
        published_page: 639
        pdf_page_index: 8
        equation: '21'
    - equation: '22'
      expression: DeltaFm(X1=0.333) = −80,000/3 + Q(T)
      locator:
        page: 9
        published_page: 639
        pdf_page_index: 8
        equation: '22'
    - equation: '23'
      expression: log a1 at X1=0.33 = 3Q(T)/(4.575T) − 80,000/(4.575T) − 2 log a2 at X1=0.33
      locator:
        page: 9
        published_page: 639
        pdf_page_index: 8
        equation: '23'
    - equation: '3'
      expression: a1 is proportional to R1 squared.
      locator:
        page: 1
        published_page: 631
        pdf_page_index: 0
        equation: '3'
    - equation: '14'
      expression: ln(sqrt(a1 a2)) = DeltaFm / RT
      locator:
        page: 3
        published_page: 633
        pdf_page_index: 2
        equation: '14'
    - equation: '15'
      expression: DeltaFm = RT(X1 ln a1 + X2 ln a2)
      locator:
        page: 4
        published_page: 634
        pdf_page_index: 3
        equation: '15'
