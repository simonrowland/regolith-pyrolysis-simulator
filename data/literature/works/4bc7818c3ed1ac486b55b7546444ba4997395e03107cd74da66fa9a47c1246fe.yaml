    measurement_status: author_reduced_thermodynamic_results
    calculation: Delta G_T = R T sum(x_i ln(a_i,T)); Delta H_T and Delta S_T obtained by least-squares fit to Delta G_T =
      Delta H_T - T Delta S_T.
    derivation:
      relation: 'Equations (7)–(8): Delta G_T = R T sum(x_i ln(a_i,T)); least-squares fit of Delta G_T = Delta H_T - T Delta
        S_T.'
      inputs:
        temperature_range_K:
        - '1833'
        - '2033'
        x_i: Component fractions for each calcium-aluminate compound listed in Table 2.
        a_i_T: Activities obtained from comparison of measured ionic currents using equations (3)–(6); the numerical temperature-series
          inputs are not tabulated.
      parent_series_availability: The full measured-current/activity series is not printed; no numeric parent observations
        or derived_from links can be reconstructed. Table 1 is one 1933 K relative spectrum and is not the complete reduction
        input.
