- observation_id: shults_1995_table2_qualification_context
  type: thermodynamic_example
  locator:
    page: 3
    published_page: 19
    pdf_page_index: 2
    section: Results
  units: as reported
  values:
    quantity: numerical_context_table2
    method_class: quoted_attributed
    attribution: Shults and Shornikov (1995), results and comparisons with cited references [4–9], [13], and [14].
    qualifications:
    - The values of k1 ... were equal (with error less than 11%) to the values of k2.
    - Delta H_T and Delta S_T of calcium aluminates are constant in the temperature range 1833–2033 K [least-squares assumption].
    - The values were calculated per 1 mole of compounds of the CaO–Al2O3 system.
    - The Gibbs energy values of CaO·6Al2O3 ... obtained by the electromotive force method [4, 6], were extrapolated to the
      high-temperature region, because this compound remains solid at 1600–2100 K.
    - Discrepancies in the results of calculations in [14], which adequately describe thermodynamic properties and phase equilibria
      in the CaO-Al2O3 system, are insignificant; they are no more than 1 kJ/mol except for the compound CaO·Al2O3.
    - This discrepancy of approximately 3 kJ/mol is due to the value of the CaO·Al2O3 melting enthalpy.
    - The thermodynamic properties of 5CaO·3Al2O3 were studied for the first time.
    - Obtained temperature dependences of Gibbs energies of calcium aluminates correlate well with the data reported in the
      literature, supplement it in the temperature region above the melting point, and give evidence of negative deviations
      from the properties of an ideal mixture.
    directional_statements_verbatim:
    - Determined Gibbs energies of calcium aluminates (Fig. 1) make it possible to evaluate melting enthalpies of the studied
      compounds; they agree with the values calculated from thermochemical data [13] and with the results from [4 - 9].
    - Discrepancies in the results of calculations in [14], which adequately describe thermodynamic properties and phase equilibria
      in the CaO-Al2O3 system, are insignificant; they are no more than 1 kJ/mol except for the compound CaO·Al2O3.
    - This discrepancy of approximately 3 kJ/mol is due to the value of the CaO·Al2O3 melting enthalpy.
    - Obtained temperature dependences of Gibbs energies of calcium aluminates correlate well with the data reported in the
      literature, supplement it in the temperature region above the melting point, and give evidence of negative deviations
      from the properties of an ideal mixture.
    note: Numerical discussion statements are retained as located context and are not added as measurement rows.
