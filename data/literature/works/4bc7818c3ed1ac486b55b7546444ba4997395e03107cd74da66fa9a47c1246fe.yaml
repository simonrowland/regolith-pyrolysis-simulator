- observation_id: shults_1995_source_numeric_and_qualitative_context
  type: thermodynamic_example
  locator:
    page: 1
    published_page: 17
    pdf_page_index: 0
    section: Introduction and experimental/results paragraphs
  units: as printed
  values:
    quantity: numerical_context_and_data_qualifications
    method_class: quoted_attributed
    attribution: Shults and Shornikov (1995); transition data cited from references [1–3] and earlier measurements from references
      [3–10].
    assumed_gas_phase_equilibria:
      locator:
        page: 1
        published_page: 17
        pdf_page_index: 0
        equation: 1–2
        section: Results
      reference_as_printed: '[12]'
      equations:
      - (MoO3) = (MoO2) + (O)
      - (AlO) = (Al) + (O)
      note: Assumed equilibria in the gas phase over CaO–Al2O3 compounds form the stated basis for comparison-current activity
        reduction.
    numeric_statements:
    - CaO·Al2O3 melts congruently at 1877 ± 5 K; CaO·2Al2O3 at 2035 ± 10 K; 12CaO·7Al2O3 at 1733 ± 5 K.
    - CaO·6Al2O3 melts incongruently at 2148 ± 10 K and forms only under an oxygen-free atmosphere.
    - 5CaO·3Al2O3 melts congruently at 1753 ± 5 K.
    - 3CaO·Al2O3 dissociates at 1808 ± 5 K; its melting enthalpy is 20.8 ± 2 kJ/mol.
    - Earlier thermodynamic data in works [3–9] are limited to temperatures under 1800 K.
    - Prior Knudsen-effusion studies measured CaO and Al2O3 activities at 2060 K [4], or had substantial errors [10].
    - This study examined calcium aluminates at 1833–2033 K.
    - The tungsten cathode current was 1.00 ± 0.05 mA; appearance energies were measured from 5 to 70 eV with error under
      0.20 eV.
    - Silver and calcium appearance energies of 7.55 ± 0.08 and 6.12 ± 0.12 eV, respectively, were used as references.
    qualifications:
    - The thermodynamic data obtained in works [3–9] is limited to temperatures under 1800 K.
    - Mass spectrometric studies ... either involved only the measurement of CaO and Al2O3 activities at 2060 K [4], or had
      substantial errors [10].
    - The Al2O3 activities obtained by the method of comparing ionic currents [4] are underestimated compared to those calculated
      from the CaO activities by the Gibbs–Duhem equation.
    - Thus, in the high-temperature region (above 1800 K), reliable thermodynamic data on calcium aluminates is lacking.
    - No ions with the formula (CaAlOi)+ (i = 0 and 1) were detected.
    - The intensity of the (AlO)+ ionic current was determined assuming the concentration of the 43Ca isotope.
    - Determined appearance energies of ions ... were equal to the ionization energies of the corresponding molecules.
    - Hence, the vapor ... primarily contains molecular forms typical for the composition of the gas phase over CaO and Al2O3.
    directional_statements_verbatim:
    - The Al2O3 activities obtained by the method of comparing ionic currents [4] are underestimated compared to those calculated
      from the CaO activities by the Gibbs–Duhem equation.
    note: Qualitative and directional claims were rechecked against the page images; quoted context retains translation wording
      and ellipses where omitted text is not material to the claim.
  context_id: shults-1995-calcium-aluminate-thermodynamics::context::shults_1995_source_numeric_and_qualitative_context
