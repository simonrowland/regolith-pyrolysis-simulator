- observation_id: shornikov_2007_model_scope_and_data_qualifications
  type: thermodynamic_example
  locator:
    page: 36
    published_page: 36
    pdf_page_index: 1
  units: as reported
  values:
    quantity: model_scope_and_source_qualifications
    method_class: model_derived
    temperature_range_K:
    - '1500'
    - '2500'
    model: Ideal associated solutions theory; simplified lattice model with semi-phenomenological energy parameters; equilibrium
      found by Gibbs-energy minimization.
    data_inputs: The paper says CaO-Al2O3 data use reference [2], CaO-SiO2 data reference [3], Al2O3-SiO2 data reference [4],
      and the thermodynamic table is calculated according to data [2-6].
    qualifications:
    - The authors report no more than 15 percent deviation between their calculated oxide activities and reference [1] experimental
      data; they say the errors in those data are of the same order of magnitude.
    - The authors state positive melt-formation enthalpy and entropy are typical for CaO-Al2O3-SiO2 melts.
    - For CaSiO3-CaAl2Si2O8 and CaAl2Si2O8-CaAl2O4 concentration regions, calculated melt-formation Gibbs energies at 2000
      K are between -45 and -35 kJ/mole, explained by high melt-formation entropies.
    - The paper prints no numeric uncertainty for its Gibbs-energy table or figure curves.
  context_id: shornikov-2007-cao-aluminosilicate-melts::context::shornikov_2007_model_scope_and_data_qualifications
