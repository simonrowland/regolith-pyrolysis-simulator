- observation_id: shornikov_2025_model_and_qualifying_claims
  type: thermodynamic_example
  locator:
    page: 116
    published_page: 116
    pdf_page_index: 3
    section: Results and Discussion
  units: statements as printed
  values:
    method_class: model_derived
    model_description: A semi-empirical ideal-associated-solution model is used to calculate activity coefficients in multicomponent
      oxide melts over composition and temperature ranges. The model parameters are standard Gibbs energies for compounds
      and gas species over the melt, obtained from experimental and theoretical data.
    claims:
    - The model calculation covers K2O–Na2O–SiO2 melts and Saratov chondrule melts at 1300–2400 K.
    - The authors report monotonically decreasing gamma(K2O) and gamma(Na2O) as SiO2 content increases.
    - The authors state gamma(K2O) is almost an order of magnitude lower than gamma(Na2O), indicating stronger potassium–silica
      bonding in the melt.
    - The activity coefficients decrease by 3–4 orders of magnitude over the selected SiO2-content range.
    - For evaporation from chondrule melt, the authors describe the oxide activity coefficients as "symbatic linear logarithmic
      dependencies" and quite low, 10^-12–10^-8; the meaning of "symbatic" in this English translation is unclear.
    - The authors say the activity-coefficient decrease should reduce evaporation rate from ultrabasic to acidic melts.
    - The gamma(K2O)/gamma(Na2O) ratio decreases by a factor of two and drops sharply over 42–52 wt % SiO2, corresponding
      to the chondrule silica content.
    - At 1473 K the authors describe p(K)/p(Na) greater than one for the ultrabasic model melt and less than one for the average-acidity
      melt at relatively low K2O content.
    - “Figure 3b shows a decrease in the p(K) / p(Na) ratio with an increase in temperature in the ultrabasic melt and their
      absence in the melt of medium acidity.” (p. 117, Results and Discussion, paragraph following Fig. 3)
    - Relative volatility may invert with melt acidity and alkali content; the authors say temperature dependence is controlled
      by acid–base parameters.
    - At 1450 K the authors state that K2O and Na2O oxide evaporation ends almost simultaneously; despite potassium's individual
      volatility, its partial pressure is lower because K2O content is low.
    - For Saratov chondrules the authors state that 54.44 wt % SiO2 gives high melt acidity and does not allow K2O to have
      high volatility.
    note: These are author-reported interpretations and model claims, not additional numeric rows.
