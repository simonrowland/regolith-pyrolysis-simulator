- observation_id: shornikov_2025_chondrule_formation_background
  type: historical_context
  locator:
    page: 115
    published_page: 115
    pdf_page_index: 2
    section: Introduction
  units: located background statements as printed; not experimental observations
  values:
    method_class: quoted_unattributed
    claims:
    - “As it is known, chondrules are iron-magnesian silicate spherical objects or particles (spherules) with a diameter of
      0.1–1.0 mm, more than half of the volume of chondrite matter consists of them.”
    - “They appeared in the first millions of years at the stage of formation of the protoplanetary disk.”
    - “According to the estimates of various authors, the chondrules were completely melted at 1800–2100 K in a few minutes,
      which could have been caused by the passage of a shock wave through the dust component of a gas-dust cloud.”
    - “Further cooling of the chondrules occurred in a wide range of velocities (50–1000 K/h) in a hydrogen medium at 10^-4–10^-3
      atm.”
    note: These are located background claims from the Introduction, not measurements or observations from this experiment.
