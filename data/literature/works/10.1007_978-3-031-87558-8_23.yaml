- observation_id: shornikov_2025_data_qualifications
  type: experiment_series
  locator:
    page: 116
    published_page: 116
    pdf_page_index: 3
    section: Results and Discussion
  experiment: saratov-chondrule-kems-series
  units: statements as printed
  values:
    statements:
    - Alkalis were observed in the gas phase at 1300–1600 K during chondrule evaporation.
    - Evaporation of potassium and sodium oxides was not observed at 1700 K and above.
    - The reported p(K) and p(Na) pressures were in the range 10^-8–10^-7 atm at 1450–1500 K.
    - The residual-melt composition change was calculated from experimental vapor-species partial pressures as a function
      of temperature and evaporation time.
    - No experimental uncertainty or post-run bulk composition analysis is stated in this chapter.
    - The preparation and apparatus details are referred to Yakovlev et al. (1984).
