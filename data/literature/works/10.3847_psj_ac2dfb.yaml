      expression: M^(x+n) O_((x+n)/2)(l) = M^x O_(x/2)(g) + (n/4) O2(g)
      locator:
        published_page: 4
        pdf_page_index: 4
        equation: '1'
    - number: 2
      expression: p(M^x O_(x/2)) = K_(1) X(M^(x+n) O_((x+n)/2)) gamma(M^(x+n) O_((x+n)/2)) / (fO2)^(n/4)
      locator:
        published_page: 4
        pdf_page_index: 4
        equation: '2'
    - number: 3
      expression: log fO2(IW) = 2[-244118 + 115.559 T - 8.474 T ln(T)]/[ln(10) R T]
      locator:
        published_page: 4
        pdf_page_index: 4
        equation: '3'
    - number: 4
      expression: D_ik = [3 sqrt(kB Tskin)/(8 nhom sigma_ik^2 Omega_ik)] sqrt[(1/(2 pi))((mi+mk)/(mi mk))]
      locator:
        published_page: 5
        pdf_page_index: 5
        equation: '4'
    - number: 5
      expression: Mdot_diff,i = -D_ik (Delta n_exo-hom / Delta z_exo-hom) mi (ni/nhom) A_hom
      locator:
        published_page: 6
        pdf_page_index: 6
        equation: '5'
    - number: 6
      expression: ni,exo = 1/(Hi sigma_i) = mi g(h)/(kB Tskin sigma_i)
      locator:
        published_page: 6
        pdf_page_index: 6
        equation: '6'
    - number: 7
      expression: Tskin = [epsilon (Tsurf^4 - Tinfinity^4)/2 + Tinfinity^4]^(1/4)
      locator:
        published_page: 7
        pdf_page_index: 7
        equation: '7'
    - number: 8
      expression: LEUV = (4.7E25) t^(-1.18)
      locator:
        published_page: 7
        pdf_page_index: 7
        equation: '8'
    - number: 9
