    pdf_page_index: 2
    section: Introduction
  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    quote: Shornikov et al. [49–51] studied 17 CaO–TiO2–SiO2 compositions from molybdenum cells at 1582–2529 K; the synthesized
      compositions were 25.60–50.00 mol % CaO, up to 60.67 mol % SiO2, and 5.05–50.00 mol % TiO2.
    attribution: Shornikov (2020)
    note: Summary, not a verbatim quotation; prior-study numeric scope.
  context_id: shornikov-2020-cao-tio2-melts::context::shornikov_2020_numeric_context_03
