- observation_id: shornikov_2020_numeric_context_09
  type: literature_context
  locator:
    published_page: 1291
    pdf_page_index: 2
    section: Introduction
    note: Summary spanning pp. 1290–1291; the activity comparison sentence continues below Table 1, followed by a separate
      sentence about 24 compositions.
  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    quote: Suito et al. [46, 47] activities correlate with Banon et al. [48] values measured by Knudsen effusion mass spectrometry
      at 1900–2200 K (Table 2). Separately, Banon et al. studied 24 CaTiO3–Ti2O3–TiO2 system compositions vaporizing from
      molybdenum cells.
    note: Summary, not a verbatim quotation; two distinct printed sentences.
    attribution: Shornikov (2020)
  context_id: shornikov-2020-cao-tio2-melts::context::shornikov_2020_numeric_context_09
  work_id: 10.1134/s0036024420070274
  source_id: shornikov-2020-cao-tio2-melts
  species: CaO_TiO2_system
- observation_id: shornikov_2020_numeric_context_10
  type: literature_context
  locator:
    published_page: 1292
