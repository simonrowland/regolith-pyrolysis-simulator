    section: Introduction
  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    quote: Suito et al. [46, 47] studied the equilibria in CaO–TiOx (or CaO–TiOx–Al2O3) slags containing liquid nickel with
      respect to oxygen, nitrogen, and sulfur, depending on the Ti (or Al) content in the metal, using CaO or Al2O3 crucibles
      at 1873 K.
    attribution: Shornikov (2020)
    note: Introduction; prior-study conditions.
  context_id: shornikov-2020-cao-tio2-melts::context::shornikov_2020_numeric_context_01
