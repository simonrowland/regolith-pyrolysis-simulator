    section: Introduction
  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    quote: Banon et al. [48] studied the vaporization of 24 CaTiO3–Ti2O3–TiO2 system compositions from molybdenum cells at
      2150 K; the synthesized compositions contained up to 90.2 mol % Ti2O3 and 42 mol % TiO2.
    attribution: Shornikov (2020)
    note: Summary, not a verbatim quotation; prior-study numeric scope.
  context_id: shornikov-2020-cao-tio2-melts::context::shornikov_2020_numeric_context_02
