    section: Introduction
    note: Paragraph discussing Shornikov et al. [42] perovskite vaporization.
  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    quote: Table 2 also contains data measured by Shornikov [42] when studying the vaporization of perovskite via Knudsen
      effusion mass spectrometry in the temperature region of 1791–2398 K.
    attribution: Shornikov (2020)
  context_id: shornikov-2020-cao-tio2-melts::context::shornikov_2020_numeric_context_10
  work_id: 10.1134/s0036024420070274
  source_id: shornikov-2020-cao-tio2-melts
