    section: Introduction
  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    quote: Stolyarova et al. [54] studied the gas phase over 14 CaO–TiO2–SiO2 compositions in tungsten cells at 1800–2200
      K; compositions reached 70 mol % CaO, 69 mol % SiO2, and 40 mol % TiO2.
    attribution: Shornikov (2020)
    note: Summary, not a verbatim quotation; prior-study numeric scope.
