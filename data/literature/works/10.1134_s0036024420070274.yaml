  units: as printed
  values:
    quantity: numeric_or_comparative_background_statement
    method_class: quoted_unattributed
    quote: The activities of oxides in CaO–TiO2 melts were determined in the temperature region of 2241–2441 K via high-temperature
      Knudsen effusion mass spectrometry using two independent approaches.
    attribution: Shornikov (2020)
    note: Printed conclusion scope statement; Tables 3–5 use 2278 ± 10 K.
