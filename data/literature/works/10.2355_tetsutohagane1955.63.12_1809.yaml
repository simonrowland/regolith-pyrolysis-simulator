- observation_id: banya77_equations_pure_liquid_iron_saturation
  type: equation_summary
  locator:
    published_page: 1814
    section: Fig. 5 discussion
  units: Equilibrium equations and temperature ranges as printed
  values:
    delta_iron_equation_as_printed: FeO(pure liquid) + H2(g) = Fe(delta) + H2O(g), 1536-1392 C; log K1 (= PH2O/PH2) = 1588/T
      - 1.007; ΔG°1 = -7265 + 4.607 T; equation (2-1).
    gamma_iron_equation_as_printed: FeO(pure liquid) + H2(g) = Fe(gamma) + H2O(g), 1392-911 C; log K2 (= PH2O/PH2) = 1645/T
      - 1.042; ΔG°2 = -7525 + 4.767 T; equation (2-2).
    FetO_activity_delta_equation_as_printed: log a_FetO = log(PH2O/PH2) - 1588/T + 1.007, 1536-1392 C; equation (11).
    FetO_activity_delta_equation_locator:
      published_page: 1815
      section: '4.3'
      equation: '11'
    FetO_activity_gamma_equation_as_printed: log a_FetO = log(PH2O/PH2) - 1645/T + 1.042, 1392-911 C; equation (12).
    FetO_activity_gamma_equation_locator:
      published_page: 1815
      section: '4.3'
      equation: '12'
    FetO_reference_state_as_printed: Table 4 labels the FetO activity as Raoult law standard and gives a_FetO = 1 at X_P2O5
