- observation_id: berman1988_akermanite_table3b_transition_parameters
  type: table_parameter_context
  locator:
    published_page: 464
    pdf_page_index: 19
    table: 3b
  phase: Akermanite
  units: T_lambda and T_ref in K; dT/dP in K/bar; l1 in (J/mol)^0.5 K^-1; l2 in (J/mol)^0.5 K^-2; Delta_t H in J/mol.
  values:
    quantity: lambda_transition_parameters_context
    printed_phase: Akermanite
    equation_numbers:
    - 8
    - 9
    - 8a
    - 10
    - 11
    - 12
    - 13
    - 14
    equation_forms_as_printed:
    - Cp_lambda^(P=1 bar) = T(l1 + l2 T)^2
    - T_lambda^P = T_lambda^(1 bar) + k(P-1 bar), where k = dT/dP
    - Cp_lambda^P = T'(l1 + l2 T')^2, where T' = T + Td
    - Delta_lambda H^(P,T) = integral[tr,T] Cp_lambda^P dT = x1(T-tr) + x2/2(T^2-tr^2) + x3/3(T^3-tr^3) + x4/4(T^4-tr^4)
    - Delta_lambda S^(P,T) = integral[tr,T](Cp_lambda^P/T)dT = x1(ln T-ln tr) + x2(T-tr) + x3/2(T^2-tr^2) + x4/3(T^3-tr^3)
    - x1=l1^2 Td + 2 l1 l2 Td^2 + l2^2 Td^3; x2=l1^2 + 4 l1 l2 Td + 3 l2^2 Td^2; x3=2 l1 l2 + 3 l2^2 Td; x4=l2^2
    - Delta_lambda G^(P,T) = Delta_lambda H^(P,T) - T Delta_lambda S^(P,T)
    - Delta_lambda G^(P,T) = Delta_lambda G^(P,T_lambda) - (T-T_lambda^P) Delta_lambda S^(P,T_lambda)
    - Delta_t G^(P,T) = Delta_t G^(P,T_lambda) - (T-T_lambda^P)(Delta_t S + Delta_lambda S^(P,T_lambda))
    Tlambda_K: 358
    Tref_K: 298
    dTdP_K_per_bar: '0'
    l1:
      reported_value: '0'
      table_column_scale: x10^2
      multiplier_to_equation_coefficient: '0.01'
      units: (J/mol)^0.5 K^-1
    l2:
      reported_value: '0'
      table_column_scale: x10^5
      multiplier_to_equation_coefficient: '0.00001'
      units: (J/mol)^0.5 K^-2
    delta_t_H_J_per_mol: 452
    temperature_interval_K:
      lower_exclusive: 298
      upper_exclusive: 358
    temperature_interval_note: Equation 8 lambda term is defined between T_ref and T_lambda; Table 3b parameters are at 1
      bar.
