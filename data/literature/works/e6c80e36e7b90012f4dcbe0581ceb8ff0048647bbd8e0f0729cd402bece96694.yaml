- observation_id: miki_1999_knudsen_activity_method_equations
  type: method
  locator:
    page: 4
    published_page: 1111
    section: Knudsen effusion method
    equation: 11-18
  units: as printed
  quote: When the effusion of vapor from the Knudsen cell orifice satisfies molecular flow conditions, the relation between
    ion current and vapor pressure, P_M, can be written as follows.
  values:
    knudsen_reaction: M(l) = M(g), M = Al or Ca (Eq. 11).
    knudsen_equilibrium: K = P_M/(γ_M(l) in Si(T) X_M in Si) = exp(−ΔG°vap_M(T)/(RT)) (Eq. 12).
    current_pressure_relation: P_M = A I_M(T) T (Eq. 13), conditional on molecular-flow conditions at the Knudsen-cell orifice.
    knudsen_gamma_equation: ln γ_M(l) in Si(T) = ln γ_M(l) in Si(1723) + ln[I_M(T)T/(I_M(1723)·1723)] + ΔG°vap_M(T)/(RT) −
      ΔG°vap_M(1723)/(R·1723) (Eqs. 14-16).
    deltaG_vaporization_Al: Al(l)=Al(g); ΔG°=304900−110.2T J mol−1, JANAF [9] (Eq. 17).
    deltaG_vaporization_Ca: Ca(l)=Ca(g); ΔG°=150100−84.65T J mol−1, JANAF [9] (Eq. 18).
  context_id: miki-1999-si-alloy-thermodynamics::context::miki_1999_knudsen_activity_method_equations
