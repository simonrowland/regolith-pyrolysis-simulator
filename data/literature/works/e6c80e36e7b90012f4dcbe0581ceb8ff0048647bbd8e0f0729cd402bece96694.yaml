- observation_id: miki_1999_equilibrium_qualification
  type: method
  locator:
    page: 4
    published_page: 1111
    section: Knudsen effusion method
  units: as printed
  values:
    quote: “Since the reproducible ion currents during the same experiment were observed, the change in composition of Si–Al
      and Si–Ca alloys and experimental conditions such as apparatus constant and ionization cross section can be neglected.”
    interpretation: Reproducibility of ion currents is the stated repeatability evidence for Knudsen measurements. The chemical-equilibration
      experiments report a 14.4 ks hold and invoke equilibrium relations, but no equilibration time series or approach-from-both-sides
      test.
  context_id: miki-1999-si-alloy-thermodynamics::context::miki_1999_equilibrium_qualification
