context:
- observation_id: miki_1999_activity_method_equations
  type: method
  locator:
    page: 2
    published_page: 1109
    section: Results and Discussion
    equation: 1-2
  units: as printed
  values:
    chemical_equilibration_equation_1: ln γ_i(l) in Si + ln X_i in Si = ln γ_i(l) in Pb + ln X_i in Pb; activity equality
      for liquid phases, each solute referenced to pure liquid i.
    chemical_equilibration_equation_2: ln X_Pb in Pb − ln X_Pb in Si = ln γ°_Pb in Si + ε^M_Pb in Si X_M in Si; Henry-law
      approximations, neglecting Pb self-interaction term.
    standard_state: Pure liquid solute for γ_M; mole-fraction scale; infinite-dilution intercept γ°.
  context_id: miki-1999-si-alloy-thermodynamics::context::miki_1999_activity_method_equations
  work_id: e6c80e36e7b90012f4dcbe0581ceb8ff0048647bbd8e0f0729cd402bece96694
  source_id: miki-1999-si-alloy-thermodynamics
  species: Si
