      note: α_e,NaO0.5 from eq.6 using literature γ_NaO0.5 at 1400 °C
    values:
      gas_species: Na(g)
      material: ferrobasalt_FCMAS_open_furnace
      method_class: model_derived_from_Kstar_and_external_gamma
      semantics: disagreeing_inferred_evidence_not_physical_alpha_range
      gamma_derived_alpha_e_inference_at_1400C:
      - '0.3'
      - '1.7'
      physical_alpha_upper_bound: '1'
      consumer_policy: report_only_not_executable_alpha_range
      note: 'Source §4.6: γ_NaO0.5 ≈ 10^-3 (DeMaria/Gooding/Mathieu) gives α_e,NaO0.5 between 0.3–1.7 at 1400 °C. The inferred
        span exceeds the source''s α_e<=1 physical bound, so it is disagreeing model-derived evidence, not an admissible alpha
        range. Competing with the separately authors-adopted α_e=1 observation; do not average (VALUE-PRECEDENCE).'
      missing_for_motzfeldt:
      - orifice_area
      - clausing_factor
      missing_note: Open 1-atm furnace wire-loop experiments — NOT Knudsen-cell geometry.
  - source_observation_id: sossi_2019_na_alpha_e_authors_adopted_unity
    element: Na
    locator:
      section: 4.6 Evaporation coefficients
      line_range: '306'
      note: authors set α_e=1 after concluding coefficients close to unity within ×2–3
    values:
      alpha: '1'
      chamber_pressure_bar: '1'
      alpha_authority_status: analytical_upper_bound
      alpha_role: authors_adopted_model_value_not_measurement
      physical_alpha_upper_bound: '1'
      semantics: competing_observation_do_not_average
      gas_species: Na(g)
      material: ferrobasalt_FCMAS_open_furnace
      authors_summary: evaporation coefficients close to unity within a factor of 2-3; α_e set to 1
      note: 'Source: "evaporation coefficients are close to unity (within a factor of 2-3)… Based on these observations α_e
        is set to 1 and γ_i^∞ is calculated from K*/K". Competing with gamma-derived 0.3–1.7 range observation; do not average.'
      missing_for_motzfeldt:
      - orifice_area
      - clausing_factor
  - source_observation_id: sossi_2019_na_class_and_transport_b1
    element: Na
    locator:
      section: 4.6 Evaporation coefficients
      line_range: 300-306
    values:
      alpha: '1'
      alpha_authority_status: analytical_upper_bound
      alpha_role: authors_adopted_model_value_not_measurement
      physical_alpha_upper_bound: '1'
      gas_species: Na(g)
      material: ferrobasalt_FCMAS_open_furnace_1bar
      method_class: model_derived_from_Kstar_and_external_gamma
      system_class: silicate_melt
      transformation_class: network_modifier_desorption
      interfacial_reaction: NaO0.5(l) -> Na(g) + 1/4 O2
      transformation_class_confidence: low
      semantics: competing_observation_do_not_average
      authors_adopted_alpha: '1'
      gamma_derived_alpha_e_inference_at_1400C:
      - '0.3'
      - '1.7'
      gamma_derived_inference_status: disagrees_with_physical_upper_bound
      consumer_policy: report_only_inference_plus_status_bearing_ceiling
      transport_treatment: Lumped open-furnace apparent α_e from K*/(γ K). Authors model melt sphere with HKL; §4.6 lists
        diffusion-limited evaporation and gas flow rate among experimental uncertainties (±6% random sum, section 4.2) but
        does NOT apply an explicit gas-phase diffusion residual correction that would isolate a vacuum-comparable intrinsic
        α. α_e is residual after independent γ, not post-Fick inversion.
      transport_treatment_verdict: lumped_apparent_not_post_diffusion_corrected
      chamber_pressure_bar: '1'
      gas_mix: 1-atm vertical tube gas-mixing furnace (fO2 buffer; inert carrier + O2 control)
      note: Authors separately set α_e=1 after concluding coefficients close to unity within ×2–3. The gamma-derived 0.3–1.7
        inference at 1400°C exceeds the physical α_e<=1 bound and is retained only as disagreeing report evidence. Runtime
        uses α=1 solely as a status-bearing analytical ceiling.
      missing_for_motzfeldt:
      - orifice_area
      - clausing_factor
  - source_observation_id: sossi_2019_k_open_furnace_alpha_e_context
