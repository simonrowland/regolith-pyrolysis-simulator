- observation_id: balasubramaniam_2009_model_structure
  type: method
  locator:
    page: 7
    published_page: 3
    pdf_page_index: 6
    section: II. Model
    note: Sections II.A-II.D; Eq. (1), PDF p. 7; Eqs. (2)-(8), p. 8; Eqs. (9)-(13), p. 9 (published pp. 3-5).
  units: as printed
  values:
    quantity: chemical_conversion_model_structure
    method_class: model_description
    surface_reaction: Carbon deposition by a first-order surface reaction in methane; flux = gamma x methane concentration
      adjacent to the melt surface; all carbon-deposition pathways lumped into one process
    melt_reaction: Single-step second-order reaction, first order in carbon and in metal oxide; rate = k x carbon concentration
      x metal-oxide concentration
    melt_mixing: Well-mixed zone; no spatial gradients; carbon-cap formation not modelled; heat transfer not analysed and
      treated as uncoupled
    stoichiometric_coefficient_a_for_SiO2: approximately 0.5 (printed as ≈ 0.5)
    gas_phase: CSTR (average concentration equals exit concentration), quasi-steady methane balance, constant fraction f of
      incoming methane pyrolyzed; ideal gas at constant temperature and pressure
    fit_procedure: k from a non-linear least-squares fit of 1 - z versus y (Eq. 12); gamma then from a least-squares fit to
      Eq. (13)
    equations_as_printed: '(1) dα*/dt* = AγC_m/V − kα*β*

      (2) dβ*/dt* = −akα*β*

      (3) α = β − 1 + λt

      (4) β = [2√λ exp(t − λt²/2)] / [2√λ + exp(1/(2λ))√(2π){erf(1/√(2λ)) + erf((tλ − 1)/√(2λ))}]

      (5) (ṁ_m)_in − (ṁ_m)_out = γAC_m + V_g dC_m/dt*

      (6) −(ṁ_h)_out = −2γAC_m + V_g dC_h/dt*

      (7) −(ṁ_co)_out = −(Vβ₀²k/a)αβ + V_g dC_co/dt*

      (8) (ṁ_m)_in − Ṁ_out = −γAC_m − (Vβ₀²k/a)αβ; Ṁ_out = (ṁ_m)_out + (ṁ_h)_out + (ṁ_co)_out

      (9) f(ṁ_m)_in = γAC_m = γAρx_m

      (10) [(1 − f)(ṁ_m)_in]/x_m = (ṁ_m)_in + γAρx_m + (Vβ₀²k/a)αβ

      (11) X_CO = (Vβ₀/a)[1 − β(t)]

      (12) [2√(y/k) exp(kβ₀t* − ½ykβ₀²t*²)] / [2√(y/k) + exp(k/(2y))√(2π){erf(√(k/(2y))) + erf(√((k/(2y))(yβ₀t* − 1)))}] =
      1 − z

      (13) γ = [f(1 + f + fβt)/(1 − f)](ṁ_m)_in/(Aρ) + [kVβ₀²/(aAρ)][f/(1 − f)]β(β − 1)

      Definitions: α = α*/(β₀/a), β = β*/β₀, t = t*/[1/(kβ₀)], λ = aAγC_m/(kVβ₀²); y = aAγC_m/(Vβ₀²) = af(ṁ_m)_in/(Vβ₀²);
      z is the metal-oxide conversion fraction, z = aX_CO/(Vβ₀). At t* = 0, no carbon is present and the metal-oxide concentration
      is β₀.

      '
    CO2_neglected: CO2 production neglected; ORBITEC experiments show CO2 detected is only a few percent of the CO produced
      (PDF p. 8, published p. 4)
