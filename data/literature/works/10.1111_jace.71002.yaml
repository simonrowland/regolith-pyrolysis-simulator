      \                                                                                                                  \
      \                                                                                          MgFe2 O4 is nearly an inverse\
      \ spinel at room temperature,\n                                                                                    \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                          with Fe3+ occupying tetrahedral\
      \ sites and both Mg2+ and Fe3+\n                                                                                   \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                           in octahedral sites. As\
      \ the temperature increases, it gradu-\n                                                                           \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                   ally transitions\
      \ toward normal spinel structure. At low (about\n                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                            500◦ C)\
      \ temperatures, the cation distribution does not achieve\n                                                         \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \   equilibrium due to limited cation mobility. Conversely, at high\n                                              \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \              temperatures (above 1100◦ C), quenching makes it challenging\n                                      \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                      to preserve the equilibrium cation arrangement. The degree of\n                             \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                                                                                                                  \
      \                               inversion of MgFe2 O4 spinel was investigated in several works.\n                  \
      \                                                                                                                  \
