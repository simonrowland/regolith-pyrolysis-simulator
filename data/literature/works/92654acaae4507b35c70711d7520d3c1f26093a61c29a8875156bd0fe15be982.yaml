    composition. It does not assign one phase to the activity.
  values:
    duplicate_of: shornikov-2019-lunar-meteorite-evaporation-model
    evidence: The 2019 paper is Shornikov, Geochemistry International 57(8), 865–872, "Thermodynamic modeling of evaporation
      processes of lunar and meteorite substance." It prints the same Hertz–Knudsen description, the same statement that the
      partial evaporation coefficient is equal to 1 (Shornikov, 2015), the same Lewis equation, the same ideal-associated-solution
      model, and the same 1600–2500 K Knudsen range for the thermodynamic database.
    alpha_sentence_as_printed: The partial evaporation coefficient, characterizing the change in the structure of a molecule
