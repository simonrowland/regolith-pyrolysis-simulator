- observation_id: yu_hewins_1997_introduction_context
  type: statement
  locator:
    page: 1
    pdf_page_index: 0
    section: Introduction
  units: verbatim prose
  values:
    quantity: prior_study_context_and_motivation
    method_class: quoted_unattributed
    statements_verbatim:
    - Potassium and sodium are both moderately volatile elements [1]. Though many experimental studies have been done to investigate
      the volatility of sodium and its implications to chondrule formation [e.g., 2,3], most of these experiments were performed
      at 1 atm pressure. There have been only limited studies on the volatility of potassium [4,5] and it is not clear how
      the evaporative behavior of potassium compares to that of sodium.
    - Assuming chondrules formed in a nebular environment with pressures far less than 1 atm [6], a knowledge of the evaporative
      behavior of the moderately volatile elements at low pressures is important for understanding the chondrule-forming processes.
    - Moreover, understanding the evaporative behavior of potassium is particularly important because potassium is a lithophile
      element with more than two isotopes, potentially a better candidate than sodium for studying nebular processes since
      it allows studies of mass dependent isotopic fractionation [7].
    quantitative_note: The introduction’s 1 atm and far-below-1-atm statements concern prior studies or the assumed nebular
      environment, not this experiment’s run values.
  context_id: yu-hewins-1997-lpsc28-1613::context::yu_hewins_1997_introduction_context
  work_id: 5eb05f65055cf73212a9f569295f24e0874020f3837d030f9432dee4ccfb93c0
  source_id: yu-hewins-1997-lpsc28-1613
  species: K
