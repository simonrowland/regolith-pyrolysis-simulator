- observation_id: yu_hewins_1997_discussion_comparisons
  type: statement
  locator:
    page: 1
    pdf_page_index: 0
    section: Discussion
  units: verbatim prose
  values:
    quantity: condensation_evaporation_and_chondrule_comparisons
    method_class: quoted_unattributed
    statements_verbatim:
    - Potassium and sodium have very similar condensation temperatures [1] but this does not necessarily lead to similar evaporation
      rates.
    - An analogous situation exists with isotopes of K, which may or may not show mass fractionation during evaporation [7].
    - This study shows that when heated far above the minimum vaporization temperatures for both elements, sodium is more
      easily lost from chondrule melts.
    - Chondrules have various potassium and sodium contents and the two elements are positively correlated [8]. However, the
      chondrule data are more or less linear on K-Na plot and do not show a curve that convex towards the potassium rich side
      as shown in Fig. 2. This suggest that chondrules are unlikely to have formed by progressive evaporation from a single
      original source, unless the conditions that suppress K isotopic fractionation also suppress K/Na fractionation. There
      are other possibilities such as volatile recondensation [9] or low temperature re-entry [10], but how these processes
      can affect the K/Na ratio is unknown.
    - Compared to 1 atm pressure, potassium and sodium evaporate much faster at lower pressure and with the presence of H2,
      as in a nebular environment.
    - Detailed potassium isotopic study should unveil the secrets and this will be the next step of our on-going investigation.
  context_id: yu-hewins-1997-lpsc28-1613::context::yu_hewins_1997_discussion_comparisons
  work_id: 5eb05f65055cf73212a9f569295f24e0874020f3837d030f9432dee4ccfb93c0
  source_id: yu-hewins-1997-lpsc28-1613
  species: K
- observation_id: yu_hewins_1997_discussion_conclusion
  type: statement
  locator:
    page: 2
    pdf_page_index: 1
    section: Results and discussion
  units: verbatim prose
  values:
    quantity: flash_heating_and_low_pressure_conclusion
    method_class: quoted_unattributed
    numeric_context_as_printed: Flash heating simulation at 6 × 10^-3 torr; heated for 20 seconds; cooled at 5000°C/hr; charge
      lost 40% sodium and 25% potassium.
    statements_verbatim:
    - More experiments are underway, but it becomes doubtful that flash heating alone will effectively prevent volatile loss
      under low pressure conditions.
    uncertainty: No numeric uncertainty for the losses or rates is reported.
  context_id: yu-hewins-1997-lpsc28-1613::context::yu_hewins_1997_discussion_conclusion
  work_id: 5eb05f65055cf73212a9f569295f24e0874020f3837d030f9432dee4ccfb93c0
