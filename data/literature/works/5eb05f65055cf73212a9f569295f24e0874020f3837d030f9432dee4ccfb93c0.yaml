- observation_id: yu_hewins_1997_results_directional_claims
  type: statement
  locator:
    page: 1
    pdf_page_index: 0
    section: Experimental results
  units: verbatim prose
  values:
    quantity: reported_pressure_hydrogen_and_element_rate_comparisons
    method_class: quoted_unattributed
    statements_verbatim:
    - First, pressure has a significant effect on the vaporization rates of both K and Na from silicate melt. The calculated
      vaporization rate of K at 1450°C, for example, is about an order of magnitude higher at 10^-5 atm than that at 1 atmosphere
      pressure, e.g., 3.8 × 10^-3 cm/min vs. 1.7 × 10^-4 cm/min (Fig. 1).
    - Second, the presence of H2 enhances the K and Na loss. Introduction of H2 into the evacuated system caused about an
      order of magnitude increase in overall system pressure, yet the vaporization rates for both K and Na are slightly increased.
    - Third, Na has a higher vaporization rate than K. This is observed in all three sets of experiments run under different
      pressures and gas environment. On the K/Ko vs. Na/Nao diagram (Fig. 2), the data of experimental charges significantly
      deviate from the 1:1 line and form a curve convex towards the K-rich side. The calculated values of vaporization rates
      for Na are about 1.3 to 2 factors higher than those for K.
  context_id: yu-hewins-1997-lpsc28-1613::context::yu_hewins_1997_results_directional_claims
