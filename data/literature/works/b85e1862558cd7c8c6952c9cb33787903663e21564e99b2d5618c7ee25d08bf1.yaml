    - locator:
        published_page: 4
        pdf_page_index: 7
      highest_temperature_K: 2160
      possible_K2O_composition_as_low_as_wt_pct: 3
      assumed_mass_spectrometer_constant_error_pct: 30
      compared_literature_pressure_temperatures_K:
      - 1400
      - 1600
      - 1800
    printed_statements:
    - published_page: 3
      quote: While analysis of the experimental results obtained is not entirely complete, no evidence that the K pressure
        was independent of bulk composition of the sample was obtained.
    - published_page: 3
      quote: This represents non-equilibrium behavior in the measurements.
    - published_page: 3
      quote: This effect is likely due to depletion of KAlSiO4 from the sample.
    - published_page: 3
      quote: At the highest temperature (1880 K) partial melting probably caused a redistribution of some remaining KAlSiO4
        by either bringing the crystals to the surface or dissolving them in the melt.
    - published_page: 3
      quote: This effect was noted only in the experiments for which the remaining KAlSiO4 phase was becoming small.
    - published_page: 4
      quote: The K pressure at constant temperature decreases by over 3 orders of magnitude when the K2O bulk composition
        decreases from 29 wt% K2O to 11 wt% K2O.
    - published_page: 4
      quote: At the highest temperature, 2160 K, the sample should be entirely molten and under these conditions slow kinetics
        due to complex crystal chemistry is not a possibility.
    - published_page: 4
      quote: These data showed that the activity of SiO2 is close to unity for this system.
    - published_page: 4
      quote: The experiment was finally terminated because the P_SiO was greater than P_K and it appeared that the sample
        might become exhausted in SiO2 before all of the K2O was evaporated.
    - published_page: 4
      quote: Additional measurements on this composition were made. It proved possible to vaporize all the K2O from the sample
        at 1945 K.
    - published_page: 4
      quote: This appears to confirm the suspected effect of CaO in ameliorating K2O capture by Al2O3 and SiO2.
    source_qualification: At 2160 K the sample was expected to be entirely molten; the report says slow kinetics due to complex
      crystal chemistry was not a possibility under those conditions.
    source_qualification_locator:
      published_page: 4
      pdf_page_index: 7
