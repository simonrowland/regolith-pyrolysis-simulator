- observation_id: schneider_1980_walden_and_iron_qualification
  type: thermodynamic_example
  locator:
    published_page: 21
    pdf_page_index: 24
  units: as printed
  values:
    quantity: slag_conductivity_interpretation
    relation_as_printed: η · σ = const
    definitions: η is viscosity; σ is electrical conductivity for conducting ionic species (iron ions) in molten glass.
    qualifications: At conductivity maxima crystalline components are feldspar sesquioxide and spinel solid solutions of undefined
      compositions; conduction cannot be assigned uniquely to crystals or iron-rich glass, and polarization effects were not
      observed. Capps reports viscosity decreases with increased iron and decreased silica; relative silica decreases with
      any non-silica addition. Data are repeatable with repeated treatments. Adding Fe2O3/Fe3O4 to potassium-free Bow slag
      causes excessive frothing unless highly reducing.
  context_id: kems-212-schneider-1980-nbsir-80-2059::context::schneider_1980_walden_and_iron_qualification
