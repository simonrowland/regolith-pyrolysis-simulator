- observation_id: schneider_1980_model_p6
  type: thermodynamic_example
  locator:
    published_page: 6
    pdf_page_index: 9
  units: as printed; temperature in K
  values:
    quantity: ideal_crystal_liquid_model
    method_class: model_derived
    relation_as_printed: -ln X_B^melt = -ln X_B^xl + (ΔH_B^fusion/R)(1/T - 1/T_B^fusion)
    definitions: X_B are mole fractions of B in coexisting liquid and crystal; ΔH_B^fusion is enthalpy of fusion of pure crystalline
      B; T_B^fusion is melting point; R is gas constant; T is temperature in kelvin.
    assumptions: Relation also applies to multicomponent crystal/liquid equilibria. Small iron content in Western residual
      melts is assumed ferrous; sample calculations indicate insignificant result changes for Western melts, emphatically
      not true for Eastern melts.
    conference_ordinal: 7
  context_id: kems-212-schneider-1980-nbsir-80-2059::context::schneider_1980_model_p6
  work_id: b85e1862558cd7c8c6952c9cb33787903663e21564e99b2d5618c7ee25d08bf1
  source_id: kems-212-schneider-1980-nbsir-80-2059
  species: K
- observation_id: schneider_1980_model_p7
  type: thermodynamic_example
  locator:
    published_page: 7
    pdf_page_index: 10
  units: as printed
  values:
    quantity: ideal_activity_and_quasichemical_oxygen_model
    method_class: model_derived
    crystal_purity_mol_pct: 85
    assumed_congruent_melting_temperature_K: 2058
    fusion_enthalpy_source: Spencer et al., reference 3; no numerical enthalpy printed here.
    relations_as_printed:
    - (KAlSiO4)^xl = 1/2(K2O)^melt + 1/2(Al2O3)^melt + (SiO2)^melt
    - a_KAlSiO4^(ideal,melt) = 8(X_K2O^melt)^(1/2)(X_Al2O3^melt)^(1/2)(X_SiO2^melt)
    - 2 O⁻ = O²⁻ + O⁰
    - (8X - 8X²)(n_O⁻)² + (-2X - 2)n_O⁻ + (1 - 4k) = 0
    - n_O⁰ = (4X - n_O⁻)/2
    - n_O²⁻ = (1 - X) - n_O⁻/2
    definitions: O²⁻, O⁻, O⁰ denote free oxide ions, non-bridging oxygens, bridging oxygens; n is moles per mole of melt;
      X is mole fraction of (SiO2 + KAlO2).
    model_assumptions: Literature k values from refs. 4/5 with temperature dependence assumed similar to FeO-SiO2 (ref. 6);
      standard-state correction proportional to Ca²⁺, Fe²⁺, Mg²⁺ ion field strengths (ref. 7); otherwise Fe²⁺/Mg²⁺ k assumed
      equal. KAlO2 and SiO2 substitute ideally in the polymer network (ref. 8).
    qualifications: Agreement of predicted and measured activity is not good under oxide precipitation definition. Polymerization
      increases with (KAlO2 + SiO2), reflected by increased O⁰ content; free oxide-ion content is very low.
    source_figure_numbering: Text refers to Figure 3a; activity plots are later captioned Figure 6. Source references retained
      without renumbering.
  context_id: kems-212-schneider-1980-nbsir-80-2059::context::schneider_1980_model_p7
  work_id: b85e1862558cd7c8c6952c9cb33787903663e21564e99b2d5618c7ee25d08bf1
  source_id: kems-212-schneider-1980-nbsir-80-2059
  species: K
- observation_id: schneider_1980_model_p8
  type: thermodynamic_example
  locator:
    published_page: 8
    pdf_page_index: 11
  units: as printed
  values:
    quantity: structon_activity_and_mixing_energy_model
    method_class: model_derived
    basic_SiO4_structural_unit_count: 5
    structural_unit_definition: Parenthetic index gives number of non-bridging oxygens; SiO4(0) is infinite-framework unit;
      SiO4(4) is independent tetrahedron.
    relations_as_printed:
    - a_KAlSiO4^(ideal,melt) = 4 X_KAlO2^melt X_SiO2^((0),melt)
    - a_KAlSiO4^(ideal,melt) = 4 X_KAlO2^melt X_SiO2^((1),melt)
    - ΔG_mixing = (n_O⁻/2) RT ln k
    definitions: X_SiO2^((0),melt) is mole fraction of (KAlO2 + SiO2) in melt present as SiO4(0) structons.
    qualifications: Only SiO4(0) and SiO4(1) increase with increasing mole % (KAlO2 + SiO2), hence increasing temperature.
      SiO4(0) gives substantially lower calculated activities; SiO4(1) gives very good agreement with ideal-solution predictions.
      SiO4(1) has a non-bridging oxygen essential for reaction; KAlO2/SiO2 mix near ideally, KAlO2 sites have nearly equal
      reactivity, but silica polymerization determines precipitation.
    source_figure_numbering: Text refers to Figures 5b, 3c and 3d; later activity plot caption is Figure 6.
  context_id: kems-212-schneider-1980-nbsir-80-2059::context::schneider_1980_model_p8
  work_id: b85e1862558cd7c8c6952c9cb33787903663e21564e99b2d5618c7ee25d08bf1
  source_id: kems-212-schneider-1980-nbsir-80-2059
  species: K
- observation_id: schneider_1980_model_p9
  type: thermodynamic_example
  locator:
    published_page: 9
    pdf_page_index: 12
  units: as printed
  values:
    quantity: Eastern_melt_free_energy_model_assumptions
    method_class: model_derived
    activity_data_irregularity_temperature_range_C:
    - 1350
    - 1550
    composition_vector_component_count: 7
    coexisting_immiscible_melt_temperature_C: 1550
    assumed_equilibrium_constants:
      ferric_iron: '3.81'
      Al2O3: '4.38'
    assumptions: Constants correspond to relatively undissociated oxides. Fe³⁺/Fe_total is assumed the same in both immiscible
      melts. Composition vector is defined by Table 2 liquids. Eastern liquidus is too complex for simple precipitation models;
      ferric iron likely enters non-ideally. Free-energy description ignores specific polymeric reactions.
    qualifications: A nearly flat Western curve supports stability against unmixing, but activity irregularities may indicate
      nearby Eastern miscibility gap. More oxidized Eastern melts predict a large region of liquid unmixing; reasonable agreement
      can be obtained by judicious choice of constants and assumed iron ratio.
  context_id: kems-212-schneider-1980-nbsir-80-2059::context::schneider_1980_model_p9
