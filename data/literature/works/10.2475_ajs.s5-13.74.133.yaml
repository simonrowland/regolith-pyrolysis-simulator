    - composition_as_published: 50SiO2, 50B2O3
      duration_hours: '6'
      temperature_C: '1400'
      result_as_published: Semi-opaque mass.
    - composition_as_published: 50SiO2, 50B2O3
      duration_hours: '48'
      temperature_C: not stated for this clause
      result_as_published: 'Two layers: an upper clear layer and a lower opaque one.'
    - composition_as_published: 30SiO2, 70B2O3
      duration_hours: not stated
      temperature_C: not stated
      result_as_published: Likewise gave two layers.
    - composition_as_published: 20SiO2, 80B2O3
      duration_hours: not stated
      temperature_C: not stated
      result_as_published: Likewise gave two layers.
    - composition_as_published: 5SiO2, 95B2O3
      duration_hours: not stated
      temperature_C: not stated
      result_as_published: Yielded a clear glass.
    upper_clear_layer_silica_as_published: '41.85'
    upper_clear_layer_silica_units: '%'
    upper_clear_layer_silica_composition_basis: not stated in the quoted sentence
