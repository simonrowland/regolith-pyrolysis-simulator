- observation_id: greig1927_feo_small_charge_immiscibility_limits_context
  type: phase_equilibrium_run_products
  locator:
    page: 2
    pdf_page_index: 1
    published_page: 134
    note: Prose describing small ferrous-oxalate/silica charges and approximate FeO-SiO2 immiscibility limits.
  units: FeO charge per cent as printed; temperature in °C
  values:
    method_class: measured_direct_qualitative
    run_temperature_C: '1700'
    run_temperature_as_published: 1700°
    charge_material_as_published: silica and ferrous oxalate
    quench_as_published: Charges were quickly removed from the furnace and plunged under water.
    runs:
    - FeO_charge_as_published: 40 per cent iron oxide as FeO
      silica_charge: not stated
      result_as_published: When melted, almost all one liquid with a little of a second highly siliceous liquid.
    - FeO_charge_as_published: 5 per cent FeO
      silica_charge: not stated
      result_as_published: Considerable amount of the less siliceous phase.
    - composition_as_published: Mixtures richer in silica than the 40 per cent FeO mixture; exact composition not given.
      result_as_published: Always more of the silica-rich phase.
    limits_as_published: Approximate limits of immiscibility for the oxidation state of iron in these melts; no definite oxidation
      state was determined.
    furnace_atmosphere_as_published: Equilibrium was not attained between the liquid and the furnace atmosphere.
  context_id: greig-1927-immiscibility-part2::context::greig1927_feo_small_charge_immiscibility_limits_context
  work_id: 10.2475/ajs.s5-13.74.133
  source_id: greig-1927-immiscibility-part2
  species: SiO2
