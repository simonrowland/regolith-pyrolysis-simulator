    C_charge_composition_in_prose_as_published:
      FeO_as_oxalate: '3.7'
      SiO2: '97'
    C_charge_run_conditions_as_published:
      temperature: about 1700°
      quench: Withdrawn from the furnace and plunged under water.
    prior_5FeO_charge_as_published:
      FeO_as_oxalate: '5'
      SiO2: '95'
      run_temperature: about 1700°
      run_outcome: A fair amount of the iron-rich phase was present after similar treatment.
    Table_VIII_C_charge_composition_as_published:
      FeO_as_oxalate: '3'
      SiO2: '97'
    composition_discrepancy_note: The prose gives 3.7FeO (as oxalate), 97SiO2 for the quenched C charge; Table VIII prints
      3FeO, 97SiO2. Both are retained as printed.
    temperature_effect_as_published: Increase in the amount of Fe2O3 appears to lower this temperature somewhat.
