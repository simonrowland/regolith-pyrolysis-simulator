- observation_id: roeder_1974_activity_definition_and_standard_state
  type: typed_context
  locator:
    page: 1
    published_page: 397
    pdf_page_index: 0
    equation: 1–2
  units: as printed
  values:
    method_class: method_only
    reaction_as_printed: Fe + 1/2 O2 ⇌ FeO (dissolved in liquid)
    activity_relation_as_printed: K = a_FeO^Liquid / (a_Fe^Metal f_O2^(1/2)) = X_FeO^Liquid γ_FeO^Liquid / f_O2^(1/2)
    activity_definition_as_printed: a_FeO^Liquid = activity of a hypothetical ferrous species in the liquid
    composition_definition_as_printed: X_FeO^Liquid = mole fraction of iron dissolved in the liquid calculated as ferrous
      oxide
    metal_activity_as_printed: All the experiments in the present study were conducted in equilibrium with metallic iron and
      assuming the iron to be pure the activity can be set equal to one.
    reference_state_mapping:
      state:
        tag: unknown
        reason: The exact source wording is retained, but it does not explicitly identify a closed reference-state convention;
          no convention is inferred.
      inferred: false
      note: The source says “the liquid oxide in equilibrium with metallic iron” and calls the dissolved ferrous species hypothetical.
    reference_state_locator:
      page: 9
      published_page: 405
      pdf_page_index: 8
    standard_state_as_printed: The standard state for “FeO” is the liquid oxide in equilibrium with metallic iron.
    thermodynamic_data_attribution_as_printed: Schuhmann and Ensio [2] and Coughlin [9]
  context_id: roeder-1974-iron-activity-olivine-basaltic-liquids::context::roeder_1974_activity_definition_and_standard_state
  work_id: 6530d7a793db41b88b4a8355d4f590c34cede6dc43fd8e95c8afb737b97a66bc
  source_id: roeder-1974-iron-activity-olivine-basaltic-liquids
  species: FeO
- observation_id: roeder_1974_activity_equation_and_gamma_fit
  type: typed_context
  locator:
    page: 9
    published_page: 405
    pdf_page_index: 8
    section: Results and discussion
  units: as printed
  values:
    method_class: method_only
    activity_equation_as_printed: log a_FeO = 12045/T + 0.5 log fO2 - 2.336
    activity_equation_temperature_note: The equation prints T without a unit; Table 1 labels its run temperatures in °C.
    activity_equation_note: The thermodynamic data are attributed to Schuhmann and Ensio [2] and Coughlin [9].
    gamma_fit_as_printed: γFeO = (0.048)(wt.% Al2O3) + (0.084)(wt.% Na2O) + (0.12)(wt.% K2O) + 0.29; PMCC = 0.94
    gamma_fit_number: '3'
  context_id: roeder-1974-iron-activity-olivine-basaltic-liquids::context::roeder_1974_activity_equation_and_gamma_fit
  work_id: 6530d7a793db41b88b4a8355d4f590c34cede6dc43fd8e95c8afb737b97a66bc
