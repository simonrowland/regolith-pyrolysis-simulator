- observation_id: shornikov_2025_numeric_background
  type: laboratory_conditions
  locator:
    published_page: 228
    pdf_page_index: 14
    section: Introduction and Results and Discussion
  units: as printed
  values:
    quantity: located_numeric_background
    statements:
    - quote: Thus, studies of equilibria in the gas phase over CaO by the Knudsen effusion mass spectrometric method [5–8]
        in the temperature range of 1900–2400 K faced the need to take into account the formation and fragmentation of gaseous
        products of the redox interaction of calcium oxide with the material of a metal cell.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The reasons listed above determined the purpose of this study—to accurately determine the partial pressures of
        vapor species of the gas phase over calcium oxide in the temperature range of 1800–2200 K and, based on the experimental
        information to find out the effect of redox conditions on the CaO evaporation in order to correctly compare the results
        of experiments performed under different conditions.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The same point of view is held by Gourishankar et al. [15], who studied the nonequilibrium evaporation of a calcium
        oxide crystal (according to Langmuire) in the temperature range 1919–2072 K.
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: measurements of the heat capacity Cp(CaO), begun by Lavoisier and de LaPlace [32] in 1780 and continued until
        recently in the temperature range 2–3128 K [33].
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: Thus, the Cp(CaO) obtained by Wartenberg and Witzel [34] at 2825 K is in the range from 50 to 62 J/(mol × K)
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: As follows from Fig. 5, the Δf G° found values differ from those theoretically calculated in [4] by 10–30 kJ/mol.
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: which performed by Jacob and Varghese [43] in the temperature range of 940–1260 K using solid-state electrochemical
        cells based on monocrystalline CaF2 and SrF2
      locator:
        published_page: 229
        pdf_page_index: 15
        section: Results and Discussion
    - quote: Δf H°298 (CaO) = −635.09 ± 0.89 kJ/mol
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: Δf S°298 (CaO) = 38.21 ± 0.13 J/(mol × K)
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
