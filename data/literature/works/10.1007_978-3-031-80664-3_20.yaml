- observation_id: shornikov_2025_qualifying_and_comparative_statements
  type: experiment_series
  locator:
    published_page: 217
    pdf_page_index: 3
    section: Abstract, Introduction, Results and Discussion, Conclusions
  units: as printed
  values:
    quantity: verbatim_qualifiers_and_directional_comparisons
    statements:
    - quote: The partial pressures of vapor species over CaO were determined with an error not exceeding 10%, which is confirmed
        by calculations of the gas phase equilibrium with the atomic oxygen participation.
      locator:
        published_page: 217
        pdf_page_index: 3
        section: Abstract
    - quote: The obtained information correlates with the results of previously performed studies, to a large extent refining
        them, and also agrees with the theoretical values.
      locator:
        published_page: 217
        pdf_page_index: 3
        section: Abstract
    - quote: These molecules fragmented at an energy of ionizing electrons exceeding 13–15 eV, and formed CaO+ ions, therefore,
        measurements of ion currents were carried out at rather low energies of ionizing electrons (about 10 eV), which may
        explain the significant error in measuring the ion current intensities (Fig. 1).
      locator:
        published_page: 218
        pdf_page_index: 4
        section: Introduction
    - quote: The data obtained by Farber and Srivastava [6] during the evaporation of calcium oxide from an alund cell have
        systematic deviations (Fig. 2), increasing with temperature rising (Fig. 1).
      locator:
        published_page: 218
        pdf_page_index: 4
        section: Introduction
    - quote: A possible reason could be the interaction of the material of the effusion cell and CaO in a condensed state,
        which was noted by the authors themselves.
      locator:
        published_page: 218
        pdf_page_index: 4
        section: Introduction
    - quote: However, in similar experiments conducted by Samoilova and Kazenas [7] at the same temperatures, no such deviations
        were found.
      locator:
        published_page: 218
        pdf_page_index: 4
        section: Introduction
    - quote: The obtained values corresponded to those previously determined by Drowart et al. [5] (Figs. 1 and 2).
      locator:
        published_page: 219
        pdf_page_index: 5
        section: Introduction
    - quote: However, the presence of reducing conditions caused by the interaction of the graphite crucible with oxygen formed
        during the dissociation of gaseous calcium oxide according to the reaction (2) had a greater effect. This led to an
        increase in the total vapor pressure over CaO by about 10 times (Fig. 3b).
      locator:
        published_page: 220
        pdf_page_index: 6
        section: Introduction
    - quote: Assuming that the evaporation coefficient (αCaO) is 1, they found that the evaporation rate of calcium oxide
        from a nickel substrate is approximately 10 times higher than from a platinum substrate, which was also due to the
        presence of reducing conditions.
      locator:
        published_page: 220
        pdf_page_index: 6
        section: Introduction
    - quote: The calculated ptot obtained by the evaporation in a vacuum of calcium oxide on platinum [12] and rhenium [13]
        substrate (according to Langmuire) was close to theoretical values [4].
      locator:
        published_page: 220
        pdf_page_index: 6
        section: Introduction
    - quote: This allowed the authors to conclude that the evaporation coefficient of calcium oxide is close to 1, which to
        some extent corresponds to the review [14].
      locator:
        published_page: 220
        pdf_page_index: 6
        section: Introduction
    - quote: The total vapor pressure over the CaO was calculated using the weight loss of sample at evaporation and was almost
        identical to the calculation based on thermochemical data [4].
      locator:
        published_page: 220
        pdf_page_index: 6
        section: Introduction
    - quote: As follows from Figs. 1 and 2, the accuracy of determining the partial pressures of vapor species over CaO is
        low, the differences in them may exceed an order of magnitude.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The effect of redox conditions on the evaporation of calcium oxide has not been considered, that, in turn, does
        not allow for a correct comparison of the available experimental data.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The total pressure over CaO obtained by various methods on a wide temperature range are difficult to compare.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: It should also be noted that the accuracy of the obtained values is low, the non-systematic error of which can
        exceed 70% (Fig. 3).
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The measurements of the total vapor pressure performed in [12, 15] seem to be quite accurate.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The partial pressures of the vapor species of the gas phase over CaO calculated by the ratios (11) and (18) with
        an error not exceeding 10% are shown in Table 1.
      locator:
        published_page: 223
        pdf_page_index: 9
        section: Results and Discussion
    - quote: 'As follows from Table 2, the partial pressures of atomic oxygen, determined by the ratio (11), satisfactorily
        corresponded to those calculated from thermochemical data [4] on the Kr(T) equilibrium constants of possible reactions
        (2), (3), (15)–(17) in the gas the phase over CaO according to the ratios:'
      locator:
        published_page: 223
        pdf_page_index: 9
        section: Results and Discussion
    - quote: The observed increase in the total vapor pressure over CaO (Fig. 3) is due to an increase in the partial pressure
        of atomic calcium (Fig. 1a), formed due to the dissociation of gaseous calcium oxide by reaction (2).
      locator:
        published_page: 224
        pdf_page_index: 10
        section: Results and Discussion
    - quote: In turn, the partial pressures of atomic (Fig. 2c) and molecular (Fig. 2d) oxygen, on the contrary, decrease
        due to the reducing interaction with the material of the effusion cell.
      locator:
        published_page: 224
        pdf_page_index: 10
        section: Results and Discussion
    - quote: This interrelation is confirmed by calculations using the ratios (19)–(23), which show the agreement of the partial
        pressure of atomic oxygen over calcium oxide calculated from various equilibria in the gas phase (15)–(17) with the
        formation of gaseous molybdenum oxides (Table 2).
      locator:
        published_page: 224
        pdf_page_index: 10
        section: Results and Discussion
    - quote: Note that the partial pressure of Ca, O and O2 (Fig. 1a, b, d) obtained in the present study correspond satisfactorily
        to those determined by Drowart et al. [5] and Banon et al. [8] under close reducing conditions (during evaporation
        of CaO from a molybdenum effusion cell).
      locator:
        published_page: 225
        pdf_page_index: 11
        section: Results and Discussion
    - quote: As for the temperature dependence of the partial pressure of gaseous calcium oxide (Fig. 2b), in this case the
        reduction conditions have no effect on the reaction (1).
      locator:
        published_page: 225
        pdf_page_index: 11
        section: Results and Discussion
    - quote: The results found in the present study correlate with the data obtained by the mass spectrometric method [5,
        7, 8].
      locator:
        published_page: 225
        pdf_page_index: 11
        section: Results and Discussion
    - quote: The results obtained by Farber and Srivastava [6] systematically differ from them, except for the magnitude of
        the slope.
      locator:
        published_page: 225
        pdf_page_index: 11
        section: Results and Discussion
    - quote: The calculations performed in this work of the enthalpies and entropies of reactions (1)–(3) by the ratio (24)
        confirmed the theoretical data [4] and correlated with the experimental results obtained in [5, 7] (Table 3).
      locator:
        published_page: 225
        pdf_page_index: 11
        section: Results and Discussion
    - quote: The value of the enthalpy of reaction (1) determined by Pelchowitch [22] differed by about 60 kJ/mol from all
        other results, non-systematic errors of Babeliowsky et al. [23] were approximately the same amount.
      locator:
        published_page: 225
        pdf_page_index: 11
        section: Results and Discussion
    - quote: It can be seen (Fig. 4), that the composition (and, accordingly, the partial pressures of vapor species) of the
        gas phase over calcium oxide largely depend on the content (and, accordingly, the partial pressure) of oxygen, while
        revealing the individual characteristics of the used effusion cells made of materials similar in properties.
      locator:
        published_page: 226
        pdf_page_index: 12
        section: Results and Discussion
    - quote: So, probably molybdenum effusion cells used by Banon et al. [8] and in the present study differed somewhat in
        composition or had different degrees of surface treatment purity, as, perhaps, the alund effusion cells used by Farber
        and Srivastava [6] and Samoilova and Kazenas [7].
      locator:
        published_page: 226
        pdf_page_index: 12
        section: Results and Discussion
    - quote: The authors envisaged a diffusive flow of atomic oxygen through the walls of a molybdenum effusion cell to the
        outside, that according to their calculation, could lead to a decrease in the oxygen content (compared with the absence
        of such a flow) located inside it (approximately 2 times).
      locator:
        published_page: 226
        pdf_page_index: 12
        section: Results and Discussion
    - quote: Based on the formal combination of reactions (1) and (2), which can be written as a heterogeneous reaction (25),
        Banon et al. [8] also drew conclusions on the significant effect of reducing conditions on the congruence of calcium
        oxide evaporation, which does not correspond to experimental facts.
      locator:
        published_page: 227
        pdf_page_index: 13
        section: Results and Discussion
    - quote: Indeed, atomic calcium and oxygen are the predominant vapor species of the gas phase over CaO (Fig. 1) in the
        temperature range of 1800–2400 K, however based on the determined slopes of temperature dependences, as well as well-known
        theoretical propositions formulated by Kulikov [24], it can be understood that these species of the gas phase are
        not formed independently, but due to the dissociation of gaseous calcium oxide.
      locator:
        published_page: 227
        pdf_page_index: 13
        section: Results and Discussion
    - quote: With increasing temperature, the dissociation of gaseous CaO decreases, thereby causing a decrease in the content
        of other forms of the gas phase (Ca, O and O2), but without affecting in any way the congruence of evaporation of
        calcium oxide, which can be confirmed as follows.
      locator:
        published_page: 227
        pdf_page_index: 13
        section: Results and Discussion
    - quote: Note that the second derivative of the relation (27) is always positive, that indicates the presence of a minimum
        of the total vapor pressure over the calcium oxide and means its congruent evaporation [26].
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: Note that measurements performed above the temperature of 1800 K are few [34–38], the differences in Cp(CaO)
        exceed 10 J/(mol × K).
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: Thus, the Cp(CaO) obtained by Wartenberg and Witzel [34] at 2825 K is in the range from 50 to 62 J/(mol × K),
        which can lead to significant errors in the determination of the Gibbs energies of formation of calcium oxide.
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: The experimental results of determination of the Gibbs energies of calcium oxide formation based on studies of
        heterogeneous reactions with graphite (31), (32) and similar heterogeneous reactions involving sulfur, phosphorus
        and oxygen [41, 42], led researchers to conclude that the thermodynamic stability of calcium oxide is lower.
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: As follows from Fig. 5, the ΔfG° found values differ from those theoretically calculated in [4] by 10–30 kJ/mol.
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: The found discrepancies are probably due to the procedure for calculating the Gibbs energies of calcium oxide
        formation, performed on the basis of inconsistent thermodynamic data, or, as in the case of Gourishankar et al. [15],
        the approximate calculation of the partial pressures of vapor species from the total vapor pressure over calcium oxide.
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: The authors [15] neglected the insignificant amount of gaseous CaO and calculated the composition of the gas
        phase, taking into account the molecular weight of vapor species of the gas phase (Mi), according to the following
        ratio (33).
      locator:
        published_page: 228
        pdf_page_index: 14
        section: Results and Discussion
    - quote: Probably, the incorrectness of this approach led the authors to the enthalpy of formation of crystalline calcium
        oxide, which differs from the recommended in [4] by approximately 33 kJ/mol.
      locator:
        published_page: 229
        pdf_page_index: 15
        section: Results and Discussion
    - quote: 'At the same time, the results of thermodynamic studies of reactions: [CaO] + MgF2 = MgO + [CaF2] and [SrO] +
        [CaF2] = [CaO] + [SrF2], which performed by Jacob and Varghese [43] in the temperature range of 940–1260 K using solid-state
        electrochemical cells based on monocrystalline CaF2 and SrF2 also do not confirm the higher Gibbs energy of calcium
        oxide formation and are consistent with theoretical data [4] within 4 kJ/mol.'
      locator:
        published_page: 229
        pdf_page_index: 15
        section: Results and Discussion
    - quote: As can be seen from Fig. 5, the calculated values of ΔfG°T(CaO) by the ratio (37), as well as Δr36HT and Δr36ST
        (Table 3) are quite close to the theoretical values calculated by Glushko et al. [4].
      locator:
        published_page: 229
        pdf_page_index: 15
        section: Results and Discussion
    - quote: The mass spectrometric study of the evaporation of calcium oxide from a molybdenum effusion cell in the temperature
        range 1812–2183 K allowed to determine the partial pressures of the main vapor species of the gas phase over calcium
        oxide (Ca, CaO, O, and O2) with an error not exceeding 10%, which is confirmed by calculations of equilibria in the
        gas phase involving atomic oxygen.
      locator:
        published_page: 230
        pdf_page_index: 16
        section: Conclusions
    - quote: The obtained experimental data correlates with the results of previously performed studies, largely clarifying
        them, and also agree with theoretical values.
      locator:
        published_page: 230
        pdf_page_index: 16
        section: Conclusions
    - quote: Calcium molybdates and tungstates were also found in the condensed phase due to the interaction of calcium oxide
        with the material of the effusion cell (Mo, W).
      locator:
        published_page: 218
        pdf_page_index: 4
        section: Introduction
    - quote: The absence of contact of the thermocouple with the test substance and the possible condensation of evaporating
        CaO on the crucible suspension could probably affect the accuracy of the experiment.
      locator:
        published_page: 220
        pdf_page_index: 6
        section: Introduction
    - quote: Note that the use of non-metallic container material (alund) may or may not lead to interaction with CaO.
      locator:
        published_page: 221
        pdf_page_index: 7
        section: Introduction
    - quote: The MoOi+ ions (i = 0–3) were also observed in the mass spectra of vapor over CaO, the number of which was small
        at 2183 ± 5 K.
      locator:
        published_page: 223
        pdf_page_index: 9
        section: Results and Discussion
    - quote: 'Their origin was caused by the molybdenum cell’s own evaporation at high temperature: [Mo] = (Mo), and the interaction
        of oxygen formed during the dissociation of gaseous CaO according to reaction (2) with the cell material, which, in
        turn, led to the formation of gaseous molybdenum oxides by reactions in the gas phase:'
      locator:
        published_page: 223
        pdf_page_index: 9
        section: Results and Discussion
