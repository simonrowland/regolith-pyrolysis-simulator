- observation_id: wood_wade_2013_metal_silicate_method_and_constants
  type: typed_context
  experiment: wood_wade_2013_bw1102
  locator:
    page: 8
    published_page: 918
    pdf_page_index: 7
    note: 'Proof string: ‘Thermodynamic data for metal–silicate exchange reactions were taken from Barin et al. (1989).’'
  units: as printed
  values:
    method_class: method_only
    method_as_printed: The paper derives the melt activity coefficients from high-pressure Fe-rich metal and silicate partitioning
      data, using the exchange reactions and log K values printed on this page.
    gamma_FeO_activity_calculation_as_printed: The activity coefficient of FeO in this experiment at 1,650 °C is calculated
      to be 0.92 from Eq. (4).
    gamma_FeO_activity_calculation_locator:
      page: 8
      published_page: 918
      pdf_page_index: 7
      note: 'Proof string: ‘calculated to be 0.92 from Eq. (4)’; Table 1 stores the resulting gamma_FeO value.'
    gamma_FeO_model_fit_provenance:
      melt_system_as_printed: anhydrous silicate melts at 1 atm pressure
      literature_data_count_as_printed: 83 data from the literature
      fit_description_as_printed: The best-fit equation, excluding terms which are not significant
      fitted_composition_range_as_printed: 39 to 64 % SiO2, 0.3 to 30 % FeO and 0 to14.8 % Na2O
      literature_sources_as_printed: Borisov et al. (2006); Borisov (2007); Holzheid et al. (1997); O’Neill and Eggins (2002)
      locator:
        page: 4
        published_page: 914
        pdf_page_index: 3
        note: 'Proof string: ‘83 data from the literature’.'
    exchange_reactions_and_logK_as_printed:
      PbO: PbO + Fe = Pb + FeO; log K_Pb = 0.61 + 4144/T
      CuO0.5: CuO0.5 + 0.5Fe = Cu + 0.5FeO; log K_Cu = -0.26 + 3490/T
      InO1.5: InO1.5 + 1.5Fe = In + 1.5FeO; log K_In = 2.58 - 764/T
    inO1.5_logK_melting_entropy_assumption:
      purpose_as_printed: to derive the free energy and log K of the indium exchange reaction
      assumption_as_printed: assume an entropy of melting of InO1.5 at the melting point of 2,183 K
      value_as_printed: 26.25 J.K-1
      analogues_as_printed: GaO1.5 (26.3) and VO1.5 (25.05)
      locator:
        page: 8
        published_page: 918
        pdf_page_index: 7
        note: 'Proof string: ‘26.25 J.K-1’.'
    thermodynamic_data_reference_as_printed: Barin et al. (1989)
    standard_state_as_printed: with all components having standard state of pure liquid at 1 bar and the temperature of interest
    pressure_effect_as_printed: The paper says pressure effects on the Pb–Fe, Cu–Fe and In–Fe exchange reactions are small
      enough to be neglected.
    oxygen_fugacity_as_printed: No fO2 control or value is printed for BW1102.
    method_locator:
      page: 8
      published_page: 918
      pdf_page_index: 7
      note: 'Proof string: ‘experimental temperature of 1,650 °C’ and the exchange equations and thermodynamic standard-state
        sentence on this page.'
    pb_metal_activity_input_as_printed:
      value: '1100'
      basis: Author-selected value at 1,923 K for infinite dilution, from the reported saturation range 1,030 to 1,400 at
        1,873 K.
      attribution: Malhotra et al. (1998)
    cu_metal_activity_input_as_printed:
      value_at_1823_K: '11.0'
      extrapolated_value_at_1923_K: '9.7'
      method_as_printed: Extrapolated by assuming RTln gamma is constant.
      attribution: Huh and Min (2000); the 9.7 value is also compared with Turchanin and Agraval (2001).
    in_metal_activity_input_as_printed:
      value_at_1923_K: '25.8'
      method_as_printed: The authors assume highly dilute liquid Fe-In alloys behave as regular solutions, adopt W_In = 52
        kJ mol-1, and calculate the infinite-dilution activity coefficient.
      attribution: Okamoto (1990) is cited for the 3.4 atomic % maximum solubility and modelled consolute temperature.
