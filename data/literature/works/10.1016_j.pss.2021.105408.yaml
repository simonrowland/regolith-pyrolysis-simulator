- observation_id: meurisse_2022_reaction_equations
  type: literature_context
  locator:
    page: 11
    pdf_page_index: 10
    section: Results & discussions / CaCl2 electrolyte
  units: reaction equations
  values:
    quantity: printed_reduction_and_parasitic_cycle_reactions
    method_class: literature_context
    equations:
      (1): MₓOᵧ + 2y e⁻ = xM + y O²⁻
      (2): CaO = Ca²⁺ + O²⁻
      (3): Ca²⁺ + 2e⁻ = Ca
      (4): MₓOᵧ + yCa = xM + yCaO
      (5): 2O²⁻ = O₂ + 4e⁻
      (6): C + 2O²⁻ = CO₂ + 4e⁻
      (7): C + O²⁻ = CO + 2e⁻
      (8): 2O²⁻ + C = CO₂ + 4e⁻
      (9): CO₂ + O²⁻ = CO₃²⁻
      (10): CO₃²⁻ + 4e⁻ = C + 3O²⁻
      (11): Ca²⁺ + 2e⁻ = Ca
      (12): Ca = Ca²⁺ + 2e⁻
      (13): Li₂O = 2Li⁺ + O²⁻
      (14): Li⁺ + e⁻ = Li
      (15): MₓOᵧ + 2yLi = xM + yLi₂O
    locators:
      reactions_1_to_4: PDF p. 11
      reactions_5_to_7: PDF p. 12
      reactions_8_to_10: PDF p. 14
      reactions_11_to_12: PDF p. 14
      reaction_1_reference: PDF p. 19
      reactions_13_to_15: PDF p. 20
    note: Reaction (1) is stated on PDF p. 11 and referenced in the LiCl discussion on PDF p. 19; reactions (13)-(15) are
      printed on PDF p. 20.
