context:
- observation_id: allen_1994_abstract_result_summary
  type: result_qualification
  locator:
    page: 23
    pdf_page_index: 0
    section: Abstract
  phase: lunar mare soil and pyroclastic glasses
  units: as printed
  values:
    quantity: abstract_result_summary
    method_class: figure_only
    verbatim_statements:
    - Mare soil and orange and black pyroclastic glass were reduced in hydrogen gas at temperatures of 900-1100°C.
    - The experiments support studies of regolith maturation, lunar volcanism, and the production of oxygen on the Moon.
    - The most reactive component in the high-Ti soil was FeO in ilmenite, which was completely reduced to iron metal at all
      temperatures.
    - Vitreous orange glass crystallized and was partially reduced to iron metal, pyroxene, and minor olivine.
    - Initially devitrified black glass was similarly reduced and converted to iron metal, pyroxene, and minor olivine.
    - The degree of reaction in both glasses increased with temperature.
  context_id: allen-1994-reduction-lunar-mare-soil::context::allen_1994_abstract_result_summary
  work_id: eb4479ae6b572426c71c88fa3196527999c5350a05960284cc14b950fd25102e
  source_id: allen-1994-reduction-lunar-mare-soil
  species: FeO
