- observation_id: allen_1994_pyroclastic_glass_qualifying_statements
  type: result_qualification
  locator:
    page: 24
    pdf_page_index: 1
    section: Results - Pyroclastic Glass
  phase: Apollo 17 pyroclastic glass 74220
  units: as printed
  values:
    quantity: results_qualifiers_and_directions
    method_class: figure_only
    verbatim_statements:
    - The XRD and FeMS spectra of all reduced glass samples were dominated by the peaks of iron metal (Fig. 3).
    - The metal occurred as micrometer-scale blebs scattered throughout each glass particle (Fig. 4).
    - A significant portion of the remaining Fe2+ formed gamma iron.
    - Orange glass underwent devitrification in all of the experiments.
    - Pyroxene crystals grew steadily with temperature, from less that 1 µm across in the 900°C sample to well over 10 µm
      at 1100°C.
    - At this temperature the orange glass was totally devitrified to pyroxene and iron metal, plus minor olivine and titanium
      oxide (Fig. 4).
    - Black glass spheres also underwent striking changes.
    - At higher temperatures ever greater amounts of FeO in the glass and crystals were reduced to metal.
    - Ilmenite was reduced to iron plus titanium oxide and olivine to iron plus pyroxene.
    - In the 1100°C sample, spheres which were initially crystalline were almost indistinguishable from those which were initially
      vitreous.
    - Reduction and devitrification experiments on orange and black glass provide constraints on conditions during lunar pyroclastic
      eruptions.
    - They also support the contention that pyroclastic glass would be an ideal feedstock for lunar oxygen production (4).
  context_id: allen-1994-reduction-lunar-mare-soil::context::allen_1994_pyroclastic_glass_qualifying_statements
