  type: characterization
  locator:
    page: 62
    published_page: 56
    pdf_page_index: 61
    section: 3.5 In situ observation of the high-low transformation in cristobalite
  units: degC as printed
  values:
    quantity: HT-XRD heating transition interval
    method_class: measured_direct
    method: in situ high-temperature X-ray powder diffraction (HT-XRD)
    transition_as_printed: cristobalite high-low transformation
    scan_direction: heating
    transition_interval_as_printed: between 200 and 300 C
    note: Patterns unchanged below 200 C, changed considerably between 200 and 300 C, and showed no further change above 300
      C; interval retained without a midpoint. Section 3.6 separately summarizes the transition as around 265 C, while section
      3.5 reports DTA peaks at 246 C on heating and 242 C on cooling; these source statements are preserved as distinct results.
    conditions_as_printed: successive heating at 100, 200, 300, 500, 650 and 800 C; 15 C/min between holding points; air atmosphere;
      cristobalite powder synthesized by heating silica glass at 1400 C for 20 hours.
    conditions_locator:
      page: 40
      published_page: 34
      pdf_page_index: 39
      section: 3.2 Experimental
  context_id: mamiya-2000-sio-disproportionation::context::mamiya_2000_cristobalite_htxrd_transition_bracket
