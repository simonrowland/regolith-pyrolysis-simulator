- observation_id: mamiya_2000_fig3_3_disproportionation_progress_1350c
  type: experiment_series
  locator:
    page: 44
    published_page: 38
    pdf_page_index: 43
    section: 3.3 Analytical results on reaction process of the disproportionation reaction
    figure: 3-4
    note: Printed narrative accompanying the time-dependent XRD patterns; qualitative outcomes retained as printed.
  units: reaction time in hour; XRD/IR phase observations as described
  values:
    quantity: Si and cristobalite appearance and reaction-progress observations at 1350 C, as printed
    method_class: figure_only
    method: source narrative accompanying Fig. 3-4 and Fig. 3-7
    T_C: 1350
    observations_as_printed:
    - Si XRD peaks appeared clearly after 0.1 hour and almost all changes in Si patterns were finished in this short time.
    - No further change in Si XRD patterns was observed above 2 hours.
    - Crystallization of amorphous SiO2 to cristobalite was detected when the sample was kept over 1 hour.
    - IR patterns were unchanged for specimens annealed more than 4 hours; the author interprets this as the disproportionation
      reaction ending at this temperature.
