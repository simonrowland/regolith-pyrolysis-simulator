- observation_id: aithala_2026_vf_apparatus_and_protocol
  type: apparatus
  locator:
    page: 7
    published_page: SI-1
    source_path: raw/aithala-2026-magmatic-iron-redox-to-2100c/aithala-2026-magmatic-iron-redox-to-2100c-si.pdf
    source_sha256: ab859d250ab0d4f0b1def8c7b894f22604bb132d644d112769c8e1c27ef750fa
    section: Methods
  units: as printed
  values:
    quantity: experimental apparatus and protocol
    method_class: method_only
    notes: 'Vertical Furnace series: six experiments used a Deltech VT-28 HN-C gas-mixing furnace in air at 1250, 1300, 1365,
      1400, 1450, and 1500 °C for 72, 24, 6, 6, 2, and 1 h respectively. Experimental charges consisted of approximately 30-35
      mg of Humphrey powder bonded to Pt wire using hydrated polyvinyl alcohol (PVA). Pt wire diameter and Fe presaturation:
      not stated. Fe loss from the silicate to Pt was minimal under these oxidizing conditions. Textures were characterized
      and chemical homogeneity validated by wavelength-dispersive spectroscopy using a JEOL JXA-8530F+ electron-probe microanalyzer.
      Total Fe and alkali bulk values, and Pt pickup analysis: not stated in Methods.'
