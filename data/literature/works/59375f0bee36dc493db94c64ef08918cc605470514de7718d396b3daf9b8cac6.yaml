- observation_id: markova_1984_dissipation_1500C_recent_moon_model
  type: model_output_context
  class_tag: model
  locator:
    published_page: 509
    pdf_page_index: 1
    paragraph: Only for Na the level of dissipation reaches ~2%, for the others it is significantly less than ~1%
  quote: The calculation shows that losses of petrogenic elements at temperature ~1500 C from the recent Moon is improbable.
    Only for Na the level of dissipation reaches ~2%, for the others it is significantly less than ~1%.
  T_range_K:
  - '1773.15'
  - '1773.15'
  phase: model_dissipation_from_basalt_vaporization_experiment
  standard_state: calculated dissipation from experimental vapor forms and masses, recent Moon
  regime: kems_effusion
  units: percent of petrogenic element as printed
  values:
    quantity_as_printed: thermal_dissipation_fraction
    schema_gap: Model-calculated lunar escape dissipation has no scored quantity token.
    method_class: model_derived
    admission_status: model_output_not_measurement
    T_C: '1500'
    body: recent_Moon
    Na_pct_about: '2'
    other_elements_pct_less_than_about: '1'
    as_printed: Only for Na the level of dissipation reaches ~2%, for the others it is significantly less than ~1%.
    derivation_note: Calculated from experimental forms of components in vapor (and their masses) during vaporization of silicate
      melts /2/, under ideal conditions. Not a directly tabulated ion-current series.
  uncertainty:
    note: Authors print ~2% and ~1%; no numeric uncertainty.
  context_id: kems-026-markova-1984::context::markova_1984_dissipation_1500C_recent_moon_model
  work_id: 59375f0bee36dc493db94c64ef08918cc605470514de7718d396b3daf9b8cac6
