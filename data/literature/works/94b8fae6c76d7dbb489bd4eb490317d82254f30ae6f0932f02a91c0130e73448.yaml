- observation_id: wang_1993_abstract_qualifications_and_directional_claims
  type: experiment_series
  experiment: wang_1993_chondritic_material_vacuum_furnace
  locator:
    published_page: 454
    pdf_page_index: 0
    paragraph: Abstract
    note: The authors say samples were evaporated in a vacuum furnace [4].
  units: as reported
  values:
    quantity: verbatim_abstract_claims_and_data_qualifications
    provenance: Introduction explicitly attributes modeling to references [2,3]; the remaining statements report the authors'
      experiment and residue analysis.
    introduction_claims:
    - Evaporation experiments suggest that enrichments in the heavy isotopes of O, Mg, and Si in some CAIs are caused by kinetic
      effects during evaporation [1].
    - Volatility-fractionated REE patterns found in some CAIs have been modeled with some success using equilibrium thermodynamics
      [2,3], but little is known about kinetic effects on REE patterns.
    - We have begun an investigation of REE fractionation under conditions where large isotope effects are produced by the
      kinetic isotope effect.
    results_and_qualifications:
    - The mass fraction evaporated ranged from 7.6–95.4%.
    - Most residues consist of olivine and glass.
    - Chemical compositions of the residues were determined by electron and ion microprobe.
    - Results for selected elements are shown in Fig. 1.
    - There is no significant evaporation of Ca, Al, and Ti up to 95% mass loss; the evaporation behavior of Mg, Si, and Fe
      is similar to that found by Hashimoto [5].
    - There is no significant evaporation of most of the REE up to 95% mass loss.
    - Cerium is much more volatile than the other REE under these conditions.
    - A tenfold negative Ce anomaly developed between 60% and 70% mass loss and the anomaly reached 5 × 10^-4 at 95% mass
      loss.
    uncertainty: No numeric analytical or experimental uncertainty is stated in the supplied abstract.
    figure_status: Wang Figure 1 is referenced but is not present in the supplied one-page PDF; it is not digitized. The visible
      Figure 1 at the top left of page 454 belongs to the preceding abstract, as its surrounding text and caption show.
  context_id: wang-1993-rare-earth-evaporation::context::wang_1993_abstract_qualifications_and_directional_claims
  work_id: 94b8fae6c76d7dbb489bd4eb490317d82254f30ae6f0932f02a91c0130e73448
  source_id: wang-1993-rare-earth-evaporation
  species: Ce
