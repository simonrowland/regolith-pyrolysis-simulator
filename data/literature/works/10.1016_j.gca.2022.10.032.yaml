    caption_as_printed: "Fig. 4. Gas phase speciation of the chalcogen elements at 1200 °C, 1 bar, in a CO-CO2 atmosphere,\
      \ as a function of logfO2. The vertical stippled lines indicate the oxygen fugacities of the Te evaporation experiments\
      \ in air, and relative to the FMQ buffer. (a) Te; TeO2 is the predominant gas species at very high oxygen fugacities,\
      \ whereas Te2 is the most abundant gas species at lower fO2. (b) Se; the transition from oxidized gas species (SeO2)\
      \ to reduced species (Se2) occurs at slightly lower logfO2, compared to Te. (c) S; The speciation change of S occurs\
      \ at much lower logfO2 (\x03FMQ\x012) compared to Te and Se. The complete speciation results at 1050, 1200, and 1300\
      \ °C are provided in Supplement 2."
