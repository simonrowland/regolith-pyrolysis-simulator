- observation_id: bonnickson_1954_ca2fe2o5_melting_interval
  type: source_context
  locator:
    page: 2
    published_page: 1481
    table: I
  units: cal/mol; cal/(deg mol); K, as applicable to printed statement
  values:
    statement_as_printed: The compound Ca2Fe2O5 also melts incongruently according to the phase diagram. In the present work
      there was no evidence of melting below 1704°K., and melting was complete at 1752°K. In treating the data, the melting
      point is taken as 1750°K. The heat of fusion is 36,110 cal./mole, and the entropy of fusion is 20.63 cal./deg.-mole.
  context_id: bonnickson-1954-calcium-magnesium-ferrite-heat-contents::context::bonnickson_1954_ca2fe2o5_melting_interval
  work_id: 10.1021/ja01635a006
