- observation_id: shornikov_2002_thermodynamic_qualifications
  type: method
  locator:
    page: 1
    published_page: 1
    pdf_page_index: 0
    section: Results
  units: located statements
  values:
    quantity: data_qualification_and_comparison_statements
    method_class: quoted_unattributed
    statements:
    - The identification of the gas phase composition over the MgAl2O4 samples shows that the predominant evaporation processes
      are heterogeneous reactions similar to those of individual oxides.
    - Due to the difference in the reaction (1) and (2) rates, the composition of the condensed phase during the evaporation
      changed up to the compositions at the boundary of the concentration range of MgAl2O4 solid solutions.
    - On the other hand, the evaporation of the boundary compositions took place at a constant concentration.
    - Hence, different temperature regimes in the experiments made it possible to establish the concentration boundaries of
      the region of spinel solid solutions in the MgAl2O4-Al2O3 system.
    - Comparing the phase diagrams obtained by Berezhnoi [1] and computed by Hallstedt [3] with our experimental data (see
      Fig. 1) shows the closeness of our data with the same of Berezhnoi.
    - The accurate determination of the thermodynamic properties of stoichiometric spinel at more high temperatures was hampered
      due to the above-mentioned variations of the condensed phase composition.
    - One can see that our data on the MgAl2O4 thermodynamic properties agree with the values determined by Hallstedt [3]
      and Jacob et al. [4] and recommended by Chase Tables [5], and shows the insignificant deviations from the ideality.
    - On the contrary, Kalyanram and Bell [6] and Rein and Chipman [7] consider the system as being ideal.
    - These discrepancies may be due to the crude approximation procedure of the Schuhmann method used in [6, 7].
    - The values of ΔfGT(MgAl2O4) obtained by Grjotheim et al. [8] using the data on heterogeneous equilibrium ... are not
      usually recommended due to the significant errors, which are the result of the usage of the additional thermodynamic
      information.
