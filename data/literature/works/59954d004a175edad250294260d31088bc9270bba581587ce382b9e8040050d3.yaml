    section: Results and Discussion
  units: as reported
  values:
    quantity: component_and_compound_activity_method
    method_class: model_derived
    attribution: The abstract states that calculations use thermodynamic data from Shornikov (2007), cited as reference [3].
    qualifications:
    - To understand the stability of these compounds in CAIs residual melts, the activities (ai) of calcium, aluminum and
      silicon oxides were determined (Fig. 1C, D), using which the activities of Ca2Al2SiO7, CaAl2Si2O8 and Ca3Al2Si3O12 in
      the melts were calculated.
    - The thermodynamic data necessary for calculations were taken from the results of the studies [3].
    - The calculated temperature dependence of the gehlenite activity in the melts is close in magnitude to that of SiO2 activity
      (Fig. 1C, D).
    plotted_component_activities:
    - CaO
    - Al2O3
    - SiO2
