- observation_id: shornikov_2024_source_claims_and_numeric_context
  type: thermodynamic_example
  locator:
    page: 2
    published_page: 6197
    pdf_page_index: 1
    section: Introduction, Results and Discussion, and Conclusions
  units: as reported
  values:
    quantity: source_claims_and_numeric_context
    method_class: quoted_unattributed
    printed_numeric_context:
      silicon_component_residue_persists_up_to_K: 2600
      magnesium_oxide_compounds_completely_evaporate_to_K: 2200
      possible_silicon_source_statement_applies_above_K: 2500
    qualifications:
    - Ca–Al–inclusions of chondrites (CAIs) represent the most primitive substance of the Solar system.
    - There are two main types of inclusions – types A and B [1].
    - An important feature of the evaporation of CAIs melts of types A and B is the preservation of silicon component residues
      in the melt up to 2600 K (Fig. 1A, B; lines 4).
    - 'CAIs contains oxide minerals consisting of silica-containing minerals: forsterite (Mg2SiO4), diopside (CaMgSi2O6),
      akermanite (Ca2MgSi2O7), gehlenite (Ca2Al2SiO7), anorthite (CaAl2Si2O8) and grossular (Ca3Al2Si3O12).'
    - Compounds containing magnesium oxide completely evaporate to a temperature of 2200 K (Fig. 1A, B).
    - Consequently, the source of the silicon component in the residual melt of CAIs at temperatures above 2500 K may be gehlenite,
      anorthite and grossular.
    - Thus, the preservation of the silica in residual melts of CAIs types A and B during high-temperature evaporation is
      due to the presence of gehlenite, which has the maximum stability of possible silicate compounds in CAIs.
    uncertainty:
      state:
        tag: unknown
        reason: No numerical uncertainty is stated for the plotted pressures or activities, or for the calculated activity
          comparisons.
      locator:
        page: 2
        published_page: 6197
        pdf_page_index: 1
        figure: '1'
  context_id: shornikov-2024-cai-silica-evaporation::context::shornikov_2024_source_claims_and_numeric_context
