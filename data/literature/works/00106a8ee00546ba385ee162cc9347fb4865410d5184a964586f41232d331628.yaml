      (a), x=5460-7000 and y=2300-3520, is the region of the claimed isolated VIII near 1740 K. The diamond at the top of
      that crop is the legend entry, not a datum. A 2 px opening leaves 24x24 dash cores of the dotted lines (area about 417)
      and a few larger cores still crossed by dashes. Three filled diamonds at (5898.5, 2903.8), (6042.5, 2897.7) and (5892.5,
      2993.5) match legend VIII. The two on the fit, (5898.5, 2903.8) and (6042.5, 2897.7), are stored on shornikov_2002_fig2a_sio_viii
      at the printed 84.14 mol% Al2O3. The diamond at (5892.5, 2993.5) is 0.144 dex below the first of those at nearly the
      same T. It is stored on shornikov_2002_fig2a_sio_replica. The caption says replica filled symbols refer to samples with
      changed composition, and that mole percent is not printed, so the composition is unknown. Every other core has its own
      audit row. The same overlap holds on panels (b) and (c).'
