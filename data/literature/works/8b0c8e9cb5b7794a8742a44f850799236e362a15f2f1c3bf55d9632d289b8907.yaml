    section: Pressure-Volume-Temperature
  units: as printed
  values:
    quantity: sodium_null_point_method_and_apparatus
    method_class: method_only
    method: Closed null-point chamber of known volume with a flexible 5 mil diaphragm, electrical-continuity probe, and external
      calibrated Bourdon-tube pressure gauges. Sodium pressure was balanced against external pressure. The cell was heated
      in a pressure furnace; two calibrated Pt-6%Rh/Pt-30%Rh thermocouples measured each end, with readings taken under isothermal
      conditions.
    sample_and_charge: Distilled sodium was introduced in small tared closed-end tubes made from Cb-1% Zr alloy; filling and
      weighing occurred in a vacuum-inert gas box. Five null-point experiments used a nominal 57 cc chamber. The report gives
      a 28.14 mg charge for Experiment 4 and 307.59 mg for Experiment 7; per-point run assignments are not given in Figure
      6.
    pressure_and_gas: Reported sodium vapour pressures span 1 to 25 atm. The chamber was checked for residual gas after each
      experiment with an evacuated manometer; gas pressures as low as 0.01 psi could have been detected. No carrier gas is
      reported during measurement.
    duration: Pressure-temperature measurements covered at least one complete heating and cooling cycle per experiment; each
      cycle required continuous equipment operation for 52 to 60 hours.
    measurement_reproducibility: Equilibrium pressures were generally reproduced to better than ±0.1 psi before, during, and
      after cycling; the paper does not state a confidence level.
  context_id: ewing-1963-sodium-potassium-properties::context::ewing_1963_na_method_apparatus_context
