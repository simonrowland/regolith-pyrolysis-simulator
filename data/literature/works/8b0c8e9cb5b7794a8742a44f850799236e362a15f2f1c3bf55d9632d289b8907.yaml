  values:
    quantity: sodium_potassium_measurement_scope
    sodium_density: High-temperature sodium density had been reported previously in references 1 and 2; additional density
      work is described as in progress. No sodium density table or points are reported in this document.
    potassium: Potassium vapor-pressure and heat-capacity measurements are described as future work. No measured potassium
      vapour pressure, density, heat capacity, enthalpy, or vapour-composition series is reported here.
    vapour_composition_and_thermodynamics: The preliminary sodium PVT discussion identifies dimer and trimer molecular species
      but reports no measured mole fractions, equilibrium constants, or enthalpy values. The report says these thermodynamic
      results will be obtained after additional experiments and treatment.
    scope: This is the complete Ninth Progress Report for 1 October to 31 December 1962, not a fragment of that report; the
      work is explicitly interim and continuing.
