      time at 415°C. Size cannot be determined at 1020°C because the surface is compact.
    text_has_no_numeric:
    - supersaturation
    - deposited mass
    - condensation rate
    - evaporation rate
    qualitative_mass_statements: Source weight loss increased linearly with time and the calculated evaporation rate is consistent
      with reference [5]. Condensate weight increased linearly with time and the condensation rate is larger at high condensation
      temperature. No numeric mass or rate is printed.
    supersaturation_as_printed: The introduction says a high supersaturation state is required to nucleate from gas. No numeric
      supersaturation is printed.
