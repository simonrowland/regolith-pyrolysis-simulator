    temperature_ranges_K_as_printed:
      higher_volatility: 1800–2100
      almost_complete_evaporation: 2200–2300
    comparison_as_printed: A comparison of the temperature dependencies of partial pressures of vapor species over CAIs melts
      of types A and B with that for the case of Murchison chondrite (Fig. 2C) shows that the latter has a slightly higher
      volatility at 1800–2100 K, due to the high content of magnesium and silicon oxides in the melt (compared with CAIs types
      A and B) and almost completely evaporates at 2200–2300 K.
