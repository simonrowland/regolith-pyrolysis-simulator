- observation_id: shornikov_2023_results_summary_context
  type: author_stated_results_context
  locator:
    page: 5
    published_page: 10
    pdf_page_index: 4
    section: Results and discussion
    note: Printed temperature ranges and qualitative evaporation comparisons.
  units: K as printed where stated
  values:
    quantity: evaporation_results_as_printed
    method_class: quoted_unattributed
    temperature_ranges_K_as_printed:
      silicon_component_remains_in_CAIs: '>2500'
    statements:
    - It is possible to notice the predominance of vapor species corresponding to a higher content of calcium and aluminum
      oxides in the melt in the case of CAIs type A (Fig. 2A), and for the case of CAIs type B – the predominance of vapor
      species corresponding to a higher content of magnesium and silicon oxides in the melt (Fig. 2B).
    - The high-temperature evaporation process occurs in an oxygen-enriched atmosphere.
    - The authors suggest that initial CAI mineral condensation also occurs in an oxygen environment.
  context_id: shornikov-2023-cai-melt-evaporation::context::shornikov_2023_results_summary_context
