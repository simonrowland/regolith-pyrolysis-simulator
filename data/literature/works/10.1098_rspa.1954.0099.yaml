benches:
- id: 10.1098/rspa.1954.0099::bench::fincham-mo-wound-furnace
  work_id: 10.1098/rspa.1954.0099
  identity:
    basis: described_in_this_work
  apparatus_family:
    state:
      tag: value
      value: Molybdenum-wound tube furnace (experiments above 1550 °C)
    locator:
      page: 3
      published_page: 42
      section: Experimental
  cell_material_and_liner:
    state:
      tag: value
      value: Recrystallized impermeable alumina reaction tube, 2 in. diameter, 3 ft long; samples in cold-pressed Pt cups
        (0.005 in. sheet, roughly hemispherical, radius about 1/4 in.) on alumina-cement blocks
    locator:
      page: 3
      published_page: 42
      section: Experimental
  temperature_measurement:
    sensor:
      state:
        tag: value
        value: Leeds and Northrup disappearing-filament optical pyrometer sighted through a prism onto the base of an alumina
          black-body crucible
      locator:
        page: 3
        published_page: 42
        section: Experimental
  temperature_calibration:
    method:
      state:
        tag: value
        value: Pyrometer calibrated against a Pt/13%Rh-Pt thermocouple to 1535 °C and extrapolated linearly to 1650 °C (error
          not more than ±2 °C; correction 30° at 1650 °C). Stated maximum temperature uncertainty ±3 °C up to 1550 °C and
          ±6 °C at 1650 °C (p. 49).
      locator:
        page: 3
        published_page: 42
        section: Experimental
  heating_method:
    state:
      tag: value
      value: Resistance winding; Variac supply controlled by a Sunvic energy regulator; maximum temperature held within ±2
        °C at 1650 °C; constant to within 4 °C over nearly 2 in.
    locator:
      page: 3
      published_page: 42
      section: Experimental
  other_facts: []
