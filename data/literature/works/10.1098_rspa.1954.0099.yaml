- experiment_id: 10.1098/rspa.1954.0099::experiment::fincham-feo-sio2-silica-cups
  kind: literature
  method:
    tag: value
    value: quench_equilibration
  sample:
    mass_kg:
      state:
        tag: unknown
        reason: not_published
      locator:
        page: 3
        published_page: 42
        section: Experimental
        note: Sample masses not printed
    printed_composition:
      state:
        tag: not_applicable
        reason: not_applicable
      locator:
        page: 9
        published_page: 48
        table: '3'
        note: 'Compositions are printed, not unpublished. Table 3 prints one composition per temperature (1350 °C: FeO 56.8,
          Fe2O3 4.5, SiO2 38.7 wt%; 1500 °C: FeO 54, Fe2O3 4, SiO2 42 wt%; context rows fincham1954_t3_feo_sio2_1350c and
          _1500c). "The compositions quoted are taken from the results of Michal & Schuhmann (1952); those at 1500° C were
          obtained by extrapolation and are thus only approximate" (p. 48). Starting charges "always contained slightly less
          silica than the equilibrium amounts" (p. 48). The experiment covers both temperatures, so no single composition
          describes it. not_applicable means no one composition.'
    container:
      state:
        tag: value
        value: Silica cups sealed from 3/8 in. silica tubing (p. 48)
      locator:
        page: 9
        published_page: 48
        section: Melts containing iron oxide and silica
        note: 'Printed: "The samples were held in small silica cups made by sealing off the ends of lengths of ⅜ in. diameter
          silica tubing." (The ¼ in. on p. 42 is the radius of the platinum cups, not this tubing.)'
  conditions:
    temperature_K:
      state:
        tag: value
        value: '1623.15'
      locator:
        page: 3
        published_page: 42
        section: Experimental
        note: Printed 1350 °C; T_K = T_C + 273.15. Also run at 1500 °C (Table 3 second column).
  pressure_environment:
    total_pressure_Pa:
      state:
        tag: unknown
        reason: not_published
      locator:
        page: 23
        published_page: 62
        section: Appendix
        note: Total pressure not stated. Partial pressures are given in atm (e.g. p_N2 = 0.5, p_O2 = 0.99 rows), but the total
          is not printed.
    sweep_gas:
      state:
        tag: not_applicable
        reason: not_applicable
      locator:
        page: 3
        published_page: 42
        section: 'Experimental: Gas mixtures'
        note: 'The gas is printed, not unpublished: "Mixtures of hydrogen, carbon dioxide, sulphur dioxide and nitrogen were
          produced by metering purified commercial gases through capillary flowmeters" (p. 42); flow 1.5-17.3 ml/s at s.t.p.
          (p. 44). The ingoing ratio changes from run to run (% SO2 input, p_N2, p_H2/p_CO2 or p_CO2/p_O2 per row in the Appendix,
          p. 62; context row fincham1954_appendix_gas_mixtures), so no single mixture describes the experiment. not_applicable
          means no one composition, not an absent value.'
    regime:
