- observation_id: ivanova_2017_context_directional_claims
  type: qualitative_result
  locator:
    page: 1
    published_page: 1
    pdf_page_index: 0
    section: Introduction and Results
  units: verbatim prose
  values:
    quantity: directional_and_qualifying_statements
    method_class: quoted_unattributed
    claims:
    - quote: The bulk compositions of most CAIs record the cumulative effects of these high-temperature and largely volatility-controlled
        processes during the first 1–2 million years of solar system history [1].
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Introduction
    - quote: Our previous thermodynamic calculations of evaporation of several pristine CAIs enclosed in the 3N host CAI [2]
        showed trends obtained for composition changes of their residual melts crystallized after evaporation.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Introduction
    - quote: 3N originated either as an aggregate of many smaller CAIs (mostly types A, B, C) plus accreted Fo-bearing material
        (resembling an amoeboid olivine aggregate (AOA)) which experienced partial melting of the whole; or else as an FoB
        melt droplet that collided with and trapped many smaller solid CAIs.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Introduction
    - quote: Relative to typical type A and B CAIs found elsewhere, the bulk compositions of the A and B CAIs within 3N more
        closely match the bulk compositions predicted by equilibrium condensation of a gas of solar composition.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Introduction
    - quote: Therefore the unique 3N CAI contains possibly the most pristine types of refractory material, and their bulk
        composions were very important for the investigation of CAI evaporation processes, and our results showed that evaporation
        of several enclosed CAIs in 3N could result in other known types of CAIs [2].
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Introduction
    - quote: Being trapped within the FoB host-CAI may have protected them from the melt evaporation that affected most “standalone”
        CAIs.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Introduction
    - quote: During CAI and AOA melt evaporation the most refractory Al2O3 and CaO content in the residual molten material
        increased.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Results
    - quote: Unlike our previous results [2], we observed different rates of MgO and SiO2 evaporation depending on initial
        concentrations of oxides and in different activities of the oxides in the melt [7].
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Results
    - quote: We observed inversion of volatilities of the MgO/SiO2 ratios resulting in preferential evaporation of MgO compared
        to SiO2 from the 52E AOA melt (like all CAIs enclosed in 3N) due to an almost solar initial CaO/Al2O3 ratio of the
        melt (~1).
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Results
    - quote: If the Al2O3 content predominates in the initial melt composition compared to CaO with initial CaO/Al2O3 ratio
        ~ < 0.3, similar to CAI 5aN, we observe the usual ratio of MgO/SiO2 relative volatilities.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Results
    - quote: In texture and mineralogy the CAI 5aN is a pristine fine-grained spinel-rich inclusion with no traces of melting
        and evaporation. AOA 52E is a pristine amoeboid olivine aggregate consisting of forsterite, Al-diopside, anorthite
        and spinel. This AOA contains several enclosed CAIs.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Results
    - quote: These compositions have different contents of the main oxides (CaO, MgO, Al2O3, SiO2 and TiO2, FeO), and variable
        ratios between them.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Results
    - quote: Based on the model results, we calculated compositional trends for CAI 5aN and AOA 52E inclusions crystallized
        from residual melts after evaporation and plotted them on a Ca2SiO4-Al2O3-Mg2SiO4 diagram (Fig. 1).
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Discussion
    - quote: All trends finally lead to CAI compositions corresponding to a Ca-aluminate binary system after FeO, MgO, SiO2
        evaporated from the melts.
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Discussion
    - quote: Evaporation of AOA 52E could result in compositions of Fo-bearing Type B, Type B and hibonite-rich CAIs, and
        its compositional trend is similar to those of the CAIs enclosed in 3N [2].
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Discussion
    - quote: All these CAIs and AOA 52E have approximately solar CaO/Al2O3 ratio (~1).
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Discussion
    - quote: The model evaporation of AOA 52E is consistent in general with the experimental work on evaporation of the MgO-rich
        materail of FoB FUN CAIs [8].
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Discussion
    - quote: Evaporation of CAI 5aN resulted in compositions which have never been observed in CAIs from CV3 chondrites but
        have known among CAIs compositions of CH-CB chondrites (Fig. 2).
      locator:
        page: 1
        published_page: 1
        pdf_page_index: 0
        section: Discussion
    - quote: CaO/Al2O3 ratio of 5aN is ~0.2 and similar to ratios of the most dominant CAIs from CH-CB chondrites (<0.3, NWA
        470, Isheyevo [9]).
      locator:
        page: 2
        published_page: 2
        pdf_page_index: 1
        section: Discussion
    - quote: Based on our observations we can conclude that the final CAI compositions mostly depend on primary bulk chemical
        compositions of their precursors (mostly from the CaO/Al2O3 ratio) and the degree of evaporation processes if evaporation
        has taken place.
      locator:
        page: 2
        published_page: 2
        pdf_page_index: 1
        section: Discussion
    source_qualification: In the first Results line of the abstract, the authors print ‘semi-empirical model of thermodynamic
      codes developed by [5,6]’; retained as their wording.
