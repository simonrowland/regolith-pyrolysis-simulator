    - R2_22_eV: 0.995 ± 0.008, 3 spectra
    - CO2_calibration_power_regression_R2: ≥0.987
    - atmospheric_density_regression_R2: ≥0.999
    normalization: 136Xe2+ primary; 136Xe+ and 136Xe3+ comparative; main-clog normalization used 134Xe2+/136Xe2+ at 49.4 km
