  values:
    sample_origin: Mont Ste. Hilaire, Quebec; dark green bladed crystals with albite in the interstices; obtained commercially,
      crushed, washed, screened, and separated.
    sample_description: No evidence of alteration or separate impurities; X-ray diffraction matched the aegirine pattern (PDF
      card 18-1222).
    analysis_by: Sarah T. Neil, chemist, U.S. Geological Survey.
    analysis_wt_percent:
      SiO2: '51.10'
      Al2O3: '3.07'
      P2O5: '.03'
      TiO2: '.84'
      Fe2O3: '24.21'
      FeO: '4.94'
      MgO: '.30'
      MnO: '.92'
      CaO: '2.71'
      Na2O: '11.59'
      K2O: '.02'
      CO2: '.32'
      H2O_plus: '.14'
      H2O_minus: '.02'
    extended_formula_as_printed: (Na0.868Fe3+0.7037Fe2+0.1596Mn0.030Ca0.1121Ti0.0244K0.0009P0.0010Al0.1398Si1.9738)O6
    adjusted_formula_as_printed: (Na0.869Fe3+0.7362Fe2+0.160Mn0.030Ca0.1121)(Al0.141Si1.9738)O6
    extended_formula_weight_g_per_mol: '230.746'
    adjusted_formula_weight_g_per_mol: '231.404'
    iron_ions_per_adjusted_formula:
      Fe3+: '0.7362'
      Fe2+: '0.160'
    impurities_as_printed: Bound water, hygroscopic water, and MgCO3 are calculated out as discrete separate impurities. No
      evidence of separate impurities was observed in the crystal sample.
    analysis_note: P2O5 was .03 wt% and assigned to the Al site in the adjusted formula; TiO2 was .84 wt% and assigned to
      Fe2O3 in the substitution-site column. MgO was .30 wt%.
