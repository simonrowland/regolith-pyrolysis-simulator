- observation_id: aegirine_calorimetry_conditions
  type: experimental_conditions
  locator:
    page: 14
    published_page: 9
    row: low-temperature method
    section: Low-Temperature Thermal Properties
  units: g, K, mol He, K/min as printed
  values:
    low_temperature_method: Adiabatic calorimetry; range 19.1–304.6 K.
    low_temperature_sample_mass_g: '144.8180'
    low_temperature_sample_pretreatment: Dried overnight at 383 K; loaded into a 90-mL copper calorimeter vessel. Calorimeter
      was evacuated and backfilled with 1.3 × 10^-4 mol He before sealing.
    low_temperature_total_pressure: not stated; helium amount is not a pressure
    low_temperature_uncertainty: ±1% from 19–50 K; ±0.2% from 50–200 K; ±0.1% from 200–300 K; confidence level not stated.
    high_temperature_method: Differential scanning calorimetry; DSC measurement range 323–1223 K; argon atmosphere; 10 K/min
      in 50-K steps.
    high_temperature_sample_mass_g: '0.11867'
    high_temperature_capsule: Platinum capsule; full and empty capsule and an Al2O3 reference were measured.
    high_temperature_uncertainty: ±3% from 323–700 K and ±1% from 700–1223 K; confidence level not stated.
    high_temperature_enthalpy_method: Authors analyzed DSC data by the enthalpy method of Mraw and Naas.
    calorie_definition: 1 cal = 4.1840 J; no conversion was made in this extract.
    fit_coefficients: No numerical Cp fit coefficients or fitted equation coefficients are printed. Justice FITAB smoothing
      is named; Cp below 19 K was extrapolated graphically.
    drop_calorimetry_relative_enthalpy: No high-temperature drop-calorimetry relative-enthalpy table is printed. Table 6 H(T)-H(0)
      is a smoothed thermodynamic function, not a direct drop-calorimetry series.
