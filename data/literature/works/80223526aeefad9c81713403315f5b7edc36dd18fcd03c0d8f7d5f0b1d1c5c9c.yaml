- observation_id: shornikov_2014_qualifying_data_statements
  type: data_qualification_context
  locator:
    published_page: 48
    pdf_page_index: 0
    note: Introduction paragraph, continued page 50 discussion and conclusion.
  units: as printed
  values:
    method_class: quoted_unattributed
    quantity: author_data_qualifications
    contradictory_prior_properties: In spite of numerous investigations [Shakhmatkin & Vedishcheva, 1994], the thermodynamic
      properties of these compounds are contradictory that was considered earlier [Shornikov, 2005].
    discussion_model_agreement: According to fig. 2 and 3, the calculated values of oxide activities a(i) and mixing energies
      (ΔG) of the Na2O–SiO2 melts are well correspond to the experimental data [Yamaguchi et al., 1983; Rudnyi et al., 1988;
      Kozhina & Shultz, 2000; Zaitsev et al., 2000] and phase diagram calculated by Zaitsev et al. [Zaitsev et al., 2000].
    discussion_shultz_difference: The observed differences of data obtained by Shultz et al. [Shultz et al., 1987] from the
      results of other experimental studies and the present study calculations, probably, are caused by the systematic errors
      due to the partial oxygen determination needed for the sodium oxide activity calculations.
    conclusion_temperature_and_agreement: Thus, within the framework of the developed semi-empirical model based on the theory
      of ideal associated solution, the thermodynamic properties of the Na2O–SiO2 melts were calculated in the temperature
      range of 900–1800 K. The calculation results are corresponding to available experimental data.
    conclusion_use: They also can be used as for theoretical calculations of thermodynamic properties of multicomponent melts
      containing this system compounds and in the practical purposes.
    translation_note: The phrases “are well correspond”, “are corresponding”, and “as for ... in the practical purposes” are
      retained as printed; the English translation is grammatically garbled.
  context_id: shornikov-2014-sodium-silicate-model::context::shornikov_2014_qualifying_data_statements
