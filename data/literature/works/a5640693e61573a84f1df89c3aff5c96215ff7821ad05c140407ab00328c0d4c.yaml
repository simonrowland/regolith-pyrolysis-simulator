context:
- observation_id: di_donato_2000_equilibrium_method
  type: laboratory_conditions
  locator:
    page: 3
    paragraph: Steps 1 and 2
    equation: '1'
  units: as printed
  experiment: sta409-equilibrium-1600c
  values:
    method_class: quoted_unattributed
    dissociation_reaction: X_mO_n (activity 1) → mX (in X/Pt alloy; activity to be calculated) + n/2 O2 (fixed activity)
    equilibrium_relation: K = (a_X)^m * (P_O2)^(n/2) / a_XmOn
    step_2_reduction: The concentration of X in X/Pt gives its activity using the relationship obtained in Step 1; knowing
      this activity and gas oxygen activity (defined by gas composition and temperature), the equilibrium constant gives the
      oxide activity in slag.
  context_id: di-donato-granati-2000::context::di_donato_2000_equilibrium_method
  work_id: a5640693e61573a84f1df89c3aff5c96215ff7821ad05c140407ab00328c0d4c
  source_id: di-donato-granati-2000
  species: FeO
