- observation_id: di_donato_2000_qualifying_statements_and_directional_claims
  type: laboratory_conditions
  locator:
    page: 1
    paragraph: Abstract
  units: verbatim statements and located context
  values:
    method_class: quoted_unattributed
    abstract_findings:
    - quote: 'The results show a clear difference in the behaviour of the different oxides: FeO, MnO and Cr2O3.'
      locator:
        page: 1
        paragraph: Abstract
    - quote: In the range of composition studied it is found that the MnO activity increases nearly linearly with MnO concentration
        and is not significantly affected by base slag composition.
      locator:
        page: 1
        paragraph: Abstract
    - quote: FeO and Cr2O3 activities does not vary linearly with concentration and the dependence is different for different
        base slag composition and SiO2 content affects activity of FeO and Cr2O3 in a different way for the different base
        slags.
      locator:
        page: 1
        paragraph: Abstract
    method_qualifiers:
    - quote: Activity measurements were performed by an equilibration method, the equilibrium was realised between the reducible
        oxides FeO, MnO and Cr2O3 (pure or in slag phase) with the corresponding metal in solid platinum under fixed oxygen
        potential.
      locator:
        page: 2
        section: '3.1'
    - quote: the X concentration in X/Pt alloy is determined by the mass loss of the sample, during the experiment, under
        the assumption that oxygen only is lost; this assumption is reasonable being in general the vapour pressure of X at
        1600 °C negligible.
      locator:
        page: 3
        paragraph: Step 1
    - quote: Chemical analysis of both platinum crucible and material contained in it after the experiments confirmed that
        the mass loss is consistent with amount of metal dissolved in platinum and that no separate metal remains in the crucible.
      locator:
        page: 3
        paragraph: Step 1
    - quote: experimental determination of activity of X in platinum was performed only when data were not available in literature.
      locator:
        page: 3
        paragraph: Step 1
    - quote: A set of trials, with different gas flow rates, permitted to define a flow rate of 0.5 cm3/s as the maximum value
        to be used for achieving the equilibrium.
      locator:
        page: 3
        paragraph: experimental procedure
    - quote: The equilibrium gas/metal/oxide/platinum at the furnace temperature is reached if the gas is allowed to remain
        inside the furnace for the necessary time.
      locator:
        page: 3
        paragraph: experimental procedure
    - quote: The residence time depends on the gas flow rate.
      locator:
        page: 3
        paragraph: experimental procedure
    - quote: From the initial masses of slag, X and XmOn, and the mass variation during the experiment, the X content in X/Pt
        and XmOn concentration in slag are determined.
      locator:
        page: 3
        paragraph: Step 2
    - quote: Also in this case, chemical analysis of slag and platinum confirmed the concentration values obtained by the
        mass losses.
      locator:
        page: 3
        paragraph: Step 2
    - quote: On line monitoring of the O2 activity in the gas in contact with the sample has been performed during the experiments
        is possible.
      locator:
        page: 4
        paragraph: experimental procedure
      note: Source grammar reproduced as printed.
    numeric_results_context:
    - quote: FeO activity was measured in master slags with FeO concentration ranging up to about 5% by mass.
      locator:
        page: 4
        section: '4.1'
    - quote: 'The reason for choosing this low concentration range is twofold: the data are relevant for secondary metallurgy
        treatments using synthetic slags and are scarce in this range.'
      locator:
        page: 4
        section: '4.1'
    - quote: In Table 10 activity of FeO at about 1% by mass is reported, measured for all the eight master slags, showing
        the effect of master slag composition on FeO activity.
      locator:
        page: 4
        section: '4.1'
      note: Manuscript cross-reference is printed “Table 10”; the corresponding eight-slag measurements are in Table 2. Preserved
        as printed rather than silently corrected.
    - quote: In this figure (and in similarly in what follows) polynomial least square fitting of experimental data has been
        used to emphasise the trend.
      locator:
        page: 4
        section: '4.1'
    - quote: Master slag 3 is representative of target slag to be used in carbon steel secondary refining.
      locator:
        page: 4
        section: '4.1'
    - quote: The influence of slag composition on Cr2O3 activity for concentration of 5%, 10%, and 15% is shown in Figure
        7; the values at the exact concentration 5%, 10%, and 15% have been obtained interpolating the experimental values
        of Table 5.
      locator:
        page: 4
        section: '4.3'
    conclusion_claims:
    - quote: MnO activity increases nearly linearly with MnO concentration
      locator:
        page: 5
        section: Conclusions, bullet 1
    - quote: activity of MnO is not significantly affected by base slag composition
      locator:
        page: 5
        section: Conclusions, bullet 2
    - quote: FeO and Cr2O3 activities does not vary linearly with concentration and the dependence is different for different
        base slag composition and
      locator:
        page: 5
        section: Conclusions, bullet 3
    - quote: SiO2 content affects activity of FeO and Cr2O3 in a different way for the different base slags
      locator:
        page: 5
        section: Conclusions, bullet 4
