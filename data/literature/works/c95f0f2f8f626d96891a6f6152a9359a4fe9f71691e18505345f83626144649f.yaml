  type: assessment
  locator:
    page: 2
    pdf_page_index: 1
    published_page: 772
    section: Mutual interactions
  units: qualitative
  values:
    quantity: sequential oxidation of multiple redox couples and redox buffering
    method_class: measured_direct
    admission_status: typed_unavailable
    claims_as_printed:
    - With three redox couples present, an oxidizing agent oxidizes the easiest-to-oxidize component before another component.
    - The oxidizing agent does not oxidize both components proportionately and simultaneously.
    - An excess of the easiest-to-oxidize ion can protect another couple from exchange, described as redox buffering.
    reason: The abstract reports these experimental findings qualitatively; numerical interaction data are only in deferred
      Figure 1.
