  units: as printed
  values:
    phase_as_printed: The authors state that Na2O has an antifluorite crystal structure (reference [9]); individual table
      rows do not name a distinct polymorph. The typeable phase is crystalline (cr).
    melting_limit_as_printed: Measurements through melting were planned. A capsule developed a pin-hole at 1453 K during preliminary
      vacuum-furnace experiments; after removal, the sample was exposed to air and extensively hydrolyzed. The paper does
      not report a Na2O melting temperature or a measured liquid enthalpy series.
