  values:
    sample_formula_as_printed: Na2O
    sample_purity_statement_as_printed: (99.9 ± 0.2) per cent of the amount of NaOH that would be produced by pure Na2O
    sample_purity_reference_marker_as_printed: (5)
    sample_purity_basis_note: This is the titrimetric hydrolysis-product yield relative to the theoretical NaOH amount from
      pure Na2O; it is not a printed Na2O mass-percent assay. Confidence level for ±0.2 is not stated.
    preparation_as_printed: The sample was heated under vacuum at 783 K for 40 h to remove excess sodium and any NaOH; it
      was then characterized by titrimetric analysis and emission spectrography.
    capsule_as_printed: (platinum + 10 mass per cent of rhodium), 0.4 mm wall thickness, 1.25 cm diameter, 5 cm3 internal
      volume, 5 cm length
    apparatus_as_printed: Resistance-heated vacuum furnace; copper-block calorimeter operating at 298.15 K with a quartz-crystal
      thermometer.
    apparatus_procedure_reference_marker_as_printed: (6)
    sapphire_check_reference_marker_as_printed: (7)
    sapphire_check_as_printed: Six experiments using sapphire in a platinum + 10 mass per cent rhodium capsule covered 598
      to 1010 K; results agreed with NBS certified values within ±0.3 per cent.
