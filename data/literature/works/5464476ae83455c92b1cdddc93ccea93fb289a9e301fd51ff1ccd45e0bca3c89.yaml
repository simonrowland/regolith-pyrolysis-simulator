    capsule_filling: The sample-containing capsule was sealed under vacuum.
    filling_weighing_sealing_as_printed: All filling, weighing, and sealing operations were carried out in a glove-box filled
      with flowing high-purity helium.
    capsule_correction_as_printed: An empirical expression for the enthalpy of the Pt + 10 mass per cent Rh capsule was determined
      from separate empty-capsule experiments and used to correct the capsule heat at each experimental temperature.
    capsule_correction_method_class: measured_reduced
    capsule_correction_note: The paper reports the empirical correction expression but not the raw empty-capsule calibration
      runs; q_o is retained as a typed-refused input for the measured enthalpy reductions.
    capsule_sealed_under_vacuum_note: The capsule was sealed under vacuum, but no numerical total pressure is reported. The
      glove-box helium is stated for filling, weighing, and sealing, not as a furnace atmosphere. No fO2 is reported.
    unit_temperature_footnote_as_printed: Throughout this paper, cal_th = 4.184 J, and all temperatures are based on IPTS-68.
