      contains no alias. The source's eight EMF fit rows therefore remain typed located context.
    similar_existing_data: kim-2004-na2o-float-glass-emf
    fit_expression_gap: 'The exact quantity tokens are present: simulator/battery/enums.py::Quantity.ACTIVITY and Quantity.DELTA_FG;
      simulator/battery/migrate.py::QUANTITY_ALIASES and ::TYPE_QUANTITY resolve the declared activity and gibbs_table types,
      and ::PHASE_MAP resolves cr. The unsupported form is the printed coefficient-only fit: simulator/battery/migrate.py::select_declared_source
      does not evaluate it into point observations. Existing coefficient-only fits such as data/literature/extracts/chatain-2021-nacro2-thermodynamics.yaml
      retain typed refusals.'
    quantity_unknown_rows: all eight Gibbs fits; reaction-(B) and reaction-(D) energies have no exact reaction-extent quantity
      token.
    reaction_extent_gap: simulator/battery/enums.py::Quantity.DELTA_FG and simulator/battery/migrate.py::QUANTITY_ALIASES
      plus ::TYPE_QUANTITY provide no exact reaction-extent Gibbs-energy quantity. Keep the printed reaction-(B) and reaction-(D)
      energies quantity-unknown rather than mapping them to per-formula delta_fG.
