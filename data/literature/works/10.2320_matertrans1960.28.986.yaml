- observation_id: yki1987_gibbs_reduction_equations
  type: method
  units: as printed
  locator:
    page: 6
    published_page: 991
    section: III.2 Estimation of thermochemical properties
    equations: 4–6
  values:
    activity_fit_equation_as_printed: log aNa2O = (A ± dA) + (B ± dB) × 10^4 K/T
    na3fe5o9_reaction_as_printed: 3Na2O(s) + 5Fe2O3(s) = 2Na3Fe5O9 (B)
    na3fe5o9_reduction_as_printed: ΔG°(B) = 2ΔG°(Na3Fe5O9) = 3RT ln aNa2O(F/N3F5) (4)
    na2fe2o4_reaction_as_printed: 2Na3Fe5O9 + 2Na2O(s,l) = 5Na2Fe2O4 (C); Na2O(s,l) + Fe2O3 = Na2Fe2O4 (α,β,γ) (D)
    na2fe2o4_reduction_as_printed: ΔG°(C) = 2RT ln aNa2O(N3F5/NF) (5); ΔG°(Na2Fe2O4) = 1/5[ΔG°(B) + 2RT ln aNa2O(NF/N3F5)]
      (6)
    equation6_gibbs_identity_as_printed: ΔG°(Na2Fe2O4) = 1/5[ΔG°(B) + ΔG°(C)] (6)
    equation6_ratio_conflict: Eq. (6) prints NF/N3F5, while Eq. (5) and Table 3 identify N3F5/NF; preserved without inversion.
    assumptions_as_printed: aFe2O3(solid hematite) is standard state; aNa3Fe5O9=1; Na3Fe5O9 assumed stoichiometric.
    standard_free_energy_calculation_limit: Below 1405 K because Na2O activity over the liquid phase was unknown.
    uncertainty_as_printed: Statistical terms only; confidence level not stated; systematic/reference errors excluded.
  context_id: yamaguchi-kaneko-iguchi-1987-na2o-fe2o3-activity::context::yki1987_gibbs_reduction_equations
