  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: Replacement of CaO with TiO2 in the slag of basicity xCaO/xSiO2=1.07 with about the same SiO2 concentration results
      in a sharp increase in SiO2 activity. However, this has little effect on the SiO2 activity in slags of low basicity.
