- observation_id: ostrovski_2000_qualifying_statement_22
  type: method
  locator:
    page: 8
    published_page: 352
    pdf_page_index: 7
    section: Method accuracy
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_attributed
    quote: The accuracy of such calculation of partial pressures of vapour species in oxide systems was found to be satisfactory
      in an earlier study [49,50] of the B2O3-SiO2 and B2O3-Al2O3 systems.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_22
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
