  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: Fig. 6 summarizes changes in concentrations of SiO2 and TiO2 in samples No 1-7 of the CaO-TiO2-SiO2 system during
      the selective vaporization of components, when the temperature of vaporization increased from 1550 to 2175 K.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_20
