- observation_id: ostrovski_2000_qualifying_statement_23
  type: method
  locator:
    page: 9
    published_page: 353
    pdf_page_index: 8
    section: Titanium ionization
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: measured_tabulated
    quote: The intensity of the Ti+ ion current was evaluated to be about 7% of the value of the TiO+ ion current. Further
      experiments were carried out at the ionizing-electron energy of 12 eV to be sure that ionization of TiO2 and TiO species
      in accordance with reactions (13)-(15) could be neglected.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_23
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_24
  type: method
  locator:
    page: 9
    published_page: 353
    pdf_page_index: 8
    section: Titanium ionization
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_attributed
    attribution: Banon et al. [29] (12.2 eV parent ion); Ref. [51] (Ti and TiO ionization energies).
    quote: Banon et al. [29] showed that at low ionizing electron energies (12.2 eV), the TiO+ ion may be considered as the
      parent. Ionization energy of Ti and TiO is (6.3±0.3)eV and (6.8±0.5)eV respectively [51].
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_24
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_25
  type: method
  locator:
    page: 9
    published_page: 353
    pdf_page_index: 8
    section: Mass spectra
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: measured_tabulated
    quote: The vapour mass spectra over the samples of the CaO-TiO2-SiO2 system of different compositions showed the same
      ion species as in the mass spectra of vapour over individual oxides CaO, TiO2, and SiO2 and over the CaO-SiO2 and CaO-TiO2-Ti2O3
      systems.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_25
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_26
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Activity discussion
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: Binary CaO-SiO2 SiO2 activities and activity coefficients decrease with decreasing basicity (xCaO/xSiO2); the same
      trend is stated for the ternary system.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_26
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_27
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Activity discussion
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: Replacement of CaO with TiO2 in the slag of basicity xCaO/xSiO2=1.07 with about the same SiO2 concentration (xSiO2=0.431-0.434)
      results in sharp increase in SiO2 activity and activity coefficient.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_27
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_28
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Activity discussion
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: However, the effect of TiO2 on the SiO2 activity and activity coefficient in slags of low basicity is rather small.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_28
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_29
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Activity discussion
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: This could be expected because TiO2 is regarded as an acidic oxide, while CaO is a basic oxide. However, the effect
      of TiO2 on the SiO2 activity and activity coefficient in slags of low basicity is rather small, which could be an indication
      that in the acidic slag TiO2 behaves as a basic oxide.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_29
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_30
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Activity limits
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: To determine accurately the thermodynamic activities of CaO and TiO2 in the CaO-TiO2-SiO2 system, much higher temperatures
      are required, as vapour pressures of species in the vaporization of these oxides are much lower than of SiO. However,
      at high temperatures SiO2 would be about completely vaporised. Because of this limitation, activities of CaO and TiO2
      were not determined.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_30
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_qualifying_statement_31
  type: method
  locator:
    page: 11
    published_page: 355
    pdf_page_index: 10
    section: Conclusions
  units: as printed
  values:
    quantity: source_qualifying_statement
    method_class: quoted_unattributed
    quote: Replacement of CaO with TiO2 in the slag of basicity xCaO/xSiO2=1.07 with about the same SiO2 concentration results
      in a sharp increase in SiO2 activity. However, this has little effect on the SiO2 activity in slags of low basicity.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_qualifying_statement_31
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
