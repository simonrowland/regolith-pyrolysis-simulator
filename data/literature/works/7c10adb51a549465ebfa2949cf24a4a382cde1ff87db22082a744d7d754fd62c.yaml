- observation_id: ostrovski_2000_verbatim_statement_01
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: The SiO2 activities in the CaO-TiO2-SiO2 system were found to have negative deviations from the ideality for all
      compositions except the sample with high SiO2 concentration (CaO/SiO2=0.6, 16 mole % TiO2).
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_01
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_02
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: Replacement of CaO with TiO2 in slags of relatively high basicity (xCaO/xSiO2>1) causes a sharp increase in the
      SiO2 activity and activity coefficient.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_02
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_03
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: In more acidic slags, addition of TiO2 to the CaO-SiO2 system does not have a strong effect on the SiO2 activity
      and activity coefficient.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_03
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_04
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_attributed
    quote: It has been noted [4] that various aspects of the behaviour of TiO2 in slags can be accounted for by the specific
      structure of the electron shell of a titanium atom and by the high polarizability of the Ti+4 cation.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_04
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_05
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_attributed
    quote: Titanium partitioning between Ti3+ and Ti4+ valency states in the CaO-SiO2-TiOx system as a function of temperature,
      oxygen potential, titanium oxide content and CaO:SiO2 ratio was examined by Tranell et al. [5]. It was found that the
      Ti3+/Ti4+ ratio decreases with the increasing CaO/SiO2 ratio, increasing oxygen potential and decreasing temperature.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_05
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_06
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: Literature data on the vaporization and thermodynamic properties of the CaO-TiO2-SiO2 system are extremely limited.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_06
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_07
  type: method
  locator:
    page: 1
    published_page: 345
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_attributed
    quote: Thermodynamic properties of multi-component slags based on the CaO-TiO2-SiO2 system were studied by the gas-slag
      equilibrium technique with addition of FeO and MnO [4], and MgO and Al2O3 [5].
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_07
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_08
  type: method
  locator:
    page: 2
    published_page: 346
    pdf_page_index: 1
    section: Experimental
  units: as printed
  values:
    quantity: source_statement
    method_class: measured_tabulated
    quote: In the first series, the titanium oxide content was 10.5 mole % and CaO/SiO2 ratio was between 0.82 and 1.30. The
      second series of samples contained 16-17 mole % TiO2 at CaO/SiO2 ratio from 0.60 to 1.30.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_08
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_09
  type: method
  locator:
    page: 2
    published_page: 346
    pdf_page_index: 1
    section: Introduction
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_attributed
    quote: Vaporization and thermodynamic properties of titanium oxides by high temperature mass spectrometric method were
      examined by Semenov [10] and Gilles et al. [11-26].
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_09
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_10
  type: method
  locator:
    page: 3
    published_page: 347
    pdf_page_index: 2
    section: CaF2 calibration
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_attributed
    quote: The calculated partial pressure of CaF2 as a function of temperature is plotted in Fig. 3. It agrees well with
      reference data [40] also presented in Fig. 3.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_10
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_11
  type: method
  locator:
    page: 6
    published_page: 350
    pdf_page_index: 5
    section: Vaporization of pure silica
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_attributed
    quote: Partial pressures of SiO2 obtained at the present study are in agreement with data recommended in Ref. 40.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_11
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_12
  type: method
  locator:
    page: 7
    published_page: 351
    pdf_page_index: 6
    section: Table 3 discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: measured_tabulated
    quote: Partial pressures of Ca, TiO and TiO2 evaluated by the ion current comparison method (Eqn. 2) at 1900 K were lower
      than 10^-8 atm.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_12
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_13
  type: method
  locator:
    page: 7
    published_page: 351
    pdf_page_index: 6
    section: Table 3 discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: As a result of significant difference in the volatility between SiO, Ca, TiO and TiO2 at 1850 K, initial compositions
      of the system changed during isothermal vaporization of samples.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_13
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_14
  type: method
  locator:
    page: 7
    published_page: 351
    pdf_page_index: 6
    section: Table 3 discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: figure_only
    quote: Fig. 5 illustrates changes in concentrations of TiO2 and SiO2 in samples No 3 and No 5 relative to the initial
      concentrations as a result of the selective vaporization of components in the temperature range 1500-2200 K.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_14
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_15
  type: method
  locator:
    page: 8
    published_page: 352
    pdf_page_index: 7
    section: Composition-change procedure
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: The quantity of remaining CaO and TiO2 in the residual sample was calculated from the ratios of the areas of their
      ion-current plots in the same way.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_15
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_16
  type: method
  locator:
    page: 8
    published_page: 352
    pdf_page_index: 7
    section: Selective vaporization
  units: as printed
  values:
    quantity: source_statement
    method_class: figure_only
    quote: Fig. 6 summarizes changes in concentrations of SiO2 and TiO2 in samples No 1-7 when the temperature of vaporization
      increased from 1550 to 2175 K. Figure 6 caption instead states 1750 to 2175 K.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_16
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_17
  type: method
  locator:
    page: 8
    published_page: 352
    pdf_page_index: 7
    section: Selective vaporization
  units: as printed
  values:
    quantity: source_statement
    method_class: figure_only
    quote: Enrichment of the condensed phase of the CaO-TiO2-SiO2 system with CaO and TiO2 during vaporization is also presented
      on the phase equilibrium diagram [6] for all samples studied (Fig. 7).
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_17
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_18
  type: method
  locator:
    page: 8
    published_page: 352
    pdf_page_index: 7
    section: Selective vaporization
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: These data on the distillation of the CaO-TiO2-SiO2 system during vaporization can be useful in various high-temperature
      processes.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_18
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_19
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Silica activity discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: measured_reduced
    quote: The SiO2 activity in the CaO-TiO2-SiO2 system at 1850 K was calculated using experimental data on vapour pressure
      of SiO and O measured over the samples and pure SiO2.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_19
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_20
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Silica activity discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: SiO2 activities and activity coefficients in the binary CaO-SiO2 system decrease with decreasing basicity (xCaO/xSiO2
      ratio). The same trend is observed for the ternary CaO-SiO2-TiO2 system.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_20
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_21
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Silica activity discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: Replacement of CaO with TiO2 in the slag of basicity xCaO/xSiO2=1.07 with about the same SiO2 concentration (xSiO2=0.431-0.434)
      results in sharp increase in SiO2 activity and activity coefficient.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_21
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_22
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Silica activity discussion
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: This could be expected because TiO2 is regarded as an acidic oxide, while CaO is a basic oxide. However, the effect
      of TiO2 on the SiO2 activity and activity coefficient in slags of low basicity is rather small, which could be an indication
      that in the acidic slag TiO2 behaves as a basic oxide.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_22
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_23
  type: method
  locator:
    page: 10
    published_page: 354
    pdf_page_index: 9
    section: Activity limits
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: To determine accurately the thermodynamic activities of CaO and TiO2 in the CaO-TiO2-SiO2 system, much higher temperatures
      are required, as vapour pressures of species in the vaporization of these oxides are much lower than of SiO. However,
      at high temperatures SiO2 would be about completely vaporised. Because of this limitation, activities of CaO and TiO2
      were not determined.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_23
  work_id: 7c10adb51a549465ebfa2949cf24a4a382cde1ff87db22082a744d7d754fd62c
  source_id: ostrovski-2000-cao-tio2-sio2
  species: SiO2
- observation_id: ostrovski_2000_verbatim_statement_24
  type: method
  locator:
    page: 11
    published_page: 355
    pdf_page_index: 10
    section: Conclusions
  units: as printed
  values:
    quantity: source_statement
    method_class: quoted_unattributed
    quote: Using experimental data on vapour pressure of SiO and O over the CaO-TiO2-SiO2 system, the thermodynamic activity
      of SiO2 was calculated and compared with the SiO2 activity in the binary CaO-SiO2 system.
  context_id: ostrovski-2000-cao-tio2-sio2::context::ostrovski_2000_verbatim_statement_24
