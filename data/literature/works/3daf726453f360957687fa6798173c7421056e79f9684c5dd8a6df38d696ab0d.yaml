- observation_id: shornikov_2000_melting_disagreement_qualifiers_page680
  type: thermodynamic_example
  locator:
    published_page: 680
    pdf_page_index: 3
    section: Results and Discussion
    note: The final comparison continues onto page 681
  units: as printed
  values:
    quantity: melting_interpretation_comparisons
    method_class: quoted_unattributed
    numerical_comparisons_as_printed:
      congruent_melting_composition_discrepancy_wt_percent: '7.5'
      congruent_melting_temperature_discrepancy_K: 100
      incongruent_melting_composition_discrepancy_wt_percent: 23
      incongruent_melting_temperature_discrepancy_K: 60
      pure_oxide_temperature_measurement_error_upper_bound_K: 20
    statements_as_printed:
    - A detailed analysis of the data on nonvariant points in the Al2O3-SiO2 system shows that melting of mullite is considered
      congruent in some works and incongruent in others (table).
    - Data on the concentrations and temperatures corresponding to the nonvariant points of the Al2O3-SiO2 system for the
      M + S + L, M + L, and M + A + L phases (A = Al2O3, S = SiO2, M = mullite, and L = liquid) are discrepant.
    - According to the table, these discrepancies equal 7.5 wt % and 100 K in the works in which mullite is assumed to melt
      congruently and 23 wt % and 60 K in the works claiming incongruent melting of mullite.
    - These deviations far exceed the deviations obtained in the same works for the temperatures of fusion of pure Al2O3 and
      SiO2 oxides, which coincide within the errors of measurements not exceeding 20 K and correspond to the generally accepted
      values [22, 39] (table).
    - We believe that the difference in opinions concerning the character and temperature of fusion of mullite (table) is
      to a great degree determined by different conditions of measurements, first and foremost temperature conditions (heating
      and cooling rates) and the composition of the gas phase, and also other factors influencing melting of this compound
      [12, 23, 46-50].
    - The dual character of melting of mullite gives grounds to believe that mullite melts incongruently under equilibrium
      conditions and congruently under metastable conditions [26, 29, 41, 51, 52].
    - However, according to Galakhov [53], a detailed consideration of these works (in particular, [26]) does not allow an
      equilibrium phase diagram to be constructed with incongruent melting of mullite.
    - The point of view expressed in [26, 29, 41, 51, 52] is opposite to that [23, 42, 54-57], where the conclusion is drawn
      that the stable variant of the Al2O3-SiO2 phase diagram is characterized by congruent melting of mullite, whereas the
      metastable variant includes incongruent mullite melting.
  context_id: shornikov-2000-aluminosilicate-vaporization::context::shornikov_2000_melting_disagreement_qualifiers_page680
