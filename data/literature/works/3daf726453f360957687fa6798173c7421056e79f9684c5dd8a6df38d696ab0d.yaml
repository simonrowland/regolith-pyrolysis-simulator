    Si_plus_fragment_percent_of_SiO_plus: 3
    AlSiO_plus_percent_of_SiO_plus: '0.01'
    statements_as_printed:
    - The ratio between the ion currents corresponding to the molecular ions formed in interaction between the gas phase over
      Al2O3-SiO2 and the material of the effusion cell [(MoO)+, (MoO2)+, and (MoO3)+] was close to that observed for vaporization
      of mullite [8, 15, 16] and melts in this system in the concentration range 0-20 mol % Al2O3 [17] and silicon dioxide
      [13].
    - The intensity of the ion current of the (Mo)+ molecular ion formed in the vaporization of the effusion cell itself did
      not exceed 0.1% of the intensity of the (SiO)+ ion current.
    - The intensity of the ion current corresponding to the (Si)+ fragment ion formed from the (SiO)+ and (SiO2)+ molecular
      ions did not exceed 3% of the intensity of the (SiO)+ ion current, as with silicon dioxide [13].
    - The relative content of the (AlSiO)+ molecular ion studied in detail in [8, 15, 16, 18, 19] was insignificant in the
      mass spectra of vapor over Al2O3-SiO2 melts and did not exceed 0.01% of the (SiO)+ ion current intensity.
