    quantity: composition_change_and_protection
    method_class: quoted_unattributed
    statement_as_printed: A characteristic feature of this method is the formation of tungsten metal films preventing vaporization
      of aluminum and silicon oxides on the surface of samples, because partial volatilization of system components (largely
      silicon dioxide) in vacuum at high temperatures and normal pressure changes the initial composition of samples during
      measurements. If the surface remained unprotected, partial vaporization of silicon dioxide was indeed observed according
      to chemical and mineralogical analyses.
    additional_statements_as_printed:
    - The very high rate of crystallization required short times for the formation of crystalline phases.
    - The initial compositions were selected based on consideration of possible high-temperature heterogeneous reactions that
      changed the composition of condensed phases during vaporization under given temperature conditions.
