- observation_id: shornikov_2000_phase_diagram_comparisons_page680
  type: thermodynamic_example
  locator:
    published_page: 679
    pdf_page_index: 2
    section: Results and Discussion
    note: Comparisons printed on p. 679; the final preference sentence continues at the top left of p. 680.
  units: as printed
  values:
    quantity: liquidus_and_phase_diagram_comparisons
    method_class: quoted_attributed
    point_at_2220_K_other_data_Al2O3_mol_percent:
    - '69.4'
    - '78.4'
    Al2O3_plus_liquid_field_begins_mol_percent_as_reported_elsewhere: '60'
    claimed_peritectic_composition_Al2O3_mol_percent: '36.9'
    statements_as_printed:
    - According to the other data [24, 25], the point at 2220 K occurs between 69.4 [24] and 78.4 mol% Al2O3 [25].
    - It was found in [26, 27] that the Al2O3 + liquid field began at 60.0 mol% Al2O3. This result differs substantially from
      those of this work and [11, 23-25].
    - The position of the liquidus point at 2220 K determined in this work is also evidence against the occurrence of a peritectic
      compound in the Al2O3-SiO2 system containing 36.9 mol % Al2O3; this compound was claimed to exist in [26, 27] and in
      several other works [28-36].
    - The positions of liquidus points were verified by studying the characteristic behavior of ion currents at the temperatures
      of fusion of the aluminosilicate system compositions studied in this work.
    - The positions of liquidus points determined in this work as described above substantiate the data on the Al2O3 + liquid
      field in the Al2O3-SiO2 system obtained in [11, 23].
    - It follows from Fig. 4 that the liquidus points in region II (Al6Si2O13 + liquid) obtained in this work almost coincide
      with those reported in [11] at the end portions of crystallization curves and lie somewhat higher (by ~25 K) than the
      latter in the concentration range 20-40 mol % Al2O3.
    - These deviations are within the errors of this work and [11]. Note that they do not introduce fundamental differences
      in the phase diagram of the Al2O3-SiO2 system.
    - We nevertheless give preference to the crystallization line with a slope steeper than that obtained in [11].
    attribution: References [11, 23-36] as cited by Shornikov et al. (2000)
  context_id: shornikov-2000-aluminosilicate-vaporization::context::shornikov_2000_phase_diagram_comparisons_page680
