- observation_id: shornikov_2000_impurity_drift_and_heating_qualifiers_page681
  type: thermodynamic_example
  locator:
    published_page: 681
    pdf_page_index: 4
    section: Results and Discussion
    note: The phase-characterization sentence continues on p. 682; the final polymorph sentence is printed on p. 682.
  units: as printed
  values:
    quantity: factors_qualifying_mullite_melting_interpretation
    method_class: quoted_unattributed
    statements_as_printed:
    - The question of the reliability of determining the phase relations in the region of mullite melting is complicated by
      insignificance of the temperature difference between the melting point and the eutectic horizontal and by closeness
      of the eutectic point to the stoichiometric composition of mullite.
    - According to [50], the character of mullite melting is intermediate between congruent and incongruent.
    - As a consequence, we come across opposite views on the matter in works of the same authors, for instance, melting of
      mullite is claimed to be incongruent in [24] and congruent in [38].
    - The presence of a third component such as manganese oxide [58] in the Al2O3-SiO2 system facilitates mullite formation,
      whereas sodium oxide [43], silicon monoxide [29, 31, 32], and nickel and iron oxides [46] hinder the reaction, which
      can create the impression that mullite melts incongruently.
    - Similar conclusions can be drawn when stoichiometric mullite samples are held for a long time in open containers and
      heated in vacuum, because their initial composition then shifts to the side of aluminum oxide.
    - This process is difficult to take into account because of different temperature dependences of the integral vaporization
      coefficients of silicon dioxide and aluminum oxide.
    - Note that when mullite is heated at a high rate in a microfurnace, samples can be overheated, which favors the congruent
      interpretation [50].
    - Special attention should be given to the determination of the phase composition of Al2O3-SiO2 samples, because X-ray
      diffractograms or microscopic examination of separate probe regions may give a distorted idea of equilibrium phase relations
      [11, 65-67].
    - The effects of aluminum oxide polymorphs on the attainment of equilibria in the Al2O3-SiO2 system should also be taken
      into account [68-70].
  context_id: shornikov-2000-aluminosilicate-vaporization::context::shornikov_2000_impurity_drift_and_heating_qualifiers_page681
  work_id: 3daf726453f360957687fa6798173c7421056e79f9684c5dd8a6df38d696ab0d
  source_id: shornikov-2000-aluminosilicate-vaporization
  species: Al2O3
- observation_id: shornikov_2000_introductory_phase_relations_background
  type: thermodynamic_example
  locator:
    published_page: 677
    pdf_page_index: 0
    section: Introduction
  units: K and as printed
  values:
    quantity: introductory_phase_relations_background
    method_class: quoted_unattributed
    mullite_stability_threshold_K: 1000
    abstract_temperature_range_K:
    - 1720
    - 2520
    abstract_mullite_congruent_melting_temperature_K: 2180
    statements_as_printed:
    - Vaporization of Al2O3–SiO2 melts from a Knudsen effusion cell was studied mass-spectrometrically in the temperature
      range 1720–2520 K. The liquidus line in the aluminosilicate system was refined, and the Al6Si2O13 compound was shown
      to melt congruently at 2180 K.
    - Of special importance for the production of modern high-quality refractories are the properties of mullite Al6Si2O13,
      which occurs in the Al2O3–SiO2 system and is stable at high (above 1000 K) temperatures; this is a highly refractory
      and chemically stable component for firing refractories from kaolins and clays, high-alumina articles, porcelain, and
      other aluminosilicate ceramic masses.
    - These low-temperature (in comparison with mullite) compounds are stable only at certain temperatures and pressures.
    - The data on the physicochemical properties of these compounds are, however, not unambiguous, and those on the phase
      relations and the thermodynamic properties of the Al2O3–SiO2 system are even controversial.
  context_id: shornikov-2000-aluminosilicate-vaporization::context::shornikov_2000_introductory_phase_relations_background
