context:
- observation_id: shornikov_2000_conclusion_page682
  type: thermodynamic_example
  locator:
    published_page: 682
    pdf_page_index: 5
    section: Conclusion
  units: as printed
  values:
    quantity: author_conclusion
    method_class: quoted_unattributed
    statements_as_printed:
    - The data of one of the earliest works [40] concerned with the phase diagram of the Al2O3-SiO2 system appear to be fairly
      approximate.
    - It follows from the table that the data obtained in this work provide unambiguous evidence of the existence of a eutectic
      composition in the M + A + L region and are in agreement with the results of [11, 12, 37, 38, 42].
    - This proves the congruent character of mullite melting observed in the same works in the temperature range 2123-2207
      K.
    - The conclusion that mullite melts incongruently [24-26, 28, 30, 35, 41, 43, 44] cannot be considered convincing for
      the reasons given above; this conclusion is influenced by such factors as experimental procedure, the presence of impurities,
      and changes in the initial concentration of samples during measurements.
    - Our data do not confirm the occurrence of a peritectic compound in the concentration range 37-66 mol % Al2O3 [24-27,
      44].
    - The calculations of this peritectic composition performed in [45] are based on the thermodynamic data obtained in mass
      spectrometric experiments with the use of the Knudsen effusion method for the Al6Si2O13-Al2O3 and CaAlSi2O8-Al6Si2O13-Al2O3
      equilibria in the temperature range 1472-1761 K; these temperatures are too low for obtaining reliable data.
    - In our view, the results of [45] cannot be considered sufficiently correct and require a detailed examination.
    - The reliability of the results of this work is substantiated by thermodynamic data, which unambiguously favor the congruent
      character of mullite melting.
    - It should be noted that the point of view expressed and substantiated by Toropov and Galakhov in [11, 23, 47, 65-67]
      is often (for instance, in [25, 52, 71-73]) unjustly ignored in considering the properties of the Al2O3-SiO2 system.
    - To summarize, we performed a mass spectrometric study with the use of the Knudsen effusion method of vaporization of
      Al2O3-SiO2 melts. The mass spectrometric data and the results obtained in studying the phase diagram of the Al2O3-SiO2
      system in the mullite region by the method of quenching allowed us to refine the position of the liquidus line in this
      system and prove the congruent character of mullite melting at 2180 K.
    - Mainly, our data are in agreement with the phase diagram of the Al2O3-SiO2 system constructed by Toropov and Galakhov
      and provide a basis for thermodynamic calculations of the properties of this system.
  context_id: shornikov-2000-aluminosilicate-vaporization::context::shornikov_2000_conclusion_page682
  work_id: 3daf726453f360957687fa6798173c7421056e79f9684c5dd8a6df38d696ab0d
  source_id: shornikov-2000-aluminosilicate-vaporization
  species: Al2O3
