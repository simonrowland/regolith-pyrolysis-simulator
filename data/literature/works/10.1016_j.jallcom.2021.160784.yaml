- observation_id: chatain_2021_theoretical_entropy_function
  type: model_equation_context
  locator:
    page: 13
    section: 5.2 Results
    equation: theoretical entropy function
  units: J K-1 mol-1 as reported for S°298.15
  values:
    quantity_as_printed: absolute theoretical standard entropy S(T)
    method_class: quoted_attributed
    attribution: Chatain et al. (2021), authors' ab initio/quasi-harmonic model
    method_class_reason: The function is calculated from the authors' model; its inputs are not fully stored, so quoted_attributed
      is used under d-110.
    formula_as_printed: S = Nk_B(4D(x_D) - 3ln(1 - e^(-x_D)) + Σ[i=4..3n] x_i/(e^(x_i)-1) - ln(1 - e^(-x_D)))
    variable_definitions_as_printed: x_i = hν_i(0)/(k_B T); x_D = Θ_D/T; D(x_D) is the Debye function.
    final_log_term_as_rendered: x_D
    formula_render_check: PDF page 13, 600 dpi; the final logarithm subscript is printed as D and is retained as printed.
    status: typed_refused_schema_gap
    schema_gap: Quantity.S exists, but select_declared_source in simulator/battery/migrate.py has no generic source form for
      this entropy function; the formula is retained as typed-refused model context rather than approximated as S-S298 or
      a numeric series.
