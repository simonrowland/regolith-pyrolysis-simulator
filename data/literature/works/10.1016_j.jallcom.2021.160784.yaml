- observation_id: chatain_2021_gibbs_thermodynamic_relations
  type: thermochemical_cycle_context
  locator:
    page: 15
    section: 6.1 Heat capacity measurements
    equations: (6)-(8)
  units: as printed
  values:
    formulae_as_printed:
      equation_6: ΔfG°(T) = ΔfH°(T) − TΔfS°(T)
      equation_7: ΔfH°(T) = ΔfH°298 K + ∫[298.15 K..T] Cp(T)dT − Σ[H°(T) − H°298 K]elements
      equation_8: ΔfS°(T) = S°298 K + ∫[298.15 K..T] [Cp°(T)/T]dT − ΣS°(T)elements
    status: context_only
    note: Equation (8) is a formation-entropy function with an absolute S°298 K anchor; the paper does not print a separate
      relative S-S298 table or numeric H(T)-H(298) values.
  context_id: chatain-2021-nacro2-thermodynamics::context::chatain_2021_gibbs_thermodynamic_relations
