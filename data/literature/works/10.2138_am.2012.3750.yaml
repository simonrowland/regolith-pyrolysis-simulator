- observation_id: ozawa_2012_rate_law_and_alpha_scope
  type: equation_context
  locator:
    page: 12
    published_page: 91
    pdf_page_index: 11
    equation: 1–2
  units: as printed
  values:
    method_class: model_derived
    quantity_as_printed: nominal surface-retreat rate and mass-loss geometry equations
    equation_1_as_printed: J_nom^(hkl) = sum_i^N (a_i/A_0) J_i
    equation_2_as_printed: Delta w = w0 - w = rho_Fo [a0 b0 c0 - (a0 - integral_0^t J_nom^(100) dt)(b0 - integral_0^t J_nom^(010)
      dt)(c0 - integral_0^t J_nom^(001) dt)]
    printed_rate_definition: J_i is the retreat velocity of an evaporating facet; J_nom is the nominal overall evaporation
      rate (mean retreat rate of a surface).
    coefficient_disposition: The paper does not report a vapour evaporation coefficient alpha. Alpha_min,25/26 are isotope
      fractionation factors; alpha_hkl = Esl/(RT) is a roughening parameter, not a vapour accommodation coefficient.
    alpha_hkl_range_as_printed: 0.5 to 15
    alpha_hkl_roughening_transition_as_printed: about 3
    model_energy_ratio_range_as_printed: 0.37 to 0.87
