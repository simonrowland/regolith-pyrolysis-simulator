- observation_id: shornikov_2024_sample_and_data_qualifications
  type: characterization
  locator:
    page: 3
    published_page: 569
    pdf_page_index: 2
    section: Experimental
  units: as printed
  values:
    quantity: sample_characterization_and_qualifications
    method_class: measured_direct
    starting_materials:
      tag: unknown
      reason: not_published
    sample_purity:
      tag: unknown
      reason: not_published
    as_prepared_quantitative_composition:
      tag: unknown
      reason: not_published
    post_run_composition_or_phase_analysis:
      tag: unknown
      reason: not_published
    qualifications:
    - CaSiO3+ fragments by about half into CaSi+, CaSiO+, and CaSiO2+ ions.
    - MoOi+ ions (i = 0–3) are attributed to molybdenum-cell evaporation and interaction of wollastonite with the cell, producing
      gaseous molybdenum oxides.
    - Predominance of SiO and smaller amounts of oxygen-deficient Si2O2 and Ca are attributed to reducing processes from melt–cell
      interaction, which lowers oxygen partial pressure.
    - CaSiO3 gaseous-oxide content increases with temperature, which the authors interpret as decreasing dissociation.
    - Logarithmic atomic-Ca and atomic-O partial-pressure dependences on inverse temperature coincide; the authors infer a
      significant effect of the calcium component on evaporation.
    - CaO and SiO2 activities are approximately 0.015 and 0.20, respectively, and increase slightly with temperature.
    - CaO activities are close to [12] and [23] and slightly above [17]; SiO2 activities correspond to [8], [14], [20], [21],
      and [23] and differ slightly from [11] and [15].
    - The introduction describes earlier determinations below 1000 K as extensive but rather inaccurate; it reports spreads
      up to 7 J/(mol × K) in heat capacity, 5 kJ/mol in enthalpy, and 3 J/(mol × K) in entropy. The authors suggest incomplete
      matching of natural and synthetic sample phases as a possible cause.
    - At 1873 K the introduction says CaO activities from Sakagami [7] and Sawamura [9] differ by almost 70 times, while SiO2
      activities from Fulton and Chipman [11] and Jakobsson and Tangstad [19] differ by more than two times.
    - Mixing energies coincide with [19] and [23] and exceed the experimental [9], [13], [18], [22] and theoretical [15],
      [35] values by about 2 kJ/mol.
    - Formation enthalpy and entropy were fitted by least squares over 1751–1818 K for the crystalline phase and 1818–2087
      K for the liquid phase.
    - Melting enthalpy and melting point were calculated from the liquid-minus- crystalline enthalpy and entropy differences.
    - Table 1 melting results are said to agree satisfactorily with calorimetry [36]–[40] and thermochemical calculations
      [35] within error limits.
    citation_spelling_notes:
    - Figure 2 caption prints “Sangbongi”; reference [8] prints “Sanbongi”.
    - Figure 3 caption prints “Jacobsson”; reference [19] prints “Jakobsson”.
  context_id: shornikov-2024-wollastonite-evaporation::context::shornikov_2024_sample_and_data_qualifications
