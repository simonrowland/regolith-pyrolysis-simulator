context:
- observation_id: mavrogenes_oneill_1999_sulfide_solubility_mafic_magmas_experimental_methods_and_quench
  type: method_context
  locator:
    page: 4
    pdf_page_index: 3
    published_page: 1176
    section: Experimental Design
  units: Oxide compositions wt%; sulfur ppm; duration h; pressure kb; temperature °C; method parameters retain their printed
    units.
  values:
    starting_materials_as_printed: Powdered glasses of basaltic and picritic composition (Table 1), plus 2% synthetic FeS,
      were loaded into capsules.
    capsule_loading_as_printed: Fe, Fe40Ir60 or Fe20Ir80 (atomic proportions) alloy capsules with tight-fitting lids of the
      same metal composition.
    major_elements_analysis_as_printed: Major elements and sulfur were analyzed on the Cameca Microbeam electron probe at
      the Research School of Earth Sciences, ANU.
    sulfur_analysis_as_printed: WDS sulfur analyses of silicate glass used a PET crystal, 15 kV accelerating voltage, 40 nA
      sample current, 2 min counting time, troilite standard; limit of detection 60–70 ppm.
    quench_statement_as_printed: All runs quenched to a homogenous silicate glass containing blebs of immiscible sulfide.
    quench_preservation: not_stated; the paper notes homogeneous sulfur distribution in quenched glasses but does not explicitly
      state that sulfur concentration is preserved during quench.
    sulfide_phase_as_printed: Fe-Ir capsule sulfide was stoichiometric FeS and quenched to nearly pure troilite (Ir ≤ 500
      ppm); Fe-capsule sulfide quenched to troilite plus Fe metal.
    sulfide_composition_method: Image analysis of back-scattered-electron SEM images estimated phase proportions and original
      pre-quench composition in two Fe-capsule runs.
    anhydrite: No anhydrite phase or composition is reported in the paper.
  context_id: mavrogenes-oneill-1999-sulfide-solubility-mafic-magmas::context::mavrogenes_oneill_1999_sulfide_solubility_mafic_magmas_experimental_methods_and_quench
