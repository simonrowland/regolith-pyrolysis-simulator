    evidence_by_column:
      S_ppm: measured_direct; mean of twelve electron microprobe/WDS analyses of quenched glass
      observed_SD_ppm: reported standard deviation of twelve analyses; confidence level not stated
      S_calc_ppm: model_derived; calculated from regression Eqn. 10 and Table 3
      X_FeS: printed sulfide-phase composition; ND remains ND
      a_FeS_1_atm: model_derived activity relative to pure FeS at 1 atm; not the experimental total pressure
      delta_IW: buffer-relative calculated log fO2, ΔIW; not absolute log fO2
    schema_gap:
      printed_quantity: X_FeS, composition of coexisting sulfide phase
      decision: Preserve the printed values in each run context and row-linked typed refusal; do not map sulfide to matte
        or another near-miss phase role.
      code_symbols_checked:
      - tools/validate_literature_extracts.py::OBSERVATION_TYPES
      - simulator/battery/migrate.py::QUANTITY_ALIASES
      - simulator/battery/migrate.py::TYPE_QUANTITY
      - simulator/battery/migrate.py::_phase_role_token
      - simulator/battery/enums.py::PHASE_BASIS_TOKENS
      - simulator/battery/enums.py::PhaseRole
      existing_comparable_extract: park-2021-vanadium-thermodynamics-thesis stores equilibrium_phase_composition on the metal
        role with mole_fraction basis; it does not define a sulfide role.
    capsule_footnote_as_printed: Fe = Fe100Ir0, Fe40Ir60, and Fe20 = Fe20Ir20 alloy.
    capsule_footnote_discrepancy: The footnote prints Fe20Ir20, while Table 2 rows and methods print Fe20Ir80; row values
      are transcribed as printed and the footnote is retained verbatim.
    fO2_calculation: Table 2 footnote says log fO2 was calculated using thermodynamic data from Woodland and O’Neill (1977),
      with a_FeO = 1.7 X_FeO from Holzheid et al. (1997); the column is reported as ΔIW.
    coexisting_sulfide_description: Fe-Ir capsule runs contained stoichiometric FeS; quenched sulfide was nearly pure troilite
      (Ir ≤ 500 ppm), with no oxide discerned. Fe-capsule sulfide quenched to troilite and Fe metal; image analysis estimated
      pre-quench composition in two runs.
    anhydrite: not reported in the source
