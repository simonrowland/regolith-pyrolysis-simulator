      \n                                              41\n\n4.1.3 MgO-ZnO-SiO2\nFor the ternary MgO-ZnO-SiO2 system, the parameters\
      \ of liquid solutions for the\nbinary ZnO-SiO2 and ternary MgO-ZnO-SiO2 systems were optimized using the\nMQM model\
      \ with phase equilibria studies. For the binary ZnO-SiO2 system, the\noptimized Phase diagrams is shown in Figure 19.\
      \ For the ternary MgO-ZnO-SiO2\nsystems, SEM images and optimized phase diagrams are shown in Figure 20 to 25.\nThe\
      \ liquid solution parameters of ZnO-SiO2 systems were optimized with an\n                                          \
      \              \U0001D456\U0001D457  \U0001D456  \U0001D457               \U0001D45C\U0001D45C\nempirical equation,\
      \ a pair fraction model, ∆\U0001D454\U0001D434\U0001D435 = ∑ \U0001D454\U0001D434\U0001D435 \U0001D44B\U0001D434\U0001D434\
      \   \U0001D44B\U0001D435\U0001D435 (i , j ≥ 0; \U0001D454\U0001D434\U0001D435 =\n   \U0001D45C\n∆\U0001D454\U0001D434\
      \U0001D435 ), first with previous experimental data [83-86]. For the ternary MgO-ZnO-\nSiO2 liquid solution, the Kohler/Toop\
      \ asymmetric model was used because of the\ndifference in structure between MgO/ZnO and SiO2. The liquid solution parameters\n\
      for the MgO-ZnO-SiO2 system were optimized with the experimental results in this\nstudy and previous experimental data\
      \ [83-87]. All parameters were optimized\nutilizing the OptiSage function of FactSage software, considering nonlinear\n\
      optimization with mesh adaptive direct search algorithm, NOMAD [89], and the\nBayesian method [90]. The optimized calculation\
      \ for all systems fits the\nexperimental data well, as shown in Figures 19, and 21 to 24.\n  Figure 19 shows the optimized\
      \ phase diagram of ZnO-SiO2. The X-axis is the mole\nfraction of SiO2, whereas the Y-axis shows temperature. Experimental\
      \ data are also\nmarked as symbols. The dash-dot lines were calculated by the FactSage database,\nFToxid, while the\
      \ solid lines were calculated by the optimized parameters of the\nliquid solution in this study, using MQM with the\
      \ experimental data [83-86]. The\noptimized liquidus lines fit well with the experimental data, while the calculated\n\
      phase diagram using parameters of excess Gibbs energy from previous data [41]\nshowed gaps from the experimental data\
      \ [83,84,86]. The optimized parameter\nvalues for the binary ZnO-SiO2 system are shown in Table 7."
