      \               40\n\n  The liquidus lines of the ternary CaO-MgO-ZnO system calculated by the FactSage\ndatabase and\
      \ the optimized parameters in this study are shown in Figures 18 (a)\nand (b), respectively. The existence of invariant\
      \ eutectic point for two immiscible\nmonoxides, zincite, and liquid phases was expected between 1500 oC and 1550 oC\n\
      for the phase equilibria study because the liquid phase was not observed at 1500 oC\nbut observed at 1550 oC and 1600\
      \ oC. Figure 18 (a) shows that the invariant point\nwas not calculated because the liquid phase is in equilibrium with\
      \ a single monoxide\nbelow 1900 oC. However, the invariant point as eutectic point was calculated with\noptimized parameters\
      \ in this study. The eutectic point is 29.6 mol% CaO – 9.0 mol%\nMgO – 61.4 mol% ZnO at 1528 oC.\n\n\n\n\nFigure 18.\
      \ Liquidus lines of the ternary CaO-MgO-ZnO system: (a) FToxid database from FactSage,\n(b) Optimized lines from this\
