    printed_table_as_published: "Table 4. Optimized liquid MQM parameters for Ni-C, Co-C, Ni-Co, and Ni-Co-C systems\n\n \
      \        Liquid (L)                  Modified quasi-chemical model, MQM: (Ni,Co,C)\n                           Ni  \
      \    Co      C     Ni      Co\n                          \U0001D44DNiNi = \U0001D44DCoCo = \U0001D44DCC = \U0001D44D\
      NiCo = \U0001D44DNiCo =6\n    Coordination number\n                           Ni     Co        C      C\n          \
      \                \U0001D44DNiC = \U0001D44DCoC = 2, \U0001D44DNiC = \U0001D44DCoC =8\n        ∆\U0001D454NiC , J/mol\
      \     –24476 + 6.339 T + (4812 – 4.293 T) XNiNi + (1.979 T) X2NiNi\n        ∆\U0001D454CoC , J/mol     –10000 – 4.393\
      \ T – (1046) XCoCo + (2.929 T) X2CoCo\n        ∆\U0001D454NiCo , J/mol    444\n        001\n       \U0001D454NiCo(C)\
      \ , J/mol   0\n                                                °        °        °\n                               \
      \ *The values of \U0001D454Ni(l) , \U0001D454Co(l) , \U0001D454C(l) refer to the FactSage database, FSstel\n\n\n\n\n\
      \  Figures 8 (a) and (b) show the partial enthalpy of mixing of Co and C in a liquid\nsolution at 1600 oC and a phase\
      \ diagram of the Co-C system, respectively. For the\npartial enthalpy of mixing of Co and C at 1600 oC, the X-axis of\
      \ the graph is the\nmolar fraction of carbon in the Co-C system, whereas the Y-axis is the value of the\npartial enthalpy\
      \ of mixing of Co and C. The partial enthalpy of mixing of Co starts\nfrom 0 at pure Co composition, and decreases with\
      \ an increasing molar fraction of\nC. In contrast, the partial enthalpy of mixing of C starts from around -40 kJ/mol\n\
      with a dilute C content, and increases with an increasing molar fraction of C. The\nparameters of the liquid solution\
      \ of the Co-C system were optimized mainly\nconsidering the -40 kJ/mol of the partial enthalpy of mixing of C. The optimized\n\
      lines based on the values of the partial enthalpy of mixing of Co and C fit the\nexperimental data [62] well at a dilute\
      \ mole fraction of C in the Co-C system, while\ncalculated lines using parameters from previous studies [63] that showed\
      \ gaps from\nthe experimental data [62].\n  For the Co-C phase diagram, as shown in Figure 8 (b), the X-axis represents\
      \ the\nweight percentage of carbon, whereas the Y-axis represents temperatures in degrees\nCelsius. Solid solutions,\
      \ such as FCC and FCC+C phases, exist at lower\ntemperatures, while the liquid solution, such as the liquid phase, exist\
      \ at higher\ntemperatures. The optimized parameters of the liquid solution were also optimized\nby considering the experimental\
      \ data [51-53,57-61]. The optimized liquidus line fits\nwell with the experimental data, as it also has a similar tendency\
      \ to that shown in a\nprevious optimization study [63]. The optimized parameters of the Co-C liquid\nsolution are shown\
      \ in Table 4.\n\n\n\n\n                                                30"
