experiments:
- experiment_id: 10.1016/j.gca.2025.05.007::experiment::open-furnace-mvce-degassing-series
  kind: literature
  method:
    tag: value
    value: langmuir_free_evaporation
  sample:
    mass_kg:
      state:
        tag: value
        value:
          kind: interval
          interval_low: '0.000015'
          interval_high: '0.00005'
          approximate: false
      locator:
        table: S1
        note: Printed powder mass est. (mg) column spans 15 to 50 mg across 81 runs; SI unit conversion only (mg to kg).
      inference:
        relation: mg_to_kg
        inputs:
        - m_kg = m_mg / 1e6
        - original_unit=mg
        parameters:
        - - original_low
          - state:
              tag: value
              value: '15'
            locator:
              table: S1
              note: Printed powder mass est. (mg) column spans 15 to 50 mg across 81 runs; SI unit conversion only (mg to
                kg).
        - - original_high
          - state:
              tag: value
              value: '50'
            locator:
              table: S1
              note: Printed powder mass est. (mg) column spans 15 to 50 mg across 81 runs; SI unit conversion only (mg to
                kg).
        - - factor
          - state:
              tag: value
              value: '1000000'
            locator:
              table: S1
              note: Printed powder mass est. (mg) column spans 15 to 50 mg across 81 runs; SI unit conversion only (mg to
                kg).
        output_unit: kg
    printed_composition:
      state:
        tag: unknown
        reason: not_published
      locator:
        table: '1'
        note: Multiple Bulk Comp labels (MVE O2, KFCMAS 3, KFCMAS 3 S, KFCMAS 4, …); no single series composition. Compositions
          remain on observation rows / Table 2.
    form:
      state:
        tag: value
        value: silicate melt bead on a Pt or Re wire loop
      locator:
        table: S1
        note: Loop Comp column Pt or Re; bead & loop mass (mg) column. Not a Knudsen cell.
  conditions:
    temperature_K:
      state:
        tag: unknown
        reason: experiment temperature not published
  pressure_environment:
    total_pressure_Pa:
      state:
        tag: value
        value:
          kind: point
          point: '101325'
          approximate: false
      locator:
        table: '1'
        note: footnote atm=atmospheric air; Ex 7 log10 fO2=-0.68 air row
      inference:
        relation: extract_inference
        inputs:
        - P_Pa = P_atm × 101325
        - original_unit=atm
        - inferred=true
        - Numeral 1.0 is not printed. Table 1 / S1 footnote prints atm=atmospheric air. Table 1 Ex 7 prints log10 fO2=-0.68,
          the air value (fO2 approx 0.21) at 1 atm total. The 1.0 atm scalar is inferred from that printed air token, not
          a table-cell 1.0.
        - extract_value=1.0 atm
        - extract_field=chamber_pressure
        - unit_conversion=atm_to_Pa
        parameters:
        - - original
          - state:
              tag: value
              value: '1'
            locator:
              table: '1'
              note: footnote atm=atmospheric air; Ex 7 log10 fO2=-0.68 air row
        - - factor
          - state:
              tag: value
              value: '101325'
            locator:
              table: '1'
              note: footnote atm=atmospheric air; Ex 7 log10 fO2=-0.68 air row
        output_unit: Pa
    sweep_gas:
      state:
        tag: unknown
        reason: not_published
      locator:
        table: S1
        note: Per-run CO/CO2/N2/SO2 flows (cm3/min) or atmospheric air with all flows 0 (footnote atm=atmospheric air). SweepGas
          cannot hold the full 81-row flow matrix or the air-vs-mixture alternative set at series level without selecting
          a single mixture; printed flows remain in Table S1 observation rows.
    regime:
      regime_class:
        tag: value
        value: viscous
  work_id: 10.1016/j.gca.2025.05.007
  locator:
    table: '1'
    note: 81 tabulated runs (Tables 1 and S1). Per-run T, log10 fO2, log10 fS2, duration, bulk composition, loop, gas flows,
      and quench remain in observation rows; this experiment record is the series instrument assignment.
  apparatus:
    cell_material_and_liner:
      state:
        tag: value
        value: Pt or Re wire loop (not a Knudsen cell)
      locator:
        table: S1
        note: Loop Comp column; Pt or Re as printed
  fO2_control:
    channel:
      tag: value
      value: gas_mix
    buffer:
      state:
        tag: value
        value: gas mixing and atmospheric air; printed log10 fO2 from -9 to -0.68 (air)
      locator:
        table: '1'
        note: Table 1/S1 log10 fO2 column; abstract fO2 10^−9 to atmospheric. Air rows print -0.68. fS2 0 or 10^−3 to 10^−2
          where SO2 flow is used.
  bench_id: 10.1016/j.gca.2025.05.007::bench::gas-mixing-furnace-1atm
  thermal_schedule:
    setpoints_and_holds:
    - temperature_K:
        state:
          tag: value
          value:
            kind: interval
            interval_low: '1480'
            interval_high: '1773'
            approximate: false
        locator:
          paragraph: abstract
          note: Abstract prints 1480–1773 K; Table 1/S1 Temperature K column matches that envelope.
    total_duration_s:
      state:
        tag: value
        value:
          kind: interval
          interval_low: '300'
          interval_high: '83880'
          approximate: false
      locator:
        table: S1
        note: Printed Time, minutes column spans 5 to 1398 min across 81 runs; SI conversion only. Abstract envelope is 5
          min to 24 h.
    cooling_or_quench:
      state:
        tag: value
        value: drop or air quench; run assignment varies (Table S1 quench type)
      locator:
        table: S1
        note: quench type column prints drop or air
benches:
- id: 10.1016/j.gca.2025.05.007::bench::gas-mixing-furnace-1atm
  work_id: 10.1016/j.gca.2025.05.007
  identity:
    basis: described_in_this_work
  apparatus_family:
    state:
      tag: value
      value: gas-mixing furnace
    locator:
      paragraph: abstract
      note: 'LSU Scholarly Repository / publisher abstract (PDF unseen). Printed wording: subject MVCE-bearing silicate melt
        to variable T, fO2, fS2, and duration using a gas-mixing furnace where evaporation can occur.'
  detector:
    state:
      tag: value
      value: EPMA majors (Table S1) and LA-ICP-MS MVCE profiles (Table S2); not a Knudsen-cell mass spectrometer
    locator:
      table: S1
      note: Table S1 is run conditions + EPMA majors; Table S2 is MVCE Analyses (LA-ICP-MS counts). Abstract states chemical
        analyses completed using core to rim transects for major elements and MVCEs.
  temperature_measurement:
    sensor:
      state:
        tag: unknown
        reason: not_published
      locator:
        paragraph: abstract
        note: No thermocouple or pyrometer statement in the abstract or in Tables 1/S1 column headers.
  temperature_calibration:
    uncertainty:
      state:
        tag: unknown
        reason: not_published
      locator:
        paragraph: abstract
        note: No printed calibration uncertainty for the furnace temperature sensor.
  heating_method:
    state:
      tag: unknown
      reason: not_published
    locator:
      paragraph: abstract
      note: Abstract names a gas-mixing furnace but does not print the heating element, hot-zone geometry, or temperature-control
        hardware. Typeset Methods PDF was not obtained this round (ScienceDirect/LSU JS challenge), so heating_method is left
        unknown rather than invented.
