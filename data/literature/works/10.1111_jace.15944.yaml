- observation_id: christopoulou_2019_reported_numeric_methods_and_phase_results
  type: method
  locator:
    page: 7
    section: Activation energy determination by the Kissinger method
  units: as printed
  values:
    quantity: reported_numeric_method_and_phase_context
    method_class: quoted_unattributed
    kissinger_equation_1: ln(a/T0^2) = -Ea/(R*T0) + C; a is heating rate, T0 is exothermic peak temperature in K; slope of
      ln(a/T0^2) versus 1/T0 gives Ea.
    avrami_equation_2: n = (2.5/ΔT) * T0^2/(Ea/R); ΔT is the full width at half maximum of the exothermic peak.
    avrami_growth_dimensions:
    - 1
    - 2
    - 3
    avrami_growth_dimension_meaning: one-, two- or three-dimensional crystal entities
    avrami_nucleation_values:
    - 0
    - 1
    avrami_nucleation_0: instantaneous
    avrami_nucleation_1: sporadic
    diffusion_controlled_threshold_n_greater_than: '2.5'
    polymorphic_transformation_threshold_n_greater_than: 4
    first_crystallization_event_for_all_samples_approximately_C: 1250
    tetragonal_leucite_ICDD: 01-076-8737
