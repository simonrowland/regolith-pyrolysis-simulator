- observation_id: christopoulou_2019_reported_qualifications_and_directions
  type: characterization
  locator:
    page: 2
    section: Abstract
    note: Verbatim direction and qualification statements are carried in this context payload and the companion extraction
      report.
  units: as printed
  values:
    quantity: directional_and_qualifying_claims
    method_class: quoted_unattributed
    reason: These are prose statements, not figure-derived values; absent table cells and figure-only curves are not reconstructed.
    statements:
    - locator: PDF page 2, abstract
      quote: Kalsilite is an unstable phase that behaves as an intermediate precursor to leucite.
    - locator: PDF page 2, abstract
      quote: Crystalline materials in which kalsilite is the major phase lose potassium upon prolonged heat treatment (1000
        hours at 1250°C), in contrast to those with leucite, in which little or no compositional alteration is detected.
    - locator: PDF page 2, abstract
      quote: The formation of leucite from stoichiometric kalsilite is accompanied by the formation of potassium doped alumina.
    - locator: PDF page 2, abstract
      quote: The activation energies for leucite and kalsilite crystallization, determined via application of the Kissinger
        equation to thermal analysis data, were 579 kJ/mol and 548 kJ/mol respectively.
    - locator: PDF page 2, abstract
      quote: Finally, production of pure leucite can be achieved with more favourable crystallization kinetics when starting
        with off-stoichiometric compositions.
    - locator: PDF page 5, section 1.3
      quote: In some studies, in which leucite was synthesized, kalsilite was detected as a non-stable reaction product that
        vanishes with prolonged heat treatment.
    - locator: PDF page 9, section 3.1
      quote: For short heat treatment times (up to 24 hours), all compositions formed the primary phases expected from the
        K2O-Al2O3-SiO2 phase diagram, i.e. samples KAS-1 and KAS-2 formed leucite, KAS-3 and KAS-4 a mixture of leucite and
        kalsilite, and KAS-5 formed kalsilite.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: Crystallization of leucite occurs very rapidly, in less than 5 minutes for sample KAS-1 and less than 15 minutes
        for sample KAS-2.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: samples KAS-1 and KAS-2 are X-ray amorphous prior to heat treatment. After heat treatment at 1250°C for up to
        1000 hours and 24 hours, respectively, they both formed only tetragonal leucite (ICDD 01-076-8737) without any phase
        transformation or development of second phases.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: Sample KAS-2 formed only leucite so long-term (after 24 hours) experiments were not performed.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: At 850°C kalsilite peaks are stronger compared to those of leucite, with high levels of amorphous phase remaining.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: At higher temperature (950°C) the proportion of leucite increases and kalsilite is still present, and there is
        little, if any, amorphous phase.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: At even more elevated temperatures (1250°C), kalsilite is not detectable and leucite is the sole crystalline
        phase, with no evidence of amorphous phase.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: The quantity of kalsilite decreases with increasing heat treatment times and as tetragonal leucite forms but
        at 1000 hours it does not appear to have reduced any further suggesting that an equilibrium has been achieved.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: The crystallization process for sample KAS-3 takes longer (< 30 minutes) than for samples KAS-1 and KAS-2.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: The complete transition from hexagonal to orthorhombic kalsilite is accompanied by the formation of leucite after
        between 1 hour and 24 hours of heat treatment at 1250°C.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: this transition being detected by XRD after about 24 hours (KAS-4) and 500 hours (KAS-5) of heat treatment (Figure
        9 and Figure 10)
    - locator: PDF page 11, section X-ray powder diffraction
      quote: It is unclear whether hexagonal kalsilite first transforms to orthorhombic kalsilite which then gradually transforms
        to leucite, or whether orthorhombic kalsilite and leucite form simultaneously.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: Moreover, crystallization occurs rapidly, in less than 15 minutes.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: Once again, kalsilite gradually transforms to leucite with increasing heat treatment time at 1250°C.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: In the early stages of crystallization (< 24 hours) for sample KAS-5 hexagonal kalsilite forms, which then transforms
        into orthorhombic kalsilite with simultaneous formation of tetragonal leucite and hexagonal potassium aluminium oxide.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: Even for sample KAS-5, which has the kalsilite stoichiometry, a small amount of leucite forms after prolonged
        heat treatment.
    - locator: PDF page 12, section Raman spectroscopy
      quote: The gradual shift to lower Raman shifts of the overall peak position and profile, on moving from sample KAS-1
        to KAS-5, is fully consistent with the increasing network modifier oxide (K2O) through this series, confirming increasing
        depolymerisation of the aluminosilicate network from sample KAS-1 to KAS-5.
    - locator: PDF page 12, section Raman spectroscopy
      quote: The large width of these bands confirms the high presence of amorphous phase in the examined materials, and also
        a distribution of Q-species consistent with a depolymerised tetrahedral amorphous network.
    - locator: PDF page 12, section Raman spectroscopy
      quote: A peak around 1020 cm-1 which is present in the spectra for samples KAS-4 and KAS-5, and which is more prominent
        in the spectrum for sample KAS-3 is attributed to impurities in the materials and, more specifically, residual or
        reaction product carbonate.
    - locator: PDF page 13, section Raman spectroscopy
      quote: Oxide glasses with high K2O contents have the tendency to react with the atmosphere and form K2CO3.
    - locator: PDF page 13, section Raman spectroscopy
      quote: The authors were unable to find any existing literature data regarding the Raman spectrum of orthorhombic kalsilite.
    - locator: PDF page 13, section Raman spectroscopy
      quote: The Raman spectrum of sample KAS-5 is not the same as that of hexagonal kalsilite.
    - locator: PDF page 13, section Raman spectroscopy
      quote: The observed modes in the ranges of ca. 240-260 cm-1, 275-325 cm-1, 350-370 cm-1, 380-400 cm-1, 450-470 cm-1
        and 900-950 cm-1 for samples KAS-3, KAS-4 and KAS-5 cannot be fully identified, however, some or all of them may be
        attributable to orthorhombic kalsilite.
    - locator: PDF page 13, section Raman spectroscopy
      quote: The presence of high frequency modes at 1000-1200 cm-1 could be related to residual aluminosilicate glass and
        could also be evidence of small amounts of residual silica in these samples.
    - locator: PDF page 13, section Chemical characterization
      quote: in samples KAS-1 and KAS-2, which have compositions in the leucite phase field (SiO2-rich), no potassium loss
        was observed after heat treatment at 1250°C.
    - locator: PDF page 13, section Chemical characterization
      quote: potassium loss was significantly lower (1.5 wt%) compared to the samples (KAS-4 and KAS-5) with compositions
        closer to the stoichiometry of kalsilite (2.7-3.6 wt%) for the same heat treatment conditions.
    - locator: PDF page 14, section Chemical characterization
      quote: in the case of potassium loss it is unclear in which chemical form the potassium is volatilised or evolved.
    - locator: PDF page 14, section Thermal analysis
      quote: moving from the leucite phase field glass samples KAS-1 to KAS-3, the first crystallization exotherm moves to
        higher temperatures. This is contrary to the kalsilite phase field glasses, KAS-4 and KAS-5, for which it moves to
        lower temperatures.
    - locator: PDF page 14, section Thermal analysis
      quote: The exotherm of sample KAS-1 at a heating rate 5°C/min was extremely weak so it was not included in the results
        presented here.
    - locator: PDF page 14, section Thermal analysis
      quote: For these three samples, a strong anomaly is observed just before the first crystallization event, which may
        relate to an endothermic event, probably a rearrangement of the structure of the amorphous phase.
    - locator: PDF page 14, section Thermal analysis
      quote: The main exothermic peak for samples KAS-1, KAS-2 and KAS-3 relates to the development of leucite.
    - locator: PDF page 14, section Thermal analysis
      quote: all of the exothermic peaks increase in intensity, become broader and shift to higher temperatures with increasing
        heating rate.
    - locator: PDF pages 14-15, section Thermal analysis
      quote: The peaks become wider because at higher heating rates the spatial gradient of temperature in the sample will
        increase. At a higher Φ, the reaction in the sample requires less time.
    - locator: PDF page 15, section Thermal analysis
      quote: DSC results (Figure 12f) show only one crystallization event for these materials as the formation of a second
        phase is both temperature- and time-dependent.
    - locator: PDF page 15, section Thermal analysis
      quote: The calculated activation energy of crystallization varies considerably for the different samples.
    - locator: PDF page 15, section Thermal analysis
      quote: According to XRD data, when samples KAS-3, KAS-4 and KAS-5 were heat treated at 1250°C the formation of the primary
        crystallization phase occurs rapidly and then a second phase appears at longer heat treatment times.
    - locator: PDF page 15, section Thermal analysis
      quote: For the glass samples with intermediate compositions, the activation energies are much lower, as shown in Figure
        13, with the lowest activation energies (samples KAS-3 and KAS-4, 364 and 360 kJ/mol) determined for the samples which
        are compositionally furthest away from the stoichiometric compounds.
    - locator: PDF page 16, section 3.3
      quote: The combined average shape factor (Avrami constant) was similar, as depicted in Table 5, for all sample data,
        which indicates that the crystal formation process for all samples is three-dimensional growth and nucleation which
        follows the diffusion-controlled mechanism with increasing nucleation rate.
    - locator: PDF page 16, section 4 Discussion
      quote: Then, after prolonged heat treatment – with the exact time varying depending on composition – kalsilite transforms
        to leucite with an accompanying loss of potassium as measured by XRF.
    - locator: PDF page 17, section 4 Discussion
      quote: Again, it is not confirmed in which chemical form the potassium volatilises, but we have depicted it here as
        K2O.
    - locator: PDF page 17, section 4 Discussion
      quote: The formation of this K-β-alumina is related to the starting composition and the excess of alumina in the system
        and is not observed when leucite is formed from its stoichiometric mixtures.
    - locator: PDF page 17, section 4 Discussion
      quote: The formation of K-β-alumina, as described in Eq. 4, requires significantly more alumina than potassium oxide;
        thus if this excess of alumina is not present, the ejected potassium may evaporate without K-β-alumina forming, as
        occurs in the case of sample KAS-4 sample, where even though the potassium loss is higher than for sample KAS-5, K-β-alumina
        is not formed.
    - locator: PDF page 18, section 4 Discussion
      quote: XRD results do not indicate the presence of residual silica in the KAS-3 to KAS-5 samples which is important
        for the second mechanism, however, Raman spectroscopy has indicated the presence of some retained silicate glass for
        samples KAS-3, KAS-4 and KAS-5.
    - locator: PDF page 18, section 4 Discussion
      quote: The second transformation mechanism is also possible in the case of sample KAS-1 (leucite composition) where
        at lower temperatures kalsilite is initially formed.
    - locator: PDF page 18, section 4 Discussion
      quote: The starting glass compositions are potassium-deficient compared to kalsilite, which may explain why there is
        no loss of potassium in this case.
    - locator: PDF page 18, section 4 Discussion
      quote: XRD results suggest that these reactions will continue until all kalsilite transforms to leucite at elevated
        temperatures.
    - locator: PDF page 19, section 4 Discussion
      quote: the formation of leucite is possible with any starting composition along the leucite-kalsilite tie-line; especially
        here for sample KAS-2 with leucite as the sole crystalline phase, the activation energy is significantly lower (by
        100 kJ/mol) compared with sample KAS-1.
    - locator: PDF page 19, Conclusions
      quote: Samples in which kalsilite is the main phase lose potassium after prolonged heat treatment (1000 hours) as opposed
        to samples in which leucite is the major phase formed at 1250°C, in which no compositional alteration was detected
        with time or temperature.
    - locator: PDF page 19, Conclusions
      quote: Leucite begins to develop from kalsilite either with increasing temperature for samples close to leucite stoichiometry
        or with increasing time at 1250°C for the samples close to kalsilite stoichiometry.
    - locator: PDF page 19, Conclusions
      quote: Taking into consideration the results of this study, in combination with literature, it seems more likely that
        the second mechanism is taking place during this phase transformation.
    - locator: PDF page 9, section 3.1
      quote: the selected heat treatment temperature of 1250°C is below the liquidus temperature for all compositions studied,
        hence all compositions were expected to crystallise.
    - locator: PDF page 9, section 3.1
      quote: Prolonged heat treatment altered the phases present in some of the samples as discussed below.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: This suggests that leucite is a stable crystalline phase in terms of time at 1250°C.
    - locator: PDF page 10, section X-ray powder diffraction
      quote: orthorhombic potassium aluminium silicate, kalsilite51, (ICDD 00-033-0988) and tetragonal leucite peaks form
        simultaneously, as suggested by the phase diagram wherein the composition of KAS-3 lies on a phase field boundary.
    - locator: PDF page 11, section X-ray powder diffraction
      quote: For sample KAS-4, Figure 9 illustrates that at the beginning of crystallization most of the diffraction peaks
        are matched by hexagonal kalsilite.
    - locator: PDF page 12, section Raman spectroscopy
      quote: It is important to stress that our study confirms that during the transformation of kalsilite to leucite, K-β-alumina
        is also formed. To our knowledge this has not been previously reported, and its formation may modify the properties
        of the products produced via the kalsite-to-leucite conversion.
    - locator: PDF page 12, section Raman spectroscopy
      quote: In the aforementioned studies where this phase transformation was examined, reported XRD data started from 10°
        2θ, which may explain why K-β-alumina has not previously been associated with the kalsilite-leucite phase transition.
    - locator: PDF page 13, section Raman spectroscopy
      quote: Figure 11b shows Raman spectra demonstrating the effects of heat treatment on glass samples which exhibit stronger,
        sharper Raman bands consistent with the existence of crystalline phases.
    - locator: PDF page 13, section Raman spectroscopy
      quote: Samples KAS-1 and KAS-2 produce Raman spectra corresponding to tetragonal leucite57. As confirmed by XRD, samples
        KAS-3 and KAS-4 form orthorhombic kalsilite whilst sample KAS-5 forms hexagonal kalsilite.
    - locator: PDF page 14, section Chemical characterization
      quote: These results suggest that chemical stability is strongly connected with the starting composition and hence the
        amount of kalsilite formed at 1250°C, since apart from the starting chemical composition all of the remaining experimental
        conditions (electric furnace, temperature and heat treatment duration) and the analysis settings (XRF calibration
        and fused bead sample making) were identical for all the samples under investigation.
    - locator: PDF page 14, section Chemical characterization
      quote: even though the XRF results are presented as oxides
    - locator: PDF page 14, section Thermal analysis
      quote: As depicted in Figure 12, DSC curves show one strong exothermic peak related to the main crystallization event.
    - locator: PDF page 15, section Thermal analysis
      quote: then increasing again to 548±1 kJ/mol for sample KAS-5 (stoichiometric kalsilite), indicating that the formation
        of kalsilite is kinetically favoured.
    - locator: PDF pages 16-17, section 4 Discussion
      quote: This mechanism shows that after prolonged heat treatment, kalsilite will completely transform to leucite, particularly
        in the case of stoichiometric kalsilite. In this case some of the ejected potassium will react with alumina to form
        K-β-alumina, and the remainder will evaporate, according to Eq. 4.
    - locator: PDF page 17, section 4 Discussion
      quote: The formation of potassium aluminium oxide, or K-β-alumina, has been confirmed by XRD for KAS-5 samples when
        heat treated at 1250°C and seems to be more applicable only for the samples that are stoichiometrically close to kalsilite.
    - locator: PDF page 18, section 4 Discussion
      quote: Kalsilite will transform to leucite by reacting with SiO2 from the amorphous phase. This reaction will create
        in the system an excess amount of potassium and aluminium. In addition, some of the potassium will react with the
        remaining aluminium forming potassium aluminium oxide (K-β-alumina) and the rest will evaporate as described in Eq.4.
    - locator: PDF page 18, section 4 Discussion
      quote: XRF (Table 4) reveals that sample KAS-1 will not have any elemental alteration as a function of heat treatment
        time.
    - locator: PDF page 19, Conclusions
      quote: Heat treatment of glasses in the ternary K2O-Al2O3-SiO2 system has revealed that kalsilite is an unstable phase
        at 1250°C and that it behaves as an intermediate precursor of leucite.
    - locator: PDF page 19, Conclusions
      quote: For both mechanisms, in the case of the stoichiometric kalsilite sample (KAS-5) the excess potassium evaporates,
        and some reacts with the additional aluminium oxide existing in the system (KAS-5) to form KAl11O17 (K-β-alumina).
