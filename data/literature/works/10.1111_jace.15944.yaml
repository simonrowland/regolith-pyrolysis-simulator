- observation_id: christopoulou_2019_attributed_statements
  type: characterization
  locator:
    page: 6
    section: Introduction
  units: as printed
  values:
    quantity: attributed_statements
    method_class: quoted_attributed
    statements:
    - locator: PDF page 6, section 1.3
      attribution: Zhang et al. [36]
      quote: Zhang et al.36 reported that the formation of kalsilite is a transitional stage that leads to crystallization
        of leucite.
    - locator: PDF page 6, section 1.3
      attribution: Studies [27,43]
      quote: Moreover, in some studies it is indicated that the prolonged heat treatment of natural or synthesized kalsilite
        at elevated temperatures will gradually lead to a complete conversion to leucite and this phenomenon is believed to
        relate to the high volatility of potassium.27,43
    - locator: PDF page 11, section X-ray powder diffraction
      attribution: Capobianco et al. [43]
      quote: Capobianco et al.43 obtained orthorhombic kalsilite by annealing natural hexagonal kalsilite at 1200°C in open
        Pt crucibles for 48 hours, which is not inconsistent with our results.
    - locator: PDF page 11, section X-ray powder diffraction
      attribution: Studies [29,30,36]
      quote: The unstable nature of kalsilite is also described in other studies29,30,36 which show that it probably acts
        as a precursor of leucite.
    - locator: PDF page 15, section Thermal analysis
      attribution: Studies [59,60]
      quote: It is believed59,60 that if the melt and the crystal are identical in composition, the crystal growth rate is
        controlled by interface reactions, but if the composition of the melt differs to that of the crystal, both interdiffusion
        and the interface reactions can control crystal growth which may explain the lower activation energies for the KAS-2
        sample and particularly for the KAS-3 and KAS-4 samples.
    - locator: PDF page 16, section 3.3
      attribution: Studies [36,37,61]
      quote: The three-dimensional nucleation and crystal growth mechanism for kalsilite and leucite samples has also been
        reported in other studies.36,37,61
    - locator: PDF page 16, section 4 Discussion
      attribution: Literature [27,43]
      quote: XRD analysis has demonstrated that kalsilite is unstable at elevated temperatures (1250°C) and will transform
        into leucite as a function of time, as also reported in the literature.27,43
    - locator: PDF page 18, section 4 Discussion
      attribution: Zhang et al. [36]
      quote: Indeed, Zhang et al.36 determined by the Kissinger method44 that the activation energy for crystallization of
        kalsilite is lower than that of leucite, which is consistent with the results of this work.
    - locator: PDF pages 18-19, section 4 Discussion
      attribution: Abbot [67]
      quote: According to Abbot67 orthorhombic kalsilite is more likely to be a metastable phase.
    - locator: PDF page 19, section 4 Discussion
      attribution: Studies [29,31,68]
      quote: Nucleation and growth kinetics can be altered by the addition of nucleating agents29,31,68 such as leucite nanocrystals,
        which lead to the elimination of kalsilite as an intermediate crystallization product, and the formation of leucite
        at lower temperatures.
  context_id: christopoulou-2019-jace102-508-aam::context::christopoulou_2019_attributed_statements
  work_id: 10.1111/jace.15944
  source_id: christopoulou-2019-jace102-508-aam
  species: K
