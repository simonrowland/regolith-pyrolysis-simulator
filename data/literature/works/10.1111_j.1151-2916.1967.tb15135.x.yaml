    charge_weight_change_bound_mg_as_published: '1.5'
    charge_weight_change_exception_as_printed: Except for several runs over very long periods.
    reaction_temperature_attainment_time_as_printed: ~1 min
    imperceptible_disproportionation_below_temperature_as_printed: about 1000°C
    parallel_experiment_temperature_C_as_published: 1010
    parallel_experiment_conditions_as_printed: Constant evacuation of the system and the added inert gas; no difference was
      noted in the extent of disproportionation.
    temperature_sequences_as_printed:
    - stages:
      - temperature_C: 1180
        duration_as_printed: long enough to reach its terminal disproportionation value
      - temperature_C: 1390
        duration_as_printed: 1 min
      result_as_printed: The extent of disproportionation corresponded to that at the higher temperature.
    - stages:
      - temperature_C: 1380
        duration_as_printed: 5 min
      - temperature_C: 1195
        duration_as_printed: 16 hr
      result_as_printed: The extent of disproportionation corresponded to the higher temperature; there was no indication
        of reversibility.
    superficial_oxidation_temperature_C_as_published: 800
    silicon_globule_temperature_C_as_published: 1440
    silicon_melting_point_C_as_published: 1412
