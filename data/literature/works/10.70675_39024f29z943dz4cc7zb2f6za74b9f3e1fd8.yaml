  units: printed prose
  values:
    quantity: data_qualification
    method_class: quoted_unattributed
    topic: cell design
    statement_as_printed: Tout d'abord le volume limité de ce dispositif, en diminuant l'évaporation de la source, permet
      de fixer la pression partielle en Na sur des temps longs (plusieurs jours) et d’atteindre plus facilement les conditions
      d'équilibre.
    checked_against: embedded PDF text layer and the rendered page image
