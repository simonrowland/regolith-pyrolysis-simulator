- observation_id: mathieu_2009_claim_53_al2o3_summary
  type: source_metadata_context
  locator:
    pdf_page: 192
    published_page: 169
    note: thesis prose
  units: printed prose
  values:
    quantity: directional_comparison
    method_class: quoted_unattributed
    topic: Al2O3 summary
    statement_as_printed: D’après ces résultats, pour une composition du système CaO-SiO2 avec un rapport Ca/Si jusqu’à 1.08,
      l’ajout d’Al2O3 ne modifie pas la valeur de solubilité en Na ; mais ces résultats sont limités à des concentrations
      maximales de 12 mol% d'Al2O3. En revanche, pour des rapports Ca/Si inférieurs à 0.43, l’ajout d’Al2O3 entraîne une baisse
      de la valeur de solubilité et une hausse des coefficients d’activité. Pour des rapports Ca/Si supérieurs à 0.66, cet
      ajout va entraîner inversement une hausse de la solubilité et une baisse des coefficients d’activité.
    checked_against: embedded PDF text layer and the rendered page image
