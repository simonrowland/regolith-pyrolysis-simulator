- observation_id: mathieu_2009_claim_51_al2o3_series
  type: source_metadata_context
  locator:
    pdf_page: 188
    published_page: 165
    note: thesis prose
  units: printed prose
  values:
    quantity: directional_comparison
    method_class: quoted_unattributed
    topic: Al2O3 series
    statement_as_printed: Pour les séries, CMS36+Al2O3, source NS1 et source NS2, l’influence de l’addition d’Al2O3 est aussi
      négligeable jusqu’à 18mol% d’Al2O. Au delà, une légère augmentation de la solubilité et une légère diminution du coefficient
      d’activité sont observées. Cependant, malgré l’ajout de 25 mol% d’Al2O3, notons que l’augmentation de la solubilité
      reste inférieure à 2 mol%. Enfin, pour la série CMS34+Al2O3, source NS2, 1400°C ; l’influence est quasi-nulle jusqu’à
      une valeur de 12-13 mol% d’Al2O3, puis nous pouvons observer une hausse de la solubilité de sodium ou une diminution
      du coefficient d’activité. Par exemple pour un ajout de 25 mol% d’Al2O3, l’augmentation de la solubilité est supérieure
      à 4 mol%.
    checked_against: embedded PDF text layer and the rendered page image
    transcription_note: runs across the page break PDF p188-189; "d’Al2O." is printed so (typo for Al2O3)
  context_id: mathieu-2009-sodium-solubility-thesis::context::mathieu_2009_claim_51_al2o3_series
