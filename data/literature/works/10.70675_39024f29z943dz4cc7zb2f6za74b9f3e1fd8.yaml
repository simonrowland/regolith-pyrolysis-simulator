- observation_id: mathieu_2009_claim_08_temperature
  type: source_metadata_context
  locator:
    pdf_page: 77
    published_page: 54
    note: thesis prose
  units: printed prose
  values:
    quantity: data_qualification
    method_class: quoted_unattributed
    topic: temperature
    statement_as_printed: Preliminary temperature measurements in the device near the reactor reveals that despite the existence
      of a thermal gradient on the cell (≈3 °C cm−1), gradients inside the reactor (20 mm high) are relatively small due to
      the ability of the alumina of the support and the platinum of the crucible to homogenize the temperature, and that temperature
      uncertainty do not exceed ±5 °C.
    checked_against: embedded PDF text layer and the rendered page image
    transcription_note: ≈, −1 and ± are symbol-font glyphs; read from the page image
