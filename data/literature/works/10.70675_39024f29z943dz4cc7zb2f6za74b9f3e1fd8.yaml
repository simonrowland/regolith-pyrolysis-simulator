    topic: Al2O3 effect CAS
    statement_as_printed: Dans le système CaO-Al2O3-SiO2, pour des compositions avec un rapport Ca/Si inférieur à 0.43, l’ajout
      d’Al2O3 semble provoquer une baisse de la solubilité en sodium et une hausse du coefficient d’activité (figure IV.16).
