- observation_id: spaargaren_2025_numeric_prose_context
  type: thermodynamic_example
  locator:
    page: 1
    published_page: 1
    pdf_page_index: 0
    section: Abstract, Introduction, Methods, Results, Discussion, Conclusions and Appendices
  units: as printed
  values:
    quantity: printed_numeric_context
    abstract_C_O_classes: 'Earth-like: C/O ≤ 0.75; graphite-bearing: C/O > 0.75; intermediate class C/O 0.84–1.04'
    other_printed_context: MVE condensation temperatures 600–1300 K; oxygen-poor fO2 < IW−6; low-Tc constraint below 400 K;
      solar disk reference 1 AU and 10^-4 bar; stellar catalogue and model sample sizes and cutoffs are retained in spaargaren_2025_stellar_sample_and_selection
    numerical_discussion:
    - locator: page 1, Abstract
      statement: Earth-like planets are associated with C/O ≤ 0.75; graphite-bearing planets with C/O > 0.75; an intermediate
        class spans C/O 0.84–1.04.
    - locator: page 2, Introduction
      statement: Moderately volatile elements are described as having condensation temperatures between 600 K and 1300 K;
        the cited oxygen-poor regime is fO2 < IW−6.
    - locator: page 3, §2.1
      statement: The gas parcel cools from 2500 K to 400 K; baseline pressure is 10^-4 bar and the pressure correction is
        stated to be linear except for S.
    - locator: page 3, §2.2
      statement: After applying the criteria, the final dataset consists of 91,982 stars.
    - locator: page 4, §2.2
      statement: 780 outliers are removed, leaving 91,202 stars; 1,000 stars are selected for the condensation- sequence sample;
        metallicity spans 8.0–10.0 and solar metallicity is 8.99.
    - locator: page 5, §3.2
      statement: The transition temperatures drop by 150–200 K; the critical C/O values printed for Ca, Al, Mg and Si are
        0.936, 0.94, 0.875 and 0.828. Calcium rises by about 40 K near C/O=1.045 and Si by over 400 K across C/O=1.022–1.045.
    - locator: page 6, §3.2–3.3
      statement: The source states condensation temperatures vary by up to 100 K and change planetary bulk composition by
        as much as 30%.
    - locator: page 7, §4
      statement: About 20% of disk oxygen condenses as silicates by temperatures as high as 1700 K; the oxygen effective condensation
        temperature is 894 K; carbon effective condensation is 0 K in the solar disk because it does not condense above the
        400 K lower model limit.
      method_class: model_derived
    - locator: page 7, §4
      statement: Wang et al. (2019a) report an oxygen effective condensation temperature range of 875±45 K and a cited estimate
        for carbon effective condensation of 305 +73/−135 K.
      method_class: quoted_attributed
    - locator: page 10, §5
      statement: For C/O from 0.8 to 1.0, Fe+Ni is 40–50 wt% versus 20–40 wt%; mantle minor elements rise from nominally 5–12
        mol% to as much as 20 mol%; bulk Mg/Si reaches 2.5, and at C/O > 1.04 is typically below 0.5.
    - locator: page 11, §6.1
      statement: This study finds Ca condensation stabilises at 1265 K and Al at 1230 K.
      method_class: model_derived
    - locator: page 11, §6.1
      statement: Lodders and Fegley Jr. (1995) report graphite condensation rising from below 1000 K at C/O<0.98 to 2000 K
        at C/O=2.0; Lodders and Fegley Jr. give the Al comparator of 1316 K.
      method_class: quoted_attributed
    - locator: page 12, §6.1
      statement: Pressure changes are stated as 40–80 K per order of magnitude in pressure and metallicity changes as 70–160
        K per order of magnitude; Earth-like CMF spans 25–38 wt% under M and P variation.
    - locator: page 13, §6.2.1
      statement: Low-C/O predicted core mass fractions are 19–41 wt%; intermediate C/O 0.84–1.02 reaches up to 50 wt%.
    - locator: page 14, §6.2.2
      statement: The text gives C-bearing planets at C/O as low as 0.6 and C-free planets up to 0.95; 12.36% of GALAH DR3.2
        stars after quality filtering may host refractory-carbon planets.
    - locator: page 15, §6.3
      statement: Mars fit parameters are α=2.984±0.044 and β=−9.33±0.41; Vesta α=10.80±0.22 and β=−33.4±1.9; Vesta-like exoplanets
        reach CMF up to 70 wt%.
    - locator: page 16, §6.4
      statement: Sequential condensation inhibition temperatures considered are 3000 K, 1400 K, 1000 K and 600 K.
    - locator: page 17, §6.4
      statement: An Fe grain of 1 metre is stated to convert fully to FeS within 1,000 years.
    - locator: page 19, Conclusions
      statement: The paper predicts 12% of rocky planets have more than 1 mol% C in their interiors; the high-C/O intermediate
        population is C/O 0.84–1.04.
    - locator: page 29, Appendix D
      statement: At C/O ≥ 0.9, a Vesta-like body can reach CMF as high as 70 wt%; at low C/O (C/O ≤ 0.9), Ca+Al reservoirs
        occur when planets primarily sample high-temperature space. At higher C/O, major Ca+Al reservoirs occupy a small parameter-space
        region, primarily α>11; at high C/O the enrichment disappears as graphite is stable to very high temperature.
    additional_printed_numeric_context:
    - locator: page 3, §2.2
      statement: Of the 16 selected elements, only abundances of our five selection criteria elements (C, O Fe, Mg, and Si),
        Na, Al, K, Ca, Ti, and Ni are commonly available in our dataset.
    - locator: page 4, Eq. 2
      statement: '[N/O] = log10(10^-1.732 + 10^(A_O - 12 + 2.19)).'
    - locator: page 4, §2.2
      statement: Across the GALAH metallicity span, condensation-temperature variations range from 72 K for Ni to 165 K for
        Al.
    - locator: page 4, §2.3
      statement: The 50% threshold is log10(0.5) = -0.301.
    - locator: page 5, Eq. 4
      statement: 'Wang et al. (2019a) devolatilisation law: log f_i = α log T_C^i + β, α = 3.676 ± 0.142, β = -11.556 ± 0.436.'
      method_class: quoted_attributed
    - locator: page 5, §3.2
      statement: T_C^Mg at C/O=0.94 and T_C^Al at C/O=1.039 decrease by about 50 K before stabilising.
    - locator: page 5, §3.2
      statement: MgS is stable only over 20–100 K.
    - locator: page 5, §3.2
      statement: Mg O-depleted condensation occurs at C/O as low as 0.75 (Mg/O > 0.2) and as high as 0.92 (Mg/O < 0.05).
    - locator: page 5, §3.2
      statement: Transition widths are 0.05 C/O for Ca and Al, 0.26 for Si, and 0.17 for Mg.
    - locator: page 5, §3.2
      statement: Lodders (2003) gives forsterite T_C=1354 K and enstatite T_C=1316 K.
    - locator: page 5, §3.2
      statement: At Mg/Si > 1.6, forsterite is the primary Si- and Mg-bearing condensate.
    - locator: page 6, Figs. 4–5 captions
      statement: The solar C/O value is 0.55 and solar Mg/Si is 1.23.
    - locator: page 6, §3.2
      statement: Ca/Al < 2.0 gives gehlenite and perovskite; higher Ca/Al gives larnite.
    - locator: page 6, §3.3
      statement: The critical C/O for Na is 0.819.
    - locator: page 7, §3.3
      statement: Albite is about 50 K higher when quartz is stable, only at Mg/Si ≤ 0.83; nepheline remains stable up to Mg/Si=1.97.
    - locator: page 7, §4
      statement: Oxygen 50% T_C is reached only at 180 K (Lodders 2003); depletion exceeds 99%, while the Earth–Sun oxygen
        depletion factor is about 80%.
    - locator: page 7, §4
      statement: At C/O > 0.8, carbon initially condenses as graphite above 1100 K.
    - locator: page 7, §4
      statement: The fitted Fe relation is T_C^Fe = 4.776 A_Fe^2 + 12.77 A_Fe + 964.64.
    - locator: page 8, §4
      statement: Graphite begins at C/O≈0.7; Fig. 7 displays C/O=0.9 and 1.25 disks with a 0.25 mol% threshold.
    - locator: page 9, Eq. 5
      statement: Σ/O = (ε_C + 2ε_Si + ε_Mg + ε_Ca + 1.5ε_Al + 0.5ε_Na)/ε_O.
    - locator: page 9, §5
      statement: The graphite field extends at C/O > 1.04; CH4 is below 750 K; Earth devolatilisation cut-off is 1391 K; T_O,eff
        is always greater than 500 K.
    - locator: page 9, §5
      statement: FeS is primary at C/O < 0.8; MgS/CaS at Σ/O > 1.005; T_S,eff rarely exceeds 1000 K.
    - locator: page 10, §5
      statement: Mg-depleted planets occur at C/O > 1.04; Mg+Si-depleted at 0.84–1.04; star-like Fe/Mg/Si at C/O ≤ 0.84.
    - locator: page 10, §5
      statement: Ca and Al remain refractory up to C/O=0.95.
    - locator: page 10, §6.1
      statement: T_C^Si is forsterite only if Mg/Si > 1.5; MgO at Mg/Si ≥ 2.0; SiO2 at Mg/Si ≤ 0.87.
    - locator: page 10, §6.1
      statement: T_C drops by 100 K from C/O=0 to 0.8, followed by a rapid 100–300 K drop.
    - locator: page 11, Fig. 10 caption
      statement: The solar C/O is printed as 0.54 (Asplund et al. 2009), differing from 0.55 on page 6; both source values
        are retained as internally inconsistent.
    - locator: page 11, §6.1
      statement: Mg and Si are moderately volatile at C/O as low as 0.75; N/O restricts O only at N/O > 0.75, and all disks
        have N/O ≤ 0.25.
    - locator: page 11, §6.1
      statement: Previous Ca estimates are 1240 K (Larimer & Bartholomay (1979)) and 1295 K (Lodders & Fegley Jr (1995)).
    - locator: page 12, §6.1
      statement: Si is refractory above C/O=1.02; SiC is primary at C/O as low as 0.75; less than 50% of Si is SiC below C/O=1.02;
        plateau C/O=1.10; T_C^SiC=1633 K; CaS limits Si to at most 6%.
    - locator: page 12, §6.1
      statement: T_C^Mg stabilises at 1060 K above C/O=0.94, versus 1080 K in Lodders et al.
    - locator: page 12, §6.1
      statement: At Σ/O > 1, T_S,eff rises by 100 K; pyrite occurs at [Fe/S] < -0.67, while the sample has [Fe/S] ≥ -0.45.
    - locator: page 12, §6.1
      statement: Silicates condense as liquid at P > 10^-2 bar (Ebel et al. 2006).
    - locator: page 12, §6.2
      statement: Core fraction is underestimated by about 0.3%; 0.8% of planets are Mg-depleted versus earlier 10–50%; Mg/Si
        < 1.0 versus prior <0.75 criterion; 5% have Mg/Si > 1.6.
    - locator: page 13, §6.2.1
      statement: C/O 0.9–1.02 planets rarely have cores below 40 wt%; the comparison is 40–50 wt% at C/O 0.85–1.0 versus 19–41
        wt% below 0.75; oxidised Fe condenses below 500 K only.
    - locator: page 14, §6.2.2
      statement: Earlier graphite thresholds are C/O > 0.8 (Bond et al. 2010b) and as low as 0.65 (Moriarty et al. 2014).
    - locator: page 14, §6.2.2
      statement: GALAH stars with C/O > 0.8 are 11.90%; Hypatia within 200 pc gives 3.71% and 2.84%.
    - locator: page 14, §6.2.2
      statement: Planet carbon budget is 20–30 mol% at C/O=1.0, rising to 40–80 mol% above C/O=1.04; silicates still form
        below 1000 K.
    - locator: page 14, §6.2.2
      statement: MgS/CaS are stable mantle phases at fO2 < IW−2; fewer than 2% of the sample has more than 1 mol% S.
    - locator: pages 15–16, §6.3–6.4
      statement: Gas-solid reactions are rapid above 600 K; grains are smaller than 0.01 µm; sequential graphite extends to
        C/O=0.6 (Moriarty et al. 2014).
    - locator: page 16, §6.4
      statement: Sequential T_C equals equilibrium for T_C > 1000 K except Ca at T0 > 1800 K; sequential Na/K T_C is several
        100 K lower.
    - locator: page 17, §6.4
      statement: Graphite is stable only above 700 K (T_C,eff^C=0 if T0<700 K); Lodders (2003) gives anorthite at 1387 K.
    - locator: page 18, Conclusions
      statement: Mantle sulphur does not typically exceed 1 mol%; graphite buffers gas to C/O=1.0.
    - locator: page 26, Appendix B
      statement: CaS is the primary Ca condensate at C/O as low as 0.8.
    - locator: pages 27–28, Appendix B
      statement: Figs. B.2/B.3 use stability threshold 10^-7 n_H; albite rises by 50 K once SiO2 is stable.
    - locator: page 29, Appendix D
      statement: CMF approaches 0 at α>11 and β<−35; low-C/O Ca+Al reservoirs occur at C/O≤0.9.
