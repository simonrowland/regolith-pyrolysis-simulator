- observation_id: spaargaren_2025_model_uncertainty_and_qualifications
  type: method
  locator:
    page: 3
    published_page: 3
    pdf_page_index: 2
    table: '1'
    section: 2.1 Condensation sequence model
  units: as printed
  values:
    quantity: stated_uncertainty_and_model_limitations
    table_1_GGchem_uncertainty_K: ± 5 K
    comparability: GGchem results match Lodders (2003) within 20 K for all elements except Ni, and Wood (1993) within 25 K
      for all elements except Ni and Na
    ni_phase_limit: GGchem does not include solid solutions such as metal alloys; Ni is modelled as pure Ni metal, so it condenses
      at lower temperature than Fe-Ni alloys
    oxygen_and_sulphur: C and S show non-monotonic condensation; effective condensation temperatures are proposed for these
      cases and are explicitly not mathematically equivalent to 50% condensation temperatures
    pressure_adjustment: authors state condensation temperatures scale linearly with pressure for all elements except S
    model_uncertainty: authors state the results provide a conservative lower bound on rocky-exoplanet compositional diversity;
      planetary-accretion dynamics remain under-constrained for most systems
    directional_claims_rechecked_against_page_images:
    - quote: Fe and Ni only depend on their own abundances
      locator: page 18, Conclusions; page 22, Appendix A.2
    - quote: increasing Fe and Ni abundances raise the partial pressures of monatomic Fe and Ni gases, enhancing their condensation
        temperatures
      locator: page 5, §3.1
    - quote: At low C/O, Tc shows a weak decrease with increasing C/O
      locator: page 5, §3.2
    - quote: their condensation temperatures drop by 150–200 K across this transition
      locator: page 5, §3.2
    - quote: TCAl is unaffected by disk Ca abundance. Instead, TCAl depends primarily on the Al abundance
      locator: page 6, §3.2
    - quote: the condensation of Mg, Si, Ca, and Al is primarily governed by oxygen availability and each element’s abundance
      locator: page 6, §3.2
    - quote: condensation temperatures can vary by up to 100 K
      locator: page 6, §3.2
    - quote: the molar disk Mg/Si ratio influences T_C^Na more strongly (200 K shift) than the disk C/O ratio (100 K shift)
      locator: page 6, §3.3
    - quote: the volatility order of rock-forming elements ... differs significantly from that at near-solar C/O
      locator: page 5, §3.2
    - quote: The volatility of Fe and Ni only depend on their own abundances, and do not depend on other elemental abundances
      locator: page 18, Conclusions
    - quote: In oxygen-rich environments, the condensation temperatures of rock-forming elements decrease with increasing
        C/O
      locator: page 18, Conclusions
    - quote: each element except Si becomes less volatile as their abundance increases; the volatility of Si increases
      locator: page 18, Conclusions
    - quote: For disks with C/O > 1.04, all element volatilities become independent of C/O
      locator: page 18, Conclusions
    - quote: Sulphur remains moderately volatile in all disk environments, although it becomes somewhat more refractory as
        oxygen is depleted
      locator: page 18, Conclusions
    - quote: carbon condensation as graphite is controlled by the ratio of oxide-forming elements to oxygen rather than C/O
        alone
      locator: page 19, Conclusions
    - quote: At Mg/Si < 1.6, more Si condenses as the less refractory enstatite
      locator: page 6, §3.2
    - quote: At Mg/Si ≥ 1.5, albite is replaced by nepheline
      locator: page 7, §3.3
    - quote: the traditional 50% Tc description fails to capture the condensation behaviour of semi-volatile elements like
        C, O, and S
      locator: page 7, §4
    - quote: C and S are not monotonic with decreasing temperature
      locator: page 7, §4
    - quote: the effective temperatures increase steadily with both increasing α and β
      locator: page 28, Appendix C
    - quote: Vesta uniformally has higher TC,eff and TS,eff than Earth, while Mars always has slightly lower temperatures
      locator: page 28, Appendix C
    - quote: the condensation temperature of graphite starts increasing considerably at C/O=1.04
      locator: page 26, Appendix B
    - quote: At high C/O, both Ca and Mg tend to form sulphides rather than oxides
      locator: page 26, Appendix B
    - quote: the stable Na phase shifts from albite to nepheline to sodium metasilicate
      locator: page 27, Appendix B
    - quote: Refractory elements transition to O-depleted condensation at higher C/O ratios ... than the moderately refractory
        elements
      locator: page 5, §3.2
    - quote: Although at near-solar C/O Si is the most volatile of these four elements, it becomes the most refractory at
        high C/O, followed by Ca and Al with Mg becoming the most volatile
      locator: page 5, §3.2
    - quote: T_C^Mg increases with both O and Mg abundances
      locator: page 6, §3.2
    - quote: At higher Ca/Al, the less refractory larnite ... reducing T_C^Ca
      locator: page 6, §3.2
    - quote: nepheline is more volatile
      locator: page 7, §3.3
    - quote: sodium metasilicate has an even lower condensation temperature
      locator: page 7, §3.3
