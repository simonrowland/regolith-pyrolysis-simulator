        relation: mg_to_kg
        inputs:
        - m_kg = m_mg / 1e6
        - original_unit=mg
        parameters:
        - - original
          - state:
              tag: value
              value: '25'
            locator:
              published_page: 318
              pdf_page_index: 2
              section: 2.1 Experimental
              note: Printed sample mass about 25 mg; SI unit conversion only
        - - factor
          - state:
              tag: value
              value: '1000000'
            locator:
              published_page: 318
              pdf_page_index: 2
              section: 2.1 Experimental
              note: Printed sample mass about 25 mg; SI unit conversion only
        output_unit: kg
    initial_composition:
      state:
        tag: value
        value:
          basis: sossi_2020_measured_oxide_mole_fraction
          components:
          - - CaO
            - '0.178646943159'
          - - Al2O3
            - '0.059209341645'
          - - SiO2
            - '0.395271364779'
          - - MgO
            - '0.219592440789'
          - - FeO
            - '0.115579694296'
          - - CuO0.5
            - '0.014498540589'
          - - ZnO
            - '0.017201674743'
          amount_basis: mole_fraction
      locator:
        published_page: 320
        pdf_page_index: 4
        section: 3.1 Experimental Glasses / 3.2 Copper and Zinc concentrations
        note: Converted from the paper's measured major oxides and measured Cu-Zn Cu/Zn concentrations; FeOT retained as total-iron
          FeO equivalent, and Cu/Zn ppm converted to CuO0.5/ZnO oxide mole fractions.
      inference:
        relation: measured_oxide_wt_pct_and_trace_ppm_to_oxide_mole_fraction
        inputs:
        - 'measured_major_oxide_composition_wt_pct: SiO2 41.70, Al2O3 10.60, MgO 15.54, FeOT 14.58, CaO 17.59'
        - 'starting_material_measured_concentrations[Cu-Zn]: Cu/Zn ppm as printed'
        - FeOT retained as total iron on an FeO-equivalent basis; no Fe2O3 conversion
        - Cu/Zn ppm converted to CuO0.5/ZnO oxide masses using atomic and formula masses
        parameters: []
        output_unit: mole_fraction
    printed_composition:
      state:
        tag: value
        value: An42Di58 with about 15 wt% forsterite and about 15 wt% Fe2O3; Cu-Zn or Metalloids trace-element mix
      locator:
        published_page: 318
        pdf_page_index: 2
        section: 2.1 Experimental
    form:
      state:
        tag: value
        value: slurry smeared on noble-metal wire loops
      locator:
        published_page: 318
        pdf_page_index: 2
        section: 2.1 Experimental
    pretreatment:
      state:
        tag: value
        value: Oxide powders mixed three times in agate mortar under acetone, fired overnight at 1000 C in air to decarbonate,
