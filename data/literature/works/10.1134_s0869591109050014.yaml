    comparisons:
    - attribution: Brewer and Rosenblatt (1969)
      statement_as_printed: P(FeO)/P(Fe) ± 0.2 in equilibrium vapor at T = 1700°C for FeO1.11(l).
    - attribution: Yakovlev et al. (1984); Markova et al. (1986)
      statement_as_printed: at 1700–1750 °C, Fe2+ content was approximately two orders of magnitude lower than Fe0 when FeO
        partial pressures were maximal.
    note: Attributions and approximate forms are retained verbatim in meaning. The first is a ratio of partial pressures,
      and the second is an approximate order-of-magnitude comparison; neither is rewritten as a scalar partial pressure or
      converted to a numeric valence ratio.
