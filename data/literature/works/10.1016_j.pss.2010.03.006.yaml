context:
- observation_id: tenkate_apollo16_sample_and_run
  type: characterization
  locator:
    published_page: 1012
    section: '4.1'
  units: as printed
  values:
    sample: Apollo 16 lunar regolith 64801,53, subsample of 64801; Station 4 in Descartes region of lunar highlands; sieve
      fraction <1 mm.
    sample_mass_mg: 60
    preparation: Very fine-grained sample; did not require crushing. Approximately 60 mg was inserted into a quartz tube packed
      with quartz wool, placed in the graphite crucible and mounted in the vacuum chamber.
    source_qualification: Sample 64801 was specifically shielded from South Ray Crater; apparent cosmic-ray exposure age 310
      million years from cosmogenic 21Ne measurements.
    sample_composition: 'Relatively simple chemical characteristics with high aluminum and calcium; no numerical composition
      reported. Four rock types identified: cataclastic anorthosites, partially molten breccias, igneous and high-grade metamorphic
      rocks, and polymict breccias.'
    after_run_composition:
      state: unknown
      reason: not_reported
    heating_schedule: 25 °C start; linear ramp at 5 °C/min to 1200 °C.
    purity:
      state: unknown
      reason: not_reported
  context_id: tenkate-2010-vapor-instrument::context::tenkate_apollo16_sample_and_run
  work_id: 10.1016/j.pss.2010.03.006
  source_id: tenkate-2010-vapor-instrument
  species: H2O
- observation_id: tenkate_data_qualifications_and_comparisons
  type: experiment_series
  locator:
    published_page: 1013-1016
    sections: 5-6
  units: verbatim statements and located numeric context
  values:
    method_class: figure_only
    statements:
    - quote: Future versions of VAPoR with increased mass spectrometer sensitivity and resolution, a higher maximum pyrolysis
        temperature, and reduced oven outgassing should make it possible to identify some of the species (e.g. Ne) that we
        are currently unable to detect in the Apollo regolith sample using the VAPoR breadboard.
      locator:
        published_page: 1016
        section: '6'
    - quote: The TEGA ovens heated polar regolith samples up to 1000 °C and the evolved gases were analyzed using a mass spectrometer
        (Boynton et al., 2001).
      locator:
        published_page: 1007
        section: '1'
        note: Table 1 on p.1008 gives TEGA ambient–950 °C; both source values are retained as printed.
    - quote: The ability to heat regolith samples to these temperatures is critical for releasing oxygen and some noble gases
        that are only released at temperatures in excess of 1200 °C under vacuum.
      locator:
        published_page: 1010
    - quote: The purpose of this work was not to calibrate the instrument; therefore, no attempt has been made to quantify
        the amount of evolved gases and the acquired data were only compared to existing data showing the gas release profiles
        as a function of temperature.
      locator:
        published_page: 1016
    - quote: The mass spectrometer used in this study does not have sufficient resolution to distinguish between CO+ and N2+,
        or S+ and O2+ therefore these are plotted together.
      locator:
        published_page: 1012
    - quote: Only the evolved gas patterns of the 8 mg Murchison sample are shown, because the 60 mg sample caused saturation
        of the RGA due to high pressures observed from sample outgassing (predominately H2O+ released from hydrated minerals).
      locator:
        published_page: 1012
    - quote: The partial pressures of the evolved gases varied considerably between the two samples, and in order to plot
        the outgassing profiles of the two samples in the same figure, the samples are plotted on different pressure scales.
      locator:
        published_page: 1012
    - quote: Both samples have a similar increase in m/z 12 (C+), 16 (CH4+ or O+, not distinguishable at these higher temperatures
        from fragmentation patterns), 28+ (N2 or CO+), and 29 peaks (12 and 16 are not shown), at temperatures above 1000
        °C. This increase is not observed at experiments that only ran up to 1000 °C, or in the blank run.
      locator:
        published_page: 1012
    - quote: Previous evolved gas analyses of lunar samples showed similar results, which were attributed to bursting of gas-containing
        vesicles (Gibson and Johnson, 1971) or other traps, or high temperature nitrides (Flory et al., 1972).
      locator:
        published_page: 1013
    - quote: In the case of the Murchison sample, an estimate about the majority of CO+ or N2+ in the CO+/N2+ ratio could
        be made based on analysis of the fragments of the CO+ and N2+ mass spectra (12 and 16 for CO+, and 14 for N2+). Similar
        analysis of the Apollo 16 sample did not provide conclusive informative about the CO+/N2+ ratio.
      locator:
        published_page: 1013
    - quote: The lack of other alkane and hydrocarbon fragments in the Apollo 16 sample suggests that this sample was not
        significantly contaminated by organics during collection and curation over the past 37 years.
      locator:
        published_page: 1013
    - quote: Oxygen is not expected to be released at temperatures below 1000–1200 °C, therefore the S+/O2+ profiles in both
        the Apollo 16 and the Murchison sample are expected to be S+, especially when compared to the H2S+, SO2+, and CS2+
        profiles.
      locator:
        published_page: 1013
    - quote: H2+ has been detected in our analysis, but could not be confirmed as an outgassing product of the lunar or Murchison
        meteorite samples due to a high H2+ background of the system.
      locator:
        published_page: 1014
    - quote: neither CS2+ nor COS+ have been reported for Apollo samples and are only present in very minor amounts in our
        sample
      locator:
        published_page: 1014
    - quote: S+/O2+ is not reported for the earlier Murchison analysis and our analysis did not show the COS+ fragment.
      locator:
        published_page: 1014
    - quote: The Murchison sample is compared to previous work by Simoneit et al. (1973) and shows consistent results as well.
      locator:
        published_page: 1014
    - quote: In general the VAPoR breadboard produces results comparable to existing data.
      locator:
        published_page: 1014
    - quote: a faster heating rate causes considerable widening of evolved gas peaks, even when the rate was doubled from
        5 to 10 °C/min.
      locator:
        published_page: 1014
    - quote: This could explain the broader evaporation rates of some of the fragments in the earlier Apollo 16 and Murchison
        data.
      locator:
        published_page: 1014
    - quote: Our samples were heated at a rate of 5 °C/min, the other Apollo 16 and Murchison sample at a rate of 14 °C/min
        and the Apollo 14 and 15 samples at a rate of 6 °C/min.
      locator:
        published_page: 1014
    - quote: Apollo 16 sample 61221,7 is referred to as rich in complex volatiles (Gibson and Johnson, 1971) and “unique”
        (unclear whether North or South Ray Ejecta) in the same classification where 64 801 is classified as “dark soil” (Heymann
        et al., 1975). Furthermore, both samples come from a different region, 61 221 from Station 1 on the rim of Plum Crater
        and 64 801 from Station 4 in a shielded position from South Ray Crater (Heymann et al., 1975).
      locator:
        published_page: 1014
    - quote: In this static mode the getter (Fig. 1) will pump the active gases and concentrate noble gas species released
        from the regolith. This getter will be an important part of the instrument to concentrate noble gases, but even without
        the getter as demonstrated in these experiments, we can still measure solar wind implanted He.
      locator:
        published_page: 1015
    - quote: the 6 g interior fragment was crushed and sieved to <150 µm; from this 68 mg was allocated to this study.
      locator:
        published_page: 1012
    - quote: Saal et al. (2008) detected water concentrations of 30 part-per-million (ppm) by reanalysis of Apollo samples,
        which are higher than previously thought.
      locator:
        published_page: 1008
    - quote: The very recent detection of H2O/OH by 3 independent missions, the M3 instrument on Chandrayaan (Pieters et al.,
        2009), the EPOXI (extended Deep Impact) mission (Sunshine et al., 2009), and the VIMS instrument on Cassini (Clark,
        2009) further support the case for water–ice and/or hydrated minerals on the Moon.
      locator:
        published_page: 1008
    - quote: for the permanently shadowed regions, unless extraordinary measures are taken (e.g. collection and Earth return
        at 50 K), a large fraction of the original volatile material would be lost prior to analyses on Earth.
      locator:
        published_page: 1009
    - quote: Remote D/H measurements of HCN from comet Hale–Bopp show that the volatiles are heavily enriched in deuterium
        compared to volatiles from other sources
      locator:
        published_page: 1008
    - quote: Solar implanted C and H in the lunar equatorial soils have been found to be depleted in 13C and D, with isotope
        ratios that are distinct from terrestrial organics, comets, and carbonaceous meteorites.
      locator:
        published_page: 1008
    - quote: The solar wind also plays a role, among other potential sources, in the 15N/14N ratios on the lunar surface,
        which may have varied significantly over the last 4 billion years
      locator:
        published_page: 1008
    - quote: VAPoR is a smaller, more portable instrument designed for shorter mission durations.
      locator:
        published_page: 1009
    - quote: The VAPoR ovens will be designed to achieve much higher temperatures (up to 1400 °C) compared to previous flight
        pyrolysis units.
      locator:
        published_page: 1010
    - quote: Although the current VAPoR breadboard is fairly massive (~40 kg) and requires significant power to operate (~200
        W average), due to the need for a large turbomolecular pump, the VAPoR flight unit, based on the SAM design, will
        be much smaller (~20 dm3), weighing ~10–15 kg.
      locator:
        published_page: 1010
    - quote: The aimed power consumption for a typical evolved gas analysis up to 1400 °C based on extrapolation of required
        power for operation of the SAM flight pyrolysis ovens is in the 40–60 W range.
      locator:
        published_page: 1010
    - quote: The intrinsic sensitivity of this mass spectrometer is ~10^-4 (counts/second)/(particle/cc) for N2.
      locator:
        published_page: 1010
    - quote: The 60 mg Murchison sample caused saturation of the RGA; only the 8 mg Murchison pattern is plotted.
      locator:
        published_page: 1012
    - quote: the Apollo 16 sample shows a minor 39 and 43 peak around 1100 °C. Pump oil has been suggested; however no traces
        of this contaminant have been detected in the blank sample.
      locator:
        published_page: 1013
    - quote: Organics have been detected in a different Apollo 16 sample ... but at much lower temperatures (250–500 °C),
        therefore this peak is most likely contamination of either the sample or the quartz holder used for this measurement.
      locator:
        published_page: 1013
    - quote: This most likely explains the low temperature evolved SO2 and the presence of more volatiles than seen in sample
        68401,53 (this study).
      locator:
        published_page: 1014
    - quote: The text later prints ‘sample 68401,53’ when comparing volatile abundance; the sample elsewhere is identified
        as 64801,53.
      locator:
        published_page: 1014
    - quote: The data obtained with the VAPoR breadboard instrument demonstrates that vacuum pyrolysis up to 1200 °C coupled
        with line of sight volatile detection by mass spectrometry is an attractive technique for volatile analysis of the
        lunar regolith.
      locator:
        published_page: 1016
    - quote: no good regolith analogs for the polar regions exist.
      locator:
        published_page: 1012
    - quote: The Apollo 16 regolith sample (64801,53) was a very fine-grained sample and did not require crushing.
      locator:
        published_page: 1012
    - quote: The Murchison meteorite fragment was crushed using a clean mortar and pestle prior to analysis and the powder
        passed through a stainless steel 150 µm sieve.
      locator:
        published_page: 1012
