    attribution: MacPherson (2014), reference [1]
    statements:
    - The bulk compositions of most calcium-aluminum inclusions (CAIs) record the cumulative effects of multiple high-temperature
      and largely volatility-controlled processes during the first 1–2 million years of solar system history [1].
  context_id: ivanova-2016-pristine-cai-evaporation-model::context::ivanova_2016_background_history_attributed
  work_id: b03d236dca9f4e0ec5fdfb05e05aa48133f0fb537324284008e824e15014a6c6
