    method_class: quoted_attributed
    attribution: Ivanova et al. (2012) and Ivanova et al. (2015), references [2, 3]
    statements:
    - CAI 3N from the Northwest Africa (NWA) 3118 CV3 carbonaceous chondrite is a unique ~2 cm-sized compound object, primarily
      a forsterite-bearing type B (FoB) CAI, that encloses at least 26 smaller CAIs of different types, including compact
      type A (CTA), B, C, and an ultra-refractory inclusion [2, 3].
  context_id: ivanova-2016-pristine-cai-evaporation-model::context::ivanova_2016_background_3n_attributed
