- observation_id: ivanova_2016_background_numeric_context
  type: characterization
  locator:
    page: 1
    published_page: 2315
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    method_class: quoted_unattributed
    statements:
    - 3N originated either as an aggregate of many smaller CAIs (mostly types A, B, C) plus accreted Fo-bearing material (resembling
      an amoeboid olivine aggregate) which experienced partial melting of the whole; or else as a FoB melt droplet that collided
      with and trapped many smaller solid CAIs.
    - Relative to typical type A and B CAIs found elsewhere, the bulk compositions of the A and B CAIs within 3N more closely
      match the bulk compositions predicted by equilibrium condensation of a gas of solar composition.
    - Being trapped within the FoB host-CAI may have protected them from melt evaporation that affected most ‘standalone’
      CAIs.
    - Therefore the unique 3N CAI contains possibly the most pristine types of refractory material, and their bulk compositions
      are very important for the investigation of CAI vaporization processes.
  context_id: ivanova-2016-pristine-cai-evaporation-model::context::ivanova_2016_background_numeric_context
