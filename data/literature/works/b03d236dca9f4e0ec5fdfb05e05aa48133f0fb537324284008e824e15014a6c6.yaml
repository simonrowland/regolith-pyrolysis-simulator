- observation_id: ivanova_2016_page1_discussion_model_qualifications
  type: model_comparison
  locator:
    page: 1
    published_page: 2315
    pdf_page_index: 0
    section: Discussion
  units: as printed
  values:
    method_class: model_derived
    claims:
    - All trends finally lead to CAI compositions corresponding to a Ca-aluminate binary system after FeO, MgO, SiO2 vaporization
      from the melts.
    - However, at various points along these trends the CAIs could have different compositions – from known Types A and B,
      to hibonite-rich inclusions including transitional fields.
    - If we vaporize the 3N host, 3N-1 and 3N-12, we obtain CAIs of Type B, A, and intermediate compositions between Type
      A and B.
    - Vaporization of 3N-6 CAI material leads to the approximate composition of the hibonite-rich CAIs.
    - It is interesting to note that CAI 3N-6 is more enriched in Al2O3 and depleted in SiO2 compared to other enclosed CAIs
      from CAI 3N, and a high concentration of Al2O3 affects the final compositional trend.
    - Vaporizing 3N-7, we obtain hibonite-rich inclusions and unusual CAI compositions that do not match any known types of
      CAIs.
    - However, the composition of 3N-7 could not be pristine because Type C CAIs by themselves could be a result of modification
      of previous material [7].
  context_id: ivanova-2016-pristine-cai-evaporation-model::context::ivanova_2016_page1_discussion_model_qualifications
  work_id: b03d236dca9f4e0ec5fdfb05e05aa48133f0fb537324284008e824e15014a6c6
  source_id: ivanova-2016-pristine-cai-evaporation-model
  species: model_context
- observation_id: ivanova_2016_page1_model_qualifications
  type: model_comparison
  locator:
    page: 1
    published_page: 2315
    pdf_page_index: 0
    section: Results
  units: as printed
  values:
    method_class: model_derived
    claims:
    - During CAI melt evaporation, FeO, MgO, and SiO2 evaporate rapidly from the melt in this sequence.
    - The most refractory Al2O3 content in the residual molten material increases.
    - CaO also evaporates rapidly, unless TiO2 is present in which case CaO is retained due to its affinity with TiO2 (perovskite
      compositional affinity).
    - Despite variations in the CAIs’ initial melt compositions (Table. 1), there is a certain general similarity in the change
      of the ratio of the most refractory components (CaO and Al2O3) in the residual melts during evaporation.
    - 'Oxygen content in the gas also depends on the initial ratios of the Al2O3 and TiO2 contents in the melt, Al/Ti ratios:
      3N-20 (8.3), 3N-Host (12.3), 3N-1 (17.3), 3N-12 (18.4), 3N-6 (19.7), 3N-7 (23.0).'
    - The observed differences in the gas phase above the evaporated melts reveal the outsized role of TiO2, which is a minor
      component in the initial melt.
  context_id: ivanova-2016-pristine-cai-evaporation-model::context::ivanova_2016_page1_model_qualifications
  work_id: b03d236dca9f4e0ec5fdfb05e05aa48133f0fb537324284008e824e15014a6c6
  source_id: ivanova-2016-pristine-cai-evaporation-model
  species: model_context
