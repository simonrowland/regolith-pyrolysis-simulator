    section: 4 Conclusions
  phase: silicate_glass
  regime: XAFS_fluorescence
  units: qualitative; figure-only trends are not digitized
  values:
    quantity: chlorine_bonding_environment
    method_class: measured_direct_qualitative
    evidence_class: authors_own_XAFS
    findings:
    - SiO2-rich glasses have lower E0 and Emax; divalent-cation addition raises E0 and Emax toward CaCl2/MgCl2/FeCl2; Na-rich
      glasses approach NaCl; Ca and Fe additions produce EXAFS peaks related to CaCl2 and FeCl2; nine fixed-composition runs
      show nearly identical spectra across T
    - P
    - fCl2
    - and water ranges
    figure_only:
    - Figs. 1-9 spectra and plotted trends; no coordinates read from axes
