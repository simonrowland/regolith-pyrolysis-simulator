  phase: silicate_melt_quenched_to_glass
  regime: quench_equilibration
  units: as printed
  values:
    quantity: apparatus_and_laboratory_conditions
    method_class: measured
    evidence_class: authors_own_experiment
    apparatus: end-loaded half-inch Boyd-and-England-type piston-cylinder at University of Oxford
    pressure_range_kbar: 5-20
    temperature_range_C: 1300-1400
    capsule: graphite and Pt capsules; run products >0.5 mm thick glass, total capsule thickness <2 mm
    starting_material: silicate compositions with incremental Fe, Mg, and Ca additions; CMAS remade with Brucite for nominal
      4 and 8 wt% added water
    final_water_measurements_wt_pct:
      CMAS+Brucite-0.5: '3.23'
      CMAS+Brucite-1: '6.74'
    chlorine_buffer: Ag metal + AgCl + AgI immiscible phases; AgCl/AgI ratio controls fCl2; Ag virtually insoluble in silicate
      melt
    oxygen_control: controlled oxygen fugacity; exact buffer assembly not stated in this paper
    standards: '>99.99% anhydrous FeCl2, CaCl2, MnCl2, AlCl3, MgCl2, KCl, NaCl, AgCl compressed into 4 mm diameter, approximately
      3-5 mm long pellets; <5% cellulose binder'
    EPMA: CAMECA SX-Five-FE, anhydrous glass 20 nA and 15 kV with 10 um defocused beam; Cl 80 s peak and 40 s background,
      other elements minimum 30 s peak/15 s background; Cl detection limit <=100 ppm; hydrous samples 5 nA and 20 um spot
    XAS: Diamond Light Source I18 beamline, experiment SP28784; helium-filled bag; fluorescence mode; Si(111) monochromator;
      four-element Vortex ME-4 detector at 45 degree take-off; minimum 3 spectra/sample, up to 6 replicates
    XAS_scan: 2700-3200 eV; 5 eV pre-edge, 1 eV and 0.5 eV XANES steps, 1 eV then 2 eV EXAFS steps; dwell times as printed
      in Section 2.2
    absent_not_printed:
    - sample mass
    - exposed area
    - vacuum level
    - pumping rate
    - run pressure medium
    - run duration beyond Table 2
    - thermocouple/calibration details
