    figure_1_caption: 'The partial pressure of vapor species over the chondrule melts of Saratov chondrite at evaporation
      from tungsten effusion cell [5]: K (1); Na (2); Fe (3); SiO (4); Mg (5).'
    figure_2_caption: The pK / pNa ratio over the K2O–Na2O–SiO2 melts (1, 2) and the chondrule melts of Saratov chondrite
      (3) vs. the melt composition at 1200 °C (a) and vs. temperature (b). Compositions contained 35 (1) and 55 (2) wt. %
      SiO2 (a, b) with a ratio of K2O / Na2O ≈ 3 / 4 (b); data for chondrul of Saratov chondrite (3) are taken from [5].
    data_origin: The Saratov pressure series is attributed to Yakovlev et al. (1987); the model comparisons are attributed
      to Shornikov and Yakovlev (2020).
    semantics: bound_not_point
    note: Neither figure was digitized; the 3/4 ratio is in the caption, not read from the plotted curves.
