    section: Introduction
    paragraph: 1
  units: statements as printed
  values:
    quantity: background_and_prior_relative_volatility_claims
    method_class: quoted_unattributed
    claims:
    - “Potassium in elementary, oxide, chloride, and other simple forms is more volatile than sodium, that was also observed
      in the evaporation experiments of basaltic and more basic melts [2–4].”
    - “Other authors suggest the higher volatility of sodium than the potassium volatility[1].”
    - “The question of the chondrule formation is one of the most important in meteoritics. Despite the success of modern
      experimental studies, formation and evaporation conditions of chondrule melts remain unclear [1].”
    - “It is believed that the study of the alkali evaporation will provide a key for understanding physical and chemical
      conditions of the chondrule formation.”
    note: These are background statements and conflicting literature claims, not measurements made in this abstract. The missing
      space before [1] is present in the printed text.
  context_id: shornikov-2021-saratov-chondrule-alkali-evaporation::context::shornikov_2021_background_and_directional_claims
