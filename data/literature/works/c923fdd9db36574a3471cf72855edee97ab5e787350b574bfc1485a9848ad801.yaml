- observation_id: shornikov_2021_model_comparison_and_ratio_claims
  type: thermodynamic_example
  locator:
    page: 2
    published_page: 6077
    pdf_page_index: 1
    section: Experimental and Theoretical Investigations
    paragraph: 2
  units: statements as printed
  values:
    quantity: model_comparison_and_partial_pressure_ratio_interpretation
    method_class: model_derived
    model_inputs_as_printed:
      temperature_range: 1100–1500 °C
      silica_contents: 35–55 wt. % SiO2
      melt_system: K2O–Na2O–SiO2
      model_basis: theory of associated solutions
      model_details_reference: '[8]'
    directional_and_comparative_claims:
    - “The temperature dependences of the partial pressures (p) of vapor species over the chondrule melts at evaporation are
      shown in Fig. 1.”
    - “As it is shown on Fig. 2, the obtained experimental data are in agreement with those calculated at 1100–1500 °C for
      the K2O–Na2O–SiO2 melts, containing from 35 to 55 wt. % SiO2 at different K2O / Na2O ratios [7].”
    - “Comparing the pK / pNa ratios at 1200 °C over compositions simulating ultrabasic and medium-acid melts (containing
      35 and 55 wt. % SiO2), it is possible to see the preponderance of pK over pNa at evaporation of the ultrabasic melt
      (pK / pNa > 1).”
    - “In the case of the medium-acidity melt evaporation at relatively low K2O contents, the ratio of pK / pNa < 1 (Fig.
      2a).”
    - “Thus, the pK / pNa ratio over the melts with different acidity can experience an inversion of relative volatility,
      which also depends on the content of alkalis in the melt.”
    - “In our opinion, this is the reason for the different ideas about the relative volatility of K2O and Na2O at the chondrule
      evaporation.”
    - “It follows from the calculations that the temperature dependence of the pK / pNa ratio can be determined by the acid-base
      parameters of the melt.”
    - “Fig. 2b shows decrease in the pK / pNa ratio with the temperature increasing in the ultrabasic melt and the absence
      of such in the medium acidity melt.”
    note: The reported ratio concerns gas-phase K and Na partial pressures over model melts; the abstract gives no oxide activities
      or oxide activity coefficients and states no activity standard state.
  context_id: shornikov-2021-saratov-chondrule-alkali-evaporation::context::shornikov_2021_model_comparison_and_ratio_claims
