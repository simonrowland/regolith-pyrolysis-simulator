- observation_id: nussinov_1975_lunar_transport_definitions
  type: thermodynamic_example
  locator:
    published_page: 389
    pdf_page_index: 12
  units: printed mathematical notation; symbolic theory, unscored
  values:
    method_class: author_estimate
    quantity: theory_definitions_assumptions
    text_as_printed_or_paraphrased: 'K_12 = 0 in lunar ultra-high vacuum; X_∞ approaches 0 at substantially large volatilization
      time constants. Surface transport is assumed not limiting in a sufficiently thin layer h. For liquid convection-diffusion
      h was taken as total melt depth; solid sublimation/pure diffusion gives the thinnest layer. D is diffusion coefficient;
      j_1 = j_0/h, τ_f = 1/j_1, D = D_0 exp(−ΔE/(RT)), j_0 ∼ exp[−(L−A)/(RT)]. ΔE is diffusion activation energy. Footnote:
      volatilization in lunar-soil heating [8], Figure 1, indicates almost no oxygen in the lunar atmosphere when the material
      was melted.'
  context_id: nussinov-1975-lunar-vacuum-volatilization::context::nussinov_1975_lunar_transport_definitions
  work_id: 091550c30333cc97e0c097116a4db88c7081dc01f6ca93133e90a71b9239c013
  source_id: nussinov-1975-lunar-vacuum-volatilization
  species: Na
- observation_id: nussinov_1975_model_definitions
  type: thermodynamic_example
  locator:
    published_page: 383
    pdf_page_index: 6
  units: printed mathematical notation; symbolic theory, unscored
  values:
    method_class: author_estimate
    quantity: theory_definitions_assumptions
    text_as_printed_or_paraphrased: X_1 and X_2 are concentrations per cm^3 of volatile and non-volatile states; X is their
      sum. K_12 and K_21 describe interconversion; j↑ and j↓ are outward and inward flux terms. Solvent evaporation is neglected
      for times τ_f not too large; small volume permits τ_tr ≪ τ_f, so transport is not limiting. Low-concentration components
      are treated independently as regular solutions, X̄_1 ≪ 1. h = V/S is specific depth (volume/free-surface area); α_v(p)
      is evaporation coefficient; m is mass of the released molecule/atom; k is Boltzmann constant.
