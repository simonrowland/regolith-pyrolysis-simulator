- observation_id: nussinov_1975_drop_and_time_regime_definitions
  type: thermodynamic_example
  locator:
    published_page: 392
    pdf_page_index: 15
  units: printed mathematical notation; symbolic theory, unscored
  values:
    method_class: author_estimate
    quantity: theory_definitions_assumptions
    text_as_printed_or_paraphrased: v_0 is characteristic velocity of internal droplet motion, σ surface tension, ρ liquid
      density. Solidification time in vacuum τ_s ∼ d_max; smaller particles solidify sooner. Three concentration-time regimes
      are slow, quasi-stationary volatility, and fast exponential (kinetic). p_0 and T_0 represent approximate equality of
      volatilization and non-volatile-state transformation rates. The kinetic-temperature coefficient combines L, A, q_v and
      Q; individual melt-composition effects are governed by A.
  context_id: nussinov-1975-lunar-vacuum-volatilization::context::nussinov_1975_drop_and_time_regime_definitions
