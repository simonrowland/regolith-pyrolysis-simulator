  type: experiment_series
  experiment: p-var-basalt-series-ref12
  locator:
    published_page: 379
    pdf_page_index: 2
    section: 2. A Short Review of Experimental Data
    note: Quote runs from p. 379 onto p. 381 (p. 380 carries only Figs. 3 and 4).
  units: verbatim; gamma dimensionless as printed
  values:
    method_class: quoted_attributed
    quantity: pressure_dependence_of_residual_concentration
    elements_covered: Si, Al, Fe, Mg, Ca, Na, K
    gamma_Na_K_as_printed: ~10^-1
    gamma_other_elements_as_printed: ~10^-2
    cited_sources:
    - '[12] Yakovlev, O. I.: 1974, candidate dissertation, MGU, Moscow'
    attribution: '[12] Yakovlev 1974'
    quote: 'The analysis of pressure dependence for evaporation of the major elements (Si, Al, Fe, Mg, Ca, Na, K) in vacuum
      was fulfilled at Space Research Institute, Academy of Sciences, U.S.S.R. [12] in ''quasi-stationary'' regime using two
      types of basalt. The typical results for the volatile Na and K are presented in Figures 3 and 4. The measurements of
      the chemical composition for residual glasses were carried out by the two independent techniques: micro X-ray spectral
      and chemical; the results obtained by these techniques were closely concordant. The concentration change is not observed
      up to some characteristic value of the pressure (p0); then with decreasing the pressure the concentration drops following
      the power law with constants γ ~ 10^-1 (for Na and K) and γ ~ 10^-2 for the other elements. Similar pressure dependences
      are typical for the adsorption processes [19, 20].'
