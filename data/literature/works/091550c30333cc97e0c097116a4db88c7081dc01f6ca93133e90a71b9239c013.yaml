    quantity: theory_definitions_assumptions
    text_as_printed_or_paraphrased: Assume X_20 ≈ 0 in (29). At high vacuum α_v → 1, Z → 0 [17,18,22,23]. j_1 ≫ K_12 for p
      ≪ p_0; j_1 ≪ K_12 for p > p_0. K_12 ∼ p^γ, γ = const. n(p) is concentration of molecules/atoms adsorbed from residual
      atmosphere; q_v is adsorption heat. The oxygen mechanism is usually a binary reaction with activation energy Q.
