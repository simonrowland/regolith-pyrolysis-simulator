- observation_id: nussinov_1975_kinetic_and_quasi_stationary_portions
  type: qualifying_statement_context
  locator:
    published_page: 378
    pdf_page_index: 1
    section: 2. A Short Review of Experimental Data
    note: Quote runs from p. 378 onto p. 379.
  units: verbatim
  values:
    method_class: quoted_attributed
    quantity: volatilization_kinetics_description
    elements_covered: Na and K
    cited_sources:
    - '[6] O''Hara et al. 1970'
    - '[7] O''Hara et al. 1971'
    - '[8] Gibson & Hubbard 1972'
    - '[13] Storey 1973'
    attribution: '[6, 7, 8, 13]'
    quote: Figures 1 and 2 give the kinetics of the process of Na and K volatilization from melt of rock (and from lunar fines
      as well) [6, 7, 8, 13]. The so-called kinetic curve portion (a), where the component concentration exponentially decreases
      in time, is typical for all plots. The other portion with the practically constant concentration (b) is named 'quasi-stationary'.
      The characteristic time of volatilization for the latter portion is by orders much than for the former. Attention should
      be given to the two-step change of concentration K in the low-temperature experiment (1150–1175 °C) carried out by O'Hara
      [6, 7] (Figure 2b) the origin of which will be explained below.
    note: '"by orders much than" is printed as is (word missing in the source).'
  context_id: nussinov-1975-lunar-vacuum-volatilization::context::nussinov_1975_kinetic_and_quasi_stationary_portions
