    text_as_printed_or_paraphrased: Thin subsurface layers require T > T_0; transfer mechanisms require a wide temperature
      range T ≷ T_0. For impact melt, τ_s ≪ τ_f. Behind a shock, ε ∼ u^2/2; melting requires ε ≫ ε_m, hence u > sqrt(2ε_m).
      D_p is diameter of melted crater part (pits); D_s is crater/crushing-zone diameter. ν is viscosity and ρ liquid density.
