- observation_id: nussinov_1975_residual_gas_oxidation_mechanism
  type: qualifying_statement_context
  locator:
    published_page: 387
    pdf_page_index: 10
    section: 3. Elements of the Theory for Evaporation of Multicomponent Solution in Vacuum in the Presence of Chemical Transformations
  units: verbatim
  values:
    method_class: quoted_unattributed
    quantity: background_gas_effect_mechanism
    quote: 'Obviously, the molecular mechanism of K12-dependence on p (and on T) can be described as follows: oxygen is adsorbed
      from the background gas on the surface of the melt and oxidizes some of the atoms emerged on the surface from the volatile
      component, thus transforming them into the non-volatile state.'
