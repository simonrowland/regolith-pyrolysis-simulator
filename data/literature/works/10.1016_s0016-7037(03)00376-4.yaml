- observation_id: gaillard_2003_optimization_constraints
  type: statement
  locator:
    page: 35
    pdf_page_index: 34
  units: as printed
  values:
    method_class: model_derived
    statement: 61 prior metal-silicate equilibria constrain molten iron oxides 60–100 wt.%, Fe2O3 increasing ~0–13 wt.% as
      total iron oxides rise 60–100%. Three SiO2–FeO interaction parameters and symmetric FeO–Fe2O3 interaction; SiO2–Fe2O3
      interactions ignored. Enthalpy and entropy of liquid FeO formation each allowed to vary within 20%.
