- observation_id: gaillard_2003_equilibrium_checks_1atm
  type: statement
  locator:
    page: 17
    pdf_page_index: 16
  units: as printed
  values:
    method_class: method_only
    statement: No formal reversals; Fe50Ir50 is a hypothetical example of reversal starting alloy, not an experimental composition.
      At ~1200°C equilibration needs weeks; 1210°C run1 and each 1-atm run last 25 d. Independent Pt/Ir activities agree within
      error, using Pt–Fe calibration Heald (1967) alongside Fe–Ir calibration Schwartzendruber (1984). Runs7–8 in air cannot
      be metal-crosschecked because Fe in alloy is below detection.
