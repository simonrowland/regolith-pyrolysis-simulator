  type: statement
  locator:
    page: 13
    pdf_page_index: 12
  units: as printed
  values:
    method_class: method_only
    statement: '1 atm: about 1 wt.% Ir powder, grain size ~10 μm, and parallel Ir-free mixtures; Pt-wire suspension sample/Pt
      mass ratio ~10. 2 kbar: 75 μm Ir wires initially, ≥25 d required; later ~10 μm powder and parallel Ir-free mixtures.
      Typically ~10 mg H2O per ~100 mg solids; undersaturated water charges 2–10 mg. Au/Au-Pd/Pt capsules 15–20 mm long, 2.5
      mm internal diameter, 0.1 or 0.2 mm walls. Fig.3 schematic labels wire ~25 d versus powder 5–6 d.'
