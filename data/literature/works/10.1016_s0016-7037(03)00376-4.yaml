- observation_id: gaillard_2003_analytical_methods
  type: characterization
  locator:
    page: 15
    pdf_page_index: 14
    section: 4.3. Analytical methods
    note: Continues on PDF p16
  units: as printed
  values:
    method_class: method_only
    empa: Cameca SX-50 (BRGM-CNRS Orléans); glasses and oxides 15 kV, 6 nA, 10 s on peak; beam 1-2 μm oxides, defocused 10
      μm glasses; alloys 20 kV, 20 nA, 20 s peak / 10 s background, standards pure metal Fe and Ir; Fe detection limit in
      alloy about 500 ppm; minimum 6-7 satisfactory alloy analyses per sample
    h2o_calibration: H2O by difference (Devine et al., 1995), calibrated against internal hydrous glass standards each session;
      cross-checked with FTIR (Nicolet 760 Magna; Newman et al., 1986 extinction coefficients; bands 4500 and 5200 cm−1)
    feo_wet_chemistry: Potassium dichromate titration; ± 0.02 at 0.3 wt.% FeO and ± 0.15 at 7 wt.% FeO; Fe2O3 wt% = (FeOtot
      − FeO) 1.1113
