- observation_id: lpsc_2019_2641_qms_calibration_power_law_fits
  type: calibration
  locator:
    pdf_page_index: 1
    figure: '2'
    note: Figure 1 also prints the two pressure-versus-time calibration lines below.
  phase: calibration_gas
  standard_state: QMS signal calibration against reference-gas flow
  regime: qms_calibration
  units: signal intensity in cps; flow rate in mbar/s as printed
  values:
    quantity: author_power_law_calibration_fits
    method_class: model_derived
    model_generator: authors' power-law fit to calibration data
    x_definition: gas flow rate in mbar/s
    y_definition: QMS signal intensity at the named mass in cps
    fits:
    - gas: H2
      mass_as_printed: 2
      expression_as_printed: y = 2.9654e+9 * x^(0.91649)
      R: '0.98853'
    - gas: N2
      mass_as_printed: 28
      expression_as_printed: y = 9.1723e+9 * x^(0.99396)
      R: '0.99171'
    - gas: CO
      mass_as_printed: 12
      expression_as_printed: y = 1.0564e+8 * x^(0.92995)
      R: '0.99996'
    - gas: He
      mass_as_printed: 4
      expression_as_printed: y = 2.4383e+8 * x^(0.91815)
      R: '0.99956'
    figure_1_pressure_time_lines:
    - valve: PZT
      expression_as_printed: y = -0.0039292 + 0.00073213x
      R: '0.99908'
    - valve: capillary
      expression_as_printed: y = 9.5333e-6 + 3.2248e-6x
      R: '0.99999'
    calibration_interference_observations:
    - CO contribution to mass 28 was not observed above scatter in pure-N2 versus mixture calibration
    - mass 12 was used for CO because pure CO also gives mass 12, about 30 times less than mass 28
    - second-order masses: N2 -> 14; CO -> 12; O2 -> 16; CO2 -> 28 and 16 in nearly equal amounts
  uncertainty:
    fit_residuals: R values are printed for each fit; no parameter uncertainties are printed
    calibration_coefficient_variation: approximately +/-30% from the average coefficient across gases
    water_calibration: not made; uniform heating of the vacuum line to 100 °C was challenging, so average calibration coefficient
      was used to estimate water content
  context_id: lpsc-2019-2641::context::lpsc_2019_2641_qms_calibration_power_law_fits
  work_id: e311b324e90ee458188b64996687603f54abb521b14239141d160ef932e23f32
  source_id: lpsc-2019-2641
  species: calibration_reference_gases
