- observation_id: shornikov_2008_qualifications_graphite
  type: qualification
  locator:
    page: 727
    published_page: 727
    pdf_page_index: 3
    section: Discussion
  units: author statements
  values:
    quantity: data_qualification
    method_class: quoted_unattributed
    statements:
    - Graphite is described as a strong reducer; Ruff et al. [22, 23] reported silica reduction in graphite-vapor experiments
      at 2193–2503 K, including rapid destruction of an iridium container and p(SiO) about three orders of magnitude above
      neutral silica evaporation.
    - Hashimoto [24, 25] reported graphite-container experiments at 1873–2373 K and interpreted the quenched spherical sample
      shape and high silicate surface tension as evidence of no chemical interaction with graphite.
    - Shornikov estimates the graphite-versus-neutral total-pressure difference over SiO2 at 10^4–10^5 and suggests lack of
      thermodynamic equilibrium in Hashimoto's experiment as a possible cause.
    - Shornikov says equilibrium and disequilibrium data should not be combined; he interprets recovered sample shapes as
      evidence of incomplete melting and says uncontrolled shape changes make evaporating area, and therefore Hertz-Knudsen
      rate estimates, unreliable.
    - The article says evaporation coefficients range from 10^-6 to 1, are 1 for liquid metals, and are theoretically 1 for
      liquids of spherical molecules and atomic liquids; it cites earlier liquid-SiO2 values near 1 and says this is typical
      of other liquid oxides.
    - The article notes conflict between the graphite data and previously determined liquid-SiO2 evaporation coefficients;
      it says Alexander and Grossman's agreement with Hashimoto's data, which Shornikov calls incorrect, remains unexplained
      and is left for future publications.
    - The English translation contains the awkward phrase “variable materials based on the amounts of other oxides”; its meaning
      is garbled in context. The equation text also says the degree of deviation is characterized by “changes in p(O)” and
      gives a badly rendered symbol, while the figure axis makes the oxygen partial pressure clear.
  context_id: shornikov-2008-redox-oxide-evaporation::context::shornikov_2008_qualifications_graphite
  work_id: 10.1134/s0016702908070069
  source_id: shornikov-2008-redox-oxide-evaporation
  species: paper_context
- observation_id: shornikov_2008_qualifications_results
  type: qualification
  locator:
    page: 726
    published_page: 726
    pdf_page_index: 2
    section: Results
  units: author statements
  values:
    quantity: data_qualification
    method_class: quoted_unattributed
    statements:
    - The article treats complex gaseous oxide compounds as insignificant for a first approximation and discusses predominant
      simple-oxide vapor species.
    - Redox departure and selected container material affect vapor pressure; active metals consume oxygen while ceramic containers
      can interact with oxide samples.
    - The minimum total vapor pressure is associated with chemically neutral conditions; the neutral-condition values are
      Gibbs-energy-minimization calculations using activity and thermodynamic data.
    - Table 1 gives reducing-condition partial pressures measured over oxides during evaporation from a molybdenum container;
      neutral-condition pressures are calculated at 2000 K.
    - Table 1 marks the Mg and Fe reducing-condition values as estimates based on references [2, 19].
    - No numerical uncertainty is reported for the Table 1 or Table 2 pressures, activity values, or ratios.
  context_id: shornikov-2008-redox-oxide-evaporation::context::shornikov_2008_qualifications_results
  work_id: 10.1134/s0016702908070069
  source_id: shornikov-2008-redox-oxide-evaporation
  species: paper_context
- observation_id: shornikov_2008_qualifications_table2
  type: qualification
  locator:
    page: 726
    published_page: 726
    pdf_page_index: 2
    table: '2'
  units: author statements
  values:
    quantity: data_qualification
    method_class: quoted_unattributed
    statements:
    - Table 2 reports pressures and activities for melts experimentally obtained by Knudsen-cell mass spectrometry [15] at
      2000 K in a molybdenum container.
    - The listed five oxides sum to 85.5 wt % in sample 1 and 70.15 wt % in sample 2; the article says other oxides K2O, Na2O,
      TiO2, Cr2O3, and P4O10 total 15–30 wt % and may affect measured partial pressures.
    - The discussion says AlO and Al2O theoretical pressure dependencies disagree with experiment and attributes the discrepancy
      presumptively to inconsistent thermodynamic data for reactions (4)–(6).
    - It says SiO pressures over the melts are 40–50 times those under chemically neutral conditions, Fe red-to-neutral pressure
      ratios are approximately those over FeO, and reducing conditions increase Ca, Mg, and especially Al pressures as oxygen
      pressure falls.
    - Equation (8) relates p(Al) to Al2O3 activity, the reaction equilibrium constant, and p(O); the source prints the relation
      on published p. 727.
    - The total vapor pressure over the melt is stated to be approximately 30 times higher under reducing than chemically
      neutral conditions.
    - The source states that differences in reducing-to-neutral pressure ratios for both samples are no more than 20%; Table
      2 contradicts this for Al ratios 717 and 517 and O ratios 0.012 and 0.016.
    - The article says melt evaporation rates exceed those for individual oxides at the same redox and temperature conditions.
  context_id: shornikov-2008-redox-oxide-evaporation::context::shornikov_2008_qualifications_table2
  work_id: 10.1134/s0016702908070069
  source_id: shornikov-2008-redox-oxide-evaporation
  species: paper_context
