- observation_id: sargeant_2019_sem_xrd_phase_observations
  type: characterization
  locator:
    page: 21
    pdf_page_index: 20
    line_range: 302-332
    section: 3.1.3 Sample Analysis
  units: °C; mg; %
  values:
    quantity: reaction_product_phases
    method_class: measured_qualitative
    sem: ~15 mg of reacted grains per experiment in epoxy, BSE imaging at the Open University
    xrd: ~5 mg (~11%) of the 1000, 1050 and 1100°C samples; Enraf-Nonius Powder Diffraction System 120, CoKa1 source, Natural
      History Museum UK
    1000C: Ilmenite, iron and rutile (partially reduced); voids from oxygen loss
    1050C: Mostly ilmenite, rutile and iron, with evidence that ferropseudobrookite is starting to form; vein-like rutile;
      printed as the melting point of ilmenite
    1100C: Ferropseudobrookite (FeTi2O5) with iron, rutile and ilmenite; titanium-enriched solid solution, often with an unreacted
      ilmenite core; rutile rare or absent
    no_secondary_rutile_reduction: No indication of rutile reducing to e.g. Ti3O5 (PDF p. 29, lines 444-447)
  context_id: sargeant-2019-h2-isru-demo::context::sargeant_2019_sem_xrd_phase_observations
