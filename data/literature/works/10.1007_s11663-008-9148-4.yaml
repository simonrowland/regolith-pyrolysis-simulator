      - '1.2'
      - '3.5'
      equilibration_time_hours: '8'
      temperature_control_uncertainty_K: ±1
      source_claim_temperature_interval_K: '50'
      eq2: log10 gamma(FeO) = -0.7335 log10 X(FeO) - 0.2889; r2 = 0.93
      eq3: log10 gamma(FeO) = 1262/T - 1.1302 X(FeO) + 0.96 X(SiO2) + 0.123 X(CaO) - 0.4198; r2 = 89 pct
      eq2_eq3_correlation_coefficients_as_discussed_pct:
      - '92'
      - '93'
    formula_note: Activities in Tables II-III are calculated by the authors from their equilibrated steel analyses (h[O] =
      [mass pct O] x fO; a(FeO) from h[O] by Eq. [1]); the paper does not print the oxygen analysis or metal composition underlying
      each h[O] number. The a(FeO) and h_O values are carried as activity_coefficient observations.
    source_internal_inconsistencies:
    - 'source_internally_inconsistent: Eq. [2] prints r2 = 0.93 (p. 454) and Eq. [3] prints r2 = 89 pct (p. 455), but p. 455
      states "The correlation coefficients of Eqs. [2] and [3] are practically the same (92 and 93 pct)." Both printed forms
      are carried; not reconciled.'
    - 'source_internally_inconsistent: p. 450 states "the oxygen concentration in steel is expressed in parts per million
      (by mass)", yet Tables II-III (pp. 451-452) print no ppm oxygen column, only h_O. This is why the h[O] reduction inputs
      are typed absent (not_published).'
