context:
- observation_id: basu_2008_attributed_literature_statements
  type: quoted_comparator
  locator:
    page: 447-453
    pdf_page_index: 0-6
    section: II. Stoichiometry; III. Experimentation; IV. Results and Discussion
    note: Statements the paper attributes to other workers or to cited sources; each carries its attribution and reference
      numbers as printed.
  units: verbatim statements
  values:
    quantity: attributed_literature_statements
    method_class: quoted_attributed
    attribution: Basu et al. (2008) quoting or summarising the cited workers named in each claim (reference numbers as printed).
    claims:
    - page: 447
      quotation: “Deo and Boom observed that this nonstoichiometry is of negligible significance in steelmaking operations.[25]
        They suggested that the free energy of formation of “FeO” and that of FexO may be considered as the same. This convention
        has been followed up on in the present work.”
      attribution: Deo and Boom [25]; the convention defines what "FeO" means in Tables II-III
    - page: 448
      quotation: “Similar results were obtained from the commercial thermodynamic packages THERMOCALC* and FACTSAGE.**”
      attribution: commercial packages THERMOCALC and FACTSAGE (footnotes, p. 448); refers to the probable solid fractions
        at 1873 K
    - page: 448-449
      quotation: “Previous investigations have already confirmed the presence of two-phase slag in some of the samples, particularly
        those with higher basicity.[26,27]”
      attribution: present authors earlier work [26,27]
    - page: 450
      quotation: “Similar behavior of FeO activity was observed by several others as well.[18,22,31–34]”
      attribution: refs. [18,22,31-34]
    - page: 450
      quotation: “Turkdogan and Pearson had reported negative deviation of a(FeO) in CaO-MgO-MnO-FeO-SiO2 slags at all FeO
        concentrations, but only when SiO2 concentration was less than 0.8 molar pct (X(SiO2) < 0.008).[9] At higher concentrations
        of SiO2, the activity of FeO exhibited positive deviation.”
      attribution: Turkdogan and Pearson [9]; the second sentence continues their finding
    - page: 450
      quotation: “A similar trend was reported by Kishimoto and co-workers, who concluded that the increase in basicity over
        the range X(CaO)/X(SiO2) = 2.0 to 6.0, at any level of FeO concentration, caused only a marginal decrease in the activity
        coefficient of FeO.[22]”
      attribution: Kishimoto and co-workers [22]
    - page: 450
      quotation: “A similar trend was reported by Bodsworth,[13] Kishimoto et al.,[22] and by Fetters and Chipman[5] as well
        as Turkdogan and Pearson,[9] whose findings are shown in Figure 7.”
      attribution: Bodsworth [13], Kishimoto et al. [22], Fetters and Chipman [5], Turkdogan and Pearson [9]
    - page: 450
      quotation: “The results of Chipman[1] are an exception and show negative deviation over the entire range of FeO concentration.”
      attribution: Chipman [1]
    - page: 453
      quotation: “Turkdogan and Pearson observed that the activity of FeO showed a marginally negative deviation in silica-free
        steelmaking slags, which changed to positive deviation as the SiO2 content was increased.[9] A similar trend has been
        reported by others as well.”
      attribution: Turkdogan and Pearson [9]; others unnamed
