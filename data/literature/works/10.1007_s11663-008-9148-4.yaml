  type: quoted_comparator
  locator:
    page: 448
    pdf_page_index: 1
    table: I
    note: Prior literature summary; secondary findings are retained as attributed context.
  units: as printed
  values:
    quantity: earlier_investigations_activity_feo_summary
    method_class: quoted_attributed
    attribution: Authors' summary of references [1]-[24] and [32].
    table_transcription: 'worker,system_studied,observations_findings

      "Chipman [1]","vacuum decarburized liquid electrolytic iron in equilibrium with H2/H2O gas mixture; Fe(l) + H2O(g) =
      FeO(l) + H2(g)","Fe(l) + 1/2 O2(g) = (FeO); ΔG° = -31,200 - 1.0 T (cal mol-1)"

      "Vacher and Hamilton [2]","liquid Fe containing carbon and oxygen in equilibrium with CO/CO2 gas mixture","free energy
      of formation of FeO similar to that reported by Chipman [1]"

      "Chipman and Marshall [4]","solid wüstite, and liquid “FeO” (separately), in equilibrium with solid Fe and H2/H2O gas
      mixture","FeO(l) + H2(g) = Fe(s) + H2O(g); ΔG° = -7240 + 4.67 T (cal mol-1)"

      "Fetters and Chipman [5,6]","nearly pure liquid iron in equilibrium with CaO-SiO2-FeO-MgO slag rich in iron oxide","log[mass
      pct O]saturation = -4860/T + 1.935; local maximum of [O] solubility at mass pct ratio (CaO + MgO)/SiO2 = 1.8-2.0, for
      all FeO levels"

      "Darken and Gurry [10]","iron and wüstite equilibrated with CO/CO2 mixture","effect of p(O2) on iron-wüstite equilibrium"

      "Richardson and Jeffes [11]","2 Fe(l) + O2(g) = 2 FeO(l)","ΔG° (1808-2000 K) = -111,250 + 21.67 T (cal mol-1)"

      "Bodsworth [13]","liquid FeO-Fe2O3-SiO2 slag in equilibrium with CO/CO2 and H2/H2O gas mixtures","FeO(l) + H2(g) = γ-Fe(s)
      + H2O(g); ΔG° = -23842 + 15.26 T (cal mol-1)"

      "Bishop et al. [17,18]","experimentally determined γ(FeO) in CaO-MgO-SiO2-FeOx slag","estimation of γ(FeO) and γ(MnO)
      in basic open hearth slag"

      "Morales and Fruehan [15]","Fe(l) + [O] = FetO(l)","ΔG° = -27,740 + 11.66 T (cal mol-1)"

      "Suito and Inoue [14]","equilibrium of CaO-SiO2-FetO-MgOsatd.-P2O5-MnO slag and liquid iron over 1823 to 1923 K","γ(FetO)
      increases with increase in X(SiO2) and X(P2O5) as well as increase in temperature"

      "Lee and Suito [21]","experimentally determined γ(FetO) in CaO-Al2O3-FetO and CaO-Al2O3-SiO2-FetO slag at 1873 K","γ(FetO)
      independent of X(FetO) for X(FetO) < 0.1; strong negative deviation of a(SiO2) upto X(SiO2) = 0.4"

      "Liu et al. [32]","Measurement of a(FeO) in CaO-SiO2-Al2O3-MgOsatd.-FeO slag using EMF technique at 1823 K","γ(FeO)
      ranges from 2.2 to 4.7 for X(FeO) upto 0.08; γ(FeO) decreases marginally with increase in FeO concentration within 0
      to 5 mole pct; marginal increase in γ(FeO) when basicity increases from 1.6 to 2.2"

      "Ogura et al. [23]","electrochemical measurement of a(FeO) in CaO-SiO2-FeO slag at 1673 K using zirconia electrolyte","positive
      deviation of a(FeO); γ(FeO) decreases with increasing X(CaO)/X(SiO2) for X(CaO)/X(SiO2) > 1"

      "Haneo and Itagaki [24]","equilibration of FeO-Fe2O3-CaO-SiO2 slag with CO/CO2 gas mixture at 1573 and 1673 K","γ(FeO)
      increases with increasing basicity but no appreciable effect of temperature within 1573 to 1673 K"'
