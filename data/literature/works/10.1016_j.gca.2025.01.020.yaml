  units: as printed
  values:
    quantity: apparatus_and_laboratory_conditions
    method_class: measured_direct
    evidence_class: authors_own_experiment
    starting_material: Reykjanes Ridge Iceland basalt; analytical-grade oxides and carbonates; water added as Al(OH)3
    powder_preparation: ground under ethanol 2 h, decarbonated overnight 400-800 degC at 2 degC/min, ground under ethanol
      at least 2 h
    verification_melt: 1400 degC in air at 1 atm
    inner_capsule: graphite, 2.5 mm OD, 1 mm ID
    buffer_to_silicate_ratio: 4525
    outer_capsule: Au80Pd20, 4 mm OD, packed around inner capsule
    intermediate_capsule: Pt, 3 mm OD, containing Ag2CO3 layer and graphite capsule/lid
    oxygen_buffer: graphite with predominantly C-O fluid, close to C-CO-CO2
    chlorine_buffer: liquid Ag in equilibrium with AgI-AgCl melt; same starting AgI:AgCl ratio
    apparatus: end-loaded half-inch piston cylinder at University of Oxford
    pressure_medium: CaF2 at 1.0 and 1.5 GPa; NaCl-borosilicate glass assembly at 0.5 GPa
    furnace: graphite furnace
    thermocouple: alumina-sheathed C-type thermocouple; at 0.5 GPa introduced through MgO hole and separated from capsule
      by 0.5 mm alumina disc
    temperature_program: 0.5 and 1 GPa at 1200 degC; 1.5 GPa at 1300 degC after partial crystallization at 1200 degC
    analysis_epma: Cameca SXFive-FE, 15 kV; 4 nA and 20 um defocused beam for glass/chloride-iodide, 20 nA and 1 um focused
      beam for metal blobs
    analysis_sims: Cameca IMS-7f GEO; 16O- primary beam, 5 nA, 18 kV, approximately 10 um spot
    run_duration: absent_not_printed
    sample_mass: absent_not_printed
    exposed_area: absent_not_printed
    vacuum_or_pumping: not_applicable_high_pressure_capsule_experiment
