  apparatus:
    cell_material_and_liner:
      state:
        tag: value
        value: 'Mo Knudsen cell (lid, body, orifice plate) with alumina inner crucible. Fig. 3: outer 27 mm phi, inner crucible
          16 mm phi, inner height 22 mm, outer height 27 mm. Orifice about 0.18 mm phi in a 0.05 mm plate (Fig. 5 example
          annotated 0.19 O). Estimated melt-surface:orifice-area ratio about 1e4:1. NEVA (Nippon Electric Varian) NAG-530
          quadrupole mass filter. Alumel-chromel thermocouple in the lid well. Ionization 70 eV, 0.1 mA for all samples.'
      locator:
        published_page: 527
        pdf_page_index: 2
        figure: '1'
        note: NEVA NAG-530 quadrupole mass filter; Mo Knudsen cell; alumina inner crucible
    geometry:
