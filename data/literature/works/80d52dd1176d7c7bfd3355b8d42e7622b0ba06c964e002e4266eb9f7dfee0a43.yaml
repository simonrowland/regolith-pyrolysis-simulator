- observation_id: sanders_1977_method_atmosphere_context
  type: context
  units: as printed
  locator:
    page: 1
    published_page: 138
    pdf_page_index: 0
    section: II. Experimental Procedure
  values:
    apparatus_as_printed: Transpiration apparatus; recondensing saturation system loaded nitrogen and argon carrier gases
      with known amounts of water vapor; well-stirred melts; equilibrium measurements.
    carrier_gases_as_printed:
    - nitrogen
    - argon
    carrier_gas_assignment: The paper does not assign nitrogen or argon to individual Table I rows.
    oxygen_as_printed: 200 ± 50 ppm O2 throughout the measurements; measured at the equilibrium-chamber exit with a stabilized
      zirconia-based oxygen meter.
    dry_gas_water_as_printed: 350 ± 100 ppm H2O in the “dry” gas, measured at the end of the gas train.
    water_saturation_system_temperature_as_printed: held to ±0.1°C
    total_pressure_as_printed: 1 atm throughout the present work.
    gas_volume_measurement_as_printed: Wet-test meter at the end of the gas train.
    sodium_collection_analysis_as_printed: Sodium compounds condensed in the collection system and were analyzed with an atomic
      emission spectrometer.
    measurement_count_as_printed: Average of at least 4 independent measurements of Na vapor density for each water pressure.
    uncertainty_as_printed: Uncertainty in the mean values is 3 standard deviations; the numerical error-bar widths are not
      tabulated and are not digitized.
  context_id: sanders-1977-water-vapour-na-vaporization::context::sanders_1977_method_atmosphere_context
  work_id: 80d52dd1176d7c7bfd3355b8d42e7622b0ba06c964e002e4266eb9f7dfee0a43
  source_id: sanders-1977-water-vapour-na-vaporization
  species: Na
- observation_id: sanders_1977_na2o_standard_state_context
  type: context
  units: as printed
  locator:
    page: 3
    published_page: 140
    pdf_page_index: 2
    equation: '4'
  values:
    activity_definition_as_printed: a_Na2O is the pressure of that component over the solution divided by its pressure over
      pure liquid Na2O at the same temperature.
    standard_state_as_printed: Pure liquid Na2O at the same temperature.
    standard_state_statement_locators:
    - page: 3
      published_page: 140
      pdf_page_index: 2
      equation: '4'
    - page: 3
      published_page: 140
      pdf_page_index: 2
      equation: '9'
    equations_as_printed:
      eq2: Na2O(g) -> 2 Na(g) + 1/2 O2(g)
      eq3: K1 = P_Na(g)^2 P_O2(g)^(1/2) / P_Na2O(g)
      eq5: Na2O(l) -> 2 Na(g) + 1/2 O2(g)
      eq6: K2 = P°_Na(g)^2 P°_O2(g)^(1/2)
      eq8: Na2O(g) + H2O(g) -> 2 NaOH(g), with K3
      eq10: Na2O(l) + H2O(g) -> 2 NaOH(g), with K4
      eq13: P_t = 82.06 × 273.15 × rho_t / 22.99 atm
      eq15: P_NaOH^2 = (P_O2^(1/2) K4/K2) P_Na^2 P_H2O
      eq16: P_Na is calculated from rho_t, K′, and P_H2O^(1/2)
      eq17: K′ = sqrt(P_O2^(1/2) K4/K2)
      eq18: a_Na2O = sqrt(974.98 m K4)
    equilibrium_constant_units: No separate units are printed for K2 or K4; retain the tabulated value and equation.
  context_id: sanders-1977-water-vapour-na-vaporization::context::sanders_1977_na2o_standard_state_context
  work_id: 80d52dd1176d7c7bfd3355b8d42e7622b0ba06c964e002e4266eb9f7dfee0a43
  source_id: sanders-1977-water-vapour-na-vaporization
  species: Na2O
