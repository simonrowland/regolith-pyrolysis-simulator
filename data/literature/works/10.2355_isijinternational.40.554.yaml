    error_class: author_estimate
    affected_quantity: activity coefficient of Si1/2O
    approximate_percent: 1
    system: CaO-SiO2-AlO1.5
    temperature_K: 1823
    scope: authors estimate the effect of integration scatter for the alumina-bearing system; this is not analytical precision
      or a general uncertainty on a(SiO2).
  context_id: morita-2000-sio2-activity-si-alloys::context::morita_2000_author_estimate_alumina_integration_error
