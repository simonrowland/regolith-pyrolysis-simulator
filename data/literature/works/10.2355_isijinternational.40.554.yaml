context:
- observation_id: morita_2000_activity_method_and_equations
  type: thermodynamic_example
  locator:
    page: 2
    published_page: 555
    section: 3.1 Derivation of the Activity of SiO2 and 3.2 Estimation of the Activity of Si
    note: Equations 1-16 are on published page 555; equations 17-18 are on published page 556.
  units: as printed
  values:
    quantity: activity derivation
    silica_standard_state: SiO2(s), pure-solid activity standard; polymorph not named
    silicon_standard_state: Si(l), liquid silicon reference state
    equation_1: X_1 d ln γ_1 + X_2 d ln γ_2 = 0
    equation_2: X_1 d ln γ_1 + X_2 d ln(B·γ_1) = 0
    equation_3: (X_1 + X_2)d ln γ_1 + X_2 d ln B = 0
    equation_4: d ln γ_1 = −X_2 d ln B
    equation_5: ln γ_1 = ∫_(X_2=X_2°)^(X_2) −X_2 d ln B + ln γ_1°(X_2=X_2°)
    equation_6: Si_1/2O(s) + Ca(l) = CaO(s) + 1/2 Si(l)
    equation_7: K[6] = (γ_CaO·X_CaO·a_Si^(1/2))/(γ_Si1/2O·X_Si1/2O·a_Ca)
    equation_8: B = γ_CaO/γ_Si1/2O = (X_Si1/2O·γ_Ca·X_Ca)/(X_CaO·γ_Si^(1/2)·X_Si^(1/2))·K[6]
    equation_9: X_1 d ln γ_1 + X_2 d ln γ_2 + X_3 d ln γ_3 = 0
    equation_10: d ln γ_1 + X_2 d ln B + X_3 d ln C = 0; B = γ_2/γ_1, C = γ_3/γ_1
    equation_11: d ln γ_1 = −X_2 d ln B − kX_2 d ln C
    equation_12: ln γ_1 = ∫_(X_2=X_2°)^(X_2) −X_2 d ln(B·C^k) + ln γ_1°(X_2=X_2°); k = X_3/X_2
    equation_13: Si_1/2O(s) + xM(l) = M_xO(s) + 1/2 Si(l); M is Al or Mg
    equation_14: K[13] = (γ_MxO·X_MxO·a_Si^(1/2))/(γ_Si1/2O·X_Si1/2O·a_M^x)
    equation_15: C = γ_MxO/γ_Si1/2O = (X_Si1/2O·γ_M^x·X_M^x)/(X_MxO·a_Si^(1/2))·K[13]
    silica_conversion: a_SiO2 = a_Si1/2O^2
    equation_16: X_1 d ln γ_1 + X_2 d ln γ_2 + kX_3 d ln γ_3 = 0
    equation_17: d ln γ_1 = −(X_2/X_1) d ln(γ_2·γ_3^k)
    equation_18: ln γ_1 = ∫_(X_2=0)^(X_2) −(X_2/X_1) d ln(γ_2·γ_3^k)
    alloy_silicon_activity: The activity of Si is calculated by Gibbs-Duhem integration; in most experiments a(Si) was found
      equal to XSi because it was nearly unity.
    saturation_boundary: The silica-saturated composition is used as the lower integration limit.
  context_id: morita-2000-sio2-activity-si-alloys::context::morita_2000_activity_method_and_equations
  work_id: 10.2355/isijinternational.40.554
  source_id: morita-2000-sio2-activity-si-alloys
  species: SiO2
