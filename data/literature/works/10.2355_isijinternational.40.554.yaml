- observation_id: morita_2000_auxiliary_thermodynamic_data
  type: thermodynamic_example
  locator:
    page: 2
    published_page: 555
    table: '1'
  units: J/mol for ΔG°; dimensionless for γ and ε expressions
  quote: Morita, Kume & Sano list the alloy auxiliary quantities in Table 1 from T. Miki, K. Morita & N. Sano (refs. 4–5),
    and cite R. G. Berman et al. (ref. 6), JANAF (ref. 7), and T. Wakasugi & N. Sano (ref. 8) for the standard Gibbs-energy
    expressions.
  values:
    quantity: auxiliary thermodynamic inputs taken from cited work
    method_class: quoted_attributed
    evidence_class: quoted_attributed
    attribution: T. Miki, K. Morita & N. Sano (refs. 4–5); R. G. Berman, T. H. Brown & H. J. Greenwood (ref. 6); JANAF (ref.
      7); T. Wakasugi & N. Sano (ref. 8)
    standard_gibbs_energy_Ca: ΔG° = 156,000 − 20.0T J/mol; refs. 6–8
    standard_gibbs_energy_Al: ΔG° = 132,100 − 14.31T J/mol; refs. 6–7
    standard_gibbs_energy_Mg: ΔG° = 134,700 − 16.85T J/mol; refs. 6–7
    ln_gamma0_Ca_l: ln γ°_Ca(l) = −14300/T + 1.55; refs. 4–5
    ln_gamma0_Al_l: ln γ°_Al(l) = −3610/T + 0.452; refs. 4–5
    ln_gamma0_Mg_l: ln γ°_Mg(l) = −11300/T + 4.51; refs. 4–5
    epsilon_Ca_Ca: ε_Ca^Ca = 55600/T − 22.1; refs. 4–5
    epsilon_Al_Al: ε_Al^Al = 1.00 × 10^5/T − 40.1; refs. 4–5
    epsilon_Mg_Mg: ε_Mg^Mg = 6.02; refs. 4–5
    epsilon_Ca_Al: ε_Ca^Al = 6.46; refs. 4–5
    measured_here: No alloy activity coefficient or interaction parameter is measured in this paper; the alloy inputs in Table
      1 are cited to refs. 4–5.
    standard_state_notes: The printed reaction species use Si(l), Ca(l), Al(l), and Mg(l); the paper gives no separate prose
      definition of the superscript ° convention.
    reference_4: 'T. Miki, K. Morita and N. Sano: Metall. Mater. Trans. B, 29B (1998), 1043.'
    reference_5: 'T. Miki, K. Morita and N. Sano: Mater. Trans. JIM, 40 (1999), 1108.'
    reference_6: 'R. G. Berman, T. H. Brown, and H. J. Greenwood: Report No. TR-377, Atomic Energy of Canada Limited, Mississauga,
      Ontario (1985).'
    reference_7: 'JANAF Thermochemical Tables, 3rd ed.: J. Phys. Ref. Data, 14 (1985), suppl. 1.'
    reference_8: 'T. Wakasugi and N. Sano: Metall. Trans. B, 20B (1989), 431.'
  context_id: morita-2000-sio2-activity-si-alloys::context::morita_2000_auxiliary_thermodynamic_data
