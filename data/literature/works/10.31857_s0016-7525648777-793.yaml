  units: as stated
  values:
    method_class: model_derived
    attribution: Theoretical analysis by Yakovlev and Shornikov; no new measurements are reported.
    source_scope: Analytical Hertz-Knudsen evaporation and Rayleigh isotope-fractionation equations for Ca-Al-inclusion melts,
      followed by qualitative comparison to results published by other workers.
    experimental_method: Not applicable to the present theoretical analysis.
    cell_material_and_liner: Not applicable; no experimental cell is used or specified for this model.
    orifice_diameter_and_channel_length: Not applicable; no effusion apparatus is used or specified.
    pressure_calibration_and_ionization: Not applicable; no ion-current or measured-pressure conversion is performed.
    temperature_measurement_or_calibration: Not applicable; temperatures enter equations and cited experiments, but no temperature
      is measured in this paper.
    chamber_background_pressure: Not reported as an experimental condition. The idealized vacuum equations set surrounding
      vapor partial pressure P_i_prime approximately equal to zero.
    sample_preparation_and_composition: No samples are prepared in this theoretical paper. Mixture compositions shown in Figure
      1 belong to cited experiments.
    activities_and_standard_state: No measured oxide activities are reported. In the model a_i = x_i gamma_i, and P_i_zero
      is the equilibrium vapor pressure over the pure component at the same temperature (Raoult-Henry reference).
    isotope_activity_standard_state: 'P. 783, left column below the exchange-reaction equilibrium expression: in the standard
      state, vapor and melt contain only one isotope. This isotope-activity reference is distinct from the pure-component
      vapor-pressure reference on pp. 787-788.'
    tables: No numbered data tables or measured-value tables occur in the 17-page article.
    scan_and_translation: Russian-language article, checked against all 17 page images rendered at 220 dpi. The printed English
      title on p. 793 is retained as printed; its wording “Chemical and Magnesium and Silica Isotope Fractionation” is grammatically
      awkward.
    citation_provenance: P. 777 prints ГЕОХИМИЯ and the author line "О. И. Яковлев^а,*, С. И. Шорников^а,**"; the superscript
      "а" is the affiliation mark keyed to the Vernadsky Institute line, and the PDF text layer merges it into "Яковлева".
      The even-page running heads (pp. 778-792) print "ЯКОВЛЕВ, ШОРНИКОВ", the e-mail is yakovlev@geokhi.ru, and p. 793 prints
      Geokhimia and "O. I. Yakovlev, S. I. Shornikov". The first author is therefore Yakovlev; "yakovleva" in the source_id
      and observation ids is a legacy intake key taken from the text layer, not the printed name or a transliteration of it
      (source_id not renamed here). Geochemistry in the former intake citation translated the journal name. The sidecar title
      is an intake English translation, not the printed English title.
