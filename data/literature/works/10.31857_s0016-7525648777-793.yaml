- observation_id: yakovleva_2019_conclusions_and_directional_qualifiers
  type: author_conclusions
  locator:
    published_pages: '791'
    section: Conclusion
  units: as stated
  values:
    method_class: model_derived
    attribution: Authors’ conclusions, with experimental comparisons attributed in the text to Richter et al. (2002) and Mendybaev
      et al. (2013, 2017, 2018).
    conventional_rayleigh_qualification: Authors call the conventional Rayleigh equation not fully suitable for analyzing
      fractional isotope evaporation because its “ideal” fractionation factor is constant and reflects only isotope mass differences.
    alternative_rayleigh_conclusion: The alternative equation incorporates isotope distribution coefficients and their ratio,
      yielding a fractionation factor that depends on temperature and evaporating-melt composition.
    chemistry_isotope_coupling: The activity coefficient changes with the evolving chemical environment; the authors say this
      changes component evaporation rates and therefore melt and vapor compositions.
    relative_fractionation_conclusion: As CaO accumulates, the MgO activity coefficient increases and the SiO2 activity coefficient
      decreases; Mg evaporation speeds up while SiO2 evaporation slows, increasing the difference between F_Mg and F_Si and
      slowing delta29,30Si fractionation relative to delta25,26Mg.
    mineral_evolution_context: 'P. 791, left column before Conclusion, attributed to Mendybaev et al. (2017): normative residue
      composition evolves from forsterite-rich (Mg2SiO4) to gehlenite-rich (Ca2Al2SiO7), becoming richer in calcium and more
      basic. Silicon evaporation and its isotope fractionation relative to magnesium slow as Si activity decreases; declining
      MgO concentration and rising MgO activity coefficient have opposing effects on MgO activity.'
