- observation_id: yakovleva_2019_rayleigh_equations_and_caveats
  type: isotope_model_and_limitations
  locator:
    published_pages: 780-787
    equation: 7-25
  units: dimensionless isotope ratios and fractions
  values:
    method_class: model_derived
    attribution: Authors compare the conventional Rayleigh form with their alternative derivation.
    notation: L = melt; V = vapor; 0L = initial melt; x = mole fraction; n = isotope moles; N = total moles; prime/double_prime
      distinguish light/heavy distribution coefficients. The heavy isotope changes from 26Mg in (14)-(18) to 25Mg in (23)-(25),
      as printed.
    conventional_equation_7: 'P. 780: R/R0 = F^(alpha-1), with F the fraction of the element remaining in the melt, 1 > F
      > 0, heavy isotope in the numerator of R and R0, and R/R0 > 1. The text dates the Rayleigh distillation equation to
      1896.'
    isotope_equation_8: 'P. 780: (x_25Mg/x_24Mg)^L / (x_25Mg/x_24Mg)^0L = F_Mg^(alpha-1).'
    conventional_assumptions: 'P. 782: the conventional form derived from Hertz-Knudsen uses a constant ideal isotope fractionation
      factor determined only by isotope mass ratio, independent of evolving residue composition; the residue is isotopically
      homogeneous and continuously mixed; melt and vapor are in thermodynamic equilibrium, but vapor is continually and instantaneously
      removed without further contact with the residue. The authors argue this cannot represent factor changes with temperature
      or melt composition.'
    equations_9_and_10: 'P. 781: (9) (J_i/J_k)/(P_i/P_k) = sqrt(m_k/m_i); (10) (x_i/x_k)^V/(x_i/x_k)^L = sqrt(m_k/m_i). The
      substitutions are J_i/J_k = (x_i/x_k)^V, P_i/P_k = (x_i/x_k)^L, and P_i proportional to x_i^L.'
    factor_equation_11: 'P. 781: alpha_ik = alpha_ik^Eq * alpha_ik^Kin; alpha_ik^Eq = (x_i/x_k)^L/(x_i/x_k)^V; (11) alpha_ik^Kin
      = (phi_i/phi_k)*sqrt(m_k/m_i). The equilibrium-factor convention here is reciprocal to the later (18); both are retained
      as printed.'
    kinetic_factor_equation_12: 'P. 781: assuming alpha_ik^Eq approximately 1 and phi_i/phi_k = 1, (12) alpha_ik approximately
      equals alpha_ik^Kin = sqrt(m_k/m_i).'
    conventional_equation_13_and_richter_form: 'P. 781: (13) R/R0 approximately equals F^(sqrt(m_k/m_i)-1). The unnumbered
      Richter form is R_ik/R_ik,0 = F_k^(alpha_ik-1), with k the most abundant isotope, 24Mg or 28Si. Since i is heavier than
      k, m_k/m_i < 1; greater departure of alpha from 1 gives more effective separation.'
    ideal_and_experimental_comparisons: 'P. 782, left column: ideal potassium factor (39/41)^0.5 versus experimental (39/41)^0.43,
      attributed to Richter et al. (2011); experimentally, alpha_Mg and alpha_Si are considerably closer to 1 than the ideal
      factors sqrt(24/25) and sqrt(44/45) (silica evaporating from the melt as SiO), attributed to Davis et al. (1990), Wang
      et al. (2001), Richter et al. (2002) and Knight et al. (2009). Equation (6), p. 780, uses sqrt(44/46) for the 30SiO/28SiO
      pair; with 16O, 44/45/46 are the 28SiO/29SiO/30SiO masses, and the paper does not state which Si isotope pair sqrt(44/45)
      refers to. Both values are kept as printed; the print does not contradict itself. P. 782, right column discusses phi_i/phi_k
      not equal to 1 as a proposed explanation.'
    exchange_reaction_and_activity_equilibrium: 'P. 783: 26Mg^L + 24Mg^V = 26Mg^V + 24Mg^L; K_a = exp(-DeltaG_zero/(R*T))
      = (a_26Mg^V*a_24Mg^L)/(a_26Mg^L*a_24Mg^V) = [(x_26Mg^V*x_24Mg^L)/(x_26Mg^L*x_24Mg^V)]*[(gamma_26Mg^V*gamma_24Mg^L)/(gamma_26Mg^L*gamma_24Mg^V)]
      = K_x*K_gamma. Thus K_x = exp(-DeltaG_zero/(R*T))*(gamma_26Mg^L*gamma_24Mg^V)/(gamma_26Mg^V*gamma_24Mg^L). DeltaG_zero
      = f(T,P); composition enters through K_gamma. gamma_24Mg^L approximately gamma_26Mg^L and gamma_24Mg^V approximately
      gamma_26Mg^V imply K_gamma approximately 1.'
    equations_14_and_15: 'P. 783: (14) K_x = exp(-DeltaG_zero/(R*T)) = (x_26Mg^V*x_24Mg^L)/(x_26Mg^L*x_24Mg^V); (15) (x_26Mg^V*x_24Mg^L)/(x_26Mg^L*x_24Mg^V)
      = (x_26Mg/x_24Mg)^V/(x_26Mg/x_24Mg)^L = K_D.'
    equations_16_and_17: 'P. 783: (16) K_D = (x_26Mg/x_24Mg)^V/(x_26Mg/x_24Mg)^L = (x_26Mg^V/x_26Mg^L)/(x_24Mg^V/x_24Mg^L)
      = K_d_double_prime/K_d_prime; K_d_prime = x_24Mg^V/x_24Mg^L and K_d_double_prime = x_26Mg^V/x_26Mg^L. (17) K_D = (x_26Mg/x_24Mg)^V/(x_26Mg/x_24Mg)^L
      = exp(-DeltaG_zero/(R*T)).'
    equation_18_and_rate_constants: 'P. 784: (18) alpha = (x_26Mg/x_24Mg)^V/(x_26Mg/x_24Mg)^L; K_x = exp(-DeltaG_zero/(R*T))
      = k_forward/k_reverse; K_x = K_D = alpha. Even alpha approximately 1 can produce substantial cumulative separation when
      relatively large amounts of melt enter the vapor.'
    initial_mole_balance: 'P. 784, right column: K_d_prime = x_24Mg^V/x_24Mg^L; x_24Mg^V = K_d_prime*x_24Mg^L; x_24Mg^0L =
      n_24Mg^0L/N^0L; N^0L = N^L + N^V.'
    equations_19_and_20_and_melt_fraction: 'P. 785: F = N^L/N^0L, decreasing from 1 initially to 0 at complete evaporation;
      1-F = N^V/N^0L. (19) x_24Mg^L = n_24Mg^L/N^L; n_24Mg^L = N^L*x_24Mg^L. (20) x_24Mg^V = (-dn_24Mg^L)/(-dN^L) = dn_24Mg^V/dN^V.'
    differential_derivation: 'P. 785: dn_24Mg^L = N^L*dx_24Mg^L + x_24Mg^L*dN^L; dn_24Mg^L/dN^L = (N^L/dN^L)*dx_24Mg^L + x_24Mg^L;
      the left side is expression (20), i.e. x_24Mg^V, which can be written x_24Mg^V = K_D_prime*x_24Mg^L (printed K''_D,
      capital-D subscript, left column; the following lines and equation (21) print K''_d, carried as K_d_prime; the paper
      does not comment on the subscript change); hence K_d_prime*x_24Mg^L = (N^L/dN^L)*dx_24Mg^L + x_24Mg^L; x_24Mg^L*(K_d_prime-1)
      = (N^L/dN^L)*dx_24Mg^L; dx_24Mg^L/x_24Mg^L = (K_d_prime-1)*dN^L/N^L; dln(x_24Mg^L) = (K_d_prime-1)*dln(N^L).'
    integration_and_equation_21: 'P. 785: integral from x_24Mg^0L to x_24Mg^L of dln(x_24Mg^L) = (K_d_prime-1)*integral from
      N^0L to N^L of dln(N^L); ln(x_24Mg^L/x_24Mg^0L) = (K_d_prime-1)*ln(N^L/N^0L) = (K_d_prime-1)*ln(F); (21) x_24Mg^L/x_24Mg^0L
      = F^(K_d_prime-1).'
    equations_22_and_23: 'P. 786: replacing total residue fraction F by Mg residue fraction F_Mg gives (22) x_24Mg^L/x_24Mg^0L
      = F_Mg^(K_d_prime-1); (23) x_25Mg^L/x_25Mg^0L = F_Mg^(K_d_double_prime-1), where K_d_double_prime = x_25Mg^V/x_25Mg^L.
      Prior-worker notation instead uses F_24Mg and F_Si or F_28Si.'
    equations_24_and_25: 'P. 786: (24) x_25Mg^L/x_24Mg^L = (x_25Mg^0L/x_24Mg^0L)*F_Mg^(K_d_double_prime-K_d_prime); alpha
      = (x_25Mg/x_24Mg)^V/(x_25Mg/x_24Mg)^L = K_d_double_prime/K_d_prime; K_d_double_prime = alpha*K_d_prime; (25) x_25Mg^L/x_24Mg^L
      = (x_25Mg^0L/x_24Mg^0L)*F_Mg^[K_d_prime*(alpha-1)].'
    qualifications: 'P. 785, left column: the Rayleigh equation is derived under the condition of constancy of K_D_prime (printed
      K''_D, capital-D subscript; the subsequent lines and equation (21) print K''_d, carried here as K_d_prime), which the
      paper calls a serious assumption, and also under constant temperature, i.e. isothermal evaporation; p. 786 describes
      instantaneous removal of equilibrium vapor as an extremely nonequilibrium fractionation process. Pp. 786-787 explicitly
      say equations (24) and (25) are not perfect because K_d_prime and K_d_double_prime are assumed constant throughout evaporation
      but generally change with evolving melt composition and duration.'
    equilibrium_fractionation: The paper also relates isotope partitioning between coexisting vapor and melt to exp(-DeltaG_zero/(R*T));
      it notes the canonical equilibrium factor depends on temperature and system composition and is not a constant.
