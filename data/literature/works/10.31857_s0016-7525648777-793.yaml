- observation_id: yakovleva_2019_hertz_knudsen_and_speciation_model
  type: model_equations_and_assumptions
  locator:
    published_pages: 779-781
    equation: 1-6
  units: J in mol cm^-2 s^-1; P in dyn cm^-2; R in erg mol^-1 K^-1; T in K; m in g mol^-1, as printed on p. 779
  values:
    method_class: model_derived
    attribution: Equations and analysis presented by the authors.
    equation_1: J_i = phi_i (P_i - P_i_prime) / sqrt(2*pi*R*T*m_i).
    equation_2_vacuum: J_i = phi_i*P_i / sqrt(2*pi*R*T*m_i), for surrounding-vapor partial pressure approximately zero.
    evaporation_condensation_equilibrium: 'P_i > P_i_prime: evaporation; P_i_prime > P_i: condensation; equality: equilibrium
      and zero net rate.'
    temperature_rate_qualifier: Although the Hertz-Knudsen expression contains T to the minus one-half power, the authors
      say saturated vapor pressure rises much faster with temperature, so net evaporation rate increases as temperature rises.
    evaporation_coefficient: phi_i is experimentally determined and no greater than 1. The paper says reported phi_Mg and
      phi_SiO estimates differ substantially from unity and are contradictory or unreliable; phi should be considered for
      crystalline evaporation but may be neglected for liquid evaporation, according to the cited literature.
    vapor_species_sums: P[Si] = pSi + pSiO + pSiO2; P[Mg] = pMg + pMgO.
    magnesium_rate_sum: 'P. 779, bottom right: J[Mg] = J_Mg + J_MgO = phi_Mg*p_Mg/sqrt(2*pi*R*T*m_Mg) + phi_MgO*p_MgO/sqrt(2*pi*R*T*m_MgO).'
    dominant_vapor_forms: Above silicate melts, Mg and SiO partial pressures are stated to be about two orders of magnitude
      greater than those of the other listed Mg- and Si-bearing vapor forms; the authors consequently neglect the other forms
      in the simplified rate expressions.
    simplified_element_rates: 'P. 780, left column: J[Mg] = phi_Mg*P_Mg/sqrt(2*pi*R*T*m_Mg); J[Si] = phi_SiO*P_SiO/sqrt(2*pi*R*T*m_SiO).'
    rate_ratio_equation_3: J[Si]/J[Mg] = (phi_SiO*P_SiO)/(phi_Mg*P_Mg) * sqrt(m_Mg/m_SiO).
    general_isotope_equation_4: 'P. 780: J_i/J_k = (phi_i*P_i)/(phi_k*P_k) * sqrt(m_k/m_i), with i heavy and k light.'
    isotope_rate_ratios_equations_5_and_6: 'P. 780: (5) J(25Mg)/J(24Mg) = P(25Mg)/P(24Mg) * sqrt(m_24Mg/m_25Mg) = P(25Mg)/P(24Mg)
      * sqrt(24/25); (6) J(30SiO)/J(28SiO) = P(30SiO)/P(28SiO) * sqrt(m_28SiO/m_30SiO) approximately equals P(30SiO)/P(28SiO)
      * sqrt(44/46), treating oxygen as 16O.'
