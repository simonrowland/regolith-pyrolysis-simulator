- observation_id: yakovleva_2019_multicomponent_activity_and_acidity_model
  type: model_equations_and_directional_claims
  locator:
    published_pages: 787-791
    equations: 26-31
    figure: '1'
  units: Activities dimensionless; concentrations in mole fraction unless stated otherwise.
  values:
    method_class: model_derived
    attribution: Theoretical relationships proposed by Yakovlev and Shornikov; supporting activity calculations are attributed
      to Yakovlev et al. (2017), not reproduced as a data table here.
    activity_definition: a_i = x_i*gamma_i; equilibrium partial pressure in the model is P_i = P_i_zero*a_i.
    equation_26_rate_activity_ratio: 'P. 787: J[Si]/J[Mg] proportional to a_SiO2/a_MgO.'
    activity_modified_hertz_knudsen_equations_27_and_28: 'P. 788: unnumbered J_i = phi_i(P_i_zero*a_i - P_i_prime)/sqrt(2*pi*R*T*m_i);
      (27) J_i = phi_i(P_i_zero*x_i*gamma_i - P_i_prime)/sqrt(2*pi*R*T*m_i); in vacuum P_i_prime approximately zero, (28)
      J_i = phi_i*P_i_zero*a_i/sqrt(2*pi*R*T*m_i) = phi_i*P_i_zero*x_i*gamma_i/sqrt(2*pi*R*T*m_i).'
    equation_29_rate_ratio: 'P. 788: J[Si]/J[Mg] = (phi_SiO*P_SiO_zero*x_SiO2*gamma_SiO2)/(phi_Mg*P_Mg_zero*x_MgO*gamma_MgO)
      * sqrt(m_Mg/m_SiO).'
    oxide_system: CaO-MgO-Al2O3-SiO2; SiO2 is classified acidic, Al2O3 amphoteric, and CaO and MgO basic. CaO is described
      as more strongly basic and more dissociated than MgO.
    activity_coefficient_temperature_qualifier: 'P. 788: ideal solutions have gamma_i = 1; real-solution activity coefficients
      can be either greater or less than 1. The authors say real silicate-melt activity coefficients are generally below 1;
      as temperature rises, intermolecular forces weaken, the melt approaches ideal-solution behavior, gamma tends toward
      1, and component activity approaches its mole fraction.'
    activity_pressure_qualifier: For a component with an activity coefficient below 1, transfer to the vapor is described
      as hindered and its partial pressure above the melt is lowered.
    equations_30_and_31: 'P. 789, left column: partial ln(gamma_MgO)/partial ln(a_O2_minus) = beta_MgO, with beta_MgO = [Mg2+]/([Mg2+]+[MgO]);
      partial ln(gamma_SiO2)/partial ln(a_O2_minus) = -lambda_SiO2, with lambda_SiO2 = [SiO3_2minus]/([SiO3_2minus]+[SiO2]).
      Both are partial derivatives; O2_minus denotes the oxygen ion O^2-, not molecular oxygen. P. 789 defines beta as the
      degree of dissociation of MgO in the melt and lambda as the degree of association of SiO2 in the melt; the minus sign
      of lambda_SiO2 means that silica in the melt is not a donor of oxygen ions but their acceptor.'
    directional_claims: With increasing melt basicity or oxygen-ion activity, gamma_MgO and MgO activity increase while gamma_SiO2
      and SiO2 activity decrease. As refractory CaO accumulates, Mg evaporation accelerates while SiO2 evaporation slows;
      the difference between F_Mg and F_Si grows and Si isotope fractionation slows relative to Mg.
    composition_dependent_exception: 'For melts with more than 35 mass percent SiO2, the paper says SiO2 activity exceeds
      MgO activity and Si evaporates faster; in MgO-rich melts where MgO activity is higher, Mg evaporates faster. The cited
      Richter et al. (2002) CAI Type B example is an exception to the simple activity-concentration rule: calculated MgO activity
      and concentration decrease during evaporation while Mg flux increases.'
    prior_experimental_threshold: Mendybaev et al. (2017) are cited as finding that the linear Mg-Si isotope-fractionation
      trend breaks below 15 mass percent MgO.
    prior_experimental_cause_qualification: The authors say the earlier workers reported the silicon-fractionation slowdown
      for residues with high total and MgO mass losses but did not explain its cause.
    isotope_delta_definitions: 'P. 789, unnumbered equations, right column: delta^xMg = [(xMg/24Mg)_sample/(xMg/24Mg)_standard
      - 1]*1000 per mil, x = 25 or 26; delta^xSi = [(xSi/28Si)_sample/(xSi/28Si)_standard - 1]*1000 per mil, x = 29 or 30.
      Here x is the isotope mass number. The p. 790 caption instead normalizes plotted series 1 and 2 to initial-sample isotope
      ratios.'
    isotope_rate_residue_proportion: 'P. 790, left column: J[Si]/J[Mg] proportional to F_Mg/F_Si proportional to (delta^jSi/delta^iMg)^L.'
