    caption_as_printed: Fig. 7. A plot of the chemical composition of residues vs. percent of initial mass evaporated shows
      that most of the iron is evaporated in the first 50% of mass loss. The other oxides steadily increase in this interval.
      After 50% mass loss, the refractory oxides CaO, Al2O3, and TiO2 continue to increase and MgO and SiO2 evaporate. The
      temperature for each data point is shown along the top and different temperatures are indicated with different symbols.
      Residues produced at 1800°C and 2000°C fall along the same paths. The average bulk composition of CAI is close to the
      composition produced by 93% evaporation of solar composition material.
