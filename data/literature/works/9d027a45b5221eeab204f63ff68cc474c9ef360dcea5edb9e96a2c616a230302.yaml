    note: Sample OREX-501044-0 was prepared from approximately 100 avionics-deck particles on a carbon sticker. Particle sizes
      are printed as <1 µm to ~300 µm. Potential inclusion-bearing phases were screened by EDS in a FEI Helios 660 Nanolab
      G3 FIB-SEM at K-ALFAA; extracted electron-transparent sections were analyzed in a Hitachi HF5000 S/TEM at K-ALFAA using
      SAED, EDS, and EELS. The source names two pyrrhotite and two carbonate grains targeted to date.
