  type: measured_spectra_context
  locator:
    page: 2
    pdf_page_index: 1
    section: Results and discussion
  units: mol% oxide; °C; nm; cm−1; absorbance in arbitrary units
  reason: Measured absorption spectra and qualitative peak trends; no numeric Cr or Mn valence-ratio observations and no store
    quantity token for absorbance spectra.
  candidate_tokens:
  - valence_ratio
  values:
    quantity_as_printed: high-temperature UV-vis-NIR absorption spectra and absorption-band peak intensities
    quantity_token: unavailable
    schema_gap: No existing quantity enum represents absorbance spectra or peak intensity.
    species:
    - Cr
    - Mn
    phase: soda-lime-silicate glass
    composition_as_printed: 16Na2O-10CaO-74SiO2 (mol%); samples contain 0.68 mol% MnO, 0.22 mol% CrO3, or 0.22 mol% CrO3 +
      0.67 mol% MnO
    temperature_as_printed: spectra measured from 25 to 800 °C; Fig. 3 series at 25, 400, 600, 700, and 800 °C; Fig. 4 temperatures
      at 25, 100, 400, 600, 700, and 800 °C
    reported_results: The text reports Cr6+ charge-transfer absorption at 365 nm decreasing with temperature and vanishing
      above 1000 °C; Cr3+ bands at 450 and 660 nm shift to longer wavelengths, with the 450 nm band intensity increasing and
      the 660 nm band intensity decreasing. Mn2+ bands at 500 and 660 nm shift to longer wavelengths and broaden; above 700
      °C they merge into one band. In the mixed glass, the Mn3+ band intensity remains nearly constant through 600 °C and
      decreases at higher temperatures; the Cr6+ peak decreases through 600 °C and increases at higher temperatures. The authors
      state the redox reaction is kinetically frozen below 600 °C. These are reported text trends, not numeric valence ratios.
    figures:
    - '1'
    - '2'
    - '3'
    - '4'
