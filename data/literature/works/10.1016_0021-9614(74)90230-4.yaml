- observation_id: gronvold_sveen_1974_curie_transition_context
  type: transition_temperature_context
  locator:
    page: 10
    published_page: 868
    section: Critical behavior
  units: K; heat capacity in J K−1 mol−1
  values:
    method_class: measured_reduced
    statement: 'Observed Cp maximum: 337 J K−1 mol−1 at 848.04 K over 1.052 K. Critical-fit Curie temperatures: without B′=B=0
      constraint, below 848.1 K and above 848.7 K; with B′=B=0, below 848.4 K and above 848.7 K; alternative dilation contribution,
      below 848.1 K and above 848.5 K. Figure 3 uses 848.4 K below and 848.7 K above.'
  context_id: gronvold-sveen-1974-magnetite-high-temperature-cp::context::gronvold_sveen_1974_curie_transition_context
