- observation_id: sh98_cell_reaction_qualifier
  type: laboratory_conditions
  locator:
    published_page: 1171
    pdf_page_index: 0
    section: Introduction
    note: Verbatim translation transcription checked against rendered page image.
  units: verbatim source context
  values:
    statement_as_printed: Study of vaporization of silicon dioxide involves inevitable experimental difficulties originating
      from complex reactions of both molecular forms of the vapor (predominantly silicon monoxide and oxygen) and condensed
      phases with the material of the crucible, support, or effusion cell. The nature of these high-temperature reactions
      mainly depends on the cell material and affects the results of determination of the thermodynamic properties of silicon
      dioxide. These reactions affect the partial pressures of the molecular forms of the vapor over [SiO2] and probably determine
      the more negative enthalpies of formation of (SiO), obtained by the Knudsen effusion procedure [4], as compared with
      the other methods.
  context_id: shornikov-1998-silica-vaporization::context::sh98_cell_reaction_qualifier
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
