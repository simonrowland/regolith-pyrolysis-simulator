  values:
    statement_as_printed: Except [10, 12, 13] direct experimental studies of vaporization of silicon dioxide at temperatures
      above mp were not carried out, and data on the thermodynamic properties in this temperature range are limited to a few
      experimental works [14, 15]. The results obtained in [10, 12–14] are characterized by significant errors; e.g., in [14]
      the enthalpy of sublimation of silicon dioxide was determined with an accuracy of 53%.
