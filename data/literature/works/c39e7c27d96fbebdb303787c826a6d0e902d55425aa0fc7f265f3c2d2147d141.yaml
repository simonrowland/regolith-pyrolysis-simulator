- observation_id: sh98_source_statement_01
  type: laboratory_conditions
  locator:
    published_page: 1171
    pdf_page_index: 0
    section: Abstract
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Vaporization of silicon dioxide in the 1800–2200 K range as influenced by the material of the effusion
      cells (Mo, W, Ir, Pt–Rh) was studied by the Knudsen high-temperature mass spectrometric effusion method.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_01
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_02
  type: laboratory_conditions
  locator:
    published_page: 1171
    pdf_page_index: 0
    section: Abstract
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The partial pressures of molecular forms of the vapor over SiO2 were determined by the procedure
      of complete vaporization and by comparison of ion currents using the partial vapor pressures of silver and gold as standards.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_02
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_03
  type: laboratory_conditions
  locator:
    published_page: 1171
    pdf_page_index: 0
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The melting point of [SiO2] is 1996 ± 5 K [4, 5], though slightly different temperatures are also
      published [6, 7].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_03
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_04
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: According to [4], at temperatures higher than 1800 K under the chemically neutral or close-to-neutral
      conditions the vapor phase over silicon dioxide predominantly consists of (SiO), (O), (O2), and (SiO2).
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_04
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_05
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The total concentration of (Si2O2), (O3), and (Sin) (n = 1, 2, 3) molecules in the vapor is lower
      than 0.05%.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_05
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_06
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: This probably explains the overestimated total vapor pressures over silicon dioxide as determined
      by the method of boiling points and the rapid breakdown of iridium crucible at 2333 K [10].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_06
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_07
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: As known [8], the vapor of silicon monoxide at high temperatures reacts with platinum forming platinum
      silicide [Pt5Si2], which, according to the equilibrium phase diagram of the Pt–Si system, forms an eutectic with metallic
      platinum at 1103 K [9]. Similar processes can occur with the other platinum group metals.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_07
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_08
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The enthalpy of fusion of cristobalite (9.6 ± 0.5 kJ/mol), recommended in [4], was determined indirectly
      by solution calorimetry as the difference between the enthalpies of formation of cristobalite and vitreous [SiO2].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_08
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_09
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Introduction
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Thus, reliable experimental data on vaporization and thermodynamic properties of silicon dioxide
      at temperatures above mp are almost lacking.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_09
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_10
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Experimental
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Using the Knudsen mass spectrometric effusion method we studied vaporization of samples of silicon
      dioxide (Institute of Chemistry of Silicates, Russian Academy of Sciences, KS-4V brand, purity no less than 99.9999
      wt%) from cells prepared from tungsten, iridium-coated tungsten, and molybdenum (with Pt–20% Rh inserts) crucibles on
      an MS-1301 mass spectrometer [16, 17, 26, 35].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_10
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_11
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Experimental
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: For example, at 2000 K the correction for the light absorption was 40 ± 5 K.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_11
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_12
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Experimental
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The difference in the temperature data registered by the EOP-66 pyrometer and by a WRe5/WRe20 thermocouple
      welded to the cell lid at 2000 K was within 10 K.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_12
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_13
  type: laboratory_conditions
  locator:
    published_page: 1172
    pdf_page_index: 1
    section: Experimental
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The temperature gradient between the lid and the bottom of the cell did not exceed 7 ± 3 K at 2000
      K and was determined as the difference between the data of two thermocouples welded to the lid and the bottom of the
      effusion cell.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_13
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_14
  type: laboratory_conditions
  locator:
    published_page: 1173
    pdf_page_index: 2
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Dissociative ionization of the (SiO) molecule begins at the ionization energy of 16 eV, and at 32
      eV it is about 15% [31].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_14
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_15
  type: laboratory_conditions
  locator:
    published_page: 1173
    pdf_page_index: 2
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The isotopic ratio of the (Si)+ and (SiO)+ ions in the mass spectra of the vapor over silicon dioxide
      agrees with the natural isotopic abundances given in [4] to within 13%.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_15
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_16
  type: laboratory_conditions
  locator:
    published_page: 1173
    pdf_page_index: 2
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The presence in the vapor of (Mo)+, (MoO)+, (MoO2)+, and (MoO3)+ and (W)+, (WO)+, (WO2)+, (WO3)+,
      (W2O2)+, and (W2O6)+ ions during vaporization of silicon dioxide from the molybdenum and tungsten effusion cells and
      the absence of (Pt)+, (PtO)+, (PtO2)+, and (PtO3)+ and (Ir)+, (IrO)+, (IrO2)+, (IrO3)+, and (Ir2O)+ ions during vaporization
      of silicon dioxide from the platinum–rhodium and iridium effusion cells, respectively, indicates in the former case
      a reaction of silica with the material of the effusion cell.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_16
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_17
  type: laboratory_conditions
  locator:
    published_page: 1173
    pdf_page_index: 2
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: However, almost no (MoO)+, (MoO2)+, and (MoO3)+ and (WO)+, (WO2)+, (WO3)+, (W2O2)+, and (W2O6)+
      ions were observed in the mass spectra during vaporization of [SiO2] from the platinum–rhodium and iridium-coated tungsten
      effusion cells.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_17
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_18
  type: laboratory_conditions
  locator:
    published_page: 1174
    pdf_page_index: 3
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: In vaporization from the cells of all types, the peak intensity of the 22(SiO)2+ ion registered
      in the vapor over silicon dioxide was ≤0.90 ± 0.5% relative to the 44(SiO)+ ion.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_18
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_19
  type: laboratory_conditions
  locator:
    published_page: 1174
    pdf_page_index: 3
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The mass spectra of the vapor over silicon dioxide obtained on an MS-1301 mass spectrometer (Uion
      70 V) did not allow correct evaluation of the intensity of the ion current of (SiO2)+.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_19
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_20
  type: laboratory_conditions
  locator:
    published_page: 1174
    pdf_page_index: 3
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: We studied the dependence of the mass spectra of the vapor over [SiO2] as influenced by the ionization
      energy and found a threefold decrease in the peak intensity of the (SiO2)+ ion as compared with (SiO)+ with Uion increased
      from 20 to 70 eV (Fig. 1a).
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_20
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_21
  type: laboratory_conditions
  locator:
    published_page: 1174
    pdf_page_index: 3
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: This decrease in the peak intensity of the (SiO2)+ ion in the mass spectra of the vapor over silicon
      dioxide with increasing ionization energy is due to greater fragmentation, which is confirmed by simultaneous increase
      in the content of the (Si)+ fragment in the mass spectrum (Fig. 1b).
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_21
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_22
  type: laboratory_conditions
  locator:
    published_page: 1174
    pdf_page_index: 3
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The evaluated intensity of the (SiO2)+ ion in the mass spectra of the vapor over [SiO2] did not
      exceed 0.5 ± 0.1% as compared with the ion current of (SiO)+; this is comparable with the sensitivity of the MS-1301
      mass spectrometer.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_22
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_23
  type: laboratory_conditions
  locator:
    published_page: 1174
    pdf_page_index: 3
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The partial pressures (pi) of (SiO), (SiO2), (O), and (O2) during vaporization of [SiO2] from the
      platinum–rhodium cell were calculated from the Hertz–Knudsen equation [35, 37, 38] taking into account the vaporization
      coefficient of silicon monoxide [27] and were similar within an error of about 15% to those determined by the method
      of comparison of ion currents [16, 17].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_23
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_24
  type: laboratory_conditions
  locator:
    published_page: 1175
    pdf_page_index: 4
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: As seen from Table 2, the coefficient A in the temperature dependences of the partial vapor pressures
      for all types of the cells remains constant within the calculation error, and its values are fairly close to those obtained
      in [13, 25, 27, 40].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_24
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO
- observation_id: sh98_source_statement_25
  type: laboratory_conditions
  locator:
    published_page: 1175
    pdf_page_index: 4
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Therewith, the data reported in [21–24] significantly differ from each other.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_25
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: O
- observation_id: sh98_source_statement_26
  type: laboratory_conditions
  locator:
    published_page: 1175
    pdf_page_index: 4
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The coefficient B for the molecular vapor form (SiO) [or (O) and (O2)] characterizes the reaction
      with the material of the cell during vaporization of [SiO2].
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_26
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: O
- observation_id: sh98_source_statement_27
  type: laboratory_conditions
  locator:
    published_page: 1175
    pdf_page_index: 4
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The insignificant deviation of the coefficient B in equation (9) for (SiO2) from the values recommended
      in [4] is probably due to fragmentation of this molecule; more correct data can be obtained at lower ionization energies.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_27
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: O
- observation_id: sh98_source_statement_28
  type: laboratory_conditions
  locator:
    published_page: 1175
    pdf_page_index: 4
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Using our data we estimated the enthalpy of fusion of silicon dioxide at 36 ± 25 kJ/mol, which is
      consistent with the data in [4] (Table 3).
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_28
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_29
  type: laboratory_conditions
  locator:
    published_page: 1176
    pdf_page_index: 5
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: The partial vapor pressures of the (SiO) molecule in the course of vaporization of silicon dioxide
      from the molybdenum, tungsten, and iridium-coated tungsten cells are overestimated as compared with the data registered
      for platinum–rhodium cells (Fig. 2).
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_29
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_30
  type: laboratory_conditions
  locator:
    published_page: 1176
    pdf_page_index: 5
    section: Results
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: During vaporization of [SiO2] from the platinum–rhodium effusion cell at temperatures higher than
      1950°C we observed breakdown of the cell lid near the orifice.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_30
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_source_statement_31
  type: laboratory_conditions
  locator:
    published_page: 1176
    pdf_page_index: 5
    section: Discussion
    note: Verbatim translation transcription re-checked against the rendered page image.
  units: verbatim source statement
  values:
    statement_as_printed: Thus, we found no material for the effusion cells that could provide reliable experimental data
      on vaporization of [SiO2] under chemically neutral conditions at temperatures higher than the mp of silicon dioxide.
  context_id: shornikov-1998-silica-vaporization::context::sh98_source_statement_31
  work_id: c39e7c27d96fbebdb303787c826a6d0e902d55425aa0fc7f265f3c2d2147d141
  source_id: shornikov-1998-silica-vaporization
  species: SiO2
- observation_id: sh98_t1_reaction_confirmation
