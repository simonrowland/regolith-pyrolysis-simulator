context:
- observation_id: kress_1988_adopted_reaction_and_regression_model
  type: thermodynamic_example
  locator:
    published_page: 1271-1272
    pdf_page_index: 4-5
    table: '2'
    equation: 4, 7, 9
  units: reaction stoichiometry as printed; ΔH in kJ; ΔS in J/K; ΔW terms in kJ; fit diagnostics as printed
  values:
    quantity: authors_adopted_iron_oxidation_reaction_and_regression_parameters
    method_class: model_derived
    evidence_class: model_derived
    source_wording: FeO + 0.232 O2 = FeO1.464
    associated_component_formula:
      formula: FeO1.464
      uncertainty: ±0.003
      uncertainty_level: not stated in the paper
      source_wording: FeO1.464±0.003
    reaction:
      reactants:
        FeO: '1'
        O2: '0.232'
      products:
        FeO1.464: '1'
      equation_number: '4'
      published_page: 1272
    derivation:
      relation: FeO + x O2 -> FeO_(1 + 2x)
      input:
        x: '0.232'
        source: equation_4
      result:
        associate_formula: FeO1.464
        calculation: 1 + 2 × 0.232 = 1.464
      evidence_basis: fitted/model formulation, not a direct identification of a discrete melt species
    component_recasting:
      basis: FeO1.5
      molecular_weight: '79.849'
      equations:
      - number: '5'
        source_wording: X_FeO1.464 = 1.0776 X_FeO1.5
      - number: '6'
        source_wording: X_FeO = X_FeO - 0.0776 X_FeO1.5
      note: In Eq. 6, the left-hand FeO is the recast component and the right-hand FeO is the analytical component before
        association.
    equation_9:
      dependent_variable: ln(X^liq_FeO1.464 / X^liq_FeO)
      source_wording: ln(X^liq_FeO1.464 / X^liq_FeO) = 0.232 ln fO2 - ΔH4/(R T) + ΔS4/R - (1/(R T)) Σ_i ΔW_i X_i
      component_difference: ΔW_i = W_(i,FeO1.464) - W_(i,FeO)
      variable_definitions: X_i are component mole fractions; T is in kelvins; R is the universal gas constant.
    equation_7_and_9_composition_terms:
    - oxide: Al2O3
      coefficient: '49.04'
      standard_error: '15.53'
      unit: kJ
    - oxide: CaO
      coefficient: '-48.87'
      standard_error: '6.71'
      unit: kJ
    - oxide: Na2O
      coefficient: '-106.04'
      standard_error: '20.64'
      unit: kJ
    - oxide: K2O
      coefficient: '-110.46'
      standard_error: '19.52'
      unit: kJ
    thermodynamic_parameters:
    - coefficient: ΔH
      value: '-95.93'
      standard_error: '6.39'
      unit: kJ
    - coefficient: ΔS
      value: '-46.05'
      standard_error: '3.55'
      unit: J/K
    fit_diagnostics:
      R_squared: '0.95'
      standard_error: '0.30'
      standard_error_unit: ln units
    fit_data_scope:
      sources:
      - Table 1 experiments in this work
      - Sack et al. (1980)
      - Kilinc et al. (1983)
      exclusion: Most highly reduced experiments with log10 fO2 less than -9.5 were omitted. A serious Kilinc et al. (1983)
        outlier for composition 20424, inconsistent with this study's results for the same composition under nearly identical
        conditions, was also omitted; the authors state that its omission substantially improved regression precision.
    interpretation_note: The authors caution that FeO1.464 may not represent a discrete species; they interpret it as a probable
      stoichiometry from a distribution of configurations involving other melt cations.
