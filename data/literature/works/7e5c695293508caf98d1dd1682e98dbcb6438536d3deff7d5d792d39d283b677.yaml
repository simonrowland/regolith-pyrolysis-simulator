- observation_id: kor_1967_chV_gas_slag_method_and_constants
  type: method
  locator:
    published_page: 94
    pdf_page_index: 94
    section: 4.1 Binary CaO-Al2O3 melts
    note: Method continued on thesis p. 96 (PDF page 96) for K and equilibrium proof
  units: dimensionless; K as printed
  values:
    quantity: gas_slag_equilibration_method_constants_standard_states
    method_class: method_only
    experimental_method: gas-slag equilibration with sulphurising gas mixtures at 1500 C; CaS saturation from break in log(wt%
      S) vs log((pS2/pO2)^1/2) (Fig. 16 least-squares lines)
    temperature_C: 1500
    temperature_K: 1773
    standard_state_CaO_as_printed: pure solid oxide
    equilibrium_reaction_as_printed: CaO (s) + 1/2 S2 (g) = CaS (s) + 1/2 O2 (g)
    equilibrium_constant_K_at_1500_C: '0.00275'
    equilibrium_constant_locator:
      published_page: 96
      pdf_page_index: 96
      note: 'At 1500 C: K = 2.75 x 10-3 (Chapter IV, sec. 2.3.)'
    a_CaO_at_CaS_sat_formula_as_printed: (aCaO)sat from K with aCaS=1
    sulphur_capacity_definition_as_printed: Cs = (wt% S) x (pO2/pS2)^1/2
    how_equilibrium_shown_as_printed: CaS X-ray diffraction lines begin to show for (pS2/pO2)^1/2 exceeding the saturation
      value from Tables XXII/XXIII; melts quench to 12CaO.7Al2O3 + CaO.Al2O3 (45 wt% CaO start) or 12CaO.7Al2O3 + 3CaO.Al2O3
      (52 wt% CaO start), consistent with the CaO-Al2O3 phase diagram
    comparison_as_printed: substantial agreement with Sharma and Richardson (ref. 55); sulphur capacities 1-2% lower; Cameron
      et al. (ref. 56) 1550 C values tabulated alongside for comparison and later argued to be in error
    original_melt_compositions_as_printed:
    - 52 wt% CaO, 48 wt% Al2O3
    - 45 wt% CaO, 55 wt% Al2O3
  quote: 'At 1500 C: K = 2.75 x 10-3 (Chapter IV, sec. 2.3.). For a melt saturated with CaS, aCaS = 1, and (aCaO)sat. may
    be calculated with the aid of the above equation.'
  context_id: kor-1967-thesis-sulphur-oxides-slags::context::kor_1967_chV_gas_slag_method_and_constants
