    characterization:
      state:
        tag: value
        value: 'Quoted mineral profile in Yakovlev and Shornikov (2024, p. 31): “an external monomineral rim consisting of
          melilite rich in gehlenite”; the paper says the “typical profile of akermanite and δ25Mg between the core and rim
          zones in CAI of subtype B1 (Allende 5241)” is from Kerekgyarto et al. (2016). Their quoted values are: “the akermanite
          content in the core zone of the inclusion is approximately 50 wt. %, the akermanite content drops to 20 wt. % in
          the mantle melilite zone, and up to 7 wt. % in the rim zone.” Yakovlev and Shornikov (2024) also state: “Subtype
          B2 is similar in mineral composition to the core zone of subtype B1.” These are cited zonal profile values, not
          an initial bulk oxide map.'
      locator:
        published_page: 31
        pdf_page_index: 2
        paragraph: Fig. 1 discussion; Kerekgyarto et al. (2016) citation
