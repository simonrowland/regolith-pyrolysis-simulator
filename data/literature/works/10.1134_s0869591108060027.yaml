    note: Figure 10 caption and plotted panel.
  units: as printed
  values:
    quantity: Na2O equilibrium-phase composition
    species:
    - Na2O
    phase: l except T16
    temperature_as_printed: 1250 °C and 1265 °C
    axes_as_published: 'x: SiO2 (wt %); y: Na2O (wt %)'
    caption: Example of the influence of SiO2 content in natural basic and ultrabasic melts on their saturation with sodium.
      BR is the standard basalt (MgO content in the bulk rock is 13.3 wt %, and that in melts at 1250 and 1265 °C, 10.3 and
      12.0 wt %, respectively); MFR-1 is the standard gabbro (MgO content in the bulk rock is 13.6 wt %, and that in melts
      at 1250 and 1265 °C, 10.1 and 12.1 wt %, respectively); L81 is the ultrabasic composition provided by A.A. Gurenko (MgO
      contents in the bulk rock and glass are 20.2 and 10.1 wt %, respectively); and T16 is the basalts of the Great Fissure
      Tolbachik Eruption, Kamchatka (10.9 wt % MgO). All of the melts, except for T16, contained olivine as a liquidus phase
      at experimental temperature.
    panel: whole_figure
    series:
    - name: 1250 °C natural-melt series
      marker_count: 3
    - name: 1265 °C natural-melt series
