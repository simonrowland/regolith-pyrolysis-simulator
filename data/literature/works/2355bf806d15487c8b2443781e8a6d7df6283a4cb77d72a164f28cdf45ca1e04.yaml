    model: Semi-empirical model (Shornikov, 2019).
    model_inputs: Standard Gibbs energies of Na2O and P4O10 in the crystalline and liquid state, and of NaPO3, Na4P2O7, Na3PO4
      and Na5P3O10. Gas species from Glushko et al. (1978–1982), Alikhanyan et al. (1975) and Rudny et al. (1986).
    gas_species_considered:
