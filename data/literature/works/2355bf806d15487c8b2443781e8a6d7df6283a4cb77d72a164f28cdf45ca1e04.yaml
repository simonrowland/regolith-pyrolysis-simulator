    - P4O7
    - P4O8
    - P4O9
    - P4O10
    - NaPO
    - NaPO2
    - NaPO3
    - Na2P2O6
    - O
    - O2
    - O3
    - O4
    condensed_compounds_as_printed:
    - formula: NaPO3
      oxide_equivalent: 2Na2O · P4O10
      congruent_melting_K: 901
    - formula: Na4P2O7
      oxide_equivalent: 4Na2O · P4O10
      congruent_melting_K: 1252
    - formula: Na3PO4
      oxide_equivalent: 6Na2O · P4O10
      congruent_melting_K: 1852
    - formula: Na5P3O10
      oxide_equivalent: 10Na2O · 3P4O10
      dissociates_K: 903
    po_po2_pressure_bound: 'The partial pressures of PO and PO2 over NaPO3 at 1100–1400 K do not exceed 10^-8 atm. The sentence
      is split: published page 69 ends at 10^-8 and published page 70 opens with atm. The 600 dpi render of PDF page 4 prints
      the exponent as a superscript minus. pdftotext prints an en dash. This is a bound, not a point.'
    mixing_energy_minimum: The minimum mixing energy is in the concentration range close to the eutectic between NaPO3 and
      Na4P2O7. No numeric minimum is printed.
    cited_comparison_not_this_study: The paper says the P4O10 activities of Malheiros et al. (1993) and Yamaguchi and Goto
      (1984) at 1673 K differ by more than 10 orders, and that the mixing-energy discrepancy exceeds 130 kJ/mol. Those figures
      compare other work. They are not values calculated in this study.
    electron_energy_is_cited_work: The 45–70 eV electron energy is stated as the cause of fragmentation in the cited mass-spectrometric
      studies, not as a condition of a new experiment in this paper.
