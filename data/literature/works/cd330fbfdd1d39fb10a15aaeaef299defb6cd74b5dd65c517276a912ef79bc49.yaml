  type: characterization
  locator:
    page: 1
    section: Results & Discussion
    note: qualitative isotope-system findings for all particles and the Bennu handling-contamination assessment
  phase: returned_asteroid_particle
  regime: noble_gas_mass_spectrometry
  units: qualitative, as printed
  values:
    quantity: xenon_components_and_terrestrial_contamination_assessment
    method_class: measured_direct
    xenon_isotopic_composition: all particles consistent with phase Q
    additional_components: small additions of Xe-HL from presolar diamonds
    excess_component: excess 129Xe* from short-lived 129I decay
    129Xe_star_129XeQ_ratio: comparably high and similar in all samples
    closure_interpretation: similar initial I concentrations and closure to Xe loss, or incorporation of a well-mixed Xe reservoir
    contamination_assessment: most diagnostic Xe isotopes and Ar/Xe versus Kr/Xe systematics prove noble gases are not affected
      by terrestrial contamination
