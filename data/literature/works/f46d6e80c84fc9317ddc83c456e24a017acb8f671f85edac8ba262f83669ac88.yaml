  values:
    sentence_as_published: When sintering the sludge at the temperature region 1173–1523 K in the composition of the synthesized
      material (Srikanth et al. 2005), as well as in the waste of electrolysis production (Bazhin et al., 2017), it was found
      the compound CaFeO2.
    attribution: Srikanth et al. (2005) and Bazhin et al. (2017), as cited in the text.
