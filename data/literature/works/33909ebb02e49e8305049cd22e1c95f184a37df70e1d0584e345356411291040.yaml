    activity_interpretation: The article identifies CaO and P4O10 thermodynamic activities but does not state the standard
      state of either; no experimental defining ion applies to the present model outputs.
    verbatim_comparative_statements:
    - quote: A detailed review of the available physicochemical data and an assessment of thermodynamic properties in the
        CaO–P4O10 system was recently carried out in (Jantzen et al., 2019).
      locator:
        page: 56
        published_page: 56
        pdf_page_index: 3
        section: Introduction
    - quote: The theoretical calculations of thermodynamic properties of the CaO–P4O10 melts in the temperature range 700–2100
        K were performed using a semi-empirical model (Shornikov, 2019) in order to clarify its parameters.
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    - quote: Phosphorus is an important minor element of the lunar rocks. It has moderate volatility and is usually present
        as phosphates (merrilite, apatite).
      locator:
        page: 55
        published_page: 55
        pdf_page_index: 2
        section: Introduction
    - quote: Considerable interest in them is caused by the discovery of the OH–bearing apatites in a number of mare basalts,
        that contradicts the early statement about dryness of the lunar basaltic magmas.
      locator:
        page: 55
        published_page: 55
        pdf_page_index: 2
        section: Introduction
    - quote: 'The available thermodynamic data on calcium phosphates are quite contradictory: errors in determining the values
        of the enthalpy of compound formation exceed 10 kJ/mol, and in the values of the entropy of formation – at least 5
        J/(mol×K).'
      locator:
        page: 56
        published_page: 56
        pdf_page_index: 3
        section: Introduction
    - quote: The use of the latter can lead to chemical interaction with phosphate samples (Lopatin, 1997) and, thereby, distort
        the measurement results.
      locator:
        page: 56
        published_page: 56
        pdf_page_index: 3
        section: Introduction
    - quote: Measurements of CaO activity in the CaO–P4O10 melt were performed in a narrow concentration range (11–22 mol
        % P4O10) at 1923 K in a single experimental study (Schwerdtfeger, Engell, 1963) (Fig. 2).
      locator:
        page: 56
        published_page: 56
        pdf_page_index: 3
        section: Introduction
        figure: '2'
    - quote: The partial pressures of (PO), (PO2) and (P4O10) vapor species over congruently melting calcium phosphates (Butylin
        et al., 1975; Ratkovsky et al., 1975; Lopatin, Semenov, 1989; Lopatin, 1997) and mixtures of calcium phosphates with
        alloys (Nagai et al.., 2009) were determined by the Knudsen effusion mass spectrometry method in a wide temperature
        range of 800–1900 K (Fig. 3).
      locator:
        page: 56
        published_page: 56
        pdf_page_index: 3
        section: Introduction
        figure: '3'
    - quote: A comparison of the results of calculations of the oxide activities (ai) (Fig. 2) and the mixing energies (ΔGm)
        (Fig. 4) in the CaO–P4O10 melts at 1923 K obtained at the present study with those obtained by Hadon and Zhang (2015),
        as well as with experimental data obtained in (Schwerdtferger, Engell, 1963; Lopatin, Semenov, 1989), shows their
        satisfactory correspondence.
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    - quote: The calculated oxide activities in the the CaO–P4O10 melt correspond to the position of the liquid phase in the
        phase diagram of the system (Fig. 1).
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    - quote: The minimum value of the mixing energy in the CaO–P4O10 melts is in the composition region close to Ca2P2O7 and
        is equal to –210 kJ/mol.
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    - quote: As follows from Fig. 3A, the calculated partial pressures of (P4O10) gaseous phosphorus oxide over CaP2O6 calcium
        phosphate correspond satisfactorily to the experimental data obtained by the Knudsen effusion mass spectrometric method
        in (Butylin et al., 1975; Ratkovsky et al., 1975; Lopatin, 1997).
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    - quote: The higher partial pressure values of (PO2) gaseous oxide over Ca2P2O7 obtained by Lopatin (1997) are due to
        the presence of reducing conditions occurring in the case of a molybdenum effusion cell (Fig. 3B).
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    - quote: The observed difference between the calculated values of (PO2) partial pressure and the results obtained by Butylin
        et al. (1975) illustrates the above-mentioned interaction of the phosphate melt with the alund effusion cell which
        they used in the experiments (Fig. 3B).
      locator:
        page: 57
        published_page: 57
        pdf_page_index: 4
        section: Results and Discussion
    source_data_limitation: The article reports a theoretical model and comparisons with prior studies, not new experiments.
      It gives no numerical uncertainty for the model results.
