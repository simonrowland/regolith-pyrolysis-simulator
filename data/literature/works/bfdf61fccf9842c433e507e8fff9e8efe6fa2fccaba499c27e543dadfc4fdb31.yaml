  units: as stated in scientific_statement
  values:
    method_class: quoted_attributed
    evidence_class: quoted_attributed
    scientific_statement: 'Silica results summarized from C. N. Fenner. α-quartz grown in sodium tungstate: length rarely
      exceeds 0.1 mm; ωNa = 1.544; εNa = 1.553; birefringence about 0.01; hexagonal, uniaxial positive. α-tridymite: cryptocrystalline
      hexagonal aggregates, probably orthorhombic; αNa approximately 1.469, γNa approximately 1.473; extremely weak birefringence,
      large axial angle; β forms above 117° hexagonal. α-cristobalite: cryptocrystalline; αNa = 1.484, γNa = 1.487; weak birefringence;
      probably tetragonal or orthorhombic; β form isometric. Chalcedony not produced artificially. Cristobalite behaves in
      melting and inversion as a solid solution of two components. Lime and silica form four distinct compounds.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p4_silica_optics
