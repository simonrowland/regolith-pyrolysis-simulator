- observation_id: rankin_wright_1915_text_p8_c2s_gamma_beta_prime
  type: literature_context
  locator:
    page: 8
    published_page: 8
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 'γ2CaO.SiO2: fine powder from dusting; colorless prisms, perfect prism-axis cleavage; twins occasionally
      have c∧γ′ extinction not exceeding 3°, usually parallel; probably monoclinic; αNa = 1.642 ± 0.002, βNa = 1.645 ± 0.003,
      γNa = 1.654 ± 0.002; birefringence about 0.015, 2E approximately 52°; negative; optic axes normal to cleavage. β′2CaO.SiO2:
      unstable form obtained only by quenching one particular old hydrated sample from about 1425°; not from fresh preparations;
      fine equant grains, average refractive index about 1.715, very weak birefringence, small or zero axial angle, positive;
      apparent monotropic form not established beyond question.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p8_c2s_gamma_beta_prime
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
