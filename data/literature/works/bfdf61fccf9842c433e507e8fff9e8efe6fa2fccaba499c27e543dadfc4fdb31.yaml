    scientific_statement: '3CaO.Al2O3.SiO2: CaO 50.9, Al2O3 30.9, SiO2 18.2 wt%; no ternary liquidus field; dissociates 1335°
      ± 5° into 2CaO.SiO2 and CaO.Al2O3, best formed from own-composition glass below 1335°. Dusty preparation cannot be stated
