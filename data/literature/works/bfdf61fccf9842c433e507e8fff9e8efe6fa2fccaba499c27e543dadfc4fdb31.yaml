- observation_id: rankin_wright_1915_text_p14_phase_rule_equations
  type: literature_context
  locator:
    page: 14
    published_page: 14
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: quoted_attributed
    evidence_class: quoted_attributed
    scientific_statement: 'Phase rule quoted from Findlay: P + F = C + 2 or F = C + 2 − P; P denotes number of phases, F degrees
      of freedom, C number of components. Phases homogeneous physically distinct mechanically separable portions; components
      smallest number of independently variable constituents expressing all phase compositions.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p14_phase_rule_equations
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p15_phase_rule_assumptions
  type: literature_context
  locator:
    page: 15
    published_page: 15
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: 'Fixed atmospheric pressure; vapor-pressure change unimportant, vapor always present; oxides miscible
      in all liquid proportions so one liquid phase; solid solutions omitted from theoretical discussion. P + F = C + 2; C
      = 3; (P + F) = 5; F may be 0, 1 or 2. Nonvariant: five phases, two possible systems S-S-S-S-V and S-S-S-L-V; S = Solid,
      L = Liquid, V = Vapor. Univariant: four phases (continued p. 16).'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p15_phase_rule_assumptions
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p16_phase_rule_systems
  type: literature_context
  locator:
    page: 16
    published_page: 16
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: 'Univariant four-phase systems: S-S-S-V and S-S-L-V. Bivariant three-phase systems: S-S-V and S-L-V.
      Solid phases may be components, binary or ternary compounds. Equilateral composition triangle uses percentage weights;
      pure components at apices, invariant/quintuple points, univariant boundary lines and divariant fields; perpendicular
      height proportional to equilibrium temperature.'
