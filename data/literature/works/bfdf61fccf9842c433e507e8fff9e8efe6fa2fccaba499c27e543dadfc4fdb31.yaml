    published_page: 19
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: 'Case III has no boundary maximum and continuously falling 5–6; 5 quintuple but not eutectic. IV:
      unstable AB dissociates into solid A and liquid, composition outside its field. V: AB dissociates into two solids A
      and B, absent from binary liquidus but stable with solution in ternary; temperature on two bounding curves rises to
      common vertex. VI: one binary and one ternary compound (AB and ABC), each with definite melting point; ternary compound
      maximum lies within its field.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p19_typical_cases_iii_vi
