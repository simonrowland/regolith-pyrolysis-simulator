- observation_id: rankin_wright_1915_text_p8_c3s_optics_synthesis
  type: literature_context
  locator:
    page: 8
    published_page: 8
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: '3CaO.SiO2: equant colorless grains not over 0.03 mm diameter, apparently without cleavage; average
      refractive index approximately 1.715; birefringence not over 0.005; uniaxial or biaxial with small axial angle; negative
      optical character. Twins in some ternary preparations have low extinction angles, suggesting possibly monoclinic symmetry.
      From mixed oxides at 1400° or 1500°, orthosilicate forms first and combines on longer heating with free lime to form
      tricalcic silicate.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p8_c3s_optics_synthesis
