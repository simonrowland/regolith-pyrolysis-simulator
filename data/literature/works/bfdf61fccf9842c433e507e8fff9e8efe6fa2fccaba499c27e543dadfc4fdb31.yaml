    published_page: 38
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 'Finely powdered 5CaO.3Al2O3, pure or in ternary mixtures, boils at onset of melting and more vigorously
      as temperature rises: most of a twenty gram charge boils out of a 100 cc platinum crucible. Boiling does not occur with
      large lumps of the compound or ternary mixtures containing a considerable part of it. Authors have not fully investigated
      reason and tentatively suggest absorbed gas liberated at melting; this explanation is not established. Unstable form
      appearing/disappearing causes irregular heating breaks.'
