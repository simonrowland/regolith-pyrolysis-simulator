    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_tabulated
    evidence_class: measured_tabulated
    scientific_statement: Only one binary compound, Al2O3.SiO2 (sillimanite), melting 1816° ± 10°; with Al2O3 eutectic Al2O3
      64, SiO2 36 wt%, 1810° ± 10°; with cristobalite eutectic Al2O3 13, SiO2 87 wt%, 1610° (no uncertainty in prose). Two
