- observation_id: rankin_wright_1915_text_p71_cement_application
  type: literature_context
  locator:
    page: 71
    published_page: 71
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: quoted_attributed
    evidence_class: quoted_attributed
    scientific_statement: 'Commercial portland cement clinker contains over 90 percent CaO, Al2O3 and SiO2. Richardson''s
      V–X–Z–Y region lies mostly within C2S–C3S–C3A: equilibrium pure-oxide clinker has these three phases, while incomplete
      equilibrium can retain free CaO, 5CaO.3Al2O3, or both. Bureau of Standards work corroborated the prediction. Direct
      application requires negligible other components and substantially attained equilibrium.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p71_cement_application
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p72_geological_application
  type: literature_context
  locator:
    page: 72
    published_page: 72
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: 'Two geological differences: high, potentially variable pressure, and complex solutions with unknown
      volatile/water concentration. Pure dry oxides were studied at atmospheric pressure. Prepared minerals are quartz, tridymite,
      cristobalite, corundum, wollastonite, sillimanite and anorthite; synthesized gehlenite has natural optical characteristics
      but a disputed natural composition. Five triangles contain only synthetic minerals.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p72_geological_application
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p73_summary_application
  type: literature_context
  locator:
    page: 73
    published_page: 73
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: Each of the five mineral-only triangles is a stability region for a group of three; silica polymorph
      depends on temperature. Investigation used some 7000 heat treatments and optical examinations; the atmospheric-pressure
      equilibrium diagram has 14 fields. Slowly cooled pure-oxide mixtures are interpreted with continuous equilibrium; commercial
      clinker can also retain C5A3 and free CaO.
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p73_summary_application
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p7_c2s_optics
  type: literature_context
  locator:
    page: 7
    published_page: 7
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 'α2CaO.SiO2: irregular interwoven twinned grains; monoclinic or triclinic; αNa = 1.715 ± 0.002,
      βNa = 1.720 ± 0.003, γNa = 1.737 ± 0.002; birefringence about 0.023; large optic axial angle, positive; c∧α′ extinction
      as high as 18°, smaller angles common; hardness between 5 and 6. β2CaO.SiO2: irregular rounded or prismatic grains,
      cleavage parallel to prism axis; apparently orthorhombic, with twins showing c∧α′ up to 10° possibly of α form; αNa
      = 1.717 ± 0.002, γNa = 1.735 ± 0.002; medium birefringence, interference colors rarely exceed blue of second order;
      large axial angle, positive; optic axes parallel to elongation.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p7_c2s_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
