    published_page: 17
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: 'Van Rijn van Alkemade theorem: boundary temperature for two solid phases with solution and vapor
      rises toward their composition join and is maximum at intersection, if stable boundary reaches it. Six typical three-component
      systems without solid solutions. Simplest case I: three components A, B, C are only solids; three binary quadruple points
      1,2,3; each boundary is four-phase equilibrium of two components, liquid and vapor.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p17_alkemade_types
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
