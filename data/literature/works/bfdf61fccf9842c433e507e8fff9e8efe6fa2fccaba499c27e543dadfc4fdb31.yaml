  units: as stated in scientific_statement
  values:
    method_class: model_derived
    evidence_class: model_derived
    scientific_statement: 'Case I: three boundary curves meet at quintuple/eutectic point 4. Cases II–V have one binary compound.
      Case II: stable AB gives a maximum and two binary eutectics; four fields and five boundary curves; maximum of 5–6 lies
      at crossing with C–AB (continued p. 19).'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p18_typical_case_ii
