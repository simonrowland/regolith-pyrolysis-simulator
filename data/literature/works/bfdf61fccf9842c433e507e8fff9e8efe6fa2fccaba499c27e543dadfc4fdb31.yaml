- observation_id: rankin_wright_1915_methods
  type: method
  locator:
    page: 21
    published_page: 21
    section: Experimental Methods
    note: pp. 20-22 and 27-28
  units: as printed
  values:
    method_class: method_only
    methods_as_printed:
    - energy changes registered by the thermoelement (heating curves)
    - baking to grow crystals
    - quenching
    quench_quote: a small amount of the material of the desired composition is placed in a furnace and held at constant temperature
      until on quenching (sudden cooling by dropping into a bath of mercury or water), only one kind of crystal is present,
      and the rest of the solution is cooled to a glass
    quench_bath: mercury or water
    quench_method_upper_limit_C: 1600
    quench_method_limit_quote: The method is impracticable when the temperature rises too high for the platinum furnace (1600°);
      the iridium furnace (1600°-2100°) does not serve well for it.
    melting_temperature_definition_quote: a melting temperature within a field is the last absorption of heat recorded on
      a heating curve
    methods_agreement_magnitude_C: 5
    methods_agreement_quote: For some points both methods could be used; in such cases the results obtained by both methods
      checked within the limit of error (± 5°).
    quintuple_point_temperature_quote: the temperature at which glass first appears in a ternary mixture is the temperature
      of the quintuple point for that mixture.
    notes:
    - 'Locators: method list p. 20; quench description and 1600° limit p. 21; heating-curve definition p. 27; ±5° agreement
      p. 28; quintuple-point definition p. 36.'
