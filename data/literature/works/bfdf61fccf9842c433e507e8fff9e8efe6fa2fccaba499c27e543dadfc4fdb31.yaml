- observation_id: rankin_wright_1915_text_p10_c3a_optics
  type: literature_context
  locator:
    page: 10
    published_page: 10
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: '3CaO.Al2O3: colorless equant grains 0.1 mm and less in diameter, often hexagonal or rectangular,
      imperfect octahedral/rhombic-dodecahedral cleavage; isometric; nNa = 1.710 ± 0.001; hardness 6; conchoidal fracture,
      vitreous luster; occasional faint gray interference colors attributed to strain.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p10_c3a_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p10_c3a_prose
  type: literature_context
  locator:
    page: 10
    published_page: 10
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_tabulated
    evidence_class: measured_tabulated
    scientific_statement: 'Four distinct lime-alumina compounds. 3CaO.Al2O3: CaO 62.2, Al2O3 37.8 wt%; primary-phase range
      CaO 50 to 59, Al2O3 50 to 41; dissociates at 1535° ± 5° into CaO and liquid; best made by crystallizing own-composition
      glass below 1535°. With 5CaO.3Al2O3 forms eutectic CaO 50, Al2O3 50 at 1395° ± 5°. With CaO, quadruple composition CaO
      59, Al2O3 41 at 1535° (no ± in this sentence). Preserve prose ±5 and 59/41 independently of Table A ±2 and Table C 57/43.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p10_c3a_prose
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
