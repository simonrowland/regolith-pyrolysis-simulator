- observation_id: rankin_wright_1915_text_p10_sillimanite_optics
  type: literature_context
  locator:
    page: 10
    published_page: 10
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 'Artificial sillimanite: αNa = 1.638 ± 0.003, βNa = 1.642 ± 0.003, γNa = 1.653 ± 0.003; γ−α about
      0.014; axial angle not large; positive; acute bisectrix and cleavage along fibers. Minute isotropic inclusions, n about
      1.530, apparently glass.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p10_sillimanite_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p11_c5a3_prose_optics
  type: literature_context
  locator:
    page: 11
    published_page: 11
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: '5CaO.3Al2O3: CaO 47.8, Al2O3 52.2 wt%; two forms, stable I and unstable monotropic II. Stable form
      melts 1455° ± 5°; with CaO.Al2O3 eutectic CaO 47, Al2O3 53, 1400° ± 5°. Rounded grains without outline/distinct cleavage;
      vitreous, conchoidal fracture, hardness 5; isometric; nNa = 1.608 ± 0.001.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p11_c5a3_prose_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p12_c3a5_stable_prose_optics
  type: literature_context
  locator:
    page: 12
    published_page: 12
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: '3CaO.5Al2O3: CaO 24.8, Al2O3 75.2 wt%; stable I and unstable apparently monotropic II. I melts
      1720° ± 10°; with Al2O3 eutectic CaO 24, Al2O3 76, 1700° ± 10°. Rounded colorless grains, rectangular outlines, cleavage
      poor; hardness about 6.5, vitreous; possibly tetragonal; ωNa = 1.617 ± 0.002, εNa = 1.652 ± 0.002; birefringence approximately
      0.035; uniaxial positive, occasionally biaxial with small 2E.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p12_c3a5_stable_prose_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p12_c5a3_unstable_glass
  type: literature_context
  locator:
    page: 12
    published_page: 12
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 5CaO.3Al2O3 glass refractive index approximately 1.662. Unstable II has no definite melting point
      or real stability range; special cooling, radial spherulites or overlapping fibers; vitreous, usually pale green, hardness
      about 5; probably orthorhombic; αNa = 1.687 ± 0.002, γNa = 1.692 ± 0.002; weak birefringence, apparently large axial
      angle, optic axes/extinction parallel to fibers; apparently negative, difficult to determine; α blue-green, γ olive-green,
      absorption α < γ.
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p12_c5a3_unstable_glass
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p12_ca_prose_optics
  type: literature_context
  locator:
    page: 12
    published_page: 12
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 'CaO.Al2O3: CaO 35.4, Al2O3 64.6 wt%; melts 1600° ± 5°; with 3CaO.5Al2O3 eutectic CaO 33.5, Al2O3
      66.5, 1590° ± 5°. Irregular, prismatic/fibrous, characteristic twins; occasional fiber-parallel cleavage; hardness about
      6.5; vitreous; monoclinic or triclinic, probably monoclinic; αNa = 1.643 ± 0.002, βNa = 1.655 ± 0.002, γNa = 1.663 ±
      0.003; birefringence about 0.02; 2V = 36° ± 4°; negative.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p12_ca_prose_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
- observation_id: rankin_wright_1915_text_p13_c3a5_prose_optics
  type: literature_context
  locator:
    page: 13
    published_page: 13
    note: scientific prose; image transcription with numbers and relationships preserved
  units: as stated in scientific_statement
  values:
    method_class: measured_direct
    evidence_class: measured_direct
    scientific_statement: 'Stable 3CaO.5Al2O3: interference figures on grains only 0.01 mm diameter; minute higher-refracting
      weakly birefringent/isotropic inclusions too fine to determine. Unstable II: rapid-cooled liquid, rare in ternary mixtures,
      no definite melting/stability region, quickly inverts at high temperatures; prismatic/fibrous, fair prism cleavage,
      vitreous, hardness 5.5 to 6; orthorhombic or monoclinic, probably orthorhombic; γNa = 1.674 ± 0.002, βNa = 1.671 ± 0.002,
      αNa = 1.662 ± 0.003; γ−α approximately 0.013; 2VNa = 35° ± 5°; negative; strong dispersion 2Vr > 2Vv; optic axes/extinction
      parallel to positive elongation.'
  context_id: rankin-wright-1915-ajs-cao-al2o3-sio2::context::rankin_wright_1915_text_p13_c3a5_prose_optics
  work_id: bfdf61fccf9842c433e507e8fff9e8efe6fa2fccaba499c27e543dadfc4fdb31
  source_id: rankin-wright-1915-ajs-cao-al2o3-sio2
  species: CaO
