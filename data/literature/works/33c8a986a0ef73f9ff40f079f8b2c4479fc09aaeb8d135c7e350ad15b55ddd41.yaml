- observation_id: shornikov_2000_fig3_integral_gibbs_not_digitized
  type: figure_integral_formation_gibbs
  locator:
    page: 4
    published_page: 687
    pdf_page_index: 3
    figure: '3'
    note: 'Markers 1-3 are this work at 2200, 2300, and 2400 K (filled circles, open squares, filled triangles). Lines 4-9
      are literature or equation (18) and were not sampled. 600 dpi PDF page 4. Linear axes. mol% Al2O3 = (x_px - 2710.9)
      / 17.03. neg_delta_fG_kJ_mol = (y_px - 596) / 39.067, from ticks y=596 at 0, y=986.5 at 10, y=1377.5 at 20, y=1768 at
      30. Read 1 is the 7x7 eroded core (filled) or the bright-hole centre (open square). Read 2 is the radius-14 dark centroid
      (filled) or the dark-ring centroid (open square). The nominal value is the mean. Shifts are under 2 px. read_uncertainty
      is half a marker: 12 px circles (0.31 kJ/mol, 0.70 mol%), 10 px squares (0.26 kJ/mol, 0.59 mol%), 8.5 px triangles (0.22
      kJ/mol, 0.50 mol%). The legend glyphs near x=3427 (a circle at y=768 and a triangle at y=964) were excluded. Four stored
      open-square centres were removed because they are glyph gaps, not closed square holes: (2794, 766), (2832, 872), (3080,
      1118), and (3964, 1438). The last is the upper counter of a printed 8. The stored centre (2972, 1014) was the same kind
      of stroke channel. A bright flood from it does not stay inside a 36 px window. The open square is the closed hole at
      (2960.0, 989.5), 19x18 px, 342 bright pixels. Read 1 and the radius-14 dark centroid are that hole centre (shift 0.00
      px). The mean is 14.63 mol% and 10.07 kJ/mol. The nearest filled-circle centre, (2982.3, 961.3), is 36 px away, so the
      ring is not the circle. Every other retained centre was checked the same way: filled centres are gray 32, and the other
      18 square holes stay inside 18x19 or 19x19 px. A partly hidden square near (2796, 748) was not given a new centre. Curves
      4-9 and the white gaps past about 85 mol%, where those curves converge, were not given a centre.'
  units: kJ/mol
  values:
    quantity_as_printed: integral melt -delta_fG_T, equation (17)
    equation: delta_fG_T = RT sum x(i) ln a(i)
    method_class: figure_only
    status: typed_refusal
    reason: Integral formation Gibbs energy of the melt. It is not a partial quantity of SiO2 or Al2O3, and the schema has
      no solution-composition carrier, so these centres are recorded and not scored. Partial Gibbs energies remain RT ln a
      on the Figure 2 activity rows.
