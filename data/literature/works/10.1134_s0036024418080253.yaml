- observation_id: shornikov_2018_prior_cell_interaction_and_contradictions
  type: thermodynamic_example
  locator:
    page: 1449
    published_page: 1449
    pdf_page_index: 2
    section: Introduction
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_unattributed
    attribution: Shornikov (2018), this paper
    statements:
    - statement: The authors also noted the formation of magnesium tungstates in the condensed phase, which in our opinion
        was due to the low quality of the iridium coating of the effusion inner surface of the cell.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The drop in the magnesium ion current intensity (IMg) in the isothermal experiments was explained by the
        authors as a result of the interaction between the sample and the iridium coating, which led to the formation of intermetallic
        phases.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: A similar observation was made by Sasamoto et al. [10], and was explained by the evaporation surface of the
        spinel solid solution sample being slowly covered with precipitated Al2O3.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: At the same time, Gribchenkova et al. [16] did not observe a similar drop in IMg during the evaporation of
        compositions belonging to the MgAl2O4 + Al2O3 region.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: In our opinion, the observed drop in IMg corresponded to a change in the homogeneous condensed phase composition
        of the spinel solid solution due to the preferential evaporation of the vapor species belonging to the MgO phase,
        which was not considered by either Gribchenkova et al. [16] or Sasamoto et al. [10].
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The absence of a drop in this value is typical of the MgAl2O4 + Al2O3 heterogeneous phase evaporating without
        changing its composition.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The available information on the thermodynamic properties of spinel solid solutions in the MgO–Al2O3 system
        thus seems very sporadic, limited, and contradictory.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: Studies of the properties of the gas phase above spinel solid solutions are limited to a single component;
        i.e., atomic magnesium, the partial pressure values of which have been determined with poor accuracy.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The oxide activities in the spinel solid solutions are determined indirectly and do not agree with one another,
        nor do they correspond to the data on stoichiometric spinel.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The values of the experimentally determined enthalpies of formation for spinel solid solution compositions
        were obtained for low temperatures and correspond more to the MgAl2O4 + Al2O3 region in the phase equilibrium diagram
        of the MgO–Al2O3 system; or, they were determined with considerable errors that do not allow us to draw correct conclusions
        about the behavior of a solid solution.
      locator:
        page: 1450
        published_page: 1450
        pdf_page_index: 3
        section: Introduction
    - statement: It should be noted that the boundaries of the spinel solid solutions in the MgO–Al2O3 system need to be refined,
        along with a number of other invariant points of this system.
      locator:
        page: 1450
        published_page: 1450
        pdf_page_index: 3
        section: Introduction
  context_id: shornikov-2018-spinel-solid-solutions::context::shornikov_2018_prior_cell_interaction_and_contradictions
