- observation_id: shornikov_2018_activity_reduction_relations
  type: method
  locator:
    page: 1452
    published_page: 1452
    pdf_page_index: 5
    section: Results
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_unattributed
    attribution: Shornikov (2018), this paper
    statements:
    - statement: The oxide activities in spinel solid solutions (Fig. 1) were calculated based on the Lewis relation [23].
      locator:
        page: 1451
        published_page: 1451
        pdf_page_index: 4
        section: Results
    - statement: However, since the values of the partial pressures pAl and pAlO were low and determined with a greater error
        than the pMg and pO values, it was in our opinion better to determine the activity of magnesium oxide according to
        Eq. (27) using the data in [11] on the thermodynamic information for pure MgO, and to calculate the aAl2O3 activity
        using the Gibbs–Duhem equation [23].
      locator:
        page: 1452
        published_page: 1452
        pdf_page_index: 5
        section: Results
    - statement: It was clearly even better to calculate the aMgO and aAl2O3 values according to Belton and Fruehan method
        [24] using the equations.
      locator:
        page: 1452
        published_page: 1452
        pdf_page_index: 5
        section: Results
    - statement: Considering the proportionality of the partial pressures (pi) of the gas phase components to the corresponding
        intensities of the ion currents (Ii), Eqs. (37) and (40) can be transformed into Eqs. (41) and (42).
      locator:
        page: 1453
        published_page: 1453
        pdf_page_index: 6
        section: Results
    - statement: We thereby avoid the need for additional thermodynamic data [11] in Eqs. (27), (28) and exclude the non-systematic
        errors of the experiment when calculating the gas-phase component partial pressures required in Eqs. (27)–(29).
      locator:
        page: 1453
        published_page: 1453
        pdf_page_index: 6
        section: Results
    - statement: Where aMgO* is the activity of magnesium oxide in a stoichiometric spinel (x*Al2O3 = 0.5) at a given temperature;
        x*MgO is the same as in Eq. (29) and corresponds to the composition at the boundary between the region of spinel solid
        solutions and the MgAl2O4 (solid solution) + Al2O3 region at the considered temperature.
      locator:
        page: 1453
        published_page: 1453
        pdf_page_index: 6
        section: Results
    - statement: 'Printed equations (1)–(50), transcribed as printed: (1) [MgAl2O4]=(Mg)+1/2(O2)+[Al2O3]; (2) aMgO=pMg/pMg°;
        (3) [MgO]=(Mg)+1/2(O2); (4) aMgO=(pMg/pMg°)sqrt(pO2/pO2°); (5) [Mg]+(CO)=[MgO]+[C]; (6) 2[Al]+3(CO)=[Al2O3]+3[C];
        (7) [MgAl2O4]=(Mg)+x(O2)+(1−2x)(O)+[Al2O3]; (8) pMg=2pO2+pO; (9) 2[MgAl2O4]=(Mg)+(MgO)+(Al)+(AlO)+(Al2O)+3(O)+(O2);
        (10) qt=q0*(integral_0^t Ii dt)/(integral_0^t0 Ii dt); (11) [MgO]=(Mg)+(O); (12) [MgO]=(MgO); (13) [Al2O3]=2(Al)+3(O);
        (14) [Al2O3]=2(AlO)+(O); (15) [Al2O3]=(Al2O)+2(O); (16) [MgAl2O4]=(MgAlO)+(Al)+3(O); (17) pi=Kalpha qi/(Sor Cor t)*sqrt(2*pi*R*T/Mi);
        (18) Kalpha=1/Cor+Sor*(1−Cc*alpha_i)/(Sv*alpha_i*Cc); (19) (MgO)=(Mg)+(O); (20) (AlO)=(Al)+(O); (21) (Al2O)=2(Al)+(O);
        (22) (O2)=2(O); (23) pO=(pMgO/pMg)*K19(T); (24) pO=(pAlO/pAl)*K20(T); (25) pO=(pAl2O/pAl^2)*K21(T); (26) pO=sqrt(pO2^2/K22(T))
        [as printed]; (27) aMgO=pMgO/pMgO°=pMg*pO/(pMg°*pO°); (28) aAl2O3=(pAl/pAl°)^2*(pO/pO°)^3=(pAlO/pAlO°)^2*(pO/pO°)=(pAl2O/pAl2O°)*(pO/pO°)^2;
        (29) ln aAl2O3=−integral_(xMgO*)^(xMgO) [xMgO/(1−xMgO)] d ln aMgO; (30) d ln aMgO=−xAl2O3 d ln(aAl2O3/aMgO); (31)
        d ln aAl2O3=−xMgO d ln(aMgO/aAl2O3); (32) ln aMgO=−integral xAl2O3 d ln(aAl2O3/aMgO); (33) ln aAl2O3=−integral xMgO
        d ln(aMgO/aAl2O3); (34) (1+xAl2O3)d ln aMgO=−xAl2O3 d ln(aAl2O3/aMgO^2); (35) d ln aMgO=d ln(pMg*pO); (36) d ln aAl2O3=d
        ln(pAl*pAlO*pO^2); (37) ln aMgO=−integral [xAl2O3/(1+xAl2O3)] d ln[(pAl*pAlO*pO^2)/(pMg^2*pO^2)]=−integral [xAl2O3/(1+xAl2O3)]
        d ln(pAl*pAlO/pMg^2); (38) (1−xMgO)d ln aAl2O3=−xMgO d ln(aMgO*aAl2O3/aAl2O3) [as printed]; (39) d ln aAl2O3=d ln(pAl^2*pO^3)=d
        ln(pAl2O*pO^2); (40) ln aAl2O3=−integral [xMgO/(1−xMgO)] d ln[(pMg*pO)*(pAl2O*pO^2)/(pAl^2*pO^3)]=−integral [xMgO/(1−xMgO)]
        d ln(pMg*pAl2O/pAl^2); (41) ln aMgO=ln aMgO*−integral_(xAl2O3*)^(xAl2O3) [xAl2O3/(1+xAl2O3)] d ln(IAl*IAlO/IMg^2);
        (42) ln aAl2O3=−integral_(xMgO*)^(xMgO) [xMgO/(1−xMgO)] d ln(IMg*IAl2O/IAl^2); (43) Δμi=ΔHi−TΔSi; (44) Δμi=RT ln ai;
        (45) ΔHi=d(Δμi/T)/d(1/T)=R*d ln ai/d(1/T); (46) ΔSi=−dΔμi/dT; (47) ΔGT=ΔHT−TΔST; (48) ΔGT=sum_i xi Δμi; (49) ΔHT=sum_i
        xi ΔHi; (50) ΔST=sum_i xi ΔSi. Eq. (26), Eq. (38), and the Table 2 equation headers are reproduced as printed and
        are not silently corrected.'
      locator:
        page: 1448
        published_page: 1448
        pdf_page_index: 1
        section: Results
        note: Equation inventory continues through published page 1453 (PDF pages 2–7); formulations checked against the page
          images.
    - statement: The paper says the activities were determined by three independent means and compared with stoichiometric-spinel
        thermodynamics and the phase boundary.
      locator:
        page: 1453
        published_page: 1453
        pdf_page_index: 6
        section: Results
    - statement: The printed ion-current ratio is available at 66.79 ± 0.20 mol % Al2O3 and 2100 K. The paper says that pressure-to-current
        proportionality transforms Eqs. (37) and (40) to Eqs. (41) and (42); the Table 1 pressure rows are proportional pressure
        proxies here, not the pointwise ion-current observations integrated by the authors.
      locator:
        page: 1453
        published_page: 1453
        pdf_page_index: 6
        section: Results
