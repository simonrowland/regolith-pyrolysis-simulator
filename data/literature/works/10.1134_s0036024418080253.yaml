- observation_id: shornikov_2018_prior_study_numeric_ranges_and_instrument_capability
  type: thermodynamic_example
  locator:
    page: 1449
    published_page: 1449
    pdf_page_index: 2
    section: Introduction and Experimental
  units: as printed
  values:
    quantity: located_numerical_context
    method_class: quoted_attributed
    attribution: Fuji et al. [5] and Gribchenkova et al. [16], as cited by Shornikov (2018)
    statements:
    - statement: In order to determine the position of the boundaries of the spinel solid solution regions with both magnesium
        oxide and corundum in the temperature range of 1700–1900 K, Fuji et al. [5] studied heterogeneous equilibria observed
        in gas mixtures of argon and carbon monoxide with the participation of metallic magnesium and aluminum dissolved in
        liquid copper.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: Gribchenkova et al. [16] studied the evaporation of compositions of the MgO–Al2O3 system from a tungsten
        container, coated on the inside with iridium, using Knudsen effusion mass spectrometric method in the temperature
        range 1750–2100 K.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The authors were able to experimentally determine only the values of the partial pressures of (Mg) at 1900
        K over the range of concentrations (with the exception of pure Al2O3 oxide) and the temperature dependences of the
        pMg value in the temperature ranges of 1750–1930 and 1910–2100 K for the regions of MgO + MgAl2O4 and MgAl2O4 + Al2O3,
        respectively.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: Gribchenkova et al. [16] were unable to determine experimentally the partial pressure values of (O) and (O2).
        They were calculated in a fairly crude approximation, based on the relation pMg = 2 pO2 + pO.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
