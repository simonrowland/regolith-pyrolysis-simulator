- observation_id: shornikov_2018_discussion_qualifications
  type: thermodynamic_example
  locator:
    page: 1454
    published_page: 1454
    pdf_page_index: 7
    section: Results and Discussion
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_unattributed
    attribution: Shornikov (2018), this paper
    statements:
    - statement: The calculation results coincide both for the aMgO values calculated using Eqs. (27) and (41), and for the
        aAl2O3 values calculated using Eqs. (28), (29), and (42). The observed discrepancies do not exceed 10%.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The aMgO values found in this work for the temperature range of 2000–2200 K occupy a position intermediate
        between the results in [5, 14] and [10, 13] (Fig. 1a).
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The overestimate of the activities of MgO in [10, 16] was due to ignoring the difference between the partial
        pressures of oxygen above MgO and a spinel solid solution when the calculations were performed using Eq. (2).
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The fairly low aMgO values obtained by Fuji et al. [5] were apparently due to errors in determining the composition
        boundary positions whose values were used in calculating the activities of oxides in spinel solid solutions.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: It should be noted that the results of [5, 14] concern the region of lower temperatures (1773–1873 K) and
        thus do not contradict the data obtained in this work for aAl2O3 (Fig. 1b).
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The activities of aluminum oxide in the temperature range of 1400–2173 K, calculated by Navrotsky et al.
        [15] on the basis of the physicochemical data obtained in [6, 11], are quite distant from both the results obtained
        by Fuji et al. [5] and those of the present study, due probably to the considerable errors in the calculations.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The aMgAl2O4 values (Fig. 1c) are highest in the region of stoichiometric spinel.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: Figure 1c also shows the considerable errors in the determination of these values by Fuji et al. [5]; allowing
        for the increase in temperature, they do not contradict the results of either this work or the calculations performed
        by Sack [25] for the composition model based on different X-ray diffraction data.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: We can see their simbatic behavior, depending on the content of oxides and the slightly negative deviations
        from ideality.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The integral thermodynamic characteristics (ΔGT, ΔHT, ΔST) are virtually unchanged in the considered region
        of spinel solid solutions, and their extreme values lie in the region of stoichiometric spinel.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Results and Discussion
    - statement: The boundary between the region of spinel solid solutions and the MgAl2O4 (solid solution) + Al2O3 region
        was clarified for the temperature range 2000–2200 K.
      locator:
        page: 1454
        published_page: 1454
        pdf_page_index: 7
        section: Conclusions
