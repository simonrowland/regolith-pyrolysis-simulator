- observation_id: shornikov_2018_prior_experiments
  type: thermodynamic_example
  locator:
    page: 1447
    published_page: 1447
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_attributed
    attribution: Sata et al. [8, 9] and Sasamoto et al. [10], as cited by Shornikov (2018)
    statements:
    - statement: Sata et al. [8, 9] studied (according to Langmuir) the nonequilibrium vacuum evaporation of a number of compositions
        of spinel solid solutions using furnaces with tungsten heaters in the temperature range of 1873–2173 K and determined
        the temperature [8] and concentration [9] dependences of the compositions’ rates of evaporation.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: Sata et al. [8, 9] observed the formation of corundum grains on composition surfaces. These were explained
        by diffusion processes, but they were most likely caused by nonequilibrium evaporation conditions.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: Sasamoto et al. [10] studied the stationary evaporation of three compositions of spinel solid solutions (50.00,
        66.67, and 73.68 mol % of Al2O3) from tungsten cells in the temperature range of 1850–2300 K and found molecules and
        atoms typical of individual oxides in the gas-phase above spinel solid solutions (i.e., (Mg), (Al), and (AlO) [11,
        12]), along with the molecular forms resulting from interaction between the investigated compositions and the cell
        material (i.e., (WO), (WO2), and (WO3)).
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: Sasamoto et al. [10] reported that tungsten-containing gas species “lowered the partial pressure of oxygen
        in the gas phase above the compositions and thus raised the partial pressure of vapor forms that had little or no
        oxygen.”
      locator:
        page: 1448
        published_page: 1448
        pdf_page_index: 1
        section: Introduction
  context_id: shornikov-2018-spinel-solid-solutions::context::shornikov_2018_prior_experiments
