- observation_id: shornikov_2018_prior_pressures_and_activity_comparisons
  type: thermodynamic_example
  locator:
    page: 1448
    published_page: 1448
    pdf_page_index: 1
    section: Introduction
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_attributed
    attribution: Sasamoto et al. [10], Petric and Chatillon [14], and Fuji et al. [5], as cited by Shornikov (2018)
    statements:
    - statement: The low sensitivity of the apparatus allowed determination of only the partial pressure of atomic magnesium
        (pMg) above the studied compositions, and the estimated values of the partial pressures of the rest vapor forms were
        10^2–10^3 times lower.
      locator:
        page: 1448
        published_page: 1448
        pdf_page_index: 1
        section: Introduction
    - statement: However, the approach using Eq. (2) is not completely correct, since it assumes equality between the partial
        vapor pressures of oxygen above the composition of a spinel solid solution and above magnesium oxide at the same temperature.
        This is not confirmed by our experimental data [1].
      locator:
        page: 1448
        published_page: 1448
        pdf_page_index: 1
        section: Introduction
    - statement: The aMgO value extrapolated to the boundary of the region of spinel solid solutions with corundum (Fig. 1a)
        (which was found by Petric and Chatillon in [14]) does not agree fully with the activities of magnesium oxide in spinel
        solid solutions that were obtained by Sasamoto et al. [10] (albeit at higher temperatures), and thus with the values
        in [2, 13].
      locator:
        page: 1448
        published_page: 1448
        pdf_page_index: 1
        section: Introduction
    - statement: Using Knudsen effusion mass spectrometric method, Petric and Chatillon [14] also determined the aMgO activity
        at a temperature of 1773 K for the heterogeneous reaction [MgO] = (Mg) + 1/2(O2) in the MgAl2O4 + Al2O3 region.
      locator:
        page: 1448
        published_page: 1448
        pdf_page_index: 1
        section: Introduction
