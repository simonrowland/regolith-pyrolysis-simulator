- observation_id: shornikov_2018_prior_thermochemistry_limits
  type: thermodynamic_example
  locator:
    page: 1449
    published_page: 1449
    pdf_page_index: 2
    section: Introduction
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_attributed
    attribution: Fuji et al. [5], Navrotsky et al. [15], and Gribchenkova et al. [16], as cited by Shornikov (2018)
    statements:
    - statement: The oxide activities in spinel solid solutions at 1800 and 1873 K were determined using the same approach
        (Fig. 1). Note that these data are close to those obtained by Petric and Chatillon [14] and thus contradict the results
        obtained in [2, 10, 13].
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: The enthalpies of formation (ΔHT) of several compositions in the 50 to 78 mol % range of Al2O3 concentrations,
        associated (according to Navrotsky et al. [15]) with the spinel solid solutions, were obtained via calorimetry by
        dissolution in Pb2B2O5 salt at the fairly low temperature of 975 K.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: However, a completely different region (MgAl2O4 + Al2O3) is found in the one of spinel solid solutions proposed
        by Navrotsky et al. [15] according to the phase diagram of the MgO–Al2O3 system [3]. Therefore ΔH975 values obtained
        by Navrotsky et al. are associated more with a mixture of spinel and corundum than with the spinel solid solutions.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: Note that the above estimate of the aAl2O3 values (Fig. 1b) does not agree with the results of Fuji et al.
        in [5].
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: These thermodynamic values were calculated using the absolute values of the pMg and pO partial pressures,
        obtained with a rather low accuracy of around 30%.
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
    - statement: Deviations in the determination of the experimental pMg values above the MgAl2O4 + Al2O3 and MgO + MgAl2O4
        systems reached a value of Δ log pMg ≤ 0.7, greatly exceeding the values obtained in [10, 14], which lay within a
        range of 0.1–0.2, and this was the source of the considerable errors in determining the aMgO values in spinel solid
        solutions (Fig. 1a).
      locator:
        page: 1449
        published_page: 1449
        pdf_page_index: 2
        section: Introduction
