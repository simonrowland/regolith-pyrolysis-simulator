context:
- observation_id: shornikov_2018_abstract_and_structure
  type: characterization
  locator:
    page: 1447
    published_page: 1447
    pdf_page_index: 0
    section: Abstract and Introduction
  units: as printed
  values:
    quantity: located_context
    method_class: quoted_unattributed
    attribution: Shornikov (2018), this paper
    statements:
    - statement: The partial pressure values of vapor species over spinel solid solutions and the boundary of the solid spinel
        solutions in the MgAl2O4 (solid solution) + Al2O3 region are determined on the basis of the data obtained by Knudsen
        effusion mass spectrometric method in the temperature range 2000–2200 K.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Abstract
    - statement: The values of oxide activities, Gibbs energies, enthalpies and entropies of formation of solid solutions
        show a slightly negative deviations from ideality.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Abstract
    - statement: MgAl2O4 spinel has cubic syngony.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: 'The O2− oxygen atoms in the spinel structure are in the densest cubic packing, in which there are 96 empty
        positions: 64 tetrahedral and 32 octahedral.'
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: In spinels with a normal structure, eight tetrahedral positions of the unit cell are filled with Mg2+ atoms
        and 16 octahedral positions with Al3+ atoms.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: In total, the unit cell contains 32 oxygen atoms.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: The Mg2+ cation is surrounded by four oxygen atoms; the Al3+ cation is surrounded by six oxygen atoms; each
        oxygen atom is bonded to one Mg2+ atom and three Al3+ atoms.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: In the inverted structure, eight tetrahedral positions are occupied by Al3+ atoms, and half of the 16 octahedral
        positions are occupied by each cation.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: The gamma-alumina unit cell has the composition Al8/3O4.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: Such a structure is referred to as disordered, since half the Al3+ atoms and the Mg2+ atoms are statistically
        distributed in octahedral positions, and the nature of the distribution has yet to be determined definitively, despite
        a considerable number of performed studies.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
    - statement: Spinel solid solutions are formed by replacing some of the Mg2+ (Al3+) atoms with Al3+ (Mg2+) atoms.
      locator:
        page: 1447
        published_page: 1447
        pdf_page_index: 0
        section: Introduction
