- observation_id: de_maria_1969_method_apparatus_and_calibration
  type: method_and_calibration_context
  experiment: de_maria_1969_andesinic_basalt_kems
  locator:
    page: 4
    published_page: 526
    pdf_page_index: 3
    section: Experimental Procedure
  units: as printed
  values:
    instrument_and_temperature_as_printed: High-temperature Bendix Co. time-of-flight mass spectrometer, model 3015; resolving
      power 750; ion flight path 200 cm. Radiation heating and electron bombardment were used; temperatures as high as 2400°
      K were reached with electron-bombardment heating.
    temperature_measurement_and_calibration_as_printed: Temperature was measured with a Leeds and Northrup optical pyrometer
      and a W, W—Re thermocouple. The discrepancies never exceeded 12°C. The optical pyrometer was calibrated at the melting
      point of gold [8]; bottom-window transmission correction was based on Benford [9].
    background_pressure_as_printed: Below 10^-6 Torr in the Knudsen-cell region and 10^-7 Torr in the analyzer.
    beam_and_readout_as_printed: A molecular beam shutter distinguished ions formed from neutral particles in the beam from
      ions created by surface ionization or background gases. Two standard readout channels were used for ion-intensity ratios
      and isotopic distributions.
    container_as_printed: Molybdenum effusion cell, 1.2 cm high, 1 cm external diameter, with a 1 mm knife-edge orifice; previously
      outgassed at 1800° K.
    sample_as_printed: Crushed andesinic basalt of Nuraghe Silvanis; its composition corresponds to Table IV, sample no. 2,
      of reference 10. The rock is described as vesicular and porphyritic of vitrophyric type.
    silver_and_pressure_calibration_as_printed: “Two silver calibrations were made, before and after the vaporization of the
      sample. The reproducibility of the instrument sensitivity factor was within 15%. On the basis of an extensive observation
      made during several years in this laboratory, we are led to believe that this procedure would affect the pressure calibration
      within an uncertainty of 10–15% at the most.”
  context_id: de-maria-1969-rend-lincei::context::de_maria_1969_method_apparatus_and_calibration
  work_id: c690c12b3396866fe7834e1fa4cd542f370dfb510e0f9f7767135243662c5032
  source_id: de-maria-1969-rend-lincei
  species: Na
