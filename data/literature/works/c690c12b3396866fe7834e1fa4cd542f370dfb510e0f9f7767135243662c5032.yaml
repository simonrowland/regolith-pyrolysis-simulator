  units: as printed
  values:
    mass40_as_printed: Between 1400° and 1800° K, the m/e 40 peak was attributed to re-evaporation of calcium from the shields.
    sio_isotopic_peaks_as_printed: The m/e 44, 45, and 46 currents agree reasonably with SiO isotopic distribution; SiO appearance
      was noticed at about 1800° K.
    surface_ionization_mass50_52_as_printed: The surface-ionization contribution for m/e 50, 51, and 52 was of the order of
      5–10% of the whole peak.
  context_id: de-maria-1969-rend-lincei::context::de_maria_1969_mass40_and_species_interpretation_context
