- observation_id: de_maria_1969_oxygen_reaction_statement
  type: oxygen_potential_context
  experiment: de_maria_1969_andesinic_basalt_kems
  locator:
    page: 13
    published_page: 535
    pdf_page_index: 12
    section: Conclusions
  units: as printed
  values:
    observed_oxygen_reaction_quote: The failure to detect oxygen—made more difficult because of the relatively high background
      peak at mass 16—shows that most of the oxygen in the sample reacted with the molybdenum to form non-stoichiometric oxides
      that began to volatilize at approximately 2000° K.
    fO2_assignment: No experimental fO2 value is printed or assigned.
  context_id: de-maria-1969-rend-lincei::context::de_maria_1969_oxygen_reaction_statement
  work_id: c690c12b3396866fe7834e1fa4cd542f370dfb510e0f9f7767135243662c5032
  source_id: de-maria-1969-rend-lincei
  species: Na
- observation_id: de_maria_1969_sample_vaporization_temperature_context
  type: experiment_temperature_context
  experiment: de_maria_1969_andesinic_basalt_kems
  locator:
    page: 6
    published_page: 528
    pdf_page_index: 5
    section: Results
  units: as printed
  values:
    quantitative_evaporation_as_printed: 178 mgr of sample; starting from room temperature; stages at intervals of about 100°C;
      about four hours at each stage; the series lasted five days.
    initial_stage_as_printed: Temperature interval 300°–500° K; weight loss 7.3 mgr (4.1% of sample), compared with 4.71%
      calculated water in the original sample.
    intermediate_stage_as_printed: In the temperature range 500°–1800° K the weight loss was negligible while the alkaline
      metals and presumably part of the alkaline-earth elements volatilized.
    container_reaction_as_printed: At 1200° K the crucible inner free surfaces began to be covered by brown granules, later
      identified by X-ray as nonstoichiometric molybdenum oxides.
    melting_as_printed: Melting of the sample occurred between 1200° and 1300° K.
    table_conditions_as_printed: Table I intensities were measured at 70 eV electron energy and corrected for surface ionization
      and photo-effect following the usual procedure [5].
    surface_ionization_as_printed: At 1600° K and 70 eV, the surface-ionization contribution to Na+ intensity was about 15%
      of the total peak.
  context_id: de-maria-1969-rend-lincei::context::de_maria_1969_sample_vaporization_temperature_context
  work_id: c690c12b3396866fe7834e1fa4cd542f370dfb510e0f9f7767135243662c5032
  source_id: de-maria-1969-rend-lincei
  species: Na
- observation_id: de_maria_1969_vaporization_stage_context
  type: vaporization_interpretation_context
  experiment: de_maria_1969_andesinic_basalt_kems
  locator:
    page: 10
    published_page: 532
    pdf_page_index: 9
    section: Results
  units: as printed
  values:
    first_stage_as_printed: Between 1300° and 1900° K, alkaline and alkaline-earth metals vaporized largely as atomic or oxygen-containing
      heteronuclear polyatomic species, and to a lesser degree species containing Al and presumably Si.
    second_stage_as_printed: Approximately 2000°–2300° K; Si and Fe and part of Al volatilized. Si volatilized mainly as SiO;
      iron and aluminum as monatomic species.
    third_stage_as_printed: Above 2300° K; residue largely composed of Al2O3 and molybdenum oxide volatilized. Evaporation
      was not completed because the residue appeared to have reacted strongly with the container and weight loss exceeded
      initial sample weight.
    molybdenum_oxide_ions_as_printed: At 70 eV, volatilized molybdenum oxide produced MoO3+, MoO2+, and MoO+ ion peaks, mainly
      from the outer crucible surfaces.
  context_id: de-maria-1969-rend-lincei::context::de_maria_1969_vaporization_stage_context
