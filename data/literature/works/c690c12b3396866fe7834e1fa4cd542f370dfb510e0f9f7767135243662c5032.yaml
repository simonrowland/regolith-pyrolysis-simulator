  units: as printed
  values:
    neutral_condition_hypothesis_quote: Nevertheless it is legitimate to argue that a respectable amount of the oxygen in
      the sample could, in neutral conditions, vaporize in free form at a temperature as low as 1700° K.
    container_conclusion_quote: The present study illustrates the necessity of finding a suitable container to study the material
      in the most perfect neutral conditions possible.
    fO2_assignment: No experimental fO2 value is printed or assigned.
  context_id: de-maria-1969-rend-lincei::context::de_maria_1969_neutral_conditions_statements
