  values:
    quantity: starting_material_ions_and_cell_reaction
    method_class: measured_direct
    starting_material_statement: The studied samples were natural inclusions in Efremovka chondrite (CV3) of types A and B
      (Table 1). They contained also some oxides of potassium, sodium, sulfur, iron, titanium, chromium and nickel.
    ions_detected_as_printed: Ca+, Mg+, Al+, AlO+, Al2O+, SiO+, SiO2+, O2+, K+, Na+, SO2+, Fe+, Ni+, Cr+, TiO+, TiO2+; WO2+
      and WO3+; CaWO3+ and CaWO4+.
    tungsten_oxide_statement: The WO2+ and WO3+ ions corresponded to gaseous tungsten oxide formed due to the interaction
      of oxygen in the gas phase with the material of the tungsten effusion cell.
    calcium_tungstate_statement: 'The presence of CaWO3+ and CaWO4+ ions in the mass spectra is due to the gas phase reaction:
      CaO + WO_i = CaWO_(i+1).'
