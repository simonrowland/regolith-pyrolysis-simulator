- observation_id: shornikov_2023_directional_and_qualifying_statements
  type: data_qualification_context
  locator:
    page: 2
    pdf_page_index: 1
    section: Results and Discussion
  units: source prose; numeric_facts units are stated per value
  values:
    quantity: author_qualifications_and_comparisons
    method_class: quoted_unattributed
    statements:
    - The comparison of the temperature dependences of partial pressures of vapor species over CAIs melts of types A and B
      (Fig. 1 and 2) shows their approximate similarity.
    - Note that the CaO and Al2O3 content in the condensed phase of CAIs type A is higher than in type B.
    - At the same time there are some differences in the p_i temperature dependences of CAIs melts of types A and B.
    - It can be seen that in CAIs type A melts MgO is the first to leave the melt, ahead of SiO2 that it follows from the
      position of the p_Mg and p_SiO maxima (Fig. 1).
    - On the contrary the MgO and SiO2 simultaneous exit from the melt that is specific for CAIs melts of type B.
    - An interesting feature of the evaporation of CAIs melts of types A and B is the presence of SiO vapor specie in the
      gas phase to high temperatures exceeding 2500 K (Fig. 1). This indicates the presence of silicon dioxide in the condensed
      phase of CAIs melts.
    - The calculated changes in CAIs melt compositions of types A and B during evaporation at 1800–2600 K are shown in Fig.
      3. The interesting feature of CAIs melt evaporation is the similarity of changes in the compositions of residual melts
      of types A and B.
    numeric_facts:
    - name: SiO_vapor_presence_threshold_as_printed
      value: '2500'
      unit: K (source says exceeding 2500 K)
      locator:
        figure: '1'
        page: 2
        pdf_page_index: 1
        section: Results and Discussion
    - name: residual_composition_figure_temperature_low
      value: '1800'
      unit: K
      locator:
        figure: '3'
        page: 2
        pdf_page_index: 1
    - name: residual_composition_figure_temperature_high
      value: '2600'
      unit: K
      locator:
        figure: '3'
        page: 2
        pdf_page_index: 1
  context_id: shornikov-2023-natural-cai-evaporation::context::shornikov_2023_directional_and_qualifying_statements
