- observation_id: shornikov_2023_intro_context
  type: author_context
  locator:
    page: 1
    pdf_page_index: 0
    section: Introduction
  units: source prose; numeric_facts units are stated per value
  values:
    quantity: introductory_claims
    method_class: quoted_unattributed
    statements:
    - CAIs represent the most primitive substance of the Solar System with an age of 4.567 billion years.
    - Most researchers believe that CAIs were formed by condensation of solar composition gas.
    - According to modern concepts [1, 2], high-temperature evaporation processes also played a significant role in CAIs formation.
    - 'There are two main stages in CAIs evolution: the stage of formation of CAIs primary condensates and the stage of heating,
      melting and partial evaporation of substance.'
    numeric_facts:
    - name: Solar_System_age_as_printed
      value: '4.567'
      unit: billion years
      locator:
        page: 1
        pdf_page_index: 0
        section: Introduction
