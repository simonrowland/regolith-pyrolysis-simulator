- observation_id: khedim_katrina_2010_table5_reaction_thermodynamics
  type: thermodynamic_example
  locator:
    page: 25
    pdf_page_index: 24
    table: '5'
    note: The corresponding reaction definitions are printed as Eqs. 7-9 on physical PDF page 5.
  phase: NC3S glass melt
  units: kJ mol-1 for reaction enthalpy; J mol-1 K-1 for reaction entropy
  values:
    quantity_as_published: standard reaction enthalpies and entropies for chromium oxide dissolution, oxidation, and reduction
    candidate_quantity_tokens:
    - delta_fH
    - S
    schema_gap: These values are reaction ΔH° and ΔS° for Cr2O3 dissolution and chromium redox reactions, not formation enthalpy
      from elements or absolute entropy.
    method_class: author_derived
    reaction_labels:
      dissolution: Eq. 7; Cr2O3 crystal dissolves to Cr(III) oxo-complex in the melt.
      oxidation: Eq. 8; Cr(III) oxo-complex reacts with O2 to form Cr(VI) oxo-complex in the melt.
      reduction: Eq. 9; Cr(III) oxo-complex reduces to Cr(II) oxo-complex in the melt.
    reaction_equations_as_printed:
      dissolution: 1/2 Cr2O3(crystal) <-> Cr(III)O_x^(2x-3)-(melt) + (3/2 - x) O2-(melt)
      oxidation: Cr(III)O_x^(2x-3)-(melt) + 3/4 O2(gas) <-> Cr(VI)O_y^(2y-6)-(melt) + (x - y + 3/2) O2-(melt)
      reduction: Cr(III)O_x^(2x-3)-(melt) + (z - x + 1/2) O2-(melt) <-> Cr(VI)O_y^(2y-6)-(melt) + 3/4 O2(gas)
    equation_9_note: The surrounding prose identifies Eq. 9 as reduction to Cr(II), but the printed equation writes Cr(VI)O_y
      as its product. The transcription preserves the printed formula and does not resolve the paper's inconsistency.
    values_as_printed:
      dissolution:
        delta_H_kJ_mol: '33'
        delta_H_uncertainty: '11'
        delta_S_J_mol_K: '26'
        delta_S_uncertainty: '9'
      oxidation:
        delta_H_kJ_mol: '50'
        delta_H_uncertainty: '15'
        delta_S_J_mol_K: '54'
        delta_S_uncertainty: '16'
      reduction:
        delta_H_kJ_mol: '172'
        delta_H_uncertainty: '37'
        delta_S_J_mol_K: '61'
        delta_S_uncertainty: '16'
    uncertainty_note: Each nonzero ± width is retained; the table does not state a confidence level.
