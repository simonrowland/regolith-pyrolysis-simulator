    statements_as_printed:
    - 'Complex forms of molecules were observed in the field of high evaporation temperatures of minerals – spinel, perovskite
      and wollastonite: MgAlO, CaSiO, CaSiO2, CaTiO3 [3].'
    - The concentration of complex molecules in the vapor is small and does not exceed 1 % in total concentration.
    - However, it is noted that the proportion of complex molecules increases with the increase of melt temperature.
