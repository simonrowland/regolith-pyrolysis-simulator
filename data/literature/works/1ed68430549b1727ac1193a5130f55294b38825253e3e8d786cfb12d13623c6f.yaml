context:
- observation_id: yakovlev_2018_acid_base_activity_context
  type: thermodynamic_example
  experiment: yakovlev-2018-efremovka-cai-series
  locator:
    page: 1
    section: Abstract
  units: as printed
  values:
    quantity: activity_and_volatility_explanation
    method_class: model_derived
    activity_species:
    - MgO
    - SiO2
    defining_ions: Not stated.
    standard_states: Not stated.
    source_references: '[1] and [2] as cited in the abstract'
    statements_as_printed:
    - Thermodynamic analysis of this volatility inversion showed that it is due to the acid-base melt factor [1], which, in
      turn, is determined by the concentration of CaO.
    - The increasing the CaO concentration in the melt leads to an increase in the activity and, accordingly, the volatility
      of MgO and a decrease in the activity and, accordingly, the volatility of SiO2 [2].
  context_id: yakovlev-2018-meteoritic-kems::context::yakovlev_2018_acid_base_activity_context
  work_id: 1ed68430549b1727ac1193a5130f55294b38825253e3e8d786cfb12d13623c6f
  source_id: yakovlev-2018-meteoritic-kems
  species: O
- observation_id: yakovlev_2018_cai_volatility_inversion_context
  type: thermodynamic_example
  experiment: yakovlev-2018-efremovka-cai-series
  locator:
    page: 1
    section: Abstract
  units: as printed
  values:
    quantity: cai_volatility_inversion_context
    method_class: measured_direct
    samples: Type A CAIs of Efremovka chondrite (CV)
    temperature_Mg_vapor_not_observed_C: 1900
    temperature_SiO_observed_C: 2400
    partial_pressure_values:
      state:
        tag: unknown
        reason: not_published
      locator:
        page: 1
        section: Abstract
        note: No species-specific partial-pressure values are printed.
    statements_as_printed:
    - In the experiment with the CAIs Type A of Efremovka chondrite we observed inversion of the volatility of SiO2 and MgO,
      that is the most volatile MgO compared to the volatility of SiO2.
    - The results of the experiment clearly showed that in the field of high temperatures (T ≈ 1900 °C) the magnesium vapor
      was no longer observed, since it completely evaporated from the melt of the CAI melt.
    - At the same time, silicon in the form of SiO was observed in the vapor along with vapors of refractory oxides – CaO
      and Al2O3, which indicates SiO2 presence in the melt even at the final, high-temperature evaporation stage of the melt
      (T ≈ 2400 °C).
    uncertainty: Not stated.
  context_id: yakovlev-2018-meteoritic-kems::context::yakovlev_2018_cai_volatility_inversion_context
  work_id: 1ed68430549b1727ac1193a5130f55294b38825253e3e8d786cfb12d13623c6f
  source_id: yakovlev-2018-meteoritic-kems
  species: O
