- observation_id: yakovlev_2018_evaporative_sequence_context
  type: thermodynamic_example
  locator:
    page: 1
    section: Abstract
  units: as printed
  values:
    quantity: evaporative_sequence_context
    method_class: measured_direct
    sequence_as_printed: K > Na > Fe (FeO), Ni > SiO, Cr > Mg > Ca (CaO) > TiO, TiO2 > Al, AlO, Al2O (Al2O2).
    qualification_as_printed: The brackets show the forms that are present in the vapor in small quantities.
    note: The source gives an evaporative sequence but no numeric species-pressure series.
    statements_as_printed:
    - The temperature sequence of the appearance of metallic, suboxide and oxide forms in vapors during evaporation of chondrites
      is mainly determined by the volatility of the individual oxide.
    - On the qualitative side, the forms of vapor components over the chondrite melts coincide with the vapor forms observed
      in case of the evaporation of the individual oxides.
