      this does not hold for the depleting phosphorus species (PDF pages 6–7).
    heating_cooling_qualifier: Symmetric Si profile suggests steady Si evaporation, while phosphorus-containing species decrease
      in both heating and cooling cycles because of depletion; increasing temperature eventually raises their intensities
      again.
