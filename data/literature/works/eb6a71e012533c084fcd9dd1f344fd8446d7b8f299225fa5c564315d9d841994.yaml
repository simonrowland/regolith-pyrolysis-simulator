- observation_id: shilov_1998_equations_1_to_19_and_calculation_lineage
  type: thermodynamic_calculation
  locator:
    published_page: 402
    pdf_page_index: 2
    equation: 1–19
  units: equations as printed; partial pressures in atm and activities dimensionless
  values:
    equations_as_printed:
    - (1) (PO) = 1/4(P2) + 1/2(PO2)
    - (2) (SnPO2) = (SnO) + (PO)
    - (3) (SnPO3) = (SnO) + (PO2)
    - (4) (PO2) = (PO) + (O)
    - (5) (O2) = 2(O)
    - (6) pO = K4 pPO2 / pPO
    - (7) pO2 = pO^2 / K5
    - (8) (PO) = 1/2(P2) + (O)
    - (9) (PO2) = 1/2(P2) + 2(O)
    - (10) (PO) + (PO2) = (P2) + 3(O)
    - (11) (SnO) = (Sn) + (O)
    - (12) [ZnO] = (Zn) + (O)
    - (13) 1/2[P4O10] + (P2) = (PO2) + 3(PO)
    - (14) 1/2[P4O10] + (PO) = 3(PO2)
    - (15) 1/2[P4O10] = (PO) + (PO2) + 2(O)
    - (16) [SnO] = (SnO)
    - (17) aP2O5 = (pPO)^3 pPO2 / (pP2 K13)
    - (18) aP2O5 = (pPO2)^3 / (pPO K14)
    - (19) ln aP2O5 = ln a*P2O5 + 2 ln a*ZnO − 2 ln aZnO − 3 integral from 0 to xSnO of xSnO d ln(aZnO/aSnO)
    calculation_lineage:
      table_3: Equilibrium constants for reactions (1)–(3); this-work rows use partial pressures from Table 2.
      table_4: Atomic and molecular oxygen partial pressures computed from gas-phase equilibria; Ki values are taken from
        [10].
      table_5:
      - aZnO calculated using equilibrium (12), with its constant from [8].
      - aSnO calculated using equilibrium (16), with its constant from [10].
      - aP2O5 calculated from the measured (P2), (PO), and (PO2) pressures and constants for equilibria (13) and (14); the
        comparison column uses Gibbs–Duhem equation (19).
  context_id: shilov-1998-sno-zno-p2o5-vaporization::context::shilov_1998_equations_1_to_19_and_calculation_lineage
