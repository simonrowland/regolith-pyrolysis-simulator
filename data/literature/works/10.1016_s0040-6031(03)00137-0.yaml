  values:
    method_class: quoted_attributed
    attributed_sources_as_printed:
    - Dai et al. [1,2]: binary phase-diagram studies.
    - Lindemer et al. [3]: estimated oxide phases, including Na8Fe2O7 and higher oxides.
    - Seetharaman and Du [4]: low-oxygen and oxygen–sodium potential diagrams; Na2FeO2 stability ruled out by thermodynamic
        analysis.
    - Sridharan et al. [5,6]: thermal analysis and solid-state reactions; ternary phase equilibria.
    - Bhat and Borgstedt [9]: Na4FeO3 thermodynamic assessment.
    - Stuve et al. [14]: Na8Fe2O7 standard formation enthalpy.
    excluded_or_unadopted: Na2FeO2 and higher oxides were excluded from the calculation; source reports failed synthesis or
      absent observations for the former and absent observations for the latter.
