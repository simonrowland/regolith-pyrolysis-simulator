- observation_id: shornikov_2003_cao_activity_reference
  type: activity_reference
  locator:
    page: 3
    pdf_page_index: 2
    published_page: 114
    equation: '6'
  units: dimensionless
  values:
    standard_state: 'Equation (6), published p. 114, anchors ln a(CaO) at a*(CaO). The paper states: "a*(i) is the activity
      of the i component of the CaTiO3 compound crystallized from the SiO2-CaTiO3 melt at the concentration equal to x*(i)."
      x*(SiO2) is 10.94±0.18 mol% at 2100 K. This is a component in crystallized CaTiO3 at x*, not a pure-oxide endmember.
      The phase is not stated. The Fig. 1 series 1 points are stored under observations.'
    reference_kind: component in crystallized CaTiO3 at x*
  context_id: shornikov-2003-silica-catitanoate-melts::context::shornikov_2003_cao_activity_reference
  work_id: bab5b5825fab491a3bddeb5800b15006b7c0ac60a124dc1a92551f47c78fdb22
