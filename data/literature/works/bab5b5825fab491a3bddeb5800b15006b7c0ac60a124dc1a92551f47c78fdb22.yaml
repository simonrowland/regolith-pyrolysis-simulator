    figure: '1'
    note: Fig. 1 markers that were not stored. At about 40 mol% SiO2 the TiO2 up-triangle and the SiO2 down-triangle merge
      into one filled diamond. The core component is one blob at page pixel (2628.7, 1054.7). The two centres are not separable,
