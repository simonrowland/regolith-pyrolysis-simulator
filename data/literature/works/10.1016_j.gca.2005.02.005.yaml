    actual_fO2_as_printed: Actual experiments were done at a variety of values for fO2; values are not printed per row.
    equation_6_as_printed: E* = Epk − (RT/nF) ln(Dr/Do)^(1/2) − ΔE/2 + RT/(4F) ln(fO2)
    equation_6_locator:
      page: 6
      pdf_page_index: 5
      published_page: 3066
      equation: '6'
    equation_6_definitions_as_printed: E* is the standard reduction potential in volts relative to the oxygen reference electrode
      intrinsic to these silicate melt experiments; fO2 is the activity of oxygen in atmospheres.
    FeO_activity_relation_as_printed: aFeO = (aO2−)(aFe2+)
    FeO_activity_relation_locator:
      page: 1
      pdf_page_index: 0
      published_page: 3061
      section: Abstract
    oxide_ion_activity_model_as_printed: aO2− = 0.75 · NBO/BO relative to a standard state of melt with the composition of
      diopside.
    oxide_ion_activity_locator:
      page: 1
      pdf_page_index: 0
      published_page: 3061
      section: Abstract
    table3_standard_states_as_printed:
      constants: R = 8.315 J K−1 mol−1; F = 96485 C mol−1; n = 2; T is temperature in Kelvin.
      oxide_ion: Activity for O2− is defined to equal 1 in melt of diopidic composition.
      liquid_NiO: The free energy for this standard state is taken from Barin (1989) after Holzheid et al. (1997), their eqn.
        7, as −185092 + 99.844 · T − 4.898 · T · ln(T).
      liquid_wuestite_FeO: The free energy for this standard state is taken from Barin (1989) after Holzheid et al. (1997)
        as = −244118 + 115.559 · T − 8.474 · T · ln(T).
      locator:
        page: 7
        pdf_page_index: 6
        published_page: 3067
        table: '3'
        row: footnote a
    equation_23_as_printed: 1 / γFe2+ = A + B · XMgO + C · XCaO; R2 = 0.85; A = −3.48(0.96); B = 8.56(1.92); C = 13.94(2.56);
      8 data points; uncertainties are 1σ.
    equation_23_locator:
      page: 11
      pdf_page_index: 10
      published_page: 3071
      equation: '23'
    equation_23_schema_gap: The fitted quantity is reciprocal Fe2+ activity coefficient as a function of composition; no exact
