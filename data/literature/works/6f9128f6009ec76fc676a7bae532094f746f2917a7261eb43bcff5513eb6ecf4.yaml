    caption_as_published: Experimental results for mutual interaction of pairs of redox couples in synthetic silicate melts.
      Concentrations in quenched glasses were determined by EPR and wet-chemistry procedures. Solid symbols are measured paired-couple
      experiments; open symbols are points interpolated from previous individual-couple studies. The panels show Ti-Cr, Ti-Eu,
      and Cr-Eu systems, each with FAS and FAD bulk compositions. Symbol shapes encode temperature and -log fO2.
    panel: Ti-Cr FAS/FAD; Ti-Eu FAS/FAD; Cr-Eu FAS/FAD
    series:
    - label: measured 1500 °C, -log fO2 = 5.5
      marker: filled triangle
      marker_count: uncounted
    - label: measured 1500 °C, -log fO2 = 7.7
      marker: filled circle
      marker_count: uncounted
    - label: measured 1550 °C, -log fO2 = 5.5
      marker: filled square
      marker_count: uncounted
    - label: measured 1550 °C, -log fO2 = 7.7
      marker: filled diamond
      marker_count: uncounted
    - label: interpolated no-interaction values
      markers: open triangle, circle, square, diamond
      marker_count: uncounted
    marker_count_note: The six small panels contain overlapping points separated by element pair, FAS/FAD composition, temperature
      and oxygen fugacity. Counts were not separated by each combined series in this deferred record.
    composition_as_published: FAS = 53 wt% forsterite, 27 wt% anorthite, 20 wt% silica; FAD = 25 wt% forsterite, 6 wt% anorthite,
      69 wt% diopside.
    oxygen_reference_as_published: Not stated for the printed -log fO2 legend values; retained verbatim.
