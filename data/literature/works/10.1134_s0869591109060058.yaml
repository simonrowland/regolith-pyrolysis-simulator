- observation_id: borisov_2009_printed_comparison_of_alkali_solubility_changes
  type: unscored_measurement_context
  locator:
    page: 5
    pdf_page_index: 4
    published_page: 583
    section: Influence of Al2O3 content on the solubility of alkalis; Figure 3 discussion
  units: relative changes in printed alkali solubility
  values:
    candidate_tokens_checked:
    - equilibrium_phase_composition
    - activity_coefficient
    no_token_reason: These prose percentages summarize changes across multi-sample series and do not give point compositions
      or activity coefficients; the plotted points remain deferred.
    reported_comparisons:
    - 'Increasing Al2O3 from CSA6 to CSA25: Rb and K solubility increase by 13–14%; Na by 3%.'
    - 'Across DA to DAS50/DAS200: alkali solubility increases by 20–50% for Na, by a factor of 2.0–2.5 for K, and by a factor
      of 3.0–3.5 for Rb.'
    - Solubility maxima occur at 62–75 wt% SiO2; the maxima shift from 62–65 wt% for Na to 68–70 wt% for K and 69–73 wt% for
      Rb.
  context_id: borisov-2009-alkali-activity-coefficients::context::borisov_2009_printed_comparison_of_alkali_solubility_changes
