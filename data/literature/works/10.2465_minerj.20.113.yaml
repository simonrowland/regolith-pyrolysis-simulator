- observation_id: tsuchiyama_1998_model_equations_and_examples
  type: thermodynamic_example
  locator:
    published_page: 118
    pdf_page_index: 5
    section: Model on forsterite evaporation rates and Fig. 5
  units: as printed
  values:
    quantity: author_model_and_numeric_examples
    method_class: model_derived
    model: Hertz-Knudsen equations with equilibrium vapor pressures; gas species Mg, SiO, O2, O and ambient H2/H; eighteen
      ambient and evaporated species considered by Nagahara and Ozawa (1996).
    pFo_equilibrium_1700C_bar: 3.8×10^-6
    pFo_equilibrium_1200C_bar: 9.1×10^-11
    oxygen_as_atomic_O_1700C: about 20%
    model_total_pressure_definition: Ambient gas H2+H only; residual gas ignored, unlike Nagahara and Ozawa (1996), whose
      total pressure included ambient plus evaporated gas.
    FED_condition: p_total sufficiently smaller than pFo equilibrium; free evaporation, pressure-independent rate as described
      by the model.
    HRD_condition: p_total sufficiently larger than pFo equilibrium; H2 acts as reducing agent.
    HRD_pressure_relation: If back reaction/recondensation is ignored, j_Fo(HRD) is proportional to p_H2^1/2.
    transition_fit: j_Fo=[j_Fo(FED)^n+j_Fo(HRD)^n]^(1/n), n approximately 2.0 within about 1% error.
    boundary_trend: Boundary p_total approximately pFo equilibrium decreases with decreasing temperature.
    figure_only: Figures 5 and 6 show calculated model curves; no curves digitized.
    considered_gas_species:
    - H
    - H2
    - H2O
    - OH
    - O
    - O2
    - Si
    - Si2
    - SiO
    - SiO2
    - SiH
    - SiH4
    - Mg
    - Mg2
    - MgO
    - MgH
    - MgOH
    - Mg(OH)2
    congruent_element_flux_ratios: j_Mg/j_Si=2; j_O/j_Si=4
    FED_evaporation_reaction: Mg2SiO4(s) = 2 Mg(g) + SiO(g) + 3/2 O2(g)
    oxygen_dissociation_reaction: O2(g) = 2 O(g)
    HRD_evaporation_reaction: Mg2SiO4(s) + 3 H2(g) = 2 Mg(g) + SiO(g) + 3 H2O(g)
    residual_gas_assumption: Residual gas species remaining after evacuation are ignored in the present model.
    recondensation_assumption: Ambient evaporated-species partial pressures are treated as zero in derivation; authors state
      p_i>0 from recondensation but p_i << p_i equilibrium.
  context_id: tsuchiyama-1998-forsterite-mg2sio4-h2::context::tsuchiyama_1998_model_equations_and_examples
