- observation_id: tsuchiyama_1998_model_equations_as_printed
  type: thermodynamic_example
  locator:
    published_page: 120
    pdf_page_index: 7
    section: Model on forsterite evaporation rates and Appendix
    note: Each equation carries its own locator. Eqs. (4), (5), (A2), (A5), (A9), (A10) are carried in tsuchiyama_1998_model_equations_and_examples.
  units: as printed
  values:
    quantity: author_model_equations_as_printed
    method_class: model_derived
    notation: 'ASCII transcription of the printed typography: ^e = superscript e (equilibrium), ^id = superscript id (ideal),
      _X = subscript; no symbol was renamed.'
    equations:
    - equation: '3'
      as_printed: j_Fo(FED) = α j_Fo^id(FED)
      where_as_printed: where superscript id denotes ideal evaporation rate by the calculation (see Appendix; Eqs. (A3) and
        (A6-8) or Eq. (A11)). α (usually less than unity) shows the degree of kinetic constrains of evaporation
      locator:
        published_page: 120
        pdf_page_index: 7
        section: Model on forsterite evaporation rates
        equation: '3'
    - equation: alpha definition
      as_printed: α (= j_Fo/j_Fo^id)
      context_as_printed: The difference between the measured and ideal evaporation rates corresponds to the evaporation coefficient,
        α (= j_Fo/j_Fo^id).
      locator:
        published_page: 120
        pdf_page_index: 7
        section: Evaporation rates in the experiments
        equation: alpha definition
    - equation: HRD alpha relation (inline, unnumbered)
      as_printed: j_Fo(HRD) = α j_Fo^id(HRD)
      locator:
        published_page: 120
        pdf_page_index: 7
        section: Model on forsterite evaporation rates
        equation: HRD alpha relation (inline, unnumbered)
    - equation: A1
      as_printed: j_E = α Σ_i ν_Ei (p^e_Ei − p_Ei) / sqrt(2π m_Ei k T)   (E = Mg, Si, and O)
      where_as_printed: where α is the evaporation coefficient, ν_Ei the stoichiometric coefficient (the number of the element
        E in i-th gas species), p^e_Ei the vapor pressure of i-th species in equilibrium with forsterite at temperature, T,
        p_Ei the partial pressure in an ambient gas, m_Ei the mass of i-th species, and k, the Boltzmann constant.
      locator:
        published_page: 124
        pdf_page_index: 11
        section: Appendix
        equation: A1
