- observation_id: copland_2001_alumina_solution_scheme
  type: method
  locator:
    published_page: 31
    pdf_page_index: 4
    section: Critical Experimental Issues
    note: Complete scheme (6), cited in the alumina-constituent sentence to ref. 12 (Chatillon 1997); theoretical method relations,
      not empirical observations.
  units: verbatim
  values:
    method_class: method_only
    quantity: oxide_activity_relation
    attribution: Ref. 12, C. Chatillon, High Temperature Materials Chemistry IX, PV 97-39 (1997).
    pure_reaction_as_printed: Al2O3(pure) = 2Al(g) + 3O(g)
    pure_equilibrium_constant_as_printed: K = P_Al^2 P_O^3 / 1
    solution_reaction_as_printed: Al2O3(soln) = 2Al(g-soln) + 3O(g-soln)
    solution_equilibrium_constant_as_printed: K = P_Al(soln)^2 P_O(soln)^3 / a_Al2O3
    standard_state: Alumina in solution is compared with pure alumina, whose activity is 1 (the printed denominator); unsubscripted-by-soln
      pressures and intensities in the final ratio are the pure-alumina reference. No separate physical reference phase or
      gas standard pressure is printed.
    relation_as_printed: a_Al2O3 = P²_Al(soln) P³_O(soln) / (P²_Al P³_O) = I²_Al(soln) I³_O(soln) / (I²_Al I³_O)
    quote: These systems produce mass spectra that are much more complex and the activities must be derived accordingly. Consider
      a solution with alumina as a constituent (see scheme 6 above). Several groups are actively using the KCMS technique
      to measure the properties of complex oxide solutions. This type of data are used to develop oxide solution models.
  context_id: kems-209-copland-2001::context::copland_2001_alumina_solution_scheme
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Al
- observation_id: copland_2001_background_separation
  type: apparatus
  locator:
    published_page: 29
    pdf_page_index: 2
    section: Critical Experimental Issues
    note: Technique-general.
  units: verbatim; resolution as printed
  values:
    method_class: quoted_unattributed
    quantity: background_peak_separation
    neutral_parent_guidance: Identify the neutral precursors of observed ions. Ti vapor above Ti alloys forms Ti+; NiO forms
      Ni+, NiO+, O2+, and O+. Low-energy ionizing electrons minimize fragmentation and simplify the mass spectrum but reduce
      sensitivity.
    magnetic_sector_resolution_as_printed: 1000 or greater
    quote: The ionizing electron energy can be chosen to limit fragmentation of background hydrocarbons and limit the number
      of background peaks. A magnetic sector instrument typically has a resolution of 1000 or greater, which allows separation
      of inorganic peaks from any hydrocarbons. Finally a shutter, as shown in Fig. 1, can be used to interrupt the molecular
      beam emerging from the cell so the background can be identified and subtracted.
  context_id: kems-209-copland-2001::context::copland_2001_background_separation
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_cell_material_and_design_guidance
  type: method
  locator:
    published_page: 29
    pdf_page_index: 2
    section: Critical Experimental Issues
    note: Technique-general guidance; the cells used for Figs. 2–4 are not described.
  units: verbatim
  values:
    method_class: quoted_unattributed
    quantity: cell_material_and_design_guidance
    sample_to_orifice_area_ratio_min_as_printed: 100
    sample_form_guidance: Large surface area is readily achieved with powder but may require a larger cell area with liquid.
      This is generic guidance, not a stated form of the plotted samples.
    quote: The first requirement is an inert cell. A wide range of refractory-metal and ceramic materials have been used for
      Knudsen cells. Generally metallic alloys are studied in refractory ceramic cells (Al2O3, ZrO2, Y2O3, etc.) and ceramics
      are studied in refractory metal cells (W, Mo, Ir, etc.). ... In general this is achieved by a cell with a larger diameter
      than height and a sample with a large surface area (generally the sample area should be at least one hundred times greater
      than the orifice area).
  context_id: kems-209-copland-2001::context::copland_2001_cell_material_and_design_guidance
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_cu_second_law_check
  type: calibration_check
  experiment: cu-second-law-check
  locator:
    published_page: 29
    pdf_page_index: 2
    figure: '2'
    note: The tabulated value is printed in the caption with a citation to ref. 2 (NIST-JANAF, 4th ed.); the measured value
      is printed as text inside the plot area. Neither is digitized from the plotted points.
  units: kJ/mol as printed
  values:
    method_class_by_value:
      measured_dvapH_kJ_per_mol_as_printed_in_plot: author_derived
      measured_dvapH_uncertainty_kJ_per_mol_as_printed_in_plot: author_derived
      tabulated_dvapH_kJ_per_mol: quoted_attributed
    attribution_by_value:
      tabulated_dvapH_kJ_per_mol: ref. 2, M. W. Chase, Jr., NIST-JANAF Thermochemical Tables, Fourth Edition
    quantity: second_law_enthalpy_of_vaporization_check
    evidence_origin: The 332.0 +/- 0.9 result is the printed second-law fit reduction; 331.8 is quoted_attributed to ref.
      2, M. W. Chase Jr., NIST-JANAF Thermochemical Tables, Fourth Edition (1998); the 2 kJ/mol tolerance is method guidance,
      not a measured uncertainty.
    derivation: Slope of ln(I_i T) versus 1/T yields the second-law heat. Numeric slope, raw ion currents, fit inputs and
      numerical reduction lineage are not published outside the undigitized graph; no raw parent observations are fabricated.
      Absolute-pressure conversion is not required for this check (p. 30).
    measured_dvapH_kJ_per_mol_as_printed_in_plot: '332'
    measured_dvapH_uncertainty_kJ_per_mol_as_printed_in_plot: '0.9'
    tabulated_dvapH_kJ_per_mol: '331.8'
    acceptance_window_kJ_per_mol_as_printed: 2
    plot_annotation: ΔvH(Cu) = 332.0 +/- 0.9 kJ/mol
    caption: FIG. 2. Second law heat of vaporization for copper. The tabulated value is 331.8 kJ/mol.
    quote: The best test for proper operation of a Knudsen cell instrument is a simple second law heat of vaporization of
      a well-characterized vapor pressure standard. This is illustrated in Fig. 2 for copper, where the slope of the line
      in a plot of ln (IiT) vs. 1/T gives a heat of vaporization. An acceptable heat is within 2 kJ/mol of the accepted value.
    note: The ± is printed without a stated confidence basis. The ln(IT) vs 1/T points are figure-only.
  context_id: kems-209-copland-2001::context::copland_2001_cu_second_law_check
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_dimer_monomer_activity_method
  type: method
  locator:
    published_page: 30
    pdf_page_index: 3
    section: Critical Experimental Issues, equations (2) and (3)
  units: symbolic activity relation as printed
  values:
    method_class: method_only
    quantity: dimer_monomer_activity_relation
    method_count_as_printed: Three methods have been developed to circumvent run-to-run machine-constant changes.
    attribution: Dimer/monomer approach developed by Berkowitz and Chupka, refs. 1 and 7.
    equilibrium_as_printed: 2A(g) = A2(g)
    relation_as_printed: a(A) = I°(A) I(A2) / [I°(A2) I(A)]
    definitions: I°(A) and I°(A2) are intensities over pure element A; I(A) and I(A2) are intensities over the alloy containing
      A. The text calls both species A(g) in its intensity definitions, although the displayed relation distinguishes A and
      A2; retained without silently repairing the wording.
    standard_state: Alloy activity is relative to pure element A under the compared conditions; a physical reference phase
      is not separately specified.
    applicability: Requires both species to be readily measurable with a well-established dimer/monomer equilibrium; limited
      to specific systems.
  context_id: kems-209-copland-2001::context::copland_2001_dimer_monomer_activity_method
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
