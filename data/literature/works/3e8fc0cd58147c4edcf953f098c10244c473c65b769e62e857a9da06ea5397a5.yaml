- observation_id: copland_2001_gibbs_duhem_activity_method
  type: method
  locator:
    published_page: 30
    pdf_page_index: 3
    section: Critical Experimental Issues, equation (4)
  units: symbolic relation as printed; ln is natural logarithm
  values:
    method_class: method_only
    quantity: ion_current_ratio_activity_coefficient_relation
    relation_as_printed: ln γ_A = -∫_(x_A=1)^(x_A) x_A d[ln(I_A^+/I_B^+) - ln(x_A/x_B)]
    definitions: γ_A is the activity coefficient of A; x_A and x_B are mole fractions of A and B; I_A and I_B are measured
      ion intensities of A(g) and B(g) over the alloy. The displayed integrand prints x_A, and the ion-current superscripts
      are positive charges.
    standard_state: Pure-component normalization at x_A = 1 is implied by the printed integration limit; no separate physical
      reference phase is specified.
    applicability: Manipulating Gibbs-Duhem cancels the calibration constant and requires only alloy measurements, without
      standards; measurable vapor pressures for both components over a composition range are required. Refs. 1 and 8.
  context_id: kems-209-copland-2001::context::copland_2001_gibbs_duhem_activity_method
