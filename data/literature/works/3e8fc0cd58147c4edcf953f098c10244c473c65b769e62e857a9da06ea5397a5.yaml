- observation_id: copland_2001_kcms_operating_range
  type: method
  locator:
    published_page: 28
    pdf_page_index: 1
    section: Basic Technique
    note: Technique-general statements; not tied to a specific run. Filed under Cu only as a container.
  units: bar, K, cm and mm as printed
  values:
    method_class: quoted_unattributed
    quantity: technique_operating_range_and_typical_cell_geometry
    history_as_printed: KCMS has been used for nearly fifty years.
    equilibrium_guidance: A condensed sample in a small Knudsen cell is uniformly heated and held until equilibrium is attained
      between condensed and vapor phases; vapor is continuously sampled through a small orifice.
    collimation_as_printed: A beam sampled close to the orifice normal is collimated by one or more apertures and directed
      to the ionization chamber.
    pressure_range_bar_as_printed: ~10^-4 to 10^-11
    temperature_range_K_as_printed: 500-2800
    typical_cell_size_as_printed: 1 cm in diameter x 1 cm tall
    typical_orifice_diameter_mm_as_printed: 0.5-2
    upper_pressure_limit_bar_for_1_mm_orifice_as_printed: ~10^-4
    lower_pressure_limit_bar_as_printed: ~10^-11
    quote: All classes of materials can be studied and all constituents of the vapor phase can be measured over a wide range
      of pressures (~10-4 to 10-11 bar) and temperatures (500-2800 K). ... Typically a Knudsen cell is 1 cm in diameter x
      1 cm tall with an orifice of well-defined geometry. The orifice is small (typically 0.5-2 mm diameter) to ensure molecular
      flow is maintained as molecules pass through the orifice, i.e., molecule-wall collisions dominate over molecule-molecule
      collisions. As a general rule, the orifice dimensions must be kept to less then one tenth of the mean free path of the
      vapor species, over all experimental conditions. This, in turn, leads to an upper pressure limit of ~10-4 bar for a
      1 mm orifice. The lower pressure limit is determined by the sensitivity of the instrument and is typically ~10-11 bar.
  context_id: kems-209-copland-2001::context::copland_2001_kcms_operating_range
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_multiple_cell_activity_method
  type: method
  locator:
    published_page: 30
    pdf_page_index: 3
    section: Critical Experimental Issues, equation (5)
  units: symbolic activity relation as printed
  values:
    method_class: method_only
    quantity: multiple_cell_activity_relation
    history_as_printed: First discussed in 1960 by Büchler and Stauffer (ref. 11); that reference lists a 1966 publication.
    cell_count_as_printed: Two or more cells are adjacent to each other.
    relation_as_printed: a_Al = P_Al(soln)/P_Al(pure) = I_Al(soln)/I_Al(pure)
    definitions: P and I are partial pressure and ion intensity, respectively; ideally pure Al occupies one cell and Ti-Al
      the other.
    standard_state: Al in solution is referenced to pure Al; a separate physical reference phase or gas standard pressure
      is not specified.
    beam_mixing_guidance: Molecular beams tend to mix. Chatillon's restricted collimation (ref. 12) uses fixed collimating
      apertures to restrict ion-source vapor to that originating in the cell orifice of interest. The authors use a secondary
      in-situ pure Cu or Au standard instead of pure Al (ref. 13); an additional pure-Al versus Cu/Au run supplies the correction
      to expected pure-Al intensity, preserving the pure-Al activity reference. The actual secondary metal and a Ti-specific
      calibration are not stated for Fig. 4.
  context_id: kems-209-copland-2001::context::copland_2001_multiple_cell_activity_method
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_pressure_calibration_guidance
  type: method
  locator:
    published_page: 30
    pdf_page_index: 3
    section: Critical Experimental Issues
    note: Technique-general guidance on absolute pressure calibration with a standard.
  units: verbatim
  values:
    method_class: quoted_unattributed
    quantity: absolute_pressure_calibration_guidance
    quote: 'Reliable vapor pressure data are available for most pure metals and these are excellent standards. However care
      must be taken to measure the standard and sample vapor pressures under exactly the same conditions: the molecular beam
      must be directed to the same region in the ion source, and the cells used for the vapor pressure standard and the sample
      must have matched orifices to ensure the molecular beams are identical. ... maintaining an identical machine constant
      from run to run involves using a rigidly mounted cell and an isolation valve between the Knudsen cell chamber and the
      ionizer. ... For most instruments, the machine constant changes from run to run.'
  context_id: kems-209-copland-2001::context::copland_2001_pressure_calibration_guidance
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_pressure_ion_current_relation
  type: method
  locator:
    published_page: 29
    pdf_page_index: 2
    section: Basic Technique, equation (1)
  units: symbolic relation as printed; no numeric cross sections or machine constant
  values:
    method_class: method_only
    quantity: pressure_ion_current_relation
    relation_as_printed: P_i = k I_i T / σ_i
    definitions: I_i is ion intensity; P_i partial pressure; T absolute temperature of the vapor source; σ_i ionization cross
      section; k machine constant. Absolute pressures require both k and σ_i. The machine constant combines molecular-beam
      formation, ionization, ion collection, analyzer transmission and detector collection efficiencies.
    instrument_history_as_printed: Basic components (ionizer, accelerator, ion sorter, detector) remain similar to designs
      of the 1960s.
  context_id: kems-209-copland-2001::context::copland_2001_pressure_ion_current_relation
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
- observation_id: copland_2001_temperature_calibration_guidance
  type: method
  locator:
    published_page: 29
    pdf_page_index: 2
    section: Critical Experimental Issues
    note: Technique-general guidance; not stated for the reported runs.
  units: verbatim
  values:
    method_class: quoted_unattributed
    quantity: temperature_measurement_and_calibration_guidance
    requirements_as_printed: (1) a constant temperature must be maintained; (2) temperature gradients in the cell must be
      eliminated; (3) the absolute temperature must be accurately measured.
    calibration_metals_as_printed: Ag, Au, Cu
    quote: Temperatures can be measured by either a pyrometer or thermocouple. These measurements must be taken at the cell,
      either with a black body hole drilled into the cell or a thermocouple tightly coupled to the cell. A typical calibration
      involves slowly varying the temperature through the melting point of a pure metal (e.g., Ag, Au, Cu, etc.) and observing
      both the corresponding plateau in vapor pressure and thermal arrest. Temperature calibration must be done frequently
      for thermocouples as the vacuum and reactive vapor environment can result in rapid changes in wire composition.
  context_id: kems-209-copland-2001::context::copland_2001_temperature_calibration_guidance
  work_id: 3e8fc0cd58147c4edcf953f098c10244c473c65b769e62e857a9da06ea5397a5
  source_id: kems-209-copland-2001
  species: Cu
