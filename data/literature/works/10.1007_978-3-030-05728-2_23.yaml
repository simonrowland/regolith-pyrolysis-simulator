- observation_id: shornikov_2019_qualifying_statements
  type: literature_context
  locator:
    published_page: 255
    pdf_page_index: 2
    section: Introduction
    note: Individual quote locators are retained in values.statements.
  units: verbatim statements as printed
  values:
    quantity: data_qualifications_and_comparisons
    statements:
    - method_class: quoted_unattributed
      quote: Two calcium titanates—Ca3Ti2O7 and Ca4Ti3O10, melting incongruently, were also found in the CaO–TiO2 system (Fig.
        1).
      locator:
        published_page: 253
        pdf_page_index: 0
        section: Introduction
    - method_class: quoted_unattributed
      quote: 'The gas phase over calcium oxide consists of vapor species: (O), (O2), (O3), (O4), (Ca), (Ca2) and (CaO), which
        can be formed by the following reactions:'
      locator:
        published_page: 254
        pdf_page_index: 1
        section: Introduction
    - method_class: quoted_unattributed
      quote: 'In the gas phase over titanium oxide, similar vapor species are present: (O), (O2), (O3), (O4), (Ti), (Ti2),
        (Ti3), (TiO) and (TiO2), which are formed by similar reactions'
      locator:
        published_page: 254
        pdf_page_index: 1
        section: Introduction
    - method_class: quoted_unattributed
      quote: Note that, predominant vapor species in the gas phase over these oxides are (Ca), (CaO), (TiO), (TiO2), (O),
        and (O2), the total amount of the remaining vapor species does not exceed 1% at 1700–2200 K.
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - method_class: quoted_unattributed
      quote: The properties of the gas phase over perovskite are not studied in detail.
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - method_class: quoted_attributed
      attribution: references [14–17]
      quote: The gaseous CaTiO3 was not detected in mass spectrometric studies during high-temperature evaporation of CaO–TiO2–SiO2
        melts using Knudsen effusion molybdenum and tungsten cells at 1700–2500 K [14–17]. This might be due to either low
        sensitivity of the equipment used to determine the CaTiO3+ ion [14, 17], or it was not the purpose of research [15,
        16].
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - method_class: quoted_attributed
      attribution: Banon et al. (1981), reference [9]
      quote: The predominant vapor species of the gas phase over the compositions studied was atomic calcium. The (CaTiO3)
        complex gaseous oxide was not found.
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - method_class: quoted_attributed
      attribution: Zhang et al. (2014), reference [4]
      quote: The compositional changes of the residual melt during perovskite evaporation indicated the predominant evaporation
        of calcium components of the melt. It was possible to estimate the total vapor pressure over perovskite from the obtained
        data, which is also shown in Fig. 2.
      locator:
        published_page: 256
        pdf_page_index: 3
        section: Introduction
    - method_class: quoted_unattributed
      quote: Thus, the available information on the evaporation processes of perovskite is rather scarce and is limited to
        the established gas phase composition and the separate definitions of the partial pressure values of vapor species
        and the total vapor pressure over perovskite at different temperatures.
      locator:
        published_page: 256
        pdf_page_index: 3
        section: Introduction
    - method_class: quoted_unattributed
      quote: The presence of MoO+i (i = 0–3) ions in the mass spectra of vapor over perovskite were due to the evaporation
        of molybdenum cell at high temperature.
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_unattributed
      quote: 'as well as the interaction of perovskite with the cell material (I_TiO2 : I_Mo : I_MoO : I_MoO2 : I_MoO3 = 100
        : 0.8 : 2.6 : 7.3 : 0.6) that was detected according to the following equilibria:'
      cell_reaction_intensity_order:
      - TiO2
      - Mo
      - MoO
      - MoO2
      - MoO3
      cell_reaction_intensity_ratio_values:
      - 100
      - '0.8'
      - '2.6'
      - '7.3'
      - '0.6'
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_attributed
      attribution: Berkowitz et al. (1957), reference [13]
      quote: Note that, Berkowitz et al. [13] found that during evaporation of titanium oxide from a molybdenum liner inserted
        into a tantalum crucible at 1881 K, p_MoO2 was initially 10–10^2 times higher than p_TiO2. The value of p_MoO2 then
        gradually decreased and became comparable with p_TiO2 which is significantly different from the results of the present
        study.
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_attributed
      attribution: Berkowitz et al. (1957), reference [13]
      quote: The high p_MoO2 observed in [13] probably was due to poor quality of the molybdenum liner material (or its alloy).
        Possibly it was made using powder technology from MoO3 reduced to metallic molybdenum at temperatures of ~1300 K,
        which could lead to such an excess of partial pressure of (MoO3) and its subsequent decrease as it evaporates from
        the surface layers of the liner material.
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_unattributed
      quote: The appearance energies of ions in the mass spectra of vapor over perovskite were determined by the Warren method
        [21] and corresponded to the accepted values of the ionization energies of atoms and molecules typical for simple
        oxides [22].
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_unattributed
      quote: The appearance energy of CaTiO3+ ion in the mass spectra of vapor over perovskite was equal to 8.5 ± 0.6 eV (the
        appearance energy of silver ion in the mass spectrum of vapor was used as a standard) and corresponded to that obtained
        by Lopatin and Semenov [18].
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_unattributed
      quote: 'The established molecular composition of the gas phase over perovskite indicated on the predominant evaporation
        of perovskite according to the reactions (1), (2), (4), (7), (8) and (9), typical for evaporation of simple oxides
        [6, 7, 10, 20]. The presence of a small amount of (CaTiO3) molecules in the gas phase over perovskite is probably
        due to the reaction:'
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
    - method_class: quoted_unattributed
      quote: The partial pressures of vapor species over perovskite calculated using the relationships (22) and (23) with
        an error not exceeding 8% are shown in Table 1.
      locator:
        published_page: 259
        pdf_page_index: 6
        section: Experimental
    - method_class: quoted_unattributed
      quote: 'The partial pressure of atomic oxygen determined using these relationships agrees satisfactorily with those
        calculated using the thermochemical data [7] on K_r(T) equilibrium constants of possible reactions (2), (4), (8),
        (9) and (20) in the gas phase over perovskite in the following relations:'
      locator:
        published_page: 259
        pdf_page_index: 6
        section: Experimental
    - method_class: quoted_attributed
      attribution: Banon et al. (1981), reference [9]
      quote: In the case of [9], the partial pressure values of vapor species over the perovskite at a temperature of 2150
        K were calculated using TiO and TiO2 activities and the Gibbs energy of perovskite (ΔG^m_2150) and thermochemical
        data [9] on equilibria (1), (2), (7) and (8).
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: It should be noted that the established correspondence of p_O values calculated according to the independent
        reactions in the gas phase over perovskite confirms the assumption about the molecular origin of the identified ions
        in the mass spectrum of vapor over perovskite.
      locator:
        published_page: 259
        pdf_page_index: 6
        section: Experimental
    - method_class: quoted_unattributed
      quote: 'Thus the defined partial pressures of vapor species over perovskite, as it follows from Fig. 2, can be represented
        as linear logarithmic dependence versus the inverse temperature as follows:'
      locator:
        published_page: 259
        pdf_page_index: 6
        section: Experimental
    - method_class: quoted_attributed
      attribution: Banon et al. (1981), reference [9]
      quote: Therefore, the obtained values characterize the evaporation of perovskite not in reducing conditions (from molybdenum
        cell), but, in contrary, in chemically neutral conditions (in the absence of interaction of perovskite with the cell
        material).
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: 'By comparing the experimental data obtained in [6, 10–13] and in this study, and the calculated results, one
        can see the effect of reducing properties of cell materials on gas phase speciation: tantalum [12], molybdenum [11,
        13], tungsten [6] and alundum [10]. As we noted earlier [26], the greatest effect of cell materials on the vapor speciation
        is observed with the oxygen “deficient” species such as atomic calcium (Fig. 2a), titanium monoxide (Fig. 2b) and
        atomic oxygen itself (Fig. 2d).'
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: In the case of gaseous titanium dioxide (Fig. 2c), there are no differences in the values determined in evaporation
        experiments using molybdenum [13] and tungsten [6] cells.
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_attributed
      attribution: Zhang et al. (2014), reference [4]
      quote: The total vapor pressure over the perovskite melt at 2278 K obtained by Zhang et al. [4] is consistent with the
        extrapolated values of partial pressures of the predominant vapor species of the gas phase—atomic calcium and titanium
        dioxide (Fig. 2a, c)—found in the present study.
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: It is interesting to note slight changes in the slope of lg p_TiO2 versus the inverse temperature in Fig. 2c
        at the melting points of titanium oxide (2185 ± 10 K) and perovskite (2244 ± 10 K), obtained in the present study
        and [4]. It suggests insignificant differences in the values of the enthalpy of melting of TiO2 and perovskite.
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: Similar slopes of lg p_Ca and lg p_O versus the inverse temperature for calcium oxide and perovskite in Fig.
        2a and 2d (lines 1, 5 and 9, respectively) indicate a predominant effect of calcium component on evaporation of calcium
        from perovskite. This also can explain the difference in the slope of lg p_TiO in Fig. 2b in the case of perovskite
        (line 1) and rutile (line 10) according to the equilibriums (2) and (8).
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_attributed
      attribution: Lopatin and Semenov (2001), reference [18] (prior pressure calculations using equation (14) under discussion)
      quote: Figure 3 shows that the slope of the temperature dependences of the equilibrium constant of reaction (15) obtained
        in the present study is the same as determined by Lopatin and Semenov [18]. Some discrepancy between the absolute
        values of K_15(T), which are within the calculation errors, is probably due to systematic deviations in calculations
        of partial pressures via relationship (14) used by the authors [18]. The possible cause of these deviations is approximate
        of estimation of the effective CaTiO3+ ionization cross section calculated on the additivity rule, and the uncertainty
        in the detecting efficiency of CaTiO3+ by the electron multiplier. The isotopic fractionation of perovskite [4] also
        accompanies the evaporation process and it will impact, although insignificantly, on the isotope distribution value
        used in relation (14).
      locator:
        published_page: 261
        pdf_page_index: 8
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: The enthalpy and entropy of reactions involving (CaTiO3) gaseous complex oxide calculated by the relationship
        (29) are given in Table 2. They are in agreement with those found by Lopatin and Semenov [18] and our earlier estimates
        [26].
      locator:
        published_page: 262
        pdf_page_index: 9
        section: Results and Discussion
    - method_class: quoted_unattributed
      quote: Vapor species typical for simple oxides were identified in the gas phase over perovskite along with small amount
        of CaTiO3 complex gaseous oxide. For the first time, the partial pressures of vapor species in the gas phase over
        perovskite were determined. The comparison of these values with the available experimental literature data and those
        of simple oxides shows the predominant effect of the calcium component of perovskite on its evaporation behavior.
      locator:
        published_page: 262
        pdf_page_index: 9
        section: Conclusion
