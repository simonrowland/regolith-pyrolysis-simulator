- observation_id: shornikov_2019_hk_pressure_method
  type: method
  locator:
    published_page: 259
    pdf_page_index: 6
    section: Experimental
    equation: 21–22
  units: as printed
  experiment: shornikov_2019_mo_cell_kems
  values:
    quantity: partial_pressure_reduction_method
    method_class: measured_tabulated
    relation: p_i = K_alpha * q_i / (s_or * C_or * t) * sqrt(2*pi*R*T/M_i), equation (21); K_alpha is defined by equation
      (22).
    input_definition: q_i is the amount of component i evaporated through the effusion hole during time t at temperature T;
      M_i is molecular weight; s_or is effusion-hole area; C_or and C_c are Clausing coefficients; S_v is vaporizing surface
      area; alpha_i is the evaporation coefficient.
    coefficient_source: Partial evaporation coefficients from reference [25].
    note: The paper does not provide the numeric q_i series or the orifice dimensions in this chapter.
  context_id: shornikov-2019-perovskite-evaporation::context::shornikov_2019_hk_pressure_method
