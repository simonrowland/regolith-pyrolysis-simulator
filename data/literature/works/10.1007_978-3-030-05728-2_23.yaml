    statements:
    - attribution: Balducci et al. (1985), reference [8]
      method_class: quoted_attributed
      temperature_range_K:
      - 2210
      - 2393
      quote: 'Balducci et al. [8] using Knudsen effusion mass spectrometry found (Ti2O3) and (Ti2O4) vapor species in the
        gas phase over CoTiO3 at 2210–2393 K. They can participate in the following equilibria:'
      locator:
        published_page: 254
        pdf_page_index: 1
        section: Introduction
    - attribution: Banon et al. (1981), reference [9]
      method_class: quoted_attributed
      sample_count: 24
      temperature_range_K:
      - 1900
      - 2200
      ionization_energy_eV: 13
      quote: Using the differential mass spectrometry, Banon et al. [9] investigated the evaporation of 24 samples of CaTiO3–Ti2O3–TiO2
        system from Knudsen molybdenum effusion cell at 1900–2200 K. Mass spectra were recorded at low ionizing voltage of
        13 eV in order to avoid the possible fragmentation of TiO2+ molecular ion to Ti+ and TiO+ ions, which are also molecular.
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - attribution: Banon et al. (1981), reference [9]
      method_class: quoted_attributed
      temperature_K: 2150
      quote: The partial pressure values of (Ca), (TiO), (TiO2) and (O) over perovskite at 2150 K was calculated using thermochemical
        data [7].
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - attribution: Zhang et al. (2014), reference [4]
      method_class: quoted_attributed
      temperature_K: 2278
      quote: Zhang et al. [4] studied the isotopic fractionation during evaporation of perovskite melt suspended on iridium
        wire in a vacuum furnace at 2278 K (according to Langmuir).
      locator:
        published_page: 256
        pdf_page_index: 3
        section: Introduction
    - method_class: quoted_unattributed
      quote: For the first time, the partial pressure of vapor species in the gas phase over perovskite are compared with
        those corresponding to simple oxides, showing the predominant effect of the calcium component of perovskite on evaporation
        character.
      locator:
        published_page: 253
        pdf_page_index: 0
        section: Abstract
    - attribution: Lopatin and Semenov (2001), reference [18]
      method_class: quoted_attributed
      temperature_range_K:
      - 2100
      - 2500
      appearance_energy_CaTiO3_plus_eV: 9
      appearance_energy_uncertainty_eV: 1
      quote: 'Lopatin and Semenov [18] studied the evaporation of a mixture of calcium carbonate and titanium dioxide from
        tungsten cells by Knudsen effusion mass spectrometric method at 2100–2500 K. The following ions were found in the
        mass spectra of vapor over the mixture: Ca+, CaO+, Ti+, TiO+, TiO2+ and CaTiO3+. The appearance energies of the ions
        in the mass spectra of vapor over the mixture allowed to establish the molecular nature of the origin of Ca+, CaO+,
        TiO+, TiO2+ and CaTiO3+ ions. Ti+ ion also contained a fragmentary component from TiO2+ ion. According to the authors,
        Ti+ ion was completely fragmentary. The appearance energy of CaTiO3+ molecular ion was determined to be 9 ± 1 eV (the
        appearance energy of a gold ion in the mass spectrum of vapor was used as a standard).'
      locator:
        published_page: 255
        pdf_page_index: 2
        section: Introduction
    - attribution: Samoilova and Kazenas (1995), reference [10], and Semenov (1969), reference [20]
      method_class: quoted_attributed
      temperature_note: same temperature range as cited study
      quote: It corresponded to that observed by Samoilova and Kazenas [10] in the same temperature range at evaporation of
        CaO from alundum cell and by Semenov [20] at evaporation of TiO2 from a tungsten cell.
      locator:
        published_page: 258
        pdf_page_index: 5
        section: Experimental
