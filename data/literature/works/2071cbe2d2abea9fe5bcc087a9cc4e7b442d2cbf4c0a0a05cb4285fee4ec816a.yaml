- observation_id: shornikov_2002_summary_claims
  type: qualitative_claim
  locator:
    published_page: 1058
    pdf_page_index: 4
    section: Conclusions
    note: Begins at the bottom of p. 1058 and continues on p. 1059 / PDF index 5.
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: To summarize, we for the first time determined the partial and integral thermodynamic properties of Al2O3–SiO2
      melts by Knudsen effusion mass spectrometry. The obtained thermodynamic data on melts in the aluminosilicate system
      are evidence of negative deviations from ideality. The partial thermodynamic properties coincide with the extrema of
      the integral thermodynamic properties of aluminosilicate melts at concentrations close to the stoichiometric mullite
      composition. The reliability of the obtained data is substantiated by applying an additional independent approach based
      on the Belton–Fruehan method and by Duhem–Margules equation calculations.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_summary_claims
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
- observation_id: shornikov_2002_t2_comparisons
  type: qualitative_claim
  locator:
    published_page: 1058
    pdf_page_index: 4
    section: Results and discussion
    table: '2'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: Table 2 shows that the experimental aluminosilicate melt component activities extrapolated to the eutectic compositions
      are close to those calculated from the eutectic data on the SiO2–Al6Si2O13 and Al6Si2O13–Al2O3 systems and to the values
      characterizing the solid phases of the system [1, 48]. The results of calculations based on the data from [12] somewhat
      differ from those obtained in this work, but the discrepancies do not exceed 15% (Table 2) and appear to be acceptable
      considering the approximations involved in the methods for determining the required values and the procedures for extrapolation
      to the region of lower temperatures.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_t2_comparisons
