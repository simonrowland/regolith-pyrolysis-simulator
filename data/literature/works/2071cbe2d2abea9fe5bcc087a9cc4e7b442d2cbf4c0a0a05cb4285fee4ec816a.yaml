- observation_id: shornikov_2002_mullite_fusion_entropy_comparisons
  type: qualitative_claim
  locator:
    published_page: 1056
    pdf_page_index: 2
    section: Results and discussion
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: The earlier data on the enthalpy and entropy of mullite formation in the solid state [1] can be used to determine
      the enthalpy of fusion of Al6Si2O13, which equals 74.8 ± 4.6 kJ/mol (per mol of the compound). The entropy of fusion
      [∆fusS = 34.3 ± 2.1 J/(mol K)] is substantially larger than the value found by the Walden rule [19], which holds for
      a fairly large number of compounds. The Walden rule is, however, obviously inapplicable to quite a number of substances
      such as magnesium aluminate (∆fusS(MgAl2O4) = 32.4 ± 5.0 J/(mol K) [20]), and substances melting at lower temperatures,
      for instance, zinc pyrophosphate (∆fusS(Zn2P2O7) = 26.3 ± 2.0 J/(mol K) [21]). Note that the entropy of fusion of mullite
      (per g-at. of the compound) equals 8.17 ± 0.50 J/(g-at. K) and approximately obeys the well-known empirical rule ∆fusH(i)/Tfus(i)
      ≈ 8.8 [J/(g-at. K)].
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_mullite_fusion_entropy_comparisons
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
- observation_id: shornikov_2002_mullite_fusion_literature_comparison
  type: qualitative_claim
  locator:
    published_page: 1056
    pdf_page_index: 2
    section: Results and discussion
    table: '1'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: As follows from Table 1, the values recommended in [4, 11] are closest to the experimental enthalpy of fusion of
      mullite, which was determined for the first time in this work. The values cited in the other works [10] and handbooks
      [5, 9] are much lower. Risbud and Pask [6] obtained a ∆fusH(Al6Si2O13) value almost two times larger based on the data
      on the phase diagram of the Al2O3–SiO2 system [7] with incongruent mullite fusion (recall that the results obtained
      in [7] were considered by us in detail in [2] and criticized for several inconsistencies). The authors of [6] obtained
      the critical temperature dependence of metastable liquation on ∆fusH(Al6Si2O13) based on fairly rough approximations.
      This dependence was used in [8] to determine the enthalpy of fusion of mullite. Their estimate was still larger than
      that suggested in [6] (Table 1).
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_mullite_fusion_literature_comparison
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
- observation_id: shornikov_2002_schroder_estimates_caveat
  type: qualitative_claim
  locator:
    published_page: 1056
    pdf_page_index: 2
    section: Results and discussion
    equation: '13'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: The coincidence of the experimental ∆fusH(Al6Si2O13) value with the estimates based on the use of weighted mean
      entropies of fusion of the initial substances [1, 25] and calculated by the Schröder equation from the positions of
      the eutectic points (xe, Te) in the Al2O3–SiO2 system determined in [2] should be considered fortuitous to a great extent
      because of the rough approximations used in the calculations (Table 1).
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_schroder_estimates_caveat
