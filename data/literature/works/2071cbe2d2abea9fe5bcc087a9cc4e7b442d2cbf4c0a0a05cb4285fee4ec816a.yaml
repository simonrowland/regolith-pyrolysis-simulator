context:
- observation_id: shornikov_2002_conclusion_comparisons
  type: qualitative_claim
  locator:
    published_page: 1059
    pdf_page_index: 5
    section: Conclusions
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: This value is in satisfactory agreement with the results of approximate calculations and the earlier estimates
      [4, 11]. A consideration of the range of applicability of the variant of the solubility equation for ideal solutions
      to aluminate systems containing a simple eutectic composition showed that the accuracy of calculations depended on the
      concentration of aluminum oxide in the systems under consideration and on possible negative deviations from the behavior
      of ideal solutions. The thermodynamic values obtained in this work for solid and liquid phases in the Al2O3–SiO2 system
      were shown to be consistent with the results of calculations based on the data on eutectic compositions by the variant
      of the general solubility equation that ignored corrections for pressure and contributions of the difference of heat
      capacities.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_conclusion_comparisons
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
- observation_id: shornikov_2002_conclusion_fusion_enthalpy_discrepancy
  type: qualitative_claim
  locator:
