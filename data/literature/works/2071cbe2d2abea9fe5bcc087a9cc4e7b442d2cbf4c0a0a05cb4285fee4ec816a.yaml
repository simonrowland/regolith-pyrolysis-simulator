- observation_id: shornikov_2002_study_temperature_range
  type: qualitative_claim
  locator:
    published_page: 1054
    pdf_page_index: 0
    section: Introduction
  units: K
  values:
    quantity: qualitative_claim
    method_class: quoted_unattributed
    quote: Its goal was to obtain reliable information on the partial and integral enthalpies [∆H(i) and ∆fH] and entropies
      [∆S(i) and ∆f S] of formation of melts in the aluminosilicate system in the temperature range 1900–2500 K and establish
      a correspondence between the obtained thermodynamic properties and the phase relations in the system.
    T_low_K: 1900
    T_high_K: 2500
    T_range_as_printed: 1900–2500 K
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_study_temperature_range
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
