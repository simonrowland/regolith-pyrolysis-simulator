- observation_id: shornikov_2002_fig3_liquidus_comparisons
  type: qualitative_claim
  locator:
    published_page: 1057
    pdf_page_index: 3
    section: Results and discussion
    figure: '3'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: The ∆fusH(Al6Si2O13) value given in Table 1 is likely to be the maximum among those obtained by (14) from eutectic
      composition data in the region under consideration [7, 10, 26–32], which are shown in Fig. 3a. Note that the uncertainty
      in the position of this eutectic composition shown by the contour in Fig. 3a is large and amounts to 5 mol % for concentration
      and 65 K for temperature. The uncertainty in the position of the eutectic point in the Al6Si2O13–Al2O3 system amounts
      to 2 mol % for concentration and 70 K for temperature (Fig. 3b). The liquidus line calculated by (14) is identical to
      that reported in [12] (Fig. 3a). Because of its approximate character, (14) cannot, however, be used to satisfactorily
      (in agreement with [12]) construct the liquidus line of the Al6Si2O13–Al2O3 system based on the calculated ∆fusH(Al6Si2O13)
      value given in Table 1 and the ∆fusH(Al2O3) value reported in [33]. If the data from [2] are used, we obtain a correspondence
      between the line of mullite crystallization calculated by (14) and the position of the eutectic point in the mullite–aluminum
      oxide system. Nevertheless, the aluminum oxide crystallization line in the Al6Si2O13–Al2O3 system cannot be calculated.
