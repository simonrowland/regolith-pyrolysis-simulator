    pdf_page_index: 5
    section: Conclusions
  units: kJ/mol compound
  values:
    method_class: quoted_unattributed
    quote: Combining the data obtained in this work with those on the solid phases in the aluminosilicate system allowed us
      to estimate the enthalpy of fusion of mullite Al6Si2O13, which was found to equal 74.8 ± 4.8 kJ/mol.
    H_fus_kJ_per_mol: '74.8'
    H_fus_uncertainty_kJ_per_mol: '4.8'
