- observation_id: shornikov_2002_fig2_integral_partial_relationships
  type: qualitative_claim
  locator:
    published_page: 1056
    pdf_page_index: 2
    section: Results
    figure: '2'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: Note that the partial enthalpies of Al2O3 and SiO2 calculated by (1) and (2) coincide with those determined by
      the Belton–Fruehan method [Eq. (8)] and by Gibbs–Duhem equation (9) within the errors of the methods [16, 17], which
      do not exceed 6 kJ/mol in the concentration range 10–90 mol % Al2O3 (Fig. 2b). Like a(Al6Si2O13), the integral thermodynamic
      properties of aluminosilicate melts (∆fG, ∆fH, and ∆fS) have extrema at concentrations close to the stoichiometric mullite
      composition (Fig. 2). As required, the partial thermodynamic property values [∆µ(i), ∆H(i), and ∆S(i)] coincide with
      the integral function extrema (Fig. 2). The reliability of the integral thermodynamic values found by (10) was substantiated
      in calculations by Duhem–Margules equation (11). The deviations did not exceed 2.5 kJ/mol for ∆fG and ∆fH and 1.5 J/(mol
      K) for ∆fS (Fig. 2).
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_fig2_integral_partial_relationships
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
