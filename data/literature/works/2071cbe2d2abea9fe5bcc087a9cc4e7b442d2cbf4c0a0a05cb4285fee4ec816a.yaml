  units: mathematical relations as printed
  values:
    method_class: quoted_unattributed
    quantity: printed_thermodynamic_relations
    equations_as_printed:
    - (1) μ(i) = H(i) − T S(i).
    - (2) μ(i) = RT ln a(i).
    - (3) ln a(SiO2) = −∫ [2x(Al2O3)/(1+x(Al2O3))] d ln [I(Al)+/I(SiO)+].
    - (4) ln a(Al2O3) = −∫ [x(SiO2)/(1−x(SiO2))] d ln a(SiO2).
    - (5) H(i) = R [d ln a(i)/d(1/T)].
    - (6) H(SiO2) = −R ∫_{x(Al2O3)=0}^{x(Al2O3)} x(Al2O3) d [d ln(a(Al2O3)/a(SiO2))/d(1/T)].
    note: Equation (5) retains the positive R printed in the source. Equations (3) and (4) print no integration limits. H,
      S and μ denote the source's partial thermodynamic formation functions; no new numerical value is derived.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_equations_1_to_6
