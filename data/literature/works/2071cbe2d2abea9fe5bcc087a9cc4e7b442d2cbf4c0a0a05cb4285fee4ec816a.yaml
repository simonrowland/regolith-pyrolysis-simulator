- observation_id: shornikov_2002_fig1_activity_comparisons
  type: qualitative_claim
  locator:
    published_page: 1055
    pdf_page_index: 1
    section: Results
    figure: '1'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: Figure 1a shows that the concentration dependence of the activity of mullite in Al2O3–SiO2 melts has a maximum
      at x(Al2O3) ≈ 60 mol %, which is almost symmetrical with respect to the SiO2–Al6Si2O13 and Al6Si2O13–Al2O3 systems (Fig.
      1b). At similar concentrations close to the stoichiometric mullite composition, the concentration dependences of the
      activities of aluminum oxide and silicon dioxide intersect [a(SiO2) ≈ a(Al2O3)] in aluminosilicate melts (Fig. 1a).
      The corresponding dependences of a(SiO2) and a(Al2O3) intersect with that of a(Al6Si2O13) in the SiO2–Al6Si2O13 and
      Al6Si2O13–Al2O3 systems at x(Al6Si2O13) ≈ 60 mol % (Fig. 1b). Of interest is also the symmetrical character of the deviations
      from ideality of a(SiO2) in the SiO2–Al6Si2O13 system and a(Al2O3) in the Al6Si2O13–Al2O3 system with respect to the
      deviations in mullite, positive for a(SiO2) and negative for a(Al2O3), which are ~2 times larger (Fig. 1b). The symmetrical
      character of the thermodynamic properties in the subsystems under consideration and the degree of deviations from ideality
      most clearly manifest themselves in the concentration dependences of the activity coefficients of the system components
      [γ(i)] shown in Fig. 1c.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_fig1_activity_comparisons
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
