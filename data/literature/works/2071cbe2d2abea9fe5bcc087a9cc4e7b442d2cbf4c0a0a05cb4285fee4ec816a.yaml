- observation_id: shornikov_2002_fig4_model_limits
  type: qualitative_claim
  locator:
    published_page: 1057
    pdf_page_index: 3
    section: Results and discussion
    figure: '4'
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: Figure 4 shows that there is an obvious dependence of ∆fusH(Al2O3) estimated by (14) along the crystallization
      line on the concentration of aluminum oxide [x*(Al2O3)] in the systems under consideration. At x*(Al2O3) > 40 mol %,
      the calculated ∆fusH(Al2O3) values coincided with the recommendations of [47] based on the data reported in [33] within
      50%. At lower x*(Al2O3) concentrations and for the Al6Si2O13–Al2O3 system (see above), (14) is inapplicable, and deviations
      may be several times larger than true values (Fig. 4). It is likely that the observed discrepancies are caused by deviations
      from the behavior of ideal solutions rather than errors in determining the liquidus line, as has been suggested in [23].
      In the Al2O3–SiO2 system, the error in estimating ∆fusH(Al2O3) might be caused by the observed negative deviations from
      ideality, which clearly manifest themselves in the concentration dependence of γ(Al2O3) in Al6Si2O13–Al2O3 melts (Fig.
      1c). Small positive deviations from ideality in SiO2–Al6Si2O13 melts (Fig. 1c) allow the ∆fusH(SiO2) = 12.5 ± 6.0 kJ/mol
      value to be estimated from the crystallization line of silicon dioxide [12] (Fig. 3a), which coincides with the recommendations
      of [47] within acceptable deviations.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_fig4_model_limits
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
- observation_id: shornikov_2002_intro_experimental_limitations
  type: qualitative_claim
  locator:
    published_page: 1054
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    method_class: quoted_unattributed
    quote: The absence of thermodynamic data on Al2O3–SiO2 melts [2, 3] and contradictions in estimates of the enthalpy of
      fusion of mullite Al6Si2O13 (Table 1) are explained by a complex of problems involved in correctly designing experiments.
      These problems are caused by the physicochemical properties of the system, which determine the necessity of reaching
      temperatures close to 2300 K and above; the high viscosity of melts, which complicates the synthesis of samples [13,
      14]; substantial differences in system component volatilities, imposing the requirement of a wide dynamic scope of the
      apparatus; the necessity of taking into account chemical equilibrium shifts caused by high-temperature interactions
      between melts and container materials [1, 2, 13]; and small negative deviations from ideality, which manifest themselves
      by small Gibbs energies of formation of solid phases comparable with the errors of experimental methods [1, 15–17].
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_intro_experimental_limitations
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
  source_id: shornikov-2002-alumina-silica-melt-thermodynamics
  species: Al6Si2O13
- observation_id: shornikov_2002_method_and_ion_current_relations
  type: method
  locator:
    published_page: 1054
    pdf_page_index: 0
    section: Results
    equations: 3–8
    note: Equations (7)–(8) and the AlO contribution discussion continue on p. 1055 / PDF index 1.
  units: as printed
  values:
    quantity: activity_and_partial_enthalpy_reduction
    method_class: quoted_unattributed
    note: Silicon dioxide activity is obtained from the Gibbs–Duhem/Belton–Fruehan integral using I(Al)+/I(SiO)+; aluminum
      oxide activity follows from the Gibbs–Duhem equation. The partial enthalpy of SiO2 uses the temperature dependence of
      that ion-current ratio. Equation (7) includes I(AlO)+; the text says its I(AlO)+/I(Al)+ contribution is small and can
      be ignored. No conversion of ion intensities to partial pressures is given here.
  context_id: shornikov-2002-alumina-silica-melt-thermodynamics::context::shornikov_2002_method_and_ion_current_relations
  work_id: 2071cbe2d2abea9fe5bcc087a9cc4e7b442d2cbf4c0a0a05cb4285fee4ec816a
