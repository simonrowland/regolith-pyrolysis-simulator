- observation_id: thomas_wood_2021_thermodynamic_fits
  type: thermodynamic_fit
  locator:
    pdf_page_index: 10
    published_page: 9
    section: Results
    equation: 16-17
  units: T in K; P in GPa; log K dimensionless
  values:
    method_class: model_derived
    derivation: Author regressions to the tabulated experimental constants; equations are printed, not newly fitted here.
    standard_state_note: f(O2) and f(Cl2) use pure-gas standard states at 0.1 MPa and the temperature of interest.
    standard_state_note_locator:
      pdf_page_index: 2
      published_page: 1
      section: Abstract
    fits:
    - composition: CMAS
      equation: log K_PT = 1.206(32) - 940(40) P/T
      standard_error: '0.03'
      locator:
        pdf_page_index: 10
        published_page: 9
        equation: '16'
    - composition: Icelandic Basalt
      equation: log K_PT = 0.984(64) - 930(70) P/T
      standard_error: '0.053'
      locator:
        pdf_page_index: 10
        published_page: 9
        equation: '17'
    - composition: CMAS
      equation: log K = -0.561 P + 1.21
      locator:
        pdf_page_index: 10
        published_page: 9
        figure: '6'
        note: printed fit line
    - composition: Icelandic Basalt
