context:
- observation_id: thomas_wood_2021_analytical_method
  type: method
  locator:
    pdf_page_index: 6
    published_page: 5
    section: 2.3 Analytical procedures
  units: analytical settings and detection limits as printed
  values:
    method_class: method_only
    instruments: CAMECA SX-Five-FE and JEOL-8600 electron microprobes
    settings: 20 nA, 15 kV, 10 μm defocused beam; Cl/Na/Si analysed first; 80 s peak and 40 s background on Cl
    chlorine_detection_limit: 120 ppm
    glass_points: '>40 per glass; 10-20 buffer/metal points; standard deviation <0.2 wt%'
    durango_check: 0.41 wt% standard measured 0.415 ± 0.015 wt% for 98 analyses
  context_id: thomas-wood-2021-chlorine-silicate-melts::context::thomas_wood_2021_analytical_method
  work_id: 10.1016/j.gca.2020.11.018
  source_id: thomas-wood-2021-chlorine-silicate-melts
  species: Cl
- observation_id: thomas_wood_2021_chlorine_buffer_method
  type: method
  locator:
    pdf_page_index: 4
    published_page: 3
    section: 2.1 Experimental procedure
  units: reaction and buffer description as printed
  values:
    method_class: method_only
    description: Ag/AgCl/AgI chlorine buffer; chlorine fugacity is controlled by the AgCl-AgI exchange and quantified after
      quench from molar ratios.
    reaction: AgCl + 1/2 I2 = AgI + 1/2 Cl2
  context_id: thomas-wood-2021-chlorine-silicate-melts::context::thomas_wood_2021_chlorine_buffer_method
  work_id: 10.1016/j.gca.2020.11.018
  source_id: thomas-wood-2021-chlorine-silicate-melts
  species: Cl
- observation_id: thomas_wood_2021_oxygen_buffer_method
  type: method
  locator:
    pdf_page_index: 5
    published_page: 4
    section: 2.2 Oxygen fugacity
  units: buffer descriptions and equations as printed
  values:
    method_class: method_only
    buffers:
    - CCO
    - Re-ReO2
    log_fO2_CCO_equation: log f(O2) = 4.325 - 21803/T + 0.171((P-1)/T), with P in bar and T in K
    sensor_test: At 1350 °C and 1.5 GPa, Pt-Fe bead XFe = 0.31 (11.34 wt% Fe) and silicate FeO = 5.22 wt%; measured fO2 was
      1.79 log units below FMQ versus expected 1.82.
  context_id: thomas-wood-2021-chlorine-silicate-melts::context::thomas_wood_2021_oxygen_buffer_method
  work_id: 10.1016/j.gca.2020.11.018
  source_id: thomas-wood-2021-chlorine-silicate-melts
  species: Cl
