- observation_id: tachibana_1998_forsterite_regime_model
  type: regime_classification
  class: model
  locator:
    page: 1
    section: Evaporation rates
    paragraphs: Free evaporation and hydrogen reaction regimes; H2O/H2 buffer regime
  phase: forsterite_dust
  regime: nebular_evaporation_regime_map
  units: as printed
  values:
    quantity: evaporation_regime
    method_class: model_derived
    generator: authors' Hertz-Knudsen plus thermochemical gas-chemistry model
    regimes:
    - name: free_evaporation_dominated
      condition: ptotal sufficiently smaller than equilibrium vapor pressure peFo
      rate_dependence: jFo is only a function of T
    - name: hydrogen_reaction_dominated
      condition: ptotal much greater than peFo
      rate_dependence: H2(g) acts as reducing agent; jFo increases with pH2 approximately equal to ptotal
    - name: H2O_H2_buffer_dominated
      condition: increasing ptotal where peH2O approximately equals pH2O
      rate_dependence: jFo becomes constant when pH2O is buffered by constant H2O/H2 ratio
  context_id: tachibana-tsuchiyama-1998-forsterite-dust-lpsc::context::tachibana_1998_forsterite_regime_model
