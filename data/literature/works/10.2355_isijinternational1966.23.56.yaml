- experiment_id: 10.2355/isijinternational1966.23.56::experiment::fe-sn-nsn-0p010
  kind: literature
  method:
    tag: value
    value: knudsen_effusion
  sample:
    mass_kg:
      state:
        tag: unknown
        reason: not_published
      locator:
        page: 2
        published_page: 56
        section: II.1 Experimental Apparatus and Specimen
    initial_composition:
      state:
        tag: value
        value:
          basis: Fe-Sn_alloy
          components:
          - - Sn
            - '0.01'
          - - Fe
            - '0.99'
          amount_basis: mole_fraction
      locator:
        published_page: 59
        pdf_page_index: 4
        table: '4'
        note: Table 4 N_Sn as printed (mole fraction); N_Fe = 1 - N_Sn from binary Fe-Sn; not renormalised
      inference:
        relation: calculated_from_printed_recipe_or_aimed_target
        inputs:
        - 'printed recipe/aimed target: Pure Fe and pure Sn weighed to N_Sn=0.010; Table 1 is starting-metal impurity assay,
          not this charge'
        - component values retained exactly in initial_composition; locator above
        parameters: []
        output_unit: mole_fraction
    printed_composition:
      state:
        tag: value
        value: Pure Fe and pure Sn weighed to N_Sn=0.010; Table 1 is starting-metal impurity assay, not this charge
      locator:
        published_page: 59
        pdf_page_index: 4
        table: '4'
        note: Label retained; numeric mole fractions in initial_composition; Table 1 impurity assay not used as charge
    form:
      state:
        tag: value
        value: Alloys melted in situ
      locator:
        page: 2
        published_page: 56
        section: II.1 Experimental Apparatus and Specimen
    pretreatment:
      state:
        tag: value
        value: Fe high-vacuum melted then hydrogen-deoxidized for 3 h at 1500 C; Sn hydrogen-deoxidized for 18 h at 1000 C
      locator:
        page: 2
        published_page: 56
        section: II.1 Experimental Apparatus and Specimen
  conditions:
    temperature_K:
      state:
        tag: value
        value: '1873.15'
      locator:
        published_page: 59
        table: '4'
        note: Table 4 ion ratios reported at 1600 C; unit conversion only
      inference:
        relation: celsius_to_kelvin
        inputs:
        - T_K = T_C + 273.15
        - original_unit=C
        parameters:
        - - original
          - state:
              tag: value
              value: '1600'
            locator:
              published_page: 59
              table: '4'
              note: Table 4 ion ratios reported at 1600 C; unit conversion only
        - - factor
          - state:
              tag: value
              value: '273.15'
            locator:
              published_page: 59
              table: '4'
              note: Table 4 ion ratios reported at 1600 C; unit conversion only
        output_unit: K
