  work_id: 10.2355/isijinternational1966.23.56
  locator:
    page: 2
    published_page: 56
    note: Fe-Sn-Cu measurements; individual alloy charges are not separately specified
  apparatus:
    cell_material_and_liner:
      state:
        tag: value
        value: High-purity alumina Knudsen cell (Nippon Kagaku Togyo SSA-S), inner diameter 9 mm, orifice diameter 0.3 mm
          (0.7 mm tested for N_Sn=0.2). Hitachi RM-6E. W25%Re-W5%Re thermocouple, calibrated at melting points of pure Fe
          and Ni. Temperature fluctuation ±1 C.
      locator:
        published_page: 56
        pdf_page_index: 1
        paragraph: The inner diameter of the high-purity alumina crucible used for a Knudsen-cell (Nippon Kagaku Togyo Co.,
          SSA-S) was 9 mm and the diameter of the orifice was 0.3 mm.
        section: II.1
    geometry:
      orifice_diameter_m:
        state:
          tag: unknown
          reason: not_published
        locator:
          page: 5
          published_page: 60
          note: 0.3 mm usually used, but no per-row assignment for Fe-Sn-Cu table
      orifice_channel_length_m:
        state:
          tag: value
          value:
            kind: point
            point: '0.001'
            approximate: false
        locator:
          page: 5
          published_page: 60
          section: IV.2 Surface Depletion of Sn
  fO2_control:
    channel:
      tag: value
      value: buffer
    buffer:
      state:
        tag: value
        value: 0.5 at% Al added in Knudsen cell
      locator:
        page: 2
        published_page: 56
        section: II.1 Experimental Apparatus and Specimen
  bench_id: 10.2355/isijinternational1966.23.56::bench::rm-6e
  thermal_schedule:
    method:
