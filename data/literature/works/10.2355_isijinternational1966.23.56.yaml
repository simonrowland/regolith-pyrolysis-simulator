        pdf_page_index: 5
        table: '5'
        note: Series label; N_Sn=0.03 held as printed; N_Cu varies per Table 5 row so no single initial_composition map is
          landed here
    form:
      state:
        tag: value
        value: Alloys melted in situ
      locator:
        page: 2
        published_page: 56
        section: II.1 Experimental Apparatus and Specimen
  conditions:
    temperature_K:
      state:
        tag: unknown
        reason: not_published
      locator:
        page: 2
        published_page: 56
        note: Printed 1560-1610 C range applies across the series; no one run setpoint
  pressure_environment:
    total_pressure_Pa:
      state:
        tag: unknown
        reason: no pressure field under keys chamber_pressure / total_pressure_Pa / total_pressure_atm / pressure_Pa / pressure_pa
