    stoichiometry_kept_as_printed: Li6P4O13 is printed as 3Li2O · P4O10. That oxide equivalent is stored as printed. It was
      not corrected.
    cited_mixing_enthalpy_298_K: Wagman et al. (1981) mixing enthalpies of LiPO3, Li4P2O7 and Li3PO4 at 298 K are printed
      as −272 to −255 kJ/mol. Those are cited estimates, not this study.
    mixing_energy_minimum_composition: The minimum mixing energies of the alkali-phosphate melts lie from 22 to 27 mol % P4O10.
      That is a composition range across the comparison, not a Gibbs-energy value for this study.
    prose_figure_slip: The body says "as follows from Fig. 1" for the LiPO3 partial-pressure comparison. The plot with that
      caption is Fig. 2. The phase diagram is Fig. 1. The extract follows the captions.
