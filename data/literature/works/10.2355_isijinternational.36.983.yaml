- observation_id: ohta_1996_method_scope
  type: method
  locator:
    published_page: 983
    pdf_page_index: 1
    section: Synopsis / Introduction
  units: K; mass%
  values:
    quantity: slag_metal_equilibration_method_and_activity_assessment_scope
    method_class: method_only
    experimental_method: Master slag was premelted from reagent CaCO3, MgO, and Al2O3 in a Pt crucible under air. Each experiment
      used 30 g electrolytic iron initially containing about 500 to 1000 mass ppm O and 7 g CaO-Al2O3-MgO slag with an appropriate
      amount of FeS. Fe-1 to 20 mass% Al or Fe-1 to 10 mass% Mn alloy was added by dropping. The slag-metal charge was held
      in an Al2O3 or MgO crucible at 1823 or 1873 K under deoxidized Ar; it was stirred for 2 h in MgO crucibles and 3 h in
      Al2O3 crucibles, with an Al2O3 rod used for 90 s every 30 min. Equilibrium was reached in about 2 h; the melt was unstirred
      for at least 1 h before quenching, then quenched rapidly in a He gas stream and in water. Chemical analysis methods
      for metal and slag phases are described in the cited prior articles.
    temperatures_K:
    - 1823
    - 1873
    a_CaO_assessment_as_printed: activities of CaO in entire liquid region first determined at 1823 and 1873 K from reported
      sulfide capacities coupled with activity coefficients of CaS estimated from those in CaO-Al2O3 slags
    a_Al2O3_MgO_as_printed: on basis of CaO iso-activity lines, activities of Al2O3 and MgO calculated by Schuhmann method
      using spinel-saturation a(Al2O3) and a(MgO) as starting points
    binary_edge_note: for the CaO-Al2O3 binary join this paper is partly derived from prior Cs / γ(CaS) data (refs cited),
      not an independent gas-slag binary activity table; iso-activity figures (Fig. 6) are figure_only here
    standard_states_as_printed: Solute activities in liquid iron use a dilute solution of one mass percent standard state.
      Al2O3, CaO, MgO, and MnO activities use solid standard states. Fe_tO activity coefficient is referred to the liquid
      standard state. γ(Fe_tO) is on the liquid standard state; γ(MnO) is relative to solid MnO.
    how_equilibrium_shown_as_printed: time trials found equilibrium in ~2 h; unstirred >=1 h before quench; metal/slag analyses
      as in prior articles
  context_id: ohta-1996-cao-mgo-al2o3-activities::context::ohta_1996_method_scope
  work_id: 10.2355/isijinternational.36.983
  source_id: ohta-1996-cao-mgo-al2o3-activities
  species: CaO
