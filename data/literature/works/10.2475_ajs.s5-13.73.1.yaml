  values:
    method_class: measured_text
    microscopy: At magnification 600–1200 dots usually form clusters; larger ones can be rods radiating from a common center.
      In a few favorable cases rods counted as six; in others more and complex. Orientation not definitely determined, apparently
      octahedron-corner axes. Skeletons grade through fir-tree forms into well-shaped cube/octahedron cristobalite.
    x_ray_method: R. W. G. Wyckoff powder-method X-ray photographs show faint sharp cristobalite lines for larger dots; finer
