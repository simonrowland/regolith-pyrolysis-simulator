- observation_id: greig1927_binary_materials
  type: method
  locator:
    page: 13
    published_page: 13
    section: Materials used
    note: Mixture preparation continues p. 14
  units: °C; text
  values:
    method_class: method_only
    magnesia: Two carbonate lots; one prepared by H. S. Roberts and E. W. Posnjak by suspending C.P. light calcined MgO in
      cold water, bubbling CO2, filtering, boiling to precipitate carbonate, filtering and carefully washing. Other lot purified
      carbonate of unknown earlier history. Both gave identical quench results. Fired near 1650° to sinter oxide, then desiccated.
    lime: Very pure Baker and Adamson CaCO3 prepared for the laboratory; thoroughly dried and desiccated. Analysis by E. G.
      Zies carried separately.
    strontia: J. T. Baker C.P. Special SrCl2 dissolved and double-precipitated with NH4OH and ammonium carbonate to remove
      alkali. No reaction for Al or Fe; spectroscopy by E. G. Zies found baria certainly below 0.1 per cent. Carbonate dried
      and desiccated.
    mixture_preparation: Laboratory stock quartz weighed with oxide or carbonate and ground in agate mortar; heated in Pt
