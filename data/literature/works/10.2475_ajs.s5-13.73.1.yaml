- observation_id: greig1927_silica_lots_preparation
  type: method
  locator:
    page: 8
    published_page: 8
    section: Materials used
  units: g; mm; hours; °C
  values:
    method_class: method_only
    lot_a: Laboratory stock quartz crushed and purified with HCl; evaporation with HF and H2SO4 followed by ammonium carbonate
      left 0.0056 g residue from a 10-g analytical sample. Sparse inclusions, the larger approximately 0.005 mm and almost
      full of liquid.
    lot_b: Quartz crystal from Hot Springs, Arkansas; no microscopically visible inclusions.
    lot_c: Quartz of unknown origin; no microscopically visible inclusions.
    preparation: Ground quartz from all three lots heated in a gas furnace for 3 hours near 1600°. Lots a and b completely
      converted to cristobalite with numerous voids (b almost opaque). Lot c less than half cristobalite with remaining quartz;
      its cristobalite homogeneous and void-free. Lot c subsequently converted first to silica glass, then crystallized to
      homogeneous cristobalite.
  context_id: greig-1927-ajs-immiscibility-silicate-melts-part1::context::greig1927_silica_lots_preparation
