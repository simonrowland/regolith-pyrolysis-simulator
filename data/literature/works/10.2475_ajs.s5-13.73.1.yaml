- observation_id: greig1927_wire_and_refractory_preparation
  type: method
  locator:
    page: 4
    published_page: 4
    note: Continues p. 5 and Fig. 1 caption
  units: text
  values:
    method_class: method_only
    wire: Pt-Rh purified and drawn by Heraeus; Pt purified by E. Wichers of the United States Bureau of Standards. Commercial
      Pt iridium contaminates the thermoelement and reduces its e.m.f.; all Pt introduced into the furnace was to be as pure
      as possible.
    refractory: Norton dense alundum tube with very little bond shrank only slightly; pre-firing above operating temperature
      was desirable but could not be done. Purest grain alundum central packing shrinks much less than magnesia and avoids
      repacking between windings.
  context_id: greig-1927-ajs-immiscibility-silicate-melts-part1::context::greig1927_wire_and_refractory_preparation
