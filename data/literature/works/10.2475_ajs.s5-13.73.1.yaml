- observation_id: greig1927_leakage_and_calibration_procedure
  type: method
  locator:
    page: 6
    published_page: 6
    note: Charge-length and furnace exploration continuation p. 7
  units: μV; text
  values:
    method_class: method_only
    leakage_statement: Leakage very rarely as much as 15 μV and always steady; carefully shielded measuring system. Reversing
      heating current reversed leakage sign without changing furnace temperature. DC readings corrected for leakage; much
      work used the sufficiently constant nighttime AC supply, which avoided leakage trouble.
    calibration: Working element 4 compared frequently with standards 5 and 7 at constant temperature to obtain its correction;
      standards inserted only for comparisons and remained practically constant. After standard calibration the MgO, CaO and
      SrO two-liquid temperatures were determined and later used as fixed points.
    furnace_check: Furnace frequently repacked and explored to check hottest-point position; central charges never over ½
      cm long had negligible temperature gradient.
