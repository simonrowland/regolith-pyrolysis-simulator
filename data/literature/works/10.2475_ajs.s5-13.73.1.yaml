- observation_id: greig1927_baria_material_purity
  type: method
  locator:
    page: 25
    published_page: 25
    section: Material used
  units: mass percent; text
  values:
    method_class: method_only
    preparation: J. T. Baker C.P. BaCl2 dissolved in water and precipitated with concentrated HCl to remove other group members;
      chloride washed with concentrated acid and procedure repeated. Double precipitation with ammonia and ammonium carbonate.
      Very pure carbonate mixed with laboratory stock quartz.
    spectroscopic_analysis: E. G. Zies found calcium not detectable, strontium possibly trace but certainly less than 0.05
      per cent, lead absent.
  context_id: greig-1927-ajs-immiscibility-silicate-melts-part1::context::greig1927_baria_material_purity
  work_id: 10.2475/ajs.s5-13.73.1
  source_id: greig-1927-ajs-immiscibility-silicate-melts-part1
  species: SiO2
- observation_id: greig1927_baria_quench_treatments
  type: method
  locator:
    page: 44
    published_page: 44
    note: Final paragraph
  units: text
  values:
    method_class: method_only
    procedure: Crystal-free baria-silica liquids easily quench clear even in large charges. Holding just below liquidus produces
      large cristobalite crystals; rapid cooling into a blast of air yields clear glass but higher-index glass film around
      crystals. Dropping charge under mercury usually removes that film.
    atmosphere_note: Blast of air is a cooling treatment; it does not specify furnace operating atmosphere.
  context_id: greig-1927-ajs-immiscibility-silicate-melts-part1::context::greig1927_baria_quench_treatments
  work_id: 10.2475/ajs.s5-13.73.1
  source_id: greig-1927-ajs-immiscibility-silicate-melts-part1
  species: SiO2
