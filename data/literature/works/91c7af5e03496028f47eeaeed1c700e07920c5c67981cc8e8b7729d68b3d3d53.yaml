- observation_id: baldwin_2001_table2_baseline_sodium_treatment_approaches
  type: reaction_table
  locator:
    page: 3
    pdf_page_index: 2
    table: II
  units: reaction equations as printed
  values:
    quantity: baseline or developmental sodium-treatment reactions
    method_class: quoted_attributed
    admission_status: typed_unavailable
    attribution: Refs. 3 and 5-8, as cited in the surrounding discussion
    reason: qualitative process reactions are not scored thermodynamic measurements
    rows_as_printed: 'Method | Description

      Reaction with steam, water vapor, or water | Na + H2O -> NaOH + 1/2 H2

      Reaction with alcohol-based organic | Na + R-OH -> NaO-R + 1/2 H2

      Reaction with molten NaOH, followed by steam purge | 2Na + NaOH -> Na2O + NaH; NaH + Na2O + 2H2O -> 3NaOH + H2

      Combustion or calcining in air | 4Na + O2 -> 2Na2O

      Reaction with CO2 gas, with optional added water vapor | 2Na + CO2 + H2O -> Na2CO3 + H2'
  context_id: baldwin-2001-metal-oxide-mitigation-sodium::context::baldwin_2001_table2_baseline_sodium_treatment_approaches
