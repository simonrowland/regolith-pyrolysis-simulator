- observation_id: baldwin_2001_table3_candidate_feed_material_test_results
  type: candidate_feed_material_test_results
  locator:
    page: 9
    pdf_page_index: 8
    table: III
  units: temperatures in °C
  values:
    quantity: measured candidate metal-oxide test results
    method_class: measured_direct
    admission_status: typed_unavailable
    reason: reaction temperatures have no matching store quantity token
    rows_as_printed: 'Oxide | Start Temp (C) | Max Temp (C) | Products Identified (XRD) | Comments

      Fe2O3 | 420 to 540 | >1000 | Fe + Na4FeO3 | Very exothermic; with spitting, too reactive.

      SnO2 | 300 to 400 | >700 | Sn + Na2SnO3 + Na4SnO3 | Too vigorous, with spitting; wets and reacts on contact.

      Fe3O4 | 350 to 370 | 700-800 | Fe + NaFe2O3 + Na4FeO3 + Na2O | Controlled reaction; wets then later reacts.

      ZnO | NA | 350 | NaZn13 + Na6ZnO4 | Incomplete reaction; wetting and initiation occur at 200 C; major product is NaZn13.

      Cr2O3 | 450 to 500 | >700 | Cr + NaCr2O3 + Na2CrO2 | Difficult to initiate; reaction too exothermic.

      MnO | NA | 320 | None | No reaction, wetting only.

      SiO2 | 500 | 700-800 | Si + Na2SiO3 | Controlled reaction, not too vigorous.'
    additional_test_result_as_printed: 30 to 80% of sodium in ZnO experiments was unreacted
  context_id: baldwin-2001-metal-oxide-mitigation-sodium::context::baldwin_2001_table3_candidate_feed_material_test_results
  work_id: 91c7af5e03496028f47eeaeed1c700e07920c5c67981cc8e8b7729d68b3d3d53
