- observation_id: jacobson_1989_mgo_activity_upper_limit
  type: activity_standard_state_context
  units: Not applicable to located qualitative context.
  locator:
    published_page: 9
    pdf_page_index: 10
    section: MgO-ZrO2 System
  values:
    method_class: author_estimate
    quote: We were unable to find data on how activity of MgO changes in solution. In order to estimate an upper limit, we
      shall use the value of a(MgO) along the MgO-rich cubic phase boundary. Since this is in equilibrium with essentially
      pure MgO, the activity of MgO is essentially unity. Based on this, the vapor pressure for MgO is shown in Figure 5.
    a_MgO_assumed: 1
    standard_state: pure MgO
    note: Jacobson's assumption for an upper-limit estimate at the MgO-rich cubic phase boundary; not a measured activity.
    vaporization_products: Vaporization studies of MgO indicate that the primary decomposition products are Mg(g) and O(g),
      with only a very small amount of MgO(g).17
    preferential_vaporization: One of the major obstacles to the use of this material is the high vapor pressure of MgO--it
      will preferentially vaporize.13,16
  context_id: jacobson-1989-metal-oxide-zirconia::context::jacobson_1989_mgo_activity_upper_limit
  work_id: 6f685aafd441f7e638a0673c7fcaa298df4422ac3f3f9bfc215509a9f2ce8941
  source_id: jacobson-1989-metal-oxide-zirconia
  species: ZrO2
