- observation_id: jacobson_1989_belov_mo_ion_activity_route
  type: activity_standard_state_context
  units: Not applicable to located qualitative context.
  locator:
    published_page: 17
    pdf_page_index: 18
    section: Rare Earth Oxide-Zirconia Systems
    note: Belov's MO+ ion reduction route, printed pp.17-18 (PDF pages 19-20).
  values:
    method_class: quoted_attributed
    attribution: Belov [32] (Russ. J. Phys. Chem. 59, 1985), as described by Jacobson on printed pp.17-18.
    attributed_statement: Belov32 points out that use of the other ions is more complex because they are dissociation products.
      He proposes a calculation method based on the intensity of the MO+ ion from M2O3, as a function of composition.
    defining_ion: MO+ ion intensity from M2O3, as a function of composition
    vaporization_routes:
      quote: The two primary vaporization routes for ZrO2 and M2O3 are given by equations (3) and (13).
      equation_3: ZrO2(s) = ZrO(g) + O(g)
      equation_13: M2O3(s) = 2 MO(g) + O(g)
    relations:
    - equation_number: '17'
      relation_as_printed: a(ZrO2) = P(ZrO) P(O-tot) / P°(ZrO) P°(O-tot)
      locator:
        published_page: 17
        pdf_page_index: 18
        section: Rare Earth Oxide-Zirconia Systems
    - equation_number: '18'
      relation_as_printed: a(M2O3) = P(MO)^2 P(O-tot) / P°(MO)^2 P°(O-tot)
      MO_pressure_exponent: 2
      locator:
        published_page: 17
        pdf_page_index: 18
        section: Rare Earth Oxide-Zirconia Systems
        note: P(MO) and P°(MO) are squared as printed.
    total_oxygen_definition: Note that P(O-tot) is the amount of O from both ZrO2 decomposition, P(O-ZrO2), and M2O3 decomposition,
      P(O-M2O3).
    initialization:
      quote: The actual calculation is iterative. The first step involves setting P(ZrO) = O and taking P(O-tot) = P(O-M2O3).
      locator:
        published_page: 17
        pdf_page_index: 18
        section: Rare Earth Oxide-Zirconia Systems
        note: Sentence runs onto printed p.18 (PDF page 20). The value printed after 'P(ZrO) =' has the round shape of the
          letter O in this typewriter face (compare the narrower zero in '2580' on p.20); as an initial ZrO pressure before
          any ZrO2 contribution it reads as zero.
      first_iteration_P_ZrO: 0
      first_iteration_P_O_tot: P(O-M2O3)
    iteration:
      quote: This is in equation (18) to calculate the value of a(M2O3). Then the Gibbs-Duhem equation is used to calculate
        a(ZrO2). This value is put into equation (17) to calculate P(ZrO) and P(O-ZrO2). The new P(O-tot) becomes P(O-M2O3)
        + P(O-ZrO2) and the second iteration begins. This continues until the iterations converge.
      update_relation: P(O-tot) = P(O-M2O3) + P(O-ZrO2)
      locator:
        published_page: 18
        pdf_page_index: 19
        section: Rare Earth Oxide-Zirconia Systems
    inputs: MO+ ion intensity (giving P(MO)) versus composition; total oxygen pressure P(O-tot); pure-component pressures
      P°(ZrO), P°(MO), P°(O-tot); Gibbs-Duhem integration for a(ZrO2).
    standard_state: P° are pure-component values (pure ZrO2 and pure M2O3), per the general definition on p.17; no polymorph
      is stated.
    evaluation: This is an important and useful technique for obtaining activities in these complex oxide systems. (Jacobson,
      printed p.18)
    application_y2o3: Figure 17 is an activity-composition diagram determined by mass spectrometry30 for this system. This
      data was obtained by the two calculation methods described in the preceeding discussion. (printed pp.18-19)
  context_id: jacobson-1989-metal-oxide-zirconia::context::jacobson_1989_belov_mo_ion_activity_route
  work_id: 6f685aafd441f7e638a0673c7fcaa298df4422ac3f3f9bfc215509a9f2ce8941
  source_id: jacobson-1989-metal-oxide-zirconia
  species: ZrO2
- observation_id: jacobson_1989_calculated_vapor_pressure_statements
  type: numeric_and_directional_context
  units: As printed per statement (atm, K, orders of magnitude).
  locator:
    published_page: 5
    pdf_page_index: 6
    note: Jacobson's own SOLGASMIX free-energy-minimization results and calculation conditions; per-statement locators. Model
      results, not cited experiments.
  values:
    method_class: model_derived
    attribution: Jacobson SOLGASMIX/SOLGASMIX-PV calculations using the appendix data.
    statements:
    - id: N01
      quote: These four equations can be solved simultaneously or a free energy minimization program such as SOLGASMIX9 can
        be used. It should be noted that in order to obtain equilibrium vapor pressures from SOLGASMIX, one atomosphere of
        argon was put in as a reactant.
      locator:
        published_page: 5
        pdf_page_index: 6
        section: ZrO2 vapor-pressure calculations
        note: '''atomosphere'' as printed.'
      argon_reactant_atm: 1
    - id: Fig2-oxygen
      quote: Figure 2 shows the dramatic effect of one atmosphere of oxygen on suppressing the amount of ZrO(g) and Zr(g).
        However for reaction (2) where no oxygen is released, the oxygen atmosphere has no effect.
      locator:
        published_page: 5
        pdf_page_index: 6
        section: ZrO2 vapor-pressure calculations
      oxygen_atm: 1
    - id: second-oxide
      quote: In many cases, the second oxide may have a much higher vapor pressure than ZrO2. This vapor pressure can be calculated
        using the SOLGASMIX program, with the mass balance now including both metal atoms.
      locator:
        published_page: 6
        pdf_page_index: 7
    - id: binary-vapor-limitation
      quote: It has been pointed out that in some situations the vaporization of binary oxides is complicated by the presence
        of binary oxides in the vapor, such as LiBO2(v) over Li2O·B2O3.10 In a case like this, the binary oxide cannot be
        treated as a pseudo-binary system. ... There is no evidence of this occuring in the various zirconia-metal oxide systems
        discussed here, but one must be aware of this possibility.
      locator:
        published_page: 6
        pdf_page_index: 7
      attribution: LiBO2 example from reference 10
    - id: demixing
      quote: In many applications, such as coatings, the oxide may be under an oxygen potential gradient. Under these conditions,
        the faster moving metal ion is likely to move to the region of lower oxygen potential. This composition change in
        the ceramic may lead to a degradation in high temperature properties.
      locator:
        published_page: 7
        pdf_page_index: 8
      attribution: references 11, 12
    - id: CaO-vapor
      quote: For CaO, as with MgO, the primary vapor products are the metal atom and oxygen.
      locator:
        published_page: 11
        pdf_page_index: 12
        section: CaO-ZrO2 System
    - id: N14
      quote: These figures indicate the compound lowers the vapor pressure of Ca by about two orders of magnitude. This is
        consistant with the solid solution data in Figure 7, for the solid solution in equilibrium with the compound.
      locator:
        published_page: 11
        pdf_page_index: 12
        section: CaO-ZrO2 System
        note: 'Figures 8 (CaO) and 9 (CaZrO3). Direction as printed: lowers.'
      orders_of_magnitude_Ca_pressure_lowering: 2
    - id: N15
      quote: As with the other systems discussed, the alkaline earth oxide vaporizes preferentially to the metal atom and
        atomic and molecular oxygen, with the metal oxide vapor roughly an order of magnitude lower.
      locator:
        published_page: 12
        pdf_page_index: 13
        section: SrO-ZrO2
        note: Figures 11 (SrO) and 12 (SrZrO3).
      orders_of_magnitude_SrO_below_metal_and_oxygen: 1
    - id: BaO-dominance
      quote: Note that the major vapor specie is BaO(g), not the metal atoms and oxygen as in the other systems discussed.
        This is important, since an oxygen overpressure will not suppress vaporization in this case.
      locator:
        published_page: 13
        pdf_page_index: 14
        section: BaO-ZrO2
        note: Figures 13 (BaO) and 14 (BaZrO3).
    - id: alkaline-summary
      quote: In general the alkaline-stabilized zirconia cubic solutions compounds have some severe limitations for applications
        above 1900 K. The major problem is likely to be preferential volatilization of the alkaline earth oxides. Other difficulties
        include phase changes and possible oxide demixing. The materials with the least limitations are SrZrO3 and CaZrO3.
      locator:
        published_page: 15
        pdf_page_index: 16
    - id: N21
      quote: Figure 19 shows the calculated vapor pressures above Y2O3·2(ZrO2). Note that the vapor pressures of YO(g) and
        Y(g) are lowered by less then an order of magnitude, which is consistant with Figure 17.
      locator:
        published_page: 19
        pdf_page_index: 20
        section: Y2O3-ZrO2
      orders_of_magnitude_YO_Y_lowering_upper_bound: 1
      note: '''less then an order of magnitude'' as printed.'
    - id: Y2O3-interactions
      quote: Note the negative deviations from Raoult's Law, indicating attractive interactions. However interactions are
        stronger in the CaO-ZrO2 system (Figure 7), in which compound formation is eventually observed.
      locator:
        published_page: 19
        pdf_page_index: 20
        section: Y2O3-ZrO2
    - id: La2O3-lowering
      quote: La2O3 has one of the higher vapor pressures of the rare earth oxides (Table I), which would be a limitation of
        applications of this system. Consistent with the other systems, relatively little vapor pressure lowering is expected
        in the solid solution (Figure 25).
      locator:
        published_page: 21
        pdf_page_index: 22
        section: La2O3-ZrO2
    - id: N25
      quote: Note that in Figure 28, the vapor pressure of ZrO and Zr is actually higher than their vapor pressure above pure
        ZrO2. ... There is no suppression of the vaporization/ decomposition processes (i.e. reactions (3) and (4)) and the
        vapor pressures of ZrO and Zr go up. These vapor pressures are not simply related to the activity of ZrO2, which must
        remain one or less in solution.
      locator:
        published_page: 22
        pdf_page_index: 23
        section: CeO2-ZrO2
      a_ZrO2_upper_bound: 1
      note: 'Mechanism as printed: vaporization of Ce2O3 as CeO2(g) and CeO(g) generates very little O(g); some oxygen must
        come from ZrO2. Direction as printed: ZrO and Zr pressures higher than over pure ZrO2.'
    - id: N26
      quote: The heat of formation of the solid solution Sm2O3·2(ZrO2) has been measured42. However, when put into the free
        energy minimization program, it was found that the solid solution decomposed to the constituent oxides at about 1500
        K. This indicates either an inconsistency in the data or the phase diagram.
      locator:
        published_page: 23
        pdf_page_index: 24
        section: Sm2O3-ZrO2 and Gd2O3-ZrO2
      decomposition_temperature_K_approx: 1500
    - id: Gd-minimization
      quote: The same situation for the free energy minimization as in Sm2O3·2(ZrO2) was found, also indicating an inconsistency
        in the data or the phase diagram.
      locator:
        published_page: 23
        pdf_page_index: 24
        section: Sm2O3-ZrO2 and Gd2O3-ZrO2
        note: No separate decomposition temperature is printed for Gd2O3·2(ZrO2).
