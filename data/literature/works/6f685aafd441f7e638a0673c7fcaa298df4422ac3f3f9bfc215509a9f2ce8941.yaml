  type: numeric_and_directional_context
  units: Not applicable to located qualitative context.
  locator:
    published_page: 2
    pdf_page_index: 3
    section: Introduction
    note: Numeric and comparative prose was checked against the page renders; additional locators are stated per fact.
  values:
    method_class: quoted_unattributed
    statements:
    - quote: 3000 F (1900 K)
      locator:
        published_page: 2
        pdf_page_index: 3
        section: Introduction
    - quote: melting point of 2973 K
      locator:
        published_page: 2
        pdf_page_index: 3
        section: Introduction
    - quote: 1443 K; 2643 K; 1223 K
      locator:
        published_page: 2
        pdf_page_index: 3
        section: Introduction
        note: Phase-transition temperatures printed around the monoclinic/tetragonal/cubic schematic.
    - quote: temperatures greater than 1900 K
      locator:
        published_page: 4
        pdf_page_index: 5
        section: Introduction
    - quote: It should be noted that in order to obtain equilibrium vapor pressures from SOLGASMIX, one atomosphere of argon
        was put in as a reactant.
      locator:
        published_page: 5
        pdf_page_index: 6
        section: ZrO2 vapor-pressure calculations
        note: As printed, including the misspelling 'atomosphere'. Argon (1 atm) is a SOLGASMIX calculation reactant, not
          an experimental atmosphere.
      argon_reactant_atm: 1
    - quote: For reactions (3) and (4), where oxygen is released, an overpressure of oxygen will suppress the vaporization
        process. Figure 2 shows the dramatic effect of one atmosphere of oxygen on suppressing the amount of ZrO(g) and Zr(g).
        However for reaction (2) where no oxygen is released, the oxygen atmosphere has no effect.
      locator:
        published_page: 5
        pdf_page_index: 6
        section: ZrO2 vapor-pressure calculations
        note: Separate calculated comparison (Figure 2, ZrO2 + 1 atm O2); distinct from the argon reactant above.
      oxygen_overpressure_atm: 1
    - quote: They studied the volatilization of each of these and the Lu2O3-ZrO2 system in the temperature range 2773-2823
        K. Only the Yb2O3-ZrO2 and Gd2O3-ZrO2 systems decompose, preferentially losing the stabilizing oxide.
      locator:
        published_page: 16
        pdf_page_index: 17
        section: Rare Earth Oxide-Zirconia Systems
      attribution: Belov and Semenov [28] (cited survey)
      systems: ZrO2 with Gd2O3, Dy2O3, Yb2O3, Ho2O3, Er2O3, Y2O3 (liquidus-maximum systems) and Lu2O3
      temperature_range_K:
      - 2773
      - 2823
      outcome: Only Yb2O3-ZrO2 and Gd2O3-ZrO2 decompose, preferentially losing the stabilizing oxide.
    - quote: It should be noted that the vapor pressure in the solid solution is sufficiently high that Belov et. al.38 observe
        after 100 minutes at 2580°K, all the Sc2O3 has vaporized from their sample of 50 m/o Sc2O3 - 50 m/o ZrO2.
      locator:
        published_page: 20
        pdf_page_index: 21
        section: Sc2O3-ZrO2
      attribution: Belov et al. [38] (cited experiment)
      duration_min: 100
      temperature_K: 2580
      sample_composition_mol_percent:
        Sc2O3: 50
        ZrO2: 50
      outcome: all the Sc2O3 has vaporized (complete Sc2O3 loss)
    - quote: At lower temperatures, there is a compound CaO·4(ZrO2). There is also a compound CaO·ZrO2, which is stable to
        its melting point of 2252 K.
      locator:
        published_page: 9
        pdf_page_index: 10
        section: CaO-ZrO2 System
        note: Follows the introduction of the Figure 6 phase diagram (reference 18).
      melting_point_K: 2252
      compound: CaO·ZrO2 (CaZrO3)
    - quote: 17 m/o CaO in ZrO2 over the temperature range 1200-1500 K
      locator:
        published_page: 11
        pdf_page_index: 12
        section: CaO-ZrO2
    - quote: about 7 m/o CaO below 1413 K
      locator:
        published_page: 11
        pdf_page_index: 12
        section: CaO-ZrO2
    - quote: about 17 m/o CaO at 1413 K and above
      locator:
        published_page: 11
        pdf_page_index: 12
        section: CaO-ZrO2
    amendments_proposed:
    - No scored numeric observation type in literature_extract.v1 represents an author's complete multicomponent thermodynamic
      coefficient table without interpreting it as experimental observation; Tables A-I and A-II are therefore located table
      context.
    - The paper's SOLGASMIX-PV vapor-pressure curves and figure-only activity/phase diagrams remain non-numeric context because
      curve digitization is prohibited.
    - Jacobson's discussion reports apparatus facts about three prior BaO/BaZrO3 data sets, but not the orifice, channel,
      ionization, calibration, sample, or full thermal facts; these remain typed absences.
