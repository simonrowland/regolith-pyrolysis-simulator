    section: Rare Earth Oxide-Zirconia Systems
    note: Jacobson's general relations, Equations 15-16 (printed pp.16-17). Belov's attributed MO+ ion route (Eqs. 17-18)
      is carried separately in jacobson_1989_belov_mo_ion_activity_route; the Sc2O3 near-ideal route in jacobson_1989_sc2o3_zro2_activity_route;
