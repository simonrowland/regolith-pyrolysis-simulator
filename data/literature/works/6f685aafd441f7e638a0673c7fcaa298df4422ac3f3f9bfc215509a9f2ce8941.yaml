      AI.'' The rare-earth zirconate S(298) = 47.8 cal/K mol entries (rows 56, 70, 78, 88, 97) are estimates after Barin and
      Knacke, and the zirconate heat capacities were estimated by summing the M2O3 and 2(ZrO2) contributions. Not every value
      is a direct measurement. See jacobson_1989_appendix_data_sources_and_estimates.'
