      of pure component.
    general_component_activity_equation:
      equation_number: '15'
      relation_as_printed: a(i) = P(i)/P°(i)
      quote: 'Typically the activity of a component in solution is given by: ... Here P(i) is the vapor pressure of the component
        in solution and P°(i) is the vapor pressure of the pure component.'
      locator:
        published_page: 16
        pdf_page_index: 17
        section: Rare Earth Oxide-Zirconia Systems
        note: Definition sentence continues on printed p.17.
    rare_earth_zirconia_activity: a(ZrO2) = P(ZrO2)/P°(ZrO2) (Eq. 16). Where the ZrO2+ intensity is hard to determine, Belov's
      attributed MO+ ion route is used; see jacobson_1989_belov_mo_ion_activity_route.
    zirconia_activity_equation:
      equation_number: '16'
      relation_as_printed: a(ZrO2) = P(ZrO2)/P°(ZrO2)
      quote: 'In the case of a rare-earth oxide-zirconia system, the activity of zirconia can be calculated as:'
      locator:
        published_page: 17
        pdf_page_index: 18
        section: Rare Earth Oxide-Zirconia Systems
    congruent_stage_statement:
      quote: The activities of the two oxide components can be determined from the congruent vaporization stage.
      locator:
        published_page: 16
        pdf_page_index: 17
        section: Rare Earth Oxide-Zirconia Systems
    standard_state: Pure component oxide as the reference state; the specific solid polymorph is not specified in this discussion.
    defining_ion_context: However the mass spectrometer intensity of the ZrO2+ ion may not always be easy to determine as
      a function of composition. Therefore it is desirable to use the other ions to determine activities of the components.
      (printed p.17)
