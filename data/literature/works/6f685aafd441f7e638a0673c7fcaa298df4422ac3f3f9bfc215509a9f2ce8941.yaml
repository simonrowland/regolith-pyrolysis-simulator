    note: Methods for the plotted comparative measurements are described in the discussion (quoted apparatus prose; the Figure
      15 curves themselves remain figure_only in jacobson_1989_figure_15_figure_only).
  values:
    method_class: quoted_attributed
    attribution: Odoj and Hilpert [24-26]; Berkowitz-Mattuck [10]; Glenn et al. [27]; apparatus facts as described by Jacobson
      on printed p.14.
    source_quote: The Odoj and Hilpert24-26 data was taken with a Knudsen Cell Mass Spectrometer using a molybdenum cell.
      There was no evidence of reaction with the cell. The data of Berkowitz-Mattuck10 was taken with a Knudsen Cell Mass
      Spectrometer and a rhenium cell. The rhenium cell is expected to be more inert than the molybdenum cell. The data of
      Glenn et. al.27 is an not equilibrium measurement--it was simply the recession rate of an exposed surface.
    calculated_vs_measured_qualification:
      quote: Note the calculated vapor pressures from the thermdynamic data in the appendix is somewhat lower than the measured
        P(BaO). It may be that the measured BaZrO3 compounds are a little BaO rich or there may be some inconsistancies in
        the thermodynamic data.
      locator:
        published_page: 14
        pdf_page_index: 15
        section: BaO-ZrO2
      note: 'Direction as printed: calculated P(BaO) lower than measured. ''A little BaO rich'' is offered as a possible explanation,
        not a measured composition.'
    sample_preparation_and_composition:
      state:
        tag: unknown
        reason: not_published
      locator:
