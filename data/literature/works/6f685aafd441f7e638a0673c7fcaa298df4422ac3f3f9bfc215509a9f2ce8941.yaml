      cell_material:
        state:
          tag: unknown
          reason: not_published
        locator:
          published_page: 14
          pdf_page_index: 15
          section: BaO-ZrO2
          note: Not stated for this cited run.
      equilibrium_status: The source says this was not an equilibrium measurement; it was recession rate of an exposed surface.
      pressure_conversion: Hertz-Knudsen-Langmuir equation.
      pressure_conversion_relation:
        equation_number: '11'
        relation_as_printed: J=P/(2πMRT)^1/2
        symbols: Here J is the flux leaving the surface, P is the vapor pressure, M is the molecular weight of the vapor leaving
          the surface, R is the gas constant, and T is the temperature.
        locator:
