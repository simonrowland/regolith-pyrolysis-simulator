- observation_id: jacobson_1989_sc2o3_zro2_activity_route
  type: activity_standard_state_context
  units: Not applicable to located qualitative context.
  locator:
    published_page: 20
    pdf_page_index: 21
    section: Sc2O3-ZrO2
  values:
    method_class: quoted_attributed
    attribution: Semenov [37] and Belov et al. [38-39], as described by Jacobson on printed p.20.
    quote: 'Semenov37 and Belov et. al.38-39 have investigated the vaporization behavior of pure Sc2O3 and Sc2O3-ZrO2 solid
      solutions. For the solid solutions, they observe the following near ideal behavior:'
    relation:
      equation_number: 15 (reused number)
      relation_as_printed: P(ScO-sol)=P°(ScO)[x(Sc2O3)]
      note: Printed as equation (15) on p.20; distinct from the general Eq.(15) a(i)=P(i)/P°(i) on p.16. This is a pressure
        relation for ScO over the solution, not a(M2O3)=x(M2O3).
    derivation: From this relation and the iterative calculation method described above, they calculate an activity-composition
      diagram is shown in Figure 21. (sic)
    comparison: Figure 22 is a plot of the calculated vapor pressures above pure Sc2O3 and the experimental data of Semenov37,
      which is in good agreement.
    expectation: In the Sc2O3-ZrO2 solution, one would expect limited vapor pressure lowering consistent with Figure 21 and
      similar to the Y2O3·2(ZrO2) case.
    sc2o3_loss_experiment:
      attribution: Belov et al. [38]
      duration_min: 100
      temperature_K: 2580
      sample_composition_mol_percent:
        Sc2O3: 50
        ZrO2: 50
      outcome: all the Sc2O3 has vaporized
      locator:
        published_page: 20
        pdf_page_index: 21
        section: Sc2O3-ZrO2
        note: Same printed sentence as the 100 min / 2580 K statement in jacobson_1989_numeric_and_directional_statements.
