- observation_id: jacobson_1989_appendix_data_sources_and_estimates
  type: thermodynamic_example
  units: Cp in cal/K mol and S(298) in cal/K mol, ΔHf(298) in kcal/mol, as printed in Table A-I headers.
  locator:
    published_page: 47
    pdf_page_index: 48
    section: Appendix. Thermodynamic Data
    note: Appendix text, printed pp.47-48 (PDF pages 49-50).
  values:
    method_class: quoted_unattributed
    cp_equation:
      equation_number: 1 (appendix)
      relation_as_printed: Cp = A + B x 10^-3T + C x 10^5/T^2 + D x 10^-6T^2
      quote: 'The data for the zirconium-oxygen and alkaline earth metal-oxygen systems was taken from the JANAF tables.1
        Heat capacities were fitted to an equation of the form:'
      coefficient_scaling:
        A: 1
        B: '0.001'
        C: '100000'
        D: '0.000001'
      note: Table A-I Cp columns A, B, C, D carry the printed coefficients; B multiplies 10^-3 T, C multiplies 10^5/T^2, D
        multiplies 10^-6 T^2.
    reference_temperature_K: 298
    data_availability: Thermodynamic data for the more common oxides is quite plentiful; for the less common oxides it is
      sparse. Where possible, the best thermodynamic data was used. The most desirable information for each system is the
      ΔHf(298), S(298), heat capacity and heat of any phase changes. This data is listed in Table AI.
    measured_vs_estimated:
      quote: The data for the alkaline earth zirconate systems were taken from other sources and is listed in Table AII. This
        includes both estimated and measured data. Where possible measured data were used in the final calculations, as shown
        in Table AI.
      locator:
        published_page: 47
        pdf_page_index: 48
        section: Appendix. Thermodynamic Data
    electrochemical_vs_calorimetric:
      quote: As mentioned in the text, the CaO-ZrO2 system forms a solid solution. The electrochemical data17,18 is for the
        reaction of the saturated solid solution with CaO to form CaZrO3. For this reason the electrochemical data cannot
        be directly compared to the calorimetric data. However in the case of SrZrO3 and BaZrO3, the two types of measurements
        can be directly compared and show good agreement, as indicated in the Table AII.
      locator:
        published_page: 47
        pdf_page_index: 48
        section: Appendix. Thermodynamic Data
        note: Continues onto printed p.48.
    rare_earth_sources:
      quote: Thermodynamic data for the rare earth-oxygen systems was more difficult to locate. Most of the data for the rare
        earth metals and condensed phase oxides was taken from the tables by Pankratz.9 Most of these oxides vaporize to the
        monoxide. Data for some of the rare earth monoxides of Y and Sc was taken from the tables of Ruzinov.10 Data for the
        volatile oxides of the other rare earth monoxide was available as the free energy of formation from the original sources.14,16
        The heats of formation of the solid oxide solutions of the composition M2O3·2(ZrO2) were taken from the calorimetric
        data of Korneev et. al.11
      locator:
        published_page: 48
        pdf_page_index: 49
        section: Appendix. Thermodynamic Data
    zirconate_entropy_estimate:
      method_class: author_estimate
      quote: Entropies were estimated to be 47.8 cal/mole-°K, after Barin and Knacke13
      S_298_cal_K_mol: '47.8'
      applies_to: M2O3·2(ZrO2) solid solutions; Table A-I rows Y2Zr2O7 (56), La2Zr2O7 (70), Ce2Zr2O7+x (78), Sm2Zr2O7 (88),
        Gd2Zr2O7 (97) carry S(298) = 47.8.
      locator:
        published_page: 48
        pdf_page_index: 49
        section: Appendix. Thermodynamic Data
    zirconate_heat_capacity_estimate:
      method_class: author_estimate
      quote: and heat capacities were estimated by summing the contribution from M2O3 and 2(ZrO2)20.
      locator:
        published_page: 48
        pdf_page_index: 49
        section: Appendix. Thermodynamic Data
    free_energy_form:
      equation_number: 2 (appendix)
      relation_as_printed: G = AG/T + BG + CG*T + DG*T^-2 + EG*T^3 + FG*T*LOG(T)
      quote: 'For each of the systems, the data was combined to obtain free energy of formation from the elements in their
        standard states. The free energy was obtained in the following form:'
      temperature_exponents_as_printed:
      - -1
      - 0
      - 1
      - -2
      - 3
      note: Exponents listed for the AG, BG, CG, DG and EG terms; the FG term is T*LOG(T) as printed.
      locator:
        published_page: 48
        pdf_page_index: 49
        section: Appendix. Thermodynamic Data
    calculation_use: This free energy was then put into the SOLGASMIX-PV computer program to calculate the vapor pressures
      for each system.
