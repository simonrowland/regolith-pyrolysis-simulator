- observation_id: jacobson_1989_cao_zro2_emf_activity
  type: activity_standard_state_context
  units: Not applicable to located qualitative context.
  locator:
    published_page: 10
    pdf_page_index: 11
    section: CaO-ZrO2 System
  values:
    method_class: quoted_attributed
    attribution: References 19 (Pizzini and Morlotti 1972) and 20 (Levitskii et al. 1977), as described by Jacobson on printed
      pp.10-11.
    method: emf_cell
    quote: 'The CaO-ZrO2 system is quite suitable for electrochemical measurements and there is some information on the activity
      of CaO in solid ZrO2 solution.19,20 These measurements use a cell of the form:'
    cell:
      equation_number: '7'
      relation_as_printed: O2,Pt|CaO,CaF2|CaF2|ZrO2-CaO,CaF2|Pt,O2
      note: Separators printed as broken vertical bars.
    cell_reaction:
      equation_number: '8'
      relation_as_printed: CaO(a=1) = CaO(solid solution)
    emf_relation:
      equation_number: '9'
      relation_as_printed: ΔG = -2EF = -RT ln a(CaO-ss)
      symbols: Here ΔG is the Gibbs free energy of formation, E is the measured EMF, F is the Faraday constant, and R is the
        gas constant.
    standard_state: Pure CaO, CaO(a=1), in the CaO,CaF2 reference electrode of Eq.(7).
    temperature_range_K:
    - 1200
    - 1550
    temperature_quote: Measurements are carried out between 1200 and 1550 K and the results are shown in Figure 7.
    qualification: These temperatures are somewhat lower than those of interest to us, but nonetheless, the measurements give
      an indication of the strong negative deviations from Raoult's Law, as shown in the diagram.
    activity_comparisons:
      quote: Note the CaO activity is about an order of magnitude lower than that predicated for Raoult's law behavior or
        in total about two orders of magnitude lower than for pure CaO.
      orders_of_magnitude_below_raoult: 1
      orders_of_magnitude_below_pure_CaO: 2
      locator:
        published_page: 10
        pdf_page_index: 11
        section: CaO-ZrO2 System
        note: 'Sentence continues onto printed p.11 (PDF page 13). Directions as printed: lower.'
    solubility_disagreement_qualification:
      quote: These differences are very likely due to the slow phase changes at these temperatures.
      locator:
        published_page: 11
        pdf_page_index: 12
        section: CaO-ZrO2 System
        note: Qualifies the 17 m/o (1200-1500 K) versus about 7 m/o below 1413 K / about 17 m/o at 1413 K and above solubility
          limits carried in jacobson_1989_numeric_and_directional_statements.
  context_id: jacobson-1989-metal-oxide-zirconia::context::jacobson_1989_cao_zro2_emf_activity
