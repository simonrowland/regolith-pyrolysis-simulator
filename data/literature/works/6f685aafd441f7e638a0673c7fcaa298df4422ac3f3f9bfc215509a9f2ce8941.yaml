        conversion_coefficient: '0.0226'
        conversion_coefficient_units: atm per [J(mole/cm^2-sec) (M(gm/mole))^1/2 (T(°K))^1/2], as printed
        quote: 'When the appropriate conversion factors are added, this equation becomes:'
        locator:
