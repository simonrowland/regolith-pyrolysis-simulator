- observation_id: jacobson_1989_cited_phase_and_vaporization_facts
  type: numeric_and_directional_context
  units: As printed per statement (K, °C, mol/o or m/o, fractions).
  locator:
    published_page: 8
    pdf_page_index: 9
    note: Printed numeric statements attributed to cited studies; per-statement locators.
  values:
    method_class: quoted_attributed
    attribution: Cited studies named per statement (Jacobson's literature survey).
    statements:
    - id: N02-N04
      quote: This phase has a eutectoid at 1679°K (1406°C) and 13.5 mol/o MgO.
      locator:
        published_page: 8
        pdf_page_index: 9
        section: MgO-ZrO2 System
      attribution: Figure 3 phase diagram, reference 13
      system: ZrO2-MgO cubic phase
      eutectoid_temperature_K: 1679
      eutectoid_temperature_C: 1406
      MgO_mol_percent: '13.5'
    - id: eq6
      quote: Eutectoid decomposition of the cubic phase is a feature of both MgO and CaO stabilized ZrO2. ... c(ss) → t(ss)
        + MgO (6). This phase transformation has been studied in detail14 and is fairly slow. It is also further slowed by
        the addition of SrO.14
      locator:
        published_page: 8
        pdf_page_index: 9
        section: MgO-ZrO2 System
      attribution: reference 14
    - id: N05-N06
      quote: The liquidus diagram for ZrO2-MgO is shown in Figure 4.15 There is a eutectic with the 1:1 mixture at 2100°C,
        which is agreed on by several investigators.13,14
      locator:
        published_page: 8
        pdf_page_index: 9
        section: MgO-ZrO2 System
      attribution: references 13, 14 (Figure 4, reference 15)
      eutectic_composition: 1:1 mixture
      eutectic_temperature_C: 2100
    - id: N07-N08
      quote: Several investigators have reported metastable ordered compounds of composition 2 MgO·5 ZrO2 and MgO·6 ZrO2.13
      locator:
        published_page: 8
        pdf_page_index: 9
        section: MgO-ZrO2 System
        note: Sentence continues onto printed p.9.
      attribution: reference 13
      compounds:
      - 2 MgO·5 ZrO2
      - MgO·6 ZrO2
    - id: SrO-compounds
      quote: There are several high melting intermediate phases, including SrZrO3, Sr4Zr3O10, and Sr2ZrO4. The first of these
        has a low coefficient of thermal expansion, suggesting good resistance to thermal shock.1
      locator:
        published_page: 12
        pdf_page_index: 13
        section: SrO-ZrO2
      attribution: phase diagram reference 21 (Figure 10); thermal-shock remark reference 1
    - id: SrZrO3-demixing
      quote: It has been reported that this material is quite susceptible to oxide demixing, with a strong separation appearing
        between the SrO and ZrO2 oxides under the influence of an oxygen potential.22
      locator:
        published_page: 13
        pdf_page_index: 14
        section: SrO-ZrO2
      attribution: reference 22
    - id: N16-N18
      quote: 'Although not shown on the phase diagram, it has also been reported that SrZrO3 undergoes the following phase
        transformations23: orthorhombic → tetragonal 1 → tetragonal 2 → cubic (10)'
      locator:
        published_page: 13
        pdf_page_index: 14
        section: SrO-ZrO2
        note: 923 K, 1003 K and 1443 K are printed above the three successive arrows of Eq.(10).
      attribution: reference 23
      transition_temperatures_K:
      - 923
      - 1003
      - 1443
      transitions:
      - orthorhombic → tetragonal 1
      - tetragonal 1 → tetragonal 2
      - tetragonal 2 → cubic
    - id: incongruent-congruent
      quote: Belov and Semenov have examined a range of rare earth oxide-zirconia stabilized systems and found the following
        general behavior. These systems first undergo a period of incongruent vaporization, during which the oxides loose
        oxygen and go from ZrO2(M2O3) to ZrO2-x(M2O3-y). The oxygen pressure created tends to suppress decomposition vaporization
        reactions, such as 3, 4, 13 and 14. After this a period of congruent vaporization begins.
      locator:
        published_page: 16
        pdf_page_index: 17
        section: Rare Earth Oxide-Zirconia Systems
      attribution: Belov and Semenov [28-32]
    - id: Y2O3-eutectoid
      quote: Note that the cubic phase field does not extend to lower temperatures, but undergoes a eutectoid decomposition,
        similar to that of the MgO and CaO stabilized zirconia. This phase change is slow and has only been recently detected.
      locator:
        published_page: 18
        pdf_page_index: 19
        section: Y2O3-ZrO2
      attribution: phase diagram reference 33 (Figure 16)
    - id: Y2O3-YO-data
      quote: Figures 18 shows the calculated vapor pressures above pure Y2O3 as well as some data points for the vapor pressure
        of YO(g)34 above Y2O3. These show good agreement with the calculated values.
      locator:
        published_page: 19
        pdf_page_index: 20
        section: Y2O3-ZrO2
      attribution: reference 34 (Walsh, Goldstein and White)
    - id: Y2O3-water
      quote: Some recent evidence35 indicates that the Y2O3 in this material reacts with water. This is an important point
        which merits further investigation for structural applications of this material.
      locator:
        published_page: 19
        pdf_page_index: 20
        section: Y2O3-ZrO2
      attribution: reference 35
    - id: Sc2O3-liquidus
      quote: There are some low temperature phase changes and the location of the liquidus is still in question. However there
        is a large cubic phase field.
      locator:
        published_page: 19
        pdf_page_index: 20
        section: Sc2O3-ZrO2
      attribution: phase diagram reference 36 (Figure 20)
    - id: N22
      quote: It should be noted that the vapor pressure in the solid solution is sufficiently high that Belov et. al.38 observe
        after 100 minutes at 2580°K, all the Sc2O3 has vaporized from their sample of 50 m/o Sc2O3 - 50 m/o ZrO2.
      locator:
        published_page: 20
        pdf_page_index: 21
        section: Sc2O3-ZrO2
      attribution: Belov et al. [38]
      sample_composition_mol_percent:
        Sc2O3: 50
        ZrO2: 50
      duration_min: 100
      temperature_K: 2580
      outcome: complete Sc2O3 loss
    - id: N23
      quote: While the cubic phase undergoes a eutectoid decomposition at about 2248 K, there is a pyrochlore phase which
        seems to be stable over a wide range of temperatures.
      locator:
        published_page: 21
        pdf_page_index: 22
        section: La2O3-ZrO2
      attribution: phase diagram reference 40 (Figure 23)
      eutectoid_temperature_K_approx: 2248
    - id: La2O3-hygroscopic
      quote: It is well known that La2O3 is quite hygroscopic. This may be also be a limitation in the application of the
        solid solution.
      locator:
        published_page: 21
        pdf_page_index: 22
        section: La2O3-ZrO2
      attribution: general statement (no reference printed)
    - id: CeO2-partial
      quote: There is currently interest in the partially stabilized zirconia of this system.41 However, as shown in the phase
        diagram (Figure 26), there is not a fully stabilized composition down to low temperatures for this system.
      locator:
        published_page: 21
        pdf_page_index: 22
        section: CeO2-ZrO2
      attribution: reference 41; phase diagram references 2, 41 (Figure 26)
    - id: N24
      quote: The phase diagram for the Sm2O3-ZrO2 system42 is shown in Figure 29. There is a large cubic phase field and also
        a miscibility gap and temperatures less than 2000 K.
      locator:
        published_page: 22
        pdf_page_index: 23
        section: Sm2O3-ZrO2 and Gd2O3-ZrO2
      attribution: reference 42
      miscibility_gap_temperature_bound_K: 2000
      note: '''and temperatures less than 2000 K'' as printed (bound read as ''below 2000 K'').'
    - id: N27-N28
      quote: These systems all show similar phase diagrams, which exhibit large cubic phase fields and liquidus maxima. These
        diagrams45-48 are shown in Figures 33, 35, 37, and 39. Note that in each case the liquidus maxima is at a composition
        of 0.15 to 0.20 M2O3-ZrO2 and a temperature near 2800 K. The phase diagrams are very likely all somewhat tentative,
        but they do show a lack of phase changes for these compositions.
      locator:
        published_page: 23
        pdf_page_index: 24
        section: Yb2O3-ZrO2, Dy2O3-ZrO2, Ho2O3-ZrO2, and Er2O3-ZrO2
        note: Sentence continues onto printed p.24 (PDF page 26).
      attribution: references 45-48
      systems:
      - Yb2O3-ZrO2
      - Dy2O3-ZrO2
      - Ho2O3-ZrO2
      - Er2O3-ZrO2
      liquidus_maximum_M2O3_fraction_range:
      - '0.15'
      - '0.2'
      liquidus_maximum_temperature_K_approx: 2800
    - id: N41
      quote: Although Gd2O3 is one of the lower vapor pressure rare earth oxides, Belov and Semenov28 have found that on heating
        in the range 2773-2823 K, Gd2O3 completely vaporizes from a solid solution with ZrO2.
      locator:
        published_page: 23
        pdf_page_index: 24
        section: Sm2O3-ZrO2 and Gd2O3-ZrO2
      attribution: Belov and Semenov [28]
      system: Gd2O3-ZrO2 solid solution
      temperature_range_K:
      - 2773
      - 2823
      outcome: Gd2O3 completely vaporizes
    - id: N42
      quote: Data for the solid oxide solution was not available. Belov and Semenov28 have noted that in the temperature range
        2773 K to 2823 K, Yb2O3 tends to completely vaporize from the solid solution.
      locator:
        published_page: 24
        pdf_page_index: 25
        section: Yb2O3-ZrO2, Dy2O3-ZrO2, Ho2O3-ZrO2, and Er2O3-ZrO2
      attribution: Belov and Semenov [28]
      system: Yb2O3-ZrO2 solid solution
      temperature_range_K:
      - 2773
      - 2823
      outcome: Yb2O3 tends to completely vaporize
    - id: N29-N32-N43
      quote: Belov and Semenov28 have shown that each of these systems at 2, 3, 10, and 50 m/o do not decompose at temperatures
        of 2773-2823 K.
      locator:
        published_page: 24
        pdf_page_index: 25
        section: Yb2O3-ZrO2, Dy2O3-ZrO2, Ho2O3-ZrO2, and Er2O3-ZrO2
        note: '''These systems'' are Dy2O3, Ho2O3 and Er2O3 with ZrO2 (preceding sentences). The sentence does not name the
          component the m/o refers to.'
      attribution: Belov and Semenov [28]
      systems:
      - Dy2O3-ZrO2
      - Ho2O3-ZrO2
      - Er2O3-ZrO2
      compositions_m_o_as_printed:
      - 2
      - 3
      - 10
      - 50
      temperature_range_K:
      - 2773
      - 2823
      outcome: do not decompose
    - id: DyHoEr-qualification
      quote: Solid solution data was not available. However systems which exhibit liquidus maxima show significant interactions49
        and hence these systems should show a corresponding vapor pressure lowering.
      locator:
        published_page: 24
        pdf_page_index: 25
        section: Yb2O3-ZrO2, Dy2O3-ZrO2, Ho2O3-ZrO2, and Er2O3-ZrO2
      attribution: reference 49 (Swalin)
    - id: Lu2O3
      quote: They have have also suggested the Lu2O3-ZrO2 system, since Lu2O3 has the lowest vapor pressure of the rare earth
        oxides, as shown in Table I. However a phase diagram could not be located for the Lu2O3-ZrO2 system. Clearly more
        work is needed on these important systems.
      locator:
        published_page: 24
        pdf_page_index: 25
        section: Yb2O3-ZrO2, Dy2O3-ZrO2, Ho2O3-ZrO2, and Er2O3-ZrO2
      attribution: Belov and Semenov [28]
