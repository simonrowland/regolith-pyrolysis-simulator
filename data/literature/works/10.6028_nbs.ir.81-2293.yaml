- observation_id: hastie_plante_1981_channel_composition_drift
  type: qualifying_conditions
  locator:
    pdf_page_index: 9
    published_page: 6
    section: Synthetic MHD Channel Slags
  units: as printed
  values:
    printed_quote: “Steady state pressures were not obtained until about ten percent of the K2O content had been depleted
      by vaporization”; “Excess oxygen was vaporized during this initial experimental phase”; “Following this initial reduction
      period, the oxygen partial pressure was, within experimental error, what would be expected if the O2 pressure were controlled
      by K2O dissociation.”
    iron_oxide_reduction_as_printed: Initial excess O2 accompanies FeOx reduction from x = 1.5 to 1.33.
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_channel_composition_drift
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
- observation_id: hastie_plante_1981_channel_sample_selection
  type: method_context
  locator:
    pdf_page_index: 9
    published_page: 6
    section: Synthetic MHD Channel Slags
  units: as printed
  values:
    selection_as_printed: Compositions selected from analyses of several hundred coal ashes and several MHD channel slags
      in the literature; Western four-component simplified and Western/Eastern six-component slags considered.
    phase_characterization: Samples non-glassy, KAlSiO4 dominant in both Western and Eastern; minor KAlSi2O6 and at least
      one unidentified Eastern phase. Retain separately the Table 1 rows 14-15 glassy-phase descriptions.
    earlier_orifice_diameter_mm:
    - '0.5'
    - '1'
    current_orifice_diameter_mm: '0.34'
    reason: Smaller orifice selected to reduce vapor unsaturation previously seen with larger orifices.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_channel_sample_selection
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
