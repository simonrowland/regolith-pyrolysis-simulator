- observation_id: hastie_plante_1981_distribution_coefficient
  type: comparative_statement
  locator:
    pdf_page_index: 16
    published_page: 13
    section: KMS Study in Salt Solidus Region
  units: as printed
  values:
    printed_quote: “Values of K_D ~ 0.1 were found”; similar separation factors “have been observed for other metals in borate,
      rather than silicate, solvent extraction systems”; effective under “vacuum vaporization and near-atmospheric transpiration
      conditions.”
    definition_as_printed: K_D = X(K2O, slag) / X(KCl, salt), where X is mole fraction.
    comparison_attribution: Williams et al. (1977) for other metals in borate solvent extraction systems.
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_distribution_coefficient
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
- observation_id: hastie_plante_1981_dp_model_conditions
  type: model_context
  locator:
    pdf_page_index: 13
    published_page: 10
    section: MHD Slag Thermochemistry
  units: as printed
  values:
    printed_quote: “interface temperatures for K2O slag saturation in the range of 2100 to 2500 K at 10 atm and 1900 to 2200
      K at 1 atm” for 5 to 15 wt.% K2O; “significantly lower for the one atm conditions”; “as the temperature decreases, the
      slag DP curves decrease much faster than for the plasma.”
    method_class: model_derived
    dissociation_pressure_product_as_printed: DP = pK^2 * pO2^(1/2)
    activity_relation_as_printed: a(K2O) = DP(solution) / DP(pure liquid K2O)
    model_assumptions_as_printed: Multicomponent equilibrium program; stoichiometric combustion of CH0.7 with air at 4/1 N2/O2
      mole ratio; vapor alkali species KOH, K, KO and K+.
    pressure_roles: 10 atm for combustor; 1 atm for channel-diffuser-downstream seed recovery units.
    inferred_slag_K2O_wt_pct_as_printed: about 10 under the interface conditions cited from Self (1979)
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_dp_model_conditions
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
- observation_id: hastie_plante_1981_eastern_break
  type: qualifying_conditions
  locator:
    pdf_page_index: 10
    published_page: 7
    section: Synthetic MHD Channel Slags
  units: as printed
  values:
    printed_quote: “The vapor pressure curves show a significant break at location X, the position of which depends on the
      amount of sample vaporized”; “significant positive deviation” of observed K and O2 pressures from the extrapolated higher-temperature
      portions; “At temperatures above 1620 K, these two curve sets are seen to merge into a single linear portion”; at higher
      temperatures O2 pressures “were greater than would be predicted by K2O dissociation alone,” while at lower temperatures
      “less”; above 1620 K FeOx reduction releases O2 and below this temperature FeOx is oxidized.
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_eastern_break
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
