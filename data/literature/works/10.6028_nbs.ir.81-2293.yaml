- observation_id: hastie_plante_1981_tms_exchange
  type: comparative_statement
  locator:
    pdf_page_index: 14
    published_page: 11
    section: TMS Study in Salt Liquidus Region
  units: as printed
  values:
    printed_quote: Just above NaCl melting, NaCl activity decreases while KCl activity increases. After about 50 min heating,
      NaCl and the KCl product were virtually depleted. Insufficient initial salt to convert all available K2O; 90 percent
      of initial NaCl converted to Na2O(slag) with stoichiometric KCl release; about six percent of available K2O converted
      to KCl vapor. Nearly complete removal would have been possible with sufficient NaCl (continuation on PDF 16 / printed
      12).
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_tms_exchange
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
