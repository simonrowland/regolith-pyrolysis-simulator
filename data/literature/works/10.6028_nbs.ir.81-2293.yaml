- observation_id: hastie_plante_1981_gamma_run_qualifiers
  type: qualifying_conditions
  locator:
    pdf_page_index: 12
    published_page: 9
    section: Real MHD Channel Slag
  units: as printed
  values:
    printed_quote: 'Activity is apparent because the slag may not always be in complete thermodynamic equilibrium; most data
      below liquidus. Normal negative-slope segments: run 1 up to about 1430 K, run 2 between 1430 and 1630 K. Run 1 anomalous
      during initial heating when K2SO4 and K2CO3 supplied additional K; rapid gamma(K2O) reduction beyond 1430 K results
      from virtually complete depletion of these relatively volatile forms of potassium. For runs 2 and 3, initial reduction
      may reflect diffusion-limited K transport in solid slag or changes in O2 release, for instance Fe3O4 dissociation. Subsequent
      increase may reflect a less viscous but still solid form with increased diffusion, or depletion of secondary O2 sources.
      Rapid bulk composition changes lead to gamma peaking. Runs 2 and 3 above 1450 K are believed to represent equilibrium
      vaporization.'
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
  context_id: kems-217-hastie-plante-1981-nbsir-81-2293::context::hastie_plante_1981_gamma_run_qualifiers
  work_id: 10.6028/nbs.ir.81-2293
  source_id: kems-217-hastie-plante-1981-nbsir-81-2293
  species: K
