- observation_id: hastie_plante_1981_static_air_exchange
  type: comparative_statement
  locator:
    pdf_page_index: 17
    published_page: 14
    section: KMS Study in Salt Solidus Region
  units: as printed
  values:
    printed_quote: The exchange process in air at 920 K “appeared to be slower than for the vacuum experiments”; NaCl vapor
      transport would be “significantly lower under static atmospheric conditions”; an analogous CaCl2 process is “even more
      favorable” thermodynamically but may be “transport limited.”
    experiment_as_printed: NaCl and K2 slag mixture heated in air to 920 K in a muffle furnace; X-ray diffraction products
      showed both KCl and NaCl solid.
    ion_exchange_qualification: CaCl2 exchange between divalent Ca2+ and monovalent K+ may be transport limited; experimental
      confirmation needed.
  uncertainty:
    note: No numerical uncertainty stated for this narrative item.
