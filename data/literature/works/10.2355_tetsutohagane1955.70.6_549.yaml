          63 (1977) as ref 9). Internal standard: pure Fe foil 0.2 mm thick, 8.5 mm diameter, covering >90% of the sample
          surface. Sample volume in the cell fixed at 0.25 cm3. Thermocouple W/W-26Re (replaced 6/30 Pt-Rh). Cell-holder upper-minus-lower
