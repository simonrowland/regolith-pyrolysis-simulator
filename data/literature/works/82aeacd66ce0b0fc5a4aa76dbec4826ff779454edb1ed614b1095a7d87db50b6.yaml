    c2_iron_loss_as_feo: about 0.5 ± 0.5%
    c2_metal_in_bulk_analysis: about 1.5% Fe°
    equilibrium_peritectic_liquid_fe2o3_from_iron_loss_only: 0–2 wt.%
    quench_disproportionation: Each mole of metallic Fe formed during quench generated one mole of ferric iron; Eq. (3) is
