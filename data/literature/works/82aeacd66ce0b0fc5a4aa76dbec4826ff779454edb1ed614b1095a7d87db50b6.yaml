    section: Run products
  units: '% by weight as printed'
  values:
    c1_capsule_wall: At least 15% Fe at silicate contact, falling to near zero by 0.1 mm into platinum.
    c1_required_iron_loss: 1–2% as FeO from sample.
    c2_plating: Iron plating remained intact; iron precipitated on the capsule wall during melting could not be distinguished
      from original plating.
    c1_liquid_fe2o3_before_quench: about 3.7 ± 1 wt.% Fe2O3; also stored as a measured-reduced liquid composition observation.
    cp_composition_corrections: The adjustment to equilibrium peritectic liquid Cp is 0.18%; correction to pure Fe2SiO4 liquid
      Cp is 0.34%; both are much less than experimental Cp error of about 3.5% and were ignored.
  context_id: rb86-stebbins-carmichael-1984::context::sc1984_capsule_iron_loss_and_c1_liquid_correction
