- observation_id: sc1984_inherited_solid_enthalpy_and_quench_mixture_correction
  type: inherited_input_context
  locator:
    page: 5
    published_page: 296
    pdf_page_index: 4
    equation: '8'
    section: Heat of fusion calculations
  units: J mol−1 and J g−1 as printed
  values:
    attribution: Robie, Finch, and Hemingway (1982), inherited high-temperature fayalite solid enthalpy equation based on
      Orr (1953) drop calorimetry and 5–383 K adiabatic heat capacity.
    equation8_as_printed: H_T − H_300 = 123.80T + 3.1167 × 10−2 T² − 36771 J mol−1
    accuracy_and_range_as_printed: Within 200 J mol−1 between 900 and 1900 K.
    glass_correction_as_printed: If non-fayalite mixture were primarily glass, computed fusion heat could be too low by 10–15%;
      careful microscopy found no glass and authors estimate less than 2% of sample.
    laihunite_caveat: If the interstitial mix contained a high proportion of laihunite, precise correction could not be made
      because thermochemical data were unavailable; the erratum changes only the laihunite reference, not measured values
      or equations.
    equation9_as_printed: Fe3O4(sol) + Fe°(sol) + 2SiO2(sol) = 2Fe2SiO4(sol); ΔH = −121.0 J per g magnetite, attributed to
      Robie et al. (1979).
    c2_magnetite_mixture_estimate: C-2 indicates 0.0946 g Fe3O4 per g sample; assuming interstitial residuum is magnetite
      plus tridymite gives H_300^fay − H_300^mix = −11.45 J per g sample, about 2.5% of ΔH_inc.
  context_id: rb86-stebbins-carmichael-1984::context::sc1984_inherited_solid_enthalpy_and_quench_mixture_correction
  work_id: 82aeacd66ce0b0fc5a4aa76dbec4826ff779454edb1ed614b1095a7d87db50b6
  source_id: rb86-stebbins-carmichael-1984
  species: Fe2SiO4
