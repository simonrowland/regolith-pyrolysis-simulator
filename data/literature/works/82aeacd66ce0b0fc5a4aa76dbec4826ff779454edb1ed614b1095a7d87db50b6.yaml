  units: as printed
  values:
    method_as_printed: Diphenyl ether drop calorimeter; reference temperature 300 K; Pt-40%Rh wire-wound furnace.
    sample_mass_as_printed: about 2 g
    capsules_as_printed: Capsules made from 0.25 mm Pt–10%Rh sheet and tubing; argon filled and arc sealed. C-2 interior plated
      with about 0.03 mm iron.
    calibration_as_printed: NBS 720 sapphire standard run once for every one or two sample drops.
    capsule_mass_change_as_printed: Neither capsule showed weight changes greater than a few tenths of a milligram.
    source_note: The capsule material is recorded here as printed; the argon fill is not promoted to a total-pressure condition.
  context_id: rb86-stebbins-carmichael-1984::context::sc1984_capsules_and_calorimetry_method
