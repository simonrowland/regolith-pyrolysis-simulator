- observation_id: sc1984_table2_method_and_precision
  type: chemical_analysis_method_context
  locator:
    page: 2
    published_page: 293
    pdf_page_index: 1
    section: Analysis of samples after experiments
  units: '% and stated relative precision'
  values:
    total_iron_method: Total iron determined by ammoniacal thioglycolic acid and reported as FeO.
    ferrous_iron_methods: Colorimetric Wilson (1960) includes metallic iron as FeO; titrimetric Wilson (1955) responds differently.
      Sensitivity was calibrated using samples with known metal amounts.
    reduction_note: Combination of the three analyses yields ferrous, ferric, and metallic iron. Fe2O3 is calculated from
      FeO and FeOtot; Fe° is calculated from FeOtot and two FeO analyses except zeros determined from absence of magnetic
      material.
    method_precision_as_printed: Total iron ±0.5% of amount present; Fe2O3 ±20%; Fe° ±50%. Errors for Fe2O3 and Fe° are larger
      because values are calculated from small differences between large numbers.
    confidence_level: not stated
    post_quench_state: The analysis is of quenched bulk sample and excludes metal precipitated onto or dissolved in capsule
      walls.
  context_id: rb86-stebbins-carmichael-1984::context::sc1984_table2_method_and_precision
