- observation_id: oneill_2005_table1_relative_log_coefficients
  type: experiment_series
  locator:
    page: 4
    published_page: 500
    pdf_page_index: 3
    table: '1'
  units: as printed
  values:
    quantity: signed logarithm of a relative activity-coefficient ratio
    temperature_as_printed: 1400 °C
    reference_as_printed: gamma_infinity(NaO0.5) in the anorthite-diopside eutectic (ADeu)
    normalization_as_printed: gamma_infinity(NaO0.5) / gamma_infinity(NaO0.5, ADeu), at infinite dilution; Eq. 5
    table_groups_as_printed: AD6 (11 runs); CMAS7 (5 runs); Di-Co (8 runs)
    composition_basis_as_printed: AD6 and CMAS7 compositions are pointers to O’Neill and Mavrogenes (2002) and O’Neill and
      Eggins (2002); Di-Co compositions are weight-percent mixtures of CaMgSi2O6 and AlO1.5 as printed in footnote §.
    fit_uncertainty_as_printed: 'Table 1 footnote †: reduced chi-squared from fits assuming σ[Na2O] = 0.02[Na2O] + 0.1 wt%.
      Footnote ‡: the higher-scatter CMAS7 B data were weighted with σ[Na2O] = 0.05[Na2O] + 0.1 wt%.'
    confidence_level: not stated for the parenthetical widths in Table 1
    measured_inputs_as_printed: NaO0.5 content in the melts was measured by electron microprobe in EDS mode (CAMECA Camebax);
      operating conditions 15 kV, 6 nA, 100 live seconds, beam defocused to ~10 μm. The paper reports generally ~2% (1σ) precision
      for [NaO0.5] > 2 wt%. Figure 2 plots measured X_NaO0.5 against the ADeu-reference melt mole fraction for 11 runs on
      six AD6 compositions; the analyzed Na-free compositions are pointers to O’Neill and Mavrogenes (2002) and O’Neill and
      Eggins (2002), not values copied into this extract. Figure 3 summarizes five Di-Cor join compositions; two compositions
      from B18/6/03 were lost. Numeric source inputs are plotted, with no source table.
    experimental_conditions_as_printed: 'Sodium-free silicate melts were prepared from oxides and carbonates and mounted as
      beads on wire loops. An open Pt reservoir crucible holding 5 to 10 g of NaO0.5-SiO2 melt was suspended about 10 cm below
      the sample chandelier holding 6 to 8 samples. The assembly was run in a vertical tube furnace: introduced at 600 °C
      and heated at 6 °C/min to 1400 °C. Most runs were in air, usually flowing at about 50 cm3/min; some had static air or
      an open furnace, and the technique is also described for CO-CO2, CO-CO2-SO2, and O2-SO2 gas mixtures without assignment
      to individual data. Reservoir NaO0.5/SiO2 ratios varied; the highest-Na experiment used pure Na2SiO3 at fO2 = 10^-6.7
      bars. The paper reports steady state by 8.5 h in three air replicates and maintenance for several days; per-run durations
      and atmosphere/reservoir assignments are not given. The temperature difference 10 cm below the hot spot is about 30
      °C at 1400 °C.'
