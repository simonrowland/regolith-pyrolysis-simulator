    - page: 3
      published_page: 499
      pdf_page_index: 2
      section: Experimental details
    details_as_printed: Sodium-free melts were made from oxides and carbonates and mounted as beads on wire loops. An open
      Pt crucible containing NaO0.5-SiO2 reservoir melt hung beneath the sample chandelier. The assembly entered a vertical
      gas-mixing tube furnace at 600 °C and was heated at 6 °C/min to 1400 °C; most experiments were in air at about 50 cm3/min,
      with some static-air and open-furnace variants. NaO0.5 content was analyzed with a CAMECA Camebax electron microprobe
      in EDS mode at 15 kV, 6 nA, 100 live seconds, and a defocused beam of about 10 μm. Generally reported analytical precision
      is ~2% (1σ) for contents >2 wt%. The paper does not assign the atmosphere, reservoir NaO0.5/SiO2 ratio, or duration
      to each Table 1 composition.
  context_id: oneill-2005-alkali-oxide-activities::context::oneill_2005_experimental_method_and_control_conditions
