    status: context_only
    standard_state_as_printed: where p_i and p_i° are the partial pressures of the components of the gas phase over spinel
      and simple oxide (pure component), respectively.
    reference_phase: The paper does not state whether that pure-component simple oxide is solid or liquid, and it does not
      state the temperature of the reference-pressure measurement. The pure-oxide-at-experiment-T ruling was not applied.
      No melting point was used.
    reason: 'Series 8 is the open right-pointing triangle with one left stroke. A series 5 or 6 bar is the vertical stroke
      that extends past the triangle. Two left strokes that join at the corners are not that open triangle. Seven centres
      on panel (a) and seven on panel (b) are the activity observations. Refused on panel (a), one marker at a time. About
      1425 K, crop (286, 741): up-triangle, series 1-4. About 1522 K, crop (465, 692): up-triangle, series 1-4. About 1576
      K, crop (565, 631): up-triangle, series 1-4. About 1672 K, crop (741, 751): up-triangle, series 1-4. About 1861 K, crop
      (1090.5, 1132.5): two left strokes. At 1200 dpi the white gap is 20 px (10 px at 600 dpi) and the strokes join for 8
      rows at the top and 8 rows at the bottom. That is not the single left stroke of an open series-8 triangle. About 1643
      K, crop (688, 1318): up-triangle, series 1-4. About 1692 K, crop (779, 1272): up-triangle, series 1-4. About 1742 K,
      crop (870, 1304): up-triangle, series 1-4. About 1789 K, crop (958, 1288): up-triangle, series 1-4. About 1843 K, crop
      (1057, 1263): two up-triangles, series 1-4. About 1873 K, crop (1111, 1250): up-triangles and a right-pointing outline
      are one mass, so no open centre is assigned. About 1933 K, crop (1222, 1098), and about 1944 K, crop (1242, 1103): the
      white gaps are 10 to 15 px wide and run into a filled triangle, so they are not a series-8 interior. About 1954 K, crop
      (1261, 1090): filled right triangle, series 7. About 1980 K, crop (1310, 1013): the bar extends past the triangle, series
      5 or 6. About 1988 K, crop (1323, 1082): the white region is about 20 px wide and sits on the filled triangle''s tip,
      so no series-8 centre is there. About 2042 K, crop (1424, 880): the bar extends past the triangle and a horizontal stroke
      crosses it, series 5 or 6. About 2080 K, crop (1460, 980): the bar extends past the triangle, series 5 or 6. About 2101
      K, crop (1532.0, 1044.5): two left strokes on this glyph. At 1200 dpi the white gap is 20 px and the strokes join for
      4 rows at the top and 4 rows at the bottom, the same pattern as 1861 K and 2103 K. The marker above is a separate glyph.
      About 2174 K, crop (1666, 944): the bar extends past the triangle, series 5 or 6. About 2274 K, crop (1852, 906): the
      bar extends past the triangle, series 5 or 6. The open triangle at crop (1633, 799) is the legend key. Refused on panel
      (b). About 1423 K, crop (283, 2527): up-triangle, series 1-4. About 1471 K, crop (370, 2642): up-triangle, series 1-4.
      About 1520 K, crop (462, 2669): up-triangle, series 1-4. About 1521 K, crop (464, 2615): up-triangle, series 1-4. About
      1571 K, crop (555, 2658): up-triangle, series 1-4. About 1576 K, crop (564, 2607): up-triangle, series 1-4. About 1619
      K, crop (643, 2642): up-triangle, series 1-4. About 1627 K, crop (658, 2675): up-triangle, series 1-4. About 1671 K,
      crops (740, 2587), (740, 2628) and (740, 2669): three up-triangles, series 1-4. About 1772 K, crop (926, 2371): up-triangle
      with the upper half filled, not series 8. About 1843 K, crop (1057, 2168): up-triangle, series 1-4. About 1850 K, crop
      (1080, 2280): an up-triangle and a right triangle are one mass, so no open centre is assigned. About 1955 K, crop (1263,
