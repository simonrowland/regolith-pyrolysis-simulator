      open and filled squares, not series 16. About 1620–1840 K, crop x 1200–1450: up-triangles, open and half-filled, not
      series 16. The marker at crop (1368, 858), about 1767 K, is a right-pointing triangle with the lower half filled, not
      an up-triangle and not series 16. The open right triangle at the right edge of that band is the stored 1863 K point.
      Above that chain the symbol is a filled right triangle, series 13, not series 16. Legend symbols near crop x 2078 are
      not data. Error-bar ends were not read. The least-squares constants of this series are Table 1. MinerU''s chart table
      was ignored.'
