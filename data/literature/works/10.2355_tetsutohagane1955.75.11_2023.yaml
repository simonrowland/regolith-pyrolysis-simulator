- observation_id: nagata_1989_emf_method_and_equilibrium_proof
  type: method
  locator:
    published_page: 2024
    pdf_page_index: 2
    section: 2. Experimental method
  units: K; mV; J/mol
  values:
    quantity: galvanic_cell_emf_method
    method_class: method_only
    experimental_method: galvanic cells with 4CaO.P2O5 solid electrolyte; solid CaO reference electrode; sample electrode
      = two-phase solid mixtures of adjacent calcium aluminates (Cells I–IV)
    electrolyte_as_printed: 4CaO.P2O5
    temperature_range_K_as_printed: 1473 to 1873
    standard_state_CaO_as_printed: pure solid
    how_equilibrium_shown_as_printed: EMF stable after 20–36 ks at setpoint; after temperature cycle returns to within ±1
      mV (Fig. 2); polarization ±110 mV for 60 s recovers to equilibrium EMF ~360 s later (reversible); heating/cooling symbols
      agree on Fig. 3; post-run XRD shows only the intended two compounds; SEM/XRD of electrolyte surface shows no phases
      other than 4CaO.P2O5
    preparation_and_measurement_conditions_as_printed: Electrolyte powders were dried at 473 K for over one week, calcined
      in air at 1373 K for 43.2 ks, pelletized, and sintered in air at 1473 K for 36.0 ks; an alumina crucible was used and
      the pellet was buried in same-composition powder. The furnace atmosphere was air dried over P2O5 powder. A PID controller
      held temperature to ±1 K; the thermocouple position is shown in Fig. 1.
    cell_IV_liquidus_note_as_printed: above 1635 K Cell IV splits into (a) liquid + 3CaO.Al2O3 and (b) liquid + CaO.Al2O3
      at eutectic 1633±5 K, 50.65 wt% Al2O3
    a_CaO_from_emf_formula_as_printed: aCaO = exp(-2 E4 F / RT) for liquidus EMF of Cell IV (sec. 4.4)
  context_id: nagata-1989-emf-calcium-aluminates::context::nagata_1989_emf_method_and_equilibrium_proof
