- observation_id: shornikov_2018_eg_abstract
  type: thermodynamic_example
  locator:
    published_page: 120
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    method_class: author_estimate
    quantity: abstract_scientific_context
    temperature_interval_K:
    - '2000'
    - '2200'
    quote: The partial pressure values of the gas phase components over the spinel solid solutions and its border were determined
      by the Knudsen effusion mass-spectrometric method in the temperature range 2000–2200 K. The found values of the oxide
      activities, the Gibbs energy, enthalpy and entropy of formation of solid solutions indicated the minor negative deviations
      from ideality. The obtained thermodynamic information associated with available in the literature.
    translation_note: Closing sentence is garbled as printed; no comparison direction is inferred from it.
  context_id: shornikov-2018-spinel-solid-solutions-eg::context::shornikov_2018_eg_abstract
  work_id: 38367ae2192cfcbdd654a1e00b4a948721619aa064765a6b18ec4caf822e7df6
  source_id: shornikov-2018-spinel-solid-solutions-eg
  species: MgAl2O4
- observation_id: shornikov_2018_eg_activity_comparisons
  type: thermodynamic_example
  locator:
    published_page: 122
    pdf_page_index: 2
    section: Right column, Figures 3–4 discussion
  units: as printed
  values:
    method_class: author_estimate
    quantity: directional_and_qualifying_statements
    cited_Al2O3_calculation_interval_K:
    - '1400'
    - '2173'
    current_thermodynamic_function_temperature_K: '2100'
    quotes:
    - The MgO activities found at present study (Fig. 3a) are average between the results (Sasamoto et al., 1981; Fujii et
      al., 2000).
    - Some excess of the MgO activities (Sakamoto et al. 1981) are due to ignoring of the difference between the partial pressure
      of oxygen over MgO and the same over the spinel solid solutions in the calculation.
    - The relatively low values of MgO activities (Fujii et al., 2000) are apparently due to errors in determining the boundary
      composition positions, which were used in the calculations of the oxide activities in spinel solid solutions.
    - The calculated Al2O3 activities at 1400–2173 K (Navrotsky et al., 1986) are quite far from the results (Fujii et al.
      2000) and the results of present study (Fig. 3b). It is probably due to significant calculation errors.
    - A summary of partial (Δμ_i, ΔH_i, ΔS_i) and integral (ΔG_T, ΔH_T, ΔS_T) thermodynamic functions of spinel solid solutions
      calculated at present study at 2100 K is given in Fig. 4.
    - It can be seen their simbanet behavior in dependence on the oxide contents, that is indicate the slight negative deviations
      from ideality.
    - It is seen that the integral thermodynamic characteristics are almost unchanged in the spinel solid solutions and their
      extreme values are in the stoichiometric spinel composition.
    translation_note: Sakamoto (discussion) versus Sasamoto (caption/references) and 'simbanet' are preserved as printed;
      causes remain the authors' qualified claims.
  context_id: shornikov-2018-spinel-solid-solutions-eg::context::shornikov_2018_eg_activity_comparisons
