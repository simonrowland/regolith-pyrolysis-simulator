    method_quote: At present study the thermodynamic data on the properties of spinel solid solutions in the MgAl2O4–Al2O3
      system were obtained by the Knudsen effusion mass–spectrometric method at stationary evaporation of stoichiometric spinel
      sample from a molybdenum cell in the temperature range 2000–2200 K.
    qualifying_quotes:
    - 'We can omit the MgAlO low contents in the gas phase, and than the stoichiometric spinel evaporation process can be
      conditionally presented as the following reaction:'
    - This gives us the opportunity to obtain the compositions of spinel solid solution directly in effusion cell at evaporation
      due to the Mg preferential evaporation.
    - Note that the change in the spinel composition during evaporation continued until the compositions located at the boundary
      of the spinel solid solutions and the "MgAl2O4 + Al2O3" region.
    - When the boundary composition of the solid spinel solution (x_i^*) is reached, its congruent evaporation was observed.
    translation_note: The conditional reaction omits low MgAlO; 'and than' and 'spinel residual melt' are printed wording.
      Congruent evaporation is reported only upon reaching the boundary, not throughout the run.
    integration_attribution: Complete isothermal evaporation method (Sidorov et al., 1985).
