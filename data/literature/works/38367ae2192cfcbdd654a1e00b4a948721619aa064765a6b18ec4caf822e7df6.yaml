- observation_id: shornikov_2018_eg_equation_2
  type: thermodynamic_example
  locator:
    published_page: 121
    pdf_page_index: 1
    section: Equation (2) and symbol definitions
  units: as printed
  values:
    method_class: author_estimate
    quantity: printed_method_relation
    equation_number: 2
    relation_as_printed: q_t=q_0\frac{\int_{t=0}^{t}I_i\,dt}{\int_{t=0}^{t=t_0}I_i\,dt}
    definitions:
      q_t: Amount of evaporated oxide contained in the spinel solid solution.
      q_0: Quantity of the ith component whose complete evaporation time is t_0.
      I_i: Total ion current of the ith melt component, MgO or Al2O3.
      t: Evaporation time.
      t_0: Complete evaporation time of the ith component quantity q_0.
      method: Complete isothermal evaporation (Sidorov et al., 1985).
  context_id: shornikov-2018-spinel-solid-solutions-eg::context::shornikov_2018_eg_equation_2
  work_id: 38367ae2192cfcbdd654a1e00b4a948721619aa064765a6b18ec4caf822e7df6
  source_id: shornikov-2018-spinel-solid-solutions-eg
  species: MgAl2O4
- observation_id: shornikov_2018_eg_equation_3
  type: thermodynamic_example
  locator:
    published_page: 121
    pdf_page_index: 1
    section: Equation (3) and symbol definitions
  units: as printed
  values:
    method_class: author_estimate
    quantity: printed_method_relation
    equation_number: 3
    relation_as_printed: p_i=K_\alpha\frac{q_i}{s_{\rm or}C_{\rm or}t}\sqrt{\frac{2\pi RT}{M_i}}
    definitions:
      p_i: Partial pressure of the ith vapor species.
      q_i: Component quantity evaporated from the effusion cell.
      M_i: Molecular weight.
      T: Temperature.
      C_or: Clausing factor of the effusion orifice.
      s_or: Effusion orifice area.
      K_alpha: Correction taking account of evaporation coefficient alpha_i and molecular structure changes on transition
        to the gas phase from surface area S_v.
      method: Hertz–Knudsen equation; Shornikov (2002).
      definition_continuation_locator:
        published_page: 122
        pdf_page_index: 2
        section: First lines, continuing equation (3) definitions
  context_id: shornikov-2018-spinel-solid-solutions-eg::context::shornikov_2018_eg_equation_3
  work_id: 38367ae2192cfcbdd654a1e00b4a948721619aa064765a6b18ec4caf822e7df6
  source_id: shornikov-2018-spinel-solid-solutions-eg
  species: MgAl2O4
- observation_id: shornikov_2018_eg_equation_4
  type: thermodynamic_example
  locator:
    published_page: 122
    pdf_page_index: 2
    section: Equation (4) and symbol definitions
  units: as printed
  values:
    method_class: quoted_attributed
    attribution:
      cited_as: 'Komlev (1964); partial evaporation coefficients: Shornikov (2015)'
    quantity: printed_method_relation
    equation_number: 4
    relation_as_printed: K_\alpha=\frac{1}{C_{\rm or}}+s_{\rm or}\frac{1-C_c\alpha_i}{S_v\alpha_i C_c}
    definitions:
      C_c: Clausing coefficient for the effusion cell, associated with vapor-species collisions inside the orifice channel
        and reverse reflection from its walls.
