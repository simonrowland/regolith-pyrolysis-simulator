    pdf_page_index: 5
    equation: '2'
    note: Fe0.947O solid standard-state reaction and reference-state statement
  units: verbatim statements and equations
  values:
    statements:
    - statement_as_printed: For both reactions, we have used solid oxides as reference states.
      locator:
        page: 6
        published_page: 308
        pdf_page_index: 5
        equation: '2'
        note: Reference-state prose immediately following equations (1) and (2)
    - statement_as_printed: Fe0.947O was chosen as a standard state rather than estimated values for stoichiometric FeO because
        the latter yield ferrous iron activities in the melt which exceed unity (see e.g., DOYLE, 1988).
      locator:
        page: 6
        published_page: 308
        pdf_page_index: 5
        equation: '2'
        note: Explicit Fe0.947O versus stoichiometric FeO standard-state choice
    - statement_as_printed: All activities are relative to a solid standard state at temperature.
      locator:
        page: 7
        published_page: 309
        pdf_page_index: 6
        table: '4'
        note: Table 4 caption
    - statement_as_printed: Activity coefficients (γ’s) for NiO, FeO, MgO and Fe2O3 are for the liquid phase and that of Lb
        (= NiSi1/2O2) is for olivine.
      locator:
        page: 7
        published_page: 309
        pdf_page_index: 6
        table: '4'
        note: Table 4 caption
    - statement_as_printed: Relative to the uncertainty in ln a_Fe0.947O, ±20%, the difference between ln a_FeO and ln a_Fe0.947O
        is quite small. Consequently, we have taken ln a_FeO ≈ ln a_Fe0.947O in the subsequent calculations.
      locator:
        page: 6
        published_page: 308
        pdf_page_index: 5
        note: Footnote on relation between stoichiometric FeO and Fe0.947O activities
    equation_2_as_printed: 0.947Fe_alloy + 1/2 O2 = Fe0.947O_solid
    equation_2_locator:
      page: 6
      published_page: 308
      pdf_page_index: 5
      equation: '2'
      note: Fe0.947O solid reference reaction
    equation_4_for_liquid_activity_as_printed: a_Fe0.947O^liq = (a_Fe^alloy)^0.947 f_O2^(1/2) exp(-ΔG°_rxn,2 / RT)
    equation_4_locator:
      page: 6
      published_page: 308
      pdf_page_index: 5
      equation: '4'
      note: Activity calculated from alloy activity, oxygen fugacity, and reaction free energy
    table4_activity_error_as_printed: Estimated errors for the values of ln a_NiO and ln a_Fe0.947O are believed to be 4%
      and 20%, respectively.
    activity_error_locator:
      page: 6
      published_page: 308
      pdf_page_index: 5
      note: Reported estimated activity errors
