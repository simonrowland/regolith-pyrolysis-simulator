context:
- observation_id: sato73_method_equations_and_buffer
  type: method
  locator:
    page: 2
    published_page: 1062
    equations: 1–5
  units: equations as printed
  values:
    method_class: method_only
    emf_relation_as_printed: log fO2 = E (in millivolts)/(0.0496 T (°K)) − 0.68
    emf_relation_description: Equation (1), solid-electrolyte cell relation; T is absolute temperature. Air at 1 atm is the
      internal reference gas for the reference electrode.
    iron_iron_oxide_reaction_as_printed: Fe (in metallic phase) + 1/2 O2 = FeO (in melt)
    iron_iron_oxide_reaction_locator:
      page: 5
      published_page: 1065
      equation: '2'
    log_fo2_activity_relation_as_printed: log fO2 = 2 log aFeO − 2 log aFe − 2 log K
    log_fo2_activity_relation_locator:
      page: 5
      published_page: 1065
      equation: '3'
    metallic_iron_activity_relation_as_printed: log aFe = 1/2[log fO2(rock + iron foil) − log fO2(bulk rock)]
    metallic_iron_activity_relation_locator:
      page: 6
      published_page: 1066
      equation: '4'
    iron_wustite_buffer_relation_as_printed: log fO2 = 6.824 − 27470/T
    iron_wustite_buffer_relation_locator:
      page: 7
      published_page: 1067
      equation: '5'
    iron_wustite_buffer_temperature_range_as_printed: 850–1300 °C
    iron_wustite_buffer_temperature_unit: T in K (absolute temperature)
    iron_wustite_reference_state: Wustite and metallic iron; the authors do not state a wustite stoichiometry for their own
      buffer fit. The discussion calls the iron reference solid metallic iron; no alloy correction is stated for the buffer
      equation.
    buffer_comparison: The authors say alternatives include JANAF (1971), wustite Fe0.947O, and iron-wustite values from Eugster
      and Wones (1962) or Huebner (1971); they also prefer values measured in the same oxygen cell. They give no numerical
      point-by-point comparison with Eugster and Wones or Huebner. They report comparison slopes of −2.75 × 10^4 K−1 for iron-wustite,
      −2.80 × 10^4 K−1 for iron-ulvospinel-ilmenite, and −3.08 × 10^4 K−1 for iron-ilmenite-ferropseudobrookite.
    buffer_comparison_locator:
      page: 7
      published_page: 1067
      note: Experimental Results; page 11, published page 1071, Oxygen fugacity-temperature relations
    uncertainty_as_printed: No uncertainty is printed for Equation (5). The abstract states measurement accuracy was mostly
      better than 0.2 log fO2 unit; the results section says within 0.2 log unit scatter for a given sample, except the first
      heating cycles of Apollo 12 samples, whose anomalously high initial readings were omitted from the visually fitted curves.
    sample_temperature_relations_as_printed: No per-sample log fO2-temperature equation is printed; values in Table 1 were
      read from visually drawn best-fit curves. For bulk-rock log fO2 versus 1/T from 1000 to 1200 °C, the reported slopes
      are −2.8 × 10^4 to −3.1 × 10^4 K−1, except sample 14310 above 1170 °C. The authors compare these with −2.75 × 10^4 K−1
      (iron-wustite), −2.80 × 10^4 K−1 (iron-ulvospinel-ilmenite), and −3.08 × 10^4 K−1 (iron-ilmenite-ferropseudobrookite).
    sample_temperature_relations_locator:
      page: 11
      published_page: 1071
      section: Oxygen fugacity-temperature relations
    measurement_atmosphere_as_printed: Furnace atmosphere was N2 diluent with about 1% CO2 and variable H2, servo-controlled
      to keep its fO2 within about 0.1 log fO2 unit of the sample.
    sample_electrode_foil_as_printed: The capped Ag-Pd foil composition was initially Ag60Pd40 and later Ag40Pd60.
    reference_as_printed: Air at 1 atm was the internal reference gas at the reference electrode.
    reversibility_check_as_printed: The authors compared repeated heating and cooling cycles and report agreement for rock
      15595. Table 1 values were read from visually drawn best-fit curves through measured points. Anomalously high initial
      first-heating readings for Apollo 12 samples were omitted from those curves. The first-heating-cycle statement on p.
      1067 applies to samples 14310,195 and 14310,207; both showed an abrupt, irreversible rise above about 1170 °C.
    reversibility_check_locator:
      page: 3
      published_page: 1063
      section: Experimental Results
      note: Page 7, published page 1067, limits the first-heating statement to the two 14310 chips
    iron_foil_added_for_selected_runs_as_printed: For selected bulk-rock plus iron runs, about 100 mg of previously melted
      sample was measured with 3–4 mg of 99.99% pure iron foil lining the crucible.
    iron_foil_locator:
      page: 2
      published_page: 1062
      section: Experimental Procedure
