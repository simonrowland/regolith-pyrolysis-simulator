    - (MoOᵢ₊₁) = (MoOᵢ) + (O) (9)
    cell_interaction_ions_as_printed:
    - MoO+
    - MoO2+
    - MoO3+
    qualification: The reported MoO ions are attributed to gas interaction with the Mo effusion cell, not simply to sample
      vapor species.
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_al_sio_and_mo_cell_ion_reactions
