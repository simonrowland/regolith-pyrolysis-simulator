- observation_id: shornikov_2001_evaporation_sequence_and_noncongruent_change
  type: interpretation
  locator:
    published_page: 325
    pdf_page_index: 3
    section: Results and Discussion
  units: as printed
  values:
    statements_as_printed:
    - “The first stage of this evaporation was the predominant silica vaporization from the melt placed in the effusion cell.”
    - “This process went so far that the composition of the condensed phase reached the point of magnesium aluminate (or CA,
      or CT, correspondingly) in the crystallization line.”
    - “The vaporization rate of the obtained crystallized solid phase is lower in comparison with the one of the melt evaporation.”
    - “At the next stage the dominant process for the obtained phase compositions is the vaporization of magnesium oxide (or
      CaO) at the further temperature increase.”
    - “The composition of the samples was changed in the line of corundum (or rutile) field having a minor volatility.”
    qualification: The reported vaporization changes sample composition; no post-run composition assay is tabulated.
