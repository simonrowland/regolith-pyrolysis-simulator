- observation_id: shornikov_2001_background_thermodynamic_evidence
  type: interpretation
  locator:
    published_page: 322
    pdf_page_index: 0
    section: Introduction
  units: as printed
  values:
    statements_as_printed:
    - “The wide usage of the refractory materials on the base of spinel ceramics causes a proper interest to the investigations
      of physicochemical properties and phase relations in the MgO-Al2O3-SiO2 system at high temperatures.”
    - “The study of this system is a point of particular interest due to the problems connected with the development of new
      materials with exceptionally low or even negative values of the thermal extension coefficients (1).”
    - “The phase relations in the MgO-Al2O3-SiO2 system and in the corresponding binary systems (MgO-Al2O3, MgO-SiO2, and
      Al2O3-SiO2) were studied several times. However it should be noted that these data shows substantial contradictions
      (1-5).”
    - “The thermodynamic data on MgO-Al2O3-SiO2 system are limited by the properties of ternary compounds at rather low temperatures
      (~1000 K) obtained by the various calorimetric methods (6-10).”
    - “The results of the heterogeneous equilibria studies of slags with Fe-Si-C alloys saturated with graphite or silicon
      carbide at 1873 K (11, 12) did not correlate to the calorimetric data.”
    - “The authors of (5, 13-15) consider the data (11, 12) to be rather doubtful.”
    temperatures_K:
    - 1000
    - 1873
    translation_note: The translation prints “thermal extension coefficients”; retained verbatim.
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_background_thermodynamic_evidence
  work_id: 6277e13c8b853159029dec0d8808f1aee7962f775abafbb72bd800abbb462151
  source_id: shornikov-2001-mgalumina-silica-vaporization
  species: MgO
- observation_id: shornikov_2001_conclusion_evaporation_order
  type: interpretation
  locator:
    published_page: 328
    pdf_page_index: 6
    section: Conclusions
  units: as printed
  values:
    statement_as_printed: “The consideration of the evaporation processes in the melts under study have demonstrated that
      the initial stages of the evaporation are characterized by the predominant evaporation of SiO2, the next stages are
      the MgO evaporation and, finally, the Al2O3 evaporation. The same rules are also characteristic for the previously studied
      CaO-Al2O3-SiO2 and CaO-TiO2-SiO2 system melts.”
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_conclusion_evaporation_order
  work_id: 6277e13c8b853159029dec0d8808f1aee7962f775abafbb72bd800abbb462151
  source_id: shornikov-2001-mgalumina-silica-vaporization
  species: MgO
- observation_id: shornikov_2001_conclusion_ideality_order
  type: interpretation
  locator:
    published_page: 328
    pdf_page_index: 6
    section: Conclusions
  units: as printed
  values:
    statements_as_printed:
    - “The activity values of the components and the Gibbs energies of melt formation determined in the present study have
      showed the negligible negative deviations from ideality.”
    - “This fact is in agreement with the modern considerations on the phase equilibria and the structure of the MgO-Al2O3-SiO2
      melts.”
    - '“The deviations from ideality in the studied systems increase in the following order: MgAl2O4-SiO2 → CaAl2O4-SiO2 →
      CaTiO3-SiO2.”'
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_conclusion_ideality_order
  work_id: 6277e13c8b853159029dec0d8808f1aee7962f775abafbb72bd800abbb462151
  source_id: shornikov-2001-mgalumina-silica-vaporization
  species: MgO
- observation_id: shornikov_2001_constant_current_ratios_and_activity_reduction
  type: method
  locator:
    published_page: 325
    pdf_page_index: 3
    section: Results and Discussion
    equation: 10–14
  units: as printed
  values:
    statements_as_printed:
    - “Another interesting characteristic of the MA-S system vaporization (as well as CA-S and CT-S system melts) is practically
      constant relations of the ion current intensities (I(i)+) over a wide concentration range.”
    - “It should be mentioned that these relations determine the oxygen partial pressure.”
    - “The above mentioned regularities allowed to determine the values of MgO, Al2O3 and SiO2 activities in the MA-S melts
      using the Belton-Fruehan method (20) modifying the Gibbs-Duhem equation.”
    ion_current_ratios_as_printed:
    - I(MgO)+ / I(Mg)+
    - I(AlO)+ / I(Al)+
    - I(SiO2)+ / I(SiO)+
    - I(MoO3)+ / I(MoO2)+
    activity_ion_current_ratios_as_printed:
    - I(Mg)+ / I(SiO)+
    - I(Al)+ / I(SiO)+
    - I(SiO)+ / I(Mg)+
    - I(Al)+ / I(Mg)+
    activity_ions_by_component:
      SiO2:
        current_ratios:
        - I(Mg)+ / I(SiO)+
        - I(Al)+ / I(SiO)+
        equation: '12'
        integration_reference: x(SiO2)=1
      MgO:
        current_ratios:
        - I(SiO)+ / I(Mg)+
        - I(Al)+ / I(Mg)+
        equation: '13'
        anchor: a*(MgO)
      Al2O3:
        inputs:
        - a(MgO)
        - a(SiO2)
        - a*(Al2O3)
        equation: '14'
    derivation_as_printed: '(11), printed p. 325 / PDF page index 3:

      ln a(i) = −∫ x(j) d ln[a(j)/a(i)] − ∫ x(k) d ln[a(k)/a(i)].

      (12), printed p. 326 / PDF page index 4:

      ln a(SiO2) = −∫_[x(SiO2)=1]^[x(SiO2)] [x(MgO)/(1+x(Al2O3))] d ln[I(Mg)+/I(SiO)+] − 2∫_[x(SiO2)=1]^[x(SiO2)] [x(Al2O3)/(1+x(Al2O3))]
      d ln[I(Al)+/I(SiO)+].

      (13), printed p. 326 / PDF page index 4:

      ln a(MgO) = ln a*(MgO) − ∫_[x*(SiO2)]^[x(SiO2)] [x(SiO2)/(1+x(Al2O3))] d ln[I(SiO)+/I(Mg)+] − 2∫_[x*(SiO2)]^[x(SiO2)]
      [x(Al2O3)/(1+x(Al2O3))] d ln[I(Al)+/I(Mg)+].

      (14), printed p. 326 / PDF page index 4:

      ln a(Al2O3) = ln a*(Al2O3) − ∫_[x*(SiO2)]^[x(SiO2)] [x(MgO)/x(Al2O3)] d ln a(MgO) − ∫_[x*(SiO2)]^[x(SiO2)] [x(SiO2)/x(Al2O3)]
      d ln a(SiO2).

      Integral bounds are written as ∫_[lower]^[upper]; + after an ion denotes its printed positive charge, and * denotes
      the printed anchor superscript.

