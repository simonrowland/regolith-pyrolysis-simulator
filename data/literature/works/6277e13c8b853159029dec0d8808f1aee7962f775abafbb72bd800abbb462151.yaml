context:
- observation_id: shornikov_2001_abstract_scope_and_comparison
  type: interpretation
  locator:
    published_page: 322
    pdf_page_index: 0
    section: Abstract
  units: as printed
  values:
    statement_as_printed: “The regularities of the MgAl2O4-SiO2 system melts evaporation were studied at 1623-2523 K using
      the high-temperature mass spectrometric Knudsen effusion method. The obtained thermodynamic data on the MgAl2O4-SiO2
      system melts were compares with the similar data previously determined for the CaAl2O4-SiO2 and CaTiO3-SiO2 system melts.
      The increase of the deviations from the ideal behavior in the following order MgAl2O4-SiO2 → CaAl2O4-SiO2 → CaTiO3-SiO2
      was shown.”
    temperature_range_K:
    - 1623
    - 2523
    systems_compared:
    - MgAl2O4-SiO2
    - CaAl2O4-SiO2
    - CaTiO3-SiO2
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_abstract_scope_and_comparison
  work_id: 6277e13c8b853159029dec0d8808f1aee7962f775abafbb72bd800abbb462151
  source_id: shornikov-2001-mgalumina-silica-vaporization
  species: MgO
- observation_id: shornikov_2001_activity_comparisons_and_ideality
  type: interpretation
  locator:
    published_page: 326
    pdf_page_index: 4
    section: Results and Discussion
  units: as printed
  values:
    statements_as_printed:
    - “According to Fig 2a the maximal value of the alkaline-earth oxide (MgO or CaO) activity in the ternary silicate systems
      under investigation was determined for the MA-S system.”
    - “It should be mentioned that due to nearly the same values of the activities of aluminum oxide (or titanium dioxide)
      and silicon dioxide (Figs. 2b and c), the alkaline-earth activities values determine the deviations from ideality (Fig.
      3).”
    - “The activity values vs concentration dependencies maxima of aluminum oxide (or titanium dioxide) for the CA-S (or CT-S)
      melts are caused to all appearance by the closeness of A + L (or CTS + L) fields.”
    - “For the MA-S melts such closeness of the A3S2 + L field doesn't effect a(Al2O3) due to the value of the melting enthalpies
      of these compositions.”
    translation_note: The sentence beginning “The activity values vs concentration dependencies maxima” and the printed “doesn’t
      effect” are retained as translated; the first sentence is grammatically unclear.
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_activity_comparisons_and_ideality
  work_id: 6277e13c8b853159029dec0d8808f1aee7962f775abafbb72bd800abbb462151
  source_id: shornikov-2001-mgalumina-silica-vaporization
  species: MgO
- observation_id: shornikov_2001_activity_reference_anchor
  type: method
  locator:
    published_page: 326
    pdf_page_index: 4
    section: Results and Discussion
    equation: 12–14
  units: as printed
  values:
    statement_as_printed: “where a*(i) - is the activity of the i component of the MA compound crystallized from the MA-S
      melt at the concentration equal to x*(i). The values of x*(i) were determined according to the experimental data on
      the melts vaporization as well as in (5) and this value equal to 34.08 ± 0.18 mole % SiO2 at 2050 K.”
    x_star_SiO2_mole_percent: '34.08'
    x_star_uncertainty_mole_percent: '0.18'
    temperature_K: 2050
    standard_state_note: Equations (13) and (14) anchor the MgO and Al2O3 activities to those oxide components in crystallized
      MA at x*(SiO2)=34.08 ± 0.18 mole % SiO2 and 2050 K. Equation (12) instead integrates SiO2 activity from x(SiO2)=1; the
      equation does not explicitly state a solid or liquid phase for that endpoint.
    activity_reference_states_by_component:
      MgO: Activity of the MgO component in MA crystal at x*(SiO2)=34.08 ± 0.18 mole % and 2050 K.
      Al2O3: Activity of the Al2O3 component in MA crystal at x*(SiO2)=34.08 ± 0.18 mole % and 2050 K.
      SiO2: Equation (12) integration reference x(SiO2)=1; pure-endpoint phase is not explicitly stated.
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_activity_reference_anchor
  work_id: 6277e13c8b853159029dec0d8808f1aee7962f775abafbb72bd800abbb462151
  source_id: shornikov-2001-mgalumina-silica-vaporization
  species: MgO
