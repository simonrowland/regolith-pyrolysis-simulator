    section: Results and Discussion
  units: as printed
  values:
    statements_as_printed:
    - “The values of the silica activities in the ternary system under study are close, the deviations were identified for
      the compositions of the SiO2 mole fraction less then 30 mole % (Fig. 2c).”
    - “The determined values of the Gibbs energies of melt formation (ΔfG) for the MA-S system are close to ideality.”
    - “These data correlate with the phase relationships and the structure of MgO-Al2O3-SiO2 melts (1, 4).”
    - “The observed minimums for ΔfG concentration dependencies in CA-S and CT-S (Fig. 3) correspond to the concentrations
      close to gehlenite C2AS and sphene CTS (Figs. 1b and 1c).”
    - '“The deviations from ideality in the studied systems increase in the following order: MA-S → CA-S → CT-S.”'
    translation_note: The source prints “less then 30”; retained.
