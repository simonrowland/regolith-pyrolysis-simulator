- observation_id: shornikov_2001_alumina_activity_disagreement
  type: interpretation
  locator:
    published_page: 326
    pdf_page_index: 4
    section: Results and Discussion
  units: as printed
  values:
    statements_as_printed:
    - “A point that should be mentioned is that the values of the aluminum oxide activities obtained in the present work are
      nearly ten times lower that the ones reported in (11).”
    - “The reason of such discrepancies could be explained by the rough approximations done in (11) by the Schuhmann method
      (21).”
    - “The effect of such approximations was previously discussed for mullite (5, 15, 19).”
    - “Notice that for the ternary MA-S system the thermodynamic data on spinel MA reported in (11) also contradict the most
      of reference data.”
    attribution: The comparison and criticism concern reference (11), identified in the references as Rein and Chipman (1965).
    translation_note: The source prints “lower that” and “contradict the most”; wording retained.
  context_id: shornikov-2001-mgalumina-silica-vaporization::context::shornikov_2001_alumina_activity_disagreement
