schema_version: melt-activity-bench.v1
title: SF04 in-domain basalt probes, model anchors, and experimental melt targets
provenance:
  literal_basalt_empirical_point_count: 0
  note: >-
    The repository holds no direct empirical melt-activity measurements for the
    four literal SF04 basalt sheets. SF04 workbook pressures are model outputs,
    not experiments. Richter-2007 supplies six convention-usable experimental
    gamma targets for an in-domain Type-B CAI-like CMAS melt; they are kept in
    a separate population and never relabelled as basalt measurements.
    Hastie-1981 supplies six scored K and SiO KEMS pressures for a separate
    in-domain silicate composition with an IW+2.4 oxygen-fugacity pin.
    Tsaplin-2000 supplies 12 scored SiO2 activity targets from Na2O-SiO2
    binary melts; its 12 measured Na2O activities are retained but held from
    scoring pending an authoritative oxide-basis engine result.
    Yamaguchi-1983 supplies 28 scored SiO2 activity targets from seven
    Na2O-SiO2 binary melts at four frozen temperature nodes. The published
    Tridymite-reference activities are retained alongside controller-directed
    liquid-reference conversions. Its 42 measured Na2O activities are retained
    but held from scoring pending an authoritative oxide-basis engine result.
  sources:
    - data/literature/extracts/kems-008-schaefer-fegley-2004.yaml
    - data/literature/extracts/kems-010-richter-2007.yaml
    - tests/fixtures/imcc_sf04_magma_workbook.csv
    - data/melt_activity/reference/imcc-magma-model-v1.csv
    - data/melt_activity/reference/vaporock-magma-kems-v1.csv
    - docs/references/pdfs/99-kems-langmuir/ms2000-044.pdf
    - docs/references/pdfs/99-kems-langmuir/yam1983.pdf
  composition_transform: >-
    Fe2O3 folded into FeO with FeO += 0.8998102538090137*Fe2O3;
    H2O, P2O5, MnO, and other components outside the published eight-parent
    IMCC basis dropped explicitly; retained oxides renormalized to 100 wt%.
packs:
  imcc-published: data/melt_activity/imcc/imcc-sf04-v1.0.2.json
  imcc-ext: data/melt_activity/imcc/imcc-sf04-ext-v1.json
  promoted_research_packs:
    - data/melt_activity/imcc/imcc-sf04-ext-v2.json
    - data/melt_activity/imcc/imcc-sf04-ext-v3.json
    - data/melt_activity/imcc/imcc-sf04-ext-v4.json
reference_anchors:
  imcc_magma:
    path: data/melt_activity/reference/imcc-magma-model-v1.csv
    source_sha256: 81187b97fda64519033ac677aa748591836c328a43939df904035a6e0145bf61
    tracked_sha256: 513fef7b801f09b1c7a34b5f7b13b53c0832a94dec32141bd1c55ad0e5f7b265
    selection: SF04 tho/aba/kom/dun; SiO2/FeO/Fe/Mg/SiO/K/Na/O2
  vaporock_magma_kems:
    path: data/melt_activity/reference/vaporock-magma-kems-v1.csv
    source_sha256: eac513d6bfbc93fb595776b381d2a8b4c217bd693037f5a54d001b2a29bc2ccc
    tracked_sha256: 822c7a881c4f7ee2820c43421e430dc04455457d110c7a6480a42dfe1753151d
    selection: SF04 model_model_MAGMA rows plus all experimental_KEMS rows
  shared_join: [sheet, species, T_K]
  expected_shared_cells: 288
  expected_non_alkali_pooled_rmse_dex:
    imcc: 0.274
    vaporock: 0.503
fair_comparison:
  residual: log10(predicted/measured)
  gas_layer: >-
    For partial-pressure or flux observations, every engine's parent-formula
    oxide activity is converted to the rail's single-cation component basis,
    then passed through the same tracked analytical gas layer at the point's
    pinned fO2. An engine's internally coupled gas result is never substituted
    into that population.
  direct_activity: Compare pure-liquid-standard-state activity directly.
  activity_coefficient: >-
    Compare gamma=a/x on the named parent-oxide formula-unit basis; adapters
    reporting single-cation gamma and mole fraction must convert both first.
