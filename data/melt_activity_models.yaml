schema_version: 1
kind: melt_activity_models
description: >-
  t-568 Phase-0/1 typed melt-activity registry. Phase 1 is shadow-only; no row
  changes vapor-pressure, flux, ledger, or certification authority.

target_standard_state:
  selection_policy: per_row_exact
  id_template: rail.pure_oxide.{component_id}.raoultian.supercooled_liquid_at_T.1bar.v1
  convention: raoultian_pure_endmember
  phase: liquid
  reference_pressure_bar: 1.0
  reference_temperature_policy: queried_T
  component_basis: raoultian_pure_endmember
  b154_crystalline_overrides: [CaO, MgO]
  b154_crystalline_id_template: rail.pure_oxide.{component_id}.raoultian.crystalline_at_T.1bar.v1
  b154_adjudication_commit: 7c8a7f695a479074be97daa969881896d562464c

matrix_domains:
  matrix_domain.silicate_melt.phase1.v1: &matrix_domain
    matrix_class_id: complex_silicate_melt
    composition_basis: ordered_complete_mole_inventory
    hull_status: not_yet_admitted
    descriptor_ranges: {}
    digest: sha256:pending-phase2-matrix-domain

templates:
  pending_domain: &pending_domain
    T_K: [1473.15, 1903.15]
    P_bar: [0.0, 1.0]
    matrix_domain_ref: matrix_domain.silicate_melt.phase1.v1
    redox_basis: complete_inventory_with_intrinsic_fO2_when_required
    phase_requirement: liquid_melt
    full_melt_inventory_required: true
    unmodeled_reservoir_policy: refuse_if_nonzero
  pending_band: &pending_band
    space: ln_activity
    lower_offset: null
    upper_offset: null
    marginal_sigma_ln: null
    independent_sigma_ln: null
    correlation_loadings: []
    correlation_basis_ref: null
    coverage: null
    kind: validation_band_unavailable
  pending_provenance: &pending_provenance
    review_status: reviewed_architecture_pending_numeric_evidence
    extract_loci: []
    source_digest: sha256:pending-phase2-primary-evidence
  pending_validation: &pending_validation
    calibration_family_ids: []
    holdout_ids: []
    residual_metric: p95_abs_ln_activity
    result: pending
    certification_ceiling: status_bearing

