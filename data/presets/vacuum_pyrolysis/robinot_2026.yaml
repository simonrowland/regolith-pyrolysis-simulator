trajectory_comparison:
  corpus_branch: w1119fig4-robinot-2026-f4
  corpus_commit: 0269321364cb71577205e7de678588eb9f735aca
  grid_interval_min: 0.5
  grid_end_min: 59.5
  grid_resampling: piecewise_linear_value_and_digitization_uncertainty
  resolution_rationale: >-
    The corpus retains native samples at about 0.046 min. This compact grid
    keeps two points per minute across the approximately 60 min run and
    resolves the observed minute-scale O2 peaks; the corpus pointer retains
    the full native trace for finer comparisons.
  source_pins:
    f4a_csv:
      path: tables/kems-044-robinot-2026/f4a.csv
      sha256: bbd49c4c352736fc3f7e5f108751833ca4e8ea47f41cda11d7038a4aa6831aa4
    f4a_provenance:
      path: tables/kems-044-robinot-2026/f4a.provenance.yaml
      sha256: 3e2792fc8a42377b9463e2b370f12e23de78e50cba3fec84f179365024163029
    f4b_csv:
      path: tables/kems-044-robinot-2026/f4b.csv
      sha256: 8274bf25c225723a9221e0b5c37fa4c2dd50c15f5e7b517aafee54e7c1aedc7e
    f4b_provenance:
      path: tables/kems-044-robinot-2026/f4b.provenance.yaml
      sha256: f71dc8fd252d91a62e839426d74c7b05137ca3cffd64ae192d95d1ed479bdcab
  # Owner ruling d-453 (2026-11-19) permits public figure digitizations.
  # For both O2 traces, each point stores digitization u and the analyzer term
  # (2% of the absolute reading) separately; combined u = sqrt(u_digit^2 +
  # u_analyzer^2). This preserves the paper uncertainty instead of folding it
  # into the digitization column. Power has digitization uncertainty only.
  observables:
    - observable_id: robinot_o2_ppm_time_series
      quantity: oxygen_mole_fraction
      species: O2
      units: ppm
      source_pin: f4a_csv
      provenance_pin: f4a_provenance
      provenance_section: prose_anchor_checks
      series_semantics: rate
      source_series: O2 concentration
      point_fields: [time_min, time_uncertainty_min, expected_value, digitization_uncertainty, analyzer_uncertainty, combined_uncertainty]
      points:
        - [0.000000, 0.143000, 0.000000, 29.011464, 0.000000, 29.011464]
        - [0.500000, 0.143000, -0.254889, 29.011464, 0.005098, 29.011464]
