# LOCKED membership map_version=v9 — see MEMBERSHIP LOCK contract below.
# Authority: docs-private/research/2026-07-19-plant-flowsheet/spec.md (v7 + v8 delta).
# Schema version 1. Renderer: scripts/render_flowsheet.py
#
# ---------------------------------------------------------------------------
# SCHEMA (inline contract)
# ---------------------------------------------------------------------------
# schema_version: int
# title: str
# description: str (optional)
#
# layout:
#   mode: bubble_bfd          # fixed 4-column + terminal rump (v3 layout)
#   columns: [id, ...]        # left→right column order; terminal is last
#
# blocks:                     # top-level sibling bubbles (+ terminal rump)
#   - id: str                 # stable key (edge endpoints, UI data-bin parent)
#     title: str
#     role: column | terminal # column = one of the four siblings; terminal = RUMP
#     operating_conditions: str
#     annotations: [str]      # free text captions inside the bubble
#     sub_boxes:              # nested product/process stations
#       - id: str             # bin id (UI data-bin)
#         title: str
#         kind: product | process | storage   # visual hint only
#         operating_conditions: str?
#         annotations: [str]?
#         species:            # chips (each species symbol appears once globally)
#           - symbol_or_group: str
#             status: reviewed | conditional
#             condition_note: str?   # required semantics when status=conditional
#             review: {map: "v7"|"v8", finding: str?}?  # provenance; optional
#         admission:          # bin-gate predicate over species FACT fields (not physics values)
#           any_of: [clause, ...]   # OR of field-match clauses
#           all_of: [clause, ...]   # AND of field-match clauses
#           mode_fork: c0?          # annotation: C0 lance/reduce fork applies
#           # clause keys (fact field refs): goldschmidt_class, family, host_phase,
#           #   reductant_class, reducibility, volatile_as, window, mode, form,
#           #   product, element, redox_split, sulfide_affinity
#         # Future PFD seams (optional, ignored by bubble renderer):
#         equipment_tag: str?
#
# edges:
#   - id: str?                # optional stable stream id for future PFD numbering
#     from: str               # block or sub_box id
#     to: str
#     class: main | oxygen | reagent_return
#     label: str?
#     # Future PFD seams:
#     stream_tag: str?        # e.g. "S-12"
#     phase: str?
#
# legend:
#   - key: str
#     label: str
#     style: chip_reviewed | chip_conditional | edge_main | edge_oxygen | edge_reagent_return
#
# aggregates:                 # honest lint membership when a chip is a group
#   - chip: str               # symbol_or_group on the flowsheet
#     members: [str]          # species ids that route into that aggregate chip
#     note: str?
#
# notes: [str]
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# MEMBERSHIP LOCK (two-touch bump ritual)
# ---------------------------------------------------------------------------
# map_version + locked + locked_at define the frozen membership contract.
# Membership changes (add/remove/move chip, change status/condition_note, or
# aggregate members) REQUIRE BOTH:
#   1. bump map_version (vN → vN+1)
#   2. re-pin MEMBERSHIP_LOCK_HASH in tests/test_flowsheet_asset.py
# Layout, annotations, edges, labels, and operating_conditions do NOT touch
# the membership hash — edit those freely without a version bump.
# ---------------------------------------------------------------------------

map_version: "v9"
locked: true
locked_at: "2026-07-20"

schema_version: 1
title: Plant flowsheet — solar furnace multiphase pyrolysis
description: >
  Bubble block-flow diagram (BFD) of the physical plant. Four sibling top-level
  blocks left→right, melt spine through them, RUMP terminal at right. Species
  chips follow the v7 reviewed map: solid border = reviewed default home;
  dashed border = conditional (host/mode/conversion gate). Oxygen paths orange;
  reagent/oxide returns dashed.

layout:
  mode: bubble_bfd
  columns:
    - early_bake_cleanup
    - bernoulli_overhead
    - mg_dome
    - ca_dome
    - rump

blocks:
  - id: early_bake_cleanup
    title: EARLY BAKE · CLEANUP
    role: column
    operating_conditions: "Phase 1 · ≤900 °C · gas-rich · O₂ lance ⤵ roast vs reduce (mode fork)"
    annotations:
      - "C0 mode fork: O₂ lance ⤵ roast (sulfide→SO₂+oxide) vs reduce (chondritic flash)"
      - "Volatile-metal trap staged warmer ahead of cryo train"
    sub_boxes:
      - id: volatile_metal_trap
        title: VOLATILE-METAL TRAP
        kind: product
        operating_conditions: "Staged, warmer; host + C0 mode decide capture"
        annotations:
          - "ZnO holds under lance → later metal-condenser window"
          - "MoO₃/WO₃/Re₂O₇ = lance-only oxide branches"
        admission:
          any_of:
            - {volatile_as: metal, window: trap_band}
            - {volatile_as: oxide, mode: lance}
          mode_fork: c0
        species:
          - {symbol_or_group: Zn, status: reviewed, review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Cd, status: reviewed, review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Pb, status: reviewed, review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Tl, status: reviewed, review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Bi, status: reviewed, review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: In, status: conditional, condition_note: "needs proved volatile species or VP", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Ag, status: conditional, condition_note: "volatile form; native Fe-pool path may prefer ferroalloy", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Sn, status: conditional, condition_note: "volatile form; native Fe-pool path may prefer ferroalloy", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Ge, status: conditional, condition_note: "volatile form; native Fe-pool path may prefer ferroalloy", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Se, status: conditional, condition_note: "chalcophile host / mode gate", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Sb, status: conditional, condition_note: "chalcophile host / mode gate", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: As, status: conditional, condition_note: "chalcophile host / mode gate", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Te, status: conditional, condition_note: "chalcophile host / mode gate", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Cu, status: conditional, condition_note: "volatile/sulfide branch; metal pool may prefer ferroalloy", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Ga, status: conditional, condition_note: "surface-correlated film / VP gate", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Hg, status: conditional, condition_note: "CI/CM body overlay; volatile capture", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: MoO3, status: conditional, condition_note: "lance-only oxide branch", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: WO3, status: conditional, condition_note: "lance-only oxide branch", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
          - {symbol_or_group: Re2O7, status: conditional, condition_note: "lance-only oxide branch", review: {map: "v7", finding: "thermo T27-T29; speciation F5/F10/F14-F19; consistency F10; body-sweep DIFF-A"}}
      - id: cryo_train
        title: CRYO TRAIN
        kind: product
        operating_conditions: "Cold trap · captured volatiles"
        annotations:
          - "P not blanket C0 (phosphate stays; schreibersite→Fe)"
          - "H/He/N: solar-wind / body overlay (conditional)"
          - "Elemental C does not volatilize <900 °C — carbon leaves as CO/CO₂/CH₄/COS gases"
        admission:
          any_of:
            - {window: cryo}
            - {volatile_as: gas, window: cryo}
            - {family: halogen}
            - {family: volatile-gas}
        species:
          - {symbol_or_group: H2O, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: CO2, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: S, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: SO2, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: F, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: Cl, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: Br, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: I, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: salts, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: organics, status: reviewed, review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          # P primary home is ferroalloy (schreibersite); cryo only after proved conversion (condition_note there).
          - {symbol_or_group: H, status: conditional, condition_note: "implanted solar-wind / body overlay", review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          - {symbol_or_group: He, status: conditional, condition_note: "implanted solar-wind / body overlay", review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}
          # v8: bare elemental C removed — C does not volatilize <900 °C as the element
          - {symbol_or_group: CO-CH4-organics, status: conditional, condition_note: "chondritic/solar-wind carbon leaves as CO/CO2/CH4/COS pyrolysis gases (not elemental C)", review: {map: "v8"}}
          - {symbol_or_group: N, status: conditional, condition_note: "implanted solar-wind / body overlay", review: {map: "v7", finding: "speciation F7/F22-F23; consistency F3; body-sweep DIFF-B"}}

  - id: bernoulli_overhead
    title: BERNOULLI · OVERHEAD GAS
    role: column
    operating_conditions: "Phase 2 · ≤1843 °C · 1–5 mbar N₂ · hot walls"
    annotations:
      - "Alkali cyclone → Fe condenser → SiO baffles → gas conditioning → O₂ pump/frost cistern"
      - "Dashed: Na/K shuttle ↺; buffer-gas recirculation ↺ from terminal"
    sub_boxes:
      - id: alkali_cyclone
        title: ALKALI CYCLONE
        kind: product
        operating_conditions: "~1150 °C class alkali cut"
        annotations:
          - "Na/K cannot reduce Li₂O at 1150 °C; free/native Li may leave here"
        admission:
          any_of:
            - {family: alkali}
            - {volatile_as: metal, window: alkali_band}
        species:
          - {symbol_or_group: Na, status: reviewed, review: {map: "v7", finding: "thermo T5; speciation F8; consistency F17"}}
          - {symbol_or_group: K, status: reviewed, review: {map: "v7", finding: "thermo T5; speciation F8; consistency F17"}}
          - {symbol_or_group: Rb, status: reviewed, review: {map: "v7", finding: "thermo T5; speciation F8; consistency F17"}}
          - {symbol_or_group: Cs, status: reviewed, review: {map: "v7", finding: "thermo T5; speciation F8; consistency F17"}}
          - {symbol_or_group: Li, status: conditional, condition_note: "free/native Li only; residual Li₂O waits for Mg-C6 / crown tail", review: {map: "v7", finding: "thermo T5; speciation F8; consistency F17"}}
      - id: ferroalloy_tap
        title: Fe CONDENSER · FERROALLOY
        kind: product
        operating_conditions: "Bottom tap · density-driven metal pool"
        annotations:
          - "Metal/native + Fe-pool first; oxide/lance do not inherit"
          - "Cr/Mn: native→Fe; oxidic→C6; spinel→rump"
        admission:
          any_of:
            - {goldschmidt_class: siderophile}
            - {reductant_class: already-native}
            - {host_phase: metal}
        species:
          - {symbol_or_group: Fe, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Ni, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Co, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Ru, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Rh, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Pd, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Re, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Os, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Ir, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Pt, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Au, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Mo, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: W, status: reviewed, review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Cr, status: conditional, condition_note: "native/alloy/sulfide host only; oxidic Cr → C6", review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: Mn, status: conditional, condition_note: "native/alloy/sulfide host; Mn vapor/Mg-crown tail remains conditional", review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          - {symbol_or_group: P, status: conditional, condition_note: "schreibersite follows Fe; cryo only after proved conversion; residual reducible P may form AlP at C6", review: {map: "v7", finding: "thermo T3/T28-T29; speciation F14/F21; consistency F10/F14; body-sweep DIFF-A"}}
          # Ag/Sn/Ge/Cu primary chips live on volatile-metal trap (cond); native Fe-pool alternate noted there.
      - id: sio_glass
        title: SiO BAFFLES · SiO-GLASS
        kind: product
        operating_conditions: "Silica glass major stream"
        annotations:
          - "B/Ga trace placement remains UNCERTAIN — no reviewed trace chip"
        admission:
          any_of:
            - {form: sio_glass}
        species:
          - {symbol_or_group: glass, status: reviewed, review: {map: "v7", finding: "speciation F17-F18"}}
      # v8: non-condensable gas conditioning between SiO baffles and O₂ terminal
      - id: melt_taps
        title: FURNACE MELT TAPS
        subtitle: "melt-side product exits — not overhead-gas stages"
        kind: product
        admission:
          any_of:
            # Fe⁰: the shuttle exit — FeO reducible by the Na/K reductant class
            # (Ellingham sense-1: alkali oxides more stable than FeO in the
            # staged-cool window), drained as liquid metal, not vapor.
            - {reducibility: shuttle_reducible, form: native_metal_liquid}
            # Si⁰: deep-reduction campaign product; liquid Si floats (top skim).
            - {reducibility: deep_reduction_only, form: native_metal_liquid}
        # v9: the two melt-side exits the v7 map omitted (owner 2026-07-20).
        # Fe⁰: the North Star's SECOND Fe exit — Na/K shuttle reduces FeO in the
        # melt; liquid Fe drains from the melt bottom at lower T than the
        # Fe-vapor window (distinct from the Fe condenser pool).
        # Si⁰: deep-reduction route — liquid Si (ρ≈2.57) floats on the denser
        # silicate melt (~2.7) → top skim.
        species:
          - {symbol_or_group: "Fe⁰", status: reviewed, review: {map: "v9"}}
          - {symbol_or_group: "Si⁰", status: conditional, condition_note: "deep-reduction campaign only; floats → top skim", review: {map: "v9"}}
        notes:
          - "Fe⁰ bottom tap: shuttle-reduced liquid iron, drains at melt bottom (2nd Fe exit, lower T than the vapor window)"
          - "Si⁰ top skim: ρ 2.57 vs melt ~2.7 — reduced Si floats; campaign-gated"

      - id: gas_conditioning
        title: GAS CONDITIONING (non-condensables)
        kind: process
        operating_conditions: "Non-condensable cleanup before O₂ pump / frost cistern"
        annotations:
          - "P cold trap ~280 °C BEFORE compressors; CO oxidized to CO₂; CO₂ frosts 195 K upstream of 90 K LOX"
        admission:
          any_of:
            - {window: gas_conditioning}
            - {volatile_as: gas, noncondensable: true}
        species:
          - {symbol_or_group: CO2-CO, status: conditional, condition_note: "refractory-char burnout >900 °C; char survives C0, burns via melt O₂ / reduces FeO per REF-020", review: {map: "v8"}}
          - {symbol_or_group: P2-PO, status: conditional, condition_note: "phosphate reduction >~1100 °C", review: {map: "v8"}}
      - id: lox_cistern
        title: O₂ PUMP → FROST CISTERN
        kind: storage
        operating_conditions: "Kr first-cut (~119.7 K) → selective O₂ extraction → frost cistern; N₂ recirculates warm"
        annotations:
          - "selective O₂ extraction (YSZ electrochemical pump ~0.5–1 kWh/kg, or zeolite VSA); Kr buffer condenses first at 119.7 K (~30 K above LOX) and recirculates after recovery; N₂ stays gaseous through LOX and recirculates warm; Ar is legacy-only because its 87.3 K boiling point sits ~3 K from LOX"
          - "O₂ split: cistern / vented / gettered (future); cistern→lance is a plant fact"
        admission:
          all_of:
            - {product: oxygen}
        species:
          - {symbol_or_group: O2, status: reviewed, review: {map: "v7", finding: "v7 O2 terminal; v8 frost-cistern form"}}

  - id: mg_dome
    title: Mg DOME
    role: column
    operating_conditions: "Phase 3 · ballistic open-to-sky · melt ~1750 °C · dome ~550 K fins to sky"
    annotations:
      - "Cover gas: Ar while dosing Mg (not N₂ — nitride risk)"
      - "Purity ∝ completeness of prior Fe/Si/alkali/trace cuts"
      - "Impurity vector (caption, not chips): Fe · SiO · Na/K · Mn · Li · P · getter-MgO"
    sub_boxes:
      - id: mg_crown
        title: Mg CROWN
        kind: product
        operating_conditions: "~550 K condenser"
        admission:
          all_of:
            - {element: Mg}
        species:
          - {symbol_or_group: Mg, status: reviewed, review: {map: "v7", finding: "thermo T22-T24/T37; speciation F6/F8/F26; consistency F6"}}
      - id: c6_magnesiothermic
        title: C6 MAGNESIOTHERMIC
        kind: product
        operating_conditions: "In-melt dosing · multi-oxide {TiO₂ then Al₂O₃} · top skim Al·Ti"
        annotations:
          - "Primary Ti route → Al–Ti master alloy"
          - "VOx → Al-Ti-V; Nb/Ta compete at C6"
          - "Impurity caption: Fe·Si·Cr·Mn·AlP·MgS"
          - "ZrO₂ not Mg-reducible → rump"
        admission:
          all_of:
            - {reducibility: mg_reducible}
        species:
          - {symbol_or_group: Al, status: reviewed, review: {map: "v7", finding: "thermo T3/T7-T14; speciation F1/F7/F9/F13; consistency F1/F4-F5"}}
          - {symbol_or_group: Ti, status: reviewed, review: {map: "v7", finding: "thermo T3/T7-T14; speciation F1/F7/F9/F13; consistency F1/F4-F5"}}
          - {symbol_or_group: V, status: reviewed, review: {map: "v7", finding: "thermo T3/T7-T14; speciation F1/F7/F9/F13; consistency F1/F4-F5"}}
          - {symbol_or_group: Nb, status: reviewed, review: {map: "v7", finding: "thermo T3/T7-T14; speciation F1/F7/F9/F13; consistency F1/F4-F5"}}
          - {symbol_or_group: Ta, status: reviewed, review: {map: "v7", finding: "thermo T3/T7-T14; speciation F1/F7/F9/F13; consistency F1/F4-F5"}}

  - id: ca_dome
    title: Ca DOME
    role: column
    operating_conditions: "Phase 4 · gen-2 skull pot · 2300–2500 K · dome ~670 K · Ar cover"
    annotations:
      - "Swap domes · raise bake temperature (phase 3→4)"
      - "Melt arrives TiO₂-free after C6 → clean Ca crown (no TiO(g) tail as design default)"
    sub_boxes:
      - id: ca_crown
        title: Ca CROWN
        kind: product
        operating_conditions: "~670 K condenser · alkaline-earth + Eu/Yb concentrate"
        annotations:
          - "No V chip (primary V is C6)"
          - "Sr/Ba residual can flash to calciothermic loop"
        admission:
          any_of:
            - {family: alkaline-earth}
            - {redox_split: divalent_ree}
        species:
          - {symbol_or_group: Ca, status: reviewed, review: {map: "v7", finding: "speciation F4/F11/F25; consistency F1/F7-F8"}}
          - {symbol_or_group: Sr, status: reviewed, review: {map: "v7", finding: "speciation F4/F11/F25; consistency F1/F7-F8"}}
          - {symbol_or_group: Ba, status: reviewed, review: {map: "v7", finding: "speciation F4/F11/F25; consistency F1/F7-F8"}}
          - {symbol_or_group: Eu, status: reviewed, review: {map: "v7", finding: "speciation F4/F11/F25; consistency F1/F7-F8"}}
          - {symbol_or_group: Yb, status: reviewed, review: {map: "v7", finding: "speciation F4/F11/F25; consistency F1/F7-F8"}}
      - id: calciothermic
        title: CALCIOTHERMIC
        kind: product
        operating_conditions: "Ca-reduction mirror of C6 · gas cover · radiological product flag"
        annotations:
          - "REE·Y + Th·U (radiological product flag)"
          - "Residual Nb/Ta/Sr/Ba only if not earlier cut"
          - "Ti removed: primary Ti is C6"
        admission:
          any_of:
            - {reducibility: ca_reducible}
            - {family: REE}
            - {family: actinide}
        species:
          - {symbol_or_group: REE, status: reviewed, review: {map: "v7", finding: "thermo T12/T16-T18; speciation F11-F13/F16/F24; consistency F4/F8-F9"}}
          - {symbol_or_group: Y, status: reviewed, review: {map: "v7", finding: "thermo T12/T16-T18; speciation F11-F13/F16/F24; consistency F4/F8-F9"}}
          - {symbol_or_group: Th, status: reviewed, review: {map: "v7", finding: "thermo T12/T16-T18; speciation F11-F13/F16/F24; consistency F4/F8-F9"}}
          - {symbol_or_group: U, status: reviewed, review: {map: "v7", finding: "thermo T12/T16-T18; speciation F11-F13/F16/F24; consistency F4/F8-F9"}}
          # Residual conditional chips Nb,Ta,Sr,Ba live at C6 / Ca-crown primaries.
          # Listed here only via annotations + aggregates membership for lint honesty.

  - id: rump
    title: RUMP
    role: terminal
    operating_conditions: "Freezes out → refractory liner for the next furnace"
    annotations:
      - "+Zr strengthens liner (ZrO₂ not Mg-reducible)"
      - "Calciothermic-candidate conflict for some refractories is not silently folded"
    sub_boxes:
      - id: rump_product
        title: RUMP RESIDUE
        kind: product
        # v8 addendum 2: rump chips render as OXIDES — this is the unreduced-oxide
        # ceramic floor; a chip here = the oxide that nothing could reduce or
        # volatilize (opposite of every other bin's captured-reduced-form chips).
        admission:
          all_of:
            - {reducibility: not_reducible}
        species:
          - {symbol_or_group: BeO, status: reviewed, review: {map: "v7", finding: "thermo T10-T11/T15; speciation F20; consistency F11/F16"}}
          - {symbol_or_group: ZrO2, status: reviewed, review: {map: "v7", finding: "thermo T10-T11/T15; speciation F20; consistency F11/F16"}}
          - {symbol_or_group: HfO2, status: reviewed, review: {map: "v7", finding: "thermo T10-T11/T15; speciation F20; consistency F11/F16"}}
          - {symbol_or_group: Sc2O3, status: reviewed, review: {map: "v7", finding: "thermo T10-T11/T15; speciation F20; consistency F11/F16"}}
          - {symbol_or_group: unreduced-residuals, status: conditional, condition_note: "spinel/chromite/inaccessible oxide residue", review: {map: "v7", finding: "thermo T10-T11/T15; speciation F20; consistency F11/F16"}}
        notes:
          - "all species as oxides — refractory ceramic (CaO·Al2O3·REE-oxide bulk + these); liner feedstock for the next furnace"
          - "carbides/nitrides excluded by design: char burned out upstream; domes run Ar not N2"

# Melt spine + product/oxygen/return edges.
# Optional id / stream_tag reserved for future PFD numbering (not rendered now).
edges:
  # Melt spine (main)
  - {id: e_feed, from: feed, to: early_bake_cleanup, class: main, label: "regolith feed"}
  - {id: e_melt_1_2, from: early_bake_cleanup, to: bernoulli_overhead, class: main, label: "melt spine"}
  - {id: e_melt_2_3, from: bernoulli_overhead, to: mg_dome, class: main, label: "melt spine"}
  - {id: e_melt_3_4, from: mg_dome, to: ca_dome, class: main, label: "swap domes · raise T"}
  - {id: e_melt_4_r, from: ca_dome, to: rump, class: main, label: "freeze-out"}

  # Phase-internal product offtakes (main)
  - {id: e_vmt_out, from: early_bake_cleanup, to: volatile_metal_trap, class: main, label: "volatile metals"}
  - {id: e_cryo_out, from: early_bake_cleanup, to: cryo_train, class: main, label: "gas → cryo"}
  - {id: e_alk_out, from: bernoulli_overhead, to: alkali_cyclone, class: main, label: "alkali vapor"}
  - {id: e_fe_out, from: bernoulli_overhead, to: ferroalloy_tap, class: main, label: "Fe metal"}
  - {id: e_sio_out, from: bernoulli_overhead, to: sio_glass, class: main, label: "SiO"}
  - {id: e_gas_cond_out, from: bernoulli_overhead, to: gas_conditioning, class: main, label: "non-condensables"}
  - {id: e_lox_out, from: bernoulli_overhead, to: lox_cistern, class: oxygen, label: "O₂ → frost cistern"}
  - {id: e_mg_crown, from: mg_dome, to: mg_crown, class: main, label: "Mg vapor"}
  - {id: e_c6, from: mg_crown, to: c6_magnesiothermic, class: main, label: "Mg dose → C6"}
  - {id: e_ca_crown, from: ca_dome, to: ca_crown, class: main, label: "Ca vapor"}
  - {id: e_calc, from: ca_crown, to: calciothermic, class: main, label: "Ca dose → calciothermic"}

  # Oxygen paths (orange)
  - {id: e_o2_sky_c6, from: c6_magnesiothermic, to: sky, class: oxygen, label: "O₂ ↑ sky (part gettered)"}
  - {id: e_o2_sky_ca, from: calciothermic, to: sky, class: oxygen, label: "O₂ ↑ sky (part gettered)"}
  - {id: e_o2_lance_in, from: lox_cistern, to: early_bake_cleanup, class: oxygen, label: "O₂ lance input (next batch)"}

  # Reagent / oxide returns (dashed)
  - {id: e_nak_shuttle, from: alkali_cyclone, to: early_bake_cleanup, class: reagent_return, label: "Na/K shuttle ↺"}
  - {id: e_mgo_return, from: c6_magnesiothermic, to: early_bake_cleanup, class: reagent_return, label: "MgO → re-bake"}
  - {id: e_cao_return, from: calciothermic, to: early_bake_cleanup, class: reagent_return, label: "CaO → re-bake"}
  # v8: recovered Kr first-cut + warm N₂ recirculation back to Bernoulli sweep inlet
  - {id: e_buffer_recirc, from: lox_cistern, to: bernoulli_overhead, class: reagent_return, label: "buffer gas ↺ (Kr first-cut / N₂ warm)"}

legend:
  - {key: chip_reviewed, label: "Species chip — reviewed default home (solid)", style: chip_reviewed}
  - {key: chip_conditional, label: "Species chip — conditional host/mode gate (dashed)", style: chip_conditional}
  - {key: edge_main, label: "Main process / melt / product stream", style: edge_main}
  - {key: edge_oxygen, label: "Oxygen path", style: edge_oxygen}
  - {key: edge_reagent_return, label: "Reagent / oxide return", style: edge_reagent_return}

# Aggregate-membership mapping: species that intentionally bin into a group chip.
# Lint uses this so trace_elements.yaml members of an aggregate are not false orphans.
aggregates:
  - chip: salts
    members: [NaCl, KCl, NaF, KF, MgF2, CaF2, halide-salts]
    note: "Volatile halide salt cut at cryo"
  - chip: organics
    members: [CH4, organics, hydrocarbons, kerogen]
    note: "Organic / solar-wind carbonaceous volatiles (condensed fraction)"
  - chip: CO-CH4-organics
    members: [CO, CH4, COS, pyrolysis-gases]
    note: "v8 cryo conditional: carbon leaves as pyrolysis gases, not elemental C"
  - chip: CO2-CO
    members: [CO, CO2-noncond]
    note: "v8 gas-conditioning: refractory-char burnout non-condensables"
  - chip: P2-PO
    members: [P2, PO, P4]
    note: "v8 gas-conditioning: phosphate-reduction non-condensables"
  - chip: glass
    members: [SiO, SiO2, silica-glass]
    note: "SiO baffle major glass stream"
  - chip: REE
    members: [La, Ce, Pr, Nd, Sm, Gd, Tb, Dy, Ho, Er, Tm, Lu, REE]
    note: "REE group at calciothermic (Eu/Yb ride Ca crown)"
  - chip: unreduced-residuals
    members: [chromite, spinel, unreduced-residuals]
    note: "Inaccessible oxide / spinel residue in rump"
  # Residual calciothermic candidates kept at primary homes; membership documents
  # the residual-path semantics without a second chip.
  - chip: Nb
    members: [Nb]
    note: "C6 primary; calciothermic residual only if not earlier cut"
  - chip: Ta
    members: [Ta]
    note: "C6 primary; calciothermic residual only if not earlier cut"
  - chip: Sr
    members: [Sr]
    note: "Ca-crown primary; calciothermic flash residual path"
  - chip: Ba
    members: [Ba]
    note: "Ca-crown primary; calciothermic flash residual path"

notes:
  - "v7 REVIEWED SPECIES MAP is authoritative; v3–v6 species lists are design history."
  - "v8 delta: cryo carbon as CO-CH4-organics gases (not elemental C); gas conditioning sub-box; O2 pump→frost cistern; Kr-first/N2-warm buffer-gas recirculation."
  - "Each species symbol appears as exactly one chip (primary home). Dual-path conditionality is condition_note text."
  - "Impurity vectors on Mg crown / C6 are annotations, not second chips (avoids false double homes)."
  - "PFD mode (equipment tags, numbered streams, stream table) is a registered follow-up; edge id/stream_tag seams exist."
  - "External nodes 'feed' and 'sky' are layout anchors only (not blocks)."
