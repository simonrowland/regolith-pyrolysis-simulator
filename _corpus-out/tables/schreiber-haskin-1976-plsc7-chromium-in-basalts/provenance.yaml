quantity: percent total chromium as Cr(II), divided by 100 in the extract
method: Manual digitization of plotted measured markers on the Cr(II) traces in panels c and d; no points interpolated.
digitization_uncertainty: +/- 5 percentage points in Cr(II) and +/- 0.25 in -log10(PO2/atm), per marker.
composition_basis: FAS/FAD base recipe and nominal ~0.5 wt% Cr2O3 are printed with Figure 1 on p. 1224. The separate 0.1-0.8 wt% Cr2O3 range is reported for the analyses on p. 1228; no individual plotted marker is associated with a particular Cr loading.
pressure_frame: Figure 5 plots -log10(PO2/atm); the extract stores log10(fO2/atm) as its negative.
