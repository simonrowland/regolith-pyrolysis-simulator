exclusions:
  - source: kems-008 Schaefer-Fegley Table 10
    reason: kinetic vaporization coefficients, mostly survey solids; not basalt melt activities
  - source: SF04 workbook gas pressures and fluxes
    reason: model reproduction outputs, not independent empirical observations
  - source: Richter-2007 Table 1 areas
    reason: apparatus metadata, not a melt-model target
  - source: data/presets/kems/halwax_2024_*.yaml
    reason: pure-solid rate/geometry cases, not melt activities
  - source: FeS or unlike condensed reference states
    reason: dropped unless an exact like-for-like parent/reference conversion is available
